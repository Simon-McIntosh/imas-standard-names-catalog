    dd_path: pf_active/coil/element/area
    status: composed
- name: current_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: "Electrical circuit current carried by a poloidal-field coil conductor,\
    \ setting the coil\u2019s contribution to plasma shaping and vertical-position\
    \ control."
  documentation: 'The poloidal-field coil current is the net conduction current circulating
    around an axisymmetric coil circuit in the toroidal direction. It is the actuator
    quantity that produces external poloidal magnetic field used for plasma position
    control, shape control, and inductive flux swing. Through the coil geometry, it
    determines the [poloidal flux contribution from external coils] and contributes
    to mechanical loads such as [radial](name:radial_force_of_poloidal_field_coil)
    and [vertical](name:vertical_force_of_poloidal_field_coil) electromagnetic forces.


    For an axisymmetric conductor cross-section $S$, the circuit current can be written
    as the surface integral of toroidal current density:


    $$

    I_{\rm PF} = \int_S J_\phi\, dS

    $$


    where $I_{\rm PF}$ is the poloidal-field coil current, $J_\phi$ is the toroidal
    current density in A m$^{-2}$, and $dS$ is an element of conductor cross-sectional
    area in m$^2$. The relevant toroidal direction is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius, $\phi$ the toroidal
    angle, and $Z$ the vertical coordinate.


    The current is measured with calibrated power-supply readbacks, DC current transformers,
    Rogowski coils, or precision shunts, and is used in magnetic-equilibrium reconstruction
    together with coil geometry such as the [major radius](name:major_radius_of_poloidal_field_coil),
    [inner radius](name:inner_radius_of_poloidal_field_coil), and [outer radius](name:outer_radius_of_poloidal_field_coil)
    of the poloidal-field coil. Fusion devices commonly operate individual poloidal-field
    and central-solenoid circuits from about $10^3$ to $10^5$ A, with effective ampere-turns
    reaching mega-ampere-turn scale when multiple turns are present.


    Sign convention: Positive when the coil current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:radial_force_of_poloidal_field_coil
  - name:vertical_force_of_poloidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/current
    dd_path: pf_active/coil/current
    status: composed
- name: height_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Full vertical extent of a rectangular poloidal-field coil element cross-section,
    measured between its lower and upper edges.
  documentation: 'This quantity defines the vertical dimension of a rectangular conductor
    element used in a poloidal-field coil. Together with the [width of the poloidal-field
    coil](name:width_of_poloidal_field_coil), it specifies the rectangular cross-section
    whose product gives the [area of the poloidal-field coil](name:area_of_poloidal_field_coil).
    The element position is completed by the [major radius](name:major_radius_of_poloidal_field_coil)
    and [vertical coordinate](name:vertical_coordinate_of_poloidal_field_coil) of
    the coil element center.


    For an axisymmetric rectangular element in the right-handed cylindrical $(R, \phi,
    Z)$ frame, with $Z$ denoting vertical height, the signed full height may be written
    as


    $$

    h = Z_\mathrm{upper} - Z_\mathrm{lower}

    $$


    where $h$ is the coil-element height, and $Z_\mathrm{upper}$ and $Z_\mathrm{lower}$
    are the vertical coordinates of the upper and lower cross-section edges.


    The value is obtained from engineering design geometry, mechanical metrology,
    or survey reconstruction of the coil conductor envelope. Representative poloidal-field
    coil element heights range from a few centimeters for small correction coils to
    several tens of centimeters or more for large shaping and vertical-field coils.


    Sign convention: Positive when the upper edge of the rectangular coil element
    has a larger $Z$ coordinate than the lower edge in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  - name:vertical_coordinate_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/height
    dd_path: pf_active/coil/element/geometry/rectangle/height
    status: composed
- name: inner_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Distance from the center of an annular poloidal-field coil conductor
    cross-section to its inner boundary.
  documentation: 'The inner radius defines the hollow or non-conducting central boundary
    of an annular poloidal-field coil conductor cross-section. Together with the [outer
    radius](name:outer_radius_of_poloidal_field_coil), it fixes the conductor annulus
    used to compute [cross-sectional area](name:area_of_poloidal_field_coil), resistance,
    cooling-channel clearance, and electromagnetic loading.


    For an ideal annular cross-section, the inner radius $r_{\mathrm{in}}$ is the
    minimum distance from the annulus center $\mathbf{c}$ to the conducting material
    boundary in the cross-sectional plane:


    $$

    r_{\mathrm{in}} = \min_{\mathbf{x}\in\partial\Omega_{\mathrm{cond}}} \left|\mathbf{x}-\mathbf{c}\right|

    $$


    where $\mathbf{x}$ is a point on the inner conductor boundary and $\partial\Omega_{\mathrm{cond}}$
    is the boundary of the conducting region. The annular area follows from $A=\pi(r_{\mathrm{out}}^2-r_{\mathrm{in}}^2)$,
    linking this quantity to [area of the poloidal-field coil](name:area_of_poloidal_field_coil).


    The value is obtained from coil engineering geometry, conductor manufacturing
    drawings, or dimensional metrology of the winding pack or conductor element. It
    is used with [width](name:width_of_poloidal_field_coil), [height](name:height_of_poloidal_field_coil),
    and [length](name:length_of_poloidal_field_coil) when comparing annular and rectangular
    cross-section parameterizations.


    Representative inner radii range from millimeters for small hollow conductors
    to several tenths of a meter for large superconducting coil winding packs, depending
    on cooling-channel layout and structural support requirements.


    Sign convention: Positive when measured radially outward from the annulus center
    to the inner conductor boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/annulus/radius_inner
    dd_path: pf_active/coil/element/geometry/annulus/radius_inner
    status: composed
- name: length_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Side length of the oblique cross-section used to define the finite
    conductor geometry of a poloidal field coil element.
  documentation: 'This quantity gives the geometric side length of an oblique poloidal-field-coil
    cross-section, such as the slanted edge of a trapezoidal conductor element. It
    complements the orthogonal cross-section dimensions [height](name:height_of_poloidal_field_coil)
    and [width](name:width_of_poloidal_field_coil), and together these dimensions
    determine the conductor footprint used for magnetic-field and force calculations.


    For an axisymmetric cross-section described in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height, the oblique side length between two cross-section vertices
    can be written as


    $$

    L = \sqrt{(R_2 - R_1)^2 + (Z_2 - Z_1)^2}

    $$


    where $L$ is the side length and $(R_1,Z_1)$ and $(R_2,Z_2)$ are the endpoint
    coordinates in the poloidal cross-section plane.


    The value is obtained from engineering design geometry, metrology of as-built
    coil components, or geometric reconstruction of the coil cross-section used in
    electromagnetic analysis. It contributes to the [area](name:area_of_poloidal_field_coil)
    of the conductor cross-section and is analogous to the radial dimensions used
    for annular descriptions such as [inner radius](name:inner_radius_of_poloidal_field_coil)
    and [outer radius](name:outer_radius_of_poloidal_field_coil).


    Representative values range from about 0.05-1 m for small shaping or correction
    coils to 0.5-3 m for large poloidal-field or central-solenoid elements, depending
    on conductor pack size and insulation thickness.


    Sign convention: Positive when the directed oblique edge is followed in its declared
    local cross-section direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/oblique/length
    dd_path: pf_active/coil/element/geometry/oblique/length
    status: composed
- name: major_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Major-radius coordinate of the poloidal-field coil centerline in the
    right-handed cylindrical (R, phi, Z) frame, measured from the toroidal symmetry
    axis.
  documentation: 'The major radius of a poloidal field coil is the radial coordinate
    of the coil geometric center or centerline in the right-handed cylindrical $(R,
    \phi, Z)$ frame. It fixes the coil position relative to the toroidal symmetry
    axis and complements the vertical placement given by [vertical coordinate of a
    poloidal field coil](name:vertical_coordinate_of_poloidal_field_coil). For finite
    cross-sections, it is the central radial reference from which dimensions such
    as [width of a poloidal field coil](name:width_of_poloidal_field_coil), [height
    of a poloidal field coil](name:height_of_poloidal_field_coil), and [outer radius
    of a poloidal field coil](name:outer_radius_of_poloidal_field_coil) are defined.


    For an axisymmetric coil whose center has Cartesian coordinates $(x_c,y_c,z_c)$
    in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis with $\hat{z}$
    vertical, the corresponding major radius is


    $$

    R_c = \sqrt{x_c^2 + y_c^2}

    $$


    where $R_c$ is the coil center major radius and $x_c,y_c$ are the horizontal coordinates
    of the same point.


    This quantity is obtained from coil engineering geometry, metrology of the installed
    conductors, or reconstruction of the magnetic-field-system layout used for electromagnetic
    force and field calculations. It is closely related to the [radial outline of
    a poloidal field coil](name:radial_outline_of_poloidal_field_coil), which describes
    the radial boundary rather than the center reference.


    Representative values range from about 0.5-4 m in compact tokamaks and 2-12 m
    in large tokamak poloidal-field systems, depending on whether the coil is inboard,
    outboard, upper, or lower relative to the plasma.


    Sign convention: Positive when measured outward from the toroidal symmetry axis
    along $+\hat{R}$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_coordinate_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:radial_outline_of_poloidal_field_coil
