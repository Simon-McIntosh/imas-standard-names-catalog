- name: toroidal_component_of_trapped_particle_torque_density
  kind: scalar
  status: draft
  description: Toroidal component of the net torque density exerted on the trapped
    particle population, equal to the local source rate of toroidal angular momentum
    per unit volume due to all forces acting on banana-orbit-confined particles.
  documentation: 'The toroidal component of the trapped particle torque density, $\tau_{\mathrm{trap},\phi}$,
    is the net rate of toroidal angular momentum deposition per unit volume into particles
    confined to banana orbits in a magnetized plasma. It enters the toroidal angular
    momentum balance as


    $$\frac{\partial \ell_\phi}{\partial t} + \nabla \cdot \boldsymbol{\Pi}_\phi =
    \tau_{\mathrm{trap},\phi} + \ldots$$


    where $\ell_\phi = m_s n_s R v_{\phi,s}$ is the toroidal angular momentum density
    of species $s$, $R$ is the major radius (distance from the machine symmetry axis
    in the right-handed cylindrical $(R, \phi, Z)$ frame), $v_{\phi,s}$ is the mean
    toroidal velocity, and $\boldsymbol{\Pi}_\phi$ is the toroidal stress tensor.
    The quantity $\tau_{\mathrm{trap},\phi}$ has SI units of N m$^{-2}$ (equivalently
    kg m$^{-2}$ s$^{-2}$).


    This quantity is the flux-surface-local (not flux-surface-averaged) toroidal torque
    density. Contributions arise from collisional friction between trapped and passing
    populations, RF-wave momentum transfer, neoclassical effects such as the bootstrap
    current reaction force, and energetic-particle sources or sinks.


    Sign convention: Positive when the net torque acts to accelerate trapped particles
    in the direction of increasing toroidal angle $\phi$ (i.e., counter-clockwise
    when viewed from above along $+\hat{Z}$).


    Typical magnitudes in a tokamak discharge range from $10^{-3}$ to $10^{1}$ N m$^{-2}$
    depending on plasma density, temperature, and heating power. The trapped fraction
    $f_\mathrm{trap} \approx \sqrt{2\epsilon}/(1+\sqrt{2\epsilon})$, where $\epsilon
    = r/R_0$ is the local inverse aspect ratio, determines what fraction of the total
    particle torque density is attributed to this population.'
  unit: N.m^-2
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_co_passing_particle_torque_density
  - name:toroidal_component_of_counter_passing_particle_torque_density
  - name:toroidal_component_of_torque_density_due_to_radial_current
  - name:toroidal_component_of_thermal_particle_torque_density_due_to_thermalization
  constraints: []
  arguments:
  - name: trapped_particle_torque_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/source/momentum_tor
    dd_path: distributions/distribution/profiles_1d/trapped/source/momentum_tor
    status: composed
- name: toroidal_mode_number
  kind: scalar
  status: draft
  description: Integer toroidal Fourier mode number $n$ indexing the harmonic decomposition
    of perturbation fields along particle orbits, where quantities vary as $\exp(i
    n \phi)$ with $\phi$ the toroidal angle.
  documentation: "The toroidal mode number $n$ is the integer exponent in the Fourier\
    \ decomposition $\\exp(i n \\phi)$, where $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above $+\\hat{Z}$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. It labels the periodicity of a perturbation field \u2014\
    \ MHD modes, wave fields, or orbit-averaged quantities \u2014 in the toroidal\
    \ direction, with $n = 0$ corresponding to the axisymmetric component and $|n|\
    \ \\geq 1$ to non-axisymmetric perturbations. In fast-particle physics, $n$ indexes\
    \ the harmonic content of fields sampled along guiding-center or full-orbit trajectories;\
    \ resonance conditions such as $n \\Omega_{\\phi} - m \\Omega_{\\theta} = \\omega$\
    \ (where $\\Omega_{\\phi}$ and $\\Omega_{\\theta}$ are the particle toroidal and\
    \ poloidal transit frequencies and $\\omega$ is the wave frequency) determine\
    \ wave\u2013particle energy exchange. Typical values range from $n = 0$ (axisymmetric\
    \ equilibrium) through $n \\sim 1$\u2013$10$ for global Alfven eigenmodes and\
    \ neoclassical tearing modes, to $n \\sim 10$\u2013$50$ for kinetic ballooning\
    \ or micro-instability regimes. The toroidal mode number is the component of the\
    \ general [mode_number](name:mode_number) resolved in the toroidal direction;\
    \ quantities resolved per this index appear in names such as [wave_driven_current_inside_flux_surface_per_toroidal_mode](name:wave_driven_current_inside_flux_surface_per_toroidal_mode)\
    \ and [per_toroidal_mode_of_wave_driven_current_inside_flux_surface](name:per_toroidal_mode_of_wave_driven_current_inside_flux_surface).\n\
    \nSign convention: Positive when $n$ counts mode periodicity in the direction\
    \ of increasing toroidal angle $\\phi$ (counter-clockwise when viewed from above\
    \ $+\\hat{Z}$)."
  unit: '1'
  physics_domain: fast_particles
  links:
  - name:mode_number
  - name:wave_driven_current_inside_flux_surface_per_toroidal_mode
  - name:per_toroidal_mode_of_wave_driven_current_inside_flux_surface
  constraints: []
  arguments:
  - name: mode_number
    operator: coordinate
    operator_kind: coordinate
    axis: toroidal
    shape: coordinate
  sources:
  - id: dd:distributions/distribution/markers/orbit_integrals/n_tor
    dd_path: distributions/distribution/markers/orbit_integrals/n_tor
    status: composed
