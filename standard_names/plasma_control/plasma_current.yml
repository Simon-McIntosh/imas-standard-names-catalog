name: plasma_current
status: draft
cocos_transformation_type: one_like
description: Net toroidal current flowing through the plasma cross-section, a primary
  macroscopic equilibrium parameter.
documentation: "The plasma current $I_p$ is the integral of the toroidal current density\
  \ $j_\\phi$ over the poloidal cross-section: $I_p = \\int j_\\phi \\, dA$, where\
  \ $dA$ is the area element in the poloidal plane. It is the dominant source of the\
  \ poloidal magnetic field that confines the plasma and directly enters the Grad\u2013\
  Shafranov equilibrium. Positive $I_p$ corresponds to current flowing in the $+\\\
  phi$ (counter-clockwise viewed from above) direction under COCOS-11. In present-day\
  \ tokamaks $I_p$ typically ranges from 0.5 to 5 MA, while ITER targets 15 MA in\
  \ baseline scenarios. $I_p$ is measured by Rogowski coils and diamagnetic loops\
  \ and reconstructed by equilibrium codes (EFIT, LIUQE). The safety factor scales\
  \ inversely with $I_p$ at fixed field, linking current magnitude to MHD stability\
  \ limits."
