- name: toroidal_current_density_due_to_parallel_viscosity
  kind: scalar
  status: active
  description: "Toroidal current density due to parallel viscosity is the component\
    \ along increasing toroidal angle in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame of the current-density contribution generated by parallel viscous stress."
  documentation: 'Toroidal current density due to parallel viscosity is the component
    along the toroidal basis direction of the electric current-density contribution
    generated by parallel viscous stress in a magnetized plasma. The projection is
    taken along increasing toroidal angle in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The toroidal component of the full [parallel-viscous current-density contribution](name:current_density_due_to_parallel_viscosity)
    is defined by


    $$

    J_{\Pi_\parallel,\phi}=\mathbf{J}_{\Pi_\parallel}\cdot\hat{\phi}=\frac{\left(\nabla\cdot\boldsymbol{\Pi}_\parallel\right)\times\mathbf{B}}{B^2}\cdot\hat{\phi}

    $$


    where $\mathbf{J}_{\Pi_\parallel}$ is the full current-density vector, $\boldsymbol{\Pi}_\parallel$
    is the parallel viscous stress tensor, $\mathbf{B}$ is the magnetic-field vector,
    $B$ is its magnitude, and $\hat{\phi}$ is the toroidal unit vector. Parallel refers
    to the stress-tensor contribution aligned with the magnetic field, not necessarily
    to the direction of the resulting current.


    This quantity excludes the [toroidal current density due to perpendicular viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity)
    and the [toroidal current density due to heat viscosity](name:toroidal_current_density_due_to_heat_viscosity).


    Sign convention: Positive when $J_{\Pi_\parallel,\phi}$ points in the direction
    of increasing toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_parallel_viscosity
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_parallel_viscosity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - dd_path: edge_profiles/ggd/j_parallel_viscosity/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_profiles.html#edge_profiles-ggd-j_parallel_viscosity-phi
    dd_documentation:
      leaf: Toroidal component, one scalar value is provided per element in the grid
        subset.
      parent_path: edge_profiles/ggd/j_parallel_viscosity
      parent: Current density due to the parallel viscosity, given on various grid
        subsets
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - 1...N
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of j parallel viscosity."
      kind: template
