name: volume_averaged_beryllium_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Beryllium ion number density (summed over all charge states) averaged
  over the total plasma volume.
documentation: "The volume-averaged beryllium ion number density $\\langle n_{\\rm\
  \ Be}^{\\rm ion} \\rangle_V = V_p^{-1}\\int n_{\\rm Be}^{\\rm ion}\\,dV$ quantifies\
  \ the global beryllium impurity content inside the confined plasma, summing over\
  \ all ionization stages ($\\mathrm{Be}^{1+}$ through $\\mathrm{Be}^{4+}$). Beryllium\
  \ enters the plasma predominantly through physical and chemical sputtering of first-wall\
  \ components, particularly in machines with Be plasma-facing surfaces (e.g., JET-ILW,\
  \ ITER). Typical volume-averaged concentrations are $10^{16}$\u2013$10^{18}\\;\\\
  mathrm{m^{-3}}$, corresponding to $c_{\\rm Be} = n_{\\rm Be}/n_e \\sim 0.5$\u2013\
  $3\\%$. Because fully stripped $\\mathrm{Be}^{4+}$ has $Z=4$, even moderate concentrations\
  \ affect $Z_{\\rm eff}$ and core radiation losses. Beryllium density is inferred\
  \ from charge-exchange recombination spectroscopy or from modeling impurity transport\
  \ codes constrained by VUV spectroscopy. See `volume_averaged_electron_density`\
  \ for the reference electron density and `volume_averaged_argon_ion_number_density`\
  \ for another common impurity species."
validity_domain: ''
