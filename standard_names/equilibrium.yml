- name: lower_triangularity_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless lower triangularity shape parameter for a nested magnetic
    flux surface, given by the normalized inward radial displacement of its lower
    vertical extremum.
  documentation: 'Lower triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the lower vertical extremum of a nested magnetic flux
    surface. It is the normalized inward displacement in major radius $R$ of that
    lower extremum relative to the magnetic-axis reference.


    For the lower vertical extremum, the defining relation is:


    $$

    \delta_{\mathrm{lower}} = \frac{R_{\mathrm{axis}} - R_{\mathrm{lower}}}{a}

    $$


    where $\delta_{\mathrm{lower}}$ is lower triangularity, $R_{\mathrm{axis}}$ is
    the major-radius coordinate of the magnetic axis, $R_{\mathrm{lower}}$ is the
    major-radius coordinate of the lower vertical extremum, and $a$ is the minor radius
    of the same flux surface. These coordinates are defined in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius measured from the machine symmetry
    axis, $\phi$ is toroidal angle, and $Z$ is vertical height.


    This quantity applies independently to each nested magnetic flux surface and is
    a geometrical property of the surface rather than a plasma-population quantity.
    It resolves the lower vertical extremum only; it is not averaged over flux surfaces
    or combined with the upper extremum. It is distinct from [lower triangularity
    of a flux surface boundary](name:lower_triangularity_of_plasma_boundary), which
    describes the outer plasma boundary rather than an arbitrary nested surface.


    It is the lower-extremum branch of [triangularity of a flux surface](name:triangularity_of_flux_surface),
    whose parent quantity permits the relevant upper or lower vertical extremum. The
    corresponding [upper triangularity of a flux surface](name:upper_triangularity_of_flux_surface)
    uses the upper vertical extremum, while [elongation of a flux surface](name:elongation_of_flux_surface)
    describes vertical-to-horizontal shaping rather than triangular displacement.


    Sign convention: Positive when the lower vertical extremum lies at smaller major
    radius $R$ than the magnetic-axis reference, corresponding to an inward displacement.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_triangularity_of_plasma_boundary
  - name:upper_triangularity_of_flux_surface
  - name:elongation_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/triangularity_lower
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-triangularity_lower
    dd_documentation:
      leaf: Lower triangularity w.r.t. magnetic axis
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Lower triangularity (\u03B4_lower) of nested flux surfaces as\
        \ a function of the poloidal flux coordinate in the MHD equilibrium. Characterizes\
        \ asymmetric shaping of the lower plasma cross-section, influencing MHD stability\
        \ and confinement."
      kind: llm
- name: magnetic_shear_at_flux_surface
  kind: scalar
  status: active
  description: Dimensionless logarithmic radial gradient of the safety factor on a
    magnetic flux surface, measuring how magnetic-field-line pitch changes across
    neighboring surfaces.
  documentation: 'Magnetic shear at a magnetic flux surface is the local logarithmic
    radial variation of the safety factor, expressing the change in magnetic-field-line
    pitch between neighboring nested surfaces.


    It is defined by


    $$

    s(\rho_\mathrm{tor}) = \frac{\rho_\mathrm{tor}}{q(\rho_\mathrm{tor})}\frac{dq(\rho_\mathrm{tor})}{d\rho_\mathrm{tor}}

    $$


    where $s$ is magnetic shear, $\rho_\mathrm{tor}$ is the toroidal-flux radial coordinate
    labeling the magnetic flux surface, and $q$ is the safety factor on that surface.


    The quantity applies to the equilibrium magnetic geometry of the specified magnetic
    flux surface without restricting the surface to a particular plasma region, species,
    or particle population. It is a local value associated with one surface, not a
    sum, volume integral, or average over multiple surfaces.


    It is distinct from the corresponding values at special loci such as the [magnetic
    axis](name:magnetic_shear_at_magnetic_axis), [plasma boundary](name:magnetic_shear_at_plasma_boundary),
    or [internal transport barrier](name:magnetic_shear_at_internal_transport_barrier).
    The expression relates magnetic shear directly to the logarithmic derivative of
    the safety factor with respect to the toroidal-flux radial coordinate.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: core_profiles/profiles_1d/magnetic_shear
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-magnetic_shear
    dd_documentation:
