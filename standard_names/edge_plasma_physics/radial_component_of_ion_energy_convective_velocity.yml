name: radial_component_of_ion_energy_convective_velocity
description: Radial projection of the convective velocity entering the ion energy
  transport equation in edge transport models.
documentation: "The radial ion energy convective velocity $v_{r,i}^{E,\\mathrm{conv}}$\
  \ (unit $\\mathrm{m\\,s^{-1}}$) appears in the ion energy flux decomposition $q_{r,i}\
  \ = -\\chi_{r,i} n_i \\nabla_r T_i + \\tfrac{3}{2} n_i T_i v_{r,i}^{E,\\mathrm{conv}}$,\
  \ where $\\chi_{r,i}$ is the ion thermal diffusivity, $T_i$ the ion temperature,\
  \ and $n_i$ the ion number density. It accounts for the net convective (pinch) contribution\
  \ to ion thermal energy transport in the radial direction; positive values indicate\
  \ outward energy convection. In codes such as SOLPS-ITER or SOLEDGE3X, this velocity\
  \ is defined per charge state on a generalized grid description (GGD) and typically\
  \ spans $1$\u2013$100\\;\\mathrm{m\\,s^{-1}}$ in the scrape-off layer. It is distinct\
  \ from the ion particle convective velocity because the energy channel may include\
  \ additional thermoelectric and equipartition contributions. See also `radial_component_of_ion_particle_convective_velocity`\
  \ for the particle-channel analog."
kind: vector_component
unit: m.s^-1
