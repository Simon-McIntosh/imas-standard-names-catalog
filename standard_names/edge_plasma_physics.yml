- name: density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of a specified plasma species at the plasma boundary,
    the last closed flux surface geometrically separating the magnetically confined
    plasma from the open-field-line scrape-off layer.
  documentation: "The plasma boundary density is the particle number density of a\
    \ specified species \u2014 electrons, main ions, or impurity ions \u2014 evaluated\
    \ at the last closed flux surface (LCFS), which separates the magnetically confined\
    \ region from the open-field-line scrape-off layer. This boundary value anchors\
    \ radial transport equations and couples confined-plasma models to scrape-off-layer\
    \ physics.\n\nThe number density $n_s$ of species $s$ enters the continuity equation\n\
    \n$$\n\\frac{\\partial n_s}{\\partial t} = -\\nabla \\cdot \\Gamma_s + S_s\n$$\n\
    \nwhere $\\Gamma_s$ is the particle flux of species $s$ and $S_s$ is the net particle\
    \ source from ionization, recombination, and charge exchange. Evaluating $n_s$\
    \ at the separatrix provides the boundary condition shared by both transport domains.\n\
    \nSpecies-specific instances include [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)\
    \ for the electron population and krypton_density_at_plasma_boundary for an injected\
    \ radiative impurity; see also [deuterium_tritium_density_at_plasma_boundary](name:deuterium_tritium_density_at_plasma_boundary)\
    \ for the fuel pseudo-species. Boundary densities are inferred from edge Thomson\
    \ scattering, microwave reflectometry, or Langmuir probes near the separatrix,\
    \ and are also extracted from equilibrium-constrained edge transport reconstructions.\n\
    \nTypical separatrix electron densities in H-mode tokamaks lie in the range $0.5$\u2013\
    $5 \\times 10^{19}$ m$^{-3}$; impurity species are several orders of magnitude\
    \ lower depending on seeding rate and wall material.\n\nSign convention: Positive\
    \ when particles of the specified species are present at the plasma boundary."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
  - name:deuterium_tritium_density_at_plasma_boundary
- name: argon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Boundary-averaged number density of argon ions on the plasma boundary,
    represented by the last closed flux surface separating the magnetically confined
    plasma from the open-field-line scrape-off layer. Unless a charge state is specified
    separately, argon ions refers to all ionization stages combined.
  documentation: 'Argon density at the plasma boundary is the surface-averaged number
    density of argon ions on the last closed flux surface, also called the separatrix.
    It provides a boundary-representative measure of argon impurity content, distinct
    from local poloidal or toroidal variations, and is the argon analog of other impurity
    boundary densities such as [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary).


    The boundary average over the separatrix surface is defined by


    $$

    n_{\mathrm{Ar},b} = \left\langle n_{\mathrm{Ar}} \right\rangle_{S_\mathrm{sep}}
    = \frac{\int_{S_\mathrm{sep}} n_{\mathrm{Ar}}(\mathbf{x})\, dA}{\int_{S_\mathrm{sep}}
    dA}

    $$


    where $S_\mathrm{sep}$ is the last closed flux surface, $n_{\mathrm{Ar}}(\mathbf{x})$
    is the local total argon ion number density, and $dA$ is the surface area element.
    Unless an individual charge state is explicitly specified, $n_{\mathrm{Ar}}$ denotes
    the sum over all argon ionization stages.


    In experiments, this quantity is inferred from argon line emission using spectroscopic
    measurements together with electron density, electron temperature, and collisional-radiative
    or impurity transport modeling. In simulations and equilibrium-edge coupling,
    it is often computed by averaging the modeled argon density over the separatrix,
    without assuming that the impurity density is constant on that surface.


    Typical values are about $10^{14}-10^{16}$ m^-3 for trace argon concentrations
    and about $10^{16}-10^{18}$ m^-3 during deliberate radiative seeding, depending
    on gas injection rate, edge temperature, ionization balance, transport, and plasma
    size. These values are usually small compared with the total electron or main-ion
    density at the boundary, but can strongly affect edge radiation because argon
    is a high-Z impurity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: argon
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/argon/value
    dd_path: summary/local/separatrix_average/n_i/argon/value
    status: composed
- name: beryllium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of beryllium ions at the plasma boundary (last closed
    flux surface), summed over all ionization stages unless a specific charge state
    is specified.
  documentation: 'The beryllium ion number density at the plasma boundary is the total
    count of beryllium ions per unit volume evaluated at the separatrix, the last
    closed flux surface separating the magnetically confined core plasma from the
    open-field-line scrape-off layer. Beryllium (atomic number $Z = 4$, mass number
    $A = 9$) is a low-Z metallic impurity that enters the plasma primarily through
    physical sputtering of beryllium plasma-facing components. Unless a charge-state-resolved
    quantity is specified, contributions from all ionization stages $\text{Be}^{z+}$
    ($z = 0, 1, 2, 3, 4$) are included.


    The total density at the separatrix is:


    $$

    n_\text{Be}(r_\text{sep}) = \sum_{z=0}^{4} n_{\text{Be}^{z+}}

    $$


    where $n_{\text{Be}^{z+}}$ is the partial density of beryllium ions in the $z$-fold
    ionized state and $r_\text{sep}$ denotes the separatrix location.


    This quantity is inferred from UV and visible spectroscopy of beryllium emission
    lines, complemented by impurity transport modeling constrained by local electron
    density and temperature profiles. It forms the outer radial boundary condition
    for impurity core profiles, linking the central [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    to the downstream [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target).
    The pedestal-resolved counterpart [beryllium_density_at_pedestal](name:beryllium_density_at_pedestal_top)
    characterizes the steep-gradient region just inside the separatrix, while the
    species-agnostic parent [density_at_plasma_boundary](name:density_at_plasma_boundary)
    provides the general definition applicable to any plasma constituent.


    Sign convention: Positive when beryllium ions are present at the plasma boundary;
    number density is intrinsically non-negative as a particle count per unit volume.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:beryllium_density_at_magnetic_axis
  - name:beryllium_density_at_divertor_target
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: beryllium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/beryllium/value
    dd_path: summary/local/separatrix_average/n_i/beryllium/value
    status: composed
- name: boron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of boron ions at the last closed flux surface, which
    separates the magnetically confined plasma from the open-field-line scrape-off
    layer.
  documentation: 'Boron (atomic number $Z_B = 5$) is a low-Z impurity introduced into
    tokamaks through boronization to suppress high-Z metallic impurity influx and
    limit radiative losses from the confined plasma. The boron ion number density
    at the plasma boundary is the local concentration of boron ions evaluated at the
    last closed flux surface, the topological boundary separating closed-field-line
    confinement from the open-field-line scrape-off layer. It is the boron-specific
    realization of [density_at_plasma_boundary](name:density_at_plasma_boundary).


    The boron ion number density $n_B$ is the zeroth velocity moment of the boron
    ion phase-space distribution function $f_B$:


    $$

    n_B = \int f_B(\mathbf{x}, \mathbf{v}) \, d^3v

    $$


    evaluated at $\mathbf{x}$ on the separatrix, where $\mathbf{v}$ is the particle
    velocity. Without accompanying charge-state information, $n_B$ represents the
    total boron ion density summed over all ionization stages.


    Boron concentration at the separatrix is inferred from vacuum-ultraviolet spectroscopy
    of boron line emission combined with impurity transport modeling, or from charge-exchange
    recombination spectroscopy when a neutral beam is available. This quantity determines
    boron''s contribution to the local [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary).
    Analogous boundary densities for other seeded impurities are provided by [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary);
    boron_density_at_divertor_target gives the companion value further downstream
    at the divertor plate.


    Typical values at the separatrix in boronized tokamaks range from $10^{16}$ to
    $10^{17}$ m$^{-3}$, decreasing between boronization events as the wall coating
    erodes.


    Sign convention: Positive when boron ions are present at the plasma boundary.'
  unit: m^-3
  physics_domain: edge_plasma_physics
