- name: poloidal_electron_diffusivity
  kind: scalar
  status: active
  description: Directional electron particle diffusion coefficient linking the poloidal
    diffusive electron flux to the electron density gradient in a magnetized plasma.
  documentation: 'Poloidal electron diffusivity is an effective scalar transport coefficient
    for diffusive electron-particle transport along the poloidal direction of flux
    coordinates $(\rho,\theta,\phi)$.


    The constitutive relation is


    $$

    \Gamma_{e,\theta}^{\mathrm{diff}} = -D_{e,\theta}\,\nabla_\theta n_e

    $$


    where $\Gamma_{e,\theta}^{\mathrm{diff}}$ is the poloidal component of the diffusive
    electron particle-flux vector, $D_{e,\theta}$ is the poloidal electron diffusivity,
    $\nabla_\theta n_e$ is the metric-scaled electron-density gradient along increasing
    poloidal angle $\theta$, and $n_e$ is electron number density. The associated
    flux component is positive toward increasing $\theta$.


    This is the poloidal projection of the anisotropic transport represented by [electron
    diffusivity](name:electron_diffusivity). It describes diffusive transport only
    and excludes convective fluxes, particle sources, and sinks; [poloidal particle
    diffusivity](name:poloidal_particle_diffusivity) is the corresponding species-independent
    quantity.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_diffusivity
