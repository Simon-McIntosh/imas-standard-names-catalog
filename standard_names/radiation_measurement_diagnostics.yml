- name: first_local_tangential_coordinate_of_filter_window
  kind: scalar
  status: active
  description: "Signed position of a filter-window outline point along the first local\
    \ tangential in-plane basis direction in the object-local frame (e1, e2, e3),\
    \ chosen as the more-horizontal tangent oriented toward increasing toroidal angle\
    \ \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Signed position of a filter-window outline point along the first
    local tangential in-plane basis direction is the scalar coordinate of the point
    in the filter-window object-local planar frame. The object-local frame is the
    orthonormal triad $(\hat{e}_1,\hat{e}_2,\hat{e}_3)$, with $\hat{e}_1$ the window-plane
    tangent having the larger projection onto the local horizontal plane spanned by
    $\hat{R}$ and $\hat{\phi}$ and oriented toward increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.


    The coordinate is defined by the projection of the outline-point displacement
    onto the first local tangent:


    $$

    \xi_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{e}_1

    $$


    where $\xi_1$ is the first local tangential coordinate of the filter-window outline
    point, $\mathbf{r}$ is the outline-point position, $\mathbf{r}_0$ is the filter-window
    local origin, and $\hat{e}_1$ is the first local tangential unit vector.


    The object-local triad $(\hat{e}_1,\hat{e}_2,\hat{e}_3)$ is right-handed: $\hat{e}_3$
    is the filter-window normal directed toward the plasma-facing side, and $\hat{e}_2
    = \hat{e}_3 \times \hat{e}_1$ is the second local tangential direction. This quantity
    excludes the coordinate along $\hat{e}_2$, which is the [second local tangential
    coordinate of a filter-window outline point](name:second_local_tangential_coordinate_of_filter_window).


    Sign convention: Positive when the outline point lies on the side of the filter-window
    local origin reached by moving along the more-horizontal in-plane tangent toward
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_local_tangential_coordinate_of_filter_window
  sources:
  - dd_path: camera_x_rays/filter_window/outline/x1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-filter_window-outline-x1
