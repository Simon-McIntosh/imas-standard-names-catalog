- name: toroidal_lithium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal rotation velocity of the lithium impurity ion population at
    the top of the edge pedestal region.
  documentation: "The toroidal velocity of lithium ions $v_{{\\rm Li},\\phi}$ quantifies\
    \ the bulk toroidal rotation of the lithium impurity at the pedestal top, where\
    \ the plasma density and temperature gradients steepen. This rotation is driven\
    \ primarily by intrinsic plasma torques and neutral beam injection, and is coupled\
    \ to the main ion rotation through collisional friction. The lithium velocity\
    \ is typically 10\u2013100 km/s in the co-current direction for H-mode pedestals,\
    \ and is measurable via charge exchange recombination spectroscopy (CXRS) from\
    \ the Li III line. The pedestal-top rotation velocity sets the boundary condition\
    \ for the core rotation profile and influences the $E\\times B$ shear that regulates\
    \ edge turbulent transport.\n\nSign convention: Positive when $v_{{\\rm Li},\\\
    phi}$ points in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ viewed from above).\n\nThe toroidal velocity is related to the radial electric\
    \ field through the force balance equation $E_r = v_\\phi B_\\theta - v_\\theta\
    \ B_\\phi - \\frac{1}{Zn_e}\\nabla p_i$, coupling to quantities such as [toroidal\
    \ lithium velocity at magnetic axis](name:toroidal_lithium_velocity_at_magnetic_axis)\
    \ and [toroidal lithium velocity at separatrix](name:toroidal_lithium_velocity_at_separatrix)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_lithium_velocity_at_magnetic_axis
  - name:toroidal_lithium_velocity_at_separatrix
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/lithium/value
    dd_path: summary/local/pedestal/velocity_phi/lithium/value
    status: composed
- name: toroidal_lithium_velocity_at_separatrix
  kind: scalar
  status: draft
  description: Toroidal (phi-directed) velocity of lithium ions at the separatrix,
    the outermost closed flux surface of the confined plasma.
  documentation: 'The toroidal velocity of the lithium ion population at the separatrix
    quantifies the rotation rate of this impurity species in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above). The separatrix
    is the last closed flux surface separating the confined plasma from the scrape-off
    layer. This velocity is typically measured by charge-exchange recombination spectroscopy
    (CXRS) using the Doppler shift of lithium emission lines. In tokamaks, lithium
    is often introduced as a wall-conditioning element or impurity, and its toroidal
    rotation can serve as a tracer for the bulk ion flow. The toroidal rotation velocity
    is a key input for understanding the radial electric field via the force balance
    equation $E_r = v_\phi B_\theta - v_\theta B_\phi$, where $B_\theta$ is the poloidal
    magnetic field and $B_\phi$ is the toroidal magnetic field. Typical separatrix
    toroidal velocities range from 0 to 50 km/s in L-mode plasmas, depending on the
    momentum input from neutral beams. Related quantities include the toroidal velocity
    of the fuel ions at the separatrix, available as [deuterium_tritium_velocity_at_separatrix](name:deuterium_tritium_velocity_at_separatrix),
    and the lithium density at the same location, [lithium_density_at_separatrix](name:lithium_density_at_separatrix).
    For lithium rotation at other radial positions, see [toroidal_lithium_velocity_at_pedestal](name:toroidal_lithium_velocity_at_pedestal)
    and [toroidal_lithium_velocity_at_magnetic_axis](name:toroidal_lithium_velocity_at_magnetic_axis).


    Sign convention: Positive when the lithium ions flow in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_tritium_velocity_at_separatrix
  - name:lithium_density_at_separatrix
  - name:toroidal_lithium_velocity_at_pedestal
  - name:toroidal_lithium_velocity_at_magnetic_axis
