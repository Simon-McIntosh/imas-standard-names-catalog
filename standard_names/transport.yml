- name: toroidal_fast_electron_torque_density_due_to_collisions
  kind: scalar
  status: draft
  description: Toroidal fast-electron torque density due to Coulomb collisions is
    the rate of toroidal angular-momentum transfer per unit volume to fast electrons
    from thermal electrons. It equals major radius times the phi-directed collisional
    force density in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal fast-electron torque density due to collisions is the local
    rate at which Coulomb collisions with thermal electrons transfer toroidal angular
    momentum to the fast-electron population per unit volume. The toroidal direction
    is defined in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$,
    and $Z$ is vertical height. This is an angular torque density, so it includes
    the major-radius lever arm multiplying the toroidal force density.


    For a kinetic fast-electron distribution, the quantity is the toroidal velocity
    moment of the collision operator multiplied by $R$:


    $$

    \tau^{\mathrm{coll}}_{\phi,\mathrm{fe}}(R,Z) = R \int m_e v_\phi\, C^{\mathrm{coll}}_{\mathrm{fe}\leftarrow
    e}[f_\mathrm{fe},f_e] \, d^3v

    $$


    where $\tau^{\mathrm{coll}}_{\phi,\mathrm{fe}}$ is in $\mathrm{N\,m^{-2}}$, $R$
    is in m, $m_e$ is the electron mass in kg, $v_\phi$ is the particle velocity component
    along $+\hat{\phi}$ in $\mathrm{m\,s^{-1}}$, and $C^{\mathrm{coll}}_{\mathrm{fe}\leftarrow
    e}$ is the Coulomb collision operator giving the rate of change of the fast-electron
    distribution $f_\mathrm{fe}$ due to thermal electrons with distribution $f_e$.
    The velocity integral gives the collisional toroidal force density on fast electrons
    in $\mathrm{N\,m^{-3}}$; multiplication by $R$ gives angular torque density.


    This quantity is usually computed from a kinetic or reduced fast-electron transport
    model by taking the toroidal moment of the electron-electron collision term, and
    may then be volume-integrated to obtain [toroidal_fast_electron_torque_due_to_collisions](name:toroidal_fast_electron_torque_due_to_collisions).
    Orbit-resolved contributions such as [toroidal_trapped_fast_electron_torque_density_due_to_collisions](name:toroidal_trapped_fast_electron_torque_density_due_to_collisions)
    and [toroidal_co_passing_fast_electron_torque_density_due_to_collisions](name:toroidal_co_passing_fast_electron_torque_density_due_to_collisions)
    separate the same collisional momentum exchange by fast-electron orbit class.
    It is distinct from a total fast-particle collisional torque density because only
    the fast-electron population and its collisions with thermal electrons are included.


    Typical signed magnitudes are strongly scenario dependent: values of $10^{-4}$-$10^{1}\
    \mathrm{N\,m^{-2}}$ are common in modeled fast-electron current-drive or weak
    runaway-electron conditions, while localized relaxation of dense fast-electron
    populations can reach $10^{2}\ \mathrm{N\,m^{-2}}$ or more.


    Sign convention: Positive when Coulomb collisions exert a toroidal force on the
    fast electrons in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_trapped_fast_electron_torque_density_due_to_collisions
