- name: normalized_debye_length
  kind: scalar
  status: draft
  description: Dimensionless electrostatic Debye shielding length, equal to the physical
    multi-species Debye length divided by the gyrokinetic reference length. Its square,
    not the length itself, is the coefficient that commonly multiplies Laplacian or
    perpendicular-wavenumber terms in normalized Poisson or quasi-neutrality equations.
  documentation: 'Normalized Debye length is the ratio of the electrostatic Debye
    shielding length of a plasma to the reference length used to nondimensionalize
    a gyrokinetic model. It measures how important finite charge-separation effects
    are relative to the modeled length scale; smaller values correspond to a more
    nearly quasi-neutral plasma response.


    For multiple charged species, the physical Debye length weights each species by
    density, charge, and temperature:


    $$

    \widehat{\lambda}_D = \frac{\lambda_D}{L_\mathrm{ref}}, \qquad

    \lambda_D = \left(\frac{\epsilon_0}{\sum_s n_s q_s^2 / T_s}\right)^{1/2}

    $$


    where $\widehat{\lambda}_D$ is the normalized Debye length, $\lambda_D$ is the
    physical Debye length in m, $L_\mathrm{ref}$ is the reference length in m, $\epsilon_0$
    is the vacuum permittivity in F m^-1, $n_s$ is the density of species $s$ in m^-3,
    $q_s$ is its charge in C, and $T_s$ is its thermal energy per particle in J. If
    species temperatures are represented in eV, use $T_s = e T_{s,\mathrm{eV}}$ in
    the formula, where $e$ is the elementary charge in C; colder or denser species
    contribute more strongly through the factor $n_s q_s^2/T_s$.


    This quantity is usually computed from reference densities, species temperatures,
    charges, and the chosen reference length rather than measured directly. In normalized
    electrostatic Poisson or gyrokinetic quasi-neutrality equations, finite-Debye-length
    corrections typically enter through $\widehat{\lambda}_D^2 \nabla_\perp^2 \varphi$
    or $\widehat{\lambda}_D^2 k_\perp^2 \varphi$, where $\varphi$ is the normalized
    electrostatic potential; the squared normalized length is the coefficient, while
    this quantity is the length ratio itself.


    Typical values in hot, dense magnetically confined fusion plasmas are small, often
    10^-4-10^-1 when normalized by a gyroradius-scale reference length and about 10^-6-10^-4
    when normalized by a macroscopic reference length. The corresponding squared coefficient
    is smaller by another power of the ratio, so finite Debye shielding is commonly
    a weak correction except in low-density, high-temperature, or deliberately non-neutral
    regimes.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_charge
  - name:normalized_particle_mass
  - name:normalized_temperature
  sources:
  - id: dd:gyrokinetics/species_all/debye_length_reference
    dd_path: gyrokinetics/species_all/debye_length_reference
    status: attached
  - id: dd:gyrokinetics_local/species_all/debye_length_norm
    dd_path: gyrokinetics_local/species_all/debye_length_norm
    status: composed
- name: normalized_gyrocenter_perturbed_density
  kind: scalar
  status: draft
  description: Normalized gyrocenter perturbed density is the dimensionless zeroth
    velocity-space moment of the perturbed gyrocenter distribution function for a
    species in a linear gyrokinetic eigenmode. It gives the unweighted gyrocenter
    density response before finite-Larmor-radius averaging.
  documentation: 'Normalized gyrocenter perturbed density is the complex, dimensionless
    density moment obtained from the perturbed gyrocenter distribution function of
    a species in a linear gyrokinetic eigenmode. It is the raw gyrocenter-density
    response: unlike [normalized_gyrocenter_gyroaveraged_density](name:normalized_gyroaveraged_gyrocenter_perturbed_density),
    it does not include a $J_0$ finite-Larmor-radius weighting inside the velocity-space
    integral.


    Using gyrocenter velocity coordinates $(v_\parallel,\mu)$ with $\mu = m_s v_\perp^2/(2B)$,
    a common physical normalization is:


    $$

    \widehat{n}_{gc,s} = \frac{1}{n_{0s}} \int_{-\infty}^{\infty} \int_{0}^{\infty}
    \delta f_{gc,s}(v_\parallel,\mu)\,\frac{2\pi B}{m_s}\,d\mu\,dv_\parallel

    $$


    where $\widehat{n}_{gc,s}$ is the normalized gyrocenter density moment, $n_{0s}$
    is the equilibrium or reference density in m$^{-3}$, $\delta f_{gc,s}$ is the
    complex perturbed gyrocenter distribution per unit ordinary velocity volume with
    SI units s$^3$ m$^{-6}$, $B$ is the local magnetic-field magnitude in T, $m_s$
    is the species mass in kg, $v_\parallel$ is parallel velocity in m s$^{-1}$, and
    $\mu$ is magnetic moment in J T$^{-1}$. The factor $2\pi B/m_s$ is the gyroangle-integrated
    velocity-space Jacobian for this definition of $\mu$.


    This quantity is computed from a linear gyrokinetic eigenfunction by integrating
    or quadrature-summing the perturbed gyrocenter distribution over velocity space
    for each species. It is not usually measured directly; diagnostics sensitive to
    density fluctuations observe particle-space or gyroaveraged responses, while this
    moment is primarily used to analyze the kinetic density response and its phase
    relative to other eigenmode fields.


    Because a linear eigenmode has arbitrary overall complex normalization and phase,
    there is no universal physical range for the absolute value of this quantity.
    Many calculations normalize an eigenfunction component or vector norm to order
    unity, so the meaningful information is in relative amplitudes, phases, species
    dependence, and variation along the magnetic field, not in an absolute signed
    magnitude.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_gyroaveraged_gyrocenter_perturbed_density
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/density
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/density
    status: composed
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/density
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/density
