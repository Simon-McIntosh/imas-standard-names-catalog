    \ this component fully specifies the direction of $\\hat{e}_1$ in three-dimensional\
    \ space; the three components must satisfy $\\hat{e}_{1,x}^2 + \\hat{e}_{1,y}^2\
    \ + \\hat{e}_{1,z}^2 = 1$. This scalar is used across a wide range of diagnostics\
    \ \u2014 bolometers, visible and X-ray cameras, charge-exchange spectroscopy apertures,\
    \ and reflectometer antennas \u2014 to record the spatial orientation of optical\
    \ or detector elements for geometric line-of-sight calculations. Values are bounded\
    \ to the interval $[-1, 1]$, with magnitude equal to 1 when $\\hat{e}_1$ is purely\
    \ vertical and 0 when it lies entirely in the horizontal plane. The analogous\
    \ component for the third unit vector is given by [z_component_of_third_unit_vector](name:z_component_of_third_unit_vector).\n\
