- name: ion_atomic_mass
  kind: scalar
  status: active
  description: Mass parameter assigned to a specified ion species, encoding its isotope
    and setting the inertial scale for collisional and transport calculations.
  documentation: 'Atomic mass is the intrinsic mass parameter assigned to one specified
    ion species. It identifies the ion''s isotope and provides the inertial scale
    used in collisional and transport physics.


    The mass is represented relative to the atomic mass unit by


    $$

    m_s = A_s m_u

    $$


    where $m_s$ is the atomic mass of the specified ion species, $A_s$ is its relative
    atomic mass, and $m_u$ is the atomic mass unit.


    The scope is one ion-species definition at a time. No aggregation over separate
    ion species, charge states, or plasma populations is implied, and the quantity
    does not represent a number density, mass density, or aggregate plasma mass. This
    ion-specific form specializes [atomic mass](name:atomic_mass) to ions, while [neutral
    species atomic mass](name:neutral_species_atomic_mass) applies the same mass concept
    to uncharged particle species.'
