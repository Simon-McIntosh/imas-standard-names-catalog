- name: spectral_width_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Spectral width of a spectrometer channel is the Gaussian standard deviation,
    expressed as a wavelength interval, of the channel response to monochromatic radiation.
    It describes instrumental broadening about the channel reference wavelength.
  documentation: 'Spectral width of a spectrometer channel is the wavelength standard
    deviation of a Gaussian component of the channel response to monochromatic radiation.
    It represents the instrumental contribution to line-shape broadening about the
    [reference wavelength](name:reference_wavelength_of_spectrometer_channel), separate
    from physical broadening in the emitting plasma. The valid physical domain is
    $\sigma_\lambda \ge 0$; $\sigma_\lambda = 0$ is the ideal limit of no spectral
    broadening by that component.


    For a Gaussian component $G(\lambda)$ centered at $\lambda_0$, the width is equivalently
    the square root of the second central moment:


    $$

    \sigma_\lambda^2 = \frac{\int (\lambda - \lambda_0)^2 G(\lambda)\, d\lambda}{\int
    G(\lambda)\, d\lambda}

    $$


    where $\lambda$ and $\lambda_0$ are wavelengths in meters, $\lambda_0$ is the
    channel reference wavelength, and $G(\lambda)$ is the Gaussian response component
    expressed with the same amplitude units as the corresponding spectral instrument
    function. The normalization of $G$ cancels in the ratio, so $\sigma_\lambda$ has
    units of meters; the Gaussian full width at half maximum is $2\sqrt{2\ln 2}\,\sigma_\lambda$.


    In practice, this width is estimated from calibration measurements with narrow
    spectral lines, from optical response modeling, or by fitting measured spectra
    while separating source broadening from instrumental broadening. Contributions
    can include crystal rocking curve, detector spatial resolution mapped into wavelength,
    aperture geometry, finite source extent, and alignment tolerances. Together with
    component amplitudes represented by the spectral_factor_of_spectrometer_channel
    and centers such as the reference wavelength, the widths define Gaussian terms
    that compose the spectral_instrument_function_of_spectrometer_channel or channel-level
    [instrument_function_of_spectrometer_channel](name:spectral_width_of_spectrometer_channel).


    Typical values range from $10^{-14}$-$10^{-12}$ m for high-resolution x-ray crystal
    spectrometer channels and $10^{-12}$-$10^{-10}$ m for lower-resolution optical
    or ultraviolet spectrometer channels. Values should be interpreted relative to
    the channel reference wavelength and the intrinsic source line width; instrumental
    widths comparable to or larger than the physical width dominate the measured broadening.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:reference_wavelength_of_spectrometer_channel
  sources:
  - id: dd:charge_exchange/channel/spectrum/instrument_function
    dd_path: charge_exchange/channel/spectrum/instrument_function
    status: composed
