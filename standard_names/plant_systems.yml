  documentation: 'The propane count quantifies a propane inventory associated with
    plasma operations as a dimensionless equivalent-electron count. Each neutral propane
    molecule carries 26 bound electrons, derived from its molecular composition: 3
    carbon atoms (atomic number $Z_C = 6$) and 8 hydrogen atoms (atomic number $Z_H
    = 1$), giving $3 \times 6 + 8 \times 1 = 26$ electrons per molecule.


    The equivalent-electron count $N_\mathrm{eq}$ is defined as:


    $$

    N_\mathrm{eq} = 26 \times N_{\mathrm{C_3H_8}}

    $$


    where $N_{\mathrm{C_3H_8}}$ is the number of propane molecules. This convention
    normalizes gas inventories across molecular species to a common electron-equivalent
    basis, facilitating comparisons of impurity and fuel contributions to the plasma
    electron budget.


    Propane injection amounts are inferred from calibrated gas valve records or pressure
    measurements in the injection line. Specializations include [accumulated_propane_count](name:accumulated_propane_count),
    the time-integrated post-breakdown inventory, and [propane_prefill_count](name:propane_prefill_count),
    restricted to the prefill phase. Analogous counts for other hydrocarbons follow
    the same convention: [ethane_count](name:ethane_count) assigns 18 electrons per
    C2H6 molecule and [accumulated_ethylene_count](name:accumulated_ethylene_count)
    assigns 16 electrons per C2H4 molecule.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_propane_count
  - name:propane_prefill_count
  - name:ethane_count
  - name:accumulated_ethylene_count
- name: accumulated_propane_count
  kind: scalar
  status: active
  description: Cumulative post-breakdown propane injection expressed as an equivalent-electron
    inventory, assigning 26 count units to each neutral C3H8 molecule.
  documentation: 'Accumulated propane count is the equivalent-electron inventory added
    by neutral propane gas injection after plasma breakdown. It is the post-breakdown
    component of the broader [propane count](name:propane_count).


    The defining accumulation is


    $$

    N_{\mathrm{acc}}(t)=26\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{C_3H_8}}(t'')\,dt''

    $$


    where $N_{\mathrm{acc}}$ is the accumulated equivalent-electron count, $t_{\mathrm{bd}}$
    is the plasma-breakdown time, $t$ is the evaluation time, and $\dot{N}_{\mathrm{C_3H_8}}$
    is the neutral propane molecular injection rate in molecules per second. The factor
    26 is the total bound-electron count per molecule, $3\times 6+8\times 1$, using
    the atomic numbers of carbon and hydrogen.


    The accumulation starts at plasma breakdown and excludes prefill injection represented
    by [propane prefill count](name:propane_prefill_count). It is cumulative and distinct
    from the instantaneous [propane source rate](name:propane_source_rate).'
  unit: '1'
  physics_domain: plant_systems
  links:
