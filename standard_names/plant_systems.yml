- name: density_of_pellet
  kind: scalar
  status: draft
  description: Number density of atoms of a specified species in the condensed pellet
    material. For layered, mixed, or fragmented pellets, it denotes the species atom
    count per material volume for the relevant material region or its volume average,
    not the density of gas molecules.
  documentation: 'Density of pellet is the number of atoms, or nuclei, of a specified
    chemical species per unit volume of condensed pellet material. For molecular pellet
    materials such as $\mathrm{D}_2$, this is an atom-count density: the deuterium
    density counts deuterium atoms, not $\mathrm{D}_2$ molecules. In layered, mixed,
    or fragmented material it may represent the local species density in a material
    region or a volume-averaged species density over the selected condensed-material
    volume.


    For a uniform material, or for a volume average over a specified condensed-material
    volume, the relation to the species atom inventory is


    $$

    n_a = \frac{N_a}{V}

    $$


    where $n_a$ is the species atom density, $N_a$ is the number of atoms of species
    $a$ as a dimensionless count, and $V$ is the condensed-material volume in $\mathrm{m^3}$.
    If inferred from mass density, the relation $n_a = \rho_{m,a} N_A / M_a$ uses
    the species partial mass density $\rho_{m,a}$, or the total mass density only
    for a pure species, with molar mass $M_a$ and Avogadro constant $N_A$.


    In practice this quantity is obtained from pellet composition, mass, dimensions,
    phase, and material equation-of-state data, or from imaging and reconstruction
    of the occupied condensed volume after layering or fragmentation. For fragmented
    pellets, the relevant volume is the material volume of the fragments; voids between
    separated pieces are not included unless an envelope-averaged density is explicitly
    intended.


    Typical atom-count densities for cryogenic hydrogen-isotope, noble-gas, or impurity
    pellets are about $10^{28}$-$10^{29}\ \mathrm{m^{-3}}$. Partial species densities
    in mixtures or porous material are reduced according to stoichiometry, composition
    fraction, and porosity.'
  unit: m^-3
  physics_domain: plant_systems
  links:
  - name:core_density_of_pellet
  - name:core_atomic_number_density_of_pellet
  - name:core_atomic_count_of_pellet
  - name:normalized_atomic_count_of_pellet
- name: core_density_of_pellet
  kind: scalar
  status: draft
  description: Number density of a constituent atomic species in the inner core layer
    of a pellet used by a shattered-pellet injector.
  documentation: 'Core density of pellet is the number density of a specified atomic
    species within the pellet''s inner core layer. It represents how many atoms of
    that species are present per unit volume of the core material and is non-negative
    by physical definition.


    The density is defined by the species population in the core divided by the core
    volume:


    $$

    n_{s,\mathrm{core}} = \frac{N_{s,\mathrm{core}}}{V_\mathrm{core}}

    $$


    where $n_{s,\mathrm{core}}$ is the core species number density in m$^{-3}$, $N_{s,\mathrm{core}}$
    is the number of atoms of species $s$ in the core and is dimensionless, and $V_\mathrm{core}$
    is the core volume in m$^3$.


    In practice this quantity is obtained from the specified pellet composition and
    core geometry, or equivalently from the total core species inventory normalized
    by the core volume. It is species-resolved: different atomic constituents of the
    same core can have different values.


    No device-independent typical numerical range is implied by the standard name
    alone; values depend on the chosen pellet material, mixture, and core volume.'
  unit: m^-3
  physics_domain: plant_systems
  links:
  - name:density_of_pellet
  - name:core_atomic_count_of_pellet
  - name:outer_atomic_count_of_pellet
  arguments:
  - name: density_of_pellet
    operator: core
    operator_kind: qualifier
  sources:
  - id: dd:spi/injector/pellet/core/species/density
    dd_path: spi/injector/pellet/core/species/density
    status: attached
- name: deuterium_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of deuterium atoms delivered by gas injection after
    plasma breakdown, expressed as equivalent electrons. Each deuterium atom contributes
    one count; deuterium introduced during the prefill phase is excluded.
  documentation: 'Deuterium count due to gas injection is the accumulated amount of
    deuterium delivered by gas puffing or valve injection after plasma breakdown.
    It is expressed as an equivalent-electron particle count: because deuterium has
    atomic number one, each injected neutral deuterium atom contributes one count.
    Deuterium supplied before breakdown belongs to [deuterium_prefill_count](name:deuterium_prefill_count)
    rather than this quantity.


    The accumulated count is the time integral of the deuterium injection source rate
    from the breakdown time to the time of interest:


    $$

    N_D^\mathrm{inj}(t) = \int_{t_\mathrm{bd}}^{t} \dot{N}_D^\mathrm{inj}(t'') \,
    dt''

    $$


    where $N_D^\mathrm{inj}$ is the accumulated deuterium equivalent-electron count
    with unit $1$, $t_\mathrm{bd}$ is the plasma breakdown time in s, $t$ and $t''$
    are times in s, and $\dot{N}_D^\mathrm{inj}$ is the [deuterium source rate due
    to injection](name:deuterium_source_rate_due_to_injection) in atoms/s, equivalently
    counts/s for deuterium.


    In practice, the count is computed by integrating calibrated deuterium gas flow
    rates from injection valves, gas lines, or plenum pressure changes, with corrections
    for gas temperature, isotopic purity, valve calibration, and molecular composition
    when relevant. Contributions from all deuterium injection paths are summed, while
    prefill inventory and non-gas fueling sources are kept separate.


    Typical accumulated values are dimensionless counts of about $10^{20}$-$10^{23}$
    for short or medium tokamak pulses, and can reach $10^{24}$-$10^{25}$ in large-device
    or long-pulse operation depending on fueling demand, plasma density, and discharge
    duration.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_due_to_gas_injection
  - name:deuterium_source_rate_due_to_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:accumulated_helium_3_count_due_to_gas_injection
- name: deuterium_prefill_count
  kind: scalar
  status: draft
  description: Accumulated deuterium introduced by gas injection during the plasma
    prefill phase, expressed as an equivalent-electron count. Because deuterium has
    atomic charge Z = 1, each deuterium atom contributes one count; deuterium from
    wall recycling, neutral beams, pellets, or later fueling is excluded.
  documentation: 'Deuterium prefill count is the accumulated amount of deuterium introduced
    as neutral gas before plasma breakdown, expressed as the number of electrons that
    would be supplied by complete ionization. For deuterium, the atomic charge is
    $Z_D = 1$, so the equivalent-electron count is numerically equal to the number
    of injected deuterium atoms. The quantity is limited to the prefill gas-injection
    phase and excludes deuterium supplied later by fueling, wall recycling, pellets,
    or neutral beam injection.


    The accumulated count is obtained by integrating the injected atomic deuterium
    rate over the prefill interval:


    $$

    N_{D,\mathrm{prefill}} = \int_{t_\mathrm{start}}^{t_\mathrm{end}} Z_D\,\dot{N}_D(t)\,dt

    $$


    where $N_{D,\mathrm{prefill}}$ is the deuterium prefill count, $Z_D = 1$ is the
    deuterium atomic charge, $\dot{N}_D(t)$ is the atomic deuterium injection rate
    in atoms s$^{-1}$, and $t_\mathrm{start}$ and $t_\mathrm{end}$ are the start and
    end times of the prefill interval in s. If the measured gas throughput is a molecular
    $D_2$ rate, the corresponding atomic rate is twice the molecular rate.


    In practice this quantity is computed from calibrated gas-valve commands, mass-flow
    measurements, pressure-drop calibrations, or reservoir inventory changes, with
    corrections for line volume, gas temperature, valve conductance, and species purity
    when needed. It represents the requested or delivered neutral-gas inventory before
    breakdown, not the amount that remains confined after ionization.


    Typical prefill inventories are about $10^{20}-10^{23}$ equivalent-electron counts
    in small and medium tokamaks, and may approach $10^{24}$ in large devices or high-pressure
    prefill scenarios.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:tritium_prefill_count
  - name:accumulated_hydrogen_prefill_count
  - name:accumulated_xenon_prefill_count
  - name:deuterium_count_due_to_gas_injection
- name: efficiency_of_plant_system
  kind: scalar
  status: draft
  description: Dimensionless ratio quantifying how effectively a plant system converts
    input power or energy into a specified useful output, abstracting over thermal
    and net efficiency definitions.
  documentation: "The efficiency of a plant system is a dimensionless performance\
    \ metric expressing the fraction of input power or energy that the plant converts\
    \ into a specified useful output. The exact physical scope depends on the efficiency\
    \ type applied: [thermal efficiency](name:thermal_efficiency_of_plant_system)\
    \ characterizes heat-to-work conversion across all thermodynamic conversion stages,\
    \ while [net efficiency](name:net_efficiency_of_plant_system) accounts for the\
    \ signed ratio of exported electrical power to total plant electrical consumption\
    \ including recirculating power.\n\nThe general defining relation takes the form:\n\
    \n$$\n\\eta = \\frac{W_\\text{out}}{W_\\text{in}}\n$$\n\nwhere $W_\\text{out}$\
    \ is the useful output (work, exported electrical power, or heat converted to\
    \ work) and $W_\\text{in}$ is the total input power or energy over the same operating\
    \ interval.\n\nEfficiency is evaluated from calorimetric heat-flow surveys, electrical\
    \ generation meters, and auxiliary power consumption measurements across all plant\
    \ subsystems. For fusion facilities, thermal conversion efficiencies in steam-cycle\
    \ plants lie in the range 30\u201345%, and net electrical efficiencies are further\
    \ reduced by recirculating power fractions for heating, current drive, and cooling\
    \ systems.\n\nSign convention: Positive when the plant system delivers net useful\
    \ output, so that $W_\\text{out} > 0$."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:thermal_efficiency_of_plant_system
  - name:net_efficiency_of_plant_system
- name: electron_source_rate_at_pellet_path_due_to_pellet_injection
  kind: scalar
  status: draft
  description: Electron-equivalent source rate at a specified position along an injected
    pellet trajectory, produced by ablation and ionization of pellet material. It
    is charge-weighted by the number of free electrons ultimately contributed and
    is a non-negative path-position rate in s^-1, not a source per meter.
  documentation: 'The electron source rate at a pellet path position is the local,
    charge-weighted electron-equivalent production rate caused by ablation and ionization
    of injected pellet material. It is the path-resolved counterpart of the total
    [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection)
    and differs from electron_density_of_pellet_path, which describes local electron
    concentration rather than production rate.


    For distance $ell$ along the pellet trajectory and time $t$, the electron-equivalent
    source rate can be written as a charge-weighted sum over ablated pellet constituents:


    $$

    S_e(\ell,t) = \sum_a Z_a^\mathrm{eff}(\ell,t)\,\dot{N}_a(\ell,t)

    $$


    where $S_e$ is the electron source rate at that path position in s^-1, $\ell$
    is distance along the pellet trajectory in meters, $t$ is time in seconds, $\dot{N}_a$
    is the ablation or ionization rate of constituent $a$ at that same position in
    s^-1, and $Z_a^\mathrm{eff}$ is the dimensionless number of free electrons ultimately
    contributed per ablated constituent. For fully ionized deuterium or tritium atoms,
    $Z_a^\mathrm{eff}=1$; mixtures, impurities, molecules, or partially ionized material
    use the appropriate effective charge weighting.


    In practice this quantity is computed from pellet ablation and ionization models
    using the pellet trajectory, speed, size, composition, and local plasma conditions,
    and may be constrained by fast imaging, line radiation, microwave or interferometric
    measurements, and post-injection density evolution. Its unit s^-1 denotes a rate
    at a path position, not a line source per meter; an event-integrated contribution
    over a small path segment is obtained by combining the rate with the pellet transit
    time through that segment, for example $S_e\,\Delta \ell / v_p$ when the pellet
    speed is $v_p$.


    The value is non-negative and is zero where no pellet material is being ablated
    or ionized. For cryogenic hydrogen-isotope fueling pellets, active-path values
    commonly span about 10^21-10^25 s^-1, with small pacing pellets or weak edge ablation
    below this range and large or high-Z pellets reaching about 10^25-10^27 s^-1.
    Magnitudes depend strongly on pellet size, speed, material, plasma density, and
    plasma temperature.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:electron_source_rate_due_to_injection
  sources:
  - id: dd:pellets/time_slice/pellet/path_profiles/ablation_rate
    dd_path: pellets/time_slice/pellet/path_profiles/ablation_rate
    status: composed
- name: ethane_prefill_count
  kind: scalar
  status: draft
  description: Accumulated ethane gas injected during the plasma prefill phase, expressed
    as an equivalent-electron count. Each C2H6 molecule contributes 18 equivalent
    electrons.
  documentation: 'Ethane prefill count is the accumulated amount of ethane introduced
    before plasma initiation, expressed as the number of electrons that would be supplied
    if the injected molecules were fully ionized. The quantity represents the ethane
    contribution to the initial neutral inventory in an equivalent-electron convention.


    The conversion from injected ethane molecules to equivalent-electron count is:


    $$

    N_{e,\mathrm{eq}} = 18\,N_{\mathrm{C}_2\mathrm{H}_6}

    $$


    where $N_{e,\mathrm{eq}}$ is the ethane prefill count, a dimensionless count of
    equivalent electrons, and $N_{\mathrm{C}_2\mathrm{H}_6}$ is the accumulated number
    of injected ethane molecules, a dimensionless molecule count. The factor 18 is
    the total nuclear charge of one ethane molecule: two carbon atoms with charge
    6 each plus six hydrogen atoms with charge 1 each.


    In practice, the value is obtained from calibrated gas-delivery accounting over
    the defined prefill interval and converted from delivered molecular amount to
    equivalent-electron count. It should include ethane delivered for the prefill
    phase only, not later gas injection used for fueling, impurity control, or other
    discharge phases.


    Typical values are strongly device- and scenario-dependent. They may be zero when
    ethane is not used for prefill, while intentional nonzero prefill amounts can
    span roughly $10^{19}$-$10^{23}$ equivalent electrons in small to medium devices
    and scale upward with vessel volume, target fill pressure, and delivered gas inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:ethylene_prefill_count
  - name:propane_prefill_count
- name: ethane_source_rate
  kind: scalar
  status: draft
  description: Instantaneous ethane gas injection rate delivered to the plasma vessel,
    expressed as the equivalent number of bound electrons carried by the neutral C2H6
    molecules per second. For ethane, each molecule contributes 18 equivalent electrons.
  documentation: 'Ethane source rate is the instantaneous neutral-gas delivery rate
    of ethane to the plasma vessel expressed as an equivalent-electron rate. The equivalent-electron
    convention weights each injected $\mathrm{C_2H_6}$ molecule by the total number
    of bound electrons in the neutral molecule, so that different molecular gas feeds
    can be compared on a common particle-count basis.


    For ethane, the conversion from molecular injection rate to equivalent-electron
    source rate is


    $$

    \Gamma_{e,\mathrm{eq}} = 18\,\Gamma_{\mathrm{C_2H_6}}

    $$


    where $\Gamma_{\mathrm{C_2H_6}}$ is the injected ethane molecule rate and the
    factor 18 comes from two carbon atoms with 6 electrons each plus six hydrogen
    atoms with 1 electron each.


    In practice, the molecular injection rate is inferred from calibrated gas-valve
    flow measurements, pressure-drop measurements, or mass-flow-controller signals,
    then converted to the equivalent-electron rate using the molecular stoichiometry.
    The value represents gas supplied by the injection system, not the fraction that
    is ionized, dissociated, retained, or pumped after entering the vessel.


    Typical values depend strongly on valve calibration, pulse duration, and experimental
    purpose. Small diagnostic or conditioning puffs may correspond to about $10^{19}$-$10^{21}$
    s$^{-1}$ in equivalent electrons, while larger fueling or seeding pulses can reach
    $10^{21}$-$10^{23}$ s$^{-1}$ for short intervals.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:silane_source_rate
  - name:carbon_source_rate_due_to_gas_injection
- name: ethylene_count
  kind: scalar
  status: draft
  description: Cumulative ethylene (C2H4) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethylene molecule contributes 16 equivalent
    electrons.
  documentation: 'Cumulative ethylene (C2H4) delivered by gas injection since plasma
    breakdown, expressed as a dimensionless equivalent-electron count. Each neutral
    ethylene molecule contributes 16 equivalent electrons, reflecting two carbon atoms
    at atomic number $Z = 6$ and four hydrogen atoms at $Z = 1$.


    The equivalent-electron count $N_\mathrm{eq}$ for an injected number of ethylene
    molecules $N_\mathrm{mol}$ is:


    $$

    N_\mathrm{eq} = 16 \, N_\mathrm{mol}

    $$


    where the factor $16 = 2 \times 6 + 4 \times 1$ is the total bound-electron inventory
    of a neutral C$_2$H$_4$ molecule. The count accumulates from the moment of plasma
    breakdown and resets between discharges, providing a measure of the total electron
    inventory introduced via ethylene injection. It complements hydrocarbon siblings
    such as [accumulated_ethane_count](name:accumulated_ethane_count) and contributes
    to the cross-species total captured by [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection)


    Sign convention: Positive when ethylene gas has been injected into the vessel
    since plasma breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:accumulated_total_particle_count_due_to_gas_injection
- name: accumulated_ethylene_count
  kind: scalar
  status: draft
  description: Cumulative ethylene (C2H4) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethylene molecule contributes 16 equivalent
    electrons (2 carbon atoms at Z = 6 each, 4 hydrogen atoms at Z = 1 each).
  documentation: 'Ethylene (C2H4) is a two-carbon hydrocarbon molecule in which each
    molecule contributes 2 carbon atoms (atomic number $Z_C = 6$) and 4 hydrogen atoms
    ($Z_H = 1$), yielding 16 equivalent electrons per molecule.


    The accumulated equivalent-electron count is defined by:


    $$

    N_{\mathrm{eq}}(t) = 16 \int_{t_{\mathrm{bd}}}^{t} \frac{dN_{\mathrm{C_2H_4}}}{dt''}
    \, dt''

    $$


    where $t_{\mathrm{bd}}$ is the time of plasma breakdown and $dN_{\mathrm{C_2H_4}}/dt$
    is the instantaneous ethylene injection rate in molecules per second.


    The integral runs from plasma breakdown onward, excluding any prefill contribution.
    The quantity is inferred from calibrated gas-valve flow measurements and tracks
    the hydrocarbon-based electron inventory added to the plasma, relevant to impurity
    seeding and disruption mitigation experiments. Closely related hydrocarbon counts
    include [accumulated_ethane_count](name:accumulated_ethane_count) (C2H6, 18 equivalent
    electrons per molecule) and [accumulated_propane_count](name:accumulated_propane_count)
    (C3H8, 26 equivalent electrons per molecule). For the species-summed inventory
    across all injected gasses, see [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:accumulated_propane_count
  - name:accumulated_total_particle_count_due_to_gas_injection
  arguments:
  - name: ethylene_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - id: dd:summary/gas_injection_accumulated/ethylene/value
    dd_path: summary/gas_injection_accumulated/ethylene/value
    status: composed
- name: ethylene_prefill_count
  kind: scalar
  status: draft
  description: 'Cumulative neutral ethylene (C2H4) introduced during the prefill gas-loading
    phase, expressed as an equivalent-electron count. Each C2H4 molecule contributes
    16 bound atomic electrons: 12 from two carbon atoms and 4 from four hydrogen atoms.'
  documentation: 'Ethylene prefill count is the cumulative amount of neutral ethylene
    introduced during the prefill gas-loading interval before plasma breakdown, expressed
    as an equivalent-electron count. The equivalent-electron convention counts the
    bound atomic electrons in each neutral molecule; for ethylene, two carbon atoms
    with atomic number 6 and four hydrogen atoms with atomic number 1 give 16 electrons
    per C2H4 molecule.


    For a molecular injection rate over the prefill interval, the count is defined
    by


    $$

    N_{\mathrm{eq}}^{\mathrm{prefill}} = \int_{t_0}^{t_b} 16\,\dot{N}_{\mathrm{C_2H_4}}(t)\,dt

    $$


    where $\dot{N}_{\mathrm{C_2H_4}}(t)$ is the neutral ethylene molecular injection
    rate in molecules per second, $t_0$ is the start of the prefill interval, $t_b$
    is the breakdown time or end of prefill, and $N_{\mathrm{eq}}^{\mathrm{prefill}}$
    is a dimensionless equivalent-electron count. Equivalently, if $N_{\mathrm{C_2H_4}}$
    molecules are injected during prefill, the count is $16 N_{\mathrm{C_2H_4}}$.


    In practice the molecular amount is inferred from calibrated gas-flow or valve-throughput
    measurements, reservoir pressure changes, or gas-inventory accounting, with conversion
    to molecule number using the gas equation of state. This quantity is restricted
    to the prefill interval and is distinct from [accumulated_ethylene_count](name:accumulated_ethylene_count),
    which tracks ethylene accumulated from plasma breakdown onward. It follows the
    same equivalent-electron accounting idea used for other injected-species inventory
    counts such as [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),
    [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection),
    and [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection).


    Typical prefill magnitudes are about $10^{19}$-$10^{23}$ equivalent electrons,
    corresponding to roughly $6 \times 10^{17}$-$6 \times 10^{21}$ ethylene molecules.
    The value depends on vessel volume, target prefill pressure, gas-line calibration,
    and the duration of the prefill injection.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethylene_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  - name:carbon_prefill_count_due_to_gas_injection
- name: ethylene_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of ethylene (C2H4) gas into the plasma
    vessel, expressed as equivalent electrons per second with each molecule counted
    as 16 equivalent electrons.
  documentation: 'Ethylene (C2H4) is a two-carbon, four-hydrogen molecule used as
    a gaseous source of both carbon and hydrogen in plasma fueling and wall-conditioning
    experiments. The source rate is the instantaneous equivalent-electron delivery
    rate to the plasma vessel, where each molecule is assigned 16 equivalent electrons
    based on the total atomic electron inventory of the molecular formula.


    The equivalent-electron rate $\dot{N}_\mathrm{eq}$ relates to the molecular injection
    rate $\dot{N}_\mathrm{C_2H_4}$ by


    $$

    \dot{N}_\mathrm{eq} = 16\,\dot{N}_\mathrm{C_2H_4}

    $$


    where the factor $16 = 2Z_\mathrm{C} + 4Z_\mathrm{H}$, with $Z_\mathrm{C} = 6$
    the carbon atomic number and $Z_\mathrm{H} = 1$ the hydrogen atomic number.


    The injection rate is inferred from valve conductance calibrations and upstream
    pressure measurements. Its time-integral gives the [accumulated ethylene count](name:accumulated_ethylene_count),
    which tracks the total equivalent-electron inventory delivered since plasma breakdown.
    Related molecular and atomic injection rates include [silane_source_rate](name:silane_source_rate)
    for SiH4 and [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection)
    for atomic hydrogen delivery.


    Sign convention: Positive when ethylene gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ethylene_count
  - name:silane_source_rate
  - name:hydrogen_source_rate_due_to_gas_injection
- name: krypton_prefill_count
  kind: scalar
  status: draft
  description: Equivalent electrons from krypton injected during the prefill phase;
    it is 36 times the number of krypton atoms delivered and is not the raw atom count.
  documentation: 'Krypton prefill count is a bookkeeping measure of the neutral krypton
    inventory introduced before plasma breakdown, expressed as an equivalent-electron
    count. It converts the number of krypton atoms delivered during the prefill phase
    into the number of electrons those atoms would contain if fully counted by atomic
    number, enabling comparison with other species inventories.


    The equivalent-electron count is defined from the injected krypton atom count
    as:


    $$

    N_{\mathrm{eq,e}}^{\mathrm{Kr,prefill}} = Z_{\mathrm{Kr}} N_{\mathrm{Kr,prefill}}
    = 36 N_{\mathrm{Kr,prefill}}

    $$


    where $N_{\mathrm{Kr,prefill}}$ is the number of krypton atoms injected during
    the prefill phase and $Z_{\mathrm{Kr}}=36$ is the atomic number of krypton. Both
    $N_{\mathrm{eq,e}}^{\mathrm{Kr,prefill}}$ and $N_{\mathrm{Kr,prefill}}$ are dimensionless
    counts.


    In practice, $N_{\mathrm{Kr,prefill}}$ is obtained by integrating a calibrated
    krypton flow over the prefill time interval. For particle flow $\dot{N}_{\mathrm{Kr}}$
    in atoms s$^{-1}$, $N_{\mathrm{Kr,prefill}}=\int \dot{N}_{\mathrm{Kr}}(t)\,dt$;
    for molar flow $\dot{n}_{\mathrm{Kr}}$ in mol s$^{-1}$, $N_{\mathrm{Kr,prefill}}=N_A\int
    \dot{n}_{\mathrm{Kr}}(t)\,dt$; and for gas throughput $Q$ in Pa m$^3$ s$^{-1}$
    at gas temperature $T$ in K, the ideal-gas estimate is $\dot{N}_{\mathrm{Kr}}\approx
    Q/(k_B T)$, where $N_A$ is Avogadro''s constant and $k_B$ is Boltzmann''s constant.
    The same equivalent-electron inventory convention is used for related prefill
    or gas-injection quantities such as [argon_prefill_count](name:argon_prefill_count),
    [neon_prefill_count](name:neon_prefill_count), [tritium_prefill_count](name:tritium_prefill_count),
    [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count), [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),
    and [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection);
    [accumulated_krypton_count](name:accumulated_krypton_count) denotes the krypton
    inventory accumulated beyond the prefill-only interval.


    Typical values are strongly device- and recipe-dependent. Trace or calibration
    prefills may be about $10^{18}$-$10^{20}$ equivalent electrons, while larger high-atomic-number
    gas puffs can reach $10^{21}$-$10^{24}$ equivalent electrons, corresponding to
    approximately $3\times10^{16}$-$3\times10^{22}$ krypton atoms after division by
    36.'
  unit: '1'
  physics_domain: plant_systems
  links:
