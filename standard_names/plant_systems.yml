  documentation: 'The vertical coordinate $Z$ of a shattered pellet fragment locates
    the fragment''s center of mass along the machine symmetry axis direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$
    is vertical height. In shattered pellet injection (SPI), a cryogenic pellet is
    disrupted by a shattering target, producing a cloud of fragments whose 3-D trajectories
    must be tracked to model particle and energy deposition during disruption mitigation.
    This $Z$ component, together with the major-radius and toroidal coordinates of
    [shattered_pellet_fragment_position](name:shattered_pellet_fragment_position),
    fully specifies each fragment''s location. It is distinct from the analogous whole-pellet
    quantity [vertical_coordinate_of_shattered_pellet_position](name:vertical_coordinate_of_shattered_pellet_position),
    which tracks the center of mass of the intact pellet prior to shattering. Typical
    values span the vertical extent of the plasma vessel, roughly $-2$ m to $+2$ m
    for large tokamaks. The fragment position is determined by ballistic trajectory
    integration from the shattering point, accounting for the [toroidal_component_of_shattered_pellet_fragment_velocity](name:toroidal_component_of_shattered_pellet_fragment_velocity)
    and [vertical_component_of_shattered_pellet_fragment_center_of_mass_velocity](name:vertical_component_of_shattered_pellet_fragment_center_of_mass_velocity).


    Sign convention: Positive when the fragment center of mass is above the machine
    midplane, in the direction of increasing $Z$.'
  unit: m
