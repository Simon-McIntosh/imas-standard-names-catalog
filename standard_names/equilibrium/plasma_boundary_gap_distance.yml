name: plasma_boundary_gap_distance
status: draft
cocos_transformation_type: one_like
description: Distance measured along a prescribed direction from a reference point
  to the separatrix or last closed flux surface.
documentation: "The gap distance $d_{\\mathrm{gap}}$ quantifies the clearance between\
  \ a designated reference point (typically on a first-wall or limiter surface) and\
  \ the plasma separatrix along a specified geometric direction. Maintaining adequate\
  \ gaps is critical for machine protection and for controlling plasma\u2013wall interactions;\
  \ real-time gap control is a standard element of plasma shape feedback systems.\
  \ Typical gap values in medium-size tokamaks range from a few centimeters to tens\
  \ of centimeters depending on the gap direction and plasma shape scenario. The quantity\
  \ is evaluated from equilibrium reconstruction codes (EFIT, LIUQE, RT-LIUQE for\
  \ real-time) and is closely related to `distance_to_closest_wall_point_of_plasma_boundary`\
  \ and the wall coordinate `major_radius_of_closest_wall_point`."
