- name: radial_coordinate_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Major-radius location of a specified geometric point associated with\
    \ an active poloidal-field coil, measured from the toroidal symmetry axis in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the major-radius location of a specified geometric
    point associated with an active poloidal-field coil. It identifies the point''s
    distance from the toroidal symmetry axis in the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    The radial coordinate is defined geometrically by


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $R$ is the major-radius coordinate, and $x$ and $y$ are the horizontal Cartesian
    coordinates of the same point in the right-handed Cartesian basis $(\hat{x},\hat{y},\hat{z})$,
    with $\hat{z}$ aligned with the vertical direction $\hat{Z}$.


    The quantity applies independently to each specified point in the coil geometry,
    including an endpoint of a represented coil segment; it is not a coil-center coordinate,
    an outline coordinate, or an average over the coil or its cross section. It is
    the poloidal-field-coil specialization of the parent [radial coordinate](name:radial_coordinate).
    Unlike [radial outline of a poloidal-field coil](name:radial_outline_of_poloidal_field_coil),
    it identifies a specified coil-geometry point rather than each point of the complete
    closed cross-sectional outline.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - dd_path: pf_active/coil/geometry/annulus/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-geometry-annulus-r
