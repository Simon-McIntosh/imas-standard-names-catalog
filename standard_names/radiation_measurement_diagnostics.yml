- name: angular_width_of_bragg_crystal
  description: |-
    The Bragg diffraction angle of the crystal in an X-ray crystal spectrometer
    channel, fixing the central X-ray wavelength selected for diffraction
    according to Bragg's law.
  documentation: |-
    The Bragg angle $\theta_B$ is the angle between the incident X-ray beam and
    the crystal lattice planes at which constructive interference produces
    wavelength-selective Bragg diffraction. It is the primary parameter
    governing the central wavelength of a measurement channel in an X-ray
    crystal spectrometer.

    The selected X-ray wavelength $\lambda$ is determined by Bragg's law:

    $$
    n\lambda = 2d\sin\theta_B
    $$

    where $n$ is a positive integer diffraction order and $d$ is the crystal
    lattice plane spacing of the diffracting crystal. For a crystal with known
    $d$-spacing, $\theta_B$ uniquely determines the central wavelength of the
    spectral channel.

    In X-ray crystal spectrometer systems used for fusion plasma diagnostics,
    the Bragg angle is established by the geometric orientation of the crystal
    relative to the plasma X-ray source and the detector. It is a key
    configuration parameter for selecting specific resonance lines used in
    impurity transport studies and ion temperature measurements via Doppler
    line-broadening analysis. Complementary crystal geometry parameters include
    the radius of curvature of the diffracting surface in the toroidal direction
    and the [aperture radius of the crystal](name:radius_of_bragg_crystal),
    while the physical transverse extent of the crystal along the first axis is
    given by
    [bragg_crystal_width](name:first_local_tangential_width_of_bragg_crystal).
  unit: rad

- name: bandwidth_of_ece_channel
  description: |-
    Full-width frequency interval passed by the intermediate-frequency bandpass
    filter of an electron-cyclotron-emission radiometer channel, setting the
    emission frequencies contributing to its radiation-temperature signal.
  documentation: |-
    The bandwidth is the total frequency span passed by the
    intermediate-frequency bandpass filter associated with one
    electron-cyclotron-emission radiometer channel. It characterizes the
    channel's accepted spectral interval rather than an emission intensity or a
    plasma frequency.

    The full width is defined by

    $$
    \Delta f_{\mathrm{IF}} = f_{\mathrm{high}} - f_{\mathrm{low}}
    $$

    where $\Delta f_{\mathrm{IF}}$ is the intermediate-frequency bandwidth,
    $f_{\mathrm{high}}$ is the upper bandpass edge frequency, and
    $f_{\mathrm{low}}$ is the lower bandpass edge frequency.

    This quantity applies to one ECE channel and uses the full-width convention;
    it is not the center frequency, a reference carrier frequency, or a
    wavelength-domain response width such as the [effective spectral width of a
    spectrometer
    channel](name:effective_spectral_width_of_spectrometer_channel). The
    accepted interval determines which electron-cyclotron-emission frequencies
    contribute to the [radiative temperature at an ECE
    channel](name:radiative_temperature_at_ece_channel) and can therefore affect
    the channel's effective radial localization.
  unit: Hz

- name: bremsstrahlung_power
  description: |-
    Total electromagnetic power emitted by free-free bremsstrahlung as electrons
    accelerate in the Coulomb fields of plasma ions.
  documentation: |-
    Bremsstrahlung power is the total electromagnetic power emitted by free-free
    radiation from electron acceleration in the Coulomb fields of plasma ions.
    It is integrated over the emitting plasma volume and the full
    photon-frequency range.

    $$
    P_{\mathrm{brem}} = \int_V \int_0^\infty \varepsilon_{\mathrm{brem}}(\mathbf{x},\omega)\,d\omega\,d^3\mathbf{x}
    $$

    where $P_{\mathrm{brem}}$ is the total bremsstrahlung power, $V$ is the
    emitting plasma volume, $\mathbf{x}$ is position, $\omega$ is photon angular
    frequency, and $\varepsilon_{\mathrm{brem}}$ is the spectral volumetric
    bremsstrahlung emissivity. This quantity is a contribution to [total plasma
    radiated power](name:total_plasma_radiated_power) and excludes discrete
    [line radiation](name:power_due_to_line_radiation) and [synchrotron
    radiation](name:power_due_to_synchrotron_radiation).
  unit: W

- name: brightness_of_visible_camera
  description: |-
    Visible-camera brightness is band-integrated photon radiance along a
    specified viewing direction over the wavelengths admitted by a visible
    passband. It gives the photon rate per projected collecting area and
    accepted solid angle, with the spectral dependence integrated over that
    band.
  documentation: |-
    Visible-camera brightness is the photon radiance of a radiation field along
    a specified viewing direction after integration over a visible wavelength
    interval or passband. It is normalized to projected collecting area,
    observation time, and accepted solid angle, and counts photons rather than
    radiant energy.

    The band-integrated photon radiance is defined by integrating the spectral
    photon radiance over the visible passband:

    $$
    B_\mathrm{vis} = \int_{\lambda_1}^{\lambda_2} L_\lambda^{(\gamma)}(\lambda)\, d\lambda
    $$

    where $B_\mathrm{vis}$ is the visible-camera brightness,
    $L_\lambda^{(\gamma)}(\lambda)$ is the spectral photon radiance at
    wavelength $\lambda$, and $[\lambda_1,\lambda_2]$ is the wavelength interval
    defining the visible passband.

    The quantity is non-negative because spectral photon radiance is
    non-negative over the passband. It is distinct from spectral radiance, which
    retains wavelength dependence, and from [radiance at spectral
    line](name:photon_radiance_at_spectral_line), which refers to an individual
    spectral line or narrow line interval; it also differs from energy radiance
    because photons are counted without weighting by photon energy.
  unit: m^-2.s^-1.sr^-1

- name: calibration_factor_of_visible_camera
  description: |-
    Multiplicative radiometric coefficient that converts a corrected
    visible-camera detector signal into absolute photon radiance integrated over
    the admitted spectral band.
  documentation: |-
    A visible-camera radiometric factor converts a consistently corrected
    detector signal into band-integrated photon radiance. It represents the
    combined response of the optical throughput, detector sensitivity, pixel
    etendue, and exposure treatment rather than the radiance itself.

    The defining conversion is

    $$
    L_{\mathrm{vis}} = C_{\mathrm{vis}} S_{\mathrm{corr}}
    $$

    where $L_{\mathrm{vis}}$ is the [visible-camera
    brightness](name:brightness_of_visible_camera), $C_{\mathrm{vis}}$ is this
    visible-camera factor, and $S_{\mathrm{corr}}$ is the corrected detector
    signal. The spectral dependence is integrated over the relevant visible
    passband. Unlike the resulting brightness, the factor is a calibration
    coefficient and must be applied to the corrected signal; it is the
    camera-specific component of the parent factor of visible camera.
  unit: m^-2.s^-1.sr^-1

- name: cold_neutral_fraction
  description: |-
    Dimensionless fraction of the cold recycled component of a hydrogen-isotope
    neutral population relative to the total neutral atom population.
  documentation: |-
    The cold neutral fraction is a dimensionless ratio bounded in $[0, 1]$
    expressing the relative abundance of the cold, low-energy recycled component
    of a hydrogen-isotope neutral population. It is a component of the broader
    [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density),
    distinct from the hot charge-exchange-born component.

    The fraction is defined as:

    $$
    f_{\mathrm{cold}} = \frac{n_{\mathrm{cold}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}
    $$

    where $f_{\mathrm{cold}}$ is the cold neutral fraction, $n_{\mathrm{cold}}$
    is the number density of cold recycled neutral atoms, and $n_{\mathrm{hot}}$
    is the number density of hot charge-exchange-born neutral atoms.

    The quantity applies to a specified hydrogen isotope and uses the
    two-component neutral-population model. Its denominator is the total neutral
    population formed by the cold and hot components for that isotope; it is not
    summed across different isotopes and does not represent the hot component
    itself.

    Within this model, the cold and hot fractions are complementary and sum to
    unity. The [hot neutral fraction](name:hot_neutral_fraction) gives the
    corresponding charge-exchange-born component, with the energy threshold
    separating the two components defined by the applicable population model.
  unit: '1'

- name: deuterium_density
  description: |-
    Deuterium density is the number density of ionized deuterium in the fuel-ion
    population. It is the local density of deuterons, excluding neutral atoms,
    molecules, and line- or volume-averaged deuterium densities.
  documentation: |-
    Deuterium density is the number density of ionized deuterium in the fuel-ion
    population. As a species-level density it is charge-state-summed over
    ionized atomic charge states; for deuterium this reduces to the singly
    ionized deuteron population.

    The local deuterium density is defined by the charge-state sum

    $$
    n_D = \sum_{q>0} n_{\mathrm{D}^{q+}}
    $$

    where $n_D$ is the deuterium density, $q$ is the positive atomic charge
    state, and $n_{\mathrm{D}^{q+}}$ is the number density of deuterium ions in
    charge state $q$.

    Neutral deuterium atoms, molecular deuterium, and non-deuterium species are
    excluded. This quantity is local; spatial aggregations such as
    [line-averaged deuterium density](name:line_averaged_deuterium_density) and
    [volume-averaged deuterium density](name:volume_averaged_deuterium_density)
    are distinct quantities.
  unit: m^-3

- name: deuterium_deuterium_emissivity_due_to_fusion
  description: |-
    Local volumetric rate of neutron production from deuterium-deuterium fusion
    reactions, giving the spatial distribution of D-D neutron emission per unit
    volume at each point in the plasma.
  documentation: |-
    The deuterium-deuterium neutron emissivity $\varepsilon_{DD}$ is the local
    number of neutrons produced per unit volume per unit time from D-D fusion
    reactions. Only the neutron-emitting D-D branch contributes, so this
    quantity is the local source of prompt fusion neutrons from
    deuterium-deuterium reactions that produce a neutron.

    For identical deuterium reactants, the branch emissivity is given by:

    $$
    \varepsilon_{DD} = \frac{1}{2} n_D^2 \langle \sigma v \rangle_{DD,n}
    $$

    where $\varepsilon_{DD}$ is the deuterium-deuterium neutron emissivity,
    $n_D$ is the local deuterium reactant number density, $\sigma$ is the fusion
    cross-section for the neutron-emitting D-D branch, $v$ is the relative speed
    of the deuterium reactants, and $\langle \sigma v \rangle_{DD,n}$ is the
    velocity average of $\sigma v$ over the local reactant distributions. The
    factor $1/2$ avoids double-counting unordered pairs of identical deuterium
    reactants.

    The scope is the D-D reaction channel at a plasma location, aggregated over
    all deuterium reactant charge states and kinetic populations that contribute
    to the local neutron-emitting D-D branch unless a component-resolved
    quantity is specified. It excludes the proton-emitting D-D branch,
    subsequent D-T neutron production involving tritium born from D-D reactions,
    and the [deuterium-tritium neutron emissivity due to
    fusion](name:deuterium_tritium_emissivity_due_to_fusion). The reaction-pair
    label deuterium_deuterium denotes two deuterium reactants; it is not a
    charge-state-resolved fuel-state quantity.

    Integrating $\varepsilon_{DD}$ over a plasma volume gives the D-D
    contribution to the global neutron flux for the same reactant population,
    and weighting that contribution by the branch neutron energy gives its
    contribution to total neutron power. When reactant populations are resolved,
    the corresponding global neutron production can be decomposed into [thermal
    neutron flux](name:total_neutron_source_rate_due_to_thermal_fusion),
    beam-thermal neutron flux, and beam-beam neutron flux contributions; those
    are population decompositions of the volume-integrated source, not separate
    definitions of the local D-D emissivity. Together with [deuterium-tritium
    neutron emissivity due to
    fusion](name:deuterium_tritium_emissivity_due_to_fusion), this quantity is a
    reaction-channel-specific member of [neutron emissivity due to
    fusion](name:neutron_emissivity_due_to_fusion).
  unit: m^-3.s^-1

- name: deuterium_tritium_emissivity_due_to_fusion
  description: |-
    Local volumetric rate of neutron production from deuterium-tritium fusion
    reactions, giving the spatial distribution of D-T neutron emission per unit
    volume at each point in the plasma.
  documentation: |-
    The deuterium-tritium neutron emissivity $\varepsilon_{DT}$ is the local
    number of neutrons produced per unit volume per unit time from D-T fusion
    reactions. Each D-T fusion reaction produces exactly one neutron, so this
    quantity is equal to the local D-T fusion reaction-rate density.

    For reacting deuterium and tritium ion populations, the emissivity is given
    by:

    $$
    \varepsilon_{DT} = n_D \, n_T \, \langle \sigma v \rangle_{DT}
    $$

    where $n_D$ and $n_T$ are the local deuterium and tritium number densities
    and $\langle \sigma v \rangle_{DT}$ is the D-T fusion reactivity, the
    velocity-averaged fusion cross-section evaluated over the relative-velocity
    distribution of the reacting ion populations; for thermal reactants it is
    the thermally averaged reactivity at the local ion temperature. No symmetry
    factor appears because the reactants are distinct species.

    This quantity counts neutron production, not fusion energy deposition or
    neutron power. It is the D-T channel of the parent emissivity_due_to_fusion
    and the counterpart of
    [deuterium_deuterium_emissivity_due_to_fusion](name:deuterium_deuterium_emissivity_due_to_fusion),
    which covers the neutron-emitting D-D branch. Its energy-weighted
    counterpart is
    [deuterium_tritium_power_density_due_to_fusion](name:deuterium_tritium_power_density_due_to_fusion),
    and integrating the emissivity over the plasma volume and weighting by the
    per-reaction neutron energy connects to the total_neutron_power.
  unit: m^-3.s^-1

- name: effective_spectral_width_of_spectrometer_channel
  description: |-
    Response-equivalent wavelength interval of a spectrometer channel, defined
    from the full spectral instrument function rather than a Gaussian
    approximation.
  documentation: |-
    Effective spectral width is the wavelength interval equivalent to the area
    of the spectrometer channel's normalized instrument-function response. It
    captures the integrated response of non-Gaussian line shapes and is distinct
    from the Gaussian standard-deviation measure named by spectral width of a
    spectrometer channel.

    $$
    W_{\mathrm{eff}} = \int_{-\infty}^{\infty} \frac{R(\lambda)}{R_{\max}}\,d\lambda
    $$

    where $R(\lambda)$ is the channel response to monochromatic radiation at
    wavelength $\lambda$, and $R_{\max}$ is its peak response. For a Gaussian
    response with standard deviation $\sigma$, the equivalent width is
    $W_{\mathrm{eff}} = \sqrt{2\pi}\,\sigma$; therefore, this quantity is not
    numerically identical to the Gaussian spectral width.
  unit: m

- name: energy_of_detector_pixel
  description: |-
    The energy of a detector pixel is the central or representative photon
    energy assigned to that pixel's spectral bandpass in an X-ray crystal
    spectrometer. It is distinct from the lower and upper bandpass-edge
    energies.
  documentation: |-
    The energy of a detector pixel is the central or representative photon
    energy assigned to that pixel's spectral bandpass in an X-ray crystal
    spectrometer. It is the energy counterpart of the [wavelength of detector
    pixel](name:wavelength_of_detector_pixel) and identifies the pixel's
    spectral-channel assignment rather than the finite width of its accepted
    band.

    For diffraction order $n$, the representative pixel energy is related to the
    pixel Bragg angle by Bragg's law and the photon energy-wavelength relation:

    $$
    E_\mathrm{pix} = \frac{n h c}{2 e d \sin\theta_\mathrm{pix}}
    $$

    where $E_\mathrm{pix}$ is the energy of the detector pixel, $n$ is the
    diffraction order, $h$ is Planck's constant, $c$ is the speed of light in
    vacuum, $e$ is the elementary-charge magnitude, $d$ is the spacing of the
    diffracting crystal planes, and $\theta_\mathrm{pix}$ is the Bragg angle
    associated with the pixel.

    This representative energy is the calibrated spectral-channel value selected
    by the spectrometer energy scale; it need not equal the arithmetic midpoint
    between the [lower bound energy of detector
    pixel](name:lower_bound_energy_of_detector_pixel) and the [upper bound
    energy of detector pixel](name:upper_bound_energy_of_detector_pixel), which
    define the edges of the pixel's accepted photon-energy interval.
  unit: eV

- name: etendue_of_bolometer
  description: |-
    Geometric optical throughput of a bolometer channel, equal to the product of
    its effective collecting area and accepted solid angle.
  documentation: |-
    Étendue is the geometric optical throughput of a bolometer channel: the
    phase-space acceptance of rays transmitted from the viewed region to the
    detector. It determines how radiance is converted into collected optical
    power.

    For a uniform angular acceptance, the étendue is defined by

    $$
    G = A\Omega
    $$

    where $G$ is the étendue, $A$ is the effective collecting area, and $\Omega$
    is the accepted solid angle. For nonuniform acceptance, $G$ denotes the
    corresponding integral over the projected collecting area and accepted
    directions.

    The quantity describes optical throughput only; detector conversion
    efficiency and electronic response are separate properties. It is the
    channel-level counterpart of [line-of-sight
    étendue](name:etendue_of_line_of_sight) and is closely related to the
    aperture area defined by [diagnostic aperture
    area](name:area_of_diagnostic_aperture).
  unit: m^2.sr

- name: etendue_of_hard_xray_detector
  description: |-
    Geometric optical throughput of a hard X-ray detector’s optical system,
    determined by its effective collecting area and accepted solid angle.
  documentation: |-
    Étendue is the geometric throughput of the optical system associated with a
    hard X-ray detector. It characterizes the angular and spatial acceptance
    that determines how incident radiation is coupled into the detector.

    The defining relation is

    $$
    G = A\Omega
    $$

    where $G$ is the detector étendue, $A$ is the effective collecting area, and
    $\Omega$ is the accepted solid angle.

    This quantity applies to the detector-level optical system and uses
    effective area and angular acceptance for the associated detector; it does
    not specify whether those properties arise from one or multiple optical
    elements. It is distinct from the detector’s linear dimensions, such as its
    [height](name:height_of_hard_xray_detector) and width, which do not
    determine optical throughput alone.

    Étendue provides the geometric factor relating incident [hard X-ray
    brightness](name:hard_xray_brightness) to radiation coupled into the
    detector and is the same physical optical-throughput concept represented by
    [etendue_of_spectrometer](name:etendue_of_spectrometer), with the owning
    optical system changed from a spectrometer to a hard X-ray detector.
  unit: m^2.sr

- name: etendue_of_line_of_sight
  description: |-
    Geometric optical throughput of a charge-exchange spectroscopy line of
    sight, determined by its collecting aperture and accepted solid angle.
  documentation: |-
    Étendue is the geometric throughput of the optical collection system
    associated with a charge-exchange spectroscopy line of sight. It specifies
    the channel’s angular and collecting-area acceptance for source radiation.

    The étendue $G$ is defined by

    $$
    G = A\Omega
    $$

    where $A$ is the collecting aperture area, corresponding to the [diagnostic
    aperture area](name:area_of_diagnostic_aperture), and $\Omega$ is the solid
    angle of the accepted rays at that aperture.

    This quantity describes geometric acceptance only. It excludes detector
    efficiency, optical transmission losses, and spectral response; those
    factors must be treated separately when relating collected signal to
    absolute photon flux.
  unit: m^2.sr

- name: etendue_of_soft_xray_detector
  description: |-
    Geometric optical throughput of a soft X-ray detector channel, set by the
    collecting area and accepted solid angle of its optical system.
  documentation: |-
    Etendue is the geometric throughput of the complete optical system serving a
    soft X-ray detector channel. It characterizes the channel's acceptance of
    radiation by combining its collecting area with the range of accepted
    propagation directions.

    For the channel optical system, etendue $G$ is defined by

    $$
    G = A\Omega
    $$

    where $A$ is the effective collecting area of the detector or aperture and
    $\Omega$ is the accepted solid angle subtended by that area.

    This quantity applies to the specified soft X-ray detector channel and
    represents the geometric optical factor for that channel as a whole. It
    excludes the radiation radiance, spectral response, detector conversion
    efficiency, and other non-geometrical response factors.

    The same geometric throughput concept is used for other diagnostic systems,
    including [hard X-ray detector etendue](name:etendue_of_hard_xray_detector)
    and [bolometer etendue](name:etendue_of_bolometer); those quantities differ
    by the owning diagnostic object rather than by the defining relation.
  unit: m^2.sr

- name: exposure_time_of_spectrometer_channel
  description: |-
    Temporal duration over which a spectrometer channel accumulates incident
    photons to form one spectral measurement.
  documentation: |-
    The integration duration is the elapsed time between the start and end of
    the photon-accumulation interval for a spectrometer channel. It defines the
    temporal window contributing to one spectral measurement and is distinct
    from the channel's spectral response, including its [effective spectral
    width](name:effective_spectral_width_of_spectrometer_channel).

    It is defined by

    $$
    \Delta t = t_{\mathrm{end}} - t_{\mathrm{start}}
    $$

    where $\Delta t$ is the integration duration, and $t_{\mathrm{start}}$ and
    $t_{\mathrm{end}}$ are the times at which photon accumulation begins and
    ends. The accumulated signal is determined by the time integral of the
    incident spectral flux over this interval.
  unit: s

- name: extent_of_soft_xray_detector
  description: |-
    Full end-to-end physical size of a soft X-ray detector along the applicable
    horizontal or vertical detector-plane direction.
  documentation: |-
    The detector extent is the complete end-to-end linear size of the soft X-ray
    detector along one specified detector-plane direction. It characterizes the
    physical detector boundary rather than a spectral or radiometric property.

    For a coordinate $s$ measured along the selected detector-plane direction,
    the extent $L$ is defined by

    $$
    L = s_{\max} - s_{\min}
    $$

    where $s_{\max}$ and $s_{\min}$ are the coordinates of the two opposite
    physical boundaries.

    The applicable direction is horizontal or vertical within the detector
    plane. This quantity describes an overall detector dimension and is distinct
    from pixel dimensions, collecting [area of a diagnostic
    aperture](name:area_of_diagnostic_aperture), and optical throughput such as
    the [étendue of a hard X-ray detector](name:etendue_of_hard_xray_detector).
  unit: m

- name: first_local_tangential_coordinate_of_bragg_crystal
  description: |-
    Signed coordinate of a Bragg-crystal outline vertex along the first local
    tangential axis of the right-handed crystal-local (e1, e2, e3) frame, with
    e1 the more horizontal crystal-tangential direction oriented toward
    increasing toroidal angle φ in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Signed coordinate of a Bragg-crystal outline vertex along the first local
    tangential axis is the scalar displacement of that vertex from the
    crystal-local reference point along the first in-surface direction of the
    Bragg crystal. The quantity is defined in the right-handed crystal-local
    $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$ frame tied to
    the crystal surface.

    The coordinate is the projection of the vertex displacement onto the first
    local tangential unit vector:

    $$
    X_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_1
    $$

    where $\mathbf{r}$ is the position vector of the Bragg-crystal outline
    vertex, $\mathbf{r}_0$ is the position vector of the crystal-local reference
    point, and $\hat{\mathbf{e}}_1$ is the first local tangential unit vector.

    The crystal-local triad is fixed geometrically: $\hat{\mathbf{e}}_3$ is the
    plasma-facing surface normal, $\hat{\mathbf{e}}_1$ is the more horizontal
    tangent to the crystal surface and is oriented so that its toroidal
    component points in the $+\hat{\phi}$ direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height, and $\hat{\mathbf{e}}_2 =
    \hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$. This coordinate is distinct
    from the [second local tangential
    coordinate](name:second_local_tangential_coordinate_of_bragg_crystal), which
    uses $\hat{\mathbf{e}}_2$, and from any coordinate along the surface normal.

    Sign convention: Positive when the outline vertex is displaced from the
    crystal-local reference point in the $+\hat{\mathbf{e}}_1$ direction, the
    more horizontal crystal-tangential direction oriented toward increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: m

- name: first_local_tangential_coordinate_of_reflector
  description: |-
    Signed first local-tangential coordinate of a reflector-outline vertex in
    the reflector's orthogonal local frame (X1, X2), supplying one coordinate of
    its irregular polygonal boundary.
  documentation: |-
    This quantity gives the position of an individual reflector-outline vertex
    projected onto the first axis of the reflector-local orthogonal frame $(X_1,
    X_2)$. Together with the corresponding second-axis coordinate, it specifies
    the vertex locations that define the reflector's irregular polygonal
    outline.

    For vertex $i$, the coordinate is defined by

    $$
    x_{1,i} = \mathbf{r}_i \cdot \hat{\mathbf{e}}_1
    $$

    where $\mathbf{r}_i$ is the vertex displacement from the reflector's local
    origin and $\hat{\mathbf{e}}_1$ is the unit vector along the first local
    tangential axis. The analogous coordinate for another object is defined by
    the [first local-tangential coordinate of an optical
    element](name:first_local_tangential_coordinate_of_optical_element).

    This quantity describes reflector-outline geometry only; it is not the
    reflector center, surface curvature, or an optical-path coordinate.
  unit: m

- name: first_local_tangential_coordinate_of_soft_xray_detector
  description: |-
    Signed coordinate of a soft X-ray detector outline vertex along the first
    local tangential (X1) axis of the detector-local two-dimensional Cartesian
    frame.
  documentation: |-
    The first local tangential coordinate specifies the signed displacement of
    an outline vertex along the first tangential axis (X1) of the detector-local
    Cartesian frame. Together with
    [second_local_tangential_coordinate_of_soft_xray_detector](name:second_local_tangential_coordinate_of_soft_xray_detector),
    it defines the polygonal boundary of the soft X-ray detector's sensitive
    area projected onto the object-local plane. The two coordinates $(X_1, X_2)$
    form a right-handed pair intrinsic to the owning detector object; their
    orientation is fixed per detector installation and is not in general aligned
    with the machine cylindrical $(R, \phi, Z)$ frame.

    Sign convention: Positive when the vertex displacement is in the direction
    of the positive first local tangential axis of the detector-local frame.
  unit: m

- name: first_local_tangential_radius_of_filter_window
  description: |-
    Geometric radius describing the bending of an X-ray filter window along its
    first local tangential direction, defined for applicable curved-surface
    geometries.
  documentation: |-
    The quantity is the local radius describing how an X-ray filter-window
    surface bends along its first local tangential direction.

    For the surface normal section tangent to that direction, the curvature
    radius is defined by:

    $$
    R = \frac{1}{|\kappa_1|}
    $$

    where $R$ is the first-local-tangential radius of curvature and $\kappa_1$
    is the normal curvature along the first local tangent.

    This quantity applies to an individual filter window when its curved-surface
    geometry specifies bending along the first local tangent. It describes
    surface shape, not aperture size, and is a radius rather than curvature
    itself. No front/back surface distinction is implied.

    This is a directional surface-curvature specialization of
    [radius](name:radius). The [second-local-tangential
    radius](name:second_local_tangential_radius_of_filter_window) describes
    bending along the other local tangent; neither tangent is necessarily a
    principal-curvature direction.
  unit: m

- name: first_local_tangential_width_of_bragg_crystal
  description: |-
    Full physical extent of a rectangular Bragg crystal measured along its first
    local tangential axis, the crystal-local X1 direction.
  documentation: |-
    The first-local-tangential width is the full physical extent of the
    diffracting Bragg crystal along its crystal-local X1 axis.

    For a rectangular crystal, the width is defined by the endpoint separation:

    $$
    w_{X_1}=x_{1,\max}-x_{1,\min}
    $$

    where $w_{X_1}$ is the first-local-tangential width, and $x_{1,\max}$ and
    $x_{1,\min}$ are the maximum and minimum crystal-boundary coordinates along
    the first local tangential axis.

    This quantity applies only to rectangular crystal geometry and represents
    the complete endpoint-to-endpoint extent of the diffracting crystal. It is
    not a half-width, local chord, averaged dimension, spectral width, or
    aperture width; no summation over multiple crystals is implied.

    The companion transverse direction is identified by the [second local
    tangential coordinate of the Bragg
    crystal](name:second_local_tangential_coordinate_of_bragg_crystal), whereas
    the [radius of the Bragg crystal](name:radius_of_bragg_crystal) describes a
    center-to-edge distance for a circular active surface rather than a full
    extent along X1.
  unit: m

- name: first_local_tangential_width_of_filter_window
  description: |-
    First local tangential width of the filter window is its full
    rectangular-aperture extent along the object-local first tangential axis.
  documentation: |-
    Width of filter window

    For rectangular geometry, the full width is the difference between the
    greatest and least boundary coordinates along that axis:

    $$
    w = \xi_{1,\max} - \xi_{1,\min}
    $$

    where $w$ is the first local tangential width, and $\xi_{1,\max}$ and
    $\xi_{1,\min}$ are the greatest and least values, respectively, of the
    [first local tangential coordinate of the filter
    window](name:first_local_tangential_coordinate_of_filter_window) on the
    aperture boundary.

    This quantity applies to one filter window only when its geometry is
    rectangular. It is a full width, not a half-width or a signed boundary
    coordinate, and is distinct from the [filter-window
    radius](name:radius_of_filter_window), which describes the opening for
    circular geometry.

    Together with the [second local tangential width of the filter
    window](name:second_local_tangential_width_of_filter_window), it specifies
    the two orthogonal dimensions of the rectangular aperture.
  unit: m

- name: first_local_tangential_width_of_reflector
  description: |-
    Full physical extent of a rectangular reflector along its object-local first
    tangential axis, defining one dimension of the reflector aperture.
  documentation: |-
    The first local tangential width of a reflector is the full geometric extent
    of an individual rectangular reflector element along its object-local first
    tangential axis. It defines one transverse dimension of the reflector
    aperture.

    For the two bounding edges along this axis, the width is defined as

    $$
    w_1 = x_{1,\max} - x_{1,\min}
    $$

    where $w_1$ is the first local tangential width, and $x_{1,\max}$ and
    $x_{1,\min}$ are the maximum and minimum signed coordinates of the reflector
    edges along the first local tangential axis.

    This quantity applies to one reflector member with rectangular geometry. It
    is a full width, not a half-width, radius, vertex coordinate, or aggregate
    over multiple reflectors; the width is non-negative by the ordering of the
    bounding coordinates.

    The same full-width convention is used for an aperture's first local
    tangential extent in [first local tangential width of
    aperture](name:first_local_tangential_width_of_aperture), while [second
    local tangential width of
    aperture](name:second_local_tangential_width_of_aperture) represents the
    corresponding extent along the orthogonal second local tangential axis.
  unit: m

- name: first_local_tangential_width_of_soft_xray_detector
  description: |-
    Full physical extent of the rectangular soft X-ray detector aperture
    measured between its two boundaries along the detector-local first
    tangential (X1) direction.
  documentation: |-
    This quantity is the full end-to-end width of a soft X-ray detector's
    rectangular aperture along its object-local first tangential axis, denoted
    X1. It defines one dimension of the detector acceptance geometry used in
    etendue calculations.

    The width is defined by

    $$
    w_1 = x_{1,\mathrm{max}} - x_{1,\mathrm{min}}
    $$

    where $w_1$ is the first-local-tangential aperture width, and
    $x_{1,\mathrm{max}}$ and $x_{1,\mathrm{min}}$ are the coordinates of the two
    opposing aperture boundaries along X1.

    The quantity applies to one soft X-ray detector aperture with rectangular
    geometry and represents the complete boundary-to-boundary extent, not a
    half-width, an outline coordinate, the second local tangential width, or an
    aggregate over multiple detectors. The boundary coordinates used in the
    defining difference are provided by the [first local tangential coordinate
    of the soft X-ray
    detector](name:first_local_tangential_coordinate_of_soft_xray_detector). The
    same geometric convention is used for the corresponding [first local
    tangential width of a hard X-ray
    detector](name:first_local_tangential_width_of_hard_xray_detector), while
    [extent of the soft X-ray detector](name:extent_of_soft_xray_detector)
    denotes a broader detector-size quantity rather than this specifically
    defined X1 aperture dimension.
  unit: m

- name: hard_xray_brightness
  description: |-
    Band-integrated hard X-ray photon radiance received by a channel, normalized
    by projected collecting area and accepted solid angle.
  documentation: |-
    Hard X-ray brightness is the photon radiance received from a viewing
    direction by a channel. It represents photon arrival rate with the
    photon-energy dependence integrated over the selected hard X-ray band.

    The band-integrated photon radiance is defined by

    $$
    B_{\mathrm{HX}} = \frac{dN_\gamma}{dt\,dA_{\mathrm{proj}}\,d\Omega}
    $$

    where $B_{\mathrm{HX}}$ is the hard X-ray brightness, $N_\gamma$ is the
    number of received photons in the selected energy band, $t$ is time,
    $A_{\mathrm{proj}}$ is projected collecting area, and $\Omega$ is accepted
    solid angle.

    This quantity applies to hard X-ray photons received by a channel and is
    evaluated separately for each selected energy band. Its aggregation
    convention is integration over photon energy within that band while
    retaining normalization by projected area and solid angle. It is a received
    radiometric quantity, not a local volumetric source term, and it counts
    photons rather than their deposited or carried energy.

    The local production counterpart is hard X-ray emissivity, which describes
    photon generation per unit volume and solid angle before propagation to the
    channel. Integrating this brightness over the collecting geometry
    represented by the [etendue of a hard X-ray
    detector](name:etendue_of_hard_xray_detector) gives the received photon rate
    under the corresponding angular and area acceptance. Unlike [incident soft
    X-ray radiance](name:incident_soft_xray_radiance), which is energy-weighted,
    this quantity is photon-count radiance; photon registration probability is a
    separate detector property described by [spectral efficiency of a hard X-ray
    detector](name:spectral_efficiency_of_hard_xray_detector).
  unit: m^-2.s^-1.sr^-1

- name: hard_xray_emissivity
  description: |-
    Local production rate of hard-X-ray bremsstrahlung photons per plasma volume
    and emission solid angle, integrated over a specified photon-energy band.
  documentation: |-
    Hard-X-ray emissivity is the local bremsstrahlung photon production rate per
    plasma volume and emission solid angle, integrated over the selected
    hard-X-ray photon-energy band. It represents emission from suprathermal
    electrons at a physical location and in a specified emission direction.

    The band-integrated emissivity is defined by

    $$
    \varepsilon_{\mathrm{HXR}}(\mathbf{r},\Omega;E_1,E_2)=\int_{E_1}^{E_2}\varepsilon_{\mathrm{HXR}}^{(E)}(\mathbf{r},\Omega,E)\,\mathrm{d}E
    $$

    where $\varepsilon_{\mathrm{HXR}}$ is the band-integrated hard-X-ray photon
    emissivity, $\varepsilon_{\mathrm{HXR}}^{(E)}$ is the differential photon
    emissivity with respect to photon energy, $\mathbf{r}$ is the emission
    location, $\Omega$ is the emission direction labeled by solid angle, $E$ is
    photon energy, and $E_1$ and $E_2$ are the lower and upper limits of the
    selected energy band.

    This quantity is local and directional: it is not integrated along a line of
    sight, over a plasma volume, or over emission directions. It applies to
    hard-X-ray photons produced by suprathermal-electron bremsstrahlung and
    excludes the total bremsstrahlung electromagnetic power and
    detector-received radiation.

    In an optically thin plasma, [hard X-ray
    brightness](name:hard_xray_brightness) is obtained from the corresponding
    local emissivity by propagation and integration along a viewing path;
    brightness is therefore a received radiance, whereas this quantity is the
    local photon source density.
  unit: m^-3.s^-1.sr^-1

- name: height_of_hard_xray_detector
  description: |-
    Height of a hard X-ray detector is the full edge-to-edge extent of its
    rectangular aperture along the second local tangential axis, X2, in the
    local Cartesian (X1, X2, X3) frame.
  documentation: |-
    Height of hard xray detector

    It applies to a rectangular detector aperture and denotes a full extent, not
    a half-extent, signed coordinate, detector location, housing dimension, or
    extent along the local normal. It is distinct from the extent of a separate
    channel collimating aperture and from the first local tangential extent,
    represented by the [first local tangential
    width](name:first_local_tangential_width_of_hard_xray_detector).

    For a rectangular detector aperture, this height and the [first local
    tangential width](name:first_local_tangential_width_of_hard_xray_detector)
    are its two orthogonal in-plane full dimensions; together they determine the
    aperture opening area. That area contributes to the [hard X-ray detector
    etendue](name:etendue_of_hard_xray_detector), which also depends on the
    accepted solid angle.
  unit: m

- name: hot_neutral_fraction
  description: |-
    Dimensionless fraction of the hot charge-exchange-born component of a
    hydrogen-isotope neutral population relative to the total neutral atom
    population.
  documentation: |-
    The hot neutral fraction is a dimensionless ratio bounded in $[0, 1]$
    expressing the relative abundance of the hot, charge-exchange-born component
    of a hydrogen-isotope neutral population. It is a component of the broader
    [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density),
    distinct from the cold recycled component.

    The fraction is defined as:

    $$
    f_{\mathrm{hot}} = \frac{n_{\mathrm{hot}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}
    $$

    where $f_{\mathrm{hot}}$ is the hot neutral fraction, $n_{\mathrm{hot}}$ is
    the number density of hot charge-exchange-born neutral atoms, and
    $n_{\mathrm{cold}}$ is the number density of cold recycled neutral atoms.

    The quantity applies to a specified hydrogen isotope and uses the
    two-component neutral-population model. Its denominator is the total neutral
    population formed by the cold and hot components for that isotope; it is not
    summed across different isotopes and does not represent the cold component
    itself.

    Within this model, the hot and cold fractions are complementary and sum to
    unity. The [cold neutral fraction](name:cold_neutral_fraction) gives the
    corresponding recycled component, with the energy threshold separating the
    two components defined by the applicable population model.
  unit: '1'

- name: hydrogenic_density
  description: |-
    Charge-state- and isotope-summed number density of hydrogenic particles in
    the plasma.
  documentation: |-
    Hydrogenic particle density is the local abundance of hydrogen isotopes,
    including every included ionization state, expressed per unit volume.

    $$
    n_{\mathrm{H}} = \sum_{s \in \mathcal{H}} \sum_q n_{s,q}
    $$

    where $n_{\mathrm{H}}$ is the total hydrogenic number density, $\mathcal{H}$
    is the set of included hydrogenic isotopes, $q$ indexes their charge states,
    and $n_{s,q}$ is the number density of isotope $s$ in state $q$.

    The quantity includes all charge states and isotopic variants and is not
    restricted to a particular isotope, ionization state, or neutral population.
    The concrete catalog instance is [total hydrogenic
    density](name:total_hydrogenic_density).
  unit: m^-3

- name: incident_soft_xray_radiance
  description: |-
    Incident soft X-ray power radiance gives received electromagnetic power per
    projected detector area and solid angle, integrated over the selected energy
    band.
  documentation: |-
    Incident soft-X-ray power radiance is the energy-integrated radiant power
    arriving at a receiving surface from the viewing direction, expressed per
    projected area and per solid angle.

    $$
    L_{\rm inc} = \int_{\mathcal{E}} L_E^{\rm inc}\,dE = \frac{dP_{\rm inc}}{dA_\perp\,d\Omega}
    $$

    where $L_{\rm inc}$ is the incident power radiance, $L_E^{\rm inc}$ is the
    incident spectral power radiance at photon energy $E$, $\mathcal{E}$ is the
    selected photon-energy band or collection of bands, $P_{\rm inc}$ is
    incident radiant power, $A_\perp$ is projected receiving area, and $\Omega$
    is accepted solid angle.

    The quantity applies to soft X-ray radiation incident on a detector channel,
    with spectral dependence integrated over the selected energy band or bands.
    It is an incoming radiometric quantity per area and solid angle, not a total
    power integrated over the detector aperture or viewing directions, and it is
    distinct from detector-registration efficiency.

    Integrating this radiance over the relevant projected area and solid angle
    gives the band-integrated received power represented by [power of soft X-ray
    detector](name:power_of_soft_xray_detector). Unlike [hard X-ray
    brightness](name:hard_xray_brightness), which is photon-number radiance,
    this quantity is power radiance; [spectral efficiency of soft X-ray
    detector](name:spectral_efficiency_of_soft_xray_detector) instead describes
    the probability that incident photons are registered.
  unit: W.m^-2.sr^-1

- name: inner_hard_xray_half_width_at_emissivity_peak
  description: |-
    Dimensionless inward extent of the hard X-ray emissivity peak from its
    maximum to the inner half-maximum point in normalized toroidal flux.
  documentation: |-
    The inner half-width is the inward extent of the hard X-ray emissivity peak
    produced by fast electrons, measured along the normalized toroidal flux
    coordinate. It is the distance from the peak maximum toward the magnetic
    axis to the point where the emissivity falls to half its peak value.

    $$
    w_{\mathrm{in}} = \rho_{\mathrm{peak}} - \rho_{\mathrm{half,in}}, \qquad \varepsilon_X(\rho_{\mathrm{half,in}}) = \frac{1}{2}\varepsilon_X(\rho_{\mathrm{peak}})
    $$

    where $w_{\mathrm{in}}$ is the inner half-width, $\rho$ is the normalized
    toroidal flux coordinate increasing outward from the magnetic axis, and
    $\varepsilon_X(\rho)$ is the hard X-ray emissivity as a function of that
    coordinate. The subscript $\mathrm{peak}$ denotes the emissivity maximum,
    and $\mathrm{half,in}$ denotes the inward half-maximum location.

    This quantity applies only to the side of the peak toward the magnetic axis.
    It is a geometric width, not an emissivity value, integrated emission, or
    average, and is distinct from the corresponding outward half-width. When
    both sides are defined, the full peak width is the sum of the inward and
    outward half-widths.
  unit: '1'

- name: lower_bound_energy_of_detector_pixel
  description: |-
    The lower bound energy of a detector pixel is the minimum photon energy
    accepted by that pixel's spectral bandpass in an X-ray crystal spectrometer.
  documentation: |-
    The lower bound energy of a detector pixel is the minimum photon energy at
    the low-energy edge of the spectral interval accepted by an individual
    detector pixel in an X-ray crystal spectrometer. It defines the lower
    endpoint of that pixel's photon-energy acceptance range.

    This quantity applies to photons assigned to one detector pixel and
    represents a per-pixel spectral-channel boundary, not an integrated or
    averaged energy over multiple pixels or channels. It is distinct from the
    [energy of a detector pixel](name:energy_of_detector_pixel), which is the
    central or representative photon energy assigned to the pixel, and from the
    [upper bound energy of a detector
    pixel](name:upper_bound_energy_of_detector_pixel), which defines the
    high-energy edge. Together, the lower and upper bounds delimit the pixel's
    accepted photon-energy interval.
  unit: eV

- name: lower_wavelength_of_filter
  description: |-
    Lower wavelength of a filter is the vacuum spectral coordinate marking the
    short-wavelength, high-photon-energy boundary of its transmitted passband.
  documentation: |-
    Wavelength of filter

    The corresponding frequency and photon-energy boundaries satisfy:

    $$
    \lambda_L = \frac{c}{\nu_U} = \frac{hc}{E_U}
    $$

    where $\lambda_L$ is the lower vacuum [wavelength] bound, $c$ is the speed
    of light in vacuum, $\nu_U$ is the upper frequency bound, $h$ is Planck's
    constant, and $E_U$ is the upper photon-energy bound.

    This is the lower-edge specialization of [wavelength of a
    filter](name:wavelength_of_filter), not its nominal passband center or
    passband width. Together with the [upper wavelength of the
    filter](name:upper_wavelength_of_filter), it delimits the specified
    transmission interval in vacuum wavelength. It does not denote the
    wavelength within the filter material or specify the detailed transmission
    curve.
  unit: m

- name: neutron_emissivity_due_to_fusion
  description: |-
    Local volumetric rate of neutron production from all included fusion
    reactions, giving the spatial distribution of fusion neutron emission per
    unit volume at each point in the plasma.
  documentation: |-
    The neutron emissivity due to fusion $\varepsilon_n^{\mathrm{fus}}$ is the
    local number of neutrons produced per unit volume per unit time from all
    included fusion reactions. Each contributing neutron-producing branch adds
    its local neutron yield, so this quantity is the reaction-channel-aggregated
    fusion neutron source rather than a single-channel contribution.

    For included binary fusion reaction branches, the emissivity is defined by:

    $$
    \varepsilon_n^{\mathrm{fus}} = \sum_{(\{a,b\},r)\in\mathcal{C}} \nu_{ab,r}^{(n)} \frac{n_a n_b}{1+\delta_{ab}} \langle \sigma v \rangle_{ab,r}
    $$

    where $\varepsilon_n^{\mathrm{fus}}$ is the neutron emissivity due to
    fusion, $\mathcal{C}$ is the set of included unordered reacting-species
    pairs and fusion reaction branches, $a$ and $b$ identify the reacting ion
    species, $r$ identifies a reaction branch, $\nu_{ab,r}^{(n)}$ is the number
    of neutrons produced by one reaction in that branch, $n_a$ and $n_b$ are the
    local number densities of the reacting ion populations, $\delta_{ab}$ is the
    Kronecker delta for identical reacting species, and $\langle \sigma v
    \rangle_{ab,r}$ is the velocity-averaged fusion reactivity for that branch.

    This quantity is local to each point in the plasma and is summed over the
    included neutron-producing fusion branches and their reacting ion
    populations. The factor $1+\delta_{ab}$ counts unordered pairs of identical
    reactants once, so identical-population reactions such as
    deuterium-deuterium are not double-counted. It represents neutron production
    only; it excludes charged fusion products, radiation other than neutrons,
    and the released fusion energy represented by
    [power_density_due_to_fusion](name:power_density_due_to_fusion).

    The related quantity emissivity_due_to_fusion is already restricted to
    fusion neutron production; this quantity should not be interpreted as a
    neutron-only component of a broader all-product emissivity. Single-channel
    contributions are represented by
    [deuterium_deuterium_emissivity_due_to_fusion](name:deuterium_deuterium_emissivity_due_to_fusion)
    and
    [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion);
    summing the included channel contributions gives this reaction-aggregated
    emissivity. Volume integration of $\varepsilon_n^{\mathrm{fus}}$ gives
    neutron_rate with the same reaction-channel aggregation.
  unit: m^-3.s^-1

- name: opacity
  description: |-
    Optical depth measuring cumulative attenuation of electromagnetic radiation
    along a specified propagation path through a medium. It uses the wavelength,
    frequency, spectral band, or broadband weighting assigned to the attenuation
    coefficient.
  documentation: |-
    Opacity is the optical depth accumulated by electromagnetic radiation along
    a specified propagation path through a medium that removes radiation from
    that path. It represents cumulative extinction by absorption and, when the
    attenuation coefficient includes it, scattering out of the propagation path.

    The opacity for a spectral selection $\chi$ along a path $\Gamma$ is defined
    by integrating the matching local attenuation coefficient:

    $$
    \tau_\chi(\Gamma) = \int_\Gamma \alpha_\chi(s)\,ds
    $$

    where $\tau_\chi(\Gamma)$ is the opacity for path $\Gamma$ and spectral
    selection $\chi$, $\alpha_\chi(s)$ is the local attenuation coefficient for
    the same selection at path position $s$, and $ds$ is the differential path
    element along $\Gamma$.

    The spectral selection $\chi$ may be a wavelength, a frequency, a finite
    spectral band, or a broadband weighting; $\tau_\chi$ and $\alpha_\chi$ must
    use the same selection. This name denotes the accumulated path quantity for
    the radiation component under consideration and does not by itself choose
    one of those spectral conventions.

    Opacity is not the local attenuation coefficient, a material-specific mass
    attenuation coefficient, emitted radiance, or the [spectral absorptivity of
    a filter](name:spectral_absorptivity_of_filter); it is the line-integrated
    optical depth that governs attenuation along the path. For pure attenuation
    with no emission into the path and no scattering into the path, incident
    intensity $I_\chi^\mathrm{in}$ and transmitted intensity
    $I_\chi^\mathrm{out}$ for the same spectral selection satisfy
    $I_\chi^\mathrm{out}/I_\chi^\mathrm{in} = \exp[-\tau_\chi(\Gamma)]$, so
    opacities of consecutive path segments add.
  unit: '1'

- name: opacity_at_ece_channel_emission_position
  description: |-
    Dimensionless optical depth along the electron-cyclotron-emission viewing
    path at a channel emission position, indicating whether the detected
    emission is local and thermal.
  documentation: |-
    This quantity is the optical depth of the plasma evaluated at the emission
    position associated with one electron-cyclotron-emission channel. It
    measures the cumulative attenuation between the emitting region and the
    relevant observation path.

    The optical depth is defined by

    $$
    \tau_{\mathrm{ECE}}(s_{\mathrm{em}}) = \int_{\mathcal{P}(s_{\mathrm{em}})} \alpha_{\mathrm{ECE}}(s)\,ds
    $$

    where $\tau_{\mathrm{ECE}}$ is the electron-cyclotron-emission optical
    depth, $s_{\mathrm{em}}$ is the channel emission position,
    $\mathcal{P}(s_{\mathrm{em}})$ is the line-of-sight path used to accumulate
    the optical depth at that position, $\alpha_{\mathrm{ECE}}$ is the
    electron-cyclotron-emission absorption coefficient, and $s$ is distance
    along that path.

    The scope is one channel and its associated emission position; values are
    not summed or averaged over channels or over emission positions. This
    quantity is the accumulated optical depth, not the local absorption
    coefficient or a channel-integrated aggregate. It is the position-specific
    form of [opacity](name:opacity), with the evaluation locus made explicit.

    Optical depth greater than one indicates optically thick, locally thermal
    emission, whereas optical depth less than one indicates that non-local or
    suprathermal contributions can be important.
  unit: '1'

- name: outer_hard_xray_half_width_at_emissivity_peak
  description: |-
    Outward extent of the hard X-ray emissivity peak from its maximum to the
    outer half-maximum point toward the separatrix in normalized toroidal flux.
  documentation: |-
    This quantity is the outward half-width of the hard X-ray emissivity peak,
    measured from the emissivity maximum toward the separatrix in normalized
    toroidal flux. It characterizes the radial spread of hard X-ray emission
    associated with nonthermal electrons on the outer side of the peak.

    $$
    h_{\mathrm{outer}} = \rho_{\mathrm{half,out}} - \rho_{\mathrm{peak}}, \qquad \epsilon_{\mathrm{HX}}(\rho_{\mathrm{half,out}}) = \frac{1}{2}\epsilon_{\mathrm{HX}}(\rho_{\mathrm{peak}})
    $$

    Here, $h_{\mathrm{outer}}$ is the outward half-width, $\rho_{\mathrm{peak}}$
    is the normalized toroidal-flux coordinate of the hard X-ray emissivity
    maximum, $\rho_{\mathrm{half,out}}$ is the outer coordinate where the
    emissivity reaches half its peak value, and $\epsilon_{\mathrm{HX}}$ is the
    hard X-ray emissivity as a function of normalized toroidal-flux coordinate
    $\rho$.

    The quantity applies only to the outer side of the emissivity peak, with
    increasing $\rho$ directed toward the separatrix. It is a nonnegative extent
    and is distinct from the inward half-width, which measures the corresponding
    distance on the magnetic-axis side of the peak. Together, the two
    directional widths characterize the asymmetric spread of the peak; the
    [inner hard X-ray half-width at the emissivity
    peak](name:inner_hard_xray_half_width_at_emissivity_peak) provides the
    inward counterpart.
  unit: '1'

- name: power_density_due_to_fusion
  description: |-
    Local volumetric rate of energy release from all included nuclear-fusion
    reaction channels, including energy carried by charged particles and
    neutrons.
  documentation: |-
    Fusion power density is the local energy-release rate generated by
    nuclear-fusion reactions per unit volume. It may represent a specific
    reaction channel or the channel-summed quantity, with unqualified fusion
    power density understood as the sum over included channels.

    The defining reaction-rate sum is

    $$
    P_{\mathrm{fus}}(\mathbf{x}) = \sum_{r \in \mathcal{R}} \frac{n_{a,r}(\mathbf{x})\,n_{b,r}(\mathbf{x})}{1+\delta_{a_rb_r}}\,\langle\sigma v\rangle_r\,E_r
    $$

    where $r$ indexes fusion channels, $n_{a,r}$ and $n_{b,r}$ are reactant
    number densities in m$^{-3}$, $\langle\sigma v\rangle_r$ is the
    reaction-rate coefficient in m$^{3}$ s$^{-1}$, $E_r$ is the energy released
    per reaction in joules, and $\delta_{a_rb_r}$ is one for identical reactants
    and zero otherwise. The deuterium–deuterium and deuterium–tritium instances
    are represented by [deuterium-deuterium fusion power
    density](name:deuterium_deuterium_power_density_due_to_fusion) and
    [deuterium-tritium fusion power
    density](name:deuterium_tritium_power_density_due_to_fusion). This
    energy-release quantity includes neutron and charged-particle product energy
    and is distinct from fusion neutron emissivity.
  unit: W.m^-3

- name: deuterium_deuterium_power_density_due_to_fusion
  description: |-
    Local volumetric power density from deuterium-deuterium thermonuclear
    reactions, including energy carried by both the neutron-producing and
    proton-producing branches and characterized by their branch-weighted
    per-reaction Q value.
  documentation: |-
    The D-D fusion power density is the local rate at which deuterium-deuterium
    thermonuclear reactions $D + D \rightarrow {}^3\mathrm{He} + n$ and $D + D
    \rightarrow T + p$ release energy per unit plasma volume. It includes both
    the neutron-producing branch and the proton-producing branch, so it
    represents branch-summed D-D fusion energy release rather than only
    neutron-branch energy.

    For a thermal deuterium population, the branch-summed power density is

    $$
    P_{\mathrm{DD}}(\mathbf{x}) = \frac{1}{2} n_D(\mathbf{x})^2 \left[\langle\sigma v\rangle_n Q_n + \langle\sigma v\rangle_p Q_p\right]
    $$

    where $n_D$ is the deuterium ion number density in m$^{-3}$, $\langle\sigma
    v\rangle_n$ and $\langle\sigma v\rangle_p$ are the thermonuclear rate
    coefficients in m$^3$ s$^{-1}$ for the helium-3-neutron and tritium-proton
    branches, $Q_n$ and $Q_p$ are the corresponding branch energies in joules,
    and the factor $1/2$ avoids double counting identical deuteron pairs. The
    branch Q-values are $Q_n = 3.27\,\mathrm{MeV}$ for $D + D \rightarrow
    {}^3\mathrm{He} + n$ and $Q_p = 4.03\,\mathrm{MeV}$ for $D + D \rightarrow T
    + p$; equal branch probabilities give a branch-weighted $Q_{\mathrm{DD}}
    \simeq 3.65\,\mathrm{MeV}$ per D-D reaction, to be converted to joules in
    the equation.

    The displayed expression is the thermal-thermal specialization of the
    definition. For beam-thermal, beam-beam, or otherwise non-Maxwellian
    deuteron populations, $P_{\mathrm{DD}}$ is still the branch-summed local
    energy-release rate, with each branch reaction-rate density multiplied by
    its branch energy rather than using Maxwellian rate coefficients. This
    quantity is the D-D channel instance of [fusion power
    density](name:power_density_due_to_fusion); it includes neutron and
    charged-particle product energy and is distinct from fusion neutron
    emissivity, from deposited heating of fusion products, and from [D-T fusion
    power density](name:deuterium_tritium_power_density_due_to_fusion).
  unit: W.m^-3

- name: deuterium_tritium_power_density_due_to_fusion
  description: |-
    Local volumetric rate of energy release from deuterium-tritium thermonuclear
    reactions, including energy carried by the alpha-particle and neutron
    products and characterized by the D-T channel Q value.
  documentation: |-
    The D-T fusion power density is the local rate at which deuterium-tritium
    thermonuclear reactions release energy per unit plasma volume. It includes
    the birth energy of both reaction products, the alpha particle and the
    neutron, through the D-T channel energy release.

    The defining reaction-rate expression is

    $$
    P_{\mathrm{DT}}(\mathbf{x}) = n_D(\mathbf{x})\,n_T(\mathbf{x})\,\langle\sigma v\rangle_{\mathrm{DT}}\,E_{\mathrm{DT}}
    $$

    where $\mathbf{x}$ is spatial position, $P_{\mathrm{DT}}$ is D-T fusion
    power density, $n_D$ is deuterium reactant number density, $n_T$ is tritium
    reactant number density, $\langle\sigma v\rangle_{\mathrm{DT}}$ is the
    reaction-rate coefficient for deuterium-tritium fusion, and
    $E_{\mathrm{DT}}$ is the total energy released per deuterium-tritium
    reaction.

    It is defined locally for plasma containing deuterium and tritium reactants
    and has no spatial aggregation: line-integrated, flux-surface-averaged,
    volume-integrated, and total fusion power quantities are distinct. It is
    channel-specific, so it excludes deuterium-deuterium and other fusion
    reaction channels, and it is not the local deposited heating power from
    alpha particles or neutrons after they are born.

    Deuterium-tritium fusion power density is the D-T channel contribution to
    [fusion power density](name:power_density_due_to_fusion); a channel-summed
    fusion power density adds it to other included channel contributions such as
    [deuterium-deuterium fusion power
    density](name:deuterium_deuterium_power_density_due_to_fusion). Because each
    deuterium-tritium reaction produces one neutron, [D-T fusion
    emissivity](name:deuterium_tritium_emissivity_due_to_fusion) is the
    corresponding reaction-rate density, and multiplying that emissivity by
    $E_{\mathrm{DT}}$ gives the D-T fusion power density.
  unit: W.m^-3

- name: power_density_due_to_radiation
  description: |-
    Local volumetric rate at which plasma energy is converted into emitted
    electromagnetic radiation, with positive values denoting energy loss from
    the plasma.
  documentation: |-
    Radiative power density is the local rate of electromagnetic energy emission
    per unit volume, summed over the radiation mechanisms included by the
    physical model. It describes energy leaving the plasma as radiation rather
    than energy transferred through collisional, conductive, or convective
    channels.

    $$
    p_{\mathrm{rad}} = \frac{\partial E_{\mathrm{rad}}}{\partial V\,\partial t}
    $$

    where $p_{\mathrm{rad}}$ is the radiative power density, $E_{\mathrm{rad}}$
    is emitted electromagnetic energy, $V$ is plasma volume, and $t$ is time. As
    a radiative specialization of power_density, it may include line radiation,
    continuum radiation, and other modeled emission processes; it excludes
    energy that remains in the plasma or is transferred by nonradiative
    channels.

    Sign convention: Positive when energy leaves the plasma as emitted
    electromagnetic radiation.
  unit: W.m^-3

- name: power_due_to_line_radiation
  description: |-
    Total electromagnetic power emitted in discrete spectral lines by
    bound-bound transitions of plasma atoms and ions.
  documentation: |-
    Line-radiation power is the volume-integrated electromagnetic emission from
    bound-bound transitions of atomic and ionic populations in the plasma. It
    represents the energy carried by discrete spectral lines and is a radiative
    loss from the emitting plasma.

    For downward transitions, the emitted power is defined by

    $$
    P_{\mathrm{line}} = \int_V \sum_s \sum_{i>j} n_{s,i} A_{s,ij} h\nu_{s,ij}\,dV
    $$

    where $V$ is the emitting plasma volume, $n_{s,i}$ is the population density
    of upper state $i$ of species $s$ in m$^{-3}$, $A_{s,ij}$ is the transition
    probability in s$^{-1}$, $h$ is Planck's constant, and $\nu_{s,ij}$ is the
    emitted-photon frequency in s$^{-1}$. The sums include all specified atomic
    and ionic emitters and radiative transitions.

    This quantity includes line emission from hydrogenic and impurity species,
    but excludes continuum bremsstrahlung represented by
    [bremsstrahlung_power](name:bremsstrahlung_power) and other channels such as
    [power_due_to_synchrotron_radiation](name:power_due_to_synchrotron_radiation).
    It contributes to
    [total_plasma_radiated_power](name:total_plasma_radiated_power), while
    power_due_to_impurity_radiation covers the impurity-specific component.
  unit: W

- name: power_due_to_synchrotron_radiation
  description: |-
    Total electromagnetic power emitted by relativistic electrons as synchrotron
    radiation while their gyromotion is curved by the plasma magnetic field.
  documentation: |-
    Power due to synchrotron radiation is the total electromagnetic power
    emitted by relativistic electrons as synchrotron radiation while their
    gyromotion is curved by the plasma magnetic field. It is a
    mechanism-specific contribution to the plasma radiative power and refers to
    emitted radiation, not stored electromagnetic energy.

    For an emitting plasma volume $V$, the quantity is defined by the volume
    integral of the local synchrotron volumetric emissivity:

    $$
    P_{\mathrm{syn}} = \int_V p_{\mathrm{syn}}(\mathbf{x})\,dV
    $$

    where $P_{\mathrm{syn}}$ is the power due to synchrotron radiation,
    $p_{\mathrm{syn}}(\mathbf{x})$ is the local synchrotron volumetric
    emissivity formed from the relativistic electron phase-space distribution
    and the local magnetic field, $\mathbf{x}$ denotes position, and $dV$ is a
    volume element.

    This quantity includes only synchrotron emission and excludes
    [bremsstrahlung power](name:bremsstrahlung_power) and [power due to line
    radiation](name:power_due_to_line_radiation). It denotes gross
    electromagnetic power emitted by the radiating electrons and is distinct
    from net synchrotron power escaping a plasma-facing or material boundary
    after reabsorption or reflection.
  unit: W

- name: power_of_soft_xray_detector
  description: |-
    Band-integrated radiant power received by a soft X-ray detector channel over
    its selected photon-energy band or bands.
  documentation: |-
    Soft X-ray detector power is the radiant power carried by incident soft
    X-ray photons and received by one detector channel after spectral selection.
    It represents radiation power rather than the detector’s electrical output.

    For a selected photon-energy band, the received power is defined by:

    $$
    P_{\mathcal{B}} = \int_{\mathcal{B}} E\,\Phi_E(E)\,dE
    $$

    where $P_{\mathcal{B}}$ is the received power for band $\mathcal{B}$, $E$ is
    photon energy, $\Phi_E(E)$ is the photon arrival-rate density as a function
    of photon energy, $\mathcal{B}$ is the selected energy interval, and $dE$ is
    an infinitesimal photon-energy interval.

    The quantity applies to soft X-ray radiation received by a particular
    detector channel and is integrated over photon energy within its selected
    bandpass. It is not summed over detector channels, viewing directions, or
    distinct energy bands; when multiple bands are resolved, each band has its
    own band-integrated received-power value. It excludes plasma-emitted power
    before arrival at the detector and electrical power generated by detector
    electronics.

    The quantity is distinct from
    [spectral_efficiency_of_soft_xray_detector](name:spectral_efficiency_of_soft_xray_detector),
    which describes the probability of registering an incident photon rather
    than the received radiant power. It is also distinct from
    [hard_xray_brightness](name:hard_xray_brightness), which describes photon
    radiance rather than the power collected by a channel over its energy band
    and collection geometry.
  unit: W

- name: radiated_power_over_core_region
  description: |-
    Radiated power over the core region is the electromagnetic energy emitted
    per unit time, summed over all emitting plasma species and the full photon
    spectrum.
  documentation: |-
    Radiated power over the core region is the total rate at which plasma in
    that region emits energy as electromagnetic radiation. It is integrated over
    the region's emitting volume.

    The defining volume integral is

    $$
    P = \int_{V_{\rm core}} p_{\rm rad}\,dV
    $$

    where $P$ is the radiated power over the core region, $V_{\rm core}$ is the
    integration volume, $p_{\rm rad}$ is the local [radiated power
    density](name:radiated_power_density), and $dV$ is a volume element.

    The quantity sums contributions from all emitting plasma species and charge
    states over the full photon spectrum and all emission directions. It
    excludes radiation emitted outside the core region and nonradiative
    conductive and convective energy transport.

    It is the core-region contribution to [total plasma radiated
    power](name:total_plasma_radiated_power), whose spatial integral covers the
    entire emitting plasma volume. The [core-region power due to impurity
    radiation](name:radiated_power_over_core_region_due_to_impurity_radiation)
    is only the impurity-radiation component, not the full quantity.
  unit: W

- name: radiative_extraordinary_mode_temperature_at_ece_channel
  description: |-
    Predicted equivalent blackbody temperature of extraordinary-mode electron
    cyclotron emission evaluated at a frequency-selective ECE channel.
  documentation: |-
    The extraordinary-mode radiative temperature is the blackbody-equivalent
    temperature assigned to the predicted electron cyclotron emission in the
    extraordinary polarization at an ECE channel. It represents radiation
    intensity, not the kinetic temperature of the emitting electrons.

    The defining radiance equivalence is

    $$
    I_{\nu,X} = B_\nu\left(T_{\mathrm{rad},X}\right)
    $$

    where $I_{\nu,X}$ is the predicted extraordinary-mode spectral radiance,
    $\nu$ is the channel's selected emission frequency, $X$ identifies the
    extraordinary polarization, $B_\nu$ is the blackbody spectral-radiance
    function, and $T_{\mathrm{rad},X}$ is the corresponding radiative
    temperature.

    This quantity is resolved for the extraordinary polarization and evaluated
    at the frequency associated with one ECE channel; it is not a sum over
    channels, polarizations, or emission modes, and it excludes the
    ordinary-mode contribution. The [radiative ordinary-mode temperature at an
    ECE channel](name:radiative_ordinary_mode_temperature_at_ece_channel) is the
    corresponding ordinary-polarization quantity, while [radiative temperature
    at an ECE channel](name:radiative_temperature_at_ece_channel) denotes the
    channel-level radiation temperature without this extraordinary-mode
    restriction. Differences between the predicted extraordinary-mode value and
    a measured channel radiation temperature can indicate mode coupling or
    optical-depth effects.
  unit: eV

- name: radiative_ordinary_mode_temperature_at_ece_channel
  description: |-
    Predicted equivalent blackbody temperature of ordinary-mode electron
    cyclotron emission at a frequency-selective ECE channel.
  documentation: |-
    This quantity is the equivalent blackbody temperature associated with
    radiation emitted in the ordinary polarization mode of electron cyclotron
    emission. It represents the theoretically predicted O-mode emission
    intensity rather than the kinetic temperature of the electron population.

    The radiation temperature is defined by equating the ordinary-mode spectral
    radiance to that of a blackbody at the same frequency:

    $$
    I_{\nu}^{\mathrm{O}} = B_{\nu}\!\left(T_{\mathrm{rad}}^{\mathrm{O}}\right)
    $$

    where $I_{\nu}^{\mathrm{O}}$ is the predicted ordinary-mode spectral
    radiance, $B_{\nu}$ is the blackbody spectral-radiance function, $\nu$ is
    the channel frequency, and $T_{\mathrm{rad}}^{\mathrm{O}}$ is the
    corresponding ordinary-mode radiation temperature.

    The quantity applies specifically to ordinary-mode propagation at the
    frequency-selective ECE channel and is not a sum or average over
    polarization modes or channel frequencies. It is distinct from the
    extraordinary-mode radiation temperature, represented by [radiative
    extraordinary-mode temperature at an ECE
    channel](name:radiative_extraordinary_mode_temperature_at_ece_channel), and
    from the mode-agnostic [radiative temperature at an ECE
    channel](name:radiative_temperature_at_ece_channel).
  unit: eV

- name: radius_of_bragg_crystal
  description: |-
    Geometric distance from the center of a circular Bragg-crystal aperture to
    the edge of its active diffracting surface.
  documentation: |-
    The Bragg-crystal aperture radius is the transverse geometric extent of the
    circular active diffracting surface, measured from its center to its
    circumferential edge. It describes aperture size rather than the curvature
    of the crystal substrate.

    For a boundary point of the aperture, the radius is defined by

    $$
    r_{\mathrm{ap}} = \left\lVert \mathbf{x}_{\mathrm{edge}} - \mathbf{x}_{\mathrm{center}} \right\rVert
    $$

    where $r_{\mathrm{ap}}$ is the aperture radius, and
    $\mathbf{x}_{\mathrm{edge}}$ and $\mathbf{x}_{\mathrm{center}}$ are position
    vectors in the aperture plane, with $r_{\mathrm{ap}}$ expressed in meters.

    For an ideal circular aperture, this distance is the same for every boundary
    point. It is analogous to the [radius of a diagnostic
    aperture](name:radius_of_diagnostic_aperture), but must not be confused with
    the toroidal curvature of the Bragg crystal or its [vertical
    curvature](name:vertical_curvature_of_bragg_crystal).
  unit: m

- name: ratio_of_neutral_density_of_isotope_to_difference_of_total_neutral_density_and_neutral_density_of_isotope
  description: |-
    Odds ratio of the neutral density of a selected hydrogen isotope to the
    summed neutral density of all other hydrogen isotopes, distinguishing
    composition odds from total isotope fraction.
  documentation: |-
    This quantity is the neutral-population odds ratio for one selected hydrogen
    isotope relative to all other hydrogen isotopes. It characterizes isotope
    composition using neutral atoms only, with the comparison population
    aggregated across every other isotope.

    $$
    R_i = \frac{n_i}{\sum_{j \ne i} n_j}
    $$

    Here, $R_i$ is the isotope density ratio, $i$ identifies the selected
    hydrogen isotope, $n_i$ is its neutral number density, and $n_j$ is the
    neutral number density of another hydrogen isotope. The summation includes
    all hydrogen isotopes other than the selected isotope.

    The denominator is a total over the other neutral isotope populations, while
    the numerator contains only the selected isotope. This quantity excludes
    ionized populations and differs from
    [total_hydrogenic_density](name:total_hydrogenic_density), which includes
    the hydrogenic population across its applicable charge states and isotopes.
    It is an odds ratio rather than the selected isotope's fraction of the total
    neutral population; if $f_i$ denotes that corresponding neutral isotope
    fraction, then $f_i = R_i/(1+R_i)$.
  unit: '1'

- name: reference_calibration_wavelength_of_spectrometer_channel
  description: |-
    Reference calibration wavelength of a spectrometer channel is the zero-pixel
    intercept of its linear pixel-to-vacuum-wavelength relation.
  documentation: |-
    Wavelength of spectrometer channel

    The defining calibration relation is

    $$
    \lambda(k) = g\,k + \lambda_{\mathrm{off}}
    $$

    where $\lambda(k)$ is the calibrated vacuum [wavelength] assigned to pixel
    index $k$, $g$ is the dispersion gain giving the wavelength change per index
    increment, and $\lambda_{\mathrm{off}}$ is the reference calibration
    wavelength. Pixel indexing starts at one.

    The intercept is the extrapolated value at zero pixel index, not the
    wavelength assigned to the first pixel; the latter is
    $\lambda(1)=g+\lambda_{\mathrm{off}}$. Its calibration-intercept role is
    distinct from the response-center role of the [reference wavelength of a
    spectrometer channel](name:reference_wavelength_of_spectrometer_channel).
  unit: m

- name: reference_wavelength_of_spectrometer_channel
  description: |-
    Reference wavelength of a spectrometer channel is the absolute vacuum
    wavelength at the center of its spectral instrument function; a bin-specific
    value refers to the center of that detector bin's response.
  documentation: |-
    Wavelength of spectrometer channel

    The reference wavelength is the absolute vacuum wavelength at the center of
    the channel's spectral instrument function. It is a response-position
    wavelength, distinct from the wavelength of a spectral line or a wavelength
    selected as a calibration reference.

    The response-center wavelength is defined by

    $$
    \lambda_{\mathrm{ref}} = \operatorname{center}_{\lambda}\!\left[\mathcal{I}_{\mathrm{ch}}(\lambda)\right]
    $$

    where $\lambda_{\mathrm{ref}}$ is the reference wavelength,
    $\mathcal{I}_{\mathrm{ch}}(\lambda)$ is the channel's spectral instrument
    function as a function of $\lambda$, $\lambda$ is [vacuum wavelength], and
    $\operatorname{center}_{\lambda}$ denotes the wavelength coordinate at the
    center of the response function.

    The value applies to the channel response or, when specified for a vertical
    detector bin, that bin's response; it is not an average across bins. The
    response spread about this center is characterized separately by the [width
    of a spectrometer channel](name:width_of_spectrometer_channel). The
    [reference calibration wavelength of a spectrometer
    channel](name:reference_calibration_wavelength_of_spectrometer_channel) is
    distinct: it is the zero-pixel intercept of a linear
    pixel-to-vacuum-wavelength relation.
  unit: m

- name: relative_humidity_of_detector
  description: |-
    Ratio of ambient water-vapor partial pressure to its saturation vapor
    pressure at the detector, describing local moisture conditions that can
    affect detector performance.
  documentation: |-
    Relative humidity at the detector is the ambient water-vapor content
    expressed relative to the maximum water-vapor content supported at the local
    air temperature.

    It is defined by

    $$
    RH = \frac{p_{\mathrm{H_2O}}}{p_{\mathrm{sat}}(T)}
    $$

    where $RH$ is relative humidity, $p_{\mathrm{H_2O}}$ is the partial pressure
    of water vapor surrounding the detector, $p_{\mathrm{sat}}(T)$ is the
    saturation vapor pressure of water, and $T$ is the local air temperature.
    The reported fraction is bounded from 0 to 1.

    This quantity describes the environmental moisture condition at the detector
    and is not absolute humidity, air temperature, or a detector-response
    property. It is distinct from an intrinsic detection metric such as
    [spectral efficiency of a hard X-ray
    detector](name:spectral_efficiency_of_hard_xray_detector), which describes
    photon-registration probability rather than the surrounding environment.
  unit: '1'

- name: second_local_tangential_coordinate_of_bragg_crystal
  description: |-
    Signed coordinate of a Bragg-crystal outline vertex along the second local
    tangential axis of the crystal-local Cartesian (X1, X2) frame.
  documentation: |-
    This quantity is the signed position of a vertex on the Bragg-crystal
    outline, resolved along the crystal-local second tangential direction. It
    describes the crystal geometry in the local planar Cartesian frame $(X_1,
    X_2)$ rather than in the machine cylindrical frame.

    For a vertex position vector $\mathbf{r}$ and local-frame origin
    $\mathbf{r}_0$, the coordinate is defined by:

    $$
    x_2 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_2
    $$

    where $x_2$ is the second local tangential coordinate, $\hat{\mathbf{e}}_2$
    is the unit vector along the second local tangential axis, and
    $\mathbf{r}_0$ is the origin of the crystal-local frame. Together with the
    [first local tangential coordinate of the Bragg
    crystal](name:first_local_tangential_coordinate_of_bragg_crystal), it
    specifies the in-plane location of the outline vertex.

    Sign convention: Positive when the vertex displacement from the
    crystal-local origin has a positive projection along the second local
    tangential unit vector $\hat{\mathbf{e}}_2$.
  unit: m

- name: second_local_tangential_coordinate_of_diagnostic_aperture
  description: |-
    Signed coordinate of an individual diagnostic-aperture outline vertex along
    the second local tangential direction, measured from the aperture-local
    origin.
  documentation: |-
    The second local tangential coordinate of a diagnostic-aperture outline
    vertex is the signed component of the vertex's displacement from the
    aperture-local origin along the second local tangential direction. It
    applies to each outline vertex individually.

    For an outline vertex with position vector $\mathbf{r}_v$, its coordinate is
    defined by the projection:

    $$
    X_2 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_2
    $$

    where $X_2$ is the second local tangential coordinate, $\mathbf{r}_v$ is the
    position vector of the outline vertex, $\mathbf{r}_0$ is the position vector
    of the aperture-local origin, and $\hat{\mathbf{e}}_2$ is the unit vector
    along the positive second local tangential direction.

    Each value describes one vertex, not an average across vertices or an
    aperture width; it is a tangential displacement, not a displacement along
    the aperture normal. Paired with the [first local tangential coordinate of
    the diagnostic aperture] for the same vertex, it specifies that vertex's
    position in the outline. Together, the paired coordinates of the outline
    vertices define the aperture boundary and its
    [area](name:area_of_diagnostic_aperture).

    Sign convention: Positive when the vertex displacement from the
    aperture-local origin projects along the positive second local tangential
    direction.
  unit: m

- name: second_local_tangential_coordinate_of_filter
  description: |-
    Second local tangential coordinate of a filter boundary point is the signed
    position of that point along the filter's second in-plane basis direction in
    the object-local planar frame attached to the filter.
  documentation: |-
    Second local tangential coordinate of a filter boundary point is the signed
    scalar coordinate obtained by projecting the point's displacement from the
    filter local-frame origin onto the filter's second local tangential
    direction. It is paired with the [first local tangential coordinate of a
    filter](name:first_local_tangential_coordinate_of_filter) to locate points
    in the filter plane.

    The coordinate is defined by the projection

    $$
    u_{2,f} = (\mathbf{r} - \mathbf{r}_{0,f}) \cdot \hat{\mathbf{t}}_{2,f}
    $$

    where $u_{2,f}$ is this coordinate, $\mathbf{r}$ is the position vector of
    the filter boundary point, $\mathbf{r}_{0,f}$ is the filter local-frame
    origin, and $\hat{\mathbf{t}}_{2,f}$ is the second local tangential unit
    vector of the filter.

    The filter local frame is object-local: $\hat{\mathbf{t}}_{1,f}$ and
    $\hat{\mathbf{t}}_{2,f}$ lie in the filter plane. The first local tangential
    unit vector is chosen with positive projection along increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame; the
    second local tangential unit vector completes the oriented in-plane basis
    with the filter normal, so that $\hat{\mathbf{t}}_{1,f} \times
    \hat{\mathbf{t}}_{2,f}$ points along the positive filter normal. This
    quantity refers to the filter boundary itself, not to the [second local
    tangential coordinate of a filter
    window](name:second_local_tangential_coordinate_of_filter_window).

    Sign convention: Positive when the displacement from the filter local-frame
    origin to the point has positive projection on the second local tangential
    unit vector of the filter.
  unit: m

- name: second_local_tangential_coordinate_of_hard_xray_detector
  description: |-
    Signed coordinate of a hard X-ray detector outline vertex along the second
    local tangential axis of the right-handed detector-local Cartesian basis
    (first local tangential, second local tangential, local normal).
  documentation: |-
    Second local tangential coordinate of a hard X-ray detector is the signed
    scalar coordinate of a detector outline vertex along the detector-local
    second tangential direction. It is defined in the right-handed object-local
    Cartesian basis $(\hat{\mathbf e}_1, \hat{\mathbf e}_2, \hat{\mathbf e}_3)$,
    where $\hat{\mathbf e}_1$ is the first local tangential unit vector,
    $\hat{\mathbf e}_3$ is the detector-local normal unit vector, and
    $\hat{\mathbf e}_2 = \hat{\mathbf e}_3 \times \hat{\mathbf e}_1$.

    The coordinate $q_2$ of a vertex at position $\mathbf r$ is the signed
    projection of its displacement from the detector-local origin:

    $$
    q_2 = (\mathbf r - \mathbf r_0) \cdot \hat{\mathbf e}_2
    $$

    where $\mathbf r_0$ is the detector-local origin and $\hat{\mathbf e}_2$ is
    the second local tangential unit vector.

    Only the component along $\hat{\mathbf e}_2$ is included. The companion
    coordinate along $\hat{\mathbf e}_1$ is the first local tangential
    coordinate of a hard X-ray detector; neither quantity is a radial, toroidal,
    or vertical component in the right-handed cylindrical $(R, \phi, Z)$ frame.

    Sign convention: Positive when the vertex displacement from the
    detector-local origin is toward $\hat{\mathbf e}_3 \times \hat{\mathbf
    e}_1$.
  unit: m

- name: second_local_tangential_coordinate_of_optical_element
  description: |-
    Signed position of a fiber center or outline vertex at an optical element
    along its second local tangential axis, measured relative to the
    element-local origin.
  documentation: |-
    The second local tangential coordinate locates an individual fiber center or
    outline vertex at an optical element. It belongs to the element-local
    Cartesian frame $(X_1, X_2)$, where $X_1$ and $X_2$ denote coordinates along
    the first and second local tangents, respectively.

    The coordinate is defined by

    $$
    X_2 = (\mathbf{r}-\mathbf{r}_0)\cdot\hat{\mathbf{t}}_2
    $$

    where $\mathbf{r}$ is the position vector of the specified point,
    $\mathbf{r}_0$ is the position vector of the element-local origin, and
    $\hat{\mathbf{t}}_2$ is the unit vector along the positive second local
    tangent.

    Each value describes one fiber center or outline vertex, not an average over
    those points. Fiber-center coordinates locate individual fibers, whereas
    outline coordinates locate boundary vertices; neither denotes an element
    width or a surface-normal displacement. The second tangent is object-local
    and is not prescribed to be vertical.

    For fiber-center positions in a fiber bundle, the [first local tangential
    coordinate of the fiber bundle] supplies the complementary coordinate of the
    same center in the local plane.

    Sign convention: Positive when the displacement from the element-local
    origin has a positive projection onto the designated second local tangential
    axis.
  unit: m

- name: second_local_tangential_coordinate_of_soft_xray_detector
  description: |-
    Signed coordinate of a soft X-ray detector outline vertex along the second
    local tangential (X2) axis of the detector-local right-handed Cartesian
    frame.
  documentation: |-
    The second local tangential coordinate $x_2$ locates a vertex of the soft
    X-ray detector outline along the X2 axis of the detector-local frame. In
    this right-handed Cartesian triad, X3 is the detector's outward
    plasma-facing surface normal, X1 is the first local tangential axis directed
    more horizontally toward the direction of increasing toroidal angle $\phi$,
    and X2 = X3 $\times$ X1 completes the right-handed triad. The ordered set of
    $(x_1, x_2)$ vertex pairs defines the detector boundary polygon in the X1–X2
    plane; $x_1$ is given by [first local tangential
    coordinate](name:first_local_tangential_coordinate_of_soft_xray_detector).
    Together the two tangential coordinates fully specify the detector aperture
    geometry in the object-local frame, distinct from the aperture outline given
    by [second local tangential coordinate of a diagnostic
    aperture](name:second_local_tangential_coordinate_of_diagnostic_aperture).
  unit: m

- name: second_local_tangential_front_surface_radius_of_optical_element
  description: |-
    Signed radius of curvature of an optical element's beam-entry front surface
    along its second object-local tangent, for cylindrical or toroidal surface
    models.
  documentation: |-
    The second local tangential front-surface radius of an optical element is
    the signed [radius](name:radius) of curvature in the normal section
    containing the second local tangent and the front-surface normal. It
    describes the beam-entry surface along an object-local direction, not an
    externally defined vertical direction.

    In the right-handed object-local frame $(\hat{X}_1,\hat{X}_2,\hat{z})$,
    $\hat{X}_1$ and $\hat{X}_2$ are the first and second tangents at the surface
    vertex, and $\hat{z}$ is the chosen front-surface normal. With planar tilt
    removed at the vertex, the defining relation is:

    $$
    \frac{1}{R}=\left.\frac{d^2 z}{d x_2^2}\right|_{x_2=0}
    $$

    where $R$ is the signed second-local-tangential front-surface radius, $x_2$
    is displacement along $\hat{X}_2$ from the vertex, and $z(x_2)$ is the
    front-surface sag along $\hat{z}$ in this normal section, measured relative
    to the vertex tangent plane. A flat section is the limiting case $1/R=0$.

    This quantity applies to cylindrical or toroidal front-surface models. It is
    a radius of curvature, not reciprocal curvature or the geometric [aperture
    radius](name:radius_of_optical_element), and it does not describe the back
    surface.

    The [first-local-tangential front-surface
    radius](name:first_local_tangential_front_surface_radius_of_optical_element)
    describes the orthogonal normal section and need not equal this radius. The
    accepted [vertical front-surface
    radius](name:vertical_front_surface_radius_of_optical_element) denotes the
    same object-local second-direction quantity despite its different
    directional label.

    Sign convention: Positive when the center of curvature of the front-surface
    normal section lies on the $+\hat{z}$ side of the local tangent plane.
  unit: m

- name: spectral_efficiency_of_filter
  description: |-
    Wavelength-resolved probability that a photon incident on a diagnostic
    filter produces a registered detection event after wavelength-dependent
    transmission and detection losses.
  documentation: |-
    The wavelength-resolved filter efficiency is the conditional probability
    that a photon arriving at the filter input with wavelength $\lambda$
    produces a registered detection event. It includes the wavelength-dependent
    transmission and conversion losses of the filter, optical path, detector,
    and readout chain, and is distinct from material absorptivity alone.

    $$
    \eta_{\mathrm{filter}}(\lambda)=P(\mathrm{registered\ detection}\mid\mathrm{photon\ incident\ at\ wavelength\ }\lambda)
    $$

    Here, $\lambda$ is the photon wavelength and $P$ denotes a conditional
    probability. The parent efficiency of filter is the
    incident-spectrum-weighted average of this response, with weighting supplied
    by the incident spectral flux over the relevant wavelength range.
    Consequently, this quantity is dimensionless and bounded from 0 to 1.
  unit: '1'

- name: spectral_efficiency_of_hard_xray_detector
  description: |-
    Energy-dependent probability that a photon impacting a hard X-ray detector
    is registered by its detection system.
  documentation: |-
    This quantity is the conditional photon-registration probability for a hard
    X-ray detector at a specified photon energy. It characterizes the detector
    response after a photon has impacted the detector, rather than the incident
    photon flux or the geometric collection probability.

    At photon energy $E$, the efficiency is defined by

    $$
    \epsilon(E) = \frac{N_{\mathrm{registered}}(E)}{N_{\mathrm{incident}}(E)}
    $$

    where $N_{\mathrm{registered}}(E)$ is the number of impacting photons
    registered by the detector and $N_{\mathrm{incident}}(E)$ is the number of
    photons impacting it at energy $E$. The efficiency is bounded between zero
    and one and is the hard-X-ray counterpart of [spectral efficiency of a soft
    X-ray detector](name:spectral_efficiency_of_soft_xray_detector).
  unit: '1'

- name: spectral_efficiency_of_soft_xray_detector
  description: |-
    Energy-resolved probability that a photon incident on a soft X-ray detector
    produces a registered event, defining the detector’s spectral response.
  documentation: |-
    The spectral detection efficiency is the probability that an incident photon
    at a specified energy produces a registered detector event. It characterizes
    the detector response, rather than the incident photon flux or the emitted
    X-ray radiance.

    The efficiency is defined by

    $$
    \eta(E) = \frac{N_{\mathrm{registered}}(E)}{N_{\mathrm{incident}}(E)}
    $$

    where $E$ is photon energy, $N_{\mathrm{incident}}(E)$ is the number of
    photons incident at that energy, and $N_{\mathrm{registered}}(E)$ is the
    number producing registered events. For a probability-based detector
    response, $0 \leq \eta(E) \leq 1$. The energy dependence distinguishes this
    quantity from the band-integrated [power of the soft X-ray
    detector](name:power_of_soft_xray_detector) and makes it the soft-X-ray
    counterpart of [spectral efficiency of the hard X-ray
    detector](name:spectral_efficiency_of_hard_xray_detector).
  unit: '1'

- name: spectral_etendue_of_soft_xray_detector
  description: |-
    Response-weighted optical phase-space acceptance of a spectrometer channel,
    combining collecting area and accepted ray directions across its wavelength
    response.
  documentation: |-
    Spectral étendue is the optical phase-space acceptance of one spectrometer
    channel after weighting its wavelength-dependent collecting area and
    accepted ray directions by the channel response. It represents
    response-weighted optical throughput rather than a wavelength interval or a
    calibration coefficient.

    The response-weighted étendue is defined by

    $$
    \mathcal{G}_{\mathrm{spec}} = \int w(\lambda)\,A_{\mathrm{eff}}(\lambda)\,\Omega_{\mathrm{acc}}(\lambda)\,d\lambda
    $$

    where $\mathcal{G}_{\mathrm{spec}}$ is the spectral étendue, $w(\lambda)$ is
    the normalized wavelength-response weighting, $\lambda$ is wavelength,
    $A_{\mathrm{eff}}(\lambda)$ is the effective collecting area, and
    $\Omega_{\mathrm{acc}}(\lambda)$ is the accepted solid angle. The weighting
    satisfies $\int w(\lambda)\,d\lambda = 1$.

    The quantity applies to radiation admitted by the specified spectrometer
    channel over its wavelength-response domain. It aggregates aperture
    acceptance, ray-direction acceptance, and wavelength response; it does not
    describe a particular plasma population or define a spatial emission region.

    It specializes the geometric acceptance represented by
    etendue_of_spectrometer_channel by incorporating spectral weighting. It is
    distinct from
    [effective_spectral_width_of_spectrometer_channel](name:effective_spectral_width_of_spectrometer_channel),
    which represents a response-equivalent wavelength interval, and from
    [spectral_calibration_factor_of_spectrometer_channel](name:spectral_calibration_factor_of_spectrometer_channel),
    which scales an instrument response to detector count rate.
  unit: m^2.sr

- name: spectral_signal_to_noise_ratio_of_spectrometer_channel
  description: |-
    Spectrometer-channel spectral signal-to-noise ratio is the scalar comparison
    of spectral power integrated over a selected signal wavelength interval with
    spectral power integrated over a line-free reference interval for the same
    channel. It names the shared signal/reference comparison; scale-specific
    child names define the numerical mapping.
  documentation: |-
    Spectrometer-channel spectral signal-to-noise ratio is the scalar comparison
    between selected spectral signal content and a line-free spectral reference
    for one spectrometer channel. Its physical content is the comparison of
    spectral power integrated over a selected signal wavelength interval with
    spectral power integrated over a selected line-free reference wavelength
    interval for the same channel.

    The scale-specific value is determined from the integrated spectral-power
    ratio:

    $$
    q = F\!\left(\frac{P_{\mathrm{sig}}}{P_{\mathrm{ref}}}\right)
    $$

    where $q$ is the spectrometer-channel spectral signal-to-noise ratio value,
    $F$ is the numerical scale mapping specified by the scale-specific member,
    $P_{\mathrm{sig}}$ is the spectral power integrated over the selected signal
    wavelength interval, and $P_{\mathrm{ref}}$ is the spectral power integrated
    over the selected line-free reference wavelength interval for the same
    spectrometer channel.

    The scope is one spectrometer channel and one selected pair of wavelength
    intervals. The aggregation convention is to integrate spectral power over
    each interval before applying $F$; the numerator is the signal interval and
    the denominator is the line-free reference interval. The reference interval
    supplies the noise/reference comparison and is not a second signal interval.

    This quantity is not an absolute spectral power, a pointwise spectral power
    density, a raw detector response, or a comparison between different
    spectrometer channels. As a parent quantity, it denotes the common
    signal/reference spectral-power comparison shared by scale-specific
    children; the [logarithmic spectral signal-to-noise ratio of a spectrometer
    channel](name:spectral_signal_to_noise_ratio_logarithm_of_spectrometer_channel)
    is the member that fixes $F$ to base-ten logarithmic scaling of the same
    integrated-power ratio.
  unit: dB

- name: spectral_wavelength_of_optical_element
  description: |-
    Wavelength at an optical element specifies the vacuum spectral position at
    which its transmission, absorption, or other wavelength-dependent optical
    properties are evaluated.
  documentation: |-
    Wavelength of optical element

    The defining relation is

    $$
    \lambda = \frac{c}{\nu}
    $$

    where $\lambda$ is the vacuum wavelength, $c$ is the speed of light in
    vacuum, and $\nu$ is the radiation frequency.

    Each value denotes a spectral evaluation point, not a response amplitude or
    wavelength interval. It does not inherently designate a passband center or
    edge, and it denotes the vacuum wavelength rather than the wavelength within
    the element's material. The definition is not restricted to a particular
    spectral band.

    The [spectral refractive index of an optical
    element](name:spectral_refractive_index_of_optical_element) and, for a
    filter, the [spectral absorptivity](name:spectral_absorptivity_of_filter)
    are response quantities evaluated as functions of this wavelength.
  unit: m

- name: temperature_of_soft_xray_detector
  description: |-
    Thermodynamic temperature of the soft X-ray detector assembly, describing
    its physical thermal state for calibration and monitoring rather than a
    plasma temperature inferred from radiation.
  documentation: |-
    The quantity is the thermodynamic temperature of the physical soft X-ray
    detector assembly and describes the thermal state of its hardware.

    It applies to the detector object as a whole, with no implied plasma
    population, spatial subcomponent, or charge-state aggregation. It is
    distinct from the plasma electron temperature inferred from detected soft
    X-ray radiation and does not represent a photon-energy or spectral-response
    quantity.

    The temperature is the thermal operating state relevant to calibration and
    hardware-condition monitoring. It is conceptually analogous to [temperature
    of neutron detector](name:temperature_of_neutron_detector), while [spectral
    efficiency of soft X-ray
    detector](name:spectral_efficiency_of_soft_xray_detector) describes
    photon-registration probability rather than detector hardware temperature.
  unit: K

- name: thickness_of_bragg_crystal
  description: |-
    Physical thickness of a Bragg crystal is the normal material thickness
    measured between its opposing surfaces along the local surface normal. It
    excludes the X-ray ray-path length through the crystal, which depends on
    incidence geometry.
  documentation: |-
    Physical thickness of a Bragg crystal is the geometric separation of its
    opposing crystal surfaces measured along the local surface normal. It is a
    property of the crystal body, independent of the direction taken by an
    incident or diffracted X-ray ray.

    The local normal thickness is defined by

    $$
    t = \left| (\mathbf{x}_2 - \mathbf{x}_1) \cdot \hat{\mathbf{n}} \right|
    $$

    where $t$ is the Bragg-crystal thickness in meters, $\mathbf{x}_1$ and
    $\mathbf{x}_2$ are corresponding points on the two opposing crystal surfaces
    in meters, and $\hat{\mathbf{n}}$ is the unit normal to the local surface at
    $\mathbf{x}_1$.

    This quantity excludes the oblique material path length of an X-ray through
    the crystal; for an ideal flat slab that path length also depends on the ray
    angle relative to the local normal. It is distinct from
    [bragg_crystal_width](name:first_local_tangential_width_of_bragg_crystal)
    and height_of_bragg_crystal, which are tangential dimensions of the crystal
    element.
  unit: m

- name: thickness_of_optical_element
  description: |-
    Thickness of an optical element defined by the separation between its front
    and back surfaces along the element-local normal axis.
  documentation: |-
    Thickness of optical element

    The thickness is defined by

    $$
    d = \left\|\mathbf{r}_{\mathrm{back}}-\mathbf{r}_{\mathrm{front}}\right\|
    $$

    where $d$ is the thickness, and $\mathbf{r}_{\mathrm{front}}$ and
    $\mathbf{r}_{\mathrm{back}}$ are the position vectors of the front- and
    back-surface intersections with the same line parallel to the element-local
    normal axis.

    The quantity describes one element, not a combined thickness of multiple
    elements. It is distinct from the geometric path length of an obliquely
    propagating ray and from optical path length, which includes
    refractive-index weighting.

    The [first local tangential
    width](name:first_local_tangential_width_of_optical_element) and [second
    local tangential
    width](name:second_local_tangential_width_of_optical_element) describe the
    element's complementary tangential extents rather than its front-to-back
    separation.
  unit: m

- name: toroidal_angular_width_of_camera
  description: |-
    Full angular span of a camera field of view in the toroidal direction of the
    right-handed cylindrical (R, φ, Z) frame, equal to the non-negative
    difference between the largest and smallest unwrapped toroidal viewing
    angles.
  documentation: |-
    Full angular span of a camera field of view in the toroidal direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame is the non-negative difference
    between the largest and smallest limiting signed toroidal viewing angles
    subtended by the camera acceptance. In this frame $R$ is major radius,
    $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$, and
    $Z$ is vertical height.

    Let $\phi_{\min}$ and $\phi_{\max}$ be the minimum and maximum unwrapped
    signed toroidal viewing angles of the limiting accepted rays. The toroidal
    angular width is defined by:

    $$
    \Delta\phi_\mathrm{cam} = \phi_{\max} - \phi_{\min}
    $$

    where $\Delta\phi_\mathrm{cam}$ is the toroidal angular width of the camera
    and the extrema are taken over the camera field-of-view boundary after
    choosing a continuous branch of $\phi$.

    This quantity describes only the toroidal extent of the field of view. It
    excludes the central toroidal pointing angle, the detailed field-of-view
    footprint or optical distortion, and the complementary [vertical angular
    width](name:vertical_angular_width_of_camera).
  unit: rad

- name: toroidal_angular_width_of_spectrometer_channel
  description: |-
    Full toroidal angular width of the spectrometer-channel spatial-resolution
    region in the right-handed cylindrical (R, φ, Z) frame, including effective
    spatial-resolution broadening. The toroidal angle φ increases
    counterclockwise when viewed from above +Z.
  documentation: |-
    Full toroidal angular width of a spectrometer-channel spatial-resolution
    region is the non-negative span in toroidal angle covered by the region
    associated with that channel, including its effective spatial-resolution
    broadening. The toroidal angle $\phi$ is the angular coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $Z$ is vertical height, and $\phi$ increases counterclockwise when viewed
    from the $+\hat{Z}$ side.

    For a channel $c$ with spatial-resolution region $\Omega_c$, the width is

    $$
    \Delta\phi_c = \max_{\mathbf{x}\in\Omega_c} \tilde{\phi}(\mathbf{x}) - \min_{\mathbf{x}\in\Omega_c} \tilde{\phi}(\mathbf{x})
    $$

    where $\Delta\phi_c$ is the toroidal angular width, $\Omega_c$ is the
    spatial-resolution region of channel $c$, and $\tilde{\phi}(\mathbf{x})$ is
    a continuously unwrapped toroidal angle of point $\mathbf{x}$ over that
    region.

    It is an angular extent, not a center coordinate, orientation, or signed
    toroidal displacement. If the region crosses a toroidal-angle branch cut,
    the unwrapped angle is chosen so the expression gives the full physical span
    of the region; this width may be used as a geometric factor in viewing
    étendue, but it is not an étendue.
  unit: rad

- name: toroidal_coordinate_of_reflector
  description: |-
    Toroidal angular coordinate of the center of the sphere defining a
    reflector’s spherical mirror surface, locating that center around the
    symmetry axis.
  documentation: |-
    The quantity is the toroidal angle of the center of the sphere that defines
    a reflector’s spherical mirror surface. It identifies the reflector-center
    azimuth, not the mirror’s angular extent, orientation, or curvature.

    The toroidal angle $[?25l\phi_c$ of the sphere center is defined from its
    projection onto the horizontal plane:

    $$
    \phi_c = \operatorname{atan2}(y_c,x_c)
    $$

    where $x_c$ and $y_c$ are the center coordinates in the right-handed
    Cartesian basis $(\hat{x},\hat{y},\hat{z})$, with $\hat{z}=\hat{Z}$.
    Equivalently, $\phi_c$ is the angular coordinate in the right-handed
    cylindrical $(R,\phi,Z)$ frame. Its geometric meaning parallels [toroidal
    coordinate of an optical
    element](name:toroidal_coordinate_of_optical_element), but the locus here is
    the reflector sphere center.

    Sign convention: Positive when the angle is measured in the direction of
    increasing toroidal angle $\phi$, counter-clockwise when viewed from above
    along $+\hat{Z}$.
  unit: rad

- name: toroidal_coordinate_of_soft_xray_detector
  description: |-
    Toroidal angle of the geometric center of a soft X-ray detector in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the toroidal coordinate of the geometric center of a soft
    X-ray detector. The center is the detector geometry reference point,
    including the center of a circular detector or the origin of its local
    detector coordinate system.

    The toroidal angle is defined from the detector-center Cartesian
    coordinates:

    $$
    \phi_{\rm det} = \operatorname{atan2}(y_{\rm det}, x_{\rm det})
    $$

    where $x_{\rm det}$ and $y_{\rm det}$ are the Cartesian coordinate values of
    the detector center in the right-handed $(\hat{x}, \hat{y}, \hat{z})$ basis,
    with $\hat{z}=\hat{Z}$. The corresponding vertical location is given by the
    [vertical coordinate of the soft X-ray
    detector](name:vertical_coordinate_of_soft_xray_detector).

    Sign convention: Positive when the detector center lies in the direction of
    increasing toroidal angle $\phi$.
  unit: rad

- name: total_hydrogenic_density
  description: |-
    Hydrogen-isotope abundance measure derived from included charge states and
    isotopes, either averaged along a line or over a volume or used to normalize
    neutral-state density.
  documentation: |-
    Hydrogenic-density-derived quantities quantify the abundance of
    hydrogen-isotope particles with the included isotopic species and charge
    states. Depending on the derivative, the total density is averaged along a
    line, averaged over a volume, or used as the reference denominator for a
    neutral-state composition fraction.

    The underlying [hydrogenic density](name:hydrogenic_density) is defined by

    $$
    n_{\mathrm{H}} = \sum_{s \in \mathcal{H}} \sum_q n_{s,q}
    $$

    where $n_{\mathrm{H}}$ is the total hydrogenic number density, $\mathcal{H}$
    is the set of included hydrogen-isotope species, $q$ is charge state, and
    $n_{s,q}$ is the number density of species $s$ in state $q$.

    The line-averaged total hydrogenic density and volume-averaged total
    hydrogenic density retain density character under their respective averaging
    operations. The [neutral-state density
    ratio](name:ratio_of_neutral_state_density_to_total_hydrogenic_density) is
    instead a composition fraction formed by dividing a neutral charge-state
    density by $n_{\mathrm{H}}$, and is therefore not itself a density.
  unit: m^-3

- name: ratio_of_neutral_state_density_to_total_hydrogenic_density
  description: |-
    Abundance fraction of hydrogenic particles in a specified neutral internal
    state, defined as the neutral internal-state density divided by the total
    hydrogenic density. It is bounded from 0 to 1 when that state population is
    included in the denominator.
  documentation: |-
    Abundance fraction of hydrogenic particles in a specified neutral internal
    state is the number-density ratio between that state and the complete
    hydrogenic population. It represents the occupation of the specified neutral
    internal state within the hydrogenic ensemble.

    The fraction is defined by

    $$
    f_{n,s} = \frac{n_{n,s}}{n_{H,\mathrm{tot}}}
    $$

    where $n_{n,s}$ is the [neutral internal-state
    density](name:neutral_internal_state_density) for state $s$ and
    $n_{H,\mathrm{tot}}$ is the [total hydrogenic
    density](name:total_hydrogenic_density).

    The denominator is the total hydrogenic population, not only the neutral
    population or only the same internal-state manifold. For a state population
    that is part of the total hydrogenic population, $0 \le f_{n,s} \le 1$. This
    quantity differs from the [cold neutral
    fraction](name:cold_neutral_fraction), which partitions the hydrogenic
    population by cold-neutral component rather than by occupation of a single
    neutral internal state.
  unit: '1'

- name: total_plasma_radiated_power
  description: |-
    Total plasma radiated power is the electromagnetic energy emitted per unit
    time by all plasma species, integrated over the entire emitting volume and
    full photon spectrum.
  documentation: |-
    Total plasma radiated power is the rate at which the plasma emits energy as
    electromagnetic radiation, integrated over the entire emitting plasma
    volume.

    $$
    P_{\rm rad} = \int_{V_{\rm plasma}} \epsilon_{\rm rad}(\mathbf{x})\,dV
    $$

    where $P_{\rm rad}$ is total plasma radiated power, $V_{\rm plasma}$ is the
    emitting plasma volume, $\epsilon_{\rm rad}$ is the local electromagnetic
    power emitted per unit volume, $\mathbf{x}$ is spatial position, and $dV$ is
    a volume element. The emissivity includes all emitting species and charge
    states, summed over all electromagnetic emission processes and integrated
    over photon frequency and emission direction.

    This quantity describes whole-plasma emission, not the radiation intercepted
    by an individual detector or absorbed at a receiving surface. It excludes
    conductive and convective energy losses and energy carried away by neutrons
    or charged particles.

    The [bremsstrahlung power](name:bremsstrahlung_power) and [power due to line
    radiation](name:power_due_to_line_radiation) are mechanism-specific
    contributions to this total, which also includes recombination and other
    electromagnetic emission channels. The [radiated power over the core
    region](name:radiated_power_over_core_region) is a regional contribution
    rather than the whole-plasma aggregate.
  unit: W

- name: tritium_density
  description: |-
    Local number density of tritium ions in the plasma, the foundational
    fuel-ion parameter underlying chord-averaged, volume-averaged, and isotopic
    ratio child quantities.
  documentation: |-
    Tritium ion number density $n_T$ quantifies the local concentration of
    hydrogen-3 fuel ions in the plasma. It serves as the common physical basis
    for a family of derived quantities: the chord-integrated mean
    [line_averaged_tritium_density](name:line_averaged_tritium_density), the
    confined-volume mean
    [volume_averaged_tritium_density](name:volume_averaged_tritium_density), and
    dimensionless isotopic ratios such as
    ratio_of_tritium_density_to_electron_density and
    [ratio_of_tritium_density_to_deuterium_density](name:ratio_of_tritium_density_to_deuterium_density).

    In deuterium-tritium (DT) fusion plasmas the local volumetric reaction rate
    is:

    $$
    R_{DT} = n_T \, n_D \langle \sigma v \rangle_{DT}
    $$

    where $n_D$ is the deuterium ion number density and $\langle \sigma v
    \rangle_{DT}$ is the Maxwellian-averaged DT fusion reactivity. The combined
    DT fuel-ion purity relative to the electron population is tracked by
    ratio_of_deuterium_tritium_density_to_electron_density.

    Tritium density is inferred from active charge-exchange recombination
    spectroscopy, neutron emission measurements in DT plasmas, or pellet
    injection and fueling diagnostics.
  unit: m^-3

- name: ratio_of_tritium_density_to_deuterium_density
  description: |-
    Local ratio of tritium-ion to deuterium-ion number densities, expressing
    fuel-isotope composition independently of the total fuel-ion density.
  documentation: |-
    The local tritium-to-deuterium density ratio expresses the relative
    abundance of the two hydrogen-isotope fuel-ion populations at the same
    location. It is derived from the local [tritium
    density](name:tritium_density) and [deuterium
    density](name:deuterium_density).

    $$
    R_{T/D} = \frac{n_T}{n_D}
    $$

    where $R_{T/D}$ is the tritium-to-deuterium density ratio, and $n_T$ and
    $n_D$ are the local number densities of tritium and deuterium ions,
    respectively. The densities include the relevant isotope populations summed
    over their charge states unless a charge-state-resolved quantity is
    explicitly specified.

    This ratio is dimensionless and does not represent the total fuel-ion
    density; multiplying it by the deuterium density gives the tritium density.
  unit: '1'

- name: upper_bound_energy_of_detector_pixel
  description: |-
    The upper bound energy of a detector pixel is the maximum photon energy at
    the high-energy edge of its spectral bandpass in an X-ray crystal
    spectrometer.
  documentation: |-
    The upper bound energy of a detector pixel is the maximum photon energy at
    the high-energy edge of the spectral interval accepted by that pixel in an
    X-ray crystal spectrometer. It defines the upper endpoint of the
    pixel-specific photon-energy bandpass.

    This quantity applies to one detector pixel and describes its individual
    spectral acceptance interval; it is not an energy averaged over pixels or
    over the full spectrometer. It is distinct from the representative [energy
    of a detector pixel](name:energy_of_detector_pixel), which identifies the
    central or calibrated spectral-channel energy, and from the [lower bound
    energy of a detector pixel](name:lower_bound_energy_of_detector_pixel),
    which defines the lower endpoint of the same interval.

    Together, the upper and lower bounds delimit the photon-energy range
    accepted by each pixel, while the representative pixel energy identifies the
    spectral-channel assignment within that range.
  unit: eV

- name: upper_wavelength_of_filter
  description: |-
    Upper wavelength of a filter specifies the long-wavelength,
    low-photon-energy boundary of its transmitted passband as a vacuum spectral
    coordinate.
  documentation: |-
    Wavelength of filter

    The upper wavelength bound corresponds to the lower frequency boundary of
    the same passband:

    $$
    \lambda_{\mathrm{u}} = \frac{c}{\nu_{\min}}
    $$

    where $\lambda_{\mathrm{u}}$ is the upper wavelength bound, $c$ is the speed
    of light in vacuum, and $\nu_{\min}$ is the lower frequency boundary of the
    passband.

    This quantity is the upper-edge specialization of [wavelength of a
    filter](name:wavelength_of_filter), not its nominal band center or
    bandwidth. Together with the [lower wavelength
    bound](name:lower_wavelength_of_filter), it delimits the specified
    transmission interval; the difference between these bounds is the wavelength
    span. It denotes a vacuum spectral coordinate, not the wavelength inside the
    filter material.
  unit: m

- name: vertical_angle_of_detector_pixel
  description: |-
    Signed elevation angle of a camera pixel’s line of sight relative to the
    camera optical axis, specifying its vertical position within the field of
    view.
  documentation: |-
    The vertical viewing angle of a camera pixel is the signed elevation offset
    of its line of sight from the camera optical axis. It specifies angular
    position in the camera’s vertical image direction, rather than the full
    vertical field-of-view span described by [vertical angular width of
    camera](name:vertical_angular_width_of_camera).

    In the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ frame, let
    $\hat{\ell}$ be the pixel line-of-sight unit vector, $\hat{o}$ the
    optical-axis unit vector, and $\hat{v}$ the camera image-up unit vector. The
    angle is defined by

    $$
    \alpha_v = \operatorname{atan2}(\hat{\ell}\cdot\hat{v},\hat{\ell}\cdot\hat{o})
    $$

    where $\alpha_v$ is the signed vertical viewing angle and the three hatted
    quantities are dimensionless unit vectors. The image-up orientation
    determines the vertical angular direction.

    Sign convention: Positive when the pixel line of sight has a positive
    projection onto the camera image-up direction relative to the optical axis.
  unit: rad

- name: vertical_angular_width_of_camera
  description: |-
    Angular extent of a camera’s imaging coverage along the vertical Z direction
    of the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical angular width is the total angular span covered by a camera’s
    imaging region in the detector plane along the physical vertical direction.
    It is a non-negative field-of-view quantity, independent of the signs of the
    individual viewing angles.

    The width is defined by the difference between the largest and smallest
    covered vertical viewing angles:

    $$
    \Delta\theta_{\mathrm{vert}} = \theta_{\mathrm{vert,max}} - \theta_{\mathrm{vert,min}}
    $$

    where $\Delta\theta_{\mathrm{vert}}$ is the vertical angular width and
    $\theta_{\mathrm{vert,max}}$ and $\theta_{\mathrm{vert,min}}$ are the upper
    and lower signed vertical viewing-angle limits, expressed in radians. The
    vertical direction is $+Z$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    This full-span quantity is distinct from the signed [vertical angle of a
    detector pixel](name:vertical_angle_of_detector_pixel). Its directional
    counterpart is the [toroidal angular width of a
    camera](name:toroidal_angular_width_of_camera).
  unit: rad

- name: vertical_back_surface_curvature_of_optical_element
  description: |-
    Vertical back-surface curvature of an optical element is the signed
    directional radius of curvature of the rear optical surface along the second
    local tangential aperture direction. Here vertical means object-local
    aperture vertical, not the Z direction of the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    Vertical back-surface curvature of an optical element is the signed
    directional radius of curvature of the back optical surface in its second
    local tangential aperture direction. The right-handed local optical-surface
    frame is $(\hat{\mathbf{e}}_1, \hat{\mathbf{e}}_2, \hat{\mathbf{n}}_b)$ with
    $\hat{\mathbf{e}}_1 \times \hat{\mathbf{e}}_2 = \hat{\mathbf{n}}_b$, where
    $\hat{\mathbf{e}}_1$ and $\hat{\mathbf{e}}_2$ are the first and second
    surface-tangential aperture directions and $\hat{\mathbf{n}}_b$ is the
    positive normal of the back surface; this quantity uses
    $\hat{\mathbf{e}}_2$, the object-local aperture vertical direction.

    The defining relation is the reciprocal of the signed normal curvature of
    the back-surface normal section tangent to $\hat{\mathbf{e}}_2$:

    $$
    R_{b,2} = \frac{1}{\kappa_{n,b}(\hat{\mathbf{e}}_2)}
    $$

    where $R_{b,2}$ is the vertical back-surface curvature of the optical
    element and $\kappa_{n,b}(\hat{\mathbf{e}}_2)$ is the signed normal
    curvature of the back surface in the $\hat{\mathbf{e}}_2$ direction.

    This is a local directional radius, not the scalar parent optical-element
    curvature and not the direction-agnostic back-surface curvature. It equals
    the first-direction radius only for locally spherical or otherwise
    direction-independent curvature, and it is not a principal, sagittal, or
    meridional radius unless the surface definition aligns $\hat{\mathbf{e}}_2$
    with that direction. Together with an orthogonal directional radius it may
    characterize simple aligned toroidal curvature, but it does not fully
    characterize a general aspherical surface.
  unit: m

- name: vertical_coordinate_of_camera
  description: |-
    Vertical coordinate of the camera's geometric center, giving its signed
    height relative to the origin in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    Vertical coordinate of the camera's geometric center specifies its signed
    height relative to the coordinate origin in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Here $R$ denotes major radius, $\phi$ toroidal angle,
    and $Z$ vertical position.

    The coordinate is defined by the vertical projection of the center-position
    vector:

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the position vector from the coordinate origin to the
    camera's geometric center and $\hat{\mathbf{z}}$ is the unit vector along
    the symmetry axis in the direction of increasing $Z$.

    The reference point is the camera's geometric center, not an individual
    pixel or a line-of-sight point. This coordinate is distinct from the
    camera's vertical extent and from components of its local orientation
    vectors; no averaging over pixels or cameras is implied.

    Together with the camera-center major radius and toroidal angle, it
    specifies the center position. The [vertical coordinate of an
    aperture](name:vertical_coordinate_of_aperture) applies the same projection
    to a different object's geometric center.

    Sign convention: Positive when the camera center lies above the coordinate
    origin in the direction of increasing $Z$.
  unit: m

- name: vertical_coordinate_of_detector_pixel
  description: |-
    Vertical coordinate at a detector pixel specifies its signed height from the
    zero-height plane in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical coordinate at a detector pixel is its signed height relative to the
    zero-height plane in the right-handed cylindrical $(R,\phi,Z)$ frame. Here
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height
    along the toroidal symmetry axis.

    The coordinate is defined by

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the detector-pixel position vector measured from the
    coordinate origin and $\hat{\mathbf{z}}$ is the unit vector parallel to the
    symmetry axis toward increasing $Z$.

    The quantity applies separately to each detector-pixel position, without
    averaging over pixels. It is a point coordinate, not the vertical extent of
    a pixel or a coordinate along a detector-local tangent direction.

    The [toroidal coordinate at the detector
    pixel](name:toroidal_coordinate_at_detector_pixel) supplies the angular
    coordinate of the same position about the symmetry axis, whereas this
    quantity supplies its vertical coordinate.

    Sign convention: Positive when the detector pixel lies on the $+Z$ side of
    the zero-height plane.
  unit: m

- name: vertical_coordinate_of_filter_window
  description: |-
    Vertical coordinate of the filter-window center, giving its signed height
    relative to the machine midplane in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    In the right-handed cylindrical $(R, \phi, Z)$ frame, this quantity is the
    vertical coordinate of the filter-window center, with zero at the machine
    midplane. The basis $(\hat{\mathbf{R}}, \hat{\boldsymbol{\phi}},
    \hat{\mathbf{Z}})$ is right-handed; $R$ is major radius from the machine
    symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The coordinate is the projection of the center's position vector onto the
    vertical direction:

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    Here $Z$ is the filter-window center's vertical coordinate, $\mathbf{x}$ is
    its position vector relative to the frame origin, and $\hat{\mathbf{z}}$ is
    the unit vector parallel to the toroidal symmetry axis in the positive $Z$
    direction.

    This quantity specifies the location of one geometric center point of the
    filter window; it is not a surface-averaged coordinate, the window's
    vertical extent or orientation, or a coordinate along a filter-local axis.

    Together with the [radial coordinate of the filter
    window](name:radial_coordinate_of_filter_window) and [toroidal coordinate of
    the filter window](name:toroidal_coordinate_of_filter_window), it specifies
    the spatial location of the same center. The [vertical coordinate of an
    aperture](name:vertical_coordinate_of_aperture) and [vertical coordinate of
    a diagnostic aperture](name:vertical_coordinate_of_diagnostic_aperture)
    refer to different component centers and are not substitutes for this
    quantity.

    Sign convention: Positive when the filter-window center lies above the
    machine midplane, in the direction of increasing $Z$.
  unit: m

- name: vertical_coordinate_of_soft_xray_detector
  description: |-
    Vertical Z coordinate of the geometric center of a soft X-ray detector in
    the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical Z coordinate of the geometric center of a soft X-ray detector is
    the height coordinate of that detector center in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height. The origin of $Z$ is the machine
    midplane, so $Z=0$ lies on that midplane.

    Together with the corresponding major-radius and toroidal-angle coordinates,
    this quantity specifies the absolute geometric position of the detector
    center. It is distinct from a detector-pixel coordinate, an aperture
    position, a line-of-sight direction, and any measured soft-X-ray signal.

    Sign convention: Positive when the detector center is above the machine
    midplane in the $+\hat{Z}$ direction.
  unit: m

- name: vertical_curvature_of_bragg_crystal
  description: |-
    Radius of curvature of the diffracting surface of a Bragg crystal along its
    local vertical (X2) direction, defining one axis of its focusing geometry.
  documentation: |-
    The quantity is the local radius of curvature of the Bragg crystal's
    diffracting surface along its local vertical, or X2, tangent direction. It
    characterizes the crystal bending used for Bragg-diffraction focusing in a
    doubly curved geometry.

    $$
    R_v = \frac{1}{|\kappa_v|}
    $$

    where $R_v$ is the radius of curvature in m and $\kappa_v$ is the signed
    normal curvature in m$^{-1}$ along the local vertical tangent direction. A
    planar surface corresponds to zero curvature and an unbounded radius.

    This quantity describes the diffracting surface, not the geometric aperture
    radius given by [radius of Bragg crystal](name:radius_of_bragg_crystal).
    Together with the toroidal curvature of the Bragg crystal, it specifies the
    directional curvature scales of a doubly curved crystal.
  unit: m

- name: vertical_displacement_of_thomson_scattering_channel_position
  description: |-
    Signed vertical offset applied to a Thomson-scattering channel position
    relative to its static geometric location.
  documentation: |-
    The vertical displacement of a Thomson-scattering channel position is the
    signed incremental change in that channel’s geometric location along the
    vertical direction. It represents an offset from the static channel position
    rather than the absolute position itself.

    The displacement is defined by

    $$
    \Delta Z = Z_{\mathrm{actual}} - Z_{\mathrm{static}}
    $$

    where $\Delta Z$ is the vertical displacement, $Z_{\mathrm{actual}}$ is the
    actual vertical coordinate of the channel position, and
    $Z_{\mathrm{static}}$ is its static vertical coordinate.

    This quantity applies to one Thomson-scattering channel position and
    includes only its vertical component. It is not averaged over channels, does
    not represent a plasma-wide vertical displacement, and is distinct from the
    absolute [vertical coordinate of a measurement
    position](name:vertical_coordinate_of_measurement_position).

    The actual vertical coordinate is obtained by adding this displacement to
    the static vertical coordinate, $Z_{\mathrm{actual}} = Z_{\mathrm{static}} +
    \Delta Z$.

    Sign convention: Positive when the displacement is directed toward
    increasing $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: m

- name: vertical_front_surface_radius_of_optical_element
  description: |-
    Radius of curvature of an optical element's beam-entry front surface along
    the local second tangential direction (X2, the optical-element vertical
    direction) in the right-handed local optical-element frame (X1, X2, z).
  documentation: |-
    Radius of curvature of an optical element's beam-entry front surface along
    the local second tangential ($X_2$, optical-element vertical) direction is
    the signed radius of the front-surface normal section spanned by $\hat{X}_2$
    and $\hat{z}$ in the right-handed local optical-element frame
    $(\hat{X}_1,\hat{X}_2,\hat{z})$. The coordinates $x_1$ and $x_2$ lie in the
    local tangent plane at the surface vertex, and $z$ is the local
    front-surface-normal sag coordinate. This is a radius of curvature, not a
    reciprocal curvature.

    At the surface vertex, after subtracting planar tilt so that $\partial
    z/\partial x_2=0$ there, the signed radius is defined by the second
    derivative of the sag in the $X_2$ normal section:

    $$
    \frac{1}{R_2} = \left.\frac{\partial^2 z}{\partial x_2^2}\right|_{x_2=0}
    $$

    where $z(x_2)$ is the front-surface sag along $\hat{z}$, $x_2$ is
    displacement along $\hat{X}_2$, and $R_2$ is this signed radius; $z$, $x_2$,
    and $R_2$ are in meters. For small sag this definition implies
    $z(x_2)-z(0)\simeq x_2^2/(2R_2)$ near the vertex, and a flat section is the
    limiting case $1/R_2=0$.

    For spherical surface models the first- and second-local-tangential radii of
    the front surface are equal. For cylindrical, toroidal, or separably curved
    surface models they may differ, so this quantity is distinct from the
    orthogonal first-local-tangential front-surface quantity
    x_front_surface_curvature_of_optical_element and from the rear-surface
    quantity
    [vertical_back_surface_curvature_of_optical_element](name:vertical_back_surface_curvature_of_optical_element);
    [vertical_front_surface_curvature_of_optical_element](name:second_local_tangential_front_surface_radius_of_optical_element)
    uses the same second-local-tangential front-surface radius convention.

    Sign convention: Positive when the center of curvature of the front surface
    in the normal section spanned by $\hat{X}_2$ and $\hat{z}$ lies on the
    $+\hat{z}$ side of the local tangent plane.
  unit: m

- name: viewing_efficiency_of_spectrometer_channel
  description: |-
    Fraction of locally emitted light collected by a spectrometer channel’s
    optical system from each specified region-of-interest point, including
    non-pinhole viewing geometries.
  documentation: |-
    Viewing efficiency is the geometric fraction of radiation emitted locally at
    a specified point that is collected by the optical system of a spectrometer
    channel. It characterizes spatial light collection for non-pinhole optics,
    rather than the probability that a detector registers an incident photon.

    For a point at position $mathbf{r}$, the viewing efficiency is defined by

    $$
    \eta_{\mathrm{view}}(\mathbf{r}) = \frac{\mathcal{L}_{\mathrm{collected}}(\mathbf{r})}{\mathcal{L}_{\mathrm{local}}(\mathbf{r})}
    $$

    where $\eta_{\mathrm{view}}(\mathbf{r})$ is the viewing efficiency,
    $\mathbf{r}$ is the spatial emission point,
    $\mathcal{L}_{\mathrm{collected}}(\mathbf{r})$ is the local emission
    contribution collected by the optical system, and
    $\mathcal{L}_{\mathrm{local}}(\mathbf{r})$ is the corresponding local
    emitted radiation considered by the collection model.

    The quantity is evaluated separately at each point defining a region of
    interest and is a fraction bounded between zero and one. It represents
    spatial collection and is not summed or averaged over the region-of-interest
    points. It is not a wavelength-resolved efficiency and excludes
    detector-registration probability or other spectral detector response.

    Viewing efficiency is related to the optical phase-space acceptance
    described by etendue of a spectrometer channel, but it is a pointwise
    collection fraction rather than an etendue. It is distinct from [spectral
    efficiency of a hard X-ray
    detector](name:spectral_efficiency_of_hard_xray_detector), which is an
    energy-dependent photon-registration probability.
  unit: '1'

- name: wavelength_of_bragg_crystal
  description: |-
    Vacuum wavelength selected by Bragg diffraction from the crystal lattice
    spacing and orientation, defining the central spectral passband of the
    crystal.
  documentation: |-
    The Bragg wavelength is the vacuum electromagnetic wavelength selected by a
    crystal's lattice geometry for a specified diffraction order. It defines the
    central spectral coordinate of the crystal passband and is distinct from the
    pixel-specific assignment represented by [wavelength of detector
    pixel](name:wavelength_of_detector_pixel).

    For lattice planes with spacing $d$ and Bragg angle $\theta_B$, the selected
    wavelength satisfies

    $$
    n\lambda_B = 2d\sin\theta_B
    $$

    where $\lambda_B$ is the wavelength, $n$ is the positive integer diffraction
    order, $d$ is the crystal lattice-plane spacing, and $\theta_B$ is the angle
    between the incident beam and the lattice planes. The angle is the crystal
    diffraction geometry characterized by [angular width of Bragg
    crystal](name:angular_width_of_bragg_crystal).
  unit: m

- name: wavelength_of_detector_pixel
  description: |-
    Wavelength assigned to incoming photons at an X-ray crystal spectrometer
    detector pixel, including Bragg dispersion and curvature-induced variation
    across the detector face.
  documentation: |-
    The wavelength associated with a detector pixel is the vacuum spectral
    coordinate of incoming photons whose Bragg-dispersed rays reach that pixel.

    The pixel-specific wavelength follows Bragg's law:

    $$
    \lambda_{\rm pix}=2d\sin\theta_{\rm pix}
    $$

    where $\lambda_{\rm pix}$ is the vacuum wavelength assigned to the incoming
    photons at the pixel, $d$ is the crystal lattice-plane spacing, and
    $\theta_{\rm pix}$ is the Bragg angle for rays reaching that pixel.

    This quantity is a per-pixel spectral assignment for an X-ray crystal
    spectrometer. It primarily varies along the dispersive detector direction
    and also varies along the perpendicular detector-face direction because the
    constant-wavelength surfaces have elliptical curvature. It is not a single
    wavelength averaged over the detector face or over a wavelength band, and it
    does not denote the crystal's wavelength independently of a pixel.

    It is a detector-pixel specialization of vacuum electromagnetic wavelength.
    Unlike [energy_of_detector_pixel](name:energy_of_detector_pixel), which uses
    photon energy as the spectral coordinate, this quantity uses wavelength for
    the same pixel-specific incoming-photon assignment.
  unit: m

- name: wavelength_of_spectral_line
  description: |-
    Wavelength of a spectral line in vacuum in the emitter's rest frame,
    providing the unshifted reference before Doppler and motional Stark shifts.
  documentation: |-
    Wavelength of spectral line

    The reference wavelength satisfies:

    $$
    \lambda = \frac{c}{\nu_0}
    $$

    where $\lambda$ is the unshifted vacuum [wavelength], $c$ is the speed of
    light in vacuum, and $\nu_0$ is the corresponding rest-frame transition
    frequency before motional Stark shifts.

    This line-specific value provides the reference for [neutral-beam Doppler
    wavelength
    displacements](name:difference_of_neutral_beam_doppler_wavelength_and_reference_wavelength_of_spectral_line)
    and [motional Stark wavelength
    displacements](name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line);
    neither displacement is included in the reference wavelength itself.

    Unlike the [wavelength assigned to a detector
    pixel](name:wavelength_of_detector_pixel), this quantity characterizes the
    transition rather than the spectral coordinate selected by the optical
    response. It is not a line width or an average over different spectral
    lines.
  unit: m

- name: wavelength_of_visible_camera
  description: |-
    Wavelength specifying either the short-wavelength or long-wavelength edge of
    a photon-detection response interval.
  documentation: |-
    A response-band boundary wavelength is the spectral location of one edge of
    an optical detector's photon-sensitivity interval. It identifies where the
    accepted response range begins or ends, rather than describing the response
    magnitude within that range.

    The wavelength is related to the corresponding electromagnetic frequency by

    $$
    \lambda_{\mathrm{edge}} = \frac{c}{\nu_{\mathrm{edge}}}
    $$

    where $\lambda_{\mathrm{edge}}$ is the boundary wavelength, $c$ is the speed
    of light in vacuum, and $\nu_{\mathrm{edge}}$ is the electromagnetic
    frequency at that boundary.

    This quantity applies to either endpoint of a photon-detection response
    interval: the lower endpoint is represented by [lower-bound wavelength of a
    visible camera](name:lower_bound_wavelength_of_visible_camera), and the
    upper endpoint by [upper-bound wavelength of a visible
    camera](name:upper_bound_wavelength_of_visible_camera). It is an endpoint
    value, not a spectral average, integrated response, or response-equivalent
    width.

    The two boundary wavelengths delimit the admitted spectral interval; the
    lower-wavelength boundary precedes the upper-wavelength boundary. This
    distinguishes each boundary from [effective spectral width of a spectrometer
    channel](name:effective_spectral_width_of_spectrometer_channel), which
    characterizes the extent of a response rather than one endpoint, and from
    the general wavelength quantity, which need not be associated with a
    response-band boundary.
  unit: m

- name: lower_bound_wavelength_of_visible_camera
  description: |-
    Short-wavelength boundary of the spectral sensitivity band accepted by a
    visible-camera detector channel, defining the lower edge of its response
    interval. Photons with shorter wavelengths are outside the specified
    detector response interval.
  documentation: |-
    Short-wavelength boundary of the spectral sensitivity band accepted by a
    visible-camera detector channel is the minimum photon wavelength included in
    the specified detector response interval. It defines an interval endpoint of
    the spectral sensitivity band, not the value of the detector response at
    that endpoint.

    Together with the upper-bound wavelength, it delimits the nominal accepted
    wavelength interval. Photons with wavelengths shorter than this lower bound
    are outside the specified interval; photons within the interval remain
    subject to the detector spectral response function. It is distinct from the
    central wavelength and the wavelength bandwidth, which summarize the
    interval rather than define its short-wavelength edge.
  unit: m

- name: upper_bound_wavelength_of_visible_camera
  description: |-
    Long-wavelength boundary of the spectral sensitivity band accepted by a
    visible-camera detector channel for photon detection.
  documentation: |-
    The upper-bound wavelength is the long-wavelength edge of the spectral
    sensitivity band for a visible-camera detector channel. It identifies the
    greatest wavelength included in the channel’s accepted photon-response
    range.

    The accepted wavelength interval is bounded by

    $$
    \lambda_{\mathrm{lower}} \leq \lambda \leq \lambda_{\mathrm{upper}}
    $$

    where $\lambda$ is photon wavelength, $\lambda_{\mathrm{lower}}$ is the
    short-wavelength boundary given by [lower-bound wavelength of a visible
    camera](name:lower_bound_wavelength_of_visible_camera), and
    $\lambda_{\mathrm{upper}}$ is this quantity.

    This is one boundary value for a visible-camera detector channel, not an
    average wavelength, a band-integrated quantity, or the representative
    wavelength assigned to an individual detector pixel. The paired lower and
    upper boundaries delimit the channel’s spectral sensitivity band;
    [wavelength of a detector pixel](name:wavelength_of_detector_pixel) instead
    identifies a pixel-associated spectral coordinate.
  unit: m

- name: cold_neutral_velocity
  description: |-
    Cold neutral velocity is the line-of-sight component of the bulk flow of
    low-energy neutral atoms, identified from the Doppler shift of their
    emission.
  documentation: |-
    Cold neutral velocity is the line-of-sight component of the bulk drift
    vector of a cold neutral particle population. It represents convective
    neutral motion after averaging over particle velocities and over the
    contributing cold-neutral population states.

    The component is defined from the parent [neutral
    velocity](name:neutral_velocity) by

    $$
    v_{n,c,ell} = \mathbf{v}_{n,c} \cdot \hat{\ell}
    $$

    where $\mathbf{v}_{n,c}$ is the bulk velocity of the cold neutral
    population, $\hat{\ell}$ is the selected line-of-sight unit vector, and
    $v_{n,c,\ell}$ is the signed projected velocity. The projection is the
    velocity represented by the Doppler centroid of the corresponding
    cold-neutral emission component.

    This quantity is distinct from [hot neutral
    velocity](name:hot_neutral_velocity), which describes the energetic neutral
    population, and from [neutral internal state
    velocity](name:neutral_internal_state_velocity), which is resolved for a
    specified internal state. It excludes thermal speed and velocity spread,
    which are higher moments of the velocity distribution.

    Sign convention: Positive when the cold-neutral bulk velocity points along
    the chosen positive line-of-sight unit vector $\hat{\ell}$.
  unit: m.s^-1

- name: hot_neutral_velocity
  description: |-
    Hot neutral velocity is the line-of-sight component of the bulk flow of an
    energetic neutral atom population, identified from the Doppler centroid
    shift of its broad emission component.
  documentation: |-
    Hot neutral velocity is the line-of-sight component of the bulk drift vector
    of a hot neutral particle population. It represents convective neutral
    motion after averaging over particle velocities and over the contributing
    hot-neutral internal-state or energy subpopulations.

    At position $\mathbf r$, the projected component is the first velocity
    moment of the selected hot neutral distribution projected along the line of
    sight:

    $$
    u_{\mathrm{hot},\mathrm{los}}(\mathbf r)=\hat{\ell}\cdot\frac{\sum_{a\in\mathcal A_{\mathrm{hot}}}\int \mathbf v\,f_{n,a}(\mathbf r,\mathbf v)\,d^3v}{\sum_{a\in\mathcal A_{\mathrm{hot}}}\int f_{n,a}(\mathbf r,\mathbf v)\,d^3v}
    $$

    where $\mathbf r$ is position, $\hat{\ell}$ is the line-of-sight direction
    from the first point to the second point, $\mathbf v$ is particle velocity,
    $f_{n,a}$ is the phase-space density of neutral subpopulation $a$, and
    $\mathcal A_{\mathrm{hot}}$ is the included set of hot neutral
    subpopulations.

    The scope is restricted to energetic neutrals in the selected hot
    population; colder neutral components are excluded unless they are part of
    that selected population. The scalar is a directional projection of [neutral
    velocity](name:neutral_velocity), not the magnitude of the neutral flow
    vector, a particle flux, a momentum density, or a thermal spread.

    It is the hot-population counterpart of [cold neutral
    velocity](name:cold_neutral_velocity). It is distinct from [hot neutral
    temperature](name:hot_neutral_temperature_at_plasma_boundary), which
    characterizes random velocity spread rather than the centroid or
    first-moment drift of the hot neutral population.

    Sign convention: Positive when the hot-neutral bulk drift projects from the
    first point to the second point along the line of sight.
  unit: m.s^-1

- name: normalized_toroidal_flux_coordinate_of_line_of_sight
  description: |-
    Signed normalized toroidal-flux label at the line-of-sight point closest to
    the magnetic axis, positive above and negative below the axis.
  documentation: |-
    This quantity is the normalized toroidal flux label assigned to the point on
    a line of sight that approaches the magnetic axis most closely. Its sign
    records whether that closest point lies above or below the magnetic axis.

    The signed closest-approach value is defined by

    $$
    \rho_{\mathrm{LOS}} = \operatorname{sgn}(Z_* - Z_{\mathrm{axis}})\,\rho_{\mathrm{tor,norm}}(\mathbf{x}_*),
    \qquad
    \mathbf{x}_* = \underset{\mathbf{x}\in\mathrm{LOS}}{\operatorname{arg\,min}}\,\rho_{\mathrm{tor,norm}}(\mathbf{x})
    $$

    where $\rho_{\mathrm{LOS}}$ is this signed line-of-sight value,
    $\rho_{\mathrm{tor,norm}}$ is the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate), $\mathbf{x}$ is a
    point on the line of sight, $\mathbf{x}_*$ is the closest-approach point,
    and $\mathrm{LOS}$ denotes the line of sight. The function
    $\operatorname{sgn}$ supplies the sign of its argument; $Z_*$ is the
    vertical coordinate of the closest-approach point and $Z_{\mathrm{axis}}$ is
    the vertical coordinate of the magnetic axis. Here $R$, $\phi$, and $Z$ are
    the major-radius, toroidal-angle, and vertical coordinates in the
    right-handed cylindrical $(R,\phi,Z)$ frame.

    The quantity applies to one line of sight and uses only the selected
    closest-approach point; it is not a line average, line integral,
    flux-surface average, or volume aggregate. Unlike normalized toroidal flux
    coordinate of measurement position, it does not describe the coordinate at
    an arbitrary single measurement point.

    It is obtained from the parent [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate) by evaluating that
    magnetic-surface label at the closest-approach point and appending the
    above/below-axis sign. The underlying unsigned label increases outward from
    the magnetic axis toward the equilibrium boundary.

    Sign convention: Positive when the closest point on the line of sight lies
    above the magnetic axis, meaning $Z_* > Z_{\mathrm{axis}}$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: '1'

- name: radial_coordinate_of_camera
  description: |-
    Major-radius location of a camera’s geometric center, measured from the
    toroidal symmetry axis in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial coordinate of a camera is the major-radius position of its
    geometric center, measured perpendicular to the toroidal symmetry axis. It
    identifies the camera center rather than any individual detector pixel,
    aperture, or line-of-sight point.

    The coordinate is defined from the Cartesian coordinates of the camera
    center:

    $$
    R_{\mathrm{cam}} = \sqrt{x_{\mathrm{cam}}^2 + y_{\mathrm{cam}}^2}
    $$

    where $R_{\mathrm{cam}}$ is the camera-center radial coordinate, and
    $x_{\mathrm{cam}}$ and $y_{\mathrm{cam}}$ are the camera-center coordinates
    in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis. The
    corresponding cylindrical frame is the right-handed $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    This quantity applies to the geometric center of the camera as a whole and
    is not an average over pixels, viewing directions, or detector elements. It
    is the camera-specific specialization of the parent [radial
    coordinate](name:radial_coordinate). Together with the [vertical coordinate
    of the camera](name:vertical_coordinate_of_camera) and [toroidal coordinate
    of the camera](name:toroidal_coordinate_of_camera), it specifies the
    camera-center position.
  unit: m

- name: radial_coordinate_of_detector
  description: |-
    Major-radius coordinate of the detector center in the right-handed
    cylindrical (R, φ, Z) frame, locating the detector relative to the toroidal
    symmetry axis.
  documentation: |-
    Radial coordinate of a detector is the major-radius coordinate of the
    detector center in the right-handed cylindrical $(R, \phi, Z)$ frame. In
    this frame, $R$ is major radius measured from the toroidal symmetry axis,
    $\phi$ is toroidal angle increasing counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height.

    The detector-center radial coordinate is related to Cartesian coordinates of
    the same point by

    $$
    R_d = \sqrt{x_d^2 + y_d^2}
    $$

    where $R_d$ is the radial coordinate of the detector center, and $x_d$ and
    $y_d$ are the detector-center Cartesian coordinates in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with origin on the toroidal
    symmetry axis and $\hat{z}=\hat{Z}$ vertical.

    The scope is the detector as a whole, and the reference point is its center.
    This is a point coordinate, not an area average over the detector surface,
    not an average over detector pixels, and not the coordinate of an
    alternative detector-plane origin.

    This quantity is a detector-specific specialization of [radial
    coordinate](name:radial_coordinate): it applies the same major-radius
    coordinate to the detector center. It is distinct from the [radial
    coordinate of detector pixel](name:radial_coordinate_of_detector_pixel),
    which applies to an individual pixel center, and from the [radial coordinate
    of diagnostic aperture](name:radial_coordinate_of_diagnostic_aperture),
    which applies to an aperture reference point.
  unit: m

- name: radial_coordinate_of_line_of_sight
  description: |-
    Major-radius coordinate of the second reference point on a line of sight,
    equal to its perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of line of sight

    The coordinate is defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the horizontal coordinates of the second reference
    point in the right-handed Cartesian $(x, y, z)$ frame, with $z$ the vertical
    coordinate and the $z$ axis coinciding with the toroidal symmetry axis.

    The coordinate is nonnegative and vanishes on the toroidal symmetry axis. It
    is distinct from a distance along the line of sight, a minor-radius distance
    measured from the magnetic axis, and a magnetic flux label. Like the [radial
    coordinate of a measurement
    position](name:radial_coordinate_of_measurement_position), it locates a
    specified point; no summation, line integration, averaging, or emission
    weighting is implied.
  unit: m

- name: radial_coordinate_of_polarizer
  description: |-
    Major-radius coordinate of the polarizer’s geometric reference point, namely
    its circular center or local-plane origin, measured from the toroidal
    symmetry axis.
  documentation: |-
    The quantity is the major-radius location of a polarizer’s geometric
    reference point. This point is the center for a circular polarizer or the
    origin of the local coordinate system describing a planar polarizer.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the coordinate is
    defined from the point’s horizontal Cartesian coordinates by

    $$
    R_{\mathrm{pol}} = \sqrt{x_{\mathrm{pol}}^2+y_{\mathrm{pol}}^2}
    $$

    where $R_{\mathrm{pol}}$ is the polarizer reference point’s major-radius
    coordinate, and $x_{\mathrm{pol}}$ and $y_{\mathrm{pol}}$ are its horizontal
    coordinates in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis.
    Here $R$ denotes major radius, $\phi$ denotes toroidal angle, and $Z$
    denotes vertical height.

    The quantity applies only to the polarizer reference point and is
    nonnegative; it is not the radial coordinate of an arbitrary point on the
    polarizer surface and is not a flux-surface-normal projection. It is the
    polarizer-specific realization of the general [radial
    coordinate](name:radial_coordinate).

    Together with the [toroidal coordinate of the
    polarizer](name:toroidal_coordinate_of_polarizer), this coordinate locates
    the same geometric reference point in the cylindrical frame.
  unit: m

- name: radial_coordinate_of_spectrometer_channel
  description: |-
    Major-radius coordinate of an interpolated geometry point associated with a
    spectrometer channel, measured from the toroidal symmetry axis in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the major-radius coordinate of an interpolated geometry
    point associated with a spectrometer channel. It locates that point by its
    perpendicular distance from the toroidal symmetry axis in the right-handed
    cylindrical $(R,\phi,Z)$ frame.

    At each interpolated geometry point, the coordinate is defined from its
    transverse Cartesian coordinates:

    $$
    R = \sqrt{x^2+y^2}
    $$

    where $R$ is the major-radius coordinate, and $x$ and $y$ are the Cartesian
    coordinates along the $\hat{x}$ and $\hat{y}$ directions. The right-handed
    Cartesian basis is $(\hat{x},\hat{y},\hat{z})$, with $\hat{z}$ equal to the
    vertical unit direction $\hat{Z}$; in the cylindrical frame, $\phi$ is
    toroidal angle and $Z$ is vertical height.

    The quantity applies pointwise to each interpolated geometry knot associated
    with one spectrometer channel and is not summed, averaged, or integrated
    over knots, channels, viewing paths, or plasma regions. It identifies a
    geometry-point locus rather than a single radial location for the channel
    body or a channel-wide average.

    This is the spectrometer-channel-specific instance of the [radial
    coordinate](name:radial_coordinate). It retains the parent quantity's
    major-radius definition while restricting its locus to an interpolated point
    in the channel geometry.
  unit: m

- name: ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density
  description: |-
    Volume-averaged krypton density divided by volume-averaged electron density
    is the plasma-volume krypton abundance ratio relative to electrons, with
    krypton number density summed over all charge states.
  documentation: |-
    Volume-averaged krypton density divided by volume-averaged electron density
    is the plasma-volume krypton abundance ratio formed from the same averaging
    volume for krypton and electrons. The krypton density is the species-level
    krypton number density summed over all charge states, including neutral
    through fully stripped krypton.

    The ratio is defined by the quotient of the two volume averages:

    $$
    f_{\mathrm{Kr},V} = \frac{\langle n_{\mathrm{Kr}} \rangle_V}{\langle n_e \rangle_V} = \frac{V_p^{-1}\int_{V_p}\sum_{q=0}^{Z_{\mathrm{Kr}}} n_{\mathrm{Kr},q}(\mathbf{x})\,dV}{V_p^{-1}\int_{V_p} n_e(\mathbf{x})\,dV}
    $$

    where $f_{\mathrm{Kr},V}$ is this krypton abundance ratio, $\langle
    n_{\mathrm{Kr}} \rangle_V$ is the [volume-averaged krypton
    density](name:volume_averaged_krypton_density), $\langle n_e \rangle_V$ is
    the [volume-averaged electron
    density](name:volume_averaged_electron_density), $V_p$ is the averaging
    plasma volume, $n_{\mathrm{Kr},q}$ is the krypton number density in charge
    state $q$, $q=0$ denotes neutral krypton, $q=Z_{\mathrm{Kr}}$ denotes fully
    stripped krypton, $Z_{\mathrm{Kr}}$ is the nuclear charge of krypton, $n_e$
    is the electron number density, $\mathbf{x}$ is spatial position, and $dV$
    is an infinitesimal volume element.

    This quantity applies to the krypton and electron populations inside the
    same plasma volume $V_p$. Its aggregation convention is volumetric averaging
    for both numerator and denominator; because krypton density is an extensive
    per-volume species amount, the species-level krypton density is
    charge-state-summed before the volume average is taken.

    It is not normalized by the maximum local electron density and is not a
    krypton-to-electron density ratio at a single position. It is also distinct
    from [line-averaged krypton density](name:line_averaged_krypton_density),
    which averages krypton density along a path rather than over the plasma
    volume.

    The numerator is exactly [volume-averaged krypton
    density](name:volume_averaged_krypton_density), and the denominator is
    exactly [volume-averaged electron
    density](name:volume_averaged_electron_density). Replacing the denominator
    by a maximum electron density gives the related but different ratio of
    volume-averaged krypton density to maximum electron density.
  unit: '1'

- name: ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless elemental abundance ratio of charge-state-summed neon nuclei
    to free electrons, formed from their respective mean number densities inside
    the last closed flux surface.
  documentation: |-
    This quantity is the abundance of neon nuclei relative to free electrons,
    with both species represented by number densities averaged over the plasma
    volume enclosed by the last closed flux surface. Neon is summed over all
    charge states, so the quantity is an elemental composition ratio rather than
    a charge-state-specific abundance or a local density ratio.

    The ratio of volume-averaged densities is defined by

    $$
    \frac{\overline{n}_{\mathrm{Ne}}}{\overline{n}_e} = \frac{\displaystyle \frac{1}{V_p}\int_{V_p} n_{\mathrm{Ne}}(\mathbf{x})\,dV}{\displaystyle \frac{1}{V_p}\int_{V_p} n_e(\mathbf{x})\,dV}
    $$

    where $\overline{n}_{\mathrm{Ne}}$ is the [volume-averaged neon
    density](name:volume_averaged_neon_density), $\overline{n}_e$ is the
    [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_{\mathrm{Ne}}(\mathbf{x})$ is the local neon nuclear number density
    summed over charge states, $n_e(\mathbf{x})$ is the local free-electron
    number density, $V_p$ is the plasma volume enclosed by the last closed flux
    surface, $\mathbf{x}$ is position, and $dV$ is the volume element.

    Both operands use the same plasma volume and the same volume-averaging
    convention. This quantity is the ratio of the two global means, not the
    volume average of the local ratio
    $n_{\mathrm{Ne}}(\mathbf{x})/n_e(\mathbf{x})$; its denominator is
    specifically the parent [volume-averaged electron
    density](name:volume_averaged_electron_density), while its numerator is the
    corresponding [volume-averaged neon
    density](name:volume_averaged_neon_density).
  unit: '1'

- name: ratio_of_volume_averaged_nitrogen_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless abundance ratio of charge-state-summed nitrogen nuclei to
    electrons, with both number densities averaged over the plasma volume
    bounded by the last closed flux surface.
  documentation: |-
    Dimensionless abundance ratio of charge-state-summed nitrogen nuclei to
    electrons, with both number densities averaged over the plasma volume
    bounded by the last closed flux surface. It represents the species-level
    nitrogen abundance relative to the free-electron population in the confined
    plasma.

    The defining ratio is:

    $$
    f_{\mathrm{N/e}} = \frac{\left\langle \sum_{q=0}^{7} n_{\mathrm{N}^{q+}} \right\rangle_V}{\left\langle n_e \right\rangle_V}
    $$

    where $f_{\mathrm{N/e}}$ is the nitrogen-to-electron abundance ratio,
    $n_{\mathrm{N}^{q+}}$ is the nitrogen number density in charge state $q$,
    $q=0$ denotes neutral nitrogen, $q=7$ denotes fully stripped nitrogen, $n_e$
    is the [electron density](name:electron_density), and
    $\langle\cdot\rangle_V$ denotes averaging over the plasma volume bounded by
    the last closed flux surface.

    The numerator is the charge-state-summed [nitrogen
    density](name:nitrogen_density) after volume averaging, equivalently the
    [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density).
    The denominator is the [volume-averaged electron
    density](name:volume_averaged_electron_density) evaluated with the same
    volume-averaging convention.

    This quantity is a ratio of separate volume averages, not the volume average
    of a local nitrogen-to-electron density ratio. It is species-level and
    charge-state-summed, so it differs from any charge-state-resolved nitrogen
    abundance that retains a single ionization state in the numerator. It
    follows the same abundance-ratio convention as [ratio of volume-averaged
    neon density to volume-averaged electron
    density](name:ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density)
    and [ratio of volume-averaged iron density to volume-averaged electron
    density](name:ratio_of_iron_density_to_electron_density).
  unit: '1'

- name: requested_voltage_of_spectrometer_channel
  description: |-
    Commanded detector-bias potential difference applied by the high-voltage
    supply associated with one spectrometer channel.
  documentation: |-
    This quantity is the requested electrical potential difference that
    establishes the detector-bias setpoint for one spectrometer channel.

    The setpoint is defined by

    $$
    V_{\mathrm{set}} = V_{\mathrm{bias}} - V_{\mathrm{return}}
    $$

    where $V_{\mathrm{set}}$ is the requested channel bias voltage,
    $V_{\mathrm{bias}}$ is the electrical potential of the high-voltage bias
    terminal, and $V_{\mathrm{return}}$ is the electrical potential of the
    associated supply return.

    The quantity applies to one spectrometer channel and represents a commanded
    setpoint rather than an aggregated value across channels. It specifies the
    intended bias potential of the channel's high-voltage supply; it does not
    represent the channel's actual electrical output signal, which is described
    by [voltage of a spectrometer
    channel](name:voltage_of_spectrometer_channel).

    As a requested control quantity, it is distinct from the realized or
    measured channel voltage and is analogous in semantic role to the bias
    setpoint represented by [requested voltage of a neutron
    detector](name:requested_voltage_of_neutron_detector).
  unit: V

- name: total_neutron_source_rate_due_to_thermal_fusion
  description: |-
    Total neutron production rate from thermonuclear neutron-producing
    deuterium-deuterium, deuterium-tritium, and tritium-tritium reaction
    branches among Maxwellian bulk ions, excluding beam-target and beam-beam
    fast-ion contributions.
  documentation: |-
    The total neutron source rate due to thermal fusion is the number of
    neutrons produced per unit time by the neutron-producing thermal
    deuterium-deuterium, deuterium-tritium, and tritium-tritium reaction
    branches between bulk ions with locally Maxwellian velocity distributions.
    It is the channel-summed member of [neutron source rate due to thermal
    fusion](name:neutron_source_rate_due_to_thermal_fusion), equal to the sum of
    deuterium-deuterium neutron source rate due to thermal fusion,
    deuterium-tritium neutron source rate due to thermal fusion, and
    [tritium-tritium neutron source rate due to thermal
    fusion](name:tritium_tritium_neutron_source_rate_due_to_thermal_fusion).

    The channel-summed thermal neutron source rate is defined by

    $$
    S_{n,\mathrm{tot}}^{\mathrm{th}} = \int_V \sum_{c \in \{DD,DT,TT\}} \nu_{n,c}\,\frac{n_{a_c} n_{b_c}}{1+\delta_{a_c b_c}}\,\langle\sigma v\rangle_c(T_{a_c},T_{b_c})\,dV
    $$

    where $S_{n,\mathrm{tot}}^{\mathrm{th}}$ is the total source rate, $V$ is
    the emitting plasma volume, $c$ labels a neutron-producing thermal fusion
    branch, $\nu_{n,c}$ is the neutron multiplicity of branch $c$, $a_c$ and
    $b_c$ are its reactant ion species, $n_{a_c}$ and $n_{b_c}$ are their local
    bulk number densities, $\delta_{a_c b_c}$ is one for identical reactants and
    zero otherwise, $\langle\sigma v\rangle_c$ is the Maxwellian-averaged
    reactivity, $T_{a_c}$ and $T_{b_c}$ are the local reactant temperatures, and
    $dV$ is a volume element. The denominator prevents double counting of
    identical reactant pairs.

    Only reactions among locally Maxwellian bulk ions are included; beam-target,
    beam-beam, fusion-product, and other nonthermal fast-ion contributions are
    excluded. For deuterium-deuterium fusion, only the D(d,n)$^3\mathrm{He}$
    neutron branch contributes; the D(d,p)T proton branch is not counted. For
    deuterium-deuterium and deuterium-tritium neutron branches $\nu_{n,c}=1$,
    while for tritium-tritium fusion $\nu_{n,c}=2$.
  unit: Hz
