- name: toroidal_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the total current density vector, representing
    the net conventional current per unit area flowing in the direction of increasing
    toroidal angle in the plasma.
  documentation: "The toroidal current density $J_\\phi$ is the $\\hat{\\phi}$-projection\
    \ of the total [current density](name:current_density) vector $\\mathbf{J}$ in\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame, where $\\hat{\\phi}$ points\
    \ in the direction of increasing toroidal angle. It combines all current-carrying\
    \ mechanisms in the toroidal channel: ohmic induction, bootstrap current, and\
    \ wave- or beam-driven non-inductive contributions.\n\nIn axisymmetric MHD equilibrium,\
    \ $J_\\phi$ is the source term in the Grad-Shafranov equation:\n\n$$\n\\Delta^*\
    \ \\psi = -\\mu_0 R \\, J_\\phi\n$$\n\nwhere $\\psi$ is the poloidal magnetic\
    \ flux, $\\mu_0$ is the permeability of free space, and $\\Delta^* \\equiv R\\\
    ,\\partial_R(R^{-1}\\,\\partial_R) + \\partial_Z^2$ is the elliptic flux-surface\
    \ operator acting in the $(R, Z)$ plane.\n\nThe profile of $J_\\phi$ is obtained\
    \ from equilibrium reconstruction \u2014 combining external magnetic measurements\
    \ with internal diagnostics such as motional Stark effect polarimetry \u2014 or\
    \ from MHD and transport codes operating on generalized grid representations.\
    \ With [poloidal_current_density](name:poloidal_current_density) and [radial_current_density](name:radial_total_current_density),\
    \ it completes the cylindrical $(R, \\phi, Z)$ decomposition of $\\mathbf{J}$;\
    \ the [toroidal_diamagnetic_current_density](name:toroidal_current_density_due_to_diamagnetic_drift)\
    \ isolates the diamagnetic-drift contribution to this toroidal component.\n\n\
    In present-day tokamak H-mode discharges, peak core values span 0.5\u20135 MA\
    \ m$^{-2}$, declining toward the plasma edge.\n\nSign convention: Positive when\
    \ $J_\\phi$ points in the direction of increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: equilibrium
