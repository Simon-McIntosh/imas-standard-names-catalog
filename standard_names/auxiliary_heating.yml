- name: per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of absorbed wave power deposited on the
    fast ion population inside a given flux surface, resolved per toroidal mode number
    $n_\phi$.
  documentation: "This quantity gives the total wave power absorbed by the fast (non-thermal)\
    \ ion population within the volume enclosed by a flux surface, decomposed by toroidal\
    \ mode number $n_\\phi$. It is defined as $P_{\\rm fast,ion}(\\psi, n_\\phi) =\
    \ \\int_0^\\psi p_{\\rm abs,fast,ion}(n_\\phi)\\, dV$, where $p_{\\rm abs,fast,ion}$\
    \ is the local absorbed power density on fast ions due to wave\u2013particle interaction\
    \ for mode $n_\\phi$, and $\\psi$ labels the enclosing flux surface. Summing over\
    \ all toroidal mode numbers $n_\\phi$ recovers the species-resolved quantity [fast_ion_wave_absorbed_power_inside_flux_surface](name:fast_ion_wave_absorbed_power_inside_flux_surface).\
    \ This profile is computed by wave-heating codes (e.g. full-wave or ray-tracing\
    \ solvers) that resolve the toroidal mode spectrum of the launched wave field;\
    \ it is particularly relevant for ion cyclotron resonance heating (ICRH) scenarios\
    \ where minority fast-ion populations absorb significant power from specific low-order\
    \ modes. The mode-resolved structure enables comparison with [per_toroidal_mode_of_fast_ion_wave_absorbed_power](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power)\
    \ (the full-volume counterpart) and the analogous thermal-ion profile [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface).\
    \ The quantity is non-decreasing from the magnetic axis to the plasma boundary\
    \ for each $n_\\phi$."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
