- name: volume_averaged_effective_charge
  kind: scalar
  status: draft
  description: The volume average of the effective ionic charge Zeff over the plasma,
    providing a single global scalar characterization of bulk impurity content.
  documentation: "The volume-averaged effective charge is the plasma-volume mean of\
    \ the local effective charge $Z_\\text{eff}$, a dimensionless parameter quantifying\
    \ how multi-charged impurity species elevate the mean-square ionic charge above\
    \ the pure-hydrogen baseline. It is derived from the local [effective_charge](name:effective_charge)\
    \ profile by integrating over the confined plasma volume $V$.\n\nThe local effective\
    \ charge is defined by the ionic-density-weighted charge ratio\n\n$$\nZ_\\text{eff}(\\\
    mathbf{r}) = \\frac{\\sum_i n_i(\\mathbf{r}) \\, Z_i^2}{n_e(\\mathbf{r})}\n$$\n\
    \nwhere $n_i$ is the number density of the $i$-th ion species, $Z_i$ is the corresponding\
    \ atomic charge number, and $n_e = \\sum_i n_i Z_i$ is the electron density imposed\
    \ by quasi-neutrality. The volume-averaged quantity integrates this local value\
    \ over the confined plasma volume.\n\nThis global scalar is inferred from continuum\
    \ bremsstrahlung spectroscopy, where radiated power scales as $P_\\text{brem}\
    \ \\propto n_e^2 Z_\\text{eff} T_e^{1/2}$, or from impurity density profiles measured\
    \ by charge-exchange recombination spectroscopy. The [line_averaged_effective_charge](name:line_averaged_effective_charge)\
    \ provides an alternative single-chord diagnostic proxy, while [effective_charge_at_limiter](name:effective_charge_at_limiter)\
    \ gives the boundary value. A pure deuterium plasma has $Z_\\text{eff} = 1$; moderate\
    \ impurity levels in tokamak operation yield values in the range 1.2\u20134, with\
    \ values above 3 indicating substantial high-$Z$ contamination.\n\nSign convention:\
    \ Positive for any physical plasma composition, since all ion densities $n_i$\
    \ and charge numbers $Z_i$ entering the defining sum are non-negative."
  unit: '1'
  physics_domain: transport
  links:
  - name:effective_charge
  - name:line_averaged_effective_charge
  - name:effective_charge_at_limiter
  sources:
  - id: dd:summary/volume_average/zeff/value
    dd_path: summary/volume_average/zeff/value
    status: composed
- name: volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Electron number density averaged over the plasma volume enclosed by
    the last closed flux surface, providing the primary global scalar for discharge
    density characterization and density feedback control.
  documentation: "The volume-averaged electron density $\\langle n_e \\rangle$ is\
    \ the mean of the local electron number density integrated over the plasma volume\
    \ $V$ bounded by the last closed flux surface (LCFS). It compresses the full radial\
    \ electron density profile into a single global scalar that quantifies the total\
    \ electron content of the discharge, serving as a primary parameter in confinement\
    \ characterization and fueling control.\n\nThe defining relation is:\n\n$$\n\\\
    langle n_e \\rangle = \\frac{1}{V} \\int_V n_e(\\mathbf{r}) \\, dV\n$$\n\nwhere\
    \ $n_e(\\mathbf{r})$ is the local [electron density] and $V$ is the plasma volume\
    \ enclosed by the LCFS.\n\nMulti-channel interferometry estimates $\\langle n_e\
    \ \\rangle$ directly by combining line-integrated electron density measurements\
    \ from multiple viewing chords spanning different minor-radius positions. Profile\
    \ diagnostics such as Thomson scattering and reflectometry constrain the spatial\
    \ distribution, while equilibrium reconstruction provides the LCFS boundary geometry\
    \ that defines $V$.\n\nRepresentative values in H-mode tokamak discharges span\
    \ $0.3$\u2013$1.5 \\times 10^{20}$ m$^{-3}$, with the volume average lying below\
    \ the on-axis peak for centrally-peaked profiles. Together with [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature)\
    \ and [volume_averaged_ion_density](name:volume_averaged_ion_density), it forms\
    \ the set of global scalar parameters entering energy confinement scaling laws\
    \ and Greenwald density-limit assessments.\n\nSign convention: Positive when electrons\
    \ are present within the plasma volume."
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
