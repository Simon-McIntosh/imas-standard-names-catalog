name: poloidal_component_of_ion_momentum_diffusivity
description: Effective diffusion coefficient for ion momentum transport projected
  onto the poloidal direction in edge plasma models.
documentation: The poloidal ion momentum diffusivity $D_{\theta,\mathrm{mom}}$ (m$^2$
  s$^{-1}$) parameterizes the diffusive contribution to poloidal ion momentum transport
  through the relation $\Pi_\theta^{\mathrm{diff}} = -D_{\theta,\mathrm{mom}}\,\nabla_\theta(m_i
  n_i v_{\theta,i})$, where $m_i$ is the ion mass (kg), $n_i$ the ion density (m$^{-3}$),
  and $v_{\theta,i}$ the poloidal ion velocity (m s$^{-1}$). This coefficient captures
  the combined effects of anomalous (turbulent) and neoclassical viscosity projected
  onto the poloidal plane and is a key input to edge fluid transport codes such as
  SOLPS-ITER, SOLEDGE2D, and UEDGE. Typical values range from $\sim 10^{-2}$ m$^2$
  s$^{-1}$ (neoclassical limit) to $\sim 10$ m$^2$ s$^{-1}$ in the SOL, where strong
  anomalous transport dominates. The coefficient is specified per element on a general
  grid description (GGD), allowing non-flux-surface-aligned spatial resolution in
  the edge and divertor regions. See `ion_momentum_poloidal_diffusivity` for the closely
  related quantity and `ion_particle_poloidal_diffusivity` for the particle-channel
  counterpart.
kind: vector_component
unit: m^2.s^-1
