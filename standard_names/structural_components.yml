- name: y_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Y coordinate of the geometric centroid of a ferritic element in the
    right-handed Cartesian (x, y, z) frame, where z coincides with the vertical axis
    Z.
  documentation: "Ferritic elements are passive structural components \u2014 typically\
    \ magnetizable steel inserts \u2014 placed in tokamaks to reduce toroidal field\
    \ ripple arising from the discrete set of toroidal field coils. The geometric\
    \ centroid of such an element is its volume-averaged position, and this quantity\
    \ gives the centroid's coordinate along the $y$-axis of the right-handed Cartesian\
    \ $(x, y, z)$ frame, where $z = Z$ is the vertical axis and $x = R\\cos\\phi$,\
    \ $y = R\\sin\\phi$ relate to the cylindrical $(R, \\phi, Z)$ coordinates ($R$\
    \ = major radius, $\\phi$ = toroidal angle).\n\nThe centroid $y$ coordinate is\
    \ defined as\n\n$$\n\\bar{y} = \\frac{1}{V} \\int_V y \\, dV\n$$\n\nwhere $V$\
    \ is the total volume of the ferritic element and $y$ is the Cartesian coordinate\
    \ of each volume element.\n\nThis coordinate is determined from engineering drawings\
    \ or three-dimensional geometric models of the device. Together with [x_coordinate_of_ferritic_element_centroid](name:x_coordinate_of_ferritic_element_centroid)\
    \ and [vertical_coordinate_of_ferritic_element](name:vertical_coordinate_of_ferritic_element_centroid),\
    \ it fully specifies the three-dimensional centroid location in Cartesian space.\n\
    \nSign convention: Positive when the centroid lies in the half-space $y > 0$,\
    \ corresponding to toroidal angles $\\phi \\in (0, \\pi)$ in the cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: m
  physics_domain: structural_components
  links:
  - name:x_coordinate_of_ferritic_element_centroid
  - name:vertical_coordinate_of_ferritic_element_centroid
  sources:
  - id: dd:ferritic/object/centroid/y
    dd_path: ferritic/object/centroid/y
    status: composed
- name: volumetric_force
  kind: vector
  status: draft
  description: Net force per unit volume acting at each point of a current-carrying
    conductor or plasma element, resolved as a vector in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: "Volumetric force is the local force density vector, expressing the\
    \ net mechanical load per unit volume at each point in a material or plasma region.\
    \ In electromagnetic contexts \u2014 the primary application in tokamak structural\
    \ engineering \u2014 it is the Lorentz body-force density exerted on a current-carrying\
    \ element by the surrounding magnetic field.\n\nThe defining relation is:\n\n\
    $$\n\\mathbf{f} = \\mathbf{J} \\times \\mathbf{B}\n$$\n\nwhere $\\mathbf{J}$ is\
    \ the current density and $\\mathbf{B}$ is the magnetic flux density. The vector\
    \ is decomposed into cylindrical components [radial_volumetric_force](name:radial_volumetric_force),\
    \ [toroidal_volumetric_force](name:toroidal_volumetric_force), and [vertical_volumetric_force](name:vertical_volumetric_force)\
    \ in the right-handed $(R, \\phi, Z)$ frame. Integrating over the volume of a\
    \ structural element recovers the total [force](name:force) acting on that element.\n\
    \nThis quantity is used in magnetomechanical and structural integrity analyzes\
    \ of plasma-facing components, breeding blanket modules, and coil structures,\
    \ particularly during disruption events when rapidly changing currents induce\
    \ large transient body forces on conducting structures.\n\nSign convention: Positive\
    \ when the force component points in the $+\\hat{R}$ direction (outward from the\
    \ symmetry axis), in the $+\\hat{\\phi}$ direction (direction of increasing toroidal\
    \ angle), or in the $+\\hat{Z}$ direction (upward) in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame."
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:radial_volumetric_force
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
  - name:force
- name: radial_volumetric_force
  kind: scalar
  status: draft
  description: Radial component of the electromagnetic body-force density vector,
    projected onto the direction of increasing major radius R in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The radial volumetric force is the $\hat{R}$-projection of the local
    electromagnetic body-force density $\mathbf{f} = \mathbf{J} \times \mathbf{B}$
    acting on plasma volumes or conducting wall and structural elements. It characterizes
    the net radial push or pull arising from the interaction of local current density
    with the magnetic field, driving stress and displacement in the major-radial direction.


    The defining relation is the radial projection of the Lorentz force density in
    the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$:


    $$

    f_R = (\mathbf{J} \times \mathbf{B}) \cdot \hat{R} = J_\phi B_Z - J_Z B_\phi

    $$


    where $\mathbf{J}$ is the current density vector, $\mathbf{B}$ is the magnetic
    field, and $J_\phi$, $J_Z$, $B_\phi$, $B_Z$ are the toroidal and vertical components
    respectively.


    This component is computed in magnetohydrodynamic equilibrium analyzes and disruption-load
    assessments to quantify radial electromagnetic stresses on plasma-facing components,
    wall tiles, and blanket structures. Together with [toroidal_volumetric_force](name:toroidal_volumetric_force)
    and [vertical_volumetric_force](name:vertical_volumetric_force), it resolves the
    complete local electromagnetic body-force density vector described by [volumetric_force](name:volumetric_force).


    Sign convention: Positive when the electromagnetic force points in the direction
    of increasing major radius $R$.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
  - name:volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:wall/description_ggd/ggd/em_force_density/r
    dd_path: wall/description_ggd/ggd/em_force_density/r
    status: composed
- name: toroidal_volumetric_force
  kind: scalar
  status: draft
  description: Toroidal component of the local electromagnetic force per unit volume
    acting on plasma or material, projected onto the direction of increasing toroidal
    angle phi in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal volumetric force is the signed component of force per unit
    volume projected onto the $\hat{\phi}$ direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It represents the local body-force density that tends
    to accelerate plasma or load material in the toroidal direction.


    For electromagnetic loading, the toroidal component is the projection of the Lorentz
    force density onto $\hat{\phi}$:


    $$

    f_\phi = \mathbf{f}\cdot\hat{\phi} = (\mathbf{J}\times\mathbf{B})\cdot\hat{\phi}
    = J_Z B_R - J_R B_Z

    $$


    where $f_\phi$ is the toroidal volumetric force in $N\,m^{-3}$, $\mathbf{f}$ is
    the force density in $N\,m^{-3}$, $\mathbf{J}$ is current density in $A\,m^{-2}$,
    and $\mathbf{B}$ is magnetic field in $T$. The component labels $R$ and $Z$ denote
    projections onto the radial and vertical basis directions of the same right-handed
    cylindrical $(R, \phi, Z)$ frame.


    This quantity is usually computed from reconstructed or simulated current-density
    and magnetic-field distributions, and may be integrated over a plasma or material
    volume to obtain a net toroidal load. Direct measurement is uncommon; practical
    estimates generally combine magnetic diagnostics, current models, and electromagnetic
    or magnetohydrodynamic force calculations.


    Typical magnitudes are near zero in quiescent regions, about $10^3$-$10^7\ N\,m^{-3}$
    in conducting structures during electromagnetic transients, and can reach $10^8\
    N\,m^{-3}$ or higher in localized disruption, halo-current, or fast current-quench
    conditions.


    Sign convention: Positive when the force density is projected in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:radial_volumetric_force
  - name:vertical_volumetric_force
  - name:volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
