- name: radiance_at_spectral_line
  kind: scalar
  status: active
  description: Directional radiative power associated with an identified spectral
    transition, integrated over its line interval and normalized by projected area
    and accepted solid angle.
  documentation: 'Spectral-line radiance is the directional radiative output associated
    with one identified transition, integrated over the wavelength interval assigned
    to that line and resolved by projected area and solid angle.


    The energy-basis line radiance is defined by


    $$

    L_\ell = \int_{\Delta\lambda_\ell} L_\lambda(\lambda)\,d\lambda = \frac{dP_\ell}{dA_\perp\,d\Omega}

    $$


    where $L_\ell$ is line radiance, $L_\lambda$ is spectral radiance, $\Delta\lambda_\ell$
    is the assigned line interval, $P_\ell$ is radiant power from the transition,
    $A_\perp$ is projected area normal to the viewing direction, and $\Omega$ is solid
    angle. The energy-basis quantity is distinct from photon-number [spectral radiance](name:spectral_radiance);
    a resolved component such as [motional-Stark radiance at a spectral line](name:motional_stark_radiance_at_spectral_line)
    may use the photon-count representation and is not numerically interchangeable
    with this energy basis.'
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance
  - name:motional_stark_radiance_at_spectral_line
  sources:
  - dd_path: charge_exchange/channel/spectrum/processed_line/radiance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-spectrum-processed_line-radiance
    dd_documentation:
      leaf: Calibrated, background subtracted radiance (integrated over the spectrum
        for this line)
      parent_path: charge_exchange/channel/spectrum/processed_line
      parent: Set of processed spectral lines
      data_type: STRUCTURE
      unit: m^-2.s^-1.sr^-1
    enhanced_context:
      description: Calibrated, background-subtracted spectral radiance of a processed
        emission line from charge exchange recombination spectroscopy (CXRS), integrated
        over the line profile. Used to derive impurity density and effective charge
        (Zeff) along a line of sight.
      kind: llm
