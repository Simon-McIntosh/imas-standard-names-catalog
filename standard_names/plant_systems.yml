- name: x_component_of_shatter_cone_minor_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the minor unit vector $\hat{e}_{\mathrm{minor}}$
    that defines the minor semi-axis of the elliptical cross-section of the SPI shatter
    cone.
  documentation: 'The shatter cone minor unit vector $\hat{e}_{\mathrm{minor}}$ characterizes
    the minor semi-axis direction of the elliptical cross-section formed when the
    Shattered Pellet Injection (SPI) shatter cone intersects a plane perpendicular
    to the injector axis. This scalar quantity is the projection of $\hat{e}_{\mathrm{minor}}$
    onto the $\hat{x}$ axis of the right-handed Cartesian $(x, y, z)$ frame, i.e.,
    $e_{\mathrm{minor},x} = \hat{e}_{\mathrm{minor}} \cdot \hat{x}$. Together with
    [y_component_of_shatter_cone_minor_unit_vector](name:y_component_of_shatter_cone_minor_unit_vector)
    and [z_component_of_shatter_cone_minor_unit_vector](name:z_component_of_shatter_cone_minor_unit_vector),
    it fully specifies the orientation of $\hat{e}_{\mathrm{minor}}$ in Cartesian
    space. The vector $\hat{e}_{\mathrm{minor}}$ is orthogonal to both the cone axis
    direction (see [x_component_of_shatter_cone_direction_unit_vector](name:x_component_of_shatter_cone_direction_unit_vector))
    and the major semi-axis direction (see [x_component_of_shatter_cone_major_unit_vector](name:x_component_of_shatter_cone_major_unit_vector)),
    satisfying $|\hat{e}_{\mathrm{minor}}| = 1$ and $\hat{e}_{\mathrm{minor}} \cdot
    \hat{e}_{\mathrm{major}} = 0$. The complete parent vector is documented under
    [shatter_cone_minor_unit_vector](name:shatter_cone_minor_unit_vector). Because
    $\hat{e}_{\mathrm{minor}}$ is a unit vector, each Cartesian component lies in
    $[-1, 1]$.


    Sign convention: Positive when $\hat{e}_{\mathrm{minor}}$ has a component in the
    $+\hat{x}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
