- name: radial_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex radial component of the linearized magnetic-field
    perturbation eigenfunction in the current-free vacuum region outside the plasma,
    for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The imaginary part of the complex radial vacuum magnetic-field perturbation,
    $\delta B_R^{\rm im}$, is the quadrature component of the first-order linearized
    magnetic-field perturbation projected along $+\hat{R}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, in the current-free vacuum region surrounding the plasma.
    In linear MHD stability analysis, perturbed fields are cast as complex Fourier
    harmonics in the toroidal angle $\phi$; the imaginary part encodes the phase of
    the eigenmode relative to the normalization reference, together with the [real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part).


    In the vacuum region, $\delta\mathbf{B}$ satisfies $\nabla \times \delta\mathbf{B}
    = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The complex radial component decomposes
    as:


    $$

    \delta\tilde{B}_R^{\rm vac} = \delta B_R^{\rm re} + i\,\delta B_R^{\rm im}

    $$


    where $\delta B_R^{\rm re}$ is the [real part](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and $\delta B_R^{\rm im}$ is this imaginary part. The perturbation amplitude is
    $|\delta\tilde{B}_R^{\rm vac}| = \sqrt{(\delta B_R^{\rm re})^2 + (\delta B_R^{\rm
    im})^2}$ and the phase is $\theta = \mathrm{atan2}(\delta B_R^{\rm im},\,\delta
    B_R^{\rm re})$.


    This quantity is computed by linear MHD stability codes for a specified toroidal
    mode number $n$. Matching conditions at the plasma-vacuum interface link it to
    its plasma-region counterpart, [the radial plasma imaginary part](name:radial_perturbed_plasma_magnetic_field_imaginary_part).
    Alongside [the toroidal vacuum imaginary component](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part),
    it characterizes the helical spatial structure of the perturbed vacuum field.
    As with all linear eigenfunctions, the partition between real and imaginary parts
    depends on the phase normalization convention applied to the eigenmode.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: radial_perturbed_vacuum_magnetic_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    status: composed
- name: radial_plasma_velocity
  kind: scalar
  status: draft
  description: Radial component of the bulk plasma center-of-mass velocity, projected
    onto the outward major-radius direction in the right-handed cylindrical (R, phi,
    Z) frame.
  documentation: 'The radial plasma velocity $v_R$ is the projection of the [plasma_velocity](name:plasma_velocity)
    vector onto the $\hat{R}$ unit vector of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the major radius measured from the machine symmetry axis.
    It represents the inward or outward bulk mass flow of the plasma and is a key
    quantity for radial transport analysis in MHD descriptions of magnetized plasmas.


    The defining relation is:


    $$

    v_R = \mathbf{v}_\mathrm{plasma} \cdot \hat{R}

    $$


    where $\mathbf{v}_\mathrm{plasma}$ is the mass-weighted mean velocity of all plasma
    species and $\hat{R}$ points in the direction of increasing major radius $R$.


    Radial flows arise from pressure-gradient-driven forces, $\mathbf{E}\times\mathbf{B}$
    convection, and MHD instability dynamics. The quantity is evaluated from time-dependent
    MHD simulations on unstructured spatial grids and can be inferred experimentally
    through charge exchange recombination spectroscopy combined with magnetic equilibrium
    reconstruction. The complementary cylindrical velocity components are [toroidal_plasma_velocity](name:toroidal_plasma_velocity)
    and [vertical_plasma_velocity](name:vertical_plasma_velocity); for the projection
    along the local magnetic-field direction, see [parallel_plasma_velocity](name:parallel_plasma_velocity).


    Sign convention: Positive when directed in the direction of increasing major radius
    $R$, i.e., outward from the machine symmetry axis.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:toroidal_plasma_velocity
  - name:vertical_plasma_velocity
  - name:parallel_plasma_velocity
  sources:
  - id: dd:mhd/ggd/velocity_r/values
    dd_path: mhd/ggd/velocity_r/values
    status: composed
- name: sawtooth_period
  kind: scalar
  status: draft
  description: Time interval between two consecutive sawtooth crash events, equal
    to the duration of one complete sawtooth oscillation cycle in a tokamak plasma.
  documentation: 'The sawtooth period is the elapsed time between two successive sawtooth
    crash events, spanning one full oscillation cycle of the internal kink instability.
    Each cycle consists of a slow ramp phase during which the central safety factor
    $q_0$ falls below unity and the core electron temperature and current density
    rise quasi-steadily, followed by a rapid crash that relaxes the central profiles
    within the [sawtooth inversion surface](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius),
    homogenizing energy and particles out to the [mixing radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius).


    The period $\tau_s$ is defined as the time difference between successive crash
    events $t_{n+1}$ and $t_n$:


    $$

    \tau_s = t_{n+1} - t_n

    $$


    where $t_n$ and $t_{n+1}$ are the times of consecutive crashes identified from
    sharp drops in core electron temperature or soft X-ray emission. The sawtooth
    repetition frequency is $f_s = 1/\tau_s$.


    Crash times are routinely extracted from ECE radiometry, soft X-ray chord-integrated
    emission, or Mirnov coil signals. The period is central to sawtooth trigger model
    validation; unusually long periods can seed neoclassical tearing modes, making
    the [magnetic shear at the inversion radius](name:magnetic_shear_at_sawtooth_inversion_radius)
    a closely monitored companion quantity. In typical medium-sized tokamaks, sawtooth
    periods range from a few milliseconds to several hundred milliseconds, lengthening
    significantly when energetic fast ions from neutral beam injection or ion cyclotron
    heating stabilize the internal kink mode.


    Sign convention: Positive when $t_{n+1} > t_n$, i.e., the interval is measured
    forward in time from the earlier crash to the later crash.'
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  - name:magnetic_shear_at_sawtooth_inversion_radius
  sources:
  - id: dd:sawteeth/diagnostics/previous_period
    dd_path: sawteeth/diagnostics/previous_period
    status: composed
- name: toroidal_perturbed_plasma_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex toroidal component of the first-order
    plasma magnetic-field perturbation eigenfunction for a single toroidal Fourier
    mode in linear MHD stability analysis.
  documentation: 'The toroidal component of the complex plasma magnetic-field perturbation
    eigenfunction $\delta\mathbf{B}$ is the projection $\delta B_\phi = \delta\mathbf{B}
    \cdot \hat{\phi}$ along the toroidal unit vector $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. This imaginary part, $\mathrm{Im}(\delta B_\phi)$,
    together with the [real part](name:toroidal_perturbed_plasma_magnetic_field_real_part),
    fully specifies the complex toroidal component of the [perturbed plasma magnetic-field](name:perturbed_plasma_magnetic_field)
    eigenfunction associated with a single toroidal mode number $n$ within the confined
    plasma region.


    The full complex toroidal amplitude is decomposed as:


    $$

    \delta B_\phi = \mathrm{Re}(\delta B_\phi) + i\,\mathrm{Im}(\delta B_\phi)

    $$


    where the ratio of imaginary to real parts encodes the spatial phase of the perturbation
    relative to the chosen eigenmode gage convention. The absolute magnitude of the
    eigenfunction is normalization-dependent and is set by the stability solver''s
    normalization choice.


    This quantity is defined within the confined plasma region and is computed alongside
    [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    and [radial_perturbed_plasma_magnetic_field_imaginary_part](name:radial_perturbed_plasma_magnetic_field_imaginary_part)
    to fully characterize the phase-resolved perturbed magnetic-field vector inside
    the plasma. The vacuum-region counterpart for the same toroidal component is [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part).


    Sign convention: Positive when $\mathrm{Im}(\delta B_\phi)$ is directed along
    increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:perturbed_plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    status: composed
- name: toroidal_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex toroidal component of the first-order plasma
    magnetic-field perturbation eigenfunction for a specified toroidal Fourier mode
    in linear MHD stability analysis.
  documentation: 'The toroidal perturbed plasma magnetic-field real part is the real
    component of the complex eigenfunction $\delta\tilde{B}_\phi(R,Z)$, the projection
    of the first-order plasma magnetic-field perturbation onto the toroidal unit vector
    $\hat{\phi}$ in the plasma region for one specified toroidal mode number $n$.
    It forms a conjugate pair with [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part)
    that fully specifies the complex phasor $\delta\tilde{B}_\phi$.


    In linear MHD stability analysis the perturbed magnetic field is expressed in
    the toroidal Fourier basis:


    $$

    \delta B_\phi(R, \phi, Z, t) = \operatorname{Re}\!\left[\delta\tilde{B}_\phi(R,Z)\,
    e^{i(n\phi - \omega t)}\right]

    $$


    where $\delta\tilde{B}_\phi(R,Z)$ is the complex eigenfunction amplitude resolved
    in the poloidal cross-section $(R,Z)$, $n$ is the toroidal mode number, $\omega$
    is the complex mode frequency, and the quantity stored here is $\operatorname{Re}[\delta\tilde{B}_\phi(R,Z)]$.


    The eigenfunction is obtained from linear MHD stability solvers that linearize
    the ideal or resistive MHD equations about an axisymmetric equilibrium; the absolute
    amplitude depends on the normalization convention of the solver''s eigenfunction.
    The radial and poloidal counterparts within the plasma region are [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part),
    and the vacuum-region analog at the same toroidal mode number is [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part).


    Sign convention: Positive when $\operatorname{Re}[\delta\tilde{B}_\phi]$ points
    in the direction of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/real
    status: composed
- name: toroidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the phi-directed component, in the right-handed cylindrical
    (R, phi, Z) frame, of the complex first-order plasma velocity perturbation eigenfunction
    for a specified toroidal Fourier harmonic in linear MHD.
  documentation: 'Toroidal perturbed plasma velocity real part is the real component
    of the complex first-order plasma velocity perturbation eigenfunction projected
    along $\hat{\boldsymbol{\phi}}$, the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. It describes the oscillatory flow perturbation associated
    with a specified toroidal Fourier harmonic, not the equilibrium rotation.


    The component is defined by the projection of the complex velocity eigenfunction
    onto the toroidal basis direction:


    $$

    v_{\phi,\mathrm{Re}}(R,Z) = \operatorname{Re}\!\left[\widetilde{\mathbf v}(R,Z)\cdot\hat{\boldsymbol{\phi}}\right]

    $$


    where $v_{\phi,\mathrm{Re}}$ is in m.s^-1, $R$ and $Z$ are in m, $\widetilde{\mathbf
    v}$ is the complex perturbed velocity eigenfunction in m.s^-1, $\hat{\boldsymbol{\phi}}$
    is dimensionless, and $\operatorname{Re}$ denotes the real part. With toroidal
    dependence proportional to $\exp(i n\phi)$, $n$ is the dimensionless toroidal
    mode number, $\phi$ is in radians, and $i$ is the dimensionless imaginary unit.


    For a static ideal-MHD equilibrium and temporal factor $\exp(-i\omega t)$, the
    full complex vector is constrained by the linearized momentum balance $-i\omega\rho_0\widetilde{\mathbf
    v}= -\nabla\widetilde p + [(\nabla\times\widetilde{\mathbf B})\times\mathbf B_0
    + (\nabla\times\mathbf B_0)\times\widetilde{\mathbf B}]/\mu_0$, coupled to the
    induction and pressure equations. Here $\omega$ is the complex eigenfrequency
    in s^-1, $t$ is time in s, $\rho_0$ is equilibrium mass density in kg.m^-3, $\widetilde
    p$ is pressure perturbation in Pa, $\nabla$ is the spatial derivative operator
    in m^-1, $\widetilde{\mathbf B}$ and $\mathbf B_0$ are magnetic fields in T, and
    $\mu_0$ is magnetic permeability in H.m^-1.


    This quantity is normally computed from a linear MHD eigenmode calculation and
    compared with measurements only after choosing a mode amplitude and complex phase.
    Velocity fluctuations may be constrained directly by spectroscopic or imaging
    diagnostics, or indirectly through magnetic and density fluctuation measurements
    combined with a mode model. Because a complex eigenvector can be multiplied by
    an arbitrary complex constant, the real and imaginary parts depend on the chosen
    normalization and phase; if a local phase angle is needed, it should be formed
    with $\operatorname{atan2}(v_{\phi,\mathrm{Im}},v_{\phi,\mathrm{Re}})$ so that
    quadrant information is retained.


    Typical values are normalization-dependent. For eigenfunctions scaled to measured
    coherent fluctuations, $|v_{\phi,\mathrm{Re}}|$ is often 1-10^3 m.s^-1 for low-frequency
    tearing or kink-like activity and 10^2-10^5 m.s^-1 for faster Alfvenic perturbations;
    values outside these ranges can occur under different eigenvector normalizations.


    Sign convention: Positive when $v_{\phi,\mathrm{Re}}$ is directed toward increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_velocity
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    status: composed
- name: toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex toroidal component of the first-order
    magnetic-field perturbation eigenfunction in the current-free vacuum region, for
    a specified toroidal mode number in linear MHD stability analysis.
  documentation: "In linear MHD stability analysis for a specified toroidal mode number\
    \ $n$, the first-order magnetic-field perturbation $\\delta\\mathbf{B}$ in the\
    \ current-free vacuum region surrounding the plasma is a complex eigenfunction\
    \ satisfying $\\nabla \\times \\delta\\mathbf{B} = 0$ and $\\nabla \\cdot \\delta\\\
    mathbf{B} = 0$. This name gives the imaginary part of the toroidal projection\
    \ of that eigenfunction:\n\n$$\n\\delta B_\\phi^\\mathrm{vac} = \\delta\\mathbf{B}^\\\
    mathrm{vac} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\hat{\\phi}$ is the unit vector\
    \ in the direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, so that $\\delta B_\\phi^\\mathrm{vac} = \\mathrm{Re}(\\\
    delta B_\\phi^\\mathrm{vac}) + i\\,\\mathrm{Im}(\\delta B_\\phi^\\mathrm{vac})$.\n\
    \nThe real part is given by [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part),\
    \ and together they constitute the parent complex eigenfunction [toroidal_perturbed_vacuum_magnetic_field](name:toroidal_perturbed_vacuum_magnetic_field).\
    \ Boundary conditions at the plasma\u2013vacuum interface link this vacuum eigenfunction\
    \ to the corresponding plasma-region toroidal component [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part);\
    \ the radial vacuum counterpart is [radial_perturbed_vacuum_magnetic_field_imaginary_part](name:radial_perturbed_vacuum_magnetic_field_imaginary_part).\
    \ Absolute eigenfunction amplitudes are normalization-convention-dependent in\
    \ linear stability calculations.\n\nSign convention: Positive when $\\mathrm{Im}(\\\
    delta B_\\phi^\\mathrm{vac})$ is directed in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
