- name: per_toroidal_mode_thermal_ion_power
  kind: scalar
  status: draft
  description: Cumulative coherent-wave power absorbed by bulk thermal ions inside
    a flux surface, resolved by toroidal mode number. It is the toroidal-mode spectrum
    of thermal-ion heating.
  documentation: 'Per-toroidal-mode thermal-ion power is the cumulative rate at which
    a coherent wave transfers energy to the bulk thermal ion population for a single
    toroidal Fourier mode. The toroidal mode number labels Fourier structure in the
    toroidal angle $\phi$ of the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height; it
    is not a cyclotron resonance harmonic order.


    For a closed flux surface labeled by a radial surface label $\rho$, the cumulative
    power for ion species $i$ and toroidal mode $n$ is the volume integral of the
    corresponding local absorbed power density:


    $$

    P_{i,n}(\rho) = \int_{V(\rho)} p_{i,n}(\mathbf{x})\, dV

    $$


    where $P_{i,n}$ is the cumulative absorbed power in W, $p_{i,n}$ is the [per-toroidal-mode
    thermal-ion power density](name:per_toroidal_mode_thermal_ion_power_density) in
    W m$^{-3}$, $dV$ is a volume element in m$^3$, and $V(\rho)$ is the plasma volume
    enclosed by the selected flux surface. Summing $P_{i,n}$ over toroidal mode number
    gives the corresponding [thermal-ion power inside the flux surface](name:thermal_ion_power_at_inside_flux_surface)
    in W.


    This quantity is usually computed from coherent-wave heating calculations by decomposing
    the wave field or absorbed power density into toroidal Fourier modes and integrating
    the wave-particle energy transfer over the chosen plasma volume. Experimentally
    it is inferred indirectly through consistency between wave coupling, ion heating,
    power balance, and equilibrium or transport analysis rather than measured as a
    separate direct observable.


    Typical per-mode values range from near 0 W for weakly coupled modes to $10^3$-$10^7$
    W for strongly absorbed radio-frequency heating in medium and large tokamaks.
    The sum over modes is bounded by the absorbed wave power available to thermal
    ions and can vary strongly with species composition, resonance location, wave
    spectrum, and plasma temperature.


    Sign convention: Positive when electromagnetic wave energy is absorbed by the
    bulk thermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_electron_power
  - name:per_toroidal_mode_fast_ion_power
