- name: ion_average_temperature_at_pedestal_top
  kind: scalar
  status: draft
  description: Ion average temperature at the pedestal top is the density-weighted
    temperature of all ion species and charge states evaluated at the core-side shoulder
    of the H-mode pedestal. The pedestal top is distinct from the pedestal foot near
    the separatrix and scrape-off layer.
  documentation: 'Ion average temperature at the pedestal top is the ion_average_temperature
    evaluated at the core-side shoulder of the H-mode edge transport barrier. Moving
    outward from the plasma center, this location marks the transition from the central
    plasma to the steep-gradient pedestal region; it is distinct from the pedestal
    foot on the separatrix and scrape-off-layer side.


    For ion populations indexed by $j$, where each population corresponds to a species
    and charge state, the pedestal-top average is commonly defined as a density-weighted
    mean:


    $$

    \langle T_i \rangle_{\mathrm{top}} = \frac{\sum_j n_{j,\mathrm{top}} T_{j,\mathrm{top}}}{\sum_j
    n_{j,\mathrm{top}}}

    $$


    where $T_{j,\mathrm{top}}$ is the temperature of ion population $j$ in eV, $n_{j,\mathrm{top}}$
    is its number density in m^-3, and the subscript $\mathrm{top}$ denotes evaluation
    at the pedestal-top radial location. If the value is used to estimate SI ion thermal
    pressure, the eV-valued temperature must be converted by the elementary charge:
    $p_i = e\,n_i\langle T_i\rangle_{\mathrm{top}}$, with $n_i = \sum_j n_{j,\mathrm{top}}$.


    In practice, this quantity is inferred from edge ion-temperature measurements
    such as charge-exchange recombination spectroscopy, neutral-particle analysis,
    or integrated kinetic analysis, combined with an identification of the pedestal-top
    location from the measured radial variation of temperature, density, or pressure.
    When only impurity-ion temperatures are measured, main-ion temperature estimates
    require collisional equilibration or transport assumptions.


    Typical pedestal-top ion average temperatures range from 100-1000 eV in smaller
    or moderate-performance H-mode plasmas and from 1000-5000 eV in large, high-performance
    H-mode plasmas. The value varies with heating power, pedestal density, isotope
    mix, collisionality, and edge-localized-mode phase.'
  unit: eV
  physics_domain: edge_plasma_physics
  links: []
- name: ion_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of ions evaluated at the H-mode pedestal top, the radial
    location where the steep edge transport barrier transitions toward the flatter
    core plasma.
  documentation: "Ion number density at the pedestal top is the local number of ions\
    \ per unit volume at the top of the H-mode edge transport barrier. The pedestal\
    \ top marks the inner shoulder of the steep-gradient region where the edge density\
    \ gradient relaxes toward the more weakly varying confined-plasma core profile,\
    \ and is a primary characterization point for H-mode confinement quality.\n\n\
    As the parent entry in the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family, this quantity generalizes over any ion population evaluated at that\
    \ locus. The primary concrete specialization is [total_ion_density_at_pedestal_top](name:total_ion_density_at_pedestal_top),\
    \ which sums contributions over all ion species and charge states. Species-resolved\
    \ siblings such as [deuterium_density_at_pedestal_top](name:deuterium_density_at_pedestal_top)\
    \ and [hydrogen_density_at_pedestal_top](name:hydrogen_density_at_pedestal_top)\
    \ provide single-species values at the same radial location.\n\nThe ion densities\
    \ at the pedestal top are related to the local electron density through the quasi-neutrality\
    \ condition:\n\n$$\nn_e = \\sum_s Z_s \\, n_s\n$$\n\nwhere $n_e$ is the electron\
    \ number density, $Z_s$ is the charge number of ion species $s$, and $n_s$ is\
    \ its number density at the pedestal top.\n\nIon pedestal densities are inferred\
    \ from Thomson scattering electron density profiles combined with quasi-neutrality,\
    \ from charge-exchange recombination spectroscopy for individual species, or from\
    \ neutral beam diagnostics. In H-mode tokamaks, pedestal-top number densities\
    \ span roughly $1$\u2013$10 \\times 10^{19}$ m$^{-3}$, depending on plasma current,\
    \ magnetic field, and fueling."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:total_ion_density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  - name:hydrogen_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: ion
    operator_kind: qualifier
- name: ion_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of ions at the plasma boundary, the last closed flux
    surface separating the magnetically confined plasma from the open-field-line scrape-off
    layer.
  documentation: "Ion density at the plasma boundary is the number of ions per unit\
    \ volume evaluated at the separatrix, the last closed flux surface that divides\
    \ the magnetically confined plasma from the open-field-line scrape-off layer.\
    \ The quantity may be resolved by individual ion species or aggregated over all\
    \ charged ion species; [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary)\
    \ provides the unweighted all-species sum, while the parent [density_at_plasma_boundary](name:density_at_plasma_boundary)\
    \ extends the concept to electrons and neutral particles.\n\nThe flux-surface-averaged\
    \ ion density at the separatrix is:\n\n$$\n\\langle n_i \\rangle_{\\rm sep} =\
    \ \\frac{\\oint_{\\rm LCFS} n_i \\, dS}{\\oint_{\\rm LCFS} dS}\n$$\n\nwhere $n_i$\
    \ is the local ion number density of the selected species and the surface integrals\
    \ are evaluated on the last closed flux surface.\n\nThis boundary value anchors\
    \ radial transport models as the outermost constraint and provides the upstream\
    \ particle density input for scrape-off-layer and divertor simulations. It is\
    \ inferred from edge Thomson scattering, reflectometry, or Langmuir probe ion\
    \ saturation current measurements at or near the separatrix. Typical separatrix\
    \ ion densities span $10^{18}$\u2013$10^{20}$ m$^{-3}$ in medium to large tokamaks,\
    \ rising with plasma current and heating power. The species-resolved flux-surface\
    \ average is provided by [flux_surface_averaged_ion_species_density_at_plasma_boundary],\
    \ while [density_at_divertor_target](name:density_at_divertor_target) gives the\
    \ analogous quantity at the downstream divertor surface.\n\nSign convention: Positive\
    \ when ions occupy the plasma boundary region; this quantity is invariant under\
    \ reversal of the toroidal angle $\\phi$ direction."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_density_at_plasma_boundary
  - name:density_at_plasma_boundary
  - name:density_at_divertor_target
