  - name:ion_power_at_inner_divertor_target
  - name:energy_flux_at_divertor_target
  - name:maximum_power_at_inner_divertor_target
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Rate at which incident electron energy is deposited on the high-field-side
    inner divertor target, integrated over its wetted strike-zone surface.
  documentation: 'Electron power at the inner divertor target is the rate at which
    energy carried by incident electrons is deposited on the high-field-side divertor
    target surface. It is the electron-channel contribution to the total target load,
    rather than the combined contribution of all incident energy channels.


    The deposited electron power is defined by the surface integral


    $$

    P_{e,\mathrm{inner}} = \int_{A_{\mathrm{wet,inner}}} q_{e,\mathrm{dep}}(\mathbf{x})\,dA

    $$


    where $A_{\mathrm{wet,inner}}$ is the wetted inner-target area, $q_{e,\mathrm{dep}}$
    is the electron energy-deposition flux density in W m$^{-2}$, and $dA$ is an element
    of target surface area in m$^2$. The result is the electron contribution to [power
    at the inner divertor target](name:power_at_inner_divertor_target); ion energy
    is represented separately by [ion power at the inner divertor target](name:ion_power_at_inner_divertor_target),
    while neutral and radiative contributions are excluded.'
