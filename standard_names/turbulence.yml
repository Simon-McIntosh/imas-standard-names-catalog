- name: perpendicular_gyrocenter_pressure
  kind: scalar
  status: draft
  description: Normalized perpendicular pressure moment of the perturbed gyrocenter
    distribution, weighted by the first-order Bessel function J1, for a linear gyrokinetic
    eigenmode.
  documentation: The perpendicular pressure moment of the perturbed gyrocenter distribution
    function, normalized to a reference value, is defined as the velocity-space integral
    of the product of the perturbed gyrocenter distribution, the perpendicular energy
    (proportional to the square of the perpendicular velocity), and the first-order
    Bessel function J1. This weighting arises from the gyroaverage operation in gyrokinetic
    theory, accounting for finite Larmor radius effects. The moment characterizes
    the perpendicular temperature perturbation associated with a linear eigenmode,
    typically derived from gyrokinetic simulations using a local flux-tube model.
    Typical values in the plasma core range from 1e-5 to 1 (normalized), with the
    sign determined by the eigenmode structure. Normalization is to a reference pressure,
    often the equilibrium thermal pressure at a reference radius.
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_pressure
  - name:perpendicular_gyrocenter_energy
  - name:normalized_total_pressure
  arguments:
