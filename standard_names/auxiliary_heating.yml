- name: fast_electron_power_density
  kind: scalar
  status: draft
  description: RF wave energy absorption rate per unit volume by the fast, suprathermal
    electron population. It represents the non-thermal electron channel of wave power
    deposition.
  documentation: 'Fast electron power density is the rate per unit volume at which
    an RF wave deposits energy in the suprathermal electron population. It is a volumetric
    source term for the fast-electron energy balance; fast denotes the modeled non-thermal
    part of the electron distribution rather than a universal sharp energy threshold.


    For a local point $\mathbf{x}$, a kinetic definition is obtained by taking the
    particle-energy moment of the wave-driven part of the fast-electron distribution
    evolution:


    $$

    p_\mathrm{fast}(\mathbf{x}) = \int \frac{1}{2} m_e v^2 \, \mathcal{C}_\mathrm{wave}[f_\mathrm{fast}](\mathbf{x},\mathbf{v})
    \, d^3v

    $$


    where $m_e$ is the electron mass, $v$ is particle speed, $f_\mathrm{fast}$ is
    the fast-electron distribution function with units $s^3 m^{-6}$, $d^3v$ is the
    velocity-space volume element with units $m^3 s^{-3}$, and $\mathcal{C}_\mathrm{wave}[f_\mathrm{fast}]$
    is the wave-driven contribution to $\partial f_\mathrm{fast}/\partial t$ with
    units $s^2 m^{-6}$. When the quantity is associated with a flux coordinate $\rho$
    such as normalized toroidal flux radius, it denotes the flux-surface average of
    this local volumetric density, not the cumulative power. The cumulative fast-electron
    power inside a surface labeled by $\rho$ is related by $P_\mathrm{fast}(<\rho)=\int_{V(\rho)}
    p_\mathrm{fast}\,dV$, and the corresponding differential volume density is $dP_\mathrm{fast}/dV=(dP_\mathrm{fast}/d\rho)/(dV/d\rho)$.


    In practice this quantity is usually inferred from wave-particle absorption calculations
    constrained by launched RF power, antenna or launcher configuration, magnetic
    equilibrium, and plasma profiles. Experimental checks can come from global power
    balance and from diagnostics sensitive to suprathermal electrons, such as non-thermal
    radiation or energetic-electron emission, but the local partition between thermal
    and fast-electron channels is generally model dependent.


    Representative magnitudes span a wide range because RF deposition can be broad
    or highly localized. Core values of about $10^3-10^7$ W m$^{-3}$ are typical order-of-magnitude
    levels for auxiliary heating, with smaller values in weakly absorbing regions
    and larger peaks possible for strongly localized absorption.


    Sign convention: Positive when RF wave energy is transferred from the wave field
    to the fast electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
