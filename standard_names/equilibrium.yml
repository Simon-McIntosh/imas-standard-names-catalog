    dd_path: equilibrium/time_slice/boundary/outline/r
    status: composed
- name: major_radius_of_secondary_x_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the secondary poloidal-field null on the
    separatrix, defining the additional X-point in a snowflake or similar divertor
    configuration.
  documentation: "The major radius $R_{\\rm X2}$ of the secondary X-point locates\
    \ the poloidal-field null on the secondary separatrix in the $(R,\\phi,Z)$ frame.\
    \ This geometric coordinate is essential for characterizing advanced divertor\
    \ topologies such as snowflake or X-divertor configurations, where a secondary\
    \ null alters the magnetic shear in the scrape-off layer. The secondary X-point\
    \ typically lies at a larger major radius than the primary X-point in a lower-single-null\
    \ discharge, or symmetrically for double-null configurations. Its position is\
    \ routinely inferred from equilibrium reconstruction codes (e.g., EFIT, LIUQE)\
    \ using external magnetic measurements and profile constraints. Typical $R_{\\\
    rm X2}$ values are 1.5\u20133.0\u202Fm in medium-size tokamaks, placing it near\
    \ the divertor region. See also [major_radius_of_x_point](name:major_radius_of_x_point)\
    \ for the primary X-point and [major_radius_of_separatrix](name:major_radius_of_separatrix)\
    \ for the separatrix outline.\n\nSign convention: Positive when $R_{\\rm X2}$\
    \ lies radially outward of the machine symmetry axis ($R=0$)."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_x_point
  - name:major_radius_of_separatrix
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    status: composed
- name: major_radius_of_separatrix
  kind: scalar
  status: draft
  description: Major radius coordinate of the outermost closed magnetic flux surface
    (the separatrix) in the poloidal cross-section.
  documentation: "The major radius $R_{\\text{sep}}$ is the $R$ coordinate in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame measured from the machine symmetry\
    \ axis to the separatrix outline at a given poloidal angle. The separatrix defines\
    \ the last closed flux surface; its shape is reconstructed from magnetic diagnostics\
    \ and equilibrium codes such as EFIT or LIUQE. In diverted tokamaks, $R_{\\text{sep}}$\
    \ at the outer midplane typically ranges from 2.0\u20138.0 m and sets the location\
    \ of the plasma boundary, influencing scrape-off layer widths and divertor heat\
    \ flux patterns. This quantity is a geometric coordinate for a single point on\
    \ the separatrix, distinguished from [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)\
    \ and [major_radius_of_x_point](name:major_radius_of_x_point), which describe\
    \ the full boundary shape and the X-point location.\n\nSign convention: Positive\
    \ when the point lies in the direction of increasing $R$ (outward from the machine\
    \ axis)."
  unit: m
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:major_radius_of_x_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/outline/r
    dd_path: equilibrium/time_slice/boundary_separatrix/outline/r
    status: composed
- name: major_radius_of_x_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the primary poloidal-field null on the separatrix
    in a diverted tokamak configuration.
  documentation: "The major radius $R_{X}$ of the primary X-point locates the poloidal-field\
    \ null on the separatrix where $\\nabla\\psi = 0$ and $B_p = 0$, defining the\
    \ divertor entrance. In single-null diverted plasmas, this point determines the\
    \ magnetic geometry of the scrape-off layer and the strike-point positions on\
    \ the divertor targets. Typical values range from $R_X \\approx 1.5$ m in medium-size\
    \ tokamaks (ASDEX Upgrade, DIII-D) to $R_X \\approx 0.6$ m and $R_X \\approx \u83F1\
    .3$ m for the inboard and outboard divertor regions of ITER. The primary X-point\
    \ major radius is routinely obtained from equilibrium reconstruction codes using\
    \ magnetic diagnostics and is distinguished from the secondary X-point by the\
    \ higher poloidal flux gradient magnitude; see [major_radius_of_secondary_x_point](name:major_radius_of_secondary_x_point)\
    \ for the secondary null and [major_radius_of_separatrix](name:major_radius_of_separatrix)\
    \ for the separatrix outline.\n\nSign convention: Positive when the X-point lies\
    \ on the outboard side of the magnetic axis ($R_X > R_{\\mathrm{axis}}$), corresponding\
    \ to the usual lower-single-null divertor configuration.\n\nCompared to the geometric\
    \ axis, the X-point major radius is a crucial input for divertor design and plasma\
    \ control, and its vertical counterpart is given by [vertical_coordinate_of_x_point](name:vertical_coordinate_of_x_point)."
  unit: m
  physics_domain: equilibrium
  links:
