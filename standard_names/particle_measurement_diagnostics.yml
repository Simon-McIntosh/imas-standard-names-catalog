- name: lower_bound_energy_of_neutron_detector
  kind: scalar
  status: active
  description: Lower kinetic-energy boundary of a neutron detector spectral band,
    defining the minimum neutron energy assigned to that band.
  documentation: "The lower neutron energy threshold is the low-energy endpoint of\
    \ one spectral band assigned to a neutron detector. It defines the minimum neutron\
    \ kinetic energy included in the band described by [energy_of_neutron_detector](name:energy_of_neutron_detector).\n\
    \n$$\nE_{\\mathrm{lower}} = \\inf \\mathcal{B}\n$$\n\nwhere $\\mathcal{B}$ is\
    \ the set of neutron kinetic energies assigned to the band and $E_{\\mathrm{lower}}$\
    \ is its lower boundary. The band\u2019s corresponding upper boundary is given\
    \ by [neutron_maximum_energy_of_neutron_detector](name:neutron_maximum_energy_of_neutron_detector).\
    \ This threshold specifies spectral selection; it is not a detection probability\
    \ or an event rate, which are represented by [efficiency_of_neutron_detector](name:efficiency_of_neutron_detector)\
    \ and [neutron_rate_of_neutron_detector](name:neutron_rate_of_neutron_detector),\
    \ respectively."
  unit: eV
