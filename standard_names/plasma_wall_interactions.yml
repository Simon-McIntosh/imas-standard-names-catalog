- name: ratio_of_volume_averaged_tungsten_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless tungsten abundance ratio equal to the plasma-volume-averaged
    elemental tungsten density divided by the plasma-volume-averaged electron density.
  documentation: 'Dimensionless tungsten abundance ratio equal to the plasma-volume-averaged
    elemental tungsten density divided by the plasma-volume-averaged electron density.
    It compares the charge-state-summed tungsten-ion population with the free-electron
    population in the same plasma volume.


    The ratio is defined from the two volume averages over the plasma volume $V$ as


    $$

    a_{\mathrm{W},V}

    =

    \frac{\langle n_{\mathrm{W}}\rangle_V}{\langle n_e\rangle_V}

    =

    \frac{V^{-1}\int_V \sum_{z=1}^{74} n_{\mathrm{W}^{z+}}(\mathbf{x})\, dV}{V^{-1}\int_V
    n_e(\mathbf{x})\, dV}

    $$


    where $a_{\mathrm{W},V}$ denotes this tungsten abundance ratio, $V$ denotes the
    plasma volume enclosed by the last closed flux surface over which both averages
    are formed, $\langle n_{\mathrm{W}}\rangle_V$ is the [volume-averaged tungsten
    density](name:volume_averaged_tungsten_density), $\langle n_e\rangle_V$ is the
    [volume-averaged electron density](name:volume_averaged_electron_density), $n_{\mathrm{W}^{z+}}(\mathbf{x})$
    is the local number density of tungsten ions in charge state $z$ at position $\mathbf{x}$,
    $n_e(\mathbf{x})$ is the local free-electron number density, $z=1,\ldots,74$ indexes
    the positive tungsten ionization states, and $dV$ is the volume element.


    The scope is the confined plasma volume: both numerator and denominator use the
    same volume and the same volume-averaging operation. The tungsten population is
    elemental tungsten in positive ionization states, summed over charge state; neutral
    tungsten is excluded. The aggregation is the ratio of the two volume averages,
    not the volume average of the local ratio $n_{\mathrm{W}}/n_e$, and the quantity
    is defined only when $\langle n_e\rangle_V$ is nonzero.


    This ratio is an unweighted tungsten-nucleus abundance relative to free electrons;
    it is not a charge-weighted tungsten contribution to electron density and is not
    an effective-charge measure. It is the tungsten member of the same volume-averaged
    composition-ratio family as the [deuterium-tritium abundance ratio](name:ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density)
    and the [carbon abundance ratio](name:ratio_of_volume_averaged_carbon_density_to_volume_averaged_electron_density),
    which replace the tungsten numerator with the corresponding species volume average
    while retaining the same electron-density denominator.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links: []
  sources:
  - dd_path: summary/composition/tungsten/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-composition-tungsten-value
    dd_documentation:
      leaf: Value
      parent_path: summary/composition/tungsten
      parent: Tungsten (W)
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: active
    enhanced_context:
