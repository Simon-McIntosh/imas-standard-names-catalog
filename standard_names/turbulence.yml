        plasma microinstabilities.
      kind: llm
- name: normalized_gyrocenter_perturbed_pressure
  kind: vector
  status: active
  description: Two-component vector of the normalized pressure moment of the perturbed
    gyrocenter distribution, with components parallel and perpendicular to the local
    magnetic field, each normalized to a reference thermal pressure.
  documentation: 'The normalized gyrocenter perturbed pressure is a vector quantity
    collecting the dimensionless parallel and perpendicular thermal-pressure responses
    of the non-equilibrium part of the gyrocenter distribution function $\delta f_s$
    for a single plasma species, normalized to a reference thermal pressure $p_{\mathrm{ref}}
    = n_{\mathrm{ref}} T_{\mathrm{ref}}$. It generalizes the scalar gyrocenter_perturbed_pressure
    to the full anisotropic pressure decomposition along and across the local magnetic
    field direction $\hat{b}$.


    The two components are defined as velocity-space integrals:


    $$

    \hat{p}_{\parallel/\perp,\,s} = \frac{m_s}{p_{\mathrm{ref}}} \int w_{\parallel/\perp}\,
    \delta f_s\, d^3v

    $$


    where $m_s$ is the species mass, the weight $w_\parallel = v_\parallel^2$ defines
    the parallel component (see parallel_normalized_gyrocenter_perturbed_pressure)
    and $w_\perp = v_\perp^2/2$ defines the perpendicular gyrotropic component (see
    [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)),
    with $v_\parallel$ and $v_\perp$ the velocity projections along and across $\hat{b}$
    respectively.


    This vector is computed in gyrokinetic simulations as part of the velocity-space
    moment hierarchy characterizing pressure anisotropy driven by electromagnetic
    fluctuations. Gyroaveraged variants incorporating finite-Larmor-radius corrections
    are provided by perpendicular_normalized_gyrocenter_gyroaveraged_pressure and
    parallel_normalized_gyrocenter_gyroaveraged_pressure.


    Sign convention: Positive when the perturbed gyrocenter distribution function
    increases the respective pressure moment above the equilibrium reference value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
- name: normalized_linear_growth_rate_of_gyrokinetic_eigenmode
  kind: scalar
  status: active
  description: Dimensionless imaginary part of the complex linear gyrokinetic eigenmode
    frequency, divided by the positive reference angular frequency, at a specified
    wavevector perpendicular to the equilibrium magnetic field in the local flux-tube
    approximation. Positive values represent exponential growth and negative values
    represent damping.
  documentation: 'Dimensionless imaginary part of the complex linear gyrokinetic eigenmode
    frequency, divided by the positive reference angular frequency, is the normalized
    temporal growth rate of a linear gyrokinetic eigenmode at a specified wavevector
    perpendicular to the equilibrium magnetic field in the local flux-tube approximation.
    It identifies the exponential amplitude change of that eigenmode in linear gyrokinetic
    theory.


    The defining normalization is


    $$

    \gamma_\mathrm{norm} = \frac{\operatorname{Im}\omega}{\omega_\mathrm{ref}}

    $$


    where $\omega$ is the complex eigenfrequency for time dependence $\exp(-i\omega
    t)$ and $\omega_\mathrm{ref}>0$ is the reference angular frequency used for the
    normalized eigenfrequency. When the reference angular frequency is written as
    $v_{\mathrm{th,ref}}/L_\mathrm{ref}$, this is equivalently $\gamma_\mathrm{norm}=\gamma
    L_\mathrm{ref}/v_{\mathrm{th,ref}}$, with $\gamma=\operatorname{Im}\omega$, $v_{\mathrm{th,ref}}$
    the reference thermal speed, and $L_\mathrm{ref}$ the reference length scale.


    This quantity is for one linear gyrokinetic eigenmode at one specified perpendicular
    wavevector, not for a spectrum-averaged rate, nonlinear turbulent growth, or finite-amplitude
    envelope evolution. It is the imaginary-part counterpart to the [normalized_frequency_of_gyrokinetic_eigenmode](name:normalized_frequency_of_gyrokinetic_eigenmode),
    which uses the real part of the same $\omega$; the eigenmode-specific scope distinguishes
    it from [normalized_growth_rate](name:normalized_linear_growth_rate_of_gyrokinetic_eigenmode),
    which does not by itself require a linear gyrokinetic eigenvalue.


    Sign convention: Positive when the eigenmode amplitude increases exponentially
    with time.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_frequency_of_gyrokinetic_eigenmode
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/growth_rate_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-growth_rate_norm
    dd_documentation:
