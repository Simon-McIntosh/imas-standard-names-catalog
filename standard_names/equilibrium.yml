- name: poloidal_magnetic_flux_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Poloidal magnetic-flux contribution generated by currents associated
    with plasma diamagnetic drift, isolating the equilibrium flux linked to pressure-gradient
    drift motion.
  documentation: 'This quantity is the poloidal part of the magnetic-flux contribution
    associated with diamagnetic drift currents in a magnetized plasma. It refines
    [magnetic flux due to diamagnetic drift](name:magnetic_flux_due_to_diamagnetic_drift)
    by selecting the poloidal magnetic-flux component rather than the total flux contribution.
    It is closely related to the reference equilibrium flux [poloidal magnetic flux
    at plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary), but represents
    only the diamagnetic-drift contribution.


    A useful axisymmetric definition is the contribution to the poloidal flux obtained
    by integrating the vertical diamagnetic magnetic-field component over a horizontal
    disk in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    \psi_{\rm dia}(R,Z) = \int_0^R B_{Z,{\rm dia}}(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi_{\rm dia}$ is the diamagnetic-drift contribution to poloidal magnetic
    flux, $B_{Z,{\rm dia}}$ is the vertical magnetic field produced by diamagnetic
    drift currents, and $R$ and $Z$ are major radius and vertical height. The associated
    diamagnetic current is driven by pressure gradients, so this flux contribution
    is sensitive to plasma pressure and magnetic geometry.


    It is inferred from compensated diamagnetic flux-loop measurements or computed
    from equilibrium reconstructions that include pressure-gradient current effects.
    Representative magnitudes range from about $10^{-3}$-$10^{-1}$ Wb in present tokamaks,
    increasing with plasma pressure, volume, and magnetic-field strength. The analogous
    mechanism-specific decomposition for toroidal flux is illustrated by [toroidal
    magnetic flux due to poloidal current](name:toroidal_magnetic_flux_due_to_poloidal_current).


    Sign convention: Positive when the diamagnetic-drift contribution to $B_Z$ on
    the horizontal integration disk points in the $+Z$ direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux_due_to_diamagnetic_drift
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:toroidal_magnetic_flux_due_to_poloidal_current
