- name: normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: active
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at the minimum-safety-factor surface. It identifies the
    nested flux surface where the magnitude of the safety factor is minimized, with
    0 at the magnetic axis and 1 at the plasma boundary.
  documentation: 'The normalized toroidal flux coordinate at the minimum-safety-factor
    surface is the dimensionless radial label assigned to the nested flux surface
    where the magnitude of the safety factor is globally minimized. It is the [normalized
    toroidal flux coordinate](name:normalized_toroidal_flux_coordinate) evaluated
    at that surface, with the origin at the magnetic axis and the outer normalization
    reference at the plasma boundary or last closed flux surface.


    The coordinate is defined from the toroidal flux difference between the minimum-safety-factor
    flux surface and the magnetic-axis flux:


    $$

    \rho_{\mathrm{tor,norm}}(q_{\min}) = \sqrt{\frac{\Phi_{q_{\min}} - \Phi_0}{\Phi_b
    - \Phi_0}}

    $$


    where $q_{\min}$ identifies the global minimum of $|q|$ over the nested-flux-surface
    domain, $\Phi_{q_{\min}}$ is the toroidal magnetic flux of the flux surface on
    which that minimum occurs, $\Phi_0$ is the magnetic-axis toroidal magnetic flux,
    and $\Phi_b$ is the boundary toroidal magnetic flux. The square root makes this
    a nonnegative radial coordinate; for a valid nested-flux-surface mapping the numerator
    and denominator have the same flux orientation, so the ratio is nonnegative and
    increases outward from the magnetic axis.


    This quantity is the radial coordinate of the minimum-safety-factor surface, not
    the safety-factor value itself. It is the toroidal-flux-based counterpart of [normalized
    poloidal flux coordinate at minimum safety factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor)
    and is distinct from [normalized toroidal flux coordinate at the sawtooth inversion
    radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius),
    which identifies a sawtooth-crash inversion surface rather than the global minimum
    of $|q|$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/rho_tor_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-rho_tor_norm
    dd_documentation:
