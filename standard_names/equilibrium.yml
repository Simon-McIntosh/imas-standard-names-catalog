- name: gap_at_outboard_midplane
  kind: scalar
  status: active
  description: Signed major-radius separation between a measurement position and the
    magnetic separatrix, mapped along its flux surface to the outboard midplane; positive
    outside the separatrix.
  documentation: 'This quantity is the signed major-radius separation between a measurement
    position and the magnetic separatrix after the position is mapped along its flux
    surface to the outboard midplane. It applies pointwise to the selected position
    and separatrix rather than to an average or to the separation between two separatrices.


    With the mapped position and separatrix evaluated at the outboard midplane, the
    separation is defined by


    $$

    \Delta R_{\mathrm{sep,mid}} = R_{\mathrm{pos,mid}} - R_{\mathrm{sep,mid}}

    $$


    where $\Delta R_{\mathrm{sep,mid}}$ is the mapped separatrix distance, $R_{\mathrm{pos,mid}}$
    is the major-radius coordinate of the mapped measurement position, and $R_{\mathrm{sep,mid}}$
    is the major-radius coordinate of the separatrix at the outboard midplane.


    The quantity refers to one measurement position, its associated magnetic flux
    surface, and one selected separatrix. It is a signed major-radius separation in
    the right-handed cylindrical $(R, \phi, Z)$ frame, with no flux-surface, spatial,
    species, or time aggregation. It is not the shortest geometric distance, a plasma-wall
    clearance, or the distance between inner and outer separatrices.


    The flux-surface assignment can be expressed through the [normalized poloidal
    flux coordinate at measurement position](name:normalized_poloidal_flux_coordinate_at_measurement_position),
    while the two terms in the difference are outboard-midplane radial coordinates
    of the type defined by [radial coordinate at outboard midplane](name:radial_coordinate_at_outboard_midplane).
    The mapping therefore converts the original position into a common outboard-midplane
    comparison before the major-radius difference is taken.'
  unit: m
  physics_domain: equilibrium
  links:
