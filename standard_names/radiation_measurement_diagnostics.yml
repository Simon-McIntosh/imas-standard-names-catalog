- name: absorptivity_of_filter
  kind: scalar
  status: active
  description: Dimensionless fraction of the incident photon flux absorbed by a diagnostic
    filter material, bounded between 0 and 1.
  documentation: 'Absorptivity of a diagnostic filter is the dimensionless ratio of
    the absorbed photon flux to the total incident photon flux at the filter surface.
    It is bounded on the interval $[0, 1]$, where $\alpha = 0$ indicates no absorption
    and $\alpha = 1$ indicates complete absorption of incident photons.


    Conservation of energy at the filter interface constrains absorptivity $\alpha$,
    transmissivity $T$, and reflectivity $R$ through


    $$

    \alpha + T + R = 1

    $$


    where scattering contributions are subsumed into reflectivity or treated as a
    separate loss term, depending on the optical model.


    The wavelength-resolved instance [spectral_absorptivity_of_filter](name:spectral_absorptivity_of_filter)
    extends this quantity as a function of photon wavelength, capturing the spectral
    selectivity of the filter material. The overall filter detection probability,
    which combines absorptivity with downstream optical and detector efficiencies,
    is quantified separately by [efficiency_of_filter](name:efficiency_of_filter).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_absorptivity_of_filter
  - name:efficiency_of_filter
- name: angular_width_of_bragg_crystal
  kind: scalar
  status: active
  description: The Bragg diffraction angle of the crystal in an X-ray crystal spectrometer
    channel, fixing the central X-ray wavelength selected for diffraction according
    to Bragg's law.
  documentation: 'The Bragg angle $\theta_B$ is the angle between the incident X-ray
    beam and the crystal lattice planes at which constructive interference produces
    wavelength-selective Bragg diffraction. It is the primary parameter governing
    the central wavelength of a measurement channel in an X-ray crystal spectrometer.


    The selected X-ray wavelength $\lambda$ is determined by Bragg''s law:


    $$

    n\lambda = 2d\sin\theta_B

    $$


    where $n$ is a positive integer diffraction order and $d$ is the crystal lattice
    plane spacing of the diffracting crystal. For a crystal with known $d$-spacing,
    $\theta_B$ uniquely determines the central wavelength of the spectral channel.


    In X-ray crystal spectrometer systems used for fusion plasma diagnostics, the
    Bragg angle is established by the geometric orientation of the crystal relative
    to the plasma X-ray source and the detector. It is a key configuration parameter
    for selecting specific resonance lines used in impurity transport studies and
    ion temperature measurements via Doppler line-broadening analysis. Complementary
    crystal geometry parameters include the [radius of curvature of the diffracting
    surface in the toroidal direction](name:toroidal_curvature_of_bragg_crystal) and
    the [aperture radius of the crystal](name:radius_of_bragg_crystal), while the
    physical transverse extent of the crystal along the first axis is given by [bragg_crystal_width](name:bragg_crystal_width).'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radius_of_bragg_crystal
  - name:bragg_crystal_width
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/angle_bragg
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-angle_bragg
    dd_documentation:
      leaf: Bragg angle of the crystal
      parent_path: spectrometer_x_ray_crystal/channel/crystal
      parent: Characteristics of the crystal used
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "Bragg angle (\u03B8B) of the crystal in an X-ray crystal spectrometer\
        \ channel. Determines the X-ray wavelength selected for diffraction according\
        \ to Bragg's law (n\u03BB = 2d sin\u03B8B), fixing the central wavelength\
        \ of the measurement."
      kind: llm
- name: area_of_filter
  kind: scalar
  status: active
  description: Geometric area of a radiation-filter surface that intercepts incoming
    radiation, measured over the true material surface rather than its planar projection.
  documentation: 'This quantity is the geometric area of a surface associated with
    a radiation filter and participating in interception or transmission of incoming
    radiation. It refers to the actual surface geometry, including curvature, rather
    than a projected aperture area.


    The area is defined by integrating the differential surface-area element over
    the relevant surface:


    $$

    A = \int_S dA

    $$


    where $A$ is the total area, $S$ is the specified filter surface, and $dA$ is
    an infinitesimal element of true surface area. For the concrete specialization
    [surface area of filter](name:surface_area_of_filter), $S$ is the material surface
    of the filter window.'
  unit: m^2
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:surface_area_of_filter
- name: bragg_crystal_width
  kind: scalar
  status: active
  description: Bragg crystal width is the full physical extent of a rectangular Bragg
    crystal along its first local tangential direction, corresponding to the crystal-local
    X1 tangent axis.
  documentation: 'Bragg crystal width is the full physical extent of a rectangular
    Bragg crystal along its first local tangential direction. The direction is the
    first in-surface axis of the crystal-local right-handed Cartesian frame $(\hat{t}_1,
    \hat{t}_2, \hat{n})$, with $\hat{t}_1$ corresponding to the crystal-local $X_1$
    tangent axis and $\hat{n}$ normal to the diffracting surface.


    For a rectangular crystal whose two opposing edges perpendicular to $\hat{t}_1$
    have first local tangential coordinates $u_{1,-}$ and $u_{1,+}$, the width $w$
    is


    $$

    w = |u_{1,+} - u_{1,-}|

    $$


    where $w$, $u_{1,+}$, and $u_{1,-}$ are expressed in meters.


    This quantity is an extent, not a signed outline-vertex coordinate. [first_local_tangential_coordinate_of_bragg_crystal](name:first_local_tangential_coordinate_of_bragg_crystal)
    and [second_local_tangential_coordinate_of_bragg_crystal](name:second_local_tangential_coordinate_of_bragg_crystal)
    denote coordinates of points on the crystal outline in the two local tangential
    directions; bragg_crystal_height is the corresponding extent along $\hat{t}_2$,
    and [thickness_of_bragg_crystal](name:thickness_of_bragg_crystal) is the extent
    along the local normal.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_bragg_crystal
  - name:second_local_tangential_coordinate_of_bragg_crystal
  - name:thickness_of_bragg_crystal
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/x1_width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-x1_width
    dd_documentation:
