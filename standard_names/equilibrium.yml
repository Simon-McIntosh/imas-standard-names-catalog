- name: major_radius_of_secondary_strike_point
  kind: scalar
  status: draft
  description: Radial location, measured from the toroidal symmetry axis, where the
    secondary separatrix intersects a divertor target.
  documentation: 'The secondary strike-point major radius is the $R$ coordinate of
    the intersection between the secondary separatrix and a divertor target in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It is the radial companion to the
    [secondary strike-point vertical coordinate](name:vertical_coordinate_of_secondary_strike_point)
    and distinguishes the secondary separatrix contact from the primary [strike-point
    major radius](name:major_radius_of_strike_point).


    For a point expressed in a right-handed Cartesian $(x, y, z)$ frame whose $z$
    axis is the vertical $Z$ axis and whose origin lies on the toroidal symmetry axis,
    the major radius is


    $$

    R_{\mathrm{sp,sec}} = \sqrt{x_{\mathrm{sp,sec}}^2 + y_{\mathrm{sp,sec}}^2}

    $$


    where $x_{\mathrm{sp,sec}}$ and $y_{\mathrm{sp,sec}}$ are the horizontal coordinates
    of the secondary strike point.


    This quantity is computed from equilibrium reconstruction by finding where the
    secondary separatrix intersects the modeled plasma-facing target surface. Its
    inferred position can be checked against divertor heat-flux patterns from infrared
    thermography, visible emission, or embedded target probes, while its relation
    to [vertical_coordinate_of_strike_point](name:vertical_coordinate_of_strike_point)
    specifies the full poloidal location of the contact point.


    Typical values are device-size dependent: about 1-2 m in compact tokamaks, 2-4
    m in medium-size tokamaks, and 5-8 m in large reactor-scale configurations. Changes
    of a few centimeters can be operationally important for divertor heat-load sharing
    and strike-point sweeping.


    Sign convention: Positive when the secondary strike point lies in the $+R$ direction
    away from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_secondary_strike_point
  - name:major_radius_of_strike_point
  - name:vertical_coordinate_of_strike_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    status: composed
- name: major_radius_of_secondary_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate locating the secondary magnetic null where
    the secondary separatrix intersects itself in the divertor geometry.
  documentation: 'The secondary X-point is a magnetic null associated with a secondary
    separatrix, often present in diverted equilibria with double-null or near-double-null
    topology. Its major radius $R_{\mathrm{X2}}$ gives the radial location of that
    null in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is distance
    from the toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical
    height. Together with the [vertical coordinate of the secondary X-point](name:vertical_coordinate_of_secondary_x_point),
    it fixes the secondary null position and complements the primary [major radius
    of the X-point](name:major_radius_of_x_point).


    For an axisymmetric equilibrium, the major-radius coordinate can be written from
    horizontal Cartesian coordinates as:


    $$

    R_{\mathrm{X2}} = \sqrt{x_{\mathrm{X2}}^2 + y_{\mathrm{X2}}^2}

    $$


    where $x_{\mathrm{X2}}$ and $y_{\mathrm{X2}}$ are the horizontal coordinates of
    the secondary magnetic null in a right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis with $\hat{z}=\hat{Z}$. The point itself is identified by the local vanishing
    of the poloidal magnetic field on the secondary separatrix.


    This coordinate is computed from magnetic-equilibrium reconstruction constrained
    by external magnetic sensors, flux measurements, and, where available, internal
    magnetic diagnostics. It is used to distinguish secondary-null geometry from strike-point
    geometry, such as the [major radius of the secondary strike point](name:major_radius_of_secondary_strike_point),
    and from global geometric references such as the [major radius of the geometric
    axis](name:major_radius_of_geometric_axis).


    Representative values span about 0.5-3 m in compact and medium-size tokamaks and
    can reach 5-8 m in large devices, depending on divertor configuration and plasma
    shaping.


    Sign convention: Positive when the secondary X-point lies in the $+R$ direction
    away from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_secondary_x_point
  - name:major_radius_of_x_point
  - name:major_radius_of_secondary_strike_point
  - name:major_radius_of_geometric_axis
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    status: composed
- name: major_radius_of_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of an unspecified divertor strike point where
    the reconstructed separatrix intersects a material target.
  documentation: 'The strike-point major radius locates the divertor contact point
    of the last closed flux surface in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is distance from the machine symmetry axis. Together with [vertical
    coordinate of strike point](name:vertical_coordinate_of_strike_point), it specifies
    the poloidal-plane position that governs divertor heat-load placement. If primary
    and secondary strike points are distinguished, compare this quantity with [major
    radius of secondary strike point](name:major_radius_of_secondary_strike_point).


    For a strike-point position expressed in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis with $\hat{z}=\hat{Z}$, the major radius is


    $$

    R_{\rm sp} = \sqrt{(x_{\rm sp}-x_0)^2 + (y_{\rm sp}-y_0)^2}

    $$


    where $x_{\rm sp}$ and $y_{\rm sp}$ are the horizontal Cartesian coordinates of
    the strike point, and $x_0,y_0$ define the toroidal symmetry axis.


    It is computed by intersecting the reconstructed separatrix or plasma boundary
    with the divertor target geometry. Magnetic equilibrium reconstruction constrained
    by external magnetics, internal profile constraints, and divertor imaging provides
    the most common determination; planned trajectories may also be derived from position-control
    models. Related geometric references include [outer major radius of flux surface](name:outer_major_radius_of_flux_surface)
    and [inner major radius of flux surface](name:inner_major_radius_of_flux_surface),
    which describe midplane intersections rather than target intersections.


    Typical values range from about 0.5-3 m in compact and medium-size tokamaks and
    can exceed 5 m in large devices, depending on divertor geometry and plasma shape.


    Sign convention: Positive when $R_{\rm sp}$ is measured outward from the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_strike_point
  - name:major_radius_of_secondary_strike_point
  - name:outer_major_radius_of_flux_surface
  - name:inner_major_radius_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/strike_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/strike_point/r
    status: composed
- name: major_radius_of_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the primary separatrix X-point where the
    poloidal magnetic field vanishes and separatrix branches intersect.
  documentation: 'The X-point is a saddle point of the poloidal magnetic flux on the
    plasma separatrix, marking where separatrix branches meet and defining the divertor
    topology. This quantity is the $R$ coordinate of that primary null in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It complements the corresponding secondary-null
    coordinate [major radius of the secondary X-point](name:major_radius_of_secondary_x_point)
    and the divertor target geometry described by [major radius of the strike point](name:major_radius_of_strike_point).


    At an X-point, the poloidal gradient of the equilibrium flux vanishes and the
    critical point has saddle topology:


    $$

    \nabla_p \psi(R_X, Z_X) = 0

    $$


    where $\psi$ is the poloidal magnetic flux, $\nabla_p$ is the gradient in the
    poloidal $(R,Z)$ plane, and $(R_X,Z_X)$ are the X-point coordinates. The reported
    quantity is $R_X$.


    The coordinate is computed from magnetic equilibrium reconstruction by locating
    the separatrix saddle point consistent with external magnetic measurements and,
    when available, internal constraints such as polarimetry or motional-Stark-effect
    measurements. In diverted tokamaks, representative values are about 1-3 m in medium-size
    devices and 5-7 m in reactor-scale configurations, depending on plasma size, elongation,
    triangularity, and divertor geometry. Changes in this coordinate alter the connection
    length and strike-point placement, linking it geometrically to [major radius of
    the strike point](name:major_radius_of_strike_point) and [vertical coordinate
    of the strike point](name:vertical_coordinate_of_strike_point).


    Sign convention: Positive when the X-point lies in the $+R$ direction from the
    machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_secondary_x_point
  - name:major_radius_of_strike_point
  - name:vertical_coordinate_of_strike_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/x_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/x_point/r
    status: composed
- name: maximum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Peak absolute magnetic-field strength attained on a poloidal-field
    coil conductor surface, used to assess electromagnetic and superconducting operating
    limits.
  documentation: 'This quantity is the extremum of the magnetic-field modulus on the
    conductor surface of a poloidal-field coil. It is the surface peak relevant to
    insulation stress, Lorentz loading, and superconducting critical-current margins,
    and it specializes the broader [maximum magnetic field] to the conductor-surface
    field rather than a field value at a plasma diagnostic location such as [poloidal
    magnetic field at measurement position](name:poloidal_magnetic_field_at_measurement_position).


    For a conductor surface $S_c$ and magnetic-field vector $\mathbf{B}(\mathbf{x})$,
    the defining operation is


    $$

    B_{\max} = \max_{\mathbf{x} \in S_c} \left|\mathbf{B}(\mathbf{x})\right|

    $$


    where $\mathbf{x}$ is position on the conductor surface and $|\mathbf{B}|$ is
    the Euclidean magnitude of the local magnetic-field vector.


    The value is computed from magnetostatic field models using coil currents, conductor
    geometry, and mutual fields from neighboring coils and plasma current. The surface
    over which the maximum is taken is determined from the coil geometry, for example
    using the [radial outline of poloidal field coil](name:radial_outline_of_poloidal_field_coil)
    and [major radius of poloidal field coil](name:major_radius_of_poloidal_field_coil)
    to define the conductor location in the machine cross-section.


    Typical peak conductor fields are a few T for resistive shaping coils, about 4-7
    T for NbTi superconducting poloidal-field coils, and can approach 10-13 T for
    high-field superconducting designs. Because this is a magnitude and a maximum,
    it is always non-negative.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_field_at_measurement_position
  - name:radial_outline_of_poloidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  sources:
