- name: vertical_magnetic_field_at_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Vertical component of the magnetic field at the centroid of a ferritic
    element, measuring the Z-directed field contribution to the local magnetic state
    of the ferromagnetic in-vessel component.
  documentation: 'Ferritic elements are ferromagnetic in-vessel components, such as
    ferritic steel inserts, installed in some tokamaks to reduce toroidal field ripple
    and manage magnetic loads. The magnetic field sampled at each element''s centroid
    serves as the representative local field vector used to evaluate the element''s
    magnetization state and compute its back-reaction on the global equilibrium.


    The vertical component $B_Z = \mathbf{B} \cdot \hat{Z}$ is the projection of the
    total magnetic field onto the $\hat{Z}$ axis of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $Z$ is the vertical height measured from the device midplane.
    Together with the [radial component](name:radial_magnetic_field_at_ferritic_element_centroid)
    $B_R$ and the [toroidal component](name:toroidal_magnetic_field_at_ferritic_element_centroid)
    $B_\phi$, it fully specifies the local field vector that drives the element''s
    [vertical magnetization](name:vertical_magnetization_of_ferritic_element) $M_Z$.


    In magnetostatic modeling, the centroid field is obtained from the self-consistent
    equilibrium solution or from a reduced thick-line approximation of the ferromagnetic
    element, where the centroid value represents the spatially averaged field over
    the element''s cross-section.


    Sign convention: Positive when $B_Z$ points in the $+Z$ direction (upward along
    the machine symmetry axis).'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_at_ferritic_element_centroid
  - name:toroidal_magnetic_field_at_ferritic_element_centroid
  - name:vertical_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_z
    dd_path: ferritic/object/time_slice/b_field_z
    status: composed
- name: vertical_maximum_force
  kind: scalar
  status: draft
  description: Vertical maximum force is the upper allowable value of the net electromagnetic
    force component along Z in the right-handed cylindrical (R, phi, Z) frame acting
    on an axisymmetric poloidal-field coil system. It is a design-defined hard constraint
    for coil-current scenario optimization.
  documentation: 'Vertical maximum force is the upper structural limit on the net
    electromagnetic force component in the $Z$ direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z$ is vertical height, acting on the complete axisymmetric
    poloidal-field coil system. It defines the positive side of the vertical force
    envelope: admissible operating points require the instantaneous vertical_force
    to satisfy $F_Z \le F_{Z,\max}$ while also respecting [vertical_minimum_force](name:vertical_minimum_force).


    The instantaneous force constrained by this limit is the sum of Lorentz forces
    on the coil conductors:


    $$

    F_Z = \sum_k I_k \oint_{\mathcal{C}_k} \left(d\boldsymbol{\ell}_k \times \mathbf{B}_{\mathrm{ext},k}\right)
    \cdot \hat{Z}

    $$


    where $F_Z$ is the net vertical force in N, $k$ indexes coil windings or current
    circuits, $I_k$ is the circuit current in A, $d\boldsymbol{\ell}_k$ is the conductor
    line element in m oriented with the current, and $\mathbf{B}_{\mathrm{ext},k}$
    is the magnetic field in T at that conductor due to sources external to the same
    current element.


    The limit value is a design and structural-analysis quantity, not a scenario-dependent
    response. It is set from support loads, stress allowables, load combinations,
    margins, and protection requirements; scenario optimization treats it as a fixed
    upper bound while the actual $F_Z$ varies with coil currents, plasma current,
    equilibrium shape, and induced currents in nearby conductors.


    Typical upper limits range from $10^5$-$10^7$ N for small and medium devices and
    from $10^7$-$10^8$ N or more for large high-field devices, depending on coil size,
    field strength, support stiffness, and allowable mechanical stress.


    Sign convention: Positive when the net vertical electromagnetic force on the coil
    system points in the $+Z$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_minimum_force
  sources:
  - id: dd:pf_active/vertical_force/limit_max
    dd_path: pf_active/vertical_force/limit_max
    status: composed
- name: vertical_minimum_force
  kind: scalar
  status: draft
  description: Minimum allowable net vertical electromagnetic force on the axisymmetric
    PF coil system, defining the lower bound of the structural force envelope within
    which plasma operations must remain.
  documentation: 'The vertical minimum force is the lower structural limit on the
    combined net vertical electromagnetic force that the axisymmetric poloidal field
    coil system can safely sustain. This limit, together with [vertical_maximum_force](name:vertical_maximum_force),
    defines the allowable force window that the mechanical support structure must
    accommodate across all plasma scenarios without mechanical failure or loss of
    coil positional stability.


    The net vertical electromagnetic force on the coil assembly is the $Z$-component
    of the Lorentz body force integrated over all coil volumes:


    $$

    F_z = \sum_k \int_{V_k} (\mathbf{J}_k \times \mathbf{B}) \cdot \hat{Z} \, dV

    $$


    where $\mathbf{J}_k$ is the current density in the $k$-th coil, $\mathbf{B}$ is
    the total magnetic field, and $\hat{Z}$ is the vertical unit vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The instantaneous vertical_force must remain between this lower limit and [vertical_maximum_force](name:vertical_maximum_force)
    throughout operation. The analogous lower radial limit is provided by [radial_total_minimum_force_of_poloidal_field_coil](name:radial_minimum_force_of_poloidal_field_coil).
    These limits are determined from structural analysis of the coil support system
    and are specified as design constraints for the tokamak electromagnetic load envelope.


    Sign convention: Positive when the net vertical force acts in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_maximum_force
  - name:radial_minimum_force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/vertical_force/limit_min
    dd_path: pf_active/vertical_force/limit_min
    status: composed
- name: vertical_vacuum_magnetic_vector_potential
  kind: scalar
  status: draft
  description: Vertical Z component of the vacuum magnetic vector potential produced
    by toroidal-field coil currents, evaluated in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: 'The vertical vacuum magnetic vector potential is the $Z$ component
    $A_Z$ of the magnetic vector potential $\mathbf{A}_{\mathrm{vac}}$ produced by
    toroidal-field coil currents with plasma-current and material-response currents
    excluded. It is evaluated along $\hat{Z}$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The associated vacuum magnetic field satisfies $\mathbf{B}_{\mathrm{vac}}
    = \nabla \times \mathbf{A}_{\mathrm{vac}}$.


    In the Coulomb gage with reference $\mathbf{A}_{\mathrm{vac}} \to 0$ far from
    localized coils, the Biot-Savart definition of the component is:


    $$

    A_Z(R, \phi, Z) = \hat{Z}\cdot\frac{\mu_0}{4\pi}\int_{\Omega_{\mathrm{TF}}}\frac{\mathbf{J}_{\mathrm{TF}}(\mathbf{r}'')}{|\mathbf{r}-\mathbf{r}''|}\,d^3r''

    $$


    where $\mathbf{r}$ is the field point with cylindrical coordinates $(R, \phi,
    Z)$ in meters, $\mathbf{r}''$ is a source point in meters, $\Omega_{\mathrm{TF}}$
    is the toroidal-field-coil conductor volume, $\mathbf{J}_{\mathrm{TF}}$ is the
    coil current density in A m$^{-2}$, $d^3r''$ is the source volume element in m$^3$,
    $\mu_0$ is the vacuum permeability in N A$^{-2}$, and $A_Z$ is in T m.


    It is normally computed from coil geometry and currents using Biot-Savart quadrature
    or a magnetostatic vector-potential solver. Together with the radial and toroidal
    components of $\mathbf{A}_{\mathrm{vac}}$, it determines associated vacuum-field
    components through the cylindrical curl, including [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field)
    and non-axisymmetric field components such as [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field).


    Typical magnitudes in the plasma region are about $10^{-3}$-$10$ T m for medium
    to large tokamaks, with larger local values possible near high-current coil conductors.
    The value depends on coil current, conductor geometry, distance from the coils,
    and the specified gage reference.


    Sign convention: Positive when the gage-fixed vacuum magnetic vector potential
    has a component in the $+Z$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_vacuum_magnetic_vector_potential
  sources:
  - id: dd:tf/field_map/a_field_z/values
    dd_path: tf/field_map/a_field_z/values
    status: composed
- name: voltage_of_correction_coil
  kind: scalar
  status: draft
  description: Terminal voltage of a non-axisymmetric correction coil is the signed
    electric potential difference between its two electrical terminals. It includes
    the resistive drop and the self- and mutual-inductive voltage associated with
    changing currents.
  documentation: 'Voltage of a correction coil is the signed terminal electric potential
    difference across a coil or conductor that is used to compensate field errors
    or impose controlled non-axisymmetric magnetic perturbations. It is a circuit
    quantity, not a magnetic-field amplitude, and represents the voltage applied to
    or absorbed at the coil terminals.


    For a lumped coupled-circuit model using a passive terminal polarity, the terminal
    voltage of coil $k$ can be written as:


    $$

    V_k = R_k I_k + L_k \frac{d I_k}{dt} + \sum_{j \ne k} M_{kj} \frac{d I_j}{dt}

    $$


    where $V_k$ is the terminal voltage in volts, $R_k$ is the coil resistance in
    ohms, $I_k$ and $I_j$ are currents in amperes, $L_k$ is the self-inductance in
    henries, $M_{kj}$ is the mutual inductance from circuit $j$ to coil $k$ in henries,
    and $t$ is time in seconds. The sign of each $M_{kj}$ is the sign of the flux
    linkage in coil $k$ produced by positive $I_j$, so mutual coupling contributes
    as a signed voltage term.


    The voltage is measured with terminal voltage taps, isolation amplifiers, or calibrated
    power-supply monitors. For analysis it can be computed from measured current waveforms
    together with the coil resistance and the self- and mutual-inductance matrix;
    cable drops, feedthroughs, and power-supply output filters are treated separately
    when the reference terminals do not coincide with the coil terminals.


    Typical values are 1-100 V for slowly varying error-field correction and 100-5000
    V during fast current ramps, resonant magnetic perturbation pulses, or rapid feedback
    action. Steady operation is dominated by $R_k I_k$, while transient operation
    is dominated by $L_k dI_k/dt$ and coupled-current terms.


    Sign convention: Positive when the electric potential at the terminal where positive
    current enters the coil in the chosen winding orientation is greater than the
    electric potential at the terminal where it leaves.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_correction_coil
  - name:resistance_of_correction_coil
  - name:voltage_of_poloidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/voltage
    dd_path: coils_non_axisymmetric/coil/conductor/voltage
    status: attached
  - id: dd:coils_non_axisymmetric/coil/voltage
    dd_path: coils_non_axisymmetric/coil/voltage
    status: composed
- name: voltage_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Terminal voltage across a poloidal field coil winding, equal to the
    sum of the resistive drop and inductive back-EMF presented to the power supply
    circuit.
  documentation: 'The voltage of a poloidal field coil is the electric potential difference
    measured across the coil terminals, combining the ohmic drop through the winding
    resistance and the inductive back-EMF arising from changes in coil current and
    mutual coupling with neighboring coils.


    The terminal voltage is governed by the coil circuit equation:


    $$

    V = R \, I + L \frac{dI}{dt} + \sum_j M_j \frac{dI_j}{dt}

    $$


    where $R$ is the winding resistance, $I$ is the coil current (see [current_of_poloidal_field_coil](name:current_of_poloidal_field_coil)),
    $L$ is the self-inductance, and $M_j$ is the mutual inductance with the $j$-th
    neighboring coil carrying current $I_j$.


    In plasma shape and position control, the power supply imposes this voltage as
    the primary actuator to ramp, sustain, or reduce the coil current, thereby shaping
    the poloidal field and controlling plasma boundaries. Terminal voltage is measured
    directly by transducers at the power supply output or coil junction and is monitored
    continuously for control and protection. Typical values range from near zero during
    steady-state flat-top operation to several kilovolts during fast current transients.
    The analogous quantity for the toroidal system is [voltage_of_toroidal_field_coil](name:voltage_of_toroidal_field_coil),
    and three-dimensional correction coil voltages are described by [voltage_of_correction_coil](name:voltage_of_correction_coil).'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:voltage_of_toroidal_field_coil
  - name:voltage_of_correction_coil
  sources:
  - id: dd:pf_active/coil/voltage
    dd_path: pf_active/coil/voltage
    status: composed
- name: voltage_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Terminal voltage of a toroidal field coil, including the resistive
    voltage drop and the inductive voltage associated with changes in coil current.
  documentation: 'Voltage of a toroidal field coil is the electrical potential difference
    between the two coil terminals for a specified terminal polarity. It represents
    the terminal voltage required to drive the toroidal-field-coil current and the
    voltage developed by the coil circuit during current transients.


    For a lumped circuit representation in which mutual-coupling terms are absent
    or treated separately, the principal passive-sign terminal-voltage relation is:


    $$

    V_{\mathrm{TF}} = R_{\mathrm{TF}} I_{\mathrm{TF}} + L_{\mathrm{TF}} \frac{d I_{\mathrm{TF}}}{dt}

    $$


    where $V_{\mathrm{TF}}$ is the terminal voltage in V, $R_{\mathrm{TF}}$ is the
    effective series resistance in ohms, $I_{\mathrm{TF}}$ is the [toroidal-field-coil
    current](name:current_of_toroidal_field_coil) in A, $L_{\mathrm{TF}}$ is the effective
    self-inductance in H, and $t$ is time in s. The $R_{\mathrm{TF}} I_{\mathrm{TF}}$
    term is the ohmic voltage drop, while the $L_{\mathrm{TF}} dI_{\mathrm{TF}}/dt$
    term is the self-inductive terminal voltage associated with changing the magnetic
    energy stored by the coil.


    The quantity is obtained from calibrated voltage measurement across the coil terminals
    or from a circuit calculation using the measured coil current and effective circuit
    parameters. In a more complete coupled-circuit model, additional mutually induced
    voltage terms may be included, but the terminal voltage remains the signed potential
    difference between the same two connection points.


    Typical magnitudes are strongly machine and operating-mode dependent. During steady-current
    operation they may be near 0 V for superconducting coils or from tens to thousands
    of volts for resistive coils; during ramping or other current transients they
    can range from a few volts to many kilovolts depending on coil inductance and
    $dI_{\mathrm{TF}}/dt$.


    Sign convention: Positive when the terminal at which positive toroidal-field-coil
    current enters the coil conductor is at higher electric potential than the terminal
    from which it leaves.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_toroidal_field_coil
  - name:voltage_of_poloidal_field_coil
  - name:voltage_of_correction_coil
  sources:
  - id: dd:tf/coil/conductor/voltage
    dd_path: tf/coil/conductor/voltage
    status: attached
  - id: dd:tf/coil/voltage
    dd_path: tf/coil/voltage
    status: composed
- name: width_of_correction_coil
  kind: scalar
  status: draft
  description: Full transverse dimension of a non-axisymmetric correction-coil conductor
    cross-section, measured along the local normal axis; for circular or annular sections
    it equals the outer diameter.
  documentation: 'Width of a correction coil is the full transverse extent of its
    conductor cross-section measured along the local normal axis, in the plane perpendicular
    to the conductor centerline. In the local right-handed conductor frame $(\hat{t},
    \hat{n}, \hat{b})$, $\hat{t}$ is tangent to the conductor centerline, $\hat{n}$
    is the normal direction that defines the width, and $\hat{b}=\hat{t}\times\hat{n}$
    is the binormal direction that defines the complementary height.


    For a cross-section $C$ taken at centerline point $\mathbf{r}_0$, the width is
    the full outer extent along $\hat{n}$:


    $$

    w \equiv \max_{\mathbf{r}\in C} \left[(\mathbf{r}-\mathbf{r}_0)\cdot\hat{n}\right]
    - \min_{\mathbf{r}\in C} \left[(\mathbf{r}-\mathbf{r}_0)\cdot\hat{n}\right]

    =\begin{cases}

    a_n, & \text{rectangular or square conductor},\\

    D, & \text{solid circular conductor},\\

    D_{\mathrm{out}}, & \text{annular conductor},

    \end{cases}

    $$


    where $a_n$ is the outer rectangular dimension along $\hat{n}$, $D$ is the diameter
    of a solid circular conductor, and $D_{\mathrm{out}}$ is the outer diameter of
    an annular conductor. This quantity is the direct analog, for non-axisymmetric
    error-field and edge-localized-mode control coils, of [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil),
    and is complementary to the binormal-direction [height_of_correction_coil](name:height_of_correction_coil).


    The value is taken from the conductor engineering geometry, the manufacturing
    drawing, or dimensional inspection of the outer conductor envelope. It is a gross
    outer-envelope dimension that bounds the full conductor footprint, including any
    jacket, insulation, or cooling channel; it is therefore generally larger than
    the net current-carrying region implied by the conductor [area_of_correction_coil](name:area_of_correction_coil).
    Width should be used consistently with the binormal height: solid circular conductors
    have equal width and height, whereas annular conductors use the outer diameter
    here rather than the bore diameter set by [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil).


    Representative correction-coil conductor widths are design dependent, commonly
    about 0.005-0.1 m for individual conductors and up to roughly 0.2-0.3 m for large
    external conductor assemblies. The chosen width is governed by required current
    capacity, cooling channel layout, structural support, and the space available
    around the coil path.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_correction_coil
  - name:area_of_correction_coil
  - name:inner_radius_of_correction_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/width
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/width
    status: attached
- name: width_of_passive_structure
  kind: scalar
  status: draft
  description: Full horizontal width of a rectangular passive conducting structure
    element, measured along R in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Width of a passive structure is the full horizontal size of a rectangular
    conducting cross-section in the poloidal plane. In the conductor-local rectangular
    cross-section, the horizontal axis is parallel to $\hat{R}$ and the vertical axis
    is parallel to $\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.


    The width is the separation between the two radial faces of the rectangular element:


    $$

    w = R_{\max} - R_{\min}

    $$


    where $R_{\min}$ and $R_{\max}$ are the smaller and larger major radii of those
    faces in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The value is obtained from the engineering geometry of the passive conductor.
    Together with [height_of_passive_structure](name:height_of_passive_structure),
    it defines the rectangular cross-section used to compute geometric area, resistance,
    inductance, and electromagnetic coupling to coils and plasma currents.


    Typical values are 0.01-0.5 m for individual passive conductor elements, and can
    exceed 1 m for coarse vessel, shell, or stabilizing-structure segments depending
    on the engineering model.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_passive_structure
  - name:area_of_passive_loop
  - name:width_of_poloidal_field_coil
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/rectangle/width
