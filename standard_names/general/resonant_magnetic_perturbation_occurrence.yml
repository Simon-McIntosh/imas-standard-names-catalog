name: resonant_magnetic_perturbation_occurrence
status: draft
cocos_transformation_type: one_like
description: Binary flag indicating whether resonant magnetic perturbation (RMP) coils
  are energized during a discharge (1 = active, 0 = inactive).
documentation: "This dimensionless integer flag (unit 1) records the activation state\
  \ of external resonant magnetic perturbation (RMP) coil systems. RMP fields, typically\
  \ with toroidal mode numbers $n = 1$\u20134, are applied to control or suppress\
  \ edge-localized modes (ELMs) in H-mode plasmas by ergodizing the pedestal magnetic\
  \ topology. A value of 1 indicates that RMP coil currents exceed a threshold level\
  \ during the relevant time window; 0 indicates no RMP activity. The flag is derived\
  \ from the coil power-supply control signals or post-shot coil-current waveforms.\
  \ It does not encode the applied spectrum ($n$, phasing, amplitude); detailed RMP\
  \ parameters are stored in companion quantities. Used in automated scenario tagging\
  \ and confinement databases to distinguish RMP-mitigated from unmitigated ELM regimes."
