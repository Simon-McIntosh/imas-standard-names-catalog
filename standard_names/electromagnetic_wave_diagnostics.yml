- name: toroidal_angle_of_measurement_position
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of a diagnostic measurement position in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, where \u03C6 increases counter-clockwise\
    \ when viewed from above."
  documentation: "The toroidal angle $\\phi$ locates a diagnostic measurement position\
    \ around the machine symmetry axis in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is the major radius and $Z$ is the vertical height. It\
    \ is used to register the three-dimensional location of sensor elements \u2014\
    \ such as bolometer apertures, charge-exchange channels, ECE receivers, or pressure\
    \ gages \u2014 enabling geometry-aware signal processing and line-of-sight calculations.\
    \ Values span $[0, 2\\pi)$ rad for a full torus, with sub-milliradian precision\
    \ required for accurate flux-surface mapping and cross-diagnostic alignment. This\
    \ coordinate is the toroidal counterpart to the cylindrical $(R, Z)$ positional\
    \ coordinates; compare [toroidal_angle_of_first_point_of_line_of_sight](name:toroidal_angle_of_first_point_of_line_of_sight)\
    \ and [toroidal_angle_of_second_point_of_line_of_sight](name:toroidal_angle_of_second_point_of_line_of_sight)\
    \ for line-of-sight endpoint geometry, and [major_radius_of_diagnostic_component_geometric_center](name:major_radius_of_diagnostic_component_geometric_center)\
    \ for the complementary radial coordinate.\n\nSign convention: Positive when $\\\
    phi$ increases in the counter-clockwise direction when viewed from above along\
    \ $+\\hat{Z}$."
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
