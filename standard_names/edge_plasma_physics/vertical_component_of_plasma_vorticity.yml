name: vertical_component_of_plasma_vorticity
description: Vertical ($Z$) component of the plasma fluid vorticity vector, quantifying
  rotational flow structure along the height axis.
documentation: The vertical component of the plasma vorticity $\omega_Z = (\nabla
  \times \mathbf{v})_Z$ is the projection of the curl of the plasma fluid velocity
  $\mathbf{v}$ onto the vertical (height) axis $\hat{Z}$ in cylindrical coordinates
  $(R, \phi, Z)$. In edge plasma modeling, vorticity dynamics are central to the description
  of turbulent structures (blobs, filaments) and zonal flows; the vertical component
  captures sheared $E \times B$ flows that regulate radial transport. In the Boussinesq
  vorticity equation commonly used in drift-reduced Braginskii models, $\omega_Z$
  evolves through advection, magnetic curvature drives, and dissipation terms. Typical
  magnitudes in the scrape-off layer range from $10^3$ to $10^6\;\mathrm{s^{-1}}$
  depending on the turbulence regime and plasma parameters. The quantity is resolved
  per element on a generalized grid description (GGD). See the related normalized
  quantity that divides by major radius for the toroidal vorticity formulation.
kind: vector_component
unit: s^-1
