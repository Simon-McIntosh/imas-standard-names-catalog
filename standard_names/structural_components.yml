- name: area_of_first_wall
  kind: scalar
  status: draft
  description: Area of first wall is the total surface area of the material surface
    that forms the plasma-facing first wall, whether bare vessel surface or installed
    wall armor. It is a scalar geometric area used as a reference for wall-integrated
    heat, particle, and plasma-wall interaction quantities.
  documentation: 'Area of first wall is the total area of the material surface classified
    as the first wall on the plasma-facing side of the vessel or wall armor. It is
    a true surface area, not a projected area, and is distinct from the area of the
    last closed flux surface because it follows the engineered wall geometry rather
    than a magnetic flux surface.


    For a first-wall surface $\mathcal{S}_\mathrm{fw}$, the area is defined by the
    surface integral; for a surface axisymmetric about the $Z$ axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame, the same area can be reduced to an integral
    over its poloidal generating curve:


    $$

    A_\mathrm{fw} = \int_{\mathcal{S}_\mathrm{fw}} dA, \qquad A_\mathrm{fw} = 2\pi
    \int_{\Gamma_\mathrm{fw}} R\, ds

    $$


    where $A_\mathrm{fw}$ has unit m^2, $dA$ is the differential surface-area element
    with unit m^2, $\Gamma_\mathrm{fw}$ is the poloidal curve that generates the axisymmetric
    first-wall surface, $R$ is major radius in the right-handed cylindrical $(R, \phi,
    Z)$ frame, and $ds$ is differential arc length along $\Gamma_\mathrm{fw}$.


    In practice, this area is computed from engineering geometry or a surface mesh
    by summing the areas of all faces assigned to the first-wall boundary. Port openings
    and cut-outs contribute no material area, while recessed panels, limiter faces,
    baffles, or divertor-interface surfaces are included only when they are part of
    the physical first-wall surface being characterized; the same component scope
    should be used when normalizing wall quantities such as plasma_deposited_power_at_wall,
    total_incident_electron_particle_flux_at_wall, or energy_flux_at_first_wall.


    Typical values are geometry-dependent: compact devices may have first-wall areas
    of a few to a few tens of m^2, while large tokamaks and reactor-scale designs
    may have tens to hundreds of m^2. For axisymmetric designs, the scaling is roughly
    set by the product of toroidal circumference and poloidal wall perimeter, with
    local armor shaping and penetrations modifying the exact value.'
  unit: m^2
  physics_domain: structural_components
  links: []
- name: coolant_pressure_at_cooling_circuit_inlet
  kind: scalar
  status: draft
  description: Absolute static pressure of the coolant at the entry point of a cooling
    circuit, providing the upstream pressure boundary condition for hydraulic, heat-transfer,
    and structural-load calculations.
  documentation: 'Coolant pressure at a cooling-circuit inlet is the absolute static
    thermodynamic pressure of the fluid as it enters the hydraulically defined circuit
    or component. It sets the upstream pressure boundary condition for the momentum
    balance and influences coolant density, phase margin, pumping requirements, and
    pressure loading on the surrounding structure.


    For a hydraulically equivalent circuit segment after any hydrostatic head correction,
    the inlet pressure is commonly related to outlet pressure by the Darcy-Weisbach
    loss relation:


    $$

    P_\mathrm{in} = P_\mathrm{out} + \Delta P = P_\mathrm{out} + \left(f\frac{L}{D_h}
    + \sum_i K_i\right)\frac{\rho v^2}{2}

    $$


    where $P_\mathrm{in}$ and $P_\mathrm{out}$ are absolute static inlet and outlet
    pressures in Pa, $\Delta P$ is the pressure loss in Pa, $f$ is the dimensionless
    Darcy friction factor, $L$ is the flow length in m, $D_h$ is the hydraulic diameter
    in m, $K_i$ are dimensionless local-loss coefficients, $\rho$ is coolant mass
    density in kg m^-3, and $v$ is mean coolant speed in m s^-1.


    In practice, this pressure is measured with a static pressure tap and pressure
    transducer near the circuit entrance, or computed from pump, manifold, and hydraulic-resistance
    models. Its interpretation is closely tied to coolant_flow: the mass flow rate
    sets the mean speed through the flow area and therefore the frictional and local
    pressure losses. Thermal power removal is evaluated primarily from mass flow,
    [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet), [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet),
    and pressure-dependent coolant properties; inlet pressure alone does not determine
    the enthalpy rise or [net_thermal_power_of_breeder_blanket_module](name:net_thermal_power_of_breeder_blanket_module).


    Typical inlet pressures for structural-component cooling circuits range from 10^5-2
    x 10^7 Pa. Pressurized water and helium circuits commonly operate at 5 x 10^6-1.6
    x 10^7 Pa, while lower-pressure liquid-metal or auxiliary coolant loops may operate
    near 10^5-10^6 Pa.'
  unit: Pa
  physics_domain: structural_components
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
  - name:net_thermal_power_of_breeder_blanket_module
- name: coolant_volume_of_breeder_blanket
  kind: scalar
  status: draft
  description: Total volume occupied by lead-lithium (PbLi) coolant/breeder inside
    the whole breeder blanket. It is a geometric inventory quantity, distinct from
    a per-module volume and excluding external coolant loops or non-coolant materials.
  documentation: 'Coolant volume of a breeder blanket is the total geometric volume
    occupied by the lead-lithium (PbLi) eutectic inside the whole blanket. Here PbLi
    is the coolant/breeder material being counted, not merely an example liquid metal.
    The quantity excludes solid structural material, purge gas, vacuum gaps, external
    coolant loops, tanks, and heat exchangers; a module-specific value would refer
    to one blanket module, whereas this whole-blanket value is the sum over all blanket
    modules or sectors.


    The volume is the integral over the PbLi domain inside the breeder blanket:


    $$

    V_\mathrm{cool} = \int_{\Omega_\mathrm{PbLi} \cap \Omega_\mathrm{blanket}} dV

    $$


    where $V_\mathrm{cool}$ is the coolant volume in m^3, $\Omega_\mathrm{PbLi}$ is
    the region occupied by PbLi, $\Omega_\mathrm{blanket}$ is the whole breeder-blanket
    domain, and $dV$ is a differential volume element in m^3.


    In design studies this volume is usually computed from engineering geometry by
    summing the PbLi-filled channels, manifolds, and breeder zones that lie within
    the blanket boundary. In operation it may be checked indirectly from fill level,
    drain volume, or mass inventory measurements together with the PbLi density at
    the relevant temperature.


    The volume enters liquid-metal inventory estimates through $M_\mathrm{PbLi} =
    \rho_\mathrm{PbLi} V_\mathrm{cool}$ and residence-time estimates through $\tau
    \approx V_\mathrm{cool}/\dot{V} = \rho_\mathrm{PbLi} V_\mathrm{cool}/\dot{m}$,
    where $\rho_\mathrm{PbLi}$ is density, $\dot{V}$ is volumetric flow rate, and
    $\dot{m}$ is mass flow rate. For heat-removal sizing it is used together with
    flow distribution, allowable temperature rise, pressure drop, material limits,
    and [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket);
    it does not by itself determine mass flow rate or net thermal power, and blanket
    nuclear heating can include energy deposited in structural components as well
    as in coolant or breeder regions.


    Typical values for reactor-scale liquid-metal breeder blankets are about 10-200
    m^3 for the full blanket. Individual sectors, cassettes, or test blanket modules
    can contain much smaller volumes, commonly 0.01-10 m^3, and should not be confused
    with the whole-blanket total unless explicitly summed over the complete blanket.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket
  - name:net_thermal_power_of_breeder_blanket_module
- name: net_thermal_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Net thermal power removed from a single breeder blanket module by its
    coolant. It equals the total coolant enthalpy increase summed across all coolant
    branches serving the module and combines nuclear energy deposition with the absorbed
    fraction of incident radiation that reaches the coolant.
  documentation: "Net thermal power of a breeder blanket module is the rate at which\
    \ the module's coolant circuit carries thermal energy away from that module. It\
    \ is an aggregate per-module power that combines thermal energy transferred to\
    \ the coolant from neutron and gamma heating, decay heat when relevant, and the\
    \ absorbed fraction of incident radiation, while excluding power generated or\
    \ removed outside the module boundary.\n\nFor a steady coolant circuit, the defining\
    \ calorimetric relation is the total coolant enthalpy rise across all coolant\
    \ branches serving the module:\n\n$$\nP_{\\mathrm{th,net}} = \\sum_k \\dot{m}_k\
    \ \\left(h_{\\mathrm{out},k} - h_{\\mathrm{in},k}\\right)\n$$\n\nwhere $k$ labels\
    \ coolant branches, $\\dot{m}_k$ is the coolant mass flow rate in branch $k$ (kg/s),\
    \ and $h_{\\mathrm{in},k}$ and $h_{\\mathrm{out},k}$ are the inlet and outlet\
    \ specific enthalpies (J/kg). The common expression $\\dot{m}\\, c_p\\, \\Delta\
    \ T$, with $c_p$ in J/(kg\xB7K), is a constant-$c_p$ approximation to this enthalpy\
    \ balance valid when pressure changes and the temperature dependence of the heat\
    \ capacity are small.\n\nThis module-level power aggregates the nuclear deposition\
    \ tracked by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket)\
    \ and its layer-resolved counterpart [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer),\
    \ and shares the same coolant enthalpy-balance formalism as [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port).\
    \ It feeds reactor-level power balance and tritium-breeding-efficiency assessments.\n\
    \nTypical values range from about $10^4$-$10^6$ W for small test blanket modules\
    \ or low-power operating phases, and about $10^6$-$10^7$ W per module for reactor-relevant\
    \ breeding blanket segments, depending on module size, neutron wall loading, coolant\
    \ design, and plasma radiated power.\n\nSign convention: Positive when thermal\
    \ energy is removed from the breeder blanket module by the coolant circuit."
  unit: W
  physics_domain: structural_components
  links:
  - name:total_neutron_power_of_breeder_blanket_module
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:power_of_breeder_blanket_layer
- name: nuclear_heating_power_of_breeder_blanket
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited in the breeder blanket by neutron
    and photon interactions, integrated over all blanket modules and constituent materials.
    It represents volumetric nuclear energy deposition and excludes separate plasma-facing
    surface heat loads.
  documentation: 'Nuclear heating power of the breeder blanket is the total rate at
    which fusion neutrons and secondary photons deposit energy inside the blanket
    volume. It includes volumetric energy deposition in breeder, multiplier, coolant,
    structural, and other internal materials, and excludes plasma radiation, charged-particle,
    neutral-particle, and other surface heat loads treated as boundary heating.


    The blanket total is obtained by integrating the local nuclear heating power density
    over the blanket volume:


    $$

    P_{\mathrm{nuc,blanket}} = \int_{V_{\mathrm{blanket}}} q_{\mathrm{nuc}}(\mathbf{r})
    \, dV

    $$


    where $P_{\mathrm{nuc,blanket}}$ is the integrated blanket nuclear heating power,
    $V_{\mathrm{blanket}}$ is the volume occupied by the breeder blanket, $q_{\mathrm{nuc}}(\mathbf{r})$
    is the local volumetric nuclear heating power density in W m$^{-3}$, and $dV$
    is a volume element.


    In practice this quantity is computed with coupled neutron-photon transport calculations
    using the fusion neutron source, material compositions, geometry, and nuclear
    reaction data. The same total can be partitioned into module contributions such
    as [nuclear_heating_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module)
    or material-layer contributions such as [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer);
    heating in associated shielding regions is described separately by [nuclear_heating_power_of_breeder_blanket_shield](name:nuclear_heating_power_of_breeder_blanket_shield).
    The spatial distribution underlying the integral is represented by [nuclear_power_density_of_breeder_blanket_module](name:nuclear_power_density_of_breeder_blanket_module).
    Results may be checked against integral neutronics benchmarks, activation measurements,
    photon-heating detectors, or calorimetric measurements where available.


    For reactor-scale D-T blankets with fusion power near $2 \times 10^9$ W, representative
    blanket nuclear heating powers are about $1.2$-$1.6 \times 10^9$ W. The value
    scales with neutron source strength, blanket coverage, material composition, and
    neutron energy multiplication, which is often in the range $1.1$-$1.3$ for power-producing
    blanket concepts; partial test blankets or lower-power sources can be orders of
    magnitude smaller.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_shield
  - name:nuclear_power_density_of_breeder_blanket_module
- name: nuclear_heating_power_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited within one material layer of
    a breeding blanket by neutron and photon energy deposition in that layer.
  documentation: 'Nuclear heating power of a breeder blanket layer is the total rate
    at which fusion-born neutrons and secondary photons deposit energy in the material
    volume assigned to that layer. It includes local energy deposition from nuclear
    reactions and photon interactions in structural, breeder, multiplier, coolant-channel,
    or other functional materials that belong to the layer.


    It is obtained by integrating the local nuclear heating power density over the
    layer volume:


    $$

    P_{\mathrm{nuc}} = \int_{V_{\mathrm{layer}}} q_{\mathrm{nuc}}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{nuc}}$ is the layer nuclear heating power in W, $V_{\mathrm{layer}}$
    is the physical volume of the layer in m$^3$, $dV$ is a differential volume element
    in m$^3$, and $q_{\mathrm{nuc}}$ is the local nuclear heating power density in
    W m$^{-3}$.


    In practice this quantity is computed from coupled neutron-photon transport and
    nuclear data, usually by tallying heating over the material cells representing
    the layer. Gamma heating should be interpreted as energy deposited by photons
    produced by neutron interactions, activation, capture, inelastic scattering, or
    other photon sources represented in the transport model, not as a universal signature
    of a particular breeding reaction. If a module is decomposed into non-overlapping
    layers that completely partition the module volume, the sum of the layer heating
    powers equals the corresponding [module nuclear heating power](name:nuclear_heating_power_of_breeder_blanket_module);
    otherwise gaps, overlaps, homogenization choices, and separately modeled components
    can make the sums differ.


    Typical values for a single blanket-module layer range from about 10^3-10^6 W
    in reactor-relevant blanket designs, depending on neutron wall loading, layer
    volume, material composition, and radial position. Small test modules or weakly
    irradiated peripheral layers may be below this range, while large high-power modules
    or layers close to the plasma-facing side can exceed it.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_power_density_of_breeder_blanket_layer
  - name:power_of_breeder_blanket_layer
- name: nuclear_heating_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited in a single breeder blanket module
    by neutron scattering, neutron capture, and secondary gamma radiation interactions
    with the module's structural and functional materials.
  documentation: 'Nuclear heating power of a breeder blanket module is the total rate
    at which neutron and photon radiation transfer energy to the structural and functional
    materials comprising that module. The dominant mechanisms are neutron elastic
    and inelastic scattering, exothermic neutron capture reactions (including lithium
    reactions that also breed tritium), and absorption of secondary gamma rays produced
    throughout the module volume.


    The module-level heating power is the volume integral of the local nuclear heating
    power density $q_\text{nuc}(\mathbf{r})$ over the module volume $V$:


    $$

    P_\text{nuc} = \int_V q_\text{nuc}(\mathbf{r}) \, dV

    $$


    where $q_\text{nuc}$ is the volumetric energy deposition rate in W m$^{-3}$, as
    described by [nuclear_power_density_of_breeder_blanket_module](name:nuclear_power_density_of_breeder_blanket_module).


    This quantity is obtained from neutron and photon transport simulations and feeds
    directly into thermal-hydraulic analyzes for coolant sizing and material temperature
    verification. It is more spatially resolved than [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket),
    which aggregates over all modules, and complements [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer),
    which further resolves heating by material layer within the module. Unlike [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    this quantity includes gamma-ray heating contributions and accounts only for energy
    absorbed rather than that generated within the module.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_heating_power_of_breeder_blanket_layer
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_neutrons
    dd_path: breeding_blanket/module/time_slice/power_thermal_neutrons
    status: composed
- name: nuclear_heating_power_of_breeder_blanket_shield
  kind: scalar
  status: draft
  description: Nuclear heating power deposited in the breeding blanket shield by neutron
    and gamma radiation interactions with shield structural materials.
  documentation: 'The breeder blanket shield absorbs residual neutron and gamma radiation
    that penetrates the breeding zone, converting particle energy to heat through
    neutron scattering, capture reactions, and Compton scattering of secondary photons.
    This thermal load determines the cooling circuit requirements for the shield structure
    and is a principal design constraint for protecting superconducting magnets from
    radiation-induced heating.


    The total nuclear heating power is the volume integral of the local nuclear power
    density $q''''''(\mathbf{r})$ over the shield volume $V_\mathrm{shield}$:


    $$

    P_\mathrm{shield} = \int_{V_\mathrm{shield}} q''''''(\mathbf{r}) \, dV

    $$


    where $q''''''(\mathbf{r})$ is in W m$^{-3}$ and sums contributions from both
    neutron and secondary gamma interactions throughout the shield material.


    This quantity is evaluated via neutron transport analysis using validated nuclear
    cross-section libraries for the shield material composition, benchmarked against
    integral activation experiments. It is the shield-level analog of the layer-resolved
    [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer)
    and the blanket-wide integral [nuclear heating power of the full breeding blanket](name:nuclear_heating_power_of_breeder_blanket);
    the volumetric counterpart [nuclear power density of a breeder blanket module](name:nuclear_power_density_of_breeder_blanket_module)
    provides the spatially resolved distribution used in detailed thermal-hydraulic
    analyzes.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_power_density_of_breeder_blanket_module
- name: nuclear_power_density_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Volumetric nuclear heating power density deposited in a single breeder
    blanket layer by neutron and gamma interactions. It is local heat generation per
    unit material volume, distinct from volume-integrated blanket power.
  documentation: 'Nuclear power density of a breeder blanket layer is the local volumetric
    rate at which energy from neutron and gamma interactions is deposited as heat
    in the layer material. It is a material heat-source density for a particular layer,
    not the total power generated by that layer or by the blanket.


    The local definition is the differential nuclear heating power per material volume:


    $$

    q''''''_\mathrm{nuc}(\mathbf{r}) = \frac{dP_\mathrm{nuc}}{dV}

    $$


    where $q''''''_\mathrm{nuc}$ is the nuclear power density in W m$^{-3}$, $dP_\mathrm{nuc}$
    is the incremental nuclear heating power in W deposited in the material volume
    element $dV$ in m$^3$, and $\mathbf{r}$ denotes position in the layer. The corresponding
    total layer heating power, [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer),
    is obtained by integrating $q''''''_\mathrm{nuc}$ over the layer volume; summing
    layer and component contributions gives [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).


    In practice, this quantity is computed from neutronics transport and energy-deposition
    calculations using the fusion neutron source, blanket geometry, and material composition.
    Contributions include recoil energy from neutron scattering, charged-particle
    energy from nuclear reactions such as lithium breeding reactions, capture energy,
    and absorption or scattering of secondary gamma radiation. Because the density
    is fundamentally local, any single layer value should be interpreted with its
    separately specified spatial sampling or averaging region; if a volume average
    over a region of volume $V$ is intended, $\bar{q}''''''_\mathrm{nuc}=P_\mathrm{nuc}/V$
    applies as an averaging relation, not as the local definition.


    Typical values in fusion breeder blanket materials are about 10^5-10^7 W m^-3,
    depending on neutron wall loading, material composition, depth in the blanket,
    and local shielding. High-heating regions can reach several 10^7 W m^-3, while
    well-shielded or rear regions may be below 10^5 W m^-3.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
- name: nuclear_power_density_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Local volumetric nuclear heating power density in a breeder blanket
    module from neutron and photon interactions in blanket materials. It is evaluated
    on the module midplane as a representative pointwise power deposition rate, not
    as a volume-averaged module power.
  documentation: 'Nuclear power density of a breeder blanket module is the local rate
    at which nuclear radiation deposits recoverable heat per unit volume in the module
    materials. It includes energy transferred by neutron scattering, absorption, charged-particle
    production, recoil nuclei, photon production, and photon absorption. For this
    module-level quantity, the local value is specified on the module midplane, fixing
    a representative poloidal location; it is not a volume average and not the total
    module heating power.


    For a material point on the module midplane, the nuclear heating power density
    can be written as an energy-integrated transport response:


    $$

    q_\mathrm{nuc}(\mathbf{r}) = \sum_c \int_0^\infty \Phi_c(\mathbf{r}, E)\,\kappa_c(\mathbf{r},
    E)\,dE

    $$


    where $q_\mathrm{nuc}$ is the volumetric heating rate, $\mathbf{r}$ is the material
    point, $E$ is particle energy, $\Phi_c$ is the differential scalar flux for particle
    class $c$, and $\kappa_c$ is the corresponding macroscopic heating or kerma coefficient
    for the local material mixture. The sum includes neutron and photon contributions
    that deposit energy locally or through secondary radiation.


    In practice, this quantity is computed with coupled neutron-photon transport calculations
    using evaluated nuclear data and a material model of the blanket module. Midplane
    values are sampled at material locations across the module build and are used
    as volumetric heat-source terms for thermal-hydraulic, thermo-mechanical, and
    structural integrity assessments. Experimental validation can use calorimetry,
    activation measurements, dosimetry, and heat-balance data in blanket mock-ups
    or irradiation experiments.


    The module-level density represents the local heating in the material mixture
    or homogenized region used for the module model. A layer-specific density, such
    as [nuclear_power_density_of_breeder_blanket_layer](name:nuclear_power_density_of_breeder_blanket_layer),
    restricts the same physical quantity to an individual functional layer such as
    first wall, breeder, multiplier, structural, or shield material. Integrating the
    local density over the module volume gives the total [nuclear_heating_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module).


    In D-T blanket concepts driven by 14.1 MeV fusion neutrons, representative nuclear
    power densities near the plasma-facing side are commonly of order 1-20 MW m^-3,
    with 5-15 MW m^-3 typical for high-load first-wall or breeder regions. Values
    deeper in the blanket generally decrease with neutron attenuation, photon transport,
    material composition, and local neutron multiplication, and may be lower by factors
    of several to more than an order of magnitude.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_layer
- name: nuclear_power_density_of_limiter_tile
  kind: scalar
  status: draft
  description: Local volumetric heating rate in a limiter tile due to neutron scattering,
    neutron capture, and secondary gamma radiation interactions with the tile material.
  documentation: 'Nuclear power density in a limiter tile is the volumetric rate of
    energy deposition arising from nuclear interactions between the fusion neutron
    field and the tile material, including fast neutron elastic and inelastic scattering,
    radiative capture, and secondary gamma heating. It characterizes how the total
    nuclear heat load is distributed spatially within the tile volume.


    The nuclear power density $q''''''_\mathrm{nuc}(\mathbf{r})$ at a point $\mathbf{r}$
    within the tile is:


    $$

    q''''''_\mathrm{nuc}(\mathbf{r}) = \sum_r \Sigma_r(\mathbf{r})\,\phi(\mathbf{r})\,Q_r

    $$


    where $\Sigma_r(\mathbf{r})$ is the macroscopic cross section for reaction $r$,
    $\phi(\mathbf{r})$ is the local neutron flux, and $Q_r$ is the energy deposited
    per reaction. Integrating $q''''''_\mathrm{nuc}$ over the tile volume yields the
    total nuclear power deposited in the tile, as given by [nuclear_power_of_limiter_tile](name:nuclear_power_of_limiter_tile).


    This quantity is computed from neutronics transport calculations using the fusion
    neutron source spectrum and material-specific nuclear cross-section libraries,
    with the spatial distribution depending on local material composition and tile
    geometry. Analogous volumetric nuclear heating quantities for breeding blanket
    structures are given by [nuclear_power_density_of_breeder_blanket_module](name:nuclear_power_density_of_breeder_blanket_module)
    and [nuclear_power_density_of_breeder_blanket_layer](name:nuclear_power_density_of_breeder_blanket_layer),
    where nuclear deposition additionally drives tritium breeding.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_power_of_limiter_tile
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_layer
- name: nuclear_power_of_limiter_tile
  kind: scalar
  status: draft
  description: Total rate at which nuclear heating deposits energy throughout the
    material of a limiter tile. The heating arises from elastic and inelastic scattering
    and capture of neutrons together with absorption of primary and secondary gamma
    radiation, and it is the volume integral of the local nuclear-heating power density
    over the tile material, not a representative midplane value.
  documentation: 'Nuclear power of a limiter tile is the total rate at which neutron
    and gamma radiation deposit energy within the bulk material of the tile. The neutron
    contribution comes from elastic and inelastic scattering and from radiative capture
    reactions, while the gamma contribution comes from absorption of both primary
    fusion gammas and secondary gammas produced by neutron capture and inelastic scattering
    inside the tile. This bulk volumetric heating is distinct from the plasma-facing
    surface heat flux delivered by charged particles and from conducted thermal power.


    The deposited power is the volume integral of the spatial nuclear-heating power
    density over the material volume of the tile:


    $$

    P_\mathrm{nuc} = \int_{V_\mathrm{tile}} q_\mathrm{nuc}(\mathbf{x}) \, dV

    $$


    where $P_\mathrm{nuc}$ is the tile nuclear power, $V_\mathrm{tile}$ is the material
    volume of the limiter tile, $q_\mathrm{nuc}(\mathbf{x})$ is the local nuclear-heating
    power density in W m$^{-3}$, and $\mathbf{x}$ denotes position within the tile.


    In practice $q_\mathrm{nuc}$ is obtained from coupled neutron and photon transport
    calculations using the plasma neutron source, the component geometry, and the
    material composition, accounting for neutron scattering, capture, secondary-gamma
    production, attenuation, self-shielding, and streaming. Direct measurement of
    the total deposited nuclear power is uncommon; validation may rely on activation
    foils, calorimetry, temperature response, or dedicated nuclear-heating sensors.


    Do not infer this quantity by directly integrating [nuclear_power_density_of_limiter_tile](name:nuclear_power_density_of_limiter_tile)
    unless an external model has explicitly converted that representative scalar into
    a true spatial heating field. That related quantity denotes a midplane or representative
    nuclear power density for the tile, whereas the total power depends on the full
    nonuniform deposition pattern caused by attenuation, streaming, self-shielding,
    and material layering.


    Illustrative magnitudes range from well below 1 W in low-neutron-yield or small
    experimental plasmas to roughly 10^2-10^5 W for large limiter tiles in high-neutron-yield
    deuterium-tritium operation, scaling with neutron wall loading, exposure geometry,
    tile volume, material composition, and shielding; these ranges are indicative
    rather than authoritative.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_limiter_tile
  - name:nuclear_heating_power_of_breeder_blanket_layer
- name: power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Power quantity associated with a single breeder blanket module, abstracting
    over incident neutron surface loads, volumetric nuclear energy deposition, plasma
    radiation, and total thermal output as distinct energy-budget components.
  documentation: 'A breeder blanket module participates in multiple distinct energy-exchange
    pathways between the fusion plasma and the blanket structure. The principal power
    channels resolved at the module level include the neutron surface load characterized
    by [incident_power_of_breeder_blanket_module](name:incident_power_of_breeder_blanket_module),
    the volumetric nuclear energy deposited inside the module through scattering and
    capture reactions described by neutron_power_of_breeder_blanket_module, and the
    electromagnetic photon flux from plasma bremsstrahlung and line radiation quantified
    by [radiated_power_of_breeder_blanket_module](name:radiated_power_of_breeder_blanket_module).


    The total power delivered to the module coolant combines these channels:


    $$

    P_\mathrm{module} = P_n + P_\mathrm{rad,abs} + P_\mathrm{aux}

    $$


    where $P_n$ is the deposited neutron power, $P_\mathrm{rad,abs}$ is the absorbed
    fraction of incident plasma radiation after surface reflection, and $P_\mathrm{aux}$
    covers auxiliary heating contributions; nuclear multiplication reactions in the
    tritium-breeding material can amplify $P_n$ above the incident neutron surface
    load.


    Module-level power quantities are computed from neutronics transport simulations
    for nuclear deposition channels, coupled with plasma radiation models for photon
    loads, and validated against calorimetric measurements of coolant enthalpy rise,
    the latter captured by [net_thermal_power_of_breeder_blanket_module](name:net_thermal_power_of_breeder_blanket_module).
    The blanket-wide integral summed over all modules is given by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).'
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_power_of_breeder_blanket_module
  - name:radiated_power_of_breeder_blanket_module
  - name:net_thermal_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
  sources:
  - id: derived:power_of_breeder_blanket_module
    status: composed
- name: incident_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Power carried by fusion-born neutrons crossing into a single breeder
    blanket module. This is an incident surface load, not the energy deposited or
    multiplied inside the module.
  documentation: 'Incident power of a breeder blanket module is the rate at which
    kinetic energy of fusion-born neutrons enters one module across the surfaces exposed
    to the external neutron field. It is a non-negative incoming surface load, distinct
    from volumetric nuclear heating, tritium production, or neutron multiplication
    inside the module.


    The incident power $P_\mathrm{inc}$ is defined by integrating the incoming neutron
    energy current over the relevant module surface:


    $$

    P_\mathrm{inc} = \int_S \int_0^\infty E\, j_n^-(E,\mathbf{r})\, dE\, dA

    $$


    where $S$ is the module surface receiving the external fusion-neutron field, $E$
    is neutron kinetic energy in joules, $j_n^-(E,\mathbf{r})$ is the differential
    inward neutron current density at surface position $\mathbf{r}$ with units $m^{-2}\,s^{-1}\,J^{-1}$,
    $dE$ is an energy interval in joules, and $dA$ is a surface element in square
    meters. The inward-current notation includes only neutrons crossing into the module
    from outside; secondary neutrons generated after entry contribute to related neutron-power
    quantities rather than to this incident term.


    In practice, this quantity is evaluated from the energy- and angle-dependent neutron
    field at the module boundary, constrained by the fusion neutron source strength,
    module area and solid angle, gaps, and attenuation or shadowing by intervening
    structures. It provides a boundary load for breeding and heating analyzes; [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module)
    describes neutron power after interactions and multiplication within the module,
    while [power_of_breeder_blanket_module](name:power_of_breeder_blanket_module)
    represents the broader module power balance.


    Representative per-module values in reactor-scale deuterium-tritium blanket systems
    are typically $10^5-10^7$ W, with smaller test modules or heavily shadowed regions
    below $10^5$ W. Values scale mainly with total fusion neutron source strength,
    exposed area, geometric coverage, and shielding by nearby components.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:power_of_breeder_blanket_module
  arguments:
  - name: power_of_breeder_blanket_module
    operator: incident
    operator_kind: qualifier
- name: radiated_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: "Electromagnetic radiative power from plasma photon emission \u2014\
    \ bremsstrahlung and line radiation \u2014 associated with a single breeding blanket\
    \ module, encompassing both incident and surface-absorbed components."
  documentation: "The radiated power of a breeding blanket module quantifies the photon\
    \ power originating from plasma electromagnetic emission \u2014 chiefly bremsstrahlung\
    \ continuum and atomic line radiation \u2014 that arrives at and interacts with\
    \ the module's plasma-facing surface. It serves as the parent abstraction for\
    \ two physically distinct sub-quantities: the total incident flux crossing the\
    \ outer surface before any reflection, represented by [incident_radiated_power_of_breeder_blanket_module](name:incident_radiated_power_of_breeder_blanket_module),\
    \ and the net power retained by the module after surface reflection losses, represented\
    \ by [absorbed_radiated_power_of_breeder_blanket_module](name:absorbed_radiated_power_of_breeder_blanket_module).\n\
    \nThe relationship between incident and absorbed power is:\n\n$$\nP_\\text{abs}\
    \ = (1 - \\mathcal{R})\\, P_\\text{inc}\n$$\n\nwhere $P_\\text{inc}$ is the incident\
    \ radiative power, $\\mathcal{R}$ is the effective hemispherical surface reflectance\
    \ averaged over the incident photon spectrum, and $P_\\text{abs}$ is the absorbed\
    \ radiated power.\n\nIn reactor design, $P_\\text{inc}$ is derived from view-factor\
    \ integration of the total plasma radiated power over the module surface, while\
    \ $P_\\text{abs}$ is obtained by applying a reflectance correction to that incident\
    \ value. The absorbed component contributes to the total thermal duty of the module\
    \ alongside neutron volumetric heating, both of which feed into [net_thermal_power_of_breeder_blanket_module](name:net_thermal_power_of_breeder_blanket_module).\
    \ The non-nuclear radiation fraction for the whole breeding blanket is assessed\
    \ via [thermal_power_of_breeder_blanket](name:thermal_power_of_breeder_blanket)."
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_radiated_power_of_breeder_blanket_module
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:net_thermal_power_of_breeder_blanket_module
  - name:thermal_power_of_breeder_blanket
  arguments:
  - name: power_of_breeder_blanket_module
    operator: radiated
    operator_kind: qualifier
- name: absorbed_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Net photon power absorbed by a breeding blanket module from incident
    plasma radiation, equal to the incident radiated power on the module surface minus
    the reflectivity-weighted reflected photon power.
  documentation: 'Absorbed radiated power of a breeding blanket module is the net
    photon power deposited in the module by plasma radiation after reflection at its
    exposed surfaces. It is the radiative heat-load component of the module power
    balance and excludes particle heat flux, conductive heat transfer from neighboring
    structures, neutron nuclear heating, and internally generated power.


    The absorbed power is defined from the incident photon power and the reflected
    fraction:


    $$

    P_{\mathrm{abs}} = P_{\mathrm{inc}} - P_{\mathrm{refl}} = \left(1 - \alpha_{\mathrm{eff}}\right)
    P_{\mathrm{inc}}

    $$


    where $P_{\mathrm{abs}}$, $P_{\mathrm{inc}}$, and $P_{\mathrm{refl}}$ are powers
    in W, and $\alpha_{\mathrm{eff}}$ is an effective dimensionless radiative reflectivity
    for the relevant surface, spectrum, incidence angles, and operating conditions.
    The reflected power is therefore $P_{\mathrm{refl}} = \alpha_{\mathrm{eff}} P_{\mathrm{inc}}$.


    In practice, this quantity is computed by combining plasma radiation measurements
    or radiation-transport calculations with the module-facing geometry and surface
    optical properties. It is conceptually analogous to radiated_power_at_wall, but
    restricted to the portion of the wall represented by a breeding blanket module.


    Typical values are strongly device-, module-, and scenario-dependent: they may
    be near 0 W when no plasma radiation reaches the module, can be in the 10^3-10^6
    W range for substantial module-facing radiative loads, and may be higher for large
    blanket sectors in reactor-relevant designs.'
  unit: W
  physics_domain: structural_components
  links: []
  arguments:
  - name: radiated_power_of_breeder_blanket_module
    operator: absorbed
    operator_kind: qualifier
- name: incident_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Total electromagnetic radiative power from the plasma arriving at the
    outer surface of a breeding blanket module, including bremsstrahlung and line
    radiation contributions, before accounting for surface reflection losses.
  documentation: 'The incident radiated power of a breeding blanket module is the
    total electromagnetic power from the surrounding plasma that arrives at the module''s
    outer surface, integrated over that surface per unit time. Plasma radiation sources
    contributing to this load include bremsstrahlung from electron-ion Coulomb collisions,
    impurity line radiation, and synchrotron emission, all transported across the
    scrape-off layer to the first-wall and blanket boundary.


    The incident radiative load is defined as:


    $$

    P_\mathrm{inc,rad} = \int_S \mathbf{q}_\mathrm{rad} \cdot \hat{n} \, dA

    $$


    where $\mathbf{q}_\mathrm{rad}$ is the local incident radiative heat-flux vector,
    $\hat{n}$ is the inward surface unit normal, and the integral extends over the
    total module surface area $A$.


    This quantity represents the gross radiative power before surface reflection;
    the net thermally retained fraction is captured by [absorbed_radiated_power_of_breeder_blanket_module](name:absorbed_radiated_power_of_breeder_blanket_module),
    which subtracts the reflected component. Together with nuclear heating quantified
    by [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    this term enters the full surface thermal balance of the blanket and is a key
    input for coolant circuit design and blanket lifetime assessment.'
  unit: W
  physics_domain: structural_components
  links:
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  arguments:
  - name: radiated_power_of_breeder_blanket_module
    operator: incident
    operator_kind: qualifier
- name: resistance_of_cryostat
  kind: scalar
  status: draft
  description: Electrical resistance of a discrete block element of the cryostat passive
    conductor structure, covering both the structural vessel and thermal shield segments,
    used in eddy current and electromagnetic analyzes.
  documentation: 'The electrical resistance of a discrete cryostat element quantifies
    its opposition to current flow, characterizing the ohmic property of a localized
    conducting segment within the passive cryostat structure. The cryostat passive
    structure encompasses both the structural vessel body and the thermal shield;
    in lumped-circuit electromagnetic models each is discretized into finite block
    elements, each assigned a resistance value.


    For a homogeneous element, the resistance relates to the bulk material resistivity
    $\rho$ (see [resistivity_of_cryostat](name:resistivity_of_cryostat)) through:


    $$

    R = \frac{\rho \, \ell}{A}

    $$


    where $\ell$ is the current-path length through the element and $A$ is the cross-sectional
    area perpendicular to current flow.


    During plasma disruptions, halo events, or fast field transients, time-varying
    magnetic fluxes induce eddy currents in the passive cryostat structure; the per-element
    resistance governs both the magnitude of the [toroidal current of the cryostat](name:toroidal_current_of_cryostat)
    and the Joule dissipation rate $P = I^2 R$ in each segment. The analogous quantity
    for the vacuum vessel passive structure is [resistance_of_vacuum_vessel](name:resistance_of_vacuum_vessel),
    which follows the same discrete-element methodology. For large fusion-device cryostats
    fabricated from austenitic stainless steel or Inconel, individual block-element
    resistances typically fall in the micro-ohm to milli-ohm range, depending on element
    geometry and alloy composition.'
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_cryostat
  - name:toroidal_current_of_cryostat
  - name:resistance_of_vacuum_vessel
- name: resistance_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Electrical resistance of a discrete block element of the vacuum vessel
    passive conductor, governing ohmic dissipation and induced-current time scales
    during disruptions and vertical displacement events.
  documentation: 'The vacuum vessel acts as a toroidally continuous passive conductor
    that carries large induced eddy and halo currents during plasma disruptions and
    vertical displacement events. Its electromagnetic circuit model discretizes the
    vessel into block elements, each assigned a resistance that determines current
    distribution, ohmic power deposition, and the $L/R$ decay time constant of the
    induced currents.


    For a discrete element, the power dissipated by the induced current $I$ follows
    Joule''s law:


    $$

    P = I^2 R

    $$


    where $R$ is the element resistance and $P$ is the instantaneous ohmic heating
    rate of that element. The ratio $L/R$, where $L$ is the element self-inductance,
    sets the characteristic time scale over which the induced current decays once
    the driving source is removed.


    The element resistance is related to the intrinsic [material resistivity of the
    vessel](name:resistivity_of_vacuum_vessel) $\rho$ through $R = \rho \ell / A$,
    where $\ell$ is the effective current-path length through the element and $A$
    is its cross-sectional area. For austenitic stainless steel vessel sections, individual
    element resistances typically lie in the micro-ohm to milli-ohm range depending
    on discretization size and element geometry. The analogous circuit-level quantity
    for the cryostat passive conductor structure is [resistance_of_cryostat](name:resistance_of_cryostat).'
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistance_of_cryostat
- name: resistivity_of_cryostat
  kind: scalar
  status: draft
  description: Electrical resistivity of the cryostat structural material, encompassing
    both the vessel body and the thermal shield, used as the primary electromagnetic
    material property in eddy-current analyzes.
  documentation: "Electrical resistivity is an intrinsic material property quantifying\
    \ resistance to electrical current flow per unit length and unit cross-sectional\
    \ area of a conducting medium. For the cryostat \u2014 which comprises the main\
    \ structural vessel and the surrounding thermal shield \u2014 this property governs\
    \ the amplitude of eddy currents induced during transient plasma events such as\
    \ disruptions and vertical displacement events, and the resulting ohmic heating\
    \ and electromagnetic forces on the structure.\n\nThe resistance $R$ of a cryostat\
    \ structural element is related to its resistivity $\\rho$ through element geometry:\n\
    \n$$\nR = \\rho \\frac{L}{A}\n$$\n\nwhere $L$ is the element length along the\
    \ current path and $A$ is its cross-sectional area perpendicular to current flow.\n\
    \nThis material constant is applied in electromagnetic finite-element analyzes\
    \ to model induced current distributions and compute $\\mathbf{J} \\times \\mathbf{B}$\
    \ forces and ohmic power deposition during disruptions. Metallic cryostat materials\
    \ span a wide range: austenitic stainless steel yields roughly $7 \\times 10^{-7}$\
    \ \u03A9\xB7m, while aluminum alloys are lower at approximately $3 \\times 10^{-8}$\
    \ \u03A9\xB7m at ambient temperature; both values increase with temperature. The\
    \ companion [resistance_of_cryostat](name:resistance_of_cryostat) gives the total\
    \ resistance of a discrete structural element, while [resistivity_of_vacuum_vessel](name:resistivity_of_vacuum_vessel)\
    \ is the analogous property for the vacuum vessel wall."
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistance_of_cryostat
  - name:resistivity_of_vacuum_vessel
- name: resistivity_of_limiter_tile
  kind: scalar
  status: draft
  description: Electrical resistivity of a limiter tile is the intrinsic material
    property that relates electric field to current density and quantifies opposition
    to current flow. For anisotropic tile materials, the scalar value represents an
    isotropic approximation or an effective value for a stated current direction and
    temperature.
  documentation: 'Electrical resistivity of a limiter tile is the material property
    that determines how strongly the tile opposes electric current flow. It is the
    inverse of electrical conductivity and depends on composition, microstructure,
    irradiation state, and temperature. For anisotropic materials such as graphite
    or carbon-fiber composites, a single scalar resistivity is an isotropic approximation
    or an effective value along a specified direction, such as in-plane or through-thickness
    current flow.


    For a homogeneous tile segment represented by a scalar resistivity, the relation
    between resistance and geometry is:


    $$

    \rho = R\,\frac{A}{L}

    $$


    where $\rho$ is electrical resistivity in $\Omega\,\mathrm{m}$, $R$ is electrical
    resistance in $\Omega$, $A$ is the cross-sectional area normal to the current
    path in $\mathrm{m}^2$, and $L$ is the current-path length in $\mathrm{m}$.


    Limiter-tile resistivity is commonly measured using four-point probe, van der
    Pauw, or machined-bar resistance methods, with the measurement direction specified
    when the material is anisotropic. Values used for electromagnetic or eddy-current
    calculations should be associated with a reference temperature or a temperature-dependent
    law, because metallic plasma-facing materials usually have resistivity that increases
    strongly with temperature.


    Typical room-temperature values are about $4\times10^{-8}$-$2\times10^{-7}\,\Omega\,\mathrm{m}$
    for dense metallic limiter materials such as beryllium, tungsten, and refractory
    alloys; tungsten is approximately $5.3\times10^{-8}\,\Omega\,\mathrm{m}$. Carbon-based
    graphite and carbon-fiber composite limiter materials are much more resistive
    and direction dependent, typically $5\times10^{-6}$-$1\times10^{-4}\,\Omega\,\mathrm{m}$
    depending on grade, porosity, and fiber orientation.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistivity_of_plasma_facing_component
- name: resistivity_of_plasma_facing_component
  kind: scalar
  status: draft
  description: Electrical resistivity of the material forming a plasma-facing component.
    It is an isotropic or effective scalar material property used with component geometry
    and temperature to determine electrical resistance and eddy-current response.
  documentation: 'Electrical resistivity of a plasma-facing component is the scalar
    material property that relates electric field to current density within the component
    material. It represents either an isotropic bulk resistivity or an effective resistivity
    for a material, coating, composite, or engineered tile when directional or microstructural
    details are not resolved.


    For an isotropic conducting material, the local constitutive relation is Ohm''s
    law:


    $$

    \mathbf{E} = \rho_e \mathbf{J}

    $$


    where $\mathbf{E}$ is the electric field in V/m, $\mathbf{J}$ is the current density
    in A/m$^2$, and $\rho_e$ is the electrical resistivity in $\Omega\,\mathrm{m}$.
    For a simple current path of length $L$ and cross-sectional area $A$, the corresponding
    electrical resistance is $R = \rho_e L/A$, where $R$ is in ohms, $L$ is in meters,
    and $A$ is in m$^2$; thus resistivity is distinct from resistance because geometry
    is not included in the material property itself.


    In electromagnetic analyzes, this quantity is combined with plasma-facing-component
    geometry, thermal state, and contact assumptions to estimate induced currents,
    eddy-current decay times, Joule heating, and electromagnetic loads during transients.
    It is usually obtained from material specifications, dedicated electrical measurements,
    or temperature-dependent material-property models; the value used may represent
    the operating temperature, irradiation state, porosity, coatings, or joints when
    these effects are important.


    Typical values span many orders of magnitude depending on material and temperature:
    high-conductivity metals are commonly about $10^{-8}$-$10^{-7}$ $\Omega\,\mathrm{m}$,
    refractory metals and alloys about $10^{-8}$-$10^{-6}$ $\Omega\,\mathrm{m}$, and
    carbon-based or composite plasma-facing materials about $10^{-6}$-$10^{-4}$ $\Omega\,\mathrm{m}$.
    Effective values for layered, cracked, porous, or contact-limited components can
    be higher than the bulk material value.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistivity_of_limiter_tile
  - name:resistivity_of_passive_structure
  sources:
  - id: dd:wall/description_2d/limiter/unit/resistivity
    dd_path: wall/description_2d/limiter/unit/resistivity
    status: attached
  - id: dd:wall/description_2d/mobile/unit/resistivity
    dd_path: wall/description_2d/mobile/unit/resistivity
    status: attached
- name: resistivity_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Effective isotropic, nonnegative scalar electrical resistivity of the
    vacuum vessel material. Together with vessel geometry, it determines electrical
    resistance and contributes to eddy-current and halo-current response during transient
    electromagnetic events.
  documentation: 'Resistivity of the vacuum vessel is the effective isotropic scalar
    material property relating electric field to conduction current density in the
    conducting vessel wall. It is nonnegative and represents the reciprocal of electrical
    conductivity for the relevant material and operating condition, including effects
    such as temperature, welds, joints, and metallurgical state when represented by
    a single scalar.


    For an effective isotropic conductor, the local Ohm law is


    $$

    \mathbf{E} = \rho_\mathrm{vv}\,\mathbf{J}

    $$


    where $\mathbf{E}$ is the electric field in V m$^{-1}$, $\mathbf{J}$ is the conduction
    current density in A m$^{-2}$, and $\rho_\mathrm{vv}$ is the vacuum-vessel resistivity
    in $\Omega\,\mathrm{m}$. The electrical resistance of a current path is obtained
    from resistivity together with the path geometry; electromagnetic decay times
    are then set by circuit inductance and resistance, for example $\tau = L_c/R$
    for a simple lumped path, where $L_c$ is inductance in henry and $R$ is resistance
    in ohm.


    The value is usually obtained from material specifications, temperature-dependent
    resistivity data, direct measurements on representative samples, or inference
    from measured vessel resistance or electromagnetic response. A scalar value is
    an effective material representation; separate values may be needed when alloy,
    temperature, contact quality, or structural details produce significant spatial
    variation.


    Typical values for stainless-steel vacuum vessels are about $0.6-1.0 \times 10^{-6}\
    \Omega\,\mathrm{m}$ at room temperature and $0.8-1.5 \times 10^{-6}\ \Omega\,\mathrm{m}$
    at elevated operating temperature. Effective values for global vessel electromagnetic
    response often lie around $0.5-2 \times 10^{-6}\ \Omega\,\mathrm{m}$, depending
    on alloy, temperature, and joints; highly conductive copper components are much
    lower, about $1.7 \times 10^{-8}\ \Omega\,\mathrm{m}$ at room temperature.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistance_of_vacuum_vessel
  - name:resistivity_of_cryostat
  - name:resistivity_of_wall_material
  sources:
  - id: dd:wall/description_2d/vessel/unit/annular/resistivity
    dd_path: wall/description_2d/vessel/unit/annular/resistivity
    status: attached
  - id: dd:wall/description_2d/vessel/unit/element/resistivity
    dd_path: wall/description_2d/vessel/unit/element/resistivity
    status: attached
- name: resistivity_of_wall_material
  kind: scalar
  status: draft
  description: Electrical resistivity of the wall material, governing eddy current
    amplitudes and ohmic dissipation induced during disruptions and other electromagnetic
    transient events.
  documentation: 'Electrical resistivity $\rho$ of the wall material is the intrinsic
    scalar property of the conducting medium that relates the local electric field
    to the induced current density via Ohm''s law in differential form.


    $$

    \mathbf{E} = \rho \, \mathbf{J}

    $$


    where $\mathbf{E}$ is in V m$^{-1}$ and $\mathbf{J}$ is in A m$^{-2}$. It is the
    reciprocal of the local electrical conductivity $\sigma = 1/\rho$. In fusion device
    wall structures, this property governs the amplitude of eddy currents induced
    during disruptions, vertical displacement events, and other rapid electromagnetic
    transients, directly controlling ohmic heating and the resulting electromagnetic
    loads on the wall.


    Values are derived from material-property databases or direct laboratory measurement,
    often as a function of temperature; resistivity increases with temperature in
    metallic conductors. For fusion-relevant materials, $\rho$ spans roughly $10^{-8}$
    $\Omega\cdot\text{m}$ for high-conductivity copper alloys to $\sim 10^{-6}$ $\Omega\cdot\text{m}$
    for austenitic stainless steels at room temperature. Analogous quantities for
    other structural components include [resistivity_of_vacuum_vessel](name:resistivity_of_vacuum_vessel)
    and [resistivity_of_limiter_tile](name:resistivity_of_limiter_tile); the corresponding
    property for plasma-facing surface layers is described by [resistivity_of_plasma_facing_component](name:resistivity_of_plasma_facing_component).'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistivity_of_limiter_tile
  - name:resistivity_of_plasma_facing_component
- name: thickness_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: "Layer-normal distance between the inner and outer material interfaces\
    \ of a breeder blanket layer at the equatorial midplane of a module. For radially\
    \ stacked layers in the right-handed cylindrical (R, \u03C6, Z) frame, it coincides\
    \ with the midplane radial build."
  documentation: 'The thickness of a breeder blanket layer is the local separation
    between the layer''s two bounding material interfaces at the equatorial midplane
    of a blanket module. It is a layer-normal through-thickness, not the toroidal
    width, poloidal height, or a volume-equivalent thickness. For radially stacked
    layers it is the radial build in the right-handed cylindrical $(R, \phi, Z)$ system,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    A local midplane thickness for layer $i$ can be defined from the interface positions
    and the local layer normal:


    $$

    d_i = \left|\left(\mathbf{x}_{i,\mathrm{out}} - \mathbf{x}_{i,\mathrm{in}}\right)
    \cdot \hat{\mathbf{n}}_i\right|

    $$


    where $d_i$ is the layer thickness in m, $\mathbf{x}_{i,\mathrm{in}}$ and $\mathbf{x}_{i,\mathrm{out}}$
    are points on the inner and outer bounding interfaces at the midplane in m, and
    $\hat{\mathbf{n}}_i$ is the unit normal through the layer. When the interfaces
    are locally normal to the major-radius direction, this reduces to the absolute
    midplane difference in $R$. The total build along the same normal may be written
    inline as $D=\sum_i d_i$, with each $d_i$ and the total $D$ in m.


    In practice this quantity is obtained from engineering geometry or a neutronics
    model by intersecting the blanket module with the equatorial midplane, identifying
    consecutive material interfaces, and measuring their spacing along the layer-normal
    direction. When combined with [nuclear_power_density_of_breeder_blanket_layer](name:nuclear_power_density_of_breeder_blanket_layer),
    the product of local nuclear power density and thickness gives an areal power
    contribution in W/m^2 for approximately uniform heating along the normal; total
    power requires integration over the layer volume.


    Typical individual layer thicknesses range from 0.001-0.01 m for thin coatings
    or liners, 0.01-0.10 m for coolant, structural, multiplier, or breeder sublayers,
    and 0.1-0.6 m for large breeding or shielding regions. Complete blanket radial
    builds are commonly of order 0.5-1.5 m, depending on device size and shielding
    requirements.'
  unit: m
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_layer
  - name:thickness_of_breeder_blanket_module
  - name:lower_thickness_of_breeder_blanket_module
- name: thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Normal distance through the side-wall material of a breeding blanket
    module, measured between the inner face bounding the module interior and the outer
    side-wall face. It is the structural side-wall extent of the module as a whole,
    distinct from the thickness of an individual breeder layer within the module.
  documentation: 'Thickness of a breeder blanket module is the through-wall distance
    across the module side wall, taken normal to the wall between its inner face (bounding
    the module interior) and its outer face. It quantifies the lateral structural
    material enclosing the module and is distinct from the thickness of an individual
    breeder layer in the internal stack.


    The local wall-normal thickness is the projection of the separation between opposing
    wall faces onto the unit normal of the reference wall surface:


    $$

    t = \left|\left(\mathbf{x}_{\mathrm{out}} - \mathbf{x}_{\mathrm{in}}\right) \cdot
    \hat{\mathbf{n}}\right|

    $$


    where $\mathbf{x}_{\mathrm{in}}$ and $\mathbf{x}_{\mathrm{out}}$ are corresponding
    points on the inner and outer side-wall faces, $\hat{\mathbf{n}}$ is the local
    unit normal directed through the wall, and $t$ is in meters. As a magnitude it
    is non-negative by construction. For curved or tapered walls this is a local or
    nominal engineering thickness and is not in general a simple difference in major
    radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The value is obtained from the module envelope or detailed engineering geometry
    at the specified side-wall reference section. Together with material composition,
    layer thicknesses, and the poloidal cap thicknesses it governs mechanical stiffness,
    thermal conduction paths, neutron attenuation, and the volume available for tritium
    breeding material, without itself defining the internal layer arrangement.


    Typical values are design dependent and lie on the centimeter-to-decimeter scale,
    roughly 0.01-0.3 m across common blanket module concepts, with the appropriate
    value set by module size, structural material, coolant and breeder arrangement,
    neutron shielding requirements, and mechanical load margins.'
  unit: m
  physics_domain: structural_components
  links:
  - name:lower_thickness_of_breeder_blanket_module
  - name:upper_thickness_of_breeder_blanket_module
- name: lower_thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Physical extent of the lower cap of a breeder blanket module, measured
    through the cap between its lower exterior boundary surface and its interface
    with the main module body along the local surface normal. It is a non-negative
    geometric length in meters, not a signed coordinate displacement.
  documentation: 'Lower thickness of a breeder blanket module is the non-negative
    length variable that describes the physical extent of the module''s lower cap.
    It is measured through the cap from the lower exterior boundary surface to the
    interface where the cap joins the main module body, along the local normal to
    the lower cap surface. The word lower identifies the lower poloidal end of the
    module; the quantity is not an overall module dimension or a signed vertical position.


    For a locally smooth cap, the thickness can be represented as the projected separation
    between the two reference surfaces:


    $$

    t_{\mathrm{lower}} = \left|\left(\mathbf{x}_{\mathrm{int}} - \mathbf{x}_{\mathrm{ext}}\right)
    \cdot \hat{\mathbf{n}}_{\mathrm{lower}}\right|

    $$


    where $t_{\mathrm{lower}}$ is the lower cap thickness in m, $\mathbf{x}_{\mathrm{ext}}$
    is a point on the lower exterior boundary surface in m, $\mathbf{x}_{\mathrm{int}}$
    is the corresponding point on the interface with the main module body in m, and
    $\hat{\mathbf{n}}_{\mathrm{lower}}$ is the dimensionless unit normal pointing
    from the exterior boundary toward that interface. The absolute value expresses
    that this is a length. The measurement direction is a local surface-normal direction,
    not a projection along $R$ or $Z$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    In practice the value is taken from the engineering geometry or design definition
    of the blanket module. If the lower cap is curved, tapered, or has nonparallel
    reference surfaces, local projected separations can vary; this scalar should denote
    the nominal design thickness specified for the lower cap. Minimum, maximum, average,
    or location-specific lower-cap thicknesses should be defined explicitly rather
    than substituted for this quantity unless the design definition states that the
    nominal scalar is one of those values.


    Typical values are design-dependent and should be checked against the surrounding
    module geometry. Conceptual breeder blanket cap dimensions are commonly centimeter-
    to decimeter-scale engineering lengths, roughly 0.01-0.3 m, and should remain
    consistent with related dimensions such as [thickness_of_breeder_blanket_module](name:thickness_of_breeder_blanket_module),
    [thickness_of_breeder_blanket_layer](name:thickness_of_breeder_blanket_layer),
    and radial_distance_at_midplane.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_breeder_blanket_module
  - name:thickness_of_breeder_blanket_layer
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: lower
    operator_kind: qualifier
- name: thickness_of_cryostat
  kind: scalar
  status: draft
  description: Physical wall thickness of the cryostat structural vessel, measured
    as the through-wall distance between its inner and outer faces along the local
    wall normal. For an annular layer this is perpendicular to the vessel centerline;
    for a block element it is evaluated along the wall-normal line through the element
    midplane.
  documentation: 'Thickness of the cryostat is the local through-wall extent of the
    load-bearing cryostat vessel material between its inner and outer faces. It is
    a structural geometry parameter for the cryostat wall and is distinct from the
    effective thermal shielding thickness represented by [thermal_thickness_of_cryostat](name:thickness_of_cryostat).


    The general wall-normal definition is the absolute projection of the separation
    between corresponding inner and outer surface points onto the local unit normal:


    $$

    t_c = \left|\left(\mathbf{x}_\mathrm{out} - \mathbf{x}_\mathrm{in}\right) \cdot
    \hat{\mathbf{n}}\right|

    $$


    where $t_c$ is the cryostat thickness, $\mathbf{x}_\mathrm{in}$ and $\mathbf{x}_\mathrm{out}$
    are the inner- and outer-face position vectors in meters, and $\hat{\mathbf{n}}$
    is the local unit normal to the wall. For an annular layer this reduces to the
    radial span $R_\mathrm{out}-R_\mathrm{in}$, with $R_\mathrm{in}$ and $R_\mathrm{out}$
    in meters in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius and $Z$ is vertical height. For a block element the same through-wall distance
    is taken along the wall-normal line passing through the element midplane. The
    absolute value expresses that thickness is non-negative.


    The thickness is obtained from engineering geometry, design drawings, or surveyed
    vessel dimensions and is used in structural stiffness, vacuum-load, thermal-mass,
    and electromagnetic response estimates. The related [thickness_of_vacuum_vessel](name:thickness_of_vacuum_vessel)
    applies the same wall-normal concept to the vacuum vessel, while [resistivity_of_cryostat](name:resistivity_of_cryostat)
    is a material property used with the cryostat geometry in electromagnetic calculations.


    Representative cryostat wall or layer thicknesses are typically about 0.02-0.2
    m for shell panels and local annular layers, with reinforced regions, flanges,
    or block-like structural elements sometimes reaching about 0.5 m. Actual values
    depend on vessel size, pressure loading, support layout, penetrations, and reinforcement
    strategy.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_vacuum_vessel
  - name:resistivity_of_cryostat
- name: thickness_of_plasma_facing_component
  kind: scalar
  status: draft
  description: Physical depth of a plasma-facing component from its plasma-exposed
    front surface to its rear structural interface, measured along the local outward-to-inward
    surface normal. For nonuniform or curved components, the value is local or nominal
    at the specified evaluation station and is not a minimum, maximum, or average
    unless explicitly identified as such.
  documentation: 'Thickness of a plasma-facing component is the geometric depth of
    the material stack between the plasma-exposed front surface and the rear structural
    interface. It is evaluated along the local surface normal of the exposed surface,
    using the same local surface point framing as surface quantities such as [surface_temperature](name:surface_temperature)
    and incident heat-flux quantities.


    For a local evaluation point $\mathbf{x}_f$ on the plasma-exposed surface, the
    thickness $t$ is the normal projection of the displacement to the corresponding
    rear interface point $\mathbf{x}_r$:


    $$

    t = \left| (\mathbf{x}_r - \mathbf{x}_f) \cdot \hat{\mathbf{n}} \right|

    $$


    where $\hat{\mathbf{n}}$ is the unit normal used to trace from the exposed front
    face toward the rear interface, and $\mathbf{x}_f$ and $\mathbf{x}_r$ are position
    vectors in meters. The absolute value gives the physical depth; the quantity itself
    is non-negative.


    For curved or nonuniform components, a single reported thickness requires an evaluation
    convention. It may be a local value at a specified point, a nominal value at a
    reference station such as the midplane, or a deliberately labeled derived value
    such as a minimum, maximum, or area-weighted average. Without such a qualifier,
    the quantity should be interpreted as the local or nominal normal depth for the
    specified component, not as a global extremum or average over the full plasma-facing
    surface.


    Thickness is usually determined from engineering geometry, metrology, or inspection
    of the component and can be updated after erosion, deposition, machining, or replacement.
    It is used with local heat-flux and surface-temperature quantities, such as maximum_incident_heat_flux_of_plasma_facing_component,
    to assess thermal response, remaining material margin, and structural support.


    Typical values are highly design-dependent. Thin coatings or sacrificial layers
    may be about 0.0001-0.005 m, replaceable armor tiles or limiter elements commonly
    fall in the 0.005-0.1 m range, and complete load-bearing plasma-facing modules
    can be thicker when the rear structural interface is included.'
  unit: m
  physics_domain: structural_components
  links:
  - name:surface_temperature
  sources:
  - id: dd:wall/description_2d/limiter/unit/midplane_thickness
    dd_path: wall/description_2d/limiter/unit/midplane_thickness
    status: composed
- name: thickness_of_vacuum_vessel
  kind: scalar
  status: draft
  description: 'Physical wall thickness of the vacuum vessel: the local through-wall
    distance between its inner and outer faces, measured along the normal to the vessel
    centerline or mid-surface.'
  documentation: 'Vacuum-vessel thickness is the local material thickness of the vessel
    pressure boundary, defined as the distance separating the inner and outer faces
    of the wall. It is a geometric through-wall distance, not the radial or vertical
    extent of the component unless the local wall normal happens to align with that
    direction.


    The local thickness at centerline label $s$ can be written as the distance between
    paired face points on the normal line:


    $$

    t_\mathrm{vv}(s) = \left\lVert \mathbf{x}_\mathrm{out}(s) - \mathbf{x}_\mathrm{in}(s)
    \right\rVert

    $$


    where $\mathbf{x}_\mathrm{in}$ and $\mathbf{x}_\mathrm{out}$ are corresponding
    points on the inner and outer vessel faces, and the line joining them is perpendicular
    to the local vessel centerline or mid-surface. For a midplane segment whose normal
    is radial in the right-handed cylindrical $(R, \phi, Z)$ frame, this reduces to
    $t_\mathrm{vv}=R_\mathrm{out}-R_\mathrm{in}$, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    In practice, the thickness is obtained from engineering drawings, CAD geometry,
    metrology, or simplified vessel cross-section models. It normally represents the
    structural vessel wall or annular layer and excludes separate first-wall armor,
    blanket modules, insulation, vacuum gaps, and coatings unless those components
    are explicitly treated as part of the vessel wall definition.


    Typical values are 0.02-0.10 m for many large tokamak stainless-steel vacuum vessels.
    Thin liners or small experimental vessels may be 0.005-0.02 m, while locally reinforced
    regions, port collars, or double-wall structures can exceed 0.10 m.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_cryostat
  - name:resistivity_of_vacuum_vessel
- name: toroidal_current_of_cryostat
  kind: scalar
  status: draft
  description: "Toroidal current in a conducting cryostat element is the net current\
    \ component along the toroidal direction in the right-handed cylindrical (R, \u03C6\
    , Z) frame. It represents eddy or halo current induced by time-varying magnetic\
    \ flux during plasma operation or transients."
  documentation: 'Toroidal current of a cryostat is the lumped net electric current
    carried by a conducting cryostat component in the toroidal direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It represents the toroidal component of an
    induced current distribution driven mainly by changing magnetic flux linked with
    the conducting path; direct halo-current collection can also contribute during
    plasma contact events.


    A single coupled element is commonly modeled by a lumped induction balance:


    $$

    R_i I_{\phi,i} + L_i \frac{d I_{\phi,i}}{dt} = -\frac{d}{dt}\left(\Phi_{\mathrm{ext},i}
    + \sum_k M_{ik} I_k\right)

    $$


    where $I_{\phi,i}$ is the toroidal current in amperes, $R_i$ is the element resistance
    in ohms, $L_i$ is the self-inductance in henries, $\Phi_{\mathrm{ext},i}$ is externally
    applied linked magnetic flux in webers, $M_{ik}$ is mutual inductance in henries
    to source current $I_k$ in amperes, and each term has units of volts. The minus
    sign expresses Lenz''s law: the induced current acts to oppose the change in linked
    flux.


    These currents are usually computed rather than measured directly. They are obtained
    from electromagnetic induction calculations using conducting-structure finite-element
    models or coupled filament/circuit networks constrained by coil, plasma-current,
    magnetic-probe, flux-loop, and voltage information. The same lumped-current physics
    underlies [current_of_passive_loop](name:current_of_passive_loop), and the resulting
    current is used to estimate Joule heating and electromagnetic loads from interaction
    with the local magnetic field.


    In steady phases with slowly varying flux, the value can be close to 0 A. During
    current ramping, vertical-displacement events, or disruptions, local cryostat-element
    currents commonly span $10^2$-$10^5$ A; large low-resistance structures can reach
    $10^5$-$10^6$ A for short times. Values depend strongly on resistance, inductive
    coupling, pulse time scale, and electrical continuity of the structure.


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame (counter-clockwise
    when viewed from the $+\hat{Z}$ side).'
  unit: A
  physics_domain: structural_components
  links:
  - name:resistance_of_cryostat
  - name:current_of_passive_loop
- name: tritium_breeding_ratio
  kind: scalar
  status: draft
  description: Global tritium breeding ratio is the total number of tritium atoms
    produced in the breeding blanket per incident fusion neutron used for blanket
    normalization. It is a dimensionless figure of merit for tritium self-sufficiency
    in a deuterium-tritium fusion reactor.
  documentation: 'Tritium breeding ratio is the global yield of tritium from all breeding
    regions of a blanket, normalized to the common incident fusion-neutron count used
    for the blanket neutronics calculation. It quantifies how effectively neutron
    multiplication, moderation, and lithium breeding reactions convert fusion neutrons
    into replacement tritium fuel.


    The global ratio is defined as


    $$

    \mathrm{TBR} = \frac{N_T}{N_{n,\mathrm{inc}}}

    $$


    where $N_T$ is the total number of tritium atoms produced in the breeding blanket
    over the normalization interval, and $N_{n,\mathrm{inc}}$ is the number of incident
    fusion neutrons used as the shared denominator for blanket normalization. The
    denominator is not the number of neutrons absorbed in the blanket; using the same
    incident-neutron denominator for all blanket regions makes module contributions
    additive, so the global value is the sum of compatible module ratios such as [tritium_breeding_ratio_of_breeder_blanket_module](name:tritium_breeding_ratio_of_breeder_blanket_module).


    Tritium is mainly produced by neutron reactions with lithium, especially $^6\mathrm{Li}(n,\alpha)T$
    and $^7\mathrm{Li}(n,n''\alpha)T$, with the balance affected by neutron multipliers,
    structural absorption, coolant absorption, leakage, and geometric coverage. The
    quantity is normally evaluated with neutron-transport and activation calculations
    using the fusion-neutron source spectrum and the detailed blanket material composition
    and geometry; experimental validation uses nuclear measurements and integral mock-up
    tests rather than direct full-power tritium inventory closure.


    Typical reactor design targets are about 1.05-1.20 to allow margin for radioactive
    decay, processing losses, extraction efficiency, unavailable breeding volume,
    nuclear-data uncertainty, and operational reserve. Values below 1 indicate that
    the blanket does not replace all tritium consumed by deuterium-tritium fusion
    under the same neutron normalization.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio_of_breeder_blanket_module
- name: tritium_breeding_ratio_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: 'Per-module contribution to blanket tritium breeding ratio: tritium
    atoms produced in a breeder blanket module divided by the common incident fusion-neutron
    count used for the blanket normalization. It is dimensionless and additive across
    modules when all modules use that same denominator.'
  documentation: 'The tritium breeding ratio of a breeder blanket module is the module-resolved
    contribution to blanket tritium production. It counts tritium atoms generated
    in one module per incident fusion neutron used for the overall blanket normalization,
    so it is not normalized separately to the neutrons entering only that module.


    The module contribution can be written using particle rates over a common time
    basis:


    $$

    \mathrm{TBR}_m = \frac{\dot{N}_{T,m}}{\dot{N}_{n,\mathrm{inc}}}

    $$


    where $\dot{N}_{T,m}$ is the tritium-atom production rate in module $m$, in s^-1,
    and $\dot{N}_{n,\mathrm{inc}}$ is the common incident fusion-neutron rate used
    to normalize the blanket tritium breeding ratio, in s^-1. Equivalent particle
    counts over the same time interval may be used instead; the numerator and denominator
    are then both counts, and the ratio has unit 1.


    In practice, $\dot{N}_{T,m}$ is obtained from neutronics transport and nuclear-response
    calculations by integrating tritium-producing reaction-rate densities over the
    breeder regions of the module. The same denominator must be used for every module,
    so summing module values gives the corresponding contribution to the overall [tritium_breeding_ratio](name:tritium_breeding_ratio).
    The value is commonly interpreted together with module nuclear-load quantities
    such as [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    because neutron power indicates source strength while material composition and
    neutron spectrum determine how effectively that source breeds tritium.


    Typical additive module values depend strongly on how the blanket is subdivided.
    Small replaceable modules may contribute about 10^-4-10^-2, larger sector-scale
    modules about 0.01-0.5, and the sum over a full breeding blanket is generally
    of order 1 in reactor design studies. Values are dimensionless and vary with module
    solid angle coverage, lithium enrichment, multiplier content, structural fraction,
    coolant, and neutron leakage.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio
  - name:nuclear_heating_power_of_breeder_blanket_module
  arguments:
  - name: tritium_breeding_ratio
    operator: breeder_blanket_module
    operator_kind: locus
- name: upper_thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Upper thickness of a breeder blanket module is the non-negative projected
    separation between the module's upper exterior end boundary and the interface
    where the upper cap joins the main module body, measured along the specified upper-cap
    thickness direction. It characterizes the geometric thickness of the upper end
    cap.
  documentation: 'Upper thickness of a breeder blanket module is the geometric thickness
    of the upper cap that closes the module at its upper end. The reference surfaces
    are the upper exterior end boundary of the cap and the cap-to-module interface
    where the cap joins the main blanket body; the thickness is measured as a projected
    separation along the specified upper-cap thickness direction, not as an arbitrary
    point-to-point distance between inner and outer surfaces.


    For a local cap-thickness direction $\hat{\mathbf{n}}_\mathrm{u}$, the projected
    thickness is


    $$

    t_\mathrm{u} = \left|\left(\mathbf{x}_\mathrm{end} - \mathbf{x}_\mathrm{int}\right)
    \cdot \hat{\mathbf{n}}_\mathrm{u}\right|

    $$


    where $t_\mathrm{u}$ is the upper cap thickness, $\mathbf{x}_\mathrm{end}$ is
    a point on the upper exterior end boundary, $\mathbf{x}_\mathrm{int}$ is the corresponding
    point on the cap-to-module interface, and $\hat{\mathbf{n}}_\mathrm{u}$ is the
    unit direction used to define the upper-cap thickness. The absolute value reflects
    that this scalar is a non-negative length.


    In engineering definitions the value is taken from the module geometry or design
    specification. For a tapered or spatially varying upper cap, the scalar denotes
    the specified nominal projected thickness, commonly the representative average
    over the cap region or the value at the design reference section; local maxima,
    minima, and detailed shape variations are separate geometric information.


    This quantity is related to the overall [breeder blanket module thickness](name:thickness_of_breeder_blanket_module),
    to the analogous [lower cap thickness](name:lower_thickness_of_breeder_blanket_module),
    and to individual [breeder blanket layer thicknesses](name:thickness_of_breeder_blanket_layer).
    It is reported in meters and is design-specific; no universal device-independent
    numerical range is implied.'
  unit: m
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio_of_breeder_blanket_module
  - name:thickness_of_breeder_blanket_module
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: upper
    operator_kind: qualifier
- name: vertical_outline_of_limiter_tile
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the contour points tracing the poloidal
    cross-sectional outline of a limiter tile.
  documentation: 'The vertical outline of a limiter tile provides the ordered set
    of $Z$ coordinates that, paired with the corresponding radial coordinates, trace
    the poloidal cross-sectional boundary of an individual limiter tile. Limiter tiles
    are plasma-facing solid components that can establish the last-closed flux surface
    in limited plasma configurations, physically protecting the first wall from direct
    high-heat-flux plasma contact.


    The outline is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is the major radius measured from the machine symmetry axis and $Z$ is the
    vertical height relative to the device midplane. Each point in the outline array
    corresponds to a vertex on the tile boundary contour in the poloidal plane, and
    the complete set of $(R, Z)$ pairs fully specifies the tile cross-section geometry.


    These coordinates are obtained from engineering drawings, CAD models, or in-vessel
    metrology, and are applied in heat load mapping, plasma-wall gap analysis, and
    geometric boundary modeling. The analogous outline coordinates for divertor components
    follow the same convention as [vertical_outline_of_divertor_tile](name:vertical_outline_of_divertor_tile),
    and the equivalent representation for mobile wall components is [vertical_outline_of_wall_material](name:vertical_outline_of_wall_material).
    The active contact point of a limited plasma with the limiter surface is tracked
    separately by [vertical_coordinate_of_active_limiter_point](name:vertical_coordinate_of_active_limiter_point).


    Typical $Z$ values for limiter tiles range from approximately $-3$ m to $+3$ m
    depending on the tile''s poloidal location and the machine size.


    Sign convention: Positive when $Z$ points upward in the $+\hat{Z}$ direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_divertor_tile
  - name:vertical_outline_of_wall_material
  - name:vertical_coordinate_of_active_limiter_point
- name: vertical_outline_of_vacuum_vessel
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of a vacuum-vessel element outline point in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical outline of a vacuum vessel is the $Z$ coordinate of
    a point on the geometric boundary of a vacuum-vessel element in a poloidal cross-section.
    Coordinates are expressed in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.


    For an element represented by an ordered boundary with $N$ vertices, the poloidal
    outline is the indexed sequence


    $$

    \Gamma = \bigl((R_1,Z_1),(R_2,Z_2),\ldots,(R_N,Z_N)\bigr)

    $$


    where $Z_i$ is the vertical outline coordinate named here, $R_i$ is the corresponding
    radial outline coordinate, and both $R_i$ and $Z_i$ are measured in meters. Successive
    vertices define neighboring boundary points; for a closed polygonal outline, vertex
    $N$ connects back to vertex $1$, and repeating the first vertex as the final point
    is geometrically redundant.


    The outline is usually determined from mechanical design geometry, as-built metrology,
    or an engineering approximation to the vessel boundary. Together with the corresponding
    radial coordinate, $Z_i$ defines the material boundary used for geometric clearance,
    wall-intersection, and plasma-facing structure calculations.


    No universal numerical range is implied: admissible values are bounded by the
    vertical extent of the specific vessel geometry. The coordinate may be negative,
    zero, or positive depending on the point position relative to the origin in the
    right-handed cylindrical $(R,\phi,Z)$ frame.


    Sign convention: Positive when the outline point lies above the origin in the
    $+\hat{Z}$ direction of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_divertor_tile
  - name:vertical_coordinate_of_geometric_axis
- name: vertical_outline_of_wall_material
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the outline polygon that defines the poloidal
    cross-sectional boundary of a mobile wall material component.
  documentation: "The vertical $Z$-coordinate locates each vertex of the polygon that\
    \ traces the cross-sectional shape of a mobile wall material element in the poloidal\
    \ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the\
    \ major radius measured from the symmetry axis and $Z$ is the vertical height.\
    \ The complete poloidal outline is formed by a sequence of $(R, Z)$ vertex pairs;\
    \ this quantity captures the $Z$ component of those vertices, complementing the\
    \ corresponding major-radius component of the same outline. Mobile wall components\
    \ are plasma-facing structural elements \u2014 such as retractable limiters or\
    \ adjustable tiles \u2014 whose positions may vary, making accurate outline tracking\
    \ essential for equilibrium reconstruction and plasma-wall gap analysis. For fixed\
    \ structural elements, analogous $Z$ outline coordinates are provided by [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile),\
    \ [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel),\
    \ and [vertical_outline_of_divertor_tile](name:vertical_outline_of_divertor_tile).\
    \ Typical values span the vertical extent of the vacuum vessel, generally within\
    \ $\\pm 3$ m for medium-sized tokamaks.\n\nSign convention: Positive when the\
    \ outline vertex lies above the geometric midplane in the $+Z$ direction of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:vertical_outline_of_divertor_tile
- name: volume_of_first_wall
  kind: scalar
  status: draft
  description: Total volume enclosed by the first wall contour, equal to the interior
    of the vacuum vessel bounded by its innermost plasma-facing surface.
  documentation: 'The volume of the first wall is the total interior volume of the
    vacuum vessel bounded by the innermost plasma-facing surface. It defines the geometric
    space available to the confined plasma, the scrape-off layer, and the neutral
    gas inventory, and serves as the primary reference quantity for global particle
    balance and fueling calculations.


    For an axisymmetric device, $V_{\rm FW}$ is obtained by integrating over the interior
    cross-section in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    V_{\rm FW} = 2\pi \iint_{A} R \, dR \, dZ

    $$


    where $A$ is the poloidal cross-sectional area enclosed by the first wall contour,
    $R$ is the major radius in meters, and $Z$ is the vertical height in meters. Non-axisymmetric
    features such as ports and recesses require full three-dimensional surface integration
    to be correctly included.


    The enclosed volume is derived from the engineering geometry of the first wall,
    obtained from design drawings and vessel surveys conducted during device commissioning.


    This quantity is always larger than the [volume enclosed by the plasma boundary](name:volume_of_flux_surface),
    which is limited to the last closed flux surface; the excess volume is occupied
    by the edge region and scrape-off layer. The complementary surface measure of
    the same structure is the [area of the first wall](name:area_of_first_wall).


    Sign convention: Positive when the integration domain is the interior region bounded
    by the first wall surface, with the surface normal directed outward from the enclosed
    volume.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:volume_of_flux_surface
  - name:area_of_first_wall
- name: volumetric_force
  kind: vector
  status: draft
  description: "Net force per unit volume acting at each point of a current-carrying\
    \ conductor or plasma element, resolved as a vector in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: "Volumetric force is the local force density vector, expressing the\
    \ net mechanical load per unit volume at each point in a material or plasma region.\
    \ In electromagnetic contexts \u2014 the primary application in tokamak structural\
    \ engineering \u2014 it is the Lorentz body-force density exerted on a current-carrying\
    \ element by the surrounding magnetic field.\n\nThe defining relation is:\n\n\
    $$\n\\mathbf{f} = \\mathbf{J} \\times \\mathbf{B}\n$$\n\nwhere $\\mathbf{J}$ is\
    \ the current density and $\\mathbf{B}$ is the magnetic flux density. The vector\
    \ is decomposed into cylindrical components [radial_volumetric_force](name:radial_volumetric_force),\
    \ [toroidal_volumetric_force](name:toroidal_volumetric_force), and [vertical_volumetric_force](name:vertical_volumetric_force)\
    \ in the right-handed $(R, \\phi, Z)$ frame. Integrating over the volume of a\
    \ structural element recovers the total force acting on that element.\n\nThis\
    \ quantity is used in magnetomechanical and structural integrity analyzes of plasma-facing\
    \ components, breeding blanket modules, and coil structures, particularly during\
    \ disruption events when rapidly changing currents induce large transient body\
    \ forces on conducting structures.\n\nSign convention: Positive when the force\
    \ component points in the $+\\hat{R}$ direction (outward from the symmetry axis),\
    \ in the $+\\hat{\\phi}$ direction (direction of increasing toroidal angle), or\
    \ in the $+\\hat{Z}$ direction (upward) in the right-handed cylindrical $(R, \\\
    phi, Z)$ frame."
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:radial_volumetric_force
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
- name: radial_volumetric_force
  kind: scalar
  status: draft
  description: "Radial component of the electromagnetic body-force density vector,\
    \ projected onto the direction of increasing major radius R in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The radial volumetric force is the $\hat{R}$-projection of the local
    electromagnetic body-force density $\mathbf{f} = \mathbf{J} \times \mathbf{B}$
    acting on plasma volumes or conducting wall and structural elements. It characterizes
    the net radial push or pull arising from the interaction of local current density
    with the magnetic field, driving stress and displacement in the major-radial direction.


    The defining relation is the radial projection of the Lorentz force density in
    the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$:


    $$

    f_R = (\mathbf{J} \times \mathbf{B}) \cdot \hat{R} = J_\phi B_Z - J_Z B_\phi

    $$


    where $\mathbf{J}$ is the current density vector, $\mathbf{B}$ is the magnetic
    field, and $J_\phi$, $J_Z$, $B_\phi$, $B_Z$ are the toroidal and vertical components
    respectively.


    This component is computed in magnetohydrodynamic equilibrium analyzes and disruption-load
    assessments to quantify radial electromagnetic stresses on plasma-facing components,
    wall tiles, and blanket structures. Together with [toroidal_volumetric_force](name:toroidal_volumetric_force)
    and [vertical_volumetric_force](name:vertical_volumetric_force), it resolves the
    complete local electromagnetic body-force density vector described by [volumetric_force](name:volumetric_force).


    Sign convention: Positive when the electromagnetic force points in the direction
    of increasing major radius $R$.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
  - name:volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: toroidal_volumetric_force
  kind: scalar
  status: draft
  description: "Toroidal component of the local electromagnetic force per unit volume\
    \ acting on plasma or material, projected onto the direction of increasing toroidal\
    \ angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal volumetric force is the signed component of force per unit
    volume projected onto the $\hat{\phi}$ direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It represents the local body-force density that tends
    to accelerate plasma or load material in the toroidal direction.


    For electromagnetic loading, the toroidal component is the projection of the Lorentz
    force density onto $\hat{\phi}$:


    $$

    f_\phi = \mathbf{f}\cdot\hat{\phi} = (\mathbf{J}\times\mathbf{B})\cdot\hat{\phi}
    = J_Z B_R - J_R B_Z

    $$


    where $f_\phi$ is the toroidal volumetric force in $N\,m^{-3}$, $\mathbf{f}$ is
    the force density in $N\,m^{-3}$, $\mathbf{J}$ is current density in $A\,m^{-2}$,
    and $\mathbf{B}$ is magnetic field in $T$. The component labels $R$ and $Z$ denote
    projections onto the radial and vertical basis directions of the same right-handed
    cylindrical $(R, \phi, Z)$ frame.


    This quantity is usually computed from reconstructed or simulated current-density
    and magnetic-field distributions, and may be integrated over a plasma or material
    volume to obtain a net toroidal load. Direct measurement is uncommon; practical
    estimates generally combine magnetic diagnostics, current models, and electromagnetic
    or magnetohydrodynamic force calculations.


    Typical magnitudes are near zero in quiescent regions, about $10^3$-$10^7\ N\,m^{-3}$
    in conducting structures during electromagnetic transients, and can reach $10^8\
    N\,m^{-3}$ or higher in localized disruption, halo-current, or fast current-quench
    conditions.


    Sign convention: Positive when the force density is projected in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:radial_volumetric_force
  - name:vertical_volumetric_force
  - name:volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: vertical_volumetric_force
  kind: scalar
  status: draft
  description: "Vertical (Z) component of the electromagnetic body-force density vector,\
    \ giving the net upward or downward force per unit volume on current-carrying\
    \ material in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical volumetric force is the $Z$-component of the local\
    \ electromagnetic body-force density vector, expressing the net mechanical load\
    \ per unit volume directed along the vertical axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. It is the vertical projection of the full [volumetric_force](name:volumetric_force)\
    \ vector, completing the cylindrical triad alongside the [radial_volumetric_force](name:radial_volumetric_force)\
    \ and [toroidal_volumetric_force](name:toroidal_volumetric_force) components.\n\
    \nIn electromagnetic contexts \u2014 the dominant application in tokamak structural\
    \ engineering \u2014 the vertical component is the $Z$-projection of the Lorentz\
    \ body force:\n\n$$\nf_Z = (\\mathbf{J} \\times \\mathbf{B}) \\cdot \\hat{Z}\n\
    $$\n\nwhere $\\mathbf{J}$ is the local current density, $\\mathbf{B}$ is the magnetic\
    \ field, and $\\hat{Z}$ is the unit vector pointing in the $+Z$ direction. Integrating\
    \ $f_Z$ over a conductor or blanket volume yields the total vertical force on\
    \ that component, analogous to the globally integrated vertical_force.\n\nThe\
    \ vertical force density is evaluated from electromagnetic field solutions by\
    \ computing the local cross product of the current density and magnetic field\
    \ distributions across the material domain. In tokamak structural components subject\
    \ to disruption-induced halo currents, electromagnetic force densities can reach\
    \ $10^6$\u2013$10^8$ N m$^{-3}$ near highly loaded conductor regions.\n\nSign\
    \ convention: Positive when the force points in the $+Z$ direction (vertically\
    \ upward in the right-handed cylindrical $(R, \\phi, Z)$ frame)."
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:volumetric_force
  - name:radial_volumetric_force
  - name:toroidal_volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: volumetric_fraction_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Dimensionless ratio of a constituent material's volume to the total
    bulk volume of a breeder blanket layer. It specifies the homogenized layer composition
    used for effective material properties, neutron transport, tritium breeding, and
    thermal-hydraulic calculations.
  documentation: 'Volumetric fraction of a breeder blanket layer is the dimensionless
    share of the layer''s bulk volume occupied by one constituent material or phase.
    It is a homogenized composition descriptor for composite blanket layers containing
    breeder material, neutron multiplier, structural alloy, coolant, purge gas, gaps,
    or other constituents.


    The defining relation for constituent $i$ is:


    $$

    f_i = \frac{V_i}{V_\mathrm{layer}}

    $$


    where $f_i$ is the volumetric fraction, $V_i$ is the constituent volume in m^3,
    and $V_\mathrm{layer}$ is the total bulk layer volume in m^3 over the homogenization
    region. For an exhaustive, non-overlapping partition of the layer, $0 \le f_i
    \le 1$ and $\sum_i f_i = 1$; if voids, coolant, or gas regions are represented
    separately, they are included as their own fractions.


    Values are computed from engineering geometry, unit-cell packing models, CAD volumes,
    or bill-of-materials information, and may be checked indirectly against measured
    mass, density, thermal response, or nuclear performance. This quantity is the
    blanket-layer analog of [ratio of volume to volume of passive structure] and is
    distinct from packing factor or porosity: packing factor usually combines selected
    solid occupied fractions, while porosity is the void or fluid-accessible fraction.


    Typical individual fractions are 0.3-0.7 for packed ceramic breeder or neutron-multiplier
    material, 0.05-0.3 for structural alloy, and 0.05-0.3 for coolant, purge-gas,
    or void regions. Fully dense homogeneous sublayers can have a dominant constituent
    fraction close to 1, while coatings, liners, or minor interlayers may have fractions
    of 0.001-0.05.'
  unit: '1'
  physics_domain: structural_components
  links: []
- name: y_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Y coordinate of the geometric centroid of a ferritic element in the
    right-handed Cartesian (x, y, z) frame, where z coincides with the vertical axis
    Z.
  documentation: "Ferritic elements are passive structural components \u2014 typically\
    \ magnetizable steel inserts \u2014 placed in tokamaks to reduce toroidal field\
    \ ripple arising from the discrete set of toroidal field coils. The geometric\
    \ centroid of such an element is its volume-averaged position, and this quantity\
    \ gives the centroid's coordinate along the $y$-axis of the right-handed Cartesian\
    \ $(x, y, z)$ frame, where $z = Z$ is the vertical axis and $x = R\\cos\\phi$,\
    \ $y = R\\sin\\phi$ relate to the cylindrical $(R, \\phi, Z)$ coordinates ($R$\
    \ = major radius, $\\phi$ = toroidal angle).\n\nThe centroid $y$ coordinate is\
    \ defined as\n\n$$\n\\bar{y} = \\frac{1}{V} \\int_V y \\, dV\n$$\n\nwhere $V$\
    \ is the total volume of the ferritic element and $y$ is the Cartesian coordinate\
    \ of each volume element.\n\nThis coordinate is determined from engineering drawings\
    \ or three-dimensional geometric models of the device. Together with [x_coordinate_of_ferritic_element_centroid](name:x_coordinate_of_ferritic_element_centroid)\
    \ and [vertical_coordinate_of_ferritic_element](name:vertical_coordinate_of_ferritic_element_centroid),\
    \ it fully specifies the three-dimensional centroid location in Cartesian space.\n\
    \nSign convention: Positive when the centroid lies in the half-space $y > 0$,\
    \ corresponding to toroidal angles $\\phi \\in (0, \\pi)$ in the cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: m
  physics_domain: structural_components
  links:
  - name:x_coordinate_of_ferritic_element_centroid
  - name:vertical_coordinate_of_ferritic_element_centroid
  sources:
  - id: dd:ferritic/object/centroid/y
    dd_path: ferritic/object/centroid/y
    status: composed
