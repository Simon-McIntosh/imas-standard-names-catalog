- name: magnetic_flux_of_flux_loop
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at a flux loop sensor location, calculated from
    the reconstructed equilibrium.
  documentation: "The reconstructed poloidal magnetic flux at a flux loop sensor is\
    \ the value of $\\psi$ computed from the Grad\u2013Shafranov equilibrium solution\
    \ at the $(R, Z, \\phi)$ coordinates of the loop. It is used as a target in the\
    \ least-squares cost functional of the equilibrium reconstruction, where it is\
    \ compared with the measured flux loop signal to constrain the plasma current\
    \ profile and boundary shape. The quantity is closely related to the [poloidal_magnetic_flux_of_flux_loop](name:poloidal_magnetic_flux_of_flux_loop)\
    \ (the measured counterpart) and to other magnetic diagnostics such as [poloidal_field_coil_current](name:poloidal_field_coil_current)\
    \ that enter the same reconstruction. Typical values for the poloidal flux range\
    \ from 0\u201310 Wb on axis to 0\u20135 Wb at the boundary, depending on the plasma\
    \ current and the major radius of the machine.\n\nSign convention: Positive when\
    \ the poloidal flux $\n \n \n \n \n $\n\n (i.e., the loop voltage integral) increases\
    \ in the direction of the toroidal current $I_p$."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_of_flux_loop
  - name:poloidal_field_coil_current
  sources:
  - id: dd:equilibrium/time_slice/constraints/flux_loop/reconstructed
    dd_path: equilibrium/time_slice/constraints/flux_loop/reconstructed
    status: composed
- name: magnetic_shear_at_magnetic_axis
  kind: scalar
  status: draft
  description: Normalized radial derivative of the safety factor evaluated at the
    magnetic axis, a key MHD stability parameter in the plasma core.
  documentation: 'The magnetic shear at the magnetic axis is defined as $s(\rho_{\rm
    tor}=0) = (\rho_{\rm tor}/q)\,dq/d\rho_{\rm tor}$ evaluated in the limit of vanishing
    toroidal flux radius $\rho_{\rm tor}$. In this expression $q$ is the safety factor
    and $\rho_{\rm tor}$ is the normalized toroidal flux coordinate. The magnetic
    axis value sets the innermost boundary condition for the interior shear profile
    and controls the stability of ideal and resistive MHD modes including sawtooth
    oscillations. In typical H-mode tokamak plasmas $s_0$ is near zero or slightly
    positive, whereas negative central shear (reversed shear) can suppress sawtooth
    activity and improve confinement. This quantity is obtained from equilibrium reconstruction
    codes such as EFIT or LIUQE and is closely related to [magnetic_shear_at_separatrix](name:magnetic_shear_at_separatrix)
    at the plasma boundary.


    Sign convention: Positive when $q$ increases with increasing minor radius.


    The radial derivative of the safety factor governs the field-line winding rate
    and determines the strength of magnetic flux surface compression in the core region.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_at_separatrix
  sources:
  - id: dd:summary/local/magnetic_axis/magnetic_shear/value
    dd_path: summary/local/magnetic_axis/magnetic_shear/value
    status: composed
- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the point on the plasma-facing first wall
    that is closest to the plasma separatrix.
  documentation: 'The major radius $R_{\mathrm{cw}}$ of the closest wall point quantifies
    the radial proximity of the plasma boundary to the first-wall surface within a
    given poloidal cross-section. This quantity is used in equilibrium reconstruction
    to define the wall-limiting surface and in disruption modeling to assess halo-current
    contact locations. Typical values range from 1.5 to 2.5 m in medium-size tokamaks
    and up to 6.2 m for ITER. The closest-wall point is identified by minimizing the
    Euclidean distance between the separatrix and all first-wall outline points in
    the $R$--$Z$ plane.


    Sign convention: Positive when the coordinate is measured in the direction of
    increasing major radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    See also [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point)
    for the corresponding $Z$ coordinate and [major_radius_of_x_point](name:major_radius_of_x_point)
    for another key boundary radius.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_closest_wall_point
  - name:major_radius_of_x_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/closest_wall_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/closest_wall_point/r
    status: composed
- name: major_radius_of_current_center
  kind: scalar
  status: draft
  description: Major radius coordinate of the plasma current centroid, defined as
    the flux-surface average of the toroidal current density weighted by major radius.
  documentation: "The current center major radius $R_{\\mathrm{cc}}$ is the $R$ coordinate\
    \ of the centroid of the toroidal plasma current density distribution. It is computed\
    \ as $R_{\\mathrm{cc}} = \\frac{\\iint j_\\phi R \\, dS}{\\iint j_\\phi \\, dS}$,\
    \ where $j_\\phi$ is the toroidal current density (A/m\xB2) and $dS$ is a poloidal\
    \ cross-section area element. This quantity locates the effective radial position\
    \ of the net toroidal current $I_p$ and is used in equilibrium reconstruction\
    \ to constrain the current profile. Typical values in a medium-size tokamak range\
    \ from the magnetic axis major radius (\u22481.6\u20133.0 m) out to the separatrix;\
    \ in diverted plasmas it lies inside the geometric center. It is inferred from\
    \ magnetic measurements via equilibrium codes such as EFIT or LIUQE. See also\
    \ $[\\text{major radius of X-point}](name:major_radius_of_x_point)$ for the separatrix\
    \ geometry and $[\\text{poloidal magnetic flux}](name:poloidal_magnetic_flux)$\
    \ for the flux coordinate system.\n\nSign convention: Positive when $R_{\\mathrm{cc}}$\
    \ lies in the direction of increasing major radius $R$ in the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_x_point
  - name:poloidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/r
    dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    status: composed
- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the plasma geometric axis, computed
    as the arithmetic mean of the maximum and minimum R coordinates of the plasma
    boundary.
  documentation: "The major radius of the geometric axis, $R_{\\text{geo}} = (R_{\\\
    text{max}} + R_{\\text{min}})/2$, locates the horizontal center of the plasma\
    \ boundary contour in the tokamak poloidal plane. This quantity serves as a primary\
    \ descriptor of plasma position within the vacuum vessel and is routinely extracted\
    \ from equilibrium reconstruction (e.g., EFIT, LIUQE) or directly from the plasma\
    \ boundary contour. Typical $R_{\\text{geo}}$ values are 1.6\u20133.0 m for medium-size\
    \ tokamaks and 6.2 m for ITER. The geometric axis differs from the magnetic axis\
    \ by the Shafranov shift, which can reach 10\u201330 cm in high-\u03B2 plasmas;\
    \ compare with [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis)\
    \ and [major_radius_of_current_center](name:major_radius_of_current_center).\n\
    \nSign convention: Positive when the coordinate increases in the direction of\
    \ increasing $R$ (outward from the machine symmetry axis) in the cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  - name:major_radius_of_current_center
  sources:
