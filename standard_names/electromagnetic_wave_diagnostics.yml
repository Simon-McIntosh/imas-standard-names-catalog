- name: normalized_toroidal_flux_coordinate_at_magnetic_axis
  kind: scalar
  status: active
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at the magnetic axis; it equals zero at this reference
    surface.
  documentation: 'The normalized toroidal flux coordinate at the magnetic axis is
    the dimensionless radial label assigned to the magnetic-axis reference surface.
    It is the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    evaluated at the origin of the nested-flux-surface labeling, where the coordinate
    is zero and the outer normalization reference is the plasma boundary or last closed
    flux surface.


    The coordinate is defined from the toroidal flux difference between the magnetic-axis
    surface and the boundary:


    $$

    \rho_{\mathrm{tor,norm}}(\mathrm{axis}) = \sqrt{\frac{\Phi_0 - \Phi_0}{\Phi_b
    - \Phi_0}} = 0

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate, $\Phi_0$
    is the toroidal magnetic flux at the magnetic axis, and $\Phi_b$ is the toroidal
    magnetic flux at the plasma boundary or last closed flux surface. This reference
    value is distinct from the coordinate evaluated at a displaced locus, such as
    the [normalized toroidal flux coordinate at the measurement position](name:normalized_toroidal_flux_coordinate_at_measurement_position),
    and from the corresponding [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate).'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  - name:normalized_poloidal_flux_coordinate
  sources:
