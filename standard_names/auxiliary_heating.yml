- name: left_hand_circularly_polarized_electric_field
  kind: scalar
  status: draft
  description: Left-hand circularly polarized electric field is the complex E+ component
    of a radio-frequency electric field perpendicular to the local equilibrium magnetic
    field. With the exp(-i omega t) phasor convention, its real field co-rotates with
    positive-ion gyromotion about the magnetic-field direction.
  documentation: 'The left-hand circularly polarized electric field $E_+$ is the complex
    scalar component of a radio-frequency wave electric field perpendicular to the
    local equilibrium magnetic field $\mathbf{B}_0$. It represents the polarization
    that co-rotates with positive-ion gyromotion about $\mathbf{B}_0$ and is the ion-cyclotron
    left-hand component under the phasor convention stated below.


    Use a local right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}$
    parallel to $\mathbf{B}_0$ and perpendicular axes chosen so that $\hat{x} \times
    \hat{y} = \hat{z}$. For complex amplitudes defined by $\mathbf{E}(t)=\Re\{\tilde{\mathbf{E}}\exp(-i\omega
    t)\}$, the left-hand component is


    $$

    E_+ = \frac{\tilde{E}_x + i\tilde{E}_y}{\sqrt{2}}

    $$


    where $\tilde{E}_x$ and $\tilde{E}_y$ are complex perpendicular electric-field
    amplitudes in V m^-1, $E_+$ is in V m^-1, $i$ is the imaginary unit, and $\omega$
    is the angular frequency. With this convention, a pure real positive $E_+$ rotates
    from $+\hat{x}$ toward $-\hat{y}$ when viewed along $+\hat{z}$ as time increases,
    matching positive-ion cyclotron rotation.


    In practice, $E_+$ is obtained by determining the complex radio-frequency electric
    field, projecting it onto the plane perpendicular to $\mathbf{B}_0$, and applying
    the circular-polarization projection above. Its absolute phase depends on the
    chosen radio-frequency phase reference, while $|E_+|$, relative phase, and the
    real and imaginary parts characterize the physically relevant polarization. The
    complementary component is [right_hand_circularly_polarized_electric_field](name:right_hand_circularly_polarized_electric_field);
    the magnitude, real part, and imaginary part are represented by [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude),
    [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part),
    and [left_hand_circularly_polarized_wave_electric_field_imaginary_part](name:left_hand_circularly_polarized_wave_electric_field_imaginary_part).


    Typical magnitudes in ion-cyclotron-range heating studies are roughly $10^2-10^5$
    V m^-1 in the confined plasma and can be larger close to antennas or material
    boundaries. The complex value has no universal upper bound; values near zero indicate
    weak left-hand polarization or cancelation of the perpendicular field components.


    Sign convention: Positive when the zero-phase instantaneous perpendicular electric
    field of a pure $E_+$ wave points along $+\hat{x}$ and subsequently rotates toward
    $-\hat{y}$ in the local right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame
    with $\hat{z}$ parallel to $\mathbf{B}_0$.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:right_hand_circularly_polarized_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:electric_field
  arguments:
  - name: electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/full_wave/e_field/plus/values
    dd_path: waves/coherent_wave/full_wave/e_field/plus/values
    status: composed
- name: per_toroidal_mode_left_hand_circularly_polarized_electric_field
  kind: scalar
  status: draft
  description: Complex left-hand circularly polarized wave electric-field component
    for a single toroidal Fourier mode, averaged over a flux surface with power-deposition-density
    weighting. Its modulus is the amplitude and its argument is the phase; m^-1.V
    denotes volts per meter.
  documentation: 'This quantity is the complex phasor of the left-hand circularly
    polarized perpendicular electric-field component for one toroidal mode number
    $n_\phi$. It has units $\mathrm{V\,m^{-1}}$ (volts per meter), not a fraction
    or normalized ratio. The modulus is the associated [left-hand circularly polarized
    wave electric field amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude),
    and the argument is the phase of the same complex component.


    For a power-deposition-weighted flux-surface average at radial flux label $\rho$
    in flux coordinates $(\rho,\theta,\phi)$, the defining value may be written as:


    $$

    \left\langle E_{+,n_\phi}\right\rangle_p(\rho)=\frac{\int_{\Sigma(\rho)} E_{+,n_\phi}(\mathbf{x})\,p_{\mathrm{dep},n_\phi}(\mathbf{x})\,d\mu_\rho}{\int_{\Sigma(\rho)}
    p_{\mathrm{dep},n_\phi}(\mathbf{x})\,d\mu_\rho}

    $$


    where $\Sigma(\rho)$ is the flux surface, $p_{\mathrm{dep},n_\phi}$ is the non-negative
    power deposition density for that mode in $\mathrm{W\,m^{-3}}$, and $d\mu_\rho$
    is the positive flux-surface integration measure, with units $\mathrm{m^3}$ per
    unit radial label for a differential-volume average or $\mathrm{m^2}$ for a surface-area
    average. The phasor convention is that the physical field is the real part of
    a complex amplitude multiplying $\exp(i n_\phi\phi-i\omega t)$, where $\phi$ is
    the toroidal angle in the right-handed cylindrical $(R,\phi,Z)$ frame. With $\hat{b}$
    along the equilibrium magnetic field, $\hat{e}_1=\nabla\rho/|\nabla\rho|$ outward
    normal to the flux surface, and $\hat{e}_2=\hat{b}\times\hat{e}_1$, the circular
    component is $E_+=(E_1+iE_2)/\sqrt{2}$.


    In practice the value is obtained from radio-frequency full-wave modeling or reconstruction
    by Fourier resolving the wave field in toroidal angle, projecting the perpendicular
    field onto the left-hand circular basis, and applying the power-deposition-density
    weight. If the denominator of the weighted average is zero or numerically negligible,
    the weighted field is undefined rather than a zero electric field.


    Typical magnitudes of $|\left\langle E_{+,n_\phi}\right\rangle_p|$ in ion-cyclotron-range
    heating calculations are about $10^2-10^5\ \mathrm{V\,m^{-1}}$ in regions with
    appreciable deposited power, with larger local values possible close to antennas.
    The phase is usually reported on a branch such as $(-\pi,\pi]$ rad and depends
    on the stated phasor and toroidal-mode convention.


    Sign convention: Positive when, for the phasor dependence $\exp(i n_\phi\phi-i\omega
    t)$, a real zero-phase value produces an instantaneous electric field in the $+\hat{e}_1$
    direction at $\phi=0$ in the right-handed cylindrical $(R,\phi,Z)$ frame and $t=0$,
    with $(\hat{e}_1,\hat{e}_2,\hat{b})$ the local right-handed polarization basis.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:per_toroidal_mode_right_hand_circularly_polarized_electric_field
  arguments:
  - name: left_hand_circularly_polarized_electric_field
    operator: per_toroidal_mode
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/plus/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/plus/phase
    status: composed
- name: left_hand_circularly_polarized_wave_electric_field_amplitude
  kind: scalar
  status: draft
  description: Modulus of the complex left-hand circularly polarized wave electric-field
    phasor. It gives the local strength of the E+ polarization component, the component
    co-rotating with positive-ion gyromotion and relevant to ion-cyclotron wave interaction.
  documentation: 'The left-hand circularly polarized wave electric-field amplitude
    is the magnitude of the complex $E_+$ phasor. In the Stix polarization basis defined
    perpendicular to the local equilibrium magnetic field, $E_+$ is the component
    that co-rotates with positive-ion gyromotion and therefore measures the ion-cyclotron-resonant
    electric-field strength.


    The amplitude is defined from the real and imaginary parts of the complex phasor
    by


    $$

    |E_+| = \sqrt{\left[\operatorname{Re}(E_+)\right]^2 + \left[\operatorname{Im}(E_+)\right]^2}

    $$


    where $E_+$, $\operatorname{Re}(E_+)$, and $\operatorname{Im}(E_+)$ are electric-field
    quantities in V/m. The modulus is independent of the arbitrary phasor phase and
    is non-negative.


    In full-wave or ray-based ion-cyclotron heating calculations, $|E_+|$ is computed
    from the solved wave electric field after projection onto the circular polarization
    basis. When the wave field is expanded in toroidal Fourier harmonics in the right-handed
    cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius, $\phi$ the toroidal
    angle, and $Z$ the vertical height, the same phasor definition applies to each
    harmonic and may be evaluated in the poloidal $(R,Z)$ plane at fixed $\phi$; in
    beam- or ray-tracing descriptions it may instead be evaluated along the propagation
    path.


    Typical ion-cyclotron-range wave-field amplitudes in tokamak plasmas are about
    10^2-10^4 V/m locally, with larger edge or near-antenna values possible depending
    on launched power, coupling, density, damping, and resonance location.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_wave_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:left_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  arguments:
  - name: left_hand_circularly_polarized_wave_electric_field
    operator: amplitude
    operator_kind: unary_postfix
  sources:
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_tor/plus/amplitude
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_tor/plus/amplitude
    status: attached
- name: parallel_wave_electric_field_amplitude
  kind: scalar
  status: draft
  description: Amplitude of the complex RF wave electric-field phasor projected along
    the local equilibrium magnetic-field direction. It is the non-negative parallel
    field strength for a coherent harmonic, independent of the RF phase.
  documentation: 'The parallel wave electric-field amplitude is the magnitude of the
    complex RF electric-field phasor projected along the local equilibrium magnetic-field
    direction. It characterizes the strength of the wave field parallel to magnetic
    field lines for a coherent harmonic, not the signed instantaneous electric field.
    It is the amplitude counterpart of [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part),
    and the wave analog of [parallel_electric_field](name:parallel_electric_field).


    For a coherent harmonic labeled by toroidal mode number $n_\phi$, the defining
    projection is


    $$

    E_{\parallel,\mathrm{amp}}(n_\phi) = \left| \tilde{\mathbf{E}}_{n_\phi} \cdot
    \hat{\mathbf{b}} \right|

    $$


    where $\tilde{\mathbf{E}}_{n_\phi}$ is the complex electric-field phasor for that
    harmonic, $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$ is the unit vector along
    the equilibrium magnetic field, and $n_\phi$ labels variation with toroidal angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius and $Z$ is vertical height. The modulus removes the RF phase, while the
    real and imaginary parts retain the phase-resolved phasor components.


    In RF wave-heating analysis, this quantity is computed from full-wave, beam-tracing,
    or ray-tracing solutions by resolving the coherent harmonic, projecting the complex
    electric field onto $\hat{\mathbf{b}}$, and taking the modulus. A local value
    uses this pointwise projection; a flux-surface representative value for heating
    studies is obtained by averaging this amplitude over the flux surface with local
    RF power-deposition density as the weight, so regions contributing most to absorption
    contribute most strongly to the reported parallel field strength.


    The parallel component is important for electron Landau damping and other wave-particle
    interactions that depend on electric field along the equilibrium magnetic field.
    For megawatt-class RF heating calculations, representative amplitudes are strongly
    normalization-dependent but commonly span about $10^2-10^5$ V m$^{-1}$ when scaled
    to the launched wave power; much smaller values can occur where the parallel projection
    is symmetry-suppressed.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:parallel_wave_electric_field
  - name:parallel_per_toroidal_mode_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  arguments:
  - name: parallel_wave_electric_field
    operator: amplitude
    operator_kind: unary_postfix
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/amplitude
    status: attached
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/amplitude
