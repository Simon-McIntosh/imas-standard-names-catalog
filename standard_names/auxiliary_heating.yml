      kind: llm
- name: per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  kind: vector
  status: active
  description: Non-inductive current density from wave-driven current drive resolved
    per toroidal Fourier mode number, quantifying the independent driven-current contribution
    of each toroidal harmonic.
  documentation: 'Wave-driven current-drive schemes transfer directed parallel momentum
    to the plasma through resonant wave-particle interactions, producing a non-inductive
    current density. Decomposing the wave field into toroidal Fourier harmonics indexed
    by mode number $n_\phi$ yields this per-mode current density, whose sum over all
    $n_\phi$ recovers [current_density_due_to_wave_driven_current_drive](name:current_density_due_to_wave_driven_current_drive)
    and whose volume-integrated toroidal projection gives the total [current_due_to_wave_driven_current_drive](name:current_due_to_wave_driven_current_drive).


    The field-aligned projection is the physically dominant contribution and is captured
    by [parallel_per_toroidal_mode_current_density_due_to_wave_driven_current_drive](name:parallel_per_toroidal_mode_current_density_due_to_wave_driven_current_drive),
    which isolates the flux-surface-averaged driven current for each toroidal harmonic
    as a function of minor radius. The mode-resolved representation is particularly
    valuable for lower-hybrid and electron-cyclotron current-drive, where different
    $n_\phi$ values correspond to distinct parallel refractive indices, cyclotron
    resonance surfaces, and spatially separate deposition locations.


    This quantity is computed from spectral ray-tracing or full-wave codes that resolve
    wave-plasma momentum exchange at each toroidal mode number $n_\phi$, and the components
    are expressed in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the parallel (field-aligned) component of the driven
    current density points in the direction of increasing toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:current_density_due_to_wave_driven_current_drive
  - name:current_due_to_wave_driven_current_drive
  - name:parallel_per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  arguments:
  - name: current_density_due_to_wave_driven_current_drive
    operator: per_toroidal_mode
    operator_kind: qualifier
- name: parallel_per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  kind: scalar
  status: active
  description: Parallel per-toroidal-mode current density due to wave-driven current
    drive is the magnetic-field-aligned component of the non-inductive current-density
    contribution from a single toroidal Fourier harmonic.
  documentation: 'Parallel per-toroidal-mode current density due to wave-driven current
    drive is the component of the current-density contribution from one toroidal Fourier
    harmonic that is parallel to the local magnetic field. It represents the field-aligned
    part of the non-inductive current generated by wave-driven current drive for the
    specified harmonic.


    The defining projection is


    $$

    j_{\parallel,\mathrm{wcd}}^{(n_\phi)} = \mathbf{j}_{\mathrm{wcd}}^{(n_\phi)} \cdot
    \hat{\mathbf{b}}

    $$


    where $j_{\parallel,\mathrm{wcd}}^{(n_\phi)}$ is the parallel per-toroidal-mode
    current density due to wave-driven current drive, $\mathbf{j}_{\mathrm{wcd}}^{(n_\phi)}$
    is the vector [per-toroidal-mode current density due to wave-driven current drive](name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive),
    $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$ is the unit vector along the local
    magnetic field $\mathbf{B}$, and $n_\phi$ is the integer toroidal Fourier mode
    index associated with variation in toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, with $R$ the major radius and $Z$ the vertical height.


    This quantity is a field-aligned scalar projection, not the vector current density
    and not the $\hat{\phi}$ component that defines [toroidal current density](name:toroidal_current_density)
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It includes only the wave-driven
    non-inductive contribution for the specified $n_\phi$; it excludes inductive,
    bootstrap, neutral-beam-driven, and other non-wave current-density contributions.
    It is distinct from the integrated [per-toroidal-mode current due to wave-driven
    current drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive)
    and the [toroidal current due to wave-driven current drive](name:toroidal_current_due_to_wave_driven_current_drive).


    Sign convention: Positive when the wave-driven current-density contribution from
    the specified toroidal harmonic points along $\hat{\mathbf{b}}$.'
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  - name:toroidal_current_density
  arguments:
  - name: per_toroidal_mode_current_density_due_to_wave_driven_current_drive
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: waves/coherent_wave/profiles_1d/current_parallel_density_n_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-current_parallel_density_n_phi
    dd_documentation:
      leaf: Flux surface averaged wave driven parallel current density, per toroidal
        mode number
      parent_path: waves/coherent_wave/profiles_1d
