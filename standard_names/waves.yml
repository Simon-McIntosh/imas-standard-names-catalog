- name: per_toroidal_mode_of_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total absorbed wave power in the whole plasma integrated over all flux
    surfaces, resolved per toroidal mode number $n_{\mathrm{tor}}$, giving the toroidal-mode
    spectral decomposition of global wave energy deposition.
  documentation: The quantity $P(n_{\mathrm{tor}})$ measures the net power deposited
    by a coherent wave into the plasma per unit toroidal mode number $n_{\mathrm{tor}}$,
    integrated over the entire plasma volume. It is related to the cumulative radial
    profile by $P(n_{\mathrm{tor}}) = \lim_{\rho \to 1} P_{\mathrm{inside}}(\rho,
    n_{\mathrm{tor}})$, where $\rho$ is the normalized toroidal flux radius and $P_{\mathrm{inside}}$
    is the flux-surface-enclosed absorbed power (see [per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface)).
    Summing over all retained toroidal mode numbers recovers the total wave-absorbed
    power in watts. This spectral decomposition is particularly important for ion
    cyclotron resonance heating (ICRH) and lower-hybrid current drive (LHCD), where
    specific toroidal mode numbers dominate energy and momentum transfer. Typical
    values range from tens of kilowatts for a single mode in mid-size devices to several
    megawatts in reactor-scale experiments. Computed from full-wave or ray-tracing
    codes that resolve the $n_{\mathrm{tor}}$ spectrum, or inferred from the radial
    profiles of species-resolved absorption such as [per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface)
    and [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface).
  unit: W
  physics_domain: waves
