- name: vertical_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Vertical (Z) component of the current density driven by the traceless
    (anisotropic) part of the ion stress tensor, arising from heat-viscous momentum
    transport in the edge and scrape-off layer plasma.
  documentation: "The vertical current density $j_{z}^{\\text{HV}} = \\hat{Z} \\cdot\
    \ \\mathbf{j}_{\\text{HV}}$ is the projection of the heat-viscosity-driven current\
    \ density vector onto the geometric vertical axis of the right-handed cylindrical\
    \ $(R, \\phi, Z)$ coordinate system. This current arises from the collisional\
    \ momentum exchange due to the traceless part of the ion stress tensor, which\
    \ is generated by ion temperature gradients and the ion diamagnetic drift. The\
    \ heat-viscosity current density is related to the total current density set by\
    \ the ion momentum balance: $\\mathbf{j}_{\\text{HV}} = - (c/B) \\, \\hat{b} \\\
    times \\nabla \\cdot \\boldsymbol{\\Pi}_{\\text{HV}}$, where $\\boldsymbol{\\\
    Pi}_{\\text{HV}}$ is the heat-viscous stress tensor and $\\hat{b}$ is the unit\
    \ vector along the magnetic field. Typical vertical components are of order 0.1\u2013\
    10 kA\xB7m$^{-2}$ in the pedestal region of H-mode tokamak plasmas, where large\
    \ temperature gradients drive strong heat-viscous forces. This quantity is the\
    \ vertical component of [current_density_due_to_heat_viscosity](name:current_density_due_to_heat_viscosity)\
    \ and forms a family with [vertical_current_density_due_to_perpendicular_viscosity](name:vertical_current_density_due_to_perpendicular_viscosity)\
    \ and [toroidal_current_density_due_to_heat_viscosity](name:toroidal_current_density_due_to_heat_viscosity).\n\
    \nSign convention: Positive when the current density vector points in the direction\
    \ of increasing vertical coordinate $Z$ (upward in the machine frame)."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:current_density_due_to_heat_viscosity
  - name:vertical_current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_heat_viscosity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/j_heat_viscosity/z
    dd_path: plasma_profiles/ggd/j_heat_viscosity/z
    status: composed
- name: volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Free electron number density averaged over the confined plasma volume
    bounded by the last closed flux surface.
  documentation: 'The volume-averaged electron density $\langle n_e \rangle \equiv
    V^{-1} \int_V n_e \, dV$ characterizes the global particle inventory of the confined
    plasma, where $V$ is the volume enclosed by the last closed flux surface. Together
    with the volume-averaged electron temperature $[\text{volume\_averaged\_electron\_temperature}](name:volume_averaged_electron_temperature)$
    and the plasma volume, it sets the global particle and energy confinement times.
    This quantity is a key input for the Greenwald density limit $n_G = I_p / (\pi
    a^2)$ and is routinely derived from interferometry or Thomson scattering profiles
    integrated over the equilibrium flux-surface geometry. Typical values range from
    $10^{19}$ m$^{-3}$ in low-density L-mode to $10^{20}$ m$^{-3}$ in high-density
    H-mode and $10^{21}$ m$^{-3}$ in ITER baseline scenarios.


    Sign convention: Positive when the electron density integrated over the confined
    volume is positive.


    This global parameter is directly comparable to the volume-averaged runaway electron
    density $[\text{volume\_averaged\_runaway\_electron\_density}](name:volume_averaged_runaway_electron_density)$
    for disruption studies and complements the electron density profile $[\text{electron\_density}](name:electron_density).$'
  unit: m^-3
  physics_domain: transport
  links:
  - name:volume_averaged_electron_temperature
  - name:volume_averaged_runaway_electron_density
  - name:electron_density
  sources:
  - id: dd:core_profiles/global_quantities/n_e_volume_average
    dd_path: core_profiles/global_quantities/n_e_volume_average
    status: composed
  - id: dd:plasma_profiles/global_quantities/n_e_volume_average
    dd_path: plasma_profiles/global_quantities/n_e_volume_average
    status: composed
  - id: dd:summary/volume_average/dn_e_dt/value
    dd_path: summary/volume_average/dn_e_dt/value
    status: composed
  - id: dd:summary/volume_average/n_e/value
    dd_path: summary/volume_average/n_e/value
    status: composed
- name: volume_averaged_electron_temperature
  kind: scalar
  status: draft
  description: Thermal energy of the electron population averaged over the confined
    plasma volume inside the last closed flux surface.
  documentation: 'The volume-averaged electron temperature $\langle T_e \rangle$ is
    a global confinement metric obtained by integrating the local electron temperature
    profile over the plasma volume $V$ enclosed by the last closed flux surface (LCFS):
    $\langle T_e \rangle = \frac{1}{V} \int_V T_e \, dV$. It characterizes the overall
    electron thermal energy content of the plasma and is routinely derived from Thomson
    scattering or electron cyclotron emission measurements in combination with equilibrium
    reconstruction. Typical core values in diverted tokamak H-mode plasmas range from
    0.5 to 5 keV, depending on heating power and size. This quantity is directly related
    to the volume-averaged electron density $[\text{name:flux_surface_averaged_electron_density}]$
    and the total stored thermal energy through the relation $W_\text{th} = \frac{3}{2}
    \langle n_e T_e + n_i T_i \rangle V$. See also the volume-averaged ion temperature
    $[\text{name:volume_averaged_ion_temperature}]$ and the line-averaged electron
    temperature $[\text{name:line_averaged_electron_temperature}]$.


    Sign convention: Positive when the electron thermal energy exceeds the background
    noise floor.


    $\langle T_e \rangle$ is always positive for a physical electron population, as
    it represents the mean kinetic energy per electron. It serves as a key scalar
    metric in confinement scaling laws such as the ITER H-mode power threshold and
    energy confinement time databases.'
  unit: eV
  physics_domain: transport
  links:
  - name:flux_surface_averaged_electron_density
  - name:volume_averaged_ion_temperature
  - name:line_averaged_electron_temperature
  sources:
  - id: dd:core_profiles/global_quantities/t_e_volume_average
    dd_path: core_profiles/global_quantities/t_e_volume_average
    status: composed
- name: volume_averaged_helium_3_density
  kind: scalar
  status: draft
  description: Volume-averaged number density of helium-3 ions over the entire confined
    plasma region.
  documentation: "The volume-averaged helium-3 ion density $\\langle n_{^3\\text{He}}\
    \ \\rangle_V = V^{-1} \\int_V n_{^3\\text{He}}(\\mathbf{r})\\,dV$ quantifies the\
    \ mean concentration of singly-ionized helium-3 (\xB3He\u207A) particles across\
    \ the confined plasma volume. This quantity is a global measure of \xB3He fueling,\
    \ commonly from neutral beam injection or RF minority heating, and is used to\
    \ assess fusion reactivity in D-\xB3He scenarios or as a minority ICRH absorber.\
    \ Typical values range from $10^{17}$ to $10^{19}$ m$^{-3}$ depending on the \xB3\
    He gas puff rate and plasma transport conditions. The volume-averaged density\
    \ is derived from the 3-D density field $n_{^3\\text{He}}(\\mathbf{r})$, which\
    \ may be measured by charge-exchange recombination spectroscopy (CXRS) or inferred\
    \ from neutral particle analysis. See also [line_averaged_helium_3_density](name:line_averaged_helium_3_density)\
    \ for the line-of-sight chord average, and [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis)\
    \ for the on-axis value.\n\nSign convention: Positive when the total number of\
    \ \xB3He ions in the confined volume is non-negative (intrinsically positive-definite\
    \ density)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:line_averaged_helium_3_density
  - name:helium_3_density_at_magnetic_axis
  sources:
  - id: dd:summary/volume_average/n_i/helium_3/value
    dd_path: summary/volume_average/n_i/helium_3/value
    status: composed
- name: volume_averaged_ion_density
  kind: scalar
  status: draft
  description: Ion number density averaged over the confined plasma volume inside
    the last closed flux surface. This global quantity serves as a core fuel density
    metric for confinement analysis.
  documentation: 'The volume-averaged ion density $\langle n_i \rangle = \frac{1}{V}
    \int_V n_i(\mathbf{r}) \, dV$ integrates the local ion density $n_i(\mathbf{r})$
    over the plasma volume $V$ contained within the last closed flux surface (LCFS).
    It provides a single-figure measure of the ion species density for confinement
    scaling and fueling studies. In conventional tokamak operation, $\langle n_i \rangle$
    typically ranges from $10^{19}\,\text{m}^{-3}$ in low-density L-mode plasmas to
    $10^{20}\,\text{m}^{-3}$ in high-density H-mode scenarios; for a pure deuterium
    plasma it is approximately half the volume-averaged electron density. This quantity
    is extracted from kinetic profile measurements (e.g., charge-exchange recombination
    spectroscopy or Thomson scattering with a representative ion species assumption)
    and used as input to global particle and energy confinement databases. It is complementary
    to [volume averaged electron temperature](name:volume_averaged_electron_temperature)
    for assessing thermal pressure and to [flux surface averaged total ion density
    at separatrix](name:flux_surface_averaged_total_ion_density_at_separatrix) for
    boundary condition analysis.


    Sign convention: Positive when the volume integral yields a positive number density.


    The term ''ion'' here refers to a specific ion species (e.g., deuterium or carbon)
    as indicated by the subject qualifier in the standard name.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:volume_averaged_electron_temperature
  - name:flux_surface_averaged_total_ion_density_at_separatrix
  sources:
  - id: dd:core_profiles/global_quantities/ion/n_i_volume_average
    dd_path: core_profiles/global_quantities/ion/n_i_volume_average
    status: composed
  - id: dd:plasma_profiles/global_quantities/ion/n_i_volume_average
    dd_path: plasma_profiles/global_quantities/ion/n_i_volume_average
    status: composed
- name: volume_averaged_iron_density
  kind: scalar
  status: draft
  description: Number density of iron impurity ions averaged over the entire confined
    plasma volume.
  documentation: "The volume-averaged iron density $\bar{n}_{\\mathrm{Fe}} = (1/V)\
    \ \\int n_{\\mathrm{Fe}}(\\mathbf{r}) \\, dV$ quantifies the total iron impurity\
    \ content in the plasma normalized by the plasma volume $V$. It is a key metric\
    \ for assessing radiative power losses, fuel dilution, and core plasma contamination\
    \ from wall-sputtered impurities. Typical values in diverted tokamak plasmas range\
    \ from $10^{13}\\,\\mathrm{m}^{-3}$ in low-impurity H-modes up to $10^{17}\\,\\\
    mathrm{m}^{-3}$ in high-density or disrupted discharges where wall erosion is\
    \ significant. The volume average smooths profile peaking and is complemented\
    \ by local measurements such as [iron_density_at_magnetic_axis](name:iron_density_at_magnetic_axis)\
    \ and [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density),\
    \ which capture spatial variation.\n\nSign convention: Positive when the iron\
    \ ion density is radially integrable over the plasma volume (non-negative physical\
    \ density).\n\nVolume-averaged iron density is routinely inferred from bolometric\
    \ and spectroscopic measurements combined with impurity transport modeling using\
    \ codes such as STRAHL or AURORA. The quantity respects the sum rule: $\\bar{n}_{\\\
    mathrm{Fe}} = \\bar{n}_\\mathrm{e} \\cdot \\langle c_{\\mathrm{Fe}} \\rangle$,\
    \ where $\\langle c_{\\mathrm{Fe}} \\rangle$ is the iron concentration and $\\\
    bar{n}_\\mathrm{e}$ is the volume-averaged electron density."
  unit: m^-3
  physics_domain: transport
  links:
  - name:iron_density_at_magnetic_axis
  - name:flux_surface_averaged_iron_density
  sources:
  - id: dd:summary/volume_average/n_i/iron/value
    dd_path: summary/volume_average/n_i/iron/value
    status: composed
