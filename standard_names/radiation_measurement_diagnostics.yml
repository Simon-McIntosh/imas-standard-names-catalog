    dd_documentation:
      leaf: Positions along x2 axis
      parent_path: camera_x_rays/filter_window/outline
      parent: Irregular outline of the filter in the (X1, X2) coordinate system, used
        only if geometry_type/index=1. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
