- name: forward_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Forward radio-frequency power traveling from the generator toward a
    single ion-cyclotron heating antenna at the antenna reference plane.
  documentation: 'Forward power of an ion-cyclotron heating antenna is the forward-traveling
    radio-frequency wave power at a defined reference plane on the feed line, directed
    toward the antenna. It is the incident component of the antenna-associated power
    represented by [power of ion-cyclotron heating antenna](name:power_of_ion_cyclotron_heating_antenna),
    before accounting for power returning toward the generator.


    For an antenna, the net launched power is defined by


    $$

    P_{\mathrm{net}} = P_{\mathrm{fwd}} - P_{\mathrm{ref}}

    $$


    where $P_{\mathrm{fwd}}$ is forward power, $P_{\mathrm{ref}}$ is [reflected power](name:reflected_power_of_ion_cyclotron_heating_antenna)
    traveling toward the generator, and $P_{\mathrm{net}}$ is net power launched through
    the antenna. Forward power is distinct from net launched power and from power
    absorbed by the plasma; it is not reduced by reflection.'
  unit: W
  physics_domain: auxiliary_heating
  links:
