- name: thermal_electron_pressure_at_post_sawtooth_crash
  kind: scalar
  status: active
  description: Isotropic pressure from random thermal motion of bulk electrons, evaluated
    in the plasma state immediately after a sawtooth crash and excluding fast-electron
    contributions.
  documentation: 'Thermal electron pressure is the isotropic kinetic pressure carried
    by the bulk electron population through its random thermal motion, evaluated in
    the plasma state after a sawtooth crash.


    For an energy-equivalent electron temperature, the defining relation is


    $$

    p_{e,\mathrm{th}} = n_e T_e

    $$


    where $p_{e,\mathrm{th}}$ is the thermal electron pressure, $n_e$ is the electron
    number density, and $T_e$ is the energy-equivalent electron temperature; the subscripts
    $e$ and $\mathrm{th}$ identify the electron population and its thermal component.


    This quantity applies to the bulk thermal electrons in the post-sawtooth-crash
    plasma state. It represents the local thermal contribution and is not an aggregate
    over fast or otherwise nonthermal electrons; those contributions are excluded
    rather than combined with the thermal component.


    The quantity is the thermal component of [total electron pressure](name:total_electron_pressure),
    which includes both thermal and fast-electron contributions. It likewise provides
    the thermal specialization of the broader [electron pressure](name:electron_pressure),
    while preserving the post-crash evaluation state.'
  unit: Pa
  physics_domain: transport
  links:
  - name:total_electron_pressure
  sources:
  - kind: imas-dd
    ref: core_profiles/profiles_1d/electrons/pressure_thermal
    version: 4.1.0
  - kind: imas-dd
    ref: edge_profiles/profiles_1d/electrons/pressure_thermal
    version: 4.1.0
  - kind: imas-dd
    ref: plasma_profiles/ggd/electrons/pressure/values
    version: 4.1.0
  - kind: imas-dd
    ref: plasma_profiles/profiles_1d/electrons/pressure_thermal
    version: 4.1.0
  - kind: imas-dd
    ref: sawteeth/profiles_1d/p_e
    version: 4.1.0
- name: total_electron_pressure
  kind: scalar
  status: active
  description: Kinetic pressure associated with the entire electron population, combining
    thermal and suprathermal contributions in the isotropic electron stress.
  documentation: 'Total electron pressure is the isotropic kinetic part of the electron
    pressure tensor, representing random electron momentum transport for the complete
    electron population.


    For the combined electron distribution function, its defining relation is


    $$

    p_e = \frac{m_e}{3} \int |\mathbf{v}-\mathbf{u}_e|^2 f_e(\mathbf{v})\,d^3v

    $$


    where $p_e$ is total electron pressure, $m_e$ is electron mass, $\mathbf{v}$ is
    electron velocity, $\mathbf{u}_e$ is mean electron velocity, and $f_e(\mathbf{v})$
    is the combined electron velocity distribution function normalized so its velocity
    integral gives the electron number density.


    The aggregation includes both bulk thermal and suprathermal electrons and applies
    across core, edge, and scrape-off-layer plasma. It excludes anisotropic stress
    components and is not restricted to the thermal electron population alone.


    This quantity makes the total aggregation explicit within [electron pressure](name:electron_pressure):
    it is the sum of the thermal contribution and the [fast electron pressure](name:fast_electron_pressure)
    contribution. The parent name denotes the same isotropic pressure concept without
    requiring the total qualifier.


    Sign convention: Positive when the isotropic electron stress is compressive rather
    than tensile.'
  unit: Pa
  physics_domain: transport
  links: []
  sources:
  - kind: imas-dd
    ref: core_profiles/profiles_1d/electrons/pressure
    version: 4.1.0
  - kind: imas-dd
    ref: edge_profiles/ggd/electrons/pressure/values
    version: 4.1.0
  - kind: imas-dd
