- name: toroidal_angle_of_hardware_component_outline_point
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of a point on the outline contour of a hardware\
    \ component, measured in the right-handed cylindrical (R, \u03C6, Z) frame where\
    \ \u03C6 increases counter-clockwise when viewed from above."
  documentation: "The toroidal angle $\\phi$ locates a boundary or outline point of\
    \ a hardware component \u2014 such as a launcher mirror, optical fiber image boundary,\
    \ or diagnostic aperture \u2014 within the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is the major radius, $Z$ is the vertical height, and $\\\
    phi$ increases counter-clockwise when viewed from above $+\\hat{Z}$. Together\
    \ with the corresponding major-radius and vertical coordinates of the same outline\
    \ point, $\\phi$ fully specifies the three-dimensional position of the hardware\
    \ feature in the machine geometry. This quantity is the toroidal projection of\
    \ the more general [angle_of_hardware_component_outline_point](name:angle_of_hardware_component_outline_point),\
    \ which encompasses both poloidal and toroidal angular coordinates of a hardware\
    \ outline. For context, the analogous quantity for a bare geometric outline without\
    \ hardware-component qualification is [toroidal_angle_of_outline_point](name:toroidal_angle_of_outline_point),\
    \ while component-center variants include [toroidal_angle_of_antenna_element_center](name:toroidal_angle_of_antenna_element_center)\
    \ and [toroidal_angle_of_conductor_element_center](name:toroidal_angle_of_conductor_element_center).\
    \ Typical values span $0$ to $2\\pi$ rad, or equivalently $-\\pi$ to $+\\pi$ rad,\
    \ depending on the machine convention for the toroidal zero reference.\n\nSign\
    \ convention: Positive when $\\phi$ is in the direction of increasing toroidal\
    \ angle, i.e., counter-clockwise when viewed from above $+\\hat{Z}$."
