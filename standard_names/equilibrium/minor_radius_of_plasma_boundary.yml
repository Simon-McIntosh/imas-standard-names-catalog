name: minor_radius_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Half-width of the plasma boundary in the midplane, defined as $(R_{\max}
  - R_{\min})/2$ of the last closed flux surface.
documentation: "The minor radius of the plasma boundary $a = (R_{\\max} - R_{\\min})/2$,\
  \ where $R_{\\max}$ and $R_{\\min}$ are the maximum and minimum major-radius coordinates\
  \ of the boundary contour in the poloidal cross section. It is a fundamental geometric\
  \ parameter that, together with the major radius, defines the inverse aspect ratio\
  \ $\\epsilon = a/R_0$ and enters into stability and confinement scaling laws. Typical\
  \ values are $a \\approx 0.5$\u2013$1.2$ m for medium-to-large tokamaks (e.g., DIII-D\
  \ $\\approx 0.67$ m, JET $\\approx 1.0$ m, ITER $\\approx 2.0$ m). The quantity\
  \ is determined from equilibrium reconstruction (EFIT, LIUQE) or from fast boundary-detection\
  \ algorithms used in real-time plasma shape control. It is closely related to the\
  \ elongation and triangularity of the plasma cross section and to the normalized\
  \ beta $\\beta_N$, which scales linearly with $a$. See `elongation_of_plasma_boundary`\
  \ for the vertical shape parameter and `major_radius_of_magnetic_axis` for the radial\
  \ center of the equilibrium."
