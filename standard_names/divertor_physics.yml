- name: fluence_at_divertor_target
  kind: scalar
  status: active
  description: Cumulative particle dose delivered to a divertor target surface over
    a specified time interval, equal to the time integral of the incident normal particle
    flux density summed over all contributing particle species.
  documentation: "Fluence at the divertor target is the total accumulated particle\
    \ dose on the target surface over a time interval $[t_1, t_2]$, defined as:\n\n\
    $$\n\\Phi = \\int_{t_1}^{t_2} \\Gamma_\\perp \\, dt\n$$\n\nwhere $\\Gamma_\\perp$\
    \ is the particle flux density incident normal to the target surface and $t_1$,\
    \ $t_2$ are the start and end of the exposure window. The result represents the\
    \ total number of particles arriving per unit target area during that interval.\n\
    \n[Ion fluence at the divertor target](name:ion_fluence_at_divertor_target) is\
    \ the primary child quantity, accumulating the ion particle dose summed over all\
    \ ion species and charge states. Other particle populations \u2014 electrons and\
    \ fast neutrals \u2014 constitute additional child quantities within this parent\
    \ scope.\n\nThis quantity is a surface-normal-integrated particle dose and carries\
    \ no energy weighting; for instantaneous energy deposition per unit area see [energy_flux_at_divertor_target](name:energy_flux_at_divertor_target)."
  unit: m^-2
  physics_domain: divertor_physics
  links:
  - name:ion_fluence_at_divertor_target
  - name:energy_flux_at_divertor_target
- name: flux_at_divertor_target
  kind: scalar
  status: active
  description: Flux at a divertor target is the local scalar surface density of power
    deposited on a divertor target surface, independent of how the incident energy
    carriers are decomposed.
  documentation: 'Flux at a divertor target is the local scalar surface density of
    power deposited on a divertor target surface. It represents the target-surface
    load itself, without assigning that load to a particular carrier species, radiation
    component, or transport mechanism.


    The target-surface flux is defined as the surface-area density of deposited power:


    $$

    F_{\mathrm{t}}(\mathbf{x}) = \frac{dP_{\mathrm{dep}}}{dA_{\mathrm{t}}}

    $$


    where $F_{\mathrm{t}}$ is the flux at surface point $\mathbf{x}$, $P_{\mathrm{dep}}$
    is the power deposited into the divertor target material, and $A_{\mathrm{t}}$
    is area on the divertor target surface.


    This name is an umbrella for scalar divertor-target deposited-flux quantities;
    the explicit energy-load specialization is [energy flux at divertor target](name:energy_flux_at_divertor_target).
    It excludes upstream fluxes, volume power densities, and signed vector flux components.
    Channel-resolved contributions are distinct quantities unless a more specific
    standard name states that decomposition.'
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:energy_flux_at_divertor_target
  - name:parallel_heat_flux_at_divertor_target
- name: energy_flux_at_divertor_target
  kind: scalar
  status: active
  description: Energy flux at the divertor target is the local energy deposition rate
    per unit target-surface area from electron and ion conductive heat transport,
    charged-particle convective enthalpy, neutral-particle bombardment, and locally
    absorbed radiation.
  documentation: 'Energy flux at the divertor target is the local rate of energy deposition
    per unit area on a divertor target surface by incident particles and radiation.
    It combines electron and ion conductive heat transfer, charged-particle convective
    enthalpy, neutral-particle energy deposition, and radiation absorbed locally at
    the surface.


    The total deposited energy flux is the algebraic sum of the contributing surface
    energy-flux channels:


    $$

    q_\mathrm{tgt} = q_\mathrm{cond} + q_\mathrm{conv} + q_\mathrm{neut} + q_{\mathrm{rad},\mathrm{abs}}

    $$


    where $q_\mathrm{tgt}$ is the energy flux at the divertor target, $q_\mathrm{cond}$
    is the [conductive contribution], $q_\mathrm{conv}$ is the [convective contribution],
    $q_\mathrm{neut}$ is the neutral-particle bombardment contribution, and $q_{\mathrm{rad},\mathrm{abs}}$
    is the [locally absorbed radiation contribution].


    This quantity is a local surface flux density, not an area-integrated divertor-target
    power; integration over a specified target surface gives [power at the divertor
    target](name:power_at_divertor_target), and the largest local value is [maximum
    energy flux at the divertor target](name:maximum_of_energy_flux_at_divertor_target).
    It excludes energy lost before reaching the target and incident particles or radiation
    that do not transfer energy to the target material.


    Sign convention: Positive when the surface-normal energy flux points along the
    target-surface normal directed from the incident plasma toward the target material.'
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target
  - name:maximum_of_energy_flux_at_divertor_target
  arguments:
  - name: flux_at_divertor_target
    operator: energy
    operator_kind: qualifier
- name: flux_of_divertor_due_to_recycling
  kind: scalar
  status: active
  description: Rate at which recycling at divertor plasma-facing surfaces returns
    a transported quantity to the plasma, with the channel specified by a more specific
    quantity.
  documentation: 'This quantity is the divertor-local contribution to the recycling
    flux: the rate at which recycling at divertor plasma-facing surfaces returns a
    channel-specific transported amount to the plasma. The channel may be particle
    content, energy, momentum, or another quantity defined by a more specific standard
    name such as [particle flux of divertor due to recycling](name:particle_flux_of_divertor_due_to_recycling).


    For a scalar transported amount $Q$, the divertor recycling rate is defined by


    $$

    \dot{Q}_{\mathrm{div,rec}} = \int_{S_{\mathrm{div}}} \mathbf{j}_{Q,\mathrm{return}}
    \cdot \hat{\mathbf{n}}_{\mathrm{plasma}}\,\mathrm{d}S

    $$


    where $S_{\mathrm{div}}$ is the divertor plasma-facing surface, $\mathbf{j}_{Q,\mathrm{return}}$
    is the returning surface flux of $Q$, and $\hat{\mathbf{n}}_{\mathrm{plasma}}$
    points from the surface toward the plasma. It is the divertor-specific component
    of [flux due to recycling](name:flux_due_to_recycling), and is distinct from a
    total recycling rate summed over all divertor targets.'
  unit: s^-1
  physics_domain: divertor_physics
  links:
  - name:particle_flux_of_divertor_due_to_recycling
  arguments:
  - name: flux_due_to_recycling
    operator: divertor
    operator_kind: locus
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of helium-3 ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary, summed over positive ionization states and excluding neutral
    helium-3 atoms.
  documentation: 'Number density of helium-3 ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the helium-3-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local helium-3 number density is defined by the differential particle count:


    $$

    n_3 = \frac{dN_3}{dV}

    $$


    where $n_3$ is the helium-3 ion number density, $N_3$ is the number of helium-3
    ions in a small plasma volume, and $V$ is that plasma volume. The count $N_3$
    includes singly ionized and fully stripped helium-3 ions.


    This quantity applies to the helium-3 ion population immediately upstream of the
    electrostatic sheath at a divertor target. It is summed over the positive ionization
    states of helium-3, excludes neutral helium-3 atoms, and excludes electrons and
    all other ion species.


    Unlike [helium_4_density_at_divertor_target](name:helium_4_density_at_divertor_target),
    this quantity describes the isotope with three nucleons. Unlike [helium_3_density_at_limiter](name:helium_3_density_at_limiter),
    it is evaluated at a divertor target rather than at a limiter surface.'
  unit: m^-3
