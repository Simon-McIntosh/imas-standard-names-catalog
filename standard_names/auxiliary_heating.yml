- name: z_component_of_direction_unit_vector
  kind: scalar
  status: draft
  description: Vertical (Z-axis) Cartesian component of the direction unit vector
    of a device component or sensor, equal to the dot product $\hat{d} \cdot \hat{z}$.
  documentation: 'The Z-component $d_z = \hat{d} \cdot \hat{z}$ gives the projection
    of the unit direction vector $\hat{d} = (d_x, d_y, d_z)$ onto the vertical axis
    $\hat{z}$ of the right-handed Cartesian $(x, y, z)$ frame, where $\hat{z}$ is
    aligned with the machine vertical direction $\hat{Z}$. By construction $d_x^2
    + d_y^2 + d_z^2 = 1$, so $d_z \in [-1, 1]$; a value of $+1$ indicates a sensor
    or beam directed purely vertically upward, while $0$ indicates a horizontal orientation.
    This component is used alongside [y_component_of_direction_unit_vector](name:y_component_of_direction_unit_vector)
    and the X-component to fully specify the orientation of sensors, launchers, mirrors,
    or injectors in the device frame. For example, the vertical alignment of an electron-cyclotron
    launcher mirror or a shattered-pellet injection cone (see [z_component_of_shattered_pellet_injection_direction_unit_vector](name:z_component_of_shattered_pellet_injection_direction_unit_vector))
    is captured by this quantity. The full three-component vector is described by
    [direction_unit_vector](name:direction_unit_vector).


    Sign convention: Positive when the direction vector has a component pointing in
    the $+\hat{z}$ (vertically upward) direction.'
  unit: '1'
  physics_domain: auxiliary_heating
