      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Electron cyclotron heating power (P_EC) coupled to the plasma from
        a specific ECRH/ECCD launcher. Represents the absorbed RF power delivered
        to the plasma electrons via electron cyclotron resonance.
      kind: template
- name: power_due_to_first_orbit_loss
  kind: scalar
  status: active
  description: Power carried out of the confined fast-ion population by particles
    whose first guiding-center orbit after birth or acceleration is unconfined; it
    is a positive loss magnitude.
  documentation: 'First-orbit-loss power is the kinetic-energy loss rate carried away
    by fast ions whose first guiding-center orbit after birth or acceleration intersects
    the confining boundary. It represents the aggregate loss from the confined fast-ion
    population, rather than energy transferred by collisions or subsequent orbit evolution.


    The volume-integrated loss power is defined by


    $$

    P_{\mathrm{FOL}} = \int_V p_{\mathrm{FOL}}^{(1)}(\mathbf{x})\,\mathrm{d}^3\mathbf{x}

    $$


    where $P_{\mathrm{FOL}}$ is the first-orbit-loss power, $V$ is the confined plasma
    volume, $\mathbf{x}$ is position, and $p_{\mathrm{FOL}}^{(1)}$ is the local kinetic-energy
    loss rate density from first-orbit-unconfined fast ions.


    The quantity is a non-negative loss magnitude and excludes power losses specifically
    attributed to charge exchange, such as [fast-ion power due to charge exchange](name:fast_ion_power_due_to_charge_exchange).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_due_to_charge_exchange
  sources:
  - dd_path: distributions/distribution/global_quantities/power_first_orbit
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/distributions.html#distributions-distribution-global_quantities-power_first_orbit
    dd_documentation:
      leaf: Power loss due to first orbit losses
      parent_path: distributions/distribution/global_quantities
      parent: Global quantities (integrated over plasma volume for moments of the
        distribution, collisional exchange and source terms), for various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Power loss due to first orbit losses, where newly born fast particles
        (e.g., from NBI or fusion reactions) escape before completing a full orbit.
        A global scalar power sink in the distribution function framework.
      kind: llm
- name: power_due_to_ion_cyclotron_heating
  kind: scalar
  status: active
  description: "Net radio-frequency power coupled from ion-cyclotron heating launchers\
    \ into the plasma, resolved per launcher or aggregated across the launcher system.\
    \ It excludes reflected power and losses before the launcher\u2013plasma boundary."
  documentation: 'This quantity is the net radio-frequency wave power crossing the
    boundary between an ion-cyclotron heating launcher and the plasma. It may represent
    one launcher or the aggregate of multiple launchers.


    The launcher-resolved coupled power is defined by the time-averaged Poynting flux
    through a surface separating the launcher from the plasma:


    $$

    P_{\mathrm{IC},a} = \oint_{S_a} \langle \mathbf{S}_a \rangle \cdot \hat{\mathbf{n}}
    \, dA

    $$


    where $a$ labels the launcher, $S_a$ is a surface enclosing its plasma-facing
    aperture, $\langle \mathbf{S}_a \rangle$ is the time-averaged Poynting flux of
    its launched wave field, $\hat{\mathbf{n}}$ is the surface normal directed toward
    the plasma, and $dA$ is the surface-area element.


    The quantity excludes reflected power and losses in transmission lines, launcher
    structures, and surrounding material. It is not reduced by incomplete absorption
    after the coupled wave field enters the plasma. Summing launcher-resolved values
    gives [total power due to ion cyclotron heating](name:total_power_due_to_ion_cyclotron_heating);
    it is distinct from [total power of the ion cyclotron heating antenna](name:total_power_of_ion_cyclotron_heating_antenna),
    which denotes launched rather than boundary-coupled power.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  - name:total_power_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: summary/heating_current_drive/ic/power/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-ic-power-value
    dd_documentation:
      leaf: Value
