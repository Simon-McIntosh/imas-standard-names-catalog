- name: absorbed_power_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Power from a single neutral beam injector that is absorbed by the plasma.
    It is the injector launched power after subtracting beam power lost to shine-through
    and fast-ion first-orbit losses.
  documentation: 'Absorbed power of a neutral beam injector is the rate at which energy
    launched by one injector is deposited in the plasma. It excludes the portions
    of the launched beam power that leave the plasma as neutral-beam shine-through
    or are lost promptly by fast ions before thermalizing.


    A common power balance definition is:


    $$

    P_{\mathrm{abs}} = P_{\mathrm{launch}} - P_{\mathrm{shine}} - P_{\mathrm{first\
    orbit}}

    $$


    where $P_{\mathrm{abs}}$, $P_{\mathrm{launch}}$, $P_{\mathrm{shine}}$, and $P_{\mathrm{first\
    orbit}}$ are all powers in W. $P_{\mathrm{shine}}$ is the [power carried through
    the plasma by un-ionized beam particles](name:power_due_to_neutral_beam_shinethrough),
    not a particle fraction, and $P_{\mathrm{first\ orbit}}$ is the power carried
    by newly born fast ions that are lost before depositing their energy in the plasma.


    In practice this quantity is estimated from neutral-beam source power, beamline
    transmission, neutralization efficiency, plasma density and geometry, stopping
    cross sections, and fast-ion orbit loss modeling. It represents the plasma-deposited
    part of the injector power budget and is used in heating, current-drive, and energy-confinement
    analyzes.


    The value is non-negative and cannot exceed the launched power of the injector
    in a physically consistent power balance. Typical absorbed powers are about 0.1-10
    MW per injector in many present tokamak experiments, and can reach several tens
    of MW per injector in large high-power systems, depending on beam energy, plasma
    density, geometry, and prompt-loss fraction.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_neutral_beam_injector
  - name:neutral_beam_absorbed_power
  - name:current_due_to_neutral_beam_injection
  arguments:
  - name: power_of_neutral_beam_injector
    operator: absorbed
    operator_kind: qualifier
- name: power_of_wave_beam
  kind: scalar
  status: draft
  description: Electromagnetic power carried by a single wave beam in an RF or microwave
    auxiliary heating and current-drive system, abstracting over all stages of the
    power-delivery chain from launcher to plasma.
  documentation: "The power of a wave beam is the total electromagnetic energy flux\
    \ integrated over the beam cross-section at a defined point in the power-delivery\
    \ chain of an RF or microwave heating system. It abstracts over the specific power-flow\
    \ stage \u2014 launch, propagation through vacuum, wave\u2013plasma interaction,\
    \ and residual exit \u2014 with child quantities such as [launched_power_of_wave_beam](name:launched_power_of_wave_beam)\
    \ identifying the particular stage.\n\nThe instantaneous beam power relates to\
    \ the real part of the complex Poynting vector $\\mathbf{S}$ integrated over a\
    \ surface $A$ whose outward normal $\\hat{n}$ is aligned with the local propagation\
    \ direction:\n\n$$\nP_\\text{beam} = \\operatorname{Re} \\int_A \\mathbf{S} \\\
    cdot \\hat{n} \\, dA, \\quad \\mathbf{S} = \\tfrac{1}{2}\\,\\mathbf{E} \\times\
    \ \\mathbf{H}^*\n$$\n\nwhere $\\mathbf{E}$ is the complex electric-field amplitude,\
    \ $\\mathbf{H}^*$ is the complex conjugate of the magnetic-field amplitude, and\
    \ the factor $1/2$ applies to peak-amplitude complex phasors. As the beam propagates\
    \ through plasma, $P_\\text{beam}$ decreases along the ray path, with the difference\
    \ appearing as deposited power; the path-integrated absorbed quantity is described\
    \ by [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam).\n\
    \nIn practice, beam power is measured at the launcher output by directional couplers\
    \ or RF calorimetric power meters, with the delivered fraction cross-checked against\
    \ calorimetric vessel loading or neutron yield scaling. Summed over all actuating\
    \ beams and heating systems, the aggregate contributes to total_plasma_power.\n\
    \nTypical values range from tens of kilowatts in low-power test-bed experiments\
    \ to several megawatts per beam element in fusion-class heating systems, depending\
    \ on actuator type and operational scenario."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_wave_beam
  - name:absorbed_power_of_beam_tracing_beam
  sources:
