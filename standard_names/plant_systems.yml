- name: gas_flow
  kind: scalar
  status: draft
  description: Volumetric throughput rate of gas in an injection or pumping system,
    expressed as the product of local gas pressure and volumetric flow speed.
  documentation: "The gas flow $Q$ characterizes the pressure-weighted volumetric\
    \ throughput of gas in a plasma-facing gas handling system, encompassing injection\
    \ valves, injection pipes, and pumping ducts. It is the primary quantity governing\
    \ particle delivery to and removal from the plasma vessel, directly linking hardware\
    \ actuator settings to the plasma particle inventory.\n\nThe defining relation\
    \ is:\n\n$$\nQ = p \\cdot \\dot{V}\n$$\n\nwhere $p$ is the local gas pressure\
    \ and $\\dot{V}$ is the volumetric flow rate. This standard vacuum-engineering\
    \ throughput convention yields a quantity proportional to particle flux that remains\
    \ well-defined independent of downstream pressure variations, making it the natural\
    \ actuator variable for density control systems.\n\nIn gas injection applications,\
    \ $Q$ acts as the primary actuator for plasma fueling, impurity seeding, and density\
    \ control. In pumping ducts, it quantifies the particle exhaust rate entering\
    \ the plasma particle balance as a sink. The operational dynamic range of a given\
    \ valve or duct is bounded by [maximum_gas_flow](name:maximum_gas_flow) as the\
    \ upper limit and [minimum_gas_flow](name:minimum_gas_flow) as the lower limit.\
    \ The species-resolved pumping counterpart is neutral_species_flow.\n\nFlow rates\
    \ are inferred from calibrated mass flow controllers, pressure transducers combined\
    \ with valve conductance models, or response-curve look-up tables that map control\
    \ voltage to throughput. Typical injection rates range from $10^{-3}$ to $10$\
    \ Pa\xB7m\xB3\xB7s\u207B\xB9 for trace impurity valves through high-throughput\
    \ fueling manifolds; pumping duct rates in large-scale devices can exceed $10$\
    \ Pa\xB7m\xB3\xB7s\u207B\xB9 during high-density operation."
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:maximum_gas_flow
  - name:minimum_gas_flow
