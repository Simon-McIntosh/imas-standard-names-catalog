name: vertical_coordinate_of_wave_beam
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of a wave beam trajectory or 2-D grid point
  in the machine cylindrical coordinate system.
documentation: The quantity $Z_{\mathrm{beam}}$ specifies the vertical height of a
  point on the 2-D spatial grid associated with a coherent wave beam in the tokamak
  cylindrical coordinates $(R, \phi, Z)$. It is used in ray-tracing and beam-tracing
  codes (e.g., TORBEAM, GRAY, C3PO) to map the propagation path of electron cyclotron
  (EC) or lower-hybrid (LH) beams through the plasma cross-section. Together with
  the corresponding major-radius coordinate it defines the poloidal-plane grid on
  which wave fields, refractive index, and absorbed-power profiles are evaluated.
  Typical values span the full plasma height, ranging from roughly $-2\;\mathrm{m}$
  to $+2\;\mathrm{m}$ in large tokamaks such as ITER. See `vertical_coordinate_of_diagnostic_aperture`
  for an analogous coordinate applied to diagnostic optics.
