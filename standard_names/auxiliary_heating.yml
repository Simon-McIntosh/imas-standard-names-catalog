- name: wave_magnetic_field
  kind: scalar
  status: active
  description: Magnetic-field perturbation carried by a coherent electromagnetic wave,
    distinct from equilibrium and static plasma or external-coil magnetic fields.
  documentation: 'The wave magnetic field designates the oscillatory magnetic-field
    perturbation associated with a coherent electromagnetic wave. It is distinct from
    the equilibrium and static contributions included in the complete [magnetic field](name:magnetic_field),
    and provides the parent quantity for directional components such as the [parallel
    wave magnetic field](name:parallel_wave_magnetic_field).


    For a harmonic wave, the physical field is represented by


    $$

    \mathbf{B}_{\mathrm{wave}}(\mathbf{r},t)=\operatorname{Re}\left\{\widetilde{\mathbf{B}}_{\mathrm{wave}}(\mathbf{r},\omega)e^{-i\omega
    t}\right\}

    $$


    where $\mathbf{r}$ is position, $t$ is time, $\omega$ is angular frequency, and
    $\widetilde{\mathbf{B}}_{\mathrm{wave}}$ is the complex magnetic-field amplitude;
    the field has tesla units. Real- and imaginary-part quantities are separate phase-resolved
    representations, not alternate definitions of this field.


    Sign convention: Positive when a resolved wave magnetic-field component points
    along its declared positive direction in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: T
  physics_domain: auxiliary_heating
  links:
  - name:magnetic_field
  - name:parallel_wave_magnetic_field
  arguments:
  - name: magnetic_field
    operator: wave
    operator_kind: qualifier
