name: poloidal_component_of_momentum_flux
status: draft
description: Poloidal projection of the momentum flux tensor, quantifying the rate
  of momentum transport per unit area along $\hat{e}_\theta$.
documentation: The poloidal momentum flux $\Pi_\theta$ (in kg m$^{-1}$ s$^{-2}$, equivalent
  to Pa) represents the component of the momentum flux tensor projected onto the poloidal
  unit vector $\hat{e}_\theta$. In the fluid description, the full momentum flux tensor
  combines the Reynolds stress $\rho \langle \tilde{v}_i \tilde{v}_j \rangle$, the
  viscous stress $\pi_{ij}$, and the convective contribution $\rho\, v_i v_j$, where
  $\rho$ is the mass density (kg m$^{-3}$) and $v$ is the fluid velocity (m s$^{-1}$).
  The poloidal projection selects the transport channel that redistributes momentum
  in the $\hat{e}_\theta$ direction across flux surfaces or grid elements. This quantity
  is resolved per element on either a 1-D radial grid or a generalized grid description
  (GGD) mesh, enabling momentum transport analysis in complex edge and divertor geometries
  where flux-surface averages may not be adequate. Typical magnitudes range from $10^{-3}$
  Pa in the far scrape-off layer to $10^{1}$ Pa near the separatrix in H-mode plasmas.
  Computed by edge fluid transport codes (SOLPS-ITER, SOLEDGE, EDGE2D-EIRENE) or extracted
  from gyrokinetic simulations. See `radial_component_of_momentum_flux` for the radial
  counterpart.
