name: ion_cyclotron_heating_antenna_phase_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent reference for the relative phase between ion
  cyclotron resonance heating antenna straps used by the plasma control system.
documentation: This reference waveform specifies the target inter-strap phasing $\Delta\phi_{\rm
  ref}(t)$ (dimensionless, expressed in units of full cycles or radians depending
  on convention) for an ion cyclotron resonance heating (ICRH) antenna array. By adjusting
  $\Delta\phi$, operators select the launched toroidal wavenumber spectrum $k_\phi$
  and thereby control the balance between heating and current-drive efficiency. Common
  settings include monopole ($\Delta\phi = 0$), dipole ($\Delta\phi = \pi$), and $\pm\pi/2$
  phasing for directed current drive. The waveform is consumed by the ICRH real-time
  controller and compared against the measured antenna phase to generate a feedback
  error signal. See also `electron_cyclotron_beam_toroidal_steering_angle_reference_waveform`
  for an analogous control variable in the electron cyclotron system.
