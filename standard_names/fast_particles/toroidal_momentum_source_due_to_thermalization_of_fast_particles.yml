name: toroidal_momentum_source_due_to_thermalization_of_fast_particles
status: draft
description: Volumetric source rate of toroidal momentum density in the thermal population
  arising from the slowing-down and thermalization of fast particles.
documentation: "When supra-thermal particles slow down through Coulomb collisions\
  \ with the background plasma, they transfer their directed toroidal momentum to\
  \ the thermal species. The quantity $S_{p_\\phi}^{\\rm th}$ (in N/m\xB2) represents\
  \ the local rate at which toroidal linear momentum density is deposited into the\
  \ thermal population per unit volume. It is related to the toroidal angular momentum\
  \ source by $S_{p_\\phi}^{\\rm th} = S_{L_\\phi}^{\\rm th} / R$, where $R$ is the\
  \ local major radius (in m) and $S_{L_\\phi}^{\\rm th}$ is the angular-momentum\
  \ source density. In tokamak H-mode plasmas heated by tangential neutral beams,\
  \ this source peaks near the beam deposition radius and can reach $10^{-1}$\u2013\
  $10^{1}$ N/m\xB2 depending on beam power and plasma density. It is evaluated by\
  \ orbit-following Monte Carlo codes (NUBEAM, ASCOT) that track the collisional energy\
  \ and momentum partition between thermal ions and electrons. See also `toroidal_angular_momentum_source_due_to_thermalization_of_fast_particles`\
  \ for the angular-momentum formulation and `particle_number_density_source_due_to_thermalization_of_fast_particles`\
  \ for the associated particle source."
