name: blanket_energy_multiplication_factor
status: draft
cocos_transformation_type: one_like
description: Ratio of total thermal energy deposited in the blanket to the kinetic
  energy of incident fusion neutrons, accounting for exothermic nuclear reactions.
documentation: "The blanket energy multiplication factor $M = P_{\\mathrm{dep}} /\
  \ P_n$ is defined as the total power deposited in the blanket $P_{\\mathrm{dep}}$\
  \ (in W) divided by the incident neutron power $P_n$. Exothermic reactions such\
  \ as $^6\\mathrm{Li}(n,\\alpha)T$ (+4.8 MeV) and neutron capture on structural materials\
  \ release additional energy beyond the initial 14.1 MeV neutron kinetic energy,\
  \ yielding $M > 1$; typical design values for lithium-lead or ceramic-breeder blankets\
  \ lie in the range 1.1\u20131.4. The factor is evaluated by coupled neutronics\u2013\
  thermal-hydraulics simulations (MCNP + CFD) and is a key input to the overall plant\
  \ power balance. $M$ is closely related to the `tritium_breeding_ratio`, as both\
  \ are governed by the same neutron transport processes. See also `nuclear_heating_power_of_breeding_blanket`\
  \ for the absolute deposited power."
