- name: outer_radius_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Outer radius of the annular cross-section of a poloidal field coil,\
    \ measured from its annulus center to the outer conducting boundary in a poloidal\
    \ plane of the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The outer radius is the larger of the two radial dimensions characterizing
    the annular conductor cross-section of a poloidal field coil, measured from the
    center of the annulus to its outer conducting boundary in a poloidal plane of
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and
    $Z$ is vertical height. It defines the external radial envelope of the conductor
    cross-section.


    The outer radius is defined by


    $$

    r_{\mathrm{out}} = \max_{\mathbf{x} \in C_{\mathrm{out}}} \left\|\mathbf{x} -
    \mathbf{x}_{c}\right\|

    $$


    where $\mathbf{x}=(R,Z)$ is a point on the outer conducting boundary $C_{\mathrm{out}}$,
    $\mathbf{x}_{c}=(R_c,Z_c)$ is the annulus center, and the norm is the Euclidean
    distance in the poloidal $(R,Z)$ plane.


    The quantity is non-negative and characterizes the cross-sectional envelope, not
    the local curvature of its boundary. Together with the [inner radius](name:inner_radius_of_poloidal_field_coil),
    it bounds the annular conductor region; unlike the [radius of a poloidal field
    coil](name:radius_of_poloidal_field_coil), it is not the curvature radius of an
    individual contour arc.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_poloidal_field_coil
