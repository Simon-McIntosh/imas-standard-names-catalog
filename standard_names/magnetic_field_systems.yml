- name: length_of_passive_structure
  kind: scalar
  status: active
  description: "Length of a passive conducting structure is the Euclidean length of\
    \ its beta-side inclined edge in an oblique parallelogram cross-section, evaluated\
    \ in a constant-\u03C6 poloidal plane of the right-handed cylindrical (R, \u03C6\
    , Z) frame, where R is major radius and Z is vertical height."
  documentation: 'Length of a passive conducting structure is the Euclidean length
    of its beta-side inclined edge in an oblique parallelogram cross-section representing
    a passive conducting structure element. The edge is evaluated in a constant-$\phi$
    poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For endpoints $P_1=(R_1,Z_1)$ and $P_2=(R_2,Z_2)$ on the beta-side edge, the length
    is defined by the planar Euclidean distance:


    $$

    L_\beta = \sqrt{(R_2-R_1)^2 + (Z_2-Z_1)^2}

    $$


    where $L_\beta$ is the beta-side length and $R_i$ and $Z_i$ are the major-radius
    and vertical-height coordinates of endpoint $P_i$ in the same constant-$\phi$
    plane.


    This quantity is the beta-side member of the inclined-edge pair for an oblique
    passive-structure cross-section; the complementary side is a distinct specialization.
    It is distinct from major_length_of_passive_structure and [width_of_passive_structure](name:width_of_passive_structure),
    which describe other side lengths or rectangular limiting geometry, and from [height_of_passive_structure](name:height_of_passive_structure)
    and cross_section_area_of_passive_structure, which are separate geometric descriptors
    of the same cross-section. As a Euclidean distance, it is not a signed projection
    along $R$ or $Z$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_passive_structure
  - name:height_of_passive_structure
  sources:
