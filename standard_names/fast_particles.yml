- name: fast_particle_power_density_due_to_thermalization
  kind: scalar
  status: draft
  description: Volumetric power density representing the net rate of energy lost by
    the fast particle population to the thermal background plasma through the collisional
    slowing-down (thermalization) process. Positive values indicate a net energy transfer
    from fast particles to the thermal population, consistent with the ordinary direction
    of thermalization. This quantity is the energy-moment of the fast-particle collision
    operator projected onto the slowing-down channel.
  documentation: 'The fast particle power density due to thermalization, $S_{E,\mathrm{fast}}$
    (units: $\mathrm{W\,m^{-3}}$), is the local volumetric rate at which the fast
    particle population loses energy to the thermal background through collisional
    slowing-down.


    During thermalization, supra-thermal particles (e.g., fusion-born alpha particles,
    beam ions) transfer their kinetic energy to the bulk plasma electrons and ions
    via Coulomb collisions. The quantity $S_{E,\mathrm{fast}}$ captures the energy-moment
    of the fast-particle collision operator evaluated over the slowing-down distribution,


    $$S_{E,\mathrm{fast}} = \int \frac{p^2}{2m} \, C_\mathrm{sd}[f_\mathrm{fast}]
    \, d^3p,$$


    where $C_\mathrm{sd}$ is the slowing-down collision operator and $f_\mathrm{fast}$
    is the fast-particle distribution function.


    Sign convention: Positive when the fast particle population is losing energy to
    the thermal background, i.e., when the net collisional energy flow is directed
    from the fast population into the thermal plasma.


    This quantity is the fast-particle-side counterpart of `power_density_due_to_thermalization`,
    which represents the thermal-side energy gain from the same process. The sum of
    the two over a flux surface should vanish (energy conservation). Typical magnitudes
    range from $10^3$ to $10^7\,\mathrm{W\,m^{-3}}$ in burning plasma conditions,
    with the highest values near the plasma core where fast-particle densities and
    collision frequencies are greatest.'
  unit: W.m^-3
  physics_domain: fast_particles
  links:
  - name:power_density_due_to_thermalization
  - name:fast_particle_source_due_to_thermalization
  - name:fast_particle_thermalization_rate
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/thermalisation/energy
    dd_path: distributions/distribution/profiles_1d/thermalisation/energy
    status: composed
- name: fast_particle_source_due_to_thermalization
  kind: scalar
  status: draft
  description: Volume-integrated rate at which fast (suprathermal) particles complete
    thermalization and enter the thermal bulk population as a particle source, expressed
    as a particle count per unit time. This quantity is intrinsically non-negative
    under particle-conserving assumptions, representing a one-way transfer from the
    fast-particle distribution to the thermal distribution.
  documentation: 'The thermalization source $S_\mathrm{th}$ represents the volume-integrated
    rate at which suprathermal particles slow down to thermal velocities and are absorbed
    into the bulk plasma distribution. Formally, it is the velocity-space integral
    of the thermalization source term $\dot{f}_\mathrm{th}(\mathbf{v})$ over the thermal
    boundary in velocity space and then over the plasma volume:


    $$S_\mathrm{th} = \int_V \int_{v \leq v_\mathrm{th}} C[f_\mathrm{fast}] \, d^3v
    \, dV$$


    where $C[f_\mathrm{fast}]$ is the collision operator acting on the fast-particle
    distribution $f_\mathrm{fast}$.


    Sign convention: Positive when fast particles are transferring into the thermal
    population (i.e., acting as a particle source for the thermal bulk).


    This quantity is the thermal-population counterpart to `fast_particle_thermalization_rate`,
    which tracks the same process as a sink in the fast-particle particle balance.
    The two quantities are equal in magnitude and opposite in sign only when the process
    is strictly particle-conserving (no ionization recombination or wall recycling
    competing on the same timescale). In reduced transport models where particle conservation
    is not enforced exactly, the two may differ and should not be assumed equivalent.


    Typical values in neutral beam injection (NBI) or ion cyclotron resonance heating
    (ICRH) scenarios range from $10^{18}$ to $10^{21}$ s$^{-1}$ depending on the injected
    power, plasma density, and fast-particle slowing-down time $\tau_s$. The slowing-down
    time scales approximately as $\tau_s \propto T_e^{3/2} / (n_e \ln\Lambda)$, so
    hotter, lower-density plasmas retain fast particles longer before they thermalize.


    This source term appears on the right-hand side of the thermal particle continuity
    equation as a volumetric gain term and feeds directly into transport solver particle
    source arrays. It is distinct from ionization sources (e.g., from neutral beam
    ionization prior to slowing down) and should not include particles that are lost
    to charge exchange or wall interaction before completing thermalization.'
  unit: s^-1
  physics_domain: fast_particles
  links:
  - name:fast_particle_thermalization_rate
  - name:fast_particle_power_density_due_to_thermalization
  constraints: []
  sources:
  - id: dd:distributions/distribution/global_quantities/thermalisation/particles
    dd_path: distributions/distribution/global_quantities/thermalisation/particles
    status: composed
- name: toroidal_component_of_co_passing_particle_current_density
  kind: scalar
  status: draft
  description: Toroidal component of current density carried by co-passing particles,
    including contributions from thermal electron and ion back-currents (drag-currents)
    alongside the primary co-passing population.
  documentation: "The co-passing particle population consists of particles whose magnetic-mirror\
    \ force is insufficient to trap them on the flux surface, and whose guiding-center\
    \ drift is directed co-currently (in the same sense as the plasma current). The\
    \ toroidal current density $j_\\phi^{\\rm co}$ represents the net charge flux\
    \ in the toroidal $\\hat{\\phi}$ direction from this population, encompassing\
    \ both the primary co-passing current and the collisional back-currents induced\
    \ in the thermal electron and ion backgrounds \u2014 the so-called drag-current.\
    \ This total is the relevant quantity for computing net current drive by, for\
    \ example, neutral beam injection or radio-frequency heating, where the driven\
    \ fast-ion current is partially canceled by the thermal back-current. Contrast\
    \ with [toroidal_component_of_co_passing_fast_ion_current_density](name:toroidal_component_of_co_passing_fast_ion_current_density),\
    \ which excludes thermal back-currents and isolates only the fast (non-thermal)\
    \ co-passing ion contribution. The counter-directional analog is [toroidal_component_of_counter_passing_particle_current_density](name:toroidal_component_of_counter_passing_particle_current_density),\
    \ and the magnetically trapped population contributes separately via [toroidal_component_of_trapped_particle_current_density](name:toroidal_component_of_trapped_particle_current_density).\
    \ Together these orbit-class current densities sum toward the total given by [toroidal_component_of_current_density](name:toroidal_component_of_current_density).\
    \ Typical co-passing current densities in neutral-beam-driven tokamak scenarios\
    \ range from $10^4$ to $10^6$ A m$^{-2}$ in the core.\n\nSign convention: Positive\
    \ when the current density is directed in the direction of increasing toroidal\
    \ angle $\\phi$ (co-current direction)."
  unit: A.m^-2
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_co_passing_fast_ion_current_density
  - name:toroidal_component_of_counter_passing_particle_current_density
  - name:toroidal_component_of_trapped_particle_current_density
