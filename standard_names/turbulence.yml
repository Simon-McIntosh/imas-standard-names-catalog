- name: normalized_wave_vector
  kind: vector
  status: active
  description: Dimensionless gyrokinetic wave vector formed by multiplying each component
    of the local fluctuation wave vector by a reference gyroradius, characterizing
    fluctuation scales relative to the ion Larmor radius.
  documentation: 'The normalized wave vector is the dimensionless counterpart of the
    local fluctuation wave vector $\mathbf{k}$ in gyrokinetic theory. Each component
    is obtained by multiplying the corresponding physical wave-vector component by
    a reference gyroradius $\rho_\mathrm{ref}$, the thermal gyroradius of a reference
    ion species:


    $$

    \hat{\mathbf{k}} = \rho_\mathrm{ref}\,\mathbf{k}

    $$


    where $\mathbf{k}$ is the wave vector of a fluctuation. A component of order unity
    indicates structure on gyroradius scales in that direction. In gyrokinetic turbulence
    the fluctuation spectrum is strongly anisotropic: perpendicular components (across
    magnetic-field lines) are of order unity, whereas the [parallel normalized wave
    vector](name:parallel_normalized_wave_vector) along the equilibrium field is much
    smaller, consistent with the gyrokinetic ordering $k_\parallel \rho_\mathrm{ref}
    \ll k_\perp \rho_\mathrm{ref}$. This quantity generalizes over all projections;
    for the specific field-aligned projection see the [parallel normalized wave vector](name:parallel_normalized_wave_vector).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_wave_vector
  arguments:
  - name: wave_vector
    operator: normalized
    operator_kind: qualifier
- name: parallel_normalized_wave_vector
  kind: scalar
  status: active
  description: Dimensionless field-aligned wave-number component obtained by scaling
    the local parallel wave number by a positive reference gyroradius.
  documentation: 'The parallel normalized wave-vector component is the projection
    of a local fluctuation wave vector onto the magnetic-field direction, expressed
    relative to a reference gyroradius. It describes phase variation along field lines
    and is the field-aligned component of the [normalized wave vector](name:normalized_wave_vector).


    It is defined by


    $$

    k_{\parallel}^{\mathrm{norm}} = \rho_{\mathrm{ref}} k_{\parallel} = \rho_{\mathrm{ref}}\,\mathbf{k}\cdot\hat{\mathbf{b}}

    $$


    where $k_{\parallel}$ is the parallel wave number in inverse meters, $\mathbf{k}$
    is the local wave vector in inverse meters, $\hat{\mathbf{b}}$ is the local magnetic-field
    unit vector, and $\rho_{\mathrm{ref}}$ is a positive reference gyroradius in meters.
    The quantity is dimensionless; it excludes perpendicular wave-vector projections,
    which describe variation across the magnetic field.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_wave_vector
  arguments:
  - name: normalized_wave_vector
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
