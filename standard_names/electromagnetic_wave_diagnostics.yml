- name: vertical_wave_electric_field
  kind: scalar
  status: draft
  description: Complex phasor component of the electromagnetic-wave electric field
    projected onto the vertical Z direction at the measurement position in the right-handed
    cylindrical (R, phi, Z) frame. It represents the signed vertical polarization
    component, not an instantaneous field value.
  documentation: 'The vertical wave electric field $E_Z$ is the complex phasor component
    of an electromagnetic-wave electric-field vector along $\hat{Z}$, the vertical
    basis vector of the right-handed cylindrical $(R, \phi, Z)$ frame. It is a coordinate
    projection, not a separate wave mode; together with [radial_wave_electric_field](name:radial_wave_electric_field)
    and [toroidal_wave_electric_field](name:toroidal_wave_electric_field), it describes
    the polarization of [wave_electric_field](name:wave_electric_field) in that frame.


    The component is defined by the scalar projection of the complex wave electric-field
    phasor onto the vertical basis vector:


    $$

    E_Z = \mathbf{E}_w \cdot \hat{Z}

    $$


    where $\mathbf{E}_w$ is the complex wave electric-field phasor in $\mathrm{V\,m^{-1}}$,
    $\hat{Z}$ is a dimensionless unit vector, and $E_Z$ has units $\mathrm{V\,m^{-1}}$.
    The phasor represents time dependence as $\exp(-i\omega t)$, so the observable
    vertical field is $\operatorname{Re}[E_Z\exp(-i\omega t)]$; the real and imaginary
    parts of $E_Z$ are the in-phase and quadrature vertical components.


    In practice, $E_Z$ is obtained by determining the complex wave electric-field
    vector from diagnostic measurements or electromagnetic-wave modeling and then
    projecting it onto $\hat{Z}$. The definition is independent of wave branch: for
    a lower-hybrid, electron-cyclotron, ion-cyclotron, or other electromagnetic wave,
    it is the vertical component of that same wave phasor. Parallel components such
    as [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    instead project onto the magnetic-field direction, while circularly polarized
    components use a rotating polarization basis.


    No branch-independent absolute range is intrinsic to this component; amplitudes
    depend on launched power, plasma conditions, position, and diagnostic calibration.
    The value may be zero for a purely horizontal electric-field polarization and
    may approach $|\mathbf{E}_w|$ when the wave electric field is predominantly vertical;
    the ratio $|E_Z|/|\mathbf{E}_w|$ lies between 0 and 1 when the orthonormal cylindrical
    components are complete.


    Sign convention: Positive when a real-valued phasor coefficient for this component,
    such as its real or imaginary part, represents an electric-field vector contribution
    in the $+\hat{Z}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_electric_field
  - name:toroidal_wave_electric_field
  - name:wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/e_field_lh_z
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/e_field_lh_z
    status: composed
