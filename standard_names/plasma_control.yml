- name: major_radius_of_diagnostic_antenna
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the second endpoint defining the line
    of sight for a diagnostic system.
  documentation: 'The major radius coordinate $R$ of the second point on a diagnostic
    line of sight positions the far endpoint of the viewing chord in the IMAS right-handed
    cylindrical $(R, \phi, Z)$ frame. This quantity is used to define the trajectory
    of the sightline from the first point (typically the entry point into the vessel)
    to the second point (the far end, e.g., opposing wall or far-field location).
    The coordinate is specified in the same equatorial-plane geometry used for all
    line-of-sight diagnostics such as bolometers, spectrometers, and visible cameras,
    ensuring consistent ray tracing across systems. Typical values range from 1.5
    m to 2.5 m for the major radius of the second point in medium-size tokamaks, depending
    on the port location and viewing geometry. See also [major radius of sensor attachment
    point](name:major_radius_of_sensor_attachment_point) for the entry-point coordinate.


    Sign convention: Positive when the second point lies at a larger major radius
    than the machine symmetry axis.


    The second point, together with the first point, defines a straight line in space
    through which the diagnostic observes the plasma. The accuracy of this coordinate
    directly affects the spatial localization of measurements such as electron density
    and temperature profiles.'
  unit: m
  physics_domain: plasma_control
