- name: accumulated_krypton_count
  kind: scalar
  status: draft
  description: Cumulative number of krypton atoms injected into the machine since
    plasma breakdown, expressed in equivalent electrons.
  documentation: 'The accumulated krypton count is the running total of krypton atoms
    introduced since plasma breakdown, converted to an electron-equivalent basis where
    each krypton atom contributes $Z_{\rm Kr} = 36$ electron equivalents when fully
    stripped of its bound electrons.


    The quantity is obtained by integrating the instantaneous injection rate $\dot{N}_{\rm
    Kr}$ over time from the moment of plasma breakdown $t_0$:


    $$

    N_{\rm Kr,eq} = Z_{\rm Kr} \int_{t_0}^{t} \dot{N}_{\rm Kr}(t'') \, dt''

    $$


    where $Z_{\rm Kr} = 36$ is the atomic number of krypton and $\dot{N}_{\rm Kr}$
    is in atoms per second. This is distinct from the prefill-phase contribution captured
    by [krypton_prefill_count](name:krypton_prefill_count), which records only the
    gas load introduced before breakdown. Krypton serves as a heavy radiative seed
    impurity for power exhaust management and as a disruption mitigation agent; the
    cumulative injection inventory is therefore essential for interpreting bolometric
    radiated-power fractions and spectroscopic charge-state distributions throughout
    the discharge. Analogous running totals are defined for other injected species,
    including [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Sign convention: Positive when krypton has been cumulatively injected into the
    plasma since breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:krypton_prefill_count
  - name:accumulated_neon_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/krypton/value
    dd_path: summary/gas_injection_accumulated/krypton/value
    status: composed
- name: accumulated_neon_count
  kind: scalar
  status: draft
  description: Cumulative number of neon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons.
  documentation: "The accumulated neon count is the running temporal integral of the\
    \ neon gas injection rate from plasma breakdown onward, giving the total neon\
    \ inventory delivered to the plasma vessel over the discharge. Each injected neon\
    \ atom contributes to the tally in equivalent-electron units \u2014 the raw particle\
    \ count scaled by the neon atomic number $Z_\\mathrm{Ne} = 10$ \u2014 enabling\
    \ direct comparison with other injected fuel and impurity species.\n\nThe defining\
    \ integral is:\n\n$$\nN_\\mathrm{acc}(t) = Z_\\mathrm{Ne} \\int_{t_0}^{t} \\dot{n}_\\\
    mathrm{Ne}(t') \\, dt'\n$$\n\nwhere $\\dot{n}_\\mathrm{Ne}$ is the instantaneous\
    \ neon injection rate in atoms per second, $t_0$ is the time of plasma breakdown,\
    \ and $Z_\\mathrm{Ne} = 10$ is the neon atomic number.\n\nThis quantity is determined\
    \ from calibrated gas valve flow measurements integrated temporally throughout\
    \ the discharge. It is particularly relevant in impurity seeding and disruption\
    \ mitigation experiments where the cumulative neon dose governs radiated power\
    \ fractions and pedestal stability.\n\nThe parent [neon_count](name:neon_count)\
    \ provides phase-specific or instantaneous counts; [neon_prefill_count](name:neon_prefill_count)\
    \ covers the pre-breakdown injection phase exclusively. Analogous accumulated\
    \ quantities for other injected species include [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ and [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection).\n\
    \nSign convention: Positive when neon gas is injected, so the accumulated count\
    \ increases monotonically from zero at plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:neon_count
  - name:neon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/neon/value
    dd_path: summary/gas_injection_accumulated/neon/value
    status: composed
- name: major_radius_of_pellet_path_point
  kind: scalar
  status: draft
  description: "Major radius (R) coordinate of a point along the pellet injection\
    \ path, giving the radial distance from the machine toroidal symmetry axis in\
    \ the cylindrical (R, \u03C6, Z) frame."
  documentation: "The major radius of a pellet path point is the radial distance $R$\
    \ from the toroidal symmetry axis to a discrete location along the trajectory\
    \ of an injected pellet or shattered pellet injector (SPI) fragment, expressed\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame where $R$ increases outward\
    \ from the machine axis.\n\nTogether with [vertical_coordinate_of_pellet_path_point](name:vertical_coordinate_of_pellet_path_point)\
    \ (the $Z$ component) and [toroidal_angle_of_along_pellet_path](name:toroidal_angle_of_along_pellet_path)\
    \ (the $\\phi$ component), this coordinate fully specifies the three-dimensional\
    \ position of a point on the pellet or SPI fragment trajectory. The radial coordinate\
    \ determines how far from the plasma center the injected material deposits fuel\
    \ or impurity species, directly governing the radial deposition profile.\n\nPellet\
    \ path geometry is defined by discrete anchor points \u2014 such as the injector\
    \ exit and, for SPI systems, the shattering position \u2014 with the trajectory\
    \ reconstructed from optical pellet diagnostics or injection geometry specifications.\
    \ For SPI applications, the shattering-position $R$ value locates where the intact\
    \ pellet transitions into a dispersing fragment cloud.\n\nTypical values range\
    \ from about 1.5 m in compact tokamaks to beyond 6 m in large devices, bounded\
    \ below by the first-wall major radius and above by the outer vessel radius.\n\
    \nSign convention: Positive when $R$ is measured radially outward from the machine\
    \ toroidal symmetry axis, as defined in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame; $R \\geq 0$ for all physically realizable positions."
  unit: m
  physics_domain: plant_systems
  links:
  - name:vertical_coordinate_of_pellet_path_point
  - name:toroidal_angle_of_along_pellet_path
  sources:
  - id: dd:spi/injector/shattering_position/r
    dd_path: spi/injector/shattering_position/r
    status: composed
