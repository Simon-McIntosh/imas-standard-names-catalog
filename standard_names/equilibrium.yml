- name: toroidal_magnetic_flux
  kind: scalar
  status: active
  description: Toroidal magnetic flux is the signed surface integral of the magnetic
    field over the poloidal cross-section enclosed by a nested magnetic flux surface.
  documentation: 'Toroidal magnetic flux is the signed surface integral of the magnetic
    field over the poloidal cross-section enclosed by a nested magnetic flux surface.
    It is the toroidal member of the [magnetic flux](name:magnetic_flux) family and
    is defined as a function of nested magnetic surfaces in axisymmetric equilibrium.


    The defining surface integral is:


    $$

    \Phi_{\mathrm{tor}}(\mathcal{S}) = \int_{S_{\mathrm{pol}}(\mathcal{S})} \mathbf{B}
    \cdot d\mathbf{A}

    $$


    where $\Phi_{\mathrm{tor}}(\mathcal{S})$ is the toroidal magnetic flux associated
    with the nested magnetic flux surface $\mathcal{S}$, $S_{\mathrm{pol}}(\mathcal{S})$
    is the poloidal cross-section bounded by that surface at fixed toroidal angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle, $Z$ is vertical height, $\mathbf{B}$ is the magnetic-field
    vector, and $d\mathbf{A}$ is the oriented area element whose positive normal is
    $+\hat{\phi}$.


    The scope is the total toroidal projection of magnetic flux through the entire
    enclosed poloidal cross-section for each nested magnetic surface. It is not a
    local magnetic-field value, not a flux-surface average, and not a source-separated
    contribution; [toroidal magnetic flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary)
    is the boundary-specific value of the same quantity.


    At the magnetic axis the enclosed poloidal cross-section shrinks to zero area,
    so $\Phi_{\mathrm{tor}}=0$ there. Together with [poloidal magnetic flux](name:poloidal_magnetic_flux)
    $\psi$, it provides a radial flux-surface label; the [safety factor](name:safety_factor)
    $q$ is related to the two fluxes by the differential relation $q = d\Phi_{\mathrm{tor}}/d\psi$
    for consistent flux definitions.


    Sign convention: Positive when the net magnetic flux through the poloidal cross-section
    is directed along increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-phi
    dd_documentation:
      leaf: Toroidal flux
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: Wb
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of profiles 1d."
      kind: template
  - dd_path: sawteeth/profiles_1d/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/sawteeth.html#sawteeth-profiles_1d-phi
    dd_documentation:
      leaf: Toroidal flux
      parent_path: sawteeth/profiles_1d
