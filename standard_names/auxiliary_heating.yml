- name: absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Net coherent-wave power absorbed by the plasma from one beam-tracing
    beam over its computed trajectory. It is the final path-integrated, species-summed
    deposited power, equal to the beam power entering the path minus the residual
    wave power at the end.
  documentation: 'Absorbed power of a beam-tracing beam is the net coherent-wave power
    transferred from one traced beam to the plasma over its computed propagation path.
    It is the final path-integrated total for that single beam, summed over all absorbing
    species, and is distinct from scenario-level [absorbed power](name:absorbed_power)
    obtained by summing over beams or launchers.


    For a ray arc length $s$ increasing along the direction of wave propagation, the
    endpoint absorbed power is


    $$

    P_{\mathrm{abs}} = P_0 - P_{\mathrm{end}} = P_0\left[1 - \exp\left(-2\int_{s_0}^{s_{\mathrm{end}}}
    \kappa_i^{\mathrm{tot}}(s)\,ds\right)\right]

    $$


    where $P_0$ is the [launched power] or entering beam power in W, $P_{\mathrm{end}}$
    is the residual [power of the beam-tracing beam](name:power_of_beam_tracing_beam)
    at the end of the path in W, $s_0$ and $s_{\mathrm{end}}$ are the start and end
    arc-length positions in m, and $\kappa_i^{\mathrm{tot}}$ is the species-summed
    spatial amplitude-damping coefficient along the ray in m^-1. The factor of 2 appears
    because wave power is proportional to squared wave-field amplitude; positive damping
    therefore makes the remaining beam power decrease along increasing $s$.


    In practice this quantity is computed by integrating local absorption along the
    beam-tracing trajectory using the plasma dielectric response and the wave dispersion
    relation. Species-resolved channels such as [electron absorbed power](name:electron_absorbed_power_of_beam_tracing_beam),
    [ion absorbed power], and [ion-state absorbed power](name:ion_state_absorbed_power_of_beam_tracing_beam)
    may be evaluated separately and summed to recover the total for the beam.


    Typical values are bounded by 0 W and the power assigned to the traced beam. They
    can be near 0 W for weak damping or missed resonance, and can approach the assigned
    launched or entering power for strongly absorbed paths; in weighted beam-tracing
    calculations this can span roughly 10^0-10^6 W per traced beam depending on launcher
    power and beam subdivision.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power
  - name:power_of_beam_tracing_beam
  - name:electron_absorbed_power_of_beam_tracing_beam
  - name:ion_state_absorbed_power_of_beam_tracing_beam
  sources:
  - id: derived:absorbed_power_of_beam_tracing_beam
    status: composed
- name: beam_area_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Area of the active ion-source emission face of a neutral beam injector.
    It is defined before downstream neutralization and sets the source cross-section
    used to normalize extracted beam current density.
  documentation: 'Beam area of a neutral beam injector is the total active area of
    the ion-source emission face from which ions are extracted into the accelerator.
    It describes the source-side geometric cross-section of the charged beam before
    the neutralizer, not the area of the beam after neutralization or after downstream
    divergence.


    For an emitting surface $S_\mathrm{emit}$, the beam area $A_\mathrm{beam}$ is


    $$

    A_\mathrm{beam} = \int_{S_\mathrm{emit}} dA

    $$


    where $dA$ is an element of the active emitting surface. For a multi-aperture
    or beamlet source, this integral is evaluated over the union of the active emitting
    apertures or over the effective emitting patches defined by the source model.


    The quantity is obtained from the ion-source and extraction-grid geometry, mechanical
    metrology, or an effective optical model of the source. It is closely related
    to the source-surface quantity [area_of_neutral_beam_injector](name:beam_area_of_neutral_beam_injector);
    the `beam_area` wording emphasizes its use as the normalization area for beam
    extraction, for example the average extracted ion current density $\langle j_i
    \rangle = I_i/A_\mathrm{beam}$ for total extracted ion current $I_i$.


    Typical values for heating neutral beam injectors are about 0.03-1 m^2. Compact
    diagnostic or test sources may be 10^{-4}-10^{-2} m^2, while large negative-ion
    heating sources can approach 1-2 m^2.'
  unit: m^2
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:nbi/unit/source/surface
    dd_path: nbi/unit/source/surface
    status: composed
- name: beam_major_radius_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Major radius R, in the right-handed cylindrical (R, phi, Z) frame,
    at which the central ray of a beam-tracing beam is tangent to a toroidal circle.
    It is a geometric launch parameter, not a statement about absorption, deposition,
    or current drive.
  documentation: 'Beam major radius is the value of major radius $R$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame at which the central ray of a beam-tracing beam
    is tangent to a toroidal circle. Here $R$ is distance from the toroidal symmetry
    axis, $Z$ is vertical height, and a toroidal circle is a curve of constant $R$
    and $Z$ with tangent direction $\hat{\phi}$.


    The geometrical tangency condition for a true spatial tangency can be written
    for a central ray parameterized by arclength $s$ as:


    $$

    R_\mathrm{tan}=R(s_\mathrm{tan}), \qquad \left.\frac{dR}{ds}\right|_{s_\mathrm{tan}}=0,
    \qquad \left.\frac{dZ}{ds}\right|_{s_\mathrm{tan}}=0

    $$


    where $R_\mathrm{tan}$ is the beam major radius and $s_\mathrm{tan}$ is the arclength
    at the tangency point. At this point the remaining tangent component is toroidal,
    so the ray direction is parallel or antiparallel to $\hat{\phi}$; if only the
    horizontal projected tangency of an inclined ray is specified, $R_\mathrm{tan}$
    is the major radius of that projection in the $(R, \phi)$ plane of the same right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The value is computed from the specified launch geometry or from the central ray
    trajectory by locating the tangency point. For a straight central ray this is
    equivalent to finding the closest approach of its horizontal projection to the
    toroidal symmetry axis; for a curved ray it is found along the traced trajectory.
    It complements the radial and toroidal wave-vector components of a beam-tracing
    beam, which describe the local propagation direction rather than this tangency
    radius.


    Typical values are comparable to device and plasma major radii: about 0.2-1.5
    m in compact devices, 1-4 m in medium-size tokamaks, and 4-8 m in large tokamaks
    or large external launch geometries. More radial launch geometry gives a smaller
    tangency radius, while more tangential launch geometry gives a value closer to
    the launch or plasma major radius.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:beam_major_radius_of_neutral_beam_injector
  sources:
  - id: dd:nbi/unit/beamlets_group/beamlets/tangency_radii
    dd_path: nbi/unit/beamlets_group/beamlets/tangency_radii
    status: composed
- name: beam_major_radius_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Tangency radius of the nominal central beamline of a neutral beam injector.
    It is the major radius of the toroidal circle coaxial with the machine symmetry
    axis that is tangent to the beamline in horizontal projection.
  documentation: 'The beam major radius of a neutral beam injector is the tangency
    radius $R_\mathrm{tan}$ of the nominal central neutral beamline. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height, it is the radius of the toroidal circle centered
    on the machine symmetry axis that is tangent to the horizontal projection of that
    beamline. This quantity is an unsigned geometric distance, so it does not by itself
    encode whether the injector is co-directed or counter-directed relative to increasing
    $\phi$.


    Equivalently, in the right-handed Cartesian basis $(\hat{x}, \hat{y}, \hat{z})$
    with $\hat{z}=\hat{Z}$ vertical and the $z$ axis coincident with the machine symmetry
    axis, let $(x_0,y_0)$ be any point on the horizontal projection of the central
    beamline and let $\mathbf{u}_\perp=(u_x,u_y)$ be its projected direction. The
    tangency radius is the perpendicular distance from the symmetry axis to that projected
    line:


    $$

    R_\mathrm{tan} = \frac{|x_0 u_y - y_0 u_x|}{\sqrt{u_x^2+u_y^2}}

    $$


    where $x_0$ and $y_0$ are measured in meters, and $u_x$ and $u_y$ are dimensionless
    direction cosines; the same expression also applies to arbitrary scaled direction
    components because the scale cancels. If a signed tangency parameter is formed
    for orbit or momentum calculations, the sign of $x_0u_y-y_0u_x$ is positive for
    motion in the direction of increasing toroidal angle $\phi$ (counter-clockwise
    when viewed from $+\hat{Z}$) and negative for the opposite direction.


    The nominal value is determined from the injector mechanical survey, port geometry,
    and alignment of the central beam axis. Perturbed or time-dependent steering geometry
    is described separately by [perturbed beam major radius of neutral beam injector](name:perturbed_beam_major_radius_of_neutral_beam_injector),
    while beam-tracing models may use the corresponding [beam major radius of beam
    tracing beam](name:beam_major_radius_of_beam_tracing_beam). The associated vertical
    placement of the injection geometry is characterized by the [vertical coordinate
    of neutral beam injector](name:vertical_coordinate_of_neutral_beam_injector).


    Typical tokamak values range from about 0-8 m. Nearly radial injectors can have
    $R_\mathrm{tan}$ close to 0 m, compact and medium-size devices often use 0.2-3
    m, and large or strongly tangential injectors can use 3-8 m, with $R_\mathrm{tan}$
    commonly comparable to the plasma major radius for the most tangential geometries.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:perturbed_beam_major_radius_of_neutral_beam_injector
  - name:vertical_coordinate_of_neutral_beam_injector
  sources:
  - id: dd:nbi/unit/beamlets_group/tangency_radius
    dd_path: nbi/unit/beamlets_group/tangency_radius
    status: attached
  - id: dd:summary/heating_current_drive/nbi/tangency_radius/value
    dd_path: summary/heating_current_drive/nbi/tangency_radius/value
    status: attached
- name: current_due_to_neutral_beam_injection
  kind: scalar
  status: draft
  description: Non-inductive toroidal plasma current produced by neutral beam injection
    through directed momentum transfer from fast beam ions to the background plasma
    during Coulomb-collision thermalization.
  documentation: 'Current due to neutral beam injection is the neutral-beam contribution
    to the total non-inductive plasma current, current_due_to_non_inductive_current_drive.
    Injected neutrals are ionized in the plasma, become energetic fast ions, and transfer
    directed momentum to electrons and ions as they slow down, producing a net driven
    current.


    At a global level, the driven current can be represented as the integral of a
    local NBI current-drive source density over the confined plasma volume:


    $$

    I_{\mathrm{NBI}} = \int_{V_p} S_{I,\mathrm{NBI}}(\mathbf{x})\, dV

    $$


    where $I_{\mathrm{NBI}}$ is the total NBI-driven current, $S_{I,\mathrm{NBI}}$
    is the local driven-current source density in $\mathrm{A\,m^{-3}}$, $\mathbf{x}$
    is position, $V_p$ is the plasma volume, and $dV$ is a volume element in $\mathrm{m^3}$.


    In practice this quantity is computed from neutral-beam deposition, ionization,
    fast-ion orbit and slowing-down physics, pitch-angle scattering, collisional momentum
    exchange, and the plasma equilibrium. It depends strongly on the injected and
    absorbed neutral-beam power, power_due_to_neutral_beam_injection and absorbed_power_of_neutral_beam_injector,
    as well as beam energy, tangency geometry, fast-ion confinement, electron temperature,
    density, and trapped-particle fraction.


    Typical values range from $1\times10^4$-$1\times10^6$ A in present-day tokamaks,
    with lower values for weak or poorly aligned beams and values near or above $1\times10^6$
    A in large, high-power, high-temperature plasmas.


    Sign convention: Positive when the toroidal projection of the driven parallel
    plasma current flows in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$,
    where $R$ is major radius, $\phi$ increases counter-clockwise when viewed from
    above $+\hat{Z}$, and $Z$ is vertical height.'
  unit: A
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:summary/heating_current_drive/nbi/current/value
    dd_path: summary/heating_current_drive/nbi/current/value
    status: composed
- name: electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative net power transferred to electrons within the plasma volume
    enclosed by a specified magnetic flux surface. It sums power delivered to fast
    suprathermal electrons and to the bulk thermal electron population.
  documentation: 'Electron power at inside flux surface is the cumulative net rate
    of energy transfer to all electron populations within the plasma volume enclosed
    by a specified magnetic flux surface. It is an enclosed-volume quantity: each
    surface includes all electron power deposition inside it, and the sum of fast
    and thermal electron components gives the total electron-channel contribution.


    The quantity is defined by integrating the flux-surface-averaged net electron
    power deposition density over enclosed volume, using the flux coordinate $\rho_\mathrm{tor,norm}$,
    the dimensionless normalized toroidal flux radius:


    $$

    P_e(\rho_s) = \int_0^{\rho_s} \left\langle q_e \right\rangle_{\rho} \frac{dV}{d\rho}
    \, d\rho

    $$


    where $P_e$ is the enclosed electron power in W, $\rho_s$ labels the bounding
    flux surface, $\left\langle q_e \right\rangle_{\rho}$ is the flux-surface-averaged
    net electron power deposition density in W m$^{-3}$, and $dV/d\rho$ is the differential
    enclosed volume in m$^3$ per unit $\rho_\mathrm{tor,norm}$. The derivative $dP_e/d\rho
    = \left\langle q_e \right\rangle_{\rho} dV/d\rho$ is a power per unit normalized
    flux radius, not a volumetric density by itself.


    In practice, local electron energy-transfer rates are mapped to magnetic flux
    surfaces from wave absorption, fast-particle slowing down, collisional exchange,
    or power-balance calculations, then flux-surface averaged and integrated outward
    from the magnetic axis. The decomposition corresponds to [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface)
    for suprathermal electrons plus [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface)
    for the bulk thermal electron population; at the outer closed surface it can be
    compared with [total_electron_power](name:total_electron_power) when the same
    source set and plasma volume are used.


    Typical enclosed electron powers are 10^4-10^6 W in small or low-power experiments,
    10^5-10^7 W for individual electron-heating systems in medium-size tokamaks, and
    10^7-10^8 W in high-power or reactor-scale scenarios. For purely deposited auxiliary
    power, the value generally rises from about 0 W near the magnetic axis to the
    electron-channel total at the outer closed surface; decreases with increasing
    $\rho_\mathrm{tor,norm}$ or negative values indicate net electron cooling or transfer
    of energy from electrons to another channel.


    Sign convention: Positive when net power is transferred to the electron population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_at_inside_flux_surface
  - name:fast_electron_power_at_inside_flux_surface
  - name:thermal_electron_power_at_inside_flux_surface
  - name:total_electron_power
  - name:total_plasma_radiated_power
- name: fast_electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by non-thermal fast electrons inside
    a specified magnetic flux surface, equal to the enclosed-volume integral of the
    local fast-electron power-deposition density.
  documentation: 'Fast-electron power inside a flux surface is the cumulative rate
    at which coherent-wave energy is absorbed by non-thermal electrons in the plasma
    volume enclosed by a closed magnetic surface. It represents the fast-electron
    part of the auxiliary wave-power deposition, distinct from deposition on thermal
    electrons or ions. The surface label should be an explicitly named flux coordinate,
    for example $(\psi,\theta,\phi)$ or $(\rho_{\mathrm{tor,norm}},\theta,\phi)$,
    where $\theta$ is a poloidal angle and $\phi$ is the toroidal angle of the right-handed
    cylindrical $(R,\phi,Z)$ frame with $R$ major radius and $Z$ vertical height.


    For a selected flux surface labeled by $\chi_s$, the enclosed fast-electron power
    is the volume integral


    $$

    P_{\mathrm{fast}\,e}^{\mathrm{inside}}(\chi_s)=\int_{\Omega_s} p_{\mathrm{fast}\,e}(\mathbf{x})\,dV

    $$


    where $\chi$ is the chosen flux-surface label, $\Omega_s$ is the plasma volume
    enclosed between the magnetic axis and the surface $\chi=\chi_s$, $p_{\mathrm{fast}\,e}$
    is the local [fast_electron_power_density](name:fast_electron_power_density) in
    W m$^{-3}$, $dV$ is a volume element in m$^3$, and the result is in W.


    In practice this quantity is obtained by integrating a local fast-electron wave-power
    deposition density over reconstructed magnetic-flux-surface volumes. Together
    with [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface),
    it describes how absorbed wave power is partitioned within the electron population;
    at the outermost closed flux surface it corresponds to the global [fast_electron_power](name:fast_electron_power)
    for the same absorption definition. The analogous non-thermal ion quantity is
    [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_state_power_at_inside_flux_surface),
    and all such channels contribute to the overall auxiliary-heating power balance
    represented by quantities such as [total_electron_power](name:total_electron_power).


    Representative magnitudes range from near 0 W on surfaces enclosing little or
    no fast-electron absorption to the order of the coupled auxiliary-wave power.
    Depending on device size and heating scenario, enclosed fast-electron powers can
    span roughly 10^3-10^7 W, with megawatt-scale values possible when wave absorption
    is dominated by non-thermal electrons.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_density
  - name:thermal_electron_power_at_inside_flux_surface
  - name:electron_power_at_inside_flux_surface
  - name:fast_electron_power
  - name:fast_ion_power_at_inside_flux_surface
  arguments:
  - name: electron_power_at_inside_flux_surface
    operator: fast
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_fast
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_fast
    status: composed
- name: fast_ion_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the fast (non-thermal) ion population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Fast-ion power at inside flux surface quantifies the running volume
    integral of RF wave power deposited into the suprathermal (non-thermal) ion population,
    profiling the radial distribution of enclosed fast-ion wave absorption. It forms
    the fast-ion component of [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface),
    which includes both this quantity and the complementary thermal-ion contribution
    captured by [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface).


    The enclosed fast-ion power is defined as:


    $$

    P_\mathrm{fast}(\psi) = \int_{V(\psi)} Q_\mathrm{fast}(\mathbf{r})\, dV

    $$


    where $Q_\mathrm{fast}$ is the volumetric fast-ion wave power deposition density
    and $V(\psi)$ is the plasma volume enclosed within the flux surface at poloidal
    flux coordinate $\psi$.


    This quantity arises primarily in scenarios such as ion cyclotron resonance heating,
    where waves resonantly accelerate minority ions to suprathermal energies and sustain
    a non-Maxwellian tail population. The profile of $P_\mathrm{fast}(\psi)$ accumulates
    with increasing enclosed volume, saturating at the total fast-ion absorbed power
    at the last closed flux surface. For the charge-state-resolved counterpart, see
    [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_state_power_at_inside_flux_surface);
    the local deposition density from which this integral is constructed is given
    by [fast_ion_power_density](name:fast_ion_power_density).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:fast_ion_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_fast
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_fast
    status: composed
- name: fast_ion_state_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by fast (non-thermal) ions of a specified
    charge state within the plasma volume enclosed by a selected magnetic flux surface.
  documentation: 'Fast ion state power at an inside flux surface quantifies the net
    wave energy per unit time deposited in the suprathermal (fast) population of a
    single specified ion charge state, accumulated over all plasma volume enclosed
    by a chosen flux surface. It is the fast-ion component of the total ion-state
    absorbed power [ion_state_power_at_inside_flux_surface](name:ion_state_power_at_inside_flux_surface);
    its thermal-ion counterpart is [thermal_ion_state_power_at_inside_flux_surface](name:thermal_ion_state_power_at_inside_flux_surface).


    The cumulative power is the volume integral of the local fast-ion absorption density
    $p_{\text{fast},s}$ over the plasma volume enclosed by the flux surface labeled
    $\rho$:


    $$

    P_{\text{fast},s}(\rho) = \int_{V(\rho)} p_{\text{fast},s}(\mathbf{r}) \, dV

    $$


    where $V(\rho)$ is the volume enclosed by the flux surface and $p_{\text{fast},s}$
    is the local fast-ion absorbed power density for charge state $s$, the volumetric
    counterpart [fast_ion_state_power_density](name:fast_ion_state_power_density).


    This quantity is computed by RF wave-kinetic or full-wave codes that resolve the
    resonant energy exchange between the wave field and the non-Maxwellian fast-ion
    distribution on a per-charge-state basis, as occurs in ICRH minority heating and
    mode-conversion schemes. Aggregating over all charge states and ion species yields
    [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface).
    The toroidal-mode-resolved complement [per_toroidal_mode_fast_ion_state_power](name:per_toroidal_mode_fast_ion_state_power)
    decomposes the same cumulative power by toroidal harmonic when the wave field
    is represented as a Fourier series in toroidal angle $\phi$.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_state_power_at_inside_flux_surface
