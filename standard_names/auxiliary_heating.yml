- name: absorbed_power_due_to_electron_cyclotron_heating
  kind: scalar
  status: draft
  description: Net electron cyclotron heating power coupled to the plasma, summed
    over all gyrotron launchers.
  documentation: "The total power absorbed by the plasma from electron cyclotron resonance\
    \ heating (ECRH) and electron cyclotron current drive (ECCD), integrated over\
    \ the entire plasma volume and summed across all launchers. This quantity represents\
    \ the net heating power delivered to the electron population via cyclotron damping\
    \ of injected microwave beams at the fundamental or second harmonic of the electron\
    \ cyclotron frequency. Typical values range from megawatts in present-day tokamaks\
    \ (e.g., 1\u20136 MW in DIII-D, ASDEX Upgrade) to tens of megawatts projected\
    \ for reactor-grade devices like ITER (up to 20 MW). The absorbed power is related\
    \ to the launched power $P_{\\rm launch}$ by the coupling efficiency $\\eta =\
    \ P_{\\rm abs} / P_{\\rm launch}$, typically 70\u201390% depending on plasma density,\
    \ temperature, and launcher alignment. See also [absorbed_power_due_to_ion_cyclotron_heating](name:absorbed_power_due_to_ion_cyclotron_heating)\
    \ and [absorbed_power_due_to_lower_hybrid_current_drive](name:absorbed_power_due_to_lower_hybrid_current_drive)\
    \ for other RF heating channels."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_due_to_ion_cyclotron_heating
  - name:absorbed_power_due_to_lower_hybrid_current_drive
  sources:
