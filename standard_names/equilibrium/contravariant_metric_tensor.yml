name: contravariant_metric_tensor
description: Contravariant components $g^{ij}$ of the metric tensor evaluated on the
  equilibrium coordinate grid.
documentation: "The contravariant metric tensor $g^{ij}$ ($i,j \\in \\{1,2,3\\}$)\
  \ encodes the inverse geometry of the curvilinear coordinate system used in the\
  \ equilibrium representation. For a coordinate set $(x^1, x^2, x^3)$ mapped to cylindrical\
  \ $(R, Z, \\phi)$, the components satisfy $g^{ij} = \\sum_k (\\partial x^i / \\\
  partial X^k)(\\partial x^j / \\partial X^k)$, where $X^k$ are Cartesian coordinates.\
  \ These coefficients appear in the flux-coordinate form of the Grad\u2013Shafranov\
  \ equation, in particular in the expression for $|\\nabla \\psi|^2 = g^{11}(\\partial\
  \ \\psi / \\partial x^1)^2 + \\ldots$, and are essential for evaluating differential\
  \ operators (gradient, divergence, Laplacian) on the equilibrium grid. The six independent\
  \ components ($g^{11}$, $g^{12}$, $g^{13}$, $g^{22}$, $g^{23}$, $g^{33}$) are stored\
  \ per grid point; their covariant counterparts form the inverse matrix $g_{ij}$.\
  \ Typical applications include transport-code coupling and MHD stability analysis\
  \ on flux-coordinate grids. See `covariant_metric_tensor` for the dual representation\
  \ and `grid_object_geometry` for the underlying mesh specification."
