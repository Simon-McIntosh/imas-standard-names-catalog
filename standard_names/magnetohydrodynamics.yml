- name: poloidal_perturbed_plasma_velocity
  kind: scalar
  status: draft
  description: Poloidal component of the complex first-order plasma velocity perturbation
    eigenfunction in linear MHD stability analysis, projected onto the poloidal direction
    in the flux-coordinate frame (rho, theta, phi) for a single toroidal Fourier mode.
  documentation: 'The poloidal perturbed plasma velocity is the $\theta$-directed
    component of the linearized plasma velocity perturbation eigenfunction $\delta\mathbf{v}(\mathbf{r})$,
    obtained by projecting the full complex perturbation vector onto the poloidal
    basis direction in the flux-coordinate frame $(\rho, \theta, \phi)$, where $\rho$
    is a radial flux surface label and $\theta$ is the poloidal angle. It characterizes
    the oscillatory poloidal plasma flow about a magnetohydrostatic equilibrium for
    a specified toroidal Fourier mode number $n$, encoding both the spatial amplitude
    and phase variation of that flow component along and across flux surfaces.


    The physical perturbation follows the eigenfunction ansatz:


    $$

    \delta v_\theta(\rho, \theta, \phi, t) = \mathrm{Re}\!\left[\delta\hat{v}_\theta(\rho,
    \theta)\, e^{i(n\phi - \omega t)}\right]

    $$


    where $\delta\hat{v}_\theta(\rho, \theta)$ is the complex poloidal amplitude profile,
    $n$ is the toroidal mode number, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $\omega$ is the complex MHD eigenfrequency
    whose imaginary part gives the mode growth or damping rate.


    The complex amplitude decomposes into its [real part](name:poloidal_perturbed_plasma_velocity_real_part)
    and [imaginary part](name:poloidal_perturbed_plasma_velocity_imaginary_part),
    which together specify the amplitude and spatial phase of the poloidal velocity
    oscillation at each point on a flux surface. Alongside the [radial component](name:radial_perturbed_plasma_velocity_real_part)
    and the [toroidal component](name:toroidal_perturbed_plasma_velocity_real_part),
    the poloidal projection completes the velocity eigenfunction and supports incompressibility
    assessment and MHD energy partition calculations in linear stability solvers.


    Sign convention: Positive when the poloidal velocity is directed in the direction
    of increasing poloidal angle $\theta$ in the flux-coordinate frame $(\rho, \theta,
    \phi)$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_real_part
  arguments:
  - name: perturbed_plasma_velocity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the first-order poloidal projection in a flux-coordinate
    basis (rho, theta, phi) of the complex plasma velocity perturbation eigenfunction
    for a specified toroidal Fourier mode. It is the quadrature component relative
    to the chosen complex eigenfunction phase.
  documentation: 'The imaginary part of the poloidal perturbed plasma velocity is
    the quadrature component of the first-order complex velocity eigenfunction for
    a selected toroidal Fourier mode. The poloidal direction is represented by the
    unit vector $\hat{\mathbf e}_\theta$ associated with increasing poloidal angle
    $\theta$ in a flux-coordinate basis $(\rho,\theta,\phi)$, with $\phi$ the toroidal
    angle of the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    The projected component and its imaginary part are defined by


    $$

    v_{\theta,\mathrm{im}} = \operatorname{Im}\!\left(\tilde v_\theta\right), \qquad
    \tilde v_\theta = \tilde{\mathbf v}\cdot\hat{\mathbf e}_\theta

    $$


    where $\tilde{\mathbf v}$ is the complex first-order plasma velocity perturbation
    eigenfunction for the selected toroidal mode, $\hat{\mathbf e}_\theta$ is the
    positive poloidal unit vector, and $v_{\theta,\mathrm{im}}$ and $\tilde v_\theta$
    have units of m s$^{-1}$. If $\tilde v_\theta = v_{\theta,\mathrm{re}} + i v_{\theta,\mathrm{im}}$,
    this quantity is the coefficient of the imaginary term.


    In practice, this component is computed from linear magnetohydrodynamic stability
    calculations or inferred through model-constrained analysis of fluctuation diagnostics.
    The physical perturbation is reconstructed by combining real and imaginary components
    with the selected Fourier phase convention; the absolute complex phase and overall
    eigenfunction amplitude are arbitrary until a normalization is specified, while
    relative phases between velocity, magnetic-field, displacement, and density perturbations
    carry physical information.


    Typical values cannot be assigned universally because linear eigenfunction normalization
    is arbitrary. After a physical amplitude normalization is chosen, poloidal perturbation
    velocities in tokamak plasmas commonly span about 1-10^5 m s$^{-1}$, from small
    coherent fluctuations to large-amplitude MHD activity.


    Sign convention: Positive when $\operatorname{Im}(\tilde{\mathbf v}\cdot\hat{\mathbf
    e}_\theta)$ is directed along $+\hat{\mathbf e}_\theta$, toward increasing poloidal
    angle $\theta$ in the flux-coordinate basis $(\rho,\theta,\phi)$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_velocity
  - name:poloidal_perturbed_plasma_velocity_real_part
  - name:radial_perturbed_plasma_velocity_imaginary_part
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  arguments:
  - name: poloidal_perturbed_plasma_velocity
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/imaginary
    status: composed
- name: poloidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the poloidal component of the complex first-order plasma
    velocity perturbation eigenfunction for a specified toroidal Fourier harmonic,
    projected along the local poloidal basis direction in a flux-coordinate system
    (rho, theta, phi).
  documentation: "This quantity is the real-valued coefficient obtained from the poloidal\
    \ component of the complex first-order plasma velocity perturbation eigenfunction\
    \ for one toroidal Fourier harmonic. In a magnetic-flux coordinate system $(\\\
    rho,\\theta,\\phi)$, where $\\rho$ is a radial flux label, $\\theta$ is poloidal\
    \ angle, and $\\phi$ is toroidal angle, it represents projection of the vector\
    \ perturbation onto the local poloidal unit direction. It is the real part of\
    \ [poloidal_perturbed_plasma_velocity](name:poloidal_perturbed_plasma_velocity),\
    \ and together with [poloidal_perturbed_plasma_velocity_imaginary_part](name:poloidal_perturbed_plasma_velocity_imaginary_part)\
    \ forms the complex poloidal velocity eigenfunction.\n\nThe defining projection\
    \ is:\n\n$$\nv_{\\theta,1}^{\\mathrm{Re}}(\\rho,\\theta;n) = \\operatorname{Re}\\\
    left[\\tilde{\\mathbf{v}}_1(\\rho,\\theta;n)\\cdot\\hat{\\mathbf{e}}_\\theta\\\
    right]\n$$\n\nwhere $v_{\\theta,1}^{\\mathrm{Re}}$ is this quantity with units\
    \ of $\\mathrm{m\\,s^{-1}}$, $\\tilde{\\mathbf{v}}_1$ is the complex first-order\
    \ plasma velocity perturbation eigenfunction with units of $\\mathrm{m\\,s^{-1}}$,\
    \ $\\hat{\\mathbf{e}}_\\theta$ is the dimensionless local unit vector in the direction\
    \ of increasing poloidal angle, and $n$ is the dimensionless toroidal Fourier\
    \ harmonic number. The angles $\\theta$ and $\\phi$ are measured in radians.\n\
    \nIn linear MHD analysis, this component is computed as part of an eigenvector\
    \ of the linearized momentum, induction, continuity, and energy equations about\
    \ an equilibrium. It may be constrained indirectly by diagnostics sensitive to\
    \ mode motion, flow, or displacement, such as magnetic fluctuation measurements\
    \ combined with spectroscopic or imaging observations. Multiplying the eigenfunction\
    \ by a complex constant changes the separation into real and imaginary parts without\
    \ changing the underlying linear mode, so comparisons require the same normalization,\
    \ complex phase reference, toroidal harmonic convention, and flux-coordinate system\
    \ $(\\rho,\\theta,\\phi)$.\n\nNo universal magnitude is fixed by linear theory\
    \ because the eigenfunction amplitude is normalization-dependent. With a unit-maximum\
    \ velocity normalization, components are commonly of order $1$ m.s^-1; when scaled\
    \ to measured small-amplitude MHD activity, values are often about $10^{-3}$-$10^2$\
    \ m.s^-1, while large or rapidly growing Alfv\xE9nic perturbations can correspond\
    \ to $10^3$-$10^5$ m.s^-1.\n\nSign convention: Positive when the real part of\
    \ the complex first-order velocity perturbation, after the chosen eigenmode phase\
    \ is fixed, projects in the $+\\hat{\\mathbf{e}}_\\theta$ direction, where $+\\\
    hat{\\mathbf{e}}_\\theta$ is the local direction of increasing poloidal angle\
    \ $\\theta$ in the flux-coordinate system $(\\rho,\\theta,\\phi)$."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_real_part
  arguments:
  - name: poloidal_perturbed_plasma_velocity
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/real
    status: composed
- name: power_due_to_impurity_radiation
  kind: scalar
  status: draft
  description: Total instantaneous non-negative radiative-loss power emitted by a
    plasma through electron interactions with impurity ions, integrated over the plasma
    volume considered. It includes impurity line emission, recombination radiation,
    and impurity bremsstrahlung.
  documentation: 'Power due to impurity radiation is the total instantaneous rate
    at which electron energy is converted to photons through interactions with impurity
    ions in an emitting plasma volume. It is reported as a non-negative radiative-loss
    power and includes bound-bound line radiation, recombination and other continuum
    radiation, and the impurity contribution to bremsstrahlung.


    The total power is obtained by integrating the local impurity-radiation emissivity
    over the emitting volume:


    $$

    P_{\mathrm{imp\,rad}} = \int_V n_e(\mathbf{x}) \sum_j n_j(\mathbf{x})\, L_j\!\left(T_e(\mathbf{x}),
    n_e(\mathbf{x})\right)\, dV

    $$


    where $P_{\mathrm{imp\,rad}}$ is the total impurity-radiation power, $V$ is the
    emitting plasma volume in $\mathrm{m^3}$, $dV$ is a volume element in $\mathrm{m^3}$,
    $n_e$ is the electron density in $\mathrm{m^{-3}}$, $n_j$ is the density in $\mathrm{m^{-3}}$
    of impurity species or charge-state population $j$, $T_e$ is the electron temperature,
    commonly in eV for tabulated cooling functions, and $L_j$ is an effective cooling
    coefficient in $\mathrm{W\,m^3}$. The coefficient $L_j$ may include charge-state
    balance and can be decomposed into line-emission, recombination-continuum, and
    bremsstrahlung contributions; which channel is largest depends on impurity species,
    charge state, density, and $T_e$.


    The quantity is inferred from bolometric measurements, spectrally resolved impurity
    radiation measurements, emissivity tomography, and collisional-radiative impurity
    modeling integrated over the relevant plasma volume. Its time integral is [energy_due_to_impurity_radiation](name:accumulated_radiated_energy_due_to_impurity_radiation).
    Component or related radiation measures include [power_due_to_line_radiation](name:power_due_to_line_radiation),
    [bremsstrahlung_power](name:bremsstrahlung_power), and radiated_power_at_wall,
    the latter describing radiated power incident on material surfaces rather than
    the power emitted by impurity processes in the plasma.


    Representative integrated powers span many orders of magnitude: about $10^3$-$10^6\
    \mathrm{W}$ in low-power or weakly impurity-radiating plasmas and about $10^6$-$10^8\
    \mathrm{W}$ during strong impurity radiation or disruption-like transients in
    present magnetic-confinement devices. The value scales with emitting volume, electron
    density, impurity concentration, charge-state distribution, and electron temperature,
    so these ranges are order-of-magnitude guidance. In an electron-energy balance
    this positive loss power usually enters with a negative sign.'
  unit: W
  physics_domain: magnetohydrodynamics
  links:
  - name:accumulated_radiated_energy_due_to_impurity_radiation
  - name:power_due_to_line_radiation
  - name:bremsstrahlung_power
  sources:
  - id: dd:disruption/global_quantities/power_radiated_electrons_impurities
    dd_path: disruption/global_quantities/power_radiated_electrons_impurities
    status: composed
  - id: dd:disruption/global_quantities/power_radiated_electrons_impurities_halo
    dd_path: disruption/global_quantities/power_radiated_electrons_impurities_halo
    status: composed
- name: power_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Power due to ohmic dissipation is the total non-negative Joule heating
    rate produced when plasma currents flow through finite resistivity. It is the
    volume integral of resistive power density and, in a lumped plasma circuit, is
    related to plasma resistance and the square of the total plasma current.
  documentation: 'Power due to ohmic dissipation is the irreversible conversion of
    electrical or magnetic-field energy into plasma thermal energy by finite resistivity.
    It is a scalar heat source in the plasma power balance and is non-negative; it
    excludes the reversible inductive contribution associated with changes in stored
    magnetic energy.


    The local Joule heating density integrated over the conducting plasma volume gives
    the total ohmic dissipation power:


    $$

    P_\mathrm{ohm} = \int_V \eta(\mathbf{r})\, |\mathbf{j}(\mathbf{r})|^2\, dV

    $$


    where $P_\mathrm{ohm}$ is the total ohmic dissipation power, $V$ is the integration
    volume, $\eta$ is the scalar or effective resistivity, $\mathbf{j}$ is the electric
    current density, $\mathbf{r}$ labels position, and $dV$ is a volume element. Reversing
    the current direction does not change this dissipated power because the current
    density enters quadratically. In a lumped-circuit description, the same quantity
    is $P_\mathrm{ohm} = R_p I_p^2$, where $R_p$ is the [plasma resistance](name:plasma_resistance)
    and $I_p$ is the [toroidal total plasma current](name:toroidal_plasma_current).


    In practice, this power is computed from reconstructed or modeled current-density
    and resistivity distributions, or inferred from a circuit balance by separating
    the resistive voltage from loop-voltage measurements and plasma-current evolution.
    This separation is important because the electrical input associated with loop
    voltage contains both irreversible resistive heating and the part associated with
    changing stored magnetic energy.


    Typical magnitudes are strongly device and phase dependent: about $10^3$-$10^7$
    W spans small experiments, tokamak ramp-up and ohmic phases, and transient high-current
    events. Because collisional resistivity decreases roughly as $T_e^{-3/2}$, ohmic
    heating generally weakens as the plasma becomes hotter and may become much smaller
    than auxiliary heating power.'
  unit: W
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_resistance
  - name:toroidal_plasma_current
  sources:
  - id: dd:disruption/global_quantities/power_ohm
    dd_path: disruption/global_quantities/power_ohm
    status: composed
  - id: dd:disruption/global_quantities/power_ohm_halo
    dd_path: disruption/global_quantities/power_ohm_halo
    status: composed
  - id: dd:summary/global_quantities/power_ohm/value
    dd_path: summary/global_quantities/power_ohm/value
    status: composed
- name: radial_mode_number
  kind: scalar
  status: draft
  description: Dimensionless non-negative integer labeling the radial branch of a
    linear MHD eigenmode by the number of radial nodes between the magnetic axis and
    the plasma boundary.
  documentation: 'Radial mode number is a non-negative integer that distinguishes
    radial branches of a linear magnetohydrodynamic eigenmode. It complements the
    toroidal mode number $n$ and poloidal mode number $m$: $n$ and $m$ describe angular
    harmonic content, while the radial mode number counts how many times the mode
    structure changes node in the radial direction.


    For a radial eigenfunction envelope $A(\rho)$ expressed on a monotonic flux coordinate
    $\rho$ such as normalized toroidal flux radius, with $\rho=0$ at the magnetic
    axis and $\rho=1$ at the plasma boundary, the radial mode number $l$ is the number
    of distinct interior radial nodes:


    $$

    l = \#\{\rho_i \in (0,1) \mid A(\rho_i)=0\}

    $$


    where $\#$ denotes the number of elements in the set and endpoint zeros imposed
    by regularity or boundary conditions are not counted.


    The value is obtained from the radial structure of a computed or inferred linear
    MHD eigenfunction after the relevant toroidal and poloidal harmonic content has
    been identified. It is not a directly measured local quantity; it is assigned
    by analyzing the spatial pattern of the perturbation from equilibrium-based mode
    calculations or from diagnostics capable of resolving the radial mode structure.


    Typical values are small integers. A node-free radial branch has $l=0$, successive
    radial overtones have $l=1,2,\ldots$, and practical mode classifications commonly
    use values from 0-10 depending on the equilibrium, boundary conditions, mode family,
    and radial resolution.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:mode_frequency
  - name:mode_phase
