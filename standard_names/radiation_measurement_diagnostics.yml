- name: second_local_tangential_coordinate_of_soft_xray_detector
  kind: scalar
  status: active
  description: Signed coordinate of a soft X-ray detector outline vertex along the
    second local tangential (X2) axis of the detector-local right-handed Cartesian
    frame.
  documentation: "The second local tangential coordinate $x_2$ locates a vertex of\
    \ the soft X-ray detector outline along the X2 axis of the detector-local frame.\
    \ In this right-handed Cartesian triad, X3 is the detector's outward plasma-facing\
    \ surface normal, X1 is the first local tangential axis directed more horizontally\
    \ toward the direction of increasing toroidal angle $\\phi$, and X2 = X3 $\\times$\
    \ X1 completes the right-handed triad. The ordered set of $(x_1, x_2)$ vertex\
    \ pairs defines the detector boundary polygon in the X1\u2013X2 plane; $x_1$ is\
    \ given by [first local tangential coordinate](name:first_local_tangential_coordinate_of_soft_xray_detector).\
    \ Together the two tangential coordinates fully specify the detector aperture\
    \ geometry in the object-local frame, distinct from the aperture outline given\
    \ by [second local tangential coordinate of a diagnostic aperture](name:second_local_tangential_coordinate_of_diagnostic_aperture)."
  unit: m
