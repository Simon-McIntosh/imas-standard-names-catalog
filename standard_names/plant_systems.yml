- name: vertical_coordinate_of_shattering_position
  kind: scalar
  status: active
  description: "Vertical coordinate of the shattering position is the Z coordinate\
    \ of the shatter-cone origin relative to the equatorial plane Z = 0 in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, locating the pellet-fragmentation point."
  documentation: 'Vertical coordinate of the shattering position is the $Z$ coordinate
    of the shatter-cone origin in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It locates the pellet-fragmentation point relative to the equatorial plane $Z=0$.


    The coordinate is the vertical projection of the shattering-position displacement
    vector:


    $$

    Z_\mathrm{shat} = \mathbf{r}_\mathrm{shat} \cdot \hat{Z}

    $$


    where $\mathbf{r}_\mathrm{shat}$ is the displacement vector from the coordinate
    origin $R=0$, $Z=0$ in the right-handed cylindrical $(R, \phi, Z)$ frame to the
    shattering position, expressed in meters; $\hat{Z}$ is the vertical unit basis
    vector; and $Z_\mathrm{shat}$ is the resulting vertical coordinate, expressed
    in meters.


    Together with [radial_coordinate_of_shattering_position](name:radial_coordinate_of_shattering_position),
    this quantity specifies the poloidal location of pellet fragmentation. It is distinct
    from [vertical_coordinate_of_pellet_path_point](name:vertical_coordinate_of_pellet_path_point),
    which denotes the vertical coordinate of a point on the pellet path rather than
    the fixed shattering position.


    Sign convention: Positive when the shattering position lies above the equatorial
    plane $Z=0$, in the $+\hat{Z}$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m
  physics_domain: plant_systems
  links: []
  sources:
  - dd_path: spi/injector/shatter_cone/origin/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-shatter_cone-origin-z
    dd_documentation:
      leaf: Height
