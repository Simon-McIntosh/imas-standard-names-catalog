- name: radius_of_neutron_detector
  kind: scalar
  status: active
  description: Radius of a circular neutron-detector aperture, measured from the aperture
    center to its circumferential boundary, characterizing the transverse opening
    size of the neutron detector.
  documentation: 'Radius of a circular neutron-detector aperture, measured from the
    aperture center to its circumferential boundary, is the scalar length parameter
    of the circular aperture associated with a neutron detector. It applies to a circular
    sensitive entrance or circular collimating opening of that detector.


    For a circular aperture, the associated geometric area is


    $$

    A = \pi r^2

    $$


    where $A$ is the circular aperture area in square meters and $r$ is the radius
    of the neutron-detector aperture in meters.


    The physical scalar range is $r \ge 0$; $r=0$ represents a vanishing circular
    opening, and negative values are outside the geometry. This quantity is the neutron-detector-specific
    aperture radius, distinct from the generic [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture),
    from the corresponding [diameter_of_diagnostic_aperture](name:diameter_of_diagnostic_aperture),
    and from the total [area_of_neutron_detector](name:area_of_neutron_detector).
    For noncircular neutron-detector openings, transverse aperture dimensions are
    described by [width_of_neutron_detector](name:width_of_neutron_detector) and [height_of_neutron_detector](name:height_of_neutron_detector);
    [solid_angle_of_neutron_detector](name:solid_angle_of_neutron_detector) is a separate
    geometric quantity that also depends on source position, aperture orientation,
    distance, and surrounding collimation.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:diameter_of_diagnostic_aperture
  - name:radius_of_diagnostic_aperture
  sources:
