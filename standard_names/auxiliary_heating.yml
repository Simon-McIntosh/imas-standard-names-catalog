    dd_path: ece/channel/beam_tracing/beam/wave_vector/n_perpendicular
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/wave_vector/n_perpendicular
    dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/n_perpendicular
    status: composed
- name: power_due_to_neutral_beam_injection
  kind: scalar
  status: draft
  description: Net thermal power deposited onto plasma-facing wall components by incident
    neutral particles.
  documentation: "The power due to neutral beam injection represents the thermal energy\
    \ flux carried by neutral particles\u2014both beam-injected and charge-exchange-generated\u2014\
    that strike the first wall. In the scrape-off layer, charge-exchange neutrals\
    \ and beam neutrals that are not fully ionized deposit energy on wall surfaces,\
    \ contributing to the global wall heat load. This quantity is the surface-integrated\
    \ power $P_\\mathrm{n} = \\int_S \\Gamma_\\mathrm{n} \\, E_\\mathrm{n} \\, dS$,\
    \ where $\\Gamma_\\mathrm{n}$ is the neutral particle flux density (m$^{-2}$ s$^{-1}$)\
    \ and $E_\\mathrm{n}$ is the mean energy per neutral (eV). Positive values indicate\
    \ net power deposition onto the wall. Typical values in present-day tokamaks range\
    \ from 1\u2013100 MW for NBI-heated plasmas, depending on beam energy, plasma\
    \ density, and neutral penetration depth. The related quantity [neutral_count_of_wall](name:neutral_count_of_wall)\
    \ tracks the cumulative particle inventory, while [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall)\
    \ gives the corresponding charged-particle energy flux."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:neutral_count_of_wall
  - name:ion_particle_flux_at_wall
  sources:
  - id: dd:summary/heating_current_drive/nbi/power/value
    dd_path: summary/heating_current_drive/nbi/power/value
    status: composed
  - id: dd:wall/global_quantities/power_neutrals
    dd_path: wall/global_quantities/power_neutrals
    status: composed
- name: radial_wave_vector
  kind: scalar
  status: draft
  description: Radial (major radius R) component of the EC beam wave vector at the
    launcher launch point.
  documentation: The radial component $k_R$ of the wave vector $\mathbf{k}$ for an
    electron cyclotron (EC) beam, evaluated at the launching aperture in the right-handed
    cylindrical $(R, \phi, Z)$ frame. This component determines the radial spatial
    oscillation rate of the wave phase and, together with the vertical and toroidal
    components, defines the beam propagation direction in the plasma. Typical values
    for EC launchers range from $-10$ to $10\,\text{m}^{-1}$, depending on the launch
    angle and EC frequency. This quantity is the unnormalized counterpart of the normalized
    radial wave vector $[k_{R,\text{norm}} = k_R / |\mathbf{k}|]$ (see `[normalized_perpendicular_wave_vector](name:normalized_perpendicular_wave_vector)`
    for its normalized form). The radial wave vector is an input to beam-tracing codes
    that model EC wave propagation and absorption. It is also related to the launching
    geometry via `[major_radius_of_launching_position](name:major_radius_of_launching_position)`
    and the beam spot size `[size_of_b eam_tracing_beam](name:size_of_beam_tracing_beam)`.
  unit: m^-1
  physics_domain: auxiliary_heating
