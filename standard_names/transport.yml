- name: radial_neutral_coefficient
  kind: scalar
  status: draft
  description: Radial component of the dimensionless neutral momentum flux limiter
    coefficient, bounding the diffusive momentum flux in fluid edge-plasma models.
  documentation: 'The radial component of the neutral momentum flux limiter coefficient
    parameterizes the reduction in diffusive radial momentum transport relative to
    the classical (unlimited) value. In fluid neutral models, the radial momentum
    flux is often bounded by a flux-limiting prescription to prevent unphysically
    large transport when the mean free path exceeds the gradient scale length, expressed
    as $\Gamma_{\text{mom},r} = C_r \, \Gamma_{\text{classical},r}$, where $C_r$ is
    the radial flux limiter and $0 < C_r \leq 1$. Typical values range from 0.1 to
    1 in the scrape-off layer, with lower values indicating stronger flux limiting.
    The radial component is distinguished from its perpendicular counterparts [vertical_neutral_coefficient](name:vertical_neutral_coefficient)
    and [parallel_neutral_coefficient](name:parallel_neutral_coefficient), together
    forming the full [neutral_coefficient](name:neutral_coefficient) vector.


    Sign convention: Positive when the radial component of the momentum flux limiter
    coefficient is oriented in the direction of increasing major radius $R$.


    Derived from the general neutral momentum flux limiter coefficient, this radial
    projection isolates transport along the major-radial direction, which is the dominant
    channel for radial particle and momentum transport in axisymmetric tokamak edge
    plasmas.'
  unit: '1'
  physics_domain: transport
  links:
  - name:vertical_neutral_coefficient
  - name:parallel_neutral_coefficient
  - name:neutral_coefficient
  arguments:
  - name: neutral_coefficient
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
