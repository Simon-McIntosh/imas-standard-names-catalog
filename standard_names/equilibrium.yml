      kind: llm
- name: normalized_plasma_internal_inductance
  kind: scalar
  status: active
  description: "Normalized plasma internal inductance is the li_3 equilibrium parameter\
    \ formed from the plasma-volume integral of squared poloidal magnetic field, normalized\
    \ by total plasma current and the reference major-radius position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame. It measures spatial concentration of poloidal-field\
    \ energy associated with the plasma current, not a boundary-field ratio."
  documentation: 'Normalized plasma internal inductance is the $l_i(3)$ equilibrium
    parameter that characterizes the spatial concentration of the poloidal magnetic
    field generated by the plasma current. It is a global measure of how the current-density
    distribution stores poloidal magnetic-field energy within the plasma, not a local
    boundary-field ratio.


    The defining normalization is


    $$

    l_i(3) = \frac{2}{R_0 \mu_0^2 I_p^2} \int_{V_p} B_p^2 \, dV

    $$


    where $V_p$ is the plasma volume; $B_p$ is the magnitude of the poloidal magnetic
    field, in tesla; $dV$ is the volume element, in cubic meters; $I_p$ is the total
    toroidal plasma current, in amperes; $\mu_0$ is the permeability of free space,
    in henries per meter; and $R_0$ is the major-radius coordinate, in meters, of
    the geometric center of the plasma boundary, taken as the midpoint between the
    innermost and outermost boundary major-radius positions in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    This quantity is the normalized internal-inductance convention denoted $l_i(3)$
    or $li_3$. It is distinct from a dimensional plasma internal inductance and from
    [poloidal_beta](name:poloidal_beta), which normalizes plasma pressure by poloidal
    magnetic-field energy; here the numerator weights $B_p^2$ throughout the plasma
    volume. Through Ampere''s law, changes in the spatial distribution of [current
    density](name:current_density) change $B_p$ and therefore this parameter, while
    the factor $I_p^2$ makes it insensitive to reversal of the total plasma-current
    direction.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:current_density
  sources:
  - dd_path: core_profiles/global_quantities/li_3
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-global_quantities-li_3
    dd_documentation:
      leaf: Internal inductance. The li_3 definition is used, i.e. li_3 = 2/R0/mu0^2/Ip^2
