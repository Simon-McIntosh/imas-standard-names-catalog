- name: poloidal_angle_of_measurement_position
  kind: scalar
  status: active
  description: "Geometric poloidal angle locating a measurement position around the\
    \ magnetic axis in the right-handed cylindrical (R, \u03C6, Z) cross-section,\
    \ increasing clockwise."
  documentation: 'The poloidal angle of a measurement position is the geometric angular
    coordinate of a physical point about the magnetic axis in the poloidal cross-section
    of the right-handed cylindrical $(R,\phi,Z)$ frame. It identifies the point''s
    position around the magnetic axis, rather than a field-line or toroidal angle.


    Taking zero on the outward radial direction from the magnetic axis, the angle
    is defined by


    $$

    \theta_{\mathrm{meas}} = \operatorname{atan2}\!\left[-\left(Z_{\mathrm{meas}}-Z_{\mathrm{axis}}\right),\,R_{\mathrm{meas}}-R_{\mathrm{axis}}\right]

    $$


    where $\theta_{\mathrm{meas}}$ is the poloidal angle of the measurement position,
    $\operatorname{atan2}$ is the two-argument arctangent that preserves the angular
    quadrant, $R_{\mathrm{meas}}$ and $Z_{\mathrm{meas}}$ are the major-radius and
    vertical coordinates of the measurement position, and $R_{\mathrm{axis}}$ and
    $Z_{\mathrm{axis}}$ are the corresponding coordinates of the magnetic axis.


    This quantity is evaluated pointwise at the designated measurement position and
    is not a line average, flux-surface average, or signal-weighted aggregate. It
    is the measurement-position specialization of [poloidal_angle](name:poloidal_angle_of_flux_surface),
    and it is distinct from [toroidal_angle_of_measurement_position](name:toroidal_angle_of_measurement_position),
    which locates the same point around the symmetry axis.


    Sign convention: Positive when the position advances clockwise from the outward
    radial direction in the poloidal cross-section, viewed from the right-hand side
    of the symmetry axis.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:poloidal_angle_of_flux_surface
  - name:toroidal_angle_of_measurement_position
  sources:
  - dd_path: ece/channel/beam_tracing/beam/position/theta
