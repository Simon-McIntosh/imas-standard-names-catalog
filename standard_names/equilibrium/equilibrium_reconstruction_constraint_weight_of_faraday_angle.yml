name: equilibrium_reconstruction_constraint_weight_of_faraday_angle
status: draft
cocos_transformation_type: one_like
description: Relative weight assigned to the Faraday rotation angle measurement in
  the least-squares equilibrium reconstruction cost functional.
documentation: Standard $\chi^2$ weight controlling the relative importance of the
  Faraday rotation angle measurement in the equilibrium reconstruction. A value of
  1 applies the nominal measurement variance; larger values up-weight the Faraday
  polarimetry constraint when the raw variance under-represents systematic or modeling
  error. The Faraday rotation angle $\alpha_F$ provides internal poloidal-field information
  (see `faraday_rotation_angle`), and adjusting its weight balances this diagnostic
  against external magnetic measurements and other internal constraints (e.g., motional
  Stark effect). The companion quantities are the measured and reconstructed Faraday
  rotation angle values, as well as `diamagnetic_flux_constraint_exact_flag` for an
  analogous selector on another constraint.
