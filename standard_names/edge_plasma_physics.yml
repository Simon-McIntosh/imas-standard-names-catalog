- name: current_density_due_to_parallel_viscosity
  kind: scalar
  status: draft
  description: Current density arising from the parallel component of the viscous
    force density in the edge plasma. It results from neoclassical parallel force
    balance and contributes to radial current transport near the separatrix.
  documentation: "The parallel viscous current density arises from the imbalance of\
    \ neoclassical parallel forces when the ion pressure tensor becomes anisotropic\
    \ along the magnetic field. It appears in the parallel component of the generalized\
    \ Ohm's law and is described by the parallel momentum balance equation $\\nabla_\\\
    parallel \\cdot \\boldsymbol{\\pi}_\\parallel = F_\\parallel$, where $\\boldsymbol{\\\
    pi}_\\parallel$ is the parallel component of the ion viscous stress tensor and\
    \ $F_\\parallel$ is the parallel frictional force. In the collisional (Pfirsch-Schl\xFC\
    ter) regime, the parallel viscosity is proportional to the ion parallel viscosity\
    \ coefficient $\\eta_0$ and the gradient of the parallel flow velocity $V_\\parallel$.\
    \ The current density is computed from the viscous force density via $\\mathbf{j}_{\\\
    parallel}^{\\text{visc}} = \\frac{1}{B} \\hat{b} \\times (\\nabla \\cdot \\boldsymbol{\\\
    pi}_\\parallel)$, which is a vector quantity whose radial component contributes\
    \ to radial current balance. Typical values range from $10^2$ to $10^4\\,\\text{A}\\\
    ,\\text{m}^{-2}$ in the pedestal region of H-mode tokamaks, depending on collisionality\
    \ and edge gradients. This current is closely related to flow damping and radial\
    \ electric field formation near the separatrix.\n\nSign convention: Positive when\
    \ the parallel viscous current density vector points in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:radial_current_density_due_to_parallel_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  - name:poloidal_current_density_due_to_parallel_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_perpendicular_viscosity
