name: total_neutral_radiated_power_inside_flux_surface
status: draft
description: Sum over all neutral species of the volume-integrated radiated power
  from the region enclosed by a given flux surface.
documentation: "The total neutral radiated power inside a flux surface, $P_{\\mathrm{rad,n,tot}}(\\\
  psi)$, is defined as $$P_{\\mathrm{rad,n,tot}}(\\psi) = \\sum_s \\int_{V(\\psi)}\
  \ \\epsilon_{n,s}(\\mathbf{r})\\, dV,$$ where the sum runs over all neutral species\
  \ $s$ (atomic hydrogen isotopes, molecular species, impurity neutrals) and $\\epsilon_{n,s}$\
  \ (W m$^{-3}$) is the corresponding emissivity. This quantity aggregates contributions\
  \ from line emission (Lyman, Balmer, Fulcher bands) and molecular dissociation radiation.\
  \ In high-recycling and detached divertor conditions, neutral radiation near the\
  \ X-point and pedestal can contribute meaningfully to the total radiation budget,\
  \ with values of order 0.1\u20135 MW depending on fueling and divertor geometry.\
  \ The profile is computed by neutral-transport codes (EIRENE, DEGAS2) or inferred\
  \ from multichord filtered camera imaging. The per-species and per-state breakdowns\
  \ are given by `neutral_state_radiated_power_inside_flux_surface`. See also `total_ion_radiated_power_inside_flux_surface`\
  \ for the ion counterpart and `neutral_radiated_power_inside_vessel` for the vessel-wide\
  \ integral."
