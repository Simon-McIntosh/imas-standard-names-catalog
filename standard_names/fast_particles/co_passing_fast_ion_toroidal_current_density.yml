name: co_passing_fast_ion_toroidal_current_density
status: draft
cocos_transformation_type: one_like
description: Toroidal current density carried by the co-passing fraction of the fast
  (non-thermal) ion population, excluding back-current contributions.
documentation: "The co-passing fast-ion toroidal current density $j_\\phi^{f,\\mathrm{co}}$\
  \ is the contribution to the toroidal current from supra-thermal ions whose guiding-center\
  \ parallel velocity is aligned with the plasma current ($v_\\parallel > 0$ in the\
  \ co-current direction). It is computed as $j_\\phi^{f,\\mathrm{co}} = Z_f e \\\
  int_{\\mathrm{co\\text{-}pass}} v_\\phi f_f\\, d^3v$, where $Z_f e$ is the fast-ion\
  \ charge, $v_\\phi$ is the toroidal velocity, and $f_f$ is the fast-ion distribution\
  \ function restricted to the co-passing domain in velocity space. This quantity\
  \ deliberately excludes the electron and thermal-ion back (drag) currents that arise\
  \ from momentum conservation during slowing down; the total net driven current is\
  \ obtained by summing over all pitch-angle classes and adding the back-current terms.\
  \ Typical values in NBI-heated tokamak cores range from $10^3$ to $10^5\\;\\mathrm{A\\\
  ,m^{-2}}$, scaling with beam power and injection geometry. Positive when the co-passing\
  \ current flows in the $+\\phi$ direction under COCOS-11. Computed by Monte Carlo\
  \ orbit codes (NUBEAM, ASCOT) or bounce-averaged Fokker\u2013Planck solvers."
