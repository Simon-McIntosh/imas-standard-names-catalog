- name: second_coordinate_width_of_aperture
  kind: scalar
  status: draft
  description: Full width of a rectangular collimating aperture measured along the
    second local coordinate direction (X2) of the aperture plane. This nonnegative
    scalar side length, together with the first coordinate width, fully characterizes
    the rectangular cross-section. Applicable only when the aperture geometry type
    is rectangular.
  documentation: 'The second local coordinate width $w_{X2}$ defines the full extent
    of a rectangular diagnostic aperture along the X2 axis of the aperture''s local
    $(X1, X2)$ frame, where X1 and X2 are orthogonal axes lying in the plane of the
    aperture opening.


    This quantity is a nonnegative scalar side length. Together with the complementary
    first coordinate width $w_{X1}$ (see [first_coordinate_width_of_aperture](name:first_coordinate_width_of_aperture)),
    it fully characterizes the rectangular cross-section, with the aperture area given
    by $A = w_{X1} \times w_{X2}$ (m$^2$). These two widths govern the solid angle
    subtended at the detector and determine the geometric efficiency of the detection
    channel.


    This width is applicable only when the aperture has a rectangular geometry (geometry
    type 3). For circular apertures, the relevant quantity is the aperture radius
    (see [radius_of_collimating_aperture_of_neutron_detector](name:radius_of_collimating_aperture_of_neutron_detector));
    for polygonal apertures, the boundary vertices are described by the aperture outline
    (see [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline)).
    The more specific counterpart for detector apertures is [second_coordinate_width_of_detector_aperture](name:second_coordinate_width_of_detector_aperture).


    The local $(X1, X2)$ coordinate frame is defined such that X1 and X2 are orthogonal
    directions spanning the aperture plane, with their orientation determined by the
    physical geometry of the diagnostic component. Typical values range from a few
    millimeters to several centimeters, depending on the diagnostic field of view
    and spatial resolution requirements.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
