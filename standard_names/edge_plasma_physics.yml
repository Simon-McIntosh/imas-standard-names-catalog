- name: total_ion_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Positive e-folding distance for the outward decrease of total ion number
    density across magnetic flux surfaces in the scrape-off layer.
  documentation: 'This quantity is the positive cross-field decay length of the total
    ion number density in the scrape-off layer. It is the species- and charge-state-summed
    specialization of [ion decay length over the scrape-off layer](name:ion_decay_length_over_scrape_off_layer).


    $$

    \lambda_{i,\mathrm{tot}} = \left|\frac{1}{n_{i,\mathrm{tot}}}\frac{\partial n_{i,\mathrm{tot}}}{\partial
    \ell_\perp}\right|^{-1}

    $$


    Here $n_{i,\mathrm{tot}}$ is the total ion number density, summed over the included
    ion species and charge states, and $\ell_\perp$ is outward distance normal to
    magnetic flux surfaces, measured in m. The quantity excludes electron and neutral-particle
    densities and is non-negative by definition.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:ion_decay_length_over_scrape_off_layer
  arguments:
  - name: ion_decay_length_over_scrape_off_layer
    operator: total
    operator_kind: qualifier
