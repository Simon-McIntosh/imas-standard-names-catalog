- name: vertical_coordinate_of_detector_pixel
  kind: scalar
  status: draft
  description: Vertical height Z of the center of a detector pixel in the right-handed
    cylindrical (R, phi, Z) frame, where R is major radius and Z is vertical height.
    It is an absolute machine-geometry coordinate of the pixel center, not a detector-local
    row index or the active-height span across pixels.
  documentation: 'The vertical coordinate of a detector pixel is the $Z$ coordinate
    of the geometric center of an individual pixel of a radiation-imaging detector
    (such as an X-ray camera or crystal spectrometer) in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle increasing
    counter-clockwise viewed from above, and $Z$ is vertical height. It is an absolute
    machine-geometry coordinate measured from the $Z=0$ reference plane, distinct
    from any detector-local active-height coordinate, row index, or the full vertical
    extent of the pixel.


    Together with the corresponding radial and toroidal coordinates of the same pixel
    center, this quantity fixes the spatial location of each sensing element, which
    in turn defines the viewing geometry used to relate detected radiation to its
    plasma source region.


    Typical absolute values are set by the diagnostic installation height and commonly
    lie within $-2$ to $2$ m for medium-sized tokamaks, extending to several meters
    in larger devices. Differences in $Z$ between neighboring pixel centers are much
    smaller, of order $0.001$ to $0.1$ m, set by pixel pitch and detector orientation.


    Sign convention: Positive when the pixel center lies above the $Z=0$ reference
    plane, displaced in the $+\hat{Z}$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
