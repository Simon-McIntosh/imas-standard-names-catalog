- name: line_averaged_lithium_density
  kind: scalar
  status: active
  description: Path-length-averaged total number density of lithium ions along a specified
    plasma chord, summed over Li+ through fully stripped Li3+ and excluding neutral
    lithium.
  documentation: 'This is the path-length average of lithium ion number density, summed
    over all ionization stages from Li$^+$ through fully stripped Li$^{3+}$, along
    a specified chord through the plasma.


    The chord average is defined by


    $$

    \langle n_{Li} \rangle_L = \frac{1}{L}\int_0^L n_{Li}(s)\,ds

    $$


    where $n_{Li}(s)$ is the local lithium ion number density in m$^{-3}$, $s$ is
    path length in meters along the chord, and $L$ is the total chord length in meters.


    This quantity weights each path-length element equally and excludes neutral lithium.
    It differs from the [flux-surface-averaged lithium density at the plasma boundary](name:flux_surface_averaged_lithium_density_at_plasma_boundary),
    which averages over a separatrix, and from [volume-averaged lithium density](name:volume_averaged_lithium_density),
    which averages over confined plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:flux_surface_averaged_lithium_density_at_plasma_boundary
  - name:volume_averaged_lithium_density
