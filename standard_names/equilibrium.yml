- name: vacuum_magnetic_field
  kind: vector
  status: active
  description: Magnetic field in current-free regions, generalizing over equilibrium
    and perturbed configurations generated by external coil currents with plasma-current
    contributions omitted.
  documentation: 'The vacuum magnetic field designates the magnetic-induction vector
    generated by external coil currents when plasma-current contributions are omitted.
    It is the current-free counterpart of the total [magnetic field](name:magnetic_field),
    covering both equilibrium and perturbation fields.


    In any region containing no modeled current density, the vacuum field satisfies


    $$

    \nabla \times \mathbf{B}_{\mathrm{vac}} = \mathbf{0}

    $$


    where $\mathbf{B}_{\mathrm{vac}}$ is the vacuum magnetic induction, $\nabla$ is
    the spatial differential operator, and $\mathbf{0}$ is the zero vector. The field
    is also solenoidal, so $\nabla \cdot \mathbf{B}_{\mathrm{vac}} = 0$. Its toroidal
    component is represented by [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field),
    while a first-order vacuum perturbation is represented by [perturbed vacuum magnetic
    field](name:perturbed_vacuum_magnetic_field). The corresponding [vacuum magnetic
    vector potential](name:vacuum_magnetic_vector_potential) is gage-dependent, but
    its curl yields this field.


    Sign convention: Positive when a resolved component of $\mathbf{B}_{\mathrm{vac}}$
    points along the corresponding positive basis vector in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ increases in the toroidal
    direction, and $Z$ is vertical height.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:toroidal_vacuum_magnetic_field
  - name:perturbed_vacuum_magnetic_field
  - name:vacuum_magnetic_vector_potential
  arguments:
  - name: magnetic_field
    operator: vacuum
    operator_kind: qualifier
- name: toroidal_vacuum_magnetic_field
  kind: scalar
  status: active
  description: "The toroidal vacuum magnetic field is the toroidal component of the\
    \ external-coil equilibrium magnetic field at the reference major radius in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, excluding plasma-current contributions."
  documentation: 'The toroidal vacuum magnetic field $B_{0,\mathrm{vac}}$ is the $\hat{\phi}$
    component of the external-coil contribution to the equilibrium [vacuum magnetic
    field](name:vacuum_magnetic_field), evaluated at the [reference major radius](name:reference_major_radius)
    $R_0$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It represents the
    toroidal field that would be present from the external coil system with plasma-current
    contributions excluded.


    For an axisymmetric current-free vacuum region, the toroidal vacuum field is related
    to the [vacuum poloidal current function](name:vacuum_poloidal_current_function)
    by:


    $$

    B_{0,\mathrm{vac}} = B_{\phi,\mathrm{vac}}(R_0) = \frac{F_\mathrm{vac}}{R_0}

    $$


    where $B_{\phi,\mathrm{vac}}$ is the $\hat{\phi}$ component of the vacuum magnetic
    field, $R_0$ is the reference major radius, and $F_\mathrm{vac} = R B_{\phi,\mathrm{vac}}(R)$
    in the current-free axisymmetric vacuum region.


    This quantity is the vacuum external-coil contribution only. It is distinct from
    the [toroidal reference magnetic field](name:toroidal_reference_magnetic_field)
    when that quantity denotes the total reference toroidal field including plasma-current,
    diamagnetic, or paramagnetic contributions.


    Sign convention: Positive when $B_{\phi,\mathrm{vac}}$ points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $\phi$ increases counter-clockwise viewed from above $+\hat{Z}$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vacuum_magnetic_field
  - name:toroidal_reference_magnetic_field
  - name:vacuum_poloidal_current_function
  arguments:
  - name: vacuum_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
