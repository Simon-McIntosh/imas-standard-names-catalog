      kind: llm
- name: upper_bound_energy_of_detector_pixel
  kind: scalar
  status: active
  description: Maximum photon energy accepted by a detector pixel in an X-ray crystal
    spectrometer, defining the high-energy edge of the pixel's spectral bandpass.
  documentation: 'The upper bound energy of a detector pixel is the maximum photon
    energy in the spectral interval accepted by that pixel in an X-ray crystal spectrometer.
    Together with the [lower bound energy of a detector pixel](name:lower_bound_energy_of_detector_pixel),
    it defines the pixel bandpass around the central [energy of a detector pixel](name:energy_of_detector_pixel).


    The accepted photon-energy interval is defined by


    $$

    E_{\mathrm{lower}} \leq E \leq E_{\mathrm{upper}}

    $$


    where $E$ is photon energy, $E_{\mathrm{lower}}$ is the lower bound energy, and
    $E_{\mathrm{upper}}$ is the upper bound energy of the pixel. Photons with energies
    above $E_{\mathrm{upper}}$ are outside this pixel''s defined spectral acceptance
    interval.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
