- name: vertical_total_current_density
  kind: scalar
  status: active
  description: "Vertical total current density is the Z component of net conventional\
    \ current density in the right-handed cylindrical (R, \u03C6, Z) frame, combining\
    \ ohmic, bootstrap, and externally driven contributions over all plasma species\
    \ and charge states."
  documentation: 'Vertical total current density is the component of the aggregated
    current-density vector [total current density](name:total_current_density) resolved
    along the vertical direction. It combines ohmic, bootstrap, and externally driven
    contributions over all included plasma species and charge states, distinguishing
    it from the generic [vertical current density](name:vertical_current_density).


    The defining projection is:


    $$

    J_{\mathrm{v,total}} = \mathbf{J}_{\mathrm{total}} \cdot \hat{\mathbf{Z}}

    $$


    where $J_{\mathrm{v,total}}$ is the vertical total current density, $\mathbf{J}_{\mathrm{total}}$
    is the aggregated conventional current-density vector, and $\hat{\mathbf{Z}}$
    is the vertical unit vector. The projection is defined in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    Sign convention: Positive when conventional current has a component in the $+\hat{\mathbf{Z}}$
    direction, corresponding to increasing vertical coordinate $Z$.'
