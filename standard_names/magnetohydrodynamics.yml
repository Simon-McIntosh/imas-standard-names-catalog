- name: time_derivative_of_mode_width
  kind: scalar
  status: active
  description: Time derivative of mode width is the signed instantaneous temporal
    derivative of the full radial magnetic-island width for a tearing or neoclassical
    tearing mode. It is a width-evolution rate, distinct from the island width itself
    and from mode phase rotation.
  documentation: 'Time derivative of mode width is the signed instantaneous temporal
    derivative of the full radial width of a magnetic island associated with a tearing
    or neoclassical tearing mode. The width being differentiated is the full island
    width described by [radial_width_of_neoclassical_tearing_mode](name:radial_width_of_neoclassical_tearing_mode),
    not an island half-width or a phase quantity.


    The derivative is defined with respect to physical time:


    $$

    \dot W(t) = \frac{dW(t)}{dt}

    $$


    where $W(t)$ is the full radial magnetic-island width and $\dot W(t)$ is its time
    derivative.


    This quantity is distinct from [rotation_frequency_of_neoclassical_tearing_mode](name:rotation_frequency_of_neoclassical_tearing_mode),
    which describes temporal advance of the mode phase rather than change of island
    width. Model-specific stability factors or drive terms, including quantities such
    as [coefficient_of_neoclassical_tearing_mode](name:coefficient_of_neoclassical_tearing_mode),
    may enter an island-evolution equation but are not themselves this derivative.


    Sign convention: Positive when the full magnetic-island width increases with time.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_width_of_neoclassical_tearing_mode
  sources:
  - dd_path: ntms/time_slice/mode/detailed_evolution/dwidth_dt
