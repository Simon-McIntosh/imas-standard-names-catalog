- name: net_efficiency_of_plant_system
  kind: scalar
  status: active
  description: Dimensionless ratio quantifying how effectively a plant system delivers
    signed net electrical power to an external load relative to the total internal
    electrical consumption needed to operate it.
  documentation: 'The net efficiency of a plant system is the dimensionless ratio
    of signed net electrical power exported outside the plant boundary to total internal
    electrical power consumed by plant systems over the same accounting interval.
    It is the net-electrical-gain specialization of [efficiency of a plant system](name:efficiency_of_plant_system),
    with recirculating electrical loads included in the net exported power balance.


    The defining relation, including the corresponding net-power balance, is:


    $$

    \eta_{\mathrm{net,plant}} = \frac{P_{\mathrm{net}}}{P_{\mathrm{cons}}}, \qquad

    P_{\mathrm{net}} = P_{\mathrm{gen}} - P_{\mathrm{int}}, \qquad

    P_{\mathrm{cons}} = \sum_{i \in \mathcal{B}_{\mathrm{plant}}} P_{\mathrm{load},i}

    $$


    where $P_{\mathrm{net}}$ is the [net electrical power of the plant system](name:net_power_of_plant_system)
    in W, $P_{\mathrm{cons}}$ is the positive total electrical consumption represented
    by [power of the plant system](name:power_of_plant_system) in W, $P_{\mathrm{gen}}$
    is gross generated electrical power in W, $P_{\mathrm{int}}$ is the internal operational
    electrical consumption subtracted in the net-power balance in W, $P_{\mathrm{load},i}$
    is the electrical consumption of included load $i$ in W, and $\mathcal{B}_{\mathrm{plant}}$
    is the set of electrically powered plant loads included in the accounting boundary.


    The denominator $P_{\mathrm{cons}}$ is a gross positive consumption quantity,
    not the signed net exchange $P_{\mathrm{net}}$ and not the gross generated power
    $P_{\mathrm{gen}}$. It equals the internal-consumption term $P_{\mathrm{int}}$
    only when the same loads, plant boundary, and interval define both the net-power
    balance and the denominator. Unlike [thermal efficiency of the plant system](name:thermal_efficiency_of_plant_system),
    this quantity relates net electrical export to internal electrical consumption
    rather than gross electrical output to thermal input.


    Sign convention: Positive when signed net electrical power is exported from the
    plant system to an external electrical network or load.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:efficiency_of_plant_system
  - name:thermal_efficiency_of_plant_system
  - name:net_power_of_plant_system
  arguments:
  - name: efficiency_of_plant_system
    operator: net
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/gain_plant
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-gain_plant
    dd_documentation:
      leaf: Electricity gain of the plant (ratio of net electric / plant electricity
        during operation)
