- name: second_coordinate_of_aperture_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of a diagnostic aperture in its local (X1, X2) instrument reference frame.
  documentation: 'The second coordinate X2 specifies positions of the polygon vertices
    that define the outline of a diagnostic aperture in a local two-dimensional instrument
    frame $(X1, X2)$. Together with the [first coordinate X1](name:first_coordinate_of_aperture_outline),
    these vertex positions fully characterize the aperture geometry used to compute
    solid angles, acceptance volumes, and line-of-sight collimation for neutron, bolometric,
    and X-ray crystal diagnostic channels. The local frame $(X1, X2)$ is defined by
    the [first](name:first_unit_vector) and [second](name:second_unit_vector) unit
    vectors of the optical element, which are expressed in the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame. Vertex coordinates are traced in order around
    the polygonal boundary; typical aperture half-widths range from a few millimeters
    to several tens of centimeters depending on the diagnostic type. The outline is
    used in ray-tracing and detector-response calculations to determine the effective
    viewing geometry.


    Sign convention: Positive when the X2 coordinate is in the direction of the second
    local unit vector of the instrument frame.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
