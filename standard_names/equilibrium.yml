- name: vertical_magnetization_of_iron_core_segment
  kind: scalar
  status: draft
  description: Reconstructed vertical component of the magnetization vector of a discrete
    iron core segment in the tokamak transformer.
  documentation: "The vertical (Z) component of the magnetization of a discrete iron\
    \ core segment, denoted $M_z$, describes the magnetic polarization along the machine\
    \ symmetry axis within the segment volume. The magnetization vector $\boldsymbol{M}$\
    \ is related to the magnetic field $\boldsymbol{B}$ and the magnetic field strength\
    \ $\boldsymbol{H}$ through $\boldsymbol{B} = \\mu_0 (\\boldsymbol{H} + \\boldsymbol{M})$,\
    \ where $\\mu_0$ is the vacuum permeability. This quantity is typically obtained\
    \ from equilibrium reconstruction codes that solve the Grad-Shafranov equation\
    \ including the nonlinear B-H characteristic of the iron core, segmented into\
    \ discrete annular or rectangular elements. The radial counterpart is described\
    \ by [radial magnetization of iron core segment](name:radial_magnetization_of_iron_core_segment).\
    \ The segment geometry is defined by its [inner radius](name:inner_radius_of_iron_core_segment),\
    \ [outer radius](name:outer_radius_of_iron_core_segment), and [height](name:height_of_iron_core_segment).\
    \ Note that the magnetization is assumed spatially uniform within each segment.\n\
    \nSign convention: Positive when $\boldsymbol{M}$ points in the $+Z$ direction\
    \ (upward)."
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetization_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  - name:height_of_iron_core_segment
  sources:
