name: iron_number_density_at_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Iron ion number density evaluated at the magnetic axis, representing
  the on-axis high-$Z$ impurity concentration.
documentation: The iron ion number density at the magnetic axis, $n_{\mathrm{Fe}}(R_{\mathrm{axis}},
  Z_{\mathrm{axis}})$ (in m$^{-3}$), gives the peak or central value of the iron density
  profile at the location where $\nabla \psi = 0$, i.e., the innermost flux surface.
  Iron ($Z = 26$) is a high-$Z$ intrinsic impurity in tokamaks with steel-based plasma-facing
  components; its central concentration strongly influences core radiative losses
  and the effective charge $Z_{\mathrm{eff}}$. The on-axis value is typically inferred
  from soft-X-ray tomography combined with charge-state-resolved VUV spectroscopy
  and impurity transport modeling. Typical core values range from $10^{14}$ to $10^{16}$
  m$^{-3}$ in present-day devices. See also `iron_number_density` for the general
  profile quantity and `iron_composition_fraction` for the relative abundance.
