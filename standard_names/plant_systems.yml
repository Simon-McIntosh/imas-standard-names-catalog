      kind: llm
- name: silane_count
  kind: scalar
  status: active
  description: "Cumulative gas-injection inventory after plasma breakdown, represented\
    \ as an equivalent-electron count based on the injected species\u2019 atomic content."
  documentation: 'This quantity is the cumulative inventory of gas introduced by injection
    after plasma breakdown, expressed using an equivalent-electron counting convention
    rather than as a direct particle count.


    For injected molecular species, the equivalent-electron count is defined by


    $$

    N_{\mathrm{eq}} = \sum_m Z_m N_m

    $$


    where $N_{\mathrm{eq}}$ is the accumulated equivalent-electron count, $N_m$ is
    the cumulative number of injected molecules of species $m$, and $Z_m$ is the sum
    of the atomic numbers of the atoms in one neutral molecule of species $m$.


    The quantity accumulates post-breakdown injection and excludes gas introduced
    during the prefill phase. It is distinct from the instantaneous [silane source
    rate](name:silane_source_rate) and is instantiated for silane by [accumulated
    silane count](name:accumulated_silane_count); [silane prefill count](name:silane_prefill_count)
    represents the separate pre-breakdown interval.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:silane_source_rate
  - name:accumulated_silane_count
  - name:silane_prefill_count
- name: accumulated_silane_count
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of silane (SiH4) molecules delivered
    by gas injection, expressed as an equivalent-electron count with 18 counts per
    molecule.
  documentation: 'This quantity is the cumulative post-breakdown inventory of silane
    (SiH4) delivered by gas injection, expressed using an equivalent-electron counting
    convention rather than as a direct molecular count.


    $$

    N_{\mathrm{eq}}^{\mathrm{SiH_4}}(t) = 18\,N_{\mathrm{SiH_4}}(t)

    $$


    where $N_{\mathrm{eq}}^{\mathrm{SiH_4}}(t)$ is the cumulative equivalent-electron
    count and $N_{\mathrm{SiH_4}}(t)$ is the cumulative number of silane molecules
    injected after plasma breakdown. The factor 18 is the sum of the silicon atomic
    number 14 and the four hydrogen atomic numbers, each equal to 1.


    This quantity is the post-breakdown component of [silane_count](name:silane_count).
    It excludes silane introduced during prefill, represented by [silane_prefill_count](name:silane_prefill_count),
    and counts delivered molecules rather than electrons currently present in the
    plasma or a particular molecular ionization state.'
  unit: '1'
  physics_domain: plant_systems
