- name: per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged absorbed wave power per unit volume deposited
    on the thermal ion population by a coherent wave, resolved per toroidal mode number
    n_phi. Each mode contribution is tracked separately, with positive and negative
    toroidal mode numbers treated as distinct. The sum over all mode numbers recovers
    the total thermal ion absorbed power density.
  documentation: 'The quantity $p_{\mathrm{th,i}}(n_\phi, \rho)$ is the flux-surface-averaged
    absorbed wave power density deposited on thermal ions by a single coherent wave,
    decomposed by toroidal mode number $n_\phi$. For each flux surface labeled by
    the normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}} \in [0, 1]$,
    the total thermal ion absorbed power density is recovered by summing over all
    toroidal mode numbers:

    $$p_{\mathrm{th,i}}(\rho) = \sum_{n_\phi} p_{\mathrm{th,i}}(n_\phi, \rho),$$

    where the sum runs over all distinct integer values of $n_\phi$ retained in the
    wave model, with positive and negative $n_\phi$ treated as separate contributions.


    The volume-integrated thermal ion absorbed power inside a flux surface at $\rho$
    is related to this density by

    $$P_{\mathrm{th,i,<}}(n_\phi, \rho) = \int_0^{\rho} p_{\mathrm{th,i}}(n_\phi,
    \rho'') \, dV(\rho''),$$

    where $dV$ is the volume element of the nested flux surface. Integrating over
    the full plasma volume gives the total per-mode absorbed power $P_{\mathrm{th,i}}(n_\phi)$.


    Physically, the decomposition into toroidal mode numbers isolates the contribution
    of individual wave-particle resonance branches (e.g., ion cyclotron resonance
    or transit resonance) associated with a given $n_\phi$. Dominant contributions
    typically arise from the lowest-order toroidal harmonics excited by the antenna
    spectrum. Typical magnitudes range from $10^3$ to $10^7\,\mathrm{W\,m^{-3}}$ depending
    on plasma density, wave frequency, and ion species.


    Sign convention: Positive when power is transferred from the wave to the thermal
    ion population (net heating).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_wave_absorbed_power_density
  - name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_density
  - name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density
