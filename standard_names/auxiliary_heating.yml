    dd_path: summary/heating_current_drive/power_ec/value
    status: composed
  - id: dd:summary/heating_current_drive/power_launched_ec/value
    dd_path: summary/heating_current_drive/power_launched_ec/value
    status: attached
- name: absorbed_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: draft
  description: Total ion cyclotron resonance heating (ICRH) power absorbed by the
    thermal ion population and plasma, integrated over the entire plasma volume and
    summed over all antennas and toroidal modes.
  documentation: "The absorbed power due to ion cyclotron heating, $P_{\\mathrm{IC}}$,\
    \ is the total power transferred from the ICRH antennas to the plasma via wave\
    \ absorption at the ion cyclotron resonance layers and nearby harmonic resonances.\
    \ It is the integral over the plasma volume of the local power deposition density,\
    \ $p_{\\mathrm{IC}}(R,\\phi,Z)$, that is, $P_{\\mathrm{IC}} = \\iiint_V p_{\\\
    mathrm{IC}} \\,dV$, where $V$ is the plasma volume. The deposition density $p_{\\\
    mathrm{IC}}$ accounts for absorption by both the thermal ion species (e.g., hydrogen,\
    \ deuterium, helium-3) and, if present, the thermal electrons via collisional\
    \ damping of the wave fields. In practice, the total power can also be expressed\
    \ as the sum over the launched toroidal mode numbers $n_\\phi$ of the volume-integrated\
    \ power per mode: $P_{\\mathrm{IC}} = \\sum_{n_\\phi} \\iiint_V p_{n_\\phi} \\\
    ,dV$, where $p_{n_\\phi}$ is the local power density (in $\\mathrm{W\\,m^{-3}}$)\
    \ contributed by the mode $n_\\phi$. This quantity typically falls in the range\
    \ of 1\u201320 MW for present-day tokamaks (e.g., JET, ASDEX Upgrade, DIII-D)\
    \ and up to several tens of MW for future devices like ITER. The power is localized\
    \ near the cyclotron resonance surface(s) of the absorbing ion species, with spatial\
    \ width determined by Doppler broadening and finite Larmor radius effects. In\
    \ the right-handed cylindrical $(R,\\phi,Z)$ frame of the machine, the wave polarization\
    \ and resonance location depend on the local magnetic field strength $B(R,Z)$\
    \ and the toroidal angle $\\phi$.\n\nSign convention: Positive when net power\
    \ flows from the ICRH system into the plasma (heating)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_due_to_electron_cyclotron_heating
  - name:per_toroidal_mode_thermal_ion_power_density
  sources:
  - id: dd:summary/heating_current_drive/ic/power/value
    dd_path: summary/heating_current_drive/ic/power/value
    status: composed
  - id: dd:summary/heating_current_drive/power_ic/value
    dd_path: summary/heating_current_drive/power_ic/value
    status: composed
- name: absorbed_power_due_to_neutral_beam_injection
  kind: scalar
  status: draft
  description: Neutral beam injection power that is absorbed by the plasma, defined
    as launched power minus losses due to shine-through and fast ion orbit effects.
  documentation: "The absorbed power due to neutral beam injection quantifies the\
    \ effective NBI heating power retained within the confined plasma. It represents\
    \ the total power coupled from all beam sources to the plasma, calculated as $P_{\\\
    text{abs}} = P_{\\text{launched}} - P_{\\text{shine}} - P_{\\text{orbit}}$, where\
    \ $P_{\\text{launched}}$ is the power injected into the vacuum vessel, $P_{\\\
    text{shine}}$ is the power lost to the first wall due to incomplete ionization,\
    \ and $P_{\\text{orbit}}$ accounts for prompt fast-ion orbit losses. This quantity\
    \ is a key figure of merit for NBI system efficiency and is typically derived\
    \ from beam attenuation calculations and fast-ion transport simulations. In ITER-scale\
    \ plasmas, absorbed power values range from 10\u201350 MW depending on beam energy,\
    \ plasma density, and geometry. Compare with the total launched power described\
    \ by [launched_power_due_to_neutral_beam_injection](name:launched_power_due_to_neutral_beam_injection)\
    \ and the power lost during coupling in [fast_particle_source_rate_due_to_neutral_beam_shinethrough](name:fast_particle_source_rate_due_to_neutral_beam_shinethrough)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_due_to_neutral_beam_injection
  - name:fast_particle_source_rate_due_to_neutral_beam_shinethrough
  sources:
  - id: dd:summary/heating_current_drive/nbi/power/value
    dd_path: summary/heating_current_drive/nbi/power/value
    status: composed
  - id: dd:summary/heating_current_drive/power_nbi/value
    dd_path: summary/heating_current_drive/power_nbi/value
    status: composed
- name: fast_ion_absorbed_power
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by fast ions within a given flux surface,
    integrated from the plasma boundary inward.
  documentation: "The cumulative absorbed power $P_{\\mathrm{abs,fast}}(\\rho)$ represents\
    \ the volume-integrated wave power deposited into the fast-ion population from\
    \ the plasma boundary to the flux surface labeled by normalized poloidal flux\
    \ $\\rho$. It is obtained by integrating the local fast-ion absorbed power density\
    \ $p_{\\mathrm{abs,fast}}$ over the enclosed volume: $P_{\\mathrm{abs,fast}}(\\\
    rho) = \\int_{V(\\rho)}^{V_{\\mathrm{edge}}} p_{\\mathrm{abs,fast}}(V')\\,dV'$,\
    \ where $V$ is the plasma volume enclosed by the flux surface. This quantity is\
    \ a key output of ICRH and NBI heating codes, commonly inferred from fast-ion\
    \ diagnostics such as neutral particle analyzers and gamma-ray spectrometers.\
    \ Typical absorbed powers for fast ions range from 1\u201310 MW in present-day\
    \ tokamaks, depending on the heating scheme and plasma parameters, with ICRH often\
    \ contributing 1\u20133 MW and NBI 3\u201310 MW in large devices. The companion\
    \ quantity [thermal_ion_absorbed_power](name:thermal_ion_absorbed_power) gives\
    \ the equivalent for the thermal ion population, while [absorbed_power](name:absorbed_power)\
    \ refers to the total absorbed power across all species.\n\nSign convention: Positive\
    \ when power flows from the wave field into the fast-ion population."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_absorbed_power
  - name:absorbed_power
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_fast
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_fast
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_inside_fast
    dd_path: waves/coherent_wave/profiles_1d/ion/state/power_inside_fast
    status: composed
- name: gas_fraction_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Mole fraction of a specified gas species in the neutral beam injector
    gas mixture, setting the beam composition.
  documentation: "The gas fraction quantifies the proportion, by molecule count, of\
    \ a given species (e.g., deuterium, tritium, hydrogen) in the neutral beam injector's\
    \ fuel gas supply. This fraction determines the isotopic composition of the extracted\
    \ and accelerated beam, which directly influences beam stopping, shine-through,\
    \ and the resulting fast-ion population. Typical gas mixtures range from pure\
    \ deuterium (fraction = 1.0) to 50:50 deuterium\u2013tritium mixtures (fraction\
    \ = 0.5 for each). The fraction is specified as part of the beamline configuration\
    \ and is convention-dependent \u2014 see [multiplicity](name:multiplicity) for\
    \ the molecular composition of the gas species and [neutral_gas_source_rate_of_wall](name:neutral_gas_source_rate_of_wall)\
    \ for the wall source rate of neutral gas.\n\nSign convention: Positive when the\
    \ species constitutes the stated fraction of the total molecule count in the injector\
    \ gas mixture."
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:multiplicity
  - name:neutral_gas_source_rate_of_wall
  sources:
  - id: dd:pulse_schedule/nbi/unit/species/fraction
    dd_path: pulse_schedule/nbi/unit/species/fraction
    status: composed
- name: major_radius_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Cylindrical major radius (R) coordinate of the beam tracing beam position
    in the IMAS right-handed $(R, \phi, Z)$ frame.
  documentation: 'The major radius $R_{\rm beam}$ locates the beam tracing beam in
    the cylindrical $(R, \phi, Z)$ system, defining the radial offset of the wave
    propagation axis from the machine symmetry axis. The beam position is a reference
    point for calculating the ray path and power deposition profile in wave-tracing
    codes such as TORBEAM or GENRAY. This coordinate is paired with the vertical coordinate
    $Z_{\rm beam}$ found in `major_radius_of_beam_tracing_beam` to fully specify the
    beam origin; typical values in medium-size tokamaks range from 1.5 m to 3.0 m.
    The beam-tracing region spans from the launcher to the plasma edge, where the
    beam width and refractive index are evolved along the ray.


    Sign convention: Positive when $R_{\rm beam}$ lies outside the machine symmetry
    axis, consistent with the standard $+\hat{R}$ direction.


    See also [major_radius_of_neutral_beam_injector](name:major_radius_of_neutral_beam_injector)
    for the injector location and [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis)
    for the plasma center.'
  unit: m
  physics_domain: auxiliary_heating
  links:
