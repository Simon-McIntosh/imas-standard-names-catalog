        measured count rate. Represents the number of neutrons per unit area per unit
        time arriving at the detector, used to characterise the neutron emission rate
        from the plasma.
      kind: llm
- name: neutron_maximum_energy_of_neutron_detector
  kind: scalar
  status: active
  description: High-energy endpoint of the neutron kinetic-energy interval assigned
    to a neutron detector energy band.
  documentation: 'The maximum neutron energy of a detector band is the upper kinetic-energy
    boundary used to classify energy-resolved neutron counts. It is an instrumental
    band limit, not the maximum energy present in the neutron population.


    The selected energy interval is bounded by


    $$

    E_{\min} \leq E_n \leq E_{\max}

    $$


    where $E_n$ is neutron kinetic energy, $E_{\min}$ is the lower band boundary,
    and $E_{\max}$ is this quantity. The lower boundary is represented by [lower-bound
    neutron-detector energy](name:lower_bound_energy_of_neutron_detector); [neutron-detector
    energy](name:energy_of_neutron_detector) denotes a band boundary without specifying
    which edge.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
