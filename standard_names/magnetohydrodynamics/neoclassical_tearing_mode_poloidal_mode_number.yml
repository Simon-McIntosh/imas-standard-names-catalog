name: neoclassical_tearing_mode_poloidal_mode_number
status: draft
cocos_transformation_type: one_like
description: Integer poloidal mode number $m$ of a neoclassical tearing mode, identifying
  the poloidal periodicity of the island structure.
documentation: "The poloidal mode number $m$ specifies how many times the NTM island\
  \ chain repeats around the poloidal circumference of the resonant flux surface where\
  \ the safety factor satisfies $q = m/n$, with $n$ the toroidal mode number. Common\
  \ NTM helicities in tokamaks are $m/n = 2/1$ and $3/2$; the $2/1$ mode often leads\
  \ to locked modes and disruptions while the $3/2$ mode degrades energy confinement\
  \ by $\\sim 10$\u2013$30\\%$. The mode number is determined from magnetic pickup\
  \ coils (Mirnov probes), ECE, or soft-X-ray camera arrays by Fourier decomposition\
  \ of the measured fluctuations. Together with $n$, $m$ uniquely labels the resonant\
  \ surface and controls the neoclassical bootstrap-current drive that sustains the\
  \ island."
