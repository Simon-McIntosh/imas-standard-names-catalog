      data_type: FLT_1D
      unit: A
      coordinates:
      - wall/time
    enhanced_context:
      description: "Toroidal current (I\u03C6) flowing in the vacuum vessel wall,\
        \ induced by changing magnetic flux during plasma operation. Contributes to\
        \ passive stabilization of vertical displacement events and affects equilibrium\
        \ reconstruction."
      kind: llm
- name: total_incident_power_at_wall
  kind: scalar
  status: active
  description: Total plasma power arriving at all plasma-facing wall surfaces, summed
    over conducted, convected, radiative, and other incident energy channels.
  documentation: 'This quantity is the total energy delivered from the plasma to plasma-facing
    wall and divertor surfaces by all incident channels. It represents the area-integrated
    power arriving at those surfaces before reflection or re-emission.


    The total incident power is defined by integrating the incident energy-flux density
    over the complete plasma-facing area:


    $$

    P_{\mathrm{inc}} = \int_{A_{\mathrm{wall}}} q_{\mathrm{inc}}(\mathbf r)\,\mathrm{d}A

    $$


    where $P_{\mathrm{inc}}$ is the total incident power, $A_{\mathrm{wall}}$ is the
    union of the relevant plasma-facing surfaces, $q_{\mathrm{inc}}(\mathbf r)$ is
    the incident power per unit area at surface position $\mathbf r$, and $\mathrm{d}A$
    is a differential surface area. The integrand is the area-density counterpart
    [energy flux at wall](name:energy_flux_at_wall). The total includes all incident
    energy channels and excludes power emitted from the wall toward the plasma or
    vacuum.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall
  sources:
  - dd_path: wall/global_quantities/power_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-power_incident
    dd_documentation:
      leaf: Total power incident on the wall. This power is split in the various physical
        categories listed below
      parent_path: wall/global_quantities
      parent: Simple 0D description of plasma-wall interaction
      data_type: FLT_1D
      unit: W
      coordinates:
      - wall/time
    enhanced_context:
      description: Total power incident on the first wall and divertor surfaces from
        the plasma, representing the sum of all power channels delivered to wall-facing
        components. Acts as the overall normalization for conducted, convected, radiated,
        and other power components.
      kind: llm
- name: total_ion_density_at_limiter
  kind: scalar
  status: active
  description: Charge-state-summed number density of all ion species in the boundary
    plasma immediately on the plasma-facing side of a limiter surface.
  documentation: 'Total ion density at a limiter is the local number density of all
    charged ion species and ionization states at the plasma-side evaluation point
    adjacent to the limiter. It is the charge-state-summed component of [ion_density_at_limiter](name:ion_density_at_limiter).


    The defining aggregation is


    $$

    n_{i,\mathrm{tot}} = \sum_s \sum_{Z\geq 1} n_{s,Z}

    $$


    where $n_{s,Z}$ is the number density of ion species $s$ in charge state $Z$,
    and the sums include every ion species and positive charge state present at the
    evaluation point.


    Neutral atoms and molecules are excluded, as is electron density. The limiter-local
    aggregation is distinct from the corresponding total quantity at the plasma boundary,
    [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary),
    because the evaluation locus is specifically the plasma-facing side of a limiter
    surface.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_density_at_limiter
  - name:total_ion_density_at_plasma_boundary
  arguments:
