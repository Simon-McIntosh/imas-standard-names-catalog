name: neutral_momentum_poloidal_diffusivity
status: draft
description: Effective diffusion coefficient for neutral-species momentum transport
  in the poloidal direction.
documentation: "The neutral momentum poloidal diffusivity $D_{\\theta,{\\rm mom}}^{\\\
  rm n}$ (m$^2$ s$^{-1}$) enters the diffusive closure of the neutral momentum equation\
  \ as $\\Pi_{\\theta,{\\rm diff}}^{\\rm n} = -D_{\\theta,{\\rm mom}}^{\\rm n} \\\
  nabla_\\theta (\\rho_n v_n)$, where $\\rho_n$ is the neutral mass density (kg m$^{-3}$)\
  \ and $v_n$ the neutral flow velocity (m/s). Neutral momentum diffusion is principally\
  \ governed by charge-exchange mean free paths and neutral\u2013neutral collisions;\
  \ typical values in high-recycling divertor conditions are $0.01$\u2013$1$ m$^2$\
  \ s$^{-1}$, significantly smaller than the ion counterpart due to shorter mean free\
  \ paths at high neutral densities. This quantity is provided on 1-D radial profiles\
  \ for each neutral state and is used in edge transport solvers to close the neutral\
  \ fluid momentum balance. See also the ion poloidal diffusivity and neutral energy\
  \ transport coefficients."
validity_domain: ''
