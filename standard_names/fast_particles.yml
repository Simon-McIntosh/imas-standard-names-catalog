- name: energy_source_density_due_to_thermalization
  kind: scalar
  status: draft
  description: Volumetric rate of energy transferred into the thermal plasma population
    from the slowing-down of fast particles.
  documentation: "The energy source density due to thermalization $S_E^{\\mathrm{th}}$\
    \ (in W/m$^3$) quantifies the local power per unit volume deposited into the bulk\
    \ thermal particle population as supra-thermal (fast) particles decelerate through\
    \ Coulomb collisions to thermal energies. The governing relation is $S_E^{\\mathrm{th}}\
    \ = \\int f_\\mathrm{fast}(v)\\, \\nu_E(v)\\, E\\, d^3v$, where $f_\\mathrm{fast}$\
    \ is the fast-particle distribution function, $\\nu_E$ is the energy-loss collision\
    \ frequency, and $E$ is kinetic energy. For NBI-heated tokamak plasmas, core values\
    \ of $10^4$\u2013$10^6$ W/m$^3$ are common depending on beam power and target\
    \ density. This source term enters the thermal energy balance as a heating channel\
    \ complementary to direct auxiliary heating. See also [particle_source_rate_due_to_thermalization](name:particle_source_rate_due_to_thermalization)\
    \ for the corresponding particle source."
  unit: W.m^-3
  tags:
  - energy-balance
  - heating-deposition
  links: []
  validity_domain: ''
  constraints: []
- name: fast_ion_toroidal_angular_momentum_density_source
  kind: scalar
  status: draft
  description: Local source rate of toroidal angular momentum density delivered by
    a fast-ion-related mechanism.
  documentation: "This quantity gives the rate of toroidal angular momentum density\
    \ (force per unit area in the $\\hat{\\phi}$ direction) injected into the plasma\
    \ at each spatial location by a fast-ion-related source. It enters the toroidal\
    \ momentum transport equation as $\\partial(n m R v_\\phi)/\\partial t + \\nabla\
    \ \\cdot \\boldsymbol{\\Pi}_\\phi = S_{L_\\phi}$, where $S_{L_\\phi}$ is this\
    \ source term, $n$ is the density, $m$ the ion mass, $R$ the major radius, $v_\\\
    phi$ the toroidal velocity, and $\\boldsymbol{\\Pi}_\\phi$ the momentum flux tensor.\
    \ Provided on a 1-D radial or 2-D poloidal grid; integrating over the plasma volume\
    \ yields the global [toroidal_torque](name:toroidal_torque). Computed by beam-deposition\
    \ codes (NUBEAM, ASCOT) for NBI or by wave-momentum models for ICRH-accelerated\
    \ fast ions. In NBI-heated scenarios, peak values can reach order $10^{-1}$\u2013\
    $10^{0}$ N\xB7m$^{-2}$ near the beam tangency radius. See [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ for the global collisional partitioning and [fast_particle_toroidal_torque_density_due_to_radial_current](name:fast_particle_toroidal_torque_density_due_to_radial_current)\
    \ for the $j_r \\times B$ torque density channel."
  unit: N.m^-2
  tags:
  - derived
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: fast_particle_toroidal_torque_density_due_to_radial_current
  kind: scalar
  status: draft
  description: Toroidal torque density exerted on the plasma by the radial component
    of fast-particle currents crossing flux surfaces.
  documentation: "The toroidal torque density due to radial currents $\\tau_{\\phi,j_r}$\
    \ (unit $\\mathrm{N\\,m^{-2}}$) arises from the $j_r \\times B_\\theta$ force\
    \ that fast-particle radial drifts exert on the bulk plasma in the toroidal direction.\
    \ In tokamak geometry, the radial current carried by trapped fast ions executing\
    \ finite-width banana orbits produces a local $\\mathbf{j} \\times \\mathbf{B}$\
    \ torque: $\\tau_{\\phi,j_r} = j_r B_\\theta - j_\\theta B_r$ projected onto $\\\
    hat{\\phi}$, where $j_r$ is the fast-particle radial current density and $B_\\\
    theta$ the poloidal field. This mechanism is distinct from collisional drag torques\
    \ and can be significant in the presence of large orbit-width effects (e.g., ICRH\
    \ tail ions or lost alpha particles). Computed by Monte-Carlo orbit-following\
    \ codes such as ASCOT and SPIRAL; magnitudes are of order $10^{-1}$\u2013$10^{1}\\\
    ,\\mathrm{N\\,m^{-2}}$ in the core of NBI-heated discharges. See also [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)\
    \ for the total fast-ion momentum source and [toroidal_angular_momentum_density_source_rate_due_to_thermalization](name:toroidal_angular_momentum_density_source_rate_due_to_thermalization)\
    \ for the thermalization channel."
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_energy_source_density_due_to_thermalization
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the volumetric energy
    source density from fast-particle thermalization.
  documentation: This field provides the negative (lower) error bar for [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization),
    representing the magnitude of the maximum negative deviation from the nominal
    value. The stored quantity is a non-negative offset in $\mathrm{W\,m^{-3}}$ such
    that the lower confidence limit is $S_E - \Delta S_{E,\mathrm{lower}}$. Asymmetric
    uncertainties arise from Monte-Carlo statistics in orbit-following codes, sensitivity
    to plasma profile inputs, and model assumptions about the slowing-down distribution.
    Combined with [upper_uncertainty_of_energy_source_density_due_to_thermalization](name:upper_uncertainty_of_energy_source_density_due_to_thermalization),
    the full confidence interval is recovered. See also the parent quantity [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization).
  unit: W.m^-3
  tags:
  - spatial-profile
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_power_due_to_thermalization
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the total power released
    by thermalization of a fast-particle distribution.
  documentation: This quantity gives the downward (lower) error bar $\sigma^{-}_{P_{\text{th}}}$
    (in W) on the total thermalization power $P_{\text{th}}$, which is the rate of
    kinetic energy transfer from a suprathermal (fast-ion or fast-electron) population
    to the bulk plasma as the distribution relaxes toward a Maxwellian. Thermalization
    power values range from sub-MW in present-day experiments to tens of MW in burning-plasma
    scenarios; the associated uncertainty arises from modeling assumptions in the
    fast-particle distribution function (e.g., slowing-down versus Monte Carlo estimates).
    This is the lower component of an asymmetric error; pair with the upper uncertainty
    for complete error characterization. See also [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization)
    and [particle_source_rate_due_to_thermalization](name:particle_source_rate_due_to_thermalization).
  unit: W
  tags:
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_toroidal_component_of_current_density
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the toroidal component
    of the current density.
  documentation: "This field stores the negative (lower) error bar for the toroidal\
    \ current density $j_\\phi$ (unit $\\mathrm{A\\,m^{-2}}$), representing the magnitude\
    \ of the maximum negative deviation from the nominal value within the stated confidence\
    \ interval. The stored value is a non-negative offset so that the lower confidence\
    \ limit is $j_\\phi - \\Delta j_{\\phi,\\mathrm{lower}}$. Asymmetric uncertainties\
    \ arise from equilibrium reconstruction (e.g., EFIT, LIUQE) where the Grad\u2013\
    Shafranov inversion produces non-Gaussian posterior distributions, or from Monte-Carlo\
    \ fast-particle current-drive calculations. Combined with the upper uncertainty\
    \ counterpart, the full confidence interval is recovered. See also [toroidal_component_of_fast_particle_current_density](name:toroidal_component_of_fast_particle_current_density)\
    \ and [toroidal_component_of_trapped_fast_particle_current_density](name:toroidal_component_of_trapped_fast_particle_current_density)\
    \ for related current-density quantities."
  unit: A.m^-2
  tags:
  - equilibrium-reconstruction
  - spatial-profile
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: particle_source_rate_due_to_thermalization
  kind: scalar
  status: draft
  description: Total rate at which fast particles thermalize and join the bulk thermal
    population, integrated over the plasma volume.
  documentation: The particle source rate due to thermalization $\dot{N}_{\mathrm{th}}$
    (unit $\mathrm{s^{-1}}$) is the volume-integrated rate at which suprathermal particles
    complete their slowing-down and are reclassified as thermal. It is the integral
    of the local density source $\dot{N}_{\mathrm{th}} = \int S_{n,\mathrm{th}}\,\mathrm{d}V$,
    where $S_{n,\mathrm{th}}$ is the [thermal_particle_density_source_rate_due_to_thermalization](name:thermal_particle_density_source_rate_due_to_thermalization).
    In steady-state NBI-heated discharges, $\dot{N}_{\mathrm{th}}$ approximately equals
    the neutral-beam injection particle rate minus prompt and ripple losses. For a
    20 MW deuterium beam at 80 keV injection energy into a reactor-scale plasma, $\dot{N}_{\mathrm{th}}
    \sim 10^{20}\,\mathrm{s^{-1}}$. This quantity enters global particle-balance bookkeeping
    and is computed by orbit-following Monte-Carlo codes (NUBEAM, ASCOT) or analytic
    slowing-down models. See also [power_due_to_thermalization](name:power_due_to_thermalization)
    for the energy counterpart and [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization)
    for the local energy channel.
  unit: s^-1
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  - particle-balance
  links: []
  validity_domain: ''
  constraints: []
- name: power_due_to_thermalization
  kind: scalar
  status: draft
  description: Total power delivered to the thermal plasma population by fast particles
    that complete their slowing-down and thermalize.
  documentation: "The thermalization power $P_{\\mathrm{th}}$ (unit W) is the volume-integrated\
    \ rate of kinetic energy transferred from the suprathermal (fast-particle) distribution\
    \ to the bulk thermal plasma at the moment particles cross the thermalization\
    \ threshold. It relates to the local energy source density $S_E$ via $P_{\\mathrm{th}}\
    \ = \\int S_E\\,\\mathrm{d}V$, where $S_E$ is the [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization).\
    \ This quantity closes the fast-particle energy balance: $P_{\\mathrm{inj}} =\
    \ P_{\\mathrm{th}} + P_{\\mathrm{loss,fp}} + \\mathrm{d}W_{\\mathrm{fp}}/\\mathrm{d}t$,\
    \ where $P_{\\mathrm{inj}}$ is the injected heating power, $P_{\\mathrm{loss,fp}}$\
    \ fast-particle losses, and $W_{\\mathrm{fp}}$ the stored fast-particle energy.\
    \ Computed by Monte-Carlo orbit codes (NUBEAM, ASCOT) or analytic slowing-down\
    \ models; for 20 MW NBI in a large tokamak, $P_{\\mathrm{th}} \\sim 15$\u2013\
    $19\\,\\mathrm{MW}$ after subtracting prompt and ripple losses. See also [particle_source_rate_due_to_thermalization](name:particle_source_rate_due_to_thermalization)\
    \ for the particle channel."
  unit: W
  tags:
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: thermal_ion_collisional_toroidal_torque_due_to_fast_ions
  kind: scalar
  status: draft
  description: Volume-integrated toroidal torque transferred from the fast-ion population
    to bulk thermal ions via Coulomb collisions.
  documentation: "The thermal ion collisional toroidal torque due to fast ions $\\\
    tau_{\\phi,i}^{\\mathrm{fi}}$ (unit $\\mathrm{N\\cdot m}$) quantifies the global\
    \ toroidal angular momentum deposited into the bulk ion fluid by Coulomb pitch-angle\
    \ scattering and energy drag from suprathermal particles. Below the critical energy\
    \ $E_c$, ion-ion collisions dominate the slowing-down process and the fast-ion\
    \ momentum is preferentially transferred to thermal ions with mass and charge\
    \ closest to the fast species. The torque is given by $\\tau_{\\phi,i}^{\\mathrm{fi}}\
    \ = \\int \\mathrm{d}V \\sum_j \\int \\mathrm{d}^3v\\, m_f v_\\phi C_{fj}(f_f,\
    \ f_j)$, where $C_{fj}$ is the linearized Coulomb collision operator between the\
    \ fast distribution $f_f$ and thermal species $j$, and the integral runs over\
    \ the confined volume. Evaluated by orbit-following Monte-Carlo codes or Fokker\u2013\
    Planck solvers; values are of order $10^{-2}$\u2013$1\\,\\mathrm{N\\cdot m}$ for\
    \ NBI-heated tokamaks. This torque drives bulk plasma toroidal rotation and is\
    \ a primary input to momentum transport analysis. See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [thermal_electron_collisional_toroidal_torque_due_to_fast_ions](name:thermal_electron_collisional_toroidal_torque_due_to_fast_ions)\
    \ for the electron channel."
  unit: N.m
  tags:
  - global-quantity
  - momentum-balance
  links: []
  validity_domain: ''
  constraints: []
- name: thermal_particle_density_source_rate_due_to_thermalization
  kind: scalar
  status: draft
  description: Volumetric rate at which thermal particle density increases due to
    fast particles slowing down and joining the thermal population.
  documentation: "The thermal particle density source rate due to thermalization $S_{n,\\\
    mathrm{th}}$ (unit $\\mathrm{m^{-3}\\,s^{-1}}$) quantifies the local rate at which\
    \ fast (supra-thermal) particles decelerate through Coulomb collisions and become\
    \ part of the bulk thermal distribution. When a fast ion's kinetic energy drops\
    \ below the critical energy $E_c \\approx 14.8\\,T_e (A_f^{2/3} \\sum_i n_i Z_i^2\
    \ / (n_e A_i))^{1/3}$ (where $T_e$ is the electron temperature, $A_f$ the fast-ion\
    \ mass number, $n_i$, $Z_i$, $A_i$ bulk-ion parameters, and $n_e$ the electron\
    \ density), it is reclassified as thermal, contributing to $S_{n,\\mathrm{th}}$.\
    \ This source enters the particle continuity equation $\\partial n / \\partial\
    \ t + \\nabla \\cdot \\Gamma = S_{n,\\mathrm{th}} + \\ldots$ and is computed by\
    \ orbit-following Monte-Carlo codes (e.g., NUBEAM, ASCOT) or by solving the Fokker\u2013\
    Planck slowing-down equation. For NBI-heated H-mode tokamak plasmas the thermalization\
    \ source is of order $10^{18}$\u2013$10^{20}\\,\\mathrm{m^{-3}\\,s^{-1}}$ depending\
    \ on beam power and core density. See also [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization)\
    \ for the companion energy channel and [toroidal_angular_momentum_density_source_rate_due_to_thermalization](name:toroidal_angular_momentum_density_source_rate_due_to_thermalization)\
    \ for the momentum counterpart."
  unit: m^-3.s^-1
  tags:
  - energy-balance
  - particle-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_co_passing_collisional_torque_density_on_fast_ions
  kind: vector
  status: draft
  description: Toroidal torque per unit volume exerted on the fast-ion population
    by Coulomb collisions with the co-passing partition of the distribution.
  documentation: The toroidal collisional torque density on fast ions from co-passing
    particles, $\tau_{\phi,\mathrm{fast}}^{\mathrm{co}}$ (unit N m$^{-2}$), represents
    the rate of toroidal angular momentum transfer per unit volume to the energetic-ion
    population due to Coulomb collisions involving the co-passing velocity-space subset
    of the distribution function. Here 'co-passing' denotes particles whose parallel
    velocity $v_\parallel > 0$ relative to the plasma current direction and whose
    orbits are untrapped. This quantity enters the fast-ion momentum balance $\partial(n_f
    m_f R v_{\phi,f})/\partial t = \tau_{\phi,\mathrm{fast}}^{\mathrm{co}} + \ldots$,
    where $n_f$ is the fast-ion density, $m_f$ is the fast-ion mass, $R$ is the major
    radius, and $v_{\phi,f}$ is the fast-ion toroidal velocity. It is computed by
    orbit-following Monte Carlo codes (e.g., NUBEAM, ASCOT) that resolve the velocity-space
    partitions. Values range from $10^{-3}$ to $10^{0}$ N m$^{-2}$ depending on beam
    geometry, plasma density, and temperature. See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)
    for the volume-integrated counterpart and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)
    for the total momentum source.
  unit: N.m^-2
  tags:
  - derived
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_co_passing_current_density
  kind: vector
  status: draft
  description: Total toroidal current density from the co-passing orbit class, including
    both fast-particle drive and electron/thermal-ion drag current.
  documentation: "This quantity represents the net toroidal current density $j_{\\\
    phi}^{\\rm co}$ (in A\xB7m$^{-2}$) attributable to particles on co-passing orbits,\
    \ i.e., those with $v_\\parallel > 0$ relative to the equilibrium magnetic-field\
    \ direction. Unlike [toroidal_component_of_co_passing_fast_particle_current_density](name:toroidal_component_of_co_passing_fast_particle_current_density),\
    \ this includes the electron and thermal-ion back-current (drag current) that\
    \ partially cancels the direct fast-particle drive. The net co-passing current\
    \ is the physically observable contribution from this orbit class. It is computed\
    \ from the first velocity-space moment of the co-passing distribution function:\
    \ $j_{\\phi}^{\\rm co} = \\sum_s q_s \\int_{v_\\parallel>0} v_\\phi f_s\\, d^3v$,\
    \ where $q_s$ is the species charge, $v_\\phi$ the toroidal velocity component,\
    \ and $f_s$ the distribution function. Values can reach $10^5$\u2013$10^6$ A\xB7\
    m$^{-2}$ in strongly NBI-heated scenarios. See also [toroidal_component_of_counter_passing_current_density](name:toroidal_component_of_counter_passing_current_density)\
    \ for the counter-passing complement."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_co_passing_fast_particle_current_density
  kind: vector
  status: draft
  description: Toroidal current density carried by co-passing fast (non-thermal) particles,
    excluding drag-current contributions from background electrons and thermal ions.
  documentation: "This quantity gives the toroidal projection $j_{\\phi,\\rm fast}^{\\\
    rm co}$ (in A\xB7m$^{-2}$) of the current density produced by fast (supra-thermal)\
    \ particles whose parallel velocity is positive relative to the plasma current\
    \ direction (co-passing orbits). It excludes the compensating back-current (drag\
    \ current) carried by background electrons and thermal ions, thereby isolating\
    \ the direct fast-particle drive. The co-passing population is defined by its\
    \ pitch-angle range $v_\\parallel / v > 0$ in the frame where $v_\\parallel$ is\
    \ along the equilibrium magnetic field. Fast-particle current drive from neutral-beam\
    \ injection (NBI) is dominated by co-passing ions when the beam is tangentially\
    \ injected in the co-current direction. Values of order $10^4$\u2013$10^6$ A\xB7\
    m$^{-2}$ arise in NBI-heated H-mode plasmas. See also [toroidal_component_of_co_passing_current_density](name:toroidal_component_of_co_passing_current_density)\
    \ for the total (fast + drag) co-passing current and [toroidal_component_of_fast_particle_current_density](name:toroidal_component_of_fast_particle_current_density)\
    \ for the pitch-angle-integrated fast-particle current."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_ion_collisions
  kind: vector
  status: draft
  description: Toroidal torque density exerted on the fast-ion population by Coulomb
    collisions with background thermal ions.
  documentation: "This quantity represents the toroidal ($\\hat{\\phi}$) projection\
    \ of the collisional momentum transfer rate per unit volume from thermal ions\
    \ to fast ions, $\\tau_{\\phi,\\rm fast}^{\\rm ion} = (\\partial / \\partial t)(n_{\\\
    rm fast} m_{\\rm fast} v_{\\phi,\\rm fast})_{\\rm coll}$, where $n_{\\rm fast}$\
    \ is the fast-ion density, $m_{\\rm fast}$ their mass, and $v_{\\phi,\\rm fast}$\
    \ the toroidal component of the fast-ion fluid velocity. The unit is N/m$^2$ (stored\
    \ as $\\mathrm{m^{-2} \\cdot N}$). In neutral-beam-heated plasmas, this torque\
    \ density is a primary channel of toroidal angular momentum redistribution, governing\
    \ plasma rotation braking and the balance between beam-driven and intrinsic rotation;\
    \ magnitudes are on the order of $10^{-2}$\u2013$1$ N/m$^2$ in the core. It is\
    \ computed by Fokker\u2013Planck or Monte Carlo fast-ion codes (e.g., NUBEAM,\
    \ ASCOT). See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)."
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_fast_particles_due_to_ions
  kind: vector
  status: draft
  description: Toroidal torque density on the fast-particle population from Coulomb
    collisions with a specific ion charge state.
  documentation: "This quantity gives the toroidal ($\\hat{\\phi}$) projection of\
    \ the collisional momentum transfer rate per unit volume to the fast-particle\
    \ population from a given ion species in a particular charge state. It is distinguished\
    \ from the bulk-ion torque by the charge-state resolution, enabling species-resolved\
    \ momentum accounting in multi-ion plasmas (e.g., D\u2013T mixtures with impurities).\
    \ The torque density $\\tau_{\\phi,\\rm fast}^{\\rm ion,state}$ (N/m$^2$, stored\
    \ as $\\mathrm{m^{-2} \\cdot N}$) is evaluated per grid element in a 2-D profile\
    \ space by Fokker\u2013Planck or Monte Carlo codes (e.g., ASCOT, NUBEAM, TRANSP).\
    \ In reactors with significant helium ash or tungsten impurity content, the charge-state-resolved\
    \ decomposition is essential for predicting differential rotation and fast-ion\
    \ redistribution. See also [toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_ion_collisions](name:toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_ion_collisions)\
    \ and [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)."
  unit: N.m^-2
  tags:
  - impurity-transport
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_thermal_electrons_due_to_fast_particles
  kind: vector
  status: draft
  description: Toroidal-direction collisional torque per unit volume exerted on the
    thermal electron population by fast particles.
  documentation: "This vector-kind quantity represents the local rate of toroidal\
    \ angular momentum deposition into the thermal electron population by collisions\
    \ with fast (supra-thermal) particles. The torque density is $\\tau_{\\phi,e}(\\\
    mathbf{x}) = \\int f_\\mathrm{fast}(\\mathbf{x}, \\mathbf{v})\\, m_\\mathrm{fast}\\\
    , v_\\phi\\, \\nu_{s,e}(v)\\, d^3v$, where $f_\\mathrm{fast}$ is the fast-particle\
    \ distribution function, $v_\\phi$ the toroidal velocity, and $\\nu_{s,e}$ the\
    \ electron slowing-down collision frequency. It is provided on a 2-D poloidal\
    \ cross-section grid (or per flux surface after averaging) and has units of N\xB7\
    m$^{-2}$ (force per unit area in the toroidal direction). Integrating $\\tau_{\\\
    phi,e}$ over the plasma volume yields the global collisional toroidal torque on\
    \ electrons; see [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons).\
    \ Computed by orbit-following Monte Carlo codes (ASCOT, NUBEAM). Related density-level\
    \ quantities include [toroidal_collisional_torque_density_on_thermal_electron](name:toroidal_collisional_torque_density_on_thermal_electron)\
    \ and [toroidal_collisional_torque_density_on_fast_electron](name:toroidal_collisional_torque_density_on_fast_electron)."
  unit: N.m^-2
  tags:
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_thermal_electrons_due_to_trapped_fast_particles
  kind: vector
  status: draft
  description: Toroidal torque density exerted on thermal electrons by Coulomb collisions
    with trapped fast particles.
  documentation: "This quantity gives the toroidal ($\\hat{\\phi}$) projection of\
    \ the collisional momentum transfer rate per unit volume from trapped fast particles\
    \ to the thermal electron population, $\\tau_{\\phi,\\rm th,e}^{\\rm trap} = (\\\
    partial / \\partial t)(n_e m_e v_{\\phi,e})_{\\rm coll,trap}$, where $n_e$ is\
    \ the electron density, $m_e$ the electron mass, and $v_{\\phi,e}$ the toroidal\
    \ electron fluid velocity. Trapped fast particles, which are confined to banana\
    \ orbits, transfer net toroidal momentum to electrons through pitch-angle scattering\
    \ and energy drag. The unit is N/m$^2$ (stored as $\\mathrm{m^{-2} \\cdot N}$).\
    \ Because $m_e \\ll m_{\\rm fast}$, this torque channel is small compared to the\
    \ ion channel but becomes relevant for accurate current-drive efficiency predictions.\
    \ It is evaluated by Fokker\u2013Planck or Monte Carlo fast-particle codes (e.g.,\
    \ ASCOT, CQL3D). See also [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons)\
    \ and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)."
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_thermal_ion
  kind: vector
  status: draft
  description: Toroidal torque density exerted on a thermal-ion charge state by Coulomb
    collisions with trapped fast particles.
  documentation: "This quantity captures the toroidal ($\\hat{\\phi}$) projection\
    \ of the collisional momentum transfer rate per unit volume to a specific thermal-ion\
    \ charge state from the trapped portion of the fast-particle distribution. Trapped\
    \ fast particles confined to banana orbits transfer toroidal angular momentum\
    \ to background ions through pitch-angle scattering and slowing down. The torque\
    \ density (N/m$^2$, stored as $\\mathrm{m^{-2} \\cdot N}$) is resolved per charge\
    \ state, permitting species-level momentum accounting in multi-ion plasmas. It\
    \ is computed by orbit-following Monte Carlo or Fokker\u2013Planck codes such\
    \ as ASCOT, NUBEAM, or TRANSP on a 2-D profile grid. In ITER-relevant D\u2013\
    T plasmas, this torque channel contributes to differential rotation between fuel\
    \ species and helium ash. See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_ion_collisions](name:toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_ion_collisions)."
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_collisional_torque_density_on_thermal_ions_due_to_fast_particles
  kind: vector
  status: draft
  description: Toroidal torque density transferred to thermal ions via Coulomb collisions
    with fast (suprathermal) particles.
  documentation: "This quantity gives the rate of toroidal angular momentum deposited\
    \ per unit volume into the thermal ion population through Coulomb friction and\
    \ pitch-angle scattering with energetic (fast) particles, $\\tau_{\\phi,\\mathrm{th\\\
    _i}}^{\\mathrm{fp}} = \\sum_s \\int f_s \\, \\nu_{s,i}(v) \\, m_s v_\\phi \\,\
    \ d^3v$, where $f_s$ is the fast-particle distribution of species $s$, $\\nu_{s,i}$\
    \ the fast-particle collision frequency on thermal ions (s$^{-1}$), $m_s$ the\
    \ fast-particle mass (kg), and $v_\\phi$ the toroidal velocity (m/s). Below the\
    \ critical energy $E_c \\approx 14.8\\, T_e (A_\\mathrm{fp}/A_i)^{1/3}$ (with\
    \ $T_e$ in keV, $A$ mass numbers), ion drag dominates, making this channel the\
    \ primary momentum source from NBI in most operating regimes. Values of order\
    \ $10^{-2}$\u2013$10^{0}$ N m$^{-2}$ are found in NBI-heated H-mode cores. Computed\
    \ by Monte Carlo or Fokker\u2013Planck orbit codes. See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)."
  unit: N.m^-2
  tags:
  - auxiliary-heated
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_counter_passing_collisional_torque_density_on_thermal_electrons
  kind: vector
  status: draft
  description: Toroidal torque density exerted on thermal electrons by the counter-passing
    fraction of a particle distribution via Coulomb collisions.
  documentation: This quantity isolates the contribution to the toroidal angular momentum
    transfer rate per unit volume to thermal electrons from particles classified as
    counter-passing, i.e. those orbiting the torus in the direction opposite to the
    plasma current with $v_\parallel / v < 0$ (or the relevant pitch-angle partition).
    The torque density is $\tau_{\phi,e}^{\mathrm{cp}} = \int_{\mathrm{cp}} f(\mathbf{v})
    \, \nu_{e}(v) \, m v_\phi \, d^3v$, where $f$ is the fast-particle distribution
    function, $\nu_e$ is the collision frequency on thermal electrons (s$^{-1}$),
    $m$ the particle mass (kg), and $v_\phi$ the toroidal velocity (m/s). Separating
    co-passing and counter-passing contributions is essential for understanding the
    net torque asymmetry driven by anisotropic NBI or ICRF tail distributions. Computed
    by orbit-following codes (ASCOT, NUBEAM) with pitch-angle-resolved output. See
    also [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons)
    for the total electron-channel torque and [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)
    for the ion channel.
  unit: N.m^-2
  tags:
  - auxiliary-heated
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_counter_passing_current_density
  kind: vector
  status: draft
  description: Total toroidal current density from the counter-passing orbit class,
    including fast-particle drive and electron/thermal-ion drag current.
  documentation: "This quantity represents $j_{\\phi}^{\\rm ctr}$ (in A\xB7m$^{-2}$),\
    \ the net toroidal current density from all particles on counter-passing orbits\
    \ ($v_\\parallel < 0$ relative to the equilibrium field direction), including\
    \ both the direct fast-particle contribution and the electron and thermal-ion\
    \ back-current. It is computed as $j_{\\phi}^{\\rm ctr} = \\sum_s q_s \\int_{v_\\\
    parallel<0} v_\\phi f_s\\, d^3v$, where the integral runs over the counter-passing\
    \ portion of velocity space. Combining this with [toroidal_component_of_co_passing_current_density](name:toroidal_component_of_co_passing_current_density)\
    \ and [toroidal_component_of_trapped_current_density](name:toroidal_component_of_trapped_current_density)\
    \ recovers the total toroidal current density profile. Counter-passing current\
    \ is relevant for scenarios using balanced or counter-NBI for rotation control.\
    \ See also [toroidal_component_of_counter_passing_fast_particle_current_density](name:toroidal_component_of_counter_passing_fast_particle_current_density)\
    \ for the fast-only subset."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_counter_passing_fast_particle_collisional_torque_density_on_fast_electrons
  kind: vector
  status: draft
  description: Toroidal torque density on fast electrons from Coulomb collisions with
    counter-passing fast particles.
  documentation: This quantity represents the toroidal ($\hat{\phi}$) component of
    the collisional momentum transfer rate per unit volume to the fast-electron population
    from counter-passing fast particles. Counter-passing fast particles travel opposite
    to the plasma current direction and exert a distinctive frictional drag on fast
    electrons through pitch-angle scattering and slowing-down collisions. The torque
    density is expressed in N/m$^2$ (stored as $\mathrm{m^{-2} \cdot N}$) and is computed
    by kinetic fast-particle codes that resolve the velocity-space topology into passing
    and trapped classes (e.g., ASCOT, NUBEAM). This decomposition is relevant for
    scenarios with simultaneous neutral-beam injection and lower-hybrid or electron-cyclotron
    current drive, where fast-electron and fast-ion populations coexist and exchange
    momentum. See also [toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_counter_passing](name:toroidal_component_of_collisional_torque_density_on_fast_ions_due_to_counter_passing)
    and [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons).
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_counter_passing_fast_particle_current_density
  kind: vector
  status: draft
  description: Toroidal current density carried by counter-passing fast (non-thermal)
    particles, excluding drag-current contributions from background species.
  documentation: "This quantity gives $j_{\\phi,\\rm fast}^{\\rm ctr}$ (in A\xB7m$^{-2}$),\
    \ the toroidal current density produced by fast particles whose parallel velocity\
    \ opposes the plasma current direction (counter-passing orbits), excluding the\
    \ compensating electron and thermal-ion back-current. Counter-passing fast particles\
    \ arise from perpendicular-injection NBI, ICRF-accelerated ions with unfavorable\
    \ pitch angles, or fusion-born alpha particles on counter-going banana tips that\
    \ have de-trapped into passing orbits. Their current contribution is generally\
    \ smaller than the co-passing component but can become significant in advanced-scenario\
    \ current-profile tailoring. See also [toroidal_component_of_counter_passing_current_density](name:toroidal_component_of_counter_passing_current_density)\
    \ for the total counter-passing current including drag, and [toroidal_component_of_co_passing_fast_particle_current_density](name:toroidal_component_of_co_passing_fast_particle_current_density)\
    \ for the co-passing counterpart."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_current_density
  kind: vector
  status: draft
  description: Toroidal projection of the current density driven by a specific fast-particle
    distribution, including back-current corrections.
  documentation: "The toroidal driven current density $j_{\\phi,d}$ (in A m$^{-2}$)\
    \ represents the net toroidal current produced by a particular energetic-particle\
    \ population (e.g., NBI-born fast ions, ICRF-accelerated minority ions), including\
    \ electron and thermal-ion drag (back-current) corrections. It is computed from\
    \ the fast-particle distribution function via Fokker\u2013Planck or Monte Carlo\
    \ orbit-following codes. In a burning tokamak plasma, fast-ion driven currents\
    \ can reach $10^4$\u2013$10^6$ A m$^{-2}$ in localized regions depending on injection\
    \ geometry and energy. Positive $j_{\\phi,d}$ denotes current in the $+\\phi$\
    \ direction under COCOS-11. See also [toroidal_component_of_total_current_density](name:toroidal_component_of_total_current_density)\
    \ and [lower_uncertainty_of_toroidal_component_of_current_density](name:lower_uncertainty_of_toroidal_component_of_current_density)."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_fast_particle_collisional_torque_density_due_to_electrons
  kind: vector
  status: draft
  description: Toroidal torque density exerted on the fast-particle population through
    Coulomb collisions with thermal electrons.
  documentation: "This quantity describes the back-reaction torque: the rate of toroidal\
    \ angular momentum change per unit volume of the fast (suprathermal) particles\
    \ due to drag and pitch-angle scattering against the thermal electron background,\
    \ $\\tau_{\\phi,\\mathrm{fp}}^{e} = \\int f_\\mathrm{fp}(\\mathbf{v}) \\, \\nu_{\\\
    mathrm{fp},e}(v) \\, m_\\mathrm{fp} v_\\phi \\, d^3v$, where $f_\\mathrm{fp}$\
    \ is the fast-particle distribution, $\\nu_{\\mathrm{fp},e}$ is the collision\
    \ frequency of fast particles on electrons (s$^{-1}$), $m_\\mathrm{fp}$ the fast-particle\
    \ mass (kg), and $v_\\phi$ the toroidal velocity component (m/s). Because electron\
    \ drag dominates at high fast-particle energies (above the critical energy $E_c$),\
    \ this channel governs fast-ion slowing down in the supra-critical regime. It\
    \ is the Newton-III complement of the torque on thermal electrons due to fast\
    \ particles. Computed by orbit-following Monte Carlo or Fokker\u2013Planck solvers.\
    \ See also [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons)\
    \ and [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)."
  unit: N.m^-2
  tags:
  - auxiliary-heated
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_fast_particle_current_density
  kind: vector
  status: draft
  description: Toroidal current density carried by all fast (non-thermal) particles
    regardless of orbit class, excluding background drag current.
  documentation: "This quantity gives $j_{\\phi,\\rm fast}$ (in A\xB7m$^{-2}$), the\
    \ toroidal current density driven directly by the supra-thermal (fast) particle\
    \ population integrated over all pitch angles \u2014 co-passing, counter-passing,\
    \ and trapped orbits. It excludes the compensating back-current (drag current)\
    \ from background electrons and thermal ions, isolating the intrinsic fast-particle\
    \ drive. By orbit-class decomposition: $j_{\\phi,\\rm fast} = j_{\\phi,\\rm fast}^{\\\
    rm co} + j_{\\phi,\\rm fast}^{\\rm ctr} + j_{\\phi,\\rm fast}^{\\rm trap}$, where\
    \ the three terms correspond to the co-passing, counter-passing, and trapped fast-particle\
    \ contributions respectively. Fast-particle current drive is a key component of\
    \ non-inductive scenarios and is computed by codes such as NUBEAM, ASCOT, and\
    \ TRANSP from the slowing-down distribution function. On-axis values can reach\
    \ $10^5$\u2013$10^6$ A\xB7m$^{-2}$ in high-power NBI plasmas. See also [toroidal_component_of_co_passing_fast_particle_current_density](name:toroidal_component_of_co_passing_fast_particle_current_density)\
    \ and [toroidal_component_of_counter_passing_fast_particle_current_density](name:toroidal_component_of_counter_passing_fast_particle_current_density)\
    \ for the orbit-class decomposition."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_thermal_ion_collisional_torque_density
  kind: vector
  status: draft
  description: Net toroidal torque density on the thermal ion population arising from
    Coulomb collisions with all other species.
  documentation: "This quantity is the total collisional toroidal angular momentum\
    \ transfer rate per unit volume to the thermal ion population, summing contributions\
    \ from fast particles, thermal electrons, and other thermal ion species: $\\tau_{\\\
    phi,\\mathrm{th\\_i}} = \\sum_s \\int f_s(\\mathbf{v}) \\, \\nu_{s,i}(v) \\, m_s\
    \ v_\\phi \\, d^3v$, where $s$ runs over all collision partners, $f_s$ is the\
    \ distribution function, $\\nu_{s,i}$ the collision frequency on thermal ions\
    \ (s$^{-1}$), $m_s$ the mass (kg), and $v_\\phi$ the toroidal velocity (m/s).\
    \ In beam-heated scenarios the dominant channel is fast-ion friction; in pure\
    \ Ohmic discharges the electron\u2013ion friction sets the torque. Values span\
    \ $10^{-4}$\u2013$10^{0}$ N m$^{-2}$ depending on heating power and plasma collisionality.\
    \ Evaluated by Fokker\u2013Planck or Monte Carlo orbit codes. See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)."
  unit: N.m^-2
  tags:
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_thermal_ion_collisional_torque_density_due_to_co_passing_fast_particles
  kind: vector
  status: draft
  description: Toroidal torque per unit volume deposited on the thermal-ion population
    via Coulomb collisions with co-passing fast particles.
  documentation: "This quantity, $\\tau_{\\phi,\\mathrm{th}}^{\\mathrm{co}}$ (unit\
    \ N m$^{-2}$), gives the local rate of toroidal angular momentum transfer per\
    \ unit volume to the thermal-ion species due to Coulomb collisions with the co-passing\
    \ subset of the fast-particle distribution. The co-passing partition includes\
    \ energetic particles whose parallel velocity satisfies $v_\\parallel / v > 0$\
    \ (aligned with the plasma current) and whose magnetic moment is too small to\
    \ induce trapping. By momentum conservation, the torque gained by thermal ions\
    \ from co-passing fast particles equals the torque lost by those fast particles:\
    \ $\\tau_{\\phi,\\mathrm{th}}^{\\mathrm{co}} = -\\tau_{\\phi,\\mathrm{fast}}^{\\\
    mathrm{co}}$ when only this channel is considered. Computed in Monte Carlo beam-deposition\
    \ and Fokker\u2013Planck codes such as NUBEAM, ASCOT, or TRANSP. Representative\
    \ magnitudes are $10^{-3}$\u2013$10^{0}$ N m$^{-2}$ in NBI-heated H-mode plasmas.\
    \ See also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ for the volume-integrated quantity and [toroidal_component_of_co_passing_collisional_torque_density_on_thermal_ions](name:toroidal_component_of_co_passing_collisional_torque_density_on_thermal_ions)\
    \ for the equivalent entry with a complementary naming convention."
  unit: N.m^-2
  tags:
  - derived
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_thermal_ion_collisional_torque_density_due_to_counter_passing_fast_ions
  kind: vector
  status: draft
  description: Local toroidal torque density deposited into thermal ions by Coulomb
    collisions with counter-passing fast particles.
  documentation: This quantity isolates the contribution to the thermal-ion collisional
    toroidal torque density from fast ions that circulate in the counter-current (counter-passing)
    direction, i.e., with $v_\parallel < 0$ in the co-$I_p$ convention. Counter-passing
    fast ions, injected for instance by a counter-NBI system, exert a retarding (typically
    negative) toroidal torque on the bulk plasma through friction. The torque density
    is $\tau_{\phi,i}^{\mathrm{ctr}} = \int_{v_\parallel<0,\,\mathrm{passing}} \mathrm{d}^3v\,
    m_f v_\phi C_{fi}(f_f, f_i)$, where $C_{fi}$ is the fast-to-thermal-ion collision
    operator. Orbit-following Monte-Carlo codes (ASCOT, NUBEAM) resolve this by tracking
    counter-passing markers separately. The counter-passing channel is important for
    understanding rotation reversal in balanced-injection scenarios and asymmetric
    torque deposition. See also [toroidal_component_of_thermal_ion_torque_density_due_to_collisions](name:toroidal_component_of_thermal_ion_torque_density_due_to_collisions)
    for the total collisional torque density and [counter_passing_fast_ion_toroidal_angular_momentum_density_source](name:counter_passing_fast_ion_toroidal_angular_momentum_density_source)
    for the related angular momentum source.
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_thermal_ion_collisional_torque_density_due_to_fast_particles
  kind: vector
  status: draft
  description: Toroidal torque density exerted on thermal ions through Coulomb collisions
    with fast (suprathermal) particles.
  documentation: This quantity represents the rate of toroidal angular momentum transfer
    per unit volume from fast (energetic) particles to the thermal ion population
    via Coulomb collisions, $\tau_{\phi,\mathrm{th\_i}}^{\mathrm{fp}} = \sum_s \int
    f_s \, \nu_{s,i}(v) \, m_s v_\phi \, d^3v$, where $f_s$ is the fast-particle distribution
    function, $\nu_{s,i}$ is the slowing-down collision frequency on thermal ions
    (in s$^{-1}$), $m_s$ is the fast-particle mass (kg), and $v_\phi$ is the toroidal
    velocity component (m/s). This collisional channel is a primary driver of intrinsic
    toroidal rotation in auxiliary-heated plasmas and is computed by orbit-following
    Monte Carlo codes such as NUBEAM, ASCOT, or OFMC. Values range from $10^{-3}$
    to $10^{0}$ N m$^{-2}$ in NBI-heated tokamak cores, depending on beam geometry
    and injection energy. The companion electron-channel torque is given by [toroidal_component_of_collisional_torque_density_on_thermal_electrons_due_to_fast_particles](name:fast_ion_collisional_toroidal_torque_on_electrons);
    see also [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)
    and [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source).
  unit: N.m^-2
  tags:
  - auxiliary-heated
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_thermal_ion_torque_density_due_to_collisions
  kind: vector
  status: draft
  description: Local toroidal torque density deposited into the thermal ion population
    through Coulomb collisions with fast particles.
  documentation: "The thermal-ion collisional toroidal torque density $\\tau_{\\phi,i}^{\\\
    mathrm{coll}}$ (unit $\\mathrm{N\\,m^{-2}}$) represents the volume-density of\
    \ toroidal angular momentum transferred from the fast-particle distribution to\
    \ the bulk ion fluid via pitch-angle scattering and energy drag. It is computed\
    \ as $\\tau_{\\phi,i}^{\\mathrm{coll}} = \\sum_j \\int \\mathrm{d}^3v\\, m_f v_\\\
    phi C_{fj}(f_f, f_j)$, where $C_{fj}$ is the linearized Coulomb collision operator\
    \ and the sum runs over bulk ion species $j$. This is a profile quantity (function\
    \ of position) that, when volume-integrated, yields [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions).\
    \ Magnitudes are of order $10^{-2}$\u2013$10^{0}\\,\\mathrm{N\\,m^{-2}}$ in the\
    \ core of NBI-heated tokamaks. The density profile of this torque is a key input\
    \ to the momentum-transport equation used to predict plasma rotation. See also\
    \ [toroidal_component_of_thermal_ion_collisional_torque_density_due_to_counter_passing_fast_ions](name:toroidal_component_of_thermal_ion_collisional_torque_density_due_to_counter_passing_fast_ions)\
    \ for the orbit-resolved contribution."
  unit: N.m^-2
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_trapped_current_density
  kind: vector
  status: draft
  description: Total toroidal current density from trapped (banana-orbit) particles,
    including fast-particle and drag-current contributions.
  documentation: "This quantity gives $j_{\\phi}^{\\rm trap}$ (in A\xB7m$^{-2}$),\
    \ the net toroidal current density arising from particles on trapped (banana)\
    \ orbits, integrated over all species. Trapped particles undergo bounce motion\
    \ between mirror points and carry a finite toroidal current through the asymmetry\
    \ of their banana orbits, described by neoclassical theory. The trapped-particle\
    \ current includes the bootstrap current contribution, where the density and temperature\
    \ gradients drive a net current via trapped-particle dynamics: $j_{\\rm bs} \\\
    propto -\\sqrt{\\epsilon}\\,(dp/d\\psi) / B_\\theta$, where $\\epsilon = r/R_0$\
    \ is the local inverse aspect ratio. In addition, trapped fast ions from NBI or\
    \ ICRF heating contribute through their finite orbit widths. The back-current\
    \ (drag) from background electrons and thermal ions is included. Combining this\
    \ with [toroidal_component_of_co_passing_current_density](name:toroidal_component_of_co_passing_current_density)\
    \ and [toroidal_component_of_counter_passing_current_density](name:toroidal_component_of_counter_passing_current_density)\
    \ recovers the full toroidal current density profile. See also [toroidal_component_of_fast_particle_current_density](name:toroidal_component_of_fast_particle_current_density)."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_trapped_fast_particle_current_density
  kind: vector
  status: draft
  description: Toroidal current density carried by trapped (banana-orbit) fast particles,
    excluding electron and thermal-ion drag currents.
  documentation: "The trapped fast-particle toroidal current density $j_{\\phi,\\\
    mathrm{trapped}}^{\\mathrm{fp}}$ (unit $\\mathrm{A\\,m^{-2}}$) quantifies the\
    \ net toroidal current driven by suprathermal particles confined on banana orbits.\
    \ These particles have $v_\\parallel / v < \\sqrt{2\\epsilon}$ (where $\\epsilon\
    \ = r/R$ is the local inverse aspect ratio) and execute poloidally-localized drift\
    \ orbits whose finite orbit width produces a toroidal current even in the absence\
    \ of an inductive electric field. This current component is computed by bounce-averaging\
    \ the fast-particle distribution over the trapped-particle domain and excludes\
    \ the shielding (back-) current carried by bulk electrons and thermal ions. In\
    \ NBI-heated plasmas the trapped fast-ion current is smaller than the passing\
    \ contribution but can be locally significant near the magnetic axis where $\\\
    epsilon$ is small and deeply-trapped fractions are high. Evaluated by orbit-following\
    \ codes (NUBEAM, OFMC) or by solving the bounce-averaged Fokker\u2013Planck equation.\
    \ See also [toroidal_component_of_fast_particle_current_density](name:toroidal_component_of_fast_particle_current_density)\
    \ for the total (all orbit classes) and [toroidal_component_of_trapped_current_density](name:toroidal_component_of_trapped_current_density)\
    \ for the total trapped-particle current including drag."
  unit: A.m^-2
  tags:
  - current-drive-efficiency
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_torque
  kind: scalar
  status: draft
  description: Total toroidal angular momentum input rate (torque) from a given source
    acting on the plasma.
  documentation: "The toroidal torque $T_\\phi$ is the volume-integrated rate of toroidal\
    \ angular momentum delivered to the plasma by a specific source mechanism (e.g.,\
    \ neutral-beam injection, radio-frequency heating, or $\\mathbf{j} \\times \\\
    mathbf{B}$ forces). It enters the global toroidal momentum balance $dL_\\phi/dt\
    \ = \\sum_k T_{\\phi,k}$, where $L_\\phi$ is the plasma toroidal angular momentum\
    \ and the sum runs over all source and loss channels. In NBI-heated tokamak H-mode\
    \ plasmas, individual torque contributions range from $\\sim 0.1$ to $\\sim 10$\
    \ N\xB7m; ITER NBI is designed to deliver $\\approx 40$ N\xB7m at full power.\
    \ The quantity is computed by integrating the corresponding toroidal momentum\
    \ source density over the plasma volume. See [fast_ion_toroidal_angular_momentum_density_source](name:fast_ion_toroidal_angular_momentum_density_source)\
    \ for the local density-level source profile, [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)\
    \ and [fast_ion_collisional_toroidal_torque_on_electrons](name:fast_ion_collisional_toroidal_torque_on_electrons)\
    \ for collisional partitioning, and [toroidal_torque_due_to_neutral_beam_shinethrough](name:toroidal_torque_due_to_neutral_beam_shinethrough)\
    \ for the NBI loss channel."
  unit: N.m
  tags:
  - global-quantity
  - momentum-balance
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_torque_due_to_neutral_beam_shinethrough
  kind: scalar
  status: draft
  description: Toroidal angular momentum lost from the plasma due to neutral-beam
    particles that traverse the plasma without ionizing.
  documentation: 'NBI shinethrough occurs when a fraction of the injected neutral-beam
    atoms pass through the plasma without being ionized, depositing neither energy
    nor momentum inside the last closed flux surface. The shinethrough torque $T_{\phi,\mathrm{ST}}$
    quantifies the toroidal angular momentum carried away by these un-ionized neutrals
    and represents a loss term in the global momentum balance: $T_{\phi,\mathrm{net}}
    = T_{\phi,\mathrm{inj}} - T_{\phi,\mathrm{ST}}$. It is computed from the beam
    geometry, injection energy, and plasma density profile; the shinethrough fraction
    scales roughly as $\exp(-\sigma_{\mathrm{ion}}\, \bar{n}_e\, L)$, where $\sigma_{\mathrm{ion}}$
    is the beam-neutral ionization cross section, $\bar{n}_e$ the line-averaged electron
    density, and $L$ the path length through the plasma. For well-absorbed beams in
    high-density plasmas the shinethrough torque is negligible ($<1\%$ of the injected
    torque), but in low-density startup phases it can be a significant loss. See [toroidal_torque](name:toroidal_torque)
    for the total source torque and [fast_ion_collisional_toroidal_torque_on_ions](name:fast_ion_collisional_toroidal_torque_on_ions)
    for the collisional torque delivered to thermal ions.'
  unit: N.m
  tags:
  - auxiliary-heated
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: trapped_fast_ion_toroidal_angular_momentum_density_source
  kind: scalar
  status: draft
  description: Local source rate of toroidal angular momentum density delivered to
    the plasma by trapped (banana-orbit) fast ions.
  documentation: $S_{L_\phi}^{\mathrm{trap}}$ (unit N m$^{-2}$) gives the volumetric
    rate at which toroidal angular momentum is injected into the plasma by the trapped
    subset of the fast-ion distribution. Trapped particles satisfy $|v_\parallel/v|
    < \sqrt{2\epsilon}$ (with $\epsilon = r/R$ the local inverse aspect ratio) and
    execute banana orbits in the poloidal plane. Although individual trapped particles
    have zero time-averaged toroidal velocity in the absence of drifts, finite-orbit-width
    effects, prompt losses, and rf-induced orbit changes yield a net toroidal momentum
    source. This contribution is significant for tangentially injected beams in low-aspect-ratio
    devices where the trapped-passing boundary falls within the injected pitch-angle
    distribution. Evaluated by Monte Carlo orbit-following codes (NUBEAM, ASCOT, SPIRAL).
    The total fast-ion source satisfies $S_{L_\phi}^{\mathrm{tot}} = S_{L_\phi}^{\mathrm{co}}
    + S_{L_\phi}^{\mathrm{ctr}} + S_{L_\phi}^{\mathrm{trap}}$. See also [co_passing_fast_ion_toroidal_angular_momentum_density_source](name:co_passing_fast_ion_toroidal_angular_momentum_density_source)
    and [counter_passing_fast_ion_toroidal_angular_momentum_density_source](name:counter_passing_fast_ion_toroidal_angular_momentum_density_source).
  unit: N.m^-2
  tags:
  - derived
  - heating-deposition
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_energy_source_density_due_to_thermalization
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the energy source density
    due to fast-particle thermalization.
  documentation: "This quantity provides the positive-side error bar on the volumetric\
    \ thermalization energy source $S_E^{\\mathrm{th}}$ (in W/m$^3$). The true source\
    \ density satisfies $S_E^{\\mathrm{th}} \\le S_{E,\\mathrm{eval}}^{\\mathrm{th}}\
    \ + \\Delta S_{E,\\mathrm{upper}}^{\\mathrm{th}}$. Uncertainty originates from\
    \ fast-ion distribution function modeling (Monte Carlo statistics in codes such\
    \ as NUBEAM or ASCOT), background plasma profile errors, and collision-operator\
    \ approximations. For NBI-heated scenarios, relative upper uncertainties of 5\u2013\
    20% are common. See also [energy_source_density_due_to_thermalization](name:energy_source_density_due_to_thermalization)\
    \ for the parent quantity and [lower_uncertainty_of_energy_source_density_due_to_thermalization](name:lower_uncertainty_of_energy_source_density_due_to_thermalization)\
    \ for the lower bound."
  unit: W.m^-3
  tags:
  - energy-balance
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_power_due_to_thermalization
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the total power released
    by thermalization of a fast-particle distribution.
  documentation: "This field provides the positive (upper) error bar for [power_due_to_thermalization](name:power_due_to_thermalization),\
    \ representing the maximum positive deviation from the nominal value within the\
    \ reported confidence interval. When the uncertainty is asymmetric\u2014for example\
    \ due to Monte-Carlo statistical noise in orbit-following codes or sensitivity\
    \ to the critical-energy threshold\u2014the upper and lower bounds differ. The\
    \ stored value is a non-negative offset in watts such that the upper confidence\
    \ limit is $P_{\\mathrm{th}} + \\Delta P_{\\mathrm{upper}}$. Combined with [lower_uncertainty_of_power_due_to_thermalization](name:lower_uncertainty_of_power_due_to_thermalization),\
    \ the full asymmetric confidence interval is recovered. See also [power_due_to_thermalization](name:power_due_to_thermalization)\
    \ for the parent quantity."
  unit: W
  tags:
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_toroidal_component_of_current_density
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on the toroidal driven current
    density from a fast-particle distribution.
  documentation: This quantity gives the upward (upper) error bar $\sigma^{+}_{j_{\phi,d}}$
    (in A m$^{-2}$) on the toroidal driven current density [toroidal_component_of_current_density](name:toroidal_component_of_current_density).
    Uncertainty sources include statistical noise in Monte Carlo orbit-following,
    model assumptions in the fast-ion birth profile and collision operator, and experimental
    error in the injected beam or RF power deposition profiles. Combined with the
    lower uncertainty, these bounds define an asymmetric confidence interval for the
    driven current. See also [lower_uncertainty_of_toroidal_component_of_current_density](name:lower_uncertainty_of_toroidal_component_of_current_density)
    and [toroidal_component_of_total_current_density](name:toroidal_component_of_total_current_density).
  unit: A.m^-2
  tags:
  - spatial-profile
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
