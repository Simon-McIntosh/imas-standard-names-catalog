- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: draft
  description: Vertical height (Z coordinate) of the magnetic axis, defined as the
    point where the poloidal magnetic flux gradient vanishes.
  documentation: "The magnetic axis is the location of the extremum of the poloidal\
    \ magnetic flux in the poloidal plane; its vertical coordinate $Z_{\\mathrm{axis}}$\
    \ positions the plasma centroid vertically. $Z_{\\mathrm{axis}}$ is a primary\
    \ actuator-controlled quantity in plasma position feedback and must be maintained\
    \ within narrow limits to avoid wall contact. Typical values range from $Z=0\\\
    ,\\mathrm{m}$ for a centered plasma to $\\pm 0.3\\,\\mathrm{m}$ in tilted or off-axis\
    \ equilibrium reconstructions. It is obtained from equilibrium reconstruction\
    \ codes (e.g. EFIT, LIUQE) that solve the Grad\u2013Shafranov equation. See also\
    \ [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis) for the\
    \ corresponding radial coordinate and [vertical_coordinate_of_x_point](name:vertical_coordinate_of_x_point)\
    \ for the vertical height of the divertor X-point.\n\nSign convention: Positive\
    \ when the magnetic axis lies above the equatorial plane ($Z=0$) in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame."
  unit: m
  physics_domain: equilibrium
