- name: flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude
  kind: tensor
  status: active
  description: Flux-surface average of the squared magnitude of the gradient of the
    normalized toroidal-flux radius. It is the averaged contravariant radial metric
    coefficient for the flux coordinate rho_tor.
  documentation: 'Flux-surface average of the squared magnitude of the gradient of
    the toroidal flux coordinate is the average, over one magnetic flux surface, of
    the squared norm of $\nabla \rho_\mathrm{tor}$. It is the flux-surface-averaged
    contravariant radial metric coefficient associated with the radial coordinate
    in the flux-coordinate system $(\rho_\mathrm{tor}, \theta, \phi)$, where $\theta$
    is a poloidal angle label and $\phi$ is the toroidal angle.


    The quantity is defined by the flux-surface average of the local radial metric
    component:


    $$

    G_{\rho\rho}(\rho_\mathrm{tor}) = \left\langle |\nabla \rho_\mathrm{tor}|^2 \right\rangle_{\rho_\mathrm{tor}}
    = \frac{\int_{S(\rho_\mathrm{tor})} |\nabla \rho_\mathrm{tor}|^2\, dA / |\nabla
    \rho_\mathrm{tor}|}{\int_{S(\rho_\mathrm{tor})} dA / |\nabla \rho_\mathrm{tor}|}

    $$


    where $G_{\rho\rho}$ denotes this flux-surface-averaged metric coefficient, $\rho_\mathrm{tor}$
    is the normalized toroidal-flux radius, $S(\rho_\mathrm{tor})$ is the magnetic
    flux surface with that label, $\nabla$ is the spatial gradient operator, $dA$
    is the surface-area element, and $\langle\cdot\rangle_{\rho_\mathrm{tor}}$ denotes
    averaging over that flux surface.


    The coordinate $\rho_\mathrm{tor}$ is constituted by $\rho_\mathrm{tor}=\sqrt{\Phi/\Phi_b}$,
    where $\Phi$ is the toroidal magnetic flux enclosed by the flux surface and $\Phi_b$
    is its value at the plasma boundary. The scope is closed nested equilibrium flux
    surfaces; the aggregation convention is an average over the entire surface at
    fixed $\rho_\mathrm{tor}$.


    This is not the pointwise quantity $|\nabla \rho_\mathrm{tor}|^2$, not the flux-surface
    average of $|\nabla \rho_\mathrm{tor}|$, and not a volume or time average. It
    belongs to the same flux-surface-averaged geometric-metric family as the [flux-surface-averaged
    inverse major radius](name:flux_surface_averaged_inverse_of_major_radius), but
    it characterizes the radial metric of the normalized toroidal-flux radius rather
    than a major-radius factor.'
