- name: capacitance_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Effective capacitance of an impedance-matching element in an ion-cyclotron
    heating antenna, relating stored charge to the RF voltage used for circuit tuning.
  documentation: 'This quantity is the non-negative lumped capacitance associated
    with an impedance-matching element in an ion-cyclotron heating antenna module.
    It represents the element''s ability to store electric charge and participate
    in tuning the radio-frequency transmission circuit.


    For an ideal lumped capacitive element, the capacitance is defined by


    $$

    C = \frac{Q}{V}

    $$


    where $C$ is the capacitance, $Q$ is the charge stored on the element, and $V$
    is the electric potential difference across the element.


    The quantity applies to the specified matching element of the antenna and does
    not represent the capacitance of an unrelated circuit component or the entire
    transmission system. It is a circuit parameter rather than a power, current, or
    operating-frequency quantity.


    Together with the [resistance of an ion-cyclotron heating antenna](name:resistance_of_ion_cyclotron_heating_antenna),
    it characterizes the antenna''s effective RF impedance; the [frequency of an ion-cyclotron
    heating antenna](name:frequency_of_ion_cyclotron_heating_antenna) identifies the
    RF operating frequency at which the matching condition is evaluated.'
  unit: F
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_ion_cyclotron_heating_antenna
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/matching_element/capacitance
    version: 4.1.0
- name: forward_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Forward RF power of an ion-cyclotron heating antenna is the incident
    power traveling from the generator toward the antenna before reflection and coupling
    to the plasma.
  documentation: "Forward power of an ion-cyclotron heating antenna is the forward-traveling\
    \ RF power at a defined reference plane on the feed line, directed from the generator\
    \ toward the antenna. It is the incident power arriving at the antenna before\
    \ reflection at the antenna\u2013plasma interface and before power is coupled\
    \ into the plasma.\n\nThe quantity applies to one antenna or antenna module at\
    \ its feed-line reference plane and includes only the forward-traveling component;\
    \ it is not summed over an antenna system. It excludes backward-traveling [reflected\
    \ power](name:reflected_power_of_ion_cyclotron_heating_antenna) and power already\
    \ coupled into the plasma.\n\nAt a common reference plane, forward and reflected\
    \ power determine the net [launched power]: the launched component is the forward\
    \ power less the reflected power when intervening feed-line losses are excluded."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/power_forward
    version: 4.1.0
  - kind: imas-dd
    ref: ic_antennas/antenna/power_forward
    version: 4.1.0
- name: frequency_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Radio-frequency drive frequency of an ion-cyclotron heating antenna,
    averaged over its modules. This non-negative scalar sets the ion-cyclotron resonance
    layer locations and the ion species and harmonics accessible for wave absorption.
  documentation: 'Radio-frequency drive frequency of an ion-cyclotron heating antenna
    is the non-negative cycle frequency of the electromagnetic drive applied to the
    antenna. It is an antenna-level setting that enters the ion-cyclotron resonance
    condition for wave absorption by ions in the plasma.


    For an ion species resonating at harmonic $n$, the defining resonance relation
    is:


    $$

    2\pi f = n\Omega_{ci} = n\frac{Z_i e B}{m_i}

    $$


    where $f$ is this radio-frequency drive frequency, $n$ is the positive integer
    ion-cyclotron harmonic number, $i$ labels the resonant ion species, $\Omega_{ci}$
    is the ion cyclotron angular frequency of species $i$, $Z_i$ is the charge number
    of species $i$, $e$ is the elementary charge, $B$ is the magnetic-field magnitude
    at the resonant location, and $m_i$ is the mass of species $i$.


    This quantity applies to a complete ion-cyclotron heating antenna, not to a single
    antenna module; if module frequencies differ, its aggregation convention is the
    arithmetic mean over the modules. It is the ordinary cycle frequency $f$, not
    the angular frequency $2\pi f$, and it is distinct from the spatially varying
    local ion cyclotron frequency in the plasma.


    The frequency, together with the selected ion species, harmonic number, and magnetic-field
    magnitude, determines which resonance layers are accessible, but it does not by
    itself identify a unique absorption channel when several species or harmonics
    satisfy the resonance relation. It is separate from total_power_of_ion_cyclotron_heating_antenna,
    from the RF-circuit quantity [resistance_of_ion_cyclotron_heating_antenna](name:resistance_of_ion_cyclotron_heating_antenna),
    and from voltage_amplitude_of_ion_cyclotron_heating_antenna; the analogous electron-cyclotron
    quantity is [frequency_of_electron_cyclotron_heating_antenna](name:frequency_of_electron_cyclotron_beam).'
  unit: Hz
  physics_domain: auxiliary_heating
  links: []
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/frequency
    version: 4.1.0
  - kind: imas-dd
    ref: ic_antennas/antenna/module/frequency
    version: 4.1.0
  - kind: imas-dd
    ref: summary/heating_current_drive/ic/frequency/value
    version: 4.1.0
- name: launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Launched power of a lower-hybrid antenna is the net RF power entering
    the vacuum vessel after reflected power is subtracted from incident forward power.
  documentation: 'Launched power of a lower-hybrid antenna is the nonnegative RF power
    entering the vacuum vessel from one antenna after accounting for reflected power.
    It is one per-antenna component of the wave-power budget represented by [power
    of a lower-hybrid antenna].


    The net launched power is defined by the per-antenna power balance:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the incident RF power arriving at the antenna input
    reference plane from the transmission line, $P_\mathrm{reflected}$ is the RF power
    returning toward the transmission line, and $P_\mathrm{launched}$ is the net power
    entering the vacuum vessel.


    The quantity applies to one lower-hybrid antenna and is not an aggregate over
    multiple antennas. It excludes forward power subsequently returned as [reflected
    power of a lower-hybrid antenna](name:reflected_power_of_lower_hybrid_antenna),
    and it is distinct from forward power, which includes the portion that is later
    reflected. It denotes power launched into the vessel rather than generator output
    or a separate plasma-absorption quantity.


    The corresponding toroidal- and poloidal-mode-resolved quantities, such as [per
    toroidal mode launched power of a lower-hybrid antenna](name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna),
    are distributions of this same launched-power quantity over refractive-index intervals
    rather than additional per-antenna power components.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna
  sources:
  - kind: imas-dd
    ref: lh_antennas/antenna/power_launched
    version: 4.1.0
  - kind: imas-dd
    ref: lh_antennas/power_launched
    version: 4.1.0
  - kind: imas-dd
    ref: summary/heating_current_drive/lh/power/value
    version: 4.1.0
  - kind: imas-dd
