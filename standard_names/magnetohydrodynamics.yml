- name: momentum_due_to_avalanche
  kind: scalar
  status: active
  description: Electron momentum scale associated with avalanche runaway dynamics,
    including thresholds separating collisional drag-dominated electrons from those
    accelerated into the runaway population.
  documentation: 'This quantity denotes a momentum scale associated with avalanche
    runaway-electron dynamics. It covers momentum-space thresholds that distinguish
    electrons remaining drag-dominated from electrons that can be accelerated into
    the runaway population; it is not a particle source rate.


    The relativistic electron momentum magnitude is defined by


    $$

    p = \frac{m_e v}{\sqrt{1-v^2/c^2}}

    $$


    where $p$ is momentum magnitude, $m_e$ is the electron rest mass in kg, $v$ is
    electron speed in m s$^{-1}$, and $c$ is the speed of light in m s$^{-1}$. An
    avalanche threshold is a selected value of $p$ determined by the balance between
    collisional drag and electric-field acceleration.


    The representative [critical avalanche momentum](name:critical_momentum_due_to_avalanche)
    is the boundary used to evaluate avalanche multiplication, including contributions
    from seed populations. Its acceleration context is related to the [critical electric
    field](name:critical_electric_field), but this quantity is a momentum scale rather
    than an electric-field threshold.'
  unit: kg.m^-1.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:critical_momentum_due_to_avalanche
  - name:critical_electric_field
- name: critical_momentum_due_to_avalanche
  kind: scalar
  status: active
  description: Critical momentum due to avalanche is the scalar electron momentum
    threshold that separates electrons slowed by collisional drag from electrons accelerated
    by the parallel electric field into runaway avalanche multiplication. It is a
    magnitude, not a signed field-aligned momentum.
  documentation: 'Critical momentum due to avalanche is the scalar electron momentum
    threshold that separates electrons slowed by collisional drag from electrons accelerated
    by the parallel electric field into runaway avalanche multiplication. It is a
    local electron momentum magnitude and does not encode the sign of field-aligned
    motion.


    The defining balance is between the electric force magnitude and the collisional
    slowing-down force at the threshold momentum:


    $$

    e\,|E_\parallel| = F_\mathrm{drag}\!\left(p_{c,\mathrm{av}}\right)

    $$


    where $p_{c,\mathrm{av}}$ is the critical momentum due to avalanche, $e$ is the
    elementary charge in coulombs, $E_\parallel$ is the electric-field component parallel
    to the magnetic field in volts per meter, and $F_\mathrm{drag}(p)$ is the magnitude
    of the collisional drag force on an electron with momentum magnitude $p$ in newtons.


    A finite threshold requires an accelerating field strong enough for the force-balance
    equation to have a solution; in the usual Coulomb-drag limit this corresponds
    to $|E_\parallel|$ exceeding the [critical electric field](name:critical_electric_field).
    This quantity is the threshold itself, not [momentum due to avalanche](name:momentum_due_to_avalanche)
    or an avalanche growth rate, and it differs from [volume-averaged runaway-electron
    critical momentum due to avalanche](name:volume_averaged_runaway_electron_critical_momentum_due_to_avalanche),
    which is a volume average of the same local threshold.'
  unit: kg.m^-1.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:momentum_due_to_avalanche
  - name:volume_averaged_runaway_electron_critical_momentum_due_to_avalanche
  - name:critical_electric_field
  arguments:
  - name: momentum_due_to_avalanche
    operator: critical
    operator_kind: qualifier
  sources:
  - dd_path: runaway_electrons/ggd_fluid/momentum_critical_avalanche/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/runaway_electrons.html#runaway_electrons-ggd_fluid-momentum_critical_avalanche-values
    dd_documentation:
