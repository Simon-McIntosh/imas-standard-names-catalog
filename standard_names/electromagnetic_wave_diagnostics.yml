    dd_path: polarimeter/channel/faraday_angle
    status: composed
- name: normalized_toroidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at the physical position sampled by a diagnostic measurement.
    It identifies the corresponding nested flux surface, with 0 at the magnetic axis
    and approximately 1 at the last closed flux surface.
  documentation: 'The normalized toroidal flux coordinate at a measurement position
    is the dimensionless radial label assigned to the point or localized region sampled
    by a diagnostic measurement. It is derived from the toroidal magnetic flux enclosed
    by nested magnetic flux surfaces, with the origin at the magnetic axis and the
    outer normalization reference at the plasma boundary or last closed flux surface.


    The coordinate is defined from the toroidal flux difference between the flux surface
    through the measurement position and the magnetic-axis flux:


    $$

    \rho_{\mathrm{tor,norm}}(\mathbf{x}_m) = \sqrt{\frac{\Phi_m - \Phi_0}{\Phi_b -
    \Phi_0}}

    $$


    where $\mathbf{x}_m$ is the measurement position, $\Phi_m$ is the toroidal magnetic
    flux in Wb of the flux surface passing through that position, $\Phi_0$ is the
    magnetic-axis toroidal flux in Wb, and $\Phi_b$ is the boundary toroidal flux
    in Wb. The square root makes this a nonnegative radial coordinate; for a valid
    nested-flux-surface mapping the numerator and denominator have the same flux orientation,
    so the ratio is nonnegative and increases outward from the magnetic axis.


    In practice, the value is obtained by combining the diagnostic measurement geometry
    with an equilibrium reconstruction that maps the sampled position to a flux surface.
    For measurements with finite spatial extent, the value represents the effective
    or representative measurement position used in the diagnostic interpretation,
    rather than a property of the diagnostic signal itself.


    Typical values for measurements inside the confined plasma are 0-1, with values
    near 0 corresponding to the core, 0.2-0.8 to the plasma interior, and 0.8-1 to
    the edge region near the last closed flux surface. Values greater than 1 can occur
    for positions mapped outside the last closed flux surface or when an equilibrium
    mapping is extrapolated beyond the confined region.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
  - name:normalized_toroidal_flux_coordinate_at_constraint_position
  sources:
  - id: dd:ece/t_radiation_central_x/rho_tor_norm
    dd_path: ece/t_radiation_central_x/rho_tor_norm
    status: composed
- name: perpendicular_wave_vector_magnitude
  kind: scalar
  status: draft
  description: Magnitude of the wave vector component perpendicular to the local equilibrium
    magnetic field, setting the cross-field spatial scale of wave-plasma coupling
    and turbulent density fluctuation backscattering.
  documentation: 'The perpendicular wave vector magnitude $k_\perp$ is the modulus
    of the wave propagation vector projected onto the plane perpendicular to the local
    equilibrium magnetic field $\mathbf{B}_0$. It governs the cross-field spatial
    periodicity of the wave and is fundamental to both electromagnetic wave propagation
    calculations and fluctuation turbulence diagnostics. This scalar quantity is the
    magnitude of [perpendicular_wave_vector](name:perpendicular_wave_vector).


    $$

    k_\perp = |\mathbf{k} - (\mathbf{k} \cdot \hat{b})\hat{b}|

    $$


    where $\hat{b} = \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along the equilibrium
    magnetic field and $\mathbf{k}$ is the full wave vector.


    In Doppler reflectometry, the Bragg backscattering condition selects density fluctuations
    at $k_\perp \approx 2 k_0 \sin\theta$, where $k_0 = \omega/c$ is the vacuum wavenumber
    and $\theta$ is the beam tilt angle. The doppler_frequency shift of the backscattered
    signal is proportional to $k_\perp$ times the perpendicular plasma flow velocity,
    enabling turbulence wavenumber spectra to be resolved across the spectral_frequency
    grid. In wave beam tracing, $k_\perp$ characterizes the cross-field propagation
    scale relevant for finite Larmor radius effects and mode conversion, complementing
    the field-aligned scale encoded in the [parallel_refractive_index](name:parallel_refractive_index).


    Typical values in Doppler reflectometry range from a few to several hundred m$^{-1}$,
    probing turbulent density fluctuations from the plasma minor-radius scale down
    toward the ion gyroradius.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_wave_vector
  - name:parallel_refractive_index
  sources:
  - id: dd:reflectometer_fluctuation/channel/doppler/wavenumber
    dd_path: reflectometer_fluctuation/channel/doppler/wavenumber
    status: composed
  - id: dd:waves/coherent_wave/full_wave/k_perpendicular/values
    dd_path: waves/coherent_wave/full_wave/k_perpendicular/values
    status: attached
  - id: dd:waves/coherent_wave/profiles_1d/k_perpendicular
    dd_path: waves/coherent_wave/profiles_1d/k_perpendicular
