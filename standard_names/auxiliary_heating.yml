- name: per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of absorbed wave power on the thermal electron
    population inside a given flux surface, resolved per toroidal mode number $n_\phi$.
  documentation: This quantity represents the cumulative volume integral $P_{\rm th,e}(\psi,
    n_\phi) = \int_0^\psi p_{\rm abs,th,e}(n_\phi)\, dV$ of the wave power density
    absorbed by the thermal electron population, accumulated from the plasma center
    to the flux surface labeled by $\psi$, for each toroidal mode number $n_\phi$.
    The thermal electron population comprises electrons whose energy lies within a
    few times the thermal energy $T_e$, distinguishing them from suprathermal or fast
    electrons. Summing over all toroidal mode numbers $n_\phi$ recovers the total
    [thermal electron absorbed power inside the flux surface](name:thermal_electron_wave_absorbed_power_inside_flux_surface),
    while integrating to the plasma boundary gives the total thermal-electron absorbed
    power [per toroidal mode](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power).
    The analogous quantities for the thermal ion and fast electron populations are
    given by [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface)
    and [per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface).
    Typical values in electron-cyclotron heating scenarios range from tens of kilowatts
    to several megawatts at mid-radius for dominant modes, computed from full-wave
    or ray-tracing codes that resolve the toroidal mode spectrum of the launched wave
    field.
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_wave_absorbed_power_inside_flux_surface
