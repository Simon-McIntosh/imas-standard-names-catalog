      unit: eV
      coordinates:
      - 1...N
    enhanced_context:
      description: Lower energy detection threshold per pixel of the X-ray camera
        detector. Photons are registered only if their energy exceeds this pixel-specific
        threshold, defining the low-energy cutoff for photon counting.
      kind: llm
