    dd_path: waves/coherent_wave/global_quantities/ion/power_thermal_n_phi
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/ion/power_thermal_n_tor
    dd_path: waves/coherent_wave/global_quantities/ion/power_thermal_n_tor
