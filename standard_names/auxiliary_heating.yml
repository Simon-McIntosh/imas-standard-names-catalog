- name: forward_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: The incident RF power traveling from the generator toward the ion cyclotron
    heating antenna along the transmission line, before any reflection occurs at the
    antenna-plasma interface.
  documentation: 'Forward power is the incident traveling-wave RF power propagating
    from the RF generator toward the ion cyclotron heating antenna along the coaxial
    transmission line. It represents the total power available at the antenna reference
    plane before coupling to the plasma, and is the primary input quantity used to
    compute coupling efficiency together with the returning wave power.


    The net power launched into the vacuum vessel is determined by subtracting the
    reflected wave power:


    $$

    P_\mathrm{net} = P_\mathrm{fwd} - P_\mathrm{ref}

    $$


    where $P_\mathrm{fwd}$ is this forward power, $P_\mathrm{ref}$ is the [reflected
    power of the antenna](name:reflected_power_of_ion_cyclotron_heating_antenna),
    and $P_\mathrm{net}$ corresponds to the [net launched power](name:power_of_ion_cyclotron_heating_antenna).
    The antenna coupling efficiency is $\eta = (P_\mathrm{fwd} - P_\mathrm{ref}) /
    P_\mathrm{fwd} = 1 - |\Gamma|^2$, where $\Gamma$ is the voltage reflection coefficient
    at the antenna aperture.


    Forward power is measured using calibrated directional couplers installed on the
    coaxial transmission line between the RF generator and the antenna strap feed,
    providing real-time monitoring for power control and antenna protection against
    excessive reflected power.


    Typical forward power levels per ICRH antenna range from 1 to above 10 MW on large
    tokamaks, with coupling efficiencies between 70% and 95% depending on plasma edge
    density, strap phasing, and plasma-antenna gap.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:power_of_ion_cyclotron_heating_antenna
