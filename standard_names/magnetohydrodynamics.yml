- name: volume_averaged_runaway_electron_kinetic_energy_density
  kind: scalar
  status: draft
  description: Mean relativistic kinetic energy per unit volume of the runaway electron
    population, obtained by averaging the local kinetic energy density over the confined
    plasma volume.
  documentation: 'The volume-averaged runaway electron kinetic energy density is a
    global scalar characterizing the mean suprathermal energy stored per unit volume
    in the runaway electron (RE) population. It is obtained by integrating the local
    relativistic kinetic energy density over the total confined plasma volume $V$
    and dividing by $V$.


    The underlying local quantity is the relativistic kinetic energy moment of the
    RE distribution function:


    $$

    u_\mathrm{RE}(\mathbf{r}) = \int f_\mathrm{RE}(\mathbf{r}, \mathbf{p})\,(\gamma
    - 1)\,m_e c^2 \, d^3p

    $$


    where $f_\mathrm{RE}$ is the runaway electron phase-space distribution function,
    $\gamma = (1 + p^2 / m_e^2 c^2)^{1/2}$ is the Lorentz factor, $m_e$ is the electron
    rest mass, $c$ is the speed of light, and $\mathbf{p}$ is the relativistic momentum.
    The volume average is then $\langle u_\mathrm{RE} \rangle = V^{-1} \int_V u_\mathrm{RE}\,dV$.


    This quantity is evaluated from kinetic or reduced-fluid runaway electron models,
    particularly in disruption current-quench simulations where RE populations can
    reach energies of several to tens of MeV per particle. Multiplying by the plasma
    volume $V$ recovers the total stored relativistic energy given by [runaway_electron_kinetic_energy](name:runaway_electron_kinetic_energy).
    The local non-averaged counterpart is runaway_electron_kinetic_energy_density,
    and the corresponding global particle number density is [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density).'
  unit: J.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_kinetic_energy
  - name:volume_averaged_runaway_electron_density
  sources:
  - id: dd:runaway_electrons/global_quantities/volume_average/energy_density_kinetic
    dd_path: runaway_electrons/global_quantities/volume_average/energy_density_kinetic
    status: composed
- name: vorticity
  kind: scalar
  status: draft
  description: Curl of the plasma bulk velocity field measuring local angular rotation
    of fluid elements; parent quantity generalizing over directional projections including
    radial, toroidal, poloidal, and field-aligned components.
  documentation: 'Plasma vorticity characterizes the rotational nature of bulk plasma
    flow and plays a central role in MHD dynamics, entering the momentum equation
    through nonlinear advection and governing the evolution of shear layers and vortex
    structures. It resolves into components along the coordinate axes of the plasma
    geometry, each describing a distinct aspect of rotational fluid motion.


    The defining relation is:


    $$

    \boldsymbol{\omega} = \nabla \times \mathbf{v}

    $$


    where $\mathbf{v}$ is the local plasma bulk flow velocity. Projections in the
    right-handed cylindrical $(R, \phi, Z)$ frame are provided by [radial_vorticity](name:radial_vorticity),
    [toroidal_vorticity](name:toroidal_vorticity), and [vertical_vorticity](name:vertical_vorticity);
    the field-aligned projection is [parallel_vorticity](name:parallel_vorticity).


    Vorticity is evaluated from velocity fields obtained via ion Doppler spectroscopy
    or charge exchange recombination spectroscopy, or computed self-consistently in
    MHD simulations through curl operations applied to the discrete velocity field
    on the computational mesh.


    Sign convention: Positive when the plasma velocity field rotates in the right-hand
    sense about the positive direction of the relevant coordinate axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_vorticity
  - name:toroidal_vorticity
  - name:vertical_vorticity
  - name:parallel_vorticity
  sources:
  - id: dd:mhd/ggd/vorticity/values
    dd_path: mhd/ggd/vorticity/values
    status: composed
- name: magnetic_shear_at_sawtooth_inversion_radius
  kind: scalar
  status: draft
  description: Magnetic shear evaluated at the sawtooth inversion radius, the flux
    surface where the sawtooth-crash electron-temperature perturbation changes sign.
    It is the dimensionless outward derivative of the safety factor normalized by
    the local safety factor; the inversion surface is often near, but is not defined
    by, q = 1.
  documentation: 'Magnetic shear at the sawtooth inversion radius is the local magnetic
    shear of the equilibrium magnetic field on the flux surface identified by the
    sawtooth inversion radius. The inversion radius is the surface where the electron-temperature
    perturbation associated with a sawtooth crash changes sign; it is often close
    to the $q=1$ rational surface but is not defined by requiring $q=1$.


    Using the flux coordinate $\rho_{\mathrm{tor,norm}}$ (normalized toroidal flux
    radius), the shear is defined by


    $$

    s_{\mathrm{inv}} = \left. \frac{\rho_{\mathrm{tor,norm}}}{q}\frac{dq}{d\rho_{\mathrm{tor,norm}}}\right|_{\rho_{\mathrm{tor,norm}}=\rho_{\mathrm{inv}}}

    $$


    where $q$ is the safety factor and $\rho_{\mathrm{inv}}$ is the [normalized toroidal
    flux coordinate at the sawtooth inversion radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius).


    In practice, $\rho_{\mathrm{inv}}$ is inferred from the radial zero crossing or
    phase reversal of the crash-related electron-temperature perturbation, while $q$
    and its radial derivative come from equilibrium reconstruction constrained by
    magnetic and kinetic measurements. Replacing the observed inversion surface by
    the $q=1$ surface is an additional modeling assumption, not part of this quantity''s
    definition.


    Representative values in sawtoothing tokamak cores are often of order 0.1-1. Values
    near zero indicate weak local magnetic shear, and negative values indicate reversed
    magnetic shear at the inversion surface.


    Sign convention: Positive when $q^{-1}dq/d\rho_{\mathrm{tor,norm}}$ is positive
    as $\rho_{\mathrm{tor,norm}}$ increases outward at the sawtooth inversion surface.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:magnetic_shear_at_pedestal
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  - name:magnetic_shear_at_magnetic_axis
  arguments:
  - name: magnetic_shear
    operator: sawtooth_inversion_radius
    operator_kind: locus
  sources:
  - id: dd:sawteeth/diagnostics/magnetic_shear_q1
    dd_path: sawteeth/diagnostics/magnetic_shear_q1
    status: composed
- name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  kind: scalar
  status: draft
  description: Value of the normalized toroidal flux radius rho_tor_norm at the sawtooth
    inversion surface. This surface is identified by the sign change of the electron-temperature
    perturbation during a sawtooth crash and is often close to the q=1 rational surface.
  documentation: 'The normalized toroidal flux coordinate at the sawtooth inversion
    radius is the value of the flux coordinate $\rho_{\mathrm{tor,norm}}$ on the surface
    where the electron-temperature perturbation changes sign during a sawtooth crash.
    The inversion surface is a marker of the radial extent of the sawtooth crash and
    is commonly associated with the $q=1$ rational surface.


    The normalized toroidal flux radius on a magnetic flux surface is defined by


    $$

    \rho_{\mathrm{tor,norm}} = \left(\frac{\Phi - \Phi_0}{\Phi_b - \Phi_0}\right)^{1/2}

    $$


    where $\Phi$ is the toroidal magnetic flux enclosed by the surface in Wb, $\Phi_0$
    is the magnetic-axis value in Wb, and $\Phi_b$ is the boundary value in Wb. For
    this quantity, the expression is evaluated on the sawtooth inversion surface.


    In practice, the inversion radius is inferred from time-resolved electron-temperature
    or emissivity measurements by locating the radial position where the crash-induced
    perturbation changes sign, then mapping that position to the reconstructed flux
    coordinate $\rho_{\mathrm{tor,norm}}$. When direct inversion-surface localization
    is limited, the nearby $q=1$ rational surface may be used as a physics reference,
    often together with quantities such as [magnetic_shear_at_sawtooth_inversion_radius](name:magnetic_shear_at_sawtooth_inversion_radius).
    The inversion radius is typically inside or comparable to the sawtooth mixing
    radius, described by [normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius).


    Values are dimensionless and lie between 0 at the magnetic axis and 1 at the plasma
    boundary for closed-flux-surface normalization. Sawtooth inversion surfaces are
    usually in the plasma core, commonly around 0.2-0.6, with the exact value depending
    on the current profile, pressure profile, and sawtooth dynamics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: sawtooth_inversion_radius
    operator_kind: locus
  sources:
  - id: dd:sawteeth/diagnostics/rho_tor_norm_inversion
    dd_path: sawteeth/diagnostics/rho_tor_norm_inversion
    status: composed
  - id: dd:sawteeth/diagnostics/rho_tor_norm_q1
    dd_path: sawteeth/diagnostics/rho_tor_norm_q1
    status: attached
- name: normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  kind: scalar
  status: draft
  description: Value of rho_tor_norm at the sawtooth mixing radius, the flux surface
    marking the outer boundary of the plasma region homogenized during a sawtooth
    crash.
  documentation: 'The normalized toroidal flux coordinate at the sawtooth mixing radius
    is the value of $\rho_{\mathrm{tor,norm}}$ on the flux surface that bounds the
    region mixed during a sawtooth crash. It locates the mixing surface in magnetic-flux
    space, with 0 at the magnetic axis and 1 at the last closed flux surface.


    The coordinate value is obtained by evaluating the normalized toroidal flux coordinate
    on the sawtooth mixing surface:


    $$

    \rho_{\mathrm{tor,norm,mix}} = \left(\frac{\Phi_{\mathrm{mix}} - \Phi_0}{\Phi_{\mathrm{LCFS}}
    - \Phi_0}\right)^{1/2}

    $$


    where $\Phi_{\mathrm{mix}}$ is the toroidal magnetic flux in Wb enclosed by the
    sawtooth mixing surface, $\Phi_0$ is the magnetic-axis toroidal flux in Wb, and
    $\Phi_{\mathrm{LCFS}}$ is the boundary toroidal flux in Wb at the last closed
    flux surface.


    In practice the mixing radius is inferred from the radial extent of crash-induced
    redistribution, such as flattening or abrupt changes in core temperature, density,
    radiation, or other sawtooth-sensitive observables, mapped onto equilibrium flux
    surfaces. It should not be assumed to coincide with the inversion surface or with
    any particular magnetic-safety-factor surface unless that identification is part
    of a stated sawtooth model.


    For a closed-flux-surface mixing boundary this dimensionless coordinate lies in
    the interval 0-1 by definition. No universal narrower range applies, because the
    value depends on the discharge, equilibrium, diagnostic interpretation, and crash
    dynamics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
