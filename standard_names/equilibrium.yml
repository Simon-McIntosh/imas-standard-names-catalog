- name: poloidal_magnetic_flux_of_flux_loop
  kind: scalar
  status: active
  description: Signed poloidal magnetic flux linked by an individual flux loop, defined
    by the magnetic field threading an oriented surface bounded by that loop.
  documentation: 'Signed poloidal magnetic flux of a flux loop is the magnetic flux
    linked by an individual flux loop and threading an oriented surface whose boundary
    is that loop. It is the finite-surface flux linkage associated with the loop as
    a whole, not a local magnetic-field component.


    The loop-linked flux is defined by the surface integral of the magnetic-field
    vector over a spanning surface of the loop:


    $$

    \Phi_{\mathrm{loop}} = \int_{S_{\mathrm{loop}}} \mathbf{B} \cdot d\mathbf{S}

    $$


    where $\Phi_{\mathrm{loop}}$ is the signed poloidal magnetic flux of the flux
    loop, $S_{\mathrm{loop}}$ is an oriented spanning surface bounded by the flux
    loop, $\mathbf{B}$ is the magnetic-field vector, and $d\mathbf{S}$ is the directed
    surface element on that surface.


    The scope is one specified flux loop and the total flux through its complete spanning
    surface; no averaging over multiple loops or loop segments is implied. The quantity
    is distinct from a point-locus evaluation such as [poloidal magnetic flux at a
    sensor attachment point](name:poloidal_magnetic_flux_of_flux_loop), which evaluates
    a flux function at a specified position rather than integrating over a finite
    loop-bounded surface.


    The defining surface is any oriented spanning surface with the same loop boundary
    and orientation; the absence of magnetic monopoles makes the linked flux independent
    of the particular spanning surface. This quantity is related to [poloidal magnetic
    flux](name:poloidal_magnetic_flux) as a loop-bounded flux linkage, and it must
    not be identified with [toroidal magnetic flux](name:toroidal_magnetic_flux),
    which uses a different flux-surface geometry; a reconstructed counterpart, [reconstructed
    poloidal magnetic flux of flux loop], shares the same magnetic quantity but represents
    a distinct value type when that distinction is made.


    Sign convention: Positive when the magnetic-field vector has a positive net projection
    on the oriented surface element selected as positive for the flux loop.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_flux
  sources:
  - dd_path: equilibrium/time_slice/constraints/flux_loop/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-flux_loop-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/flux_loop
      parent: Set of flux loops
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: Measured value of flux loop.
      kind: template
    semantic_facet: measured
  - dd_path: equilibrium/time_slice/constraints/flux_loop/reconstructed
