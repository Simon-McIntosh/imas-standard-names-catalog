- name: alpha_side_length_of_oblique_geometry
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at angle alpha, measured
    counter-clockwise from the outward horizontal radial direction (+R-hat) in the
    poloidal (R, Z) plane, parameterizing the oblique cross-sectional geometry of
    a conductor or ferritic element.
  documentation: "The alpha side length $\\ell_\\alpha$ is the Euclidean length of\
    \ one side of a parallelogram-shaped cross-section used to model axisymmetric\
    \ conductor elements (such as ICRH antenna straps) and ferritic or iron-core inserts\
    \ whose boundaries are not aligned with the coordinate axes of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame.\n\nThe inclination angle $\\alpha$ is measured\
    \ counter-clockwise from the outward horizontal radial direction $+\\hat{R}$ in\
    \ the poloidal $(R, Z)$ plane, consistent with the definition in `first_inclination_angle_of_oblique_geometry`.\
    \ The horizontal and vertical projections of this side are therefore $\\ell_\\\
    alpha \\cos\\alpha$ along $+\\hat{R}$ and $\\ell_\\alpha \\sin\\alpha$ along $+\\\
    hat{Z}$, respectively.\n\nThe oblique parallelogram cross-section is fully parameterized\
    \ by the four companion quantities: the primary span given by `length_of_oblique_geometry`,\
    \ the present side length $\\ell_\\alpha$ together with its inclination angle\
    \ $\\alpha$ (`first_inclination_angle_of_oblique_geometry`), the companion side\
    \ length $\\ell_\\beta$ (`beta_side_length_of_oblique_geometry`) with its inclination\
    \ angle $\\beta$ (`second_inclination_angle_of_oblique_geometry`), and the perpendicular\
    \ `thickness_of_oblique_geometry`. At least one inclination angle is required\
    \ in addition to the side lengths to uniquely define the parallelogram shape;\
    \ neither side length alone specifies the geometry.\n\nThe cross-sectional area\
    \ of the parallelogram can be expressed as\n$$A = \\ell_\\alpha \\, \\ell_\\beta\
    \ \\, |\\sin(\\beta - \\alpha)|,$$\nwhere $\\beta - \\alpha$ is the interior angle\
    \ between the two inclined sides.\n\nTypical values for tokamak iron-core segments\
    \ and ferritic inserts range from a few centimeters to tens of centimeters. For\
    \ ICRH antenna strap cross-sections, values are typically in the range 1\u2013\
    20 cm. The quantity is determined from engineering drawings or CAD models and\
    \ is used as geometric input to equilibrium reconstruction and antenna modeling\
    \ codes.\n\nThis quantity is non-negative by definition, as it represents a Euclidean\
    \ side length."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:length_of_oblique_geometry
  - name:beta_side_length_of_oblique_geometry
  - name:width_of_rectangle_geometry
  - name:height_of_rectangle_geometry
  constraints: []
  sources:
  - id: dd:ferritic/object/axisymmetric/oblique/length_alpha
    dd_path: ferritic/object/axisymmetric/oblique/length_alpha
    status: composed
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/length_alpha
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/length_alpha
    status: composed
- name: beta_side_length_of_oblique_geometry
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at angle beta with respect
    to the upward vertical (+Z direction) in the poloidal plane, characterizing the
    oblique cross-sectional geometry of a conductor or ferritic element. This non-negative
    scalar is one of the two side lengths needed, together with inclination angles
    alpha and beta, to fully define the parallelogram shape.
  documentation: "In an oblique (parallelogram) cross-section model, the full geometry\
    \ is determined by four parameters: the primary span along the major-radius direction\
    \ $R$, the height (thickness) $h$ along the vertical $+\\hat{Z}$ direction, and\
    \ two inclined side lengths $\\ell_\\alpha$ and $\\ell_\\beta$ associated with\
    \ their respective inclination angles $\\alpha$ and $\\beta$. The beta side length\
    \ $\\ell_\\beta$ is the length of the parallelogram side whose direction is inclined\
    \ at angle $\\beta$ with respect to the upward vertical $+\\hat{Z}$ in the poloidal\
    \ $(R, Z)$ plane (i.e., the plane defined by the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame at a given toroidal angle $\\phi$).\n\nThe angle $\\beta$ is\
    \ defined in accordance with the convention of `second_inclination_angle_of_oblique_geometry`:\
    \ it is the angle between the inclined side and the $+\\hat{Z}$ axis in the poloidal\
    \ plane, typically in the range $0 \\leq \\beta < \\pi/2$. The Cartesian projections\
    \ of this side are:\n$$\\Delta R_\\beta = \\ell_\\beta \\sin\\beta, \\quad \\\
    Delta Z_\\beta = \\ell_\\beta \\cos\\beta$$\nwhere $R$ is major radius (meters)\
    \ and $Z$ is vertical height (meters).\n\nThe complete oblique cross-section parameter\
    \ set consists of: the alpha side length $\\ell_\\alpha$ (`alpha_side_length_of_oblique_geometry`),\
    \ the beta side length $\\ell_\\beta$ (this quantity), the first inclination angle\
    \ $\\alpha$ (`first_inclination_angle_of_oblique_geometry`), the second inclination\
    \ angle $\\beta$ (`second_inclination_angle_of_oblique_geometry`), the primary\
    \ span along $R$, and the thickness $h$ (`thickness_of_oblique_geometry`). The\
    \ side lengths and the angles together \u2014 not the side lengths alone \u2014\
    \ fully determine the parallelogram shape.\n\nAs a geometric side length, $\\\
    ell_\\beta$ is strictly non-negative ($\\ell_\\beta \\geq 0$). Typical values\
    \ range from a few millimeters to tens of centimeters, depending on the scale\
    \ of the ferritic insert, iron-core segment, or antenna strap being modeled. This\
    \ parameterization is used for axisymmetric ferritic objects and ion cyclotron\
    \ antenna strap elements."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:alpha_side_length_of_oblique_geometry
  - name:length_of_oblique_geometry
  - name:width_of_rectangle_geometry
  - name:height_of_rectangle_geometry
  constraints: []
  sources:
  - id: dd:ferritic/object/axisymmetric/oblique/length_beta
    dd_path: ferritic/object/axisymmetric/oblique/length_beta
    status: composed
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/length_beta
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/length_beta
    status: composed
- name: binormal_component_of_wave_electric_field
  kind: scalar
  status: draft
  description: Projection of the coherent wave electric field onto the binormal direction
    of the local field-aligned coordinate triad (parallel, normal, binormal). The
    binormal unit vector is defined as the cross product of the parallel and normal
    unit vectors, lying tangent to the flux surface and perpendicular to the magnetic
    field line.
  documentation: 'The binormal component $E_b = \mathbf{E}_w \cdot \hat{b}$ is the
    projection of the complex (phasor) wave electric field $\mathbf{E}_w$ onto the
    binormal unit vector $\hat{b} = \hat{e}_\parallel \times \hat{n}$, where $\hat{e}_\parallel$
    is the unit vector along the background magnetic field $\mathbf{B}_0$ and $\hat{n}$
    is the normal unit vector lying in the osculating plane of the field line. This
    quantity is complex-valued; the physical oscillating electric field at time $t$
    is obtained via $\mathrm{Re}(E_b\,e^{-i\omega t})$, where $\omega$ is the wave
    angular frequency. The field-aligned triad $(\hat{e}_\parallel, \hat{n}, \hat{b})$
    is defined at each point in the magnetized plasma, with the binormal direction
    tangent to the flux surface and mutually perpendicular to both the magnetic field
    direction and the normal (field-line curvature) direction.


    The declared unit $\mathrm{m^{-1}\cdot V}$ is equivalent to $\mathrm{V\,m^{-1}}$
    and represents the electric field amplitude; it appears in this form for consistency
    with the sibling wave-field component names. Typical magnitudes depend strongly
    on the heating scenario: in ICRH scenarios the wave electric field amplitude may
    range from $\sim 10^2$ to $\sim 10^5\,\mathrm{V\,m^{-1}}$ in the plasma core,
    while in ECRH scenarios amplitudes are generally lower. The binormal electric
    field component is associated with the polarization perpendicular to the field-line
    curvature plane, relevant to wave mode conversion and cross-field energy transport.


    Together with [parallel_component_of_wave_electric_field](name:parallel_component_of_wave_electric_field)
    and [normal_component_of_wave_electric_field](name:normal_component_of_wave_electric_field),
    this component completes the full field-aligned decomposition of the parent vector
    quantity [wave_electric_field](name:wave_electric_field). The transverse (perpendicular-to-field-line)
    wave polarization can be characterized jointly with [perpendicular_component_of_wave_electric_field](name:perpendicular_component_of_wave_electric_field).
    The magnetic-field counterpart is [binormal_component_of_wave_magnetic_field](name:binormal_component_of_wave_magnetic_field).'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:parallel_component_of_wave_electric_field
  - name:normal_component_of_wave_electric_field
  - name:wave_electric_field
  - name:binormal_component_of_wave_magnetic_field
  constraints: []
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: binormal
    shape: component
  sources:
  - id: dd:waves/coherent_wave/full_wave/e_field/bi_normal/values
    dd_path: waves/coherent_wave/full_wave/e_field/bi_normal/values
    status: composed
- name: binormal_component_of_wave_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the coherent wave magnetic field onto the binormal direction
    of the local field-aligned coordinate triad, where the binormal is defined as
    the cross product of the parallel (along equilibrium magnetic field) and normal
    (toward field-line curvature center) unit vectors.
  documentation: 'The binormal component of the wave magnetic field is defined by
    the scalar projection


    $$B_{\mathrm{w},b} = \mathbf{B}_w \cdot \hat{b}$$


    where $\mathbf{B}_w$ is the coherent wave magnetic field vector and $\hat{b}$
    is the binormal unit vector of the local field-aligned orthonormal triad $(\hat{e}_\parallel,\,
    \hat{n},\, \hat{b})$. The triad is constructed as follows:


    - $\hat{e}_\parallel = \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along
    the equilibrium magnetic field.

    - $\hat{n}$ is the normal unit vector pointing toward the center of curvature
    of the field line (approximately radially inward in the flux-surface sense).

    - $\hat{b} = \hat{e}_\parallel \times \hat{n}$ is the binormal, tangent to the
    flux surface and perpendicular to both $\hat{e}_\parallel$ and $\hat{n}$.


    The wave field is complex-valued in the phasor representation; the physical (real)
    field is recovered via


    $$B_b^{\mathrm{phys}}(t) = \mathrm{Re}\bigl(B_{\mathrm{w},b}\, e^{-i\omega t}\bigr)$$


    where $\omega$ is the angular frequency of the launched wave. Both amplitude $|B_{\mathrm{w},b}|$
    and phase $\arg(B_{\mathrm{w},b})$ carry physical information about the wave polarization
    structure.


    The registered unit for this quantity is $\mathrm{m^{-1} \cdot V}$. This unit
    is not dimensionally equivalent to Tesla ($\mathrm{T} = \mathrm{V \cdot s \cdot
    m^{-2}}$); it arises from a normalization in which the wave field amplitude is
    expressed per unit of a spatial wavenumber or related spectral-decomposition factor
    within full-wave solvers. The dimensional relationship between the stored value
    and the physical magnetic field in Tesla depends on the spectral normalization
    adopted by the full-wave formulation (e.g., multiplication by a characteristic
    length or division by angular frequency). Users should consult the specific full-wave
    model documentation for the conversion factor applicable to their dataset.


    Typical stored magnitudes in ion-cyclotron resonance heating (ICRH) full-wave
    simulations range from $10^{-4}$ to $10^{0}\;\mathrm{m^{-1} \cdot V}$ in the plasma
    core, depending on launched power, antenna geometry, and plasma parameters. For
    electron-cyclotron and lower-hybrid scenarios the values are generally smaller
    due to shorter wavelengths and lower field perturbation per unit power.


    Sign convention: Positive when $B_{\mathrm{w},b}$ points in the $+\hat{b} = \hat{e}_\parallel
    \times \hat{n}$ direction, i.e., tangent to the flux surface in the direction
    perpendicular to both the equilibrium magnetic field and the inward-pointing normal.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:normal_component_of_wave_magnetic_field
  - name:parallel_component_of_wave_magnetic_field
  - name:binormal_component_of_wave_electric_field
  constraints: []
  arguments:
  - name: wave_magnetic_field
    operator: component
    operator_kind: projection
    axis: binormal
    shape: component
  sources:
  - id: dd:waves/coherent_wave/full_wave/b_field/bi_normal/values
    dd_path: waves/coherent_wave/full_wave/b_field/bi_normal/values
    status: composed
- name: distance_of_antenna_strap_to_conducting_wall
  kind: scalar
  status: draft
  description: Shortest perpendicular distance from an ion cyclotron resonance heating
    antenna strap to the conducting wall or conductor behind it. This is a non-negative
    geometric scalar determined from the antenna mechanical assembly.
  documentation: 'The distance $d$ is defined as the minimum perpendicular separation
    from the strap surface to the nearest conducting boundary behind it:

    $$d = \min_{\mathbf{r}_s \in S_{\mathrm{strap}}} \left| (\mathbf{r}_s - \mathbf{r}_w)
    \cdot \hat{n}_w \right|,$$

    where $S_{\mathrm{strap}}$ is the set of points on the strap front face, $\mathbf{r}_w$
    is the closest point on the conducting wall surface, and $\hat{n}_w$ is the outward
    unit normal to the wall at that point.


    By definition $d \geq 0$; it vanishes only in the degenerate case where the strap
    contacts the conductor.


    Typical values in present-day tokamak ICRH antenna modules range from approximately
    0.02 m to 0.20 m depending on the antenna box depth and mechanical design.


    The measurement direction is determined entirely by the local wall geometry and
    is not constrained to lie along any particular coordinate axis. In many antenna
    designs the back wall is approximately toroidal, so the perpendicular direction
    is close to the inward major-radius direction, but this is not assumed in the
    definition.


    This quantity, together with the [toroidal width of the strap](name:toroidal_width_of_ion_cyclotron_antenna_strap)
    and the [oblique cross-section thickness](name:thickness_of_oblique_cross_section_of_ion_cyclotron_antenna_strap),
    parameterizes the near-field electromagnetic geometry of the antenna strap assembly.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_width_of_ion_cyclotron_antenna_strap
  - name:outer_radius_of_annular_conductor_cross_section
  constraints: []
  sources:
  - id: dd:ic_antennas/antenna/module/strap/distance_to_conductor
    dd_path: ic_antennas/antenna/module/strap/distance_to_conductor
    status: composed
- name: electron_wave_absorbed_power_along_beam
  kind: scalar
  status: draft
  description: Wave power absorbed by the total electron population (thermal plus
    fast) from a coherent wave along the beam or ray path in beam tracing calculations.
  documentation: In beam tracing simulations of coherent wave propagation, the wave
    power absorbed by electrons at each point along the ray or beam trajectory is
    governed by the imaginary part of the wave dispersion tensor. The local absorption
    rate $dP/ds$ (where $s$ is the arc length along the beam) integrates contributions
    from collisional and collisionless (Landau, cyclotron) damping mechanisms acting
    on the entire electron population, without separating thermal from fast-electron
    channels. This quantity represents the sum of thermal-electron and fast-electron
    absorption, making it useful when population-resolved breakdown is unavailable
    or not required. Typical absorbed power fractions range from near zero in weakly
    damped regimes to nearly the full launched power ($\sim$MW scale in ECRH or LH
    scenarios) in strongly absorbing plasmas. For population-resolved accounting,
    see [thermal_electron_wave_absorbed_power](name:thermal_electron_wave_absorbed_power)
    and [fast_electron_wave_absorbed_power](name:fast_electron_wave_absorbed_power);
    the analogous ion quantity along the beam is [ion_wave_absorbed_power_along_beam](name:ion_wave_absorbed_power_along_beam),
    and the charge-state-resolved ion form is [ion_state_wave_absorbed_power_along_beam](name:ion_state_wave_absorbed_power_along_beam).
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_wave_absorbed_power
  - name:fast_electron_wave_absorbed_power
  - name:ion_wave_absorbed_power_along_beam
  - name:ion_state_wave_absorbed_power_along_beam
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/electrons/power
    dd_path: waves/coherent_wave/beam_tracing/beam/electrons/power
    status: composed
- name: fast_electron_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the fast (suprathermal) electron population
    from a coherent RF wave, integrated over the plasma volume.
  documentation: 'The fast electron wave absorbed power quantifies the net power transfer
    from a coherent electromagnetic wave to the suprathermal (non-Maxwellian) electron
    population via wave-particle interactions such as electron Landau damping and
    transit-time magnetic pumping. It is defined as $P_{\rm fast,e} = \int_{V} Q_{\rm
    fast,e}(\mathbf{r})\, dV$, where $Q_{\rm fast,e}$ (in W m$^{-3}$) is the local
    absorbed power density for fast electrons and the integral extends over the plasma
    volume $V$. This quantity is the volume-integrated complement of [per_toroidal_mode_of_fast_electron_wave_absorbed_power](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power),
    which resolves the same absorption by toroidal mode number, and of [fast_electron_wave_absorbed_power_inside_flux_surface](name:fast_electron_wave_absorbed_power_inside_flux_surface),
    which gives the cumulative integral up to a given flux surface. Typical fast-electron
    absorption fractions depend strongly on the wave scheme: lower hybrid current
    drive deposits nearly all power into suprathermal electrons (tens to hundreds
    of kilowatts in present devices, megawatts in reactor scenarios), while ion cyclotron
    resonance heating at minority concentrations may deposit a smaller fraction. Computed
    by full-wave or ray/beam-tracing codes that separately track power deposition
    channels; the fast-electron channel is distinguished from the thermal channel
    captured by [thermal_electron_wave_absorbed_power](name:thermal_electron_wave_absorbed_power)
    and the fast-ion channel captured by [fast_ion_wave_absorbed_power](name:fast_ion_wave_absorbed_power).
    The sum of all species and population contributions yields the total [wave_absorbed_power](name:wave_absorbed_power).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power
  - name:fast_electron_wave_absorbed_power_inside_flux_surface
  - name:thermal_electron_wave_absorbed_power
  - name:fast_ion_wave_absorbed_power
  - name:wave_absorbed_power
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/global_quantities/electrons/power_fast
    dd_path: waves/coherent_wave/global_quantities/electrons/power_fast
    status: composed
- name: fast_electron_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by fast (non-thermal) electrons enclosed
    within a given flux surface, obtained as the volume integral of the absorbed power
    density from the magnetic axis outward.
  documentation: 'This quantity gives the cumulative absorbed wave power deposited
    on the fast (non-thermal, suprathermal) electron population, defined as the volume
    integral of the absorbed power density $p_\mathrm{fast,e}$ from the magnetic axis
    to a flux surface labeled by $\rho$:


    $$P_\mathrm{fast,e}(\rho) = \int_0^\rho p_\mathrm{fast,e}(\rho'') \, dV(\rho''),$$


    where $dV$ is the differential flux-surface volume element. The result is the
    total power transferred from the wave to suprathermal electrons residing inside
    that surface, summed over all contributing toroidal modes. Fast-electron wave
    absorption is the dominant energy deposition channel in electron cyclotron current
    drive (ECCD) and electron Bernstein wave (EBW) heating scenarios, where resonance
    conditions preferentially accelerate electrons above the thermal bulk. Typical
    absorbed powers range from tens of kilowatts to several megawatts depending on
    launched wave power and plasma parameters. This profile is used to reconstruct
    the radial deposition profile by differentiation and to diagnose the driven current
    location. The per-mode decomposition is available via [per-toroidal-mode fast-electron
    absorbed power inside flux surface](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface),
    and the thermal-electron analog is [thermal_electron_wave_absorbed_power_inside_flux_surface](name:thermal_electron_wave_absorbed_power_inside_flux_surface).
    The total (not cumulative) fast-electron absorbed power per mode is given by [per_toroidal_mode_of_fast_electron_wave_absorbed_power](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface
  - name:thermal_electron_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_fast
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_fast
    status: composed
- name: fast_ion_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the fast (non-thermal) ion population
    from a coherent wave, integrated over the plasma volume.
  documentation: "The fast ion wave absorbed power quantifies the total electromagnetic\
    \ wave energy per unit time transferred to suprathermal (non-thermal) ions via\
    \ wave\u2013particle interactions such as ion cyclotron resonance and transit-time\
    \ magnetic pumping. The governing relation is $P_{\\rm fast,i} = \\int Q_{\\rm\
    \ fast,i}(\\mathbf{r})\\, dV$, where $Q_{\\rm fast,i}$ is the local absorbed power\
    \ density deposited on the fast ion population and the integral extends over the\
    \ full plasma volume. This quantity is central to ion cyclotron resonance heating\
    \ (ICRH) and neutral beam injection (NBI) scenarios, where a significant fraction\
    \ of wave energy is preferentially absorbed by a suprathermal minority or beam-driven\
    \ fast ion population rather than the bulk plasma. Typical values range from tens\
    \ of kilowatts in minority heating minority fractions to several megawatts in\
    \ high-power ICRH experiments. It complements [fast electron wave absorbed power](name:fast_electron_wave_absorbed_power)\
    \ and [thermal ion wave absorbed power](name:thermal_ion_wave_absorbed_power),\
    \ together accounting for the full species-resolved wave power budget; the radial\
    \ deposition profile is captured by [fast ion wave absorbed power density](name:fast_ion_wave_absorbed_power_density),\
    \ and the cumulative enclosed power by [fast ion wave absorbed power inside flux\
    \ surface](name:fast_ion_wave_absorbed_power_inside_flux_surface). The toroidal-mode-resolved\
    \ counterpart is [per toroidal mode of fast ion wave absorbed power](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_wave_absorbed_power
  - name:thermal_ion_wave_absorbed_power
  - name:fast_ion_wave_absorbed_power_density
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_fast_ion_wave_absorbed_power
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/power_fast
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_fast
    status: composed
- name: fast_ion_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power per unit volume deposited on the fast (non-thermal)
    ion population by a coherent wave field, summed over all ion species and charge
    states. Equivalently, the local volumetric source of energy for the fast-ion distribution
    function arising from wave-particle interaction.
  documentation: "## Fast-ion wave absorbed power density\n\nThe fast-ion absorbed\
    \ power density $q_{\\mathrm{fast,ion}}$ is the net rate of electromagnetic energy\
    \ transfer per unit volume from a coherent wave to the non-thermal (fast, or suprathermal)\
    \ ion population.  It is obtained from the anti-Hermitian part of the dielectric\
    \ response:\n\n$$q_{\\mathrm{fast,ion}}(\\mathbf{r}) = \\frac{1}{2}\\,\\mathrm{Re}\\\
    !\\left[\\mathbf{E}^* \\cdot \\boldsymbol{\\sigma}_{\\mathrm{fast,ion}}^{\\mathrm{aH}}\
    \ \\cdot \\mathbf{E}\\right],$$\n\nwhere $\\mathbf{E}(\\mathbf{r})$ is the complex\
    \ wave electric-field amplitude and $\\boldsymbol{\\sigma}_{\\mathrm{fast,ion}}^{\\\
    mathrm{aH}}$ is the anti-Hermitian part of the fast-ion current-response (conductivity)\
    \ tensor.  For a quasilinear description in velocity space, the same quantity\
    \ appears as the velocity-space integral\n\n$$q_{\\mathrm{fast,ion}} = \\int \\\
    mathcal{E}(\\mathbf{v})\\,\\mathcal{C}_{\\mathrm{QL}}[f_{\\mathrm{fast}}]\\,d^3v,$$\n\
    \nwhere $\\mathcal{E}(\\mathbf{v}) = \\tfrac{1}{2}m v^2$ is the particle kinetic\
    \ energy and $\\mathcal{C}_{\\mathrm{QL}}[f_{\\mathrm{fast}}]$ is the quasilinear\
    \ diffusion operator acting on the fast-ion distribution function $f_{\\mathrm{fast}}$,\
    \ with units of $\\mathrm{m}^{-6}\\,\\mathrm{s}^{-3}$ (phase-space density per\
    \ second), so that the product has units of $\\mathrm{W}\\,\\mathrm{m}^{-3}$,\
    \ consistent with the declared unit.\n\nThis quantity is the spatial integrand\
    \ of the total fast-ion absorbed power $P_{\\mathrm{fast,ion}}$:\n\n$$P_{\\mathrm{fast,ion}}\
    \ = \\int q_{\\mathrm{fast,ion}}(\\mathbf{r})\\,d^3r.$$\n\nThe field $q_{\\mathrm{fast,ion}}$\
    \ is a function of position in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is the major radius from the machine symmetry axis, $\\phi$ is the\
    \ toroidal angle increasing counter-clockwise when viewed from above, and $Z$\
    \ is the vertical height.  Flux-surface-averaged profiles are obtained by averaging\
    \ over the flux-surface label at each radial position.\n\nFor typical ion cyclotron\
    \ resonance heating (ICRH) scenarios, the fast minority ions absorb power densities\
    \ in the range $10^4$\u2013$10^7\\,\\mathrm{W\\,m^{-3}}$, with peak values near\
    \ the resonance layer.  Neutral beam injection creates fast ions that may be treated\
    \ similarly in the wave-absorption formalism when a wave is also present.\n\n\
    The sum runs over all fast-ion species $s$ and all charge states $z$:\n\n$$q_{\\\
    mathrm{fast,ion}} = \\sum_{s,z} q_{\\mathrm{fast,ion}}^{(s,z)}.$$\n\nSign convention:\
    \ Positive when energy flows from the wave into the fast-ion population (heating).\n\
    \nNegative values indicate wave emission by the fast-ion population (e.g., stimulated\
    \ emission or inverse Landau damping), which is physically possible but rare under\
    \ typical auxiliary-heating operation."
  unit: W.m^-3
  physics_domain: auxiliary_heating
