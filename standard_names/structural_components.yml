- name: thickness_of_cryostat
  kind: scalar
  status: active
  description: Local through-wall distance across the cryostat structural vessel,
    measured along the wall normal between its inner and outer material faces.
  documentation: 'The quantity is the geometric thickness of the cryostat structural
    vessel at a specified location. It is the separation through the wall material
    between corresponding inner and outer faces, measured along the local wall-normal
    direction.


    At the corresponding inner and outer face points, the thickness is defined by


    $$

    t = (\mathbf{x}_{\mathrm{out}}-\mathbf{x}_{\mathrm{in}})\mathbin{\cdot}\hat{\mathbf{n}}

    $$


    where $t$ is the thickness in m, $\mathbf{x}_{\mathrm{in}}$ and $\mathbf{x}_{\mathrm{out}}$
    are the face position vectors in m, and $\hat{\mathbf{n}}$ is the unit normal
    directed from the inner face toward the outer face.


    The value is a non-negative material separation and excludes gaps, insulation,
    and attached components. It is distinct from [thickness of the vacuum vessel](name:thickness_of_vacuum_vessel),
    which describes the vacuum-vessel wall rather than the cryostat structural wall.'
