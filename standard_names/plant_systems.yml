- name: length_of_pellet
  kind: scalar
  status: active
  description: End-to-end extent of an intact cylindrical pellet measured along its
    symmetry axis before injection or shattering.
  documentation: 'The pellet axial length is the distance between the two end faces
    measured parallel to the symmetry axis of the intact cylindrical pellet.


    $$

    L_p = z_2 - z_1

    $$


    where $L_p$ is the axial length and $z_1$ and $z_2$ are the axial coordinates
    of the two end faces, ordered so that $z_2 > z_1$ along the chosen axial direction.


    This quantity describes the unshattered pellet before injection or fragmentation
    and excludes its transverse size, which is described by the [diameter of the pellet](name:diameter_of_pellet).'
