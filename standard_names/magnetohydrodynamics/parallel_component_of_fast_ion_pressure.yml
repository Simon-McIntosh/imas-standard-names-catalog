name: parallel_component_of_fast_ion_pressure
status: draft
description: Pressure tensor component of the supra-thermal (non-Maxwellian) ion population
  projected along the magnetic-field direction $\hat{b}$.
documentation: "The fast ion parallel pressure $p_{i,\\parallel}^{\\mathrm{fast}}$\
  \ is defined as $p_{i,\\parallel}^{\\mathrm{fast}} = m_i \\int (v_\\parallel - u_\\\
  parallel)^2 f_i^{\\mathrm{fast}}\\, d^3v$, where $m_i$ is the ion mass, $v_\\parallel$\
  \ the velocity component along $\\hat{b} = \\mathbf{B}/B$, $u_\\parallel$ the mean\
  \ parallel drift, and $f_i^{\\mathrm{fast}}$ the non-thermal part of the ion distribution\
  \ function. Fast ions are produced primarily by neutral beam injection (NBI), ion\
  \ cyclotron resonance heating (ICRH), and D\u2013T fusion alpha particles. In ITER-class\
  \ plasmas, the fast ion parallel pressure can reach 50\u2013200 kPa, contributing\
  \ a significant fraction to the total plasma beta and driving or stabilizing various\
  \ MHD modes (fishbones, toroidal Alfv\xE9n eigenmodes, sawteeth). The ratio $p_{i,\\\
  parallel}^{\\mathrm{fast}} / p_{i,\\perp}^{\\mathrm{fast}}$ characterizes the velocity-space\
  \ anisotropy: NBI-born ions tend toward $p_\\parallel > p_\\perp$, while ICRH-accelerated\
  \ ions exhibit $p_\\perp > p_\\parallel$. The quantity is computed by orbit-following\
  \ Monte Carlo codes (e.g., NUBEAM, ASCOT) or extracted from fast-ion D-alpha (FIDA)\
  \ and neutral-particle analyzer (NPA) diagnostics. Summing over all ion charge states\
  \ when multiple species are present yields the total fast ion parallel pressure."
