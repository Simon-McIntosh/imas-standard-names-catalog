- name: wave_current_of_antenna_strap_amplitude
  kind: scalar
  status: active
  description: Peak magnitude of the radio-frequency current oscillating along an
    ion-cyclotron-heating antenna strap at a specified location.
  documentation: 'The strap-current amplitude is the non-negative peak magnitude of
    the radio-frequency current associated with electromagnetic-wave excitation at
    a specified location along an ion-cyclotron-heating antenna strap.


    For the oscillatory current represented by a complex phasor, the amplitude is
    defined as


    $$

    I_{\mathrm{amp}} = |\widetilde{I}|

    $$


    where $I_{\mathrm{amp}}$ is the strap-current amplitude and $\widetilde{I}$ is
    the complex phasor of the strap current at the specified location.


    This quantity applies to one antenna strap within one antenna module and is evaluated
    at the relevant position along that strap. It characterizes the radio-frequency
    excitation associated with the module''s wave current; it is not summed or averaged
    over multiple straps, modules, or the complete antenna system. The amplitude is
    non-negative and therefore excludes the sign and phase information of the instantaneous
    current.


    As the amplitude form of [wave current of antenna strap](name:wave_current_of_antenna_strap),
    it retains the parent quantity''s strap locus and wave-current meaning while selecting
    its peak magnitude. It is distinct from the instantaneous signed current and from
    a root-mean-square representation of the same oscillatory current.'
  unit: A
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ic_antennas/antenna/module/current/amplitude
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-current-amplitude
    dd_documentation:
      leaf: Amplitude of the measurement
      parent_path: ic_antennas/antenna/module/current
      parent: Set of current measurements
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Amplitude of the current at a specific position on an ICRH antenna
        module fed by a single transmission line. Characterises the electromagnetic
        state and coupling efficiency of the ion cyclotron antenna during operation.
      kind: llm
- name: wave_phase_of_antenna_strap
  kind: scalar
  status: active
  description: Phase angle of the radio-frequency current phasor carried by one ion-cyclotron-heating
    antenna strap, defined relative to a specified RF phase reference.
  documentation: 'Wave phase of an antenna strap is the phase angle of the oscillatory
    radio-frequency current phasor carried by that strap. It describes the strap-level
    excitation phase used in the antenna''s toroidal phasing configuration.


    The complex strap-current phasor may be represented as


    $$

    I_s = |I_s|e^{i\phi_s}

    $$


    where $I_s$ is the complex radio-frequency current phasor, $|I_s|$ is its current
    amplitude, and $\phi_s$ is the wave phase represented by this quantity. The phase
    is defined modulo $2\pi$ relative to a specified RF reference phase.


    This quantity applies to one antenna strap and is not summed or averaged over
    multiple straps. It refers to the phase of the strap current, not the phase of
    a forward power-wave phasor, which is represented by [forward wave phase of an
    ion-cyclotron-heating antenna](name:forward_wave_phase_of_ion_cyclotron_heating_antenna),
    or the phase associated with a complete antenna element.


    The associated [wave current of antenna strap](name:wave_current_of_antenna_strap)
    provides the phasor whose phase is specified, while [wave current of antenna strap
    amplitude](name:wave_current_of_antenna_strap_amplitude) determines its magnitude
    rather than its phase. Relative phases between straps determine the toroidal phasing
    of the antenna excitation and therefore influence the launched wave excitation
    spectrum. The phase-reference plane and any phase-unwrapping convention must be
    specified separately when comparing values.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:forward_wave_phase_of_ion_cyclotron_heating_antenna
  - name:wave_current_of_antenna_strap_amplitude
  sources:
  - dd_path: ic_antennas/antenna/module/strap/phase
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-phase
    dd_documentation:
      leaf: Phase of the strap current
      parent_path: ic_antennas/antenna/module/strap
      parent: Set of IC antenna straps
      data_type: STRUCTURE
      unit: rad
    enhanced_context:
      description: Phase of the strap current for an ion cyclotron resonance heating
        (ICRH) antenna strap. Together with current amplitude, determines the toroidal
