- name: plasma_pressure
  kind: scalar
  status: active
  description: Isotropic scalar pressure of the plasma fluid in a continuum description,
    serving as the parent concept for both the bulk thermal equilibrium pressure and
    first-order perturbative pressure deviations in linear MHD stability analysis.
  documentation: 'Plasma pressure in the fluid (MHD) description is the isotropic
    part of the pressure tensor, entering the radial force balance $\nabla p = \mathbf{j}
    \times \mathbf{B}$, where $\mathbf{j}$ is the current density and $\mathbf{B}$
    is the magnetic field. This parent abstracts over two physically distinct realizations:
    [thermal_plasma_pressure](name:thermal_plasma_pressure), which sums the kinetic
    contributions from bulk thermal electron and ion populations while excluding fast
    or suprathermal particles, and [perturbed_plasma_pressure](name:perturbed_plasma_pressure),
    which represents the complex-amplitude linear eigenfunction $\delta p$ arising
    in stability analysis about a magnetohydrostatic equilibrium.


    In the thermal regime the pressure is given by the equation of state:


    $$

    p = n_e k_B T_e + \sum_i n_i k_B T_i

    $$


    where $n_e$ and $n_i$ are the electron and ion number densities, $T_e$ and $T_i$
    are their respective temperatures, and $k_B$ is the Boltzmann constant. In linear
    MHD stability analysis the equilibrium profile $p_0$ is perturbed as $p = p_0
    + \delta p$, where $\delta p$ is the pressure eigenfunction resolved per toroidal
    Fourier mode.


    Pressure profiles are inferred from equilibrium reconstruction by enforcing the
    radial force-balance constraint against magnetic diagnostic data and a finite
    set of kinetic pressure measurements. The volume integral of the thermal pressure,
    scaled by $3/2$, yields the stored thermal energy [thermal_plasma_energy](name:thermal_plasma_energy),
    while a pointwise sum of electron and ion contributions is captured by [total_thermal_pressure](name:total_thermal_pressure).'
  unit: Pa
  physics_domain: equilibrium
  links:
  - name:thermal_plasma_pressure
  - name:thermal_plasma_energy
  sources:
  - dd_path: equilibrium/time_slice/constraints/pressure/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-pressure-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/pressure
