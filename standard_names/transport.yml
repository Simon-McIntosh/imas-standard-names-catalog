- name: total_thermal_ion_pressure
  kind: scalar
  status: draft
  description: Total isotropic pressure of the thermal ion population, summed over
    all ion species and charge states, excluding fast (suprathermal) ion contributions.
  documentation: 'The total thermal ion pressure is the aggregate isotropic pressure
    arising from the random thermal motion of all ion species in the plasma, summed
    over all species and their respective charge states. It captures the purely thermal
    (Maxwellian-distributed) ion pressure contribution and explicitly excludes fast
    and suprathermal ion pressure, which may be anisotropic and is accounted for separately.


    The defining relation is:


    $$

    p_{i,\mathrm{th}} = \sum_{s} \sum_{z} n_{s,z} \, T_{s,z}

    $$


    where $n_{s,z}$ is the number density of ion species $s$ in charge state $z$ (in
    m$^{-3}$) and $T_{s,z}$ is the corresponding thermal temperature in energy units.
    This is the species- and charge-state-aggregated form of [thermal_ion_pressure](name:thermal_ion_pressure)
    and constitutes the ion contribution to the total thermal plasma pressure when
    combined with the electron thermal pressure.


    This quantity is distinct from [total_ion_pressure](name:total_ion_pressure),
    which additionally includes fast (non-thermal) ion pressure contributions, and
    from [thermal_pressure](name:thermal_pressure), which sums thermal pressure over
    both ion and electron species. The companion density quantity is [total_thermal_ion_density](name:total_thermal_ion_density).


    The total thermal ion pressure is derived from transport simulations or equilibrium
    reconstructions by summing density-weighted temperature profiles across all ion
    species. It enters the ion energy balance equation, MHD pressure equilibrium,
    and parallel momentum transport in both core and edge plasma regions.


    Typical magnitudes in the plasma core of tokamak H-mode plasmas are in the range
    10-100 kPa, falling by several orders of magnitude in the scrape-off layer where
    lower densities and temperatures prevail.


    Sign convention: Positive for all physically realizable thermal ion populations,
    as thermal pressure is a non-negative thermodynamic quantity.'
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_ion_pressure
  - name:total_ion_pressure
  - name:thermal_pressure
  - name:total_thermal_ion_density
  sources:
  - id: dd:core_profiles/profiles_2d/pressure_ion_total
    dd_path: core_profiles/profiles_2d/pressure_ion_total
    status: attached
  - id: dd:edge_profiles/profiles_1d/pressure_ion_total
    dd_path: edge_profiles/profiles_1d/pressure_ion_total
    status: attached
