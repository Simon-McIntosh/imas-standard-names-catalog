name: maximum_of_electron_pressure_gradient_ballooning_stability_parameter_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Peak value of the normalized pressure gradient parameter $\alpha$ in
  the electron pressure pedestal region.
documentation: "The maximum of the normalized pressure gradient $\\alpha = -\\frac{2\\\
  mu_0}{B_{\\rm pol}^2} R q^2 \\frac{dp_e}{dr}$ (where $\\mu_0$ is the vacuum permeability\
  \ in H\xB7m$^{-1}$, $B_{\\rm pol}$ is the poloidal magnetic field in T, $R$ is the\
  \ major radius in m, $q$ is the safety factor, and $dp_e/dr$ is the electron pressure\
  \ gradient in Pa\xB7m$^{-1}$) characterizes the steepest point of the edge barrier\
  \ in H-mode. This quantity determines the proximity to the ideal-MHD ballooning\
  \ stability limit; typical $\\alpha_{\\rm max}$ values lie in the range 1.5\u2013\
  4.0 for type-I ELMy H-modes. It is derived from mtanh fits to $p_e(\\psi_N)$ profiles\
  \ combined with equilibrium reconstruction geometry. See also `electron_pressure_pedestal_alpha_parameter_maximum_position`,\
  \ `electron_pressure_pedestal_width`."
validity_domain: ''
