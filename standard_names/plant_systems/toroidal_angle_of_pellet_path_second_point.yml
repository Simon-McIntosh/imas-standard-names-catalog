name: toroidal_angle_of_pellet_path_second_point
status: draft
description: Toroidal angle $\phi$ of the second geometric point defining the pellet
  injection trajectory, in the machine cylindrical coordinate system.
documentation: The toroidal angle $\phi_{\rm p2}$ (in radians) specifies the second
  endpoint of the straight-line pellet path geometry in the $(R, \phi, Z)$ cylindrical
  coordinate frame. Together with the first point (typically at the guide-tube exit),
  this pair of points uniquely defines the pellet's nominal flight path through the
  plasma. The angle is oriented counter-clockwise when viewed from above, following
  the standard right-handed convention. Pellet injection paths may be purely radial
  ($\Delta\phi \approx 0$ between the two points) or tangential, where $\phi_{\rm
  p2}$ differs significantly from the first point's toroidal angle. Tangential injection
  is favored for deeper pellet penetration because the pellet traverses a longer path
  at moderate flux-surface depth. This geometric information is required by pellet
  ablation codes (e.g., neutral gas shielding models) to compute the density and energy
  deposition profiles along the trajectory. See also `diameter_of_pellet` for the
  pellet size and `pellet_species_number_density` for the pellet material density.
