- name: spectral_refractive_index_of_optical_element
  kind: scalar
  status: draft
  description: Wavelength-resolved ratio of the vacuum speed of light to the phase
    velocity in a diagnostic optical element material, capturing the spectral dispersion
    required for chromatic transmission and reflection modeling.
  documentation: "The spectral refractive index $n(\\lambda)$ of an optical element\
    \ quantifies how the phase velocity of light is reduced relative to vacuum as\
    \ a function of wavelength $\\lambda$. Its wavelength dependence, known as dispersion,\
    \ governs chromatic aberration, wavelength-dependent Fresnel reflection coefficients,\
    \ and the focusing and transmission characteristics of lenses, windows, and filters\
    \ across a diagnostic spectral range.\n\nThe defining relation is:\n\n$$\nn(\\\
    lambda) = \\frac{c}{v_\\phi(\\lambda)}\n$$\n\nwhere $c$ is the speed of light\
    \ in vacuum and $v_\\phi(\\lambda)$ is the phase velocity at wavelength $\\lambda$.\
    \ In practice, $n(\\lambda)$ is well described by a Sellmeier dispersion relation,\
    \ $n^2(\\lambda) = 1 + \\sum_i B_i \\lambda^2 / (\\lambda^2 - C_i)$, with empirically\
    \ determined material coefficients $B_i$ and $C_i$ specific to the optical glass\
    \ or crystal.\n\nThe spectral refractive index is evaluated on the same wavelength\
    \ axis defined by [spectral_wavelength](name:spectral_wavelength) and is typically\
    \ sourced from manufacturer material specifications or measured by prism minimum-deviation\
    \ refractometry or spectroscopic ellipsometry. For infrared optical elements,\
    \ $n(\\lambda)$ is paired with the extinction coefficient to fully characterize\
    \ the complex optical response governing transmission and reflection. The full\
    \ dispersion curve constitutes the spectral resolution of the broadband [refractive_index_of_optical_element](name:refractive_index_of_optical_element).\n\
    \nTypical values span $n \\approx 1.45$\u2013$1.47$ for fused silica in the UV-visible\
    \ range, $n \\approx 1.5$ for BK7 optical glass, and $n \\approx 2.4$ for ZnSe\
    \ at mid-infrared wavelengths. Compare with [parallel_refractive_index](name:parallel_refractive_index),\
    \ which describes the refractive index projected along a wave beam directional\
    \ axis in plasma wave-propagation contexts.\n\nSign convention: Positive when\
    \ the phase velocity of light in the material is less than the speed of light\
    \ in vacuum, as holds for all conventional dielectric and metallic optical elements\
    \ used in fusion plasma diagnostics."
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:camera_ir/optical_element/material_properties/refractive_index
    dd_path: camera_ir/optical_element/material_properties/refractive_index
    status: attached
  - id: dd:camera_visible/channel/optical_element/material_properties/refractive_index
    dd_path: camera_visible/channel/optical_element/material_properties/refractive_index
    status: composed
  - id: dd:spectrometer_visible/channel/optical_element/material_properties/refractive_index
    dd_path: spectrometer_visible/channel/optical_element/material_properties/refractive_index
