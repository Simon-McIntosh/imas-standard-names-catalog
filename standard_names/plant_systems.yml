- name: coolant_mass_flow_rate
  kind: scalar
  status: draft
  description: Mass of coolant fluid passing through a plant component port per unit
    time.
  documentation: "The coolant mass flow rate $\\dot{m}$ (kg s$^{-1}$) characterizes\
    \ the throughput of the working fluid \u2014 water, helium, or liquid metal \u2014\
    \ in a balance-of-plant cooling loop or power-conversion circuit. Combined with\
    \ inlet/outlet temperatures it determines the thermal power extracted: $\\dot{Q}\
    \ = \\dot{m} \\, c_p \\, (T_{\\mathrm{out}} - T_{\\mathrm{in}})$, where $c_p$\
    \ is the fluid specific heat capacity (J kg$^{-1}$ K$^{-1}$). For a tokamak primary\
    \ coolant loop, values range from tens to hundreds of kg s$^{-1}$ per circuit;\
    \ ITER first-wall cooling loops operate near 50\u201380 kg s$^{-1}$ per segment.\
    \ The quantity is measured by Coriolis, ultrasonic, or orifice-plate flow meters\
    \ integrated into the cooling circuit. See also [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port)\
    \ for the associated heat load."
  unit: kg.s^-1
  tags:
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: fragment_volume_of_shattered_pellet_injector
  kind: scalar
  status: draft
  description: Volume of an individual pellet fragment produced after the pellet impacts
    the shatter plate in an SPI system.
  documentation: "After a cryogenic pellet strikes the shatter plate of a shattered\
    \ pellet injection (SPI) system, it breaks into a distribution of fragments whose\
    \ individual volumes $V_f$ (m$^3$) determine the local particle deposition profile\
    \ during ablation in the plasma. Fragment volumes are inferred from fast-camera\
    \ imaging or from inverse modeling of the post-injection density rise. For disruption\
    \ mitigation pellets (neon or mixed D$_2$/Ne) with initial radii of 2\u20134 mm,\
    \ individual fragment volumes span $10^{-10}$\u2013$10^{-8}$ m$^3$ depending on\
    \ shatter geometry and impact velocity. The total particle content of a fragment\
    \ is $N_f = n_s V_f$, where $n_s$ is the species number density ([pellet_species_number_density](name:pellet_species_number_density)).\
    \ See also [pellet_length_of_shattered_pellet_injector](name:pellet_length_of_shattered_pellet_injector)\
    \ for the pre-shatter pellet geometry."
  unit: m^3
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: fragmentation_gas_temperature
  kind: scalar
  status: draft
  description: Temperature of the gas used to shatter a cryogenic pellet in a shattered
    pellet injection (SPI) system.
  documentation: "In shattered pellet injection (SPI), a high-pressure gas (e.g.,\
    \ helium or argon) drives or assists the shattering of the cryogenic pellet at\
    \ a bend tube or shatter head. The fragmentation gas temperature $T_{\\mathrm{gas}}$\
    \ (in K) is a key thermodynamic parameter that, together with the gas pressure\
    \ and flow rate, determines the fragment size distribution and shard velocities.\
    \ Room-temperature operation ($\\sim$300 K) is common, but cryogenic pre-cooling\
    \ or heating may shift $T_{\\mathrm{gas}}$ to 80\u2013400 K depending on the injector\
    \ design. The equation of state $p = n k_B T_{\\mathrm{gas}}$, where $p$ is the\
    \ gas pressure, $n$ is the number density, and $k_B$ is the Boltzmann constant,\
    \ links this temperature to the gas dynamics at the injector exit. See [fragmentation_gas_flow_rate_of_shattered_pellet_injector](name:fragmentation_gas_flow_rate_of_shattered_pellet_injector)\
    \ for the companion flow-rate quantity and [propellant_gas_temperature](name:propellant_gas_temperature)\
    \ for the propellant stage."
  unit: K
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pellet_fragment_volume
  kind: scalar
  status: draft
  description: Volume of an individual fragment produced by the shattering of a cryogenic
    pellet in a shattered pellet injection (SPI) system.
  documentation: "In shattered pellet injection (SPI), a cryogenic fuel pellet (deuterium,\
    \ neon, or mixed composition) is shattered into multiple fragments before entering\
    \ the plasma to achieve rapid assimilation for disruption mitigation or fueling.\
    \ The fragment volume $V_{\\mathrm{frag}}$ (in m$^3$) characterizes the size of\
    \ each individual shard and directly determines the local ablation rate and material\
    \ deposition profile. Fragment volumes span a wide range depending on shattering\
    \ geometry and pellet size; for ITER-scale SPI injectors, individual fragment\
    \ volumes are on the order of $10^{-9}$\u2013$10^{-6}$ m$^3$. The total pellet\
    \ volume equals the sum of all fragment volumes. See also [fragment_volume_of_shattered_pellet_injector](name:fragment_volume_of_shattered_pellet_injector)\
    \ for a related quantity and [pellet_species_number_density](name:pellet_species_number_density)\
    \ for the solid-state density of the pellet material."
  unit: m^3
  cocos_transformation_type: one_like
  tags:
  - derived
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pellet_initial_velocity
  kind: scalar
  status: draft
  description: Speed of a pellet at the moment it enters the vacuum chamber, before
    any plasma-induced deceleration.
  documentation: "The pellet initial velocity $v_{\\rm init}$ is the scalar speed\
    \ of the pellet center of mass as it crosses the vacuum vessel boundary. It is\
    \ set by the launcher type: gas-gun launchers achieve 100\u2013600 m/s, centrifuge\
    \ launchers 200\u20131200 m/s, and electromagnetic launchers can exceed 2 km/s.\
    \ For shattered pellet injection, $v_{\\rm init}$ determines the fragment speed\
    \ before shattering, which in turn governs the penetration depth and the resulting\
    \ density and thermal quench dynamics during disruption mitigation. Measured by\
    \ light-gate pairs or microwave cavity diagnostics along the guide tube. The velocity\
    \ profile along the pellet path after entry is a separate quantity; see also [pellet_speed_at_shatter_target](name:pellet_speed_at_shatter_target)\
    \ for the pre-shatter speed and [pellet_species_number_density](name:pellet_species_number_density)\
    \ for pellet material composition."
  unit: m.s^-1
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pellet_species_number_density
  kind: scalar
  status: draft
  description: Number density of a given atomic or molecular species within the solid
    pellet material.
  documentation: The pellet species number density $n_s$ (m$^{-3}$) specifies how
    many atoms or molecules of species $s$ are present per unit volume of the pellet
    solid. For a pure deuterium ice pellet at cryogenic temperature ($\sim$14 K),
    the solid-phase number density is approximately $3.3 \times 10^{28}$ m$^{-3}$;
    neon pellets for disruption mitigation have $n \approx 4.4 \times 10^{28}$ m$^{-3}$.
    This quantity applies to both the pellet core and shell layers, as well as to
    individual fragments after shattering in an SPI system. Knowledge of $n_s$ together
    with the pellet geometry ([pellet_size_dimension](name:pellet_size_dimension),
    [pellet_fragment_volume](name:pellet_fragment_volume)) yields the total particle
    inventory available for ablation and plasma fueling. See also [fragment_volume_of_shattered_pellet_injector](name:fragment_volume_of_shattered_pellet_injector)
    for the fragment geometry.
  unit: m^-3
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pellet_speed_at_shatter_target
  kind: scalar
  status: draft
  description: Speed of the pellet center of mass immediately before impact on the
    shattering element in a shattered pellet injection (SPI) system.
  documentation: The pellet speed at the shatter target $v_{\mathrm{shatter}} = |\mathbf{v}_{\mathrm{cm}}|$
    is the scalar magnitude of the pellet center-of-mass velocity evaluated at the
    instant just before the pellet strikes the shattering plate or bend tube. This
    quantity governs the fragment size distribution and the resulting ablation deposition
    profile inside the plasma; higher speeds produce smaller fragments and deeper
    penetration. In gas-gun-driven SPI systems, values range from 100 to 600 m/s,
    while two-stage light-gas guns can reach up to 1000 m/s. The speed is inferred
    from fast-camera imaging or microwave-cavity time-of-flight measurements along
    the guide tube. Combined with the [pellet_length_of_shattered_pellet_injector](name:pellet_length_of_shattered_pellet_injector)
    and the shattering angle, this speed determines the kinetic energy budget available
    for fragmentation. See also [fragment_volume_of_shattered_pellet_injector](name:fragment_volume_of_shattered_pellet_injector)
    for the resulting fragment geometry.
  unit: m.s^-1
  cocos_transformation_type: one_like
  tags:
  - derived
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: propellant_gas_temperature
  kind: scalar
  status: draft
  description: Temperature of the propellant gas used to accelerate a pellet in a
    shattered pellet injection system.
  documentation: The propellant gas temperature $T_{\rm prop}$ characterizes the thermodynamic
    state of the high-pressure gas (often deuterium or helium) that drives the pellet
    through the injection barrel. Higher $T_{\rm prop}$ increases the speed of sound
    $c_s = \sqrt{\gamma k_B T_{\rm prop} / m_{\rm gas}}$, where $\gamma$ is the heat-capacity
    ratio, $k_B$ is the Boltzmann constant, and $m_{\rm gas}$ is the molecular mass
    of the propellant, thereby raising the achievable pellet velocity. Values range
    from 200 K to 600 K depending on whether the gas is at room temperature or actively
    heated. The propellant gas temperature, together with the [propellant_gas_flow_rate_of_shattered_pellet_injector](name:propellant_gas_flow_rate_of_shattered_pellet_injector),
    determines the momentum transfer to the pellet. See also [fragmentation_gas_temperature](name:fragmentation_gas_temperature)
    for the analogous quantity in the shattering section of an SPI system.
  unit: K
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: thermal_electric_conversion_efficiency
  kind: scalar
  status: draft
  description: Fraction of input thermal power converted to net electric power by
    the steam (or equivalent thermodynamic) cycle of the power plant.
  documentation: "The thermal-to-electric conversion efficiency $\\eta_{\\mathrm{th\\\
    to el}}$ is defined as $\\eta_{\\mathrm{th\\to el}} = 1 - Q_{\\mathrm{out}} /\
    \ Q_{\\mathrm{in}}$, where $Q_{\\mathrm{in}}$ (W) is the total thermal power supplied\
    \ to the cycle and $Q_{\\mathrm{out}}$ (W) is the rejected heat. It quantifies\
    \ how effectively the balance-of-plant converts fusion thermal energy into electricity.\
    \ For a Rankine steam cycle operating with coolant outlet temperatures of 500\u2013\
    600 \xB0C, values range from 0.30 to 0.45; advanced Brayton-cycle or supercritical-CO$_2$\
    \ concepts target 0.45\u20130.50. This efficiency directly scales the net electric\
    \ output of the facility and is a key figure of merit for power-plant design studies.\
    \ See also [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port)\
    \ for the thermal power entering or leaving individual plant components."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - energy-balance
  - performance-metric
  - steady-state
  links: []
  validity_domain: ''
  constraints: []
- name: thermal_power_of_plant_component_port
  kind: scalar
  status: draft
  description: Heat transfer rate through a port of a balance-of-plant component,
    positive into the system and negative out.
  documentation: The thermal power $\dot{Q}$ (in W) quantifies the rate of heat exchange
    at a given port of a power-plant subsystem component, such as a heat exchanger,
    steam generator, or cooling loop segment. In a fusion power plant, individual
    port thermal powers are summed to close the plant energy balance; fusion-relevant
    values range from a few MW for auxiliary components to several hundred MW for
    the primary coolant loop of a blanket system. The quantity is obtained from calorimetric
    measurements using $\dot{Q} = \dot{m} c_p \Delta T$, where $\dot{m}$ is the coolant
    mass flow rate (kg s$^{-1}$), $c_p$ is the specific heat capacity (J kg$^{-1}$
    K$^{-1}$), and $\Delta T$ is the temperature difference between inlet and outlet
    (K). See also [coolant_mass_flow_rate](name:coolant_mass_flow_rate) and the mechanical
    counterpart at the same port.
  unit: W
  tags:
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
