        Sensor (FOCS). Characterizes the helical twist rate of the fibre, which determines
        its sensitivity to the Faraday magneto-optic effect and its rejection of linear
        birefringence.
      kind: llm
- name: verdet_constant_of_fiber_optic_current_sensor
  kind: scalar
  status: active
  description: Verdet constant of a fiber-optic current sensor is the sensing fiber's
    Faraday-effect coefficient for its optical wavelength and material state. It sets
    the polarization rotation per path length caused by the magnetic-field component
    parallel to the oriented optical path.
  documentation: 'Verdet constant of a fiber-optic current sensor is the scalar Faraday-effect
    coefficient of the sensing fiber for a specified optical wavelength and material
    state. It relates the magnetic-field component parallel to the oriented guided-light
    path to the incremental rotation of the optical polarization.


    For an oriented path $C$, the Faraday rotation produced in the sensing fiber is
    defined by


    $$

    \Delta \chi = \int_C V(s)\,\mathbf{B}(\mathbf{r}(s))\cdot\hat{\mathbf{t}}(s)\,ds

    $$


    where $\Delta\chi$ is the change in polarization angle, $V(s)$ is the Verdet constant
    along the path, $s$ is arc length, $\mathbf{r}(s)$ is the position on the path,
    $\hat{\mathbf{t}}(s)$ is the unit tangent in the positive optical propagation
    direction, and $\mathbf{B}$ is the magnetic field. For a uniform fiber segment,
    $V(s)$ reduces to a constant $V$.


    This coefficient is distinct from geometrical quantities such as [length of a
    fiber-optic current sensor](name:length_of_fiber_optic_current_sensor) and [period
    of a fiber-optic current sensor](name:period_of_fiber_optic_current_sensor); those
    quantities determine the path $C$ and tangent $\hat{\mathbf{t}}$, not the local
    material response. Nonmagnetic phase retardance, including linear birefringence,
    is not part of the Verdet constant.


    Sign convention: Positive when $\mathbf{B}\cdot\hat{\mathbf{t}}>0$ produces $d\chi/ds>0$,
    with $\chi$ measured in the co-propagating transverse basis from $\hat{\mathbf{e}}_1$
    toward $\hat{\mathbf{e}}_2$ where $\hat{\mathbf{e}}_1 \times \hat{\mathbf{e}}_2
    = \hat{\mathbf{t}}$.'
  unit: T^-1.m^-1.rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:faraday_angle
  - name:length_of_fiber_optic_current_sensor
  sources:
  - dd_path: focs/fibre_properties/verdet_constant
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/focs.html#focs-fibre_properties-verdet_constant
    dd_documentation:
      leaf: Verdet constant
      parent_path: focs/fibre_properties
      parent: Intrinsic properties of the fibre installed on the vacuum vessel
      data_type: FLT_0D
      unit: rad.T^-1.m^-1
      lifecycle_status: alpha
    enhanced_context:
      description: Verdet constant (V) of the optical fibre in a Fiber Optic Current
        Sensor (FOCS), quantifying the magneto-optic rotation of polarization per
        unit magnetic field and path length. Determines the sensitivity of the Faraday-effect
        current measurement.
      kind: llm
- name: vertical_coordinate_of_diagnostic_antenna
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the geometric center of a diagnostic antenna\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ locates the geometric center of a diagnostic
    antenna along the machine symmetry axis within the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius measured from the symmetry axis
    and $Z$ is the vertical height, both in meters, with the nominal midplane at $Z
    = 0$.


    This coordinate, together with the corresponding major radius, specifies the spatial
    position from which electromagnetic wave diagnostics launch or receive signals.
    Applications include reflectometer emission and detection channels, electron cyclotron
    emission receivers, and X-ray and UV spectrometer optical components. Beam-tracing
    and ray-tracing algorithms use the antenna center position as the boundary condition
    for the launch or detection point of the propagating wave. The analogous geometric
    reference for related diagnostic hardware is captured by [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture),
    [vertical_coordinate_of_optical_element](name:vertical_coordinate_of_optical_element),
    and [vertical_coordinate_of_antenna_strap](name:vertical_coordinate_of_antenna_strap).


    Values span the full height range of the machine port system; in medium-sized
    tokamaks this is approximately $-2$ to $+2$ m depending on port access geometry
    and the plasma region targeted by the diagnostic.


    Sign convention: Positive when the antenna center is located above the device
    midplane in the direction of increasing $Z$.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_coordinate_of_diagnostic_aperture
