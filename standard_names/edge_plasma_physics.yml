- name: toroidal_iron_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal iron velocity at the pedestal top is the toroidal component\
    \ of the iron impurity ion fluid velocity evaluated at the H-mode pedestal top.\
    \ It is projected along increasing toroidal angle \u03C6 in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame and is the density-weighted mean over all ionized Fe charge\
    \ states."
  documentation: 'Toroidal iron velocity at the pedestal top is the toroidal component
    of the iron impurity ion fluid velocity evaluated at the H-mode pedestal top,
    represented as the density-weighted mean over all charge states of the iron ion
    population. The pedestal top is the core-side edge of the steep-gradient pedestal
    region, where edge density, temperature, pressure, and rotation transition toward
    core-like values. The toroidal direction is the $\hat{\phi}$ basis direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius measured
    from the toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The charge-state-averaged toroidal component is defined by


    $$

    v_{\phi,\mathrm{Fe}} = \frac{\sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}} \, \mathbf{u}_{\mathrm{Fe}^{q+}}
    \cdot \hat{\phi}}{\sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}}}

    $$


    where $v_{\phi,\mathrm{Fe}}$ is the toroidal iron velocity at the pedestal top,
    $q$ indexes the physically possible ionized iron charge states from Fe$^{1+}$
    to Fe$^{26+}$, $n_{\mathrm{Fe}^{q+}}$ is the number density of charge state $q$,
    $\mathbf{u}_{\mathrm{Fe}^{q+}}$ is its mean ion fluid velocity, and $\hat{\phi}$
    is the unit vector toward increasing $\phi$.


    In experiments this velocity is inferred from Doppler shifts of iron spectral
    lines, with viewing geometry used to recover the toroidal projection and charge-state
    weighting determined by the observed or modeled emitting states. In modeling it
    is obtained by evaluating charge-state-resolved iron densities and flows at the
    pedestal top and applying the same density-weighted average. The same toroidal
    projection is used for [toroidal iron velocity at the magnetic axis](name:toroidal_iron_velocity_at_magnetic_axis)
    and [toroidal iron velocity at the plasma boundary](name:toroidal_iron_velocity_at_plasma_boundary),
    while [toroidal nitrogen velocity at the pedestal top](name:toroidal_nitrogen_velocity_at_pedestal_top)
    is an analogous species-specific pedestal-top quantity.


    Typical pedestal values are strongly scenario dependent and may have either sign;
    representative magnitudes are about 10^3-10^5 m.s^-1, with the largest values
    associated with strong external torque, radial electric fields, or sharp edge
    rotation gradients.


    Sign convention: Positive when the iron ion fluid velocity component points toward
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_oxygen_velocity_at_pedestal_top
  - name:toroidal_nitrogen_velocity_at_pedestal_top
  - name:toroidal_iron_velocity_at_plasma_boundary
- name: toroidal_iron_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the bulk flow velocity of iron impurity ions\
    \ at the last closed flux surface, expressed in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'Iron-ion toroidal velocity at the plasma boundary is the component
    of the bulk flow of iron impurity ions tangent to the toroidal direction at the
    last closed flux surface. It characterizes edge impurity momentum transport and
    rotation of a high-Z species, without implying a flux-surface average. The component
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The toroidal component is the projection of the iron ion fluid velocity onto the
    toroidal unit vector:


    $$

    v_{\phi,\mathrm{Fe}} = \mathbf{u}_\mathrm{Fe} \cdot \hat{\phi}

    $$


    where $\mathbf{u}_\mathrm{Fe}$ is the bulk iron ion velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In practice this quantity can be inferred from spectroscopic measurements of Doppler
    shifts of iron emission near the last closed flux surface, including charge-exchange
    recombination spectroscopy when suitable signals are available, or computed from
    edge impurity momentum-balance modeling. The value can vary with position on the
    boundary; no flux-surface averaging is part of this definition. Use toroidal_flux_surface_average_iron_velocity_at_plasma_boundary
    for the corresponding flux-surface-averaged boundary velocity, and [toroidal_iron_velocity_at_pedestal](name:toroidal_iron_velocity_at_pedestal_top)
    for the same species and component at the pedestal.


    Typical magnitudes in tokamak edge plasmas are scenario dependent and often of
    order 10^3-10^4 m.s^-1; values near zero, sign reversals, and high-rotation cases
    reaching several 10^4 m.s^-1 can occur.


    Sign convention: Positive when the iron ion bulk flow is directed toward increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
- name: toroidal_krypton_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal krypton velocity at the pedestal top is the toroidal component\
    \ of the density-weighted mean krypton ion bulk-flow velocity at the H-mode pedestal\
    \ top, taken over all krypton charge states. It is resolved along increasing toroidal\
    \ angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame, where R is\
