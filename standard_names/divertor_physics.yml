- name: ion_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Thermal energy per particle of the ion population in the region immediately
    adjacent to a divertor target, averaged over ion species at the sheath entrance
    where the Bohm criterion governs ion entry.
  documentation: 'Ion temperature at the divertor target characterizes the mean kinetic
    energy scale of the ionic plasma population in the narrow layer adjacent to the
    target, evaluated at the sheath entrance where ions satisfy the Bohm condition.
    It is the ion-specific realization of [temperature at the divertor target](name:temperature_at_divertor_target).


    The density-weighted ion temperature is defined by


    $$

    T_i = \frac{\sum_s n_s T_s}{\sum_s n_s}

    $$


    where $s$ indexes the included ion species, $n_s$ is the number density of species
    $s$, and $T_s$ is its kinetic temperature expressed in the same energy convention
    as $T_i$.


    This aggregate excludes electrons and neutral particles. It is distinct from [electron
    temperature at the divertor target](name:electron_temperature_at_divertor_target),
    which characterizes the electron population at the same sheath entrance.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:temperature_at_divertor_target
  - name:electron_temperature_at_divertor_target
  arguments:
  - name: temperature_at_divertor_target
    operator: ion
    operator_kind: qualifier
  sources:
