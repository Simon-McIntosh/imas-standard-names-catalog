- name: poloidal_magnetic_flux_at_measurement_position
  kind: scalar
  status: draft
  description: Poloidal magnetic flux coordinate evaluated at the spatial location
    where a reflectometer channel measures the plasma density profile.
  documentation: 'The poloidal magnetic flux at the measurement position corresponds
    to the flux-surface label $\psi$ (unit: Wb) assigned to the plasma region probed
    by a given channel of a reflectometer. In the IMAS cylindrical $(R, \phi, Z)$
    frame, the poloidal magnetic flux is defined as the integral of the poloidal magnetic
    field through a surface bounded by the magnetic axis and the flux surface. This
    standard name provides the coordinate used to map the density profile measurement
    onto the magnetic flux geometry of the equilibrium.


    The value range depends on the machine and equilibrium; for a typical tokamak,
    $\psi$ may span from $\psi_{\mathrm{axis}}$ (at the magnetic axis) to $\psi_{\mathrm{boundary}}$
    (at the last closed flux surface), with the measurement point lying somewhere
    between. The poloidal flux is a monotonic function of the minor radius, enabling
    radial localization of the diagnostic.


    Sign convention: Positive when the poloidal flux increases from the magnetic axis
    toward the boundary for a plasma current flowing in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:poloidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_pedestal
  - name:poloidal_magnetic_flux_of_magnetic_axis
  sources:
  - id: dd:reflectometer_profile/channel/position/psi
    dd_path: reflectometer_profile/channel/position/psi
    status: composed
- name: poloidal_plasma_velocity
  kind: scalar
  status: draft
  description: Poloidal component of the bulk plasma flow velocity, representing the
    mass-center motion of all species in the direction perpendicular to flux surfaces
    within a poloidal plane.
  documentation: 'The poloidal plasma velocity $v_{\theta}$ quantifies the component
    of the macroscopic bulk flow that lies within the poloidal cross-section, perpendicular
    to the toroidal direction. It is obtained as the poloidal projection of the mass-center
    velocity $\mathbf{v}_{\text{total}} = (\sum_s n_s m_s \mathbf{v}_s) / (\sum_s
    n_s m_s)$ of the combined plasma species. In tokamak plasmas, the poloidal flow
    is typically much slower than the toroidal rotation, with values on the order
    of kilometers per second in the core and tens of kilometers per second in the
    edge, and plays a critical role in generating the radial electric field through
    the force balance equation $E_r = v_\phi B_\theta - v_\theta B_\phi + (\nabla
    p_i) / (Z_i e n_i)$. This velocity is routinely measured by Doppler reflectometry
    and charge exchange recombination spectroscopy. See also the parent quantity [plasma_velocity](name:plasma_velocity)
    and the toroidal counterpart [toroidal_plasma_velocity](name:toroidal_plasma_velocity).


    Sign convention: Positive when the flow points in the direction of increasing
    poloidal angle $\theta$ in the right-handed $(R, \phi, Z)$ frame (i.e., clockwise
    when viewed from above for the standard poloidal coordinate).'
  unit: m.s^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:plasma_velocity
  - name:toroidal_plasma_velocity
  arguments:
  - name: plasma_velocity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
