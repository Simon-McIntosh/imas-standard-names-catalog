name: line_averaged_argon_number_density
status: draft
cocos_transformation_type: one_like
description: Argon number density averaged along a line-of-sight chord through the
  plasma, in m$^{-3}$.
documentation: The line-averaged argon number density $\langle n_{\mathrm{Ar}} \rangle_\ell
  = (1/L) \int_0^L n_{\mathrm{Ar}}(\ell)\,d\ell$ (m$^{-3}$) represents the mean argon
  concentration along a diagnostic chord of length $L$. It is the natural output of
  line-integrated spectroscopic measurements (e.g., VUV or visible Ar emission lines)
  divided by the chord length obtained from equilibrium geometry. Typical values in
  argon-seeded tokamak discharges range from $10^{16}$ to $10^{18}$ m$^{-3}$. This
  quantity is useful for real-time impurity monitoring and feedback control of argon
  seeding. See also `argon_number_density_at_magnetic_axis` for the on-axis value
  and `argon_ion_number_density` for local measurements.
