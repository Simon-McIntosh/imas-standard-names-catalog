    enhanced_context:
      description: Partial pressure of a specific atomic mass species measured by
        the mass spectrometer channel (calibrated data). Represents the contribution
        of that species to the total residual gas pressure in the vessel or exhaust
        system.
      kind: llm
- name: radius_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Geometric radius of a circular diagnostic aperture, measured from its
    center to the circumferential boundary and defining the opening size for optical
    acceptance.
  documentation: 'The diagnostic-aperture radius is the common distance from the center
    of a circular opening to any point on its circumferential boundary. It describes
    the physical opening size, not the aperture''s radial position in the machine.


    For a circular aperture, the radius is defined by


    $$

    r_{\mathrm{ap}} = \left\lVert \mathbf{x}_{\mathrm{b}} - \mathbf{x}_{\mathrm{c}}
    \right\rVert

    $$


    where $r_{\mathrm{ap}}$ is the aperture radius, $\mathbf{x}_{\mathrm{c}}$ is the
    aperture-center position, $\mathbf{x}_{\mathrm{b}}$ is any position on the circumferential
    boundary, and $\lVert\cdot\rVert$ is the Euclidean distance. The corresponding
    full opening width is twice this radius, as defined by [diameter of diagnostic
    aperture](name:diameter_of_diagnostic_aperture). The quantity applies only to
    circular aperture geometry and contributes to optical acceptance, solid angle,
    and etendue calculations.


    Sign convention: Positive when measured from the aperture center toward its circumferential
    boundary.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:diameter_of_diagnostic_aperture
  sources:
  - dd_path: mse/channel/aperture/radius
