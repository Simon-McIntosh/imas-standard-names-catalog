- name: radial_momentum_source
  kind: scalar
  status: draft
  description: Radial component of the volumetric momentum source density vector applied
    to the plasma, representing the net force per unit volume in the major-radius
    direction. This source accounts for momentum transfer from external actuators,
    such as neutral beam injection or radio-frequency waves, to the plasma in the
    cylindrical (R, phi, Z) frame.
  documentation: "The radial momentum source density $S_{p,R}$ (units: kg\xB7m\u207B\
    \xB2\xB7s\u207B\xB2) is the component along the major radius axis $R$ of the volumetric\
    \ momentum source density vector $\\mathbf{S}_p$ applied to the plasma. It is\
    \ defined as $S_{p,R} = \\mathbf{S}_p \\cdot \\hat{R}$, where $\\hat{R}$ is the\
    \ unit vector in the IMAS cylindrical $(R, \\phi, Z)$ frame. $S_{p,R}$ represents\
    \ the net force per unit volume on the plasma in the $R$-direction due to external\
    \ actuators, such as neutral beam injection, radio-frequency wave heating, or\
    \ pellet injection. Typical values in fusion devices range from 0.1 to 10 N/m\xB3\
    \ for neutral beam injection and significantly larger values for pellet injection.\
    \ In the edge plasma, the radial momentum source influences the radial electric\
    \ field and impurity transport, while the toroidal component is described by `toroidal_momentum_source`.\
    \ The ion and neutral contributions to radial momentum transport are captured\
    \ by `ion_momentum_flux` and `neutral_momentum_flux`, respectively.\n\nSign convention:\
    \ Positive when the net force on the plasma points in the direction of increasing\
    \ major radius $R$."
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
