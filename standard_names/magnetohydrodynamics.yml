      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim2
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
    enhanced_context:
      description: "Real part of the poloidal component (coordinate2) of the perturbed\
        \ velocity eigenvector (\u1E7D) in linear MHD stability analysis. Together\
        \ with the imaginary part, specifies the complex-valued poloidal velocity\
