- name: coolant_temperature_at_inlet
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the entry point of a cooling loop
    or calorimetry component, used with the outlet temperature and mass flow rate
    to compute deposited thermal power via enthalpy balance.
  documentation: 'The coolant inlet temperature is the absolute temperature of the
    working fluid measured at the inlet port of a cooling circuit, before traversing
    the component and absorbing heat. It establishes the upstream thermal boundary
    condition for thermodynamic analysis of the cooling loop and is a primary input
    to heat load calculations.


    Combined with [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet)
    and the coolant mass flow rate from [coolant_flow](name:coolant_flow), the deposited
    thermal power $P$ is determined by:


    $$

    P = \dot{m} \, c_p \, (T_\mathrm{out} - T_\mathrm{in})

    $$


    where $\dot{m}$ is the mass flow rate in kg s$^{-1}$, $c_p$ is the specific heat
    capacity of the coolant in J kg$^{-1}$ K$^{-1}$, $T_\mathrm{in}$ is the inlet
    temperature, and $T_\mathrm{out}$ is the outlet temperature.


    Measured using calibrated resistance temperature detectors (RTDs) or thermocouples
    mounted at the inlet manifold of the cooling circuit. It applies to calorimetry
    components, cooling loops, and breeding blanket module circuits.


    Typical inlet temperatures in water-cooled tokamak circuits range from 290-330
    K; helium-cooled blanket systems may operate at inlet temperatures up to 550 K
    or higher depending on the thermal design point. The temperature difference $(T_\mathrm{out}
    - T_\mathrm{in})$ is the key diagnostic observable for computing [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port).'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:coolant_flow
  - name:thermal_power_of_plant_component_port
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_inlet
    status: attached
  - id: dd:calorimetry/cooling_loop/temperature_in
    dd_path: calorimetry/cooling_loop/temperature_in
    status: attached
  - id: dd:calorimetry/group/component/temperature_in
    dd_path: calorimetry/group/component/temperature_in
    status: composed
- name: coolant_temperature_at_outlet
  kind: scalar
  status: draft
  description: Absolute temperature of the cooling fluid at the exit port of a cooling
    loop or calorimetry component, serving as the downstream thermal boundary condition
    in calorimetric heat-load assessment.
  documentation: 'The coolant outlet temperature is the absolute thermodynamic temperature
    of the working fluid leaving a cooling-loop channel or calorimetry component.
    Paired with [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and the [coolant mass flow rate](name:coolant_flow), it supplies the thermodynamic
    data needed to close the first-law calorimetric enthalpy balance.


    The deposited thermal power $P_{th}$ is defined by:


    $$

    P_{th} = \dot{m} \, c_p \, (T_{\mathrm{out}} - T_{\mathrm{in}})

    $$


    where $\dot{m}$ is the coolant mass flow rate, $c_p$ is the specific heat capacity
    of the coolant at constant pressure (approximately 4180 J kg$^{-1}$ K$^{-1}$ for
    water), $T_{\mathrm{out}}$ is this outlet temperature, and $T_{\mathrm{in}}$ is
    the [inlet temperature](name:coolant_temperature_at_inlet). The resulting [deposited
    thermal power](name:thermal_power_of_plant_component_port) and [cumulative thermal
    energy](name:thermal_energy_of_plant_component_port) are derived from this relation.


    Outlet temperature is measured by resistance temperature detectors (RTDs) or calibrated
    thermocouples mounted at the component exit manifold. For water-cooled plasma-facing
    and structural components, outlet temperatures range from 300 to 400 K, with temperature
    rises of a few to tens of kelvins depending on the incident heat load.'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_flow
  - name:thermal_power_of_plant_component_port
  - name:thermal_energy_of_plant_component_port
  sources:
