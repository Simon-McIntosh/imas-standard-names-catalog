name: ion_state_energy_source
status: draft
description: Volumetric energy source term for a specific ion charge state, entering
  the energy transport equation for that state.
documentation: "The ion state energy source $S_{E,z}$ (unit $\\mathrm{W\\,m^{-3}}$)\
  \ represents the net rate of energy input per unit volume into a particular ion\
  \ charge state $z$ from all contributing mechanisms \u2014 including ionization\
  \ and recombination heating/cooling, charge-exchange energy transfer, NBI and RF\
  \ power deposition, and radiation losses specific to that state. It appears on the\
  \ right-hand side of the charge-state-resolved energy transport equation $\\frac{3}{2}\\\
  frac{\\partial (n_z T_z)}{\\partial t} + \\nabla \\cdot \\mathbf{q}_z = S_{E,z}$,\
  \ where $n_z$ is the charge-state density ($\\mathrm{m^{-3}}$), $T_z$ the temperature\
  \ (J), and $\\mathbf{q}_z$ the energy flux ($\\mathrm{W\\,m^{-2}}$). Resolving sources\
  \ by charge state is essential for impurity transport modeling (e.g., tungsten,\
  \ neon, argon seeding scenarios) where different ionization stages radiate at vastly\
  \ different rates. Typical magnitudes span $10^2$\u2013$10^6\\,\\mathrm{W\\,m^{-3}}$\
  \ depending on species, charge state, and proximity to the radiating mantle or divertor."
