      - gyrokinetics_local/species
      - gyrokinetics_local/linear/wavevector/eigenmode/time_norm
      - gyrokinetics_local/linear/wavevector/eigenmode/angle_pol
    enhanced_context:
      description: "Normalised perpendicular pressure (p\u22A5) moment of the perturbed\
        \ gyrocenter distribution function in a linear gyrokinetic eigenmode. Represents\
        \ the perpendicular thermal pressure perturbation associated with the eigenmode."
      kind: llm
- name: perpendicular_normalized_particle_perturbed_energy
  kind: scalar
  status: active
  description: Perpendicular normalized particle perturbed energy is the dimensionless
    velocity-space moment of a species' perturbed distribution in a linear gyrokinetic
    eigenmode, weighted by the perpendicular speed squared times the total speed squared
    and normalized to the unperturbed total-speed-squared energy moment of the same
    species.
  documentation: 'Perpendicular normalized particle perturbed energy is the perpendicular
    member of the particle perturbed-energy moment family for a species in a linear
    gyrokinetic eigenmode. Its velocity-space weight is the perpendicular speed squared
    multiplied by the total speed squared, and the reference normalization is the
    corresponding unperturbed total-speed-squared energy moment.


    The quantity is defined as the ratio of the weighted perturbed moment to the unperturbed
    reference moment:


    $$

    M_{\perp E,s} = \frac{\displaystyle\int \tfrac{1}{2} m_s v_\perp^2 v^2\,\delta
    f_s(\mathbf{v})\,d^3v}{\displaystyle\int \tfrac{1}{2} m_s v^2\, v^2\, f_{0,s}(\mathbf{v})\,d^3v}

    $$


    where $m_s$ is the particle mass of species $s$, $v_\perp$ is the particle speed
    perpendicular to the local magnetic-field direction, $v_\parallel$ is the particle
    speed parallel to the local magnetic-field direction, $v^2 = v_\parallel^2 + v_\perp^2$
    is the total particle speed squared, $\delta f_s$ is the perturbed particle distribution
    of the eigenmode, $f_{0,s}$ is the unperturbed (equilibrium) particle distribution,
    and $d^3v$ is the velocity-space volume element. The denominator is the unperturbed
    total-speed-squared energy moment shared by the parent [normalized particle perturbed
    energy](name:normalized_particle_perturbed_energy) and its parallel counterpart,
    so the parallel and perpendicular members are directly comparable.


    This scalar is the perpendicular entry of the [normalized particle perturbed energy](name:normalized_particle_perturbed_energy)
    decomposition and is paired with the [parallel normalized particle perturbed energy]
    evaluated with the same perturbed distribution and normalization. It is distinct
    from the [perpendicular normalized particle perturbed pressure](name:perpendicular_normalized_particle_perturbed_pressure),
    whose weight is the perpendicular speed squared alone: the energy moment retains
    the additional total-speed-squared factor. Because a linear eigenmode carries
    an arbitrary complex amplitude, only comparisons made under the same eigenmode
    amplitude and phase convention are physically meaningful.


    Sign convention: Positive when the velocity-space integral of $\tfrac{1}{2} m_s
    v_\perp^2 v^2\,\delta f_s$ is positive under the chosen eigenmode phase convention.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_particle_perturbed_pressure
  arguments:
  - name: normalized_particle_perturbed_energy
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-moments_norm_particle-v_perpendicular_square_energy
    dd_documentation:
      leaf: Normalised moment (integral over 0.5 * m * v_perp^2 * v^2)
      parent_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle
      parent: Moments (normalised) of the perturbed distribution function of particles
      data_type: CPX_3D
      unit: '1'
      coordinates:
      - gyrokinetics_local/species
      - gyrokinetics_local/linear/wavevector/eigenmode/time_norm
      - gyrokinetics_local/linear/wavevector/eigenmode/angle_pol
    enhanced_context:
      description: "Normalised gyrokinetic moment of the perturbed particle distribution\
        \ corresponding to the integral of 0.5\xB7m\xB7v\u22A5\xB2\xB7v\xB2 over velocity\
        \ space. Related to the perpendicular energy-weighted pressure moment in a\
        \ linear gyrokinetic eigenmode."
      kind: llm
- name: perpendicular_normalized_particle_perturbed_pressure
  kind: scalar
  status: active
  description: Normalized perpendicular pressure-tensor moment of the perturbed particle
    distribution for a linear gyrokinetic eigenmode, representing its perpendicular
    thermal-energy fluctuation relative to a reference pressure.
  documentation: 'The perpendicular normalized particle perturbed pressure is a dimensionless
    complex eigenmode moment of the perturbed particle distribution function. It represents
    the fluctuation of thermal energy associated with random particle motion perpendicular
    to the background magnetic field and is the perpendicular component of the [normalized
    particle perturbed pressure](name:normalized_particle_perturbed_pressure).


    For species $s$, it is defined by the perpendicular second velocity-space moment:


    $$

    \hat{p}_{\perp,s} = \frac{m_s}{2p_\mathrm{ref}} \int v_\perp^2\,\delta f_s\,d^3v

    $$


    where $m_s$ is the species mass, $v_\perp$ is the speed perpendicular to the background
    magnetic field, $\delta f_s$ is the perturbed particle distribution function,
    $d^3v$ is the velocity-space volume element, and $p_\mathrm{ref}$ is a positive
    reference thermal pressure. The perpendicular and [parallel normalized particle
    perturbed pressure](name:parallel_normalized_particle_perturbed_pressure) components
    together describe the gyrotropic pressure perturbation.


    Unlike the [perpendicular normalized gyrocenter perturbed pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure),
    this moment is formed from the physical particle distribution and includes finite-Larmor-radius
    effects associated with the particle-to-gyrocenter transformation.


    Sign convention: Positive when the perpendicular pressure perturbation represents
    a local increase in perpendicular thermal energy relative to the equilibrium background.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
