        alongside conducted and radiated power.
      kind: llm
- name: power_at_wall_due_to_ohmic_dissipation
  kind: scalar
  status: active
  description: Irreversible electrical power converted into heat within conducting
    wall and vessel structures by induced eddy currents and plasma-connected currents
    closed through the wall.
  documentation: 'This quantity is the ohmic-dissipation power deposited within conducting
    wall, plasma-facing, and vessel structures. It is the wall-specific component
    of [power due to ohmic dissipation](name:power_due_to_ohmic_dissipation), resolved
    by the conducting domain in which resistive currents flow.


    The deposited power is defined by


    $$

    P_{\mathrm{wall,ohm}} = \int_{\mathcal{V}_{\mathrm{wall}}} \mathbf{J} \cdot \mathbf{E}_{\mathrm{res}}\,dV

    $$


    where $\mathcal{V}_{\mathrm{wall}}$ is the conducting wall and vessel volume,
    $\mathbf{J}$ is the electrical current density, $\mathbf{E}_{\mathrm{res}}$ is
    the resistive electric field, and $dV$ is the differential volume element.


    The quantity includes Joule heating from induced eddy currents and from plasma-connected
    currents that close through the wall. It is a volume-integrated deposited power,
    distinct from the surface energy flux at the wall and from thermal power subsequently
    removed by coolant circuits; passive resistive media give a nonnegative value.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_ohmic_dissipation
  arguments:
  - name: power_due_to_ohmic_dissipation
    operator: wall
    operator_kind: locus
  sources:
  - dd_path: wall/global_quantities/power_currents
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-power_currents
    dd_documentation:
