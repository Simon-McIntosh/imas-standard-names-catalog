- name: hydrogen_prefill_count
  kind: scalar
  status: active
  description: Hydrogen prefill count is the total amount of neutral hydrogen introduced
    before plasma breakdown, expressed as an equivalent-electron count with one equivalent
    electron per atom.
  documentation: 'Hydrogen prefill count is the total amount of neutral hydrogen (H)
    introduced during the prefill phase before plasma breakdown, expressed as an equivalent-electron
    count. Each neutral hydrogen atom contributes one equivalent electron because
    the atomic number of hydrogen is $Z_{\mathrm{H}}=1$.


    The equivalent-electron count is defined by


    $$

    N_{e,\mathrm{eq}}^{\mathrm{H,prefill}} = Z_{\mathrm{H}}N_{\mathrm{H,prefill}}
    = \int_{t_0}^{t_{\mathrm{bd}}}\dot{N}_{\mathrm{H}}(t)\,dt

    $$


    where $Z_{\mathrm{H}}=1$, $N_{\mathrm{H,prefill}}$ is the accumulated hydrogen-atom
    count, $\dot{N}_{\mathrm{H}}$ is the hydrogen-atom injection rate, $t_0$ is the
    prefill start time, and $t_{\mathrm{bd}}$ is the plasma-breakdown time.


    This quantity includes only hydrogen introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and retained
    or ionized inventory. It is the hydrogen component of [prefill_count](name:prefill_count);
    [accumulated_hydrogen_prefill_count](name:accumulated_hydrogen_prefill_count)
    is the accumulated gas-injection specialization of this quantity, distinct from
    isotope-specific prefill counts such as [deuterium_prefill_count](name:deuterium_prefill_count).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_hydrogen_prefill_count
  - name:prefill_count
  arguments:
  - name: prefill_count
    operator: hydrogen
    operator_kind: qualifier
- name: accumulated_hydrogen_prefill_count
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of hydrogen atoms introduced
    by gas injection during prefill before plasma breakdown; hydrogen contributes
    one count per atom.
  documentation: 'The quantity is the cumulative hydrogen atom inventory delivered
    by gas injection during the prefill interval ending at plasma breakdown, expressed
    using the equivalent-electron convention. It is the hydrogen-specific contribution
    to the [hydrogen prefill count](name:hydrogen_prefill_count).


    $$

    N_{\mathrm{H,eq}} = Z_{\mathrm{H}}N_{\mathrm{H}} = N_{\mathrm{H}}, \qquad N_{\mathrm{H}}
    = \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{H}}(t)\,dt

    $$


    Here $N_{\mathrm{H,eq}}$ and $N_{\mathrm{H}}$ are dimensionless equivalent-electron
    and atom counts, $Z_{\mathrm{H}}=1$ is hydrogen''s atomic number, $\dot{N}_{\mathrm{H}}$
    is the hydrogen injection rate in s$^{-1}$, and $t_0$ and $t_{\mathrm{bd}}$ are
    the prefill start and breakdown times in s. Only pre-breakdown gas injection is
    included; post-breakdown delivery is represented by [accumulated hydrogen count
    due to gas injection](name:accumulated_hydrogen_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
