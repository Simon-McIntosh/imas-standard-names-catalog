- name: incident_neutral_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Incident number flux density of neutral recombination products arriving
    at a plasma-facing wall, summed over neutral species and internal states.
  documentation: 'This quantity is the incoming neutral-particle count flux at a wall
    attributable to recombination, with neutral product species and internal states
    aggregated. It selects particles arriving at the surface, rather than neutral
    particles emitted from it.


    The incident flux density is defined from the recombination-attributed neutral
    distribution by


    $$

    \Gamma_{\mathrm{inc}}^{\mathrm{rec}}(\mathbf{x}_w)=\int_{\mathbf{v}\cdot\hat{\mathbf{n}}<0}
    \left|\mathbf{v}\cdot\hat{\mathbf{n}}\right| f_{\mathrm{n,rec}}(\mathbf{x}_w,\mathbf{v})\,d^3\mathbf{v}

    $$


    where $\mathbf{x}_w$ is the wall position, $\hat{\mathbf{n}}$ is the outward wall
    normal, $\mathbf{v}$ is neutral-particle velocity, and $f_{\mathrm{n,rec}}$ is
    the recombination-attributed neutral distribution summed over species and internal
    states.


    This incident quantity is distinct from the outgoing emission described by [neutral
    particle flux at the wall due to recombination](name:neutral_particle_flux_at_wall_due_to_recombination).
    A state-resolved counterpart, [incident neutral internal-state particle flux at
    the wall due to recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination),
    retains the internal-state distinction.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination
  arguments:
  - name: neutral_particle_flux_at_wall_due_to_recombination
    operator: incident
    operator_kind: qualifier
- name: radial_total_current_density_at_wall
  kind: scalar
  status: active
  description: "Radial (R-direction) component of the total electric current-density\
    \ vector at a plasma-facing wall in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame, where R is major radius and Z is vertical height. It is signed positive\
    \ toward increasing R."
  documentation: 'Radial (R-direction) component of the total electric current-density
    vector at a plasma-facing wall is the projection of the local total electric current-density
    vector onto the $\hat{R}$ basis direction of the right-handed cylindrical $(R,\phi,Z)$
    frame. Here $R$ is major radius measured from the toroidal symmetry axis, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    The defining projection at a wall point $\mathbf{x}_w$ is:


    $$

    j_{R,\mathrm{tot}}^{\mathrm{wall}}(\mathbf{x}_w) = \mathbf{j}_{\mathrm{tot}}(\mathbf{x}_w)
    \cdot \hat{\mathbf{R}}(\mathbf{x}_w)

    $$


    where $j_{R,\mathrm{tot}}^{\mathrm{wall}}$ denotes this scalar quantity, $\mathbf{j}_{\mathrm{tot}}$
    is the total [current_density](name:current_density), $\hat{\mathbf{R}}$ is the
    local unit vector toward increasing $R$, and $\mathbf{x}_w$ lies on the plasma-facing
    material wall.


    Total means all current-carrying contributions included in the physical current-density
    vector, such as inductive, neoclassical, wave-driven, kinetic, conductive, charged-particle,
    and sheath-mediated currents. This quantity is the wall-evaluated radial projection
    of the total vector, not a process-resolved contribution such as [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction).
    A tile current such as [current_of_divertor_tile](name:current_of_divertor_tile)
    is a surface integral of the current-density component normal to that tile; it
    equals an area integral of this radial component only where the tile normal is
    parallel to $\hat{R}$.


    Sign convention: Positive when $\mathbf{j}_{\mathrm{tot}}$ at the wall points
    in the direction of increasing major radius $R$.'
  unit: A.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:radial_current_density_due_to_ion_neutral_friction
  sources:
  - dd_path: wall/description_ggd/ggd/j_total/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-j_total-r
    dd_documentation:
