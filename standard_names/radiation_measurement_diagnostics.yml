- name: ratio_of_tritium_density_to_deuterium_density
  kind: scalar
  status: draft
  description: Ratio of local tritium ion number density to local deuterium ion number
    density in a deuterium-tritium plasma. It quantifies the isotopic fuel mix independently
    of the total ion density.
  documentation: 'The ratio of tritium density to deuterium density is a dimensionless
    measure of the local deuterium-tritium fuel composition. It compares the number
    density of tritium ions with the number density of deuterium ions at the same
    location and time, and is defined only where the deuterium density is nonzero.


    The ratio is defined by:


    $$

    r_{T/D} = \frac{n_T}{n_D}

    $$


    where $r_{T/D}$ has unit 1, $n_T$ is the tritium ion number density in $m^{-3}$,
    and $n_D$ is the deuterium ion number density in $m^{-3}$. Values greater than
    1 indicate tritium-rich fuel, values less than 1 indicate deuterium-rich fuel,
    and $r_{T/D}=1$ corresponds to equal tritium and deuterium ion densities.


    In practice this ratio may be inferred from isotope-resolved particle measurements,
    charge-exchange or neutral-particle diagnostics, or from fusion-product and neutron-emission
    analysis combined with plasma composition and temperature information. Neutron
    emission alone primarily constrains the product $n_D n_T$ weighted by the fusion
    reactivity, so determining $n_T/n_D$ requires additional assumptions or independent
    constraints on the ion densities, ion temperature, fast-ion contribution, and
    diagnostic calibration.


    Typical core deuterium-tritium operation aims for near-equimolar fuel, with $r_{T/D}$
    often in the range 0.5-2. Larger or smaller values can occur during isotope-ratio
    control transients, fueling asymmetries, burnup, or experiments deliberately biased
    toward deuterium-rich or tritium-rich mixtures.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:deuterium_deuterium_neutron_emissivity_due_to_fusion
