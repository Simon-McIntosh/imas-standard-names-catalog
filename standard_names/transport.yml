- name: co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion
  kind: scalar
  status: draft
  description: Volumetric power density received by the co-passing fast particle population
    from bulk ions via Coulomb collisions, quantifying the aggregate ion-to-fast-particle
    energy exchange rate for the co-passing orbit-class fraction of the non-thermal
    distribution.
  documentation: "This quantity gives the collisional power density $P_{\\rm coll}$\
    \ (in $\\mathrm{W\\,m^{-3}}$) exchanged between the bulk ion population (all charge\
    \ states summed) and the co-passing subset of the fast (suprathermal) particle\
    \ distribution through binary Coulomb collisions. Co-passing fast particles are\
    \ those whose guiding-center motion circulates toroidally in the same direction\
    \ as the net plasma current, tracing untrapped orbits that encircle the torus\
    \ poloidally. The exchange rate is governed by the Fokker\u2013Planck collision\
    \ operator $C(f_{\\rm fast}, f_{\\rm ion})$, where the power density is $P_{\\\
    rm coll} = \\int m_f v^2 / 2 \\, C(f_{\\rm fast}, f_{\\rm ion})\\, d^3v$, with\
    \ $m_f$ the fast-particle mass and $v$ the particle speed. Positive values indicate\
    \ net energy transfer from bulk ions to the co-passing fast particles; negative\
    \ values indicate net fast-particle slowing-down energy deposited into the ions.\
    \ This quantity is computed by fast-particle Monte Carlo or Fokker\u2013Planck\
    \ codes (e.g. TRANSP, ASCOT, ICRH/NBI Fokker\u2013Planck solvers) that resolve\
    \ the orbit-class decomposition of the distribution function. Typical magnitudes\
    \ in neutral-beam or ICRH-heated tokamak discharges range from $10^4$ to $10^7\\\
    ,\\mathrm{W\\,m^{-3}}$ in the plasma core, depending on fast-particle density\
    \ and bulk ion temperature. The aggregate-ion counterpart for the counter-passing\
    \ orbit class is [counter_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion](name:counter_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion).\
    \ When charge-state resolution is required, the companion quantity [co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion_state](name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion_state)\
    \ resolves the same exchange at the level of individual ionic charge states. The\
    \ electron-channel analog is [co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons](name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons).\
    \ Summing over co-passing, counter-passing, and trapped orbit classes recovers\
    \ the total [fast_particle_collisional_power_density_to_thermal_ion](name:fast_particle_collisional_power_density_to_thermal_ion)."
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion
  - name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion_state
  - name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons
  - name:fast_particle_collisional_power_density_to_thermal_ion
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_2d/co_passing/collisions/ion/power_fast
    dd_path: distributions/distribution/profiles_2d/co_passing/collisions/ion/power_fast
    status: composed
- name: co_passing_fast_particle_collisional_power_density_to_thermal_ion
  kind: scalar
  status: draft
  description: Volumetric power density transferred from co-passing fast particles
    to bulk thermal ions via Coulomb collisions. One of three orbit-class contributions
    (co-passing, counter-passing, trapped) to the total fast-particle-to-ion collisional
    heating source.
  documentation: "This quantity is the collisional power density delivered to the\
    \ bulk thermal ion population by the co-passing orbit-class subset of the fast-particle\
    \ distribution. It is one of three orbit-class components \u2014 co-passing, counter-passing,\
    \ and trapped \u2014 that together constitute the total fast-particle-to-thermal-ion\
    \ heating source term in the ion energy balance equation.\n\nPhysical definition:\
    \ the power per unit volume transferred from co-passing fast particles to thermal\
    \ ions through Coulomb friction and diffusion. For a species $s$ of fast ions\
    \ with distribution function $f_{\\mathrm{co}}(\\mathbf{v})$ normalized such that\
    \ $\\int f_{\\mathrm{co}}\\,d^3v$ gives the co-passing fast-ion number density\
    \ (m$^{-3}$), the quantity is\n$$P_{\\mathrm{co}}^{\\mathrm{th\\,ion}} = \\int\
    \ \\nu_{\\mathrm{si}}(v)\\,E_k\\,\\mathcal{T}_{i}\\{f_{\\mathrm{co}}\\}\\,d^3v\
    \ \\quad [\\mathrm{W\\,m^{-3}}]$$\nwhere $\\nu_{\\mathrm{si}}(v)$ is the velocity-dependent\
    \ slowing-down frequency on thermal ions, $E_k = \\tfrac{1}{2}m_s v^2$ is the\
    \ fast-particle kinetic energy, and $\\mathcal{T}_{i}\\{f_{\\mathrm{co}}\\}$ is\
    \ the ion-channel Fokker\u2013Planck collision operator acting on $f_{\\mathrm{co}}$,\
    \ which distributes the transferred energy exclusively to the thermal ion population.\
    \ The integral is restricted to the co-passing velocity-space domain ($v_\\parallel\
    \ > 0$, $|v_\\parallel/v| > \\lambda_{\\mathrm{T/P}}$, where $\\lambda_{\\mathrm{T/P}}$\
    \ is the trapped\u2013passing boundary).\n\nTypical values in neutral-beam-heated\
    \ tokamak plasmas range from $10^3$ to $10^6$ W m$^{-3}$, depending on fast-ion\
    \ density, beam energy, and plasma temperature.\n\nSign convention: Positive when\
    \ energy flows from the co-passing fast particles to the thermal ion population,\
    \ corresponding to net heating of the ions.\n\nIn the IMAS data dictionary this\
    \ quantity is stored under `distributions/distribution/profiles_1d/co_passing/collisions/ion/power_thermal`\
    \ (IDS: distributions, unit: W m$^{-3}$). The full thermal-ion heating source\
    \ is recovered by summing the co-passing, counter-passing, and trapped contributions\
    \ over all fast-particle species."
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_fast_particle_collisional_power_density_to_thermal_ion
  - name:trapped_fast_particle_collisional_power_density_to_thermal_ion
  - name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/collisions/ion/power_thermal
    dd_path: distributions/distribution/profiles_1d/co_passing/collisions/ion/power_thermal
    status: composed
- name: co_passing_particle_density
  kind: scalar
  status: draft
  description: Total particle number density (thermal plus non-thermal) of the co-passing
    population, comprising particles whose guiding-center orbits circulate toroidally
    in the same direction as the net plasma current. Distinct from the trapped and
    counter-passing populations that together make up the total particle density.
  documentation: 'The co-passing particle density $n_\mathrm{co}$ is the number density
    of particles whose guiding-center motion executes complete toroidal transits in
    the co-current direction, i.e., in the direction of increasing toroidal angle
    $\phi$ when the plasma current $I_p$ is positive (flowing in the $+\hat{\phi}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame). Classification
    as co-passing versus counter-passing depends on the sign of the parallel velocity
    projected onto the local magnetic field direction weighted by the direction of
    the net toroidal current, and not merely on the sign of the local $v_\parallel$:
    a particle is co-passing if its orbit-averaged toroidal angular velocity shares
    the sign of $I_p$.


    The density is computed as the zeroth moment of the co-passing part of the distribution
    function $f_\mathrm{co}(\mathbf{r}, v_\parallel, v_\perp)$ over velocity space:

    $$n_\mathrm{co}(R,Z) = \int_{v_\parallel / v > v_{\parallel,\mathrm{trap}}(R,Z)}
    f_\mathrm{co}\, 2\pi v_\perp\, dv_\perp\, dv_\parallel$$

    where the lower limit on $v_\parallel$ is set by the trapping condition at the
    local flux surface. Both thermal and non-thermal (suprathermal, beam-injected,
    and fast) particles contribute.


    Typical values in a tokamak core range from $10^{17}$ to $10^{20}\,\mathrm{m}^{-3}$
    depending on species, plasma current, and heating scenario. In nearly axisymmetric
    plasmas with a symmetric distribution function the co- and counter-passing densities
    are nearly equal; asymmetric heating (e.g., co-directed neutral beam injection)
    or current drive creates a net imbalance.


    This quantity is stored in the IMAS `distributions` IDS at the path `distributions/distribution/profiles_2d/co_passing/density`
    (unit: m$^{-3}$), where the `co_passing` node distinguishes this population from
    the `counter_passing` and `trapped` sub-populations. The total particle density
    is the sum of co-passing, counter-passing, and trapped densities integrated over
    the full distribution.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:counter_passing_particle_density
  - name:trapped_particle_density
  - name:co_passing_particle_pressure
  - name:co_passing_fast_particle_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_2d/co_passing/density
    dd_path: distributions/distribution/profiles_2d/co_passing/density
    status: composed
- name: counter_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion
  kind: scalar
  status: draft
  description: Volumetric power density received by the counter-passing fast particle
    population from bulk ions via Coulomb collisions. Positive values indicate net
    energy transfer from ions to the counter-passing fast particles. This scalar represents
    the collisional energy exchange rate per unit volume for the counter-passing orbit
    class.
  documentation: 'The quantity $P_{\rm cp,fast\leftarrow ion}$ is the net collisional
    power density received by the counter-passing fast particle population from the
    bulk ion species through Coulomb collisions, integrated over the counter-passing
    velocity-space domain and over all contributing ion species:


    $$P_{\rm cp,fast\leftarrow ion} = \int_{\rm cp} C[f_{\rm fast}, f_i]\, E\, d^3v$$


    where $C[f_{\rm fast}, f_i]$ is the Coulomb collision operator coupling the fast
    particle distribution $f_{\rm fast}$ to the bulk ion distribution $f_i$, and $E$
    is the particle kinetic energy.


    The counter-passing orbit class consists of fast particles whose parallel velocity
    component is directed opposite to the toroidal magnetic field direction (i.e.,
    in the $-\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame).


    Sign convention: Positive when net energy flows from the bulk ions into the counter-passing
    fast particle population (ions lose energy, fast particles gain energy).


    Typical values range from $10^3$ to $10^7\ \mathrm{W\,m^{-3}}$ in high-power heating
    scenarios (NBI, ICRF), and may be negative when the fast particles are slowing
    down and transferring energy back to the thermal ions.


    This quantity is stored in the IMAS data dictionary at `distributions/distribution/profiles_1d/counter_passing/collisions/ion/power_fast`
    and `distributions/distribution/profiles_2d/counter_passing/collisions/ion/power_fast`,
    under the `distributions` IDS.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:co_passing_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion
  - name:trapped_fast_particle_collisional_power_density_transferred_to_thermal_ions
  - name:counter_passing_fast_particle_density
  - name:fast_particle_collisional_power_density_to_thermal_ion
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/collisions/ion/power_fast
    dd_path: distributions/distribution/profiles_1d/counter_passing/collisions/ion/power_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/counter_passing/collisions/ion/power_fast
