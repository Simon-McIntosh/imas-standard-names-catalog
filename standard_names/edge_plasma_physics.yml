- name: radial_velocity_due_to_convection
  kind: scalar
  status: draft
  description: Radial component of the convective velocity for momentum transport
    in the edge plasma. This scalar describes the advective radial motion carrying
    momentum in the scrape-off layer and pedestal, distinct from diffusive or diamagnetic
    contributions. Positive when directed outward in major radius R (away from the
    magnetic axis).
  documentation: "The radial velocity due to convection represents the radial component\
    \ $v_r^{\\text{conv}}$ of the effective convection velocity in the momentum transport\
    \ equation. It governs the advective radial transport of momentum in the scrape-off\
    \ layer and pedestal, typically derived from gyro-fluid or reduced-MHD edge models.\
    \ In the radial force balance, this velocity appears alongside diffusive and diamagnetic\
    \ contributions.\n\nThe radial convection velocity is often obtained from edge\
    \ transport simulations (e.g., SOLPS, EMC3-EIRENE) or reduced models parameterizing\
    \ turbulent pinch effects. Typical magnitudes range from 1\u2013100 m/s in the\
    \ confined edge to several hundred m/s in the far scrape-off layer, depending\
    \ on the plasma collisionality and fluctuation-driven transport.\n\nSign convention:\
    \ Positive when directed outward in major radius $R$ (away from the magnetic axis).\n\
    \nSee also the parent vector quantity [velocity_due_to_convection](name:velocity_due_to_convection)\
    \ for the full vector, [radial_convection_velocity](name:radial_convection_velocity)\
    \ for mass transport, and the charge-state-resolved counterparts [radial_ion_convection_velocity](name:radial_ion_convection_velocity)\
    \ and [radial_ion_state_momentum_velocity](name:radial_ion_state_momentum_velocity)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
