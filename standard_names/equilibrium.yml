- name: vertical_coordinate_of_primary_x_point
  kind: scalar
  status: active
  description: "Signed vertical position of the primary magnetic X-point, the poloidal-field\
    \ null where separatrix branches meet, in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: "The primary X-point is the main poloidal magnetic-field null on\
    \ the plasma boundary, where separatrix branches meet. This quantity gives that\
    \ point\u2019s vertical coordinate in the right-handed cylindrical $(R,\\phi,Z)$\
    \ frame.\n\n$$\nZ_{\\mathrm{X,primary}} = \\mathbf{r}_{\\mathrm{X,primary}} \\\
    cdot \\hat{\\mathbf{Z}}\n$$\n\nHere, $Z_{\\mathrm{X,primary}}$ is the vertical\
    \ coordinate of the primary X-point, $\\mathbf{r}_{\\mathrm{X,primary}}$ is its\
    \ position vector relative to the coordinate origin, and $\\hat{\\mathbf{Z}}$\
    \ is the vertical unit vector of the cylindrical frame.\n\nThe locus is specifically\
    \ the primary, or main, boundary X-point rather than an unspecified or secondary\
    \ X-point. This is a pointwise geometric coordinate with no spatial averaging,\
    \ surface integration, population aggregation, or species dependence; it excludes\
    \ the radial coordinate of the same point.\n\nThe generic [vertical coordinate\
    \ of an X-point](name:vertical_coordinate_of_x_point) represents the same signed\
    \ Z coordinate without restricting the locus to the primary X-point, while the\
    \ [radial coordinate of an X-point](name:radial_coordinate_of_x_point) supplies\
    \ the corresponding major-radius coordinate.\n\nSign convention: Positive when\
    \ the primary X-point lies in the direction of increasing vertical coordinate\
    \ $Z$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_x_point
  sources:
  - dd_path: summary/boundary/x_point_main/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-boundary-x_point_main-z
    dd_documentation:
      leaf: Height
      parent_path: summary/boundary/x_point_main
      parent: RZ position of the main X-point
      data_type: FLT_1D
      unit: m
      coordinates:
      - summary/time
    enhanced_context:
      description: Vertical (Z) coordinate of x point main.
      kind: template
- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: active
  description: "Signed vertical (Z) coordinate of the inner divertor strike point,\
    \ where the inner separatrix leg intersects the divertor target in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical coordinate of the inner divertor strike point is the\
    \ signed Z location where the inner leg of the plasma separatrix intersects the\
    \ divertor target. It identifies a boundary contact point in the poloidal geometry,\
    \ rather than the magnetic null.\n\nThis quantity applies specifically to the\
    \ inner strike point and represents one geometric coordinate value; it is not\
    \ an average over strike points, a target-surface extent, or a toroidal aggregation.\
    \ It is distinct from the corresponding outer strike-point location, which describes\
    \ the outer separatrix leg.\n\nTogether with the [major-radius coordinate of a\
    \ magnetic strike point](name:radial_coordinate_of_strike_point), this coordinate\
    \ locates the same strike point in the poloidal cross-section of the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame. It must not be interpreted as the [vertical\
    \ coordinate of an X-point](name:vertical_coordinate_of_x_point), because an X-point\
    \ is a magnetic null rather than a separatrix\u2013target intersection."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_strike_point
  sources:
  - dd_path: equilibrium/time_slice/constraints/strike_point/position_measured/z
