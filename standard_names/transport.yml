    dd_path: summary/line_average/dn_e_dt/value
    status: composed
- name: toroidal_center_of_mass_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the bulk plasma center-of-mass fluid velocity,
    weighted by species mass.
  documentation: 'The toroidal center-of-mass velocity quantifies the net rotation
    of the bulk plasma in the direction of increasing toroidal angle $\phi$, averaged
    over all species present. In tokamaks this rotation is the dominant component,
    typically reaching $10\!-\!100$ km/s in the core, and is driven by neutral beam
    injection, the intrinsic plasma torque, and turbulent momentum transport. It is
    routinely measured via charge-exchange recombination spectroscopy (CXRS) on impurity
    ions, or inferred from motional Stark effect diagnostics, and enters the radial
    force balance $E_r = v_\phi B_\theta - v_\theta B_\phi + (1/Z_i e n_i) \nabla
    p_i$. This component is distinguished from the total rotation vector `[center_of_mass_velocity](name:center_of_mass_velocity)`
    by isolating only the toroidal projection; the poloidal counterpart is `[poloidal_center_of_mass_velocity](name:poloidal_center_of_mass_velocity)`.


    Sign convention: Positive when the bulk plasma rotates in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:center_of_mass_velocity
  - name:poloidal_center_of_mass_velocity
  arguments:
  - name: center_of_mass_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/velocity_mass_centre/toroidal
    dd_path: plasma_profiles/ggd/velocity_mass_centre/toroidal
    status: composed
- name: toroidal_helium_3_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal flow velocity of helium-3 ions at the radius of the internal
    transport barrier.
  documentation: "The toroidal velocity $v_{\\phi,\\mathrm{^3He}}$ of the helium-3\
    \ ion population at the internal transport barrier (ITB) characterizes the toroidal\
    \ rotation of this minority species at the narrow radial layer where turbulent\
    \ transport is sharply reduced. The ITB position is identified by a steep gradient\
    \ region in the ion temperature or toroidal rotation profiles. This velocity is\
    \ typically measured from the Doppler shift of charge-exchange recombination spectroscopy\
    \ (CXRS) lines on the 529\u202Fnm $\\mathrm{^3He^{2+}}$ transition, or inferred\
    \ from the main-ion toroidal velocity via neoclassical theory. Typical values\
    \ in ITB plasmas range from 20 to 150 km/s, with direction determined by the balance\
    \ of neutral beam torque and intrinsic rotation. The sign convention follows the\
    \ IMAS cylindrical $(R,\\phi,Z)$ frame.\n\nSign convention: Positive when $v_\\\
    phi$ points in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ when viewed from above).\n\nSee also [toroidal_helium_3_velocity_at_magnetic_axis](name:toroidal_helium_3_velocity_at_magnetic_axis)\
    \ and [toroidal_helium_3_velocity_at_pedestal](name:toroidal_helium_3_velocity_at_pedestal)\
    \ for the same species at other radial positions."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_pedestal
  sources:
  - id: dd:summary/local/itb/velocity_phi/helium_3/value
    dd_path: summary/local/itb/velocity_phi/helium_3/value
    status: composed
- name: toroidal_helium_3_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal flow velocity of the helium-3 ion population at the magnetic
    axis.
  documentation: "The toroidal velocity $v_{\\phi, \\text{He}^3}$ of the helium-3\
    \ ion species at the magnetic axis captures the bulk rotation of the minority\
    \ helium-3 population in the direction of the toroidal angle $\\phi$. This rotation\
    \ results from the combined effects of momentum transport, neutral beam injection,\
    \ and intrinsic rotation sources, and is a key input for modeling fast-particle\
    \ confinement and Alfv\xE9n eigenmode stability. The velocity is typically measured\
    \ via charge exchange recombination spectroscopy (CXRS) on the helium-3 emission\
    \ line, providing line-of-sight integrated signals that are inverted to local\
    \ values. Core toroidal rotation velocities in tokamaks range from a few km/s\
    \ in ohmic plasmas to over 300 km/s in strongly beam-heated H-modes. The helium-3\
    \ rotation often differs from the bulk deuterium rotation due to differences in\
    \ collisional coupling and diamagnetic contributions, making this a valuable constraint\
    \ for multi-species transport analysis. Related quantities include [toroidal_helium_3_velocity_at_pedestal](name:toroidal_helium_3_velocity_at_pedestal)\
    \ and [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis).\n\
    \nSign convention: Positive when the helium-3 ions rotate in the direction of\
    \ increasing toroidal angle $\\phi$ (counter-clockwise viewed from above)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_helium_3_velocity_at_pedestal
  - name:helium_3_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/velocity_phi/helium_3/value
    dd_path: summary/local/magnetic_axis/velocity_phi/helium_3/value
    status: composed
- name: toroidal_neon_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal component of the neon ion fluid rotation velocity at the radial
    location of the internal transport barrier.
  documentation: "The toroidal rotation velocity $v_{\\phi,\\mathrm{Ne}}$ of the neon\
    \ ion population at the internal transport barrier (ITB) quantifies the toroidal\
    \ flow of this impurity species. The ITB is a plasma region characterized by a\
    \ steep gradient in the toroidal rotation profile, often correlated with reduced\
    \ turbulent transport and improved confinement. This quantity is routinely measured\
    \ by charge exchange recombination spectroscopy (CXRS) using the Doppler shift\
    \ of neon emission lines, with typical values in the range 10\u2013100 km/s for\
    \ the core ITB in H-mode tokamak plasmas. The toroidal velocity of neon is closely\
    \ related to the bulk ion rotation and can differ from the main ion velocity due\
    \ to impurity poloidal asymmetries and neoclassical effects \u2014 see [toroidal_helium_3_velocity_at_internal_transport_barrier](name:toroidal_helium_3_velocity_at_internal_transport_barrier)\
    \ and [toroidal_neon_velocity_at_pedestal](name:toroidal_neon_velocity_at_pedestal)\
    \ for comparisons at other radial locations and ion species.\n\nSign convention:\
    \ Positive when the toroidal velocity points in the direction of increasing toroidal\
    \ angle $\\phi$ (counter-clockwise when viewed from above the machine)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_helium_3_velocity_at_internal_transport_barrier
  - name:toroidal_neon_velocity_at_pedestal
  sources:
  - id: dd:summary/local/itb/velocity_phi/neon/value
    dd_path: summary/local/itb/velocity_phi/neon/value
    status: composed
- name: toroidal_neon_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal rotation velocity of neon impurity ions at the magnetic axis.
  documentation: 'The toroidal component $v_{\phi,\mathrm{Ne}}$ of the neon ion fluid
    velocity at the magnetic axis, defined as the $\hat{\phi}$ projection of the local
    flow vector. This quantity is a key measure of the central rotation of intrinsic
    or injected neon impurities, typically measured by charge exchange recombination
    spectroscopy (CXRS) via Doppler shifts of visible transitions from the Ne$^{10+}$
    or He-like charge states. Core neon rotation velocities in conventional tokamaks
    range from $10^5$ to over $10^6$ m/s depending on the neutral beam torque input
    and the collisional coupling between neon and the bulk deuterium. The value at
    the magnetic axis is often the peak rotation velocity, linking to studies of neoclassical
    impurity transport and radial electric field estimates via the force balance equation.
    See also the radial profile provided by [toroidal_neon_velocity_at_pedestal](name:toroidal_neon_velocity_at_pedestal)
    and the analogous quantity for another impurity species, [toroidal_helium_3_velocity_at_magnetic_axis](name:toroidal_helium_3_velocity_at_magnetic_axis).


    Sign convention: Positive when the toroidal flow is directed in the increasing
    $\phi$ direction (counter-clockwise viewed from above).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_neon_velocity_at_pedestal
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/velocity_phi/neon/value
    dd_path: summary/local/magnetic_axis/velocity_phi/neon/value
    status: composed
- name: toroidal_neutral_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: The toroidal component of the momentum diffusion coefficient for neutral
    particles, characterizing the rate of diffusive transport of toroidal angular
    momentum by neutral atoms and molecules across the plasma edge.
  documentation: The toroidal neutral momentum diffusion coefficient $D^{\mathrm{tor},\mathrm{neut}}$
    enters the momentum balance equation for neutral particles, $\partial_t (m_n n_n
    v^{\mathrm{tor}}_n) + \nabla \cdot \boldsymbol{\Gamma}^{\mathrm{tor}}_{\mathrm{neut}}
    = S^{\mathrm{tor}}_{\mathrm{neut}}$, where $\boldsymbol{\Gamma}^{\mathrm{tor}}_{\mathrm{neut}}
    = -D^{\mathrm{tor},\mathrm{neut}} \nabla (m_n n_n v^{\mathrm{tor}}_n)$, with $m_n$
    the neutral mass, $n_n$ the neutral density, and $v^{\mathrm{tor}}_n$ the toroidal
    neutral fluid velocity. This quantity reflects the impact of charge-exchange and
    elastic scattering collisions on neutrals that carry momentum from the core toward
    the wall. It is analogous to the toroidal ion momentum diffusion coefficient $D_{\mathrm{ion}}^{\mathrm{tor}}$,
    but accounts for the longer mean free path and weaker magnetic coupling of neutrals.
    While the radial component (`[radial_neutral_momentum_diffusion_coefficient](name:radial_neutral_momentum_diffusion_coefficient)`)
    governs the loss of angular momentum across flux surfaces, the toroidal component
    captures the diffusive redistribution of toroidal momentum within a flux surface
    by neutrals. Typical values in the scrape-off layer range from $1\, \mathrm{m}^2/\mathrm{s}$
    to $100\, \mathrm{m}^2/\mathrm{s}$, depending on neutral density and collisionality.
    This quantity is related to the full vector coefficient `[neutral_momentum_diffusion_coefficient](name:neutral_momentum_diffusion_coefficient)`
    and to its radial counterpart `[toroidal_momentum_diffusion_coefficient](name:toroidal_momentum_diffusion_coefficient)`.
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_neutral_momentum_diffusion_coefficient
  - name:neutral_momentum_diffusion_coefficient
  - name:toroidal_momentum_diffusion_coefficient
  arguments:
  - name: neutral_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/momentum/d/toroidal
    dd_path: edge_transport/model/ggd/neutral/momentum/d/toroidal
    status: composed
  - id: dd:plasma_transport/model/ggd/neutral/state/momentum/d/toroidal
    dd_path: plasma_transport/model/ggd/neutral/state/momentum/d/toroidal
    status: composed
- name: toroidal_neutral_state_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the flow velocity for neutral particles in a
    specific quantum state, resolved relative to the geometric toroidal direction.
  documentation: 'The toroidal component $v_{\phi}^{\mathrm{neutral,state}}$ represents
    the velocity of neutral particles (e.g., ground-state or excited-state hydrogen,
    deuterium) along the toroidal direction $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. This quantity is used in neutral particle transport models
    to assess momentum exchange through charge-exchange and ionization processes.
    Typical magnitudes range from $10^3$ to $10^5$ m/s in tokamak edge and divertor
    regions, depending on the neutral density and plasma flow.


    Sign convention: Positive when the velocity points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: transport
  links:
