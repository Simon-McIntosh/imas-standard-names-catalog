name: electron_particle_flux_from_wall
status: draft
cocos_transformation_type: one_like
description: Total rate of electron-equivalent particles released from the wall into
  the plasma, summed over cold, thermal, and fast neutral conversion channels.
documentation: "The electron particle flux from the wall $\\Gamma_{e,\\mathrm{wall}}$\
  \ (in s$^{-1}$) represents the global rate at which wall-released species contribute\
  \ electron-equivalent particles back to the plasma. This includes contributions\
  \ from recycled neutrals that are ionized near the wall, secondary electron emission,\
  \ and photo-electron release. The source is typically decomposed into cold ($\\\
  lesssim 1$ eV), thermal ($\\sim$ wall temperature), and fast ($\\gtrsim 10$ eV)\
  \ components, each following different velocity distributions. In tokamak discharges,\
  \ $\\Gamma_{e,\\mathrm{wall}}$ is of order $10^{20}$\u2013$10^{22}$ s$^{-1}$ depending\
  \ on plasma density and wall conditioning. It is inferred from global particle-balance\
  \ analysis combining interferometric line-integrated density measurements with gas-puff\
  \ calibration and pumping-speed data. The quantity is important for density control\
  \ and wall-inventory tracking. See `neutral_particle_flux_from_wall` for the neutral\
  \ counterpart and `neutral_gas_puff_rate` for the externally controlled fueling\
  \ term."
