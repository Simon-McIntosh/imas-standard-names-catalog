- name: radial_coordinate_of_flux_loop
  kind: scalar
  status: active
  description: "Radial coordinate of a flux loop is the major-radius coordinate of\
    \ the flux-loop center in the right-handed cylindrical (R, \u03C6, Z) frame, equal\
    \ to its non-negative perpendicular distance from the toroidal symmetry axis."
  documentation: 'Radial coordinate of a flux loop is the major-radius coordinate
    of the flux-loop center in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It is the non-negative perpendicular distance of the loop center from the toroidal
    symmetry axis.


    For a flux-loop center with Cartesian coordinates in a right-handed Cartesian
    basis $(\hat{x}, \hat{y}, \hat{z})$ with $\hat{z}=\hat{Z}$ and origin on the toroidal
    symmetry axis, the radial coordinate is


    $$

    R_\mathrm{loop} = \sqrt{x_\mathrm{loop}^2 + y_\mathrm{loop}^2}

    $$


    where $R_\mathrm{loop}$ is the radial coordinate of the flux-loop center, and
    $x_\mathrm{loop}$ and $y_\mathrm{loop}$ are its transverse Cartesian coordinates.


    This coordinate is distinct from [vertical_coordinate_of_flux_loop](name:vertical_coordinate_of_flux_loop)
    and toroidal_angle_of_flux_loop. It locates the loop center associated with flux-loop
    electromagnetic quantities, but does not denote the magnetic flux, terminal voltage,
    effective sensing area, or local orientation of the loop.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:vertical_coordinate_of_flux_loop
  sources:
  - dd_path: magnetics/flux_loop/position/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-flux_loop-position-r
    dd_documentation:
      leaf: Major radius
      parent_path: magnetics/flux_loop/position
      parent: List of (R,Z,phi) points defining the position of the loop (see data
        structure documentation FLUXLOOPposition.pdf)
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of position.
      kind: template
- name: radial_coordinate_of_rogowski_coil
  kind: scalar
  status: active
  description: "Major-radius coordinate of the Rogowski-coil reference point, measured\
    \ as its perpendicular distance from the toroidal symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the major-radius coordinate of the geometric reference
    point assigned to a Rogowski coil. It locates the coil relative to the toroidal
    symmetry axis, independently of the coil''s toroidal angle.


    The defining relation is


    $$

    R_{\mathrm{coil}} = \operatorname{dist}(\mathbf{r}_{\mathrm{coil}},\mathcal{A})

    $$


    where $R_{\mathrm{coil}}$ is the major-radius coordinate, $\mathbf{r}_{\mathrm{coil}}$
    is the position vector of the reference point, and $\mathcal{A}$ is the toroidal
    symmetry axis. In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is the
    perpendicular distance from that axis.


    The reference point is the designated geometric location for the coil and is distinct
    from the coil''s area, winding length, or electrical current. Together with the
    [vertical coordinate of the Rogowski coil](name:vertical_coordinate_of_rogowski_coil),
    it specifies the coil position in the poloidal plane.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:vertical_coordinate_of_rogowski_coil
  sources:
  - dd_path: magnetics/rogowski_coil/position/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-rogowski_coil-position-r
    dd_documentation:
      leaf: Major radius
      parent_path: magnetics/rogowski_coil/position
      parent: List of (R,Z,phi) points defining the position of the coil guiding center
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of position.
      kind: template
- name: toroidal_angle_of_magnetic_field_probe
  kind: scalar
  status: active
  description: "Toroidal angle of a magnetic-field probe is the signed azimuthal orientation\
    \ of the probe sensitive-axis normal in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'Toroidal angle of a magnetic-field probe is the signed azimuthal
    angle of the probe sensitive-axis normal about the toroidal symmetry axis. It
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R},
    \hat{\phi}, \hat{Z})$, where $\hat{R} \times \hat{\phi}=\hat{Z}$, $R$ is major
    radius, $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$,
    and $Z$ is vertical height.


    The angle is defined by the principal branch of the two-argument arctangent applied
    to the radial and toroidal components of that normal:


    $$

    \alpha_\phi = \operatorname{atan2}(n_\phi, n_R)

    $$


    where $\alpha_\phi$ is the scalar angle represented by this standard name, $\hat{\mathbf
    n}$ is the dimensionless unit vector along the probe sensitive-axis normal, $n_R=\hat{\mathbf
    n}\cdot\hat{R}$, $n_\phi=\hat{\mathbf n}\cdot\hat{\phi}$, and $\operatorname{atan2}(y,x)$
    returns the signed principal angle from $+x$ toward $+y$.


    This quantity is a probe-geometry orientation coordinate, distinct from magnetic-field
    components and from probe-position coordinates such as [vertical coordinate of
    a poloidal magnetic-field probe](name:vertical_coordinate_of_poloidal_magnetic_field_probe).
    The more specific [toroidal angle of a toroidal magnetic-field probe](name:toroidal_angle_of_toroidal_magnetic_field_probe)
    uses the same azimuthal definition for a probe classified by its intended field
    component. If $n_R=n_\phi=0$, the sensitive-axis normal is parallel to $\hat{Z}$
    and this azimuthal angle is undefined.


    Sign convention: Positive when the projection of the probe sensitive-axis normal
    onto the plane spanned by $\hat{R}$ and $\hat{\phi}$ rotates from $+\hat{R}$ toward
    $+\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_diagnostics
  links: []
  sources:
  - dd_path: magnetics/b_field_pol_probe/toroidal_angle
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-b_field_pol_probe-toroidal_angle
    dd_documentation:
      leaf: 'Toroidal angle of coil orientation (0 if fully in the poloidal plane) '
      parent_path: magnetics/b_field_pol_probe
      parent: Poloidal field probes
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: Toroidal angle of the sensitive axis of a poloidal field (Bp) probe
        coil, describing the deviation of the coil orientation from a purely poloidal
        plane. Used to project the measured field component onto the correct direction.
      kind: llm
- name: toroidal_angle_of_toroidal_magnetic_field_probe
  kind: scalar
  status: active
  description: "Signed azimuthal orientation of a toroidal magnetic-field probe\u2019\
    s horizontal sensitive-axis normal, measured from the outward radial direction\
    \ toward increasing toroidal angle."
  documentation: "This quantity is the signed azimuthal orientation of the horizontal\
    \ projection of a toroidal magnetic-field probe\u2019s sensitive-axis normal vector.\
    \ It describes probe orientation rather than the probe\u2019s spatial location\
    \ or its poloidal tilt.\n\nThe angle is defined from the radial and toroidal components\
    \ of the normal vector:\n\n$$\n\\alpha_\\phi = \\operatorname{atan2}(n_\\phi,n_R)\n\
    $$\n\nwhere $\\alpha_\\phi$ is the toroidal orientation angle, and $n_R$ and $n_\\\
    phi$ are the radial and toroidal components of the sensitive-axis normal vector\
    \ in the right-handed cylindrical $(R,\\phi,Z)$ frame. The angle convention is\
    \ complementary to the [poloidal angle of the toroidal magnetic-field probe](name:poloidal_angle_of_toroidal_magnetic_field_probe)\
    \ and differs from the [toroidal angle](name:toroidal_angle), which locates a\
    \ point rather than specifying an orientation.\n\nSign convention: Positive when\
    \ the horizontal projection rotates from the outward radial direction toward increasing\
    \ toroidal angle $\\phi$."
  unit: rad
  physics_domain: magnetic_field_diagnostics
