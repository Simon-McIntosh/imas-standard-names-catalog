- name: launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Launched power of a lower-hybrid antenna is the net RF power entering
    the vacuum vessel after reflected power is subtracted from incident forward power.
  documentation: 'Launched power of a lower-hybrid antenna is the nonnegative RF power
    entering the vacuum vessel from one antenna after accounting for reflected power.
    It is one per-antenna component of the wave-power budget represented by [power
    of a lower-hybrid antenna].


    The net launched power is defined by the per-antenna power balance:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the incident RF power arriving at the antenna input
    reference plane from the transmission line, $P_\mathrm{reflected}$ is the RF power
    returning toward the transmission line, and $P_\mathrm{launched}$ is the net power
    entering the vacuum vessel.


    The quantity applies to one lower-hybrid antenna and is not an aggregate over
    multiple antennas. It excludes forward power subsequently returned as [reflected
    power of a lower-hybrid antenna](name:reflected_power_of_lower_hybrid_antenna),
    and it is distinct from forward power, which includes the portion that is later
    reflected. It denotes power launched into the vessel rather than generator output
    or a separate plasma-absorption quantity.


    The corresponding toroidal- and poloidal-mode-resolved quantities, such as [per
    toroidal mode launched power of a lower-hybrid antenna](name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna),
    are distributions of this same launched-power quantity over refractive-index intervals
    rather than additional per-antenna power components.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna
  sources:
  - dd_path: lh_antennas/antenna/power_launched
