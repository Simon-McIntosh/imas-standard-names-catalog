    status: composed
- name: volume_averaged_carbon_density
  kind: scalar
  status: draft
  description: Plasma-volume mean of the total carbon number density, summed over
    all charge states from neutral to fully stripped carbon.
  documentation: "The volume-averaged carbon density is the spatial mean of the total\
    \ carbon particle number density over the confined plasma volume, aggregating\
    \ contributions from all ionization states. It serves as a single global scalar\
    \ monitor of the total carbon impurity inventory in the confined plasma, applied\
    \ in impurity transport analysis and energy-balance accounting.\n\nThe defining\
    \ relation is:\n\n$$\n\\langle n_C \\rangle = \\frac{1}{V} \\int_V \\sum_{z=0}^{6}\
    \ n_{C,z}(\\mathbf{r}) \\, dV\n$$\n\nwhere $n_{C,z}(\\mathbf{r})$ is the local\
    \ number density of carbon in ionization state $z$ (from neutral $z=0$ through\
    \ fully stripped $z=6$), and $V$ is the plasma volume bounded by the last-closed\
    \ flux surface. This quantity is the volume-averaging transformation applied to\
    \ [carbon_density](name:carbon_density).\n\nIn practice it is inferred from charge-exchange\
    \ recombination spectroscopy of carbon emission lines, ultraviolet spectroscopy,\
    \ or impurity transport modeling integrated over the full plasma cross-section.\n\
    \nTypical values range from $10^{17}$\u2013$10^{18}$ m$^{-3}$ in low-impurity\
    \ plasmas with conditioned walls, rising toward $10^{19}$ m$^{-3}$ in carbon-wall\
    \ machines with significant recycling. The companion [line_averaged_carbon_density](name:line_averaged_carbon_density)\
    \ provides a chord-weighted rather than volume-weighted mean; the two quantities\
    \ differ in the presence of radial density gradients. Analogous volume-averaged\
    \ impurity densities for other light species are [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ and [volume_averaged_nitrogen_density](name:volume_averaged_nitrogen_density),\
    \ which follow the same transformation-subject-base grammar pattern."
  unit: m^-3
  physics_domain: transport
