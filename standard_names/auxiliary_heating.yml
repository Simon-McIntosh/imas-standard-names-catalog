- name: radius_of_curvature_of_arc_segment
  kind: scalar
  status: draft
  description: Curvature radius of a single arc-of-circle segment used to approximate
    the cross-sectional contour of a conductor or ferritic element in the poloidal
    (R, Z) plane. A sequence of such arc segments, each parameterized by its curvature
    radius together with its start and end points, forms the full closed contour.
    The limiting case of infinite radius recovers a straight-line segment.
  documentation: When the cross-sectional outline of an ICRH antenna strap conductor
    or an axisymmetric ferritic component is represented by a sequence of circular
    arcs, each arc segment is characterized by its curvature radius $R_c$ (in meters).
    The full arc-segment parameterization requires, for each segment, the start-point
    coordinates $(R_\mathrm{start}, Z_\mathrm{start})$ in the poloidal plane, the
    end-point coordinates $(R_\mathrm{end}, Z_\mathrm{end})$, and the curvature radius
    $R_c$. Given a chord of length $\ell = \sqrt{(R_\mathrm{end}-R_\mathrm{start})^2
    + (Z_\mathrm{end}-Z_\mathrm{start})^2}$, the admissibility condition is $R_c \ge
    \ell/2$; equality corresponds to a semicircle. For a given chord and value of
    $R_c$ satisfying this condition there are two geometrically distinct arcs (one
    on each side of the chord); the correct arc is selected by the ordering convention
    of the contour segments, i.e., the signed orientation of the contour traversal
    in the $(R, Z)$ plane determines which arc center is used. The limit $R_c \to
    \infty$ corresponds to a straight-line segment connecting the endpoints. Typical
    values range from a few millimeters for small conductor filets to several tens
    of centimeters for the main curved faces of ICRH strap conductors or large ferritic
    inserts. This quantity complements the start-point and end-point coordinates of
    each arc segment, together forming the complete geometric description of the cross-sectional
    contour in the cylindrical $(R, \phi, Z)$ frame where $R$ is the major radius
    measured from the machine symmetry axis and $Z$ is the vertical height.
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:height_of_rectangle_geometry
  - name:width_of_rectangle_geometry
