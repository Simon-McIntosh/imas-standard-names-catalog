  - id: dd:spectrometer_x_ray_crystal/channel/crystal/outline/x1
    dd_path: spectrometer_x_ray_crystal/channel/crystal/outline/x1
    status: composed
- name: x1_coordinate_of_filter
  kind: scalar
  status: draft
  description: X1 coordinate of a vertex or sampled point on a diagnostic filter boundary
    in the local planar (X1, X2) frame. It gives the projection of that boundary point
    along the first in-plane basis direction and is distinct from quantities that
    specifically name a separate filter-window component.
  documentation: 'The $x_1$ coordinate of a filter is the signed in-plane position
    of a point on the boundary of the filtering element or its transmissive footprint,
    expressed in a local planar $(X_1, X_2)$ frame with basis $(\hat{X}_1, \hat{X}_2)$.
    It describes the filter boundary itself; [x1_coordinate_of_filter_window](name:x1_coordinate_of_filter_window)
    should be used when the intended object is a separately identified filter-window
    component.


    For a boundary point at position $\mathbf{r}_v$ and a filter-frame origin at $\mathbf{r}_0$,
    the coordinate is the projection onto the first local basis direction:


    $$

    x_1 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{X}_1

    $$


    where $\hat{X}_1$ is the first in-plane unit vector of the local planar $(X_1,
    X_2)$ frame. The origin is normally a defined reference point of the filter plane,
    such as a geometric center or mechanical fiducial, while $\hat{X}_1$ and $\hat{X}_2$
    span the plane and are fixed by the diagnostic mechanical definition or calibration
    fiducials.


    The coordinate is obtained from mechanical drawings, CAD geometry, survey metrology,
    or calibration of the filter aperture used in the X-ray diagnostic line of sight.
    Together with the corresponding [x2_coordinate_of_filter](name:x2_coordinate_of_filter),
    it defines a polygonal or sampled boundary used to compute geometric transmission,
    vignetting, and ray intersections through the filter.


    Typical absolute coordinate excursions are about $10^{-4}$-$10^{-2}$ m for compact
    soft-X-ray filter apertures and can reach a few $10^{-2}$ m for larger spectrometer
    filter openings.


    Sign convention: Positive when the boundary point lies in the $+\hat{X}_1$ direction
    from the origin of the local planar $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x2_coordinate_of_filter
  - name:x1_coordinate_of_filter_window
  sources:
  - id: dd:soft_x_rays/channel/filter_window/outline/x1
    dd_path: soft_x_rays/channel/filter_window/outline/x1
    status: attached
  - id: dd:spectrometer_x_ray_crystal/channel/filter_window/outline/x1
    dd_path: spectrometer_x_ray_crystal/channel/filter_window/outline/x1
    status: attached
- name: x1_coordinate_of_filter_window
  kind: scalar
  status: draft
  description: First-axis position of a filter-window outline vertex in the local
    (X1, X2) frame, specifying the aperture boundary geometry of an X-ray diagnostic
    filter.
  documentation: 'The $X_1$ coordinate of a filter-window outline vertex is the signed
    displacement of that vertex along the first axis of the local planar $(X_1, X_2)$
    frame of the filter window. Together with the corresponding $X_2$ coordinate,
    it specifies a point on the polygonal or piecewise-linear boundary of the filter
    aperture.


    For a vertex at position $\mathbf{r}$ in the filter plane relative to a local
    origin $\mathbf{r}_0$, the coordinate is the projection onto the first local basis
    direction:


    $$

    X_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_{X_1}

    $$


    where $\hat{\mathbf{e}}_{X_1}$ is the unit vector along the first axis of the
    local planar $(X_1, X_2)$ frame and $X_1$ is measured in meters.


    The coordinate is usually determined from the mechanical design, metrology, or
    diagnostic geometry model of the filter assembly. The ordered set of vertices
    defined by paired $X_1$ and $X_2$ coordinates describes the clear aperture boundary
    that limits transmitted X-ray radiation.


    Typical values are set by the physical size of the filter window: small pinhole
    or slit-like apertures may have vertex coordinates of about $10^{-4}$-$10^{-2}$
    m, while larger camera filter windows commonly span about $10^{-2}$-$10^{-1}$
    m from the local origin.


    Sign convention: Positive when the vertex displacement from the local origin is
    in the $+X_1$ direction of the local planar $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x2_coordinate_of_filter_window
  - name:x1_coordinate_of_filter
  sources:
  - id: dd:camera_x_rays/filter_window/outline/x1
    dd_path: camera_x_rays/filter_window/outline/x1
    status: composed
- name: x1_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: X1 coordinate of an optical element's outline vertices or fiber-center
    positions in the element-local two-dimensional Cartesian (X1, X2) frame.
  documentation: "The X1 coordinate locates a point \u2014 such as an aperture outline\
    \ vertex, a detector-face boundary vertex, or an optical fiber center \u2014 along\
    \ the first axis of the element-local two-dimensional Cartesian (X1, X2) frame.\
    \ This local frame is defined independently for each optical element, with its\
    \ origin placed at a reference feature of the component (for example, a grating\
    \ summit, a detector center, or a fiber bundle centroid) and its axes aligned\
    \ with the element's principal directions.\n\nTogether with the companion X2 coordinate,\
    \ the (X1, X2) pair describes the planar geometry of optical elements such as\
    \ aperture boundaries, detector active areas, grating outlines, or fiber spatial\
    \ layouts. Closed polygons formed from ordered (X1, X2) vertex pairs define the\
    \ collimating or sensitive area used in etendue calculations and line-of-sight\
    \ reconstruction. Analogous coordinates for other diagnostic components follow\
    \ the same convention: [x1_coordinate_of_aperture](name:x1_coordinate_of_aperture)\
    \ and [x1_coordinate_of_diagnostic_aperture](name:x1_coordinate_of_filter) describe\
    \ collimating aperture outlines, while [x1_coordinate_of_soft_xray_detector](name:x1_coordinate_of_soft_xray_detector)\
    \ covers detector-face vertices.\n\nTypical values span the physical dimensions\
    \ of the optical element, ranging from fractions of a millimeter for individual\
    \ optical fiber cores to several centimeters for large detector faces or diffraction\
    \ grating surfaces.\n\nSign convention: Positive when the point lies in the positive\
    \ X1 direction from the origin of the element-local (X1, X2) coordinate frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x1_coordinate_of_aperture
  - name:x1_coordinate_of_filter
  - name:x1_coordinate_of_soft_xray_detector
  sources:
