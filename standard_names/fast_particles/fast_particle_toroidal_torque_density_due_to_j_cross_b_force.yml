name: fast_particle_toroidal_torque_density_due_to_j_cross_b_force
status: draft
description: Volumetric toroidal torque density on the plasma from the $\mathbf{j}
  \times \mathbf{B}$ force associated with fast-particle radial currents.
documentation: "Radial currents carried by fast particles produce a toroidal Lorentz\
  \ force density $f_\\phi = (\\mathbf{j}_{\\rm fp} \\times \\mathbf{B})_{\\phi}$,\
  \ where $\\mathbf{j}_{\\rm fp}$ is the fast-particle current density and $\\mathbf{B}$\
  \ the equilibrium magnetic field. The corresponding torque density is $\\tau_\\\
  phi = R\\, f_\\phi$ (in N/m\xB2), with $R$ the major radius (in m). This mechanism\
  \ is distinct from the collisional momentum transfer channel and arises when finite-orbit-width\
  \ effects, magnetic drifts, or prompt losses generate a net radial current that\
  \ does not cancel on a flux surface. In scenarios with strong off-axis NBI or ICRH\
  \ tail ions, the $\\mathbf{j} \\times \\mathbf{B}$ torque can be comparable to or\
  \ exceed the collisional torque, reaching order $10^{-1}$ N/m\xB2 locally. It is\
  \ computed by drift-kinetic or gyrokinetic fast-ion codes (ASCOT, SPIRAL, ORBIT).\
  \ See also the total fast-particle source `fast_particle_angular_momentum_toroidal_source`\
  \ and the collisional channel `fast_ion_collisional_toroidal_torque_density_due_to_collisions`."
