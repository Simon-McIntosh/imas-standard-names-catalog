- name: particle_flux_at_wall
  kind: scalar
  status: active
  description: Number of particles arriving at a plasma-facing wall surface per unit
    area per unit time from the plasma side, serving as the parent concept for species-resolved
    wall particle fluxes covering electrons, ions of any charge state, and neutral
    atoms or molecules.
  documentation: "Particle flux at the wall is the number rate per unit area at which\
    \ plasma-side particles \u2014 electrons, ions of any charge state, or neutral\
    \ atoms and molecules \u2014 impinge on a plasma-facing boundary surface. It is\
    \ the most general form of the wall particle-flux concept, abstracting over the\
    \ species identity of the arriving particles.\n\nFor a particle species $s$ with\
    \ velocity distribution function $f_s(\\mathbf{v})$, the incident flux is\n\n\
    $$\n\\Gamma_s = \\int_{\\mathbf{v}\\cdot\\hat{n} < 0} f_s(\\mathbf{v})\\,|\\mathbf{v}\\\
    cdot\\hat{n}|\\,d^3v\n$$\n\nwhere $\\hat{n}$ is the inward-pointing wall-normal\
    \ unit vector and the integral extends over particle velocities directed toward\
    \ the surface. The total wall particle flux is obtained by summing $\\Gamma_s$\
    \ over all contributing species.\n\nSpecies-resolved refinements include [electron_particle_flux_at_wall](name:electron_particle_flux_at_wall)\
    \ for the electron channel, [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall)\
    \ for ions aggregated over all charge states, and [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall)\
    \ for neutral atoms and molecules summed over quantum states. The particle flux\
    \ at the wall drives key plasma-material interaction processes including physical\
    \ sputtering, chemical erosion, fuel retention, and recycling, and is closely\
    \ coupled to the kinetic energy delivered to the surface, described by incident_kinetic_energy_flux_at_wall.\n\
    \nIn scrape-off-layer plasmas the ion component to a divertor target spans roughly\
    \ $10^{21}$\u2013$10^{24}$ m$^{-2}$ s$^{-1}$ depending on plasma density, confinement\
    \ mode, and divertor geometry; electron fluxes are comparable in magnitude at\
    \ the sheath edge where quasi-neutrality is maintained."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_particle_flux_at_wall
  - name:ion_particle_flux_at_wall
  - name:neutral_particle_flux_at_wall
- name: electron_particle_flux_at_wall
  kind: scalar
  status: active
  description: Number of electrons arriving at a plasma-facing wall surface per unit
    area per unit time from the plasma side, forming the electron-resolved component
    of wall particle flux.
  documentation: 'The electron particle flux at the wall is the number rate per unit
    area at which plasma-side electrons impinge on a plasma-facing boundary surface.
    It is the electron-resolved component of [particle flux at the wall](name:particle_flux_at_wall).


    For the electron population, the incident flux is


    $$

    \Gamma_e = \int_{\mathbf{v}\cdot\hat{n} < 0} f_e(\mathbf{v})\,|\mathbf{v}\cdot\hat{n}|\,d^3v

    $$


    where $f_e(\mathbf{v})$ is the electron velocity distribution function, $\mathbf{v}$
    is electron velocity, and $\hat{n}$ is the inward-pointing wall-normal unit vector.
    The integral includes only electrons directed toward the surface.


    This quantity includes no ion or neutral contribution; the corresponding aggregate
    ion channel is [ion particle flux at the wall](name:ion_particle_flux_at_wall).'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall
