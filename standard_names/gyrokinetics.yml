- name: effective_charge
  kind: scalar
  status: draft
  description: Ion-density-weighted mean square charge $Z_{\mathrm{eff}} = \sum_i
    n_i Z_i^2 / n_e$, characterizing impurity content and collisional enhancement.
  documentation: "The effective charge $Z_{\\mathrm{eff}} = \\sum_i n_i Z_i^2 / n_e$\
    \ (sum over all ion species with density $n_i$, charge number $Z_i$, and $n_e$\
    \ the electron density) quantifies the impact of impurities on resistivity, radiation,\
    \ and collisional transport. It enters the Spitzer resistivity as $\\eta \\propto\
    \ Z_{\\mathrm{eff}}$ and the neoclassical bootstrap current via the trapped-particle\
    \ collisionality parameter. In gyrokinetic simulations $Z_{\\mathrm{eff}}$ sets\
    \ the ion\u2013electron collisionality and affects the critical temperature gradient.\
    \ For pure hydrogen plasmas $Z_{\\mathrm{eff}} = 1$; in reactor-grade tokamak\
    \ discharges values of 1.2\u20132.5 are common depending on wall conditioning\
    \ and impurity seeding. Measured via visible bremsstrahlung spectroscopy or derived\
    \ from charge-exchange recombination spectroscopy profiles. See also [ion_charge_number](name:ion_charge_number)\
    \ and [electron_density](name:electron_density)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-surface-average
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: electron_density
  kind: scalar
  status: draft
  description: Number density of the electron population (thermal and non-thermal)
    per unit volume, $n_e = N_e / V$.
  documentation: "The electron density $n_e$ counts all electrons\u2014thermal and\
    \ suprathermal\u2014per unit volume. It is a fundamental plasma parameter entering\
    \ the plasma frequency $\\omega_{pe} = \\sqrt{n_e e^2 / (\\varepsilon_0 m_e)}$,\
    \ where $e$ is the elementary charge, $\\varepsilon_0$ the vacuum permittivity,\
    \ and $m_e$ the electron mass, as well as the equation of state $p_e = n_e k_B\
    \ T_e$, where $T_e$ is the electron temperature and $k_B$ Boltzmann's constant.\
    \ Measured by Thomson scattering, interferometry (line-integrated then Abel-inverted),\
    \ reflectometry, and lithium-beam emission spectroscopy. Core values in tokamak\
    \ H-mode plasmas range from $2 \\times 10^{19}$ to $1.5 \\times 10^{20}$ m$^{-3}$;\
    \ scrape-off-layer values fall to $10^{17}$\u2013$10^{19}$ m$^{-3}$. In the gyrokinetics\
    \ context this quantity serves as the normalizing density at the outboard midplane\
    \ of the reference flux surface. Quasi-neutrality constrains $n_e \\approx \\\
    sum_s Z_s n_s$, where $Z_s$ and $n_s$ are the charge state and density of ion\
    \ species $s$."
  unit: m^-3
  cocos_transformation_type: one_like
  tags:
  - benchmark-quantity
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: elongation
  kind: scalar
  status: draft
  description: Ratio of the vertical to horizontal half-widths of a poloidal flux
    surface, $\kappa = b/a$.
  documentation: "The elongation $\\kappa$ (dimensionless) of a poloidal flux surface\
    \ is defined as $\\kappa = b/a$, where $b$ is the vertical half-width and $a$\
    \ is the horizontal half-width of the flux surface measured from its geometric\
    \ center. In the gyrokinetic context, $\\kappa$ enters the Miller parameterization\
    \ of local equilibrium and affects the effective connection length and trapped-particle\
    \ fraction, thereby influencing microinstability growth rates. Values for standard\
    \ tokamak plasmas range from $\\kappa \\approx 1.0$ (circular) to $\\kappa \\\
    approx 1.6$\u20132.0 for shaped H-mode plasmas; advanced scenarios and spherical\
    \ tokamaks may reach $\\kappa \\approx 2.5$. Obtained from MHD equilibrium reconstruction\
    \ (EFIT, LIUQE) or prescribed in gyrokinetic input. See also [upper_triangularity](name:upper_triangularity)\
    \ for the companion triangularity parameter and [magnetic_shear_r_minor_based](name:magnetic_shear_r_minor_based)\
    \ for the minor-radius-based shear used in the same local parameterization."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_effective_charge
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on the effective
    charge $Z_{\mathrm{eff}}$.
  documentation: This field provides the downward error bar for $Z_{\mathrm{eff}}$,
    representing the negative deviation from the nominal value. An asymmetric uncertainty
    arises when measurement error distributions are non-Gaussian, for instance due
    to line-of-sight integration effects in bremsstrahlung $Z_{\mathrm{eff}}$ diagnostics
    or non-uniform impurity profile assumptions. The stored value is a non-negative
    offset such that the lower confidence bound is $Z_{\mathrm{eff}} - \Delta Z_{\mathrm{eff}}^{-}$.
    Combined with [upper_uncertainty_of_effective_charge](name:upper_uncertainty_of_effective_charge)
    the full asymmetric confidence interval is recovered. See also the parent quantity
    [effective_charge](name:effective_charge).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_elongation
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on the poloidal
    flux-surface elongation $\kappa$.
  documentation: 'This field stores the negative deviation from the nominal elongation
    value, defining the lower edge of an asymmetric error bar: the confidence interval
    is $[\kappa - \delta\kappa_{\mathrm{low}},\; \kappa + \delta\kappa_{\mathrm{up}}]$,
    where $\delta\kappa_{\mathrm{low}} \ge 0$ is the stored quantity. Asymmetric uncertainties
    arise when elongation is inferred from equilibrium reconstruction with non-Gaussian
    posterior distributions, or from sensitivity to coil-current uncertainties. Combined
    with [upper_uncertainty_of_elongation](name:upper_uncertainty_of_elongation),
    the full confidence interval on [elongation](name:elongation) is recovered. The
    value is dimensionless and non-negative.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_safety_factor
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on the safety factor
    $q$, representing the negative deviation from the nominal value.
  documentation: 'This field provides the downward error bar for the magnetic safety
    factor $q(\psi)$ on the flux surface used in the gyrokinetic simulation. Lower
    and upper uncertainties may differ when the error distribution is asymmetric,
    arising for instance from systematic biases in equilibrium reconstruction (motional
    Stark effect misalignment, magnetic probe calibration offsets) or from nonlinear
    sensitivity of the $q$-profile inversion to input constraints. The uncertainty
    is expressed in the same dimensionless units as $q$ itself and is defined as a
    non-negative offset: the lower confidence bound is $q - \Delta q_{\rm lower}$.
    Combined with [upper_uncertainty_of_safety_factor](name:upper_uncertainty_of_safety_factor),
    the full asymmetric confidence interval is recovered. See also [safety_factor](name:safety_factor)
    for the parent quantity.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_upper_triangularity
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the upper triangularity
    $\delta_u$ of the poloidal flux-surface cross-section.
  documentation: 'This field provides the negative deviation from the nominal upper
    triangularity, forming the lower edge of an asymmetric confidence interval: $[\delta_u
    - \sigma_{\mathrm{low}},\; \delta_u + \sigma_{\mathrm{up}}]$, where $\sigma_{\mathrm{low}}
    \ge 0$ is the stored value. Upper triangularity $\delta_u$ measures how much the
    uppermost point of a flux surface is shifted inward relative to its geometric
    center; uncertainties propagate from equilibrium reconstruction fitting errors.
    Combined with [upper_uncertainty_of_upper_triangularity](name:upper_uncertainty_of_upper_triangularity)
    the full asymmetric error bar is recovered. See also [elongation](name:elongation)
    for the companion shaping parameter.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_binormal_wavevector
  kind: scalar
  status: draft
  description: Binormal component of the fluctuation wavevector normalized to the
    inverse reference gyroradius, $k_y \rho_{\mathrm{ref}}$.
  documentation: "In flux-tube gyrokinetic simulations the fluctuation wavevector\
    \ is decomposed into radial ($k_x$) and binormal ($k_y$) components in the field-aligned\
    \ coordinate system. The binormal direction is perpendicular to both the magnetic\
    \ field $\\mathbf{B}$ and the radial direction $\\nabla r$; in a tokamak it is\
    \ approximately aligned with the poloidal direction at the outboard midplane.\
    \ This quantity stores the dimensionless product $k_y \\rho_{\\mathrm{ref}}$,\
    \ where $\\rho_{\\mathrm{ref}} = \\sqrt{2 m_{\\mathrm{ref}} T_{\\mathrm{ref}}}\
    \ / (e B_{\\mathrm{ref}})$ is the reference thermal gyroradius, $m_{\\mathrm{ref}}$\
    \ is the reference mass, $T_{\\mathrm{ref}}$ the reference temperature, and $B_{\\\
    mathrm{ref}}$ the reference magnetic field. Ion-temperature-gradient (ITG) modes\
    \ peak at $k_y \\rho_i \\sim 0.1$\u20130.5, while electron-temperature-gradient\
    \ (ETG) modes appear at $k_y \\rho_e \\sim 0.1$\u20130.5 (equivalently $k_y \\\
    rho_i \\gg 1$). See also [safety_factor](name:safety_factor) for the equilibrium\
    \ context and [flux_tube_poloidal_turn_count](name:flux_tube_poloidal_turn_count)\
    \ for the parallel domain extent."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_density_gradient_scale_length
  kind: scalar
  status: draft
  description: Dimensionless logarithmic gradient of species density with respect
    to the normalized minor radius, $a/L_n = -d(\ln n)/d(r/a)$.
  documentation: "The normalized density gradient scale length $a/L_n = -d(\\ln n)/d(r/a)$,\
    \ where $n$ is the species number density, $r$ is the local minor radius, and\
    \ $a$ is the last-closed-flux-surface minor radius, quantifies the free-energy\
    \ source for density-gradient-driven microinstabilities such as the trapped-electron\
    \ mode (TEM). In gyrokinetic flux-tube simulations it enters as a key input parameter\
    \ alongside the temperature gradient $a/L_T$; the ratio $\\eta = L_n/L_T$ discriminates\
    \ between ITG-dominated ($\\eta > \\eta_{\\rm crit}$) and TEM-dominated regimes.\
    \ For H-mode core plasmas, $a/L_{n_e} \\sim 1$\u20134 for electrons; edge pedestals\
    \ can exhibit much steeper values. See also [normalized_temperature_gradient_scale_length](name:normalized_temperature_gradient_scale_length)\
    \ for the analogous temperature drive and [electron_density](name:electron_density)\
    \ for the underlying profile."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_energy_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel magnetic field $\delta B_\parallel$
    to the dimensionless turbulent energy flux.
  documentation: 'This quantity captures the compressional-magnetic component $\hat{Q}^{B_\parallel}$
    of the normalized turbulent energy flux resulting from correlations between the
    perturbed distribution and the parallel magnetic-field perturbation $\delta B_\parallel$.
    In the decomposition $\hat{Q} = \hat{Q}^{\phi} + \hat{Q}^{A_\parallel} + \hat{Q}^{B_\parallel}$,
    the $B_\parallel$ channel encodes mirror-force-driven transport and becomes relevant
    at moderate to high $\beta$ or when the perpendicular pressure perturbation $\delta
    p_\perp$ is large. The normalization follows gyro-Bohm conventions: $Q_{\mathrm{gB}}
    = n_{\mathrm{ref}} T_{\mathrm{ref}} v_{\mathrm{th,ref}} (\rho_{\mathrm{ref}}/a)^2$.
    Codes retaining $\delta B_\parallel$ (e.g., GENE, CGYRO with compressional terms)
    output this channel separately. See also [normalized_energy_flux_due_to_electrostatic_potential](name:normalized_energy_flux_due_to_electrostatic_potential)
    and [normalized_energy_flux_due_to_parallel_vector_potential](name:normalized_energy_flux_due_to_parallel_vector_potential).'
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_energy_flux_due_to_parallel_vector_potential
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel vector potential $\delta A_\parallel$
    to the dimensionless turbulent energy flux.
  documentation: This quantity isolates the electromagnetic flutter contribution $\hat{Q}^{A_\parallel}$
    to the total normalized turbulent energy flux arising from correlations between
    the perturbed distribution function and the parallel magnetic vector potential
    perturbation $\delta A_\parallel$. In the gyrokinetic formulation, the radial
    energy flux decomposes as $\hat{Q} = \hat{Q}^{\phi} + \hat{Q}^{A_\parallel} +
    \hat{Q}^{B_\parallel}$, where the $A_\parallel$ channel captures magnetic flutter
    transport important at high $\beta$. The normalization follows the code-specific
    convention (e.g., $Q_{\mathrm{gB}} = n_{\mathrm{ref}} T_{\mathrm{ref}} v_{\mathrm{th,ref}}
    (\rho_{\mathrm{ref}}/a)^2$ in gyro-Bohm units). This channel becomes significant
    when $\beta \gtrsim 1\%$; in electrostatic regimes it vanishes. See also [normalized_energy_flux_due_to_electrostatic_potential](name:normalized_energy_flux_due_to_electrostatic_potential)
    and [normalized_energy_flux_due_to_parallel_magnetic_field_perturbation](name:normalized_energy_flux_due_to_parallel_magnetic_field_perturbation).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrocenter_energy_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Dimensionless gyrocenter energy flux contribution from the perturbed
    parallel magnetic field $\delta B_\parallel$ in gyrokinetic simulations.
  documentation: 'The normalized gyrocenter energy flux due to the parallel magnetic
    field perturbation represents the compressional magnetic heat transport channel
    evaluated in gyrocenter coordinates. The contribution arises from the correlation
    between the perturbed distribution function and the magnetic mirror force induced
    by $\delta B_\parallel$: $Q_s^{\delta B_\parallel} = \langle \mathcal{E}_s \,
    \delta f_s \, v_{d,r} \, \delta B_\parallel / B_0 \rangle$, where $\mathcal{E}_s
    = \tfrac{1}{2} m_s v^2$ is the gyrocenter kinetic energy, $v_{d,r}$ is the radial
    magnetic drift, and $B_0$ is the equilibrium field magnitude. Normalization follows
    the gyro-Bohm convention $Q_{\mathrm{gB}} = n_{\mathrm{ref}} T_{\mathrm{ref}}
    c_s \rho_*^2$, where $c_s = \sqrt{T_{\mathrm{ref}} / m_{\mathrm{ref}}}$ and $\rho_*
    = \rho_s / a$. This channel is significant at moderate to high $\beta$ and resolves
    compressional effects absent in the reduced-MHD limit. Gyrokinetic codes output
    this quantity per species and mode number. See also [normalized_gyrocenter_energy_flux_due_to_parallel_vector_potential](name:normalized_gyrocenter_energy_flux_due_to_parallel_vector_potential)
    and [normalized_particle_flux_due_to_parallel_magnetic_field_perturbation](name:normalized_particle_flux_due_to_parallel_magnetic_field_perturbation).'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-surface-average
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrocenter_energy_flux_due_to_parallel_vector_potential
  kind: scalar
  status: draft
  description: Dimensionless gyrocenter energy flux contribution from the perturbed
    parallel vector potential $\delta A_\parallel$ in gyrokinetic simulations.
  documentation: The normalized gyrocenter energy flux due to the parallel vector
    potential captures the electromagnetic flutter heat transport channel evaluated
    in gyrocenter coordinates. In the $\delta f$ gyrokinetic formulation, the radial
    energy flux receives a contribution $Q_s^{A_\parallel} = \langle \mathcal{E}_s
    \, \delta f_s \, v_\parallel \, \delta A_\parallel \rangle$, where $\mathcal{E}_s
    = \tfrac{1}{2} m_s v^2$ is the particle kinetic energy (in the gyrocenter frame),
    $v_\parallel$ is the parallel velocity, and $\delta A_\parallel$ is the perturbed
    parallel vector potential. Because the flux is evaluated at the gyrocenter position
    rather than the particle position, finite-Larmor-radius corrections due to the
    gyroaveraging operator are excluded from this quantity but enter in the corresponding
    particle-position flux. Normalization follows the gyro-Bohm convention $Q_{\mathrm{gB}}
    = n_{\mathrm{ref}} T_{\mathrm{ref}} c_s \rho_*^2$, with $c_s = \sqrt{T_{\mathrm{ref}}/m_{\mathrm{ref}}}$
    and $\rho_* = \rho_s / a$. This channel grows with increasing $\beta$ and is key
    to resolving kinetic-ballooning and micro-tearing mode heat transport. Computed
    per species and wavevector in codes such as GENE and CGYRO. See also [normalized_gyrocenter_energy_flux_due_to_parallel_magnetic_field_perturbation](name:normalized_gyrocenter_energy_flux_due_to_parallel_magnetic_field_perturbation)
    and [normalized_particle_flux_due_to_parallel_vector_potential](name:normalized_particle_flux_due_to_parallel_vector_potential).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-surface-average
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrocenter_parallel_pressure_moment
  kind: scalar
  status: draft
  description: Normalized velocity-space moment of the gyrocenter distribution corresponding
    to the parallel pressure (or parallel temperature).
  documentation: This quantity represents the integral $\int m v_\parallel^2 \, f_{\mathrm{gc}}
    \, d^3v$ evaluated in gyrocenter coordinates and normalized to reference values,
    where $v_\parallel$ is the velocity component parallel to the magnetic field,
    $m$ is the particle mass, and $f_{\mathrm{gc}}$ is the gyrocenter distribution
    function. It quantifies the parallel pressure (equivalently, parallel temperature)
    carried by a given species in a gyrokinetic eigenmode. The normalization renders
    the moment dimensionless (unit 1), with reference quantities (density, temperature)
    defined by the gyrokinetic code convention. In the presence of pressure anisotropy,
    this moment together with [normalized_gyrocenter_perpendicular_energy_moment](name:normalized_gyrocenter_perpendicular_energy_moment)
    fully specifies the anisotropic second-order moments. Related gyroaveraged variants
    include [gyroaveraged_parallel_pressure_moment_normalized](name:gyroaveraged_parallel_pressure_moment_normalized).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - flux-coordinates
  - fourier-component
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrokinetic_averaging_time_interval
  kind: scalar
  status: draft
  description: Normalized time window over which turbulent fluxes and moments are
    averaged in nonlinear gyrokinetic simulations.
  documentation: "In nonlinear gyrokinetic simulations, turbulent fluxes and velocity-space\
    \ moments fluctuate strongly in time; a finite averaging window is required to\
    \ obtain statistically converged transport coefficients. This quantity stores\
    \ the length of that averaging interval in normalized time units $t_{\\rm norm}\
    \ = t \\cdot c_s / a$, where $c_s = \\sqrt{T_e/m_i}$ is the ion sound speed and\
    \ $a$ is the minor radius. The interval must be long compared to the turbulence\
    \ correlation time $\\tau_{\\rm corr}$ (ensuring $N_{\\rm eff} = \\Delta t / \\\
    tau_{\\rm corr} \\gg 1$ statistically independent samples) but short enough that\
    \ the background profiles remain approximately constant. Values of $\\Delta t_{\\\
    rm norm} \\sim 100$\u20131000 are common for ion-scale turbulence. See also [flux_tube_poloidal_turn_count](name:flux_tube_poloidal_turn_count)\
    \ for the spatial domain extent."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - steady-state
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrokinetic_eigenmode_frequency
  kind: scalar
  status: draft
  description: Normalized real frequency of a gyrokinetic eigenmode, rendered dimensionless
    by the reference gyrokinetic normalization.
  documentation: The eigenmode frequency $\omega_{\mathrm{norm}} = \omega / \omega_{\mathrm{ref}}$
    is the real part of the complex eigenvalue obtained from the linear gyrokinetic
    dispersion relation for a given wavevector $(k_\perp, k_\parallel)$, where $\omega$
    is the physical angular frequency and $\omega_{\mathrm{ref}}$ is a code-dependent
    reference frequency (e.g., $c_s / a$ with $c_s$ the ion sound speed and $a$ the
    minor radius). The imaginary part of the eigenvalue (growth rate) is stored separately.
    This frequency characterizes drift-wave instabilities such as ion-temperature-gradient
    (ITG) and trapped-electron modes (TEM). See the companion growth-rate quantity
    for stability assessment and [electron_density](name:electron_density) or [electron_temperature](name:electron_temperature)
    for gradient-drive context.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - flux-coordinates
  - fourier-component
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrokinetic_eigenmode_growth_rate
  kind: scalar
  status: draft
  description: Dimensionless growth rate of a linear gyrokinetic eigenmode, normalized
    to a reference frequency such as $c_s/a$ where $c_s$ is the ion sound speed and
    $a$ is the minor radius.
  documentation: "The normalized eigenmode growth rate $\\gamma_{\\mathrm{norm}} =\
    \ \\gamma / \\omega_{\\mathrm{ref}}$ quantifies how rapidly a linear microinstability\
    \ (e.g., ITG, TEM, ETG) amplifies in time, expressed in units of the reference\
    \ frequency $\\omega_{\\mathrm{ref}} = c_s / a$, where $c_s = \\sqrt{T_e / m_i}$\
    \ is the ion sound speed, $T_e$ is the electron temperature in J, $m_i$ is the\
    \ ion mass in kg, and $a$ is the last-closed-flux-surface minor radius in m. A\
    \ positive value indicates an unstable mode whose amplitude grows as $\\exp(\\\
    gamma t)$; the most unstable mode at each wavevector determines the dominant turbulence\
    \ drive. Linear gyrokinetic solvers (GS2, GENE, GKW, CGYRO) extract $\\gamma_{\\\
    mathrm{norm}}$ from initial-value or eigenvalue calculations at each $(k_\\theta\
    \ \\rho_s, k_r \\rho_s)$ point. Values in the range 0.01\u20131.0 are common for\
    \ dominant ion-scale modes in tokamak core conditions. The companion real-frequency\
    \ counterpart [normalized_gyrokinetic_eigenmode_frequency](name:normalized_gyrokinetic_eigenmode_frequency)\
    \ indicates the mode propagation direction. See also [normalized_gyrokinetic_simulation_time](name:normalized_gyrokinetic_simulation_time)\
    \ for the time coordinate used during initial-value convergence."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - mhd-stability-analysis
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_gyrokinetic_particle_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Normalized turbulent particle flux contribution arising from perturbed
    parallel magnetic field fluctuations $\delta B_\parallel$ in a gyrokinetic simulation.
  documentation: 'This quantity isolates the contribution of the perturbed parallel
    magnetic field $\delta B_\parallel$ to the total turbulent particle flux $\Gamma$
    in the normalized gyrokinetic flux decomposition. The total quasilinear or nonlinear
    particle flux can be decomposed by electromagnetic field component: $\Gamma_{\rm
    norm} = \Gamma_{\phi} + \Gamma_{A_\parallel} + \Gamma_{B_\parallel}$, where $\Gamma_{\phi}$
    is the electrostatic (potential) contribution, $\Gamma_{A_\parallel}$ the flutter
    contribution from the parallel vector potential, and $\Gamma_{B_\parallel}$ the
    compressional magnetic contribution reported here. The normalization follows the
    gyro-Bohm convention: $\Gamma_{\rm gB} = n_s c_s \rho_*^2$, where $n_s$ is the
    species density, $c_s = \sqrt{T_e/m_i}$ is the ion sound speed, and $\rho_* =
    \rho_s/a$ is the normalized sound Larmor radius. In most ITG/TEM turbulence scenarios,
    the $\delta B_\parallel$ channel is subdominant but becomes significant at high
    $\beta$. See also [normalized_density_gradient_scale_length](name:normalized_density_gradient_scale_length)
    and [perturbed_parallel_magnetic_field_eigenmode_imaginary_part_normalized](name:perturbed_parallel_magnetic_field_eigenmode_imaginary_part_normalized).'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - flux-surface-average
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_of_e_cross_b_shearing_rate
  kind: scalar
  status: draft
  description: $E\times B$ shearing rate normalized to the reference gyrokinetic frequency,
    quantifying turbulence suppression in nonlinear simulations.
  documentation: "The normalized $E\\times B$ shearing rate $\\hat{\\gamma}_{E} =\
    \ \\gamma_{E} / (c_s / a)$ expresses the equilibrium flow-shear rate $\\gamma_E$\
    \ in units of the reference frequency $c_s / a$, where $c_s = \\sqrt{T_{\\mathrm{ref}}\
    \ / m_{\\mathrm{ref}}}$ is the sound speed, $T_{\\mathrm{ref}}$ the reference\
    \ temperature, $m_{\\mathrm{ref}}$ the reference mass, and $a$ the minor radius.\
    \ Flow shear reduces turbulent transport by decorrelating eddies when $\\hat{\\\
    gamma}_E$ is comparable to or exceeds the linear growth rate of the dominant microinstability.\
    \ In nonlinear gyrokinetic flux-tube simulations (GENE, CGYRO, GS2), this quantity\
    \ is provided as an input parameter that tilts the radial wavevector in time.\
    \ Values $\\hat{\\gamma}_E \\sim 0.01$\u2013$0.3$ span typical H-mode conditions.\
    \ See also [reference_plasma_beta](name:reference_plasma_beta) and [effective_charge](name:effective_charge)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  - time-dependent
  links: []
