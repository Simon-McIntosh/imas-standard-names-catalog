name: explicit_part_of_ion_particle_source
status: draft
description: "Explicit (state-independent) contribution to the volumetric ion particle\
  \ source term used in implicit\u2013explicit time-integration schemes."
documentation: "In implicit\u2013explicit (IMEX) time-stepping formulations of the\
  \ particle transport equation $\\partial n_i / \\partial t + \\nabla \\cdot \\Gamma_i\
  \ = S_i$, the total source $S_i$ is split as $S_i = S_i^{\\mathrm{explicit}} + S_i^{\\\
  mathrm{implicit}}(n_i)$. The explicit part $S_i^{\\mathrm{explicit}}$ ($\\mathrm{m^{-3}\\\
  ,s^{-1}}$) captures contributions that are independent of the current-step solution\
  \ vector, such as fixed external fueling rates, pre-computed ionization sources,\
  \ or NBI deposition profiles. Typical magnitudes range from $10^{18}$ to $10^{21}\\\
  ;\\mathrm{m^{-3}\\,s^{-1}}$ depending on the fueling scenario and plasma density.\
  \ This decomposition improves numerical stability by relegating stiff, density-dependent\
  \ terms (e.g., recombination) to the implicit part. Evaluated within integrated\
  \ modeling frameworks (e.g., JINTRAC, ETS). See also `ion_particle_flux` and `ion_number_density`."
validity_domain: ''
