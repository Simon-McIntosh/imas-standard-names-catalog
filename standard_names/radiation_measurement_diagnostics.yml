- name: second_coordinate_width_of_detector
  kind: scalar
  status: draft
  description: Full width of a rectangular diagnostic detector element measured edge-to-edge
    along the second local coordinate (X2) direction. This is a nonnegative side length
    representing the physical extent of the active area of the detector. Applicable
    only when the detector geometry type is rectangular.
  documentation: "The second coordinate width $w_{X2}$ is the edge-to-edge physical\
    \ dimension of a rectangular detector element along the X2 axis of its local instrument\
    \ reference frame $(X1, X2)$, where X1 and X2 are two mutually orthogonal directions\
    \ spanning the detector plane. Together with the first coordinate width $w_{X1}$,\
    \ this quantity fully specifies the rectangular active area $A = w_{X1} \\cdot\
    \ w_{X2}$, which enters directly into solid-angle and \xE9tendue calculations\
    \ for the diagnostic channel.\n\nThe width is a nonnegative scalar magnitude ($w_{X2}\
    \ \\geq 0$) representing the physical, not projected or effective, extent of the\
    \ detector. Typical detector widths for fusion diagnostics range from fractions\
    \ of a millimeter (e.g., bolometer foil strips) to several millimeters (e.g.,\
    \ MSE photomultiplier entrance windows). Values are determined from mechanical\
    \ drawings or direct metrology of the detector assembly.\n\nThis quantity applies\
    \ only when the detector element has a rectangular geometry; circular detector\
    \ elements are described by [radius_of_detector](name:radius_of_detector) instead.\
    \ Compare with [second_coordinate_width_of_aperture](name:second_coordinate_width_of_aperture),\
    \ which gives the corresponding width of the aperture element rather than the\
    \ detector itself, and [first_coordinate_width_of_detector](name:first_coordinate_width_of_detector),\
    \ which gives the complementary width along X1."
