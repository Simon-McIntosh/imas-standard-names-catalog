- name: total_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Total power of an ion-cyclotron heating antenna is the net launched
    radio-frequency power from the antenna set, summed over all ion-cyclotron heating
    antennas. It excludes reflected power and is distinct from power absorbed by the
    plasma.
  documentation: 'Total power of an ion-cyclotron heating antenna is the antenna-summed
    net launched radio-frequency wave power at the antenna reference planes. It is
    the aggregate of the net power associated with each ion-cyclotron heating antenna
    and is distinct from the power ultimately absorbed by the plasma.


    The total launched antenna power is defined by summing the net contribution from
    each antenna:


    $$

    P_{\mathrm{total}} = \sum_{a=1}^{N_{\mathrm{ant}}} \left(P_{\mathrm{fwd},a} -
    P_{\mathrm{ref},a}\right)

    $$


    where $P_{\mathrm{total}}$, $P_{\mathrm{fwd},a}$, and $P_{\mathrm{ref},a}$ are
    powers expressed in watts, $P_{\mathrm{fwd},a}$ is the forward incident power
    traveling toward antenna $a$, $P_{\mathrm{ref},a}$ is the reflected power returning
    from antenna $a$, and $N_{\mathrm{ant}}$ is the number of antennas included in
    the sum.


    This quantity represents launched antenna power, not absorbed heating power. The
    corresponding single-antenna net power is [power of an ion-cyclotron heating antenna](name:power_of_ion_cyclotron_heating_antenna);
    its directional components are [forward power of an ion-cyclotron heating antenna](name:forward_power_of_ion_cyclotron_heating_antenna)
    and [reflected power of an ion-cyclotron heating antenna](name:reflected_power_of_ion_cyclotron_heating_antenna),
    while plasma absorption is represented by [total power due to ion-cyclotron heating](name:total_power_due_to_ion_cyclotron_heating).


    Sign convention: Positive when the net radio-frequency power flow is from the
    antenna set toward the plasma-facing launch side.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:power_of_ion_cyclotron_heating_antenna
  - name:total_power_due_to_ion_cyclotron_heating
  arguments:
