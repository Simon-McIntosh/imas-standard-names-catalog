      kind: template
- name: safety_factor_at_pedestal_top
  kind: scalar
  status: active
  description: "Safety factor at the pedestal top; it is the toroidal-to-poloidal\
    \ magnetic-flux increment ratio on that flux surface and gives the number of toroidal\
    \ turns in the right-handed cylindrical (R, \u03C6, Z) frame per poloidal turn."
  documentation: 'The safety factor at the pedestal top is the value of the [safety
    factor](name:safety_factor) on the flux surface associated with the pedestal top
    of the edge transport barrier. It characterizes magnetic-field-line winding: the
    number of toroidal turns a field line makes per poloidal turn in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The quantity is defined by evaluating the toroidal-to-poloidal flux-increment
    ratio on the pedestal-top flux surface:


    $$

    q_\mathrm{ped} = \left.\frac{d\Phi}{d\Psi}\right|_{\mathcal{S}_\mathrm{ped}}

    $$


    where $\Phi$ is toroidal magnetic flux in webers, $\Psi$ is poloidal magnetic
    flux in webers, and $\mathcal{S}_\mathrm{ped}$ is the flux surface associated
    with the pedestal top. Because the numerator and denominator are magnetic-flux
    increments, $q_\mathrm{ped}$ is dimensionless.


    The pedestal top is the inner edge of the steep-gradient pedestal region, so this
    quantity is tied to the pedestal-top flux surface rather than to a fixed normalized
    poloidal flux value. It is distinct from [safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95),
    which is evaluated where $\psi_N=0.95$.


    Sign convention: Positive when an infinitesimal change to neighboring closed flux
    surfaces at the pedestal top gives toroidal and poloidal magnetic-flux increments
    $d\Phi$ and $d\Psi$ with the same sign.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:safety_factor
  - name:edge_localized_mode_frequency
  - name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  - name:magnetic_shear_at_plasma_boundary
  arguments:
  - name: safety_factor
    operator: pedestal_top
    operator_kind: locus
- name: thermal_ion_charge_state_energy_diffusion_coefficient
  kind: vector
  status: active
  description: Directional, charge-state-resolved coefficient for Fickian diffusion
    of thermal energy carried by a specified ion state, with each component selecting
    a spatial transport direction.
  documentation: 'The quantity is the directional, charge-state-resolved energy-diffusion
    coefficient for thermal energy carried by a specified ion charge state. It generalizes
    directional components such as the [radial thermal ion charge-state energy diffusion
    coefficient](name:radial_thermal_ion_charge_state_energy_diffusion_coefficient)
    without selecting one spatial projection.


    For each selected direction $a$, the Fickian relation is


    $$

    Q_{E,s}^{(a)}=-n_s\,\chi_{E,s}^{(a)}\,\nabla_a T_s

    $$


    where $Q_{E,s}^{(a)}$ is the diffusive thermal-energy flux of charge state $s$,
    $n_s$ is its number density, $\chi_{E,s}^{(a)}$ is the corresponding directional
    diffusion coefficient, $\nabla_a$ is the temperature gradient along direction
    $a$, and $T_s$ is its thermal temperature.


    Only the specified ion charge state is included; the coefficient is not summed
    over charge states or over the total ion population. The minus sign describes
    flux down the temperature gradient and does not define a signed coefficient. This
    distinguishes it from the population-aggregated [radial ion energy diffusion coefficient](name:radial_ion_energy_diffusion_coefficient).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_thermal_ion_charge_state_energy_diffusion_coefficient
  - name:radial_ion_energy_diffusion_coefficient
  arguments:
  - name: ion_charge_state_energy_diffusion_coefficient
    operator: thermal
    operator_kind: qualifier
  sources:
