- name: vertical_coordinate_of_x_point
  kind: scalar
  status: active
  description: "Signed vertical coordinate of the poloidal magnetic null where separatrix\
    \ branches meet, expressed as Z in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'The vertical coordinate of an X-point is the signed value $Z_X$
    locating a poloidal magnetic-field null where separatrix branches meet in the
    right-handed cylindrical $(R, \phi, Z)$ frame.


    At the X-point, the poloidal magnetic-field components satisfy


    $$

    B_R(R_X,Z_X)=B_Z(R_X,Z_X)=0

    $$


    where $R_X$ and $Z_X$ are the major-radius and vertical coordinates of the null,
    and $B_R$ and $B_Z$ are the radial and vertical magnetic-field components. The
    quantity identifies the selected X-point and is distinct from the [vertical coordinate
    of the primary X-point](name:vertical_coordinate_of_primary_x_point) when another
    X-point is selected.


    Sign convention: Positive when the X-point lies in the direction of increasing
    $Z$ from the origin of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_primary_x_point
  sources:
  - dd_path: equilibrium/time_slice/constraints/x_point/position_measured/z
