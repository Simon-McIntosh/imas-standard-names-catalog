- name: temperature_at_inlet
  kind: scalar
  status: active
  description: Absolute thermodynamic temperature characterizing the thermal state
    of a coolant or working fluid at a defined plant-system location.
  documentation: 'Absolute thermodynamic temperature is the intensive thermal state
    variable of a coolant or working fluid at a defined plant-system location. It
    describes the fluid temperature itself, not a temperature difference or temperature
    rise.


    The quantity applies to fluid states at component or system ports. For the inlet-specific
    instance, [coolant temperature at inlet](name:coolant_temperature_at_inlet) describes
    the coolant as it enters a cooling loop or plant component; corresponding outlet
    quantities describe the downstream state, such as [coolant temperature at outlet](name:coolant_temperature_at_outlet).'
  unit: K
  physics_domain: plant_systems
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
- name: coolant_temperature_at_inlet
  kind: scalar
  status: active
  description: Coolant temperature at the inlet is the absolute thermodynamic temperature
    of the coolant or working fluid as it enters a cooling loop, plant component,
    or calorimetry component. It is the coolant-specific inlet temperature and not
    a temperature rise.
  documentation: 'Coolant temperature at the inlet is the absolute thermodynamic [coolant
    temperature](name:coolant_temperature) of the coolant or working fluid at the
    upstream boundary of a cooling loop, plant component, or calorimetry component.
    It is the coolant-specific form of [temperature at inlet](name:temperature_at_inlet)
    and denotes the state of the entering fluid, not the temperature of a solid wall
    or downstream fluid.


    The inlet value is the coolant-temperature value on the inlet boundary:


    $$

    T_\mathrm{in} = T_\mathrm{coolant}\rvert_{\Gamma_\mathrm{in}}

    $$


    where $T_\mathrm{coolant}$ is the coolant thermodynamic temperature and $\Gamma_\mathrm{in}$
    is the boundary across which the coolant enters the loop or component.


    This name is generic for an inlet; a more specific name that identifies a cooling
    circuit, port, or component denotes the same physical quantity evaluated at that
    narrower inlet. It is distinct from [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet);
    the difference $T_\mathrm{out}-T_\mathrm{in}$ may enter enthalpy or thermal-power
    balances, but this quantity is not itself a temperature difference or transferred
    thermal power.'
  unit: K
  physics_domain: plant_systems
  links:
  - name:temperature_at_inlet
  - name:coolant_temperature_at_outlet
  arguments:
  - name: temperature_at_inlet
    operator: coolant
    operator_kind: qualifier
  sources:
