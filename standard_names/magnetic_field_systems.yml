- name: outer_radius_of_ferritic_element
  kind: scalar
  status: active
  description: "Outer radial boundary of the annular cross-section of a ferritic element\
    \ in the axisymmetric equivalent geometry, defining the external extent of the\
    \ annulus centered at a reference point in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The outer radius specifies the external boundary of the annular
    cross-section used to represent a ferritic element in the axisymmetric thick-line
    equivalent geometry. Ferritic elements are ferromagnetic inserts, and each element
    is represented by an axisymmetric body whose cross-section is an annulus centered
    at a reference point $(R_0, Z_0)$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius from the toroidal symmetry axis and $Z$ is vertical
    height.


    For an annular cross-section with inner radius $r_\mathrm{in}$ and outer radius
    $r_\mathrm{out}$, the enclosed area is


    $$

    A = \pi\bigl(r_\mathrm{out}^2 - r_\mathrm{in}^2\bigr)

    $$


    where $A$ is the cross-sectional area and $r_\mathrm{in}$ and $r_\mathrm{out}$
    are radial distances from the annulus center. The constraint is $0 \leq r_\mathrm{in}
    < r_\mathrm{out}$. Together with [inner radius of the ferritic element](name:inner_radius_of_ferritic_element),
    this quantity defines the annular cross-section; [radius of the ferritic element](name:radial_coordinate_of_ferritic_element_centroid)
    specifies its radial placement rather than its outer boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_ferritic_element
  - name:radial_coordinate_of_ferritic_element_centroid
  sources:
  - dd_path: ferritic/object/axisymmetric/annulus/radius_outer
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-axisymmetric-annulus-radius_outer
    dd_documentation:
      leaf: Outer radius
      parent_path: ferritic/object/axisymmetric/annulus
      parent: The element is an annulus of centre R, Z, with inner radius radius_inner
        and outer radius radius_outer
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Outer radius of an axisymmetric annular element representing ferritic
        material in the equivalent axisymmetric geometry. Together with the inner
        radius, defines the radial extent of the annulus used in equilibrium solvers.
      kind: llm
- name: permeability_of_ferritic_element
  kind: scalar
  status: active
  description: Absolute magnetic permeability of a ferritic structural element, quantifying
    the local slope of its nonlinear B-H characteristic that relates magnetic flux
    density to applied field strength at a given operating point.
  documentation: 'The absolute magnetic permeability of a ferritic element characterizes
    how the magnetic flux density $B$ responds to the applied magnetic field strength
    $H$ in the ferromagnetic material, capturing its nonlinear magnetization behavior
    at any point along the B-H curve. Because ferritic steels are strongly nonlinear,
    the permeability is field-dependent and must be specified at the relevant operating
    point.


    The tangent permeability at a given field amplitude is defined as:


    $$

    \mu = \frac{dB}{dH}

    $$


    where $B$ is the local magnetic flux density and $H$ is the magnetic field strength
    at the operating point.


    This permeability enters electromagnetic models of fusion devices because ferritic
    structural elements can significantly distort the equilibrium magnetic field configuration,
    particularly in the context of non-axisymmetric field correction and passive ferromagnetic
    compensation. Values are extracted from B-H characterization curves measured for
    the specific ferritic steel alloy used. In the high-field regime where magnetization
    has largely reached its saturation value, the tangent permeability converges to
    a reduced residual slope captured specifically by [saturated_permeability_of_ferritic_element](name:saturated_permeability_of_ferritic_element).
    The local field driving magnetization at the element''s centroid is given by [radial_magnetic_field_at_ferritic_element_centroid](name:radial_magnetic_field_at_ferritic_element_centroid),
    and the resulting induced magnetization is described by [toroidal_magnetization_of_ferritic_element](name:toroidal_magnetization_of_ferritic_element).'
  unit: H.m^-1
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_at_ferritic_element_centroid
  - name:toroidal_magnetization_of_ferritic_element
- name: radial_angle_of_poloidal_field_coil
  kind: scalar
  status: active
  description: First inclination angle (alpha) of the oblique parallelogram or trapezoidal
    cross-section of a poloidal field coil element, measured in the poloidal plane
    from the outward major-radius direction.
  documentation: "Poloidal field coil conductors are frequently designed with non-rectangular\
    \ cross-sections modeled as parallelograms or trapezoids in the poloidal $(R,\
    \ Z)$ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame. The radial\
    \ angle $\\alpha$ defines the inclination of one pair of parallel sides (the alpha-sides)\
    \ relative to the outward major-radius direction $+\\hat{R}$, characterizing how\
    \ much the conductor winding departs from a purely radial orientation.\n\nThe\
    \ oblique cross-section is fully parameterized by two inclination angles and two\
    \ side lengths. The radial angle $\\alpha$ pairs with the [vertical angle](name:vertical_angle_of_poloidal_field_coil)\
    \ $\\beta$ \u2014 measured from the vertical $+\\hat{Z}$ direction \u2014 to define\
    \ both side orientations, while [major_length_of_poloidal_field_coil](name:major_length_of_poloidal_field_coil)\
    \ and [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil) give\
    \ the corresponding alpha-side and beta-side lengths.\n\nThis angle is a fixed\
    \ geometric design parameter derived from coil engineering drawings and used in\
    \ computing cross-sectional area, mutual inductance, and electromagnetic force\
    \ distributions in poloidal field coil systems. The analogous first inclination\
    \ angle for iron core segments is described by [alpha_angle_of_iron_core_segment](name:alpha_angle_of_iron_core_segment).\n\
    \nSign convention: Positive when the alpha-side of the cross-section is inclined\
    \ counter-clockwise from $+\\hat{R}$ (toward $+\\hat{Z}$) in the poloidal $(R,\
    \ Z)$ plane."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_angle_of_poloidal_field_coil
  - name:major_length_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  - name:alpha_angle_of_iron_core_segment
  sources:
  - dd_path: pf_active/coil/element/geometry/oblique/alpha
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-geometry-oblique-alpha
    dd_documentation:
      leaf: Inclination of first angle TBD
