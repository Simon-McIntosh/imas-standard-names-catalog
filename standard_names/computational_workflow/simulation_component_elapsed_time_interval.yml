name: simulation_component_elapsed_time_interval
status: draft
cocos_transformation_type: one_like
description: Duration of simulated time over which a workflow component last computed
  its results, in seconds.
documentation: "The simulation component elapsed time interval $\\Delta t_{\\mathrm{comp}}$\
  \ records the span of physical (simulation) time covered by the most recent execution\
  \ of a given physics actor within the workflow cycle. For a transport solver stepping\
  \ from $t_n$ to $t_{n+1}$, $\\Delta t_{\\mathrm{comp}} = t_{n+1} - t_n$; for an\
  \ equilibrium code called once per cycle, it equals the cycle's time step. This\
  \ quantity enables diagnosis of sub-cycling strategies where different actors advance\
  \ at different rates: a fast MHD stability module may use $\\Delta t \\sim 10^{-6}$\
  \ s while a slow transport solver steps at $\\Delta t \\sim 10^{-3}$\u2013$10^{-1}$\
  \ s. Comparing $\\Delta t_{\\mathrm{comp}}$ across actors helps identify bottlenecks\
  \ and verify temporal-coupling fidelity. See `simulation_current_time` for the global\
  \ clock and `convergence_iteration_count` for the number of sub-iterations within\
  \ a component step."
