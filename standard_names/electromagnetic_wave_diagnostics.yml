- name: vertical_coordinate_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the reflectometer antenna center position\
    \ in the IMAS cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z_{\text{ant}}$ defines the height of the
    reflectometer antenna center along the machine axis in the right-handed cylindrical
    $(R, \phi, Z)$ system, where $Z$ increases vertically upward. This coordinate
    is essential for determining the line of sight and the probing beam trajectory
    into the plasma; together with the major radius $R_{\text{ant}}$, it fully specifies
    the antenna location. Typical reflectometer antennas are positioned at heights
    between $-0.5\,\text{m}$ and $+0.5\,\text{m}$ relative to the tokamak midplane,
    depending on the diagnostic port allocation. The companion quantity [major_radius_of_electron_cyclotron_launcher_mirror](name:major_radius_of_electron_cyclotron_launcher_mirror)
    gives the radial positioning of a related microwave component.


    Sign convention: Positive when the antenna center lies above the machine midplane
    ($Z=0$) in the cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:major_radius_of_electron_cyclotron_launcher_mirror
  sources:
  - id: dd:reflectometer_profile/channel/antenna_detection/centre/z
    dd_path: reflectometer_profile/channel/antenna_detection/centre/z
    status: composed
  - id: dd:reflectometer_profile/channel/antenna_emission/centre/z
    dd_path: reflectometer_profile/channel/antenna_emission/centre/z
