- name: neutral_beam_mass
  kind: scalar
  status: active
  description: Mass of one neutral atom in the injected beam species, determined by
    its isotope and including the bound-electron contribution.
  documentation: 'The quantity is the isotope-dependent inertial mass assigned to
    one neutral atom in the injected beam species. It describes an individual beam
    particle, not the total beam mass or mass flow.


    The atomic mass is expressed as


    $$

    m_b = M_b u

    $$


    where $m_b$ is the mass of one beam atom, $M_b$ is its numerical atomic mass in
    atomic mass units, and $u$ is the atomic mass unit. The neutral-atom convention
    includes the nucleus and bound electrons.


    The quantity applies before beam-particle ionization and is distinct from [fast-ion
    atomic number](name:fast_ion_atomic_number), which identifies nuclear proton count
    rather than particle mass.'
  unit: u
  physics_domain: particle_measurement_diagnostics
  links:
  - name:fast_ion_atomic_number
  sources:
