- name: thermal_energy_of_plant_component_port
  kind: scalar
  status: draft
  description: Cumulative thermal energy extracted through a cooling-loop port on
    a plant component since the start of the plasma pulse, obtained by time-integrating
    the measured coolant enthalpy balance.
  documentation: 'The thermal energy of a plant component port is the total heat removed
    by the cooling loop of that component, accumulated from pulse start to the current
    measurement time. It is the time-integral of the instantaneous [thermal power
    extracted at the port](name:thermal_power_of_plant_component_port), making it
    a running calorimetric total rather than a rate quantity.


    The defining relation is:


    $$

    E_\text{th}(t) = \int_0^t P_\text{th}(t'') \, dt''

    $$


    where $P_\text{th}$ is the instantaneous extracted thermal power (in W) and the
    lower integration limit is the start of the pulse.


    The integrand $P_\text{th}$ is itself derived from the coolant enthalpy balance
    $P_\text{th} = \dot{m} c_p (T_\text{out} - T_\text{in})$, where $\dot{m}$ is the
    coolant mass flow rate, $c_p$ is the specific heat capacity of the coolant, and
    $T_\text{out}$ and $T_\text{in}$ are the [outlet](name:coolant_temperature_at_outlet)
    and [inlet](name:coolant_temperature_at_inlet) coolant temperatures. This cumulative
    measure is used in pulse-integrated heat load accounting for plasma-facing components
    and cooling circuits, complementing the instantaneous power signal for assessing
    total energy deposition over a discharge.'
  unit: J
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:thermal_power_of_plant_component_port
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
  sources:
  - id: dd:calorimetry/group/component/energy_cumulated
    dd_path: calorimetry/group/component/energy_cumulated
    status: composed
- name: thermal_power_of_plant_component_port
  kind: scalar
  status: draft
  description: Thermal power transfer rate at a plant component port, obtained from
    the coolant enthalpy change along the associated flow path. It is positive when
    the coolant removes heat from the component, so the coolant enthalpy increases
    from inlet to outlet.
  documentation: 'Thermal power of a plant component port is the instantaneous rate
    of thermal energy transfer between a component and the coolant circuit connected
    through that port. It represents the port contribution to the component heat balance:
    positive values correspond to heat extraction by the coolant, while negative values
    correspond to heat delivered from the coolant to the component.


    For a port $p$, the enthalpy-balance definition is


    $$

    P_{\mathrm{th},p} = \dot{m}_p\left(h_{\mathrm{out},p}-h_{\mathrm{in},p}\right)
    \simeq \dot{m}_p c_{p,\mathrm{f}}\left(T_{\mathrm{out},p}-T_{\mathrm{in},p}\right)

    $$


    where $P_{\mathrm{th},p}$ is the port thermal power in W, $\dot{m}_p$ is the non-negative
    coolant mass-flow magnitude in kg s$^{-1}$ along the associated inlet-to-outlet
    path, $h_{\mathrm{in},p}$ and $h_{\mathrm{out},p}$ are coolant specific enthalpies
    in J kg$^{-1}$, $T_{\mathrm{in},p}$ and $T_{\mathrm{out},p}$ are the corresponding
    inlet and outlet coolant temperatures, and $c_{p,\mathrm{f}}$ is the coolant specific
    heat capacity in J kg$^{-1}$ K$^{-1}$ when the constant-property temperature form
    is adequate. If a signed [coolant flow](name:coolant_flow_of_plant_component_port)
    is used, its positive direction defines the inlet-to-outlet path for evaluating
    the [inlet](name:coolant_temperature_at_inlet) and [outlet](name:coolant_temperature_at_outlet)
    temperatures or enthalpies.


    In practice this quantity is computed calorimetrically from synchronized coolant
    flow, temperature, pressure, and fluid-property data. The full enthalpy form is
    preferred for compressible fluids, strong property variation, boiling, condensation,
    or mixtures; the $c_p\Delta T$ approximation is appropriate for single-phase coolant
    over a limited temperature range. Time integration gives the corresponding thermal
    energy transferred through the port.


    Typical magnitudes are strongly component dependent: values may be near 0 W when
    there is little flow or little temperature rise, kW scale for small actively cooled
    plant services, and MW scale for major heat-extraction ports. The sign and magnitude
    should be interpreted together with the associated coolant-flow direction and
    inlet/outlet temperature measurements.


    Sign convention: Positive when the coolant enthalpy increases along the associated
    inlet-to-outlet flow path, corresponding to heat removed from the component by
    the coolant.'
  unit: W
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
  - name:thermal_energy_of_plant_component_port
  - name:total_thermal_power_at_outlet
  - name:net_thermal_power_of_breeder_blanket_module
  sources:
  - id: dd:balance_of_plant/power_plant/system/component/port/power_thermal
    dd_path: balance_of_plant/power_plant/system/component/port/power_thermal
    status: attached
  - id: dd:calorimetry/group/component/power
    dd_path: calorimetry/group/component/power
    status: composed
- name: vertical_angle_of_camera
  kind: scalar
  status: draft
  description: Vertical angular field of view of the camera, defined as the total
    angular span covered along the detector-plane vertical direction.
  documentation: 'Vertical angle of a camera is the vertical field-of-view width:
    the total angular span imaged between the lower and upper edges of the active
    detector area along the detector-plane vertical direction. It is an angular aperture,
    not a signed pointing or elevation angle, so it is reported as a non-negative
    value in radians.


    For an ideal rectilinear optical model with an effective focal length, the vertical
    field of view is commonly approximated by:


    $$

    \theta_v = 2\arctan\left(\frac{h}{2 f_\mathrm{eff}}\right)

    $$


    where $\theta_v$ is the vertical angular field of view, $h$ is the active detector
    height in meters, and $f_\mathrm{eff}$ is the effective focal length in meters.
    This relation assumes a rectilinear projection and an effective focal length that
    already includes the relevant optical configuration.


    In practice, the value is obtained from optical design parameters, laboratory
    calibration, or a ray-tracing model of the camera and its lenses. For distorted,
    telecentric, or otherwise non-rectilinear optics, the field of view is better
    determined from the calibrated viewing rays at the vertical detector edges, or
    equivalently from the difference between the upper and lower vertical viewing-angle
    bounds of the detector pixels.


    Typical values for diagnostic cameras range from about 0.05-1 rad, with narrow
    views used for localized high-resolution imaging and wider views used to cover
    larger plasma-facing regions.'
  unit: rad
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_angle_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/field_of_view_vertical
    dd_path: camera_ir/channel/camera/field_of_view_vertical
    status: composed
- name: vertical_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the mechanical interface where a sensor attaches
    to its support, measured in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate of a sensor attachment point locates the
    mechanical interface between a sensor and its support along the $Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame. It identifies the height
    of the attachment point relative to the chosen machine origin, commonly the machine
    midplane.


    The coordinate is the projection of the attachment-point position onto the vertical
    basis direction:


    $$

    Z_\mathrm{attach} = \mathbf{r}_\mathrm{attach} \cdot \hat{Z}

    $$


    where $\mathbf{r}_\mathrm{attach}$ is the position vector of the attachment point
    relative to the coordinate origin and $\hat{Z}$ is the vertical unit vector of
    the right-handed cylindrical $(R, \phi, Z)$ frame. This $Z$ coordinate is the
    vertical component; it should not be confused with the horizontal Cartesian $y$
    coordinate in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame,
    where $\hat{z}=\hat{Z}$.


    This quantity is determined from mechanical design information, CAD geometry,
    alignment surveys, or installation metrology. Together with the horizontal attachment-point
    coordinates, it fixes the spatial location of the sensor mounting interface for
    geometry registration and interpretation of diagnostic signals.


    Representative values span the vertical extent of diagnostic mounts, typically
    about $-5$-$5$ m for medium-size devices and potentially beyond $\pm 10$ m for
    large devices, depending on the chosen origin and vessel size.


    Sign convention: Positive when the attachment point lies above the machine midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_coordinate_of_sensor_attachment_point
  - name:y_coordinate_of_sensor_attachment_point
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/z
    dd_path: operational_instrumentation/sensor/attachement_points/z
    status: composed
- name: vertical_direction_unit_vector
  kind: scalar
  status: draft
  description: Vertical (Z) projection of a direction unit vector encoding the spatial
    orientation of a diagnostic or hardware device in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: "The vertical direction unit vector component gives the $Z$-axis\
    \ projection of a normalized orientation vector assigned to a diagnostic element\
    \ or hardware device. For any direction unit vector, the three components in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame \u2014 where $R$ is the major\
    \ radius in meters, $\\phi$ the toroidal angle in radians, and $Z$ the vertical\
    \ height in meters \u2014 satisfy the unit-magnitude constraint:\n\n$$\nu_R^2\
    \ + u_\\phi^2 + u_Z^2 = 1\n$$\n\nwhere $u_R$, $u_\\phi$, and $u_Z$ are the radial,\
    \ toroidal, and vertical projections respectively, each bounded to $[-1, 1]$.\n\
    \nThis component appears across a broad range of plasma-facing instrumentation\
    \ and beam-steering systems, characterizing the upward or downward tilt of infrared\
    \ camera channels, operational sensor orientations, shattered pellet injector\
    \ cones, electron cyclotron launcher mirror movement directions, and neutron detector\
    \ lines of sight. For equatorial diagnostics the vertical component is near zero;\
    \ strongly up-looking or down-looking devices approach $\\pm 1$. The analogous\
    \ horizontal projection is given by [x_direction_unit_vector](name:x_direction_unit_vector),\
    \ and together these components form the full parent [direction_unit_vector](name:direction_unit_vector)\
    \ orientation.\n\nSign convention: Positive when the direction vector points in\
    \ the direction of increasing $Z$ (upward along the machine vertical axis)."
  unit: '1'
  physics_domain: mechanical_measurement_diagnostics
