name: gyrokinetic_eigenmode_perturbed_parallel_vector_potential_weight
status: draft
cocos_transformation_type: one_like
description: Fractional amplitude of the perturbed parallel vector potential $\delta
  A_\parallel$ relative to the total perturbed field amplitude for a gyrokinetic eigenmode.
documentation: "The perturbed parallel vector potential weight $w_{A_\\parallel}$\
  \ is defined as $w_{A_\\parallel} = |\\delta \\hat{A}_\\parallel| \\, / \\, \\sum_f\
  \ |\\delta \\hat{F}_f|$, where the sum runs over all perturbed field components\
  \ (typically the electrostatic potential $\\delta \\hat{\\phi}$, the parallel vector\
  \ potential $\\delta \\hat{A}_\\parallel$, and possibly $\\delta \\hat{B}_\\parallel$),\
  \ each normalized to gyrokinetic reference scales. This dimensionless ratio characterizes\
  \ the electromagnetic content of the eigenmode: purely electrostatic modes yield\
  \ $w_{A_\\parallel} \\approx 0$, while strongly electromagnetic instabilities such\
  \ as kinetic ballooning modes or micro-tearing modes produce $w_{A_\\parallel} \\\
  sim 0.1$\u2013$0.5$ or higher. It is a diagnostic output of linear gyrokinetic solvers\
  \ (GS2, GENE, GKW) used to classify mode character and assess the importance of\
  \ magnetic flutter transport. See also the normalized perturbed parallel vector\
  \ potential and the electrostatic potential eigenfunction."
