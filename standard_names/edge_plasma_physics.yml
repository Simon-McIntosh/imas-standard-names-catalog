- name: electron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron number density at the plasma boundary (separatrix), the last
    closed flux surface separating confined plasma from the scrape-off layer.
  documentation: 'Electron density at the plasma boundary is the electron number density
    evaluated on the separatrix, the last closed magnetic flux surface. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, with $R$ major radius, $\phi$ toroidal angle,
    and $Z$ vertical height, this surface separates closed magnetic field lines in
    the confined plasma from open field lines in the scrape-off layer.


    Using the normalized toroidal-flux radius $\rho_{\mathrm{tor,norm}}$ as a flux-surface
    label, the separatrix value is the confined-side limit:


    $$

    n_{e,\mathrm{sep}} = \lim_{\rho_{\mathrm{tor,norm}} \to 1^-} n_e(\rho_{\mathrm{tor,norm}})

    $$


    where $n_e$ is the electron number density and $\rho_{\mathrm{tor,norm}}=1$ labels
    the separatrix. Together with the boundary electron temperature, it determines
    the boundary electron pressure through the inline relation $p_{e,\mathrm{sep}}
    = n_{e,\mathrm{sep}} T_{e,\mathrm{sep}}$ when $T_e$ is expressed as an energy
    per electron.


    In practice, this quantity is obtained by mapping edge electron-density measurements
    onto magnetic flux surfaces from an equilibrium reconstruction. Common inputs
    include Thomson scattering, reflectometry, and interferometry constrained by fitted
    pedestal or scrape-off-layer density shapes; the largest uncertainties often come
    from separatrix position, steep edge gradients, and diagnostic calibration.


    Typical values in tokamak H-mode edge plasmas are about $0.3-3 \times 10^{19}$
    m$^{-3}$, with lower values possible in low-density or limiter-like plasmas and
    higher values in strongly fueled, high-density discharges.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  - name:electron_temperature_at_plasma_boundary
  - name:electron_density_at_pedestal
  - name:gradient_of_electron_density
  sources:
