- name: current_due_to_lower_hybrid_current_drive
  kind: scalar
  status: active
  description: "Net toroidal plasma current driven non-inductively by lower-hybrid\
    \ slow waves through wave\u2013particle interactions, contributing to the total\
    \ non-inductive current."
  documentation: 'This quantity is the net toroidal plasma current attributable to
    lower-hybrid current drive. It represents the lower-hybrid contribution to the
    plasma current and excludes inductive current and non-wave-driven non-inductive
    contributions.


    $$

    I_{\mathrm{LH}} = \int_{A_p} j_{\phi,\mathrm{LH}}\,\mathrm{d}A

    $$


    where $I_{\mathrm{LH}}$ is the lower-hybrid-driven current, $j_{\phi,\mathrm{LH}}$
    is the toroidal component of the lower-hybrid-driven current density, and $A_p$
    is a poloidal cross-sectional area of the plasma. The quantity is a whole-plasma
    net current, so oppositely directed local contributions may partially cancel.
    It is a wave-driven contribution within [current due to wave-driven current drive](name:current_due_to_wave_driven_current_drive)
    and is distinct from [current due to electron cyclotron current drive](name:current_due_to_electron_cyclotron_current_drive).


    Sign convention: Positive when the lower-hybrid-driven current flows in the direction
    of increasing toroidal angle $\phi$.'
  unit: A
  physics_domain: auxiliary_heating
