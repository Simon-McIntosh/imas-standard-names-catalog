- name: perturbed_magnetic_field
  kind: scalar
  status: draft
  description: Normalized perturbed parallel magnetic field eigenmode component in
    local linear gyrokinetic simulations, representing the electromagnetic fluctuation
    along the guide field.
  documentation: The normalized perturbed parallel magnetic field $\delta B_{\|}/B_0$
    is a dimensionless quantity characterizing the electromagnetic fluctuation of
    the magnetic field along the equilibrium guide field direction in local linear
    gyrokinetic simulations. It is defined as the parallel component of the perturbed
    magnetic vector potential normalized to the equilibrium magnetic field strength
    $B_0$ and the perpendicular wavenumber $k_\perp$, satisfying $\delta B_{\|} =
    - i k_\perp \delta A_{\|}$. Typical values range from $10^{-6}$ to $10^{-1}$,
    depending on plasma beta and the mode being considered (e.g., kinetic ballooning
    modes yield larger values than ion temperature gradient modes). The quantity is
    resolved in the perpendicular wavenumber plane spanned by $k_x$ (radial binormal
    wavenumber, m$^{-1}$) and $k_y$ (poloidal binormal wavenumber, m$^{-1}$).
  unit: '1'
  physics_domain: turbulence
  links:
  - name:radial_particle_flux
  - name:flux_surface_averaged_energy_flux
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/fields/b_field_parallel_perturbed_norm
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/fields/b_field_parallel_perturbed_norm
    status: composed
  - id: dd:gyrokinetics_local/non_linear/fields_intensity_1d/b_field_parallel_perturbed_norm
    dd_path: gyrokinetics_local/non_linear/fields_intensity_1d/b_field_parallel_perturbed_norm
    status: attached
- name: radial_particle_flux
  kind: scalar
  status: draft
  description: "Normalized radial particle flux driven by the perturbed parallel magnetic\
    \ field component, resolved in the radial dimension of the IMAS cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: "The radial particle flux \u0393<sub>r</sub> quantifies the net outward\
    \ (or inward) transport of particles across flux surfaces due to electromagnetic\
    \ fluctuations at the gyrokinetic scale. It is normalized to a reference gyrokinetic\
    \ flux unit (e.g., n<sub>ref</sub> c<sub>s</sub> \u03C1<sub>s</sub><sup>2</sup>/a),\
    \ making it dimensionless. The flux is driven by the perturbed magnetic-field\
    \ component parallel to the equilibrium field ($\\delta B_\\parallel$) via the\
    \ $\\tilde{\\mathbf{E}} \\times \\mathbf{B}$ drift nonlinearity, where $\\tilde{\\\
    mathbf{E}}$ is the fluctuating electric field and $\\mathbf{B}$ is the equilibrium\
    \ magnetic field. This radial component isolates the transport perpendicular to\
    \ flux surfaces, as opposed to the poloidal or toroidal projections. Typical values\
    \ in gyrokinetic simulations of core tokamak turbulence range from $10^{-4}$ to\
    \ $10^{-2}$ (normalized units) for ion-scale modes, with sign indicating net inward\
    \ (negative) or outward (positive) transport. The flux is computed from a velocity-space\
    \ integral of the perturbed gyrocenter distribution function and the radial component\
    \ of the magnetic drift. This quantity is a specialization of the more generic\
    \ [particle_flux](name:particle_flux) and relates to the [turbulent_energy_flux](name:turbulent_energy_flux)\
    \ via the convective heat transport channel. It is distinct from the [toroidal_momentum_flux](name:toroidal_momentum_flux),\
    \ which involves the parallel momentum density. The [beta](name:beta) measures\
    \ the electromagnetic strength that modifies the fluctuation amplitude and thus\
    \ the flux magnitude.\n\nSign convention: Positive when the net particle flux\
    \ is directed outward (from the magnetic axis toward the plasma boundary)."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_flux
  - name:turbulent_energy_flux
  - name:toroidal_momentum_flux
  - name:beta
  arguments:
  - name: particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:gyrokinetics_local/non_linear/fluxes_5d_rotating_frame/particles_b_field_parallel
    dd_path: gyrokinetics_local/non_linear/fluxes_5d_rotating_frame/particles_b_field_parallel
    status: composed
- name: upper_triangularity_of_flux_surface
  kind: scalar
  status: draft
  description: A dimensionless shaping parameter quantifying the asymmetry of the
    upper half of a tokamak flux surface, defined as (R_upper - R_geo)/a, where R_upper
    is the radial distance at the upper midplane and R_geo is the geometric center
    radius.
  documentation: 'Upper triangularity $\delta_{\text{upper}}$ is a dimensionless shaping
    parameter that measures the D-shaped elongation of the upper half of a magnetic
    flux surface in a tokamak. It is defined as:


    $$

    \delta_{\text{upper}} = \frac{R_{\text{upper}} - R_{\text{geo}}}{a},

    $$


    where $R_{\text{upper}}$ is the major radius coordinate in the IMAS cylindrical
    $(R, \phi, Z)$ frame at the upper midplane (the intersection of the flux surface
    with the horizontal plane at $Z = Z_{\text{axis}} + \kappa a$, with $\kappa$ the
    elongation), $R_{\text{geo}}$ is the geometric center radius of the flux surface
    (the midpoint between the innermost and outermost radial extents of the surface
    at the outboard midplane), and $a$ is the minor radius.


    A positive $\delta_{\text{upper}}$ corresponds to a D-shaped cross-section with
    the inward-pointing apex toward the machine symmetry axis. Typical values range
    from 0 (elliptical shape) to approximately 0.5 (highly triangular), with values
    between 0.2 and 0.4 common in H-mode plasmas.


    This quantity is of primary interest in gyrokinetic turbulence simulation codes,
    where it affects the magnetic drift frequency and geometry of flux surfaces, thereby
    influencing microinstability growth rates and turbulent transport levels.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:lower_triangularity_of_flux_surface
  - name:triangularity_of_separatrix
  - name:flux_surface_averaged_energy_flux
  sources:
