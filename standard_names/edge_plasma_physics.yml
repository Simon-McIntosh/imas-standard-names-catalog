- name: parallel_ion_heat_convection_velocity
  kind: scalar
  status: active
  description: Signed field-aligned convection velocity for transporting aggregate
    bulk-ion thermal energy in the parallel ion energy balance. It is a species-level
    intensive velocity, interpreted as the density-weighted mean over all ion charge
    states.
  documentation: 'Signed field-aligned convection velocity for transporting aggregate
    bulk-ion thermal energy in the parallel ion energy balance is the scalar coefficient
    multiplying bulk-ion thermal enthalpy density in the convective part of the parallel
    ion energy flux. It is defined along the local magnetic-field unit vector and
    describes the charge-state-aggregated bulk-ion population, not a single ion charge
    state.


    The defining relation to the convective contribution to the parallel ion energy
    flux is


    $$

    q_{\parallel,i}^{\mathrm{conv}} = \frac{5}{2}\, n_i T_i\, v_{\parallel,\mathrm{heat}}^{i}

    $$


    where $q_{\parallel,i}^{\mathrm{conv}}$ is the convective contribution to the
    [parallel ion energy flux](name:parallel_ion_energy_flux), $n_i$ is the bulk-ion
    number density, $T_i$ is the bulk-ion temperature expressed as particle energy,
    and $v_{\parallel,\mathrm{heat}}^{i}$ is this velocity. The factor $5/2$ is the
    monatomic ideal-gas enthalpy convention.


    This quantity is an effective heat-convection coefficient, not the total ion flow
    velocity, conductive heat flux, or total ion energy flux. As a species-level intensive
    quantity, it is the density-weighted mean of the corresponding charge-state-resolved
    ion heat-convection velocities over all ion charge states, with weights given
    by the charge-state number densities; the charge-state-resolved counterpart is
    [effective thermal ion charge-state energy velocity due to convection](name:effective_thermal_ion_charge_state_energy_velocity_due_to_convection).
    It is the parallel component of [ion heat convection velocity] and is distinct
    from [parallel total ion energy convection velocity](name:parallel_total_ion_energy_convection_velocity).


    Sign convention: Positive when the convective contribution to the parallel ion
    energy flux is directed along the local magnetic-field unit vector $\hat{\mathbf{b}}
    = \mathbf{B}/|\mathbf{B}|$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_ion_energy_flux
  - name:effective_thermal_ion_charge_state_energy_velocity_due_to_convection
  - name:parallel_total_ion_energy_convection_velocity
