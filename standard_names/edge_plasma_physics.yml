      coordinates:
      - summary/time
    enhanced_context:
      description: Argon (Ar).
      kind: template
- name: toroidal_argon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "Toroidal component in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame of the argon-ion bulk-flow velocity at the last closed flux surface."
  documentation: 'This quantity is the local toroidal component of the argon-ion bulk-flow
    velocity evaluated at the plasma boundary, identified with the last closed flux
    surface. It is a pointwise boundary value rather than an average over that flux
    surface.


    The charge-state-aggregated toroidal velocity is defined by


    $$

    V_{\mathrm{Ar},\phi} = \frac{\sum_z n_{\mathrm{Ar},z} v_{\mathrm{Ar},z,\phi}}{\sum_z
    n_{\mathrm{Ar},z}}

    $$


    where $V_{\mathrm{Ar},\phi}$ and $v_{\mathrm{Ar},z,\phi}$ are toroidal velocity
    components in m s$^{-1}$, $n_{\mathrm{Ar},z}$ is the argon-ion number density
    in m$^{-3}$, and $z$ indexes argon ion charge states. The toroidal component is
    defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The local value is distinct from the [toroidal flux-surface-averaged argon velocity
    at the plasma boundary](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary),
