- name: safety_factor_at_plasma_boundary
  kind: scalar
  status: active
  description: Signed field-line winding ratio evaluated on the outermost closed magnetic
    flux surface, counting toroidal turns per poloidal circuit at the plasma boundary.
  documentation: 'The boundary safety factor is the signed helical winding of magnetic
    field lines on the outermost closed magnetic flux surface, counting toroidal turns
    per poloidal circuit at the plasma boundary.


    It is defined by the differential ratio of toroidal to poloidal magnetic flux:


    $$

    q_{\mathrm{b}} = \left.\frac{d\Phi_{\mathrm{tor}}}{d\Phi_{\mathrm{pol}}}\right|_{\mathrm{b}}

    $$


    where $q_{\mathrm{b}}$ is the safety factor at the boundary, $\Phi_{\mathrm{tor}}$
    is toroidal magnetic flux, $\Phi_{\mathrm{pol}}$ is poloidal magnetic flux, and
    the subscript $\mathrm{b}$ denotes evaluation on the plasma-boundary flux surface.


    The quantity applies to the single outermost closed flux surface defining the
    plasma boundary. It is a flux-surface value, not a volume average, region integral,
    or value at an interior normalized-flux surface; in particular, it is distinct
    from the safety factor at normalized poloidal magnetic flux 0.95, commonly represented
    by [safety factor at normalized poloidal magnetic flux equal to 0.95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95).


    This quantity is the boundary-specific instance of the general [safety factor](name:safety_factor),
    obtained by evaluating the same flux-increment relation on the plasma-boundary
    surface.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  - name:safety_factor
  arguments:
