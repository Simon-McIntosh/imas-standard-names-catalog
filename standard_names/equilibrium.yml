- name: magnetic_shear
  kind: scalar
  status: draft
  description: Dimensionless logarithmic radial derivative of the safety factor, measuring
    how rapidly neighboring magnetic field lines change helicity between flux surfaces.
  documentation: 'Magnetic shear expresses the radial variation of field-line pitch
    on nested magnetic flux surfaces. It controls how quickly neighboring field lines
    separate in poloidal angle after toroidal transits, making it central to ideal
    MHD stability, tearing-mode behavior, and drift-wave turbulence. It is defined
    from the same field-line helicity described by the [safety factor](name:safety_factor),
    with special values often interpreted together with [safety factor at the magnetic
    axis](name:safety_factor_at_magnetic_axis) and [minimum safety factor](name:minimum_safety_factor).


    For a toroidal-flux radius coordinate $\rho_{\rm tor}$ and safety factor $q(\rho_{\rm
    tor})$, the local magnetic shear $s$ is


    $$

    s = \frac{\rho_{\rm tor}}{q}\frac{d q}{d \rho_{\rm tor}}

    $$


    where $\rho_{\rm tor}$ labels flux surfaces and $q$ is the number of toroidal
    turns per poloidal circuit. The definition is a logarithmic radial derivative,
    so large magnitude indicates rapid change of magnetic pitch across adjacent flux
    surfaces.


    Magnetic shear is computed from an equilibrium reconstruction after obtaining
    the $q$ distribution from external magnetic measurements and, when available,
    internal constraints such as motional-Stark-effect polarimetry or Faraday polarimetry.
    Because it involves differentiating $q$, smoothing and uncertainty propagation
    are important near extrema such as the location associated with [poloidal magnetic
    flux at minimum safety factor].


    Representative values are near zero at a broad or flat $q$ minimum, about 0.5-2
    in many tokamak cores, negative in reversed-shear regions, and several units in
    steep edge pedestal or scrape-off-layer gradients.


    Sign convention: Positive when the safety factor increases outward with increasing
    toroidal-flux radius coordinate.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:safety_factor_at_magnetic_axis
  - name:minimum_safety_factor
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/magnetic_shear
    dd_path: equilibrium/time_slice/profiles_1d/magnetic_shear
    status: composed
- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the first-wall location geometrically nearest
    to the plasma boundary, used to identify the radial location of the limiting gap.
  documentation: 'This quantity is the major-radius coordinate of the wall point that
    minimizes the distance to the plasma boundary in a poloidal cross-section. It
    locates the radial position of the nearest material surface relative to the boundary
    and complements the [vertical coordinate of the closest wall point](name:vertical_coordinate_of_closest_wall_point).
    Together with the [plasma-boundary gap distance], it identifies where the limiting
    wall clearance occurs.


    In the right-handed cylindrical $(R, \phi, Z)$ system, with $R$ measured from
    the toroidal symmetry axis and $Z$ the vertical coordinate, the coordinate is


    $$

    R_{\mathrm{cw}} = R\left(\mathbf{x}_{\mathrm{cw}}\right), \qquad \mathbf{x}_{\mathrm{cw}}
    = \operatorname*{arg\,min}_{\mathbf{x}\in W} d\left(\mathbf{x}, B_p\right)

    $$


    where $\mathbf{x}_{\mathrm{cw}}$ is the closest wall point, $W$ is the wall surface
    or contour, $B_p$ is the plasma-boundary contour, and $d$ is the shortest geometric
    distance in the poloidal plane.


    The value is computed from an equilibrium boundary and a geometric description
    of the surrounding wall or limiter. It is used in boundary-clearance analysis
    alongside the [major radius of the plasma boundary](name:major_radius_of_plasma_boundary)
    and the [major radius of the plasma-boundary gap reference point](name:major_radius_of_plasma_boundary_gap_reference_point).


    Typical values range from about 0.5-4 m in present medium-size tokamaks and about
    4-9 m in reactor-scale devices, depending on wall geometry and plasma position.


    Sign convention: Positive when the closest wall point has positive major radius
    measured outward from the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ system.'
  unit: m
  physics_domain: equilibrium
