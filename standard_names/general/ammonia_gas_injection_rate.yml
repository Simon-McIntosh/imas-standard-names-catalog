name: ammonia_gas_injection_rate
status: draft
cocos_transformation_type: one_like
description: Rate of ammonia (NH$_3$) molecules injected into the vacuum vessel, expressed
  as particles per second.
documentation: The ammonia gas injection rate $\Gamma_{\mathrm{NH_3}}$ (in s$^{-1}$)
  quantifies the instantaneous molecular flow of ammonia delivered through the gas-injection
  system. Ammonia injection is used in some experiments for nitrogen seeding studies
  (NH$_3$ dissociates in the plasma edge to release N and H), providing a nitrogen
  source without the need for a dedicated N$_2$ line. Typical injection rates range
  from $10^{18}$ to $10^{21}\;\mathrm{s^{-1}}$ depending on plasma volume and desired
  impurity concentration. The rate is measured by calibrated piezoelectric valves
  or mass-flow controllers upstream of the injection port. See also `argon_gas_injection_rate`
  for an analogous noble-gas injection quantity and `ammonia_accumulated_gas_injection`
  for the time-integrated total.
