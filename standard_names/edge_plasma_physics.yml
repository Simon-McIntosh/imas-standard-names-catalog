- name: parallel_flux_surface_averaged_electric_field_at_plasma_boundary
  kind: scalar
  status: active
  description: "Flux-surface-averaged field-aligned electric field at the separatrix,\
    \ using the electric-field\u2013magnetic-field contraction normalized by a signed\
    \ reference toroidal field rather than a local unit-vector projection."
  documentation: 'This quantity is the flux-surface-averaged field-aligned electric-field
    measure on the plasma boundary, or separatrix. It is distinct from the local projection
    of the electric field onto the magnetic-field unit vector.


    It is defined by


    $$

    \mathcal{E}_{\parallel,\mathrm{FS}} = \left\langle \frac{\mathbf{E}\cdot\mathbf{B}}{B_\phi^{\mathrm{ref}}}
    \right\rangle_{\mathrm{sep}}

    $$


    where $\mathbf{E}$ is the electric-field vector, $\mathbf{B}$ is the magnetic-field
    vector, $B_\phi^{\mathrm{ref}}$ is the signed reference toroidal magnetic-field
    component, and the brackets denote the prescribed flux-surface average over the
    separatrix. In the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ basis,
    the reference component is $B_\phi^{\mathrm{ref}} = \mathbf{B}^{\mathrm{ref}}\cdot\hat{\phi}$.
    The quantity therefore differs from the local [parallel electric field at the
    plasma boundary](name:parallel_electric_field_at_plasma_boundary), which uses
    the local magnetic-field magnitude for projection.


    Sign convention: Positive when the separatrix average of $\mathbf{E}\cdot\mathbf{B}/B_\phi^{\mathrm{ref}}$
    is positive, with positive $B_\phi^{\mathrm{ref}}$ directed toward increasing
    toroidal angle $\phi$.'
  unit: V.m^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_electric_field_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/e_field_parallel/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-e_field_parallel-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix_average/e_field_parallel
      parent: Average on the magnetic surface of (e_field.b_field) / B0, where B0
        is global_quantities/b0/value
      data_type: FLT_1D
      unit: V.m^-1
      coordinates:
      - summary/time
    enhanced_context:
      description: "Flux-surface average of the parallel electric field (E_parallel),\
        \ defined as the average of (E\xB7B)/B0 over the separatrix magnetic surface.\
        \ Used as a local plasma parameter at the core-SOL boundary in discharge characterization."
      kind: template
- name: parallel_heat_flux
  kind: scalar
  status: active
  description: Signed component of the plasma heat-flux vector along the local magnetic-field
    direction, separating field-aligned energy transport from cross-field heat transfer.
  documentation: 'Parallel heat flux is the signed scalar projection of the plasma
    heat-flux vector onto the local magnetic-field direction. It is the field-aligned
    component of the total [heat flux](name:heat_flux), not the magnitude of the full
    heat-flux vector.


    The defining relation is


    $$

    q_\parallel = \mathbf{q} \cdot \hat{\mathbf{b}} = \mathbf{q} \cdot \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $q_\parallel$ and $\mathbf{q}$ are heat-flux quantities measured in W.m$^{-2}$,
    $\mathbf{B}$ is the local magnetic-field vector measured in tesla, $|\mathbf{B}|$
    is its magnitude, and $\hat{\mathbf{b}}$ is the corresponding dimensionless unit
    vector. The quantity is undefined where the magnetic-field magnitude vanishes.


    Sign convention: Positive when energy is transported in the direction of the local
    magnetic-field vector $\mathbf{B$.'
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:heat_flux
  arguments:
  - name: heat_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
