- name: alpha_angle_of_plasma_filament
  description: |-
    Signed inclination of the first side of a plasma-filament oblique
    cross-section, measured counterclockwise from the outward radial direction
    in the poloidal plane.
  documentation: |-
    This quantity is the signed inclination of the first side of the oblique
    parallelogram representing an individual plasma-filament cross section. It
    specifies the orientation of that side in the poloidal plane relative to the
    outward radial direction.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the angle is
    defined by

    $$
    \alpha = \operatorname{atan2}\left(\mathbf{a}_1\cdot\hat{\mathbf{e}}_Z,\,\mathbf{a}_1\cdot\hat{\mathbf{e}}_R\right)
    $$

    where $\alpha$ is the first-side inclination, $\mathbf{a}_1$ is the directed
    vector along the first parallelogram side, $\hat{\mathbf{e}}_R$ is the
    outward radial unit vector in the direction of increasing $R$,
    $\hat{\mathbf{e}}_Z$ is the positive vertical unit vector, and
    $\operatorname{atan2}$ returns the signed angle from the radial projection
    toward the vertical projection.

    The quantity applies separately to each discrete plasma-carrying filament
    and is not an aggregate orientation averaged over the plasma. It describes
    only the first side of the oblique cross section; it is not the inclination
    of the second side or either side length.

    The companion [tilt angle of a plasma
    filament](name:tilt_angle_of_plasma_filament) specifies the inclination of
    the other parallelogram side, while the [major length of a plasma
    filament](name:major_length_of_plasma_filament) and [minor length of a
    plasma filament](name:minor_length_of_plasma_filament) specify
    cross-sectional dimensions. Together these geometric quantities define the
    filament cross-section orientation and shape.

    Sign convention: Positive when the directed first side is rotated
    counterclockwise from the outward radial direction toward the positive
    vertical direction in the poloidal plane.
  unit: rad

- name: beta
  description: |-
    Global beta compares volume-averaged total perpendicular plasma pressure
    with combined magnetic pressure; for a common pressure, 1/beta =
    1/beta_toroidal + 1/beta_poloidal because B^2 = B_toroidal^2 + B_poloidal^2.
  documentation: |-
    Beta-family quantities are dimensionless equilibrium measures comparing
    total perpendicular plasma pressure, aggregated over the plasma volume, with
    a magnetic-pressure scale. The scale may be based on the toroidal field, the
    poloidal field, or their combined magnitude; a normalized toroidal form
    applies an additional scaling to the toroidal beta.

    For a common volume-averaged pressure and orthogonal toroidal and poloidal
    magnetic-field components, the component betas satisfy

    $$
    \frac{1}{\beta} = \frac{1}{\beta_{\mathrm{tor}}} + \frac{1}{\beta_{\mathrm{pol}}}
    $$

    where $\beta$ is the beta based on the combined magnetic field,
    $\beta_{\mathrm{tor}}$ is the [toroidal beta](name:toroidal_beta), and
    $\beta_{\mathrm{pol}}$ is the [poloidal beta](name:poloidal_beta). The
    relation follows because the toroidal and poloidal fields add in quadrature
    to give the squared total field strength.

    This parent covers global equilibrium measures using total perpendicular
    plasma pressure aggregated over the plasma volume and all populations
    included in that total. It is not a local pressure ratio, a species-specific
    pressure measure, or a magnetic-pressure quantity by itself.

    The toroidal and poloidal children differ by the magnetic-field reference
    used in the denominator. The [normalized toroidal
    beta](name:normalized_toroidal_beta) is a separately scaled toroidal-beta
    variant; it is not substituted for the unnormalized toroidal beta in the
    reciprocal relation.
  unit: '1'

- name: current_density
  description: |-
    Current density is the vector flux density of conventional electric charge,
    equal to electric current per unit area normal to the flow. It points in the
    direction of positive charge transport and includes all charged-particle
    contributions unless a narrower current-density quantity is specified.
  documentation: |-
    Current density $\mathbf{J}$ is the vector density of conventional electric
    charge flux at a point. It represents the signed flow of electric charge
    carried by charged particles, with direction defined by positive charge
    transport.

    A kinetic definition is the charge-weighted first velocity moment of the
    particle distribution functions:

    $$
    \mathbf{J}(\mathbf{x},t) = \sum_s q_s \int \mathbf{v}\, f_s(\mathbf{x},\mathbf{v},t)\, d^3v
    $$

    where $\mathbf{x}$ is position, $t$ is time, $s$ indexes charged species,
    $q_s$ is the species charge, $\mathbf{v}$ is particle velocity, and $f_s$ is
    the velocity-space distribution function. In quasistatic equilibrium it is
    the source term in Ampere's law, $\nabla \times \mathbf{B} = \mu_0
    \mathbf{J}$ when displacement current is neglected, and steady charge
    conservation gives $\nabla \cdot \mathbf{J}=0$.

    This quantity excludes displacement-current density and is distinct from a
    scalar electric current, which is the flux of $\mathbf{J}$ through a
    specified surface. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height, the geometric components are the projections along $(\hat{R},
    \hat{\phi}, \hat{Z})$: radial_current_density, toroidal_current_density, and
    vertical_current_density. The full vector has direction rather than a single
    scalar sign; scalar components and projections inherit the positive
    direction of their defining basis vector or unit vector.
  unit: A.m^-2

- name: current_of_passive_structure
  description: |-
    Current in a passive structure is the signed rate of conventional charge
    transport circulating toroidally through one axisymmetric member.
  documentation: |-
    Current of passive structure

    The current $I$ is defined by

    $$
    I = \int_S \mathbf{J}\cdot\hat{\phi}\,dS
    $$

    where $S$ is the member's full poloidal cross-section, $\mathbf{J}$ is the
    [conventional electric current density](name:current_density), and $dS$ is a
    surface-area element. The vector $\hat{\phi}$ is the toroidal unit vector in
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    This quantity integrates current density over one member's cross-section; it
    is not a sum over all passive structures and excludes plasma and active-coil
    currents. When the specified member is a passive loop, it equals the
    [current of that loop](name:current_of_passive_loop).

    Sign convention: Positive when conventional electric current flows in the
    direction of increasing toroidal angle $\phi$.
  unit: A

- name: current_of_plasma_filament
  description: |-
    Electric current carried by a plasma current-carrying filament element is
    the signed toroidal current assigned to a single discrete element in an
    axisymmetric filamentary representation of the distributed plasma current.
  documentation: |-
    Electric current carried by a plasma current-carrying filament element is
    the signed toroidal current assigned to one discrete element in an
    axisymmetric filamentary representation of the distributed plasma current.
    It represents that element's contribution to the plasma current rather than
    a geometric property of the element.

    For filament element $k$, the current is the cross-sectional integral of the
    toroidal plasma current density over that element:

    $$
    I_k = \int_{A_k} j_\phi \, dA
    $$

    where $I_k$ is the electric current carried by plasma filament element $k$,
    $A_k$ is the area of the plasma filament element in the poloidal
    cross-section, $j_\phi$ is the toroidal component of the plasma current
    density in the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major
    radius, $\phi$ is toroidal angle, $Z$ is vertical height, and $dA$ is a
    differential area element of the poloidal cross-section.

    The scope is one plasma current-carrying filament element, with no
    aggregation over multiple elements. It applies only to plasma-current
    filaments in the axisymmetric representation and excludes currents in coils,
    passive conductors, and other non-plasma structures. It is an integrated
    current, not a current density and not a geometric descriptor; the element
    geometry is described separately by [inner
    radius](name:inner_radius_of_plasma_filament),
    [height](name:height_of_plasma_filament), and area.

    The represented [plasma current](name:plasma_current) of a collection of
    plasma current-carrying filament elements is the algebraic sum of their
    signed filament currents.

    Sign convention: Positive when the current of the plasma filament element
    flows in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height; this is
    counter-clockwise when viewed from the positive $Z$ direction.
  unit: A

- name: electron_density
  description: |-
    Number density of electrons counts free electrons per physical volume,
    excluding electrons bound in atoms, molecules, or ions.
  documentation: |-
    Number density of electron

    The underlying local density is defined by

    $$
    n_e = \int f_e(\mathbf{v})\,d^3v
    $$

    where $n_e$ is the electron number density, $f_e$ is the electron
    phase-space number distribution at the location and time considered,
    $\mathbf{v}$ is electron velocity, and $d^3v$ is the velocity-space volume
    element. The integral extends over all velocities represented by the
    distribution.

    The unqualified quantity imposes no thermal or nonthermal population
    restriction and specifies no particular plasma region. Electrons bound in
    atoms, molecules, or ions are excluded. No line, surface, or volume
    averaging is implicit.

    [Thermal electron density](name:thermal_electron_density) and [fast electron
    density](name:fast_electron_density) restrict the electron population to
    thermal and suprathermal electrons, respectively. [Total electron
    density](name:total_electron_density) explicitly includes the complete
    free-electron population, summing thermal and nonthermal contributions.

    Spatially averaged forms retain this underlying number-density meaning:
    [line-averaged electron density](name:line_averaged_electron_density) is the
    local density integrated along a specified plasma chord and divided by its
    length, while [volume-averaged electron
    density](name:volume_averaged_electron_density) is the local density
    integrated over the plasma volume inside the last closed flux surface and
    divided by that volume.
  unit: m^-3

- name: elongation_of_flux_surface
  description: |-
    Elongation of a flux surface is the ratio of its poloidal cross-section’s
    vertical extent to its radial extent, independent of overall size.
  documentation: |-
    Elongation of flux surface

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the defining
    relation is:

    $$
    \kappa = (Z_{\max} - Z_{\min})/(R_{\max} - R_{\min})
    $$

    where $\kappa$ is the elongation, $Z_{\max}$ and $Z_{\min}$ are the maximum
    and minimum vertical coordinates of the cross-section, and $R_{\max}$ and
    $R_{\min}$ are its maximum and minimum major radii.

    The quantity applies to an individual flux surface, not an average over
    nested surfaces. For an elliptical cross-section, it equals the ratio of the
    vertical to horizontal semi-axes; the extent-based definition does not
    require an ellipse. It is not restricted to the plasma boundary: evaluating
    it there gives the [elongation of the plasma
    boundary](name:elongation_of_plasma_boundary).

    The [derivative of elongation with respect to normalized minor
    radius](name:derivative_of_elongation_of_flux_surface_with_respect_to_normalized_minor_radius)
    describes how this ratio changes between neighboring surfaces, rather than
    the shape ratio itself.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: '1'

- name: elongation_of_plasma_boundary
  description: |-
    Elongation of the plasma boundary is the ratio of its poloidal
    cross-section’s vertical extent to its radial extent, independent of overall
    size.
  documentation: |-
    Elongation of plasma boundary

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the defining
    relation is:

    $$
    \kappa = (Z_{\max} - Z_{\min})/(R_{\max} - R_{\min})
    $$

    where $\kappa$ is the elongation, $Z_{\max}$ and $Z_{\min}$ are the maximum
    and minimum vertical coordinates of the plasma-boundary cross-section, and
    $R_{\max}$ and $R_{\min}$ are its maximum and minimum major radii.

    The extrema apply to the full plasma-boundary cross-section, not an average
    over nested surfaces. Equivalently, elongation is the vertical half-height
    divided by the geometric minor radius, defined as half the major-radius
    width. For an elliptical cross-section with vertically and radially aligned
    axes, it equals the vertical-to-horizontal semi-axis ratio; the extent-based
    definition does not require an ellipse.

    This quantity is the [elongation of a flux
    surface](name:elongation_of_flux_surface) evaluated specifically at the
    plasma boundary. The [derivative of elongation with respect to normalized
    minor
    radius](name:derivative_of_elongation_of_flux_surface_with_respect_to_normalized_minor_radius)
    instead describes how this ratio changes between neighboring surfaces,
    rather than the boundary shape ratio itself.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: '1'

- name: external_loop_voltage
  description: |-
    Electromotive-force contribution to the plasma loop voltage caused by
    changing externally generated poloidal magnetic flux, including flux linked
    through active coils and passive conducting structures.
  documentation: |-
    This quantity is the inductive electromotive-force contribution to the
    plasma loop voltage produced by time-varying poloidal magnetic flux
    generated by active coil circuits and magnetically coupled passive
    conducting structures. It excludes resistive voltage drops and other
    non-inductive contributions.

    The contribution is defined by Faraday's law:

    $$
    V_{\mathrm{ext}}(t) = -\frac{d\Phi_{\mathrm{ext}}(t)}{dt}
    $$

    where $\Phi_{\mathrm{ext}}$ is the externally generated poloidal magnetic
    flux linked by the considered toroidal plasma circuit and $t$ is time. It
    contributes to the total [loop voltage at the plasma
    boundary](name:loop_voltage_at_plasma_boundary); currents in passive
    conductors are represented by the linked-flux response of structures such as
    those described by [current of passive
    structure](name:current_of_passive_structure).

    Sign convention: Positive when the induced electromotive force has a
    positive line integral in the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: V

- name: flux_surface_averaged_major_radius
  description: |-
    Flux-surface-averaged nonnegative perpendicular distance from the toroidal
    symmetry axis to points on a nested magnetic flux surface, giving the mean
    major-radius coordinate in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Major radius is the nonnegative perpendicular distance from the toroidal
    symmetry axis to a geometric point or specified location. For this
    flux-surface-averaged quantity, that distance is averaged over each nested
    magnetic flux surface in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    The flux-surface average of major radius is defined by

    $$
    \langle R\rangle_\psi = \frac{\oint_\psi R\,dl/B_p}{\oint_\psi dl/B_p}
    $$

    where $\langle R\rangle_\psi$ is the averaged major-radius coordinate,
    $\psi$ is the magnetic-flux label identifying the surface, $l$ is poloidal
    arc length along that surface, and $B_p$ is the magnitude of the poloidal
    magnetic field. The contour integral extends around the complete poloidal
    intersection of the nested magnetic flux surface.

    This quantity applies to a complete magnetic flux surface and aggregates the
    local [major radius](name:major_radius) using the flux-surface weighting
    defined by the inverse poloidal-field magnitude. It is therefore distinct
    from pointwise major radius and contains no point-specific or localized
    evaluation.

    The quantity is the flux-surface-averaged counterpart of [major
    radius](name:major_radius). It must not be confused with
    [flux-surface-averaged inverse of major
    radius](name:flux_surface_averaged_inverse_of_major_radius), which averages
    the reciprocal $1/R$ rather than averaging $R$ itself; consequently, it is
    not generally the reciprocal of that neighboring average.
  unit: m

- name: flux_surface_averaged_square_of_magnetic_field_magnitude
  description: |-
    Flux-surface average of the squared magnitude of the total equilibrium
    magnetic field, providing a geometric coefficient for equilibrium and
    neoclassical transport relations.
  documentation: |-
    This quantity is the surface-averaged squared strength of the total magnetic
    field on a nested magnetic flux surface. It is a geometric metric
    coefficient used in equilibrium descriptions and in bounce-averaged and
    neoclassical transport relations.

    The flux-surface average is defined by

    $$
    \left\langle B^2 \right\rangle_\psi = \frac{\displaystyle\oint_{S(\psi)} \frac{B^2}{\lvert\nabla\psi\rvert}\,dS}{\displaystyle\oint_{S(\psi)} \frac{1}{\lvert\nabla\psi\rvert}\,dS}
    $$

    where $B^2$ is the [square of the magnetic-field
    magnitude](name:square_of_magnetic_field_magnitude), $\psi$ is the poloidal
    magnetic-flux label of the surface, $S(\psi)$ is the closed magnetic flux
    surface with that label, $\nabla\psi$ is the gradient of the flux label, and
    $dS$ is the surface-area element.

    The quantity applies to the total equilibrium magnetic field, including all
    of its components, and is aggregated over each closed flux surface with the
    inverse-$\lvert\nabla\psi\rvert$ weighting shown above. It is not the
    pointwise value of $B^2$, the square of a flux-surface-averaged
    magnetic-field magnitude, or a single magnetic-field component.

    It is the flux-surface-averaged form of
    [square_of_magnetic_field_magnitude](name:square_of_magnetic_field_magnitude).
    It differs from
    [flux_surface_averaged_magnetic_field_magnitude](name:flux_surface_averaged_magnetic_field_magnitude),
    which averages the field magnitude before squaring, and from
    [flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude](name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude),
    which averages its reciprocal.
  unit: T^2

- name: gap_at_closest_wall_point
  description: |-
    Gap at the closest-wall point measures the minimum Euclidean separation
    between the plasma separatrix and limiter or wall material.
  documentation: |-
    Gap at closest wall point

    The gap is defined by

    $$
    g = \min_{\mathbf{x}\in\Gamma_{\mathrm{sep}},\,\mathbf{y}\in\Gamma_{\mathrm{pw}}}\left\|\mathbf{x}-\mathbf{y}\right\|_2
    $$

    where $g$ is the gap, $\Gamma_{\mathrm{sep}}$ is the plasma separatrix,
    $\Gamma_{\mathrm{pw}}$ is the combined eligible limiter-or-wall boundary,
    $\mathbf{x}$ and $\mathbf{y}$ are physical points on those respective
    boundaries, and $\|\mathbf{x}-\mathbf{y}\|_2$ denotes their Euclidean
    separation.

    The minimum is taken over all eligible boundary-point pairs, rather than
    averaged over the wall or restricted to a major-radius separation. The gap
    is nonnegative and vanishes when the boundaries touch.

    For identical boundaries, its value equals the [gap at the plasma
    boundary](name:gap_at_plasma_boundary). The [vertical coordinate of the
    closest-wall point](name:vertical_coordinate_of_closest_wall_point)
    specifies the vertical position of the evaluation locus, not its clearance
    from the plasma.
  unit: m

- name: gap_at_outboard_midplane
  description: |-
    Gap at the outboard midplane is the major-radius separation between the
    inner and outer separatrices in a double-null or near-double-null
    equilibrium.
  documentation: |-
    Gap at outboard midplane

    The separation is defined by

    $$
    g = \left|R_{\mathrm{outer}}-R_{\mathrm{inner}}\right|
    $$

    where $g$ is the gap, and $R_{\mathrm{outer}}$ and $R_{\mathrm{inner}}$ are
    the major-radius coordinates of the outer and inner separatrices. Both
    coordinates are evaluated at the same vertical height, selected by the inner
    separatrix's outboard-midplane point. In the right-handed cylindrical
    $(R,\phi,Z)$ frame, $R$ denotes major radius, $\phi$ toroidal angle, and $Z$
    vertical height.

    The quantity is a local separation, not a spatial average or a minimum
    distance over the separatrix surfaces. It is nonnegative and vanishes when
    the two separatrices coincide at the evaluation point.

    Unlike [gap at closest wall point](name:gap_at_closest_wall_point), this
    quantity compares two magnetic separatrices rather than a plasma boundary
    and a material surface. It also differs from [radial separatrix distance at
    outboard midplane](name:radial_separatrix_distance_at_outboard_midplane),
    which compares a measurement position mapped along its flux surface with a
    separatrix.

    The low-field-side equatorial midplane: the point of maximum major radius on
    the flux surface in question. For a value at the separatrix intersection use
    outboard_midplane_separatrix. Where $R = \max_{S} R,\quad R >
    R_{\mathrm{axis}}$, $S$ is the magnetic flux surface the point lies on;
    $R_{\mathrm{axis}}$ is major radius of the magnetic axis.
  unit: m

- name: height_of_plasma_filament
  description: |-
    Full vertical extent of the rectangular cross-section of a discrete plasma
    current-carrying filament element, measured along the machine’s vertical
    axis.
  documentation: |-
    This quantity is the full vertical dimension of the rectangular
    cross-section associated with one discrete plasma current-carrying filament.
    It is a geometric extent, not the filament current or its current density.

    The height $H$ is defined by the difference between the upper and lower
    vertical coordinates:

    $$
    H = Z_{\mathrm{upper}} - Z_{\mathrm{lower}}
    $$

    where $Z_{\mathrm{upper}}$ and $Z_{\mathrm{lower}}$ are the upper and lower
    coordinates in the right-handed cylindrical $(R,\phi,Z)$ frame, with $Z$
    denoting vertical height and $\hat{Z}$ the vertical basis direction.

    This quantity applies only to the vertical dimension of the rectangular
    filament cross-section. The horizontal full width is defined separately by
    [plasma filament width](name:plasma_filament_width), while the in-plane
    thickness is defined by thickness of plasma filament.
  unit: m

- name: inner_radius_of_plasma_filament
  description: |-
    Inner radius of a plasma filament is the geometric radius of the inner
    circular boundary of the annular cross-section representing a
    current-carrying plasma filament. It marks the boundary between the hollow
    central region and the conducting annular region.
  documentation: |-
    Inner radius of a plasma filament is the geometric radius of the inner
    circular boundary of the annular cross-section representing a
    current-carrying plasma filament. It marks the boundary between the hollow
    central region and the conducting annular region.

    For the inner circular boundary in the poloidal cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame, the inner radius
    $a_\mathrm{inner}$ is the distance from the filament cross-section center
    $(R_c, Z_c)$ to any point $(R, Z)$ on that boundary:

    $$
    a_\mathrm{inner} = \sqrt{(R - R_c)^2 + (Z - Z_c)^2}
    $$

    where $R$ is major radius, $Z$ is vertical height, $(R_c, Z_c)$ is the
    center of the annular cross-section, and $(R, Z)$ is a point on the inner
    circular boundary.

    This quantity applies to the hollow-disk annular representation of a
    discrete plasma current-carrying filament and denotes the smaller of its two
    concentric boundary radii. The current-carrying cross-section occupies the
    region outside $a_\mathrm{inner}$ and inside $a_\mathrm{outer}$, where
    $a_\mathrm{outer}$ is the [outer radius of the plasma
    filament](name:outer_radius_of_plasma_filament), with $0 \le
    a_\mathrm{inner} \le a_\mathrm{outer}$.

    Together with the [outer radius of the plasma
    filament](name:outer_radius_of_plasma_filament), this quantity determines
    the width of the plasma filament as the radial thickness of the annulus and
    the area of the plasma filament as the area of the current-carrying annular
    region. It excludes the outer boundary radius itself, the annular width or
    area, the [height of the plasma filament](name:height_of_plasma_filament),
    the curvature radius of a noncircular contour segment, and the major radius
    of a filament centerline about the toroidal symmetry axis.
  unit: m

- name: inverse_of_major_radius
  description: |-
    Reciprocal major-radius coordinate for a geometric point or specified
    location, serving as a positive geometric factor in toroidal equilibrium
    relations.
  documentation: |-
    Reciprocal major radius is the inverse of the perpendicular distance from
    the toroidal symmetry axis to a geometric point or specified location. It is
    a geometric quantity used to represent the radial dependence of toroidal
    equilibrium relations.

    $$
    R^{-1} = \frac{1}{R}
    $$

    where $R$ is the [major radius](name:major_radius), namely the radial
    coordinate in the right-handed cylindrical $(R,\phi,Z)$ frame.

    At the parent level, the quantity is evaluated pointwise or at a specified
    geometric location and has no averaging or integration implied. It is
    positive wherever the major radius is positive, and it is distinct from the
    major radius itself because it reverses the radial dependence rather than
    specifying the distance from the symmetry axis.

    A flux-surface-averaged instance applies the flux-surface averaging
    operation to this reciprocal quantity;
    [flux_surface_averaged_inverse_of_major_radius](name:flux_surface_averaged_inverse_of_major_radius)
    is the corresponding geometric coefficient obtained by averaging over a
    magnetic flux surface.
  unit: m^-1

- name: flux_surface_averaged_inverse_of_major_radius
  description: |-
    Flux-surface average of reciprocal major radius, providing a geometric
    equilibrium coefficient for toroidal geometry in flux-coordinate equations.
  documentation: |-
    This quantity is the geometric average of the reciprocal major radius over a
    complete magnetic flux surface. It is an equilibrium metric coefficient
    independent of plasma species, population, magnetic-field component, and
    physical transport process.

    For a magnetic flux surface identified by the label $\psi$, the defining
    flux-surface average is:

    $$
    g_{1/R}(\psi) =
    \left\langle \frac{1}{R} \right\rangle_\psi =
    \frac{\displaystyle\oint_{\mathcal{S}(\psi)}
    \frac{dS}{|\nabla\psi|}\,\frac{1}{R}}
    {\displaystyle\oint_{\mathcal{S}(\psi)}
    \frac{dS}{|\nabla\psi|}}
    $$

    Here $g_{1/R}$ denotes the metric coefficient, $R$ is the major-radius
    coordinate, $\psi$ is the magnetic flux-surface label, $\mathcal{S}(\psi)$
    is the corresponding closed magnetic flux surface, $dS$ is its surface-area
    element, and $\nabla\psi$ is the spatial gradient of the flux-surface label.
    The coordinate $R$ belongs to the right-handed cylindrical $(R,\phi,Z)$
    frame, where $\phi$ is the toroidal angle and $Z$ is the vertical
    coordinate.

    The aggregation is over the entire closed flux surface using the
    flux-surface weighting shown in the defining relation; this is not the local
    reciprocal radius at a point. The quantity is distinct from the flux-surface
    average of reciprocal squared major radius, [flux-surface-averaged inverse
    square of major
    radius](name:flux_surface_averaged_inverse_of_square_of_major_radius).

    It is the flux-surface-averaged specialization of [inverse major
    radius](name:inverse_of_major_radius): the averaging operator is applied to
    the local reciprocal-major-radius quantity without introducing a species,
    field-component, or process restriction.
  unit: m^-1

- name: inverse_of_square_of_magnetic_field_magnitude
  description: |-
    Reciprocal square of total magnetic-field strength, providing a positive
    magnetic-geometry factor for equilibrium and flux-surface-averaged transport
    relations.
  documentation: |-
    The inverse square of total magnetic-field strength is a local
    magnetic-geometry factor that increases as the total field weakens and
    remains positive wherever the field magnitude is nonzero.

    It is defined as the reciprocal of the [square of magnetic-field
    magnitude](name:square_of_magnetic_field_magnitude):

    $$
    B^{-2} = \frac{1}{B^2} = \frac{1}{\lvert \mathbf{B} \rvert^2}
    $$

    where $\mathbf{B}$ is the total magnetic-field vector and $B$ is its
    magnitude.

    The quantity applies to the full magnetic field in an equilibrium plasma,
    including all vector components and without restriction to a particle
    population. At the parent level it is a local quantity with no flux-surface
    or volume aggregation; it is distinct from the squared field magnitude
    itself and from the reciprocal square of any selected field component.

    The [flux-surface-averaged inverse square of magnetic-field
    magnitude](name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude)
    is obtained by applying a flux-surface average to this local factor. The
    averaging is a separate aggregation operation and does not alter the
    reciprocal-square transformation.
  unit: T^-2

- name: flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude
  description: |-
    Flux-surface average of the reciprocal square of total magnetic-field
    strength, a geometric coefficient in neoclassical and flux-surface-averaged
    transport relations.
  documentation: |-
    This quantity is the flux-surface average of the reciprocal square of the
    total magnetic-field strength on a nested magnetic surface. It captures
    field-strength geometry independently of the magnetic-field direction.

    The defining relation is

    $$
    \left\langle \frac{1}{|\mathbf{B}|^2} \right\rangle_\psi
    =
    \frac{\displaystyle \int_{S(\psi)} |\mathbf{B}|^{-2}\,\frac{dS}{|\nabla\psi|}}
    {\displaystyle \int_{S(\psi)} \frac{dS}{|\nabla\psi|}}
    $$

    where $\mathbf{B}$ is the total magnetic-field vector, $|\mathbf{B}|$ is its
    magnitude, $\psi$ is the flux-surface label, $S(\psi)$ is the magnetic
    surface labeled by $\psi$, $dS$ is its surface-area element, and
    $\nabla\psi$ is the spatial gradient of the flux-surface label.

    The quantity applies to the complete magnetic flux surface and uses the
    inverse-$|\nabla\psi|$ weighting shown in the defining relation. It is not a
    pointwise inverse-square field value and has no selection by magnetic-field
    direction, component, species, or source.

    It is the flux-surface-averaged transformation of the parent [inverse square
    of magnetic-field
    magnitude](name:inverse_of_square_of_magnetic_field_magnitude), with the
    reciprocal square formed locally before averaging. It is distinct from
    [flux-surface-averaged magnetic-field
    magnitude](name:flux_surface_averaged_magnetic_field_magnitude) and
    [flux-surface-averaged square of magnetic-field
    magnitude](name:flux_surface_averaged_square_of_magnetic_field_magnitude),
    because nonlinear inversion and squaring do not commute with surface
    averaging.
  unit: T^-2

- name: magnetic_field
  description: |-
    Local total magnetic-induction vector in the right-handed cylindrical (R, φ,
    Z) frame, where R is major radius, φ is toroidal angle, and Z is vertical
    height; it does not select a source contribution, perturbation state,
    component, magnitude reduction, or evaluation locus.
  documentation: |-
    Local total magnetic-induction vector is the magnetic flux-density vector at
    a point, carrying both the local field direction and field strength. It is
    the unqualified parent quantity before selecting a source contribution,
    perturbation state, component, scalar reduction, spatial aggregation, or
    evaluation locus.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the vector resolves
    into radial, toroidal, and vertical components as

    $$
    \mathbf{B} = B_R\hat{\mathbf{R}} + B_\phi\hat{\boldsymbol{\phi}} + B_Z\hat{\mathbf{Z}}
    $$

    where $\mathbf{B}$ is this local total magnetic-induction vector; $B_R$ is
    its radial projection, $B_\phi$ is its [toroidal magnetic-field
    component](name:toroidal_magnetic_field), and $B_Z$ is its [vertical
    magnetic-field component](name:vertical_magnetic_field); and
    $\hat{\mathbf{R}}$, $\hat{\boldsymbol{\phi}}$, and $\hat{\mathbf{Z}}$ are
    the corresponding basis vectors. The frame is right-handed with
    $\hat{\mathbf{R}} \times \hat{\boldsymbol{\phi}} = \hat{\mathbf{Z}}$; $R$ is
    major radius measured from the symmetry axis, $\phi$ is toroidal angle
    increasing counterclockwise when viewed from above $+\hat{\mathbf{Z}}$, and
    $Z$ is vertical height.

    The quantity applies wherever a local magnetic induction is defined,
    including confined plasma and surrounding vacuum regions, and no particle
    species or population is selected or aggregated. It is pointwise and
    vector-valued: it is not the [magnetic field
    magnitude](name:magnetic_field_magnitude), a flux-surface-average magnetic
    field, or an extremum such as the [maximum magnetic
    field](name:maximum_magnetic_field). No cylindrical component, source
    contribution, perturbation state, or named locus is implied by the
    unqualified name.

    When a [magnetic vector potential](name:magnetic_vector_potential)
    $\mathbf{A}$ is used, $\mathbf{B} = \nabla \times \mathbf{A}$; $\mathbf{A}$
    is the magnetic vector potential and $\nabla \times$ is the curl operator,
    and a gage change affects $\mathbf{A}$ without changing $\mathbf{B}$.
    Source-qualified fields such as the [vacuum magnetic
    field](name:vacuum_magnetic_field) and [plasma magnetic
    field](name:plasma_magnetic_field) are vector contributions of the same kind
    and add vectorially when they belong to the same electromagnetic state; the
    [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field) is the
    toroidal projection of the vacuum contribution. The [reference magnetic
    field](name:reference_magnetic_field) is a reference total
    magnetic-induction vector of the same kind, not a source-specific
    contribution; the [toroidal magnetic field at the magnetic
    axis](name:toroidal_magnetic_field_at_magnetic_axis) is the toroidal
    projection evaluated at the magnetic-axis locus.

    Sign convention: Positive when the vacuum toroidal magnetic-field component
    is directed along increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: T

- name: magnetic_field_at_pedestal_top_high_field_side
  description: |-
    Magnetic field at the high-field-side pedestal top is the local total
    magnetic-induction vector evaluated at the high-field-side pressure-pedestal
    top. It retains field strength and direction before any component selection
    or magnitude reduction.
  documentation: |-
    Magnetic field at the high-field-side pedestal top is the local total
    magnetic-induction vector evaluated at the high-field-side pressure-pedestal
    top. It includes all directional components of the local magnetic field at
    that locus and preserves both field strength and direction.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ major radius,
    $\phi$ toroidal angle, and $Z$ vertical height, the vector may be decomposed
    as

    $$
    \mathbf{B} = B_R \hat{R} + B_\phi \hat{\phi} + B_Z \hat{Z}
    $$

    where $\mathbf{B}$ is the magnetic field at the high-field-side pedestal
    top, $B_R$, $B_\phi$, and $B_Z$ are its radial, toroidal, and vertical
    components at the same locus, and $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$ are
    the corresponding unit basis vectors.

    The scope is restricted to the high-field-side branch of the
    pressure-pedestal top, not to arbitrary plasma positions or to the
    low-field-side pedestal top. The high-field side is the smaller-major-radius
    side in the right-handed cylindrical $(R, \phi, Z)$ frame, where the
    toroidal magnetic-field magnitude is larger. The quantity is local at that
    locus; it is not a spatial average or a flux-surface average.

    This is a vector quantity, not the scalar [magnetic-field magnitude at the
    high-field-side pedestal
    top](name:magnetic_field_magnitude_at_pedestal_top_high_field_side), a
    single component, a projection, an absolute value, or a vacuum-field
    approximation. The scalar magnetic-field magnitude at the same locus is the
    Euclidean norm $|\mathbf{B}|$ of this vector and therefore removes
    directional information while retaining the shared high-field-side
    pedestal-top evaluation locus.

    Sign convention: Positive when a signed component of $\mathbf{B}$ points
    along the positive direction of the basis vector used for that component; in
    the right-handed cylindrical $(R, \phi, Z)$ frame these directions are
    $+\hat{R}$, increasing toroidal angle $\phi$, and $+\hat{Z}$.
  unit: T

- name: magnetic_flux
  description: |-
    Magnetic flux is the signed scalar surface integral of the magnetic field
    through an oriented surface. Its sign is set by the chosen surface
    orientation, while specializations identify the particular surface, field
    contribution, or averaging convention.
  documentation: |-
    Magnetic flux is a signed scalar associated with an oriented surface. It
    represents the net normal component of the magnetic field threading that
    surface; the flux itself is not a vector and is not directed, although its
    sign depends on the surface orientation.

    The magnetic flux $\Phi$ through an oriented surface $S$ is defined by the
    surface integral:

    $$
    \Phi(S) = \int_S \mathbf{B} \cdot d\mathbf{A}
    $$

    where $\Phi(S)$ is the magnetic flux through $S$, $S$ is the oriented
    surface, $\mathbf{B}$ is the [magnetic-field vector](name:magnetic_field),
    $d\mathbf{A}=\hat{\mathbf{n}}\,dA$ is the oriented area element,
    $\hat{\mathbf{n}}$ is the chosen unit normal to $S$, and $dA$ is the scalar
    surface-area element.

    The unqualified quantity denotes the net integral over the specified
    oriented surface with no source restriction and no averaging. More specific
    flux quantities supply the surface family, source contribution, projection,
    or weighting that narrows this definition.

    Magnetic flux is distinct from the local magnetic field, from a
    magnetic-field component or magnitude, from a flux-coordinate label
    normalized from a flux, and from a time derivative such as loop voltage.
    [Poloidal magnetic flux](name:poloidal_magnetic_flux) and [toroidal magnetic
    flux](name:toroidal_magnetic_flux) are specializations obtained by choosing
    different surfaces and orientations for the same integral; source-restricted
    or weighted quantities, such as [poloidal-current-weighted average external
    magnetic
    flux](name:poloidal_current_weighted_average_external_magnetic_flux), retain
    the magnetic-flux meaning while restricting the included magnetic field or
    applying the stated averaging convention.

    Sign convention: Positive when the net magnetic-field projection through the
    specified surface is along the chosen orientation of its area element.
  unit: Wb

- name: external_magnetic_flux
  description: |-
    External magnetic flux is the signed surface integral of the magnetic field
    generated by sources outside the plasma current distribution over an
    oriented surface.
  documentation: |-
    External magnetic flux is the signed surface integral of the magnetic field
    generated by sources outside the plasma current distribution over an
    oriented surface. It is the source-separated member of the [magnetic
    flux](name:magnetic_flux) family.

    The defining surface integral is:

    $$
    \Phi_{\mathrm{ext}}(S) = \int_S \mathbf{B}_{\mathrm{ext}} \cdot d\mathbf{A}
    $$

    where $\Phi_{\mathrm{ext}}(S)$ is the external magnetic flux associated with
    the oriented surface $S$, $\mathbf{B}_{\mathrm{ext}}$ is the magnetic-field
    vector produced by sources outside the plasma current distribution, and
    $d\mathbf{A}$ is the oriented surface-area element.

    The scope is the external-source contribution integrated over the complete
    surface specified by a concrete specialization. At this parent level, no
    poloidal or toroidal projection, spatial locus, or averaging weight is
    imposed; the quantity is a signed surface aggregate, not a local
    magnetic-field value, a flux-surface average, or a contribution generated by
    the plasma current itself.

    The child [average external magnetic
    flux](name:average_external_magnetic_flux) is a concrete poloidal
    specialization with averaging over the plasma cross-section. The related
    [current-weighted average external magnetic
    flux](name:current_weighted_average_external_magnetic_flux) uses
    plasma-current weighting for that aggregation; both remain source-separated
    instances of external magnetic flux.

    Sign convention: Positive when the net external magnetic field points along
    the positive normal of the oriented integration surface in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: Wb

- name: average_external_magnetic_flux
  description: |-
    Poloidal magnetic flux generated by external circuits and averaged over the
    plasma cross-section, with weighting defined by each concrete variant.
  documentation: |-
    External magnetic flux averaged over the plasma poloidal cross-section
    represents the externally generated contribution to the poloidal flux
    function, excluding flux produced by the plasma current. It is an
    averaging-level specialization of external magnetic flux; concrete variants
    can differ in their weighting and normalization.

    For a weighting function $w(\mathbf{x})$, the general weighted average is

    $$
    \langle \psi_{\rm ext} \rangle_w = \frac{\int_{\mathcal{P}} w(\mathbf{x})\,\psi_{\rm ext}(\mathbf{x})\,dS}{\int_{\mathcal{P}} w(\mathbf{x})\,dS}
    $$

    where $\psi_{\rm ext}(\mathbf{x})$ is the externally generated poloidal
    magnetic flux, $\mathbf{x}$ is position in the plasma poloidal cross-section
    $\mathcal{P}$, $w(\mathbf{x})$ is the prescribed averaging weight, and $dS$
    is the cross-sectional area element. The representative [current-weighted
    average external magnetic
    flux](name:current_weighted_average_external_magnetic_flux) uses the
    toroidal current density as $w$ and the plasma current as the normalization.

    Sign convention: Positive when the underlying poloidal flux is positive for
    a vertical magnetic field in the $+\hat{Z}$ direction of the right-handed
    cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ basis on the defining horizontal
    disk.
  unit: Wb

- name: current_weighted_average_external_magnetic_flux
  description: |-
    Current-weighted average external magnetic flux is the component-wise mean
    of magnetic flux produced by sources outside the plasma, weighted over the
    plasma current-carrying region by the corresponding current density. It
    excludes flux generated by the plasma current itself; concrete children
    specify components such as the poloidal component.
  documentation: |-
    Current-weighted average external magnetic flux is the component-wise mean
    of externally generated magnetic flux over the plasma current-carrying
    region. It represents the part of the magnetic flux linked by the plasma
    current that is generated by sources outside the plasma, with the plasma
    self-generated flux excluded.

    For any component $a$, the current-weighted component average is

    $$
    \overline{\Phi}_{\mathrm{ext},a}^{J}
    =
    \frac{\int_{\Omega_a} \Phi_{\mathrm{ext},a}(\mathbf{x})\, j_a(\mathbf{x})\, dA}
         {\int_{\Omega_a} j_a(\mathbf{x})\, dA}
    $$

    where $a$ labels a magnetic-flux component,
    $\overline{\Phi}_{\mathrm{ext},a}^{J}$ is the current-weighted average
    external magnetic-flux component, $\Phi_{\mathrm{ext},a}(\mathbf{x})$ is the
    externally generated magnetic-flux component at position $\mathbf{x}$,
    $j_a(\mathbf{x})$ is the corresponding plasma current-density component used
    as the weight, $\Omega_a$ is the current-carrying plasma cross-section for
    that component, and $dA$ is its area element. The denominator is the
    corresponding total plasma current component and must be nonzero.

    This parent quantity does not specify a particular magnetic-flux component
    or surface orientation. Concrete component names supply that specialization;
    for example, [poloidal current-weighted average external magnetic
    flux](name:poloidal_current_weighted_average_external_magnetic_flux) is the
    poloidal component. External magnetic flux includes contributions from
    active conductors and passive induced currents outside the plasma and
    excludes flux produced by the plasma current.

    Sign convention: Positive when the current-density-weighted integral of the
    selected external magnetic-flux component has the same sign as the total
    plasma current component used for its normalization, with both signs
    evaluated in the positive orientation of that component.
  unit: Wb

- name: magnetic_flux_due_to_diamagnetic_drift
  description: |-
    Vector magnetic-flux contribution of the pressure-gradient-driven
    diamagnetic response in a plasma equilibrium, defined relative to the
    corresponding reference magnetic field.
  documentation: |-
    The diamagnetic magnetic-flux contribution is the vector magnetic flux
    associated with the pressure-gradient-driven diamagnetic response in a
    plasma equilibrium, measured relative to a corresponding reference field
    without that response.

    For an integration surface $S$, the contribution is defined by

    $$
    \boldsymbol{\Phi}_{\mathrm{dia}} = \int_S \Delta \mathbf{B}_{\mathrm{dia}}\,dS
    $$

    where $\boldsymbol{\Phi}_{\mathrm{dia}}$ is the diamagnetic magnetic-flux
    vector, $\Delta \mathbf{B}_{\mathrm{dia}}$ is the equilibrium magnetic-field
    difference attributable to the pressure-gradient-driven diamagnetic
    response, and $dS$ is the scalar surface-area element on $S$.

    This quantity applies to the plasma equilibrium as a whole at the surface
    used to define the magnetic flux. It retains the vector component
    information and the aggregation over the selected surface; it is not
    restricted to a single axis projection, species, normalization, or spatial
    region.

    The reference-field subtraction excludes magnetic flux already present
    without the diamagnetic response and distinguishes this contribution from
    the total equilibrium magnetic flux. The [toroidal magnetic flux due to
    diamagnetic drift](name:toroidal_magnetic_flux_due_to_diamagnetic_drift) is
    the toroidal component of this general vector quantity.

    Components are resolved in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    Sign convention: Positive when a resolved magnetic-flux component points
    along the corresponding positive basis direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame; the toroidal component is positive toward
    increasing toroidal angle $\phi$.
  unit: Wb

- name: magnetic_shear_at_flux_surface
  description: |-
    Magnetic shear at a flux surface is the logarithmic derivative of the safety
    factor with respect to the outward normalized toroidal flux radius.
  documentation: |-
    Magnetic shear at flux surface

    The defining relation is

    $$
    \hat{s} = \frac{\rho}{q}\frac{dq}{d\rho}
    $$

    where $\hat{s}$ is the magnetic shear at the specified flux surface, $q$ is
    the safety factor, and $\rho$ is the normalized toroidal flux radius
    increasing outward from the magnetic axis. The derivative is taken with
    respect to that coordinate.

    This quantity is a single flux-surface evaluation, not an average over
    neighboring flux surfaces or an integral across a plasma region. The
    definition requires a nonzero safety factor and an existing derivative. It
    is distinct from the unnormalized safety-factor derivative and from magnetic
    shear defined using geometric minor radius; a nonlinear change of radial
    label generally changes the shear.

    The [magnetic shear at an internal transport
    barrier](name:magnetic_shear_at_internal_transport_barrier) is a
    locus-specific specialization of this quantity, using the same defining
    relation at the barrier's flux-surface location.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: '1'

- name: magnetic_shear_at_magnetic_axis
  description: |-
    Magnetic shear evaluated at the magnetic axis, defined as the limiting
    normalized logarithmic derivative of the safety factor with respect to
    normalized toroidal flux radius.
  documentation: |-
    Magnetic shear at the magnetic axis is the limiting value of [magnetic
    shear](name:magnetic_shear_at_flux_surface) as the flux-surface label
    approaches the magnetic axis.

    Using the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate)
    $\rho_{\mathrm{tor,norm}}$ as the radial label, with
    $\rho_{\mathrm{tor,norm}}=0$ at the magnetic axis, the defining relation is

    $$
    s_{\mathrm{axis}} = \lim_{\rho_{\mathrm{tor,norm}}\to 0} \frac{\rho_{\mathrm{tor,norm}}}{q}\frac{dq}{d\rho_{\mathrm{tor,norm}}}
    $$

    where $q$ is the safety factor and $s_{\mathrm{axis}}$ is the magnetic-shear
    limit. For a smooth equilibrium with finite [safety factor at the magnetic
    axis](name:safety_factor_at_magnetic_axis), this limit is zero. It therefore
    differs from evaluations on finite-radius surfaces such as [magnetic shear
    at the plasma boundary](name:magnetic_shear_at_plasma_boundary).

    Sign convention: Positive when $q^{-1}dq/d\rho_{\mathrm{tor,norm}}$ is
    positive as the normalized toroidal flux radius increases outward from the
    magnetic axis.
  unit: '1'

- name: major_length_of_plasma_filament
  description: |-
    Length of the major oblique side of a plasma-filament cross-section,
    inclined relative to the major-radius axis and distinct from the
    height-oriented side.
  documentation: |-
    Major length of a plasma filament is the Euclidean length of the oblique
    parallelogram side associated with the major-radius direction.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the side lies in the
    poloidal $R$-$Z$ cross-section and is defined by

    $$
    L_{\mathrm{major}} = \sqrt{(\Delta R)^2 + (\Delta Z)^2}
    $$

    where $L_{\mathrm{major}}$ is the major oblique-side length, $\Delta R$ is
    the difference in major-radius coordinates between the side endpoints, and
    $\Delta Z$ is the corresponding difference in vertical coordinates.

    This quantity applies to one discrete plasma current-carrying filament
    element and describes only its major oblique side. It is an individual
    geometric length, not a sum, average, or aggregate over filament elements,
    and it excludes the other oblique side represented by the [minor length of a
    plasma filament](name:minor_length_of_plasma_filament).

    It is the major-qualified component of length of a plasma filament,
    selecting the side associated with the major-radius direction rather than
    defining an additional length to be added to the parent quantity. Its
    inclination is described separately by the [inclination angle of a plasma
    filament](name:alpha_angle_of_plasma_filament).
  unit: m

- name: maximum_magnetic_field
  description: |-
    Largest value attained by a selected magnetic-field quantity over its
    specified evaluation domain, without fixing its source, projection,
    magnitude, or locus.
  documentation: |-
    The maximum magnetic-field quantity is the extremal value of a selected
    magnetic-field quantity evaluated over a specified domain. It is a
    domain-level reduction of the local [magnetic field](name:magnetic_field),
    rather than the local magnetic-field vector itself.

    The maximum operation can be represented abstractly as

    $$
    M = \max_{\mathbf{x}\in\mathcal{D}} Q(\mathbf{x})
    $$

    where $M$ is the resulting maximum magnetic-field value, $Q(\mathbf{x})$ is
    the selected local magnetic-field quantity, $\mathbf{x}$ is an evaluation
    point, and $\mathcal{D}$ is the specified evaluation domain.

    This parent fixes the maximum aggregation over the domain but imposes no
    particular magnetic-field source, physical state, projection, magnitude
    selection, population, or plasma or vacuum region. The result is one
    extremal value for the selected domain, not a local value, average,
    integral, or mode-resolved quantity.

    It is distinct from the local [magnetic field](name:magnetic_field) and does
    not by itself determine whether the selected quantity is a total field,
    source contribution, signed component, or field magnitude. The child
    [maximum magnetic-field magnitude](name:maximum_magnetic_field_magnitude)
    specializes this parent by selecting the magnitude of the total local
    magnetic-field vector before applying the maximum operation.
  unit: T

- name: minor_length_of_plasma_filament
  description: |-
    Length of the minor oblique parallelogram side of a plasma-filament element,
    inclined at angle beta to the vertical height axis.
  documentation: |-
    The minor oblique parallelogram-side length of a plasma-filament element is
    the Euclidean length of the side inclined at angle beta to the vertical
    height direction. It characterizes one side of the element's oblique
    cross-sectional geometry.

    The side length is defined by the separation of its two endpoints:

    $$
    \ell_\beta = \left\lVert \mathbf{x}_{\beta,2} - \mathbf{x}_{\beta,1} \right\rVert
    $$

    where $\ell_\beta$ is the minor side length, $\mathbf{x}_{\beta,1}$ and
    $\mathbf{x}_{\beta,2}$ are the position vectors of its endpoints, and
    $\lVert\cdot\rVert$ denotes the Euclidean norm. The inclination angle
    $\beta$ is measured relative to the vertical height direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    The quantity applies to one discrete plasma current-carrying filament
    element and is neither summed nor averaged over elements. It excludes the
    complementary major oblique side and therefore is distinct from [major
    length of the plasma filament](name:major_length_of_plasma_filament).

    This quantity specializes length of the plasma filament by selecting its
    minor, beta-inclined side. The paired major-length quantity selects the
    complementary oblique side of the same element.
  unit: m

- name: non_axisymmetric_magnetic_field
  description: |-
    Non-axisymmetric magnetic-field vector of the local vacuum induction
    generated by external coils, with its toroidally averaged component removed.
  documentation: |-
    The non-axisymmetric magnetic field $\mathbf{B}_{\rm NA}$ is the vector part
    of the external-coil vacuum [magnetic induction](name:magnetic_field) that
    varies with toroidal angle after its toroidally averaged component is
    removed. It retains the full field direction rather than selecting a
    cylindrical component or a magnitude.

    The non-axisymmetric component is defined by

    $$
    \mathbf{B}_{\rm NA}(R,\phi,Z) = \mathbf{B}_{\rm vac}(R,\phi,Z) - \left\langle \mathbf{B}_{\rm vac} \right\rangle_\phi(R,Z)
    $$

    where $\mathbf{B}_{\rm NA}$ is the non-axisymmetric magnetic induction,
    $\mathbf{B}_{\rm vac}$ is the magnetic induction generated by external coil
    currents with plasma-current contributions omitted, and $\langle
    \mathbf{B}_{\rm vac} \rangle_\phi$ is its average over the toroidal angle.
    The variables $R$, $\phi$, and $Z$ are respectively major radius, toroidal
    angle, and vertical height in the right-handed cylindrical $(R,\phi,Z)$
    frame.

    This quantity is a local vector field defined for the external-coil vacuum
    contribution, without restriction to a particular plasma population or
    spatial region. Its aggregation convention is the removal of the
    toroidal-angle average, so only non-axisymmetric toroidal variation remains.

    It excludes the toroidally symmetric vacuum field, magnetic induction
    generated by plasma currents, and any scalar magnitude reduction. It
    therefore does not represent the full local [magnetic
    induction](name:magnetic_field) when those omitted source contributions are
    present.

    The vector is the common parent for its cylindrical projections: the [radial
    non-axisymmetric magnetic
    field](name:radial_non_axisymmetric_magnetic_field), [toroidal
    non-axisymmetric magnetic
    field](name:toroidal_non_axisymmetric_magnetic_field), and [vertical
    non-axisymmetric magnetic
    field](name:vertical_non_axisymmetric_magnetic_field) each resolve this same
    vector along one direction of the right-handed cylindrical frame.

    Sign convention: Positive when a resolved component points along its
    corresponding positive basis direction in the right-handed cylindrical
    $(R,\phi,Z)$ frame.
  unit: T

- name: normal_non_axisymmetric_magnetic_field
  description: |-
    Signed normal projection of the external-coil vacuum magnetic field with its
    toroidally averaged component removed, evaluated on a generic control
    surface.
  documentation: |-
    Normal non-axisymmetric magnetic field is the signed component of the
    toroidally varying external-coil vacuum magnetic field normal to a generic
    control surface. It is a scalar projection evaluated at points on that
    surface, rather than the full magnetic-field vector.

    The defining projection is

    $$
    B_n(R,\phi,Z)=\mathbf{B}_{\rm NA}(R,\phi,Z)\cdot\hat{\mathbf{n}}(R,\phi,Z)
    $$

    where $B_n$ is the normal magnetic-field component, $\mathbf{B}_{\rm NA}$ is
    the [non-axisymmetric magnetic field](name:non_axisymmetric_magnetic_field),
    and $\hat{\mathbf{n}}$ is the oriented unit normal to the control surface.
    The coordinates $R$, $\phi$, and $Z$ are major radius, toroidal angle, and
    vertical height in the right-handed cylindrical $(R,\phi,Z)$ frame.

    This quantity applies to the external-coil vacuum contribution at each
    selected point of a generic control surface, which is not assumed to be a
    magnetic flux surface. Its aggregation convention is the inherited removal
    of the toroidal-angle average from the vacuum field; no surface or area
    average is implied.

    It excludes the toroidally symmetric vacuum field and magnetic-field
    contributions generated by plasma currents. It also excludes tangential
    components and is distinct from cylindrical projections such as the
    [vertical non-axisymmetric magnetic
    field](name:vertical_non_axisymmetric_magnetic_field); the normal direction
    is defined by the control surface rather than by the cylindrical basis.

    The scalar $B_n$ is the surface-normal component of the vector
    [non-axisymmetric magnetic field](name:non_axisymmetric_magnetic_field).
    Reversing the assigned orientation of the control-surface normal reverses
    $B_n$, while the parent vector itself is unchanged.

    Sign convention: Positive when the non-axisymmetric magnetic field points in
    the direction of the chosen positive unit normal to the control surface.
  unit: T

- name: normalized_minor_radius_of_flux_surface
  description: |-
    Dimensionless minor-radius label of a magnetic flux surface, obtained by
    normalizing its major-radius half-width to a specified positive reference
    length.
  documentation: |-
    This quantity is the dimensionless minor-radius label assigned to a magnetic
    flux surface from its radial extent in the right-handed cylindrical
    $(R,\phi,Z)$ frame.

    $$
    \rho_{\mathrm{minor}} = \frac{R_{\max}-R_{\min}}{2L_{\mathrm{ref}}}
    $$

    where $R_{\max}$ and $R_{\min}$ are the maximum and minimum major-radius
    coordinates of the surface, each in m, and $L_{\mathrm{ref}}$ is the
    specified positive reference length in m.

    The label is a geometric normalization of the surface half-width; it is not
    a magnetic-flux normalization and therefore is distinct from the [normalized
    toroidal flux coordinate](name:normalized_toroidal_flux_coordinate). Its
    numerical value depends on the chosen reference length.
  unit: '1'

- name: normalized_plasma_internal_inductance
  description: |-
    Normalized internal inductance measures internal poloidal magnetic energy
    relative to squared plasma current and the plasma's geometric-axis major
    radius.
  documentation: |-
    Normalized internal inductance measures the poloidal magnetic energy
    contained within the entire plasma using the geometric-axis normalization
    known as li(3). It characterizes poloidal-field peaking associated with the
    plasma current distribution.

    The normalized internal inductance $l_i$ is defined by

    $$
    l_i = \frac{2\int_V B_{\mathrm{p}}^2\,dV}{\mu_0^2 I_{\mathrm{p}}^2 R_{\mathrm{geo}}}
    $$

    where $B_{\mathrm{p}}$ is the poloidal magnetic-field magnitude, $V$ is the
    plasma volume, $dV$ is a volume element, $\mu_0$ is the vacuum permeability,
    $I_{\mathrm{p}}$ is the total toroidal plasma current, and
    $R_{\mathrm{geo}}$ is the major radius of the plasma's geometric axis.

    The integral covers the full plasma volume and excludes magnetic energy
    outside the plasma and energy associated with the toroidal magnetic field.
    The normalization requires nonzero plasma current and uses the geometric
    axis rather than the magnetic axis.

    The corresponding dimensional internal inductance $L_i$ satisfies $L_i =
    \mu_0 R_{\mathrm{geo}}l_i/2$. This normalization distinguishes the quantity
    from dimensional [plasma inductance](name:plasma_inductance).
  unit: '1'

- name: normalized_toroidal_beta
  description: |-
    Normalized toroidal beta scales the whole-plasma toroidal pressure ratio by
    minor radius and reference toroidal field relative to plasma current using
    the Troyon convention.
  documentation: |-
    Normalized toroidal beta compares whole-plasma pressure with toroidal
    magnetic pressure and applies the Troyon size-and-current normalization. It
    is a normalized member of the [beta family](name:beta), rather than an
    unmodified pressure ratio.

    With dimensional inputs represented by their numerical values in coherent
    SI, the defining normalization is

    $$\beta = \frac{2\mu_0 \langle p\rangle}{B^2}$$

    where $\beta_{\mathrm{N}}$ is normalized toroidal beta, $\beta_{\mathrm{t}}$
    is [toroidal beta](name:toroidal_beta), $a$ is the plasma minor radius,
    $B_0$ is the reference toroidal magnetic-field magnitude, and $I_p$ is the
    total plasma-current magnitude. The factor 100 implements the percentage
    convention for beta, while the denominator factor $10^{-6}$ implements the
    conventional Troyon current scaling.

    The underlying pressure ratio is $\beta_{\mathrm{t}} = 2\mu_0\langle
    p\rangle/B_0^2$, where $\mu_0$ is vacuum permeability and $\langle p\rangle$
    is total perpendicular plasma pressure averaged over the plasma volume. The
    reference field is the same field used in the Troyon normalization.

    The pressure includes contributions from all plasma populations, including
    thermal and nonthermal populations; thermal-pressure-only normalized beta is
    a distinct quantity. This is a global volume-averaged pressure measure, not
    a point-local or pedestal beta. It is defined only for nonzero reference
    toroidal field and plasma-current magnitude.
  unit: '1'

- name: normalized_toroidal_flux_coordinate
  description: |-
    Normalized toroidal flux coordinate labels magnetic surfaces by the square
    root of their axis-to-boundary toroidal-flux fraction, spanning zero at the
    magnetic axis to one at the equilibrium boundary.
  documentation: |-
    Normalized toroidal flux coordinate

    The coordinate is defined by

    $$
    \rho_{\mathrm{tor,norm}} = \rho_{\mathrm{tor}}/\rho_{\mathrm{tor,b}}
    $$

    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate,
    $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate of the selected
    surface, and $\rho_{\mathrm{tor,b}}$ is the [toroidal flux coordinate at the
    plasma boundary](name:toroidal_flux_coordinate_at_plasma_boundary). Both
    unnormalized coordinates use the same magnetic-axis origin and flux
    reference.

    Equivalently, $\rho_{\mathrm{tor,norm}}^2 =
    (\Phi_{\mathrm{tor}}-\Phi_{\mathrm{tor,axis}})/(\Phi_{\mathrm{tor,b}}-\Phi_{\mathrm{tor,axis}})$,
    where $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux enclosed by the
    selected surface, and $\Phi_{\mathrm{tor,axis}}$ and $\Phi_{\mathrm{tor,b}}$
    are its magnetic-axis and equilibrium-boundary values.

    On nested closed magnetic surfaces, the nonnegative coordinate is constant
    on each surface, zero at the magnetic axis, and one at the last closed flux
    surface used as the boundary. It is a surface label, not a surface average,
    volume integral, geometric distance, toroidal angle, or vector component.
    The boundary normalization must be nonzero; the definition does not itself
    specify a continuation outside the last closed flux surface. Signed
    line-of-sight variants attach an additional geometric branch sign, while
    their absolute value retains this normalization.

    Locus-specific quantities, such as the [coordinate at a constraint
    position](name:normalized_toroidal_flux_coordinate_at_constraint_position),
    evaluate this same label on the magnetic surface containing the specified
    position. The [coordinate at the
    separatrix](name:normalized_toroidal_flux_coordinate_at_separatrix) equals
    one when the separatrix defines the equilibrium boundary.
  unit: '1'

- name: normalized_toroidal_flux_coordinate_at_constraint_position
  description: |-
    Normalized toroidal flux coordinate at the constraint position gives a
    magnetic-surface label ranging from zero at the magnetic axis to one at the
    equilibrium boundary.
  documentation: |-
    Normalized toroidal flux coordinate

    At the constraint position, the coordinate is defined by

    $$
    \rho_{\mathrm{tor,norm}} = \rho_{\mathrm{tor}}/\rho_{\mathrm{tor,b}}
    $$

    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate
    at the constraint position, $\rho_{\mathrm{tor}}$ is the unnormalized
    toroidal flux coordinate of the magnetic surface containing that position,
    and $\rho_{\mathrm{tor,b}}$ is its [value at the plasma
    boundary](name:toroidal_flux_coordinate_at_plasma_boundary).

    The quantity applies pointwise at one specified constraint position,
    independently of which physical quantity is constrained; it is not an
    average over positions or a sum over constraints. It specifies a
    magnetic-surface label, not the constrained physical quantity, an
    unnormalized flux radius, or a geometric distance.

    It is the locus-specific evaluation of the parent [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate). For nested closed
    magnetic surfaces and a nonzero boundary coordinate, it spans zero at the
    magnetic axis to one at the equilibrium boundary. When that boundary is a
    separatrix, the outer endpoint is the [normalized toroidal flux coordinate
    at the separatrix](name:normalized_toroidal_flux_coordinate_at_separatrix).
  unit: '1'

- name: normalized_toroidal_flux_coordinate_at_minimum_absolute_safety_factor
  description: |-
    Dimensionless magnetic-surface label giving the normalized toroidal flux at
    the closed surface where the magnitude of the safety factor reaches its
    minimum.
  documentation: |-
    This quantity identifies the nested closed magnetic surface on which the
    magnitude of the safety factor is minimized, using the normalized toroidal
    magnetic-flux coordinate of that surface.

    $$
    \rho_{\mathrm{tor,norm}} = \sqrt{\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}}
    $$

    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal-flux coordinate,
    $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux enclosed by the
    evaluated surface, $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic
    axis, and $\Phi_{\mathrm{tor,boundary}}$ is its value at the equilibrium
    boundary.

    The value is a single equilibrium coordinate evaluated at the surface of
    minimum safety-factor magnitude; it is not a flux-surface profile, an
    average over surfaces, or the minimum safety-factor value itself. It is
    distinct from a cylindrical radial distance and from a local vector
    component. The parent [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate) supplies the
    coordinate definition, while [normalized poloidal flux coordinate at minimum
    absolute safety
    factor](name:normalized_poloidal_flux_coordinate_at_minimum_absolute_safety_factor)
    gives the analogous poloidal-flux label at the same physical locus.
  unit: '1'

- name: outer_radius_of_plasma_filament
  description: |-
    Outer radius of a plasma filament is the geometric radius of the outer
    circular boundary of the annular cross-section representing a
    current-carrying plasma filament. It marks the external boundary of the
    conducting annular region.
  documentation: |-
    Outer radius of a plasma filament is the geometric radius of the outer
    circular boundary of the annular cross-section representing a
    current-carrying plasma filament. It marks the external boundary of the
    conducting annular region; material outside this boundary is not part of
    that annular filament cross-section.

    For the outer circular boundary in the poloidal cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame, the outer radius
    $r_\mathrm{outer}$ is the distance from the filament cross-section center
    $(R_c, Z_c)$ to any point $(R, Z)$ on that boundary:

    $$
    r_\mathrm{outer} = \sqrt{(R - R_c)^2 + (Z - Z_c)^2}
    $$

    where $R$ is major radius, $\phi$ is toroidal angle, $Z$ is vertical height,
    $(R_c, Z_c)$ is the center of the annular cross-section, and $(R, Z)$ lies
    on the outer circular boundary.

    The quantity applies only to the outer boundary of an annular
    plasma-filament cross-section and is a single geometric radius for that
    boundary, not an average over the conducting region. It is the outer member
    of radius of a plasma filament, paired with the [inner
    radius](name:inner_radius_of_plasma_filament) $r_\mathrm{inner}$; by
    definition $0 \le r_\mathrm{inner} \le r_\mathrm{outer}$, and the
    current-carrying cross-section occupies the annular region between the two
    radii. For the same annular geometry, the area of a plasma filament $A$
    satisfies $A = \pi(r_\mathrm{outer}^2 - r_\mathrm{inner}^2)$, where $A$ is
    the area of the annular plasma-filament cross-section and $\pi$ is the
    circle constant. This quantity excludes the major radius of the filament
    center about the toroidal symmetry axis and rectangular cross-section
    dimensions such as [plasma filament width](name:plasma_filament_width) and
    [height of a plasma filament](name:height_of_plasma_filament).
  unit: m

- name: parallel_current_density_at_constraint_position
  description: |-
    Parallel current density at a specified constraint position is the signed
    scalar field-aligned component of conventional current density associated
    with an equilibrium constraint locus. It sums charge transport from all
    charged-particle populations unless a narrower component or population is
    specified.
  documentation: |-
    Parallel current density at a specified constraint position is the signed
    scalar field-aligned component of conventional current density associated
    with an equilibrium constraint position. The constraint position supplies
    the spatial locus or selected magnetic surface to which the value applies,
    while narrower quantities may add an averaging or population qualifier.

    The field-aligned projection is defined by

    $$
    j_\parallel = \mathbf{j} \cdot \hat{\mathbf{b}}
    $$

    where $j_\parallel$ is this parallel current density, $\mathbf{j}$ is the
    [current density](name:current_density), $\hat{\mathbf{b}}$ is the unit
    vector along the local [magnetic field](name:magnetic_field), $\mathbf{B}$
    is the local magnetic-field vector, and $|\mathbf{B}|$ is its magnitude.

    The supported scope is the conventional charge-current sum over all
    charged-particle populations at the specified constraint locus unless a
    narrower population is explicitly specified. This excludes the unprojected
    [current density](name:current_density), other vector components of current
    density, and current-density quantities not associated with a constraint
    position.

    Narrower quantities specialize this parent by retaining the same
    field-aligned projection and constraint-position scope while adding further
    qualification. For example, the [flux-surface-averaged parallel current
    density at constraint
    position](name:flux_surface_averaged_parallel_current_density_at_constraint_position)
    is the flux-surface average of $j_\parallel$ over the selected closed
    magnetic surface; this parent itself does not impose that averaging
    convention.

    Sign convention: Positive when the conventional current density has a
    component in the direction of the local magnetic field.
  unit: A.m^-2

- name: plasma_current
  description: |-
    Plasma current is the signed integral of a plasma current-density component
    over a poloidal cross-section; its global equilibrium value is the net
    toroidal current.
  documentation: |-
    Plasma current represents conventional electric charge transport carried by
    the plasma, integrated over a poloidal cross-section and resolved along a
    specified direction. Its global equilibrium value is the total toroidal
    current through the full plasma poloidal cross-section.

    The component-resolved current is defined by

    $$
    I_a(S) = \int_S \mathbf{j}\cdot\hat{\mathbf{e}}_a\,dA
    $$

    where $I_a(S)$ is the integrated plasma current in direction $a$, $a$ labels
    the selected component, $S$ is the selected poloidal cross-sectional region,
    $\mathbf{j}$ is the total plasma [current density](name:current_density),
    $\hat{\mathbf{e}}_a$ is the local unit vector along that component's
    positive direction, and $dA$ is an unsigned area element.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, $R$ is distance from the
    symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical height. The
    global plasma current is $I_p=I_\phi(S_p)$, where $I_p$ denotes the total
    toroidal plasma current, $S_p$ is the full plasma poloidal cross-section,
    and $\hat{\mathbf{e}}_\phi$ points toward increasing toroidal angle.

    The current density includes all charged-particle contributions with their
    electric-charge signs. The integral is therefore a net conventional current,
    not a particle flux or a sum of unsigned current magnitudes. Currents
    carried by external coils and conducting structures are excluded.

    The [cumulative plasma current inside a flux
    surface](name:cumulative_inside_flux_surface_plasma_current) restricts the
    integration region to the poloidal cross-section enclosed by that surface
    while retaining the specified current component. For the toroidal component,
    it equals the global plasma current when its integration region coincides
    with the full plasma cross-section.

    Sign convention: Positive when the integrated conventional-current
    contribution is along the selected positive component direction; for the
    global toroidal current, this is increasing $\phi$, counterclockwise when
    viewed from above along the positive vertical axis.
  unit: A

- name: poloidal_angle_of_flux_surface
  description: |-
    Poloidal angle at a point on a flux surface, measured about the magnetic
    axis from the outward horizontal ray. It increases clockwise in the poloidal
    cross-section, with major radius to the right and vertical height upward.
  documentation: |-
    Poloidal angle of flux surface

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the angle is
    defined by:

    $$
    \theta = \operatorname{atan2}(Z_{\mathrm{axis}} - Z,\; R - R_{\mathrm{axis}})
    $$

    Here, $\theta$ is the poloidal angle at the point; $R$ and $Z$ are its major
    radius and vertical height; and $R_{\mathrm{axis}}$ and $Z_{\mathrm{axis}}$
    are the major radius and vertical height of the magnetic axis. The function
    $\operatorname{atan2}$ is the quadrant-resolving two-argument inverse
    tangent. The angle is undefined at the magnetic axis, where both arguments
    vanish, and values differing by $2\pi$ represent the same direction.

    The quantity applies pointwise to positions on a flux surface; it is not a
    single angle for the entire surface and is not a surface average. It is a
    geometric positional angle, distinct from a straight-field-line poloidal
    angle. The [poloidal magnetic flux at a flux
    surface](name:poloidal_magnetic_flux_at_flux_surface) identifies the
    surface, while this angle distinguishes positions around it. It uses the
    same geometric convention as the [poloidal angle at a measurement
    position](name:poloidal_angle_of_measurement_position), with the evaluation
    locus here being a flux surface.

    Sign convention: Positive when the angle increases clockwise from the
    outward horizontal ray in the poloidal cross-section, with $R$ increasing to
    the right and $Z$ increasing upward.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: rad

- name: poloidal_angle_of_gyrokinetic_eigenmode
  description: |-
    The geometric poloidal angle coordinate associated with a gyrokinetic
    eigenmode, measured about the flux-surface cross-section center from the
    low-field-side midplane.
  documentation: |-
    This geometric coordinate labels position around the poloidal cross-section
    associated with a gyrokinetic eigenmode. It expresses poloidal variation of
    equilibrium and eigenmode quantities and refines the general [poloidal
    angle](name:poloidal_angle_of_flux_surface) concept for the eigenmode
    coordinate.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the angle is defined
    relative to the geometric center $(R_0,Z_0)$ of the flux-surface
    cross-section:

    $$
    \theta = \operatorname{wrap}_{[-\pi,\pi]}\left[-\operatorname{atan2}(Z-Z_0,R-R_0)\right]
    $$

    where $R$ is major radius, $Z$ is vertical height, $R_0$ and $Z_0$ are the
    center coordinates, and `wrap` selects the representative angle in the
    stated interval. The coordinate is geometric rather than a coil-orientation
    parameter or a straight-field-line angle.

    Sign convention: Positive when moving clockwise from the low-field-side
    midplane in the poloidal cross-section.
  unit: rad

- name: poloidal_angle_of_plasma_boundary_gap
  description: |-
    Poloidal angle of a plasma-boundary gap specifies its measurement direction,
    measured clockwise from the outward horizontal direction in the poloidal
    cross-section.
  documentation: |-
    Poloidal angle of plasma boundary gap

    For a nonzero directed segment aligned with the measurement direction, the
    defining relation is:

    $$\theta = \operatorname{atan2}(Z_{\mathrm{axis}} - Z,\; R - R_{\mathrm{axis}})$$

    where $\theta$ is the gap-measurement direction angle, $(R_0, Z_0)$ and
    $(R_1, Z_1)$ are the segment's start and end coordinates, and
    $\operatorname{atan2}$ is the two-argument inverse tangent. The right-handed
    cylindrical frame is $(R, \phi, Z)$, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The angle applies separately to each plasma-boundary gap, not to an average
    over the boundary. It describes a direction rather than the positional
    poloidal angle of the gap's reference point about the magnetic axis. Zero
    corresponds to the outward horizontal direction, and angles differing by a
    full turn describe the same direction.

    Sign convention: Positive when the measurement direction rotates clockwise
    from increasing $R$ toward decreasing $Z$, viewed with $R$ to the right and
    $Z$ upward.
  unit: rad

- name: poloidal_beta
  description: |-
    Poloidal beta compares volume-averaged total perpendicular plasma pressure
    with a magnetic-pressure scale set by the net plasma current and reference
    major radius.
  documentation: |-
    Poloidal beta is the ratio of volume-averaged total perpendicular plasma
    pressure to a reference poloidal magnetic-pressure scale. The reference
    scale is defined by a whole-plasma, current-based normalization rather than
    by the poloidal field at a particular point.

    The defining pressure ratio and its current-based normalization are

    $$\beta = \frac{2\mu_0 \langle p\rangle}{B^2}$$

    Here $\beta_{\mathrm{p}}$ is poloidal beta, $p$ is total perpendicular
    plasma pressure, $V$ is the entire plasma volume, $dV$ is a volume element,
    and $\langle p\rangle$ is the pressure averaged over that volume. The
    quantities $R_0$, $I_{\mathrm{p}}$, and $\mu_0$ are the reference major
    radius, net toroidal plasma current, and vacuum permeability, respectively.
    The effective reference poloidal field $B_{\mathrm{p,ref}}$ satisfies
    $B_{\mathrm{p,ref}}^2=\mu_0^2 I_{\mathrm{p}}^2R_0/(2V)$; it is not a local
    poloidal-field magnitude.

    The pressure includes contributions from all plasma populations, rather than
    electrons alone or only thermal particles. This global quantity differs from
    a point-local or pedestal-top electron beta. The definition requires nonzero
    net plasma current and a positive reference major radius.

    Poloidal beta is the poloidal-field-normalized member of the
    [beta](name:beta) family, whereas [toroidal beta](name:toroidal_beta) uses a
    reference toroidal magnetic field. For the same pressure average and a
    combined reference field formed by adding the squared poloidal and toroidal
    reference fields, $1/\beta=1/\beta_{\mathrm{p}}+1/\beta_{\mathrm{t}}$, where
    $\beta$ is combined-field beta and $\beta_{\mathrm{t}}$ is toroidal beta.
  unit: '1'

- name: poloidal_current_function
  description: |-
    Major-radius-weighted toroidal magnetic-field function used in axisymmetric
    equilibria and vacuum fields; in ideal-MHD plasma it is constant on each
    magnetic flux surface.
  documentation: |-
    The poloidal current function is the major-radius-weighted toroidal magnetic
    field that defines the equilibrium $F$-function. It provides a common
    description for the toroidal field in axisymmetric plasma equilibria and in
    current-free vacuum magnetic fields.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the defining relation is

    $$
    F(R,Z) = R B_\phi(R,Z)
    $$

    where $F$ is the poloidal current function, $R$ is major radius measured
    from the machine symmetry axis, $B_\phi$ is the toroidal component of the
    magnetic field, $\phi$ is toroidal angle, and $Z$ is vertical height.

    For an axisymmetric ideal-MHD plasma equilibrium, $F$ is a flux function: it
    is constant on each nested magnetic flux surface and can therefore be
    expressed as a function of the poloidal magnetic-flux coordinate. The
    quantity describes the full toroidal magnetic field represented by the
    equilibrium; it is not a surface or volume integral, an average, or a
    restriction to a particular current source.

    The [vacuum poloidal current
    function](name:vacuum_poloidal_current_function) is the corresponding
    external-coil contribution in a current-free vacuum region, whereas the
    unqualified quantity denotes the general $F$-function. The [product of the
    poloidal current function and its derivative with respect to the poloidal
    magnetic flux
    coordinate](name:product_of_poloidal_current_function_and_derivative_of_poloidal_current_function_with_respect_to_poloidal_magnetic_flux_coordinate)
    is a distinct Grad–Shafranov source term formed from $F$ and its flux
    derivative.

    Sign convention: Positive when $B_\phi$ points in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.
  unit: T.m

- name: poloidal_current_weighted_average_external_magnetic_flux
  description: |-
    Poloidal magnetic flux from all external active coils and passive loops is
    averaged over the plasma cross-section with toroidal-current-density
    weighting, excluding plasma-generated flux.
  documentation: |-
    Poloidal magnetic flux averaged with toroidal plasma current density
    represents the externally generated flux linked by the distributed plasma
    current. It is the poloidal specialization of [current-weighted average
    external magnetic
    flux](name:current_weighted_average_external_magnetic_flux), and an
    averaged, source-separated form of [magnetic flux](name:magnetic_flux).

    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle increasing counterclockwise when viewed
    from above, and $Z$ is vertical height, the average is defined by

    $$
    \overline{\Phi}_{\mathrm{p,ext}} = \frac{1}{I_{\mathrm{p}}}\int_{\Omega_{\mathrm{p}}}\Phi_{\mathrm{p,ext}}(R,Z)\,j_\phi(R,Z)\,dA_{RZ}
    $$

    where $\overline{\Phi}_{\mathrm{p,ext}}$ is the current-weighted average
    external poloidal magnetic flux, $\Omega_{\mathrm{p}}$ is the plasma
    poloidal cross-section, $j_\phi$ is the toroidal plasma current density, and
    $dA_{RZ}$ is the poloidal cross-sectional area element. The normalization is
    the signed [plasma current](name:plasma_current),
    $I_{\mathrm{p}}=\int_{\Omega_{\mathrm{p}}}j_\phi\,dA_{RZ}$. The local
    external contribution $\Phi_{\mathrm{p,ext}}$ follows the [poloidal magnetic
    flux](name:poloidal_magnetic_flux) definition: flux through a horizontal
    disk centered on the toroidal symmetry axis and bounded by the toroidal
    circle through the evaluation point.

    The external contribution includes all active coils and passive conducting
    loops, including induced currents in conducting structures, but excludes
    flux generated by the plasma current itself. The weighting uses signed
    toroidal plasma current density, not its absolute value; consequently, this
    quantity is distinct from an unweighted area average. The definition
    requires nonzero total plasma current.

    Sign convention: Positive when the external disk flux, averaged with the
    signed weights $j_\phi/I_{\mathrm{p}}$, threads the horizontal disks in the
    $+Z$ direction.
  unit: Wb

- name: poloidal_length_of_flux_surface
  description: |-
    Poloidal arc length of a closed magnetic-flux-surface contour in an
    equilibrium poloidal cross-section, measuring the perimeter of that selected
    surface.
  documentation: |-
    The poloidal length is the perimeter of the closed contour formed by one
    selected magnetic flux surface in a poloidal cross-section. It is a
    geometric property of the surface boundary, rather than its enclosed area,
    volume, or toroidal circumference.

    The contour length is defined in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height:

    $$
    L_{\mathrm{pol}} = \int_{\theta_a}^{\theta_b} \sqrt{\left(\frac{dR(\theta)}{d\theta}\right)^2 + \left(\frac{dZ(\theta)}{d\theta}\right)^2}\,d\theta
    $$

    Here $L_{\mathrm{pol}}$ is the poloidal length, $\theta$ is any smooth
    parameter along the contour, $R(\theta)$ and $Z(\theta)$ are its cylindrical
    coordinate functions, and $\theta_a$ and $\theta_b$ are parameter values at
    the same contour point after one complete circuit. The contour is taken at
    fixed toroidal angle $\phi$.

    The quantity applies to one magnetic flux surface and includes the complete
    closed poloidal contour, with no averaging or summation over multiple
    surfaces. It excludes local arc segments and geometric quantities associated
    with the enclosed region. The selected surface may be labeled by the
    [normalized poloidal flux
    coordinate](name:normalized_poloidal_flux_coordinate).

    Unlike [elongation of a flux surface](name:elongation_of_flux_surface),
    which describes a scale-independent cross-sectional shape ratio, the
    poloidal length retains the absolute geometric scale of the contour.
  unit: m

- name: poloidal_magnetic_field
  description: |-
    Poloidal magnetic field is the strength of local magnetic induction in the
    plane containing the toroidal symmetry axis and the evaluation point,
    excluding the toroidal contribution.
  documentation: |-
    Poloidal magnetic field is the magnitude of the projection of the local
    [magnetic induction](name:magnetic_field) onto the poloidal plane. It
    retains the radial and vertical contributions while excluding the toroidal
    contribution.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, it is defined
    by:

    $$
    B_{\mathrm{p}} = \sqrt{B_R^2 + B_Z^2}
    $$

    where $B_{\mathrm{p}}$ is the poloidal magnetic-field strength, $B_R$ is the
    cylindrical radial magnetic-field component, and $B_Z$ is the vertical
    magnetic-field component.

    This is a local quantity without a prescribed evaluation locus, spatial
    averaging, or restriction to a particular field source. It is neither the
    full magnetic-field magnitude nor the signed sensing-axis projection
    associated with the [poloidal magnetic field of a magnetic-field
    probe](name:poloidal_magnetic_field_of_magnetic_field_probe).

    The [poloidal magnetic field at the pedestal
    top](name:poloidal_magnetic_field_at_pedestal_top) specializes this quantity
    by fixing its evaluation locus.
  unit: T

- name: poloidal_magnetic_field_at_pedestal_top_high_field_side
  description: |-
    Poloidal magnetic field at the high-field-side pedestal top is the magnitude
    of the equilibrium magnetic-field projection onto the poloidal plane.
  documentation: |-
    Poloidal magnetic field at the high-field-side pedestal top is the local
    strength of the poloidal-plane projection of the equilibrium [magnetic
    field](name:magnetic_field).

    The field strength is defined by

    $$
    B_{\mathrm{p}} = \sqrt{B_R^2 + B_Z^2}
    $$

    where $B_{\mathrm{p}}$ is the poloidal magnetic-field magnitude, and $B_R$
    and $B_Z$ are the radial and vertical magnetic-field components, all
    evaluated at the stated locus. These components refer to the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The toroidal contribution is excluded, distinguishing this quantity from the
    magnitude of the [total magnetic field at the same
    locus](name:magnetic_field_at_pedestal_top_high_field_side). This is a local
    value, not the [flux-surface-averaged poloidal magnetic field at the
    pedestal
    top](name:flux_surface_averaged_poloidal_magnetic_field_at_pedestal_top).
    The [low-field-side
    counterpart](name:poloidal_magnetic_field_at_pedestal_top_low_field_side)
    evaluates the same component magnitude at its separately specified locus.
  unit: T

- name: poloidal_magnetic_field_of_magnetic_field_probe
  description: |-
    Poloidal magnetic field of a magnetic-field probe is the signed local
    poloidal magnetic-field value represented by a poloidal field probe after
    its nonlinear response calibration, sensed in the R-Z plane of the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Poloidal magnetic field of a magnetic-field probe is the signed local
    poloidal magnetic-field value represented by a poloidal field probe after
    its nonlinear response calibration. The sensed component lies in the $R$-$Z$
    plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The defining relation applies the probe's nonlinear calibration curve to the
    linearly calibrated projection of the local field onto the probe's sensitive
    direction:

    $$
    B_{\mathrm{probe}} = f_{\mathrm{nl}}\!\left(\hat{\mathbf{e}}_{\mathrm{probe}} \cdot \mathbf{B}(\mathbf{r}_{\mathrm{probe}})\right)
    $$

    where $B_{\mathrm{probe}}$ is this quantity,
    $\mathbf{B}(\mathbf{r}_{\mathrm{probe}})$ is the local [magnetic-field
    vector](name:magnetic_field) at the probe sensing position
    $\mathbf{r}_{\mathrm{probe}}$, $\hat{\mathbf{e}}_{\mathrm{probe}}$ is the
    unit vector along the probe's positive poloidal sensitive direction in the
    $R$-$Z$ plane, and $f_{\mathrm{nl}}$ is the probe's nonlinear calibration
    curve, which maps the linearly calibrated field value to the field value
    corrected for nonlinear sensor response such as Hall-sensor saturation or
    hysteresis. Where the sensor responds linearly, $f_{\mathrm{nl}}$ reduces to
    the identity and the quantity equals the plain projection.

    Scope is limited to an individual probe and to the point or small sensing
    volume it represents; no averaging over multiple probes, flux surfaces, or
    spatial regions is implied. The probe's position in the poloidal plane is
    given by the [radial coordinate of the poloidal magnetic-field
    probe](name:radial_coordinate_of_poloidal_magnetic_field_probe) and the
    [vertical coordinate of the poloidal magnetic-field
    probe](name:vertical_coordinate_of_poloidal_magnetic_field_probe). The
    [toroidal angle of a poloidal magnetic-field
    probe](name:toroidal_angle_of_poloidal_magnetic_field_probe) characterizes
    the orientation of the probe's sensitive axis and is not a spatial
    coordinate of this quantity's locus.

    This quantity is a single signed poloidal component: it is not the toroidal
    component, not the magnitude of the full magnetic-field vector, and not an
    unsigned poloidal-field magnitude. It is the calibrated field value, not the
    raw electrical signal, and is therefore distinct from the [voltage of a
    poloidal magnetic-field
    probe](name:voltage_of_poloidal_magnetic_field_probe); it is also distinct
    from the linearly calibrated value before the nonlinear correction is
    applied. Probe hardware descriptors such as the [turn count of a poloidal
    magnetic-field probe](name:turn_count_of_poloidal_magnetic_field_probe)
    characterize the sensor and are not components of the field.

    This quantity is the probe-local, oriented-component counterpart of the
    [poloidal magnetic field](name:poloidal_magnetic_field), evaluated at one
    sensing position along one fixed sensitive direction rather than as a field
    over the plasma domain.

    Sign convention: Positive when the local magnetic-field vector at the probe
    sensing position has a positive projection along the probe's positive
    poloidal sensitive direction in the $R$-$Z$ plane of the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: T

- name: poloidal_magnetic_flux
  description: |-
    Poloidal magnetic flux is the signed magnetic flux through a horizontal disk
    centered on the toroidal symmetry axis, labeling magnetic surfaces in
    axisymmetric equilibrium.
  documentation: |-
    Poloidal magnetic flux is the net magnetic flux through a horizontal disk
    centered on the toroidal symmetry axis and bounded by the toroidal circle
    through the evaluation point. It specializes [magnetic
    flux](name:magnetic_flux) by specifying the integration surface and its
    orientation. In axisymmetric equilibrium, its level sets define magnetic
    surfaces.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle increasing counterclockwise when viewed from above,
    and $Z$ is vertical height. The full poloidal magnetic flux is defined by

    $$
    \Phi_{\mathrm{p}}(R,Z) \equiv \psi(R,Z) = 2\pi \int_0^R B_Z(R',Z)\,R'\,dR'
    $$

    where $\Phi_{\mathrm{p}}$, also denoted $\psi$, is the poloidal magnetic
    flux, $B_Z$ is the vertical magnetic-field component, and $R'$ is the radial
    integration variable. The factor $2\pi$ accounts for integration around the
    complete toroidal circle.

    This quantity includes contributions from plasma currents and external
    sources, unlike [external magnetic flux](name:external_magnetic_flux), which
    excludes the plasma-generated contribution. It is the full flux, not flux
    divided by $2\pi$, a normalized coordinate, or a cross-sectional average. It
    differs from [toroidal magnetic flux](name:toroidal_magnetic_flux), which
    integrates the toroidal magnetic field through a poloidal cross-section.

    The [magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis) and
    [plasma-boundary value](name:poloidal_magnetic_flux_at_plasma_boundary) are
    evaluations of this same function and provide the endpoint references for
    poloidal-flux normalization. For nested surfaces enclosing positive toroidal
    plasma current flowing toward increasing $\phi$, the poloidal flux decreases
    from the magnetic axis to the plasma boundary.

    Sign convention: Positive when the magnetic field threading the horizontal
    disk has a net component toward increasing $Z$, along the upward surface
    normal.
  unit: Wb

- name: poloidal_magnetic_flux_at_constraint_position
  description: |-
    Poloidal magnetic flux at the constraint position is the signed flux through
    a horizontal disk centered on the toroidal symmetry axis and bounded by the
    toroidal circle through that position.
  documentation: |-
    Poloidal magnetic flux at the constraint position is the signed [magnetic
    flux](name:magnetic_flux) through a horizontal disk centered on the toroidal
    symmetry axis and bounded by the toroidal circle through that position.

    In an axisymmetric equilibrium, its defining relation in the right-handed
    cylindrical $(R, \phi, Z)$ frame is

    $$
    \Phi_{\mathrm{p}}(R,Z) = 2\pi \int_0^R B_Z(R',Z)\,R'\,dR'
    $$

    where $\Phi_{\mathrm{p}}$ is the poloidal magnetic flux, $R$ is major
    radius, $\phi$ is toroidal angle, $Z$ is vertical height, $B_Z$ is the
    vertical component of the total equilibrium magnetic field, and $R'$ is the
    major-radius integration variable. The expression is evaluated at the
    constraint position.

    This is a point evaluation of [poloidal magnetic
    flux](name:poloidal_magnetic_flux), not a spatial average, and includes both
    externally generated and plasma-generated contributions. Within a region of
    nested magnetic surfaces, it labels the surface passing through that
    position and supplies a surface coordinate for transport coefficients and
    plasma source terms. Unlike [toroidal magnetic
    flux](name:toroidal_magnetic_flux), it is not flux through a poloidal
    cross-section.

    For plasma current flowing in the direction of increasing $\phi$, the flux
    decreases from the [magnetic-axis
    value](name:poloidal_magnetic_flux_at_magnetic_axis) to the [plasma-boundary
    value](name:poloidal_magnetic_flux_at_plasma_boundary).

    Sign convention: Positive when the net magnetic field threading the
    horizontal disk is oriented toward increasing $Z$.
  unit: Wb

- name: poloidal_magnetic_flux_at_magnetic_axis
  description: |-
    Poloidal magnetic flux at the magnetic axis is the signed equilibrium flux
    through a horizontal disk bounded by the toroidal circle at that location.
  documentation: |-
    Poloidal magnetic flux at the magnetic axis is the signed equilibrium flux
    through a horizontal disk centered on the toroidal symmetry axis and bounded
    by the toroidal circle at that location. It is the magnetic-axis value of
    [poloidal magnetic flux](name:poloidal_magnetic_flux), a component-specific
    specialization of [magnetic flux](name:magnetic_flux).

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the defining
    flux is

    $$
    \Phi_{\mathrm{p},\mathrm{axis}} = 2\pi \int_0^{R_{\mathrm{axis}}} B_Z(R', Z_{\mathrm{axis}})\,R'\,dR'
    $$

    where $\Phi_{\mathrm{p},\mathrm{axis}}$ is the poloidal magnetic flux at the
    magnetic axis, $R_{\mathrm{axis}}$ is its major radius, $Z_{\mathrm{axis}}$
    is its [vertical coordinate](name:vertical_coordinate_of_magnetic_axis),
    $B_Z$ is the vertical component of the total equilibrium magnetic field, and
    $R'$ is the integration coordinate along major radius.

    The value includes both plasma-generated and externally generated
    equilibrium flux, rather than only [external magnetic
    flux](name:external_magnetic_flux). It is neither an axis-to-boundary flux
    difference nor a normalized flux label, and it need not vanish at the
    magnetic axis.

    Together with the [poloidal magnetic flux at the plasma
    boundary](name:poloidal_magnetic_flux_at_plasma_boundary), denoted by
    $\Phi_{\mathrm{p},b}$, it defines the normalized flux fraction $f =
    (\Phi_{\mathrm{p}}-\Phi_{\mathrm{p},\mathrm{axis}})/(\Phi_{\mathrm{p},b}-\Phi_{\mathrm{p},\mathrm{axis}})$,
    where $\Phi_{\mathrm{p}}$ is the equilibrium poloidal flux at the evaluation
    location and the denominator must be nonzero. This fraction supplies the
    reference for the [normalized poloidal flux
    coordinate](name:normalized_poloidal_flux_coordinate), with zero at the
    magnetic axis and unity at the plasma boundary. These reference values
    remain applicable when the region being described does not extend to either
    endpoint.

    Sign convention: Positive when the net vertical magnetic flux through the
    defining disk is directed toward increasing $Z$.

    The closed magnetic-field line about which nested toroidal magnetic flux
    surfaces are arranged. Where $\mathbf{B}_{\mathrm{p}}(R_{\mathrm{axis}},
    Z_{\mathrm{axis}}) = 0$, $\mathbf{B}_{\mathrm{p}}$ is poloidal magnetic
    field; $R_{\mathrm{axis}}, Z_{\mathrm{axis}}$ is the O-point inside the
    nested closed flux surfaces.
  unit: Wb

- name: poloidal_magnetic_flux_at_plasma_boundary
  description: |-
    Poloidal magnetic flux at the plasma boundary is the signed flux through a
    horizontal disk centered on the symmetry axis and bounded by a toroidal
    circle through a boundary point.
  documentation: |-
    Poloidal magnetic flux at the plasma boundary is the signed equilibrium flux
    through a horizontal disk centered on the toroidal symmetry axis and bounded
    by a toroidal circle through a boundary point. It is a locus-specific
    poloidal specialization of [magnetic flux](name:magnetic_flux).

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the boundary
    poloidal flux is defined by

    $$
    \Phi_{\mathrm{p},b} = \int_0^{R_b} B_Z(R',Z_b)\,2\pi R'\,dR'
    $$

    where $\Phi_{\mathrm{p},b}$ is the boundary poloidal magnetic flux, $R_b$
    and $Z_b$ are the coordinates of a boundary point, $R'$ is the integration
    major radius, and $B_Z$ is the vertical magnetic-field component. The disk
    is oriented along the positive vertical unit vector $\hat{Z}$.

    This definition applies to an axisymmetric equilibrium and includes
    contributions from both external sources and plasma current, rather than
    only [external magnetic flux](name:external_magnetic_flux). It differs from
    [toroidal magnetic flux at the plasma
    boundary](name:toroidal_magnetic_flux_at_plasma_boundary), which threads the
    boundary-enclosed poloidal cross-section rather than a horizontal disk.

    This is the boundary flux-function value, not the axis-to-boundary flux
    difference. Together with the magnetic-axis flux, it supplies the outer
    reference for poloidal-flux normalization; the [normalized poloidal flux
    coordinate of the plasma
    boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary)
    equals unity when those values define the normalization endpoints.

    Sign convention: Positive when the net vertical magnetic flux through the
    defining disk is directed along $+\hat{Z}$.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: Wb

- name: poloidal_magnetic_flux_of_flux_loop
  description: |-
    Poloidal magnetic flux of an individual flux loop is the measured, signed
    vertical-field integral over a horizontal disk centered on the toroidal
    symmetry axis.
  documentation: |-
    Poloidal magnetic flux of an individual flux loop is the signed poloidal
    flux represented by that loop's measured value.

    For an axisymmetric magnetic field, its defining relation is

    $$
    \Phi_{\mathrm{p}} = 2\pi \int_0^{R_\ell} B_Z(R', Z_\ell)\,R'\,dR'
    $$

    where $\Phi_{\mathrm{p}}$ is the poloidal magnetic flux, $B_Z$ is the
    vertical magnetic-field component, and $R'$ is the integration radius. In
    the right-handed cylindrical $(R,\phi,Z)$ frame, $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height; $R_\ell$ and $Z_\ell$ specify
    the evaluation location at the flux loop. The integration disk has its
    positive normal toward increasing $Z$.

    This is the loop-specific value of [poloidal magnetic
    flux](name:poloidal_magnetic_flux), not a sum or average over multiple
    loops. It represents an integrated flux rather than a local magnetic-field
    value and is distinct from [toroidal magnetic
    flux](name:toroidal_magnetic_flux).

    Sign convention: Positive when the net magnetic flux through the integration
    disk is directed toward increasing $Z$.
  unit: Wb

- name: poloidal_plane_cross_sectional_area_of_flux_surface
  description: |-
    Area enclosed by a magnetic flux-surface contour in a poloidal plane at
    fixed toroidal angle, including the complete planar interior.
  documentation: |-
    Area of flux surface

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the enclosed area is
    defined by

    $$
    A_{\mathrm{p}} = \iint_{\mathcal{S}_{\mathrm{p}}} dR\,dZ
    $$

    where $A_{\mathrm{p}}$ is the poloidal-plane cross-sectional area,
    $\mathcal{S}_{\mathrm{p}}$ is the planar region enclosed by the selected
    contour, $R$ is major radius, $\phi$ is toroidal angle, $Z$ is vertical
    height, and $dR\,dZ$ is the unsigned poloidal-plane area element.

    This quantity applies to any selected closed flux-surface contour and
    includes its entire interior, not merely the region between neighboring
    contours. It is not a local area element, a flux-surface average, or the
    [surface area of the flux surface](name:surface_area_of_flux_surface), which
    covers its full poloidal and toroidal extent.

    At the plasma boundary, it becomes the [poloidal-plane cross-sectional area
    of the plasma
    boundary](name:poloidal_plane_cross_sectional_area_of_plasma_boundary). Its
    local variation between neighboring surfaces is described by the [derivative
    with respect to poloidal magnetic flux
    coordinate](name:derivative_of_poloidal_plane_cross_sectional_area_of_flux_surface_with_respect_to_poloidal_magnetic_flux_coordinate)
    or the [derivative with respect to toroidal flux
    coordinate](name:derivative_of_poloidal_plane_cross_sectional_area_of_flux_surface_with_respect_to_toroidal_flux_coordinate),
    according to the coordinate used.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: m^2

- name: derivative_of_poloidal_plane_cross_sectional_area_of_flux_surface_with_respect_to_poloidal_magnetic_flux_coordinate
  description: |-
    Rate at which the poloidal-plane area enclosed by a nested magnetic flux
    surface changes with signed poloidal magnetic flux; it supplies a geometric
    metric for flux-surface averages.
  documentation: |-
    This quantity is the geometric derivative of the area enclosed by a nested,
    closed magnetic flux surface in a poloidal cross-section. It describes how
    neighboring flux surfaces differ in enclosed poloidal-plane area.

    $$
    \frac{dA}{d\psi}
    $$

    where $A(\psi)$ is the area enclosed by the flux surface labeled by signed
    poloidal magnetic flux $\psi$. The area is measured in the poloidal plane of
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The quantity applies to the cumulative enclosed area of each nested closed
    flux surface and is not a local area density, toroidal surface area, or
    enclosed-volume derivative. The corresponding [derivative of volume of flux
    surface with respect to poloidal magnetic flux
    coordinate](name:derivative_of_volume_of_flux_surface_with_respect_to_poloidal_magnetic_flux_coordinate)
    differentiates enclosed volume rather than cross-sectional area, while the
    derivative of area of flux surface with respect to toroidal flux coordinate
    uses the toroidal magnetic flux coordinate instead of $\psi$.

    Sign convention: Positive when the enclosed poloidal-plane area increases in
    the direction of increasing signed poloidal magnetic flux $\psi$, with
    positive flux oriented by the $+Z$ direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  unit: Wb^-1.m^2

- name: derivative_of_poloidal_plane_cross_sectional_area_of_flux_surface_with_respect_to_toroidal_flux_coordinate
  description: |-
    Local geometric rate of change of a flux surface’s enclosed poloidal
    cross-sectional area as its toroidal-flux coordinate varies.
  documentation: |-
    This quantity is the local geometric rate at which the poloidal
    cross-sectional area enclosed by a nested magnetic flux surface changes
    along the family of surfaces labeled by the toroidal-flux coordinate.

    The derivative is defined by:

    $$
    \frac{dA}{d\rho_{\mathrm{tor}}}
    $$

    where $A$ is the [poloidal-plane cross-sectional area of a flux
    surface](name:poloidal_plane_cross_sectional_area_of_flux_surface), and
    $\rho_{\mathrm{tor}}$ is the toroidal-flux coordinate labeling the nested
    surfaces.

    The area is enclosed by one closed magnetic-flux-surface contour in a
    fixed-toroidal-angle poloidal plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame. Here $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. The quantity applies to one flux surface at a time;
    it is not the area of the full three-dimensional flux surface, a derivative
    of enclosed volume, or an average over multiple surfaces.

    This is the derivative transformation of the cross-sectional-area quantity
    linked above. It differs from [the radial derivative of poloidal magnetic
    flux](name:radial_derivative_of_poloidal_magnetic_flux), which
    differentiates signed poloidal magnetic flux rather than geometric
    cross-sectional area.
  unit: m

- name: poloidal_plane_cross_sectional_area_of_plasma_boundary
  description: |-
    Area enclosed by the last closed magnetic flux surface in a poloidal plane,
    defining the equilibrium plasma cross-sectional size at the plasma boundary.
  documentation: |-
    This quantity is the geometric area enclosed by the last closed magnetic
    flux surface (LCFS), which forms the plasma boundary, in a poloidal
    cross-section.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the enclosed area is
    defined by

    $$
    A_{\rm LCFS} = \iint_{\mathcal{S}_{\rm LCFS}} dR\,dZ
    $$

    where $A_{\rm LCFS}$ is the LCFS cross-sectional area, $\mathcal{S}_{\rm
    LCFS}$ is the region enclosed by the LCFS contour at fixed toroidal angle
    $\phi$, $R$ is major radius, $\phi$ is toroidal angle, $Z$ is vertical
    height, and $dR\,dZ$ is the poloidal-plane area element.

    This is a global equilibrium quantity for the complete plasma-boundary
    contour. It is not a local surface element, a flux-surface average, or the
    area of a toroidal surface formed by revolving the contour.

    It is the plasma-boundary specialization of [poloidal plane cross-sectional
    area of a flux
    surface](name:poloidal_plane_cross_sectional_area_of_flux_surface), whose
    corresponding area is defined for an arbitrary closed magnetic flux surface;
    the LCFS is the outermost such surface enclosing the plasma.
  unit: m^2

- name: product_of_poloidal_current_function_and_derivative_of_poloidal_current_function_with_respect_to_poloidal_magnetic_flux_coordinate
  description: |-
    Grad–Shafranov equilibrium source term formed by multiplying the poloidal
    current function by its derivative with respect to signed poloidal magnetic
    flux.
  documentation: |-
    This quantity is the flux-surface-dependent product of the poloidal current
    function and its derivative with respect to the signed poloidal
    magnetic-flux coordinate. It represents the toroidal-field contribution to
    the Grad–Shafranov equilibrium source term.

    The defining relation is

    $$
    G(\psi)=F(\psi)\frac{dF(\psi)}{d\psi}
    $$

    where $G(\psi)$ denotes this quantity, $F(\psi)$ is the [poloidal current
    function](name:poloidal_current_function), $\psi$ is the signed poloidal
    magnetic-flux coordinate, and $dF/d\psi$ is the derivative of that current
    function with respect to $\psi$. The function $F$ is defined by $F=R
    B_\phi$, where $R$ is major radius in the right-handed cylindrical
    $(R,\phi,Z)$ frame and $B_\phi$ is the toroidal magnetic-field component.

    This quantity applies to an axisymmetric equilibrium description on nested
    magnetic flux surfaces. It is a local flux-function value with no additional
    spatial averaging, species summation, or volume integration. It is distinct
    from the poloidal current function itself and from its derivative alone.

    Within the Grad–Shafranov balance, this product combines the toroidal-field
    contribution with the pressure-gradient contribution to determine the
    equilibrium relation for toroidal current density and force balance.

    Sign convention: Positive when $F$ and $dF/d\psi$ have the same sign for the
    chosen orientation of the signed poloidal magnetic flux.
  unit: T^2.Wb^-1.m^2

- name: radial_coordinate_at_inboard_midplane
  description: |-
    Major-radius coordinate of a magnetic flux surface at its inboard midplane
    intersection, locating the high-field-side point relative to the toroidal
    symmetry axis.
  documentation: |-
    This quantity is the major-radius coordinate of the point where a magnetic
    flux surface intersects the inboard midplane, identifying the
    high-field-side location of that surface relative to the toroidal symmetry
    axis. It is a locus-specific form of the [radial
    coordinate](name:radial_coordinate).

    For a magnetic flux surface $\mathcal{S}$, the inboard-midplane radial
    coordinate is defined by

    $$
    R_{\mathrm{in}}(\mathcal{S}) = R\!\left(\mathbf{x}_{\mathrm{in}}(\mathcal{S})\right)
    $$

    where $R_{\mathrm{in}}(\mathcal{S})$ is the quantity defined here,
    $R(\mathbf{x})$ is the major-radius coordinate of spatial position
    $\mathbf{x}$, $\mathcal{S}$ is the specified magnetic flux surface, and
    $\mathbf{x}_{\mathrm{in}}(\mathcal{S})$ is its inboard midplane
    intersection. The coordinates are expressed in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    The scope is one coordinate value for each specified magnetic flux surface
    at its inboard, high-field-side midplane intersection. It is not a
    flux-surface average, a poloidal or toroidal average, or the corresponding
    outboard-midplane coordinate; the latter is represented by [radial
    coordinate at outboard
    midplane](name:radial_coordinate_at_outboard_midplane). Unlike [radial
    magnetic field](name:radial_magnetic_field), this quantity describes the
    location of a surface and not a magnetic-field component.

    This quantity specializes [radial coordinate](name:radial_coordinate) by
    fixing the evaluation locus to the inboard midplane. Comparing it with the
    outboard-midplane value characterizes the horizontal extent and radial
    placement of the same magnetic flux surface.
  unit: m

- name: radial_coordinate_at_outboard_midplane
  description: |-
    Major-radius coordinate of a magnetic flux surface at the outboard midplane,
    locating the surface's low-field-side point relative to the toroidal
    symmetry axis.
  documentation: |-
    Major-radius coordinate at outboard midplane

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the major-radius
    coordinate is related to the horizontal Cartesian coordinates by:

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $R$ is the [major-radius coordinate](name:radial_coordinate) measured
    as perpendicular distance from the toroidal symmetry axis, $\phi$ is the
    toroidal angle increasing counterclockwise when viewed from above
    $+\hat{Z}$, $Z$ is vertical height, and $x$ and $y$ are the horizontal
    Cartesian coordinates of the evaluated point in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis with $\hat{z}=\hat{Z}$ and origin on the
    toroidal symmetry axis.

    The quantity applies separately to each magnetic flux surface, identified by
    its poloidal magnetic-flux label $\psi$, where $\psi$ denotes the flux
    function labeling nested magnetic surfaces. It is a point value evaluated at
    the outboard midplane of the specified surface; it is not a flux-surface
    average and excludes the inboard intersection.

    For an up-down-symmetric equilibrium, the outboard midplane of every flux
    surface lies at the vertical height of the magnetic axis, so this quantity
    coincides with the major radius of the surface's low-field-side intersection
    with the horizontal plane through the magnetic axis. For a
    non-up-down-symmetric equilibrium, the outboard midplane of a surface lies
    at a different height, and the low-field-side intersection taken at the
    magnetic-axis height does not coincide with this quantity.

    It is a locus-specific specialization of the general [major-radius
    coordinate](name:radial_coordinate), evaluated at the outboard midplane. The
    corresponding [radial coordinate at the inboard
    midplane](name:radial_coordinate_at_inboard_midplane) locates the distinct
    high-field-side intersection of the same type of magnetic surface.

    The low-field-side equatorial midplane: the point of maximum major radius on
    the flux surface in question. For a value at the separatrix intersection use
    outboard_midplane_separatrix. Where $R = \max_{S} R,\quad R >
    R_{\mathrm{axis}}$, $S$ is the magnetic flux surface the point lies on;
    $R_{\mathrm{axis}}$ is major radius of the magnetic axis.
  unit: m

- name: radial_coordinate_of_closest_wall_point
  description: |-
    Major-radius coordinate R of the first-wall point nearest the plasma
    boundary, measured from the toroidal symmetry axis in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the major-radius coordinate of the wall point selected as
    closest to the plasma boundary. It identifies that point’s perpendicular
    distance from the toroidal symmetry axis in the right-handed cylindrical
    $(R, phi, Z)$ frame.

    The defining geometric relation is

    $$
    R_{\mathrm{cw}} = \left\lVert \mathbf{r}_{\mathrm{cw},\perp} \right\rVert
    $$

    where $R_{\mathrm{cw}}$ is the radial coordinate of the closest wall point
    and $\mathbf{r}_{\mathrm{cw},\perp}$ is the perpendicular displacement
    vector from the toroidal symmetry axis to that point.

    The scope is the single wall point selected by its minimum proximity to the
    plasma boundary. This is a pointwise geometric coordinate with no
    plasma-population dependence and no averaging, summation, or integration. It
    is not the wall-to-boundary separation distance, nor is “closest” a
    statement that the point has the smallest major radius among all wall
    points.

    This quantity is a locus-specific instance of [radial
    coordinate](name:radial_coordinate), restricted to the closest wall point
    rather than an arbitrary geometric reference position.
  unit: m

- name: radial_coordinate_of_conductor_cross_section
  description: |-
    Major-radius coordinate of a conductor cross-section's geometric center,
    equal to its perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of conductor cross section

    It is the [major-radius coordinate](name:radial_coordinate) specialized to
    this locus:

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the Cartesian coordinates of that center in the
    right-handed $(x, y, z)$ frame, with $z$ the vertical coordinate and the
    origin on the toroidal symmetry axis.

    The quantity applies individually to conductor cross-sections represented as
    rectangles, without averaging over conductors. It specifies the center
    position, not a cross-sectional width or an outline-point coordinate.
  unit: m

- name: radial_coordinate_of_control_surface
  description: |-
    Major-radius coordinate of each point on a control-surface outline, measured
    as perpendicular distance from the toroidal symmetry axis in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial coordinate of a control-surface outline point is its major-radius
    location, measured as perpendicular distance from the toroidal symmetry
    axis. It identifies the point's position in the right-handed cylindrical
    $(R,\phi,Z)$ frame.

    The defining geometric relation is

    $$
    R = \sqrt{X^2 + Y^2}
    $$

    where $R$ is the major-radius coordinate, and $X$ and $Y$ are the Cartesian
    coordinates perpendicular to the toroidal symmetry axis in the right-handed
    Cartesian $(\hat{x},\hat{y},\hat{z})$ basis. The cylindrical angle $\phi$ is
    the toroidal angular coordinate and $Z$ is the vertical coordinate of the
    same point.

    This quantity applies to each point defining the control-surface outline.
    The control surface is defined by an outline in a poloidal plane and extends
    in the toroidal direction with axisymmetric geometry; this quantity is the
    local coordinate of an outline point, not a surface average or an integrated
    surface property. It is distinct from displacement along a flux-surface
    normal, which describes a different geometric direction.

    This entry specializes [radial coordinate](name:radial_coordinate) by
    restricting its locus to a point on a control-surface outline while
    retaining the same major-radius definition.
  unit: m

- name: radial_coordinate_of_current_center
  description: |-
    Major-radius coordinate of the plasma-current centroid, obtained by
    normalizing the toroidal-current first moment over the poloidal plasma
    cross-section by total plasma current.
  documentation: |-
    The radial coordinate of the current center is the major-radius location of
    the centroid of the toroidal plasma-current distribution. It identifies a
    current-weighted position and is distinct from the geometric centroid or the
    magnetic axis.

    The coordinate is defined by the toroidal-current first moment:

    $$
    R_c = \frac{\displaystyle\int_{D_p} R\,j_\phi\,dS}{I_p}
    $$

    where $R_c$ is the major-radius coordinate of the current center, $R$ is the
    major-radius coordinate in the right-handed cylindrical $(R, \phi, Z)$
    frame, $j_\phi$ is the toroidal component of the plasma [current
    density](name:current_density), $dS$ is an element of poloidal
    cross-sectional area, $D_p$ is the plasma current-carrying poloidal
    cross-section, and $I_p$ is the total toroidal plasma current, equal to the
    corresponding integral of $j_\phi$ over $D_p$.

    The quantity applies to the full plasma-current distribution and uses a
    current-weighted first-moment aggregation over the poloidal cross-section.
    It excludes weighting by particle density, pressure, magnetic-field
    strength, or geometric area alone; the resulting position is therefore not a
    generic geometric center.

    This quantity is a locus-specific instance of the general [radial
    coordinate](name:radial_coordinate), evaluated at the current center. Its
    vertical counterpart, [vertical coordinate of the current
    center](name:vertical_coordinate_of_current_center), supplies the
    corresponding vertical position needed to locate the current centroid in the
    cylindrical $(R, \phi, Z)$ frame.
  unit: m

- name: radial_coordinate_of_dr_dz_zero_point
  description: |-
    Radial coordinate of the dR/dZ zero point is the R coordinate, in the
    right-handed cylindrical (R, φ, Z) frame, of a plasma-boundary or separatrix
    point where R is locally stationary with respect to Z.
  documentation: |-
    Radial coordinate of the dR/dZ zero point is the $R$ coordinate, in the
    right-handed cylindrical $(R, \phi, Z)$ frame, of a specified point on a
    plasma-boundary or separatrix contour where $R$ is locally stationary with
    respect to $Z$. In this frame, $R$ is major radius measured from the
    toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    The coordinate is defined by the stationary-radius condition on the
    specified contour:

    $$
    R_{\mathrm{dR/dZ=0}} = R(P_0), \qquad \left.\frac{dR}{dZ}\right|_{C,P_0} = 0
    $$

    where $R_{\mathrm{dR/dZ=0}}$ is the radial coordinate of the dR/dZ zero
    point, $P_0$ is the specified dR/dZ zero point, $C$ is the plasma-boundary
    or separatrix contour on which $P_0$ lies, $R(P_0)$ is the major-radius
    coordinate of $P_0$, $Z$ is the vertical-height coordinate, and $dR/dZ$ is
    the derivative of the contour coordinate $R$ with respect to $Z$ along $C$.

    The scope is a single specified geometric point on the contour; the value is
    not an average over the contour, over toroidal angle $\phi$, or over all
    stationary points. If several points on the contour satisfy $dR/dZ=0$, the
    definition does not by itself impose an inboard, outboard, upper, or lower
    selection rule; each specified zero point has its own radial-coordinate
    value.

    This quantity is only the cylindrical $R$ coordinate of the point, not a
    flux-surface-normal displacement or a flux-label coordinate. Together with
    the vertical coordinate of the dR/dZ zero point, it locates the point in the
    poloidal $(R, Z)$ cross-section at fixed $\phi$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame. It is distinct from the [radial coordinate
    of an X-point](name:radial_coordinate_of_x_point), which locates a magnetic
    null on a separatrix rather than a radial extremum of a boundary or
    separatrix contour.
  unit: m

- name: radial_coordinate_of_geometric_axis
  description: |-
    Major-radius coordinate of the plasma boundary's geometric axis, equal to
    its perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of geometric axis

    The coordinate is defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the horizontal coordinates of the same reference
    position in the right-handed Cartesian $(x, y, z)$ frame, with $z$ the
    vertical coordinate along the same axis as $Z$.

    This nonnegative coordinate specifies one reference position associated with
    the plasma boundary, rather than separate positions for interior flux
    surfaces. It is not a minor radius or a magnetic flux label, and it need not
    equal the magnetic-axis major radius.

    The [radial outline of the plasma
    boundary](name:radial_outline_of_plasma_boundary) instead specifies
    major-radius coordinates along the boundary contour. Within the same
    coordinate family, the [radial coordinate of a conductor
    cross-section](name:radial_coordinate_of_conductor_cross_section) locates a
    device reference position rather than this plasma reference position.

    The axis defined solely by the geometry of the relevant object or plasma
    cross-section. Where $R_{\mathrm{geo}} = (R_{\max} + R_{\min})/2,\quad
    Z_{\mathrm{geo}} = (Z_{\max} + Z_{\min})/2$, $R_{\max}, R_{\min}$ is the
    radial extrema of the cross-section; $Z_{\max}, Z_{\min}$ is its vertical
    extrema.
  unit: m

- name: radial_coordinate_of_measurement_position
  description: |-
    Major-radius coordinate of a measurement position, equal to its
    perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of measurement position

    The coordinate is defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the horizontal coordinates of the same position in the
    right-handed Cartesian $(x, y, z)$ frame, whose origin lies on the toroidal
    symmetry axis and whose vertical coordinate $z$ is aligned with $Z$.

    This quantity evaluates the parent coordinate at the specified measurement
    position; no summation, averaging, or weighting is implied. It is
    nonnegative and vanishes on the toroidal symmetry axis. It is distinct from
    a minor-radius distance measured from the magnetic axis and from a magnetic
    flux label.

    The [radial coordinate of a line of
    sight](name:radial_coordinate_of_line_of_sight) specifically locates that
    line's second reference point; this quantity does not impose that
    reference-point convention.
  unit: m

- name: radial_coordinate_of_plasma_filament
  description: |-
    Radial coordinate of a plasma filament is the major-radius coordinate, in
    the right-handed cylindrical (R, φ, Z) frame, of the oblique reference point
    anchoring one current-carrying filament element's rectangular cross-section.
  documentation: |-
    Radial coordinate of a plasma filament is the major-radius coordinate of the
    oblique reference point that anchors one current-carrying plasma filament
    element's rectangular cross-section. It is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius from the machine
    symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The quantity applies to a single plasma filament element represented by
    oblique rectangular cross-sectional geometry. It is the coordinate of the
    reference point used by that representation, not the filament width, height,
    centroid position, magnetic-axis position, or a flux-surface radial
    coordinate; no averaging or summation over filament elements is implied.

    Together with the vertical coordinate of the plasma filament, it locates the
    oblique reference point in the poloidal plane. The [alpha angle of the
    plasma filament](name:alpha_angle_of_plasma_filament) and beta angle of the
    plasma filament are defined relative to this same reference point, and the
    [plasma filament width](name:plasma_filament_width) is a rectangular
    cross-section extent anchored by it.
  unit: m

- name: radial_derivative_of_poloidal_magnetic_flux
  description: |-
    Rate of change of signed poloidal magnetic flux with the dimensionful
    toroidal-flux radius labeling nested equilibrium flux surfaces.
  documentation: |-
    The radial derivative of poloidal magnetic flux is the rate at which the
    signed poloidal magnetic flux changes across nested equilibrium magnetic
    flux surfaces. It is a metric coefficient relating the poloidal-flux and
    toroidal-flux coordinate descriptions.

    The defining relation is

    $$
    \frac{d\psi}{d\rho_{\mathrm{tor}}}
    $$

    where $\psi$ is the [poloidal magnetic flux](name:poloidal_magnetic_flux),
    and $\rho_{\mathrm{tor}}$ is the dimensionful toroidal-flux radius that
    labels the nested surfaces.

    This quantity is evaluated as a function of the toroidal-flux radius, with
    one derivative value associated with each nested equilibrium surface. It is
    not a surface integral or average, and it is distinct from a derivative with
    respect to the cylindrical major radius, minor radius, or a normalized flux
    coordinate.

    Relative to [poloidal magnetic flux](name:poloidal_magnetic_flux), this
    quantity describes how the flux label changes in the outward
    toroidal-flux-radial direction. It has the same independent coordinate as
    the derivative with respect to toroidal flux coordinate of area of flux
    surface, but differentiates poloidal magnetic flux rather than enclosed
    surface area.

    Sign convention: Positive when the poloidal magnetic flux increases as
    $\rho_{\mathrm{tor}}$ increases outward from the magnetic axis toward the
    plasma boundary.
  unit: Wb.m^-1

- name: radial_outline_of_flux_surface
  description: |-
    Major-radius coordinate of a point on a poloidal magnetic-flux level-set
    contour, expressed in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Radial outline of a flux surface is the major-radius coordinate $R$ of a
    point on a contour of constant poloidal magnetic flux. The contour is
    described in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius measured from the toroidal symmetry axis, $\phi$ is toroidal
    angle, and $Z$ is vertical height.

    For a point whose Cartesian coordinates are $(x,y,z)$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}=\hat{Z}$, the
    corresponding major-radius coordinate is

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are Cartesian coordinates in the plane perpendicular to
    the toroidal symmetry axis.

    This quantity is the radial coordinate component of the flux-surface
    outline, paired with the vertical outline of a flux surface. It is a
    specialization of [radial coordinate](name:radial_coordinate) to points on a
    poloidal magnetic-flux level set and does not denote the flux label, a
    flux-surface-normal displacement, or the radial component of a vector field.
  unit: m

- name: radial_outline_of_iron_core_segment
  description: |-
    Non-negative major-radius coordinate of a point on an iron-core segment
    cross-sectional outline in the right-handed cylindrical (R, φ, Z) frame,
    where R is measured away from the symmetry axis.
  documentation: |-
    Non-negative major-radius coordinate of a point on an iron-core segment
    cross-sectional outline is the distance of that point from the toroidal
    symmetry axis in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    identifies the radial location of an outline point; increasing $R$ is
    directed away from the symmetry axis along $+\hat{R}$.

    For a point whose position perpendicular to the symmetry axis is described
    in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis with
    $\hat{z}=\hat{Z}$, the coordinate is

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the Cartesian coordinates in the plane normal to the
    symmetry axis.

    The quantity applies only to the outline locus of the iron-core segment. It
    is distinct from the [radial coordinate of an arc-of-circle
    center](name:radial_coordinate_of_arc_of_circle_center), which locates a
    geometry-defining center rather than the radial coordinate of each outline
    point.
  unit: m

- name: radial_outline_of_plasma_boundary
  description: |-
    Major-radius coordinate of each point on the plasma-boundary contour in a
    poloidal cross-section.
  documentation: |-
    This quantity gives the major-radius coordinate associated with each point
    of the plasma-boundary outline in a poloidal cross-section. It represents
    the contour point locations measured from the toroidal symmetry axis rather
    than a single representative boundary radius.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the major radius of a
    point is defined by

    $$
    R = \sqrt{X^2 + Y^2}
    $$

    where $R$ is the major-radius coordinate, $X$ and $Y$ are horizontal
    Cartesian coordinates measured from the toroidal symmetry axis, $\phi$ is
    the toroidal angle, and $Z$ is the vertical height. The quantity is
    evaluated pointwise along the plasma-boundary contour, with no averaging or
    summation over its points.

    It is distinct from a flux-label quantity such as the [normalized poloidal
    flux coordinate of the plasma
    boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary), and
    it retains the full radial variation of the contour rather than reducing it
    to one size parameter. The radial extrema of the outline provide the
    horizontal extent used by the [minor radius of the plasma
    boundary](name:minor_radius_of_plasma_boundary).
  unit: m

- name: radial_outline_of_plasma_filament
  description: |-
    Radial outline of a plasma filament is the major-radius coordinate of each
    filament-outline point in the right-handed cylindrical (R, φ, Z) frame,
    where R is distance from the toroidal symmetry axis.
  documentation: |-
    Radial outline of a plasma filament is the major-radius coordinate $R$ of
    each point on the plasma-filament outline in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is distance from the toroidal symmetry axis
    and $Z$ is vertical height. It gives the radial location of the outline
    locus and is the filament-outline specialization of the generic [radial
    coordinate](name:radial_coordinate).

    For an outline point with Cartesian coordinates $(x,y,z)$ in a right-handed
    Cartesian frame with basis $(\hat{x}, \hat{y}, \hat{z})$, with the $z$ axis
    coincident with the toroidal symmetry axis, the coordinate is defined by:

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the Cartesian coordinates perpendicular to the
    toroidal symmetry axis.

    This quantity is a coordinate of each outline point, not a signed radial
    vector projection, flux-surface-normal displacement, filament width, or
    aggregate radius. It should not be confused with the [outer radius of a
    plasma filament](name:outer_radius_of_plasma_filament), which denotes an
    outer radial extent rather than the coordinate of an individual outline
    point.
  unit: m

- name: reference_major_radius
  description: |-
    Reference major radius is the perpendicular distance from the toroidal
    symmetry axis to the designated location at which the vacuum toroidal
    magnetic field is specified.
  documentation: |-
    Reference major radius is the geometric [radius](name:radius) measured
    perpendicularly from the toroidal symmetry axis to the designated location
    where the vacuum toroidal magnetic field is specified. It is a selected
    reference value of [major radius](name:major_radius).

    For an axisymmetric vacuum toroidal field, the reference radius and its
    associated field value determine the inverse-major-radius dependence:

    $$
    B_{\phi,\mathrm{vac}}(R)=B_0\frac{R_0}{R}
    $$

    where $R_0$ is the reference major radius, $B_0$ is the vacuum toroidal
    magnetic-field component at that radius, $R$ is the major-radius coordinate,
    and $B_{\phi,\mathrm{vac}}(R)$ is the vacuum toroidal magnetic-field
    component at $R$. The right-handed cylindrical $(R,\phi,Z)$ frame uses
    toroidal angle $\phi$ and vertical coordinate $Z$.

    The reference location is prescribed; it need not coincide with the magnetic
    axis or the equatorial midplane. Unlike the [flux-surface-averaged major
    radius](name:flux_surface_averaged_major_radius), this quantity is not an
    average over a magnetic flux surface. The reference radius and associated
    vacuum field provide the reference parameters used in toroidal-flux
    coordinate definitions and current-density normalizations.
  unit: m

- name: square_of_major_radius
  description: |-
    Geometric equilibrium coefficient with inverse-square major-radius scaling,
    spanning direct reciprocal-square factors and flux-coordinate metric ratios
    in toroidal plasma geometry.
  documentation: |-
    This quantity is a geometric coefficient in toroidal plasma equilibrium
    whose scale contains the reciprocal square of the [major
    radius](name:major_radius). It includes both direct inverse-square radius
    factors and geometric factors formed from a flux-coordinate gradient divided
    by the squared major radius.

    Its common form is

    $$
    G = \frac{g}{R^2}
    $$

    where $G$ is the geometric coefficient, $R$ is the major radius, and $g$ is
    a dimensionless geometric factor. For
    [inverse_of_square_of_major_radius](name:inverse_of_square_of_major_radius),
    $g=1$; for
    [ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius](name:ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius),
    $g$ is the squared magnitude of the gradient of the toroidal flux
    coordinate.

    The quantity is a metric factor for flux-coordinate equilibrium and
    transport formulations, not the major radius or its square itself. Its
    specific numerator is determined by the concrete member of this
    geometric-coefficient family.
  unit: m^-2

- name: inverse_of_square_of_major_radius
  description: |-
    Geometric inverse-square-major-radius coefficient for toroidal plasma
    equilibrium, including flux-surface-averaged forms used in magnetic-geometry
    relations.
  documentation: |-
    This quantity represents the reciprocal-square major-radius dependence of a
    geometric coefficient in toroidal plasma equilibrium. It characterizes the
    metric scaling associated with the distance from the machine symmetry axis.

    For the direct inverse-square form, the coefficient is defined by

    $$
    K_R = \frac{1}{R^2}
    $$

    where $K_R$ is the inverse-square-major-radius coefficient and $R$ is the
    major radius in the right-handed cylindrical $(R,\phi,Z)$ frame.

    The quantity applies to toroidal equilibrium geometry and is not the major
    radius itself or its direct square. It denotes the inverse-square geometric
    factor; any aggregation over a magnetic flux surface is an additional
    operation rather than part of the unaggregated quantity.

    The [flux-surface-averaged inverse-square-major-radius
    coefficient](name:flux_surface_averaged_inverse_of_square_of_major_radius)
    is the corresponding instance obtained by averaging this inverse-square
    factor over a magnetic flux surface. The quantity is therefore the
    reciprocal-square counterpart of
    [square_of_major_radius](name:square_of_major_radius), with the inverse
    relationship supplying the geometric scaling.
  unit: m^-2

- name: flux_surface_averaged_inverse_of_square_of_major_radius
  description: |-
    Flux-surface average of reciprocal squared major radius, providing a
    geometric metric coefficient for parallel-gradient and neoclassical
    transport calculations.
  documentation: |-
    This quantity is the flux-surface average of the reciprocal square of the
    major radius on a nested equilibrium magnetic flux surface. It is a positive
    geometric metric coefficient used in parallel-gradient operators and
    neoclassical and gyrokinetic transport equations.

    It is defined by

    $$
    g_{m1}(\psi)=\left\langle \frac{1}{R^2}\right\rangle_{\psi}
    $$

    where $g_{m1}$ denotes this metric coefficient, $R$ is the major radius
    measured from the toroidal symmetry axis, $\psi$ is the poloidal magnetic
    flux labeling the surface, and $\langle\cdot\rangle_{\psi}$ denotes the
    flux-surface average on that surface.

    The quantity applies to the entire magnetic flux surface and has no species,
    field-component, or source-process restriction. Its aggregation convention
    is a flux-surface average of the local reciprocal-square geometric factor;
    it is not the reciprocal square of a flux-surface-averaged major radius.

    It is the flux-surface-averaged form of the pointwise [inverse of square of
    major radius](name:inverse_of_square_of_major_radius). It differs from the
    related [flux-surface-averaged inverse of major
    radius](name:flux_surface_averaged_inverse_of_major_radius), which averages
    the first reciprocal power of $R$ rather than its reciprocal square.
  unit: m^-2

- name: squareness_of_flux_surface
  description: |-
    Squareness of a flux surface is the Luce (2013) shape coefficient for each
    nested closed magnetic flux surface, including the outer closed boundary
    when present, quantifying signed corner-sector departure from a reference
    ellipse in the poloidal cross-section. Positive values are box-like;
    negative values are diamond-like.
  documentation: |-
    Squareness of a flux surface is the Luce (2013) shape coefficient that
    quantifies the signed departure of a nested closed magnetic-flux-surface
    contour from a reference ellipse in the corner sectors of its poloidal
    cross-section. Positive values describe box-like corner sectors relative to
    the reference ellipse, and negative values describe diamond-like or
    inward-pinched corner sectors.

    The contour is considered in a poloidal cross-section of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height. The quantity is defined
    separately for each member of the one-parameter family of nested closed flux
    surfaces, including the plasma boundary when it is the outer closed flux
    surface; it excludes open-field-line regions and material limiter, wall, or
    divertor surfaces.

    It is a contour-shape coefficient, not a flux-surface label, not a
    coordinate of the contour, not a boundary-only quantity, and not an average
    over neighboring flux surfaces. It captures corner departure from the
    reference ellipse; [elongation](name:elongation_of_flux_surface) captures
    the vertical stretching of the contour, and
    [triangularity](name:triangularity_of_flux_surface) captures the
    major-radius displacement of the upper and lower extrema.

    Sector-resolved squareness quantities use the same Luce reference-ellipse
    convention on named corner sectors: [upper outer
    squareness](name:upper_outer_squareness_of_flux_surface) on the upper-$Z$,
    larger-$R$ sector, [upper inner
    squareness](name:upper_inner_squareness_of_flux_surface) on the upper-$Z$,
    smaller-$R$ sector, [lower outer
    squareness](name:lower_outer_squareness_of_flux_surface) on the lower-$Z$,
    larger-$R$ sector, and [lower inner
    squareness](name:lower_inner_squareness_of_flux_surface) on the lower-$Z$,
    smaller-$R$ sector. [Outer
    squareness](name:outer_squareness_of_flux_surface) restricts the quantity to
    larger-$R$ corner sectors, [inner
    squareness](name:inner_squareness_of_flux_surface) restricts it to
    smaller-$R$ corner sectors, and [squareness of the plasma
    boundary](name:squareness_of_plasma_boundary) is the boundary specialization
    of the flux-surface quantity.
  unit: '1'

- name: inner_squareness_of_flux_surface
  description: |-
    Dimensionless Luce shape coefficient quantifying how much the
    high-field-side (inner) corners of a nested magnetic flux surface deviate
    from a reference ellipse; positive values indicate a boxier corner, negative
    values a more diamond-like or indented corner.
  documentation: |-
    The inner squareness of a flux surface is the dimensionless Luce (2013)
    shape coefficient that characterizes how much the high-field-side (inboard,
    smaller major radius) corners of a nested toroidal magnetic flux surface
    depart from a reference ellipse sharing the same center, horizontal
    half-width, and [elongation](name:elongation_of_flux_surface). It is the
    inboard counterpart within the
    [squareness_of_flux_surface](name:squareness_of_flux_surface) family,
    complementing the outboard variants
    [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)
    and
    [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface).
    This parent quantity abstracts over the quadrant-resolved coefficients
    [upper_inner_squareness_of_flux_surface](name:upper_inner_squareness_of_flux_surface)
    and
    [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),
    which independently describe the upper and lower high-field-side corners.

    The coefficient $\zeta$ enters the parametric flux-surface shape model as an
    additional harmonic beyond elongation $\kappa$ and triangularity $\delta$,
    evaluated at the high-field-side corners of the poloidal cross-section in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. A value of zero recovers the reference ellipse
    precisely; deviations capture corner shaping not expressible through
    $\kappa$ and $\delta$ alone.

    The inner squareness is inferred from equilibrium reconstruction by fitting
    closed flux-surface contours to a multi-parameter shape model. Asymmetry
    between upper and lower inner quadrants can arise in vertically asymmetric
    or diverted configurations, motivating the quadrant-resolved child
    quantities.
  unit: '1'

- name: lower_inner_squareness_of_flux_surface
  description: |-
    Dimensionless Luce (2013) squareness coefficient for the lower-inner,
    high-field-side quadrant of a nested magnetic flux surface, measuring signed
    departure from a reference ellipse.
  documentation: |-
    The lower-inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how the lower, high-field-side
    quadrant of a nested toroidal magnetic flux surface departs from a reference
    ellipse sharing the same center, horizontal half-width, and
    [elongation](name:elongation_of_flux_surface). It is the lower-quadrant
    component of [inner squareness of a flux
    surface](name:inner_squareness_of_flux_surface), complementary to
    [upper-inner squareness of a flux
    surface](name:upper_inner_squareness_of_flux_surface).

    The reference ellipse is parameterized in the right-handed cylindrical $(R,
    \phi, Z)$ frame by

    $$
    \mathbf{r}_{\mathrm{ref}}(\theta)=\left(R_0+a\cos\theta,\;Z_0+\kappa a\sin\theta\right)
    $$

    where $R$ is major radius, $Z$ is vertical height, $\theta$ is a poloidal
    parameter, $(R_0,Z_0)$ is the ellipse center, $a$ is its horizontal
    half-width, and $\kappa$ is its elongation. Within the Luce model,
    $\zeta_{\mathrm{li}}=0$ represents no additional lower-inner corner shaping;
    positive values indicate an outward, boxier corner and negative values an
    inward, more indented corner.

    This coefficient describes only the lower high-field-side quadrant and is
    not an average of the upper and lower inner coefficients.
  unit: '1'

- name: outer_squareness_of_flux_surface
  description: |-
    Dimensionless Luce shape coefficient for the outboard corners of nested
    magnetic flux surfaces, measuring signed departure from a co-centered
    reference ellipse across upper and lower quadrants.
  documentation: |-
    The outer squareness of a flux surface is the dimensionless Luce (2013)
    shape coefficient that characterizes how much the outboard (larger major
    radius) corners of a nested toroidal magnetic flux surface depart from a
    reference ellipse sharing the same center, horizontal half-width, and
    [elongation](name:elongation_of_flux_surface). It is the outboard
    counterpart within the
    [squareness_of_flux_surface](name:squareness_of_flux_surface) family,
    complementing the [inner squareness](name:inner_squareness_of_flux_surface),
    and abstracts over the quadrant-resolved coefficients [upper outer
    squareness](name:upper_outer_squareness_of_flux_surface) and [lower outer
    squareness](name:lower_outer_squareness_of_flux_surface).

    At the modeled outboard corners, the reference condition is

    $$
    \zeta_{\rm out}=0 \Longleftrightarrow \mathcal{C}_{\rm out}=\mathcal{E}_{\rm out}
    $$

    where $\zeta_{\rm out}$ is the outer squareness coefficient,
    $\mathcal{C}_{\rm out}$ is the modeled outboard corner of the flux-surface
    cross-section, and $\mathcal{E}_{\rm out}$ is the corresponding reference
    ellipse. The cross-section is described in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    This quantity does not select either the upper or lower outboard quadrant;
    those quadrant-specific coefficients may differ for an up-down asymmetric
    flux surface. Positive values describe boxier outward corners, while
    negative values describe corners indented relative to the reference ellipse.
  unit: '1'

- name: lower_outer_squareness_of_flux_surface
  description: |-
    Dimensionless Luce shape coefficient for the lower outboard quadrant of
    nested magnetic flux surfaces, measuring signed departure from a reference
    ellipse with the same center, horizontal half-width, and elongation.
  documentation: |-
    The lower outer squareness $\zeta_{\rm lo}$ is the dimensionless Luce (2013)
    shape coefficient for the lower outboard ($-Z$, larger-$R$) corner of each
    nested magnetic flux surface, measuring its departure from a reference
    ellipse sharing the same center, horizontal half-width, and elongation.

    At the modeled lower outboard corner, the reference condition is

    $$
    \zeta_{\rm lo}=0 \Longleftrightarrow \mathcal{C}_{\rm lo}=\mathcal{E}_{\rm lo}
    $$

    where $\zeta_{\rm lo}$ is the lower outer squareness coefficient,
    $\mathcal{C}_{\rm lo}$ is the modeled lower outboard corner, and
    $\mathcal{E}_{\rm lo}$ is the corresponding reference ellipse. The
    cross-section is described in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    This coefficient selects the lower outboard quadrant and is the lower
    component of [outer squareness](name:outer_squareness_of_flux_surface),
    complementing [upper outer
    squareness](name:upper_outer_squareness_of_flux_surface). Up-down asymmetry
    allows the two quadrant-specific coefficients to differ; positive values
    describe boxier outward corners, while negative values describe corners
    indented relative to the reference ellipse.

    Sign convention: Positive when the modeled lower outboard corner extends
    toward increasing $R$ beyond the corresponding reference ellipse in the
    right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: '1'

- name: squareness_of_plasma_boundary
  description: |-
    Squareness of the plasma boundary is a dimensionless Luce shape coefficient
    quantifying the whole-boundary corner deviation of the last closed flux
    surface from the reference ellipse set by the boundary minor radius,
    elongation, and triangularity. Positive values make the corner regions
    boxier, approaching the circumscribing rectangle; negative values make them
    more diamond-like.
  documentation: |-
    Squareness of the plasma boundary is a dimensionless Luce shape coefficient
    quantifying the deviation of the corner regions of the last closed flux
    surface from the reference ellipse whose semi-axes are set by the boundary
    minor radius, elongation, and triangularity. It is the whole-boundary
    summary of the quadrant-level squareness values, characterizing whether the
    poloidal cross-section corners bulge outward toward the circumscribing
    rectangle or are pinched inward relative to the elliptical reference
    contour.

    In a poloidal cross-section at fixed toroidal angle $\phi$ of the
    right-handed cylindrical $(R, \phi, Z)$ frame, each quadrant of the boundary
    is bounded by its radial extremum (innermost or outermost major-radius
    point) and its vertical extremum (topmost or bottommost point), and a
    reference ellipse is constructed through these two extrema; the semi-axes of
    this ellipse are fixed by the boundary minor radius, elongation, and
    triangularity. Along the diagonal from the ellipse center $O$ toward the
    corner $F$ of the rectangle circumscribing the quadrant, the quadrant
    squareness is

    $$
    \zeta = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}
    $$

    where $D$ is the intersection of the diagonal with the plasma boundary, $E$
    its intersection with the reference ellipse, and $\overline{OD}$,
    $\overline{OE}$, $\overline{OF}$ are distances from the ellipse center. With
    this construction $\zeta = 0$ when the boundary follows the elliptical arc,
    $\zeta = 1$ when it passes through the rectangle corner, and $\zeta < 0$
    when the corner is indented inside the ellipse (diamond- or bean-like).

    This whole-boundary quantity summarizes the four quadrant-resolved members
    [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    and
    [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    and decomposes into
    [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)
    on the high-field side (smaller major radius $R$) and
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    on the low-field side (larger $R$). Use the quadrant- or side-resolved
    members when the boundary corners are shaped asymmetrically; this quantity
    carries no information about up-down or in-out asymmetry of the corner
    shaping.
  unit: '1'

- name: inner_squareness_of_plasma_boundary
  description: |-
    Inner squareness of the plasma boundary is the Luce shape coefficient for
    the high-field-side corner pair, referenced to an ellipse defined by
    boundary size and shaping.
  documentation: |-
    Inner squareness of the plasma boundary is a dimensionless Luce shape
    coefficient characterizing how the high-field-side corners of the last
    closed flux surface depart from a reference ellipse. It covers the inner
    corner behavior represented separately by the [upper-inner
    squareness](name:upper_inner_squareness_of_plasma_boundary) and [lower-inner
    squareness](name:lower_inner_squareness_of_plasma_boundary) quantities,
    rather than selecting one vertical quadrant.

    In a poloidal cross-section at fixed toroidal angle $\phi$ of the
    right-handed cylindrical $(R, \phi, Z)$ frame, the coefficient for an inner
    quadrant is

    $$
    \zeta = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}
    $$

    where $O$ is the reference-ellipse center, $D$ is the boundary intersection
    along the corner diagonal, $E$ is the corresponding ellipse intersection,
    and $F$ is the corner of the circumscribing rectangle; the overbars denote
    distances. The reference ellipse is set by the boundary minor radius,
    elongation, and triangularity. This component refines the whole-boundary
    [squareness of the plasma boundary](name:squareness_of_plasma_boundary) to
    its high-field-side corners.
  unit: '1'

- name: lower_inner_squareness_of_plasma_boundary
  description: |-
    Dimensionless Luce squareness parameter for the lower-inner (below-midplane,
    high-field-side) plasma boundary in a poloidal cross-section at fixed
    toroidal angle φ in the right-handed cylindrical (R, φ, Z) frame, measuring
    its departure from the reference ellipse set by boundary minor radius,
    elongation, and triangularity.
  documentation: |-
    The lower-inner squareness of the plasma boundary is the dimensionless Luce
    shape coefficient quantifying how much the lower-inboard quadrant of the
    last-closed flux surface deviates from the reference ellipse determined by
    the boundary minor radius, elongation, and triangularity. The lower-inboard
    quadrant is the part of the boundary at smaller major radius and below the
    reference-ellipse center in a poloidal cross-section.

    In the Luce higher-order boundary parameterization, the lower-inner boundary
    contour at fixed toroidal angle $\phi$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame is represented over the lower-inboard interval of the
    poloidal angle $\theta$ by the coefficient $\zeta_{\mathrm{LI}}$:

    $$
    \begin{aligned}
    R(\theta) &= R_{\mathrm{geo}} + a\cos\!\left[\theta + \arcsin(\delta_{\mathrm{ref}})\sin\theta - \zeta_{\mathrm{LI}}\sin(2\theta)\right],\\
    Z(\theta) &= Z_{\mathrm{geo}} + a\kappa_{\mathrm{ref}}\sin\!\left[\theta + \zeta_{\mathrm{LI}}\sin(2\theta)\right]
    \end{aligned}
    $$

    where $R(\theta)$ and $Z(\theta)$ are the major-radius and vertical
    coordinates of the boundary point, $R_{\mathrm{geo}}$ and $Z_{\mathrm{geo}}$
    are the coordinates of the geometric center of the reference ellipse, $a$ is
    the boundary minor radius, $\kappa_{\mathrm{ref}}$ and
    $\delta_{\mathrm{ref}}$ are the elongation and triangularity entering the
    same reference boundary description, and $\theta=0$ labels the outboard
    midplane with increasing $\theta$ first moving toward $+Z$. The geometric
    center of the reference ellipse is not the magnetic-axis position unless
    those points coincide for the chosen boundary geometry.

    This quantity is restricted to the lower-inboard quadrant and excludes the
    upper-inboard quadrant represented by
    [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary).
    It is a quadrant-resolved component of
    [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary),
    distinct from the outer-side squareness components, and complements
    [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary) and
    [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary) in
    describing boundary shape beyond the reference ellipse. With the sign shown
    in the Luce representation, positive $\zeta_{\mathrm{LI}}$ moves the
    lower-inboard corner toward smaller $R$ and lower $Z$ relative to the
    reference ellipse, making that corner more rectangular; negative values make
    it rounder.
  unit: '1'

- name: outer_squareness_of_plasma_boundary
  description: |-
    Dimensionless Luce shape coefficient measuring how both outboard
    (low-field-side) corners of the plasma boundary depart from the reference
    ellipse defined by minor radius, elongation, and triangularity.
  documentation: |-
    The outer squareness of the plasma boundary is the Luce (2013) dimensionless
    shape coefficient characterizing how the low-field-side (large-$R$) corners
    of the last-closed flux surface poloidal cross-section depart from the
    reference ellipse defined by the boundary minor radius $a$, elongation
    $\kappa$, and triangularity $\delta$. It is the parent quantity for
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and
    [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    which resolve the upper-outboard and lower-outboard corner contributions
    separately.

    A positive outer squareness indicates the outboard corners of the plasma
    cross-section lie outside the reference ellipse (a more rectangular
    boundary), while a negative value indicates inward concavity at the outboard
    corners. The outer squareness is particularly sensitive to X-point geometry
    and the configuration of low-field-side shaping coils, making it relevant to
    heat-load distribution and edge stability.

    Outer squareness is inferred from equilibrium reconstruction by fitting the
    poloidal boundary contour $\{R(\xi), Z(\xi)\}$, where $\xi$ is a poloidal
    parameter, to external magnetic measurements and internal constraints. The
    global single-coefficient summary is provided by
    [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary), while
    the high-field-side corner contributions are captured by
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    and upper_inner_squareness_of_plasma_boundary.
  unit: '1'

- name: lower_outer_squareness_of_plasma_boundary
  description: |-
    Dimensionless Luce shape coefficient measuring how the lower outboard
    (low-field-side) corner of the plasma boundary departs from the reference
    ellipse defined by boundary minor radius, lower elongation, and lower
    triangularity.
  documentation: |-
    The lower outer squareness $\zeta_{lo}$ is one of four corner-specific shape
    parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the lower outer quadrant of the plasma cross-section boundary
    deviates from the reference ellipse defined by the boundary minor radius
    $a$, lower elongation $\kappa_l$, and lower triangularity $\delta_l$. The
    lower outer quadrant is the low-field-side, large-$R$ corner below the
    magnetic-axis height in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.

    Within the Luce corner parameterization, the coefficient is related to the
    lower-outer superellipse exponent $n_{lo}$ by

    $$
    \zeta_{lo} = 1 - \frac{2}{n_{lo}}
    $$

    where $n_{lo}$ controls the local corner curvature of the lower-outboard
    boundary segment. The reference ellipse corresponds to $n_{lo}=2$.

    Positive values indicate that the lower-outboard boundary corner lies
    outside the reference ellipse at the corresponding corner location, giving a
    more rectangular boundary; $\zeta_{lo}=0$ indicates the reference ellipse;
    negative values indicate that the corner lies inside the reference ellipse,
    giving inward concavity relative to that ellipse. This coefficient excludes
    the upper-outboard and high-field-side corner contributions represented by
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    and
    [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary);
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    combines the outboard corner behavior, and
    [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary) is the
    global single-coefficient summary.
  unit: '1'

- name: surface_area_of_flux_surface
  description: |-
    Surface area of a complete magnetic flux surface, including its full
    poloidal and toroidal extent rather than the enclosed poloidal
    cross-section.
  documentation: |-
    Area of flux surface

    The area is defined by

    $$
    A = \iint_{\mathcal S} dS
    $$

    where $A$ is the surface area, $\mathcal S$ is the specified flux surface,
    and $dS$ is the nonnegative geometric surface-area element.

    This quantity applies to one complete flux surface, not solely to the plasma
    boundary. It is integrated over the entire surface and is neither a local
    area element nor a flux-surface average.

    Unlike the [poloidal-plane cross-sectional
    area](name:poloidal_plane_cross_sectional_area_of_flux_surface), it measures
    the surface itself rather than the planar region enclosed by its contour. It
    also differs from the [enclosed volume](name:volume_of_flux_surface), which
    measures the full interior bounded by the same surface.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: m^2

- name: toroidal_angle_of_control_surface
  description: |-
    Toroidal angle locating each point of a control surface about the machine
    symmetry axis, measured in the right-handed cylindrical frame from the
    facility-defined zero direction.
  documentation: |-
    The toroidal angle identifies the azimuthal location of a point on the
    control surface about the machine symmetry axis. It is the geometrical
    coordinate defined for [toroidal angle](name:toroidal_angle), with the
    control-surface locus providing the points to which it applies.

    For a point with Cartesian coordinates $x$ and $y$ in the right-handed
    $(\hat{x},\hat{y},\hat{z})$ basis, the angle in the right-handed cylindrical
    $(R,\phi,Z)$ frame is defined by:

    $$
    \phi = \operatorname{atan2}(y,x) \pmod{2\pi}
    $$

    where $R$ is the major radius, $Z$ is vertical height, and the zero of
    $\phi$ follows the facility-defined reference direction. The angle is
    periodic, so values differing by an integer multiple of $2\pi$ represent the
    same toroidal direction; it is distinct from the vertical coordinate of the
    control surface.

    Sign convention: Positive when $\phi$ increases counter-clockwise when
    viewed from above the $+\hat{Z}$ direction.
  unit: rad

- name: toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface
  description: |-
    Toroidal diamagnetic magnetic flux at an inside flux surface is the
    diamagnetic contribution to the toroidal magnetic flux through the poloidal
    cross-section enclosed by a selected closed flux surface.
  documentation: |-
    Toroidal diamagnetic magnetic flux at an inside flux surface is the
    diamagnetic contribution to the [toroidal magnetic
    flux](name:toroidal_magnetic_flux) through the poloidal cross-section
    enclosed by a selected closed flux surface. It is a surface-dependent
    cumulative flux inside the plasma boundary, not only a boundary value.

    For an axisymmetric equilibrium in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle increasing
    counter-clockwise viewed from above $+\hat{Z}$, and $Z$ is vertical height,
    let $S_\chi$ be the constant-$\phi$ poloidal cross-section enclosed by the
    flux surface labeled by $\chi$. With $d\mathbf{A}_\phi = \hat{\phi}\,dA$
    oriented toward increasing $\phi$, the enclosed diamagnetic toroidal flux is
    defined by:

    $$
    \Phi_{\phi,\mathrm{dia}}(\chi) = \int_{S_\chi} \mathbf{B}_{\mathrm{dia}}(R,Z) \cdot d\mathbf{A}_\phi = \int_{S_\chi} B_{\phi,\mathrm{dia}}(R,Z)\,dA
    $$

    where $\chi$ identifies the selected flux surface,
    $\mathbf{B}_{\mathrm{dia}}$ is the diamagnetic contribution to the
    equilibrium magnetic field, $B_{\phi,\mathrm{dia}} =
    \mathbf{B}_{\mathrm{dia}}\cdot\hat{\phi}$ is its toroidal component,
    $\hat{\phi}$ is the unit vector toward increasing toroidal angle, and $dA$
    is the positive scalar area element on $S_\chi$.

    This quantity includes only the diamagnetic magnetic-field contribution. It
    is distinct from the total
    [toroidal_magnetic_flux](name:toroidal_magnetic_flux), which includes all
    magnetic-field contributions, from
    [toroidal_magnetic_flux_at_plasma_boundary](name:toroidal_magnetic_flux_at_plasma_boundary),
    which is evaluated at the plasma boundary, and from
    [toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current](name:toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current),
    which isolates the poloidal-current contribution at that boundary.

    Sign convention: Positive when the net diamagnetic magnetic-field
    contribution through the enclosed poloidal cross-section points in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, counter-clockwise viewed from above
    $+\hat{Z}$.
  unit: Wb

- name: toroidal_flux_coordinate
  description: |-
    Toroidal flux coordinate is a non-negative, radius-like magnetic-surface
    label derived from enclosed toroidal magnetic flux using a positive
    reference vacuum toroidal field.
  documentation: |-
    Toroidal flux coordinate

    The coordinate is defined by

    $$\rho_{\mathrm{tor}} = \sqrt{\Phi/(\pi B_0)}$$

    where $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate, $\Phi$ is the
    non-negative toroidal magnetic flux enclosed by the flux surface, and $B_0$
    is the positive reference vacuum toroidal magnetic-field strength at the
    specified reference major radius.

    The definition applies to any nested magnetic flux surface, without
    restriction to a boundary, transport barrier, or mode-center locus. Each
    surface carries a single label; this coordinate is neither a flux-surface
    average nor a region integral and need not equal the surface's geometric
    minor radius.

    The [magnetic-axis value](name:toroidal_flux_coordinate_of_magnetic_axis) is
    zero because the enclosed toroidal flux vanishes there. With the same
    reference field used throughout, dividing the coordinate by its
    [plasma-boundary value](name:toroidal_flux_coordinate_at_plasma_boundary)
    gives the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate), which is zero at the
    magnetic axis and one at that boundary.
  unit: m

- name: toroidal_flux_coordinate_gradient
  description: |-
    Toroidal flux coordinate gradient is the spatial variation of a flux-surface
    label based on enclosed toroidal magnetic flux. It denotes the gradient
    family itself, without fixing a particular norm, projection, component, or
    flux-surface average.
  documentation: |-
    Toroidal flux coordinate gradient is the spatial gradient of a flux-surface
    label $\chi$ constructed from toroidal magnetic flux. It represents the
    underlying gradient concept from which scalar measures, components,
    projections, and averages of the coordinate variation are defined.

    The relation between the coordinate change and the gradient is:

    $$
    d\chi = \nabla \chi \cdot d\mathbf{x}
    $$

    where $\chi$ is the toroidal-flux-based flux coordinate, $\nabla \chi$ is
    its spatial gradient, and $d\mathbf{x}$ is an infinitesimal displacement in
    physical space.

    This parent name does not by itself specify a norm, component, projection
    direction, surface average, or normalization of $\chi$. The [toroidal flux
    coordinate gradient
    magnitude](name:toroidal_flux_coordinate_gradient_magnitude) is a concrete
    child that selects the norm of the same underlying gradient; other qualified
    children would select other scalar forms.
  unit: '1'

- name: toroidal_flux_coordinate_gradient_magnitude
  description: |-
    Measure of how rapidly a toroidal magnetic-flux coordinate changes in space,
    obtained from the magnitude of its spatial gradient.
  documentation: |-
    This quantity represents the local geometric rate at which a toroidal
    magnetic-flux coordinate changes through physical space. It is the
    magnitude-based measure derived from the spatial gradient, independent of
    any particular direction or projection.

    The defining relation is

    $$
    \left|\nabla \chi\right| = \sqrt{\nabla\chi \cdot \nabla\chi}
    $$

    where $\chi$ is the toroidal magnetic-flux coordinate, $\nabla$ is the
    spatial-gradient operator, and the dot denotes the Euclidean inner product
    of the gradient with itself.

    The local form is evaluated pointwise and is not intrinsically flux-surface
    averaged or squared. The [flux-surface-averaged toroidal flux coordinate
    gradient
    magnitude](name:flux_surface_averaged_toroidal_flux_coordinate_gradient_magnitude)
    applies a flux-surface average to this measure, while [square of toroidal
    flux coordinate gradient
    magnitude](name:square_of_toroidal_flux_coordinate_gradient_magnitude)
    applies the algebraic square. Both are derived from the underlying [toroidal
    flux coordinate gradient](name:toroidal_flux_coordinate_gradient), which
    retains the full spatial-gradient quantity rather than its magnitude.
  unit: '1'

- name: flux_surface_averaged_toroidal_flux_coordinate_gradient_magnitude
  description: |-
    Geometric metric coefficient formed by averaging the local magnitude of the
    toroidal-flux-coordinate gradient over each nested magnetic flux surface.
  documentation: |-
    This quantity is the flux-surface average of the local geometric rate at
    which the toroidal flux coordinate changes through physical space. It is a
    scalar metric coefficient associated with nested magnetic surfaces.

    The defining relation is

    $$
    \mathcal{G}(\mathcal{S}) = \left\langle \left|\nabla \rho_{\mathrm{tor}}\right| \right\rangle_{\mathcal{S}}
    $$

    where $\mathcal{G}(\mathcal{S})$ is the averaged metric coefficient,
    $\mathcal{S}$ is a magnetic flux surface, $\rho_{\mathrm{tor}}$ is the
    toroidal flux coordinate labeling nested magnetic surfaces, $\nabla$ is the
    spatial gradient, and the angle brackets with subscript $\mathcal{S}$ denote
    averaging over that surface.

    The quantity applies to the complete nested magnetic flux surface and is
    aggregated over the surface rather than evaluated at a point, along a line,
    or over a volume. It represents the average of the gradient magnitude, not a
    directional component and not the local unaveraged value.

    It is obtained by applying flux-surface averaging to the local [toroidal
    flux coordinate gradient
    magnitude](name:toroidal_flux_coordinate_gradient_magnitude). Unlike
    [flux-surface-averaged square of toroidal flux coordinate gradient
    magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
    it averages the magnitude itself rather than its square.
  unit: '1'

- name: square_of_toroidal_flux_coordinate_gradient_magnitude
  description: |-
    Squared spatial gradient of a toroidal magnetic-flux coordinate, providing a
    geometric coefficient for equilibrium descriptions in physical space.
  documentation: |-
    This quantity is the squared magnitude of the spatial gradient of a toroidal
    magnetic-flux coordinate. It characterizes how rapidly the chosen flux
    coordinate changes through physical space and serves as the geometric basis
    for local and flux-surface equilibrium coefficients.

    The underlying geometric measure is defined by

    $$
    G_\chi = \left|\nabla \chi\right|^2
    $$

    where $G_\chi$ is the squared flux-coordinate gradient magnitude, $\chi$ is
    the toroidal magnetic-flux coordinate, $\nabla$ is the spatial gradient
    operator, and the magnitude is taken with the physical-space metric.

    The quantity applies to equilibrium magnetic geometry wherever the toroidal
    flux coordinate and its spatial gradient are defined. Its aggregation is not
    fixed at the parent level: concrete instances may be evaluated locally,
    averaged over a magnetic flux surface, or formed into a ratio with another
    geometric quantity.

    It is distinct from the unsquared [toroidal flux-coordinate gradient
    magnitude](name:toroidal_flux_coordinate_gradient_magnitude), and it does
    not itself prescribe a denominator such as magnetic-field strength or major
    radius. The [flux-surface-averaged
    square](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude)
    is the averaged instance, while related ratio quantities compare this
    squared geometric factor with the squared magnetic-field magnitude or
    squared major radius.
  unit: '1'

- name: flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude
  description: |-
    Flux-surface average of the squared magnitude of the gradient of the
    normalized toroidal-flux radius. It is the averaged contravariant radial
    metric coefficient for the flux coordinate rho_tor.
  documentation: |-
    Flux-surface average of the squared magnitude of the gradient of the
    toroidal flux coordinate is the average, over one magnetic flux surface, of
    the squared norm of $\nabla \rho_\mathrm{tor}$. It is the
    flux-surface-averaged contravariant radial metric coefficient associated
    with the radial coordinate in the flux-coordinate system
    $(\rho_\mathrm{tor}, \theta, \phi)$, where $\theta$ is a poloidal angle
    label and $\phi$ is the toroidal angle.

    The quantity is defined by the flux-surface average of the local radial
    metric component:

    $$
    G_{\rho\rho}(\rho_\mathrm{tor}) = \left\langle |\nabla \rho_\mathrm{tor}|^2 \right\rangle_{\rho_\mathrm{tor}} = \frac{\int_{S(\rho_\mathrm{tor})} |\nabla \rho_\mathrm{tor}|^2\, dA / |\nabla \rho_\mathrm{tor}|}{\int_{S(\rho_\mathrm{tor})} dA / |\nabla \rho_\mathrm{tor}|}
    $$

    where $G_{\rho\rho}$ denotes this flux-surface-averaged metric coefficient,
    $\rho_\mathrm{tor}$ is the normalized toroidal-flux radius,
    $S(\rho_\mathrm{tor})$ is the magnetic flux surface with that label,
    $\nabla$ is the spatial gradient operator, $dA$ is the surface-area element,
    and $\langle\cdot\rangle_{\rho_\mathrm{tor}}$ denotes averaging over that
    flux surface.

    The coordinate $\rho_\mathrm{tor}$ is constituted by
    $\rho_\mathrm{tor}=\sqrt{\Phi/\Phi_b}$, where $\Phi$ is the toroidal
    magnetic flux enclosed by the flux surface and $\Phi_b$ is its value at the
    plasma boundary. The scope is closed nested equilibrium flux surfaces; the
    aggregation convention is an average over the entire surface at fixed
    $\rho_\mathrm{tor}$.

    This is not the pointwise quantity $|\nabla \rho_\mathrm{tor}|^2$, not the
    flux-surface average of $|\nabla \rho_\mathrm{tor}|$, and not a volume or
    time average. It belongs to the same flux-surface-averaged geometric-metric
    family as the [flux-surface-averaged inverse major
    radius](name:flux_surface_averaged_inverse_of_major_radius), but it
    characterizes the radial metric of the normalized toroidal-flux radius
    rather than a major-radius factor.
  unit: '1'

- name: ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude
  description: |-
    Ratio of the square of the toroidal-flux-coordinate gradient magnitude to
    the square of the local magnetic-field magnitude. It is the unaveraged
    magnetic-geometry ratio whose flux-surface average defines the corresponding
    averaged geometry coefficient.
  documentation: |-
    Ratio of the square of the toroidal-flux-coordinate gradient magnitude to
    the square of the local magnetic-field magnitude is a local scalar
    magnetic-geometry coefficient. It expresses how the spatial metric of the
    toroidal flux coordinate is weighted by the magnetic-field strength at the
    same position.

    The coefficient $K_{\rho B}$ is defined pointwise by:

    $$
    K_{\rho B}(\mathbf{x}) = \frac{|\nabla \rho_\mathrm{tor}(\mathbf{x})|^2}{|\mathbf{B}(\mathbf{x})|^2}
    $$

    where $K_{\rho B}$ is this ratio, $\mathbf{x}$ is spatial position,
    $\rho_\mathrm{tor}$ is the toroidal flux coordinate, $\nabla
    \rho_\mathrm{tor}$ is its spatial gradient, $\mathbf{B}$ is the
    magnetic-field vector, and $|\mathbf{B}|$ is the [magnetic-field
    magnitude](name:magnetic_field_magnitude).

    This quantity is the unaveraged, pointwise ratio evaluated where the
    toroidal flux coordinate is differentiable and the magnetic-field magnitude
    is nonzero. It does not include a flux-surface, volume, or time average, and
    it is distinct from an averaged geometry coefficient.

    The numerator is the [square of the toroidal flux-coordinate gradient
    magnitude](name:square_of_toroidal_flux_coordinate_gradient_magnitude), and
    the denominator is the square of the local magnetic-field magnitude at the
    same position. The [flux-surface-averaged
    ratio](name:flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude)
    is obtained by applying a flux-surface average to this local quotient
    itself, not by separately averaging the numerator and denominator.
  unit: T^-2

- name: flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude
  description: |-
    Flux-surface average of the squared toroidal-flux-coordinate gradient
    magnitude divided by the squared local magnetic-field magnitude, a metric
    coefficient for equilibrium geometry.
  documentation: |-
    This coefficient describes the flux-surface-averaged geometric weighting of
    a toroidal-flux radial coordinate by the inverse square of the local
    magnetic-field magnitude.

    The defining relation is

    $$
    \mathcal{G}_B = \left\langle \frac{|\nabla \rho_{\mathrm{tor}}|^2}{|\mathbf{B}|^2} \right\rangle_{\mathrm{FS}}
    $$

    where $\mathcal{G}_B$ is the averaged metric coefficient,
    $\rho_{\mathrm{tor}}$ is the toroidal-flux radial coordinate, $\nabla$ is
    the spatial gradient, $\mathbf{B}$ is the magnetic-field vector, and
    $\langle\cdot\rangle_{\mathrm{FS}}$ denotes the average over a magnetic flux
    surface.

    The quantity applies to nested equilibrium magnetic flux surfaces and uses
    the average of the pointwise ratio, not the ratio of separately averaged
    numerator and denominator. It is nonnegative because both the gradient
    magnitude and magnetic-field magnitude are squared.

    It is the flux-surface-averaged form of the local [ratio of squared
    toroidal-flux-coordinate gradient magnitude to squared magnetic-field
    magnitude](name:ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude).
    It shares the gradient-squared geometric factor with the
    [flux-surface-averaged squared toroidal-flux-coordinate gradient
    magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
    but additionally applies the pointwise inverse-square magnetic-field
    weighting before averaging. It is distinct from the corresponding
    major-radius denominator variant, [flux-surface-averaged ratio of squared
    toroidal-flux-coordinate gradient magnitude to squared major
    radius](name:flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius).
  unit: T^-2

- name: ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius
  description: |-
    Geometric equilibrium coefficient representing a squared flux-coordinate
    gradient scaled by the inverse square of major radius.
  documentation: |-
    This quantity is a geometric metric coefficient for nested magnetic flux
    surfaces in toroidal plasma equilibrium. It measures spatial variation of a
    flux coordinate after scaling by the inverse square of the major radius,
    rather than representing a material, particle, or transport quantity.

    For the gradient-ratio form represented by this family, the coefficient is
    defined by:

    $$
    \mathcal{G}(\xi,R) = \frac{|\nabla \xi|^2}{R^2}
    $$

    where $\mathcal{G}$ is the geometric coefficient, $\xi$ is the relevant
    flux-coordinate label, $\nabla \xi$ is its spatial gradient, $|\nabla \xi|$
    is the gradient magnitude, and $R$ is the major-radius coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The scope is equilibrium magnetic geometry associated with nested flux
    surfaces; no plasma population is selected, and the quantity is not a
    density, magnetic-field strength, or transport coefficient. It is the
    metric-ratio component of
    [square_of_major_radius](name:square_of_major_radius), distinguished from a
    bare reciprocal-square-radius factor by the flux-coordinate gradient in its
    numerator. The parent quantity is not intrinsically flux-surface averaged;
    averaging is an explicit aggregation applied by a child.

    The representative [flux-surface-averaged gradient-ratio
    coefficient](name:flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius)
    is the flux-surface average of this geometric ratio. This distinguishes it
    from
    [flux_surface_averaged_inverse_of_square_of_major_radius](name:flux_surface_averaged_inverse_of_square_of_major_radius),
    which contains the reciprocal-square major-radius factor without the
    flux-coordinate gradient factor.
  unit: m^-2

- name: flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius
  description: |-
    Flux-surface-averaged magnetic-geometry coefficient measuring the squared
    toroidal-flux-coordinate gradient relative to the squared major radius.
  documentation: |-
    This quantity is a magnetic-geometry metric coefficient that characterizes
    how a toroidal-flux radial coordinate varies across nested magnetic
    surfaces, with the variation weighted by inverse squared major radius.

    It is defined by

    $$
    g_2 = \left\langle \frac{|\nabla \rho|^2}{R^2} \right\rangle_{\mathrm{FS}}
    $$

    where $g_2$ is the flux-surface-averaged metric coefficient, $\rho$ is the
    toroidal-flux radial coordinate, $\nabla\rho$ is its spatial gradient,
    $|\nabla\rho|$ is the gradient magnitude, $R$ is the major radius, and the
    subscript $\mathrm{FS}$ denotes the prescribed average over a complete
    magnetic flux surface.

    The quantity applies to an equilibrium magnetic flux surface and represents
    an aggregate over that surface rather than a pointwise local value. It has
    no species, population, or transport-channel restriction.

    It is the flux-surface average of the local ratio defined by [ratio of
    square of toroidal flux coordinate gradient magnitude to square of major
    radius](name:ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius).
    Unlike [flux-surface-averaged square of toroidal flux coordinate gradient
    magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
    it retains the inverse-square-major-radius weighting; the numerator is
    constructed from the [toroidal flux coordinate gradient
    magnitude](name:toroidal_flux_coordinate_gradient_magnitude).
  unit: m^-2

- name: toroidal_flux_coordinate_of_magnetic_axis
  description: |-
    Value of the radius-like toroidal-flux label on the magnetic surface passing
    through the magnetic axis; it is zero because enclosed toroidal flux
    vanishes there.
  documentation: |-
    The toroidal flux coordinate at the magnetic axis is the value of the
    radius-like flux-surface label on the magnetic-axis reference surface. It
    identifies the origin of the toroidal-flux radial coordinate and is not a
    geometric distance from the machine symmetry axis.

    The coordinate is defined by

    $$
    \rho_{\mathrm{tor}} = \sqrt{\frac{\Phi_{\mathrm{tor}}}{\pi B_0}}
    $$

    where $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate,
    $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux enclosed by the magnetic
    surface, and $B_0$ is the positive reference vacuum toroidal magnetic-field
    strength. At the magnetic axis, the enclosed toroidal flux is zero, so this
    value is zero.

    The quantity applies to the single magnetic-axis locus and is neither a
    flux-surface average nor an integral over a finite region. It is the axis
    value of the parent [toroidal flux
    coordinate](name:toroidal_flux_coordinate), not the coordinate of an
    arbitrary flux surface or a geometric major- or minor-radius measurement.

    The [toroidal magnetic flux](name:toroidal_magnetic_flux) supplies the
    enclosed-flux quantity in the defining relation, while the corresponding
    normalized toroidal-flux coordinate uses axis and boundary values to form a
    dimensionless radial label.
  unit: m

- name: toroidal_magnetic_field_at_flux_surface
  description: |-
    Toroidal magnetic field at a flux surface is the signed component of the
    equilibrium magnetic-field vector along the φ direction of the right-handed
    cylindrical (R, φ, Z) frame at a specified point on a magnetic flux surface.
  documentation: |-
    Toroidal magnetic field at a flux surface is the coefficient $B_\phi$
    multiplying $\hat{\phi}$ in the cylindrical decomposition of the equilibrium
    magnetic-field vector at a point on a selected magnetic flux surface. The
    direction $\hat{\phi}$ belongs to the right-handed cylindrical $(R, \phi,
    Z)$ basis, where $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$.

    The component is the signed scalar projection onto the toroidal basis
    vector:

    $$
    B_\phi(\mathbf{x}) = \mathbf{B}(\mathbf{x}) \cdot \hat{\phi}(\mathbf{x})
    $$

    where $\mathbf{x}$ is the point on the selected magnetic flux surface and
    $\mathbf{B}$ is the equilibrium magnetic-field vector.

    This is the cylindrical $(R, \phi, Z)$ toroidal component, not the poloidal
    magnetic field at a flux surface, radial magnetic field at a flux surface,
    vertical magnetic field at a flux surface, or magnetic-field magnitude at a
    flux surface. The surface locus is specified independently, for example by
    the [poloidal magnetic flux at a flux
    surface](name:poloidal_magnetic_flux_at_flux_surface); this quantity is not
    the flux label itself.

    Sign convention: Positive when the magnetic-field vector component is in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: T

- name: toroidal_magnetic_flux
  description: |-
    Toroidal magnetic flux is the signed integral of the toroidal magnetic field
    through the poloidal cross-section enclosed by a specified magnetic flux
    surface.
  documentation: |-
    Toroidal magnetic flux is the net flux of the toroidal magnetic-field
    component through the poloidal cross-section enclosed by a specified
    magnetic flux surface. It specializes [magnetic flux](name:magnetic_flux) by
    selecting a surface whose normal points in the toroidal direction.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, it is defined
    by

    $$
    \Phi_{\mathrm{tor}} = \int_{\Omega} \mathbf{B}\cdot\hat{\phi}\,dA_{RZ} = \int_{\Omega} B_\phi\,dA_{RZ}
    $$

    where $\Phi_{\mathrm{tor}}$ is toroidal magnetic flux, $\Omega$ is the
    poloidal cross-sectional region enclosed by the selected magnetic flux
    surface, $\mathbf{B}$ is the total magnetic field, $\hat{\phi}$ is the unit
    vector toward increasing toroidal angle, $B_\phi$ is the toroidal
    magnetic-field component, and $dA_{RZ}$ is the positive poloidal
    cross-sectional area element.

    The integral includes both externally imposed toroidal field and the field
    associated with plasma poloidal current, rather than only a selected source
    contribution. It is cumulative inside the selected flux surface, vanishes as
    that surface contracts to the magnetic axis, and becomes [toroidal magnetic
    flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary)
    when the selected surface is the plasma boundary. It is neither the
    geometric toroidal angle nor a flux-surface average.

    Unlike [poloidal magnetic flux](name:poloidal_magnetic_flux), which threads
    a horizontal disk centered on the symmetry axis, toroidal magnetic flux
    threads a poloidal cross-section. The [difference of poloidal and toroidal
    magnetic flux] is $\psi^* = \psi - \Phi_{\mathrm{tor}}$, where $\psi$ is
    poloidal magnetic flux and $\psi^*$ is the combined flux coordinate. The
    [post-sawtooth-crash
    difference](name:difference_of_poloidal_magnetic_flux_at_post_sawtooth_crash_and_toroidal_magnetic_flux)
    uses the post-crash poloidal flux without changing this definition of
    toroidal flux.

    Sign convention: Positive when the net toroidal magnetic field threading the
    enclosed poloidal cross-section points toward increasing toroidal angle
    $\phi$, counterclockwise viewed from above.
  unit: Wb

- name: toroidal_magnetic_flux_at_plasma_boundary
  description: |-
    Toroidal magnetic flux at the plasma boundary is the net flux of toroidal
    magnetic field through the poloidal cross-section enclosed by the plasma
    boundary, including externally imposed and plasma-poloidal-current
    contributions.
  documentation: |-
    Toroidal magnetic flux at the plasma boundary is the net flux of the
    toroidal magnetic-field component through the poloidal cross-section
    enclosed by the plasma boundary. It is the boundary value of toroidal
    magnetic flux used to define toroidal-flux radial labels.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is vertical height, the boundary toroidal
    flux is defined by

    $$
    \Phi_{\mathrm{tor},b} = \int_{\Omega_b} \mathbf{B}\cdot\hat{\phi}\, dA_{RZ} = \int_{\Omega_b} B_\phi(R,Z)\, dA_{RZ} = \int_{\Omega_b} \frac{F(\psi(R,Z))}{R}\, dA_{RZ}
    $$

    where $\Phi_{\mathrm{tor},b}$ is this boundary toroidal flux, $\Omega_b$ is
    the boundary-enclosed region in the poloidal plane of the right-handed
    cylindrical $(R, \phi, Z)$ frame, $\mathbf{B}$ is the magnetic field,
    $B_\phi$ is its toroidal component in tesla, $dA_{RZ}$ is the poloidal
    cross-sectional area element in square meters, $F(\psi)=R B_\phi$ is the
    poloidal-current function in tesla meters, and $\psi$ is the equilibrium
    poloidal magnetic-flux label.

    The geometric measure of $\Omega_b$ is the [poloidal cross-sectional area of
    the plasma
    boundary](name:poloidal_plane_cross_sectional_area_of_plasma_boundary).
    $\Phi_{\mathrm{tor},b}$ includes both externally imposed toroidal-field flux
    and the contribution associated with plasma poloidal current, and is
    distinct from [toroidal magnetic flux at the plasma boundary due to poloidal
    current](name:toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current),
    which contains only that plasma-current contribution. It also differs from
    [poloidal magnetic flux at the plasma
    boundary](name:poloidal_magnetic_flux_at_plasma_boundary), which is magnetic
    flux through a horizontal disk rather than through the boundary-enclosed
    poloidal cross-section.

    Sign convention: Positive when the net toroidal magnetic field threading the
    plasma-boundary poloidal cross-section points in the direction of increasing
    toroidal angle $\phi$.
  unit: Wb

- name: toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current
  description: |-
    Signed toroidal magnetic flux through the poloidal cross-section enclosed by
    the plasma boundary, attributable specifically to plasma poloidal current.
  documentation: |-
    This quantity is the contribution to the toroidal magnetic flux enclosed by
    the plasma boundary that is generated by the plasma poloidal current. It is
    a component of the [toroidal magnetic flux at the plasma
    boundary](name:toroidal_magnetic_flux_at_plasma_boundary), distinct from
    contributions attributed to other physical processes.

    The contribution is defined by

    $$
    \Phi_{\mathrm{pol}} = \int_{A_b} B_{\phi}^{\mathrm{pol}}\,\mathrm{d}A_p
    $$

    where $A_b$ is the poloidal cross-sectional area enclosed by the plasma
    boundary, $B_{\phi}^{\mathrm{pol}}$ is the toroidal magnetic-field component
    generated by the poloidal plasma current, and $\mathrm{d}A_p$ is the
    oriented area element of that cross-section. The toroidal direction is
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame.

    This quantity excludes toroidal-flux contributions attributed to other
    mechanisms, such as the [toroidal magnetic flux due to diamagnetic
    drift](name:toroidal_magnetic_flux_due_to_diamagnetic_drift), and is not
    necessarily the total boundary flux.

    Sign convention: Positive when $B_{\phi}^{\mathrm{pol}}$ points in the
    direction of increasing toroidal angle $\phi$ through the poloidal
    cross-section oriented with normal $+\hat{\phi}$.
  unit: Wb

- name: toroidal_magnetic_flux_due_to_diamagnetic_drift
  description: |-
    Toroidal magnetic flux change through a poloidal cross-section caused by the
    pressure-gradient-driven plasma response relative to a reference field
    without that response.
  documentation: |-
    Toroidal magnetic flux due to diamagnetic drift is the signed,
    surface-integrated magnetic response associated with
    pressure-gradient-driven plasma diamagnetism. It is the toroidal
    specialization of the [magnetic-flux contribution due to diamagnetic
    drift](name:magnetic_flux_due_to_diamagnetic_drift), defined relative to a
    corresponding reference field without that response.

    The contribution through an oriented poloidal cross-section is defined by

    $$
    \Phi_{\phi,\mathrm{dia}} = \int_S \left(\mathbf{B}-\mathbf{B}_{\mathrm{ref}}\right)\cdot\hat{\phi}\,\mathrm{d}S
    $$

    where $\Phi_{\phi,\mathrm{dia}}$ is the toroidal diamagnetic flux, $S$ is
    the poloidal integration surface, $\mathbf{B}$ is the equilibrium magnetic
    field, $\mathbf{B}_{\mathrm{ref}}$ is the corresponding reference magnetic
    field with the same external excitation but without the diamagnetic
    response, and $\mathrm{d}S$ is a positive surface-area element. In the
    right-handed cylindrical $(R,\phi,Z)$ frame, $R$ is major radius, $\phi$ is
    toroidal angle, $Z$ is vertical height, and $\hat{\phi}$ is the unit vector
    toward increasing toroidal angle; the surface normal is chosen along
    $\hat{\phi}$.

    This is a global flux contribution over the specified cross-section, not a
    local magnetic-field value or a flux value at a particular magnetic surface.
    It excludes the reference-field flux and is distinct from both total
    toroidal magnetic flux and poloidal magnetic flux. The [toroidal current
    density due to diamagnetic
    drift](name:toroidal_current_density_due_to_diamagnetic_drift) instead
    describes a local electric-current contribution, not this integrated
    magnetic response.

    Sign convention: Positive when the diamagnetic magnetic-field change
    produces net flux in the direction of increasing toroidal angle $\phi$.
  unit: Wb

- name: triangularity_of_flux_surface
  description: |-
    Signed dimensionless shape parameter measuring the normalized horizontal
    displacement of a nested magnetic flux surface’s upper or lower vertical
    extremum.
  documentation: |-
    Triangularity of a nested magnetic flux surface is the signed shape
    parameter formed from the horizontal displacement of an upper or lower
    vertical extremum, normalized by the surface’s horizontal half-width.

    For a selected upper or lower vertical extremum, triangularity is defined in
    the right-handed cylindrical $(R,\phi,Z)$ frame by

    $$
    \delta_s = \frac{R_c - R_s}{a}
    $$

    where $\delta_s$ is the triangularity, $s$ identifies the selected upper or
    lower vertical extremum, $R_s$ is its radial coordinate, $R_c$ is the radial
    midpoint of the flux surface’s horizontal extent, and $a$ is the
    corresponding horizontal half-width.

    This is a geometric parameter of an individual nested magnetic flux surface
    in an equilibrium plasma. The unqualified quantity covers either vertical
    extremum and carries no aggregation over multiple flux surfaces, plasma
    volume, or the plasma boundary.

    Triangularity characterizes the radial displacement of a vertical extremum;
    it is distinct from [elongation of a flux
    surface](name:elongation_of_flux_surface), which describes the ratio of
    vertical to horizontal extent, and from [outer squareness of a flux
    surface](name:outer_squareness_of_flux_surface), which describes corner
    deformation.

    The upper and lower branch-specific quantities are [upper triangularity of a
    flux surface](name:upper_triangularity_of_flux_surface) and [lower
    triangularity of a flux surface](name:lower_triangularity_of_flux_surface);
    each is an instance of this parent quantity with $s$ fixed to the
    corresponding vertical extremum.
  unit: '1'

- name: lower_triangularity_of_flux_surface
  description: |-
    Dimensionless lower triangularity shape parameter for a nested magnetic flux
    surface, given by the normalized inward radial displacement of its lower
    vertical extremum.
  documentation: |-
    Lower triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the lower vertical extremum of a nested magnetic
    flux surface. It is the normalized inward displacement in major radius $R$
    of that lower extremum relative to the magnetic-axis reference.

    For the lower vertical extremum, the defining relation is:

    $$
    \delta_{\mathrm{lower}} = \frac{R_{\mathrm{axis}} - R_{\mathrm{lower}}}{a}
    $$

    where $\delta_{\mathrm{lower}}$ is lower triangularity, $R_{\mathrm{axis}}$
    is the major-radius coordinate of the magnetic axis, $R_{\mathrm{lower}}$ is
    the major-radius coordinate of the lower vertical extremum, and $a$ is the
    minor radius of the same flux surface. These coordinates are defined in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    measured from the machine symmetry axis, $\phi$ is toroidal angle, and $Z$
    is vertical height.

    This quantity applies independently to each nested magnetic flux surface and
    is a geometrical property of the surface rather than a plasma-population
    quantity. It resolves the lower vertical extremum only; it is not averaged
    over flux surfaces or combined with the upper extremum. It is distinct from
    [lower triangularity of a flux surface
    boundary](name:lower_triangularity_of_plasma_boundary), which describes the
    outer plasma boundary rather than an arbitrary nested surface.

    It is the lower-extremum branch of [triangularity of a flux
    surface](name:triangularity_of_flux_surface), whose parent quantity permits
    the relevant upper or lower vertical extremum. The corresponding [upper
    triangularity of a flux surface](name:upper_triangularity_of_flux_surface)
    uses the upper vertical extremum, while [elongation of a flux
    surface](name:elongation_of_flux_surface) describes vertical-to-horizontal
    shaping rather than triangular displacement.

    Sign convention: Positive when the lower vertical extremum lies at smaller
    major radius $R$ than the magnetic-axis reference, corresponding to an
    inward displacement.
  unit: '1'

- name: triangularity_of_plasma_boundary
  description: |-
    Dimensionless shape parameter for the plasma-boundary poloidal
    cross-section, expressing the aggregate inward radial displacement of its
    upper and lower extrema relative to the geometric center.
  documentation: |-
    Plasma-boundary triangularity is a dimensionless shaping parameter
    describing the asymmetry of the boundary’s poloidal cross-section through
    the inward displacement of its upper and lower radial extrema relative to
    the geometric center. It characterizes the complete boundary rather than
    either half-plane extremum alone.

    For the upper and lower boundary extrema, the aggregate triangularity is
    defined as

    $$
    \delta = \frac{1}{2}\left(\frac{R_0-R_u}{a}+\frac{R_0-R_l}{a}\right)
    $$

    where $\delta$ is the plasma-boundary triangularity, $R_0$ is the
    major-radius coordinate of the geometric center, $R_u$ and $R_l$ are the
    major-radius coordinates of the upper and lower boundary extrema, and $a$ is
    the boundary minor radius. The coordinates refer to the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    This quantity applies to the entire plasma boundary and aggregates the upper
    and lower extremal displacements into one shape parameter. It excludes the
    separately resolved [upper triangularity of the plasma
    boundary](name:upper_triangularity_of_plasma_boundary) and [lower
    triangularity of the plasma
    boundary](name:lower_triangularity_of_plasma_boundary), which retain only
    one extremum. It also differs from [triangularity of a flux
    surface](name:triangularity_of_flux_surface), which describes an individual
    nested magnetic flux surface rather than the outer plasma boundary.
  unit: '1'

- name: upper_inner_squareness_of_flux_surface
  description: |-
    The upper-inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how the upper, high-field-side
    quadrant of a nested toroidal magnetic flux surface departs from a reference
    ellipse; positive values are boxier and negative values are more
    diamond-like or indented.
  documentation: |-
    The upper-inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how the upper, high-field-side
    quadrant of a nested toroidal magnetic flux surface departs from a reference
    ellipse sharing the same center, horizontal half-width, and
    [elongation](name:elongation_of_flux_surface). It is the upper
    quadrant-resolved component of
    [inner_squareness_of_flux_surface](name:inner_squareness_of_flux_surface),
    complementing
    [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface).
    The upper-inner quadrant is the segment from the top of the surface to the
    inner midplane, on the high-field side at smaller major radius in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and
    $Z$ is vertical height.

    The coefficient $\zeta_\mathrm{ui}$ enters the Luce parametric flux-surface
    shape model as an additional harmonic beyond elongation $\kappa$ and
    [triangularity](name:triangularity_of_flux_surface):

    $$
    Z(\theta)-Z_c = a\kappa\sin\!\left[\theta + \zeta_\mathrm{ui}\sin(2\theta)\right], \qquad \pi/2 \le \theta \le \pi
    $$

    where $Z(\theta)$ is the vertical coordinate of the contour, $Z_c$ is the
    vertical coordinate of the surface center, $a$ is the horizontal half-width,
    $\theta$ is the geometric poloidal angle measured about the surface center
    in the $(R,Z)$ cross-section with $\theta=0$ at the outboard midplane and
    increasing toward $+Z$, and $\zeta_\mathrm{ui}$ is the upper-inner
    squareness coefficient. Setting $\zeta_\mathrm{ui}=0$ recovers the
    corresponding reference ellipse for this quadrant.

    This quantity is a quadrant-local squareness coefficient, not an average
    over the two inner quadrants and not an outboard squareness coefficient in
    the broader [squareness_of_flux_surface](name:squareness_of_flux_surface)
    family. It describes corner shaping not represented by elongation or
    triangularity alone.

    Sign convention: Positive when the upper high-field-side corner of the
    flux-surface cross-section is boxier than the reference ellipse; negative
    values indicate a more diamond-like or indented corner.
  unit: '1'

- name: upper_inner_squareness_of_plasma_boundary
  description: |-
    Upper-inner squareness of the plasma boundary is the dimensionless Luce
    shape coefficient measuring the upper high-field-side corner’s signed
    departure from a reference ellipse.
  documentation: |-
    The upper-inner squareness of the plasma boundary is the dimensionless Luce
    shape coefficient quantifying the departure of the upper inboard corner of
    the last closed flux surface from a reference ellipse. It is the
    upper-quadrant component of the [inner squareness of the plasma
    boundary](name:inner_squareness_of_plasma_boundary), paired with the
    [lower-inner squareness of the plasma
    boundary](name:lower_inner_squareness_of_plasma_boundary).

    In a poloidal cross-section at fixed toroidal angle $\phi$ of the
    right-handed cylindrical $(R, \phi, Z)$ frame, the coefficient is

    $$
    \zeta_{\mathrm{UI}} = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}
    $$

    where $O$ is the reference-ellipse center, $D$ is the upper-inner boundary
    intersection along the corner diagonal, $E$ is the corresponding ellipse
    intersection, and $F$ is the corner of the circumscribing rectangle. The
    reference ellipse is determined by the boundary size and shaping parameters.
  unit: '1'

- name: upper_outer_squareness_of_flux_surface
  description: |-
    Dimensionless Luce shape coefficient for the upper outboard quadrant of each
    nested flux surface, measuring the departure of that corner from a reference
    ellipse with the same center, horizontal half-width, and elongation.
  documentation: |-
    The upper outer squareness $\zeta_{uo}$ is the dimensionless Luce (2013)
    shape coefficient for the upper outboard ($+Z$, large-$R$) corner of each
    nested magnetic flux surface, measuring how much that quadrant departs from
    a reference ellipse sharing the same geometric center, horizontal
    half-width, and elongation. It is one of four quadrant-resolved squareness
    parameters — alongside the [lower outer
    squareness](name:lower_outer_squareness_of_flux_surface), [upper inner
    squareness](name:upper_inner_squareness_of_flux_surface), and [lower inner
    squareness](name:lower_inner_squareness_of_flux_surface) — extending the
    standard elongation-triangularity shape description to higher order.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the flux-surface
    boundary in the upper outer quadrant is described by the Luce
    parameterization as:

    $$
    R = R_\mathrm{geo} + a\cos\!\bigl(\theta + \delta_{uo}\sin\theta + \zeta_{uo}\sin 2\theta\bigr)
    $$

    with $Z = Z_\mathrm{geo} + \kappa\, a\sin\theta$, where $R_\mathrm{geo}$ and
    $Z_\mathrm{geo}$ are the coordinates of the flux-surface geometric center,
    $a$ is the minor radius, $\kappa$ is the elongation, $\delta_{uo}$ is the
    upper outer triangularity, and $\theta \in [0, \pi/2]$ is the geometric
    poloidal angle spanning the upper outboard quadrant.

    Values near zero indicate an approximately elliptic corner; positive values
    are characteristic of D-shaped cross-sections with a squared-off outboard
    corner, while negative values correspond to a more concave or helmet-shaped
    upper outer region. The coefficient is extracted from equilibrium
    reconstruction by fitting computed flux-surface contours to the Luce
    parameterization in the upper outboard region. The symmetric combination of
    upper and lower outer quadrant values constitutes the aggregate
    [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface),
    and the value at the outermost flux surface corresponds to
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary).

    Sign convention: Positive when the upper outer corner of the flux surface
    protrudes beyond the reference ellipse, giving the cross-section a more
    rectangular (D-shaped) outboard corner.
  unit: '1'

- name: upper_outer_squareness_of_plasma_boundary
  description: |-
    Dimensionless Luce shape coefficient measuring how the upper outboard
    (low-field-side) corner of the plasma boundary departs from the reference
    ellipse defined by boundary minor radius, upper elongation, and upper
    triangularity.
  documentation: |-
    The upper outer squareness $\zeta_{uo}$ is one of four corner-specific shape
    parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the upper outer quadrant of the plasma cross-section boundary
    deviates from the reference ellipse defined by the boundary minor radius
    $a$, upper elongation $\kappa_u$, and upper triangularity $\delta_u$. In the
    poloidal cross-section expressed in the right-handed cylindrical $(R, \phi,
    Z)$ frame where $R$ is major radius and $Z$ is vertical height, this
    quadrant is the large-$R$, larger-$Z$ corner relative to the boundary shape
    center.

    With poloidal parameter $\theta$ increasing from the outboard midplane point
    to the top point, the upper-outboard Luce boundary segment is parameterized
    by

    $$
    \begin{aligned}
    R(\theta) &= R_0 + a\cos\left[\theta + \arcsin(\delta_u)\sin\theta - \zeta_{uo}\sin(2\theta)\right],\\
    Z(\theta) &= Z_0 + \kappa_u a\sin\left[\theta + \zeta_{uo}\sin(2\theta)\right],\quad 0 \le \theta \le \frac{\pi}{2}.
    \end{aligned}
    $$

    where $(R(\theta), Z(\theta))$ is the boundary point in the poloidal
    cross-section, $R_0$ and $Z_0$ are the shape-center coordinates, $a$ is the
    boundary minor radius, $\kappa_u$ is the upper elongation, and $\delta_u$ is
    the upper triangularity.

    The value $\zeta_{uo}=0$ is the reference-ellipse case for the
    upper-outboard quadrant after $a$, $\kappa_u$, and $\delta_u$ have been
    fixed; nonzero values describe residual corner shaping rather than minor
    radius, elongation, or triangularity. Together with
    [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    and
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    it forms the four-corner boundary squareness decomposition;
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    combines the two outboard corner contributions, while
    [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary) is the
    single-coefficient boundary summary.

    Sign convention: Positive when the upper outer boundary corner lies outside
    the reference ellipse at the same poloidal parameter, i.e., toward larger
    $R$ and larger $Z$ relative to the shape center in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is
    vertical height.
  unit: '1'

- name: upper_triangularity_of_flux_surface
  description: |-
    Dimensionless upper triangularity shape parameter for a nested magnetic flux
    surface, given by the normalized inward radial displacement of its upper
    vertical extremum.
  documentation: |-
    Upper triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the upper vertical extremum of a nested magnetic
    flux surface. It is the normalized inward radial displacement of that upper
    extremum in a poloidal cross-section.

    For the upper vertical extremum, the defining relation is:

    $$
    \delta_u = \frac{R_{\mathrm{axis}} - R_u}{a}
    $$

    where $\delta_u$ is upper triangularity, $R_{\mathrm{axis}}$ is the
    major-radius coordinate of the magnetic axis, $R_u$ is the major-radius
    coordinate of the upper vertical extremum, and $a$ is the minor radius of
    the flux surface. These coordinates are defined in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    This quantity applies separately to each nested magnetic flux surface
    identified by its poloidal magnetic-flux label. It represents only the upper
    extremum and is not an aggregate over the upper and lower extrema or over
    multiple flux surfaces.

    It is distinct from [lower triangularity of a flux
    surface](name:lower_triangularity_of_flux_surface), which uses the lower
    vertical extremum. It also differs from [upper triangularity of the plasma
    boundary](name:upper_triangularity_of_plasma_boundary), which applies only
    to the outer plasma boundary rather than to an arbitrary nested flux
    surface.

    Upper triangularity is the upper-extremum branch of [triangularity of a flux
    surface](name:triangularity_of_flux_surface), whose definition permits the
    relevant upper or lower vertical extremum. The upper and lower quantities
    together describe the asymmetric triangular shaping of a flux-surface
    cross-section.
  unit: '1'

- name: upper_triangularity_of_plasma_boundary
  description: |-
    Upper triangularity of the plasma boundary is the inward major-radius
    displacement of its upper vertical extremum from the geometric axis, divided
    by the boundary minor radius.
  documentation: |-
    Triangularity of plasma boundary

    Triangularity without a qualifier is the mean of the upper and lower
    triangularities; upper and lower triangularity each use one extremum of the
    cross-section.

    The upper and lower triangularities and their mean are defined by:

    $$\delta_{\mathrm{u,l}} = (R_{\mathrm{geo}} - R_{\mathrm{u,l}})/a,\quad \delta = (\delta_{\mathrm{u}} + \delta_{\mathrm{l}})/2$$

    where $\delta_{\mathrm{u}}$ is upper triangularity, $\delta_{\mathrm{l}}$ is
    [lower triangularity of the plasma
    boundary](name:lower_triangularity_of_plasma_boundary), and $\delta$ is
    [mean triangularity of the plasma
    boundary](name:triangularity_of_plasma_boundary). Here $R_{\mathrm{geo}}$ is
    the [major-radius coordinate of the geometric
    axis](name:radial_coordinate_of_geometric_axis), $R_{\mathrm{u,l}}$ denotes
    the major-radius coordinate of the upper or lower vertical extremum,
    respectively, and $a$ is the boundary minor radius, equal to its horizontal
    half-width. These coordinates use the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    This quantity describes only the upper extremum of the plasma-boundary
    cross-section; it is not an average over both extrema or over nested flux
    surfaces. Unlike [upper triangularity of a flux
    surface](name:upper_triangularity_of_flux_surface), its locus is restricted
    to the plasma boundary. The upper and lower triangularities contribute
    equally to the mean boundary triangularity and need not coincide.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: '1'

- name: vacuum_magnetic_field
  description: |-
    Local magnetic-induction vector generated by currents external to the plasma
    with plasma-current contributions omitted, retaining field strength and
    direction before selecting a component in the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    The vacuum magnetic field $\mathbf{B}_{\rm vac}$ is the local [magnetic
    induction](name:magnetic_field) generated by currents external to the plasma
    when plasma-current contributions are omitted. It represents a vector field
    at a point, retaining field strength and direction rather than selecting a
    cylindrical component or scalar magnitude.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the vacuum field may be
    resolved as

    $$
    \mathbf{B}_{\rm vac}=B_{R,{\rm vac}}\hat{R}+B_{\phi,{\rm vac}}\hat{\phi}+B_{Z,{\rm vac}}\hat{Z}
    $$

    where $\mathbf{B}_{\rm vac}$ is the vacuum magnetic field, $B_{R,{\rm vac}}$
    is its signed radial component, $B_{\phi,{\rm vac}}$ is the [toroidal vacuum
    magnetic field](name:toroidal_vacuum_magnetic_field), $B_{Z,{\rm vac}}$ is
    its signed vertical component, and $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$
    are the basis vectors for increasing major radius, toroidal angle, and
    vertical height.

    This quantity is the externally sourced, plasma-current-omitted contribution
    to the local field and may be evaluated inside the confined-plasma region as
    well as in vacuum regions; it does not denote only the space outside the
    plasma. It has no species population, and its aggregation convention is a
    local point value, not a spatial average, flux-surface average, or
    finite-volume reduction.

    It is distinct from the [plasma magnetic field](name:plasma_magnetic_field),
    which represents the magnetic-field contribution associated with the
    confined plasma, and from the unrestricted local [magnetic
    induction](name:magnetic_field), which does not by name isolate the vacuum
    contribution. The [non-axisymmetric magnetic
    field](name:non_axisymmetric_magnetic_field) is the toroidally varying part
    of the external-coil vacuum field after its toroidally averaged component is
    removed, while a [perturbed vacuum magnetic
    field](name:perturbed_vacuum_magnetic_field) denotes a perturbative vacuum
    contribution rather than the full vacuum vector.

    The [vacuum magnetic vector
    potential](name:vacuum_magnetic_vector_potential) $\mathbf{A}_{\rm vac}$ is
    a potential for this field, with $\mathbf{B}_{\rm
    vac}=\nabla\times\mathbf{A}_{\rm vac}$, where $\mathbf{A}_{\rm vac}$ is the
    vacuum magnetic vector potential and $\nabla$ is the spatial differential
    operator. Different gage choices of $\mathbf{A}_{\rm vac}$ that have the
    same curl represent the same vacuum magnetic field; in regions containing no
    external current density, $\mathbf{B}_{\rm vac}$ is curl-free, and the field
    is solenoidal.

    Sign convention: Positive when a resolved component of $\mathbf{B}_{\rm
    vac}$ points along the corresponding positive basis vector of the
    right-handed cylindrical $(R,\phi,Z)$ frame, where the positive directions
    are increasing major radius $R$, increasing toroidal angle $\phi$, and
    increasing vertical height $Z$.
  unit: T

- name: vertical_coordinate_of_constraint_position
  description: |-
    Vertical coordinate of the constraint position gives its signed height
    relative to the zero-height plane in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    Vertical coordinate of the constraint position is its signed height relative
    to the zero-height plane in the right-handed cylindrical $(R,\phi,Z)$ frame.
    Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height parallel to the toroidal symmetry axis.

    The coordinate is defined by

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the position vector of the constraint position
    measured from the coordinate origin, $\hat{\mathbf{z}}$ is the unit vector
    along the positive vertical direction, and the dot denotes the Euclidean
    scalar product.

    The quantity applies to an individual constraint position, not an average
    over constraint positions or a vertical component of the constrained
    physical quantity. It uses the same geometric projection as the [vertical
    coordinate of a measurement
    position](name:vertical_coordinate_of_measurement_position), with the locus
    restricted to the constraint position.

    Sign convention: Positive when the constraint position lies above the
    zero-height plane along $+\hat{\mathbf{z}}$.
  unit: m

- name: vertical_coordinate_of_current_center
  description: |-
    Signed vertical position of the plasma-current centroid, obtained by
    weighting the toroidal current distribution by height in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    The vertical coordinate of the plasma-current center is the
    current-density-weighted centroid height of the plasma current distribution
    in the right-handed cylindrical $(R, \phi, Z)$ frame.

    $$
    Z_{\mathrm{c}} = \frac{\int_{\mathcal{A}} Z\,j_{\phi}(R,Z)\,dA}{\int_{\mathcal{A}} j_{\phi}(R,Z)\,dA}
    $$

    where $Z_{\mathrm{c}}$ and $Z$ are vertical coordinates in m, $R$ is major
    radius in m, $j_{\phi}$ is toroidal current density in A m$^{-2}$, $dA$ is
    differential poloidal cross-sectional area in m$^{2}$, and $\mathcal{A}$ is
    the region carrying plasma current. The current-weighted center is distinct
    from the geometric axis; its radial counterpart is the [radial coordinate of
    the current center](name:radial_coordinate_of_current_center).

    Sign convention: Positive when the plasma-current centroid lies in the $+Z$
    direction from the coordinate origin.
  unit: m

- name: vertical_coordinate_of_magnetic_axis
  description: |-
    Vertical coordinate of the magnetic axis specifies its signed height above
    or below the zero-height plane in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    Vertical coordinate of the magnetic axis is its signed height relative to
    the zero-height plane in the right-handed cylindrical $(R,\phi,Z)$ frame.
    Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    The coordinate is defined by

    $$
    Z_{\mathrm{axis}} = \mathbf{x}_{\mathrm{axis}}\cdot\hat{\mathbf{z}}
    $$

    where $Z_{\mathrm{axis}}$ is the magnetic-axis height,
    $\mathbf{x}_{\mathrm{axis}}$ is the position vector of a point on the
    magnetic axis relative to the coordinate origin, and $\hat{\mathbf{z}}$ is
    the unit vector along the positive vertical direction, parallel to the
    toroidal symmetry axis.

    This quantity is a coordinate of the magnetic axis, not a height averaged
    over the plasma or the [vertical coordinate of an
    X-point](name:vertical_coordinate_of_x_point), which refers to a different
    equilibrium location.

    In an axisymmetric equilibrium, this coordinate and the major-radius
    coordinate of the magnetic axis together specify its position in a poloidal
    cross-section.

    Sign convention: Positive when the magnetic axis lies on the $+Z$ side of
    the zero-height plane in the right-handed cylindrical $(R,\phi,Z)$ frame.

    The closed magnetic-field line about which nested toroidal magnetic flux
    surfaces are arranged. Where $\mathbf{B}_{\mathrm{p}}(R_{\mathrm{axis}},
    Z_{\mathrm{axis}}) = 0$, $\mathbf{B}_{\mathrm{p}}$ is poloidal magnetic
    field; $R_{\mathrm{axis}}, Z_{\mathrm{axis}}$ is the O-point inside the
    nested closed flux surfaces.
  unit: m

- name: vertical_coordinate_of_measurement_position
  description: |-
    Vertical coordinate of the measurement position, specifying signed height
    relative to the coordinate origin in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    Vertical coordinate of the measurement position specifies its signed height
    along the symmetry-axis direction in the right-handed cylindrical $(R, \phi,
    Z)$ frame.

    The coordinate is defined by

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $Z$ is the vertical coordinate, $\mathbf{x}$ is the position vector
    from the coordinate origin to the measurement position, and
    $\hat{\mathbf{z}}$ is the unit vector along the symmetry axis in the
    positive vertical direction. The other frame coordinates are $R$, the major
    radius, and $\phi$, the toroidal angle.

    This quantity applies to the specified measurement position without an
    implied spatial average. It is a geometric coordinate, not a measured field
    value or a vertical extent. The [vertical coordinate of a line-of-sight
    reference point](name:vertical_coordinate_of_line_of_sight) uses the same
    projection for that distinct locus.

    Sign convention: Positive when the displacement from the coordinate origin
    to the measurement position has a positive projection along the positive
    vertical direction.
  unit: m

- name: vertical_coordinate_of_plasma_boundary_gap_reference_point
  description: |-
    Vertical coordinate of the plasma-boundary gap reference point, expressed as
    signed height from the coordinate origin in the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    Vertical coordinate of the plasma-boundary gap reference point specifies its
    signed height relative to the coordinate origin in the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $Z$ is the reference point's vertical coordinate, $\mathbf{x}$ is its
    position vector relative to the coordinate origin, and $\hat{\mathbf{z}}$ is
    the unit vector along the toroidal symmetry axis in the positive vertical
    direction. The coordinates $R$ and $\phi$ denote major radius and toroidal
    angle, respectively.

    The quantity applies to one reference point, without averaging over the
    plasma boundary. It is a point coordinate, not the gap distance or a
    vertical clearance between the plasma and the wall. The [vertical coordinate
    of the closest wall point](name:vertical_coordinate_of_closest_wall_point)
    uses the same vertical-axis convention but locates a separately defined
    point.

    Sign convention: Positive when the displacement from the coordinate origin
    to the reference point has a positive projection onto $\hat{\mathbf{z}}$.
  unit: m

- name: vertical_coordinate_of_primary_x_point
  description: |-
    Signed vertical position of the primary magnetic X-point, the poloidal-field
    null where separatrix branches meet, in the right-handed cylindrical (R, φ,
    Z) frame.
  documentation: |-
    The primary X-point is the main poloidal magnetic-field null on the plasma
    boundary, where separatrix branches meet. This quantity gives that point’s
    vertical coordinate in the right-handed cylindrical $(R,\phi,Z)$ frame.

    $$
    Z_{\mathrm{X,primary}} = \mathbf{r}_{\mathrm{X,primary}} \cdot \hat{\mathbf{Z}}
    $$

    Here, $Z_{\mathrm{X,primary}}$ is the vertical coordinate of the primary
    X-point, $\mathbf{r}_{\mathrm{X,primary}}$ is its position vector relative
    to the coordinate origin, and $\hat{\mathbf{Z}}$ is the vertical unit vector
    of the cylindrical frame.

    The locus is specifically the primary, or main, boundary X-point rather than
    an unspecified or secondary X-point. This is a pointwise geometric
    coordinate with no spatial averaging, surface integration, population
    aggregation, or species dependence; it excludes the radial coordinate of the
    same point.

    The generic [vertical coordinate of an
    X-point](name:vertical_coordinate_of_x_point) represents the same signed Z
    coordinate without restricting the locus to the primary X-point, while the
    [radial coordinate of an X-point](name:radial_coordinate_of_x_point)
    supplies the corresponding major-radius coordinate.

    Sign convention: Positive when the primary X-point lies in the direction of
    increasing vertical coordinate $Z$.
  unit: m

- name: vertical_coordinate_of_strike_point
  description: |-
    Vertical coordinate of a selected divertor strike point, giving its signed
    height relative to the origin in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    Vertical coordinate of a selected divertor strike point specifies its signed
    height relative to the coordinate origin in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Here $R$ is major radius, $\phi$ is toroidal angle,
    and $Z$ is vertical height along the toroidal symmetry axis.

    $$
    Z_{\mathrm{s}} = \mathbf{x}_{\mathrm{s}}\cdot\hat{\mathbf{z}}
    $$

    where $Z_{\mathrm{s}}$ is the strike-point vertical coordinate,
    $\mathbf{x}_{\mathrm{s}}$ is the position vector of that point relative to
    the coordinate origin, and $\hat{\mathbf{z}}$ is the unit vector along the
    positive vertical direction.

    The value applies to one identified strike point. Inner and outer strike
    points have separate values; no averaging or summation over them is implied.
    The generic quantity does not select a particular strike-point branch.

    This coordinate specifies a different geometric location from the [vertical
    coordinate of an X-point](name:vertical_coordinate_of_x_point). It also
    differs from the [vertical coordinate of the divertor-target
    center](name:z_coordinate_of_divertor_target), which locates the target's
    geometric center rather than the selected strike point.

    Sign convention: Positive when the displacement from the coordinate origin
    to the strike point has a positive projection onto the positive vertical
    direction $\hat{\mathbf{z}}$.

    The point where a divertor separatrix branch intersects a plasma-facing
    target. Where $\psi(R_{\mathrm{s}}, Z_{\mathrm{s}}) = \psi_{\mathrm{X}}$,
    $R_{\mathrm{s}}, Z_{\mathrm{s}}$ is the point on the target surface;
    $\psi_{\mathrm{X}}$ is poloidal magnetic flux at the primary X-point.
  unit: m

- name: vertical_coordinate_of_x_point
  description: |-
    Signed vertical (Z) coordinate of an X-point, the magnetic null where
    separatrix branches meet, in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The vertical coordinate of an X-point is its signed height along $Z$ in the
    right-handed cylindrical $(R, \\phi, Z)$ frame. An X-point is a poloidal
    magnetic null at which separatrix branches meet.

    This quantity identifies the vertical location of the X-point and is
    distinct from the [vertical coordinate of the magnetic
    axis](name:vertical_coordinate_of_magnetic_axis) and the [vertical
    coordinate of the strike point](name:vertical_coordinate_of_strike_point).
  unit: m

- name: vertical_non_axisymmetric_magnetic_field
  description: |-
    Vertical magnetic field on a control surface is the signed axial component
    of the external-coil vacuum field remaining after its toroidal mean is
    removed.
  documentation: |-
    Vertical magnetic field of the non-axisymmetric vacuum contribution is the
    signed component parallel to the toroidal symmetry axis, evaluated at
    individual points on a control surface. It contains only the toroidally
    varying external-coil contribution to the [magnetic
    induction](name:magnetic_field).

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the component is defined
    by

    $$
    B_{Z,\mathrm{NA}}(R,\phi,Z)=\mathbf{B}_{\mathrm{NA}}(R,\phi,Z)\cdot\hat{\mathbf{z}}=B_{Z,\mathrm{vac}}(R,\phi,Z)-\left\langle B_{Z,\mathrm{vac}}\right\rangle_\phi(R,Z)
    $$

    where $B_{Z,\mathrm{NA}}$ is the vertical non-axisymmetric component,
    $\mathbf{B}_{\mathrm{NA}}$ is the [non-axisymmetric magnetic-field
    vector](name:non_axisymmetric_magnetic_field), and $B_{Z,\mathrm{vac}}$ is
    the vertical component of the external-coil vacuum field before
    toroidal-mean removal. The brackets denote averaging over a complete
    toroidal circuit at fixed major radius $R$ and vertical coordinate $Z$;
    $\phi$ is the toroidal angle, and $\hat{\mathbf{z}}$ is the unit vector
    parallel to the symmetry axis toward increasing $Z$.

    The axisymmetric vacuum contribution and fields generated by plasma currents
    are excluded. Each value is a local component, not a surface average,
    surface integral, or Fourier coefficient. Unlike the [normal
    non-axisymmetric magnetic
    field](name:normal_non_axisymmetric_magnetic_field), this projection follows
    the fixed vertical direction rather than the local control-surface normal.

    Sign convention: Positive when the non-axisymmetric vacuum magnetic field
    has a component toward increasing vertical coordinate $Z$.
  unit: T

- name: vertical_outline_of_plasma_boundary
  description: |-
    Signed vertical height of each point on the plasma-boundary outline in the
    right-handed cylindrical (R, φ, Z) frame, defining its poloidal
    cross-sectional shape.
  documentation: |-
    The vertical outline coordinate is the signed height of each point on the
    plasma-boundary contour in a poloidal cross-section. It describes the
    boundary geometry rather than a field, flux, or scalar boundary summary.

    The coordinate is defined in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height. Each outline point has its own $Z$ value; the quantity is
    neither an average nor an extremum over the boundary.

    This quantity applies specifically to the plasma-boundary outline and
    excludes the outline of a plasma-facing component. Together with the
    corresponding [radial outline of the plasma
    boundary](name:radial_outline_of_plasma_boundary), it specifies the boundary
    contour in the poloidal $(R,Z)$ plane. The analogous vertical coordinate for
    a component boundary is [vertical outline of the plasma-facing
    component](name:vertical_outline_of_plasma_facing_component).

    Sign convention: Positive when the point lies in the direction of increasing
    vertical coordinate $Z$.
  unit: m

- name: vertical_velocity_at_current_center
  description: |-
    Vertical velocity of the plasma-current centroid, defined by the rate of
    change of its vertical position.
  documentation: |-
    The vertical velocity at the current center is the kinematic velocity of the
    centroid of the plasma current distribution, describing motion along the
    vertical direction rather than a local fluid velocity sampled at that point.

    $$
    v_{Z,c}(t)=\frac{dZ_c(t)}{dt}
    $$

    where $Z_c$ is the vertical coordinate of the current center in the
    right-handed cylindrical $(R, \phi, Z)$ frame, $t$ is time, and $v_{Z,c}$ is
    the corresponding signed velocity. The position $Z_c$ is defined by the
    [vertical coordinate of the current
    center](name:vertical_coordinate_of_current_center).

    This quantity describes motion of the current-density-weighted
    plasma-current centroid and is distinct from the local [vertical plasma
    velocity](name:vertical_plasma_velocity) evaluated at that location.

    Sign convention: Positive when the current center moves toward increasing
    $Z$.
  unit: m.s^-1

- name: volume_of_flux_surface
  description: |-
    Volume enclosed by a magnetic flux surface, including the entire plasma
    interior from the magnetic axis rather than only a shell between neighboring
    surfaces.
  documentation: |-
    Volume of flux surface

    The volume is defined by

    $$
    V = \int_{\Omega} d^3\mathbf{x}
    $$

    where $V$ is the enclosed volume, $\Omega$ is the spatial domain inside the
    selected magnetic flux surface, $\mathbf{x}$ is spatial position, and
    $d^3\mathbf{x}$ is the differential volume element.

    The integration covers the entire interior from the magnetic axis to the
    selected surface and excludes regions outside it. The result is the total
    enclosed volume, not the volume of a shell between neighboring surfaces or
    the volume of material structures.

    The volume tends to zero as the selected surface contracts to the magnetic
    axis. It equals the [volume enclosed by the plasma
    boundary](name:volume_of_plasma_boundary) when the selected surface
    coincides with that boundary.

    Differentiating this cumulative volume with respect to the poloidal magnetic
    flux coordinate gives the [poloidal-flux volume
    derivative](name:derivative_of_volume_of_flux_surface_with_respect_to_poloidal_magnetic_flux_coordinate);
    differentiation with respect to the toroidal-flux coordinate gives the
    [toroidal-flux volume
    derivative](name:derivative_of_volume_of_flux_surface_with_respect_to_toroidal_flux_coordinate).
    Enclosed-volume increments provide the geometric integration measure that
    converts flux-surface-averaged densities into enclosed totals.

    A surface formed by points sharing the same magnetic-flux label in a
    nested-flux-surface configuration. Where $\psi(R, Z) = \mathrm{const}$,
    $\psi$ is poloidal magnetic flux.
  unit: m^3

- name: derivative_of_volume_of_flux_surface_with_respect_to_poloidal_magnetic_flux_coordinate
  description: |-
    Geometric rate of change of the cumulative volume enclosed by a nested
    magnetic flux surface as its signed poloidal flux coordinate varies.
  documentation: |-
    This quantity is the geometric derivative of the cumulative volume enclosed
    by a nested magnetic flux surface with respect to its signed poloidal
    magnetic-flux coordinate.

    It is defined by

    $$
    \frac{dV}{d\psi}=\frac{d}{d\psi}V(\psi)
    $$

    where $V(\psi)$ is the volume enclosed by the flux surface labeled by
    $\psi$, $\psi$ is the signed poloidal magnetic-flux coordinate, and
    $d/d\psi$ denotes differentiation with respect to that coordinate.

    The quantity applies separately to each nested closed flux surface. The
    underlying volume is cumulative from the magnetic axis to the selected
    surface, so this derivative describes the change in enclosed volume along
    the flux coordinate rather than a local volume density, a shell volume, or a
    plasma-population-weighted quantity.

    It is the derivative of [volume enclosed by a flux
    surface](name:volume_of_flux_surface); integrating it between two
    flux-coordinate values gives the difference between the corresponding
    enclosed volumes. It is distinct from the derivative with respect to the
    toroidal flux coordinate, which is represented by [derivative of volume with
    respect to toroidal flux
    coordinate](name:derivative_of_volume_of_flux_surface_with_respect_to_toroidal_flux_coordinate).

    Sign convention: Positive when the enclosed volume increases in the
    direction of increasing signed poloidal magnetic flux $\psi$.
  unit: Wb^-1.m^3

- name: derivative_of_volume_of_flux_surface_with_respect_to_toroidal_flux_coordinate
  description: |-
    Geometric rate at which the cumulative volume enclosed by a nested magnetic
    flux surface changes with its dimensionful toroidal-flux coordinate.
  documentation: |-
    This quantity is the geometric derivative of the cumulative volume enclosed
    by a nested magnetic flux surface with respect to the dimensionful
    toroidal-flux coordinate. It describes how rapidly the enclosed region
    expands as the flux-surface label changes.

    The defining relation is

    $$
    \frac{dV}{d\rho_{\mathrm{tor}}}
    $$

    where $V$ is the [volume enclosed by a flux
    surface](name:volume_of_flux_surface) and $\rho_{\mathrm{tor}}$ is the
    dimensionful toroidal-flux coordinate labeling the nested surfaces.

    The quantity applies to the three-dimensional region inside each selected
    nested magnetic flux surface. The volume is cumulative, beginning at the
    magnetic axis and extending to the specified surface; this is not a local
    plasma-population quantity and carries no species weighting. It is the
    derivative with respect to the toroidal-flux coordinate, not the volume
    itself or the derivative of the enclosed poloidal area.

    As the derivative of [volume enclosed by a flux
    surface](name:volume_of_flux_surface), it provides the volume increment
    associated with a change in toroidal-flux coordinate and serves as a
    geometric coefficient in flux-surface-averaged transport relations. The
    derivative of area with respect to the toroidal-flux coordinate is the
    analogous area derivative, while [the temporal derivative of this volume
    derivative](name:time_derivative_of_derivative_of_volume_of_flux_surface_with_respect_to_toroidal_flux_coordinate)
    describes its change in time.
  unit: m^2

- name: volume_of_plasma_boundary
  description: |-
    Volume enclosed by the plasma boundary, representing the total
    confined-plasma region inside the last closed magnetic flux surface.
  documentation: |-
    This quantity is the geometric volume of the confined plasma enclosed by the
    plasma boundary, identified with the last closed magnetic flux surface. It
    represents the full enclosed region rather than a local flux-surface shell
    or material volume.

    The volume is defined by

    $$
    V = \int_{\Omega_{\mathrm{plasma}}} d^3\mathbf{x}
    $$

    where $V$ is the enclosed plasma volume, $\Omega_{\mathrm{plasma}}$ is the
    spatial domain inside the plasma boundary, and $d^3\mathbf{x}$ is the
    differential volume element at position $\mathbf{x}$.

    The integration domain is the entire confined-plasma region bounded by the
    last closed magnetic flux surface, and the result is the total volume
    aggregated over that domain. It excludes regions outside the plasma boundary
    and volumes belonging to material structures or other non-confined regions.

    This quantity is the terminal enclosed value of [volume of a flux
    surface](name:volume_of_flux_surface) when the flux surface coincides with
    the plasma boundary. It provides the integration domain for volume-averaged
    quantities such as [volume-averaged ion
    temperature](name:volume_averaged_ion_temperature).
  unit: m^3

- name: weight_of_interferometer_beam
  description: |-
    Weight of an interferometer beam is the scalar factor assigned to the
    residual for one interferometer beam, controlling how strongly that beam's
    line-integrated electron-density constraint contributes to a weighted
    objective. It applies per beam, not to an entire interferometer system.
  documentation: |-
    Weight of an interferometer beam is the scalar factor assigned to the
    residual for one interferometer beam in a weighted objective. The residual
    is associated with that beam's line-integrated electron-density constraint,
    so the weight controls that beam's relative influence among simultaneously
    weighted constraints.

    For a quadratic weighted objective, the contribution from one beam is
    represented by:

    $$
    \Phi_b = w_b r_b^2
    $$

    where $w_b$ is the weight of the interferometer beam, $r_b$ is the residual
    between the modeled and reference line-integrated electron density for the
    same beam, and $\Phi_b$ is that beam's contribution to the objective.

    The scope is a single interferometer beam. No summation, averaging, or
    normalization over multiple beams is implied; a set of beams has separate
    weights and separate residual contributions. This quantity is not the
    line-integrated electron density, not the residual itself, not an
    uncertainty, and not a weight for a whole interferometer system or for other
    constraint types.

    The [equilibrium weight of an interferometer
    beam](name:equilibrium_weight_of_interferometer_beam) is the
    equilibrium-specific specialization of this parent quantity. Changing $w_b$
    changes only the relative contribution of the corresponding beam term in the
    objective; it does not change the definition of the beam residual.
  unit: '1'

- name: equilibrium_weight_of_interferometer_beam
  description: |-
    Dimensionless factor controlling the relative contribution of an
    interferometer beam’s line-integrated electron-density residual to an
    equilibrium objective function.
  documentation: |-
    The equilibrium weight assigned to an interferometer-beam constraint is a
    nonnegative factor that sets the relative importance of its line-integrated
    electron-density residual in an equilibrium objective function. It applies
    to the constraint associated with one interferometer beam rather than to the
    electron density itself.

    A weighted least-squares objective containing this constraint is defined by

    $$
    J = \frac{1}{2} \sum_i w_i^2 \left(\frac{y_i^{\mathrm{rec}} - y_i^{\mathrm{meas}}}{\sigma_i}\right)^2
    $$

    where $J$ is the equilibrium objective function, $i$ indexes individual
    constraints, $w_i$ is the equilibrium weight, $y_i^{\mathrm{rec}}$ is the
    reconstructed line-integrated electron density for constraint $i$,
    $y_i^{\mathrm{meas}}$ is its measured line-integrated electron density, and
    $\sigma_i$ is the standard deviation assigned to its measurement error.

    For this quantity, $i$ denotes an interferometer-beam line-integrated
    electron-density constraint. The weight is specific to that individual
    constraint; the objective function aggregates all constraint contributions
    through the summation. It is not the line-integrated electron density,
    either its measured or reconstructed value, and it is distinct from the
    [calibration coefficient of an interferometer
    beam](name:spectral_calibration_factor_at_line_of_sight), which
    characterizes signal calibration rather than equilibrium-objective
    weighting.

    This quantity has the same objective-function role as the equilibrium weight
    of a flux loop and the equilibrium weight of a poloidal magnetic-field
    probe; those related weights differ by the physical measurement constraint
    to which they apply.
  unit: '1'

- name: flux_surface_averaged_magnetic_field_magnitude
  description: |-
    Flux-surface average of the local magnetic-field strength, retaining the
    pointwise modulus before averaging over each magnetic surface.
  documentation: |-
    This quantity is the flux-surface average of the magnitude of the total
    equilibrium magnetic-field vector. It represents the mean field strength on
    a magnetic surface, rather than a component or a vector average.

    The flux-surface average is defined by

    $$
    \left\langle \lvert\mathbf{B}\rvert \right\rangle_{\psi} = \frac{\oint_{\psi} \lvert\mathbf{B}\rvert\,\mathrm{d}S/\lvert\nabla\psi\rvert}{\oint_{\psi} \mathrm{d}S/\lvert\nabla\psi\rvert}
    $$

    where $\mathbf{B}$ is the total equilibrium magnetic-field vector, $\psi$ is
    the scalar label of the magnetic flux surface, $\mathrm{d}S$ is the
    surface-area element, and $\nabla\psi$ is the spatial gradient of that
    surface label. The aggregation is the normalized surface integral with
    weighting $\mathrm{d}S/\lvert\nabla\psi\rvert$.

    The quantity applies to all components of the equilibrium field on the
    selected magnetic flux surface and is non-negative. It excludes any signed
    field component, any species or source decomposition, and the magnitude of a
    vector obtained by averaging $\mathbf{B}$ before taking its modulus.

    It is the flux-surface-averaged transformation of [magnetic-field
    magnitude](name:magnetic_field_magnitude). It differs from
    [flux-surface-averaged square of magnetic-field
    magnitude](name:flux_surface_averaged_square_of_magnetic_field_magnitude),
    which averages the squared field strength rather than the field strength
    itself.
  unit: T

- name: flux_surface_averaged_parallel_current_density
  description: |-
    Flux-surface-averaged parallel current density is the surface average of
    conventional current density dotted with the magnetic field, divided by a
    single global reference toroidal field.
  documentation: |-
    Flux-surface-averaged parallel current density is the signed field-aligned
    contribution of the total plasma current density, averaged over a closed
    magnetic flux surface with magnetic-field weighting.

    The defining relation is

    $$\langle f\rangle = \oint f\,dS/|\nabla\psi| \,/\, \oint dS/|\nabla\psi|$$

    where $j_\parallel^{\mathrm{FS}}$ denotes this averaged parallel current
    density, $\psi$ is the poloidal magnetic flux labeling the surface,
    $\mathbf{j}$ is the total conventional plasma [current
    density](name:current_density), $\mathbf{B}$ is the local magnetic-field
    vector, and $B_0$ is the nonzero signed global reference toroidal magnetic
    field. The brackets denote the normalized flux-surface average, weighted by
    the inverse magnitude of the poloidal magnetic-flux gradient. The same $B_0$
    applies to every surface; it is not a surface-dependent magnetic-field
    magnitude.

    The quantity includes all plasma current-carrying populations and mechanisms
    and aggregates over the complete selected closed surface. It is not
    restricted to a particular current-drive mechanism and is not a pointwise
    current density.

    The pointwise [parallel current density](name:parallel_current_density) is
    $j_\parallel=\mathbf{j}\cdot\mathbf{B}/|\mathbf{B}|$, where $|\mathbf{B}|$
    is the magnetic-field magnitude. Consequently, this quantity equals $\langle
    j_\parallel|\mathbf{B}|\rangle_\psi/B_0$, not generally $\langle
    j_\parallel\rangle_\psi$. The [constraint-position
    member](name:flux_surface_averaged_parallel_current_density_at_constraint_position)
    evaluates the same quantity on the magnetic surface selected by a specified
    constraint position; no such locus is prescribed here.

    The reference field is positive toward increasing toroidal angle $\phi$ in
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.

    Sign convention: Positive when
    $\langle\mathbf{j}\cdot\mathbf{B}\rangle_\psi$ is positive for a reference
    toroidal field directed toward increasing $\phi$, or negative for a
    reference field directed toward decreasing $\phi$.
  unit: A.m^-2

- name: flux_surface_averaged_toroidal_current_density
  description: |-
    Flux-surface-averaged toroidal current density is the net conventional
    toroidal charge flux per area, averaged over a closed magnetic surface with
    additional inverse-major-radius weighting.
  documentation: |-
    Flux-surface-averaged toroidal current density is the signed geometric
    toroidal component of the net plasma current density, averaged over a closed
    magnetic flux surface with additional inverse-major-radius weighting.

    The defining weighted average is

    $$\langle f\rangle = \oint f\,dS/|\nabla\psi| \,/\, \oint dS/|\nabla\psi|$$

    where $j_\phi^{\mathrm{FS}}$ is this averaged current density, $j_\phi$ is
    the local [toroidal current density](name:toroidal_current_density), $R$ is
    major radius, and $\psi$ is the poloidal magnetic flux labeling the selected
    surface. Angle brackets denote the flux-surface average, defined by $\langle
    f\rangle = \oint f\,dS/|\nabla\psi| \,/\, \oint dS/|\nabla\psi|$, where $f$
    is the averaged quantity, $S$ is the closed magnetic surface, $dS$ is its
    area element, and $\nabla\psi$ is the poloidal-flux gradient.

    The quantity includes the net contribution from all plasma current-carrying
    populations and mechanisms over the complete selected surface, including
    closed surfaces in the core plasma. It is neither a pointwise current
    density nor the total current through the enclosed plasma cross-section. The
    additional inverse-major-radius weighting distinguishes it from the ordinary
    flux-surface average $\langle j_\phi\rangle$.

    The underlying [current-density vector](name:current_density) is projected
    onto the geometric toroidal direction in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $\phi$ is toroidal angle and $Z$ is vertical
    height. Unlike [flux-surface-averaged parallel current
    density](name:flux_surface_averaged_parallel_current_density), this quantity
    uses the geometric toroidal projection rather than a magnetic-field-aligned
    projection.

    Sign convention: Positive when the weighted net conventional current flows
    in the direction of increasing toroidal angle $\phi$, counterclockwise when
    viewed from above.
  unit: A.m^-2

- name: minimum_over_flux_surface_magnetic_field_magnitude
  description: |-
    Smallest total magnetic-field strength attained along a specified nested
    magnetic flux surface, using the field magnitude rather than a signed
    component.
  documentation: |-
    The minimum magnetic-field magnitude is the smallest total field strength
    attained anywhere on a specified nested magnetic flux surface. It is
    sign-invariant because it uses the modulus of the magnetic-field vector
    rather than a signed component.

    For a surface labeled by the magnetic-flux coordinate $\psi$, the quantity
    is defined by

    $$
    B_{\min}(\psi) = \min_{\mathbf{x} \in S(\psi)} \left|\mathbf{B}(\mathbf{x})\right|
    $$

    where $B_{\min}(\psi)$ is the minimum magnetic-field magnitude, $\mathbf{x}$
    is a position on the surface, $S(\psi)$ is the set of positions belonging to
    the flux surface labeled by $\psi$, and $\mathbf{B}(\mathbf{x})$ is the
    total magnetic-field vector at that position.

    The minimum is taken over all positions on each nested magnetic flux surface
    and includes the complete equilibrium field, including its poloidal and
    toroidal contributions. It is not a signed component minimum, a flux-surface
    average, or a minimum taken across multiple flux surfaces.

    Unlike the [flux-surface-averaged inverse square of magnetic-field
    magnitude](name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude),
    this quantity reduces the field magnitude itself by a pointwise minimum
    rather than averaging its reciprocal square.
  unit: T

- name: minimum_safety_factor
  description: |-
    Signed safety-factor value on the closed magnetic flux surface where the
    magnitude of field-line winding is smallest, distinct from that surface’s
    location.
  documentation: |-
    The minimum safety factor is the signed field-line winding number evaluated
    on the nested closed magnetic flux surface where the magnitude of the safety
    factor is smallest. It represents the extremal value of the safety-factor
    function within the confined closed-surface domain.

    The minimizing value is defined by

    $$
    q_{\min} = q(\rho_\ast), \qquad \rho_\ast \in \operatorname*{arg\,min}_{0 \leq \rho \leq 1} |q(\rho)|
    $$

    where $q(\rho)$ is the signed [safety factor](name:safety_factor) on the
    flux surface labeled by $\rho$, $\rho_\ast$ is the label of a surface at
    which the magnitude $|q(\rho)|$ is minimized, and $q_{\min}$ is the signed
    value evaluated there. The label $\rho$ is a monotonic flux-surface
    coordinate whose endpoints denote the magnetic axis and the last closed flux
    surface. In flux coordinates $(\rho,\theta,\phi)$, $\theta$ is the poloidal
    angle and $\phi$ is the toroidal angle of the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$ is vertical height.

    The extremum is taken over all nested closed magnetic flux surfaces and is
    neither a flux-surface average nor a sum. The location-defining quantity is
    separate: poloidal magnetic flux at minimum safety factor identifies the
    corresponding surface, while this quantity reports only the signed safety
    factor. It is also distinct from a safety factor evaluated at a prescribed
    locus, such as the magnetic axis.

    Sign convention: Positive when the toroidal angle advance of a magnetic
    field line is in the direction of increasing $\phi$ as the poloidal angle
    $\theta$ increases.
  unit: '1'

- name: normalized_poloidal_flux_coordinate_of_plasma_boundary
  description: |-
    Radial flux-surface location of the selected plasma boundary, expressed by
    the normalized poloidal flux coordinate. It is the linear normalized
    poloidal flux value, increasing from zero at the magnetic axis to one at the
    separatrix, of the closed flux surface taken as the plasma boundary;
    fixed-boundary equilibrium calculations commonly set it slightly below one
    to select a surface just inside the separatrix.
  documentation: |-
    The normalized poloidal flux coordinate of the plasma boundary is the value
    of the [normalized poloidal flux
    coordinate](name:normalized_poloidal_flux_coordinate) on the closed flux
    surface selected as the plasma boundary. It is the linear normalized
    poloidal flux, labeling the boundary's radial position between the magnetic
    axis and the last closed flux surface.

    Its value is the poloidal flux difference from the magnetic axis normalized
    to the axis-to-separatrix flux difference:

    $$
    \psi_{\mathrm{N}}^{\mathrm{boundary}} = \frac{\psi_{\mathrm{boundary}} - \psi_{\mathrm{axis}}}{\psi_{\mathrm{sep}} - \psi_{\mathrm{axis}}}
    $$

    where $\psi_{\mathrm{boundary}}$ is the [poloidal magnetic
    flux](name:poloidal_magnetic_flux) on the selected plasma-boundary surface,
    $\psi_{\mathrm{axis}}$ is the [poloidal magnetic flux at the magnetic
    axis](name:poloidal_magnetic_flux_at_magnetic_axis), and
    $\psi_{\mathrm{sep}}$ is the poloidal magnetic flux at the separatrix (last
    closed flux surface).

    The label equals zero at the magnetic axis and equals one when the selected
    plasma boundary coincides with the separatrix; a value below one selects an
    internal closed flux surface. Its defining role is to specify, for
    fixed-boundary equilibrium representations, which closed flux surface is
    taken as the plasma boundary, commonly a surface just inside the separatrix
    so that the boundary remains strictly closed.

    This is the linear normalized poloidal flux value itself, not its square
    root, and it is a flux-surface label rather than a signed poloidal-flux
    value or a geometric minor-radius measure. It is distinct from the
    toroidal-flux-based boundary label normalized toroidal flux coordinate at
    the plasma boundary, and it belongs to the same locus-valued family as the
    normalized poloidal flux coordinate at minimum safety factor and the
    [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).
  unit: '1'

- name: safety_factor_at_magnetic_axis
  description: |-
    Safety factor at the magnetic axis is the signed toroidal-to-poloidal
    field-line winding ratio at the innermost closed flux surface, the value
    approached as nested closed magnetic flux surfaces contract toward the axis.
    It gives the toroidal turns made by a magnetic field line per complete
    poloidal circuit in that limit.
  documentation: |-
    Safety factor at magnetic axis

    On each neighboring nested closed magnetic flux surface, the [safety
    factor](name:safety_factor) is defined by

    $$
    q = \frac{1}{2\pi}\oint \frac{\mathbf{B}\cdot\nabla\phi}{\mathbf{B}\cdot\nabla\theta}\,d\theta
    $$

    where $q$ is the safety factor, $\mathbf{B}$ is the magnetic field, $\nabla$
    is the spatial gradient operator, $\phi$ is the toroidal angle, and $\theta$
    is the poloidal angle; the integral follows a magnetic field line through
    one complete poloidal circuit. The toroidal angle $\phi$ belongs to the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $Z$
    is vertical height, and $\phi$ increases counterclockwise when viewed from
    above.

    This quantity is the value of $q$ at the innermost closed flux surface:
    writing $q_{\mathrm{axis}}$ for it,
    $q_{\mathrm{axis}}=\lim_{\mathcal{S}\to\mathrm{axis}} q(\mathcal{S})$, where
    $\mathcal{S}$ ranges over the nested closed magnetic flux surfaces
    contracting toward the magnetic axis and $q(\mathcal{S})$ is the safety
    factor on $\mathcal{S}$. It is a single signed equilibrium winding value
    with no species, population, or charge-state aggregation. It is a limit from
    neighboring closed surfaces, not a direct evaluation of the winding
    integrand on the axis, not a value on a finite-radius surface, not a volume
    average, and not a local ratio of magnetic-field component magnitudes.
    Proximity of this value to low-order rational numbers indicates
    susceptibility to core-resonant magnetohydrodynamic modes such as sawteeth.

    It is the magnetic-axis specialization of the [safety
    factor](name:safety_factor), which describes field-line winding as a
    function of flux-surface label. The [minimum safety
    factor](name:minimum_safety_factor) instead selects the closed surface where
    the safety-factor magnitude is smallest, and the [safety factor at the
    plasma boundary](name:safety_factor_at_plasma_boundary) is the confined-side
    outer-boundary value. The [rotational transform](name:rotational_transform)
    is the reciprocal winding ratio, $\iota = 1/q$, where $\iota$ is the signed
    number of poloidal turns per toroidal turn.

    Sign convention: Positive when the toroidal angle advance of a magnetic
    field line is in the direction of increasing $\phi$ as the poloidal angle
    $\theta$ increases.

    The closed magnetic-field line about which nested toroidal magnetic flux
    surfaces are arranged. Where $\mathbf{B}_{\mathrm{p}}(R_{\mathrm{axis}},
    Z_{\mathrm{axis}}) = 0$, $\mathbf{B}_{\mathrm{p}}$ is poloidal magnetic
    field; $R_{\mathrm{axis}}, Z_{\mathrm{axis}}$ is the O-point inside the
    nested closed flux surfaces.
  unit: '1'

- name: toroidal_total_current_density
  description: |-
    Toroidal total current density is the net conventional charge flux per unit
    area around the symmetry axis, formed by algebraically summing all included
    current contributions.
  documentation: |-
    Toroidal total current density is the signed local projection of the net
    [current density](name:current_density) onto the toroidal direction. It
    combines all included contributions before or after projection onto that
    same direction.

    The projection and aggregation are defined by:

    $$
    j_\phi = \hat{\phi}\cdot\mathbf{j}_{\mathrm{tot}} = \sum_k \hat{\phi}\cdot\mathbf{j}_k
    $$

    where $j_\phi$ is the toroidal total current density,
    $\mathbf{j}_{\mathrm{tot}}$ is the total current-density vector,
    $\mathbf{j}_k$ is an included current-density contribution, and $k$ labels
    those contributions. The unit vector $\hat{\phi}$ points toward increasing
    toroidal angle in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The total is an algebraic sum, not a sum of magnitudes, and does not select
    a particular species, charge state, or current-generation mechanism. The
    quantity is local, with no restriction to a particular plasma region; it is
    neither a current-density magnitude nor a flux-surface average or spatially
    integrated current.

    This quantity specializes [total current
    density](name:total_current_density) by fixing its common signed projection
    to the toroidal direction. The adjacent [radial total current
    density](name:radial_total_current_density) instead projects the same net
    charge-flux density onto the outward major-radius direction.

    Sign convention: Positive when the net conventional charge transport is in
    the direction of increasing toroidal angle, counterclockwise when viewed
    from above along the negative vertical direction.
  unit: A.m^-2
