- name: nitrogen_density
  kind: scalar
  status: draft
  description: Local number density of all nitrogen nuclei per unit plasma volume,
    summed over all ionization states from neutral nitrogen through fully stripped
    ions.
  documentation: 'Local number density of all nitrogen nuclei per unit plasma volume,
    totaling contributions from every ionization state of the species.


    The total nitrogen density is the sum over all charge states:


    $$

    n_N = \sum_{z=0}^{7} n_{N^{z+}}

    $$


    where $n_{N^{z+}}$ is the number density of nitrogen ions in charge state $z+$,
    with $z = 0$ for neutral nitrogen and $z = 7$ for fully stripped N$^{7+}$ (atomic
    number $Z_N = 7$).


    Nitrogen is commonly seeded into fusion plasmas as a radiative impurity to dissipate
    excess divertor heat flux; the local $n_N$ directly determines the radiative cooling
    power and the nitrogen contribution to the effective charge $Z_\mathrm{eff}$.
    It is inferred from vacuum-ultraviolet or extreme-ultraviolet emission spectroscopy
    analyzed with collisional-radiative models, or from active charge-exchange recombination
    spectroscopy.


    During active nitrogen seeding, core concentrations in present-day tokamaks range
    from $10^{17}$ to $5 \times 10^{18}$ m$^{-3}$, with elevated values near the plasma
    edge. The [line-averaged nitrogen density](name:line_averaged_nitrogen_density)
    and [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density)
    provide chord-integrated and globally averaged measures of the nitrogen particle
    inventory; [nitrogen_fraction](name:nitrogen_fraction) normalizes $n_N$ to the
    electron density.


    Sign convention: Positive when nitrogen nuclei are present in the plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_nitrogen_density
  - name:volume_averaged_nitrogen_density
  - name:nitrogen_fraction
- name: line_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Line-averaged number density of nitrogen nuclei along a plasma diagnostic
    chord, summed over all ionization states. It equals the path integral of the local
    nitrogen density divided by the chord length.
  documentation: 'Line-averaged nitrogen density is the chord-average of the local
    nitrogen number density sampled along a diagnostic line of sight. The nitrogen
    density includes nitrogen nuclei in all ionization states, so different charge
    states contribute according to their local abundance along the chord.


    For a chord path $\Gamma$, the line-averaged nitrogen density is defined by:


    $$

    \langle n_N \rangle_L = \frac{1}{L}\int_{\Gamma} n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local nitrogen number density in m^-3, summed over all
    ionization states, $\ell$ is arclength along the chord in meters, and $L=\int_{\Gamma}d\ell$
    is the chord length in meters over the sampled plasma region.


    In practice this quantity is inferred from diagnostics and analysis methods that
    constrain nitrogen content along a line of sight, often using spectroscopic signals,
    atomic physics modeling, plasma background parameters, and the known viewing geometry.
    Because many measurements are sensitive to emissivity or to particular charge-state
    populations rather than directly to total nitrogen density, the conversion to
    all-ionization-state nitrogen density is model dependent and is not simply a geometric
    division of a raw signal by chord length.


    Typical line-averaged nitrogen densities in tokamak plasmas range from about 1e15-1e18
    m^-3 for trace-seeded conditions and can reach 1e19 m^-3 in strongly seeded or
    detached-edge regimes, depending on fueling, impurity seeding rate, transport,
    and ionization balance.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  - name:line_averaged_carbon_density
  - name:nitrogen_density
  arguments:
  - name: nitrogen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/nitrogen/value
    dd_path: summary/line_average/n_i/nitrogen/value
    status: composed
- name: nuclear_density_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Number density of target nuclei in a neutron detector converter material
    for the nuclear species involved in the neutron-induced detection reaction.
  documentation: 'Nuclear density of a neutron detector converter is the number of
    target atomic nuclei per unit volume of converter material for the nuclear species
    that participates in the neutron-induced detection reaction. It is a material-and-composition
    property, distinct from converter volume or neutron flux, and sets the number
    of reaction centers available to incident neutrons.


    For a converter made from one or more compounds or phases $c$, the target-nucleus
    density can be computed from the bulk material density and composition as:


    $$

    n_i = \rho_m N_A \sum_c f_c \frac{\nu_{i,c} a_{i,c}}{M_c}

    $$


    where $n_i$ is the target nuclear density in $\mathrm{m}^{-3}$, $\rho_m$ is the
    bulk mass density of the converter material in $\mathrm{kg\,m}^{-3}$, $N_A$ is
    Avogadro''s constant in $\mathrm{mol}^{-1}$, $f_c$ is the dimensionless mass fraction
    of compound or phase $c$, $M_c$ is its molar mass in $\mathrm{kg\,mol}^{-1}$,
    $\nu_{i,c}$ is the number of atoms of the relevant parent element per formula
    unit, and $a_{i,c}$ is the dimensionless isotopic abundance or enrichment of target
    isotope $i$. For a pure elemental or pure isotopic converter this reduces to the
    familiar single-component density relation.


    In practice this quantity is derived from material specifications, density measurements,
    stoichiometry, isotopic assay, enrichment certificates, and corrections for porosity
    or inactive binder fraction when those affect the active converter volume. In
    response calculations it is combined with the microscopic reaction cross section
    and the converter-level neutron flux, such as [neutron_flux_of_neutron_detector_converter](name:incident_neutron_fluence_of_neutron_detector_converter);
    this is the flux at or within the converter and is distinct from a detector-level
    incident or averaged [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).


    Typical dense solid converter materials have total atomic densities of about $10^{28}-10^{29}\
    \mathrm{m}^{-3}$. Target isotope densities are commonly $10^{26}-10^{29}\ \mathrm{m}^{-3}$
    depending on stoichiometry, enrichment, and loading, while gas or low-density
    converter media can be much lower, around $10^{20}-10^{25}\ \mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:incident_neutron_fluence_of_neutron_detector_converter
  - name:neutron_flux_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_nuclear_density
    dd_path: neutron_diagnostic/detectors/radiation/converter_nuclear_density
    status: composed
- name: nuclear_target_atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Fraction of atoms in the neutron detector converter material that belong
    to the nuclear target species responsible for the primary neutron-induced detection
    reaction.
  documentation: 'The nuclear target atomic fraction specifies what proportion of
    the total atoms present in the neutron detector converter are of the isotopic
    species that participates in the primary neutron detection reaction (for example,
    neutron capture or fission). Converter materials exploit specific target nuclei
    that interact with incident neutrons to produce detectable secondary charged particles;
    the converter''s intrinsic efficiency and absolute response are set directly by
    how many such target atoms exist within the active volume.


    The fraction is defined as:


    $$

    f_{\rm target} = \frac{N_{\rm target}}{N_{\rm total}}

    $$


    where $N_{\rm target}$ is the number of target nuclear species atoms and $N_{\rm
    total}$ is the total atom count in the converter.


    This fraction enters the calculation of the total reactive nucleus inventory together
    with the [nuclear number density](name:nuclear_density_of_neutron_detector_converter)
    and the [converter volume](name:volume_of_neutron_detector_converter), and it
    scales the [nuclear reaction rate per unit volume](name:nuclear_rate_of_neutron_detector_converter)
    proportionally. Converters fabricated from isotopically enriched materials have
    values approaching 1, while natural-abundance converter materials may exhibit
    significantly lower fractions depending on the isotope''s natural abundance. The
    [normalized atomic count](name:nuclear_target_atomic_fraction_of_neutron_detector_converter)
    provides a complementary dimensionless measure of the reactive nucleus inventory
    integrated over the full detector assembly.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:nuclear_rate_of_neutron_detector_converter
  sources:
  - id: dd:neutron_diagnostic/detector/nuclei_n
    dd_path: neutron_diagnostic/detector/nuclei_n
    status: composed
- name: oxygen_density
  kind: scalar
  status: draft
  description: Total number density of oxygen atoms and ions across all charge states,
    from neutral to fully stripped, giving the local oxygen impurity concentration
    at a point in the plasma.
  documentation: "The local oxygen number density $n_\\mathrm{O}$ quantifies the total\
    \ concentration of oxygen impurity per unit plasma volume, encompassing neutral\
    \ atomic oxygen and all ionic charge states up to fully stripped O$^{8+}$. Oxygen\
    \ is a ubiquitous low-Z impurity in fusion devices, entering through wall outgassing\
    \ and vessel conditioning; it contributes to radiative power losses and dilutes\
    \ the hydrogenic fuel inventory.\n\nThe total oxygen density is defined as the\
    \ sum over all ionization states:\n\n$$\nn_\\mathrm{O} = \\sum_{Z=0}^{8} n_{\\\
    mathrm{O}^{Z+}}\n$$\n\nwhere $n_{\\mathrm{O}^{Z+}}$ is the number density of oxygen\
    \ in charge state $Z^+$, with $Z$ ranging from 0 (neutral) to 8 (fully stripped).\n\
    \nThe local density is inferred from passive extreme-ultraviolet spectroscopy,\
    \ charge-exchange recombination spectroscopy, and soft X-ray emission tomography.\
    \ Spatially averaged forms include [line_averaged_oxygen_density](name:line_averaged_oxygen_density)\
    \ (chord integral divided by chord length) and [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ (integral over the plasma volume). The dimensionless [oxygen_fraction](name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density)\
    \ relates this local density to the electron density as an impurity concentration\
    \ measure.\n\nIn well-conditioned fusion plasmas the core oxygen density is a\
    \ small fraction of the electron density; edge concentrations of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ are representative of limiter and divertor configurations.\n\
    \nSign convention: Positive when oxygen atoms or ions are present in the plasma\
    \ volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_oxygen_density
  - name:volume_averaged_oxygen_density
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
- name: line_averaged_oxygen_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the total oxygen impurity number density,
    encompassing all charge states from neutral to fully stripped, divided by the
    chord length.
  documentation: "The line-averaged oxygen density is the chord-mean of the local\
    \ oxygen number density\u2014summed over all charge states from neutral O$^0$\
    \ through fully stripped O$^{8+}$\u2014along a measurement path through the plasma.\
    \ It characterizes the mean impurity concentration of oxygen along a given line\
    \ of sight and is directly related to the local [oxygen_density](name:oxygen_density)\
    \ integrated along the chord.\n\nThe defining relation is:\n\n$$\n\\langle n_O\
    \ \\rangle_\\ell = \\frac{1}{L} \\int_0^L n_O(\\ell) \\, d\\ell\n$$\n\nwhere $n_O(\\\
    ell)$ is the local oxygen number density at position $\\ell$ along the chord and\
    \ $L$ is the chord length in m.\n\nLine-averaged impurity densities are extracted\
    \ from chord-integrated spectroscopic measurements of oxygen emission lines combined\
    \ with ionization balance models. Passive spectroscopy of ultraviolet oxygen transitions\
    \ or charge-exchange recombination spectroscopy of helium-like and hydrogen-like\
    \ oxygen lines provides the chord-integrated signal from which the line-averaged\
    \ density is inferred. As a chord-averaged observable, spatial resolution is inherently\
    \ limited, and tomographic inversion or profile modeling is required to recover\
    \ local distributions.\n\nOxygen is a low-concentration impurity in fusion plasmas\
    \ under normal operating conditions; line-averaged values fall several orders\
    \ of magnitude below the electron density, with representative ranges of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ depending on wall conditioning and impurity seeding. The [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ provides the plasma-volume\u2013weighted counterpart, while analogous chord-averaged\
    \ densities for other impurity species include [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)\
    \ and [line_averaged_carbon_density](name:line_averaged_carbon_density).\n\nSign\
    \ convention: Positive when oxygen impurity particles are present along the measurement\
    \ chord at nonzero concentration."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:oxygen_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_carbon_density
  arguments:
  - name: oxygen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/oxygen/value
    dd_path: summary/line_average/n_i/oxygen/value
    status: composed
- name: requested_lower_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Requested low-voltage supply setpoint for a neutron detector module.
    It is the commanded target potential difference for detector electronics operation,
    not a measured detector signal.
  documentation: 'The requested low-voltage supply setpoint is the target electrical
    potential difference commanded for the low-voltage power supply associated with
    a neutron detector module. It represents the intended operating point of the detector
    electronics supply rather than the voltage actually delivered at the terminals.


    The setpoint is defined as the commanded potential difference between the regulated
    low-voltage output and its electrical reference:


    $$

    V_{\mathrm{LV,set}} = \Phi_{\mathrm{out,set}} - \Phi_{\mathrm{ref}}

    $$


    where $V_{\mathrm{LV,set}}$ is the requested low-voltage setpoint in volts (V),
    $\Phi_{\mathrm{out,set}}$ is the commanded output-terminal electric potential
    in volts (V), and $\Phi_{\mathrm{ref}}$ is the associated supply return or electrical
    reference potential in volts (V).


    This quantity is produced by the detector control or configuration system as the
    target for a regulated low-voltage supply. It should be distinguished from the
    high-voltage bias command represented by [requested upper voltage of neutron detector](name:requested_upper_voltage_of_neutron_detector)
    and from detector signal voltages such as [voltage of neutron detector](name:voltage_of_neutron_detector).
    When an actual low-voltage monitor is available, this setpoint is the reference
    value against which the achieved supply voltage is assessed.


    Typical values are device-specific and set by the detector electronics design.
    Low-voltage detector supplies are commonly commanded to nominal service rails
    of a few V to a few tens of V; allowable zero, standby, bipolar, or negative-rail
    commands depend on the particular supply and detector module.


    Sign convention: Positive when the commanded low-voltage supply output terminal
    is at higher electric potential than its associated supply return or electrical
    reference terminal.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:requested_upper_voltage_of_neutron_detector
  - name:voltage_of_neutron_detector
  - name:peak_voltage_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/supply_low_voltage/voltage_set
    dd_path: neutron_diagnostic/detector/supply_low_voltage/voltage_set
    status: composed
  - id: dd:neutron_diagnostic/detectors/supply_low_voltage/voltage_set
    dd_path: neutron_diagnostic/detectors/supply_low_voltage/voltage_set
    status: attached
- name: requested_upper_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Commanded target potential difference for the upper high-voltage bias
    connection of a neutron detector, referenced to the detector high-voltage return
    or electronics common. It specifies the requested operating bias for detector
    electronics, not a measured supply output or detector signal.
  documentation: 'Requested upper voltage of a neutron detector is the commanded potential
    difference assigned to the detector''s upper high-voltage bias connection relative
    to the detector high-voltage return or electronics reference. It sets the intended
    operating bias for charge collection, gas multiplication, scintillator photodetector
    gain, or related detector-electronics behavior. This quantity is a setpoint, not
    a measured high-voltage readback and not the radiation-induced detector signal
    voltage.


    The reference polarity is defined by the potential difference between the commanded
    upper bias potential and the chosen detector reference potential:


    $$

    V_{\mathrm{upper,req}} = \Phi_{\mathrm{upper,req}} - \Phi_{\mathrm{ref}}

    $$


    where $\Phi_{\mathrm{upper,req}}$ is the commanded electric potential of the upper
    high-voltage bias connection and $\Phi_{\mathrm{ref}}$ is the detector high-voltage
    return, electronics common, or other explicitly defined bias reference.


    In practice the value is prescribed from the detector operating point and may
    be held constant, ramped during conditioning, or changed between acquisition phases.
    The realized voltage, if monitored, is a separate supply readback; detector pulse
    or current signals are also separate physical quantities produced by neutron interactions
    and the associated electronics chain.


    Typical commanded magnitudes range from about 100-3000 V for many gas-filled neutron
    detectors, fission chambers, ionization chambers, and photodetector-based systems,
    with lower or higher values possible depending on detector type, pressure, electrode
    spacing, insulation limits, and required gain.


    Sign convention: Positive when the commanded potential of the upper high-voltage
    bias connection is greater than the detector high-voltage return or electronics
    reference potential.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:requested_lower_voltage_of_neutron_detector
  - name:efficiency_of_neutron_detector
  - name:voltage_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/supply_high_voltage/voltage_set
    dd_path: neutron_diagnostic/detector/supply_high_voltage/voltage_set
    status: composed
  - id: dd:neutron_diagnostic/detectors/supply_high_voltage/voltage_set
    dd_path: neutron_diagnostic/detectors/supply_high_voltage/voltage_set
    status: attached
- name: temperature_of_neutron_detector
  kind: scalar
  status: draft
  description: Calibrated thermodynamic temperature, in kelvin, representing the thermal
    state of a neutron detector assembly or its neutron-conversion element. It is
    the temperature used to characterize detector response, not the raw temperature-sensor
    voltage.
  documentation: 'Temperature of a neutron detector is the calibrated thermodynamic
    temperature representing the thermal state of the detector assembly, housing,
    electronics-adjacent sensor location, or neutron-to-charged-particle converter
    element. The reported quantity is an absolute temperature in kelvin and is therefore
    non-negative; it is distinct from a raw sensor output such as [voltage_of_temperature_sensor](name:voltage_of_temperature_sensor).


    When the detector temperature is spatially non-uniform or measured by several
    sensors, the scalar value should represent the location or thermal component most
    relevant to the detector response, such as the converter material or the sensor
    thermally coupled to the active detector module. If several readings are combined,
    the value is normally a calibrated representative temperature, for example an
    average or response-weighted estimate, with the choice determined by the detector
    calibration model.


    In practice the temperature is obtained from thermistors, resistance temperature
    detectors, thermocouples, semiconductor sensors, or similar devices attached to
    the detector body, converter, or local electronics package. The calibrated temperature
    is used to monitor gain stability, temperature-dependent efficiency, electronic
    noise, and time-dependent corrections applied to neutron count-rate or signal
    measurements such as [voltage_of_neutron_detector](name:voltage_of_neutron_detector)
    and [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).


    Representative operating values for room-temperature neutron detector systems
    are often about 280-330 K. Detectors with active heating, cooling, in-vessel placement,
    or thermally isolated converter elements may operate outside this range, and transient
    heating during a discharge can produce smaller time-dependent excursions around
    the local baseline.'
  unit: K
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux_of_neutron_detector
  - name:voltage_of_neutron_detector
  - name:voltage_of_temperature_sensor
  sources:
  - id: dd:neutron_diagnostic/detector/temperature
    dd_path: neutron_diagnostic/detector/temperature
    status: attached
  - id: dd:neutron_diagnostic/detectors/radiation/converter_temperature
    dd_path: neutron_diagnostic/detectors/radiation/converter_temperature
    status: composed
- name: vertical_coordinate_of_launching_position
  kind: scalar
  status: draft
  description: "Vertical coordinate of the physical launching position where a diagnostic\
    \ viewing ray, emitted probing beam, or antenna path begins in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame. It gives the launch height Z relative to the\
    \ coordinate origin."
  documentation: 'The vertical coordinate of a launching position is the $Z$ component
    of the physical point from which a diagnostic line of sight, emitted probing beam,
    or antenna-launched path is initiated. It is defined in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    This coordinate complements the radial and toroidal coordinates of the same launch
    point to locate the starting point of a ray or beam in space. More specific quantities
    may be used when the object is specialized, such as the vertical position of a
    neutral-beam injector, a diagnostic aperture, or a point along a beam-tracing
    trajectory; this name denotes the generic launch point itself.


    The value is obtained from the known instrument geometry and its alignment with
    respect to the machine coordinate origin. It is normally treated as a geometric
    configuration quantity, while changes in movable launchers or steering systems
    are represented by the corresponding updated launch geometry.


    Typical values are set by the vertical extent of the vessel and diagnostic access
    ports. In medium-sized tokamaks they commonly lie in the range -2-2 m, while larger
    devices may have launch heights extending to several meters above or below the
    midplane.


    Sign convention: Positive when the launching position lies in the direction of
    increasing vertical coordinate $Z$.'
  unit: m
  physics_domain: particle_measurement_diagnostics
