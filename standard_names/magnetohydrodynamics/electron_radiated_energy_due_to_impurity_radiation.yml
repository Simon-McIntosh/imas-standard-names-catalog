name: electron_radiated_energy_due_to_impurity_radiation
status: draft
description: Time-integrated electromagnetic energy radiated by electrons scattering
  off impurity ions over a disruption event.
documentation: "This quantity represents the cumulative radiated energy $E_{\\mathrm{rad,imp}}\
  \ = \\int_0^{\\tau_d} P_{\\mathrm{rad,imp}}(t)\\,dt$, where $P_{\\mathrm{rad,imp}}$\
  \ is the total impurity radiation power in watts and $\\tau_d$ is the disruption\
  \ duration in seconds. Impurity radiation arises from line emission, recombination,\
  \ and bremsstrahlung of electrons interacting with partially ionized impurity species\
  \ (e.g., carbon, tungsten, neon, argon). In tokamak disruptions, the radiated energy\
  \ can reach 50\u2013100% of the pre-disruption stored thermal energy, typically\
  \ 1\u201320 MJ in medium-to-large devices. The quantity is measured by bolometer\
  \ arrays (AXUV, foil bolometers) integrated over the plasma volume or reconstructed\
  \ via tomographic inversion. It is a critical metric for assessing the radiative\
  \ dissipation of the thermal quench and its effectiveness in mitigating localized\
  \ heat loads on plasma-facing components. See `radiated_power_due_to_impurity_radiation`\
  \ for the instantaneous power counterpart."
validity_domain: ''
