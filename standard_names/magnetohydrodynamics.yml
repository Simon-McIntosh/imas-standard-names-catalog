- name: electrostatic_potential
  kind: scalar
  status: draft
  description: "Scalar electric potential of the plasma, equal to the electrostatic\
    \ work per unit positive charge relative to a grounded reference, whose negative\
    \ gradient defines the radial electric field and drives E\xD7B plasma rotation."
  documentation: 'The electrostatic potential $\phi$ is the scalar electric potential
    of the plasma, quantifying the electrostatic work per unit positive charge measured
    relative to a reference surface (conventionally the grounded vacuum vessel). It
    encodes the large-scale electrostatic structure governing cross-field transport
    and $E \times B$ rotation in both the core and edge regions.


    The electrostatic contribution to the electric field is defined by:


    $$

    \mathbf{E}_{\rm es} = -\nabla\phi

    $$


    where $\phi$ is measured in V. The radial component $E_r = -\partial\phi/\partial
    r$ enters the neoclassical radial force balance for ion species and drives $E
    \times B$ rotation at velocity $\mathbf{v}_{E\times B} = (-\nabla\phi) \times
    \mathbf{B}/B^2$, where $\mathbf{B}$ is the total magnetic field vector and $B
    = |\mathbf{B}|$.


    In the plasma core, $\phi$ is inferred from spectroscopic measurements of impurity
    rotation combined with pressure-gradient data via the radial ion momentum balance.
    In the edge plasma and scrape-off layer, Langmuir probes and emissive probes measure
    the plasma potential directly relative to the vessel wall; location-specific quantities
    are described by [electrostatic_potential_at_wall](name:electrostatic_potential_at_wall)
    and [electrostatic_potential_at_midplane](name:electrostatic_potential_at_midplane).


    Typical scrape-off layer values are of order a few $T_e/e$ above the vessel potential,
    where $T_e$ is the local electron temperature; core values in high-performance
    discharges may reach hundreds of volts as the potential integrates over a large
    radial extent.


    Sign convention: Positive when the local plasma potential exceeds the grounded
    vacuum vessel reference potential.'
  unit: V
  physics_domain: magnetohydrodynamics
  links:
  - name:electrostatic_potential_at_wall
  - name:electrostatic_potential_at_midplane
  sources:
