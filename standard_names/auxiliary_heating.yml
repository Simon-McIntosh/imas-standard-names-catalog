- name: fast_electron_energy_due_to_electron_cyclotron_heating
  kind: scalar
  status: draft
  description: Population-integrated kinetic energy stored in the suprathermal electron
    population generated by electron cyclotron resonance heating.
  documentation: "The fast electron energy quantifies the total kinetic energy $E_{\\\
    text{fast, e}} = \\sum_i (\\gamma_i - 1) m_e c^2$ of the suprathermal electron\
    \ population produced by electron cyclotron resonance heating (ECRH) and current\
    \ drive (ECCD). This stored energy represents a fraction of the injected EC wave\
    \ power that is transferred to the non-thermal tail of the electron distribution\
    \ rather than to the bulk Maxwellian. Typical values for ITER baseline scenarios\
    \ are 0.1\u20131 MJ, depending on the ECRH power level and plasma parameters.\
    \ The energy is inferred from electron cyclotron emission (ECE) measurements or\
    \ from Fokker\u2013Planck simulations that model the wave-particle interaction.\
    \ This quantity is the electron counterpart of [fast_ion_energy_due_to_ion_cyclotron_heating](name:fast_ion_energy_due_to_ion_cyclotron_heating)\
    \ and complements the global [diamagnetic stored energy](name:diamagnetic_stored_energy)\
    \ diagnostic."
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_energy_due_to_ion_cyclotron_heating
  - name:diamagnetic_stored_energy
  sources:
  - id: dd:summary/heating_current_drive/ec/energy_fast/value
    dd_path: summary/heating_current_drive/ec/energy_fast/value
    status: composed
- name: fast_ion_absorbed_power_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Total power transferred from a coherent wave to the fast-ion population
    through resonant wave-particle interactions.
  documentation: The fast ion absorbed wave power quantifies the total energy per
    second deposited on suprathermal ions by a coherent electromagnetic wave, typically
    in the ion cyclotron range of frequencies (ICRF). This power transfer occurs through
    resonant Landau damping or cyclotron damping, where the wave's electric field
    component resonates with the fast ion gyromotion, governed by the resonant condition
    $\omega = n\Omega_{ci} + k_\parallel v_\parallel$, where $\omega$ is the wave
    frequency, $\Omega_{ci}$ is the ion cyclotron frequency, $k_\parallel$ is the
    parallel wave number, and $v_\parallel$ is the parallel velocity. Typical values
    range from 1 MW to 20 MW in present-day tokamaks for ICRF heating of fast ions
    from neutral beam injection or fusion-born alpha particles. This quantity is the
    spatial integral of the [fast_ion_absorbed_wave_power_density](name:fast_ion_absorbed_wave_power_density)
    over the plasma volume. The analogous quantity for thermal ions is the [thermal_ion_absorbed_power_due_to_wave_particle_interaction](name:thermal_ion_absorbed_power_due_to_wave_particle_interaction).
    Knowledge of this power deposition is essential for predicting fast ion confinement,
    energetic particle-driven instabilities, and fusion reactivity in burning plasmas.
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_absorbed_wave_power_density
  - name:thermal_ion_absorbed_power_due_to_wave_particle_interaction
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/power_fast
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_fast
    status: composed
- name: flux_surface_averaged_fast_electron_power_density
  kind: scalar
  status: draft
  description: Volumetric power density deposited onto the fast electron population,
    averaged over a magnetic flux surface.
  documentation: The flux-surface-averaged power density quantifies the volumetric
    power transferred to the fast electron population by resonant wave-particle interactions,
    auxiliary heating, or other processes. It is defined as $\langle p_{\rm fast}
    \rangle = \frac{1}{V'(\psi)} \oint p_{\rm fast}(\psi, \theta) \frac{dS}{|\nabla
    \psi|}$, where $\psi$ is the poloidal flux label and $V'(\psi) = dV/d\psi$ is
    the flux-surface volume derivative. The fast electron population, with energies
    well above the thermal bulk, is commonly generated by electron cyclotron resonance
    heating (ECRH) or lower hybrid current drive. The typical range in fusion-grade
    plasmas spans from $10^5$ to $10^7\;{\rm W\,m^{-3}}$ near the resonance layers,
    depending on the injected power and damping profile. This quantity provides the
    radial source term for fast electron kinetic models and is related to the per-toroidal-mode
    decomposition [`per_toroidal_mode_fast_electron_wave_power_density`](name:per_toroidal_mode_fast_electron_wave_power_density)
    via summation over toroidal mode number $n_\phi$.
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_fast_electron_wave_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_density_fast
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_density_fast
    status: composed
- name: launched_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Net radio-frequency power delivered by an ion cyclotron heating antenna
    to the plasma, equal to the forward power minus the reflected power at the antenna
    input.
  documentation: "The ion cyclotron resonance heating (ICRH) launched power $P_{\\\
    mathrm{launched,IC}}$ is the net RF power coupled from the antenna into the vacuum\
    \ vessel, representing the forward minus reflected power measured at the antenna\
    \ transmission line. This quantity determines the maximum power available for\
    \ absorption by the plasma and is a key input to ICRH system design and plant\
    \ energy balance calculations. Typical launched power values for individual antennas\
    \ range from 1\u20136 MW per antenna in present-day large tokamaks (e.g., JET,\
    \ DIII-D, AUG) and are planned at up to 20 MW per antenna for ITER. The launched\
    \ power is distinct from the power actually coupled into the plasma, which depends\
    \ on the antenna\u2013plasma coupling resistance, and is related to the [power_of_ion_cyclotron_heating_antenna](name:power_of_ion_cyclotron_heating_antenna)\
    \ as the coupled power. This quantity is measured by directional couplers and\
    \ power meters in the antenna transmission lines and is used as a boundary condition\
    \ for wave propagation and heating codes."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:summary/heating_current_drive/ic/power_launched/value
    dd_path: summary/heating_current_drive/ic/power_launched/value
    status: composed
  - id: dd:summary/heating_current_drive/power_launched_ic/value
    dd_path: summary/heating_current_drive/power_launched_ic/value
    status: composed
- name: major_radius_of_launching_position
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the point from which a diagnostic or
    heating system launches its beam or line of sight into the plasma.
  documentation: 'The launching position is the spatial origin of a beam-based plasma
    system, such as a microwave launcher for electron cyclotron heating or the entry
    point of a Thomson scattering laser. In the right-handed cylindrical $(R, \phi,
    Z)$ frame, this coordinate specifies the major radius $R$ of that starting point.
    Typical values range from 2.0 to 3.0 m in medium-size tokamaks and up to 6.5 m
    in ITER. The launching position is directly related to the beam path geometry
    and is used together with the beam direction to define the trajectory. See also
    [major_radius_of_beam_tracing_beam](name:major_radius_of_beam_tracing_beam) for
    the propagating beam coordinate along the trajectory.


    Sign convention: Positive when $R$ increases outward from the machine symmetry
    axis.'
  unit: m
  physics_domain: auxiliary_heating
  links:
