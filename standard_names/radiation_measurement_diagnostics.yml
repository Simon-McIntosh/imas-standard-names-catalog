- name: x2_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: X2 coordinate of a diagnostic aperture outline vertex in the local
    aperture-plane (X1, X2) frame. Together with the X1 coordinate, it defines the
    transverse boundary used in sight-line, acceptance, and etendue geometry.
  documentation: 'The $x_2$ coordinate of a diagnostic aperture is the signed position
    of an outline vertex along the second axis of the local aperture-plane $(X_1,
    X_2)$ frame. Paired with the corresponding $x_1$ coordinate, it specifies the
    transverse polygon or curved boundary that limits the rays accepted by an aperture,
    fiber entrance, detector face, or similar diagnostic opening.


    For a polygonal aperture outline, the paired vertex coordinates determine the
    enclosed geometric area through the shoelace relation:


    $$

    A = \frac{1}{2}\left|\sum_{i=1}^{N}\left(x_{1,i}x_{2,i+1} - x_{1,i+1}x_{2,i}\right)\right|

    $$


    where $N$ is the number of outline vertices, cyclic indexing is used so vertex
    $N+1$ is vertex $1$, and $x_{1,i}$ and $x_{2,i}$ are measured in meters. The resulting
    area $A$ is in square meters and is one input to aperture acceptance and etendue
    calculations.


    In practice, $x_2$ values are obtained from mechanical drawings, optical design
    models, metrology of aperture plates or fiber bundles, or calibration of detector
    geometry. The coordinate is interpreted only relative to the local aperture-plane
    $(X_1, X_2)$ frame, whose origin and axis directions are defined by the diagnostic
    geometry.


    Typical magnitudes range from $10^{-5}$-$10^{-1}$ m, from tens of micrometers
    for small fiber cores to millimeters or centimeters for pinholes, slits, detector
    faces, and camera apertures.


    Sign convention: Positive when the vertex is displaced in the $+X_2$ direction
    of the local aperture-plane $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x1_coordinate_of_filter
  - name:x2_coordinate_of_filter_window
  - name:x2_coordinate_of_optical_element
