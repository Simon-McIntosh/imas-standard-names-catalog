- name: perpendicular_normalized_perturbed_pressure
  kind: scalar
  status: active
  description: Perpendicular normalized perturbed pressure is a dimensionless gyrotropic
    perpendicular pressure moment of a perturbed particle or gyrocenter distribution
    in a linear gyrokinetic eigenmode, normalized to the species reference thermal
    pressure.
  documentation: 'Perpendicular normalized perturbed pressure is the dimensionless
    gyrotropic perpendicular pressure moment of a perturbed particle or gyrocenter
    distribution in a linear gyrokinetic eigenmode, normalized to the species reference
    thermal pressure. It represents the part of the perturbed pressure tensor associated
    with kinetic energy perpendicular to the equilibrium magnetic-field direction.


    For species $s$, the normalized perpendicular moment is defined by


    $$

    \tilde{p}_{\perp,s} = \frac{1}{p_{\mathrm{ref},s}} \int \varepsilon_{\perp,s}\,\delta
    f_s\,d\Lambda_s

    $$


    where $\tilde{p}_{\perp,s}$ is the perpendicular normalized perturbed pressure,
    $p_{\mathrm{ref},s}$ is the species reference thermal pressure, $\varepsilon_{\perp,s}$
    is the particle or gyrocenter kinetic energy associated with motion perpendicular
    to the equilibrium magnetic field, $\delta f_s$ is the perturbed distribution-function
    amplitude, and $d\Lambda_s$ is the local velocity-space or gyrocenter velocity-space
    measure for that distribution.


    This quantity is the perpendicular member of the gyrotropic pressure-moment pair;
    the companion member is [parallel normalized perturbed pressure]. When formed
    from the same distribution and normalization, the scalar trace pressure perturbation
    [normalized perturbed pressure](name:normalized_perturbed_pressure) is related
    by $\tilde{p}_s = (\tilde{p}_{\parallel,s} + 2\tilde{p}_{\perp,s})/3$. For complex
    linear eigenmodes this quantity is a complex amplitude whose overall phase follows
    the eigenmode normalization; relative phases, ratios, and magnitudes within the
    same normalization carry the invariant information.


    Sign convention: Positive when the perpendicular pressure perturbation is an enhancement
    of the equilibrium perpendicular thermal pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_pressure
  arguments:
  - name: normalized_perturbed_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/pressure_perpendicular
