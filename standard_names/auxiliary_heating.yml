      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for normal.
      kind: template
- name: thermal_electron_power_density
  kind: scalar
  status: active
  description: Volumetric coherent-wave power density absorbed by the bulk thermal
    electron population. It is the local rate of coherent-wave energy deposition into
    thermal electrons per unit plasma volume.
  documentation: 'Thermal electron power density is the time-averaged volumetric rate
    at which a coherent wave transfers energy to the bulk thermal electron population.
    It represents electron heating by wave absorption, distinct from power deposited
    directly into fast electrons, ions, or other nonthermal populations.


    For a monochromatic wave, the cycle-averaged absorbed power density is defined
    by


    $$

    p_{\mathrm{th},e}=\left\langle \mathbf{J}_{\mathrm{th},e}(t)\cdot\mathbf{E}(t)\right\rangle_t
    = \frac{1}{2}\,\mathrm{Re}\!\left[\tilde{\mathbf{J}}_{\mathrm{th},e}\cdot\tilde{\mathbf{E}}^{*}\right]

    $$


    where $p_{\mathrm{th},e}$ is the thermal electron power density, $\mathbf{E}$
    is the wave electric field, $\mathbf{J}_{\mathrm{th},e}$ is the induced current
    density associated with thermal electrons, $\langle\cdot\rangle_t$ denotes an
    average over a wave period, tildes denote peak-amplitude phasors, and $^{*}$ denotes
    complex conjugation. If rms phasor amplitudes are used instead, the factor $1/2$
    is omitted.


    This quantity is the thermal-electron channel of coherent-wave power absorption
    and is a component of the aggregate [electron power density](name:electron_power_density)
    when the energy balance includes coherent-wave transfer to thermal electrons.
    It excludes coherent-wave power deposited directly into [fast electron power density](name:fast_electron_power_density),
    ions, or non-electron species. The cumulative thermal-electron wave power in a
    plasma volume is the volume integral of $p_{\mathrm{th},e}$; for a flux-surface-bounded
    volume this corresponds to [thermal electron power at inside flux surface](name:thermal_electron_power_at_inside_flux_surface).


    Sign convention: Positive when coherent-wave energy is transferred from the wave
    field to the bulk thermal electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:electron_power_density
  - name:per_toroidal_mode_thermal_electron_power_density
  arguments:
  - name: electron_power_density
    operator: thermal
    operator_kind: qualifier
  sources:
