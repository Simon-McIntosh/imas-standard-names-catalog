      kind: llm
- name: resistance_of_vacuum_vessel
  kind: scalar
  status: active
  description: Lumped ohmic opposition to current flow through a discrete passive-conductor
    element of the vacuum vessel.
  documentation: 'Electrical resistance of a discrete passive-conductor element is
    the proportionality between the voltage drop across the element and the current
    through it, representing irreversible ohmic dissipation.


    $$

    R = \frac{\Delta V}{I}

    $$


    where $R$ is the resistance, $\Delta V$ is the potential difference across the
    element, and $I$ is the through-current. For an approximately homogeneous element,
    resistance is determined by the material resistivity and the element geometry,
    as described by [resistivity of the vacuum vessel](name:resistivity_of_vacuum_vessel)
    and [resistivity of wall material](name:resistivity_of_wall_material). This lumped
    quantity excludes inductive opposition and represents only the ohmic component;
    it is distinct from the total resistance of a closed [passive loop](name:resistance_of_passive_loop).'
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistivity_of_wall_material
  - name:resistance_of_passive_loop
  sources:
  - dd_path: wall/description_2d/vessel/unit/element/resistance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-vessel-unit-element-resistance
    dd_documentation:
      leaf: Resistance of the block element
      parent_path: wall/description_2d/vessel/unit/element
      parent: Set of block elements
      data_type: FLT_0D
      unit: ohm
    enhanced_context:
      description: Electrical resistance (R) of a block element of the vacuum vessel
        structure. Characterizes the ohmic property of the discrete vessel element,
        relevant for computing induced currents and electromagnetic loads during disruptions.
      kind: llm
- name: resistivity_of_cryostat
  kind: scalar
  status: active
  description: Electrical resistivity of the cryostat structural material, encompassing
    both the vessel body and the thermal shield, used as the primary electromagnetic
    material property in eddy-current analyzes.
  documentation: "Electrical resistivity is an intrinsic material property quantifying\
    \ resistance to electrical current flow per unit length and unit cross-sectional\
    \ area of a conducting medium. For the cryostat \u2014 which comprises the main\
    \ structural vessel and the surrounding thermal shield \u2014 this property governs\
    \ the amplitude of eddy currents induced during transient plasma events such as\
    \ disruptions and vertical displacement events, and the resulting ohmic heating\
    \ and electromagnetic forces on the structure.\n\nThe resistance $R$ of a cryostat\
    \ structural element is related to its resistivity $\\rho$ through element geometry:\n\
    \n$$\nR = \\rho \\frac{L}{A}\n$$\n\nwhere $L$ is the element length along the\
    \ current path and $A$ is its cross-sectional area perpendicular to current flow.\n\
    \nThis material constant is applied in electromagnetic finite-element analyzes\
    \ to model induced current distributions and compute $\\mathbf{J} \\times \\mathbf{B}$\
    \ forces and ohmic power deposition during disruptions. Metallic cryostat materials\
    \ span a wide range: austenitic stainless steel yields roughly $7 \\times 10^{-7}$\
    \ \u03A9\xB7m, while aluminum alloys are lower at approximately $3 \\times 10^{-8}$\
    \ \u03A9\xB7m at ambient temperature; both values increase with temperature. The\
    \ companion [resistance_of_cryostat](name:resistance_of_cryostat) gives the total\
    \ resistance of a discrete structural element, while [resistivity_of_vacuum_vessel](name:resistivity_of_vacuum_vessel)\
    \ is the analogous property for the vacuum vessel wall."
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistance_of_cryostat
  - name:resistivity_of_vacuum_vessel
  sources:
  - dd_path: cryostat/description_2d/cryostat/unit/annular/resistivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/cryostat.html#cryostat-description_2d-cryostat-unit-annular-resistivity
    dd_documentation:
      leaf: Resistivity of the vessel unit
      parent_path: cryostat/description_2d/cryostat/unit/annular
