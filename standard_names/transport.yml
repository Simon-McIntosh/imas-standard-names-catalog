- name: total_ion_density
  kind: scalar
  status: draft
  description: Number density of all ion species combined, summing thermal and suprathermal
    populations and all charge states, at each location in the plasma.
  documentation: 'The total ion density $n_{i,\text{total}}$ is the sum over all ion
    species, charge states, and thermal plus suprathermal populations at a given spatial
    location. It is a fundamental transport quantity that determines the ion contribution
    to quasineutrality alongside the electron density $n_e$, and enters the calculation
    of the plasma effective charge $Z_{\text{eff}}$ and ion pressure. Typical values
    range from $10^{19}$ to $10^{20}\,\text{m}^{-3}$ in the core of magnetically confined
    plasmas, dropping by orders of magnitude at the edge. The total ion density is
    routinely inferred from Thomson scattering (via $n_e$ and $Z_{\text{eff}}$) or
    measured directly by charge-exchange recombination spectroscopy combined with
    neutral beam injection. It is closely related to the flux-surface-averaged total
    ion density at the separatrix `[flux_surface_averaged_total_ion_density_at_separatrix](name:flux_surface_averaged_total_ion_density_at_separatrix)`
    and to the total ion density at the magnetic axis `[total_ion_density_at_magnetic_axis](name:total_ion_density_at_magnetic_axis)`.


    Sign convention: Positive when $n_{i,\text{total}}$ is a positive scalar number
    density.


    Cross-references to `[ion_density](name:ion_density)`, `[electron_density](name:electron_density)`,
    and `[thermal_density](name:thermal_density)` provide related density quantifications.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:flux_surface_averaged_total_ion_density_at_separatrix
  - name:total_ion_density_at_magnetic_axis
  - name:ion_density
  - name:electron_density
  - name:thermal_density
  sources:
  - id: dd:edge_profiles/ggd/n_i_total/values
    dd_path: edge_profiles/ggd/n_i_total/values
    status: attached
  - id: dd:edge_profiles/profiles_1d/n_i_total_over_n_e
    dd_path: edge_profiles/profiles_1d/n_i_total_over_n_e
    status: composed
  - id: dd:mhd/ggd/n_i_total/values
    dd_path: mhd/ggd/n_i_total/values
    status: composed
  - id: dd:plasma_profiles/ggd/n_i_total/values
    dd_path: plasma_profiles/ggd/n_i_total/values
    status: composed
- name: total_ion_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Total number density of all ion species at the magnetic axis, characterizing
    the core ion population available for fusion reactions.
  documentation: 'The total ion density at the magnetic axis is the sum over all thermal
    ion species (including main fuel, impurity, and fast ions) of their number densities,
    evaluated at the innermost flux surface where $\nabla \psi = 0$. This density
    is a critical input for calculating core fusion power, as the reaction rate scales
    as $n_i^2 \langle \sigma v \rangle$, with $\langle \sigma v \rangle$ the Maxwellian-averaged
    cross section. It is typically measured via charge-exchange recombination spectroscopy
    or inferred from equilibrium reconstruction combined with Thomson scattering data;
    values in the core of present tokamaks range from $10^{19}\,\text{m}^{-3}$ to
    $10^{20}\,\text{m}^{-3}$. The density complements the energy content described
    by [ion_temperature_at_magnetic_axis](name:ion_temperature_at_magnetic_axis) and
    provides a boundary condition for impurity transport models anchored at the magnetic
    axis.


    Sign convention: Positive when the particle number count increases, always positive
    for physical plasmas.


    Related quantities include [total_ion_density_at_separatrix](name:total_ion_density_at_separatrix)
    and [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target),
    which describe the same sum at outer locations, enabling density gradient analysis.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:ion_temperature_at_magnetic_axis
  - name:total_ion_density_at_separatrix
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/magnetic_axis/n_i_total/value
    dd_path: summary/local/magnetic_axis/n_i_total/value
    status: composed
- name: total_ion_pressure
  kind: scalar
  status: draft
  description: Total pressure of the thermal ion population, summed over all ion species
    and charge states.
  documentation: "The total ion pressure $p_i$ is defined as the sum of partial pressures\
    \ of all thermal ion species in the plasma, $p_i = \\sum_s n_s k_B T_s$, where\
    \ $n_s$ and $T_s$ are the density and temperature of species $s$, and $k_B$ is\
    \ Boltzmann's constant. This quantity excludes non-thermal (e.g., fast ion) contributions\
    \ and magnetic pressure, and it enters the total plasma pressure balance $p_\\\
    text{tot} = p_e + p_i + p_\\text{fast} + p_\\text{mag}$ for equilibrium reconstruction\
    \ and transport modeling. Typical values range from 10\u2013100 kPa in the core\
    \ of a tokamak plasma to 0.1\u20131 kPa in the scrape-off layer. It is routinely\
    \ inferred from ion temperature and density profiles measured by charge-exchange\
    \ recombination spectroscopy or Thomson scattering combined with Langmuir probe\
    \ data. See [thermal_pressure](name:thermal_pressure) for the electron counterpart\
    \ and [ion_temperature](name:ion_temperature) for the underlying kinetic parameter.\n\
    \nSign convention: Positive when the pressure acts outward from the magnetic axis,\
    \ by convention the total pressure is positive-definite.\n\nThis pressure contributes\
    \ to the plasma diamagnetic current and energy confinement, and is a key input\
    \ to stability analyzes as part of the plasma beta $\\beta = 2\\mu_0 p / B^2$."
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_pressure
  - name:ion_temperature
  sources:
  - id: dd:core_profiles/profiles_1d/pressure_ion_total
    dd_path: core_profiles/profiles_1d/pressure_ion_total
    status: composed
  - id: dd:edge_profiles/profiles_1d/ion/pressure
    dd_path: edge_profiles/profiles_1d/ion/pressure
