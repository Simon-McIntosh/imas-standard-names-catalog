name: total_ion_radiated_power_inside_flux_surface
status: draft
description: Sum over all ion species of the volume-integrated radiated power from
  the region enclosed by a given flux surface.
documentation: "The total ion radiated power inside a flux surface, $P_{\\mathrm{rad,ion,tot}}(\\\
  psi)$, is defined as $$P_{\\mathrm{rad,ion,tot}}(\\psi) = \\sum_s \\int_{V(\\psi)}\
  \ \\epsilon_s(\\mathbf{r})\\, dV,$$ where the summation runs over all ion species\
  \ $s$ and $\\epsilon_s$ (W m$^{-3}$) is the emissivity of species $s$ including\
  \ line, recombination, and bremsstrahlung contributions. This aggregate profile\
  \ is the ion-channel complement of `electron_radiated_power_inside_flux_surface`\
  \ and, when evaluated at the LCFS, recovers `ion_radiated_power_inside_last_closed_flux_surface`.\
  \ In high-performance H-mode plasmas, total ion radiation inside the separatrix\
  \ can reach 5\u201330 MW for ITER-class machines, dominated by tungsten and mid-$Z$\
  \ impurities. The radial derivative of $P_{\\mathrm{rad,ion,tot}}(\\psi)$ with respect\
  \ to volume yields the local total ion emissivity. The quantity is typically obtained\
  \ from bolometric tomography or from summing individual ion species contributions\
  \ computed by impurity-transport codes. See also `ion_radiated_power_inside_flux_surface`\
  \ for the per-species breakdown."
