- name: upper_triangularity_of_plasma_boundary
  kind: scalar
  status: active
  description: Upper triangularity is a dimensionless shape parameter measuring the
    inward radial displacement of the upper plasma-boundary extremum from the geometric
    center, normalized by the plasma minor radius.
  documentation: 'Upper triangularity $\delta_U$ quantifies triangular shaping of
    the upper half of the plasma boundary in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It measures the
    inward displacement of the boundary point at maximum $Z$ relative to the geometric
    center, normalized by the plasma minor radius.


    The upper triangularity is defined as:


    $$

    \delta_U = \frac{R_{\rm geo} - R_U}{a}

    $$


    where $R_U$ is the major radius at the uppermost boundary point, $R_{\rm geo}
    = (R_{\rm max} + R_{\rm min})/2$ is the major radius of the geometric center,
    and $a = (R_{\rm max} - R_{\rm min})/2$ is the plasma minor radius.


    This directional component contributes to [triangularity of plasma boundary](name:triangularity_of_plasma_boundary),
    whose average combines the upper and [lower triangularity of plasma boundary](name:lower_triangularity_of_plasma_boundary).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:triangularity_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: upper
    operator_kind: qualifier
  sources:
