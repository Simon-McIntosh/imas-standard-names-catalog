- name: accumulated_particle_count_at_pellet_path_due_to_pellet_injection
  kind: scalar
  status: active
  description: Cumulative number of particles released by ablation from an injected
    pellet up to a specified position along its trajectory.
  documentation: 'This quantity is the cumulative particle release from pellet ablation
    as the pellet travels through the plasma. It counts particles removed from the
    pellet up to the specified trajectory position, rather than particles remaining
    in the pellet.


    The accumulated release at path distance $\ell$ is defined by


    $$

    N_{\mathrm{abl}}(\ell)=\int_{\ell_0}^{\ell}\frac{dN_{\mathrm{abl}}}{d\ell''}\,d\ell''

    $$


    where $N_{\mathrm{abl}}$ is the dimensionless released-particle count, $\ell$
    and $\ell''$ are distances along the pellet trajectory in m, $\ell_0$ is the trajectory
    entry position, and $dN_{\mathrm{abl}}/d\ell''$ is the local ablation release
    per unit path distance.


    The count is nondecreasing along the trajectory when the ablation release rate
    is nonnegative. It represents deposited pellet material and is distinct from the
    initial pellet inventory given by [count of pellet](name:count_of_pellet).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_of_pellet
  sources:
  - dd_path: pellets/time_slice/pellet/path_profiles/ablated_particles
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pellets.html#pellets-time_slice-pellet-path_profiles-ablated_particles
    dd_documentation:
      leaf: 'Number of ablated particles (electrons) along the pellet path '
