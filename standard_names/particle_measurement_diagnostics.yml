        exhaust.
      kind: llm
- name: krypton_density
  kind: scalar
  status: active
  description: Number density of krypton ions at a point in the plasma, summed over
    all ionized charge states from Kr1+ through fully stripped Kr36+ and excluding
    neutral krypton atoms.
  documentation: 'Number density of krypton ions at a point in the plasma, summed
    over all ionized charge states from Kr$^{1+}$ through fully stripped Kr$^{36+}$;
    neutral krypton atoms are excluded.


    With krypton atomic number $Z_\mathrm{Kr}=36$, the ion density is the charge-state
    sum:


    $$

    n_\mathrm{Kr} = \sum_{q=1}^{36} n_\mathrm{Kr}^{(q)}

    $$


    where $n_\mathrm{Kr}^{(q)}$ is the number density of krypton ions in charge state
    $q$ and the neutral state $q=0$ is omitted from the sum.


    This is an extensive, charge-state-summed species density, not a density-weighted
    mean over charge states and not the charge-state-resolved [ion charge-state density](name:ion_charge_state_density),
    which retains the individual $n_\mathrm{Kr}^{(q)}$ terms. It is an absolute density,
    distinct from the relative [krypton fraction](name:ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density)
    normalized to the electron density. The locus-specific values [krypton_density_at_magnetic_axis](name:krypton_density_at_magnetic_axis),
    krypton_density_at_pedestal, and [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target)
    share this ions-only charge-state scope. In contrast, [volume_averaged_krypton_density](name:volume_averaged_krypton_density)
    includes all krypton charge states from neutral through fully stripped, so its
    charge-state scope differs from this ions-only local quantity; the [line_averaged_krypton_density](name:line_averaged_krypton_density)
    likewise carries its own averaging definition.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_charge_state_density
  - name:ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density
  - name:krypton_density_at_magnetic_axis
  - name:krypton_density_at_divertor_target
  - name:volume_averaged_krypton_density
  - name:line_averaged_krypton_density
- name: line_averaged_beryllium_density
  kind: scalar
  status: active
  description: Chord-average of the beryllium ion number density along a diagnostic
    line of sight, equal to the path integral of the local beryllium density divided
    by the chord length.
  documentation: 'The line-averaged beryllium ion number density quantifies the mean
    beryllium ion content along a plasma diagnostic chord, normalized by chord length.
    It is the chord-integrated analog of the local [beryllium_density](name:beryllium_density)
    and is the most directly accessible measure of beryllium impurity concentration
    from line-of-sight diagnostics.


    The quantity is defined as:


    $$

    \bar{n}_{Be} = \frac{1}{L} \int_0^L n_{Be}(l) \, dl

    $$


    where $n_{Be}(l)$ is the local beryllium ion number density at path coordinate
    $l$ along the chord and $L$ is the total chord length.


    Inferred from passive spectroscopy of beryllium emission lines by inverting chord-integrated
    emission intensities using atomic emissivity coefficients; the result aggregates
    contributions from all beryllium ionization states present along the chord. The
    [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density) provides
    a complementary global volume average, while [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    gives the local on-axis value.


    Sign convention: Positive when beryllium ions populate the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:beryllium_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_magnetic_axis
  arguments:
  - name: beryllium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
