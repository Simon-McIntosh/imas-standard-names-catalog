- name: safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  kind: scalar
  status: active
  description: "Safety factor at normalized poloidal magnetic flux equal to 0.95;\
    \ it is the toroidal-to-poloidal magnetic-flux increment ratio on that closed\
    \ flux surface and gives the number of toroidal turns in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame per poloidal turn."
  documentation: 'The safety factor at normalized poloidal magnetic flux equal to
    0.95 is the value of the [safety factor](name:safety_factor) on the closed magnetic
    flux surface where the normalized poloidal magnetic-flux label $\psi_N$ equals
    $0.95$. It characterizes magnetic-field-line winding: the number of toroidal turns
    in the right-handed cylindrical $(R, \phi, Z)$ frame per complete poloidal turn
    on that surface.


    The value is defined by evaluating the safety-factor function at the specified
    normalized poloidal magnetic-flux label:


    $$

    q_{95} = q(\psi_N = 0.95)

    $$


    where $q(\psi_N)$ is the safety-factor function, $\psi_N$ equals $0$ at the magnetic
    axis and $1$ at the plasma boundary, and the underlying safety factor is the flux-surface
    derivative $d\Phi_{\mathrm{tor}}/d(\Phi_{\mathrm{pol}}/2\pi)$ across neighboring
    nested flux surfaces. Here $\Phi_{\mathrm{tor}}$ and $\Phi_{\mathrm{pol}}$ are
    respectively toroidal and poloidal magnetic fluxes expressed in webers.


    This is a fixed-flux-label value near the edge of the closed-flux-surface region.
    It is distinct from the boundary value [safety_factor_at_plasma_boundary](name:safety_factor_at_plasma_boundary),
    from locus-defined values such as [safety_factor_at_pedestal_top](name:safety_factor_at_pedestal_top),
    and from extrema of the function such as [minimum_safety_factor](name:minimum_safety_factor);
    it is not a local magnetic pitch angle or a local field-direction component.


    Sign convention: Positive when the toroidal magnetic-field direction and the toroidal
    plasma-current direction are parallel in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:safety_factor_at_plasma_boundary
  arguments:
  - name: safety_factor
    operator: normalized_poloidal_magnetic_flux
    operator_kind: locus
  sources:
