- name: x2_coordinate_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Signed coordinate along the X2 axis of a vertex on the soft X-ray detector
    boundary in the detector-local Cartesian (X1, X2) frame. Together with the X1
    coordinate, it defines the detector boundary used for line-of-sight acceptance
    and etendue calculations, distinct from any diagnostic aperture.
  documentation: 'The $x_2$ coordinate of a soft X-ray detector is the signed in-plane
    position of a point on the detector boundary in the detector-local Cartesian $(X_1,
    X_2)$ frame with orthonormal basis $(\hat{\mathbf{X}}_1, \hat{\mathbf{X}}_2)$.
    Together with the [soft-X-ray detector $x_1$ coordinate](name:x1_coordinate_of_soft_xray_detector),
    it specifies the detector boundary; this detector surface is distinct from the
    diagnostic aperture boundary described, for example, by the [diagnostic-aperture
    $x_2$ coordinate](name:x2_coordinate_of_diagnostic_aperture).


    The coordinate is the scalar projection of the detector-boundary point relative
    to the detector-local origin onto the local $X_2$ direction:


    $$

    x_2 = (\mathbf{r}_d - \mathbf{r}_{d,0}) \cdot \hat{\mathbf{X}}_2

    $$


    where $\mathbf{r}_d$ is the detector-boundary point position vector in m, $\mathbf{r}_{d,0}$
    is the detector-local origin position vector in m, and $\hat{\mathbf{X}}_2$ is
    a dimensionless unit vector.


    Detector boundary coordinates are obtained from mechanical design, survey metrology,
    CAD models, or alignment calibration of the diagnostic head. In ray tracing and
    etendue calculations, the detector boundary defines the detector integration surface
    $A_d$, while the diagnostic aperture defines a separate aperture integration surface
    $A_a$; a common geometric etendue relation is $G = \int_{A_d}\int_{A_a} \cos\alpha_d\cos\alpha_a\,
    |\mathbf{r}_d-\mathbf{r}_a|^{-2}\, dA_d\, dA_a$, where $\mathbf{r}_d$ and $\mathbf{r}_a$
    are detector and aperture surface-point position vectors in m, $dA_d$ and $dA_a$
    are differential surface elements in m^2, and the cosine factors are dimensionless
    projections onto the two surface normals.


    Typical signed coordinate values are about -0.01-0.01 m for compact diode or chip-scale
    soft X-ray detector elements and can extend to about -0.05-0.05 m for larger detector
    assemblies, depending on the chosen detector-local origin.


    Sign convention: Positive when the detector-boundary point is displaced in the
    $+\hat{\mathbf{X}}_2$ direction of the detector-local Cartesian $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
