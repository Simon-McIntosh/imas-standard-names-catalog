- name: rate_of_neutron_detector
  kind: scalar
  status: active
  description: Temporal rate of accepted detection events in a counting process, distinct
    from incident particle flux, detection efficiency, and total source emission.
  documentation: 'An event rate is the temporal frequency of accepted discrete events
    in a defined counting process. For the detector family represented here, the events
    are registered neutron-induced detection events; [neutron rate of a neutron detector](name:neutron_rate_of_neutron_detector)
    is a concrete instance.


    The rate is defined by


    $$

    r = \frac{dN}{dt}

    $$


    where $N$ is the cumulative number of accepted events and $t$ is elapsed time.


    This quantity counts accepted registered events, not the incident particle flux,
    the probability of detection, or the total number of particles emitted by the
    source. The corresponding incident neutron flux is a surface-crossing rate density,
    while [efficiency of a neutron detector](name:efficiency_of_neutron_detector)
    describes the probability that an incident neutron produces a registered event.'
  unit: s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_rate_of_neutron_detector
  - name:efficiency_of_neutron_detector
- name: neutron_rate_of_neutron_detector
  kind: scalar
  status: active
  description: Neutron rate of a neutron detector is the rate of accepted neutron-induced
    detection events registered by the detector, distinct from incident neutron flux,
    detector efficiency, and total neutron source emission.
  documentation: 'Neutron rate of a neutron detector is the time rate of individually
    accepted neutron-induced detection events registered by that detector.


    It is defined from the cumulative accepted neutron-event count:


    $$

    R_n(t) = \frac{dN_\mathrm{det}(t)}{dt}

    $$


    where $R_n(t)$ is the neutron detection rate and $N_\mathrm{det}(t)$ is the cumulative
    number of accepted neutron-induced detector events up to time $t$.


    This quantity is a detector response count rate. It excludes non-neutron events
    and is distinct from the incident [neutron flux of a neutron detector](name:neutron_flux_of_neutron_detector),
    the [efficiency of a neutron detector](name:efficiency_of_neutron_detector), and
    the total neutron emission rate of the source.'
  unit: s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:rate_of_neutron_detector
  - name:efficiency_of_neutron_detector
  arguments:
  - name: rate_of_neutron_detector
    operator: neutron
    operator_kind: qualifier
  sources:
