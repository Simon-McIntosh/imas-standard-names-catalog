- name: neutral_species_atomic_mass
  kind: scalar
  status: active
  description: Mass parameter assigned to a specified neutral particle species, encoding
    its isotope or constituent composition for inertial and transport calculations.
  documentation: 'Atomic mass is the intrinsic mass parameter assigned to one specified
    neutral particle species. It identifies an isotope for an atomic neutral or the
    constituent composition for a molecular or compound neutral, and provides the
    inertial scale used in collisional and transport physics.


    The mass is represented relative to the atomic mass unit by


    $$

    m_s = A_s m_u

    $$


    where $m_s$ is the atomic mass of the specified neutral species, $A_s$ is its
    relative atomic mass, and $m_u$ is the atomic mass unit.


    The scope is one neutral species definition at a time. For an atomic neutral,
    the definition identifies its isotope; for a molecular or compound neutral, it
    includes the masses of its constituents. No aggregation over separate species
    or plasma populations is implied, and this quantity is not a number density, particle
    count, or aggregate plasma mass.


    This neutral-specific quantity is an instance of the broader [atomic mass](name:atomic_mass)
    concept. The corresponding [ion atomic mass](name:ion_atomic_mass) applies the
    same mass definition to an ion species rather than a neutral particle species.'
  unit: u
  physics_domain: transport
