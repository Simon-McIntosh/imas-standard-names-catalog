- name: toroidal_beta
  kind: scalar
  status: active
  description: Toroidal beta is a dimensionless measure of total plasma pressure relative
    to the magnetic-pressure scale associated with a toroidal magnetic-field reference,
    with the pressure aggregate taken as the confined-volume average of total perpendicular
    pressure.
  documentation: 'Toroidal beta is a dimensionless equilibrium measure of the total
    pressure content of the confined plasma relative to the magnetic-pressure scale
    associated with a toroidal magnetic-field reference. It characterizes pressure
    relative to the toroidal field, with the pressure aggregate taken as the confined-volume
    average of total perpendicular plasma pressure.


    The toroidal specialization relation is


    $$

    \beta_{\mathrm{tor}} = \frac{2\mu_0\,\langle p_{\perp,\mathrm{plasma}}\rangle_V}{B_{\mathrm{tor,ref}}^2}

    $$


    where $\beta_{\mathrm{tor}}$ is toroidal beta, $\mu_0$ is the vacuum permeability,
    $\langle\cdot\rangle_V$ denotes averaging over the confined plasma volume $V$,
    $p_{\perp,\mathrm{plasma}}$ is the total plasma pressure perpendicular to the
    local magnetic-field direction, and $B_{\mathrm{tor,ref}}$ is the reference magnitude
    of the toroidal magnetic field associated with the toroidal direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The scope is the confined plasma in an equilibrium state. Its aggregation convention
    is fixed for this name: total perpendicular plasma pressure is summed over the
    plasma populations included in the equilibrium pressure and averaged over the
    confined plasma volume. This excludes local beta values, species-resolved beta
    values, beta definitions based on poloidal or total magnetic-field pressure scales,
    and beta definitions with an additional normalization.


    Toroidal beta specializes [plasma beta](name:plasma_beta) by choosing the confined-volume
    averaged total perpendicular plasma pressure and a toroidal magnetic-field reference,
    with no additional normalization beyond the pressure-to-magnetic-pressure ratio.
    [Normalized toroidal plasma beta](name:normalized_toroidal_plasma_beta) uses the
    same toroidal-field beta basis and applies an additional normalization, whereas
    [poloidal beta](name:poloidal_beta) instead uses a poloidal magnetic-pressure
    scale generated by the plasma current.'
  unit: '1'
  physics_domain: general
  links:
  - name:poloidal_beta
  sources:
  - dd_path: summary/global_quantities/beta_tor_mhd/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-beta_tor_mhd-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/beta_tor_mhd
      parent: Toroidal beta, using the pressure determined by an equilibrium reconstruction
        code
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Toroidal beta, using the pressure determined by an equilibrium
        reconstruction code.
      kind: template
