- name: mhd_energy
  kind: scalar
  status: active
  description: Global plasma stored energy obtained from the volume integral of total
    kinetic pressure, including thermal and fast-particle pressure contributions.
  documentation: 'MHD plasma stored energy is the global energy content assigned to
    the plasma by integrating its equilibrium-reconstructed total kinetic pressure
    over the full plasma volume. It includes thermal and fast-particle contributions
    rather than representing only one pressure population.


    The defining relation is


    $$

    W_{\mathrm{MHD}} = \frac{3}{2}\int_{V_{\mathrm{plasma}}} p_{\mathrm{tot}}\,dV

    $$


    where $W_{\mathrm{MHD}}$ is the MHD plasma stored energy, $p_{\mathrm{tot}}$ is
    the total kinetic pressure determined by the equilibrium reconstruction, $V_{\mathrm{plasma}}$
    is the complete plasma volume, and $dV$ is the differential volume element.


    This is a global volume-integrated quantity over all included plasma populations.
    It is distinct from [thermal plasma energy](name:thermal_plasma_energy), which
    integrates thermal pressure only, and from [diamagnetic energy](name:diamagnetic_energy),
    which is restricted to pressure perpendicular to the local magnetic field. The
    factor $3/2$ defines the stored-energy convention used for the total kinetic-pressure
    integral.'
  unit: J
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/energy_mhd
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-energy_mhd
    dd_documentation:
      leaf: Plasma energy content = 3/2 * int(p,dV) with p being the total pressure
        (thermal + fast particles) [J]. Time-dependent; Scalar
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: J
    enhanced_context:
      description: MHD plasma stored energy (W_MHD), defined as 3/2 times the volume
        integral of total pressure including thermal and fast particle contributions.
        A primary global confinement performance metric.
      kind: llm
