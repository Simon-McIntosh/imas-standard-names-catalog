name: poloidal_angle_of_gyrokinetic_eigenmode
status: draft
cocos_transformation_type: one_like
description: Poloidal angle coordinate along the field line at which a gyrokinetic
  eigenmode structure is evaluated.
documentation: 'The poloidal angle array $\theta$ for a gyrokinetic eigenmode records
  the field-line-following positions at which the eigenfunction (perturbed potential,
  vector potential, distribution moments) is resolved. The angle convention follows
  the flux-tube grid: $\theta$ is defined relative to the geometric center $(R_0,
  Z_0)$ with $R_0 = (R_{\max} + R_{\min})/2$ and $Z_0 = (Z_{\max} + Z_{\min})/2$,
  increases clockwise so that $(r, \theta, \phi)$ is right-handed, and has $\theta
  = 0$ at the outboard midplane. For ballooning-type modes, the eigenfunction may
  extend over several $2\pi$ periods to capture the parallel envelope; the grid spacing
  determines the parallel resolution of fine-scale structures near rational surfaces.
  This coordinate is dimensionless (radians, unit 1) and is output by linear gyrokinetic
  eigenvalue solvers. See also the nonlinear flux-tube poloidal angle grid.'
