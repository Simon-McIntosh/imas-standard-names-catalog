    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-field_map-a_field_z-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
      parent_path: tf/field_map/a_field_z
