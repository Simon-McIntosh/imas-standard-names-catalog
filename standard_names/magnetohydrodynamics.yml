- name: toroidal_halo_current
  kind: scalar
  status: draft
  description: Toroidal halo current is the toroidal component, in the right-handed
    cylindrical (R, phi, Z) frame, of the integrated halo-plasma current on open magnetic
    field lines between the last closed flux surface and the first wall during a disruption
    or vertical displacement event.
  documentation: 'Toroidal halo current is the net toroidal component of electric
    current carried by halo plasma on open magnetic field lines outside the last closed
    flux surface and inside the first wall during disruptions and vertical displacement
    events. It is the part of the total [halo current](name:halo_current) aligned
    with the toroidal direction $\hat{\phi}$ of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    For a poloidal cross-section at fixed toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, the integrated toroidal component can be defined
    by the current-density flux through the halo portion of a surface whose area vector
    points in the toroidal direction:


    $$

    I_{\mathrm{halo,tor}} = \int_{S_{\mathrm{halo}}} \mathbf{J} \cdot d\mathbf{A}_{\phi}

    $$


    where $S_{\mathrm{halo}}$ is the open-field-line halo region on the cut, $\mathbf{J}$
    is the current density, and $d\mathbf{A}_{\phi}=\hat{\phi}\,dA$ is the oriented
    area element normal to the toroidal direction. The result is measured in amperes
    because $\mathbf{J}$ has units A m$^{-2}$ and $dA$ has units m$^{2}$.


    In practice, this quantity is inferred from halo-current sensors, wall-current
    measurements, and magnetic reconstruction of the current path, or computed by
    integrating the toroidal current density over the open-field-line region in disruption
    modeling. It complements [poloidal halo current](name:poloidal_halo_current);
    electromagnetic loads are governed by $\mathbf{J}\times\mathbf{B}$, and order-of-magnitude
    forces scale as $I_{\mathrm{halo,tor}} B_{\mathrm{pol}} L$, which is in newtons
    when current is in A, magnetic field is in T, and effective length $L$ is in m.


    Typical peak magnitudes are about $10^4$-$10^5$ A in medium-sized tokamaks and
    can approach $10^6$ A in large disruptions; normalized to pre-disruption plasma
    current, values of roughly 5-30% are commonly used for load assessment. The dominant
    halo-current pulse during a current quench or vertical displacement event typically
    lasts about 1-100 ms, with faster pulses in smaller devices and slower decay in
    highly conducting structures.


    Sign convention: Positive when the integrated halo-plasma current flows in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, counter-clockwise when viewed from above $+\hat{Z}$.'
  unit: A
  physics_domain: magnetohydrodynamics
  links:
  - name:halo_current
  - name:poloidal_halo_current
  arguments:
  - name: halo_current
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:disruption/global_quantities/current_halo_phi
    dd_path: disruption/global_quantities/current_halo_phi
    status: attached
  - id: dd:disruption/global_quantities/current_halo_tor
    dd_path: disruption/global_quantities/current_halo_tor
    status: attached
- name: toroidal_impurity_ion_velocity_at_measurement_position
  kind: scalar
  status: draft
  description: Toroidal component of the impurity-ion fluid velocity at a specified
    measurement position in the right-handed cylindrical (R, phi, Z) frame. For a
    non-state-resolved impurity quantity, it is the charge-state-density-weighted
    mean over impurity ion charge states present at that position.
  documentation: 'Toroidal impurity ion velocity at a measurement position is the
    projection of the local impurity-ion fluid velocity onto the toroidal basis direction
    $\hat{\phi}$ of the right-handed cylindrical $(R, \phi, Z)$ frame. Here $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. When the impurity
    velocity is not resolved by charge state, this quantity is the charge-state-density-weighted
    mean over impurity ion charge states present at that position, rather than the
    velocity of one selected charge state.


    The charge-state-averaged toroidal component at measurement position $\mathbf{x}_m=(R_m,\phi_m,Z_m)$
    is defined by:


    $$

    v_{\phi,\mathrm{imp}}(\mathbf{x}_m) = \frac{\sum_q n_q(\mathbf{x}_m)\,\mathbf{v}_q(\mathbf{x}_m)\cdot\hat{\phi}}{\sum_q
    n_q(\mathbf{x}_m)}

    $$


    where $\mathbf{x}_m$ gives the measurement position in the right-handed cylindrical
    $(R, \phi, Z)$ frame, with $R_m$ and $Z_m$ in meters and $\phi_m$ in radians;
    $v_{\phi,\mathrm{imp}}$ is in $\mathrm{m\,s^{-1}}$; $q$ labels impurity ion charge
    states; $n_q$ is the local charge-state number density in $\mathrm{m^{-3}}$; and
    $\mathbf{v}_q$ is the fluid velocity of charge state $q$ in $\mathrm{m\,s^{-1}}$.
    The denominator must be nonzero for the averaged velocity to be defined.


    In practice, the local toroidal impurity velocity is inferred from Doppler shifts
    of impurity radiation, charge-exchange measurements, or evaluated from plasma-flow
    models at the specified measurement position. Spectroscopic signals can be emissivity-weighted
    or dominated by a particular emitting charge state, so such estimates should be
    converted or interpreted consistently with the density-weighted charge-state mean
    when this non-state-resolved quantity is used.


    Typical magnitudes in magnetically confined plasmas are $10^3$-$10^5$ m.s^-1.
    Values near zero are common in weakly rotating conditions, while strong auxiliary
    momentum input can produce larger magnitudes.


    Sign convention: Positive when the charge-state-averaged impurity ion flow is
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_ion_state_velocity
  - name:toroidal_ion_velocity
  - name:toroidal_ion_rotation_frequency
