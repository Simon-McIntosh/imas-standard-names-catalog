- name: wave_electric_field
  kind: vector
  status: draft
  description: Complex vector phasor of the electric field of an electromagnetic wave
    propagating in a magnetized plasma. It encodes the local field amplitude, phase,
    and polarization state from which the real time-dependent electric field is recovered.
  documentation: 'The wave electric field $\mathbf{E}_w$ is the complex vector phasor
    representing the electric oscillation of an electromagnetic wave in a magnetized
    plasma. It contains the relative amplitudes and phases of the vector components,
    so it determines whether the wave is linearly, elliptically, or circularly polarized
    and how much field is parallel or perpendicular to the background magnetic field.


    Using the negative-time-harmonic phasor convention, in which the physical field
    is obtained by multiplying the phasor by $\exp(-i\omega t)$ and taking the real
    part, a homogeneous cold-plasma normal mode satisfies:


    $$

    \left[n^2\left(\hat{\mathbf{k}}\hat{\mathbf{k}}-\mathbf{I}\right)+\boldsymbol{\epsilon}(\omega,\mathbf{B}_0)\right]\cdot\mathbf{E}_w=\mathbf{0}

    $$


    where $\mathbf{E}_w$ has units V m^-1, $n=c|\mathbf{k}|/\omega$ is the dimensionless
    [refractive index](name:refractive_index), $c$ is the speed of light in vacuum
    in m s^-1, $\mathbf{k}=|\mathbf{k}|\hat{\mathbf{k}}$ is the wave vector in m^-1,
    $\omega$ is the angular frequency in rad s^-1, $\mathbf{I}$ is the identity tensor,
    $\boldsymbol{\epsilon}$ is the dimensionless plasma dielectric tensor, and $\mathbf{B}_0$
    is the background magnetic field in T. Nonzero solutions determine the allowed
    dispersion and polarization.


    Components of $\mathbf{E}_w$ must be interpreted with the basis used for the vector.
    In a right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis the components
    are projections on $\hat{x}$, $\hat{y}$, and $\hat{z}$; in a right-handed field-aligned
    $(\hat{e}_1, \hat{e}_2, \hat{b}_0)$ basis, where $\hat{b}_0=\mathbf{B}_0/|\mathbf{B}_0|$
    and $\hat{e}_1\times\hat{e}_2=\hat{b}_0$, the parallel projection gives the complex
    quantity whose parts are represented by [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).
    The transverse projections may be combined as $E_\pm=(\mathbf{E}_w\cdot\hat{e}_1\pm
    i\mathbf{E}_w\cdot\hat{e}_2)/\sqrt{2}$; these circular components are related
    to [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude)
    and [right_hand_circularly_polarized_wave_electric_field](name:right_hand_circularly_polarized_wave_electric_field).


    Wave electric fields are usually computed from antenna launching models, cold-
    or hot-plasma full-wave calculations, ray tracing with polarization evolution,
    or local dispersion calculations normalized to launched power. Measurements infer
    them indirectly from calibrated edge probes, microwave polarimetry, reflectometry,
    scattering, or absorbed-power and current-drive constraints; phase and polarization
    are often determined more robustly than absolute local amplitude.


    Typical phasor magnitudes are strongly power-normalization dependent. Weak probing
    waves can be 10^-1-10^2 V m^-1, while RF and microwave heating or current-drive
    fields are often 10^3-10^5 V m^-1 for local power fluxes of about 0.01-10 MW m^-2;
    evanescent layers, resonances, and near-antenna regions can fall outside these
    ranges.


    Sign convention: Positive when a real component of $\mathbf{E}_w$ points along
    the corresponding positive basis vector, such as $+\hat{x}$, $+\hat{y}$, or $+\hat{z}$
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electric_field
  - name:parallel_wave_electric_field_real_part
  - name:parallel_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:perpendicular_refractive_index
  - name:parallel_refractive_index
  arguments:
  - name: electric_field
    operator: wave
    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Complex phasor of the left-hand circularly polarized component of the
    wave electric field along a beam-tracing path. It is the E+ projection in the
    local transverse basis (x, y, b), with x cross y in the b direction and b parallel
    to the local background magnetic field.
  documentation: 'The left-hand circularly polarized wave electric field, $E_+$, is
    the complex phasor obtained by projecting the transverse wave electric-field vector
    onto the circular polarization that follows positive-ion gyration about the local
    background magnetic field. It represents the rotating electric-field component
    relevant for ion-cyclotron resonant coupling, while actual damping and species
    heating also depend on resonance location, wave frequency, composition, and the
    plasma dielectric response.


    In the local orthonormal triad $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$,
    $\hat{x}\perp\hat{b}$, $\hat{y}\perp\hat{b}$, and $\hat{x}\times\hat{y}=\hat{b}$,
    the phasor is defined by


    $$

    E_+ = \frac{E_x + iE_y}{\sqrt{2}}

    $$


    where $E_x$ and $E_y$ are the complex phasor components of the transverse wave
    electric field along $\hat{x}$ and $\hat{y}$, $i$ is the imaginary unit, and $E_+$,
    $E_x$, and $E_y$ have unit $\mathrm{V\,m^{-1}}$. The physical time-dependent field
    is recovered with the convention $\operatorname{Re}[(E_x\hat{x}+E_y\hat{y})\exp(-i\omega
    t)]$, where $\omega$ is the wave angular frequency. With the complementary right-hand
    component $E_-=(E_x-iE_y)/\sqrt{2}$, the transverse phasor is reconstructed as
    $E_x=(E_+ + E_-)/\sqrt{2}$ and $E_y=-i(E_+ - E_-)/\sqrt{2}$; the real and imaginary
    quadratures are [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    and [left_hand_circularly_polarized_wave_electric_field_imaginary_part](name:left_hand_circularly_polarized_wave_electric_field_imaginary_part),
    and the envelope is [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude).


    Along a beam-tracing ray, $E_+$ is computed by solving the wave propagation equations
    using the cold- or warm-plasma dielectric response, expressing the resulting [wave_electric_field](name:wave_electric_field)
    in the local basis $(\hat{x}, \hat{y}, \hat{b})$, and applying the circular-polarization
    projection. It is usually a derived complex quantity rather than a directly measured
    observable; boundary conditions may come from antenna, launcher, or polarization-sensitive
    diagnostic information.


    Typical magnitudes depend strongly on launched power, focusing, absorption, and
    normalization, but values of about $10^1$-$10^5\ \mathrm{V\,m^{-1}}$ are common
    in radio-frequency wave-heating calculations. The ratio $|E_+|/|E_-|$ and the
    relative phase between the two circular components characterize the polarization
    ellipticity and influence resonant absorption, but they do not by themselves determine
    preferential ion-species heating.


    Sign convention: Positive when the real amplitude of a purely left-hand, zero-phase
    phasor makes the physical electric field point along $+\hat{x}$ at $t=0$ and rotate
    from $+\hat{x}$ toward $-\hat{y}$ about $+\hat{b}$ in the local orthonormal basis
    $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{x}\times\hat{y}=\hat{b}$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:left_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
- name: toroidal_wave_electric_field
  kind: scalar
  status: draft
  description: Signed toroidal component of the wave electric field at a point, equal
    to the projection of the local wave electric-field vector onto the toroidal unit
    direction in the right-handed cylindrical (R, phi, Z) frame. Its unit m^-1.V is
    equivalent to volts per meter.
  documentation: 'Toroidal wave electric field is the component of an oscillatory
    electric field along the toroidal direction. It describes the signed projection
    of the local wave electric-field vector onto $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The component is defined by projecting the wave electric-field vector onto the
    toroidal unit vector:


    $$

    E_\phi(\mathbf{x}, t) = \mathbf{E}_\mathrm{wave}(\mathbf{x}, t) \cdot \hat{\phi}

    $$


    where $\mathbf{E}_\mathrm{wave}$ is the local wave electric field and $\hat{\phi}$
    points in the direction of increasing toroidal angle. For harmonic waves the same
    projection applies to a phase-referenced phasor or amplitude; the physical dimension
    is volts per meter, written here as m^-1.V.


    In practice this quantity may be obtained from electromagnetic-wave modeling,
    probe measurements where available, or spectroscopic inference of wave-induced
    Stark effects. In polarization-resolved spectroscopy, fits to line positions,
    widths, intensities, and polarization-dependent Stark components can constrain
    the local oscillatory electric-field vector, which is then projected onto $\hat{\phi}$
    using the viewing geometry and magnetic-field geometry.


    Typical radio-frequency or lower-hybrid wave-field amplitudes range from about
    10^2-10^5 m^-1.V in plasma-facing or edge regions, with locally stronger fields
    near launch structures sometimes approaching 10^6 m^-1.V and weaker fields in
    poorly coupled or far-field regions falling below 10^2 m^-1.V.


    Sign convention: Positive when the real toroidal component of the wave electric
    field points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_electric_field
  - name:vertical_wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
