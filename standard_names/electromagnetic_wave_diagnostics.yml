- name: normalized_toroidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: active
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at a measurement position to identify its corresponding
    nested flux surface.
  documentation: 'The normalized toroidal flux coordinate at a measurement position
    is the dimensionless radial label assigned to the nested flux surface passing
    through that position. It is the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    evaluated at the measurement position, with the origin at the magnetic axis and
    the outer normalization reference at the plasma boundary or last closed flux surface.


    The coordinate is defined from the toroidal flux of the flux surface passing through
    the measurement position:


    $$

    \rho_{\mathrm{tor,norm}}(\mathbf{x}_{\mathrm{meas}}) = \sqrt{\frac{\Phi(\mathbf{x}_{\mathrm{meas}})
    - \Phi_0}{\Phi_b - \Phi_0}}

    $$


    where $\mathbf{x}_{\mathrm{meas}}$ identifies the measurement position, $\Phi(\mathbf{x}_{\mathrm{meas}})$
    is the toroidal magnetic flux of the corresponding flux surface, $\Phi_0$ is the
    magnetic-axis toroidal magnetic flux, and $\Phi_b$ is the boundary toroidal magnetic
    flux. The square root gives a nonnegative radial coordinate that runs from zero
    at the magnetic axis toward unity at the boundary.


    This quantity is a flux-surface coordinate evaluated at a measurement position,
    not a measurement signal or a toroidal-flux value. It is distinct from the [normalized
    toroidal flux coordinate at the magnetic axis](name:normalized_toroidal_flux_coordinate_at_magnetic_axis),
    which is exactly zero by definition.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
  sources:
  - dd_path: ece/t_radiation_central_x/rho_tor_norm
