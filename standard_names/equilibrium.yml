- name: toroidal_total_plasma_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the total plasma current density vector on the
    poloidal cross-section.
  documentation: "The toroidal total plasma current density $j_{\\phi}^{\\mathrm{plasma}}\
    \ = \\mathbf{j}_{\\mathrm{total}} \\cdot \\hat{\\phi}$ is the projection of the\
    \ total plasma current density vector onto the geometric toroidal direction $\\\
    hat{\\phi}$ in the IMAS cylindrical $(R, \\phi, Z)$ frame. It represents the local\
    \ net current density carried by all plasma species (electrons and ions) in the\
    \ toroidal direction, encompassing ohmic, bootstrap, and auxiliary current drive\
    \ contributions. This quantity is defined on the poloidal grid and is reconstructed\
    \ from equilibrium codes constrained by magnetic measurements (e.g., motional\
    \ Stark effect, polarimetry) and kinetic profile data. Typical values in the plasma\
    \ core range from 0.1 to 1 MA/m\xB2 for medium-size tokamaks, peaking on-axis\
    \ and decreasing toward the edge. The radial integral of $j_{\\phi}^{\\mathrm{plasma}}$\
    \ over the poloidal cross-section yields the total plasma current $I_p$. See also\
    \ the [radial_total_plasma_current_density](name:radial_total_plasma_current_density)\
    \ and [parallel_total_plasma_current_density](name:parallel_total_plasma_current_density)\
    \ components, as well as the parent vector quantity [total_plasma_current_density](name:total_plasma_current_density).\n\
    \nSign convention: Positive when $j_{\\phi}$ flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above the device)."
  unit: A.m^-2
  physics_domain: equilibrium
  links:
