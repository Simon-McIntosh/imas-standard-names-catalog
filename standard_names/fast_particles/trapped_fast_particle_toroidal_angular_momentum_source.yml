name: trapped_fast_particle_toroidal_angular_momentum_source
status: draft
description: Source rate of toroidal angular momentum density contributed by the trapped
  fast-particle population on a given flux surface.
documentation: "The trapped fast-particle toroidal angular momentum source $S_{L_\\\
  phi}^{\\mathrm{trapped}}$ represents the rate of change of toroidal angular momentum\
  \ density ($\\mathrm{N\\,m^{-2}}$) injected into or removed from the trapped fraction\
  \ of supra-thermal particles. Trapped particles follow banana orbits with turning\
  \ points set by the mirror ratio $B_{\\max}/B_{\\min}$ on a flux surface, and their\
  \ finite orbit width produces a distinct torque pattern compared to passing populations.\
  \ This quantity is computed by fast-ion Fokker\u2013Planck codes (e.g., NUBEAM,\
  \ ASCOT, SPIRAL) that decompose the distribution function into trapped and passing\
  \ classes; it enters the toroidal momentum balance $\\partial(n m R v_\\phi)/\\\
  partial t = S_{L_\\phi}^{\\mathrm{trapped}} + S_{L_\\phi}^{\\mathrm{co}} + S_{L_\\\
  phi}^{\\mathrm{ctr}} + \\ldots$, where $n$ is number density, $m$ is ion mass, $R$\
  \ is major radius, and $v_\\phi$ is toroidal velocity. Typical magnitudes range\
  \ from $10^{-3}$ to $10^{-1}\\;\\mathrm{N\\,m^{-2}}$ in NBI-heated tokamak plasmas,\
  \ depending on beam geometry and magnetic-field ripple. See related passing-orbit\
  \ counterparts and the total fast-particle source for the complete momentum budget."
