name: parallel_component_of_tendency_of_fast_ion_pressure
description: Time derivative of the fast (non-thermal) ion pressure projected along
  the magnetic-field direction $\hat{b}$.
documentation: Represents $\partial p_{i,\mathrm{fast},\parallel}/\partial t$, where
  $p_{i,\mathrm{fast},\parallel}$ (Pa) is the parallel element of the suprathermal
  ion pressure tensor. Fast ions originate primarily from neutral beam injection (NBI),
  ion cyclotron resonance heating (ICRH), and fusion-born alpha particles; their distribution
  functions are strongly anisotropic, particularly for tangential NBI where $p_{\parallel}
  \gg p_{\perp}$. The parallel pressure tendency is governed by the competition between
  fast-ion sources ($S_{\mathrm{NBI}}$, $S_\alpha$), slowing-down collisions with
  the thermal background at a rate $\sim \nu_s p_{\mathrm{fast}}$, and pitch-angle
  scattering that transfers energy between $p_{\parallel}$ and $p_{\perp}$. Typical
  magnitudes range from $10^3$ Pa s$^{-1}$ in medium-size tokamaks to $10^5$ Pa s$^{-1}$
  in burning-plasma scenarios. When summed over ion species and charge states the
  quantity yields the total fast-ion parallel pressure tendency. See `perpendicular_component_of_tendency_of_fast_ion_pressure`
  for the orthogonal channel.
kind: vector_component
unit: Pa
status: draft
