- name: neon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of neon ions at the plasma boundary (separatrix), the
    last closed flux surface separating the magnetically confined plasma from the
    open-field-line scrape-off layer.
  documentation: 'The neon impurity density at the plasma boundary quantifies the
    concentration of neon ions at the separatrix, which marks the transition between
    the nested closed flux surfaces of the confined plasma and the open-field-line
    scrape-off layer. Neon (atomic number $Z = 10$) is a widely used medium-Z seeding
    species whose partially stripped ionization states radiate efficiently in the
    edge region and divertor, contributing to radiative power exhaust and reducing
    peak heat loads on plasma-facing components.


    The separatrix neon density $n_\mathrm{Ne}$ provides a key boundary condition
    for impurity transport models linking the core plasma to the exhaust region. It
    complements [neon_density_at_divertor_target](name:neon_density_at_divertor_target)
    in constraining the neon distribution between the separatrix and the divertor
    target, and belongs to the same species-resolved family as [nitrogen_density_at_plasma_boundary](name:nitrogen_density_at_plasma_boundary),
    [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary), and
    [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary),
    all components of [density_at_plasma_boundary](name:density_at_plasma_boundary).


    Boundary neon density is measured or inferred through charge-exchange recombination
    spectroscopy, emission spectroscopy from helium-like or hydrogen-like neon charge
    states, or estimated from integrated power balance coupled with edge transport
    modeling. The reported value is often a flux-surface average over the separatrix
    contour.


    In neon-seeded experiments, separatrix densities range from roughly $10^{17}$
    to $10^{19}$ m$^{-3}$, scaling with the gas injection throughput and local edge
    transport properties.


    Sign convention: Positive when neon ions are present at a nonzero concentration
    at the plasma boundary.'
