- name: parallel_neutral_energy_flux
  kind: scalar
  status: draft
  description: Signed component of the neutral energy flux in the direction of the
    local magnetic field. It represents the field-aligned projection of energy carried
    by neutral atoms or molecules in edge and scrape-off-layer transport.
  documentation: 'Parallel neutral energy flux is the signed scalar projection of
    the neutral energy-flux vector onto the local magnetic-field direction. It measures
    the rate at which neutral-carried energy crosses a unit area whose normal is aligned
    with the magnetic field, after summing over the neutral populations represented
    in the physical model.


    The projection is defined by


    $$

    q_{\parallel,n} = \mathbf{q}_n \cdot \hat{\mathbf{b}}

    $$


    where $q_{\parallel,n}$ is the parallel neutral energy flux in W m$^{-2}$, $\mathbf{q}_n$
    is the total neutral energy-flux vector in W m$^{-2}$, $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field, and $\mathbf{B}$ is the magnetic-field
    vector.


    In transport calculations this quantity is obtained from kinetic, fluid, or Monte
    Carlo neutral descriptions by forming the neutral energy-flux vector from directed
    motion, thermal energy, and internal-state contributions, then projecting it onto
    $\hat{\mathbf{b}}$ at the point of evaluation. It is especially useful in edge
    plasma and scrape-off-layer analysis, where recycling, ionization, molecular dissociation,
    and charge exchange couple neutral energy transport to the charged plasma.


    Typical absolute magnitudes in tokamak edge and scrape-off-layer modeling are
    about $10^2$-$10^6$ W m$^{-2}$. Local values near intense divertor recycling,
    strong gas puffing, or energetic charge-exchange sources can approach $10^7$ W
    m$^{-2}$, while detached or weakly fueled regions may be much smaller.


    Sign convention: Positive when the neutral energy-flux vector has a component
    in the direction of the local magnetic field $\mathbf{B}$.'
  unit: W.m^-2
  physics_domain: transport
  links:
  - name:neutral_energy_flux
