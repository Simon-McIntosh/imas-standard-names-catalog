- name: radius_of_reflector
  kind: scalar
  status: draft
  description: Radius of a circular reflector element in a crystal X-ray spectrometer,
    measured from the geometric center of the reflector to its circular boundary edge.
    This quantity is defined only when the reflector cross-section is circular rather
    than rectangular.
  documentation: 'The radius $r$ of a reflector element describes the size of its
    circular cross-section, measured from the geometric center of the reflector to
    the boundary of the physical element. This is a strictly non-negative scalar quantity;
    it carries no directional sign and no outward-positive convention applies.


    Formally, for a reflector with circular cross-section of area $A$,

    $$r = \sqrt{A / \pi},$$

    and the reflector footprint is the disk $\{(u,v) : u^2 + v^2 \le r^2\}$ in the
    plane of the element, where $(u, v)$ are coordinates in the reflector plane centered
    on its geometric center.


    This quantity is applicable only when the reflector geometry type is circular
    (as opposed to rectangular, which is parameterized by half-widths). It describes
    the full physical extent of the reflector element and may or may not coincide
    with the optically active reflecting area; the optically active region is bounded
    by this radius unless a smaller coating or crystal area is specified separately.


    Typical values for laboratory or tokamak X-ray crystal spectrometer reflectors
    range from roughly 5 mm to 50 mm (0.005 m to 0.05 m), depending on collection
    solid angle requirements and crystal size.


    This quantity is geometrically distinct from the radius of curvature of a curved
    reflector (e.g., a bent crystal), which characterizes the optical focusing property
    of the surface rather than the lateral extent of the element.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_radius_of_curvature_of_reflector
  - name:first_coordinate_width_of_reflector
  - name:second_coordinate_of_reflector_outline
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/radius
    dd_path: spectrometer_x_ray_crystal/channel/reflector/radius
    status: composed
- name: second_coordinate_of_crystal_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of the dispersing crystal element in its local (X1, X2) instrument reference frame.
  documentation: 'The second local coordinate $X_2$ specifies vertex positions along
    the X2 axis of the crystal outline polygon, fully describing the crystal''s geometric
    boundary in the two-dimensional instrument frame $(X_1, X_2)$ local to the dispersing
    element. Together with the companion [first coordinate](name:first_coordinate_of_crystal_outline),
    the ordered set of $(X_1, X_2)$ vertex pairs defines the polygonal aperture or
    active surface of the crystal used in X-ray crystal spectrometers for Bragg diffraction.
    The local frame $(X_1, X_2)$ is an instrument-specific orthogonal coordinate system
    attached to the crystal element; its orientation relative to the machine cylindrical
    $(R, \phi, Z)$ frame is defined by the instrument geometry metadata. Vertex coordinates
    are determined from engineering drawings or optical metrology surveys, with typical
    crystal dimensions ranging from a few millimeters to tens of millimeters. The
    analogous quantity for a spectrometer reflector is [second_coordinate_of_reflector_outline](name:second_coordinate_of_reflector_outline),
    and the corresponding aperture quantity is [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline).


    Sign convention: Positive when the vertex position is in the positive $X_2$ direction
    of the local instrument reference frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_of_crystal_outline
  - name:second_coordinate_of_reflector_outline
  - name:second_coordinate_of_aperture_outline
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/outline/x2
    dd_path: spectrometer_x_ray_crystal/channel/crystal/outline/x2
    status: composed
- name: second_coordinate_of_detector_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of a diagnostic detector element in its local (X1, X2) instrument reference frame.
  documentation: 'The second local coordinate X2 specifies vertex positions along
    the X2 axis of the local instrument frame used to describe the polygonal outline
    of a detector element. Together with the [first local coordinate X1](name:first_coordinate_of_detector_outline),
    the ordered set of $(X1, X2)$ vertex pairs fully defines the detector''s active-area
    boundary polygon, which is required for computing the etendue, solid angle, and
    geometric weight factors entering line-of-sight integration. The local $(X1, X2)$
    frame is an instrument-specific Cartesian frame attached to the detector; its
    orientation relative to the machine cylindrical $(R, \phi, Z)$ frame is established
    by the detector''s unit vectors. Vertex coordinates are defined in sequence around
    the boundary, and the polygon is closed by the convention that the last vertex
    connects back to the first. Typical detector active-area extents range from tenths
    of a millimeter to several centimeters depending on the diagnostic, so X2 values
    span a comparable range centered near zero in the local frame. The same outline
    convention applies to apertures via [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline)
    and to filter windows via [second_coordinate_of_filter_window_outline](name:second_coordinate_of_filter_window_outline).


    Sign convention: Positive when the vertex position lies in the positive X2 direction
    of the local instrument coordinate frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_of_detector_outline
  - name:second_coordinate_of_aperture_outline
  - name:second_coordinate_of_filter_window_outline
