name: toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
status: draft
cocos_transformation_type: one_like
description: Toroidal flux coordinate $\rho_{\mathrm{tor}}$ (in meters) of the flux
  surface on which a neoclassical tearing mode island is centered.
documentation: The toroidal flux coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi / (\pi
  B_0)}$, where $\Phi$ is the enclosed toroidal magnetic flux (Wb) and $B_0$ is the
  vacuum toroidal field on axis (T), provides a dimensional radial label for the NTM
  island center with units of meters. This coordinate is related to its normalized
  counterpart by $\rho_{\mathrm{tor}} = \rho_{\mathrm{tor,norm}} \cdot \rho_{\mathrm{tor,edge}}$.
  Typical values range from $\sim 0.2$ m to $\sim 0.8$ m in medium-size tokamaks,
  scaling with machine minor radius. The NTM position is diagnosed via ECE radiometry,
  soft-X-ray tomography, or equilibrium reconstruction; its radial location directly
  determines which rational $q$-surface hosts the island chain and the consequent
  confinement degradation. See also the normalized coordinate and mode-number identifiers.
