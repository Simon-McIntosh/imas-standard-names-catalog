- name: volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Electron number density averaged over the plasma volume enclosed by
    the last closed flux surface, providing the primary global scalar for discharge
    density characterization and density feedback control.
  documentation: "The volume-averaged electron density $\\langle n_e \\rangle$ is\
    \ the mean of the local electron number density integrated over the plasma volume\
    \ $V$ bounded by the last closed flux surface (LCFS). It compresses the full radial\
    \ electron density profile into a single global scalar that quantifies the total\
    \ electron content of the discharge, serving as a primary parameter in confinement\
    \ characterization and fueling control.\n\nThe defining relation is:\n\n$$\n\\\
    langle n_e \\rangle = \\frac{1}{V} \\int_V n_e(\\mathbf{r}) \\, dV\n$$\n\nwhere\
    \ $n_e(\\mathbf{r})$ is the local [electron density] and $V$ is the plasma volume\
    \ enclosed by the LCFS.\n\nMulti-channel interferometry estimates $\\langle n_e\
    \ \\rangle$ directly by combining line-integrated electron density measurements\
    \ from multiple viewing chords spanning different minor-radius positions. Profile\
    \ diagnostics such as Thomson scattering and reflectometry constrain the spatial\
    \ distribution, while equilibrium reconstruction provides the LCFS boundary geometry\
    \ that defines $V$.\n\nRepresentative values in H-mode tokamak discharges span\
    \ $0.3$\u2013$1.5 \\times 10^{20}$ m$^{-3}$, with the volume average lying below\
    \ the on-axis peak for centrally-peaked profiles. Together with [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature)\
    \ and [volume_averaged_ion_density](name:volume_averaged_ion_density), it forms\
    \ the set of global scalar parameters entering energy confinement scaling laws\
    \ and Greenwald density-limit assessments.\n\nSign convention: Positive when electrons\
    \ are present within the plasma volume."
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_profiles/global_quantities/n_e_volume_average
    dd_path: core_profiles/global_quantities/n_e_volume_average
