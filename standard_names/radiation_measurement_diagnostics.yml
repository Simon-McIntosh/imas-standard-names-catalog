- name: area_of_optical_element
  kind: scalar
  status: draft
  description: Surface area of an optical element's aperture or active surface in
    a visible or infrared camera diagnostic channel.
  documentation: 'The surface area $A_{\rm opt}$ of an optical element defines the
    effective collecting area through which plasma radiation passes or is reflected
    before reaching the detector. This area, together with the optical system''s solid
    angle and transmission efficiency, determines the light-gathering power of the
    diagnostic channel. Typical values for camera apertures range from $10^{-6}\,{\rm
    m}^2$ (pinhole apertures) to $10^{-2}\,{\rm m}^2$ (primary collection lenses),
    depending on the field of view and spatial resolution requirements. The area is
    derived from the geometric dimensions of the element, such as its width and length,
    as specified by [width of optical element](name:width_of_optical_element) and
    [optical element length](name:optical_element_length). For bolometric diagnostics,
    a similar geometric quantity is defined by [area of bolometer](name:area_of_bolometer).


    Sign convention: Positive for any physical aperture.


    This scalar quantity is sign-invariant; the sign convention is formal only.'
  unit: m^2
  physics_domain: radiation_measurement_diagnostics
  links:
