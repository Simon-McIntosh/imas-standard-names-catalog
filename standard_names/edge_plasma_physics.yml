- name: toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the carbon impurity ion\
    \ bulk velocity at the plasma boundary, resolved in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It represents impurity-ion flow on the last closed flux\
    \ surface, distinct from main-ion flow."
  documentation: 'Toroidal flux-surface-averaged carbon velocity at the plasma boundary
    is the flux-surface average of the toroidal component of the carbon impurity ion
    bulk velocity on the last closed flux surface. The toroidal component is resolved
    along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. This
    impurity flow is distinct from main-ion flow, even when carbon spectroscopy is
    used as a tracer for plasma rotation.


    For an axisymmetric boundary flux surface, the flux-surface average is commonly
    written with the poloidal-field Jacobian weighting:


    $$

    \left\langle v_{\phi,\mathrm{C}} \right\rangle_{\mathrm{LCFS}} = \frac{\oint_{\mathrm{LCFS}}
    v_{\phi,\mathrm{C}}\, dl / B_p}{\oint_{\mathrm{LCFS}} dl / B_p}

    $$


    where $v_{\phi,\mathrm{C}}$ is the local toroidal carbon velocity, $dl$ is poloidal
    arc length along the last closed flux surface, and $B_p$ is the poloidal magnetic-field
    magnitude. It is the boundary flux-surface average corresponding to the local
    quantity [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary).


    In practice, this quantity is usually inferred from charge-exchange recombination
    spectroscopy of carbon emission, often from C VI lines, combined with an equilibrium
    reconstruction to locate the emitting region relative to the boundary. When measurements
    do not cover the full poloidal contour, the average may be obtained by fitting
    or interpolating local toroidal velocities before applying the flux-surface weighting.
    Related species-resolved averages describe analogous impurity or main-ion toroidal
    flows, such as deuterium, oxygen, neon, and tungsten boundary velocities.


    Typical separatrix carbon toroidal velocities are of order -5e4 to 5e4 m.s^-1
    in many ohmic, RF-heated, or moderately beam-heated plasmas. Strong external momentum
    input or steep edge rotation gradients can produce absolute magnitudes around
    1e5-2e5 m.s^-1.


    Sign convention: Positive when the carbon impurity bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_plasma_boundary
