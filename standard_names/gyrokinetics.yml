  constraints: []
- name: normalized_of_ion_charge_number
  kind: scalar
  status: draft
  description: Ion charge number normalized to the reference charge used in the gyrokinetic
    simulation, $\hat{Z}_s = Z_s / Z_{\mathrm{ref}}$.
  documentation: The normalized ion charge number $\hat{Z}_s = Z_s / Z_{\mathrm{ref}}$
    expresses the species charge state $Z_s$ (in units of $e$) divided by a reference
    charge $Z_{\mathrm{ref}}$ chosen at simulation setup (often the main-ion charge).
    This dimensionless ratio enters the gyrokinetic Vlasov equation and the quasineutrality
    constraint, scaling the electrostatic coupling strength per species. Gyrokinetic
    codes such as GS2, GENE, and CGYRO require $\hat{Z}_s$ as an input parameter alongside
    normalized mass and temperature; for a pure deuterium plasma $\hat{Z}_D = 1$,
    while impurities carry $\hat{Z}_{\mathrm{imp}} > 1$. See also [ion_charge_number](name:ion_charge_number)
    for the un-normalized integer charge and [effective_charge](name:effective_charge)
    for the plasma-averaged $Z_{\mathrm{eff}}$.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_of_species_density
  kind: scalar
  status: draft
  description: Species number density divided by a reference density, yielding a dimensionless
    ratio used as input to gyrokinetic codes.
  documentation: The normalized species density $\hat{n}_s = n_s / n_{\mathrm{ref}}$
    expresses the density of a given plasma species $n_s$ (in $\mathrm{m}^{-3}$) relative
    to a simulation reference density $n_{\mathrm{ref}}$ (often the electron density
    at the reference flux surface). This dimensionless ratio enters local gyrokinetic
    equations as a parameter controlling species weighting in quasineutrality and
    turbulent flux calculations. Codes such as GS2, GENE, and CGYRO require this quantity
    per species alongside [normalized_of_species_temperature](name:normalized_of_species_temperature)
    and [normalized_of_species_mass](name:normalized_of_species_mass) to set up the
    local equilibrium. Values are of order unity for the dominant species and can
    be much smaller for impurity or fast-ion populations.
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_of_species_mass
  kind: scalar
  status: draft
  description: Species mass divided by a reference mass (commonly the deuterium or
    proton mass), yielding a dimensionless ratio for gyrokinetic input.
  documentation: The normalized species mass $\hat{m}_s = m_s / m_{\mathrm{ref}}$
    expresses the mass of species $s$ relative to a reference mass $m_{\mathrm{ref}}$,
    where $m_{\mathrm{ref}}$ is conventionally the deuterium mass $m_D \approx 3.34
    \times 10^{-27}\,\mathrm{kg}$ or the proton mass $m_p$. This dimensionless quantity
    enters gyrokinetic equations through the species gyroradius $\rho_s = \hat{m}_s^{1/2}
    \hat{T}_s^{1/2} \rho_{\mathrm{ref}}$ and the parallel streaming terms. For electrons
    $\hat{m}_e \approx 2.72 \times 10^{-4}$ (deuterium normalization); for main ions
    $\hat{m}_i = 1$; for impurities values scale with the atomic mass number. See
    also [normalized_of_species_density](name:normalized_of_species_density) and [normalized_of_species_temperature](name:normalized_of_species_temperature).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_of_species_temperature
  kind: scalar
  status: draft
  description: Species temperature divided by a reference temperature, giving a dimensionless
    ratio used as a gyrokinetic simulation parameter.
  documentation: "The normalized species temperature $\\hat{T}_s = T_s / T_{\\mathrm{ref}}$\
    \ is the ratio of the species temperature $T_s$ (in eV or keV) to the reference\
    \ temperature $T_{\\mathrm{ref}}$ (often the electron temperature at the reference\
    \ flux surface). It enters the gyrokinetic ordering through the thermal speed\
    \ $v_{\\mathrm{th},s} = (T_s / m_s)^{1/2}$ and directly scales the species pressure\
    \ contribution and associated gradient drives. For main ions in standard H-mode\
    \ scenarios, $\\hat{T}_i / \\hat{T}_e \\approx 0.7$\u2013$1.2$ depending on auxiliary\
    \ heating partition. Codes require this quantity per species alongside [normalized_of_species_density](name:normalized_of_species_density)\
    \ and [normalized_of_species_mass](name:normalized_of_species_mass) to define\
    \ the local Maxwellian background."
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: Contribution of the perturbed electrostatic potential $\delta\phi$
    to the parallel component of the normalized toroidal angular-momentum flux.
  documentation: "The electrostatic channel $\\hat{\\Pi}_{\\parallel,\\mathrm{tor}}^{\\\
    phi}$ captures the turbulent Reynolds stress component of the parallel toroidal\
    \ momentum flux driven by the $E\\times B$ radial velocity $v_E^r \\propto \\\
    partial_\\theta \\delta\\phi$. It is computed from the flux-surface-averaged correlation\
    \ $\\langle m_s v_\\parallel R \\, v_E^r \\, \\delta f_s \\rangle$ summed over\
    \ species. In low-$\\beta$ regimes this is the dominant toroidal momentum transport\
    \ channel and governs intrinsic rotation generation. Normalization is in gyro-Bohm\
    \ angular-momentum-flux units. Finite values arise even in the absence of an equilibrium\
    \ rotation gradient due to symmetry-breaking mechanisms such as up\u2013down asymmetry\
    \ of the flux surface. See also [normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential)\
    \ and [normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential)."
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_parallel_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel magnetic field $\delta B_\parallel$
    to the parallel component of the normalized toroidal angular-momentum flux.
  documentation: This quantity represents the compressional-magnetic channel $\hat{\Pi}_{\parallel,\mathrm{tor}}^{B_\parallel}$
    of the parallel toroidal momentum flux, arising from the mirror-force correlations
    induced by $\delta B_\parallel$ perturbations in gyrokinetic simulations. In the
    total momentum-flux decomposition, this term contributes when compressional magnetic
    fluctuations are retained (finite-$\beta$ simulations with the $\delta B_\parallel$
    response). The normalization follows the same gyro-Bohm angular-momentum-flux
    convention as the companion channels. This channel is generally subdominant compared
    to the electrostatic term but can be relevant for high-$\beta$ plasmas or configurations
    with strong pressure anisotropy. See also [normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel vector potential $\delta A_\parallel$
    to the parallel component of the normalized toroidal angular-momentum flux.
  documentation: 'This field stores the electromagnetic flutter channel of the parallel
    toroidal-momentum flux, $\hat{\Pi}_{\parallel,\mathrm{tor}}^{A_\parallel}$, arising
    from correlations between the parallel momentum moment of $\delta f$ and the radial
    drift driven by $\delta A_\parallel$. In gyrokinetic momentum transport theory,
    the total toroidal momentum flux decomposes into parallel and perpendicular Reynolds
    and Maxwell stress contributions: $\hat{\Pi}_{\mathrm{tor}} = \hat{\Pi}_{\parallel}^{\phi}
    + \hat{\Pi}_{\parallel}^{A_\parallel} + \hat{\Pi}_{\parallel}^{B_\parallel} +
    \hat{\Pi}_{\perp}^{\phi} + \ldots$. The $A_\parallel$ channel captures the Maxwell-stress-like
    contribution and is important at elevated $\beta$. Normalization follows gyro-Bohm
    angular-momentum-flux conventions. See also [normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential).'
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_particle_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Dimensionless particle flux contribution arising from the perturbed
    parallel magnetic field $\delta B_\parallel$ in gyrokinetic simulations.
  documentation: 'The normalized particle flux due to the parallel magnetic field
    perturbation captures the compressional magnetic transport channel in electromagnetic
    gyrokinetics. The radial particle flux contribution from $\delta B_\parallel$
    originates from the magnetic mirror force and the associated modification of the
    particle drifts: $\Gamma_s^{\delta B_\parallel} \propto \langle \delta f_s \,
    v_{d,r} \, \delta B_\parallel / B_0 \rangle$, where $v_{d,r}$ is the radial component
    of the magnetic drift and $B_0$ is the equilibrium field strength. The quantity
    is normalized to the gyro-Bohm particle flux $\Gamma_{\mathrm{gB}} = n_{\mathrm{ref}}
    c_s \rho_*^2$, with $c_s = \sqrt{T_{\mathrm{ref}}/m_{\mathrm{ref}}}$ and $\rho_*
    = \rho_s / a$. This channel becomes significant at moderate to high $\beta$ and
    is essential for resolving kinetic ballooning physics and mirror-mode-like instabilities.
    Output from gyrokinetic codes (GENE, CGYRO, GS2) resolves this channel per species
    and wavevector. See also [normalized_particle_flux_due_to_electrostatic_potential](name:normalized_particle_flux_due_to_electrostatic_potential)
    and [normalized_particle_flux_due_to_parallel_vector_potential](name:normalized_particle_flux_due_to_parallel_vector_potential).'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-surface-average
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_particle_flux_due_to_parallel_vector_potential
  kind: scalar
  status: draft
  description: Dimensionless particle flux contribution arising from the perturbed
    parallel electromagnetic vector potential $\delta A_\parallel$ in gyrokinetic
    simulations.
  documentation: The normalized particle flux due to the parallel vector potential
    quantifies the electromagnetic flutter transport channel in gyrokinetic theory.
    In the $\delta f$ formulation, the radial particle flux $\Gamma_s$ receives a
    contribution from the perturbed parallel vector potential $\delta A_\parallel$
    through the correlation $\langle \delta f_s \, v_\parallel \, \delta A_\parallel
    \rangle$, where $\delta f_s$ is the perturbed distribution function of species
    $s$ and $v_\parallel$ is the parallel velocity. This component is normalized to
    a reference gyro-Bohm flux $\Gamma_{\mathrm{gB}} = n_{\mathrm{ref}} c_s \rho_*^2$,
    where $n_{\mathrm{ref}}$ is the reference density, $c_s = \sqrt{T_{\mathrm{ref}}/m_{\mathrm{ref}}}$
    is the sound speed, and $\rho_* = \rho_s / a$ is the normalized Larmor radius.
    At low $\beta$ this channel is subdominant relative to the electrostatic contribution,
    but at finite $\beta$ (above a few percent) it can become comparable. Codes such
    as GENE, GS2, and CGYRO output this quantity for each species and wavevector.
    See also [normalized_particle_flux_due_to_electrostatic_potential](name:normalized_particle_flux_due_to_electrostatic_potential)
    and [normalized_particle_flux_due_to_parallel_magnetic_field_perturbation](name:normalized_particle_flux_due_to_parallel_magnetic_field_perturbation)
    for the companion flux channels.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-surface-average
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: Contribution of the perturbed electrostatic potential $\delta\phi$
    to the perpendicular component of the normalized toroidal angular-momentum flux.
  documentation: The electrostatic channel $\hat{\Pi}_{\perp,\mathrm{tor}}^{\phi}$
    of the perpendicular toroidal momentum flux captures the turbulent transport of
    the magnetization (or diamagnetic) contribution to toroidal angular momentum via
    the $E\times B$ drift. It is computed from the flux-surface average of the perpendicular
    (grad-B and curvature drift) momentum correlated with $v_E^r$. Together with the
    parallel electrostatic channel, it accounts for the total $E\times B$-driven toroidal
    angular-momentum redistribution. Normalization is in gyro-Bohm angular-momentum-flux
    units. In ITG-dominated turbulence, this term contributes to the residual stress
    that drives intrinsic rotation even in the absence of external torque. See also
    [normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel magnetic field $\delta B_\parallel$
    to the perpendicular component of the normalized toroidal angular-momentum flux.
  documentation: This quantity represents the compressional-magnetic channel $\hat{\Pi}_{\perp,\mathrm{tor}}^{B_\parallel}$
    of the perpendicular toroidal momentum flux, accounting for mirror-force-mediated
    radial transport of perpendicular toroidal angular momentum. The perpendicular
    momentum flux is associated with the magnetization stress and finite-Larmor-radius
    corrections to the pressure tensor; the $\delta B_\parallel$ contribution enters
    when the magnetic compression response is retained. Normalization is to gyro-Bohm
    angular-momentum-flux units. This channel is generally small relative to the electrostatic
    contribution but contributes at high $\beta$ or in configurations with strong
    compressional activity. See also [normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_perpendicular_toroidal_momentum_flux_due_to_parallel_vector_potential
  kind: scalar
  status: draft
  description: Contribution of the perturbed parallel vector potential $\delta A_\parallel$
    to the perpendicular component of the normalized toroidal angular-momentum flux.
  documentation: This field stores the electromagnetic flutter contribution $\hat{\Pi}_{\perp,\mathrm{tor}}^{A_\parallel}$
    to the perpendicular (diamagnetic-like) toroidal momentum flux channel. In gyrokinetic
    theory the perpendicular momentum flux arises from the $\nabla B$ and curvature
    drifts carrying toroidal angular momentum radially, modulated by the $\delta A_\parallel$-induced
    magnetic flutter. The decomposition separates electrostatic, $A_\parallel$, and
    $B_\parallel$ contributions so that electromagnetic effects on momentum redistribution
    can be quantified independently. Normalization is in gyro-Bohm angular-momentum-flux
    units consistent with the parallel channels. See also [normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential](name:normalized_perpendicular_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential](name:normalized_parallel_toroidal_momentum_flux_due_to_parallel_vector_potential).
  unit: '1'
  cocos_transformation_type: one_like
  tags: []
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_pressure_gradient_scale_length
  kind: scalar
  status: draft
  description: Dimensionless radial gradient of the total pressure with respect to
    the normalized minor radius on a flux surface.
  documentation: "The normalized pressure gradient $p^\\prime_{\\mathrm{norm}} = (a\
    \ / p_{\\mathrm{ref}})\\, dp/d(r/a)$ (dimensionless) quantifies how steeply the\
    \ total plasma pressure $p$ (in Pa) falls off radially, where $a$ is the plasma\
    \ minor radius (in m), $r/a$ is the dimensionless normalized minor radius, and\
    \ $p_{\\mathrm{ref}}$ is a reference pressure (in Pa). In the gyrokinetic context\
    \ this quantity parameterizes the equilibrium pressure profile on the flux surface\
    \ of interest and enters the local MHD equilibrium through the Grad\u2013Shafranov\
    \ balance. Large negative values (strong inward gradients) correspond to steep\
    \ pressure pedestals found in H-mode plasmas, where $|p^\\prime_{\\mathrm{norm}}|$\
    \ can exceed 10, while core L-mode profiles have more moderate values of order\
    \ 1\u20135. This is a flux-surface-level input parameter distinct from species-resolved\
    \ density or temperature gradients. See also [safety_factor](name:safety_factor)\
    \ and [elongation](name:elongation) for the companion equilibrium shape descriptors."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - flux-surface-average
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_radial_wavevector
  kind: scalar
  status: draft
  description: Radial component of the fluctuation wavevector normalized to the inverse
    sound Larmor radius, $k_r \rho_s$.
  documentation: "The normalized radial wavevector $k_r \\rho_s$ specifies the radial\
    \ spatial scale of turbulent fluctuations in gyrokinetic simulations, where $k_r$\
    \ is the physical radial wavenumber (in $\\mathrm{m}^{-1}$) and $\\rho_s = c_s\
    \ / \\Omega_i$ is the sound Larmor radius with $c_s = \\sqrt{T_e/m_i}$ the ion\
    \ sound speed and $\\Omega_i = eB/m_i$ the ion cyclotron frequency. In nonlinear\
    \ simulations, the radial wavevector grid spans the range set by the radial box\
    \ size $L_x$: $k_{r,\\min} = 2\\pi/L_x$, with maximum values of $k_r \\rho_s \\\
    sim 1$\u20132 for ion-scale and $\\sim 50$\u2013100 for electron-scale turbulence.\
    \ In linear simulations, $k_r$ is either a free parameter (for ballooning-space\
    \ representations) or set by the parallel boundary condition. See also [normalized_binormal_wavevector](name:normalized_binormal_wavevector)\
    \ for the perpendicular binormal counterpart."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - fourier-component
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_temperature_gradient_scale_length
  kind: scalar
  status: draft
  description: Dimensionless logarithmic gradient of the species temperature with
    respect to the normalized minor radius, $a/L_T = -a \, d(\ln T)/dr$.
  documentation: "The normalized temperature gradient scale length $a/L_T = -R/L_T$\
    \ (or equivalently $-d(\\ln T)/d(r/a)$, where $a$ is the last closed flux surface\
    \ minor radius, $T$ is the species temperature, and $r$ is the local minor radius)\
    \ is a key drive parameter for ion- and electron-temperature-gradient (ITG/ETG)\
    \ microinstabilities in gyrokinetic theory. It enters the local gyrokinetic equation\
    \ as a source of free energy: turbulence onset occurs when $a/L_T$ exceeds a critical\
    \ threshold $a/L_{T,\\mathrm{crit}}$ that depends on magnetic geometry and collisionality.\
    \ Gyrokinetic codes such as GS2, GENE, and CGYRO accept this quantity as an input\
    \ parameter for flux-tube simulations. Values of $a/L_{T_i} \\sim 3$\u20139 are\
    \ common for ion temperature in H-mode core plasmas; electron values can differ\
    \ substantially depending on heating scheme. See also [normalized_density_gradient_scale_length](name:normalized_density_gradient_scale_length)\
    \ for the analogous density drive and [safety_factor](name:safety_factor) for\
    \ the magnetic geometry entering the critical gradient."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: vector
  status: draft
  description: Contribution from the perturbed electrostatic potential $\delta\phi$
    to the parallel projection of the normalized turbulent toroidal momentum flux.
  documentation: This quantity represents the $E \times B$ electrostatic contribution
    to the parallel component of the radial toroidal angular momentum flux. It is
    defined via the correlation $\Pi_{\phi,\parallel}^{\phi} \propto \langle \delta
    u_\parallel \, ik_r \delta\phi \rangle$, where $\delta u_\parallel$ is the parallel
    velocity perturbation, $k_r$ is the radial wavenumber, and angle brackets denote
    flux-surface and time averaging; all quantities are normalized to gyro-Bohm units
    $n_{\mathrm{ref}} m_{\mathrm{ref}} v_{\mathrm{th,ref}}^2 \rho_*$. This is the
    dominant toroidal momentum transport channel in electrostatic turbulence regimes
    ($\beta \ll 1$) and plays a central role in intrinsic rotation generation through
    symmetry-breaking mechanisms. Computed in nonlinear gyrokinetic simulations (GENE,
    CGYRO, GS2) on 5-D phase-space grids. See also [parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential)
    and [perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential).
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation
  kind: vector
  status: draft
  description: Contribution from the perturbed parallel magnetic field $\delta B_\parallel$
    to the parallel projection of the normalized turbulent toroidal momentum flux.
  documentation: "This field captures the compressional magnetic flutter contribution\
    \ to the parallel component of the radial toroidal momentum flux, arising from\
    \ the perturbation $\\delta B_\\parallel$ in gyrokinetic simulations. In high-$\\\
    beta$ plasmas, $\\delta B_\\parallel$ modifies the magnetic moment and enters\
    \ the stress tensor through $\\Pi_{\\phi,\\parallel}^{B_\\parallel} \\propto \\\
    langle \\delta p_\\perp \\, \\delta B_\\parallel / B_0 \\rangle$, where $\\delta\
    \ p_\\perp$ is the perpendicular pressure perturbation and $B_0$ is the equilibrium\
    \ field magnitude. All quantities are normalized to gyro-Bohm units. The $\\delta\
    \ B_\\parallel$ channel is retained in fully electromagnetic gyrokinetic codes\
    \ (e.g., GENE with `beta_prime` finite) and is negligible in electrostatic or\
    \ shear-Alfv\xE9nic-only approximations. See also [parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential)\
    \ and [perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation](name:perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation)."
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential
  kind: vector
  status: draft
  description: Contribution from the perturbed parallel vector potential $\delta A_\parallel$
    to the parallel projection of the normalized turbulent toroidal momentum flux.
  documentation: In electromagnetic gyrokinetic theory, turbulent radial transport
    of toroidal angular momentum is decomposed by field channel. This quantity isolates
    the contribution of the perturbed parallel magnetic vector potential $\delta A_\parallel$
    to the parallel component of the toroidal momentum flux, $\Pi_{\phi,\parallel}^{A_\parallel}$.
    The underlying correlation is $\Pi_{\phi,\parallel}^{A_\parallel} \propto \langle
    \delta j_\parallel \, \delta A_\parallel \rangle$, where $\delta j_\parallel$
    is the parallel current perturbation and the angle brackets denote a flux-surface
    and time average; all quantities are normalized to gyro-Bohm units $n_{\mathrm{ref}}
    m_{\mathrm{ref}} v_{\mathrm{th,ref}} \rho_* v_{\mathrm{th,ref}}$. This electromagnetic
    flutter contribution becomes significant at high $\beta$ where magnetic fluctuations
    compete with $E \times B$ transport. Computed in nonlinear gyrokinetic simulations
    using codes such as GENE and CGYRO on 5-D phase-space grids. See also [parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential](name:parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential).
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: vector
  status: draft
  description: Contribution from the perturbed electrostatic potential $\delta\phi$
    to the perpendicular projection of the normalized turbulent toroidal momentum
    flux.
  documentation: 'This quantity captures the $E \times B$ electrostatic drive of perpendicular
    toroidal momentum transport. The perpendicular momentum flux arises from correlations
    between the radial $E \times B$ drift and the perpendicular toroidal velocity
    perturbation: $\Pi_{\phi,\perp}^{\phi} \propto \langle \delta v_{E,r} \, m \delta
    v_{E,\phi} \rangle$, where the radial drift $\delta v_{E,r} \propto ik_\theta
    \delta\phi / B_0$; all quantities are normalized to gyro-Bohm units $n_{\mathrm{ref}}
    m_{\mathrm{ref}} v_{\mathrm{th,ref}}^2 \rho_*$. This channel dominates perpendicular
    momentum transport in low-$\beta$ ITG/TEM turbulence and is relevant to determining
    the perpendicular (diamagnetic) rotation profile. Computed in nonlinear local
    gyrokinetic simulations on 5-D grids (GENE, CGYRO). See also [parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential](name:parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential)
    and [perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential).'
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation
  kind: vector
  status: draft
  description: Contribution from the perturbed parallel magnetic field $\delta B_\parallel$
    to the perpendicular projection of the normalized turbulent toroidal momentum
    flux.
  documentation: This field stores the compressional magnetic ($\delta B_\parallel$)
    contribution to the perpendicular component of the normalized radial toroidal
    momentum flux. The $\delta B_\parallel$ perturbation modifies the equilibrium
    magnetic pressure and introduces a perpendicular stress, yielding a momentum flux
    channel $\Pi_{\phi,\perp}^{B_\parallel} \propto \langle \delta p_\perp \, \delta
    B_\parallel / B_0 \rangle$ (schematic; exact form depends on the velocity-space
    moment closure used). All quantities are normalized to gyro-Bohm units. This channel
    is retained in fully electromagnetic gyrokinetic models at high $\beta$ and is
    negligible in the electrostatic limit. Computed on 5-D phase-space grids in nonlinear
    codes. See also [perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential)
    and [parallel_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation](name:parallel_component_of_toroidal_momentum_flux_due_to_parallel_magnetic_field_perturbation).
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: perpendicular_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential
  kind: vector
  status: draft
  description: Contribution from the perturbed parallel vector potential $\delta A_\parallel$
    to the perpendicular projection of the normalized turbulent toroidal momentum
    flux.
  documentation: This quantity isolates the electromagnetic flutter contribution of
    $\delta A_\parallel$ to the perpendicular (diamagnetic) component of the radial
    toroidal momentum flux. The perpendicular toroidal momentum arises from the magnetization
    and $E \times B$ drifts and is distinct from the parallel flow channel. In fully
    electromagnetic gyrokinetic formulations, the $\delta A_\parallel$ channel enters
    through correlations of the form $\Pi_{\phi,\perp}^{A_\parallel} \propto \langle
    \delta v_{E,\phi} \, \delta j_\parallel \, \delta A_\parallel \rangle$ (exact
    structure depends on the code's moment hierarchy), normalized to gyro-Bohm units.
    This contribution becomes comparable to the electrostatic channel at elevated
    $\beta$ or when parallel current perturbations are large. Computed in nonlinear
    phase-space simulations by codes such as GENE and CGYRO. See also [parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential](name:parallel_component_of_toroidal_momentum_flux_due_to_parallel_vector_potential)
    and [perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential).
  unit: '1'
  tags:
  - fourier-component
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_electrostatic_potential_eigenmode_normalized_real_part
  kind: complex
  status: draft
  description: Real part of the normalized perturbed electrostatic potential eigenmode
    amplitude from a linear gyrokinetic stability calculation.
  documentation: The real part of the normalized electrostatic potential perturbation
    $\Re(\hat{\phi})$ represents the in-phase component of the eigenmode structure
    along the field line in a linear gyrokinetic simulation. Here $\hat{\phi} = e\delta\phi
    / T_{\mathrm{ref}}$, where $e$ is the elementary charge, $\delta\phi$ is the perturbed
    electrostatic potential in V, and $T_{\mathrm{ref}}$ is a reference temperature
    in eV. This quantity is resolved per wavevector $(k_x, k_y)$ and along the ballooning
    coordinate $\theta$. Gyrokinetic codes such as GS2, GENE, and CGYRO output this
    field to characterize the spatial structure of electrostatic instabilities (ITG,
    TEM, ETG). See also [perturbed_parallel_magnetic_field_eigenmode_normalized](name:perturbed_parallel_magnetic_field_eigenmode_normalized)
    for the electromagnetic counterpart.
  unit: '1'
  tags:
  - flux-coordinates
  - fourier-component
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_electrostatic_potential_parity
  kind: scalar
  status: draft
  description: Parity index of the perturbed electrostatic potential $\delta \phi$
    under reflection about the poloidal angle $\theta = 0$.
  documentation: 'In linear gyrokinetic analysis, each eigenmode is classified by
    its symmetry under poloidal-angle reflection about $\theta = 0$ (outboard midplane).
    The perturbed electrostatic potential parity is a dimensionless integer flag:
    $+1$ denotes even (ballooning) parity where $\delta\phi(\theta) = \delta\phi(-\theta)$,
    and $-1$ denotes odd (tearing) parity where $\delta\phi(\theta) = -\delta\phi(-\theta)$.
    Most drift-wave instabilities (ITG, TEM) exhibit even $\delta\phi$ parity, whereas
    odd-parity modes can appear in the presence of strong magnetic shear or electromagnetic
    effects. This label is stored alongside the parity flags for $\delta A_\parallel$
    and $\delta B_\parallel$ to fully characterize the eigenmode structure. See also
    [perturbed_parallel_vector_potential_parity](name:perturbed_parallel_vector_potential_parity).'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_parallel_magnetic_field_parity
  kind: scalar
  status: draft
  description: Discrete symmetry label indicating whether the perturbed parallel magnetic
    field $\delta B_\parallel$ is even or odd under reflection about the outboard
    midplane ($\theta=0$).
  documentation: 'In linear gyrokinetic eigenmode analysis, the perturbed parallel
    magnetic field $\delta B_\parallel(\theta)$ along the field line can be classified
    by its parity with respect to the poloidal angle $\theta = 0$ (outboard midplane).
    A value of $+1$ denotes even (ballooning) parity where $\delta B_\parallel(-\theta)
    = +\delta B_\parallel(\theta)$, while $-1$ denotes odd (tearing) parity where
    $\delta B_\parallel(-\theta) = -\delta B_\parallel(\theta)$. This classification
    is essential for identifying the nature of linear instabilities: ballooning-parity
    modes (e.g., ITG, TEM, ETG) dominate in the good-curvature region, whereas tearing-parity
    modes relate to microtearing or current-driven instabilities. Gyrokinetic codes
    such as GS2, GENE, and CGYRO report parity flags for each eigenmode to facilitate
    mode identification. See also [perturbed_parallel_magnetic_field_eigenmode_imaginary_part_normalized](name:perturbed_parallel_magnetic_field_eigenmode_imaginary_part_normalized)
    for the eigenmode structure itself.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_parallel_vector_potential_parity
  kind: scalar
  status: draft
  description: Parity index of the perturbed parallel magnetic vector potential $\delta
    A_\parallel$ under reflection about the poloidal angle $\theta = 0$.
  documentation: 'In linear gyrokinetic eigenvalue analysis, each eigenmode possesses
    a definite symmetry (parity) with respect to reflection of the poloidal angle
    about $\theta = 0$ (the outboard midplane). The perturbed parallel vector potential
    parity is a dimensionless integer flag: a value of $+1$ indicates even (tearing)
    parity where $\delta A_\parallel(\theta) = \delta A_\parallel(-\theta)$, and $-1$
    indicates odd (twisting/ballooning) parity where $\delta A_\parallel(\theta) =
    -\delta A_\parallel(-\theta)$. Classification of electromagnetic modes by their
    $\delta A_\parallel$ parity is essential for distinguishing micro-tearing modes
    (even parity) from kinetic ballooning modes (odd parity). This parity label is
    reported alongside the companion quantities for the perturbed electrostatic potential
    and perturbed parallel magnetic field. See also [perturbed_electrostatic_potential_parity](name:perturbed_electrostatic_potential_parity).'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_angle_grid
  kind: scalar
  status: draft
  description: Discrete poloidal angle coordinate grid, ranging from $-\pi$ to $\pi$,
    used in gyrokinetic species-dependent field representations.
  documentation: "The poloidal angle grid $\\theta_j$ (in radians) provides the discrete\
    \ set of points along the poloidal direction on which species-dependent quantities\u2014\
    such as the effective potential energy governing the poloidal density variation\u2014\
    are evaluated in local gyrokinetic simulations. The angle is defined with respect\
    \ to the outboard midplane ($\\theta = 0$), increasing in the direction of positive\
    \ poloidal field, and spans $[-\\pi, \\pi]$. Grid resolution requirements depend\
    \ on the mode structure: ion-scale turbulence simulations use 16\u201364 poloidal\
    \ grid points, while electron-scale or multi-scale runs may require 128 or more\
    \ to resolve fine ballooning structures. This coordinate serves as the independent\
    \ variable for parallel-direction profiles of perturbed fields, distribution functions,\
    \ and flux-surface geometry coefficients within the gyrokinetic framework."
  unit: rad
  tags:
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: reference_plasma_beta
  kind: scalar
  status: draft
  description: Ratio of reference kinetic pressure to magnetic pressure used to normalize
    electromagnetic effects in the gyrokinetic system.
  documentation: "The reference plasma beta $\\beta_{\\mathrm{ref}} = 2 \\mu_0 n_{\\\
    mathrm{ref}} T_{\\mathrm{ref}} / B_{\\mathrm{ref}}^2$ is a dimensionless normalization\
    \ parameter appearing in the gyrokinetic field equations, where $\\mu_0$ is the\
    \ vacuum permeability, $n_{\\mathrm{ref}}$ the reference density, $T_{\\mathrm{ref}}$\
    \ the reference temperature, and $B_{\\mathrm{ref}}$ the reference magnetic field.\
    \ It controls the strength of electromagnetic fluctuations ($\\delta A_\\parallel$,\
    \ $\\delta B_\\parallel$) relative to electrostatic fluctuations in gyrokinetic\
    \ codes such as GS2, GENE, and CGYRO. In the electrostatic limit $\\beta_{\\mathrm{ref}}\
    \ \\to 0$; for electromagnetic ITG/KBM simulations values of $10^{-3}$\u2013$10^{-2}$\
    \ are common in tokamak core parameters. The reference beta determines when kinetic-ballooning\
    \ and micro-tearing modes become unstable. See also [electron_density](name:electron_density)\
    \ and [normalized_of_e_cross_b_shearing_rate](name:normalized_of_e_cross_b_shearing_rate)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: safety_factor
  kind: scalar
  status: draft
  description: Number of toroidal transits a magnetic field line completes per single
    poloidal circuit on a given flux surface.
  documentation: "The safety factor $q(\\psi) = d\\Phi_{\\mathrm{tor}} / d\\Phi_{\\\
    mathrm{pol}}$ quantifies the helicity of the magnetic field on each flux surface,\
    \ where $\\Phi_{\\mathrm{tor}}$ is the toroidal magnetic flux and $\\Phi_{\\mathrm{pol}}$\
    \ the poloidal magnetic flux. It is the central parameter governing MHD stability:\
    \ regions with rational $q = m/n$ are susceptible to resonant perturbations, and\
    \ $q < 1$ on axis drives sawtooth oscillations. In gyrokinetic simulations $q$\
    \ enters the parallel boundary condition of the flux-tube domain and directly\
    \ affects the connection length and linear drive of microinstabilities. Conventional\
    \ H-mode tokamaks have $q_0 \\approx 1$ on axis and $q_{95} \\approx 3$\u2013\
    5 at the 95% poloidal flux surface. The safety factor is reconstructed from external\
    \ magnetics, motional Stark effect (MSE), or polarimetry measurements in combination\
    \ with equilibrium solvers. See also [elongation](name:elongation) for shape context\
    \ and [flux_tube_poloidal_turn_count](name:flux_tube_poloidal_turn_count) for\
    \ the related gyrokinetic domain parameter."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: upper_triangularity
  kind: scalar
  status: draft
  description: Upper triangularity $\delta_u$ of a poloidal flux surface, measuring
    the inward displacement of the uppermost point relative to the geometric center.
  documentation: The upper triangularity $\delta_u$ (dimensionless) is defined as
    $\delta_u = (R_{\mathrm{geo}} - R_{\mathrm{top}}) / a$, where $R_{\mathrm{geo}}$
    is the major radius of the flux-surface geometric center (m), $R_{\mathrm{top}}$
    is the major radius of the highest point on the surface (m), and $a$ is the horizontal
    half-width (m). Positive $\delta_u$ indicates the top of the surface is shifted
    inward (toward the magnetic axis), which is the standard shaping in conventional
    tokamaks and enhances stability to ballooning modes. Negative triangularity plasmas
    ($\delta_u < 0$) are under active investigation for improved confinement and reduced
    ELM activity. Values span $-0.5 \lesssim \delta_u \lesssim 0.7$ across current
    experiments. In gyrokinetic simulations, $\delta_u$ enters the Miller or Fourier
    flux-surface parameterization and modifies the local magnetic curvature. See also
    [elongation](name:elongation) for the companion elongation parameter and [magnetic_shear_r_minor_based](name:magnetic_shear_r_minor_based)
    for the local shear.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_effective_charge
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty interval on the effective
    charge $Z_{\mathrm{eff}}$.
  documentation: This field provides the upward error bar for $Z_{\mathrm{eff}}$,
    representing the positive deviation from the nominal value. Asymmetric uncertainties
    occur when the error distribution is skewed, for example from systematic bias
    in bremsstrahlung continuum subtraction or from bounded physical constraints ($Z_{\mathrm{eff}}
    \geq 1$). The stored value is a non-negative offset such that the upper confidence
    bound is $Z_{\mathrm{eff}} + \Delta Z_{\mathrm{eff}}^{+}$. Combined with [lower_uncertainty_of_effective_charge](name:lower_uncertainty_of_effective_charge)
    the full asymmetric confidence interval is recovered. See also the parent quantity
    [effective_charge](name:effective_charge).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_elongation
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the flux-surface elongation
    $\kappa$.
  documentation: This quantity gives the magnitude of the upward error on the elongation
    $\kappa$ (dimensionless), so the upper confidence limit is $\kappa + \delta\kappa_{\mathrm{upper}}$.
    Asymmetric uncertainties arise because $\kappa$ is derived from an equilibrium
    reconstruction or a constrained fit to diagnostic data (e.g., magnetic probes,
    motional Stark effect), where nonlinearities in the flux-surface geometry produce
    non-Gaussian error distributions. In gyrokinetic workflows, propagation of this
    uncertainty into the Miller parameterization allows sensitivity analysis of turbulent
    transport predictions to equilibrium shape errors. See [elongation](name:elongation)
    for the parent quantity and its physical definition.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_safety_factor
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the safety factor $q$.
  documentation: This field provides the upper error bar on the safety factor $q$,
    representing the positive deviation from the nominal reconstructed value. Uncertainties
    in $q$ arise primarily from measurement errors in motional Stark effect (MSE)
    or polarimetry diagnostics and from regularization choices in the equilibrium
    reconstruction. In the gyrokinetic context, uncertainty in $q$ propagates into
    the parallel boundary condition of flux-tube simulations and affects the critical
    gradient thresholds for microinstabilities. Combined with the lower uncertainty,
    a full asymmetric confidence interval for $q$ is specified. See the parent quantity
    [safety_factor](name:safety_factor).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_upper_triangularity
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the upper triangularity
    $\delta_u$ of the poloidal flux-surface cross-section.
  documentation: 'This field provides the positive deviation from the nominal upper
    triangularity, forming the upper edge of an asymmetric confidence interval: $[\delta_u
    - \sigma_{\mathrm{low}},\; \delta_u + \sigma_{\mathrm{up}}]$, where $\sigma_{\mathrm{up}}
    \ge 0$ is the stored value. Asymmetric error bars occur when the equilibrium reconstruction
    posterior is skewed, for example near operational boundaries where triangularity
    is constrained by hardware geometry. Together with [lower_uncertainty_of_upper_triangularity](name:lower_uncertainty_of_upper_triangularity)
    the complete confidence interval is defined. See also [elongation](name:elongation)
    for a companion shaping quantity.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
