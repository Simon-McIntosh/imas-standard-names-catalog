- name: minimum_safety_factor
  kind: scalar
  status: active
  description: Minimum safety factor is the signed value of the safety-factor function
    on the closed magnetic flux surface where its magnitude is smallest. It is the
    scalar minimum value, not the surface location, and differs from fixed-locus values
    such as the magnetic-axis or edge safety factor.
  documentation: 'The minimum safety factor is the value of the [safety factor](name:safety_factor)
    on the nested closed magnetic flux surface where the magnitude of the safety factor
    is globally minimal. It characterizes magnetic-field-line winding: the signed
    toroidal-angle advance per poloidal circuit in flux coordinates $(\rho,\theta,\phi)$,
    with $\phi$ the toroidal angle of the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The quantity is defined by evaluating the signed safety-factor function at the
    surface where its absolute value is smallest:


    $$

    q_\mathrm{min} = q(\rho_\ast), \qquad \rho_\ast \in \operatorname*{arg\,min}_{0
    \le \rho \le 1} |q(\rho)|

    $$


    where $\rho$ is a monotonic flux-surface label normalized to 0 at the magnetic
    axis and 1 at the last closed flux surface, $q(\rho)$ is the signed safety-factor
    function, and $\rho_\ast$ labels a surface of minimum $|q|$. The result is independent
    of the particular monotonic label used, provided the same set of nested closed
    flux surfaces is covered.


    This is the scalar safety-factor value at the minimum, not the position of that
    surface; the corresponding flux-surface location is represented by [poloidal_magnetic_flux_at_minimum_safety_factor](name:poloidal_magnetic_flux_at_minimum_safety_factor).
    It differs from [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis)
    and [safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95),
    which evaluate the same safety-factor function at specified loci rather than minimizing
    it over the closed-surface domain.


    Sign convention: Positive when the toroidal angle advance of a magnetic field
    line is in the direction of increasing $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame as the poloidal angle $\theta$ increases in flux coordinates
    $(\rho,\theta,\phi)$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_minimum_safety_factor
  arguments:
  - name: safety_factor
    operator: minimum
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-value
    dd_documentation:
      leaf: Minimum q value
      parent_path: equilibrium/time_slice/global_quantities/q_min
      parent: Minimum q value and position
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Minimum q value and position.
      kind: template
- name: normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: active
  description: Radial flux-surface location of the surface of minimum safety-factor
    magnitude within the confined plasma, expressed by the normalized poloidal flux
    coordinate.
  documentation: 'The normalized poloidal flux coordinate at minimum safety factor
    is the value of the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)
    $\rho_{\mathrm{pol,norm}}$ on the closed flux surface where the magnitude of the
    [safety factor](name:safety_factor) $|q|$ reaches its global minimum within the
    confined plasma. It locates the minimum-$|q|$ surface relative to the magnetic
    axis and the last closed flux surface, independent of the dimensional scale of
    [poloidal magnetic flux](name:poloidal_magnetic_flux).


    The coordinate is defined by minimizing the safety-factor magnitude as a function
    of $\rho_{\mathrm{pol,norm}}$ and by applying the square-root normalization of
    poloidal magnetic flux between the magnetic axis and the last closed flux surface:


    $$

    \rho_{\mathrm{pol,norm},q_{\min}} = \operatorname*{arg\,min}_{0 \le \rho_{\mathrm{pol,norm}}
    \le 1} |q(\rho_{\mathrm{pol,norm}})|, \qquad \rho_{\mathrm{pol,norm}} = \sqrt{\frac{\psi
    - \psi_{\mathrm{axis}}}{\psi_{\mathrm{LCFS}} - \psi_{\mathrm{axis}}}}

    $$


    where $\rho_{\mathrm{pol,norm},q_{\min}}$ is the coordinate of the minimum-safety-factor-magnitude
    surface, $q(\rho_{\mathrm{pol,norm}})$ is the safety factor on the closed flux
    surface labeled by $\rho_{\mathrm{pol,norm}}$, $\psi$ is the poloidal magnetic
    flux of that surface, $\psi_{\mathrm{axis}}$ is the value at the magnetic axis,
    and $\psi_{\mathrm{LCFS}}$ is the value at the last closed flux surface.


    The minimization is over the closed-flux-surface interval of the confined plasma,
    including the magnetic-axis limit and the last closed flux surface and excluding
    open-field-line regions. If more than one flux surface has the same minimum value
    of $|q|$, the coordinate is not uniquely determined without an additional tie-breaking
    convention. Because the locus is defined by $|q|$ rather than signed $q$, changing
    the sign assigned to $q$ does not change this coordinate; [normalized toroidal
    flux coordinate at minimum safety factor](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor)
    gives the corresponding toroidal-flux coordinate, and [poloidal magnetic flux
    at minimum safety factor](name:poloidal_magnetic_flux_at_minimum_safety_factor)
    gives the poloidal flux on the same surface.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  - name:normalized_poloidal_flux_coordinate
  arguments:
  - name: normalized_poloidal_flux_coordinate
    operator: minimum_safety_factor
    operator_kind: locus
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/psi_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-psi_norm
    dd_documentation:
      leaf: Minimum q position in normalised poloidal flux
      parent_path: equilibrium/time_slice/global_quantities/q_min
      parent: Minimum q value and position
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Normalised poloidal flux coordinate (\u03C8_norm) at the location\
        \ of the minimum safety factor (q_min) within the plasma. Used to identify\
        \ the radial position of q_min on the flux surface grid."
      kind: llm
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: active
  description: Safety factor at the magnetic axis is the limiting field-line winding
    number on nested closed flux surfaces, giving toroidal turns per poloidal turn
    as the magnetic-axis limit is approached.
  documentation: 'The safety factor at the magnetic axis is the value of the [safety
    factor](name:safety_factor) on nested closed flux surfaces approaching the magnetic
    axis. It characterizes field-line winding by the number of toroidal turns per
    complete poloidal turn in the limiting surface.


    The magnetic-axis value is defined by


    $$

    q_{\mathrm{axis}} = \lim_{\psi \to \psi_{\mathrm{axis}}} \frac{d\Phi_{\mathrm{tor}}}{d\left(\Phi_{\mathrm{pol}}/2\pi\right)}

    $$


    where $\Phi_{\mathrm{tor}}$ is toroidal magnetic flux, $\Phi_{\mathrm{pol}}$ is
    poloidal magnetic flux, and $\psi$ is a flux-surface label approaching its magnetic-axis
    value $\psi_{\mathrm{axis}}$.


    It is a flux-surface limit, not a local magnetic pitch angle or local field-direction
    component. Unlike the [minimum safety factor](name:minimum_safety_factor), it
    is selected by the magnetic-axis locus rather than by the minimum of the safety-factor
    function; its local radial variation is related to [magnetic shear at the magnetic
    axis](name:magnetic_shear_at_magnetic_axis).


    Sign convention: Positive when the toroidal magnetic-field direction and the toroidal
    plasma-current direction are parallel in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:minimum_safety_factor
  - name:magnetic_shear_at_magnetic_axis
  arguments:
  - name: safety_factor
    operator: magnetic_axis
    operator_kind: locus
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_axis
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_axis
    dd_documentation:
      leaf: q at the magnetic axis
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Safety factor (q) at the magnetic axis, the value of q at the\
        \ innermost closed flux surface. A key MHD stability parameter \u2014 values\
        \ near rational numbers indicate potential for core-resonant modes such as\
        \ sawteeth."
      kind: llm
  - dd_path: summary/local/magnetic_axis/q/value
