- name: perturbed_pressure
  kind: scalar
  status: draft
  description: Isotropic trace-averaged pressure perturbation of a plasma kinetic
    distribution function, serving as the parent concept for species- and representation-specific
    perturbed pressure moments in gyrokinetic turbulence.
  documentation: 'The perturbed pressure is the scalar isotropic second moment of
    the deviation $\delta f_s$ of a kinetic distribution function from its local equilibrium,
    collapsing the parallel and perpendicular pressure fluctuations into a single
    scalar measure. It generalizes over the particle-frame and gyrocenter-frame representations,
    and may be expressed dimensionally or normalized to a local equilibrium reference.


    The principal defining relation for species $s$ is:


    $$

    \delta p_s = \frac{1}{3} \int m_s \left|\mathbf{v} - \mathbf{u}_s\right|^2 \delta
    f_s(\mathbf{v}) \, d^3v

    $$


    where $m_s$ is the species mass, $\mathbf{u}_s$ is the mean fluid velocity, and
    $\delta f_s$ is the non-equilibrium component of the distribution function. When
    divided by the local equilibrium pressure $p_{s,0}$, the result is the dimensionless
    form with unit 1.


    In gyrokinetic turbulence calculations, this moment is computed either from the
    perturbed particle distribution or from the guiding-center (gyrocenter) distribution.
    The particle_perturbed_pressure combines the parallel and two perpendicular velocity-moment
    contributions of the perturbed particle distribution into one scalar, while the
    gyrocenter_perturbed_pressure is the corresponding gyrocenter-frame moment that
    incorporates finite-Larmor-radius corrections via gyroaveraging. The explicitly
    normalized form is documented in normalized_perturbed_pressure.


    Sign convention: Positive when $\delta f_s$ increases the local pressure above
    the equilibrium value $p_{s,0}$.'
  unit: '1'
  physics_domain: turbulence
  links: []
- name: normalized_perturbed_pressure
  kind: scalar
  status: draft
  description: Dimensionless total isotropic pressure moment of the perturbed particle
    distribution function for a linear gyrokinetic eigenmode, normalized by the equilibrium
    species reference pressure.
  documentation: 'The normalized perturbed pressure is the dimensionless isotropic
    trace of the pressure tensor perturbation carried by the particle distribution
    function for a single plasma species in a linear gyrokinetic eigenmode. It captures
    the second velocity-space moment of the non-equilibrium part $\delta f_s$ combined
    symmetrically over parallel and perpendicular velocity directions and normalized
    to the equilibrium reference pressure. As the undifferentiated total, it is the
    parent abstraction for its directional decompositions; see [perturbed_pressure](name:perturbed_pressure)
    for the species-agnostic scalar concept.


    The normalized total pressure moment is:


    $$

    \tilde{p}_s = \frac{1}{p_\mathrm{ref}} \int \frac{m_s}{3}\left(v_\parallel^2 +
    v_\perp^2\right) \delta f_s \, d^3v

    $$


    where $m_s$ is the species mass, $v_\parallel$ is the velocity component along
    the equilibrium magnetic field, $v_\perp^2 = v_{\perp 1}^2 + v_{\perp 2}^2$ is
    the squared perpendicular speed summed over the two gyrophase directions, and
    $p_\mathrm{ref} = n_\mathrm{ref} T_\mathrm{ref}$ is the reference pressure. The
    factor $1/3$ imposes the isotropic trace average $\tilde{p}_s = (\tilde{p}_\parallel
    + 2\tilde{p}_\perp)/3$.


    This moment is computed in local linear gyrokinetic solvers as part of the perturbed-moment
    hierarchy. Its perpendicular projection is the [perpendicular_normalized_perturbed_pressure](name:perpendicular_normalized_perturbed_pressure)
    and the parallel particle-frame component is [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure);
    the corresponding gyrocenter-frame parent is [parallel_normalized_gyrocenter_perturbed_pressure](name:parallel_normalized_gyrocenter_perturbed_pressure).
    For linear eigenmodes the quantity is generally complex-valued, with phase set
    by the eigenmode normalization convention; reported magnitudes are normalization-dependent.


    Sign convention: Positive when the velocity-space moment of the perturbed particle
    distribution yields a net pressure enhancement above the equilibrium reference
    pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_pressure
  - name:perpendicular_normalized_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_pressure
  - name:parallel_normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: perturbed_pressure
    operator: normalized
    operator_kind: qualifier
- name: normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: draft
  description: Dimensionless first-order Bessel-weighted total pressure moment of
    the perturbed gyrocenter distribution from a linear gyrokinetic eigenmode, normalized
    to the equilibrium species pressure. It is the sum of the parallel and perpendicular
    J1-weighted pressure moments and encodes finite-Larmor-radius contributions to
    the gyrokinetic field response.
  documentation: 'The normalized perturbed pressure Bessel-1 moment is the finite-Larmor-radius-weighted
    total pressure response carried by the perturbed gyrocenter distribution of a
    linear gyrokinetic eigenmode for a given species. The first-order Bessel factor
    $J_1$ selects the component of the pressure moment associated with the gyroaverage
    gradient in the perpendicular plane, so this moment vanishes in the long-wavelength
    limit and complements the $J_0$-weighted gyroaveraged pressure that survives there.


    For species $s$ the dimensionless moment is the sum of its parallel and perpendicular
    parts, normalized to the equilibrium species pressure $p_s$:


    $$

    \widehat{P}^{(J_1)}_s = \widehat{P}^{(J_1)}_{\parallel s} + \widehat{P}^{(J_1)}_{\perp
    s} = \frac{1}{p_s}\int d^3v\, m_s\left(v_\parallel^2 + \frac{v_\perp^2}{2}\right)
    J_1(\lambda_s)\,\widetilde{F}_{g,s}

    $$


    where $p_s = n_s T_s$ is the equilibrium species pressure (in pascals), $m_s$
    is the species mass (in kilograms), $v_\parallel$ and $v_\perp$ are the velocities
    parallel and perpendicular to the equilibrium magnetic field (in meters per second),
    $d^3v$ is the velocity-space volume element, and $\widetilde{F}_{g,s}$ is the
    complex eigenfunction amplitude of the perturbed gyrocenter distribution. The
    Bessel argument is $\lambda_s = k_\perp v_\perp/\Omega_s$, with $k_\perp$ the
    magnitude of the wave vector perpendicular to the equilibrium field (in inverse
    meters) and $\Omega_s = |q_s| B/m_s$ the positive cyclotron frequency magnitude
    (in inverse seconds). The result is dimensionless because the integral is divided
    by $p_s$.


    In linear gyrokinetics the eigenmode is represented by complex amplitudes multiplying
    a harmonic dependence such as $\exp[i(\mathbf{k}\cdot\mathbf{R}-\omega t)]$, and
    this moment inherits the same arbitrary global phase and amplitude normalization
    as $\widetilde{F}_{g,s}$. A common convention fixes a reference field amplitude,
    for example the electrostatic potential, to be real; changing that reference phase
    multiplies all eigenmode moments by the same complex factor, so only relative
    phases between moments and fields carry physical meaning.


    Because the linear eigenmode amplitude is arbitrary, there is no universal absolute
    range; magnitudes are reported relative to whatever reference field amplitude
    the calculation adopts. At small $k_\perp$ the $J_1$-weighted moment is typically
    smaller than the corresponding unweighted or $J_0$-weighted pressure moment and
    grows toward them as $\lambda_s$ increases through order unity.


    Sign convention: Positive when the real part of the J1-weighted total pressure
    moment is in phase with the chosen real reference field amplitude, corresponding
    to an increase of the perturbed pressure relative to the equilibrium species pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode
  - name:normalized_gyrocenter_gyroaveraged_perturbed_pressure_of_gyrokinetic_eigenmode
  - name:parallel_normalized_perturbed_pressure_bessel_1
  - name:perpendicular_normalized_perturbed_pressure_bessel_1
  arguments:
  - name: normalized_perturbed_pressure
    operator: bessel_1
    operator_kind: unary_postfix
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure
    status: composed
- name: perpendicular_normalized_perturbed_pressure
  kind: scalar
  status: draft
  description: Dimensionless perpendicular-pressure perturbation obtained from the
    perpendicular kinetic-energy moment of a perturbed distribution function for a
    linear gyrokinetic eigenmode. It is normalized by a reference equilibrium thermal
    pressure for the relevant particle population.
  documentation: 'Perpendicular normalized perturbed pressure is the part of a pressure
    perturbation associated with particle kinetic energy perpendicular to the equilibrium
    magnetic field. In linear gyrokinetics it is a dimensionless eigenmode amplitude
    formed from the perpendicular second velocity moment of the perturbed distribution
    function and a chosen reference equilibrium thermal pressure.


    For a particle population $s$, a common particle-space definition is:


    $$

    \tilde{p}_{\perp,s} = \frac{1}{p_\mathrm{ref}} \int \frac{1}{2} m_s v_\perp^2\,\delta
    f_s\,d^3v

    $$


    where $\tilde{p}_{\perp,s}$ is dimensionless, $m_s$ is the particle mass in kg,
    $v_\perp$ is the speed perpendicular to the equilibrium magnetic field in m s$^{-1}$,
    $\delta f_s$ is the perturbed distribution-function amplitude with units of density
    per velocity-space volume, $d^3v$ is a velocity-space volume element with units
    $(\mathrm{m\,s}^{-1})^3$, and $p_\mathrm{ref}$ is a reference pressure in Pa.
    The numerator therefore has pressure units; for example, $p_\mathrm{ref}$ may
    be an equilibrium species pressure such as $n_\mathrm{ref}T_\mathrm{ref}$ when
    $T_\mathrm{ref}$ is expressed as energy per particle.


    This quantity is computed by taking the perpendicular kinetic-energy moment of
    the perturbed distribution function, or equivalently from evolved pressure moments
    in a gyrokinetic model. Together with the parallel pressure moment it describes
    pressure anisotropy in the perturbed distribution; for a gyrotropic perturbation,
    the scalar pressure perturbation is related to the parallel and perpendicular
    parts by $\tilde{p} = (\tilde{p}_\parallel + 2\tilde{p}_\perp)/3$.


    There is no normalization-independent typical magnitude for a linear eigenmode
    amplitude, because the absolute eigenfunction scale is set by the chosen normalization.
    Within a fixed normalization, the value indicates the local perpendicular thermal-pressure
    response relative to the reference equilibrium pressure.


    For complex linear eigenmodes, $\tilde{p}_\perp$ is generally a complex amplitude.
    Its phase is relative to the chosen eigenmode reference, so the sign of a real
    representation is not an independent physical convention; relative phases, ratios,
    and magnitudes within the same normalization carry the invariant information.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
  arguments:
  - name: normalized_perturbed_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
- name: perpendicular_normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: draft
  description: Dimensionless perpendicular pressure moment of the perturbed gyrocenter
    distribution for a linear gyrokinetic eigenmode, weighted by the first-order Bessel
    function J1 of the gyroaveraging argument. It is the Bessel-1 counterpart of the
    normalized perpendicular gyrocenter pressure perturbation.
  documentation: 'The perpendicular normalized perturbed pressure Bessel-1 moment
    is the perpendicular kinetic-energy moment of the perturbed gyrocenter distribution
    weighted by $J_1$. It represents the finite-Larmor-radius part of the perpendicular
    pressure response of a linear gyrokinetic eigenmode and is generally a complex
    eigenfunction amplitude.


    The normalized moment is defined by


    $$

    \hat{\delta p}_{\perp,J_1} = \frac{1}{n_\mathrm{ref} T_\mathrm{ref}} \int_{\mathbb{R}^3}
    \frac{m v_\perp^2}{2}\, J_1\!\left(k_\perp \rho(v_\perp)\right)\, \delta f_\mathrm{gc}(\mathbf{v})\,
    d^3v

    $$


    where $\hat{\delta p}_{\perp,J_1}$ is dimensionless, $n_\mathrm{ref}$ is the reference
    density in $\mathrm{m}^{-3}$, and $T_\mathrm{ref}$ is the reference particle energy
    so that $n_\mathrm{ref}T_\mathrm{ref}$ is a reference pressure. Here $m$ is the
    species mass in kg, $v_\perp$ is the speed perpendicular to the background magnetic
    field in $\mathrm{m\,s}^{-1}$, $J_1$ is the dimensionless first-order Bessel function,
    $k_\perp$ is the perpendicular wave-number magnitude in $\mathrm{m}^{-1}$, and
    $\rho(v_\perp)=v_\perp/|\Omega|$ is the velocity-dependent gyroradius in meters
    for cyclotron angular frequency $\Omega$ in $\mathrm{s}^{-1}$. The perturbed gyrocenter
    distribution $\delta f_\mathrm{gc}$ has units $\mathrm{s}^3\,\mathrm{m}^{-6}$,
    and the velocity-space measure $d^3v$ has units $\mathrm{m}^3\,\mathrm{s}^{-3}$;
    using velocity variables $(v_\parallel,v_\perp,\alpha)$, $d^3v = v_\perp\,dv_\perp\,d\alpha\,dv_\parallel$,
    with $v_\parallel$ the velocity along the background magnetic field and $\alpha$
    the gyroangle.


    This quantity is computed from the eigenmode distribution function by carrying
    out the velocity-space moment for each species and wave vector. It is not a directly
    measured thermodynamic pressure; experimental fluctuation measurements may constrain
    related density, temperature, or field perturbations, while this gyrocenter moment
    is obtained through gyrokinetic interpretation or simulation.


    The $J_1$ weighting separates a finite-Larmor-radius contribution from the unweighted
    or $J_0$-gyroaveraged perpendicular pressure moments, linking it to related quantities
    such as [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)
    and perpendicular_normalized_gyrocenter_gyroaveraged_pressure. The complementary
    parallel contribution is [parallel_normalized_perturbed_pressure_bessel_1](name:parallel_normalized_perturbed_pressure_bessel_1),
    and their combination gives the corresponding total Bessel-1 pressure moment.


    There is no normalization-independent typical magnitude for a linear eigenmode,
    because multiplying the eigenfunction by any nonzero complex constant rescales
    this moment. Values are therefore interpreted as relative complex amplitudes only
    after the eigenmode amplitude and phase have been fixed by the chosen normalization.


    Sign convention: Positive when, after the eigenmode phase has been fixed by the
    selected reference perturbation, the Bessel-weighted excess of perpendicular gyrocenter
    kinetic energy in the defining velocity-space integral is positive.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
  - name:parallel_normalized_perturbed_pressure_bessel_1
  arguments:
  - name: perpendicular_normalized_perturbed_pressure
    operator: bessel_1
    operator_kind: unary_postfix
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure_perpendicular
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure_perpendicular
    status: composed
- name: perturbed_vector_potential
  kind: scalar
  status: draft
  description: Perturbation of the electromagnetic vector potential associated with
    magnetic fluctuations in gyrokinetic turbulence. It denotes the vector-potential
    fluctuation as a physical field, not a specific component, projection, or normalization;
    normalized child quantities express this field after scaling by a reference electromagnetic
    quantity.
  documentation: 'Perturbed vector potential is the fluctuating part $\delta\mathbf{A}$
    of the electromagnetic vector potential associated with turbulence-scale magnetic
    perturbations. It is a vector quantity: it covers the full vector-potential perturbation
    and any explicitly defined component, projection, or normalized representation,
    without being limited to the parallel component or to a particular normalization.


    The magnetic perturbation associated with a vector-potential perturbation is defined
    by its curl:


    $$

    \delta\mathbf{B} = \nabla \times \delta\mathbf{A}

    $$


    where $\delta\mathbf{B}$ is the fluctuating magnetic field and $\nabla\times$
    is the spatial curl operator. The vector potential is gage dependent: adding the
    gradient of a scalar gage function to $\delta\mathbf{A}$ leaves $\delta\mathbf{B}$
    unchanged, so comparisons of $\delta\mathbf{A}$ require a consistent gage and,
    when applicable, a stated normalization.


    In gyrokinetic turbulence calculations, $\delta\mathbf{A}$ is obtained from the
    electromagnetic field equations coupled to particle or gyrocenter dynamics. Its
    parallel projection often controls magnetic-flutter transport across flux surfaces,
    while other components may be needed for a complete electromagnetic perturbation.
    Experimentally, it is usually inferred indirectly from magnetic-field fluctuation
    measurements or perturbative reconstruction rather than measured as an absolute
    potential.


    The physical vector potential has dimensions of magnetic field times length. For
    magnetic fluctuations of $10^{-5}-10^{-2}$ T over perpendicular scales of $10^{-3}-10^{-1}$
    m, representative unnormalized amplitudes are about $10^{-8}-10^{-3}$ T m. Normalized
    forms, such as [normalized perturbed vector potential](name:normalized_perturbed_vector_potential),
    are dimensionless and their numerical range depends on the reference electromagnetic
    scale.


    Sign convention: Positive when the reported component of $\delta\mathbf{A}$ points
    along the positive direction of its explicitly stated basis; in the right-handed
    cylindrical $(R,\phi,Z)$ frame this means $+\hat{R}$ for the radial component,
    $+\hat{\phi}$ in the direction of increasing toroidal angle $\phi$, and $+\hat{Z}$
    upward for the vertical component.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_vector_potential
  - name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:vector_potential
  sources:
  - id: derived:perturbed_vector_potential
    status: composed
- name: normalized_perturbed_vector_potential
  kind: vector
  status: draft
  description: Vector of the dimensionless perturbed electromagnetic vector potential
    in gyrokinetic turbulence, normalized by a reference electromagnetic scale, whose
    parallel projection drives magnetic-flutter transport across flux surfaces.
  documentation: "The normalized perturbed vector potential is the fluctuating electromagnetic\
    \ vector potential $\\delta\\mathbf{A}$ in gyrokinetic plasma turbulence, rendered\
    \ dimensionless by dividing by a reference scale $B_\\text{ref} \\rho_\\text{ref}$,\
    \ where $B_\\text{ref}$ is a reference magnetic-field strength and $\\rho_\\text{ref}$\
    \ is a reference ion gyroradius. In tokamak geometry the dominant electromagnetic\
    \ degree of freedom is the component aligned with the equilibrium field $\\hat{b}$,\
    \ which enters the gyrocenter equations of motion through the parallel canonical\
    \ momentum $p_\\parallel - q_s \\delta A_\\parallel / c$, where $q_s$ is the species\
    \ charge and $c$ is the speed of light (Gaussian units).\n\nThe normalized parallel\
    \ projection $\\tilde{A}_\\parallel$ is determined self-consistently by the gyrokinetic\
    \ parallel Amp\xE8re equation:\n\n$$\n-\\nabla_\\perp^2 \\tilde{A}_\\parallel\
    \ = \\frac{\\beta_\\text{ref}}{2} \\sum_s q_s \\int v_\\parallel \\tilde{f}_s\
    \ \\, d^3v\n$$\n\nwhere $\\beta_\\text{ref}$ is the reference plasma beta, $v_\\\
    parallel$ is the particle velocity component parallel to $\\hat{b}$, and $\\tilde{f}_s$\
    \ is the normalized perturbed distribution function.\n\nThe child [parallel_normalized_perturbed_vector_potential](name:parallel_normalized_perturbed_vector_potential)\
    \ provides the scalar parallel projection and directly governs the magnetic-flutter\
    \ energy transport quantified by [normalized_energy_flux_due_to_perturbed_parallel_vector_potential](name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential)\
    \ and the momentum transport described by [momentum_flux_due_to_perturbed_parallel_vector_potential](name:momentum_flux_due_to_perturbed_parallel_vector_potential).\
    \ This normalized vector is the dimensionless counterpart of the dimensional [perturbed_vector_potential](name:perturbed_vector_potential).\n\
    \nSign convention: Positive when $\\delta A_\\parallel$ is aligned with the equilibrium\
    \ magnetic field direction $\\hat{b}$, i.e., in the direction of increasing arc\
    \ length along the field line."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential
  - name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:perturbed_vector_potential
