      kind: llm
- name: normalized_perturbed_electrostatic_potential
  kind: scalar
  status: active
  description: Dimensionless complex eigenfunction for the normalized electrostatic-potential
    perturbation of a gyrokinetic mode.
  documentation: 'The normalized perturbed electrostatic potential is the dimensionless
    complex eigenfunction describing the scalar electric-potential part of a first-order
    gyrokinetic electromagnetic perturbation. Unlike the unnormalized [perturbed electrostatic
    potential](name:perturbed_electrostatic_potential), it is expressed relative to
    a reference potential scale and excludes the inductive vector-potential contribution.


    $$

    \widehat{\phi} = \frac{\widetilde{\phi}}{\phi_{\mathrm{ref}}}

    $$


    where $\widehat{\phi}$ is the normalized eigenfunction, $\widetilde{\phi}$ is
    the complex perturbed electrostatic potential in volts, and $\phi_{\mathrm{ref}}$
    is the positive reference potential in volts. The normalization convention is
    part of the eigenmode definition. The representative child [normalized perturbed
    electrostatic potential amplitude](name:normalized_perturbed_electrostatic_potential_amplitude)
    is the modulus $|\widehat{\phi}|$ and therefore omits the perturbation phase.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_electrostatic_potential
  - name:normalized_perturbed_electrostatic_potential_amplitude
  arguments:
  - name: perturbed_electrostatic_potential
    operator: normalized
    operator_kind: qualifier
- name: normalized_perturbed_electrostatic_potential_amplitude
  kind: scalar
  status: active
  description: Normalized perturbed electrostatic potential amplitude is the modulus
    of the complex normalized electrostatic-potential perturbation eigenfunction for
    a gyrokinetic mode. It retains the phase-independent amplitude while discarding
    the arbitrary complex phase.
  documentation: 'Normalized perturbed electrostatic potential amplitude is the modulus
    of the complex normalized electrostatic-potential perturbation eigenfunction for
    a gyrokinetic mode. It represents the phase-independent strength of the electrostatic
    potential component of the mode and excludes the arbitrary complex phase of the
    eigenfunction.


    For a complex [normalized perturbed electrostatic potential](name:normalized_perturbed_electrostatic_potential)
    eigenfunction $\delta\hat{\phi}$, the amplitude $A_{\phi_N}$ is defined by its
    complex modulus:


    $$

    A_{\phi_N} = |\delta\hat{\phi}| = \sqrt{\left(\operatorname{Re}\delta\hat{\phi}\right)^2
    + \left(\operatorname{Im}\delta\hat{\phi}\right)^2}

    $$


    where $\operatorname{Re}\delta\hat{\phi}$ and $\operatorname{Im}\delta\hat{\phi}$
    are the real and imaginary parts of the same normalized eigenfunction, and $A_{\phi_N}$
    is the corresponding dimensionless amplitude.


    This quantity is not the complex eigenfunction itself and contains no phase information.
    Its value is non-negative and depends on the normalization chosen for $\delta\hat{\phi}$,
    so it denotes relative mode structure within that normalization rather than an
    independently fixed absolute scale.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_electrostatic_potential
  arguments:
  - name: normalized_perturbed_electrostatic_potential
    operator: amplitude
    operator_kind: unary_postfix
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/fields/phi_potential_perturbed_weight
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-fields-phi_potential_perturbed_weight
