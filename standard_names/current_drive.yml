- name: toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row
  kind: scalar
  status: draft
  description: Discrete set of toroidal refractive index values, n_tor = k_tor * c
    / omega, launched by a single row of a lower hybrid antenna, representing the
    sampled toroidal wavenumber spectrum coupled into the plasma. Each value characterizes
    the toroidal phase velocity of the wave relative to the speed of light at the
    antenna mouth.
  documentation: "The toroidal refractive index $n_\\mathrm{tor}$ for a lower hybrid\
    \ wave is defined as\n$$n_\\mathrm{tor} = \\frac{k_\\phi c}{\\omega},$$\nwhere\
    \ $k_\\phi$ is the toroidal component of the wave vector, $c$ is the speed of\
    \ light in vacuum, and $\\omega = 2\\pi f$ is the angular frequency of the wave.\
    \ This quantity is dimensionless and is sometimes written $n_\\phi$ to emphasize\
    \ the toroidal direction in the right-handed cylindrical $(R, \\phi, Z)$ frame.\n\
    \nThe toroidal refractive index $n_\\mathrm{tor}$ differs in general from the\
    \ parallel refractive index $n_\\parallel = k_\\parallel c / \\omega$, which involves\
    \ the component of the wave vector along the local magnetic field. The two coincide\
    \ only in the limit of a purely toroidal magnetic field. For realistic tokamak\
    \ geometry, $n_\\parallel$ is related to $n_\\mathrm{tor}$ through the magnetic\
    \ pitch angle and varies as the wave propagates from the antenna into the plasma.\n\
    \nThis standard name records the discrete spectrum of $n_\\mathrm{tor}$ values\
    \ launched by a single antenna row \u2014 i.e., the set of toroidal refractive\
    \ index values (bins or sample points) that describe the power distribution in\
    \ toroidal wavenumber space at the antenna aperture. It is not itself a power-weighted\
    \ distribution; the associated power weighting at each $n_\\mathrm{tor}$ value\
    \ is carried by the companion quantity `lower_hybrid_wave_power_per_toroidal_refractive_index`.\
    \ Together they fully characterize the toroidal wavenumber spectrum launched by\
    \ the row.\n\nTypical values of $|n_\\mathrm{tor}|$ for lower hybrid current drive\
    \ (LHCD) antennas lie in the range $1.5$ to $4.0$. The sign of $n_\\mathrm{tor}$\
    \ determines the direction of wave propagation along $\\phi$ and, after conversion\
    \ to $n_\\parallel$ via the local pitch angle, governs which electron population\
    \ (co- or counter-current-drive) absorbs the wave. Lower hybrid wave accessibility\
    \ in the plasma interior imposes a lower bound on $|n_\\parallel|$ that depends\
    \ on plasma density and magnetic field strength; launcher design aims to match\
    \ $n_\\mathrm{tor}$ to the accessible and resonant range for efficient current\
    \ drive."
  unit: '1'
  physics_domain: current_drive
  links:
  - name:wave_driven_current_due_to_wave_driven_current_drive
