- name: gap_of_antenna_strap
  kind: scalar
  status: draft
  description: Perpendicular clearance from the rear surface of an ICRH antenna strap
    conductor to the conducting wall directly behind it.
  documentation: 'The gap of an antenna strap is the perpendicular clear distance
    from the rear surface of an ion-cyclotron-range-of-frequency antenna strap conductor
    to the conducting wall directly behind it, on the side facing away from the plasma.
    It is a mechanical clearance that helps set the local electromagnetic coupling
    between the strap and the back conductor.


    In a local parallel-plate approximation, the rear-surface capacitance per unit
    strap length is estimated by


    $$

    C'' = \frac{\epsilon_0 w_s}{d}

    $$


    where $C''$ is capacitance per unit strap length in F m$^{-1}$, $\epsilon_0$ is
    the vacuum permittivity in F m$^{-1}$, $w_s$ is the effective strap width in m,
    and $d$ is the antenna-strap gap in m. This approximation neglects fringing fields
    and nearby conductors, so it gives physical intuition rather than a complete antenna
    model: increasing $d$ reduces this capacitive coupling, while decreasing $d$ increases
    it.


    The gap is normally obtained from the antenna mechanical design or from dimensional
    survey of the assembled strap and back conductor. Full RF analyzes use the complete
    conductor geometry, dielectric environment, and plasma-facing structures, so the
    gap should be interpreted as one local geometric input rather than as a stand-alone
    predictor of loading or resonance.


    This name denotes the same rear-surface-to-back-wall clearance described by [back_surface_gap_of_antenna_strap](name:back_surface_gap_of_antenna_strap)
    and distance_of_antenna_strap; the wording here emphasizes the clearance as a
    gap. It differs from strap body dimensions such as [thickness_of_antenna_strap](name:thickness_of_antenna_strap),
    [inner_radius_of_antenna_strap](name:inner_radius_of_antenna_strap), and [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap),
    which describe the conductor itself rather than the empty space behind it.


    Typical values are antenna-design specific and should not be inferred from a universal
    plasma scaling. They are usually engineering clearances specified in meters, commonly
    on the millimeter-to-centimeter scale, with the final value constrained by voltage
    holdoff, mechanical tolerance, cooling layout, and RF-circuit requirements.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:back_surface_gap_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:inner_radius_of_antenna_strap
  - name:outer_radius_of_antenna_strap
- name: height_of_antenna_strap
  kind: scalar
  status: draft
  description: Full vertical height of the rectangular cross-section of an ICRH antenna
    strap conductor element, measured along the poloidal direction.
  documentation: 'The height of an antenna strap is the full vertical (poloidal) extent
    of the rectangular cross-section of the current-carrying strap conductor in an
    ion cyclotron resonance heating (ICRH) antenna system. In ICRH antennas, the strap
    is the active radiating element that launches electromagnetic waves near the ion
    cyclotron frequency; its cross-sectional geometry governs current distribution,
    RF resistance, and coupling efficiency to the plasma.


    For a rectangular strap cross-section, the three characteristic dimensions are
    height (this quantity), [width](name:width_of_antenna_strap) measured along the
    toroidal direction, and [thickness](name:thickness_of_antenna_strap) perpendicular
    to the strap plane. Height is measured along the vertical direction $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius,
    $\phi$ is the toroidal angle, and $Z$ is the vertical coordinate. For strap conductors
    with annular cross-sections, the analogous radial dimensions are the [outer radius](name:outer_radius_of_antenna_strap)
    and [inner radius](name:inner_radius_of_antenna_strap) of the conductor.


    Typical ICRH strap heights range from a few centimeters to approximately 50 cm
    depending on antenna design and machine geometry.


    Sign convention: Positive when measured in the direction of increasing $Z$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:outer_radius_of_antenna_strap
  - name:inner_radius_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/height
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/height
    status: composed
- name: launched_power_of_electron_cyclotron_launcher
  kind: scalar
  status: draft
  description: Net electron cyclotron radio-frequency power crossing from a single
    launcher into the vacuum vessel, defined as forward minus reflected power at the
    launcher aperture or reference plane. Evaluated after transmission-line and launcher
    losses and before any plasma absorption, reflection, or shine-through.
  documentation: 'Launched power of an electron cyclotron launcher is the net radio-frequency
    wave power delivered by one electron cyclotron launcher across its launch aperture
    into the vacuum vessel. It is a boundary power for electron-cyclotron heating
    and current-drive calculations, defined as the forward power minus the power reflected
    back at the launcher aperture or reference plane, and before any plasma absorption,
    reflection from cutoff or resonance regions, wall interaction, or shine-through.


    For a launcher represented by one or more launched wave beams, the launcher launched
    power is the sum of the launched powers of those beams:


    $$

    P_{\mathrm{EC,launched}}^{\mathrm{launcher}} = \sum_b P_{\mathrm{launched},b}

    $$


    where $P_{\mathrm{launched},b}$ is the launched power of beam $b$ in watts, taken
    after transmission losses and before plasma interaction. Equivalently, in terms
    of the directional power components at the reference plane, $P_{\mathrm{EC,launched}}^{\mathrm{launcher}}
    = P_{\mathrm{forward}} - P_{\mathrm{reflected}}$, with all terms in watts.


    This power is typically derived from gyrotron or source output power corrected
    for transmission-line, window, switch, and launcher losses, or inferred from calibrated
    radio-frequency power monitors near the launcher. It is commonly used as the input
    power for ray-tracing or beam-tracing models; subsequent absorbed, reflected,
    or shine-through power is accounted for separately.


    Typical values for a single electron cyclotron launcher are of order $1 \times
    10^5$ to $2 \times 10^6$ W in present tokamak systems, with multi-beam or high-power
    launchers reaching several $10^6$ W.


    Sign convention: Positive when electron cyclotron wave power flows from the launcher
    into the vacuum vessel.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_electron_cyclotron_launcher
  - name:total_power_of_electron_cyclotron_launcher
  - name:launched_power_of_wave_beam
  sources:
  - id: dd:ec_antennas/antenna/power_launched
    dd_path: ec_antennas/antenna/power_launched
    status: attached
  - id: dd:ec_launchers/launcher/power_launched
    dd_path: ec_launchers/launcher/power_launched
    status: composed
- name: length_of_antenna_strap
  kind: scalar
  status: draft
  description: Base length of the oblique trapezoidal cross-section used to represent
    an ICRH antenna strap conductor. It is a reference edge dimension of the conductor
    section, not the slant height of an inclined side.
  documentation: 'Length of antenna strap is the reference base dimension of an oblique
    trapezoidal cross-section used to describe an ion-cyclotron-range-of-frequencies
    antenna strap conductor. It identifies the straight base edge of the section and
    should not be interpreted as the sloping side length, slant height, or inclined-face
    chord.


    For an oblique strap section, this length is only one geometric parameter. The
    full non-rectangular outline also depends on the [width](name:width_of_antenna_strap),
    [thickness](name:thickness_of_antenna_strap), and inclination angles such as $\alpha$
    in [alpha_angle_of_antenna_strap](name:alpha_angle_of_antenna_strap) and $\beta$
    in angle_of_antenna_strap. No universal $1/\cos\alpha$ or similar conversion is
    implied unless the angle reference directions and the selected base edge are specified
    by the geometric construction.


    In practice the value is taken from antenna engineering drawings, CAD geometry,
    or metrology of the strap conductor as the distance between the endpoints of the
    chosen base edge of the physical cross-section. It is used with the other strap
    dimensions and angles in electromagnetic, thermal, and structural models of ICRH
    antenna conductors.


    Typical values are device- and design-dependent, but base lengths for conducting
    ICRH strap cross-sections commonly lie in the range 0.02-0.5 m, with larger values
    for high-power antenna straps and smaller values for compact test structures.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:alpha_angle_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/length
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/length
    status: composed
- name: length_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Curvilinear arc length measured along a beam-tracing ray or beam trajectory,
    used to parameterize propagation from a chosen reference point through vacuum
    and plasma regions.
  documentation: 'Length of a beam-tracing beam is the accumulated geometric distance
    along the modeled ray or beam centerline from a chosen reference point, usually
    the launch point. It is an arc-length coordinate on the propagation trajectory
    and is independent of the particular parameter used to integrate the ray equations.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    in meters, $\phi$ is toroidal angle in radians, and $Z$ is vertical height in
    meters, the arc length to a point $P$ on the trajectory $\Gamma$ is


    $$

    \ell(P) = \int_{\Gamma_0}^{P} d\ell'' = \int_{\Gamma_0}^{P} \sqrt{dR^2 + R^2 d\phi^2
    + dZ^2}

    $$


    where $\Gamma_0$ is the reference point on the ray, $d\ell''$ is an infinitesimal
    path length in meters, and the differentials are taken along the same trajectory.


    In beam-tracing calculations, this coordinate is computed by integrating the ray
    path determined by the local dispersion relation and the wave vector $\mathbf{k}$;
    $\mathbf{k}$ has units of radians per meter, while the angular frequency $\omega$
    has units of radians per second. The length coordinate provides the independent
    distance variable for quantities such as wave-vector components, absorption, and
    power evolution along the beam.


    The physically allowed range is $\ell \ge 0\,\mathrm{m}$, with $\ell = 0\,\mathrm{m}$
    at the chosen reference point. There is no device-independent upper bound or universal
    typical range: the final value is set by the selected trajectory endpoint and
    may include launch, vacuum, edge, core-plasma, reflection, or cutoff portions
    of the path.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:length_of_electron_cyclotron_beam
  - name:absorbed_power_of_beam_tracing_beam
  - name:toroidal_wave_vector_of_beam_tracing_beam
  - name:initial_power_of_beam_tracing_beam
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/length
    dd_path: waves/coherent_wave/beam_tracing/beam/length
    status: composed
- name: maximum_angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Upper mechanical travel limit for the signed rotation angle of an electron-cyclotron
    launcher mirror about its movement axis.
  documentation: 'The maximum angle of an electron-cyclotron launcher mirror is the
    upper endpoint of the allowed signed rotation interval for the mirror steering
    actuator. It is referenced to the launcher mirror reference orientation and, together
    with [minimum_angle_of_electron_cyclotron_launcher_mirror](name:minimum_angle_of_electron_cyclotron_launcher_mirror),
    bounds the permitted values of the instantaneous [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror).
    This is a hardware constraint rather than a plasma quantity.


    The admissible mirror rotation is constrained by


    $$

    \alpha_{\min} \leq \alpha \leq \alpha_{\max}

    $$


    where $\alpha_{\max}$ is this maximum angle in rad, $\alpha_{\min}$ is the corresponding
    lower mechanical limit in rad, and $\alpha$ is the instantaneous mirror rotation
    angle in rad.


    The value is established from the launcher mechanical design, actuator travel,
    clearances, and commissioning calibration. During operation it is used by steering
    control and protection logic to reject commanded or measured mirror angles outside
    the allowed interval. The mirror angle affects the launch direction of the electron-cyclotron
    beam, but the mapping from mirror rotation to beam direction is specific to the
    launcher optics.


    Typical limits are device-specific. For many steerable electron-cyclotron mirrors
    the allowed excursion is of order 0.1-1 rad from the reference orientation, while
    narrower or broader ranges can occur depending on actuator geometry and mechanical
    stops; the signed upper limit must satisfy $\alpha_{\max} \geq \alpha_{\min}$.


    Sign convention: Positive when the mirror rotation is counter-clockwise about
    the movement axis as seen by an observer for whom the positive mirror movement-direction
    vector points toward the observer.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:minimum_angle_of_electron_cyclotron_launcher_mirror
  - name:angle_of_electron_cyclotron_launcher_mirror
  arguments:
  - name: angle_of_electron_cyclotron_launcher_mirror
    operator: maximum
    operator_kind: qualifier
  sources:
  - id: dd:ec_launchers/mirror/movement/rotation_angle_max
    dd_path: ec_launchers/mirror/movement/rotation_angle_max
    status: composed
- name: neutral_beam_energy
  kind: scalar
  status: draft
  description: Kinetic energy per atom of the full-energy injected neutral beam component,
    inherited from the ion-source acceleration voltage before neutralization. It is
    not an abundance-weighted average over half- or third-energy molecular-dissociation
    components.
  documentation: 'Neutral beam energy is the kinetic energy carried by one atom in
    the full-energy component of an injected neutral beam. The atom is neutral at
    injection, but its kinetic energy is set while its charged precursor is accelerated
    before neutralization. This quantity denotes the full-energy atom value used as
    the characteristic fast-particle birth energy.


    For neutrals produced from an atomic precursor ion, the full-energy value is related
    to the acceleration voltage by


    $$

    E_\mathrm{NBI} = \frac{q_\mathrm{acc} V_\mathrm{acc}}{e}

    $$


    where $E_\mathrm{NBI}$ is expressed in eV, $q_\mathrm{acc}$ is the charge of the
    precursor ion during acceleration, $V_\mathrm{acc}$ is the acceleration voltage,
    and $e$ is the elementary charge. The injected neutral atom has zero net charge
    after neutralization; $q_\mathrm{acc}$ refers only to the charged acceleration
    stage. For a singly charged atomic precursor, the numerical value of $E_\mathrm{NBI}$
    in eV equals $V_\mathrm{acc}$ in volts.


    In practice, this energy is set from the accelerator voltage and the selected
    beam species, and may be checked using beamline spectroscopy, calorimetry, or
    source voltage and current measurements. If molecular ions are accelerated and
    then dissociate, their atoms appear as lower-energy spectral components, typically
    near $E_\mathrm{NBI}/2$ or $E_\mathrm{NBI}/3$ for diatomic or triatomic singly
    charged precursors. Those components and their fractions describe beam composition;
    this scalar remains the full-energy atom value, not a mean over all neutral particles.


    Typical full-energy values are $2\times10^4$-$1.2\times10^5$ eV for many positive-ion
    hydrogen or deuterium heating beams, $1\times10^5$-$2\times10^5$ eV for higher-energy
    systems, and up to about $1\times10^6$ eV for large negative-ion neutral beam
    systems.'
  unit: eV
  physics_domain: auxiliary_heating
  links:
  - name:beam_energy_fraction_of_neutral_beam_injector
  sources:
