- name: perpendicular_component_of_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: Gyrobohm-normalized perpendicular component of the toroidal angular
    momentum flux driven by the perturbed electrostatic potential, summed over all
    particle species and flux-surface- and time-averaged. The perpendicular direction
    is perpendicular to the equilibrium magnetic field unit vector within the flux
    surface.
  documentation: 'This quantity represents the turbulent radial flux of toroidal angular
    momentum carried in the direction perpendicular to the equilibrium magnetic field
    $\mathbf{B}_0$ within a flux surface, arising from electrostatic fluctuations
    $\delta\phi$. It is summed over all particle species and averaged over the flux
    surface and time.


    The unnormalized perpendicular toroidal momentum flux density from species $s$
    is

    $$\Pi_{\perp,s}^{(\delta\phi)} = m_s \int R\, v_\phi \, (\mathbf{v}_{E} \cdot
    \hat{e}_\perp) \, f_{1,s}^{(\delta\phi)} \, d^3v,$$

    where $R$ is the major radius, $v_\phi$ is the toroidal velocity component, $\mathbf{v}_E$
    is the $\mathbf{E}\times\mathbf{B}$ drift velocity driven by $\delta\phi$, $\hat{e}_\perp$
    is the unit vector perpendicular to $\mathbf{B}_0$ in the radial-transport direction
    within the flux surface, and $f_{1,s}^{(\delta\phi)}$ is the perturbed distribution
    function driven by $\delta\phi$.


    The stored dimensionless quantity is

    $$\hat{\Pi}_\perp^{(\delta\phi)} = \frac{\sum_s \langle \Pi_{\perp,s}^{(\delta\phi)}
    \rangle_{\psi,t}}{\Pi_{\mathrm{gB}}},$$

    where $\langle \cdots \rangle_{\psi,t}$ denotes flux-surface and time averaging.
    The gyrobohm momentum flux normalization is

    $$\Pi_{\mathrm{gB}} = n_{\mathrm{ref}} \, m_{\mathrm{ref}} \, v_{\mathrm{th,ref}}^2
    \, R_{\mathrm{ref}} \left(\frac{\rho_{\mathrm{ref}}}{L_{\mathrm{ref}}}\right)^2,$$

    with $n_{\mathrm{ref}}$ the reference density, $m_{\mathrm{ref}}$ the reference
    mass, $v_{\mathrm{th,ref}} = \sqrt{T_{\mathrm{ref}}/m_{\mathrm{ref}}}$ the reference
    thermal speed, $R_{\mathrm{ref}}$ the reference major radius, $\rho_{\mathrm{ref}}
    = m_{\mathrm{ref}} v_{\mathrm{th,ref}} / (e B_{\mathrm{ref}})$ the reference Larmor
    radius, and $L_{\mathrm{ref}}$ a macroscopic reference length. This normalization
    renders the quantity dimensionless (unit 1).


    Together with the parallel component, this quantity completes the decomposition
    of the electrostatic toroidal momentum flux into components parallel and perpendicular
    to $\mathbf{B}_0$. The electromagnetic analog driven by the perturbed parallel
    vector potential $\delta A_\parallel$ is the perpendicular component attributed
    to that field.


    Typical gyrobohm-normalized values in nonlinear gyrokinetic simulations of ion-temperature-gradient
    turbulence range from $10^{-3}$ to $10^{-1}$, depending on rotation shear and
    driving gradients. The electrostatic perpendicular channel often dominates intrinsic
    rotation drive in electrostatic turbulence regimes.


    Sign convention: Positive when the perpendicular toroidal angular momentum flux
    is directed radially outward (increasing minor radius) with the toroidal velocity
    component in the direction of increasing toroidal angle $\phi$.'
  unit: '1'
  physics_domain: turbulence
