- name: toroidal_deuterium_tritium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal velocity of the fictitious DT single-species (atomic mass
    2.5 amu) at the H-mode pedestal, used in simulations treating the deuterium-tritium
    fuel as a single ion fluid.
  documentation: 'The fictitious DT species is a single-fluid representation of the
    deuterium-tritium fuel mixture, assigned an atomic mass of 2.5 amu (the arithmetic
    mean of deuterium mass 2 and tritium mass 3), and treated as a single ion population
    in transport and gyrokinetic simulations. The toroidal velocity of this species
    at the pedestal quantifies the bulk toroidal rotation of the fuel ions within
    the steep-gradient edge transport barrier characteristic of H-mode plasmas.


    The toroidal component is the projection of the DT ion fluid velocity onto the
    toroidal unit vector $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$
    frame:


    $$

    v_\phi = \mathbf{v}_\mathrm{DT} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{DT}$ is the DT ion fluid velocity vector.


    Toroidal rotation at the pedestal contributes to the $E \times B$ shear layer
    that suppresses turbulent transport and sustains the H-mode confinement barrier.
    Ion toroidal velocities are inferred from Doppler shifts in charge exchange recombination
    spectroscopy (CXRS) emission lines on trace impurity species and corrected to
    the DT fuel population via neoclassical offsets. This pedestal evaluation belongs
    to a spatial family that includes [toroidal_deuterium_tritium_velocity_at_magnetic_axis](name:toroidal_deuterium_tritium_velocity_at_magnetic_axis)
    and [toroidal_deuterium_tritium_velocity_at_internal_transport_barrier](name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier);
    the resolved deuterium counterpart at the same location is [toroidal_deuterium_velocity_at_pedestal](name:toroidal_deuterium_velocity_at_pedestal).


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_tritium_velocity_at_magnetic_axis
  - name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier
  - name:toroidal_deuterium_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/deuterium_tritium/value
    dd_path: summary/local/pedestal/velocity_phi/deuterium_tritium/value
    status: composed
- name: toroidal_deuterium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of the deuterium ion fluid velocity evaluated at
    the H-mode pedestal, defined as the projection of the deuterium flow along increasing
    toroidal angle phi in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal deuterium velocity at the pedestal is the toroidal component
    of the deuterium ion fluid velocity evaluated in the steep-gradient edge region
    that forms the H-mode pedestal. It represents the projection of the species flow
    along the toroidal basis direction in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The component is defined by projecting the local deuterium fluid velocity onto
    the toroidal unit vector:


    $$

    v_{\phi,D,\mathrm{ped}} = \mathbf{v}_{D,\mathrm{ped}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{D,\mathrm{ped}}$ is the deuterium ion fluid velocity at the
    pedestal in m.s^-1, $\hat{\phi}$ is the dimensionless unit vector in the direction
    of increasing toroidal angle $\phi$, and $v_{\phi,D,\mathrm{ped}}$ is the toroidal
    component in m.s^-1.


    In practice this quantity is inferred from spectroscopic ion Doppler measurements,
    momentum-balance analysis, or edge transport interpretation. Measurements often
    involve impurity-ion rotation and require physics assumptions to relate the observed
    species to deuterium, including collisional coupling, neoclassical effects, and
    radial electric-field constraints; the pedestal location is identified from the
    local steep-gradient edge region.


    Typical pedestal toroidal deuterium velocities are strongly scenario dependent.
    Many edge analyzes find values from near 0 to several $10^4$ m.s^-1 in magnitude,
    while plasmas with strong external torque or large intrinsic rotation can approach
    order $10^5$ m.s^-1; either sign is possible depending on the rotation direction.


    Sign convention: Positive when the deuterium ion fluid velocity at the pedestal
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_magnetic_axis
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_tritium_velocity_at_pedestal
