name: normalized_toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
status: draft
cocos_transformation_type: one_like
description: Normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}$ of the
  flux surface on which a neoclassical tearing mode (NTM) island chain is centered.
documentation: "The normalized toroidal flux coordinate $\\rho_{\\mathrm{tor,norm}}\
  \ = \\sqrt{\\Phi / \\Phi_{\\mathrm{edge}}}$, where $\\Phi$ is the toroidal magnetic\
  \ flux enclosed by the flux surface and $\\Phi_{\\mathrm{edge}}$ its value at the\
  \ last closed flux surface, identifies the radial location of an NTM island O-point.\
  \ NTMs are resistive MHD instabilities seeded by finite-$\\beta$ perturbations that\
  \ grow via the loss of the neoclassical bootstrap current inside the island; the\
  \ radial position determines the resonant $q = m/n$ surface and hence the impact\
  \ on confinement. Typical NTM locations fall in the range $\\rho_{\\mathrm{tor,norm}}\
  \ \\approx 0.4$\u2013$0.8$, with $m/n = 3/2$ modes near $\\rho_{\\mathrm{tor,norm}}\
  \ \\sim 0.55$ and $m/n = 2/1$ modes near $\\rho_{\\mathrm{tor,norm}} \\sim 0.75$\
  \ in standard H-mode tokamak scenarios. The position is inferred from electron-cyclotron\
  \ emission (ECE) radiometry, soft-X-ray arrays, or MHD equilibrium reconstruction\
  \ constrained by magnetic diagnostics. See also the companion mode numbers and the\
  \ un-normalized radial coordinate."
