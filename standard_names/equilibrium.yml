- name: vertical_magnetic_field
  kind: scalar
  status: active
  description: "Vertical magnetic-field component of the local total magnetic induction,\
    \ resolved along increasing vertical height in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The vertical magnetic field $B_Z$ is the signed component of the
    local total [magnetic induction](name:magnetic_field) resolved along the vertical
    direction. It represents directional field strength rather than the full magnetic-induction
    vector or its magnitude.


    The vertical component is defined by


    $$

    B_Z = \mathbf{B} \cdot \hat{Z}

    $$


    where $\mathbf{B}$ is the local total magnetic induction, $\hat{Z}$ is the unit
    vector in the direction of increasing vertical height, and $B_Z$ is the resulting
    vertical component.


    This quantity is defined locally in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It does not select a plasma, vacuum, perturbed, or other source contribution,
    and it has no restriction to a particular region or species. At a point it is
    the local projection, not a sum or integral over a region, source, or population;
    when a finite sensing volume defines the value, the projected component is averaged
    over that volume.


    It is distinct from the [radial magnetic field](name:radial_magnetic_field) and
    [toroidal magnetic field](name:toroidal_magnetic_field), which are projections
    onto the other cylindrical directions, and from the [poloidal magnetic field](name:poloidal_magnetic_field),
    which is the magnitude in the poloidal plane. Together, these component quantities
    resolve the local [magnetic induction](name:magnetic_field) in the cylindrical
    frame.


    Sign convention: Positive when $B_Z$ points in the direction of increasing vertical
    height $Z$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field
  - name:poloidal_magnetic_field
  sources:
  - dd_path: edge_profiles/ggd/b_field/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_profiles.html#edge_profiles-ggd-b_field-z
