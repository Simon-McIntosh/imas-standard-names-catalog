name: gyrokinetic_eigenmode_normalized_gyrocenter_parallel_current_density_moment_gyroaveraged
status: draft
cocos_transformation_type: one_like
description: Gyroaveraged normalized parallel current density moment of the perturbed
  gyrocenter distribution for a gyrokinetic eigenmode.
documentation: "This quantity represents the gyroaveraged first velocity-space moment,\
  \ weighted by $v_\\parallel$, of the perturbed gyrocenter distribution function\
  \ $\\delta \\hat{f}_s$ for species $s$ and a given eigenmode at wavevector $\\mathbf{k}_\\\
  perp$. The gyroaveraging operation replaces the exact Larmor-orbit integration with\
  \ a Bessel-function weighting, effectively smoothing over the finite-Larmor-radius\
  \ scale; in spectral gyrokinetic codes this corresponds to multiplication by $J_0(k_\\\
  perp \\rho_s)$ where $J_0$ is the zeroth-order Bessel function of the first kind,\
  \ $k_\\perp$ is the perpendicular wavenumber, and $\\rho_s$ is the species thermal\
  \ Larmor radius. The moment is normalized to code-specific reference quantities\
  \ (typically $n_{\\mathrm{ref}} v_{\\mathrm{th,ref}}$) so the result is dimensionless.\
  \ It is a key diagnostic of electromagnetic effects in gyrokinetic simulations,\
  \ as parallel current perturbations couple to the perturbed parallel vector potential\
  \ $\\delta A_\\parallel$ through Amp\xE8re's law. Codes such as GENE, GS2, and CGYRO\
  \ output this moment for eigenvalue and initial-value analyses. See also the non-gyroaveraged\
  \ counterpart and the Bessel-weighted variants for detailed finite-Larmor-radius\
  \ analysis."
