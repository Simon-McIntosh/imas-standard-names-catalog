- name: fast_ion_power_density
  kind: scalar
  status: active
  description: Net non-transport volumetric energy source rate for the fast-ion channel,
    giving local RF-wave power deposited into nonthermal fast ions and summed over
    included species and charge states.
  documentation: 'Fast ion power density is the local rate per unit volume at which
    coherent RF wave-particle interactions add energy to the nonthermal fast-ion channel.
    It is the absorbed-wave contribution associated with the broader [ion power density](name:ion_power_density),
    while excluding energy deposited into bulk thermal ions or electrons and spatial
    transport terms.


    The species- and charge-state-summed quantity is defined by


    $$

    P_{\mathrm{fi}}(\mathbf{x}) = \sum_{a \in \mathcal{F}} \sum_{Z \in \mathcal{Z}_a}
    P_{\mathrm{fi},a,Z}(\mathbf{x})

    $$


    where $P_{\mathrm{fi}}$ and $P_{\mathrm{fi},a,Z}$ are local power densities in
    W m$^{-3}$, $\mathbf{x}$ is position, $\mathcal{F}$ is the set of included fast-ion
    species, and $\mathcal{Z}_a$ is the set of included charge states for species
    $a$.


    The quantity represents the total local wave-energy transfer to fast ions, without
    resolution by toroidal harmonic. Its mode-resolved counterpart, [per-toroidal-mode
    fast ion power density](name:per_toroidal_mode_fast_ion_power_density), partitions
    this transfer by toroidal mode number.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_density
  - name:per_toroidal_mode_fast_ion_power_density
