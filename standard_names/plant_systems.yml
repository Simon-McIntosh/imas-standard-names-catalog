- name: ammonia_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous injection rate of ammonia (NH3) molecules during gas
    puffing into the vacuum vessel.
  documentation: 'The ammonia source rate quantifies the number of NH3 molecules injected
    per second through a dedicated gas-puff system. This rate is used to control the
    plasma composition for experiments involving nitrogen seeding, radiative cooling,
    or ammonia formation studies. The injection rate is typically commanded by the
    gas-injection controller and can be calibrated via pressure and flow measurements
    in the injection line. Typical values range from $10^{19}$ to $10^{22}$ molecules/s
    depending on the desired plasma density and impurity concentration.


    Sign convention: Positive when gas is flowing into the vessel.


    Related quantities include the injection rates for other species such as [neon_source_rate_due_to_gas_injection](name:neon_source_rate_due_to_gas_injection)
    and [argon_gas_source_rate](name:argon_gas_source_rate), which follow the same
    measurement and control principles.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:neon_source_rate_due_to_gas_injection
  - name:argon_gas_source_rate
  sources:
  - id: dd:summary/gas_injection_rates/ammonia/value
    dd_path: summary/gas_injection_rates/ammonia/value
    status: composed
- name: atomic_mass_number
  kind: scalar
  status: draft
  description: Atomic mass number (total number of protons and neutrons) of the gas
    species element in an injection or pumping gas mixture.
  documentation: "The atomic mass number $A$ (also called the mass number or nucleon\
    \ number) is the total count of protons and neutrons in the nucleus of a specific\
    \ isotope of the gas species. Together with the [atomic_number](name:atomic_number)\
    \ (proton number $Z$), it uniquely identifies the nuclide \u2014 for example,\
    \ $A=4$ with $Z=2$ specifies helium-4, while $A=3$ with $Z=2$ specifies helium-3.\
    \ This quantity is used to characterize the injected or pumped gas composition\
    \ in units of unified atomic mass units (u), where $1\\,\\text{u} = 1.660539 \\\
    times 10^{-27}\\,\\text{kg}$. Typical values for fusion-relevant gasses range\
    \ from $A=1$ (protium) through $A=4$ (helium-4), and up to $A=40$ (argon) for\
    \ disruption-mitigation systems. The atomic mass number is distinct from the [atomic_number](name:atomic_number)\
    \ (proton count) and from the isotope-resolved [ion_atomic_mass](name:ion_atomic_mass)\
    \ used for plasma species."
  unit: u
  physics_domain: plant_systems
  links:
  - name:atomic_number
  - name:ion_atomic_mass
  sources:
  - id: dd:gas_injection/pipe/species/element/a
    dd_path: gas_injection/pipe/species/element/a
    status: composed
  - id: dd:gas_injection/valve/species/element/a
    dd_path: gas_injection/valve/species/element/a
    status: attached
  - id: dd:gas_pumping/duct/species/element/a
    dd_path: gas_pumping/duct/species/element/a
    status: composed
- name: gas_source_rate_at_midplane
  kind: scalar
  status: draft
  description: Total instantaneous gas injection rate from all valves positioned near
    the equatorial midplane of the vacuum vessel, summed over all injected species.
  documentation: 'This quantity aggregates the total instantaneous influx of gas into
    the plasma vessel from all injection systems located at the torus midplane (e.g.,
    supersonic molecular beam injectors, gas puff modules). The midplane position
    is the primary location for core fueling and edge density control in many tokamak
    configurations, as the magnetic geometry couples this region directly to the plasma
    core.


    Typical midplane injection rates span $10^{19}--10^{22}\;\mathrm{s}^{-1}$ depending
    on the plasma scenario (e.g., H-mode density ramp, disruption mitigation). This
    rate contributes to the total gas source rate due to injection, which sums over
    all spatial injection points. Specific species components are tracked by sibling
    names such as $\texttt{deuterium\_gas\_source\_rate\_of\_inlet}$ and $\texttt{argon\_gas\_source\_rate}$.


    Sign convention: Positive when gas flows into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:total_gas_source_rate_due_to_injection
  - name:deuterium_gas_source_rate_of_inlet
  - name:argon_gas_source_rate
  sources:
  - id: dd:summary/gas_injection_rates/midplane/value
    dd_path: summary/gas_injection_rates/midplane/value
    status: composed
- name: helium_3_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which helium-3 atoms are injected into the vacuum
    vessel.
  documentation: "The helium-3 source rate quantifies the number of $^3$He atoms introduced\
    \ per unit time into the vacuum vessel via gas injection systems. This rate directly\
    \ controls the concentration of helium-3 in the plasma, which influences fusion\
    \ reactivity (e.g., $^3$He + D \u2192 $^4$He + p + 18.3 MeV) and plasma fueling.\
    \ The injection rate is typically controlled by piezoelectric or solenoid valves\
    \ and measured by calibrated flow meters, with typical values ranging from $10^{18}$\
    \ to $10^{21}$ s$^{-1}$ in present-day tokamaks. Maintaining a specified helium-3\
    \ source rate is essential for scenarios such as ion cyclotron resonance heating\
    \ (ICRH) minority heating or non-fusion tritium breeding studies. The quantity\
    \ directly parallels [tritium_source_rate](name:tritium_source_rate) for tritium\
    \ gas injection and is the helium-3 analog of [helium_4_gas_source_rate_due_to_injection](name:helium_4_gas_source_rate_due_to_injection).\n\
    \nSign convention: Positive when helium-3 atoms are injected into the vessel,\
    \ zero when no injection occurs."
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:tritium_source_rate
  - name:helium_4_gas_source_rate_due_to_injection
  sources:
  - id: dd:summary/gas_injection_rates/helium_3/value
    dd_path: summary/gas_injection_rates/helium_3/value
    status: composed
- name: hydrogen_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which hydrogen atoms are injected into the vacuum
    vessel via gas puffing systems.
  documentation: "The hydrogen source rate quantifies the flux of atomic hydrogen\
    \ injected into the vessel to fuel the plasma, control density profiles, or condition\
    \ plasma-facing components. In tokamaks, hydrogen gas puffing is a primary fueling\
    \ method, with injection rates typically ranging from 1\xD710^20 to 1\xD710^23\
    \ atoms/s depending on plasma regime and machine size. This rate is measured by\
    \ flow meters on the gas injection system and is critical for particle balance\
    \ studies alongside [deuterium_gas_source_rate_at_inlet_due_to_gas_injection](name:deuterium_gas_source_rate_at_inlet_due_to_gas_injection)\
    \ and [tritium_source_rate](name:tritium_source_rate).\n\nSign convention: Positive\
    \ when hydrogen flows into the plasma vessel.\n\nThe source rate is directly related\
    \ to the fueling efficiency, which may be estimated from the ratio of the core\
    \ particle confinement time to the injection rate."
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:deuterium_gas_source_rate_at_inlet_due_to_gas_injection
  - name:tritium_source_rate
  sources:
  - id: dd:summary/gas_injection_rates/hydrogen/value
    dd_path: summary/gas_injection_rates/hydrogen/value
    status: composed
- name: lithium_gas_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of lithium atoms injected via gas puffing into the
    vacuum vessel.
  documentation: 'The lithium gas source rate due to gas injection quantifies the
    number of lithium atoms per second introduced into the plasma vessel through a
    dedicated gas puffing system. This rate is used to model the fueling of the plasma
    with lithium, which can affect edge plasma conditions, heat flux mitigation, and
    plasma-facing component performance.


    Typical values for lithium injection rates in present devices range from 10^18
    s^-1 to 10^22 s^-1 depending on the discharge phase and desired lithium inventory.
    The rate is directly related to the total injected particle inventory via time
    integration.


    Sign convention: Positive when the flow of lithium atoms is directed into the
    plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:tritium_source_rate
  - name:neon_source_rate_due_to_gas_injection
  - name:ammonia_source_rate_due_to_gas_injection
