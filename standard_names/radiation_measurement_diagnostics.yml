      unit: m
    enhanced_context:
      description: Physical size of a single sensor pixel in an infrared camera channel,
        assuming a square pixel geometry. Used in optical calculations to map detector
        pixels to spatial positions on plasma-facing components.
      kind: llm
  - dd_path: camera_x_rays/camera/pixel_dimensions
