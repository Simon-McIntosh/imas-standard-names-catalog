  - id: dd:transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/temperature
    dd_path: transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/temperature
    status: composed
- name: thermal_electron_density
  kind: scalar
  status: draft
  description: Number density of the bulk thermal (Maxwellian) electron population,
    excluding fast and suprathermal electron contributions.
  documentation: "The thermal electron density $n_{e,\\mathrm{th}}$ is the number\
    \ of thermal (Maxwellian) electrons per unit volume, representing the bulk electron\
    \ component whose velocity distribution is described by a Maxwellian at the local\
    \ electron temperature. It is the dominant electron population in most quiescent\
    \ plasma conditions and is the relevant density for transport equations, pressure\
    \ balance, and quasineutrality constraints.\n\nThe total [electron_density](name:electron_density)\
    \ partitions into thermal and fast contributions:\n\n$$\nn_e = n_{e,\\mathrm{th}}\
    \ + n_{e,\\mathrm{fast}}\n$$\n\nwhere $n_{e,\\mathrm{fast}}$ is the [fast electron\
    \ density]. In the absence of significant suprathermal populations this fast term\
    \ is negligible and $n_{e,\\mathrm{th}} \\approx n_e$.\n\nThomson scattering and\
    \ microwave reflectometry measure the electron density profile; where the fast\
    \ electron population is negligible, the inferred $n_e$ directly approximates\
    \ $n_{e,\\mathrm{th}}$. During electron cyclotron current drive or lower hybrid\
    \ heating scenarios the fast electron contribution becomes appreciable and the\
    \ two populations must be tracked separately.\n\nTypical core values range from\
    \ $1 \\times 10^{19}$ to $2 \\times 10^{20}$ m$^{-3}$ in tokamak plasmas, falling\
    \ to $10^{17}$\u2013$10^{18}$ m$^{-3}$ in the scrape-off layer. The thermal electron\
    \ density enters the electron thermal pressure $p_{e,\\mathrm{th}} = n_{e,\\mathrm{th}}\
    \ T_e$ and the charge-neutrality relation, and is the electron-species analog\
    \ of [thermal_ion_density](name:thermal_ion_density)."
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/density_thermal
    dd_path: core_profiles/profiles_1d/electrons/density_thermal
    status: attached
  - id: dd:edge_profiles/profiles_1d/electrons/density_thermal
    dd_path: edge_profiles/profiles_1d/electrons/density_thermal
    status: attached
