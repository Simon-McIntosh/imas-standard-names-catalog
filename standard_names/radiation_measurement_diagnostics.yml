- name: second_coordinate_of_reflector_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of a spectrometer reflector element in its local (X1, X2) instrument reference
    frame.
  documentation: 'The reflector outline is represented as a closed polygon whose vertices
    are specified in a local instrument frame $(X_1, X_2)$ attached to the reflector
    element. This quantity gives the $X_2$ coordinate of each vertex, completing the
    two-dimensional description of the reflector boundary alongside the companion
    [first coordinate](name:first_coordinate_of_reflector_outline). The $X_2$ axis
    is the second orthogonal direction in the local plane of the reflector surface;
    together with $X_1$, it defines the shape used for geometric ray-tracing and solid-angle
    calculations in X-ray crystal spectrometers. The local frame is instrument-specific
    and its orientation relative to the laboratory cylindrical $(R, \phi, Z)$ frame
    is given by the associated unit vectors for the reflector assembly. Analogous
    coordinate pairs are defined for other optical components: [second coordinate
    of crystal outline](name:second_coordinate_of_crystal_outline) and [second coordinate
    of aperture outline](name:second_coordinate_of_aperture_outline) follow the same
    convention.


    Sign convention: Positive when the vertex position lies in the positive $X_2$
    direction of the local instrument reference frame as defined by the second unit
    vector of the reflector assembly.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_of_reflector_outline
  - name:second_coordinate_of_crystal_outline
  - name:second_coordinate_of_aperture_outline
