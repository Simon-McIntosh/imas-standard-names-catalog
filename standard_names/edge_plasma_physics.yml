- name: flux_surface_averaged_iron_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged density of iron impurity ions, evaluated at the
    last closed flux surface.
  documentation: This quantity represents the density of iron (Fe) impurity ions averaged
    over a flux surface at the last closed flux surface (LCFS). Iron impurities typically
    originate from plasma-facing components and can significantly affect plasma performance
    through radiation losses and dilution of the fuel ions. Typical values in tokamaks
    range from 1e14 m^-3 to 1e18 m^-3 depending on the machine, discharge conditions,
    and proximity to the LCFS. The flux-surface average is defined as the mean of
    the iron density over the poloidal and toroidal extent of the flux surface, computed
    as $\langle n_{\mathrm{Fe}} \rangle = \frac{1}{V'} \oint n_{\mathrm{Fe}} \, \frac{d\ell}{|\nabla
    \psi|}$, where $V' = \mathrm{d}V/\mathrm{d}\psi$ is the differential volume per
    unit poloidal flux. This quantity is a key input for modeling edge impurity transport
    and assessing divertor heat loads.
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_separatrix
  - name:line_averaged_iron_density
  sources:
  - id: dd:summary/local/separatrix_average/n_i/iron/value
    dd_path: summary/local/separatrix_average/n_i/iron/value
    status: composed
- name: helium_3_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of singly-ionized helium-3 ($^3$He$^+$) particles in
    the plasma region that intersects the limiter surface.
  documentation: 'The helium-3 ion density at the limiter quantifies the local $^3$He$^+$
    concentration in the scrape-off layer zone in contact with the limiter, a critical
    quantity for fuel ion inventory and neutral-beam-driven fusion reactivity in devices
    using $^3$He as a minority species. This density is typically inferred from filtered
    charge-exchange recombination spectroscopy or deduced from residual gas analyzer
    signals combined with edge plasma modeling; values in the limiter shadow range
    from $10^{15}$ to $10^{18}$ m$^{-3}$ depending on fueling, pumping, and recycling
    conditions. The density couples to the neutral $^3$He source via ionization balance
    and to parallel transport along open field lines, with nearby companion quantities
    such as [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal) and
    [helium_3_density_at_separatrix](name:helium_3_density_at_separatrix) characterizing
    radial variation across the edge.


    Sign convention: Positive for all values; the quantity is a non-negative scalar
    number density.


    The quantity is related to the ion temperature through the kinetic pressure and
    informs the edge fueling balance when compared to [ion_temperature_at_limiter](name:ion_temperature_at_limiter)
    within the limiter region.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_3_density_at_pedestal
  - name:helium_3_density_at_separatrix
  - name:ion_temperature_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/helium_3/value
    dd_path: summary/local/limiter/n_i/helium_3/value
    status: composed
- name: helium_3_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of helium-3 ions at the pedestal location in the plasma
    edge, typically just inside the separatrix.
  documentation: 'The helium-3 density at the pedestal, $n_{^{3}\text{He}}(\psi_{N,\text{ped}})$,
    quantifies the thermal ion density of helium-3 at the top of the edge transport
    barrier, typically just inside the separatrix. This species is relevant as a fusion
    ash product and minority heating fuel, with values typically ranging from $10^{17}$
    to $10^{19}\,\text{m}^{-3}$ in H-mode pedestals. The radial coordinate is the
    normalized poloidal flux $\psi_N$, which maps the pedestal position. The density
    is inferred from charge-exchange recombination spectroscopy or passive spectroscopy,
    aided by equilibrium reconstruction to map to $\psi_N$. Measured values combine
    spectroscopic line intensities with collisional-radiative modeling to separate
    the $^{3}\text{He}$ signal from background deuterium and impurities.


    Sign convention: Positive when describing physical particle number density in
    the volume at the pedestal location.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
