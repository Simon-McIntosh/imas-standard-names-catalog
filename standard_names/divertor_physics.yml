- name: current_at_divertor_target
  kind: scalar
  status: draft
  description: Net conventional electric current delivered by the plasma to one divertor
    target surface, integrated over the wetted strike zone.
  documentation: 'Current at a divertor target is the net conventional electric current
    delivered to one divertor target by charged particles crossing the plasma sheath
    and striking the wetted strike zone. It is a surface-integrated signed charge
    flux, not a local current density, and represents the per-target contribution
    to the divertor and wall-current balance.


    For a local target surface normal chosen from the plasma toward the material surface,
    the sheath-edge current integrated over the wetted area can be written as:


    $$

    I_{\mathrm{div,target}} = \int_{A_{\mathrm{wet}}} \left(j_{i,n} - j_{e,n}\right)\,dA

    $$


    where $j_{i,n}$ is the ion conventional-current density normal to the target surface
    in A m$^{-2}$, $j_{e,n}$ is the magnitude of the electron collection current density
    normal to the target surface in A m$^{-2}$, $dA$ is the differential target area
    in m$^2$, and $A_{\mathrm{wet}}$ is the wetted strike-zone area in m$^2$. The
    resulting integrated current is in A; the electron term is subtracted because
    electrons moving from the plasma to the target carry conventional current opposite
    to their particle motion.


    The current may be measured with embedded Langmuir probes, segmented target current
    shunts, or Rogowski-coil arrangements around target structures, and may also be
    inferred from sheath models using local target plasma conditions such as [electron
    density at divertor target](name:electron_density_at_divertor_target) and [electron
    temperature at divertor target](name:electron_temperature_at_divertor_target).
    It is closely related to deposited divertor power because the same sheath and
    strike-zone conditions govern both charge and energy fluxes, as represented by
    [power at divertor target](name:deposited_power_at_divertor_target_due_to_halo_current)
    and [power of divertor].


    For an electrically floating target in steady conditions, the net integrated current
    is expected to be near 0 A because ion and electron current contributions balance
    through the sheath. Non-zero values occur with target biasing, transient edge
    events, current-sharing between conducting structures, or disruption halo-current
    phases; the single-target value is not the total plasma current $I_p$ but may
    be assessed relative to $|I_p|$ when evaluating global current closure. No device-independent
    numerical range is implied, because the magnitude depends strongly on target geometry,
    electrical connection, plasma regime, and transient scenario.


    Sign convention: Positive when the net conventional current flows from the plasma
    into the divertor target surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:deposited_power_at_divertor_target_due_to_halo_current
- name: current_of_divertor
  kind: scalar
  status: draft
  description: Total net electric current carried by charged particles striking the
    divertor assembly, summed over all divertor target surfaces. It is positive for
    conventional current into the material and can be negative when the electron contribution
    dominates.
  documentation: 'Current of a divertor is the net electric current delivered to the
    divertor by incident charged particles. It represents the charge transport associated
    with ions and electrons striking the plasma-facing divertor targets, summed over
    all relevant target surfaces.


    The net incident current can be expressed as a surface integral of the signed
    particle charge flux:


    $$

    I_\mathrm{div} = \int_{A_\mathrm{div}} \sum_s q_s\,\boldsymbol{\Gamma}_s \cdot
    \hat{\mathbf{n}}_\mathrm{mat}\, dA

    $$


    where $A_\mathrm{div}$ is the union of divertor target surfaces, $q_s$ is the
    signed charge of species $s$, $\boldsymbol{\Gamma}_s$ is the incident particle
    flux density of that species, and $\hat{\mathbf{n}}_\mathrm{mat}$ is the local
    unit normal directed from the plasma-facing side into the material.


    In practice this current may be inferred from embedded target current sensors,
    biased divertor circuits, Langmuir-probe measurements combined with sheath models,
    or plasma-edge simulations that integrate ion and electron fluxes over the target
    surfaces. Care is needed to distinguish the net signed current from separate ion
    and electron current components, which can be much larger before cancelation.


    Typical net summed currents are often near 0 A for electrically floating, quasi-ambipolar
    target conditions. During biased operation, strong sheath asymmetry, detachment
    transients, or disruption-related wall loading, absolute values from 1-10000 A
    can occur, with larger values possible in large devices or off-normal events.


    Sign convention: Positive when the net conventional current carried by incident
    charged particles is directed from the plasma into the divertor material.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:current_of_divertor_tile
- name: current_of_divertor_tile
  kind: scalar
  status: draft
  description: Net electric current flowing from the plasma across the electrostatic
    sheath onto the plasma-facing surface of an individual divertor tile.
  documentation: 'The current of a divertor tile is the net electric current flowing
    from the plasma across the electrostatic sheath onto the plasma-facing surface
    of a single tile. It provides tile-resolved resolution of the current distribution
    across the divertor strike zone, complementing the target-integrated quantity
    [current_at_divertor_target](name:current_at_divertor_target).


    The tile current integrates the local net sheath current density $j_s$ over the
    plasma-facing tile area $A_\mathrm{tile}$:


    $$

    I_\mathrm{tile} = \int_{A_\mathrm{tile}} j_s \, dA

    $$


    where $j_s$ depends on the local ion saturation current density, the tile-to-plasma
    sheath potential, and the local [electron temperature at the divertor target](name:electron_temperature_at_divertor_target).
    Dividing by the tile area, available from [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),
    converts this quantity to a mean incident current density.


    Tile currents are measured using isolated tile circuits or embedded Langmuir probes
    whose signals are routed through the mechanical tile support structure, enabling
    time-resolved acquisition during plasma operation including transient ELM events.


    Summing contributions from all tiles on a given target recovers [current_at_divertor_target](name:current_at_divertor_target),
    and summing over all targets gives [current_of_divertor](name:current_of_divertor).
    Tile-level current data are used to diagnose thermoelectric current loops, local
    erosion hot spots, and strike-zone asymmetries driven by 3D magnetic perturbations.


    Sign convention: Positive when net electric current flows from the plasma onto
    the tile surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:surface_area_of_divertor_tile
  - name:current_of_divertor
- name: density_at_divertor_target
  kind: scalar
  status: draft
  description: "Local number density of any plasma species \u2014 electrons, fuel\
    \ ions, or impurity ions \u2014 evaluated in the plasma adjacent to the divertor\
    \ target surface, with ionic species summed over all ionization charge states\
    \ and neutral atoms excluded."
  documentation: "The number density at the divertor target quantifies the local plasma\
    \ particle population of a given species \u2014 electrons, bulk ions, or impurity\
    \ ions \u2014 in the layer immediately adjacent to the target surface, at the\
    \ entrance to the electrostatic sheath. For ionic species the density is summed\
    \ over all ionization charge states co-existing at that location unless a specific\
    \ charge state is separately resolved; neutral atoms are excluded from ionic species\
    \ densities. Species-resolved instances include [electron_density_at_divertor_target](name:electron_density_at_divertor_target)\
    \ and [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target),\
    \ while the aggregate over all ion species is provided by [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).\n\
    \nIn scrape-off-layer two-point models the target density $n_t$ is coupled to\
    \ the upstream density $n_u$ through momentum and pressure balance along field\
    \ lines. In the conduction-limited, high-recycling regime the dominant relation\
    \ is:\n\n$$\nn_t = \\frac{n_u T_u}{T_t}\n$$\n\nwhere $T_u$ is the upstream electron\
    \ temperature and $T_t$ is the electron temperature at the target sheath entrance.\
    \ As $T_t$ drops toward detachment onset, $n_t$ rises sharply.\n\nTarget densities\
    \ are measured primarily by Langmuir probe arrays embedded in divertor tiles,\
    \ exploiting the ion saturation current density $j_\\mathrm{sat} = \\tfrac{1}{2}\\\
    ,e\\,n_t c_s$, where $c_s = \\sqrt{(T_e + T_i)/m_i}$ is the local Bohm acoustic\
    \ speed. Passive spectroscopy of line emission from known impurity species provides\
    \ supplementary particle-balance constraints. Typical values range from $10^{18}$\
    \ to $10^{21}$ m$^{-3}$, spanning low-recycling attached through fully detached\
    \ divertor regimes.\n\nSign convention: Positive when physical particles of the\
    \ specified species occupy the plasma volume adjacent to the target surface."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: derived:density_at_divertor_target
    status: composed
- name: beryllium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of beryllium ions in the plasma immediately adjacent
    to a divertor target surface, summed over all ionization states Be1+ through Be4+
    and excluding neutral beryllium atoms.
  documentation: "Beryllium density at the divertor target is the local number density\
    \ of beryllium ions in the plasma immediately adjacent to a divertor target surface,\
    \ summed over all ionization states from Be$^{1+}$ through Be$^{4+}$. Neutral\
    \ beryllium atoms are excluded, as they do not couple to the electrostatic sheath\
    \ at the plasma-material interface. It is the beryllium-specific member of the\
    \ parent [density_at_divertor_target](name:density_at_divertor_target).\n\nThe\
    \ charge-state sum is defined as:\n\n$$\nn_\\mathrm{Be} = \\sum_{k=1}^{4} n_{\\\
    mathrm{Be}^{k+}}\n$$\n\nwhere $n_{\\mathrm{Be}^{k+}}$ is the number density of\
    \ beryllium ions in charge state $k$, evaluated in the near-target plasma layer\
    \ upstream of the sheath entrance.\n\nBeryllium enters the divertor plasma through\
    \ sputtering and erosion of beryllium-containing plasma-facing materials. Near-target\
    \ beryllium densities are inferred from divertor spectroscopy of Be emission lines\
    \ combined with ionization-balance modeling, or from edge-plasma simulations constrained\
    \ by Langmuir probe data. In attached divertor conditions, typical near-target\
    \ impurity densities reach $10^{16}$\u2013$10^{18}$ m$^{-3}$; detachment reduces\
    \ these values as recombination diminishes the ionized fraction. The beryllium\
    \ density at the divertor target is complementary to [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),\
    \ which characterizes the upstream boundary value, and [beryllium_density_at_limiter](name:beryllium_density_at_limiter)\
    \ for the limiter-surface analog. For comparison with a seeded noble-gas species\
    \ at the same location, see [neon_density_at_divertor_target](name:neon_density_at_divertor_target)."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_limiter
  - name:neon_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: beryllium
    operator_kind: qualifier
- name: carbon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local number density of carbon ions evaluated in the plasma adjacent
    to the divertor target surface at the electrostatic sheath entrance, summed over
    all carbon ionization charge states from C1+ through C6+ and excluding neutral
    carbon atoms and molecules.
  documentation: 'Carbon density at the divertor target is the local number density
    of carbon ions in the plasma immediately adjacent to the divertor target surface,
    evaluated upstream of the electrostatic sheath entrance. It is summed over all
    ionization charge states from C$^{1+}$ through C$^{6+}$ and excludes neutral carbon
    atoms and carbon-bearing neutral molecules. As a species-resolved impurity density,
    it contributes to the local ion inventory represented by [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).


    The charge-state-summed carbon ion density is defined by summing the densities
    of the resolved ionic charge states:


    $$

    n_{\mathrm{C},t} = \sum_{q=1}^{6} n_{\mathrm{C}^{q+},t}

    $$


    where $n_{\mathrm{C},t}$ is the carbon ion density at the target in $\mathrm{m^{-3}}$,
    $n_{\mathrm{C}^{q+},t}$ is the density of carbon ions with charge state $q$ at
    the target in $\mathrm{m^{-3}}$, and $q$ runs from singly ionized carbon to fully
    stripped carbon.


    Carbon density at the target is usually obtained indirectly. In experiments it
    is constrained by spectroscopy of carbon emission near the target, together with
    local electron conditions and atomic data; in edge-plasma and impurity-transport
    calculations it is obtained from charge-state-resolved carbon continuity equations
    and then summed. Measurements of the bulk plasma density and temperature provide
    sheath-entrance context but do not by themselves separate carbon from other ion
    species.


    Typical values are strongly device and wall-material dependent because carbon
    is usually an impurity source associated with plasma-facing components, erosion,
    redeposition, or residual carbon content rather than the main fuel population.
    It is generally a minority component of the local ion density, can become important
    for divertor radiation and detachment behavior when carbon sources are strong,
    and may be close to trace levels in devices with weak carbon sources.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:carbon_density_at_plasma_boundary
  - name:carbon_density_at_magnetic_axis
  - name:effective_charge_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: carbon
    operator_kind: qualifier
- name: deposited_power_at_divertor_target_due_to_halo_current
  kind: scalar
  status: draft
  description: Power deposited on a single divertor target by the halo-current component
    crossing the target surface. It is the current-driven halo contribution to target
    loading.
  documentation: 'Deposited power at a divertor target due to halo current is the
    rate at which electrical work associated with halo current crossing a single target
    surface is converted to energy in that target. Halo current denotes current in
    the edge or scrape-off-layer plasma that closes through conducting plasma-facing
    structures; this quantity isolates that current-driven contribution from conducted,
    convected, radiative, neutral, and recombination heat loads.


    For a resolved target surface, the deposited halo-current power can be written
    as the surface integral of normal halo-current density times the local plasma-to-target
    potential drop:


    $$

    P_{\mathrm{halo},t} = \int_{A_t} j_{\mathrm{halo},\perp}(\mathbf{r})\,\Delta\Phi_t(\mathbf{r})\,dA

    $$


    where $P_{\mathrm{halo},t}$ is in W, $A_t$ is the wetted area of the target surface,
    $j_{\mathrm{halo},\perp}$ is the halo-current density normal to that surface in
    A m$^{-2}$, positive for conventional current from the plasma into the target,
    $\Delta\Phi_t = \Phi_{\mathrm{plasma}} - \Phi_{\mathrm{target}}$ is the local
    plasma-to-target potential drop in V, and $dA$ is a surface area element in m$^2$.


    In practice, this quantity is obtained by combining the halo-current incident
    on the target with the relevant potential drop, or by separating the halo-current
    part from the total current-driven target power. The associated surface-integrated
    current is the halo-current contribution to [current_at_divertor_target](name:current_at_divertor_target);
    the corresponding current-driven target power is related to [power_at_divertor_target](name:deposited_power_at_divertor_target_due_to_halo_current),
    and target contributions combine in divertor power accounting such as power_of_divertor.


    Typical values are approximately 0 W when no halo current intercepts the target.
    During transients with halo current closing through plasma-facing structures,
    finite values are strongly device-, geometry-, and event-dependent and can range
    from small corrections to values comparable with the total current-driven power
    on that target.


    Sign convention: Positive when conventional halo current crosses from the plasma
    into the target across a positive plasma-to-target potential drop, so the integrated
    electrical work deposits net energy in the target material.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/power_currents
    dd_path: divertors/divertor/target/power_currents
    status: composed
  - id: dd:divertors/divertor/target/power_incident
    dd_path: divertors/divertor/target/power_incident
    status: composed
- name: deuterium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Deuterium density at the divertor target is the local number density
    of deuterium ions in the plasma immediately adjacent to a divertor target surface,
    summed over all deuterium ion charge states and excluding neutral deuterium atoms
    and molecules.
  documentation: 'Deuterium density at the divertor target is the local number density
    of deuterium ions in the plasma immediately adjacent to a divertor target surface,
    evaluated at the entrance to the electrostatic sheath. It is summed over all positive
    atomic deuterium ion charge states, which reduces to the singly ionized $D^+$
    state; neutral deuterium atoms and molecules are excluded. It is the deuterium-specific
    member of [density at the divertor target](name:density_at_divertor_target), distinct
    from [total ion density at the divertor target](name:total_ion_density_at_divertor_target)
    and related to [deuterium density at a limiter](name:deuterium_density_at_limiter).


    At the sheath entrance, the deuterium target density is coupled to the deuterium
    ion flux toward the material surface by the Bohm sheath condition:


    $$

    \Gamma_{D,t} \simeq n_{D,t} c_{s,D}

    $$


    where $\Gamma_{D,t}$ is the deuterium ion particle flux toward the target, $n_{D,t}$
    is the deuterium density at the sheath entrance, and $c_{s,D}$ is the deuterium
    Bohm acoustic speed set by the local electron and ion temperatures and the deuterium
    ion mass. Increased recycling and reduced target temperature in high-recycling
    or detached conditions tend to raise $n_{D,t}$ while reducing the ion energy delivered
    to the surface.


    In practice, this quantity is inferred from divertor Langmuir-probe measurements
    of ion saturation current, divertor Thomson scattering constraints on local plasma
    conditions when available, and spectroscopic analysis of deuterium emission interpreted
    with edge-plasma and neutral-transport modeling. The interpretation must separate
    ionized deuterium from neutral atoms and molecules and can depend strongly on
    recycling, ionization balance, cross-field transport, and whether the divertor
    is attached, partially detached, or detached.


    Typical values are $10^{18}$-$10^{20}$ m$^{-3}$ in attached low- to moderate-recycling
    divertor plasmas and $10^{20}$-$10^{21}$ m$^{-3}$ in high-recycling or detached
    conditions.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:deuterium_tritium_density_at_divertor_target
  - name:deuterium_density_at_plasma_boundary
  arguments:
  - name: density_at_divertor_target
    operator: deuterium
    operator_kind: qualifier
- name: deuterium_tritium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of the deuterium-tritium ion mixture in the plasma immediately
    adjacent to a divertor target, representing the ionized D-T fuel population as
    a single effective species with mean atomic mass 2.5 u, excluding neutral fuel
    atoms.
  documentation: "Deuterium-tritium density at the divertor target is the local number\
    \ density of the deuterium-tritium fuel ion mixture in the plasma adjacent to\
    \ the divertor target surface. The quantity combines singly ionized $D^+$ and\
    \ $T^+$ fuel ions, treating them as a single effective species with mean atomic\
    \ mass 2.5 u for an equimolar D\u2013T mixture. As a component of [density_at_divertor_target](name:density_at_divertor_target),\
    \ the density is summed over both fuel-ion charge states and excludes neutral\
    \ deuterium and tritium atoms.\n\nThe total deuterium-tritium ion number density\
    \ is the sum of the individual fuel-ion contributions:\n\n$$\nn_{DT} = n_D + n_T\n\
    $$\n\nwhere $n_D$ is the local deuterium ion number density and $n_T$ is the local\
    \ tritium ion number density at the target location. In an equimolar D\u2013T\
    \ plasma, $n_D \\approx n_T$ and therefore $n_{DT} \\approx 2n_D$.\n\nNear-target\
    \ density values are obtained from Langmuir probe measurements at the target plate,\
    \ two-point scrape-off-layer model calculations using upstream density and pressure\
    \ balance, or from plasma-edge simulations. In attached divertor conditions the\
    \ fuel-ion density is the dominant contributor to the total ion population tracked\
    \ by [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).\n\
    \nTypical values span $10^{19}$\u2013$10^{21}$ m$^{-3}$ in attached high-recycling\
    \ H-mode operation. In partially or fully detached conditions, recombination upstream\
    \ reduces the ion flux to the target and the near-target density can fall below\
    \ $10^{18}$ m$^{-3}$. For the analogous quantity at the plasma core see [deuterium_tritium_density_at_magnetic_axis](name:deuterium_tritium_density_at_magnetic_axis);\
    \ for the species-resolved fuel components see [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  - name:deuterium_tritium_density_at_magnetic_axis
  - name:deuterium_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: deuterium_tritium
    operator_kind: qualifier
- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Effective charge (Zeff) of the plasma evaluated at the divertor target,
    a dimensionless composite indicator of impurity content equal to unity for a pure
    hydrogen plasma and rising above unity as high-charge impurity species accumulate.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the multi-species\
    \ ion composition at the divertor target by weighting each ion species by the\
    \ square of its charge number, normalized to the electron density. It reflects\
    \ the local impurity content arising from sputtering of plasma-facing components,\
    \ deliberate impurity seeding for power exhaust control, and recycling processes\
    \ at the divertor surface.\n\nThe quantity is defined under quasi-neutrality by:\n\
    \n$$\nZ_\\text{eff} = \\frac{\\sum_s n_s Z_s^2}{n_e}\n$$\n\nwhere $n_s$ is the\
    \ number density of ion species $s$ with charge number $Z_s$, and $n_e = \\sum_s\
    \ n_s Z_s$ is the electron number density enforced by quasi-neutrality. High-$Z$\
    \ impurities contribute disproportionately: a trace fraction of [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ or argon_density_at_divertor_target raises $Z_\\text{eff}$ far more than an\
    \ equivalent density of [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target).\n\
    \n$Z_\\text{eff}$ at the divertor is inferred from spectroscopic impurity line\
    \ emission or from the Bremsstrahlung continuum, whose volumetric emissivity scales\
    \ as $n_e^2 Z_\\text{eff}$. Impurity seeding enhances radiative power dissipation\
    \ in detachment scenarios, thereby reducing the [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\
    \ This is the effective-charge component of the charge_at_divertor_target family.\n\
    \nTypical values range from 1 for a pure hydrogen plasma to 2\u20138 in seeded\
    \ or erosion-dominated divertor conditions.\n\nSign convention: Positive when\
    \ at least one ion species with nonzero charge number is present in the plasma,\
    \ as the numerator $\\sum_s n_s Z_s^2$ and denominator $n_e$ are both positive\
    \ under quasi-neutrality, ensuring $Z_\\text{eff} \\geq 1$."
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
- name: electron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Electron density at the divertor target is the local number density
    of free electrons in the plasma immediately adjacent to a divertor target surface,
    evaluated at the electrostatic sheath entrance.
  documentation: 'Electron density at the divertor target is the local number density
    of free electrons in the thin plasma layer immediately upstream of the electrostatic
    sheath entrance at a divertor target surface. As the electron counterpart in the
    [density_at_divertor_target](name:density_at_divertor_target) family, no charge-state
    summation is required; the electron population is a single-charge-state constituent
    coupled to the ion species through local quasi-neutrality.


    At the sheath entrance, quasi-neutrality constrains the electron density to equal
    the total ion charge density:


    $$

    n_e \approx \sum_s Z_s \, n_s

    $$


    where $Z_s$ is the charge number and $n_s$ is the number density of ion species
    $s$ at the target. The parallel electron particle flux at the sheath edge satisfies
    $\Gamma_{e,t} = n_{e,t} v_B$, where $v_B = \sqrt{k_B(T_e + T_i)/m_i}$ is the Bohm
    velocity, $T_e$ and $T_i$ are the electron and ion temperatures in joules, and
    $m_i$ is a representative ion mass.


    This quantity is measured using Langmuir probes embedded in the divertor target
    tiles, which yield the saturated ion current density $j_{sat} = e\,n_{e,t}\,v_B$;
    combined with [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target),
    this gives $n_{e,t}$ directly. It is distinct from the upstream separatrix value
    [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    with the ratio $n_{e,t}/n_{e,u}$ characterizing the parallel density decay through
    the scrape-off layer and serving as a sensitive indicator of divertor detachment
    onset.


    Typical values range from $10^{18}$ m$^{-3}$ in detached divertor conditions to
    above $10^{21}$ m$^{-3}$ in high-recycling attached plasmas in current tokamaks.'
  unit: m^-3
  physics_domain: divertor_physics
