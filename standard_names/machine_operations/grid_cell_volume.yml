name: grid_cell_volume
status: draft
cocos_transformation_type: one_like
description: Volume of a single computational cell in a 2-D poloidal grid, obtained
  by toroidal revolution of the cell area.
documentation: The grid cell volume $\Delta V_{ij}$ is the plasma volume enclosed
  by the quadrilateral cell bounded by nodes $(i,j)$, $(i+1,j)$, $(i,j+1)$, and $(i+1,j+1)$
  on a structured poloidal grid, expressed in cubic meters. For an axisymmetric configuration
  $\Delta V_{ij} = 2\pi R_{ij} \, \Delta A_{ij}$, where $R_{ij}$ is the major radius
  at the cell centroid and $\Delta A_{ij}$ is the poloidal cross-section area of the
  cell. These volume elements are used to convert between local densities and integrated
  quantities (e.g., total particle content, stored energy). Grid cell volumes are
  generated by the meshing stage of equilibrium or field-line tracing codes and must
  sum to the total plasma volume when restricted to the confined region. Typical cell
  volumes in medium-resolution equilibrium grids range from $10^{-4}$ to $10^{-2}\,\text{m}^3$.
  See also `grid_cell_volume_element` for the analogous quantity on the 2-D profiles
  grid.
