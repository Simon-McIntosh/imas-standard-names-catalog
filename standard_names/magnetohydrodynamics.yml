- name: radial_perturbed_plasma_velocity
  kind: scalar
  status: draft
  description: Radial component of the complex first-order plasma velocity perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis,
    abstracting over its real and imaginary scalar parts.
  documentation: 'The radial perturbed plasma velocity is the radial projection of
    the full complex eigenfunction of [perturbed_plasma_velocity](name:perturbed_plasma_velocity),
    characterizing the component of first-order oscillatory plasma flow directed along
    the major-radius coordinate $R$ in the right-handed cylindrical $(R, \phi, Z)$
    frame. This component is central to stability analyzes of interchange, ballooning,
    and peeling modes, where cross-field plasma displacement drives the instability.


    The physical time-domain radial perturbation is recovered as:


    $$

    \delta v_r(\mathbf{r}, t) = \mathrm{Re}\!\left[\delta\hat{v}_r(\mathbf{r})\, e^{-i\omega
    t}\right]

    $$


    where $\omega$ is the complex mode eigenfrequency and $\delta\hat{v}_r(\mathbf{r})$
    is the complex scalar radial eigenfunction amplitude. As a complex phasor, it
    decomposes into the [real part](name:radial_perturbed_plasma_velocity_real_part)
    $\mathrm{Re}(\delta\hat{v}_r)$, the in-phase fluid-velocity amplitude, and the
    [imaginary part](name:radial_perturbed_plasma_velocity_imaginary_part) $\mathrm{Im}(\delta\hat{v}_r)$,
    the quadrature component relative to the chosen eigenmode phase normalization.
    The radial plasma displacement eigenfunction is related by $\xi_r = \delta\hat{v}_r
    / (-i\omega)$, linking fluid velocity to flux-surface deformation.


    This eigenfunction component is evaluated by linear MHD eigenvalue solvers as
    part of the full toroidal Fourier harmonic decomposition of the perturbed velocity
    field. It contributes to the per_toroidal_mode_perturbed_energy alongside poloidal
    and toroidal velocity components, and couples to eigenfunction components such
    as [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    through the linearized momentum equation.


    Sign convention: Positive when the radial fluid motion is directed in the direction
    of increasing major radius $R$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_velocity
  - name:radial_perturbed_plasma_velocity_real_part
  - name:radial_perturbed_plasma_velocity_imaginary_part
  - name:perturbed_plasma_pressure_real_part
  arguments:
  - name: perturbed_plasma_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the radial component of the complex first-order plasma
    velocity perturbation eigenfunction for a specified toroidal Fourier mode in linear
    MHD stability analysis.
  documentation: "The radial component of the first-order plasma velocity perturbation\
    \ eigenfunction $\\tilde{v}_r$ is a complex-valued quantity arising in linear\
    \ MHD stability analysis, decomposed over a single toroidal Fourier mode number\
    \ $n$. The imaginary part $\\mathrm{Im}(\\tilde{v}_r)$ is the component 90\xB0\
    \ out of phase with [radial_perturbed_plasma_velocity_real_part](name:radial_perturbed_plasma_velocity_real_part)\
    \ relative to the eigenmode phase reference, and the two parts together fully\
    \ specify the complex radial eigenfunction.\n\nThe full complex radial perturbation\
    \ is reconstructed as:\n\n$$\n\\tilde{v}_r = \\mathrm{Re}(\\tilde{v}_r) + i\\\
    ,\\mathrm{Im}(\\tilde{v}_r)\n$$\n\nwhere $i$ is the imaginary unit. In incompressible\
    \ ideal MHD, the radial velocity perturbation is related to the radial plasma\
    \ displacement $\\tilde{\\xi}_r$ by $\\tilde{v}_r = -i\\omega\\,\\tilde{\\xi}_r$,\
    \ where $\\omega$ is the complex mode frequency whose imaginary part is the growth\
    \ or damping rate.\n\nThis quantity is computed by linear MHD stability solvers\
    \ and its absolute magnitude is eigenfunction-normalization dependent, carrying\
    \ physical meaning only relative to other perturbation components of the same\
    \ mode. The imaginary parts of the toroidal and poloidal projections, [toroidal_perturbed_plasma_velocity_imaginary_part](name:toroidal_perturbed_plasma_velocity_imaginary_part)\
    \ and [poloidal_perturbed_plasma_velocity_imaginary_part](name:poloidal_perturbed_plasma_velocity_imaginary_part),\
    \ together with the real parts of all three components, define the full spatial\
    \ phase structure of the first-order perturbed velocity eigenfield."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  - name:poloidal_perturbed_plasma_velocity_imaginary_part
  arguments:
  - name: radial_perturbed_plasma_velocity
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/imaginary
    status: composed
- name: radial_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the radial component of the complex perturbed plasma velocity
    eigenvector for a specified toroidal Fourier mode in linear magnetohydrodynamics.
    It gives the in-phase radial fluid-velocity amplitude relative to the chosen eigenmode
    phase and normalization.
  documentation: "Radial perturbed plasma velocity real part is the real, in-phase\
    \ amplitude of the radial component of the complex velocity perturbation $\\widetilde{\\\
    mathbf v}$ for a selected toroidal Fourier mode in a linear MHD eigenmode. The\
    \ radial component is taken along the outward flux-surface radial coordinate used\
    \ by the eigenmode representation, for example $(\\rho,\\theta,\\phi)$ or $(s,\\\
    theta,\\phi)$, with $\\phi$ the toroidal angle of the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame where $R$ is major radius and $Z$ is vertical height. Because\
    \ a complex eigenvector may be multiplied by an arbitrary phase factor, this real\
    \ part is meaningful together with the corresponding imaginary part and the chosen\
    \ eigenmode normalization.\n\nNeglecting equilibrium flow and viscosity, the complex\
    \ velocity perturbation is governed by the linearized ideal-MHD momentum balance\
    \ for a perturbation proportional to $\\exp[i(n\\phi-\\omega t)]$:\n\n$$\n-i\\\
    omega \\rho_0 \\widetilde{\\mathbf v} = -\\nabla \\widetilde{p} + \\widetilde{\\\
    mathbf j}\\times \\mathbf B_0 + \\mathbf j_0\\times \\widetilde{\\mathbf B}\n\
    $$\n\nwhere $n$ is the toroidal mode number, $\\omega$ is the angular eigenfrequency\
    \ in rad s$^{-1}$, $t$ is time in s, $\\rho_0$ is the equilibrium mass density\
    \ in kg m$^{-3}$, $\\widetilde{\\mathbf v}$ is the perturbed velocity in m s$^{-1}$,\
    \ $\\widetilde p$ is the perturbed pressure in Pa, $\\widetilde{\\mathbf j}$ and\
    \ $\\mathbf j_0$ are the perturbed and equilibrium current densities in A m$^{-2}$,\
    \ and $\\mathbf B_0$ and $\\widetilde{\\mathbf B}$ are the equilibrium and perturbed\
    \ magnetic fields in T. The documented quantity is $\\operatorname{Re}(\\widetilde{\\\
    mathbf v}\\cdot\\hat{\\mathbf e}_\\rho)$ for flux coordinates $(\\rho,\\theta,\\\
    phi)$, or the analogous projection onto $\\hat{\\mathbf e}_s$ for flux coordinates\
    \ $(s,\\theta,\\phi)$.\n\nThis quantity is normally computed from linear MHD eigenvalue\
    \ calculations using an equilibrium magnetic field, pressure, density, current\
    \ profile, and boundary conditions. Physical amplitudes may be inferred by fitting\
    \ the complex eigenfunction to diagnostics sensitive to plasma motion or mode\
    \ structure, such as spectroscopic velocity measurements, reflectometry, beam-emission\
    \ measurements, or magnetic perturbation measurements; the real part is the component\
    \ in phase with the selected phase reference.\n\nBecause linear eigenvectors are\
    \ often normalized arbitrarily, numerical amplitudes can reflect the chosen normalization\
    \ rather than an absolute fluctuation level. When scaled to measured mode amplitudes,\
    \ small coherent MHD perturbations commonly have radial velocity amplitudes of\
    \ 1-10^4 m.s^-1, while strongly driven Alfv\xE9nic activity or disruption-preceding\
    \ dynamics can reach 10^4-10^5 m.s^-1.\n\nSign convention: Positive when the perturbed\
    \ radial plasma velocity points outward, toward increasing flux-surface radial\
    \ coordinate $\\rho$ or $s$."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:radial_perturbed_plasma_velocity_imaginary_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_real_part
  arguments:
  - name: radial_perturbed_plasma_velocity
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    status: composed
- name: radial_plasma_velocity
  kind: scalar
  status: draft
  description: Radial component of the bulk plasma center-of-mass velocity, projected
    onto the outward major-radius direction in the right-handed cylindrical (R, phi,
    Z) frame.
  documentation: 'The radial plasma velocity $v_R$ is the projection of the [plasma_velocity](name:plasma_velocity)
    vector onto the $\hat{R}$ unit vector of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the major radius measured from the machine symmetry axis.
    It represents the inward or outward bulk mass flow of the plasma and is a key
    quantity for radial transport analysis in MHD descriptions of magnetized plasmas.


    The defining relation is:


    $$

    v_R = \mathbf{v}_\mathrm{plasma} \cdot \hat{R}

    $$


    where $\mathbf{v}_\mathrm{plasma}$ is the mass-weighted mean velocity of all plasma
    species and $\hat{R}$ points in the direction of increasing major radius $R$.


    Radial flows arise from pressure-gradient-driven forces, $\mathbf{E}\times\mathbf{B}$
    convection, and MHD instability dynamics. The quantity is evaluated from time-dependent
    MHD simulations on unstructured spatial grids and can be inferred experimentally
    through charge exchange recombination spectroscopy combined with magnetic equilibrium
    reconstruction. The complementary cylindrical velocity components are [toroidal_plasma_velocity](name:toroidal_impurity_ion_velocity_at_measurement_position)
    and [vertical_plasma_velocity](name:vertical_plasma_velocity); for the projection
    along the local magnetic-field direction, see [parallel_plasma_velocity](name:parallel_plasma_velocity).


    Sign convention: Positive when directed in the direction of increasing major radius
    $R$, i.e., outward from the machine symmetry axis.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:toroidal_impurity_ion_velocity_at_measurement_position
  - name:vertical_plasma_velocity
  - name:parallel_plasma_velocity
