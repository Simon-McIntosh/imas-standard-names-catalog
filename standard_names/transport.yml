- name: toroidal_component_of_total_current_density
  kind: scalar
  status: draft
  description: 'Flux-surface-averaged toroidal component of the total current density,
    encompassing all current channels: ohmic (inductive), neoclassical bootstrap,
    and all externally driven contributions. The averaging convention weights by 1/R,
    yielding an effective current density that is consistent with Ampere''s law relating
    toroidal current to the poloidal magnetic field.'
  documentation: "The total toroidal current density $j_\\phi$ is the flux-surface-averaged\
    \ toroidal component of the full current density $\\mathbf{J}$, summing all physical\
    \ current channels: the ohmic current driven by the parallel inductive electric\
    \ field, the neoclassical bootstrap current arising from pressure and temperature\
    \ gradients in the presence of trapped particles, and any externally driven non-inductive\
    \ contributions such as neutral beam injection (NBI) current drive and radio-frequency\
    \ (RF) current drive.\n\nThe flux-surface averaging convention used is\n$$j_\\\
    phi = \\frac{\\langle J_\\phi / R \\rangle}{\\langle 1/R \\rangle},$$\nwhere $R$\
    \ is the major radius in the right-handed cylindrical $(R, \\phi, Z)$ frame, $\\\
    hat{\\phi}$ is the unit vector in the direction of increasing toroidal angle,\
    \ and $\\langle \\cdot \\rangle$ denotes the flux-surface average. This particular\
    \ weighting is chosen because, in axisymmetric geometry, the flux-surface average\
    \ $\\langle J_\\phi / R \\rangle$ is directly related to the source term for the\
    \ poloidal magnetic flux via the toroidal component of Ampere's law in integral\
    \ form. The resulting quantity $j_\\phi$ is therefore an effective current density\
    \ \u2014 it is not identical to the arithmetic flux-surface average $\\langle\
    \ J_\\phi \\rangle$ of the toroidal current density, but has the physically important\
    \ property of linking directly to the poloidal field structure.\n\nThis quantity\
    \ represents the complete toroidal current budget. It differs from the non-inductive\
    \ current density (name:toroidal_component_of_non_inductive_current_density),\
    \ which excludes the ohmic component, and from the total driven current density\
    \ (name:toroidal_component_of_total_driven_current_density) and driven current\
    \ density (name:toroidal_component_of_driven_current_density), which isolate only\
    \ externally driven non-inductive channels.\n\nTypical core values range from\
    \ approximately $0.5 \\times 10^6$ to $3 \\times 10^6$ A m$^{-2}$ in high-performance\
    \ tokamak discharges, with the profile peaking on the magnetic axis and falling\
    \ steeply toward the plasma boundary. The profile is inferred from equilibrium\
    \ reconstruction constrained by external magnetic measurements, typically supplemented\
    \ by internal measurements such as motional Stark effect (MSE) polarimetry.\n\n\
    Sign convention: Positive when the current density is directed in the direction\
    \ of increasing toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\\
    phi, Z)$ frame."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_driven_current_density
  - name:toroidal_component_of_total_driven_current_density
  constraints: []
  sources:
  - id: dd:core_profiles/profiles_1d/j_tor
    dd_path: core_profiles/profiles_1d/j_tor
    status: composed
- name: toroidal_component_of_total_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for toroidal angular momentum transport across
    flux surfaces, representing the combined contribution of all plasma species (both
    ions of all charge states and electrons). This total coefficient governs the diffusive
    part of the flux-surface-averaged radial toroidal momentum flux and is distinct
    from the plasma-species-only diffusivity in that it explicitly accounts for every
    charged species present.
  documentation: 'The toroidal-component total momentum diffusivity $D_\phi^\mathrm{tot}$
    is the effective transport coefficient that relates the diffusive part of the
    flux-surface-averaged radial toroidal angular momentum flux to the local gradient
    of the flux-surface-averaged toroidal momentum density.


    For a plasma with species index $s$ (summing over all ions of every charge state
    and electrons), the flux-surface-averaged radial toroidal angular momentum flux
    density is written


    $$\langle \Gamma_\phi^\mathrm{tot} \rangle_{\!FS} = -D_\phi^\mathrm{tot}\, n_\mathrm{tot}\,
    m_\mathrm{eff}\, \frac{\partial \langle v_{\phi,\mathrm{eff}} \rangle_{\!FS}}{\partial
    r_\mathrm{eff}},$$


    where $n_\mathrm{tot}$ is the total particle number density, $m_\mathrm{eff}$
    is an appropriate effective mass, $\langle v_{\phi,\mathrm{eff}} \rangle_{\!FS}$
    is the flux-surface-averaged effective toroidal velocity, and $r_\mathrm{eff}$
    is the effective minor-radius-like label (e.g., $\rho_\mathrm{tor}$ or $\rho_\mathrm{pol}$)
    increasing outward from the magnetic axis to the plasma boundary. The flux-surface
    average $\langle\cdots\rangle_{\!FS}$ is taken over the magnetic flux surface
    at constant $r_\mathrm{eff}$.


    **Relationship to sibling quantities:** The accepted standard name `toroidal_component_of_plasma_momentum_diffusivity`
    sums over bulk plasma species (typically ions and electrons treated as a combined
    fluid), while `toroidal_component_of_total_momentum_diffusivity` is the all-inclusive
    sum that additionally folds in any minority species, impurities, or fast-particle
    populations. In practice, when all ion charge states and electrons are already
    included in the plasma-species sum, the two quantities coincide; the distinction
    becomes operationally important when fast ions or heavy impurities carry non-negligible
    momentum.


    For individual ion species or charge states, see `toroidal_component_of_ion_momentum_diffusivity`
    and `toroidal_component_of_ion_state_momentum_diffusivity`.


    **Locality and averaging scope:** This coefficient is a local, flux-surface-averaged
    quantity defined pointwise on the radial grid. It encapsulates all diffusive mechanisms
    contributing to toroidal momentum transport at each flux surface, including neoclassical
    and anomalous (turbulent) contributions.


    **Typical values:** In tokamak core plasmas, $D_\phi^\mathrm{tot}$ typically ranges
    from $0.1$ to $10\,\mathrm{m^2\,s^{-1}}$, with experimental values often found
    to be comparable to the ion thermal diffusivity $\chi_i$.


    Sign convention: Positive when the diffusive toroidal momentum flux is directed
    outward, i.e., in the direction of increasing effective minor radius away from
    the magnetic axis.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:toroidal_component_of_ion_momentum_diffusivity
  - name:toroidal_component_of_plasma_momentum_diffusivity
  - name:total_momentum_diffusivity
  - name:ion_energy_diffusivity
  constraints: []
  arguments:
  - name: total_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/momentum_tor/d
    dd_path: core_transport/model/profiles_1d/momentum_tor/d
    status: composed
- name: toroidal_component_of_trapped_fast_ion_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the current density carried by trapped fast (non-thermal)
    ions, excluding electron and thermal ion back-currents (drag currents).
  documentation: "The toroidal current density $J_{\\phi,\\mathrm{trap,fast}}$ quantifies\
    \ the net toroidal current per unit area driven by fast ions on trapped (banana)\
    \ orbits, which do not complete full poloidal circuits but instead bounce between\
    \ mirror points. Because trapped particles carry no net toroidal current in a\
    \ purely axisymmetric equilibrium in the absence of collisions, the non-zero value\
    \ arises from finite-orbit-width effects and collisional processes such as the\
    \ Ohkawa effect; it explicitly excludes the return currents carried by thermal\
    \ electrons and bulk ions. This distinguishes it from [toroidal_component_of_trapped_particle_current_density](name:toroidal_component_of_trapped_particle_current_density),\
    \ which includes all trapped-particle species and their back-currents, and from\
    \ the full fast-ion toroidal current [toroidal_component_of_fast_ion_current_density](name:toroidal_component_of_fast_ion_current_density),\
    \ which integrates over both passing and trapped orbits. The complementary passing-orbit\
    \ contributions are given by [toroidal_component_of_co_passing_fast_ion_current_density](name:toroidal_component_of_co_passing_fast_ion_current_density)\
    \ and [toroidal_component_of_counter_passing_fast_ion_current_density](name:toroidal_component_of_counter_passing_fast_ion_current_density).\
    \ Typical magnitudes in neutral-beam-heated tokamaks are of order $10^3$\u2013\
    $10^5$ A m$^{-2}$ in the plasma core, with the sign and spatial profile depending\
    \ on the beam injection geometry and the local $q$ profile. This quantity is computed\
    \ from kinetic or Fokker-Planck distribution-function codes that track fast-ion\
    \ phase-space populations.\n\nSign convention: Positive when the current density\
    \ is directed in the direction of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_trapped_particle_current_density
  - name:toroidal_component_of_fast_ion_current_density
