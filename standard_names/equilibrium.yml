      kind: llm
- name: elongation_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless ratio of the full vertical extent to the full radial
    extent of the last closed magnetic-flux-surface cross-section.
  documentation: 'Plasma-boundary elongation measures the vertical stretching of the
    last closed magnetic-flux-surface cross-section relative to its radial width.
    It is evaluated at fixed toroidal angle in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height.


    The defining ratio is


    $$

    \kappa_b = \frac{Z_{\max}-Z_{\min}}{R_{\max}-R_{\min}}

    $$


    where $Z_{\max}$ and $Z_{\min}$ are the maximum and minimum vertical coordinates
    of the boundary, and $R_{\max}$ and $R_{\min}$ are its maximum and minimum radial
    coordinates.


    This full-extent boundary measure is distinct from [elongation_of_flux_surface](name:elongation_of_flux_surface),
    which characterizes individual nested flux surfaces, and from [minor_radius_of_plasma_boundary](name:minor_radius_of_plasma_boundary),
    which characterizes radial half-width.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:minor_radius_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/boundary/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-elongation
    dd_documentation:
      leaf: Elongation of the plasma boundary
      parent_path: equilibrium/time_slice/boundary
