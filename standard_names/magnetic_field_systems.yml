- name: major_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Major radius (cylindrical $R$) coordinate of the center of a passive
    loop's annular cross-section in the tokamak frame.
  documentation: "The major radius of a passive loop is the radial coordinate of the\
    \ center of its annular conductor cross-section, measured in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ system of the tokamak. Placed at known toroidal\
    \ locations, passive loops serve as diagnostic sensors for measuring poloidal\
    \ magnetic flux evolution during plasma events, providing constraints for equilibrium\
    \ reconstruction. The major radius, together with the inner and outer radii of\
    \ the annular conductor, defines the loop's geometric centerline position. Typical\
    \ values range from 1.5\u20134.0\u202Fm depending on the tokamak size, with the\
    \ loop embedded in the passive stabilizing shell. See also [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)\
    \ and [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop) for the\
    \ radial boundaries of the conductor.\n\nSign convention: Positive when the center\
    \ lies at a larger cylindrical major radius $R$.\n\nMeasured during machine assembly\
    \ or derived from engineering drawings; the value is static for a given loop element."
  unit: m
  physics_domain: magnetic_field_systems
  links:
