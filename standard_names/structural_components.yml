        in the grid subset.
      parent_path: wall/description_ggd/ggd/em_force_density
      parent: Electromagnetic force density computed by the cross-product of j_total
        x b_field and given on various grid subsets
      data_type: FLT_1D
      unit: N.m^-3
      coordinates:
      - wall/description_ggd/ggd/em_force_density/r
    enhanced_context:
      description: Vertical (Z) coordinate of em force density.
      kind: template
- name: volumetric_fraction_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Volumetric fraction of a breeder blanket layer is the share of a specified
    constituent material or phase in the layer's bulk volume. It is a dimensionless
    effective-medium composition parameter for homogenized breeder-blanket layer properties.
  documentation: 'Volumetric fraction of a breeder blanket layer is the part-to-whole
    volume ratio for one specified constituent material, phase, void region, coolant
    region, or gas region within a breeder blanket layer. It describes the layer composition
    used for homogenized material properties over the same geometric region.


    For constituent $i$, the fraction is defined by:


    $$

    f_i = \frac{V_i}{V_\mathrm{layer}}

    $$


    where $f_i$ is the volumetric fraction, $V_i$ is the volume of constituent $i$
    in cubic meters, and $V_\mathrm{layer}$ is the total bulk volume of the same breeder
    blanket layer in cubic meters over the homogenization region.


    The numerator and denominator must refer to the same layer region. For an exhaustive
    non-overlapping partition of that region, $0 \le f_i \le 1$ and $\sum_i f_i =
    1$; separately represented voids, coolant, or gas regions are included as their
    own constituents. This quantity is distinct from mass fraction, atomic fraction,
    porosity, and selected-solid packing factor, and its layer denominator differs
    from the whole-blanket volume described by [volume of breeder blanket](name:volume_of_breeder_blanket).'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:fraction_of_breeder_blanket_layer
  arguments:
  - name: fraction_of_breeder_blanket_layer
    operator: volumetric
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/layer/material_volume_fraction
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-layer-material_volume_fraction
    dd_documentation:
      leaf: Volume fraction of each material entering the composition of this layer
      parent_path: breeding_blanket/module/layer
      parent: Set of layers in the blanket module
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - breeding_blanket/module/layer/material
    enhanced_context:
      description: Volume fraction of each constituent material in a breeding blanket
        layer, describing the relative proportion of each material component within
        the composite layer. Used in neutronics and thermal-hydraulic calculations.
      kind: llm
- name: y_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: active
  description: Signed y coordinate of the geometric centroid of a ferritic element
    in the right-handed Cartesian (x, y, z) frame, with z aligned to vertical Z.
  documentation: 'The quantity is the signed Cartesian y position of the geometric
    centroid of one ferritic element. The coordinate is defined in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, with coordinate values $(x,y,z)$
    and $\hat{z}=\hat{Z}$.


    $$

    y_c = \frac{1}{V_e}\int_{V_e} y\,dV

    $$


    where $y_c$ and $y$ are Cartesian y coordinates measured in m, $V_e$ is the ferritic-element
    volume measured in m$^3$, and $dV$ is a differential volume element. The integration
    covers the entire element, so this is a volume centroid rather than a surface
    centroid or a selected-point coordinate. The corresponding orthogonal centroid
    coordinates are [x coordinate of the ferritic element centroid](name:x_coordinate_of_ferritic_element_centroid)
    and [z coordinate of the ferritic element centroid](name:z_coordinate_of_ferritic_element_centroid).


    Sign convention: Positive when the centroid displacement from the coordinate origin
    has a positive projection onto $\hat{y}$.'
  unit: m
  physics_domain: structural_components
  links:
  - name:x_coordinate_of_ferritic_element_centroid
  - name:z_coordinate_of_ferritic_element_centroid
  sources:
  - dd_path: ferritic/object/centroid/y
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-centroid-y
    dd_documentation:
