      unit: V.m^-1
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for plus.
      kind: template
- name: parallel_wave_electric_field_amplitude
  kind: scalar
  status: active
  description: Non-negative amplitude of the complex wave electric-field phasor projected
    along the local equilibrium magnetic-field direction, with phase information discarded.
  documentation: 'This quantity is the magnitude of the complex wave electric-field
    phasor parallel to the local equilibrium magnetic field. It retains the strength
    of the parallel component while discarding its phase.


    $$

    E_{\parallel,\mathrm{amp}} = \left|E_{\parallel}\right| = \sqrt{\left(\operatorname{Re}
    E_{\parallel}\right)^2 + \left(\operatorname{Im} E_{\parallel}\right)^2}

    $$


    Here $E_{\parallel}$ is the complex [parallel wave electric field](name:parallel_wave_electric_field),
    and $\operatorname{Re} E_{\parallel}$ and $\operatorname{Im} E_{\parallel}$ are
    its real and imaginary quadrature components. The amplitude is non-negative and
    must not be interpreted as a signed field component; the phase-resolved information
    remains in the parent phasor.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:parallel_wave_electric_field
  arguments:
  - name: parallel_wave_electric_field
    operator: amplitude
    operator_kind: unary_postfix
