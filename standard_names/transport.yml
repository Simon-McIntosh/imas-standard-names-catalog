- name: volume_averaged_iron_density
  kind: scalar
  status: draft
  description: Volume-averaged iron density is the total number density of ionized
    iron, summed over Fe charge states and averaged over the plasma volume.
  documentation: 'Volume-averaged iron density is the plasma-volume mean of the elemental
    iron ion number density. It includes all ionized charge states of iron and is
    non-negative because it is an average of number densities.


    The volume average is defined by integrating the charge-state-summed iron density
    over the plasma volume:


    $$

    \langle n_\mathrm{Fe} \rangle_V = \frac{1}{V_p} \int_{V_p} \left(\sum_{q=1}^{26}
    n_{\mathrm{Fe}^{q+}}(\mathbf{r})\right)\, dV

    $$


    where $V_p$ is the plasma volume in m$^3$, $dV$ is a volume element in m$^3$,
    $q$ is the ion charge-state index from singly ionized iron to fully stripped iron,
    and $n_{\mathrm{Fe}^{q+}}$ is the local number density of charge state $q$ in
    m$^{-3}$.


    In practice this quantity is inferred from impurity diagnostics and modeling that
    estimate the spatial distribution and charge-state balance of iron, then integrate
    over the confined plasma volume. It is complementary to local quantities such
    as [iron_density_at_magnetic_axis](name:iron_density_at_magnetic_axis), chord-integrated
    measurements such as [line_averaged_iron_density](name:line_averaged_iron_density),
    and the normalized impurity content represented by [iron_fraction](name:iron_fraction).


    Typical values are strongly device- and scenario-dependent because iron sources
    depend on plasma-facing materials, sputtering, erosion, transport, and core accumulation.
    In magnetically confined plasmas iron is usually a trace impurity, commonly interpreted
    through its fraction of the electron density; broad representative volume averages
    can range from about $10^{13}$-$10^{17}$ m$^{-3}$ depending on operating conditions.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:iron_density
  - name:line_averaged_iron_density
  sources:
  - id: dd:summary/volume_average/n_i/iron/value
    dd_path: summary/volume_average/n_i/iron/value
    status: composed
- name: volume_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Plasma-volume mean of the total nitrogen number density, summed over
    all ionization states from neutral to fully stripped nitrogen.
  documentation: 'The volume-averaged nitrogen density $\langle n_N \rangle$ is the
    spatial mean of the local nitrogen number density over the entire plasma volume,
    with contributions from all charge states between neutral $N^0$ and fully stripped
    $N^{7+}$. It condenses the spatially varying impurity field into a single scalar
    that represents the total nitrogen inventory of the discharge, complementing the
    local [nitrogen_density](name:nitrogen_density) profiles resolved in space.


    The defining spatial average is:


    $$

    \langle n_N \rangle = \frac{1}{V} \int_V n_N(\mathbf{r}) \, dV

    $$


    where $V$ is the confined plasma volume and $n_N(\mathbf{r})$ is the local nitrogen
    number density at position $\mathbf{r}$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, aggregated across all ionization states.


    Nitrogen is deliberately seeded in fusion devices to radiate power in the divertor
    and scrape-off layer, reducing heat loads on plasma-facing components. The volume-averaged
    density is inferred from spectroscopic measurements of nitrogen line emission
    or charge-exchange recombination spectroscopy combined with global particle-balance
    analysis.


    In nitrogen-seeded H-mode discharges, values range from $10^{17}$ to $10^{18}$
    m$^{-3}$, a small fraction of the total electron density yet radiatively significant.
    For a chord-integrated counterpart, see [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density);
    [nitrogen_fraction](name:nitrogen_fraction) normalizes this density to the local
    electron density. The analogous quantity for neon impurity seeding is [volume_averaged_neon_density](name:volume_averaged_neon_density).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:nitrogen_density
  - name:line_averaged_nitrogen_density
  - name:nitrogen_fraction
  - name:volume_averaged_neon_density
  sources:
  - id: dd:summary/volume_average/n_i/nitrogen/value
    dd_path: summary/volume_average/n_i/nitrogen/value
    status: composed
- name: volume_averaged_xenon_density
  kind: scalar
  status: draft
  description: Volume average of the elemental xenon ion number density over the full
    plasma volume. The local elemental density is summed over xenon ionization states,
    giving a single global measure of xenon impurity content.
  documentation: 'Volume-averaged xenon density is the plasma-volume average of the
    local elemental xenon ion number density. The elemental xenon ion density is the
    sum of all xenon ionic charge-state densities, from singly ionized xenon through
    fully stripped xenon, and does not distinguish how the xenon population is distributed
    among charge states.


    The volume average is defined by integrating the local elemental xenon ion density
    over the plasma volume:


    $$

    \langle n_{\mathrm{Xe}} \rangle_V = \frac{1}{V_p}\int_{V_p} n_{\mathrm{Xe}}(\mathbf{x})\,dV,\qquad
    n_{\mathrm{Xe}} = \sum_{q=1}^{54} n_{\mathrm{Xe}^{q+}}

    $$


    where $V_p$ is the plasma volume, $n_{\mathrm{Xe}}(\mathbf{x})$ is the local elemental
    xenon ion number density, and $n_{\mathrm{Xe}^{q+}}$ is the number density of
    xenon ions with charge state $q+$. The result has units of $\mathrm{m^{-3}}$.


    In practice this quantity is inferred from impurity transport analysis, spectroscopic
    measurements of xenon line emission, radiation balance, and equilibrium or transport
    estimates of the plasma volume. It is useful as a global impurity-content measure
    for high-$Z$ xenon seeding, radiative power studies, dilution estimates, and comparisons
    with line-averaged xenon density or xenon fraction.


    Typical values in trace-injection or controlled radiative-seeding studies are
    about $10^{14}-10^{17}\ \mathrm{m^{-3}}$. Strong impurity injection or transient
    mitigation scenarios can produce larger effective volume averages, approaching
    $10^{18}\ \mathrm{m^{-3}}$ for short periods.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:xenon_density
  - name:line_averaged_xenon_density
  - name:xenon_fraction
  arguments:
  - name: xenon_density
    operator: volume_averaged
    operator_kind: qualifier
