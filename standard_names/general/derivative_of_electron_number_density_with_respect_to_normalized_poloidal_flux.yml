name: derivative_of_electron_number_density_with_respect_to_normalized_poloidal_flux
status: draft
cocos_transformation_type: one_like
description: Gradient of electron number density with respect to the normalized poloidal
  flux coordinate $\psi_N$, characterizing profile steepness.
documentation: "The quantity $dn_e/d\\psi_N$ measures how rapidly the electron density\
  \ changes per unit of normalized poloidal flux $\\psi_N \\in [0,1]$. Because $\\\
  psi_N$ is dimensionless, the derivative retains the unit $\\mathrm{m^{-3}}$. In\
  \ the pedestal region of H-mode plasmas, $|dn_e/d\\psi_N|$ can reach $10^{20}$\u2013\
  $10^{21}\\;\\mathrm{m^{-3}}$ per unit $\\psi_N$, reflecting the steep transport\
  \ barrier. This gradient is central to peeling\u2013ballooning stability analysis,\
  \ where large pressure gradients drive edge-localized modes (ELMs). It is typically\
  \ computed from mtanh fits to Thomson scattering data (see `mtanh_pedestal_fit_coefficients`).\
  \ See also `electron_density_at_pedestal` and `maximum_of_derivative_of_electron_number_density_with_respect_to_normalized_poloidal_flux`\
  \ for the peak gradient."
