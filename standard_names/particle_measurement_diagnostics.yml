- name: area_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Geometric cross-sectional area of a diagnostic aperture that defines
    the entrance pupil for a camera, spectrometer, or bolometer channel.
  documentation: 'The geometric surface area $A_{\text{ap}}$ of a diagnostic aperture
    opening is a fundamental parameter that defines the entrance pupil for an optical
    or particle diagnostic channel. Together with the line-of-sight geometry Proxy,
    it determines the etendue ($A_{\text{ap}} \cdot \Omega$) where $\Omega$ is the
    solid angle subtended by the aperture, governing the photon or particle collection
    efficiency of the diagnostic. This quantity is derived from the aperture''s geometric
    data and is used across a wide range of fusion diagnostics including spectroscopy,
    bolometry, neutron, and imaging systems. Typical aperture areas range from $10^{-6}\,\text{m}^2$
    for visible spectroscopy channels to $10^{-2}\,\text{m}^2$ for bolometer cameras.
    The geometric area described here must be distinguished from the effective area
    that accounts for aperture transmission and vignetting. See also [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture),
    [area_of_optical_element](name:area_of_optical_element), and [area_of_reflectometer_antenna](name:area_of_reflectometer_antenna).


    Sign convention: Positive when the surface normal vector points outward from the
    diagnostic housing.


    Measurement of the aperture opening area is typically performed during diagnostic
    construction using precision mechanical measurements or optical profilometry,
    with the value fixed for the duration of the diagnostic''s operational lifetime.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
