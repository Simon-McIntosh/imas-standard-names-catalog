- name: density_at_limiter
  kind: scalar
  status: draft
  description: Local particle number density of any plasma species evaluated in the
    boundary plasma immediately adjacent to the plasma-facing limiter surface, on
    the plasma side of the magnetic presheath or sheath entrance.
  documentation: "Number density of a specified plasma species \u2014 electrons, fuel\
    \ ions, or impurity ions \u2014 evaluated at the plasma-limiter interface on the\
    \ plasma side of the magnetic presheath or sheath entrance. The limiter terminates\
    \ open magnetic field lines in the scrape-off layer (SOL), and this boundary density\
    \ sets the particle source for both the confining plasma and for wall-material\
    \ interactions including sputtering, recycling, and impurity release.\n\nThe macroscopic\
    \ number density is related to the velocity distribution function $f_s$ of species\
    \ $s$ by:\n\n$$\nn_s = \\int f_s(\\mathbf{v}) \\, d^3v\n$$\n\nwhere the integral\
    \ is taken over all velocities at the evaluation point immediately adjacent to\
    \ the limiter.\n\nQuasineutrality at the sheath entrance couples the [electron_density_at_limiter](name:electron_density_at_limiter)\
    \ to the charge-weighted sum of ion densities, $n_e \\approx \\sum_s Z_s n_s$,\
    \ where $Z_s$ is the ion charge number of species $s$. The charge-state-summed\
    \ ion total is given by [total_ion_density_at_limiter](name:total_ion_density_at_limiter),\
    \ while impurity species such as [carbon_density_at_limiter](name:carbon_density_at_limiter)\
    \ and [oxygen_density_at_limiter](name:oxygen_density_at_limiter) contribute to\
    \ the local effective charge. The analogous family at divertor target surfaces\
    \ is [density_at_divertor_target](name:density_at_divertor_target).\n\nThis density\
    \ is measured by Langmuir probes embedded in or flush-mounted near the limiter,\
    \ or inferred from edge spectroscopy combined with ionization balance modeling.\
    \ Typical boundary plasma densities at limiter surfaces span $10^{17}$\u2013$10^{20}$\
    \ m$^{-3}$ depending on species, heating power, and plasma configuration.\n\n\
    Sign convention: Positive when the local plasma contains particles of the specified\
    \ species at the evaluation point adjacent to the limiter."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density_at_limiter
  - name:total_ion_density_at_limiter
  - name:carbon_density_at_limiter
  - name:oxygen_density_at_limiter
  - name:density_at_divertor_target
- name: argon_density_at_limiter
  kind: scalar
  status: draft
  description: Argon ion number density immediately adjacent to a limiter material
    surface, evaluated in the boundary plasma at the plasma-limiter contact. It represents
    the local concentration of ionized argon impurity at the plasma-wall interface.
  documentation: 'Argon density at the limiter is the number density of ionized argon
    in the boundary plasma immediately adjacent to a material limiter surface. The
    evaluation point is the plasma-facing sheath-edge region at the plasma-limiter
    contact, not inside the solid limiter and not a core, pedestal, or flux-surface-averaged
    value.


    For an argon impurity population resolved by charge state, the local ion density
    is


    $$

    n_{\mathrm{Ar,lim}} = \lim_{\Delta V \to 0} \frac{1}{\Delta V}\sum_{q=1}^{18}
    \Delta N_{\mathrm{Ar}^{q+}}

    $$


    where $q$ is the argon charge state, $\Delta N_{\mathrm{Ar}^{q+}}$ is the number
    of argon ions in charge state $q$ within a small plasma sampling volume adjacent
    to the limiter, and $\Delta V$ is that volume in m$^3$, giving $n_{\mathrm{Ar,lim}}$
    in m$^{-3}$. Neutral argon atoms are not included in this ion density.


    In practice this quantity is obtained from boundary-plasma and impurity-transport
    modeling, or inferred from argon line emission using collisional-radiative modeling
    together with local electron density and temperature. It is governed by parallel
    transport to the limiter, ionization and recombination balance, recycling and
    impurity source rates, and radiative cooling in the scrape-off-layer plasma near
    the limiter.


    Typical values for trace argon seeding near limiter contact are about $10^{14}$-$10^{18}$
    m$^{-3}$. Strong local impurity sources or highly radiating edge conditions can
    produce values approaching $10^{19}$ m$^{-3}$, while unseeded plasmas may be below
    spectroscopic detectability.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:argon_density_at_plasma_boundary
  - name:argon_density_at_pedestal
  - name:neon_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: argon
    operator_kind: qualifier
- name: beryllium_density_at_limiter
  kind: scalar
  status: draft
  description: Local number density of charged beryllium ions in the boundary plasma
    immediately adjacent to a limiter surface, summed over all charged ionization
    states. Neutral beryllium atoms are not included.
  documentation: 'Beryllium density at a limiter is the local total number density
    of charged beryllium ions in the plasma immediately next to a limiter material
    surface. It is an impurity ion density for beryllium charge states and excludes
    neutral beryllium atoms, molecules, dust, and beryllium bound in the solid wall.


    The total charged beryllium ion density is the sum over the charged ionization
    states of beryllium:


    $$

    n_{\mathrm{Be,lim}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{Be,lim}}$ is the total charged beryllium ion density in m^-3,
    $n_{\mathrm{Be}^{q+},\mathrm{lim}}$ is the number density in m^-3 of beryllium
    ions with charge $q e$, and $q=1,\ldots,4$ for beryllium.


    In practice, this density may be evaluated by summing charge-state densities in
    a boundary-plasma or impurity-transport calculation, or inferred from charge-state-sensitive
    spectroscopic observations together with an atomic population model and local
    plasma parameters. The definition is independent of the method used to obtain
    the charge-state densities.


    As a number density, its physically allowed range is $n_{\mathrm{Be,lim}} \ge
    0$ m^-3. A value of 0 m^-3 means that no charged beryllium ions are present at
    the limiter location within the sensitivity of the model or measurement; finite
    values are often interpreted relative to the local electron density or main-ion
    density because absolute magnitudes depend strongly on local boundary-plasma conditions
    and discharge phase.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_divertor_target
  arguments:
  - name: density_at_limiter
    operator: beryllium
    operator_kind: qualifier
- name: boron_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed boron ion number density immediately adjacent to
    a plasma-facing limiter surface.
  documentation: 'Boron density at the limiter is the local number density of boron
    ions in the plasma volume immediately adjacent to a plasma-facing limiter, where
    open scrape-off-layer field lines intersect a material boundary. Unless a single
    charge state is specified, it is the charge-state-summed boron ion population
    and is the boron-resolved component of [density_at_limiter](name:density_at_limiter).


    For a representative small plasma volume next to the limiter, the localized density
    $n_{B,\mathrm{lim}}$ is the boron ion count per unit volume:


    $$

    n_{B,\mathrm{lim}} = \frac{N_B}{V}

    $$


    where $N_B$ is the number of boron ions in the sampled volume and $V$ is that
    volume in m$^3$, giving $n_{B,\mathrm{lim}}$ in m$^{-3}$. Because fully stripped
    boron carries charge $Z_B = 5$, its contribution to the effective charge $Z_\mathrm{eff}
    = \sum_k n_k Z_k^2 / n_e$ is large relative to its number fraction, so even sub-percent
    boron concentrations affect plasma resistivity and the radiated power budget.


    This quantity is inferred from edge impurity emission spectroscopy combined with
    collisional-radiative or atomic-rate modeling, from active charge-exchange recombination
    spectroscopy, or from scrape-off-layer transport calculations constrained by limiter
    source estimates. The limiter value refers to the plasma-side impurity density
    adjacent to the material surface, not to boron bound within the solid limiter
    material.


    Typical limiter-adjacent boron densities depend strongly on wall conditioning,
    limiter material history, plasma density, erosion source strength, and ionization
    balance. Trace impurity values in edge modeling are often roughly $10^{14}$-$10^{18}$
    m$^{-3}$, while localized transient sources, boron injection, or freshly boronized
    surfaces can produce values outside this range.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:boron_density_at_pedestal
  - name:boron_density_at_divertor_target
  - name:boron_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
    operator: boron
    operator_kind: qualifier
- name: carbon_density_at_limiter
  kind: scalar
  status: draft
  description: Unweighted number density of ionized carbon in the boundary plasma
    immediately adjacent to a limiter, summed over all carbon ionization stages. It
    excludes neutral carbon atoms and does not weight charge states by charge or mass.
  documentation: 'Carbon density at a limiter is the local number density of carbon
    impurity ions in the boundary plasma next to a limiter surface. It is an unweighted
    sum over ionized carbon charge states and excludes neutral carbon atoms.


    The charge-state-summed ion density is defined by:


    $$

    n_{\mathrm{C,ion}} = \sum_{q=1}^{6} n_{\mathrm{C}^{q+}}

    $$


    where $n_{\mathrm{C}^{q+}}$ is the number density of carbon ions with charge state
    $q$ in $\mathrm{m}^{-3}$, and $n_{\mathrm{C,ion}}$ is also in $\mathrm{m}^{-3}$.
    The sum runs over ionized carbon from $\mathrm{C}^+$ through fully stripped $\mathrm{C}^{6+}$;
    neutral carbon $\mathrm{C}^0$ is not included.


    In practice this quantity is obtained from local impurity charge-state populations
    in boundary-plasma modeling, or constrained experimentally using carbon line emission
    together with electron density, electron temperature, and collisional-radiative
    modeling. It is sensitive to local impurity sources, ionization balance, transport,
    and the plasma conditions adjacent to the limiter.


    No device-independent typical range is implied by the definition. Values are non-negative,
    reported in $\mathrm{m}^{-3}$, and should be interpreted relative to the local
    edge plasma density and carbon impurity fraction for the discharge being considered.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:oxygen_density_at_limiter
  - name:nitrogen_density_at_limiter
  - name:xenon_density_at_limiter
  - name:carbon_density_at_plasma_boundary
  - name:carbon_density_at_pedestal
  arguments:
  - name: density_at_limiter
    operator: carbon
    operator_kind: qualifier
- name: deuterium_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of deuterium ions in the plasma-side boundary layer
    immediately adjacent to a plasma-facing limiter surface, evaluated near the plasma-sheath
    interface.
  documentation: 'Deuterium density at a limiter is the local number density of deuterium
    ions, usually $D^+$, on the plasma side of the sheath adjacent to a limiter surface.
    It is the species-resolved deuterium contribution to the edge ion population,
    not necessarily the total ion density when several ion species are present.


    For sheath-limited contact, a common boundary estimate relates the partial deuterium
    ion flux to the sheath-edge density through the Bohm relation:


    $$

    \Gamma_D \simeq n_D c_s

    $$


    where $n_D$ is this density in $\mathrm{m^{-3}}$, $\Gamma_D$ is the species-resolved
    deuterium particle flux to the limiter in $\mathrm{m^{-2}\,s^{-1}}$, and $c_s$
    is the ion-acoustic speed in $\mathrm{m\,s^{-1}}$. For singly ionized deuterium,
    $c_s$ is commonly estimated from local electron and ion temperatures, for example
    $c_s \approx [e(T_e+\gamma_i T_i)/m_D]^{1/2}$ when $T_e$ and $T_i$ are in eV;
    $e$ is the elementary charge, $m_D$ is the deuterium ion mass, and $\gamma_i$
    is an ion heat-capacity factor.


    In practice this quantity is inferred from edge diagnostics near the limiter,
    such as probe measurements combined with sheath models, spectroscopic analysis
    with collisional-radiative modeling, or edge plasma simulations constrained by
    density and recycling measurements. Its value is sensitive to parallel transport
    along open field lines, local ionization and recombination, neutral recycling
    from the limiter surface, and the degree to which deuterium is diluted by other
    ion species.


    Typical limiter-adjacent deuterium ion densities are about $10^{18}-10^{19}\ \mathrm{m^{-3}}$
    in many tokamak scrape-off-layer conditions, with broader operating ranges of
    roughly $10^{17}-10^{20}\ \mathrm{m^{-3}}$ depending on plasma current, fueling,
    recycling, and proximity to high-density or detached boundary regimes.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:deuterium_density_at_magnetic_axis
  - name:deuterium_density_at_pedestal
  - name:deuterium_density_at_plasma_boundary
  - name:electron_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: deuterium
    operator_kind: qualifier
- name: deuterium_tritium_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of the fictitious deuterium-tritium fuel pseudo-species
    in the plasma immediately adjacent to a limiter surface. The pseudo-species represents
    an equimolar DT mixture as one ion constituent with effective mass about 2.5 atomic
    mass units.
  documentation: 'Deuterium-tritium density at a limiter is the local number density
    of the fictitious DT fuel pseudo-species on the plasma side of a plasma-facing
    limiter surface. The pseudo-species represents an equimolar mixture of deuterium
    and tritium as one ion constituent with effective mass about 2.5 atomic mass units,
    distinct from separately tracked deuterium or tritium densities.


    The local limiter value is defined by evaluating the DT pseudo-species density
    at the plasma-facing limiter boundary:


    $$

    n_{\mathrm{DT,lim}} = \left. n_{\mathrm{DT}} \right|_{\text{plasma side of limiter}}

    $$


    where $n_{\mathrm{DT}}$ is the local pseudo-species number density and the vertical
    bar denotes evaluation immediately outside the limiter material, normally near
    the sheath entrance. Both quantities have unit m^-3. When comparing with a resolved-isotope
    description, the equimolar pseudo-species corresponds to the total fuel-ion density
    $n_D+n_T$ with $n_D \simeq n_T$.


    This quantity is the DT-fuel component of [density_at_limiter](name:density_at_limiter).
    It may be inferred from edge density measurements combined with species-fraction
    information, or computed from edge, scrape-off-layer, and plasma-wall interaction
    models at the limiter contact region. In limiter-bounded plasmas it is closely
    related to [deuterium_tritium_density_at_plasma_boundary](name:deuterium_tritium_density_at_plasma_boundary),
    while [deuterium_tritium_density_at_divertor_target](name:deuterium_tritium_density_at_divertor_target)
    describes the analogous pseudo-species density at a divertor target.


    Representative near-limiter DT pseudo-species densities in tokamak edge plasmas
    are often about 10^17-10^19 m^-3, varying strongly with fueling, recycling, edge
    temperature, confinement regime, and whether the plasma boundary is limiter- or
    divertor-defined.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:deuterium_tritium_density_at_plasma_boundary
  - name:deuterium_tritium_density_at_pedestal
  arguments:
  - name: density_at_limiter
    operator: deuterium_tritium
    operator_kind: qualifier
- name: effective_charge_at_limiter
  kind: scalar
  status: draft
  description: Effective charge number of the ion mixture in the boundary plasma at
    the limiter, quantifying the degree of impurity contamination at this plasma-facing
    surface.
  documentation: 'The effective charge $Z_\text{eff}$ at the limiter is the charge-squared-weighted
    average ion charge of the plasma species in the scrape-off layer immediately adjacent
    to the limiter surface. It captures the aggregate effect of all impurity species
    on plasma resistivity and radiation behavior without resolving individual impurity
    charge states.


    The quantity is defined by


    $$

    Z_\text{eff} = \frac{\sum_i n_i Z_i^2}{n_e}

    $$


    where $n_i$ is the number density of ion species $i$ with integer charge number
    $Z_i$, and $n_e = \sum_i n_i Z_i$ is the electron density enforced by quasi-neutrality.
    For a pure hydrogen-isotope plasma, $Z_\text{eff} = 1$; impurity ions with $Z_i
    > 1$ raise the value above unity.


    At the limiter, $Z_\text{eff}$ is typically elevated compared to the core because
    sputtered wall material and recycled impurities concentrate near the plasma-facing
    surface. Typical values range from 1.5 to 4 in limiter-configuration plasmas,
    depending on the wall material (beryllium, carbon, or tungsten) and fueling conditions.
    This local value complements [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary)
    and [effective_charge_at_divertor_target](name:effective_charge_at_divertor_target),
    which quantify $Z_\text{eff}$ at other boundary reference locations. It is inferred
    from the ratio of total Bremsstrahlung emissivity to the square of the electron
    density integrated along lines of sight through the boundary plasma, or from spectroscopic
    resolution of individual impurity charge states.


    Sign convention: Positive for any plasma consisting of positively charged ions
    and electrons satisfying quasi-neutral balance.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:effective_charge_at_plasma_boundary
  - name:effective_charge_at_divertor_target
- name: electron_density_at_limiter
  kind: scalar
  status: draft
  description: Electron number density in the plasma immediately adjacent to a limiter
    surface, evaluated on the plasma side near the magnetic presheath or sheath entrance.
    It characterizes scrape-off-layer plasma contacting the limiter, not the separatrix
    density at the confined-plasma boundary.
  documentation: 'Electron density at a limiter is the local number of free electrons
    per unit volume in the plasma immediately upstream of a limiter material surface.
    It describes the scrape-off-layer or edge plasma that intersects the limiter and
    helps determine local sheath behavior, recycling, and particle fluxes. It is distinct
    from electron density at the plasma boundary, which refers to the separatrix between
    confined plasma and the scrape-off layer.


    The local electron number density is defined by the electron population contained
    in a small volume element:


    $$

    n_e = \frac{dN_e}{dV}

    $$


    where $n_e$ is the electron density, $N_e$ is the dimensionless number of electrons,
    and $V$ is volume in m$^3$.


    In practice this quantity may be obtained from limiter or edge Langmuir-probe
    analysis, from spectroscopic or microwave diagnostics with suitable spatial localization,
    or from edge plasma modeling constrained by measurements. If inferred from ion-saturation
    current or sheath-transmission relations, the result depends on assumptions about
    sheath physics, electron temperature, ion species, magnetic incidence angle, and
    probe geometry; such relations are diagnostic models and are not the definition
    of the density.


    Physically valid values satisfy $n_e \ge 0$. Typical limiter-adjacent scrape-off-layer
    densities are about $10^{17}$-$10^{20}$ m$^{-3}$, with lower values in tenuous
    far-SOL conditions and higher values near strong plasma-wall contact, high fueling,
    or detached or highly recycling edge conditions.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:electron_density_at_plasma_boundary
  - name:electron_temperature_at_limiter
  arguments:
  - name: density_at_limiter
    operator: electron
    operator_kind: qualifier
- name: electron_source_rate_due_to_surface_emission
  kind: scalar
  status: draft
  description: Rate at which material released from plasma-facing surfaces by recycling,
    outgassing, and physical or chemical sputtering supplies electrons to the plasma
    after ionization, summed over all emitting surfaces and weighted by the number
    of electrons each released species contributes. It is the electron-equivalent
    surface-emission source and is non-negative by construction.
  documentation: 'Electron source rate due to surface emission is the wall-emission
    contribution to the global electron particle balance: the number of electron-equivalent
    particles supplied to the plasma per unit time by material released from plasma-facing
    surfaces. Surface emission collects all release channels \fed by plasma-surface
    interaction, including recycling (prompt return of incident plasma ions as neutrals),
    outgassing (delayed release of retained fuel from the wall bulk), and physical
    and chemical sputtering of wall material. Each emitted atom, molecule, or impurity
    is weighted by the number of electrons it contributes once ionized, so the quantity
    is an all-species, all-surface electron source. It is the electron-specific form
    of source_rate_due_to_surface_emission and one component of [total_electron_source_rate](name:total_electron_source_rate);
    the corresponding electron loss to the wall is the separate incident channel total_incident_electron_particle_flux_at_wall.


    The global rate is obtained by integrating the emitted particle flux density over
    all plasma-facing surface area, with each released species weighted by its electron
    yield on full ionization:


    $$

    S_e = \int_{A_\mathrm{pf}} \sum_{s} Z_s \, \Gamma_{s}^{\mathrm{emit}}(\mathbf{x})
    \, dA

    $$


    where $A_\mathrm{pf}$ is the total plasma-facing surface area, $\Gamma_{s}^{\mathrm{emit}}$
    is the emitted particle flux density of released species $s$ (atoms, molecules,
    or impurity species) in $\mathrm{m^{-2}\,s^{-1}}$, $Z_s$ is the number of electrons
    that species $s$ liberates when fully ionized in the plasma, $\mathbf{x}$ labels
    position on the surface, and $S_e$ is in $\mathrm{s^{-1}}$. The species sum aggregates
    fuel and impurity contributions; for pure hydrogenic recycling $Z_s$ reduces to
    the number of nuclei per emitted neutral.


    In practice the rate is inferred from particle-balance analysis combining plasma
    density evolution with fueling and pumping data, from neutral pressure and spectroscopy
    measurements, from wall outgassing and recycling-coefficient estimates, and from
    edge-plasma or neutral-transport modeling. The calculation should include material
    emitted from all limiters, divertor targets, first-wall panels, and other plasma-facing
    components that returns toward the plasma.


    Typical magnitudes are strongly scenario dependent, often ranging from roughly
    $10^{20}$ to $10^{24}\,\mathrm{s^{-1}}$ and increasing with plasma density, recycling
    fraction, and impurity production. The value approaches zero when surfaces are
    not releasing material into the plasma and is largest under high-recycling divertor
    conditions in large, strongly fueled discharges.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:total_electron_source_rate
- name: electron_temperature_at_limiter
  kind: scalar
  status: draft
  description: Local electron temperature at the plasma-wall interface on the plasma-facing
    side of a limiter, where open scrape-off-layer field lines terminate on material
    surfaces.
  documentation: 'Electron temperature at the limiter is the local temperature of
    the electron population on the plasma-facing side of a limiter surface, at the
    plasma-wall interface where open scrape-off-layer magnetic field lines intersect
    material structures. It characterizes the electron thermal energy available for
    sheath formation, recycling, and plasma-surface interaction, and is not the temperature
    of the solid limiter.


    For an isotropic Maxwellian, or a scalar moment-equivalent electron distribution,
    the value expressed in electronvolts is related to the random kinetic energy per
    electron by:


    $$

    T_e = \frac{2}{3e}\left\langle \frac{1}{2} m_e |\mathbf{v}-\mathbf{u}_e|^2 \right\rangle

    $$


    where $m_e$ is the electron mass in kg, $\mathbf{v}$ is the electron velocity
    in $m\,s^{-1}$, $\mathbf{u}_e$ is the local mean electron flow velocity in $m\,s^{-1}$,
    angle brackets denote an average over the local electron velocity distribution
    at the limiter-side plasma, and $e$ is the elementary-charge energy conversion
    factor in $J\,eV^{-1}$. The kinetic-energy moment is in joules, so division by
    $e$ gives $T_e$ in eV; for non-Maxwellian distributions the reported scalar value
    is an effective or moment temperature.


    In experiments, this quantity is commonly inferred from Langmuir-probe current-voltage
    characteristics at or near the limiter surface, local edge spectroscopy, Thomson
    scattering where spatial access is available, or scrape-off-layer modeling constrained
    by edge and wall measurements. Probe and sheath interpretations usually assume
    a quasineutral sheath-edge plasma, a specified electron energy distribution, and
    corrections for magnetic-field incidence angle, collisionality, secondary electron
    emission, and surface conditions. When combined with [electron density at the
    limiter](name:electron_density_at_limiter), derived quantities must convert eV
    to joules; for example, the electron pressure estimate $p_e = e n_e T_e$ uses
    $n_e$ in $m^{-3}$, $T_e$ in eV, $e$ in $J\,eV^{-1}$, and gives $p_e$ in Pa. Sheath
    heat-flux or sound-speed estimates additionally require explicit assumptions for
    ion mass, charge state, ion temperature, sheath transmission coefficients, and
    the electron distribution.


    Typical limiter-side electron temperatures are 1-5 eV in cold, strongly recycling
    edge plasmas, 5-50 eV in many attached limiter scrape-off-layer conditions, and
    50-200 eV in hot near-limiter or transient high-power phases. The appropriate
    value can vary strongly over a few millimeters near the material surface because
    of parallel heat conduction, recycling neutrals, sheath physics, and impurity
    radiation.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_temperature_at_divertor_target
  - name:electron_temperature_at_wall
  - name:ion_average_temperature_at_limiter
- name: energy_flux_at_wall
  kind: scalar
  status: draft
  description: Total power per unit area incident on a plasma-facing wall surface
    from the plasma side, serving as the parent concept for process-resolved wall
    energy fluxes covering kinetic, radiative, and electromagnetic contributions.
  documentation: "Energy flux at the wall is the total power per unit area incident\
    \ on a plasma-facing boundary surface from the plasma and surrounding radiation\
    \ fields, encompassing kinetic energy transported by ions, electrons, and neutral\
    \ particles, radiative power from photons, and electromagnetic contributions from\
    \ induced currents. It is the most general wall energy-flux concept, with the\
    \ net wall heat load defined as the difference between this incident quantity\
    \ and the outgoing [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission)\
    \ returning toward the plasma.\n\nFor a kinetically described species $s$ with\
    \ velocity distribution function $f_s(\\mathbf{v})$, the incident kinetic energy\
    \ flux contribution is\n\n$$\nQ_s = \\int_{\\mathbf{v}\\cdot\\hat{n} < 0} \\tfrac{1}{2}\
    \ m_s v^2\\, f_s(\\mathbf{v})\\,|\\mathbf{v}\\cdot\\hat{n}|\\,d^3v\n$$\n\nwhere\
    \ $\\hat{n}$ is the inward-pointing wall-normal unit vector and $m_s$ is the particle\
    \ mass. The total incident energy flux sums $Q_s$ over all contributing particle\
    \ species and adds radiative and electromagnetic terms.\n\nProcess-resolved decompositions\
    \ include [energy_flux_at_wall_due_to_radiation](name:energy_flux_at_wall_due_to_radiation)\
    \ for the photon channel and [energy_flux_at_wall_due_to_eddy_current](name:energy_flux_at_wall_due_to_eddy_current)\
    \ for the electromagnetic Joule-heating contribution. Species-resolved kinetic\
    \ counterparts are captured by [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)\
    \ and [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall), while the\
    \ analogous particle-count flux is described by [particle_flux_at_wall](name:particle_flux_at_wall).\n\
    \nThe total incident energy flux is evaluated from plasma simulation codes resolving\
    \ parallel transport and plasma-material interactions, with experimental constraints\
    \ from infrared thermography and surface calorimetry. Under steady-state scrape-off-layer\
    \ conditions incident fluxes span roughly 0.1\u201310 MW m$^{-2}$; transient ELMs\
    \ or disruptions can drive local fluxes to tens of MW m$^{-2}$, and the spatial\
    \ peak across all surfaces is tracked by [peak_power_density_at_wall](name:peak_power_density_at_wall)."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_surface_emission
  - name:energy_flux_at_wall_due_to_radiation
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:electron_energy_flux_at_wall
  - name:neutral_energy_flux_at_wall
  - name:particle_flux_at_wall
  - name:peak_power_density_at_wall
- name: electron_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Kinetic energy flux density carried by electrons emitted from a plasma-facing
    wall surface into the adjacent plasma or vacuum region. It quantifies the surface-emitted
    component of electron energy transport, arising from secondary, backscattered,
    thermionic, or photo-emission processes, and is distinct from the incident electron
    power arriving at the wall from the plasma.
  documentation: 'Electron energy flux at the wall is the kinetic energy flux density
    transported away from a plasma-facing material surface by the emitted electron
    population. Emitted electrons originate from secondary electron emission, backscattering,
    thermionic emission, or photoemission, and this quantity captures the energy these
    electrons carry across the surface into the adjacent plasma or vacuum region.


    For an emitted electron velocity distribution at the surface, the flux density
    is the first kinetic-energy moment of the outgoing electrons:


    $$

    q_{e,\mathrm{emit}} = \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w>0} \tfrac{1}{2}
    m_e v^2 \, (\mathbf{v}\cdot\hat{\mathbf{n}}_w) \, f_{e,\mathrm{emit}}(\mathbf{v})
    \, d^3v = \Gamma_{e,\mathrm{emit}} \, \langle E_k \rangle_\Gamma

    $$


    where $m_e$ is the electron mass, $v$ is the electron speed, $\hat{\mathbf{n}}_w$
    is the unit surface normal pointing from the material into the plasma-facing region,
    and $f_{e,\mathrm{emit}}$ is the emitted electron velocity distribution function
    (units $\mathrm{s^3\,m^{-6}}$, i.e. number density per unit velocity-space volume).
    $\Gamma_{e,\mathrm{emit}}$ is the outward emitted electron particle flux density
    in $\mathrm{m^{-2}\,s^{-1}}$, and $\langle E_k \rangle_\Gamma$ is the flux-weighted
    mean kinetic energy per emitted electron; if expressed in eV it must be multiplied
    by the elementary charge to obtain joules.


    This quantity is obtained from surface-emission models, sheath or kinetic plasma-wall
    calculations, or from diagnostics that infer the emitted electron current together
    with the emitted-electron energy spectrum. The flux-weighted mean energy weights
    each electron by its normal velocity component, so electrons crossing the surface
    more nearly along the normal contribute more strongly than electrons with the
    same energy moving nearly tangentially. The emitted flux enters the surface energy
    balance as a cooling term for the wall, partially offsetting the incident electron
    and ion energy loads.


    Typical magnitudes are strongly model-dependent, governed by the emission yield,
    the emitted-electron energy spectrum, the surface temperature and material, and
    the local sheath potential. The value is generally a fraction of the incident
    electron energy flux and rises sharply when strong secondary or thermionic emission
    is active on hot, intensely loaded divertor surfaces.


    Sign convention: Positive when the emitted electron kinetic energy flows across
    the wall surface along the outward normal $\hat{\mathbf{n}}_w$, from the material
    into the plasma-facing region.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:total_incident_electron_particle_flux_at_wall
  arguments:
  - name: energy_flux_at_wall
    operator: electron
    operator_kind: qualifier
- name: energy_flux_at_wall_due_to_eddy_current
  kind: scalar
  status: draft
  description: Energy flux density crossing the plasma-facing wall surface due to
    Joule heating by eddy currents induced in conducting structures. It represents
    the portion of internally deposited Ohmic power that is transported back to the
    surface and emitted toward the plasma.
  documentation: 'Energy flux at the wall due to eddy current is the thermal power
    per unit wall area that reaches the plasma-facing surface after eddy-current Joule
    heating inside conducting wall material. Time-varying magnetic fields induce currents
    in the wall; their Ohmic dissipation deposits power within the solid, while this
    quantity describes only the emitted surface flux directed toward the plasma.


    The volumetric source that feeds this surface emission is the local Ohmic dissipation
    from the induced current density:


    $$

    p_\mathrm{eddy} = \frac{|\mathbf{J}_\mathrm{eddy}|^2}{\sigma_w}

    $$


    where $p_\mathrm{eddy}$ is the volumetric power density in W m$^{-3}$, $\mathbf{J}_\mathrm{eddy}$
    is the eddy-current density in A m$^{-2}$, and $\sigma_w$ is the wall electrical
    conductivity in S m$^{-1}$. The corresponding surface energy flux density depends
    on the spatial distribution of this source, the wall geometry, thermal conductivity,
    heat capacity, and the timescale over which heat diffuses to the plasma-facing
    surface.


    In practice, the quantity is computed from electromagnetic and thermal analyzes
    of conducting wall structures during magnetic transients such as disruptions,
    current quenches, vertical displacement events, or rapid control-coil field changes.
    It may be inferred by combining reconstructed or modeled eddy-current distributions
    with a heat-transfer calculation that maps internal Ohmic deposition to heat flux
    at the surface.


    Typical values are near zero during steady conditions when magnetic fields vary
    slowly. During fast transients, localized emitted fluxes can be 10^3-10^6 W m$^{-2}$,
    with higher short-duration peaks possible near highly conducting structures or
    geometric current-concentration regions.


    This quantity is part of the wall energy balance together with radiative loading,
    particle energy fluxes, and total Ohmic dissipation in wall structures. It is
    distinct from the total [power_at_wall_due_to_ohmic_dissipation](name:power_at_wall_due_to_ohmic_dissipation),
    because only the portion transported to and emitted from the plasma-facing surface
    contributes to this surface flux density.


    Sign convention: Positive when thermal energy is emitted from the wall surface
    toward the plasma.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_radiation
  - name:electron_energy_flux_at_wall
  - name:ion_energy_flux_at_wall
- name: energy_flux_at_wall_due_to_radiation
  kind: scalar
  status: draft
  description: Incident radiative energy flux density at a plasma-facing wall is the
    photon power crossing onto the material surface per unit area. It counts arriving
    radiation before absorption, reflection, or re-emission, so it is not by itself
    the net heat deposited in the wall.
  documentation: 'Energy flux at wall due to radiation is the local incident photon
    power per unit wall area arriving at a plasma-facing material surface. It includes
    radiative transport from plasma emission processes such as line radiation, bremsstrahlung,
    and synchrotron emission, but excludes the subsequent material response. It is
    a radiative contribution to [energy_flux_at_wall](name:energy_flux_at_wall_due_to_eddy_current);
    its wall-integrated counterpart is related to radiated_power_at_wall, and its
    largest local value contributes to [peak_power_density_at_wall](name:peak_power_density_at_wall).


    The incident radiative flux density can be written as an integral of incoming
    spectral radiance over frequency and solid angle:


    $$

    q_\mathrm{rad}(\mathbf{x}) = \int_0^\infty \int_{\hat{s}\cdot\hat{n}<0} I_\nu(\mathbf{x},\hat{s})\,[-\hat{s}\cdot\hat{n}]\,d\Omega\,d\nu

    $$


    where $q_\mathrm{rad}$ is this quantity in W m^-2, $\mathbf{x}$ is a point on
    the wall, $I_\nu$ is the incoming spectral radiance in W m^-2 sr^-1 Hz^-1, $\hat{s}$
    is the photon propagation direction, $\hat{n}$ is the unit normal pointing from
    the wall material into the plasma-facing vacuum, $d\Omega$ is a solid-angle element
    in steradians, and $d\nu$ is a frequency interval in hertz. The factor $[-\hat{s}\cdot\hat{n}]$
    is the projected-area cosine for rays crossing from the plasma-facing side into
    the material.


    In practice this quantity is computed from radiation-transport or view-factor
    calculations using plasma emissivity, wall geometry, opacity, and shadowing. Measurements
    such as bolometry can constrain the total radiated power, but the local incident
    wall distribution depends on the assumed radiation source distribution and geometric
    transport model. Net absorbed or deposited radiative heat flux additionally requires
    material optical properties and emitted or reflected radiation terms.


    Typical magnitudes are strongly scenario dependent. Area-averaged incident radiative
    wall loads in tokamak wall-load studies are often assessed on scales of 10^3-10^5
    W m^-2, while localized divertor or first-wall peaks in high-power radiating scenarios
    may reach 10^5-10^6 W m^-2; these ranges are representative engineering scales
    rather than universal limits.


    Sign convention: Positive when photon energy crosses the wall surface from the
    plasma-facing vacuum side into the material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:peak_power_density_at_wall
- name: energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Outgoing energy flux per unit plasma-facing wall area released or carried
    by recombination at the material boundary, summed over incident ion species, charge
    states, recombination channels, and neutral product energy states.
  documentation: 'Energy flux at the wall due to recombination quantifies the outgoing
    power per unit plasma-facing surface area associated with ions recombining or
    neutralizing at the material boundary. The total is integrated over incident ion
    species, ion charge states, surface recombination channels, and neutral product
    states or energies, making it the parent quantity for both charge-state-resolved
    ion recombination energy release and energy carried by emitted neutral recombination
    products. It describes energy emitted from the surface into the plasma-facing
    half-space, not the total heat deposited in the wall material.


    The total recombination energy flux $Q_\text{rec}$ at wall location $\mathbf{x}_w$
    can be written as the sum of charge-state-resolved ion recombination energy-flux
    contributions and energy-weighted outgoing neutral product spectra:


    $$

    Q_\text{rec}(\mathbf{x}_w) = \sum_{s,q,c} Q^{\text{ion}}_{s,q,c}(\mathbf{x}_w)
    + \sum_{n,k,c}\int E\,\Phi^{0}_{n,k,c}(\mathbf{x}_w,E)\,dE

    $$


    where $Q_\text{rec}$ has unit W m$^{-2}$, $Q^{\text{ion}}_{s,q,c}$ is the outgoing
    recombination energy flux for ion species $s$ in charge state $q$ through channel
    $c$, $\Phi^{0}_{n,k,c}$ is the outgoing energy-resolved neutral product flux density
    for neutral species $n$ and product state $k$, and $E$ is the neutral product
    energy. For finite energy intervals, $\Phi^{0}dE$ corresponds to the interval
    neutral flux with unit m$^{-2}$ s$^{-1}$; the terms must be combined with consistent
    channel bookkeeping to avoid double counting the same recombination energy.


    In plasma-facing component modeling, this quantity is computed by combining incident
    ion fluxes, surface neutralization or recombination probabilities, energy accommodation,
    and atomic or molecular recombination energetics. The charge-state-resolved contribution
    is represented by [ion_state_energy_flux_at_wall_due_to_recombination](name:ion_state_energy_flux_at_wall_due_to_recombination);
    summing those contributions gives the ion-integrated component [ion_energy_flux_at_wall_due_to_recombination](name:ion_energy_flux_at_wall_due_to_recombination).
    The emitted neutral-product contribution is obtained by energy-weighting and integrating
    the energy-resolved neutral flux represented by [neutral_energy_flux_at_wall_due_to_recombination](name:neutral_energy_flux_at_wall_due_to_recombination),
    while [particle_flux_at_wall_due_to_recombination](name:particle_flux_at_wall_due_to_recombination)
    counts the same surface recombination source without energy weighting.


    Typical magnitudes are strongly regime-dependent: about 10$^2$-10$^4$ W m$^{-2}$
    in weakly recycling regions, 10$^4$-10$^6$ W m$^{-2}$ in recycling divertor conditions,
    and locally up to 10$^6$-10$^7$ W m$^{-2}$ where intense ion fluxes and strong
    surface recombination coincide. The recombination contribution is often smaller
    than the total wall energy flux, but it can become important in high-recycling
    or detached boundary plasmas.


    Sign convention: Positive when recombination-associated energy is emitted away
    from the plasma-facing wall surface into the plasma-facing half-space.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_radiation
  - name:energy_flux_at_wall
- name: flux_due_to_recombination
  kind: scalar
  status: draft
  description: Surface-normal particle flux density arising from recombination of
    plasma ions and electrons into neutral atoms or molecules. It quantifies the rate
    at which plasma particles are removed from the confined region through recombination
    across a specified surface, such as a material boundary or a flux surface.
  documentation: 'Recombination-driven particle flux density is the surface-normal
    flux of plasma particles that recombine, typically at a plasma-facing surface
    or across an arbitrary reference surface. It measures the rate per unit area at
    which ions and electrons combine to form neutral atoms or molecules, thereby removing
    particles from the plasma volume.


    The defining kinetic expression relates the recombination flux density to the
    velocity distribution of recombined particles emerging from the surface:


    $$

    \Gamma_{\mathrm{rec}} = \int (\mathbf{v} \cdot \hat{n})\, f_{\mathrm{rec}}(\mathbf{v})\,
    d^3v

    $$


    where $\hat{n}$ is the unit normal vector of the surface, $f_{\mathrm{rec}}(\mathbf{v})$
    is the velocity distribution function of recombined particles (atoms or molecules)
    leaving the surface, and integration is over the outgoing half-space. When recombination
    is purely surface-mediated, the flux is often approximated as the product of the
    incident ion flux density and a recombination coefficient $R_{\mathrm{rec}}$.


    In practice, the recombination flux is inferred from Langmuir probe measurements
    of the incident ion flux combined with spectroscopic determination of neutral
    densities or from particle-balance analysis in scrape-off layer modeling. For
    volume recombination, it may be derived from rate coefficients and local plasma
    conditions.


    Typical magnitudes at divertor targets in attached conditions range from $10^{21}$
    to $10^{23}$ m$^{-2}$ s$^{-1}$, decreasing under detached regimes to $10^{20}$--$10^{22}$
    m$^{-2}$ s$^{-1}$. Volume recombination fluxes across flux surfaces are typically
    several orders lower.


    Sign convention: Positive when the particle flux due to recombination is directed
    outward from the plasma (i.e., away from the confined region towards a material
    surface or across an enclosing boundary).'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_recombination
  - name:electron_particle_flux_at_wall
  - name:energy_flux_at_wall_due_to_recombination
  sources:
  - id: derived:flux_due_to_recombination
    status: composed
- name: flux_due_to_surface_emission
  kind: scalar
  status: draft
  description: Flux of any physical quantity emanating from a material surface through
    emission processes such as particle recycling, sputtering, or secondary electron
    and photon emission.
  documentation: 'Surface emission encompasses the range of physical processes by
    which plasma-facing material surfaces re-emit particles, energy, or radiation
    into the plasma or surrounding environment. These include neutral recycling (incident
    ions reflected or thermally desorbed as neutrals), physical and chemical sputtering
    (wall atoms ejected by energetic ion bombardment), secondary electron emission
    (electrons liberated by ion or electron impact), and thermal or fluorescence photon
    emission from heated or excited surface atoms.


    The emitted flux $\Gamma_\mathrm{emit}$ at a surface element is related to the
    incident driving flux $\Gamma_\mathrm{incident}$ through a process-specific emission
    yield $Y$:


    $$

    \Gamma_\mathrm{emit} = Y \cdot \Gamma_\mathrm{incident}

    $$


    where $Y$ is the emission yield (dimensionless for particle emission, or carrying
    the appropriate units ratio for energy or photon emission), and $\Gamma_\mathrm{incident}$
    is the incident flux of the driving species.


    The specific instantiation of this flux at the first wall is described by [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission).
    For the total radiated thermal power emitted by wall material, see [thermal_power_of_wall_material_due_to_radiation_emission](name:thermal_power_of_wall_material_due_to_radiation_emission).
    General energy transport through a surface is captured by [energy_flux](name:energy_flux).'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_surface_emission
  - name:thermal_power_of_wall_material_due_to_radiation_emission
  - name:energy_flux
  sources:
  - id: derived:flux_due_to_surface_emission
    status: composed
- name: flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: General flux density of any quantity (e.g., particles, energy, momentum)
    emitted from a plasma-facing wall surface due to surface emission processes. This
    serves as a parent category for specific flux components such as energy flux.
  documentation: "Flux density at a plasma-facing wall surface due to surface emission\
    \ processes represents the rate of transfer of a physical quantity per unit area\
    \ from the wall into the plasma. Surface emission encompasses phenomena such as\
    \ sputtering, desorption, thermal evaporation, photon emission, and secondary\
    \ electron emission, each contributing a flux of particles and energy. The total\
    \ flux can be decomposed into specific channels: particle flux (number of emitted\
    \ particles per unit area per second), energy flux (kinetic and potential energy\
    \ carried by emitted species per unit area per second), and momentum flux (momentum\
    \ transfer per unit area per second).\n\nThis quantity is a general abstraction;\
    \ concrete measurements or calculations refer to one of the component fluxes.\
    \ For example, the child standard name [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission)\
    \ captures the energy channel specifically.\n\nIn practice, the flux is estimated\
    \ from plasma-facing material diagnostics (e.g., Langmuir probes, spectroscopic\
    \ measurements of atomic line emission, calorimetry) or from plasma-wall interaction\
    \ modeling codes. Typical values for the energy flux density in the scrape-off\
    \ layer of a tokamak range from 0.1 to 10 MW/m\xB2, depending on the plasma scenario\
    \ and wall material. Particle flux densities vary from 10\xB2\xB2 to 10\xB2\u2074\
    \ m\u207B\xB2s\u207B\xB9.\n\nSign convention: Positive when the net flux is directed\
    \ outward from the wall surface into the plasma."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_surface_emission
  - name:flux_due_to_surface_emission
  - name:energy_flux_at_wall_due_to_radiation
  arguments:
  - name: flux_due_to_surface_emission
    operator: wall
    operator_kind: locus
  sources:
  - id: derived:flux_at_wall_due_to_surface_emission
    status: composed
- name: energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Total energy flux density at a plasma-facing wall surface due to surface
    emission processes, encompassing kinetic and potential energy carried by emitted
    particles and photons.
  documentation: "Surface emission at the plasma-facing wall encompasses secondary\
    \ electron emission, neutral and ion sputtering, particle reflection, and photon\
    \ emission stimulated by plasma\u2013wall interactions. Each emission channel\
    \ carries energy away from the wall surface, and this quantity represents their\
    \ aggregate energy flux per unit area. It is the energy-channel specialization\
    \ of [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission),\
    \ which spans multiple transported quantities at the wall interface.\n\nThe total\
    \ emitted energy flux $Q_\\mathrm{em}$ is expressed by summing over all surface-emitted\
    \ species $s$ the energy-weighted flux of particles leaving the surface:\n\n$$\n\
    Q_\\mathrm{em} = \\sum_s \\int E_s \\, f_s(E_s) \\, v_{\\perp,s} \\, dE_s\n$$\n\
    \nwhere $E_s$ is the energy of emitted species $s$, $f_s$ is its energy distribution\
    \ function, and $v_{\\perp,s}$ is the wall-normal velocity component. The kinetic\
    \ contribution alone is resolved separately as [kinetic_energy_flux_at_wall_due_to_surface_emission](name:kinetic_energy_flux_at_wall_due_to_surface_emission).\n\
    \nContextualizing this emission flux against the incident plasma heat flux quantifies\
    \ the effective energy reflection coefficient of the plasma-facing surface, a\
    \ key parameter for thermal design of wall components. The net deposited power\
    \ density derives from the difference between the incident and emitted energy\
    \ fluxes and connects to aggregate quantities such as [energy_flux_at_wall](name:energy_flux_at_wall)\
    \ and plasma_deposited_power_at_wall."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_surface_emission
  - name:kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:energy_flux_at_wall
  arguments:
  - name: flux_at_wall_due_to_surface_emission
    operator: energy
    operator_kind: qualifier
  sources:
  - id: derived:energy_flux_at_wall_due_to_surface_emission
    status: composed
- name: helium_3_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of helium-3 ions in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface.
  documentation: 'Helium-3 density at a limiter is the number of ionized helium-3
    nuclei per unit volume in the boundary plasma immediately adjacent to a plasma-facing
    limiter surface. It quantifies the local minority-isotope ion population participating
    in recycling, fueling balance, sheath physics, and plasma-wall interactions at
    the limiter.


    For a helium-3 ion distribution function, the density is the zeroth velocity moment
    evaluated at a limiter-adjacent plasma location:


    $$

    n_{{}^3\mathrm{He}}(\mathbf{x}_\ell) = \int f_{{}^3\mathrm{He}}(\mathbf{x}_\ell,
    \mathbf{v})\, d^3v

    $$


    where $\mathbf{x}_\ell$ denotes a point in the plasma immediately next to the
    limiter surface, $\mathbf{v}$ is ion velocity in m s$^{-1}$, $d^3v$ has units
    m$^3$ s$^{-3}$, and $f_{{}^3\mathrm{He}}$ has units m$^{-6}$ s$^3$, giving $n_{{}^3\mathrm{He}}$
    in m$^{-3}$.


    In practice this quantity is usually estimated from edge-plasma analysis and boundary
    modeling rather than measured as a direct local ion density at the material surface.
    Estimates may combine local plasma density and temperature, ionization and recombination
    balance, limiter recycling sources, isotope-resolved fueling or exhaust information,
    and diagnostic constraints such as helium line emission when available.


    Typical trace-minority helium-3 densities near a limiter can span roughly 10$^{16}$-10$^{18}$
    m$^{-3}$, depending strongly on helium-3 fueling rate, confinement, ionization
    state, scrape-off-layer transport, and recycling at the limiter. Values can be
    substantially different in dedicated helium-3 operation or in plasmas with weak
    local helium-3 sources.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:helium_3_density_at_pedestal
  - name:helium_3_density_at_magnetic_axis
  arguments:
  - name: density_at_limiter
    operator: helium_3
    operator_kind: qualifier
- name: helium_4_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of helium-4 ions in the boundary plasma immediately
    outside a limiter surface, evaluated on the plasma side of the sheath or presheath.
  documentation: 'Helium-4 density at a limiter is the local number density of helium-4
    ions in the boundary plasma immediately outside the limiter material surface.
    The value is evaluated on the plasma side of the sheath or presheath at the limiter
    contact region, not inside the solid material or in neutral gas retained at the
    surface.


    For a point on the limiter surface, the kinetic definition is the velocity-space
    integral of the helium-4 ion distribution taken as a plasma-side surface limit:


    $$

    n_{\mathrm{He4,lim}}(\mathbf{x}_w) = \lim_{\ell \to 0^+} \int_{\mathbb{R}^3} f_{\mathrm{He4}}(\mathbf{x}_w
    + \ell \hat{\mathbf{n}}_p, \mathbf{v}) \, d^3v

    $$


    where $f_{\mathrm{He4}}$ is the velocity distribution function for helium-4 ions,
    summed over charge states if they are not resolved separately, $\mathbf{x}_w$
    is a point on the limiter surface, and $n_{\mathrm{He4,lim}}$ has units $\mathrm{m}^{-3}$.
    The local right-handed surface basis is $(\hat{\mathbf{t}}_1,\hat{\mathbf{t}}_2,\hat{\mathbf{n}}_p)$
    with $\hat{\mathbf{t}}_1 \times \hat{\mathbf{t}}_2 = \hat{\mathbf{n}}_p$; $\hat{\mathbf{n}}_p$
    points from the material into the plasma and $\ell$ is distance along that normal.


    This quantity is the helium-4 isotope contribution to the local ion population
    at the limiter. In a quasineutral boundary plasma, [electron_density_at_limiter](name:electron_density_at_limiter)
    is balanced to leading order by the charge-weighted sum of ion densities, so helium-4
    contributes $Z n_{\mathrm{He4,lim}}$ for a single dominant charge state $Z$, or
    $\sum_Z Z n_{\mathrm{He4,lim}}^{(Z)}$ when multiple helium charge states coexist.
    The unweighted isotope density contributes to [total_ion_density_at_limiter](name:total_ion_density_at_limiter)
    and to [density_at_limiter](name:density_at_limiter).


    The value is usually inferred rather than directly counted. General methods include
    localized or line-integrated helium line-emission spectroscopy interpreted with
    collisional-radiative modeling, probe-constrained boundary-plasma analysis, particle-balance
    estimates using helium sources and recycling, and boundary-plasma modeling constrained
    by electron density and temperature measurements.


    Typical values are about $10^{16}-10^{19}\ \mathrm{m}^{-3}$ when helium-4 is a
    trace, minority, or fusion-ash species near a limiter. In helium-fueled or strongly
    recycling plasmas, the value can become a substantial fraction of the local total
    ion density, whose boundary values are commonly $10^{17}-10^{20}\ \mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:helium_4_density_at_plasma_boundary
