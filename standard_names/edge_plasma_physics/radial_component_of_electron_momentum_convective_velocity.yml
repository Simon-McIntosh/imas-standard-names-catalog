name: radial_component_of_electron_momentum_convective_velocity
status: draft
description: Radial projection of the convective velocity entering the electron particle
  (momentum) transport equation on an edge plasma grid.
documentation: "The radial convective velocity $v_r^{\\mathrm{conv},e}$ describes\
  \ the component of the bulk electron flow velocity along the radial (flux-surface-normal)\
  \ direction that advects electron density in the continuity equation $\\partial\
  \ n_e/\\partial t + \\nabla \\cdot (n_e \\mathbf{v}^{\\mathrm{conv}}_e) = S_e$,\
  \ where $n_e$ is the electron number density and $S_e$ represents sources and sinks.\
  \ In edge transport solvers employing a generalized grid description (GGD), this\
  \ quantity is stored per grid element and captures cross-field particle transport\
  \ due to convective processes such as $E \\times B$ drifts or turbulent pinches.\
  \ Typical magnitudes in the SOL are of order 1\u2013100 m/s, with inward (pinch)\
  \ or outward (convective loss) signs depending on the local electric field structure.\
  \ This velocity complements the diffusive contribution parameterized by the electron\
  \ particle diffusivity."
