- name: radius_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Radius of the circular aperture defining the microwave beam footprint
    on the electron cyclotron launcher mirror.
  documentation: 'The mirror radius defines the physical size of the circular aperture
    that shapes the microwave beam in an electron cyclotron (EC) launcher. Together
    with the mirror curvature, it determines the beam waist and focusing properties
    of the launched wave. Typical radii for EC launcher mirrors in tokamaks range
    from 10 to 30 cm, depending on the port size and desired beam divergence. The
    radius is measured from the mirror center to the aperture edge in the plane perpendicular
    to the beam axis. This geometric parameter is a key input to beam-tracing codes
    and is constrained by the port access geometry. See also the related [radius_of_reflectometer_antenna](name:radius_of_reflectometer_antenna)
    for a similar aperture definition in plasma diagnostics.


    Sign convention: Positive as a geometric length.


    Note: The radius is measured in the local mirror coordinate system; the global
    major-radius position of the mirror is stored separately under the launcher geometry.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:radius_of_reflectometer_antenna
  sources:
  - id: dd:ec_launchers/mirror/geometry/radius
    dd_path: ec_launchers/mirror/geometry/radius
    status: composed
- name: thermal_electron_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power density deposited on the thermal electron population
    in the poloidal plane.
  documentation: "Volumetric power density $P_{\\mathrm{th,e}}$ absorbed by the thermal\
    \ electron population from RF waves, defined per unit volume in the poloidal cross-section.\
    \ For electron cyclotron or lower hybrid heating, the deposition profile $P_{\\\
    mathrm{RF}}(R,Z) = \\mathbf{J}_{\\mathrm{RF}} \\cdot \\mathbf{E}$ determines the\
    \ local heating rate. Typical core values range from 0.1\u201310 MW/m$^3$ in auxiliary-heated\
    \ tokamaks. The flux-surface-resolved version is [per_toroidal_mode_thermal_electron_power_density](name:per_toroidal_mode_thermal_electron_power_density).\
    \ The total volume-integrated absorbed power is [absorbed_power_due_to_electron_cyclotron_heating](name:absorbed_power_due_to_electron_cyclotron_heating).\
    \ Join the [fast_electron_power_density](name:fast_electron_power_density) and\
    \ [thermal_ion_power_density](name:thermal_ion_power_density) to partition the\
    \ wave power among species."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_electron_power_density
  - name:absorbed_power_due_to_electron_cyclotron_heating
