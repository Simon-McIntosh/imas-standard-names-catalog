- name: ion_diamagnetic_velocity
  kind: scalar
  status: draft
  description: Diamagnetic drift velocity for a specific ion charge state, arising
    from the pressure gradient perpendicular to the magnetic field.
  documentation: "The ion diamagnetic velocity is the fluid drift of a specific ion\
    \ charge state due to an equilibrium pressure gradient perpendicular to the magnetic\
    \ field. In the right-handed cylindrical $(R, \\phi, Z)$ frame, the drift direction\
    \ is given by $\\mathbf{B} \\times \\nabla p_i$, where $p_i$ is the pressure of\
    \ that ion species. The magnitude is $v_{\\mathrm{dia}} = |\\nabla p_i \\times\
    \ \\mathbf{B}| / (n_i Z_i e B^2)$, where $n_i$ is the ion density, $Z_i e$ is\
    \ the ion charge, and $\\mathbf{B}$ is the magnetic field. Typical values range\
    \ from 1\u2013100 m/s for main ions in the scrape-off layer, increasing with the\
    \ pressure gradient and charge state for impurity ions. This drift represents\
    \ the lowest-order fluid motion perpendicular to the magnetic field in a collisional\
    \ plasma and is independent of particle mass. It is often inferred from measurements\
    \ of the ion pressure gradient, as from Thomson scattering and charge exchange\
    \ recombination spectroscopy.\n\nSign convention: Positive when the drift is in\
    \ the direction of $\\mathbf{B} \\times \\nabla p_i$, consistent with the right-handed\
    \ cylindrical $(R, \\phi, Z)$ basis."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_velocity_due_to_diamagnetic_drift
  - name:parallel_ion_state_velocity
  sources:
