- name: normalized_time
  kind: scalar
  status: draft
  description: Dimensionless time coordinate used in local gyrokinetic turbulence
    modeling. It is physical elapsed time scaled by the reference thermal transit
    time, formed from a reference length scale and reference species thermal velocity.
  documentation: 'Normalized time is a dimensionless measure of elapsed time in a
    local gyrokinetic turbulence system. It expresses time in units of the reference
    thermal transit time, so values of order unity correspond to the time for the
    reference species to travel one reference length at its thermal speed.


    The normalized time is defined by


    $$

    t_\mathrm{norm} = \frac{t}{\tau_\mathrm{ref}} = \frac{t\,v_{\mathrm{th},\mathrm{ref}}}{L_\mathrm{ref}}

    $$


    where $t$ is physical elapsed time, $\tau_\mathrm{ref}=L_\mathrm{ref}/v_{\mathrm{th},\mathrm{ref}}$
    is the reference thermal transit time, $L_\mathrm{ref}$ is the reference length
    scale, and $v_{\mathrm{th},\mathrm{ref}}$ is the reference species thermal velocity.


    In practice this coordinate is computed from the simulation time variable using
    the normalization constants chosen for the gyrokinetic model. It provides the
    common time base for turbulence evolution, fluctuation amplitudes, and transport
    fluxes, allowing simulations with different physical sizes or species temperatures
    to be compared in dimensionless form.


    Typical nonlinear local gyrokinetic turbulence calculations start at $t_\mathrm{norm}=0$
    and extend to about 100-10000, depending on the growth, saturation, and averaging
    intervals required. Linear calculations or short transients may cover only 1-100.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_collisionality
  - name:normalized_particle_mass
  sources:
  - id: dd:gyrokinetics_local/non_linear/time_norm
    dd_path: gyrokinetics_local/non_linear/time_norm
    status: composed
- name: normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode
  kind: scalar
  status: draft
  description: Dimensionless total pressure moment of the perturbed particle distribution
    function for a linear gyrokinetic eigenmode, equal to the normalized sum of the
    parallel and perpendicular particle pressure perturbations relative to the equilibrium
    species pressure. It is not an independent thermodynamic pressure but a velocity-space
    moment characterizing the eigenmode pressure response and microinstability drive.
  documentation: 'The normalized total perturbed particle pressure of a gyrokinetic
    eigenmode is the dimensionless second velocity-space moment of the perturbed particle
    distribution function $\delta f$, combining pressure contributions from motion
    both parallel and perpendicular to the equilibrium magnetic field $\mathbf{B}_0$.
    It characterizes the pressure perturbation structure of a linear gyrokinetic eigenmode
    and reflects the drive of microinstabilities such as ion-temperature-gradient
    and trapped-electron modes. It is the sum of two directional components rather
    than an independent thermodynamic variable.


    The quantity is the normalized sum of its parallel and perpendicular components:


    $$

    \hat{p} = \hat{p}_\parallel + \hat{p}_\perp = \frac{\delta p_\parallel + \delta
    p_\perp}{p_0}, \qquad p_0 = n_0 T_0

    $$


    where $\hat{p}$ is dimensionless, $\delta p_\parallel$ and $\delta p_\perp$ are
    the dimensional particle pressure perturbations in pascals, $p_0$ is the equilibrium
    species reference pressure in pascals, $n_0$ is the equilibrium number density
    in m^-3, and $T_0$ is the equilibrium temperature expressed as an energy in joules
    (if $T_0$ is supplied in eV, the reference is $n_0 e T_0$ with $e$ the elementary
    charge).


    This moment is obtained from linear gyrokinetic eigenmode solutions by integrating
    the perturbed particle distribution function over velocity space with the parallel
    and perpendicular kinetic-energy weights. It is distinct from the corresponding
    gyrocenter pressure moment, which is taken from the perturbed gyrocenter distribution
    and differs through the gyroaveraging transformation and associated finite-Larmor-radius
    effects relating the two representations. The directional components are the parallel
    normalized particle perturbed pressure and the perpendicular normalized particle
    perturbed pressure; the gyroaveraged total-pressure counterpart and the gyrocenter
    total-pressure variant provide complementary views of the same eigenmode response.


    Because the overall amplitude and phase of a linear eigenmode are arbitrary, there
    is no universal physical range for this dimensionless moment. After a chosen eigenfunction
    normalization, magnitudes from about 1e-4 to 1 are common in gyrokinetic comparisons,
    where the relative size and phase with respect to the density, temperature, electrostatic
    potential, and the component pressures are usually more meaningful than the absolute
    value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
  - name:parallel_normalized_gyrocenter_perturbed_pressure
