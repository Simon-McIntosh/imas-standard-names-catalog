- name: oxygen_fraction
  kind: scalar
  status: draft
  description: Composition fraction of oxygen in the plasma, defined as the ratio
    of the oxygen impurity density to the electron density.
  documentation: 'The oxygen fraction quantifies the abundance of oxygen impurities
    relative to the electron population, typically expressed as $f_{\mathrm{O}} =
    n_{\mathrm{O}} / n_e$, where $n_{\mathrm{O}}$ is the oxygen density and $n_e$
    is the electron density. Oxygen is a common low-Z impurity introduced through
    wall outgassing or plasma-facing component erosion; its fraction influences radiative
    power loss and plasma dilution. Typical core oxygen fractions in tokamaks range
    from $10^{-4}$ to $10^{-2}$, with higher values in the scrape-off layer. This
    quantity is measurable via visible or VUV spectroscopy of oxygen emission lines.
    The related [iron\_fraction](name:iron_fraction) and [total\_plasma\_fraction](name:total_plasma_fraction)
    describe other impurity species and total composition.


    Sign convention: Positive when $n_{\mathrm{O}} > 0$, i.e., when oxygen is present
    in the plasma. The oxygen fraction is non-negative by definition.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:iron_fraction
  - name:total_plasma_fraction
  sources:
  - id: dd:summary/composition/oxygen/value
    dd_path: summary/composition/oxygen/value
    status: composed
- name: radial_electric_field_at_wall
  kind: scalar
  status: draft
  description: Projection of the electric field vector onto the major-radius direction
    at the plasma-facing wall surface.
  documentation: The radial electric field at the wall $E_{R|\text{wall}} = \mathbf{E}
    \cdot \hat{R}$ represents the component of the electrostatic field along the outward
    major-radius axis evaluated on the wall boundary. This field component influences
    the radial transport of charged particles to plasma-facing components and governs
    the sheath potential that forms at the wall surface. Typically derived from equilibrium
    reconstructions or Langmuir probe measurements, $E_R$ at the wall can range from
    10 V/m to several kV/m depending on plasma conditions and wall-bias configurations.
    The sign of $E_R$ determines whether the radial force on ions accelerates them
    toward or away from the wall, affecting impurity transport and material erosion
    rates. For the corresponding vertical component, see [vertical_electric_field_at_wall](name:vertical_electric_field_at_wall).
  unit: V.m^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_electric_field_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/e_field/r
    dd_path: wall/description_ggd/ggd/e_field/r
    status: composed
- name: temperature_at_wall
  kind: scalar
  status: draft
  description: Temperature of the plasma-facing wall surface, defining the thermal
    boundary condition for plasma-wall interaction physics models.
  documentation: 'The wall temperature $T_w$ characterizes the kinetic energy of the
    material surface and the adjacent plasma boundary layer. It governs thermal loads
    on plasma-facing components by balancing incident power flux from ions, electrons,
    and neutrals against active cooling. Typical steady-state values range from 400
    to 1000 K for beryllium or tungsten tiles in present-day devices, rising to 1500
    K during transient events. The heat flux density $q$ from the plasma to the wall
    is related to $T_w$ by the surface energy balance: $q = \sigma \epsilon (T_w^4
    - T_{\text{amb}}^4)$, where $\sigma$ is the Stefan-Boltzmann constant, $\epsilon$
    is the surface emissivity, and $T_{\text{amb}}$ is the ambient temperature. This
    quantity is routinely measured using infrared thermography or thermocouple arrays
    embedded in tile surfaces.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:parallel_momentum_flux
  - name:total_power_at_cooling_circuit_inlet
  - name:toroidal_magnetic_field
  - name:vertical_magnetic_field
  sources:
  - id: dd:wall/description_ggd/ggd/temperature/values
    dd_path: wall/description_ggd/ggd/temperature/values
    status: composed
- name: total_power_at_cooling_circuit_inlet
  kind: scalar
  status: draft
  description: Total thermal power extracted from the plasma-facing wall structures
    by the active coolant systems.
  documentation: The total power at the cooling circuit inlet represents the heat
    flux removed from the first wall and other plasma-facing components by the coolant,
    integrated over all active channels. This quantity is key to thermal management
    and balance-of-plant calculations, directly related to the heat load from the
    plasma and the efficiency of the cooling system. Measured in the coolant manifolds
    at the interface between the wall structures and the primary heat transport system,
    typical values for a fusion power plant can range from tens to hundreds of megawatts.
    The power is positive when heat flows from the wall into the coolant. Compare
    with [thermal_power_of_port](name:thermal_power_of_port) which describes power
    through a specific balance-of-plant component port, and [temperature_at_cooling_circuit_inlet](name:temperature_at_cooling_circuit_inlet)
    which provides the coolant temperature at the same location.
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:thermal_power_of_port
  - name:temperature_at_cooling_circuit_inlet
  sources:
  - id: dd:wall/global_quantities/power_to_cooling
    dd_path: wall/global_quantities/power_to_cooling
    status: composed
- name: volume_averaged_nitrogen_fraction
  kind: scalar
  status: draft
  description: Volume-averaged ratio of the nitrogen impurity density to the electron
    density, evaluated over the plasma volume.
  documentation: The nitrogen fraction is defined as $\langle n_{\mathrm{N}} / n_e
    \rangle$, where $n_{\mathrm{N}}$ is the nitrogen impurity density and $n_e$ is
    the electron density. The angle brackets denote a volume average over the plasma.
    This quantity is dimensionless and ranges from near zero in a pure plasma to values
    up to about 0.1 in highly seeded discharges. It is typically evaluated at the
    time of peak electron density in the discharge to characterize the level of nitrogen
    seeding used for divertor detachment or radiative cooling.
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:neon_fraction
  - name:oxygen_fraction
  sources:
  - id: dd:summary/composition/nitrogen/value
    dd_path: summary/composition/nitrogen/value
    status: composed
