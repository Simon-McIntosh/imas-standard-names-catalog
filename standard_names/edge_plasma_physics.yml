- name: carbon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of carbon impurity ions at the plasma boundary, represented
    by the last closed flux surface or separatrix. It sums the ion charge states C+
    through C6+ and excludes neutral carbon.
  documentation: 'Carbon density at the plasma boundary is the number density of carbon
    impurity ions evaluated on the last closed flux surface, or on the separatrix
    in a diverted plasma. It is an impurity-specific ion density and is distinct from
    the total ion density at the boundary, which includes fuel ions, helium, and all
    other ion species.


    For elemental carbon with nuclear charge $Z_C=6$, the summed ion density is


    $$

    n_{\mathrm{C},b} = \sum_{z=1}^{6} n_{\mathrm{C}^{z+},b}

    $$


    where $n_{\mathrm{C}^{z+},b}$ is the boundary number density of carbon ions with
    charge state $z$, each density term has units of $\mathrm{m^{-3}}$, and the subscript
    $b$ denotes evaluation at the plasma boundary. Neutral carbon, $\mathrm{C^0}$,
    is not included in this ion-density sum.


    In practice, this quantity is inferred from edge impurity spectroscopy, charge-exchange
    measurements for accessible charge states, and collisional-radiative modeling
    that maps observed line emission to charge-state densities at the boundary. Equilibrium
    reconstruction or magnetic-surface identification provides the location of the
    last closed flux surface used for the boundary evaluation.


    Typical summed carbon-ion densities at the plasma boundary are about $10^{15}-10^{18}\
    \mathrm{m^{-3}}$ in many tokamak edge plasmas. Values can approach $10^{18}-10^{19}\
    \mathrm{m^{-3}}$ in carbon-wall or strong-sputtering conditions, while actively
    impurity-controlled plasmas may be lower.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:nitrogen_density_at_plasma_boundary
  - name:oxygen_density_at_plasma_boundary
