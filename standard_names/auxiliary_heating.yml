- name: power_of_neutral_beam_injector
  kind: scalar
  status: active
  description: Power delivered by a single neutral beam injector at the vacuum vessel
    boundary, evaluated before plasma absorption, shine-through, and fast-ion orbit-loss
    corrections.
  documentation: 'Power delivered by a single neutral beam injector at the vacuum
    vessel boundary is the launched kinetic power carried by neutral beam particles
    from that injector as they enter the vessel. It is a non-negative per-injector
    scalar defined before subsequent interaction of the beam with the plasma.


    The kinetic-power flux crossing the vessel-entry surface defines the quantity
    as:


    $$

    P_j = \sum_\alpha \int_{S_j} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_j>0} \frac{1}{2}
    m_\alpha |\mathbf{v}|^2 (\mathbf{v}\cdot\hat{\mathbf{n}}_j) f_{\alpha j}(\mathbf{x},\mathbf{v},t)\,
    d^3v\, dA

    $$


    where $P_j$ is the launched power of injector $j$, $S_j$ is the surface through
    which that injector''s neutrals enter the vessel, $\hat{\mathbf{n}}_j$ is the
    unit normal directed into the vessel, $\alpha$ indexes neutral particle species,
    $m_\alpha$ is particle mass, $\mathbf{x}$ is position on $S_j$, $\mathbf{v}$ is
    particle velocity, $t$ is time, $f_{\alpha j}$ is the neutral-particle distribution
    function, $dA$ is the surface element, and $d^3v$ is the velocity-space element.
    The restriction $\mathbf{v}\cdot\hat{\mathbf{n}}_j>0$ selects particles crossing
    into the vessel.


    This quantity includes all neutral energy components delivered by the specified
    injector at the vessel boundary. The sum over injectors gives [total_power_of_neutral_beam_injector](name:total_power_of_neutral_beam_injector),
    and it differs from [absorbed_power_of_neutral_beam_injector](name:absorbed_power_of_neutral_beam_injector),
    which is evaluated after plasma absorption and loss processes are applied. It
    excludes source electrical input, power stopped upstream of the vessel boundary,
    and later corrections for ionization, shine-through, charge-exchange losses, fast-ion
    orbit losses, or other plasma-interaction effects.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_neutral_beam_injector
  - name:total_power_of_neutral_beam_injector
  sources:
  - dd_path: summary/heating_current_drive/nbi/power/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-nbi-power-value
