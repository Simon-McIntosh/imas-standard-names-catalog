name: trapped_fast_ion_toroidal_current_density
status: draft
cocos_transformation_type: one_like
description: Toroidal current density carried by trapped (banana-orbit) fast ions,
  excluding thermal-electron and thermal-ion back-current.
documentation: "The trapped fast-ion toroidal current density $j_{\\phi,\\mathrm{trap,fast}}$\
  \ isolates the contribution of magnetically trapped supra-thermal ions\u2014those\
  \ executing banana orbits with pitch-angle cosine $|\\xi| < \\sqrt{1 - B_{\\min}/B_{\\\
  max}}$\u2014to the toroidal current. Unlike the total fast-ion driven current, this\
  \ quantity excludes the drag current on thermal species, capturing only the net\
  \ toroidal drift of the trapped fast-ion population. Although individual trapped\
  \ particles carry no net parallel current over a bounce period, finite orbit-width\
  \ effects and radial gradients of the distribution function produce a residual toroidal\
  \ current density, typically $10^3$\u2013$10^5\\;\\mathrm{A\\,m^{-2}}$ in NBI-heated\
  \ tokamak plasmas. This component is evaluated by orbit-following Monte-Carlo codes\
  \ (ASCOT, NUBEAM) or bounce-averaged Fokker\u2013Planck solvers. Positive when the\
  \ resulting current is in the $+\\phi$ direction under COCOS-11. Complementary passing-particle\
  \ contributions are given by `co_passing_fast_ion_toroidal_current_density` and\
  \ `counter_passing_fast_ion_toroidal_current_density`."
