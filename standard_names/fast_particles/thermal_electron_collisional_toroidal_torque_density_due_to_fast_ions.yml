name: thermal_electron_collisional_toroidal_torque_density_due_to_fast_ions
status: draft
description: Toroidal torque density transferred to the thermal electron population
  through Coulomb collisions with fast ions.
documentation: "This quantity $\\tau_{\\phi,\\mathrm{th,e}}^{\\mathrm{coll,fi}}$ describes\
  \ the rate of toroidal angular momentum per unit area delivered from supra-thermal\
  \ ions to the background thermal-electron population via Coulomb friction. The fast-ion\
  \ slowing-down process transfers momentum predominantly to electrons at high fast-ion\
  \ energies (above the critical energy $E_c$, where electron drag dominates ion drag).\
  \ The torque density is obtained from $\\tau_{\\phi,\\mathrm{th,e}} = \\int R\\\
  , C_{ei}(f_{\\mathrm{fast,i}}, f_{\\mathrm{th,e}})\\, m_e v_\\phi\\, d^3v$, where\
  \ $C_{ei}$ is the electron\u2013fast-ion collision operator, $R$ the major radius,\
  \ $m_e$ the electron mass, and $v_\\phi$ the toroidal velocity. Although the per-collision\
  \ momentum transfer to electrons is small ($\\propto m_e/m_i$), the high collision\
  \ frequency at supra-thermal speeds makes the integrated torque non-negligible,\
  \ typically $10^{-4}$\u2013$10^{-2}\\;\\mathrm{N\\,m^{-2}}$ in NBI-heated plasmas.\
  \ Complementary quantities are `ion_collisional_toroidal_torque_density_on_thermal_population_due_to_fast_ions`\
  \ (torque on thermal ions) and `fast_ion_collisional_toroidal_torque_density_due_to_collisions`\
  \ (reaction torque on the fast ions)."
