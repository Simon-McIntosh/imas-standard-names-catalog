- name: toroidal_deuterium_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal component of the bulk deuterium ion flow velocity at the magnetic
    axis, taken along the phi direction in the right-handed cylindrical (R, phi, Z)
    frame.
  documentation: 'Toroidal deuterium velocity at the magnetic axis is the central
    value of the deuterium ion bulk flow projected onto the toroidal direction. It
    characterizes rotation of the deuterium population at the radial center of the
    nested magnetic flux surfaces, not a full radial variation of the flow.


    The quantity is defined by projecting the deuterium bulk velocity onto the toroidal
    unit vector at the magnetic-axis location:


    $$

    v_{\phi,D,\mathrm{axis}} = \mathbf{v}_D(\mathbf{x}_\mathrm{axis}) \cdot \hat{\phi}

    $$


    where $v_{\phi,D,\mathrm{axis}}$ is in $\mathrm{m\,s^{-1}}$, $\mathbf{v}_D$ is
    the deuterium ion bulk velocity in $\mathrm{m\,s^{-1}}$, $\mathbf{x}_\mathrm{axis}$
    is a point on the magnetic-axis curve, and $\hat{\phi}$ is the unit vector in
    the direction of increasing toroidal angle in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    In practice, this value is obtained from central ion-flow measurements when available,
    or inferred from nearby core measurements together with equilibrium geometry and
    transport or momentum-balance constraints. Such estimates should be interpreted
    as contextual determinations of the magnetic-axis value rather than as part of
    the definition.


    Representative magnitudes are device- and scenario-dependent, commonly about $10^3$-$10^5\
    \mathrm{m\,s^{-1}}$ in low-torque plasmas and up to a few $10^5\ \mathrm{m\,s^{-1}}$
    when strong external momentum input is present.


    Sign convention: Positive when the deuterium bulk flow is in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
