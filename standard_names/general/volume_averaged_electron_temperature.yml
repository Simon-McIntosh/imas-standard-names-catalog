name: volume_averaged_electron_temperature
status: draft
cocos_transformation_type: one_like
description: Electron temperature averaged over the confined plasma volume, providing
  a scalar measure of bulk electron thermal energy.
documentation: "The volume-averaged electron temperature $\\langle T_e \\rangle_V\
  \ = V^{-1} \\int T_e \\, dV$ (in eV) is obtained by integrating the local electron\
  \ temperature $T_e$ over the confined plasma volume $V$ enclosed by the last closed\
  \ flux surface. It serves as a global confinement figure of merit and enters scaling-law\
  \ regressions for energy confinement time. Typical values are 1\u20135 keV in conventional\
  \ tokamak H-mode plasmas and 5\u201315 keV in burning-plasma scenarios. The quantity\
  \ is derived from spatially resolved $T_e$ profiles measured by Thomson scattering\
  \ or ECE, mapped onto the equilibrium flux-surface geometry. It is related to the\
  \ stored thermal energy via $W_{\\mathrm{th},e} = \\frac{3}{2} \\langle n_e k_B\
  \ T_e \\rangle_V V$, where $n_e$ is the electron number density and $k_B$ is the\
  \ Boltzmann constant. See also `electron_temperature` for the local profile quantity."
