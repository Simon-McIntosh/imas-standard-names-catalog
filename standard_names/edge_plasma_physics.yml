- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum
  kind: scalar
  status: draft
  description: Local derivative of electron number density with respect to the normalized
    poloidal flux coordinate, evaluated at the H-mode pedestal location in the steep
    edge transport barrier.
  documentation: "The derivative $dn_e/d\\psi_N$ at the pedestal quantifies the radial\
    \ steepness of the electron density profile across the H-mode transport barrier,\
    \ where $\\psi_N$ is the normalized poloidal flux coordinate increasing from 0\
    \ at the magnetic axis to 1 at the plasma boundary.\n\nThe quantity is defined\
    \ as:\n\n$$\n\\left.\\frac{dn_e}{d\\psi_N}\\right|_{\\text{pedestal}}\n$$\n\n\
    where $n_e$ is the electron number density and $\\psi_N = (\\psi - \\psi_0)/(\\\
    psi_b - \\psi_0)$, with $\\psi_0$ denoting the poloidal magnetic flux at the magnetic\
    \ axis and $\\psi_b$ its value at the plasma boundary.\n\nThis derivative is extracted\
    \ from profile fits \u2014 modified hyperbolic tangent (mtanh) or piecewise-linear\
    \ models \u2014 applied to Thomson scattering or reflectometry measurements parameterized\
    \ as a function of $\\psi_N$. For the maximum gradient over the full pedestal\
    \ region rather than a single reference point, see [the pedestal-region maximum\
    \ gradient]. The analogous derivative for electron pressure is given by [derivative\
    \ of electron pressure at pedestal](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top).\n\
    \nTypical magnitudes in H-mode pedestals range from $10^{19}$ to $10^{21}$ m$^{-3}$\
    \ per unit $\\psi_N$, with steeper gradients associated with higher pedestal pressures\
    \ and stronger edge transport barriers.\n\nSign convention: Positive when electron\
    \ density increases with increasing $\\psi_N$ (in the radially outward direction\
    \ toward the plasma boundary); in standard H-mode operation the derivative is\
    \ negative as density decreases across the pedestal from the confinement interior\
    \ toward the separatrix."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:summary/pedestal_fits/linear/n_e/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/linear/n_e/d_dpsi_norm_max/value
    status: attached
  - id: dd:summary/pedestal_fits/mtanh/n_e/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/mtanh/n_e/d_dpsi_norm_max/value
    status: composed
- name: deuterium_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of deuterium ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core plasma.
  documentation: "Deuterium density at the pedestal top is the local number density\
    \ of deuterium ions (D$^+$, $Z=1$, $A=2$) at the shoulder of the H-mode edge transport\
    \ barrier, where the steep edge density gradient transitions to the flatter confined-plasma\
    \ core profile. As the primary fuel ion species in standard deuterium operations,\
    \ this quantity is a species-resolved member of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family and represents the dominant single ion contribution to the total pedestal\
    \ charge balance.\n\nThe deuterium ion density at the pedestal top participates\
    \ in the local quasi-neutrality constraint alongside all other ion populations:\n\
    \n$$\nn_e = n_D + \\sum_s Z_s \\, n_s\n$$\n\nwhere $n_e$ is the electron number\
    \ density, $n_D$ is the deuterium number density (D$^+$ carries a single ionization\
    \ state), $Z_s$ is the charge number of impurity or minority species $s$, and\
    \ $n_s$ is the number density of that species at the pedestal top.\n\nDeuterium\
    \ pedestal density is inferred from Thomson scattering electron density profiles\
    \ combined with quasi-neutrality, from Balmer-series Stark broadening, or from\
    \ charge-exchange recombination spectroscopy. In H-mode tokamaks, pedestal-top\
    \ densities range from roughly $1$\u2013$10 \\times 10^{19}$ m$^{-3}$, depending\
    \ on plasma current, toroidal field, and fueling rate. Species-resolved siblings\
    \ include [hydrogen_density_at_pedestal_top](name:hydrogen_density_at_pedestal_top)\
    \ for protium, [helium_4_density_at_pedestal_top](name:helium_4_density_at_pedestal_top)\
    \ for helium-4 ash, and [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top)\
    \ for the complementary electron population at this radial location."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:hydrogen_density_at_pedestal_top
  - name:helium_4_density_at_pedestal_top
  - name:electron_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: deuterium
    operator_kind: qualifier
- name: deuterium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of deuterium ions at the plasma boundary (separatrix),
    the last closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off layer.
  documentation: 'Deuterium density at the plasma boundary is the number of deuterium
    ions per unit volume evaluated on the separatrix, the last closed magnetic flux
    surface. It is a species-resolved ion density, distinct from electron density
    and total ion density, and excludes neutral deuterium atoms and molecules. The
    quantity denotes a separatrix boundary value rather than a divertor target or
    strike-point density; if a flux-surface average is specified, it is the average
    of this local separatrix density around the last closed flux surface.


    The particle density is the differential deuterium-ion count per volume:


    $$

    n_D = \frac{dN_D}{dV}

    $$


    where $n_D$ is the deuterium ion density in $\mathrm{m^{-3}}$, $dN_D$ is the number
    of deuterium ions in the differential volume $dV$, and the value is evaluated
    at the separatrix. In a fully ionized deuterium-dominated edge plasma, quasineutrality
    often gives $n_e \simeq n_D + \sum_z Z_z n_z$; when impurity and other fuel-ion
    fractions are small, $n_D \simeq n_e$.


    In practice this quantity is inferred by combining diagnostics that measure edge
    density and species content with an equilibrium estimate of the separatrix location.
    Thomson scattering can provide the nearby electron density, charge-exchange spectroscopy
    and passive spectroscopy can constrain ion species fractions, and Langmuir-probe
    measurements at material surfaces may inform the estimate through edge transport
    modeling rather than representing the separatrix value directly.


    Typical separatrix deuterium ion densities in tokamak plasmas are about $0.1-2
    \times 10^{19}\ \mathrm{m^{-3}}$ in low-density or L-mode operation and $0.5-5
    \times 10^{19}\ \mathrm{m^{-3}}$ in many H-mode plasmas. High-fueling or detached-boundary
    conditions can approach $1 \times 10^{20}\ \mathrm{m^{-3}}$, depending on plasma
    size, isotope mix, recycling, and confinement regime.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:deuterium_density_at_magnetic_axis
  - name:hydrogen_density_at_plasma_boundary
  - name:tritium_density_at_plasma_boundary
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: deuterium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/deuterium/value
    dd_path: summary/local/separatrix_average/n_i/deuterium/value
    status: composed
- name: deuterium_tritium_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of deuterium-tritium fuel ions evaluated at the H-mode
    pedestal top, where the steep edge density gradient transitions to the flatter
    confined-core variation. It represents the effective D-T fuel mixture as the sum
    of deuterium and tritium ion densities, with effective mean mass number 2.5 for
    an equal mixture.
  documentation: 'Number density of deuterium-tritium fuel ions evaluated at the H-mode
    pedestal top is the local number density of the D-T fuel ion population at the
    shoulder of the H-mode edge transport barrier. The pedestal top is the radial
    location where the steep edge density gradient transitions to the flatter confined-core
    variation and is distinct from a separatrix or plasma-boundary value. The D-T
    population is an effective fuel mixture of singly ionized deuterium and tritium
    ions, so the aggregation is over isotope components rather than over multiple
    ionization charge states; as a particle count per volume, the physical value is
    non-negative.


    For the pedestal-top flux surface, the effective D-T density is defined as the
    sum of the resolved isotope ion densities:


    $$

    n_{\mathrm{DT}}(\xi_{\mathrm{ped,top}}) = n_{\mathrm{D}}(\xi_{\mathrm{ped,top}})
    + n_{\mathrm{T}}(\xi_{\mathrm{ped,top}})

    $$


    where $n_{\mathrm{DT}}$, $n_{\mathrm{D}}$, and $n_{\mathrm{T}}$ are the combined
    D-T, deuterium, and tritium ion densities in $\mathrm{m^{-3}}$, and $\xi_{\mathrm{ped,top}}$
    is the chosen radial label of the pedestal-top flux surface, for example normalized
    toroidal flux radius $\rho_\mathrm{tor,norm}$ or normalized poloidal flux $\psi_N$.
    For an equal D-T mixture, $n_{\mathrm{D}} = n_{\mathrm{T}} = n_{\mathrm{DT}}/2$
    and the effective mean mass number is 2.5.


    In practice, this value is usually inferred rather than directly measured. Edge
    electron-density measurements from Thomson scattering, reflectometry, and interferometry
    constrain the total charge density; impurity spectroscopy and quasineutrality
    estimate the fuel-ion density; isotope-sensitive diagnostics, neutral-particle
    analysis, spectroscopic isotope ratios, particle-balance modeling, or scenario
    assumptions constrain the D:T fraction. It is the pedestal-top counterpart of
    [deuterium-tritium density](name:deuterium_tritium_density) and should be distinguished
    from separately resolved [deuterium density at pedestal top](name:deuterium_density_at_pedestal_top)
    and [tritium density at pedestal top](name:tritium_density_at_pedestal_top).


    Representative H-mode pedestal-top D-T fuel-ion densities are typically of order
    $10^{19}-10^{20}\,\mathrm{m^{-3}}$ in present tokamak plasmas, with high-density
    burning-plasma scenarios reaching roughly $1-2 \times 10^{20}\,\mathrm{m^{-3}}$.
    The combined D-T density is usually close to [electron density at pedestal top](name:electron_density_at_pedestal_top)
    when impurity charge densities are small, while [ion density at pedestal top](name:ion_density_at_pedestal_top)
    includes all ion species and can differ when impurities or helium ash are appreciable.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:deuterium_tritium_density
  - name:deuterium_tritium_density_at_internal_transport_barrier
  arguments:
  - name: density_at_pedestal_top
    operator: deuterium_tritium
    operator_kind: qualifier
- name: deuterium_tritium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of the fictitious deuterium-tritium pseudo-species (mean
    atomic mass 2.5 amu) at the plasma boundary, the last closed flux surface separating
    confined plasma from the scrape-off layer.
  documentation: "The deuterium-tritium pseudo-species is a fictitious single-ion\
    \ plasma constituent with mean atomic mass 2.5 amu, introduced in transport simulations\
    \ to represent the combined D-T fuel mixture as a single fluid rather than tracking\
    \ deuterium and tritium separately. The number density $n_{DT,\\text{sep}}$ is\
    \ evaluated at the separatrix \u2014 the last closed flux surface bounding the\
    \ confined plasma \u2014 making it the DT-species realization of the more general\
    \ [density_at_plasma_boundary](name:density_at_plasma_boundary).\n\nThe separatrix\
    \ density provides an upstream boundary condition for scrape-off-layer transport\
    \ models and sets fueling depth and recycling source strengths at the plasma edge.\
    \ It is inferred from edge Thomson scattering or reflectometry measurements combined\
    \ with equilibrium reconstruction to locate the separatrix position in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. Typical values in H-mode operation range\
    \ from $10^{18}$ to $10^{20}$ m$^{-3}$, generally lower than the [deuterium_tritium_density_at_pedestal](name:deuterium_tritium_density_at_pedestal_top)\
    \ value by a factor of two to four. The corresponding quantity at a limiter contact\
    \ surface is [deuterium_tritium_density_at_limiter](name:deuterium_tritium_density_at_limiter).\n\
    \nSign convention: Positive when deuterium-tritium fuel ions are present at the\
    \ last closed flux surface."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:deuterium_tritium_density_at_limiter
  arguments:
  - name: density_at_plasma_boundary
    operator: deuterium_tritium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/deuterium_tritium/value
    dd_path: summary/local/separatrix_average/n_i/deuterium_tritium/value
    status: composed
- name: edge_localized_mode_frequency
  kind: scalar
  status: draft
  description: Repetition rate of edge-localized mode bursts during an ELMing H-mode
    phase. It quantifies how often pedestal relaxation events occur and sets the cadence,
    not the size, of transient particle and energy exhaust to the scrape-off layer
    and divertor.
  documentation: 'Edge-localized mode frequency is the rate at which discrete ELM
    bursts occur during an ELMing H-mode phase. It characterizes the temporal spacing
    of pedestal relaxation events; the energy or particle loss per burst must be specified
    separately from this rate.


    For an analysis window of duration $\Delta t$, the frequency is defined by counting
    ELM onsets within that window:


    $$

    f_\mathrm{ELM} = \frac{N_\mathrm{ELM}}{\Delta t} \simeq \frac{1}{\langle \tau_\mathrm{ELM}
    \rangle}

    $$


    where $N_\mathrm{ELM}$ is the number of accepted ELM events, $\Delta t$ is measured
    in seconds, $f_\mathrm{ELM}$ is in Hz ($\mathrm{s}^{-1}$), $\tau_\mathrm{ELM}$
    is the time between consecutive ELM onsets in seconds, and $\langle \tau_\mathrm{ELM}
    \rangle$ is the mean inter-ELM interval over the same window. The reciprocal-interval
    form is equivalent to the count rate when the same events and boundary treatment
    are used.


    In practice, ELM onsets are identified from correlated transient signatures such
    as edge light emission, divertor heat-flux pulses, magnetic fluctuations, density
    bursts, or pedestal profile drops. The averaging window should be chosen so that
    it is short enough to follow slow discharge evolution but long enough to contain
    representative events; intervals with no ELMing H-mode, ambiguous compound events,
    pacing triggers, or deliberately selected ELM classes should be treated by a consistent
    event-selection rule.


    Typical values span about 0.5-1000 Hz. Large, infrequent ELM regimes are often
    below 10 Hz, many routinely ELMing H-mode plasmas are in the 10-100 Hz range,
    and small-ELM or actively paced regimes can reach 100-1000 Hz; a value of 0 Hz
    indicates that no accepted ELM events occurred in the averaging window.'
  unit: Hz
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
- name: effective_charge_at_pedestal_top
  kind: scalar
  status: draft
  description: Effective charge (Zeff) at the H-mode pedestal, measuring impurity
    content through the charge-weighted mean squared ion charge near the edge transport
    barrier.
  documentation: 'Effective charge at the pedestal is the local plasma effective charge
    evaluated in the H-mode edge transport barrier. It is a dimensionless measure
    of impurity content: hydrogenic fuel ions alone give a value close to one, while
    impurity ions increase the value in proportion to both their density and the square
    of their charge state.


    The effective charge is the electron-density-normalized, charge-squared weighted
    ion density sum:


    $$

    Z_\mathrm{eff} = \frac{\sum_s n_s Z_s^2}{n_e}

    $$


    where the sum is over ion species $s$, $n_s$ is the ion density of species $s$
    in m^-3, $Z_s$ is its mean ionization state, and $n_e$ is the electron density
    in m^-3; for a quasineutral plasma, $n_e = \sum_s n_s Z_s$.


    Pedestal effective charge is inferred from impurity spectroscopy, visible or soft-X-ray
    bremsstrahlung, charge-exchange measurements, and edge transport or equilibrium
    analysis constrained by electron density and temperature. Optically thin bremsstrahlung
    emissivity scales approximately with $n_e^2 Z_\mathrm{eff} T_e^{1/2}$, making
    the pedestal value important for radiation, collisionality, resistivity, and bootstrap-current
    estimates in the edge transport barrier.


    Typical pedestal values in H-mode tokamak plasmas are about 1.2-3.5. Values close
    to 1 indicate a nearly pure hydrogenic plasma, while larger values occur with
    impurity seeding, enhanced wall influx, or accumulation of high-charge-state impurities.


    This quantity complements the generic [effective_charge](name:effective_charge),
    location-specific values such as [effective_charge_at_magnetic_axis](name:effective_charge_at_magnetic_axis),
    [effective_charge_at_internal_transport_barrier](name:effective_charge_at_internal_transport_barrier),
    and [effective_charge_at_limiter](name:effective_charge_at_limiter), and global
    measures such as [volume_averaged_effective_charge](name:volume_averaged_effective_charge).'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_magnetic_axis
  - name:effective_charge_at_internal_transport_barrier
- name: effective_charge_at_plasma_boundary
  kind: scalar
  status: draft
  description: Effective charge number of the ion mixture at the plasma boundary (separatrix),
    equal to the charge-squared-weighted sum of ionic densities normalized to electron
    density.
  documentation: "The effective charge $Z_\\text{eff}$ at the plasma boundary captures\
    \ the aggregate charge state of all ion species at the last closed flux surface,\
    \ where the magnetically confined plasma transitions to the open-field-line scrape-off\
    \ layer. In a pure hydrogenic plasma $Z_\\text{eff} = 1$; impurity ions with charge\
    \ state $Z_i > 1$ raise $Z_\\text{eff}$ above unity, increasing resistivity and\
    \ impurity radiation losses.\n\n$$\nZ_\\text{eff} = \\frac{\\sum_i n_i Z_i^2}{n_e}\n\
    $$\n\nwhere $n_i$ is the number density of ion species $i$, $Z_i$ is the charge\
    \ state of species $i$, and $n_e$ is the electron number density, with the sum\
    \ running over all ion species and charge states present at the boundary.\n\n\
    At the separatrix, $Z_\\text{eff}$ is sensitive to plasma-wall interactions, impurity\
    \ seeding, and edge transport processes that concentrate high-$Z$ ions near the\
    \ boundary. It governs local Spitzer resistivity ($\\eta \\propto Z_\\text{eff}$)\
    \ and modifies neoclassical transport coefficients in the edge region. The [electron_pressure_at_plasma_boundary](name:electron_pressure_at_plasma_boundary)\
    \ and [hydrogen_density_at_plasma_boundary](name:hydrogen_density_at_plasma_boundary)\
    \ characterize the thermodynamic state at the same boundary location; the analogous\
    \ pedestal quantity is [effective_charge_at_pedestal](name:effective_charge_at_pedestal_top).\
    \ It is inferred from visible bremsstrahlung spectroscopy or from consistency\
    \ between line-integrated electron density and charge-exchange spectroscopy.\n\
    \nTypical values range from 1 in near-pure hydrogen plasmas to 2\u20135 in impurity-seeded\
    \ or metallic-wall discharges.\n\nSign convention: Positive when ions are present,\
    \ as $Z_\\text{eff}$ is defined as a ratio of positive-definite charge-weighted\
    \ ion densities to electron density."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_plasma_boundary
  - name:hydrogen_density_at_plasma_boundary
- name: electron_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Positive radial e-folding length of electron number density in the
    scrape-off layer, defined as the inverse magnitude of the outward logarithmic
    radial gradient. It measures how rapidly electron density falls with distance
    outside the confined plasma.
  documentation: 'Electron decay length in the scrape-off layer is the positive e-folding
    length for the falloff of electron number density with outward distance across
    the scrape-off layer. It characterizes the radial width of the electron-density
    decay region; a larger value means a more gradual decrease of density outside
    the confined plasma.


    For a local outward distance coordinate $x$, the decay length is defined by the
    inverse magnitude of the logarithmic density gradient:


    $$

    \lambda_{n_e} = \left|\frac{d\ln n_e}{dx}\right|^{-1} = \frac{n_e}{\left|d n_e/dx\right|}

    $$


    where $n_e$ is electron number density in $m^{-3}$, $x$ is outward distance in
    m across the scrape-off layer, and $\lambda_{n_e}$ is the decay length in m. The
    absolute value makes the quantity non-negative for the usual outward density decrease
    and for local gradients of either sign.


    In practice, $\lambda_{n_e}$ is obtained by fitting or differentiating electron-density
    measurements in the scrape-off layer, commonly using Langmuir probes, Thomson
    scattering, reflectometry, or equilibrium-mapped edge measurements over a specified
    radial interval. It is conceptually equivalent to [radial_electron_decay_length_over_scrape_off_layer](name:electron_decay_length_over_scrape_off_layer)
    when the decay direction is the outward radial direction; the explicitly radial
    name is useful when distinguishing this scale from parallel, poloidal, or other
    directional decay lengths.


    Typical values in tokamak scrape-off-layer analyzes are about 0.001-0.05 m, depending
    on plasma conditions, magnetic geometry, density, fueling, recycling, and the
    radial interval used for the fit.'
  unit: m
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
- name: electron_density_at_launching_position
  kind: scalar
  status: draft
  description: Electron number density in the edge plasma immediately adjacent to
    a wave launcher aperture or waveguide mouth.
  documentation: 'Electron density at the launching position is the local number density
    of free electrons in the plasma that a launched electromagnetic wave first encounters.
    The launching position denotes the small plasma volume immediately in front of
    the launcher face, grill, or waveguide mouth, typically in the scrape-off-layer
    or limiter-shadow region. It is the electron-specific form of density_at_launching_position;
    unlike a total particle density, it counts free electrons only, and in a quasineutral
    plasma is approximately balanced by the charge-weighted ion density rather than
    by neutral density.


    A key wave-coupling scale set by this density is the electron plasma angular frequency:


    $$

    \omega_{pe} = \left(\frac{n_e e^2}{\varepsilon_0 m_e}\right)^{1/2}

    $$


    where $n_e$ is the electron density in m$^{-3}$, $e$ is the elementary charge
    in coulombs, $\varepsilon_0$ is the vacuum permittivity in F m$^{-1}$, $m_e$ is
    the electron mass in kg, and $\omega_{pe}$ is in rad s$^{-1}$. For lower-hybrid
    coupling estimates, $n_e$ also enters the approximate cold-plasma accessibility
    condition $n_\parallel^2 \ge 1 + \omega_{pe}^2/\omega_{ce}^2$, where $n_\parallel$
    is the dimensionless parallel refractive index, $\omega_{ce}=eB/m_e$ is the electron
    cyclotron angular frequency in rad s$^{-1}$ for magnetic-field magnitude $B$ in
    tesla, and launched-wave angular frequencies are in rad s$^{-1}$ or equivalently
    $f=\omega/(2\pi)$ in Hz.


    In practice this density is measured or inferred from edge diagnostics viewing
    the launcher vicinity, such as Langmuir probes, microwave reflectometry, interferometry,
    or analysis of wave coupling behavior. The reported value should represent the
    plasma immediately outside the launching structure, not a core density or a distant
    separatrix value; comparisons with electron_density_at_separatrix and [electron_density_at_limiter](name:electron_density_at_limiter)
    help distinguish launcher-local conditions from other edge reference locations.


    Typical values near wave launchers in tokamak edge plasmas are about $10^{17}$-$10^{19}$
    m$^{-3}$, with lower-hybrid launcher coupling often sensitive in the $10^{17}$-$10^{18}$
    m$^{-3}$ range. The value can vary strongly with gas puffing, recycling from plasma-facing
    components, launcher-plasma gap, magnetic geometry near the edge, and transient
    edge events.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_limiter
- name: electron_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Electron number density at the H-mode pedestal top, where the steep-gradient
    edge transport barrier meets the flatter confined-plasma core.
  documentation: "Electron density at the pedestal top is the local number density\
    \ of electrons at the radial position marking the inner shoulder of the H-mode\
    \ edge transport barrier, where the steep edge density gradient transitions toward\
    \ the flatter core plasma profile. It is the electron-specific member of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family; unlike impurity-ion members such as [krypton_density_at_pedestal_top](name:krypton_density_at_pedestal_top)\
    \ or [nitrogen_density_at_pedestal_top](name:nitrogen_density_at_pedestal_top),\
    \ no charge-state summation is required because electrons form a single population.\n\
    \nAt the pedestal top, global quasi-neutrality constrains this quantity via the\
    \ total ion charge inventory:\n\n$$\nn_e^{\\rm ped} = \\sum_s Z_s \\, n_s^{\\\
    rm ped}\n$$\n\nwhere $n_s^{\\rm ped}$ is the number density of ion species $s$\
    \ and $Z_s$ is its charge state, summed over all ion species at the pedestal top.\n\
    \nThe pedestal-top value is extracted by fitting a modified hyperbolic-tangent\
    \ (mtanh) profile to electron density measurements across the pedestal region,\
    \ primarily from Thomson scattering or microwave reflectometry. Typical pedestal-top\
    \ electron densities in H-mode tokamaks range from $0.3 \\times 10^{20}$ to $2\
    \ \\times 10^{20}$ m$^{-3}$, scaling with plasma current and target line-averaged\
    \ density. The companion quantity [electron_temperature_at_pedestal](name:electron_temperature_at_pedestal_top)\
    \ characterizes the thermal energy at the same radial location, and together they\
    \ set the pedestal pressure that governs the ELM stability boundary; the fuel-ion\
    \ counterpart [deuterium_density_at_pedestal_top](name:deuterium_density_at_pedestal_top)\
    \ can be compared to assess the electron\u2013ion density balance."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:krypton_density_at_pedestal_top
  - name:nitrogen_density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: electron
    operator_kind: qualifier
- name: electron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron number density at the plasma boundary (separatrix), the last
    closed flux surface separating confined plasma from the scrape-off layer.
  documentation: 'Electron density at the plasma boundary is the electron number density
    evaluated on the separatrix, the last closed magnetic flux surface. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, with $R$ major radius, $\phi$ toroidal angle,
    and $Z$ vertical height, this surface separates closed magnetic field lines in
    the confined plasma from open field lines in the scrape-off layer.


    Using the normalized toroidal-flux radius $\rho_{\mathrm{tor,norm}}$ as a flux-surface
    label, the separatrix value is the confined-side limit:


    $$

    n_{e,\mathrm{sep}} = \lim_{\rho_{\mathrm{tor,norm}} \to 1^-} n_e(\rho_{\mathrm{tor,norm}})

    $$


    where $n_e$ is the electron number density and $\rho_{\mathrm{tor,norm}}=1$ labels
    the separatrix. Together with the boundary electron temperature, it determines
    the boundary electron pressure through the inline relation $p_{e,\mathrm{sep}}
    = n_{e,\mathrm{sep}} T_{e,\mathrm{sep}}$ when $T_e$ is expressed as an energy
    per electron.


    In practice, this quantity is obtained by mapping edge electron-density measurements
    onto magnetic flux surfaces from an equilibrium reconstruction. Common inputs
    include Thomson scattering, reflectometry, and interferometry constrained by fitted
    pedestal or scrape-off-layer density shapes; the largest uncertainties often come
    from separatrix position, steep edge gradients, and diagnostic calibration.


    Typical values in tokamak H-mode edge plasmas are about $0.3-3 \times 10^{19}$
    m$^{-3}$, with lower values possible in low-density or limiter-like plasmas and
    higher values in strongly fueled, high-density discharges.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  - name:electron_temperature_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: electron
    operator_kind: qualifier
- name: electron_density_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Electron number-density baseline on the scrape-off-layer side of an
    analytic H-mode pedestal fit. It is the fitted offset representing the low-density
    open-field-line side of the pedestal, distinct from the density at the plasma
    boundary and from the pedestal-top density.
  documentation: 'Electron density over the scrape-off layer is the asymptotic baseline
    electron number density associated with the open-field-line side of an analytic
    H-mode pedestal representation. It is a fitted offset parameter for the scrape-off-layer
    side of the density shape, not the density evaluated at a particular location
    such as the last closed flux surface or the pedestal top.


    In practice, this quantity is obtained by fitting an analytic pedestal model to
    edge electron-density data or to a modeled edge density distribution. Different
    analytic pedestal forms may use different width, slope, and transition parameters,
    so the common semantic content is the fitted scrape-off-layer offset, often denoted
    $n_{e,\mathrm{SOL}}$, rather than any specific formula for the full radial dependence.
    The separate scrape-off-layer falloff scale is described by electron_decay_length_over_scrape_off_layer,
    while nearby reference densities include [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)
    and electron_density_at_pedestal.


    Typical fitted H-mode tokamak scrape-off-layer density offsets are of order $10^{18}$-$10^{20}$
    m^-3, depending on fueling, divertor conditions, pedestal collisionality, and
    how far the fitted interval extends into the open-field-line region. In well-constrained
    pedestal fits this offset is usually below the pedestal-top density and should
    be interpreted together with the chosen analytic fit form.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
- name: electron_pressure_at_pedestal_top
  kind: scalar
  status: draft
  description: Electron pressure at the H-mode pedestal reference location, representing
    the pedestal-height amplitude extracted from a profile fit to the steep-gradient
    edge transport barrier.
  documentation: "The H-mode pedestal is a narrow region of strongly suppressed turbulent\
    \ transport near the plasma boundary, producing a steep gradient in the electron\
    \ pressure profile between the flat core and the scrape-off layer. The electron\
    \ pressure at the pedestal characterizes the amplitude of this pressure step and\
    \ is a primary pedestal-performance figure of merit that, through profile stiffness,\
    \ strongly influences overall energy confinement.\n\nThe pedestal height $p_\\\
    mathrm{ped}$ is extracted by fitting the measured electron pressure profile to\
    \ a modified hyperbolic tangent (mtanh) function:\n\n$$\np_e(\\psi_N) = \\frac{p_\\\
    mathrm{ped}}{2}\\left[\\tanh\\!\\left(\\frac{\\psi_{N,\\mathrm{ped}} - \\psi_N}{\\\
    Delta\\psi_N}\\right) + 1\\right] + p_0\n$$\n\nwhere $\\psi_N$ is the normalized\
    \ poloidal flux coordinate, $\\psi_{N,\\mathrm{ped}}$ is the pedestal midpoint,\
    \ $\\Delta\\psi_N$ is the pedestal half-width, and $p_0$ is the scrape-off-layer\
    \ baseline captured by [electron_pressure_over_scrape_off_layer](name:electron_pressure_over_scrape_off_layer).\n\
    \nEdge Thomson scattering measurements of electron density and temperature are\
    \ the primary source for constructing the electron pressure profile from which\
    \ this pedestal height is derived. Typical pedestal electron pressures span $\\\
    sim$1\u20135 kPa in low-current H-mode discharges and $\\sim$20\u2013100 kPa in\
    \ high-performance H-mode plasmas on large tokamaks. The companion [electron_pressure_at_pedestal_top](name:electron_pressure_at_pedestal_top)\
    \ refers to the pressure evaluated explicitly at the core-side top of the pedestal,\
    \ whereas this name denotes the fit-derived height at the broader pedestal reference\
    \ location. The radial pressure gradient at this location is described by [derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top),\
    \ and electron_density_at_pedestal provides the corresponding electron number\
    \ density.\n\nSign convention: Positive when the electron pressure is positive,\
    \ as guaranteed for all physical plasma states since kinetic pressure is an intrinsically\
    \ positive-definite thermodynamic quantity invariant under reversals of the plasma\
    \ current or toroidal field direction."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_over_scrape_off_layer
- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top
  kind: scalar
  status: draft
  description: Local derivative of electron pressure with respect to the normalized
    poloidal flux coordinate, evaluated at the H-mode pedestal. It describes the radial
    pressure slope at that pedestal reference location, not an extremum or average
    over the full pedestal region.
  documentation: 'This quantity is the local slope of electron pressure as a function
    of the normalized poloidal flux coordinate $\psi_N$ at the H-mode pedestal. A
    large magnitude indicates a sharp edge pressure gradient. It is evaluated at the
    chosen pedestal reference location and should not be interpreted as the maximum
    gradient over the pedestal region.


    The derivative is defined by differentiating electron pressure with respect to
    $\psi_N$ and evaluating the result at the pedestal reference position:


    $$

    \left.\frac{d p_e}{d\psi_N}\right|_{\mathrm{ped}} = \left.\frac{d}{d\psi_N}\left(e\,n_e
    T_e\right)\right|_{\mathrm{ped}}

    $$


    where $p_e$ is electron pressure, $\psi_N$ is the normalized poloidal flux coordinate
    (dimensionless, 0 at the magnetic axis and 1 at the plasma boundary), $n_e$ is
    electron density in m$^{-3}$, $T_e$ is electron temperature in eV, and $e$ is
    the positive elementary charge converting eV to joules. With this temperature
    convention, $e n_e T_e$ has units of Pa, and the derivative also has units Pa
    because $\psi_N$ is dimensionless; if $T_e$ is expressed in kelvin instead, the
    equivalent pressure relation is $p_e=n_e k_B T_e$.


    In practice, the value is obtained by mapping electron density and temperature
    measurements onto $\psi_N$, forming $p_e$, and differentiating a smooth representation
    of the pedestal variation at the pedestal reference position. The reference position
    is set by the pedestal characterization method, so this quantity is a local slope
    rather than a region-wide extremum.


    Typical H-mode values expressed per unit $\psi_N$ have outward-gradient magnitudes
    of $10^4$-$10^6$ Pa; low-performance or broad pedestals can be closer to $10^3$-$10^4$
    Pa. For pedestals whose pressure decreases toward the boundary, the numerical
    value is negative, with magnitude roughly equal to the electron pressure drop
    across the pedestal divided by its width in $\psi_N$.


    Sign convention: Positive when electron pressure increases with increasing normalized
    poloidal flux coordinate $\psi_N$ from the magnetic axis toward the plasma boundary.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top
  arguments:
  - name: electron_pressure_at_pedestal_top
    operator: derivative_with_respect_to_normalized_poloidal_flux_coordinate
    operator_kind: unary_prefix
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/pressure_electron/d_dpsi_norm/value
    dd_path: summary/pedestal_fits/mtanh/pressure_electron/d_dpsi_norm/value
    status: composed
- name: electron_pressure_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron thermal pressure evaluated at the plasma boundary (separatrix),
    where the magnetically confined plasma meets the open-field-line scrape-off layer.
  documentation: "The electron pressure at the plasma boundary quantifies the isotropic\
    \ thermodynamic pressure of the electron population at the last closed flux surface\
    \ (separatrix), the outermost surface bounding the region of nested, closed magnetic\
    \ flux and separating confined plasma from the scrape-off layer.\n\nThe defining\
    \ relation is the ideal-gas equation of state:\n\n$$\np_e = n_e k_B T_e\n$$\n\n\
    where $n_e$ is the electron number density and $k_B T_e$ is the electron thermal\
    \ energy per particle. The boundary value is obtained by evaluating this product\
    \ at the separatrix. The companion [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)\
    \ provides one factor of this product from independent profile measurements; together\
    \ they constrain the electron temperature at the boundary.\n\nThis boundary pressure\
    \ is inferred from electron density and temperature profiles measured across the\
    \ pedestal region \u2014 typically by Thomson scattering or electron cyclotron\
    \ emission \u2014 using linear or hyperbolic-tangent functional fits evaluated\
    \ at the inferred separatrix location. It serves as an essential boundary condition\
    \ for edge transport and scrape-off layer models, as well as a global summary\
    \ scalar characterizing the pedestal\u2013SOL interface alongside the parent pressure_at_plasma_boundary.\n\
    \nTypical values in H-mode tokamak discharges range from tens to a few hundred\
    \ pascals at the separatrix, substantially lower than the pedestal-top electron\
    \ pressure, which can reach several kilopascals in reactor-relevant conditions.\n\
    \nSign convention: Positive when the electron population has nonzero temperature\
    \ and density; as a scalar thermodynamic pressure, this quantity does not change\
    \ sign under reversal of magnetic field direction or plasma current direction."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
- name: electron_temperature_at_pedestal_top
  kind: scalar
  status: draft
  description: Electron temperature at the pedestal top is the fitted pedestal-height
    value at the radial location where the steep H-mode edge electron-temperature
    gradient joins the flatter core region. It is an electron kinetic temperature
    expressed in eV.
  documentation: 'Electron temperature at the pedestal top is the kinetic temperature
    of the electron population evaluated at the top, or height, of the H-mode pedestal
    transport barrier. The pedestal top is the fitted transition location where the
    steep edge gradient relaxes toward the core region, not a value at the physical
    plasma boundary or at a particular outboard point.


    Using the normalized poloidal flux coordinate $\psi_N$, the pedestal-top temperature
    is defined as the fitted electron-temperature value at the fitted pedestal-top
    location:


    $$

    T_{e,\mathrm{ped}} = T_e(\psi_{N,\mathrm{ped}})

    $$


    where $T_e(\psi_N)$ is the electron temperature expressed in eV and $\psi_{N,\mathrm{ped}}$
    is the fitted pedestal-top coordinate. If another explicitly defined radial flux
    coordinate is used, such as normalized toroidal flux radius $\rho_\mathrm{tor,norm}$,
    the same quantity is the electron-temperature value evaluated at the corresponding
    fitted pedestal-top coordinate.


    In practice, $T_{e,\mathrm{ped}}$ is obtained by fitting edge electron-temperature
    measurements, commonly from Thomson scattering and sometimes constrained by electron
    cyclotron emission or other kinetic diagnostics, with a pedestal model such as
    a modified hyperbolic-tangent shape. The fit returns both the pedestal-top location
    and the pedestal-height value. When forming an SI electron pressure from this
    quantity, the eV unit must be converted: $p_{e,\mathrm{ped}} = e\,n_{e,\mathrm{ped}}\,T_{e,\mathrm{ped}}$
    for density in m^-3, where $e$ is the elementary charge; without the factor $e$,
    the product has units of eV m^-3 rather than pascal.


    Typical pedestal-top electron temperatures range from 100-500 eV in small or low-field
    H-mode plasmas, 0.5-2 keV in many medium-sized tokamaks, and 2-8 keV in high-performance
    or large-device pedestals. The value is a key pedestal-height parameter for confinement
    scaling, edge stability, and pressure-gradient characterization.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top
  - name:electron_temperature_at_plasma_boundary
- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top
  kind: scalar
  status: draft
  description: Derivative of electron temperature with respect to the normalized poloidal
    flux coordinate, evaluated at the H-mode pedestal top where the steep edge temperature
    gradient joins the flatter core region.
  documentation: 'The pedestal-top electron-temperature flux-coordinate derivative
    is the local slope of electron temperature with respect to the normalized poloidal
    flux coordinate $\psi_\mathrm{N}$ at the pedestal top. Here $\psi_\mathrm{N}$
    is dimensionless and increases from 0 at the magnetic axis to 1 at the last-closed
    flux surface, and the pedestal top is where the steep H-mode edge temperature
    gradient joins the flatter core region.


    Let $D_{T_e,\mathrm{top}}$ denote this derivative:


    $$

    D_{T_e,\mathrm{top}} = \left. \frac{\partial T_e}{\partial \psi_\mathrm{N}} \right|_{\mathrm{ped,top}}

    $$


    where $T_e$ is electron temperature in eV, $\psi_\mathrm{N}$ is the dimensionless
    normalized poloidal flux coordinate, and the subscript denotes evaluation at the
    pedestal top. Because $\psi_\mathrm{N}$ is dimensionless, $D_{T_e,\mathrm{top}}$
    has units of eV.


    In practice, this quantity is obtained by mapping electron-temperature measurements
    onto $\psi_\mathrm{N}$ using an equilibrium reconstruction, fitting or smoothing
    the edge temperature variation, and evaluating the derivative at the fitted pedestal-top
    location. It is distinct from the [maximum pedestal slope](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top),
    which refers to the steepest-gradient location within the pedestal.


    Typical H-mode pedestal-top values are often negative, about $-10^4$ to $-10^2$
    eV, because electron temperature usually decreases outward as $\psi_\mathrm{N}$
    increases. Weak or broad pedestals may give values close to 0 eV, while very narrow,
    hot pedestals can reach order $-10^5$ eV.


    Sign convention: Positive when $T_e$ increases with increasing normalized poloidal
    flux coordinate $\psi_\mathrm{N}$.'
  unit: eV
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: electron_temperature_at_pedestal_top
    operator: derivative_with_respect_to_normalized_poloidal_flux_coordinate
    operator_kind: unary_prefix
  sources:
  - id: dd:summary/pedestal_fits/linear/t_e/d_dpsi_norm/value
    dd_path: summary/pedestal_fits/linear/t_e/d_dpsi_norm/value
    status: composed
  - id: dd:summary/pedestal_fits/linear/t_e/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/linear/t_e/d_dpsi_norm_max/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/t_e/d_dpsi_norm/value
    dd_path: summary/pedestal_fits/mtanh/t_e/d_dpsi_norm/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/t_e/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/mtanh/t_e/d_dpsi_norm_max/value
    status: attached
- name: electron_temperature_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron thermal temperature evaluated locally at the plasma boundary,
    normally the separatrix where closed magnetic flux surfaces meet the open-field-line
    scrape-off layer. It is a local confined-edge value, not a flux-surface average.
  documentation: 'Electron temperature at the plasma boundary is the scalar electron
    thermal temperature evaluated on the last closed magnetic flux surface, or separatrix
    in a diverted plasma. It denotes a local separatrix value on the confined-plasma
    side; it is not the same as a [flux_surface_averaged_electron_temperature](name:flux_surface_averaged_electron_temperature)
    unless an explicit flux-surface average has been applied.


    For a scalar-temperature description of an isotropic electron distribution, the
    temperature is related to the mean random kinetic energy per electron at the separatrix
    by:


    $$

    \left\langle E_{e,\mathrm{rand}}\right\rangle_{\mathrm{sep}} = \frac{3}{2}\,e\,T_{e,\mathrm{sep}}

    $$


    where $\left\langle E_{e,\mathrm{rand}}\right\rangle_{\mathrm{sep}}$ is in joules,
    $e$ is the elementary charge, and $T_{e,\mathrm{sep}}$ is this temperature in
    eV. The related boundary electron pressure is $p_{e,\mathrm{sep}} = n_{e,\mathrm{sep}}
    e T_{e,\mathrm{sep}}$, where $n_{e,\mathrm{sep}}$ is the [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)
    in m^-3 and $p_{e,\mathrm{sep}}$ is in pascals.


    The boundary location is identified from the magnetic equilibrium as the separatrix
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. In practice, the value is
    commonly obtained by evaluating an edge electron-temperature fit at the separatrix,
    often constrained by spatially resolved Thomson scattering and, in colder boundary
    plasmas, by probe or spectroscopic measurements. It characterizes the upstream
    edge thermal condition adjacent to the temperature_over_scrape_off_layer, and
    it is generally lower than the [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)
    while being physically distinct from the [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target).


    Representative tokamak separatrix electron temperatures are of order 10-300 eV.
    L-mode plasmas are often around 10-100 eV, while H-mode plasmas with strong edge
    pedestals commonly reach tens to a few hundred eV, depending on plasma current,
    heating power, density, and divertor conditions.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:electron_density_at_plasma_boundary
  - name:electron_temperature_at_pedestal_top
  - name:electron_temperature_at_divertor_target
- name: energy_diffusion_coefficient
  kind: vector
  status: draft
  description: Fick's-law coefficient relating the diffusive thermal energy flux of
    a plasma constituent to its local temperature gradient, serving as the species-agnostic
    parent abstraction over electron, ion, and neutral population specializations.
  documentation: "The energy diffusion coefficient characterizes gradient-driven thermal\
    \ energy transport for any plasma constituent \u2014 electrons, ions, or neutrals\
    \ \u2014 by specifying the proportionality between the diffusive heat flux and\
    \ the local temperature gradient in the Fick's-law sense. It is the thermal-energy\
    \ channel of the general diffusion_coefficient, which governs particle, momentum,\
    \ and energy transport alike, and it is distinct from convective or $E \\times\
    \ B$ contributions to the total heat flux.\n\nThe defining relation for the diffusive\
    \ energy flux $\\mathbf{Q}_\\mathrm{diff}$ of a given constituent is:\n\n$$\n\\\
    mathbf{Q}_\\mathrm{diff} = -D_E \\, \\nabla T\n$$\n\nwhere $D_E$ is the energy\
    \ diffusion coefficient and $\\nabla T$ is the temperature gradient of that constituent.\
    \ In a magnetized plasma $D_E$ is strongly anisotropic; radial cross-field values\
    \ govern energy confinement while values along field lines are orders of magnitude\
    \ larger.\n\nSpecies-resolved children include [electron_energy_diffusion_coefficient](name:electron_energy_diffusion_coefficient)\
    \ for the electron population and [ion_energy_diffusion_coefficient](name:ion_energy_diffusion_coefficient)\
    \ for the total ion population aggregated over all charge states; neutral-particle\
    \ transport is handled by analogous neutral specializations. The effective diffusivity\
    \ that combines diffusive and convective contributions is tracked separately by\
    \ energy_effective_diffusivity."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_energy_diffusion_coefficient
  sources:
  - id: derived:energy_diffusion_coefficient
    status: composed
- name: flux_surface_averaged_argon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of argon ions at the plasma boundary
    (separatrix), summed over all ionization stages from Ar+ through fully stripped
    Ar18+.
  documentation: 'The flux-surface-averaged argon density at the plasma boundary is
    the argon ion number density, summed over all ionization states from Ar+ through
    fully stripped Ar18+, averaged over the last closed flux surface (separatrix)
    that divides magnetically confined plasma from the open-field-line scrape-off
    layer.


    The flux-surface average is defined as:


    $$

    \langle n_{\mathrm{Ar}} \rangle = \frac{\oint n_{\mathrm{Ar}} \, dl / B_p}{\oint
    dl / B_p}

    $$


    where $n_{\mathrm{Ar}}$ is the local argon number density summed over all charge
    states, $B_p$ is the poloidal magnetic-field magnitude, and the integrals are
    taken along the separatrix contour at constant poloidal magnetic flux $\psi$.


    This boundary-averaged quantity is inferred from visible and vacuum ultraviolet
    spectroscopy of argon emission lines combined with collisional-radiative ionization
    balance modeling to reconstruct the full charge-state distribution. It serves
    as a boundary condition for impurity transport calculations in the confined plasma
    and is the flux-surface-averaged counterpart of [argon_density_at_plasma_boundary](name:argon_density_at_plasma_boundary),
    which retains the full poloidal variation along the separatrix.


    Related boundary-averaged impurity densities following the same averaging convention
    include [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary)
    and [flux_surface_averaged_nitrogen_density_at_plasma_boundary](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary).


    Sign convention: Positive when argon ions are present at the separatrix, which
    holds for all plasma states with non-zero argon seeding.'
