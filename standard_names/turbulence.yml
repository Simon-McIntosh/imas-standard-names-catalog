      kind: llm
- name: normalized_perturbed_vector_potential
  kind: vector
  status: active
  description: Vector of the dimensionless perturbed electromagnetic vector potential
    in gyrokinetic turbulence, normalized by a reference electromagnetic scale, whose
    parallel projection drives magnetic-flutter transport across flux surfaces.
  documentation: "The normalized perturbed vector potential is the fluctuating electromagnetic\
    \ vector potential $\\delta\\mathbf{A}$ in gyrokinetic plasma turbulence, rendered\
    \ dimensionless by dividing by a reference scale $B_\\text{ref} \\rho_\\text{ref}$,\
    \ where $B_\\text{ref}$ is a reference magnetic-field strength and $\\rho_\\text{ref}$\
    \ is a reference ion gyroradius. In tokamak geometry the dominant electromagnetic\
    \ degree of freedom is the component aligned with the equilibrium field $\\hat{b}$,\
    \ which enters the gyrocenter equations of motion through the parallel canonical\
    \ momentum $p_\\parallel - q_s \\delta A_\\parallel / c$, where $q_s$ is the species\
    \ charge and $c$ is the speed of light (Gaussian units).\n\nThe normalized parallel\
    \ projection $\\tilde{A}_\\parallel$ is determined self-consistently by the gyrokinetic\
    \ parallel Amp\xE8re equation:\n\n$$\n-\\nabla_\\perp^2 \\tilde{A}_\\parallel\
    \ = \\frac{\\beta_\\text{ref}}{2} \\sum_s q_s \\int v_\\parallel \\tilde{f}_s\
    \ \\, d^3v\n$$\n\nwhere $\\beta_\\text{ref}$ is the reference plasma beta, $v_\\\
    parallel$ is the particle velocity component parallel to $\\hat{b}$, and $\\tilde{f}_s$\
    \ is the normalized perturbed distribution function.\n\nThe child [parallel_normalized_perturbed_vector_potential](name:parallel_normalized_perturbed_vector_potential)\
    \ provides the scalar parallel projection and directly governs the magnetic-flutter\
    \ energy transport quantified by normalized_energy_flux_due_to_perturbed_parallel_vector_potential\
    \ and the momentum transport described by momentum_flux_due_to_perturbed_parallel_vector_potential.\
    \ This normalized vector is the dimensionless counterpart of the dimensional [perturbed_vector_potential](name:perturbed_vector_potential).\n\
    \nSign convention: Positive when $\\delta A_\\parallel$ is aligned with the equilibrium\
    \ magnetic field direction $\\hat{b}$, i.e., in the direction of increasing arc\
    \ length along the field line."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential
- name: normalized_radial_gyrocenter_energy_flux_at_flux_surface_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: active
  description: "Gyro-Bohm-normalized radial gyrocenter energy flux at a flux surface,\
    \ with radial meaning the R component in the right-handed cylindrical (R, \u03C6\
    , Z) frame, due to perturbed parallel vector-potential fluctuations."
  documentation: 'Gyro-Bohm-normalized radial gyrocenter energy flux at a flux surface
    due to the perturbed parallel vector potential is the dimensionless contribution
    to gyrocenter energy transport from the magnetic-flutter velocity generated by
    $\delta A_\parallel$. The radial component is the $R$ component in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height; the flux surface is a magnetic surface labeled
    by the flux coordinate $\psi$. It isolates this electromagnetic channel from electrostatic
    transport and from the contribution associated with the perturbed parallel magnetic
    field.


    For a spectral representation, the aggregate species-summed contribution is defined
    by the flux-surface and time average of the energy-weighted gyrocenter perturbation
    contracted with the $\delta A_\parallel$ radial-flutter velocity:


    $$

    Q_{A_\parallel}^{\mathrm{norm}} =

    \frac{1}{Q_\mathrm{gB}}

    \left\langle

    \sum_s \sum_{\mathbf{k}_\perp}

    \operatorname{Re}\!\left[

    \int d^3v\, \frac{m_s v^2}{2}\,

    \delta f_{s,\mathbf{k}_\perp}^{*}\,

    v_{R,s,\mathbf{k}_\perp}^{(A_\parallel)}

    \right]

    \right\rangle_{\psi,t}

    $$


    where $Q_{A_\parallel}^{\mathrm{norm}}$ is this normalized flux, $Q_\mathrm{gB}=n_\mathrm{ref}T_\mathrm{ref}v_{\mathrm{th},\mathrm{ref}}(\rho_\mathrm{ref}/a_\mathrm{ref})^2$
    is the positive gyro-Bohm reference energy flux, $n_\mathrm{ref}$ is the reference
    particle density, $T_\mathrm{ref}$ is the reference thermal energy per particle,
    $v_{\mathrm{th},\mathrm{ref}}$ is the reference thermal speed, $\rho_\mathrm{ref}$
    is the reference gyroradius, and $a_\mathrm{ref}$ is the reference minor radius.
    The index $s$ labels kinetic species, $\mathbf{k}_\perp$ labels perpendicular-to-the-magnetic-field
    wave-number components, $\delta f_{s,\mathbf{k}_\perp}$ is the corresponding perturbed
    gyrocenter distribution, $v_{R,s,\mathbf{k}_\perp}^{(A_\parallel)}$ is the $R$
    component of the magnetic-flutter velocity associated with $\delta A_\parallel$,
    $\operatorname{Re}$ selects the in-phase flux-carrying part of the bilinear product,
    and $\langle\cdot\rangle_{\psi,t}$ denotes averaging on the magnetic flux surface
    labeled by $\psi$ and over the turbulence time interval.


    The wave-number sum denotes the aggregate flux at the flux surface rather than
    a mode-resolved contribution. The quantity includes only the $\delta A_\parallel$
    part of the radial magnetic-flutter transport channel, excluding electrostatic
    $E\times B$ energy flux, magnetic-compression transport from $\delta B_\parallel$,
    and field-energy terms not carried by gyrocenter kinetic energy. If the gyrocenter
    variables are expressed in a rotating plasma reference frame, both factors in
    the bilinear product are interpreted in that same reference frame.


    Sign convention: Positive when the net gyrocenter energy flux component is in
    the $+\hat{R}$ direction, away from the machine symmetry axis, in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  sources:
  - dd_path: gyrokinetics_local/non_linear/fluxes_1d_rotating_frame/energy_a_field_parallel
