- name: total_plasma_current
  kind: scalar
  status: draft
  description: The net toroidal electric current flowing through the plasma column,
    measured for use as a constraint in magnetic equilibrium reconstruction.
  documentation: "The total plasma current $I_p$ is the net toroidal current carried\
    \ by the confined plasma, typically measured by a Rogowski coil encircling the\
    \ vessel. It is a primary global parameter that determines the poloidal magnetic\
    \ field through Amp\xE8re's law and directly influences the safety factor profile\
    \ and MHD stability. Typical values range from 0.5\u20133.0 MA in present-day\
    \ tokamaks to 15 MA for ITER. The measured value of $I_p$ enters the least-squares\
    \ cost functional in equilibrium reconstruction codes such as EFIT or LIUQE, where\
    \ it constrains the poloidal flux solution. The reconstructed quantity is [plasma_current](name:plasma_current),\
    \ while the toroidal component is explicitly resolved as [toroidal_total_plasma_current](name:toroidal_total_plasma_current).\n\
    \nSign convention: Positive when the net toroidal current flows in the direction\
    \ of increasing toroidal angle (counter-clockwise viewed from above)."
  unit: A
  physics_domain: equilibrium
  links:
