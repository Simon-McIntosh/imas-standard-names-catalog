- name: parallel_ion_current_density
  kind: scalar
  status: draft
  description: Component of the ion current density vector parallel to the local magnetic
    field. This quantity is the projection of the ion current density onto the magnetic
    field direction.
  documentation: 'The parallel ion current density is the component of the ion current
    density vector aligned with the local magnetic field. For a magnetized plasma,
    $j_{\parallel,i}$ is obtained by projecting the total ion current density $\mathbf{j}_i$
    onto the unit vector $\hat{\mathbf{b}}$ along the magnetic field: $j_{\parallel,i}
    = \mathbf{j}_i \cdot \hat{\mathbf{b}}$. In the scrape-off layer, this quantity
    can be measured by a Langmuir probe in the ion-saturation regime, where $j_{\parallel,i}$
    is approximated by $n_i e c_s \sin\theta$, with $\theta$ the angle between the
    probe surface normal and the magnetic field.


    Typical values in the scrape-off layer range from $10^3$ to $10^5$ A/m$^2$. The
    sign of $j_{\parallel,i}$ indicates the direction of net ion flow along the magnetic
    field.


    Sign convention: Positive when the ion current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$ in
    the IMAS cylindrical $(R, \phi, Z)$ frame).'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
