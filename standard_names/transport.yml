- name: toroidal_component_of_co_passing_fast_ion_torque_density_due_to_coulomb_collisions_with_ion_state
  kind: scalar
  status: draft
  description: Toroidal component of the Coulomb collisional torque density transferred
    to co-passing fast ions from a specific ion charge state. Defined as the toroidal
    angular momentum source per unit volume arising from Coulomb collisions between
    the co-passing fast-ion distribution and the target ion population in a given
    charge state. Positive values indicate a net gain of toroidal angular momentum
    by the co-passing fast ions.
  documentation: 'This quantity gives the local volumetric rate at which toroidal
    angular momentum is transferred to the co-passing fast-ion population through
    Coulomb collisions with ions in a specific charge state. It is defined as the
    velocity-space moment


    $$\tau_\phi^{\rm cp} = \int m_f \, R \, v_\phi \, C[f_{\rm cp},\, f_{\rm ion,state}]
    \, d^3v,$$


    where $m_f$ is the fast-ion mass, $R$ is the major radius (the lever arm converting
    linear toroidal momentum to angular momentum in the right-handed cylindrical $(R,
    \phi, Z)$ frame), $v_\phi = R\,\dot{\phi}$ is the toroidal velocity component,
    and $C[f_{\rm cp}, f_{\rm ion,state}]$ is the Coulomb collision operator acting
    on the co-passing fast-ion distribution function $f_{\rm cp}$ due to the target
    ion charge state. The factor of $R$ ensures that $\tau_\phi^{\rm cp}$ has the
    correct units of torque density (N m$^{-2}$), representing toroidal angular momentum
    deposited per unit volume per unit time.


    The toroidal direction $\hat{\phi}$ points in the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ system, where $R$
    is the major radius from the machine symmetry axis and $Z$ is the vertical height.


    Sign convention: Positive when the net toroidal angular momentum transferred to
    the co-passing fast-ion population points in the direction of increasing toroidal
    angle $\phi$ (counter-clockwise when viewed from above, in the $+\hat{Z}$ direction).


    This quantity refers to a single ion charge state; summing over all charge states
    of a given ion species recovers the species-level torque density. Further summation
    over all ion species and inclusion of all fast-ion pitch classes (co-passing,
    counter-passing, trapped) yields the total Coulomb collisional torque density
    on the fast-ion population.


    In transport modeling, the local torque density $\tau_\phi^{\rm cp}(R, Z)$ may
    be flux-surface averaged to produce a radial profile of the toroidal angular momentum
    source:


    $$\langle \tau_\phi^{\rm cp} \rangle_\psi = \frac{1}{V''} \oint \tau_\phi^{\rm
    cp} \, \frac{dS}{|\nabla\psi|},$$


    where $V'' = dV/d\psi$ and the integral is taken over the flux surface labeled
    by the poloidal flux $\psi$. This radial torque-density profile enters the toroidal
    angular momentum transport equation as a volumetric source term.


    Typical magnitudes in present-day tokamak NBI scenarios range from $10^{-2}$ to
    $10^{2}$ N m$^{-2}$, depending on fast-ion energy, target ion density, and charge
    state.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
  - name:co_passing_fast_ion_torque_density_due_to_coulomb_collisions_with_ion_state
  - name:toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons
