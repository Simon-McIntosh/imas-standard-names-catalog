- name: flux_surface_averaged_beryllium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of beryllium impurity ions at
    the plasma boundary (separatrix), summed over all charge states of beryllium ions
    from Be+ through Be4+.
  documentation: 'Flux-surface-averaged number density of beryllium impurity ions
    at the plasma boundary is the mean beryllium ion density on the separatrix, after
    averaging local values over the boundary flux surface. The species-level density
    is summed over all charge states of beryllium ions, from $\mathrm{Be}^{+}$ through
    $\mathrm{Be}^{4+}$; neutral beryllium atoms are not included.


    The boundary flux-surface average is defined as a surface integral weighted by
    the inverse gradient of the flux-surface label:


    $$

    \left\langle n_{\mathrm{Be}}\right\rangle_{\mathrm{b}} =

    \frac{\int_{S_{\mathrm{b}}} n_{\mathrm{Be}}(\mathbf{x})\, |\nabla \psi|^{-1}\,
    dS}

    {\int_{S_{\mathrm{b}}} |\nabla \psi|^{-1}\, dS}

    $$


    where $\left\langle n_{\mathrm{Be}}\right\rangle_{\mathrm{b}}$ is this boundary
    flux-surface average, $S_{\mathrm{b}}$ is the boundary flux surface, $\psi$ is
    a monotonic flux-surface label, $dS$ is the surface-area element, and $n_{\mathrm{Be}}=\sum_{q=1}^{4}
    n_{\mathrm{Be}^{q+}}$ is the local charge-state-summed beryllium ion density.


    In practice, local beryllium ion densities at the separatrix are inferred from
    edge spectroscopy, atomic-physics models, and impurity transport or equilibrium
    calculations. Charge-state-resolved local densities are summed before averaging,
    and the surface integral accounts for poloidal variation without assuming the
    local value is uniform on the separatrix. This quantity is the boundary-locus
    counterpart of [flux-surface-averaged beryllium density] and the averaged counterpart
    of [beryllium density at the plasma boundary](name:beryllium_density_at_plasma_boundary);
    analogous boundary averages include boron, [carbon](name:flux_surface_averaged_carbon_density_at_plasma_boundary),
    [neon](name:flux_surface_averaged_neon_density_at_plasma_boundary), and [deuterium](name:flux_surface_averaged_deuterium_density_at_plasma_boundary).


    Typical values in beryllium-facing tokamak edge plasmas are 10^15-10^18 m^-3;
    values may be below 10^15 m^-3 when beryllium is only a trace contaminant and
    can approach 10^19 m^-3 during strong plasma-facing-wall sources or transient
    edge events.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:beryllium_density_at_plasma_boundary
  - name:flux_surface_averaged_carbon_density_at_plasma_boundary
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
