- name: width_of_neutron_detector
  kind: scalar
  status: active
  description: Full width of a rectangular neutron-detector aperture along its detector-local
    X1 direction, defining the transverse collimation boundary.
  documentation: 'The width is the non-negative distance between the two opposing
    boundaries of a rectangular neutron-detector aperture along the detector-local
    X1 direction. It specifies one transverse opening dimension and is distinct from
    the aperture''s second-direction [height](name:height_of_neutron_detector).


    $$

    w_1 = x_{1,\max} - x_{1,\min}

    $$


    where $w_1$ is the aperture width, and $x_{1,\max}$ and $x_{1,\min}$ are the maximum
    and minimum boundary coordinates along X1 in the detector-local Cartesian $(X_1,
    X_2)$ frame with basis $(\hat{X}_1, \hat{X}_2)$. The quantity describes the geometric
    opening only; it excludes detector efficiency, active-area weighting, and any
    projection onto the magnetic-field direction.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:height_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/geometry/x1_width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-geometry-x1_width
    dd_documentation:
      leaf: Full width of the aperture in the X1 direction, used only if geometry_type
        = 3
      parent_path: neutron_diagnostic/detector/geometry
      parent: Detector geometry
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Full width of the neutron detector aperture in the X1 direction.
        This geometric parameter applies only when the aperture geometry type is rectangular
        (geometry_type = 3).
      kind: llm
- name: width_of_wave_beam
  kind: scalar
  status: active
  description: Transverse semi-axis of the elliptical cross-section of a propagating
    electromagnetic wave beam, measured from the central ray to the beam-spot boundary.
  documentation: 'The width of a wave beam is a transverse semi-axis of its elliptical
    cross-section, measured from the central ray to the corresponding peripheral boundary
    ray.


    For an elliptical beam cross-section, the boundary is defined by


    $$

    \frac{x^2}{w_1^2}+\frac{y^2}{w_2^2}=1

    $$


    where $x$ and $y$ are orthogonal transverse distances from the central ray, and
    $w_1$ and $w_2$ are the corresponding non-negative semi-axis widths. This quantity
    denotes one of these semi-axis widths, not the full diameter, a full-width-at-half-maximum
    measure, or the total cross-sectional area. The orientation of the elliptical
    axes is described separately by the [tilt angle of the beam-tracing beam](name:tilt_angle_of_beam_tracing_beam).'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:tilt_angle_of_beam_tracing_beam
  sources:
  - dd_path: ec_launchers/beam/spot/size
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-beam-spot-size
    dd_documentation:
      leaf: Size of the spot ellipse
