- name: winding_turns_of_pickup_coil
  kind: scalar
  status: draft
  description: Total number of winding turns in a magnetic pickup coil, with sign
    encoding the winding direction relative to the coil's reference orientation.
  documentation: "The winding turn count $N$ of a pickup coil enters directly into\
    \ the inductive voltage response: $V = N A \\, dB/dt$, where $A$ is the effective\
    \ cross-sectional area per turn (see [cross-sectional area of the probe](name:cross_sectional_area_of_magnetic_field_probe))\
    \ and $dB/dt$ is the time rate of change of the magnetic field component normal\
    \ to the sensing plane. A larger $|N|$ amplifies the signal proportionally, making\
    \ this parameter essential for converting raw voltage signals into calibrated\
    \ field or flux measurements.\n\nPickup coils used in tokamak magnetics diagnostics\
    \ range from single-turn Mirnov coils to multi-turn wound coils with $|N|$ of\
    \ order 10\u20131000, depending on the field amplitude and frequency regime being\
    \ diagnosed. The value is determined during coil fabrication and verified by impedance\
    \ or mutual-inductance calibration measurements. For distributed winding configurations\
    \ such as Rogowski coils, the analogous quantity is the [linear winding density](name:winding_turns_per_unit_length_of_rogowski_coil),\
    \ which gives turns per unit length rather than a total count.\n\nSign convention:\
    \ Positive when the winding is oriented such that a magnetic field increasing\
    \ in the direction of the coil normal produces a positive induced voltage according\
    \ to the right-hand rule."
  unit: '1'
  physics_domain: magnetic_field_diagnostics
  links:
  - name:cross_sectional_area_of_magnetic_field_probe
  - name:winding_turns_per_unit_length_of_rogowski_coil
  constraints: []
  sources:
  - id: dd:magnetics/bpol_probe/turns
    dd_path: magnetics/bpol_probe/turns
    status: composed
- name: winding_turns_per_unit_length_of_rogowski_coil
  kind: scalar
  status: draft
  description: Linear winding density of a Rogowski coil, giving the number of winding
    turns per unit length along the coil axis for a single layer.
  documentation: "The winding turns per unit length, $n = dN/dl$ where $N$ is the\
    \ cumulative turn count and $l$ is the arc length along the coil, is the fundamental\
    \ geometric calibration parameter of a Rogowski coil current sensor. A Rogowski\
    \ coil measures the time-derivative of enclosed current via Faraday's law: the\
    \ induced EMF is $\\mathcal{E} = -\\mu_0 A n \\, dI/dt$, where $A$ is the cross-sectional\
    \ area of the winding and $I$ is the enclosed current; integrating $\\mathcal{E}$\
    \ and dividing by $\\mu_0 A n$ recovers $I(t)$. For coils wound with multiple\
    \ layers, this quantity counts turns in a single layer only \u2014 total effective\
    \ turns per unit length must account for the layer count separately. Typical values\
    \ range from a few hundred to several thousand turns per meter depending on coil\
    \ geometry and the required sensitivity and bandwidth. Accurate knowledge of $n$\
    \ is essential for absolute current calibration; spatial non-uniformity in $n$\
    \ along the coil introduces systematic errors in the integrated signal. The Rogowski\
    \ coil measurement chain is closely related to the inductive coupling framework\
    \ described by [mutual inductance of active coupling](name:mutual_inductance_of_active_coupling)\
    \ and [mutual inductance of flux loop active coupling](name:mutual_inductance_of_flux_loop_active_coupling)."
  unit: m^-1
  physics_domain: magnetic_field_diagnostics
  links:
  - name:mutual_inductance_of_active_coupling
  - name:mutual_inductance_of_flux_loop_active_coupling
  constraints: []
  sources:
  - id: dd:magnetics/rogowski_coil/turns_per_metre
    dd_path: magnetics/rogowski_coil/turns_per_metre
    status: composed
