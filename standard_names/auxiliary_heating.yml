  - name:outer_radius_of_antenna_strap
- name: inner_radius_of_antenna_strap
  kind: scalar
  status: active
  description: Inner radius of an antenna strap is the perpendicular distance from
    the strap conductor axis to the inner cylindrical boundary of its annular cross-section.
  documentation: 'Inner radius of an antenna strap is the perpendicular distance from
    the strap conductor axis to the inner cylindrical boundary of its annular cross-section.
    It identifies the inner boundary of the conductor material and is the smaller
    of the two annular boundary radii.


    Use [radius of antenna strap](name:radius_of_antenna_strap) for the boundary-radius
    concept without selecting a surface, and [outer radius of antenna strap](name:outer_radius_of_antenna_strap)
    for the larger boundary radius. If $r_\mathrm{in}$ and $r_\mathrm{out}$ denote
    the inner and outer radii, respectively, then $0 \le r_\mathrm{in} \le r_\mathrm{out}$.
    This quantity is distinct from the [height of antenna strap](name:height_of_antenna_strap),
    [toroidal width of antenna strap](name:toroidal_width_of_antenna_strap), and [thickness
    of antenna strap](name:thickness_of_antenna_strap).'
