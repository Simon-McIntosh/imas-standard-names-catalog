      kind: llm
- name: lower_wavelength_of_filter
  kind: scalar
  status: active
  description: Lower wavelength of a filter is the spectral coordinate, expressed
    as vacuum wavelength, that identifies the short-wavelength boundary of a diagnostic
    filter's transmitted spectral band.
  documentation: 'Lower wavelength of a filter is the vacuum-wavelength spectral coordinate
    that identifies the short-wavelength boundary of a diagnostic filter''s transmitted
    spectral band. It marks the high-photon-energy edge of the interval selected by
    the filter transmission response.


    For a lower-bound characteristic associated with temporal frequency $\nu_\mathrm{lower}$,
    the vacuum wavelength is defined by:


    $$

    \lambda_\mathrm{lower} = \frac{c}{\nu_\mathrm{lower}}

    $$


    where $\lambda_\mathrm{lower}$ is the lower filter-boundary vacuum wavelength,
    $c$ is the speed of light in vacuum, and $\nu_\mathrm{lower}$ is the temporal
    frequency corresponding to that boundary.


    This quantity applies to the transmitted spectral band of the filter and is a
    single lower-edge value, not a wavelength average, an integrated spectral quantity,
    or the complete transmission function. It is distinct from a spectral-line rest
    wavelength and from a wavelength defined inside a material medium.


    As the lower-bound member of [wavelength of a filter](name:wavelength_of_filter),
    it identifies one characteristic point of the filter response. Together with the
    [upper wavelength of a filter](name:upper_wavelength_of_filter), it defines the
    passband span represented by the [width of a filter](name:width_of_filter).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_filter
  - name:upper_wavelength_of_filter
  arguments:
  - name: wavelength_of_filter
    operator: lower
    operator_kind: qualifier
