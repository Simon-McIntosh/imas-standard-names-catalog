- name: surface_roughness_of_optical_element
  kind: scalar
  status: active
  description: Dimensionless parameter describing how microscopic texture on an optical
    element redistributes reflected radiation between specular and diffuse scattering.
  documentation: 'Surface roughness of an optical element is a phenomenological parameter
    describing the scattering behavior of its material surface. It quantifies the
    partition of reflected radiation between an ideal specular component and an ideal
    diffuse component.


    The parameter is bounded by $0 \leq r_s \leq 1$, where $r_s$ is the surface roughness
    parameter: $r_s=0$ denotes perfectly specular reflection and $r_s=1$ denotes perfectly
    diffuse reflection. Its value may depend on wavelength when the surface scattering
    behavior is wavelength-dependent.


    This quantity is the surface-specific component of the broader [roughness of an
    optical element](name:roughness_of_optical_element) parameter and must not be
    interpreted as a geometric surface height, curvature, or texture amplitude.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:roughness_of_optical_element
  arguments:
  - name: roughness_of_optical_element
    operator: surface
    operator_kind: qualifier
