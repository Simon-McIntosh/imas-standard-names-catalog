- name: radial_derivative_of_flux_surface_area
  kind: scalar
  status: draft
  description: Radial derivative of the poloidal cross-sectional area enclosed by
    a magnetic flux surface with respect to the dimensional toroidal-flux radius.
    The derivative has unit meter.
  documentation: 'The radial derivative of flux-surface area is the rate at which
    the poloidal cross-sectional area enclosed by a closed magnetic flux surface changes
    as the dimensional toroidal-flux radius $\rho_\mathrm{tor}$ is varied. The area
    is measured in a constant-toroidal-angle plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    It is defined as the derivative of the enclosed area $A$ with respect to $\rho_\mathrm{tor}$:


    $$

    \frac{dA}{d\rho_\mathrm{tor}}(\rho_\mathrm{tor}) = \lim_{\Delta \rho_\mathrm{tor}
    \to 0} \frac{A(\rho_\mathrm{tor}+\Delta\rho_\mathrm{tor}) - A(\rho_\mathrm{tor})}{\Delta\rho_\mathrm{tor}}

    $$


    where $A(\rho_\mathrm{tor})$ is the enclosed poloidal cross-sectional area in
    m^2, $\rho_\mathrm{tor}$ is the dimensional toroidal-flux radius in m, and $dA/d\rho_\mathrm{tor}$
    therefore has unit m. The coordinate $\rho_\mathrm{tor}$ is constructed from toroidal
    magnetic flux $\Phi_\mathrm{tor}$ and a chosen reference magnetic field $B_\mathrm{ref}$,
    commonly as $\rho_\mathrm{tor}=\sqrt{|\Phi_\mathrm{tor}|/(\pi |B_\mathrm{ref}|)}$;
    $\Phi_\mathrm{tor}$ has unit Wb and $B_\mathrm{ref}$ has unit T.


    In equilibrium reconstruction, $A$ is obtained by tracing closed flux contours
    in a constant-$\phi$ poloidal plane of the right-handed cylindrical $(R, \phi,
    Z)$ frame and computing the area they enclose. The derivative is then evaluated
    from the smooth relation between $A$ and $\rho_\mathrm{tor}$, often with numerical
    differentiation or fitted flux-surface geometry.


    For nearly circular surfaces this derivative is comparable to the poloidal circumference
    scale, roughly $2\pi r$, and increases with elongation and overall plasma size.
    It approaches 0 m near the magnetic axis; typical mid-radius to edge values are
    about 1-30 m in present medium-to-large tokamaks, below about 1-10 m in compact
    devices, and can exceed 30 m in reactor-scale plasmas.


    Sign convention: Positive when the enclosed poloidal cross-sectional area increases
    as $\rho_\mathrm{tor}$ increases outward from the magnetic axis toward the plasma
    boundary.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  arguments:
  - name: flux_surface_area
    operator: radial_derivative
    operator_kind: unary_prefix
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/darea_drho_tor
    dd_path: equilibrium/time_slice/profiles_1d/darea_drho_tor
    status: composed
- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic field vector onto the outward major-radius
    direction in the right-handed cylindrical (R, phi, Z) frame, forming the radial
    part of the poloidal field in tokamak geometry.
  documentation: "The radial magnetic field $B_R = \\mathbf{B} \\cdot \\hat{R}$ is\
    \ the component of the magnetic induction resolved along $\\hat{R}$, the unit\
    \ vector pointing away from the toroidal symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. In an axisymmetric tokamak equilibrium, $B_R$ is entirely\
    \ a poloidal-field quantity and is generally much smaller in magnitude than the\
    \ dominant toroidal component; it encodes information about flux-surface shape\
    \ and poloidal field structure.\n\nIn axisymmetric equilibrium, $B_R$ is related\
    \ to the poloidal magnetic flux function $\\psi(R, Z)$ by:\n\n$$\nB_R = -\\frac{1}{R}\\\
    frac{\\partial \\psi}{\\partial Z}\n$$\n\nwhere $R$ is the major radius in meters\
    \ and $Z$ is the vertical coordinate in meters. Together with $B_Z = \\frac{1}{R}\\\
    partial\\psi/\\partial R$, this satisfies the solenoidal constraint $\\nabla \\\
    cdot \\mathbf{B} = 0$ in axisymmetric form. The companion [parallel_magnetic_field](name:parallel_magnetic_field)\
    \ gives the field-aligned projection, while [radial_magnetic_vector_potential](name:radial_magnetic_vector_potential)\
    \ provides the corresponding vector-potential component in the same radial direction.\n\
    \n$B_R$ is obtained by differentiating the reconstructed poloidal flux on a computational\
    \ grid, or evaluated directly on generalized geometry description grids for complex\
    \ wall and boundary regions. Magnitudes in the core plasma are typically 0.001\u2013\
    0.1 T, increasing near the X-point and divertor where the poloidal field changes\
    \ direction rapidly.\n\nSign convention: Positive when $B_R$ points in the direction\
    \ of increasing major radius $R$, away from the toroidal symmetry axis."
  unit: T
  physics_domain: equilibrium
  links:
  - name:parallel_magnetic_field
  - name:radial_magnetic_vector_potential
