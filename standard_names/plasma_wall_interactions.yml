- name: mass_of_wall_material
  kind: scalar
  status: active
  description: Mass of a single atom, specified isotope, or isotopic composition that
    constitutes a plasma-facing wall material, referenced to the carbon-12 atomic-mass
    scale.
  documentation: 'Mass of wall material is the rest mass of a single constituent atom,
    specified isotope, or isotopic composition of a plasma-facing material. It is
    a constituent property of the wall material and is independent of the amount of
    material present or the plasma state.


    The carbon-12 atomic-mass scale relates the physical mass to the value of this
    quantity by:


    $$

    m_\mathrm{wall} = M_\mathrm{wall} m_\mathrm{u}, \qquad m_\mathrm{u} = \frac{1}{12}
    m({}^{12}\mathrm{C})

    $$


    where $m_\mathrm{wall}$ is the physical rest mass of the wall-material constituent,
    $M_\mathrm{wall}$ is its numerical value on the carbon-12 scale, $m_\mathrm{u}$
    is the atomic mass constant, and $m({}^{12}\mathrm{C})$ is the mass of a neutral
    carbon-12 atom in its ground state.


    For an element with unspecified isotope composition, the quantity denotes the
    composition-weighted atomic mass for that wall-material constituent; for a specified
    isotope, it denotes that isotope''s atomic mass. It excludes macroscopic wall-component
    mass, molar mass, bulk mass density, areal mass loading, and mass of incident
    plasma species.'
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:atomic_mass_of_wall_material
- name: atomic_mass_of_wall_material
  kind: scalar
  status: active
  description: Atomic mass of a selected element, isotope, or isotopic composition
    constituting a plasma-facing wall material, referenced to the carbon-12 mass scale.
  documentation: 'This quantity is the atomic mass of the selected element, isotope,
    or isotopic composition that constitutes a plasma-facing wall material. It describes
    a constituent or specified composition, not the total mass of a wall or macroscopic
    wall component.


    The atomic-mass scale is defined by


    $$

    m_{\rm atom} = A u, \qquad u = \frac{1}{12}m(^{12}\mathrm{C})

    $$


    where $m_{\rm atom}$ is the atomic mass, $A$ is its numerical value on the scale,
    $u$ is the unified atomic mass unit, and $m(^{12}\mathrm{C})$ is the mass of a
    carbon-12 atom. For an isotopic composition, the value is the abundance-weighted
    mean of the constituent isotope masses.


    This is the atomic-mass specialization of [mass_of_wall_material](name:mass_of_wall_material).
    It is distinct from [ion_mass_number](name:ion_mass_number), which is the integer
    nucleon count and does not include the isotope-specific mass defect.'
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:mass_of_wall_material
  arguments:
  - name: mass_of_wall_material
    operator: atomic
    operator_kind: qualifier
