- name: ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: active
  description: Kinetic energy flux density carried by ions leaving the plasma-facing
    wall through surface emission processes such as physical sputtering and ion backscattering.
  documentation: "The kinetic energy flux density at the plasma-facing wall surface\
    \ carried by ions emitted outward via surface emission \u2014 the family of plasma\u2013\
    wall interaction processes, including physical sputtering, chemical sputtering,\
    \ and ion backscattering, that return ionic species from the wall to the plasma.\
    \ The `kinetic` qualifier restricts this to translational kinetic energy of the\
    \ emitted ion velocity distribution, excluding potential energy stored in electronic\
    \ excitation or residual ionization charge, which is captured separately by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).\n\
    \nThe emitted kinetic energy flux $\\Phi_{\\mathrm{kin,emit}}$ sums over all emitted\
    \ ion species $s$:\n\n$$\n\\Phi_{\\mathrm{kin,emit}} = \\sum_s \\int_{v_n > 0}\
    \ \\tfrac{1}{2} m_s v^2 \\, v_n \\, f_{s,\\mathrm{emit}}(\\mathbf{v}) \\, d^3v\n\
    $$\n\nwhere $m_s$ is the ion mass of species $s$, $v = |\\mathbf{v}|$ is the ion\
    \ speed, $v_n > 0$ is the outward surface-normal velocity component at the wall,\
    \ and $f_{s,\\mathrm{emit}}(\\mathbf{v})$ is the velocity distribution function\
    \ of emitted ions.\n\nIn plasma\u2013surface interaction modeling, this flux is\
    \ evaluated by convolving incident plasma conditions with energy-resolved surface\
    \ emission yields and backscattering coefficients from binary-collision approximation\
    \ databases. It is the mechanism-attributed form of [ion_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission)\
    \ and the emitted counterpart to [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),\
    \ which captures the incident kinetic flux. Charge-state-resolved contributions\
    \ are tracked by ion_state_energy_flux_at_wall, and the electron analog is [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_kinetic_energy_flux_at_wall
  - name:electron_energy_flux_at_wall
  arguments:
  - name: kinetic_energy_flux_at_wall_due_to_surface_emission
    operator: ion
    operator_kind: qualifier
  sources:
  - dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-energy_fluxes-kinetic-ion-emitted-values
    dd_documentation:
