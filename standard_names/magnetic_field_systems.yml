- name: toroidal_angle_of_conductor_element_intermediate_point
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of an intermediate point along a coil conductor\
    \ element in the right-handed cylindrical $(R, \\phi, Z)$ frame, oriented counter-clockwise\
    \ when viewed from above."
  documentation: "The toroidal angle $\\phi$ of an intermediate point locates a sample\
    \ position along the conductor element's path between its start and end points\
    \ in the cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius, $\\\
    phi$ is the azimuthal angle increasing counter-clockwise when viewed from above\
    \ $+\\hat{Z}$, and $Z$ is the vertical height. Intermediate points supplement\
    \ the [start point](name:toroidal_angle_of_conductor_element_start_point), [end\
    \ point](name:toroidal_angle_of_conductor_element_end_point), and [center](name:toroidal_angle_of_conductor_element_center)\
    \ descriptors to capture curvature or non-linearity in conductor routing that\
    \ a simple start\u2013end pair cannot resolve. This coordinate is used in coil\
    \ geometry models for computing mutual inductances, field maps, and current-carrying\
    \ path integrals; it is obtained directly from engineering drawings or CAD descriptions\
    \ of the coil winding pack. Together with the corresponding $R$ and $Z$ coordinates\
    \ of the same intermediate point, it fully specifies the 3-D position of the conductor\
    \ sample in the cylindrical $(R, \\phi, Z)$ frame.\n\nSign convention: Positive\
    \ when $\\phi$ is in the direction of increasing toroidal angle (counter-clockwise\
    \ when viewed from above $+\\hat{Z}$)."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
