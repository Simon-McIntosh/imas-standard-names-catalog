- name: poloidal_ion_diffusivity
  kind: scalar
  status: draft
  description: "Effective poloidal diffusion coefficient for total ion particle transport\
    \ in flux coordinates (\u03C1, \u03B8, \u03C6), relating the down-gradient poloidal\
    \ ion particle flux to the metric-scaled gradient of ion number density."
  documentation: 'Poloidal ion diffusivity is an effective transport coefficient for
    total ion particle diffusion tangent to magnetic flux surfaces. In flux coordinates
    $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$ is the poloidal
    angle, and $\phi$ is the toroidal angle, it relates the poloidal component of
    the total ion particle flux to the local gradient of total ion number density.
    The coefficient represents the aggregate ion population rather than a single ion
    charge state.


    For a diffusive closure of the poloidal ion particle flux, the coefficient $D_{i,\theta}$
    is defined by Fick''s law using the metric-scaled poloidal gradient:


    $$

    \Gamma_{i,\theta}^{\mathrm{diff}} = -D_{i,\theta}\,\frac{1}{h_\theta}\frac{\partial
    n_i}{\partial \theta}

    $$


    where $\Gamma_{i,\theta}^{\mathrm{diff}}$ is the diffusive poloidal total-ion
    particle flux, $n_i$ is total ion number density, and $h_\theta = |\partial \mathbf{x}/\partial\theta|$
    is the poloidal metric scale factor at fixed $\rho$ and $\phi$. The metric-scaled
    density gradient has dimensions of density per meter, so multiplication by $D_{i,\theta}$
    gives a particle flux.


    In practice, $D_{i,\theta}$ is inferred by fitting particle-balance or edge-transport
    equations to measured or reconstructed density evolution, source distributions,
    and ion flux constraints. It can include unresolved turbulent mixing, collisional
    diffusion, charge-exchange effects, and geometry-dependent averaging; convective
    pinches and parallel losses should be represented separately when the model permits,
    otherwise the fitted value is an effective closure coefficient.


    Typical effective values in edge and scrape-off-layer plasmas are 0.01-5 m^2.s^-1,
    with strongly turbulent or transient cases reaching around 10 m^2.s^-1. Values
    near or above 1 m^2.s^-1 are usually larger than purely neoclassical estimates
    and indicate anomalous transport or compensation for unresolved physics.


    Sign convention: Positive when the diffusive poloidal ion particle flux is down
    the metric-scaled gradient of $n_i$ in flux coordinates $(\rho,\theta,\phi)$;
    equivalently, a decrease of $n_i$ with increasing $\theta$ at fixed $\rho$ and
    $\phi$ gives a flux in the $+\theta$ direction.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_state_diffusivity
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_electron_diffusivity
  arguments:
  - name: ion_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_state_energy_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal component of the effective diffusivity governing thermal\
    \ energy transport for a specified ion charge state, directed along increasing\
    \ poloidal angle \u03B8 in flux coordinates (\u03C1, \u03B8, \u03C6). It relates\
    \ the poloidal energy flux density to the metric poloidal gradient of that charge\
    \ state\u2019s thermal energy density."
  documentation: 'Poloidal ion-state energy diffusivity is the scalar transport coefficient
    for diffusive thermal-energy transport of one ion charge state in the poloidal
    direction. The poloidal direction is the unit-vector direction tangent to increasing
    poloidal angle $\theta$ at fixed radial flux label and toroidal angle $\phi$ in
    flux coordinates $(\rho,\theta,\phi)$. The corresponding charge-state-summed ion
    coefficient is [poloidal_ion_energy_diffusivity](name:poloidal_ion_energy_diffusivity).


    For a local Fick-law closure, the diffusive poloidal thermal-energy flux density
    for ion charge state $\alpha$ is


    $$

    q^{E}_{\theta,\alpha} = -D^{E}_{\theta,\alpha}\,\nabla_\theta W_\alpha

    $$


    where $q^{E}_{\theta,\alpha}$ is in $J\,m^{-2}\,s^{-1}$, $D^{E}_{\theta,\alpha}$
    is in $m^2\,s^{-1}$, $W_\alpha$ is the thermal energy density of that ion charge
    state in $J\,m^{-3}$, and $\alpha$ labels the charge state. The metric derivative
    $\nabla_\theta$ has units $m^{-1}$ and means $\hat{\mathbf{e}}_\theta\cdot\nabla$,
    equivalently $h_\theta^{-1}\partial/\partial\theta$, so the poloidal scale factor
    $h_\theta$ converts angular changes in $\theta$ to distance along the flux surface.
    The leading minus sign means that a positive diffusivity gives a down-gradient
    diffusive contribution, from larger toward smaller ion-state thermal energy density.


    This coefficient is usually specified by an edge transport closure or inferred
    from a balance between poloidal energy flux density and charge-state-resolved
    thermal energy density gradients. It is distinct from the advective transport
    represented by [poloidal_ion_state_energy_convection_velocity](name:poloidal_ion_state_energy_convection_velocity),
    which multiplies the energy density rather than its gradient.


    As a physical diffusive coefficient it is normally non-negative. Representative
    effective values in edge plasma modeling are about 0.01-10 m^2 s^-1 in the confined
    edge and can extend to 10-100 m^2 s^-1 in strongly turbulent scrape-off-layer
    conditions; negative fitted values indicate that a simple local down-gradient
    diffusion closure is not representing the local energy balance.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_state_energy_diffusivity
  - name:ion_state_energy_diffusion_coefficient
- name: poloidal_magnetic_flux_at_pedestal
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the H-mode pressure pedestal top location,
    providing a dimensional flux-surface label for the edge pedestal.
  documentation: 'Poloidal magnetic flux at the pedestal is the value of the poloidal
    flux function on the flux surface identified as the H-mode pressure pedestal top.
    This surface is the radial location assigned to the core-side top of the steep
    edge pedestal region; it is distinct from the pedestal center or maximum-gradient
    surface unless a particular pedestal analysis explicitly defines those surfaces
    to coincide.


    In a right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    in meters, $\phi$ is toroidal angle, and $Z$ is vertical height in meters, the
    full poloidal magnetic flux at a point on the pedestal-top surface may be written
    as the horizontal-disk integral of the vertical magnetic field:


    $$

    \psi_{\mathrm{ped}} = \int_0^{R_{\mathrm{ped}}} B_Z(R'', Z_{\mathrm{ped}})\, 2\pi
    R''\, dR''

    $$


    where $(R_{\mathrm{ped}}, Z_{\mathrm{ped}})$ is any point on the pedestal-top
    flux surface, $B_Z$ is the vertical magnetic-field component in tesla, and $\psi_{\mathrm{ped}}$
    is in Wb. The lower integration limit fixes the additive reference to zero flux
    for the zero-radius disk on the toroidal symmetry axis; adding a constant offset
    to the flux function would shift this absolute value but not flux differences
    between surfaces.


    In practice, an equilibrium reconstruction provides $\psi(R,Z)$, while pedestal
    analysis of edge pressure or its components determines the pedestal-top radial
    location. The pedestal flux is obtained by evaluating the equilibrium flux on
    that flux surface, rather than by assuming the surface is the pedestal center
    or the point of maximum pressure gradient.


    Typical absolute values, using a consistent additive reference, are about 0.1-5
    Wb in small and medium tokamaks and 5-50 Wb in large high-current tokamaks. Because
    the pedestal top lies close to the outer confined plasma boundary, $\psi_{\mathrm{ped}}$
    is usually near the boundary poloidal flux, with the pedestal-to-boundary flux
    interval much smaller than the axis-to-boundary flux span.


    Sign convention: Positive when $B_Z$ on the horizontal integration disk points
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_magnetic_flux_at_pedestal
  - name:poloidal_magnetic_flux_at_internal_transport_barrier
- name: poloidal_momentum_flux_limiter_coefficient
  kind: scalar
  status: draft
  description: Dimensionless momentum-flux-density limiter that scales the collisionless
    free-streaming bound for gradient-driven poloidal momentum transport. It caps
    the modeled poloidal momentum-flux density while leaving its direction set by
    the underlying transport closure.
  documentation: 'The poloidal momentum coefficient is a dimensionless flux-limiter
    parameter for gradient-driven momentum transport in the poloidal direction on
    a magnetic surface. It scales the collisionless free-streaming bound used to limit
    the modeled poloidal momentum-flux density, so the coefficient controls the allowed
    magnitude rather than the sign of the flux.


    A common limiter form constrains the poloidal momentum-flux density for species
    or population $s$ by


    $$

    |\Pi_{\theta,s}| \le \alpha_{\theta,s}\,\Pi_{\mathrm{fs},s}, \qquad \Pi_{\mathrm{fs},s}
    \sim m_s n_s v_{\mathrm{th},s}^{2}

    $$


    where $\Pi_{\theta,s}$ is the poloidal momentum-flux density in kg m^-1 s^-2,
    $\alpha_{\theta,s}$ is the poloidal momentum coefficient, $\Pi_{\mathrm{fs},s}$
    is the selected free-streaming momentum-flux-density estimate in kg m^-1 s^-2,
    $m_s$ is particle mass, $n_s$ is number density, and $v_{\mathrm{th},s}$ is thermal
    speed. The index $\theta$ denotes the poloidal direction in a chosen flux-coordinate
    system $(\rho,\theta,\phi)$; factors of order unity in the free-streaming estimate
    are closure-dependent. Because the limiter is applied to $|\Pi_{\theta,s}|$, the
    sign of the limited flux follows the underlying diffusive or reference momentum
    flux.


    The coefficient is specified as a transport-model closure parameter rather than
    measured directly. It is used to prevent a diffusion approximation from producing
    momentum-flux densities larger than a collisionless population could carry across
    the same direction, especially in low-collisionality edge-plasma regimes where
    unbounded gradient-driven diffusion can overestimate transport.


    Typical model choices are non-negative fractions not exceeding order unity. Smaller
    values impose a stronger cap on poloidal momentum transport, while values near
    unity allow momentum-flux densities comparable to the chosen free-streaming estimate.


    Conceptually related limiters include the [parallel momentum coefficient] and
    [toroidal momentum coefficient] for other directional momentum-flux-density limits,
    and energy-flux limiters such as the [total ion energy coefficient].'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_particle_diffusivity
  kind: scalar
  status: draft
  description: "Effective particle diffusion coefficient for transport along the poloidal\
    \ direction in flux coordinates (\u03C1, \u03B8, \u03C6). It relates particle\
    \ flux in the direction of increasing poloidal angle to the metric-scaled gradient\
    \ of particle number density for a generic particle population."
  documentation: 'Poloidal particle diffusivity $D_\mathrm{pol}$ is an effective scalar
    transport coefficient for particle mixing along the poloidal direction in a flux-coordinate
    system $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$ is poloidal
    angle, and $\phi$ is toroidal angle. It applies to a generic particle population
    and represents the net effect of collisional, turbulent, or modeled unresolved
    transport along increasing or decreasing $\theta$.


    The local Fick-law closure for the poloidal particle flux density is


    $$

    \Gamma_\theta = -D_\mathrm{pol}\,\nabla_\theta n

    $$


    where $\Gamma_\theta$ is the particle flux density along increasing poloidal angle
    $\theta$ in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$, $D_\mathrm{pol}$ is in $\mathrm{m}^2\,\mathrm{s}^{-1}$,
    $n$ is the particle number density in $\mathrm{m}^{-3}$, and $\nabla_\theta n$
    is the physical component of $\nabla n$ along increasing $\theta$ at fixed $\rho$
    and $\phi$. For an orthogonal metric this component is $h_\theta^{-1}\partial
    n/\partial\theta$, where $h_\theta$ is the poloidal arc-length scale factor. For
    $D_\mathrm{pol} > 0$, the minus sign gives down-gradient transport: flux in the
    direction of increasing $\theta$ occurs when density decreases with increasing
    $\theta$.


    This coefficient is usually prescribed or inferred in edge particle-balance and
    transport calculations rather than measured directly. It may be adjusted to reproduce
    measured density evolution, particle balance, or poloidal density asymmetries,
    and its interpretation should follow the particle population being modeled; species-resolved
    counterparts are used when electron, ion, or ion-state transport must be distinguished.


    Typical prescribed edge-plasma values are model-dependent and are commonly of
    order 0.01-10 m^2.s^-1 for anomalous particle mixing. Reduced closures or effective
    neutral-particle treatments may use values up to about 100 m^2.s^-1, while values
    near zero represent negligible poloidal diffusive mixing. A passive diffusion
    coefficient is normally non-negative; negative values would represent an anti-diffusive
    closure rather than ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_electron_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_state_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
- name: pressure_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Thermal pressure of a plasma constituent or neutral-gas population
    in the open-field-line scrape-off layer, the region between the last closed flux
    surface and the material plasma-facing components.
  documentation: 'The scrape-off layer (SOL) is the open-field-line region extending
    from the last closed flux surface to the material plasma-facing components, where
    local pressure governs energy and particle exhaust, neutral recycling, ionization
    balance, and the onset of divertor detachment. This parent name generalizes over
    species-resolved SOL pressure quantities: [electron pressure over the scrape-off
    layer](name:electron_pressure_over_scrape_off_layer) represents the electron partial
    pressure and additionally anchors the pressure baseline offset in H-mode pedestal
    profile fits, while [neutral pressure over the scrape-off layer](name:neutral_pressure_over_scrape_off_layer)
    characterizes the neutral gas inventory affecting recycling, pumping balance,
    and detachment control.


    For any thermally equilibrated species $s$, the scalar thermal pressure satisfies:


    $$

    p_s = n_s k_B T_s

    $$


    where $n_s$ is the species number density and $T_s$ is its temperature in energy
    units.


    SOL pressure is inferred from a combination of diagnostics: Langmuir probes provide
    local electron pressure at plasma-facing surfaces from saturation current and
    electron temperature; neutral gas pressure gages directly measure gas pressure
    in the divertor pumping region; Thomson scattering resolves electron density and
    temperature profiles from which electron pressure is derived. The characteristic
    radial scale over which pressure falls from the separatrix outward is described
    by the [decay length over the scrape-off layer](name:decay_length_over_scrape_off_layer).'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_over_scrape_off_layer
  - name:neutral_pressure_over_scrape_off_layer
  - name:decay_length_over_scrape_off_layer
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/offset/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/offset/value
    status: composed
- name: electron_pressure_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Electron pressure associated with the scrape-off-layer baseline of
    an H-mode pedestal fit. It is the offset level outside the last closed flux surface
    against which the pedestal rise is measured.
  documentation: 'Electron pressure over the scrape-off layer is the scalar electron
    pressure assigned to the low-pressure baseline of an H-mode pedestal fit. It is
    the asymptotic value approached outside the last closed flux surface and provides
    the reference level for the pedestal rise toward electron_pressure_at_pedestal
    and electron_pressure_at_pedestal_top. It is the electron contribution to the
    more general [pressure_over_scrape_off_layer](name:pressure_over_scrape_off_layer).


    The baseline is commonly obtained as the constant offset in a modified-tanh representation
    of the electron-pressure variation across the pedestal:


    $$

    p_e(\rho) = p_{\mathrm{SOL}} + \frac{p_{\mathrm{ped}} - p_{\mathrm{SOL}}}{2}\left[1
    - \tanh\!\left(\frac{\rho-\rho_{\mathrm{ped}}}{\Delta/2}\right)\right]

    $$


    where $p_e(\rho)$ is the electron pressure, $p_{\mathrm{SOL}}$ is this scrape-off-layer
    offset, $p_{\mathrm{ped}}$ is the pedestal-side pressure level, $\rho$ is an outward-increasing
    flux-surface label such as $\rho_{\psi_N}=\sqrt{\psi_N}$ in flux coordinates $(\rho_{\psi_N},\theta,\phi)$,
    $\rho_{\mathrm{ped}}$ is the center of the transition, and $\Delta/2$ is the half-width
    parameter of the steep-gradient region.


    In practice, the value is inferred by forming electron pressure from electron
    density and temperature measurements, then fitting the radial dependence over
    a region spanning the pedestal and the near scrape-off layer. When $\rho_{\psi_N}$
    is used, $\rho_{\psi_N}=1$ denotes the last closed flux surface and larger values
    lie in the scrape-off layer; related fitted fall-off behavior may be summarized
    by electron_decay_length_over_scrape_off_layer.


    Typical fitted offsets in H-mode edge analyzes are about 10-1000 Pa, with cold
    or low-density scrape-off layers near the lower end and high-density, high-power
    plasmas reaching higher values. They are normally well below electron_pressure_at_pedestal_top,
    often a few percent to a few tens of percent of that value.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:pressure_over_scrape_off_layer
  arguments:
  - name: pressure_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
- name: neutral_pressure_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Volume-averaged scalar thermal pressure of neutral atoms and molecules
    in the scrape-off layer, the open-field-line region outside the last closed flux
    surface. It characterizes the neutral inventory relevant to recycling, pumping
    balance, ionization, and divertor detachment.
  documentation: 'Neutral pressure over the scrape-off layer is the volume average
    of the scalar translational pressure carried by neutral atoms and molecules in
    the open-field-line region outside the last closed flux surface. In toroidal geometry,
    this region is described in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    The quantity is the neutral-gas contribution to the edge pressure balance and
    is distinct from charged-particle pressures such as [electron_pressure_over_scrape_off_layer](name:electron_pressure_over_scrape_off_layer).


    For an ideal neutral gas mixture, the volume-averaged pressure is


    $$

    p_{n,\mathrm{SOL}} = \frac{1}{V_{\mathrm{SOL}}}\int_{V_{\mathrm{SOL}}} \sum_a
    n_a(\mathbf{x}) k_\mathrm{B} T_a(\mathbf{x})\, dV

    $$


    where $V_{\mathrm{SOL}}$ is the scrape-off-layer volume, $a$ indexes neutral species,
    $n_a$ is the neutral density, $T_a$ is the neutral translational temperature in
    K, and $k_\mathrm{B}$ is the Boltzmann constant. If a neutral temperature is expressed
    in eV, the factor $k_\mathrm{B}T_a$ is replaced by the corresponding energy obtained
    by multiplying by the elementary charge.


    In practice this pressure is inferred from calibrated neutral gas diagnostics
    such as ionization gages, Penning gages, capacitance gages, gas-balance measurements,
    and spectroscopy constrained by neutral transport modeling. A true volume average
    requires combining local pressure or density estimates with the spatial distribution
    of neutrals across the SOL, divertor, and recycling regions, accounting for wall
    pumping, fueling, molecular species, and ionization losses.


    Typical volume-averaged values range from about $10^{-3}$-$10$ Pa in attached
    edge plasmas and from about $1$-$100$ Pa in high-recycling or detached divertor
    conditions. Local gage pressures near pumping ducts or divertor targets can differ
    substantially from the SOL volume average because neutral density is highly nonuniform.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:pressure_over_scrape_off_layer
  - name:electron_pressure_over_scrape_off_layer
  arguments:
  - name: pressure_over_scrape_off_layer
    operator: neutral
    operator_kind: qualifier
- name: radial_ion_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective radial cross-field diffusivity for total ion particle transport
    in the edge plasma, where total ion density is the unweighted sum over charged
    ion species and charge states. It relates outward particle flux density across
    magnetic flux surfaces to the negative outward gradient of total ion density.
  documentation: 'Radial ion particle diffusivity is an effective transport coefficient
    for cross-field diffusion of the total charged-ion particle population normal
    to magnetic flux surfaces in the edge plasma. The associated total ion density
    is the unweighted particle-density sum over charged ion species and charge states,
    consistent with [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density),
    so ions are counted as particles rather than weighted by charge or mass.


    In a local diffusive closure, the radial ion particle flux density is written
    in Fick-law form:


    $$

    \Gamma_{i,r} = -D_{i,r}\,\frac{\partial n_i}{\partial r}

    $$


    where $\Gamma_{i,r}$ is the diffusive ion particle flux density in m^-2.s^-1 and
    is taken positive outward across magnetic flux surfaces, $D_{i,r}$ is this radial
    ion particle diffusivity in m^2.s^-1, $n_i = \sum_\alpha n_\alpha$ is the total
    charged-ion density in m^-3 with $\alpha$ labeling charged ion species and charge
    states, and $r$ is an outward radial distance in m measured normal to the flux
    surfaces. With this convention, a density that decreases outward gives a positive
    outward diffusive flux.


    This coefficient is used in particle-balance and edge-transport models as an effective
    representation of unresolved cross-field mixing. It may include collisional, turbulent,
    and model-reduction effects, so it should be interpreted as a transport-model
    coefficient rather than as a universal material property. Charge-state-resolved
    particle transport is described by related quantities such as [radial_ion_state_particle_flux](name:radial_ion_state_particle_flux).


    Typical magnitudes are scenario- and model-dependent rather than universal; values
    are reported in m^2.s^-1 and should be compared only for the same radial coordinate
    definition, source terms, and transport closure. The coefficient is normally non-negative,
    and larger values correspond to stronger outward diffusive particle transport
    for a given outward density gradient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_diffusivity
  - name:radial_ion_convection_velocity
  sources:
