- name: alfven_frequency
  description: |-
    Alfvén frequency at a given radial position for a single toroidal mode
    number is the complex local shear-Alfvén continuum angular frequency; its
    real part gives oscillation and its imaginary part gives growth or damping
    for the stated time dependence.
  documentation: |-
    Alfvén frequency at a given radial position for a single toroidal mode
    number is the complex local shear-Alfvén continuum angular frequency for
    perturbations propagating along the magnetic field on the flux surface at
    that radial position. Its [real part](name:alfven_frequency_real_part) is
    the oscillatory component, and its [imaginary
    part](name:alfven_frequency_imaginary_part) is the temporal growth or
    damping component.

    The ideal shear-Alfvén continuum relation defining the underlying continuum
    frequency is

    $$
    \omega_A = |k_\parallel| v_A
    $$

    where $\omega_A$ is the real continuum angular frequency, $k_\parallel$ is
    the component of the wave vector parallel to the magnetic field, and $v_A$
    is the Alfvén speed, $B/\sqrt{\mu_0\rho_m}$ with $B$ the magnetic-field
    magnitude, $\mu_0$ the vacuum permeability, and $\rho_m$ the plasma mass
    density.

    This quantity denotes the full complex frequency
    $\Omega_A=\operatorname{Re}(\Omega_A)+i\operatorname{Im}(\Omega_A)$, not
    either component alone, and it is an angular frequency rather than a cyclic
    frequency. The radial position is a flux-surface label in explicitly named
    flux coordinates such as $(\rho,\theta,\phi)$ or $(\psi,\theta,\phi)$, not a
    cylindrical vector component in the right-handed cylindrical $(R,\phi,Z)$
    frame. At fixed toroidal mode number, $k_\parallel$ is determined by
    field-line pitch, magnetic geometry, and poloidal harmonic content, with the
    [safety factor](name:safety_factor) entering common single-harmonic
    specializations.

    Sign convention: Positive when $\operatorname{Im}(\Omega_A)$ makes
    perturbations proportional to $\exp(-i\Omega_A t)$ grow exponentially in
    time.
  unit: s^-1

- name: alfven_frequency_imaginary_part
  description: |-
    Damping rate when negative or growth rate when positive, the imaginary part
    of the complex shear Alfvén continuum frequency, for a single toroidal mode
    number at a given radial position.
  documentation: |-
    The imaginary part of the complex shear Alfvén continuum frequency, $\gamma
    = \operatorname{Im}(\omega_A)$, sets how fast a shear Alfvén perturbation
    grows or decays at a given radial position for a chosen toroidal mode number
    $n$. Together with the oscillation frequency
    [alfven_frequency_real_part](name:alfven_frequency_real_part) it fixes the
    full time dependence, which under the $e^{-i\omega_A t}$ convention evolves
    as

    $$
    \delta f(t) \propto e^{\gamma t}\, e^{-i\omega_r t}
    $$

    so a positive $\gamma$ marks an unstable, growing response and a negative
    $\gamma$ a linearly damped one. A linear MHD calculation resolves $\gamma$
    as a function of minor radius and toroidal mode number. The continuum is
    purely real in ideal MHD, and a finite $\gamma$ arises from resistive,
    kinetic, or energetic-particle effects, the same drives that excite the
    discrete Alfvén eigenmodes occupying the continuum gaps. The full complex
    value is the [alfven_frequency](name:alfven_frequency).

    Sign convention: Positive when the mode amplitude grows exponentially in
    time under the $e^{-i\omega_A t}$ convention.
  unit: s^-1

- name: alfven_frequency_real_part
  description: |-
    Oscillation angular frequency, the real part of the complex angular
    frequency of the local shear Alfvén continuum at a specified position across
    magnetic flux surfaces for a single toroidal mode number.
  documentation: |-
    Oscillation angular frequency is the real part of the complex angular
    frequency of a local shear-Alfvén continuum root. It gives the signed
    oscillatory component of that continuum branch at a specified position
    across magnetic flux surfaces for one toroidal mode number.

    The real part is defined from the complex continuum angular frequency by:

    $$
    \omega_{\mathrm{A,r}} = \operatorname{Re}\!\left(\Omega_{\mathrm{A}}\right)
    $$

    where $\omega_{\mathrm{A,r}}$ is this oscillation angular frequency,
    $\Omega_{\mathrm{A}}$ is the [complex Alfvén
    frequency](name:alfven_frequency), and $\operatorname{Re}$ denotes the
    real-part operator.

    The scope is one local shear-Alfvén continuum root at one position across
    the magnetic flux surfaces and one toroidal mode number; it is not an
    average, envelope, or sum over roots, positions, or mode numbers. The
    toroidal mode number $n$ is the integer Fourier index of variation in
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ increases counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is vertical height. This quantity excludes
    global eigenmode frequencies and continua not belonging to the shear-Alfvén
    branch.

    The [complex Alfvén frequency](name:alfven_frequency) decomposes into this
    quantity and its imaginary companion as $\Omega_{\mathrm{A}} =
    \omega_{\mathrm{A,r}} + i\gamma_{\mathrm{A}}$, where $i$ is the imaginary
    unit and $\gamma_{\mathrm{A}}$ is the [Alfvén-frequency imaginary
    part](name:alfven_frequency_imaginary_part), representing growth or damping
    under the same complex-frequency convention. The signed value
    $\omega_{\mathrm{A,r}}$ identifies the selected real branch; the
    non-negative magnitude $|\omega_{\mathrm{A,r}}|$ is an unsigned oscillation
    rate and is not this quantity. The branch sign follows the phase convention
    that the oscillatory perturbation is proportional to
    $\exp[i(n\phi-\Omega_{\mathrm{A}}t)]$, where $t$ is time.

    Sign convention: Positive when the temporal phase of the oscillatory factor
    $\exp[-i\Omega_{\mathrm{A}} t]$ decreases with increasing time, so for
    positive toroidal mode number $n$ the corresponding constant-phase surface
    moves toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame with the position on the flux surface
    otherwise held fixed.
  unit: s^-1

- name: alfven_time
  description: |-
    Characteristic shear-Alfvén transit time across the magnetic-axis
    major-radius scale, set by local ion inertia and the reference
    magnetic-field strength.
  documentation: |-
    The Alfvén time is the characteristic shear-Alfvén propagation time across a
    reference major-radius scale in the confined plasma. It is a physical MHD
    timescale, not an event timestamp or a growth rate.

    Its defining relation is

    $$
    \tau_A(\rho) = \frac{R_0\sqrt{m_i n_i(\rho)}}{B_0}
    $$

    where $\tau_A(\rho)$ is the local Alfvén time, $R_0$ is the magnetic-axis
    major-radius scale, $m_i$ is the mass of the reference ion population,
    $n_i(\rho)$ is its number density at radial coordinate $\rho$, and $B_0$ is
    the reference magnetic-field strength.

    The quantity applies locally at each radial coordinate in the confined
    plasma; it is not a radial average or radial integral, and it does not
    represent a charge-state-resolved time unless the reference ion population
    is so specified. As a timescale, it is distinct from the frequency
    represented by [alfven_frequency](name:alfven_frequency) and from the
    general temporal quantity time. It provides the characteristic time used to
    normalize MHD growth rates and other dynamical rates.
  unit: s

- name: effective_charge
  description: |-
    Effective charge of a plasma mixture is its second ionic charge-number
    moment normalized by free-electron density, expressing the composition
    factor for electron–ion Coulomb scattering.
  documentation: |-
    Effective charge characterizes the charge-state composition of a plasma ion
    mixture through its contribution to electron–ion Coulomb scattering. It
    encompasses local values and explicitly specified spatial averages of those
    values.

    The underlying local effective charge is defined by:

    $$
    Z_{\mathrm{eff}} = \frac{\sum_s n_s Z_s^2}{n_e}
    $$

    where $Z_{\mathrm{eff}}$ is the effective charge, $s$ labels each ion
    species and charge-state population, $n_s$ is that population's number
    density, $Z_s$ is its ionic charge number relative to the positive
    elementary charge, and $n_e$ is the free-electron number density at the same
    location.

    The summation includes all ion species and charge states present, rather
    than a selected species or charge state. Effective charge is neither a
    single ion's charge number nor the net electric charge of the plasma.
    Locus-specific quantities, such as [effective charge at the plasma
    boundary](name:effective_charge_at_plasma_boundary), evaluate this
    definition at their stated location.

    For a quasineutral mixture of electrons and positive ions, $n_e = \sum_s n_s
    Z_s$, making effective charge a charge-density-weighted mean ionic charge
    number. It equals one when all ions are singly charged.

    [Volume-averaged effective charge](name:volume_averaged_effective_charge)
    averages the local effective charge over the confined plasma volume; a
    global value inferred from ohmic resistive flux consumption during an ohmic
    phase represents this volume-averaged instance. [Line-averaged effective
    charge](name:line_averaged_effective_charge) instead averages it uniformly
    along a specified line of sight. Neither averaging convention is implicit in
    the unqualified quantity.
  unit: '1'

- name: electron_critical_temperature_at_pedestal_top
  description: |-
    Temperature of electrons at the pedestal top at which the pedestal reaches
    marginal stability against coupled peeling–ballooning modes.
  documentation: |-
    Temperature of electron at pedestal top

    At the transition to instability, the threshold satisfies

    $$
    \gamma_{\mathrm{PB}}\!\left(T_{e,\mathrm{ped}}^{\mathrm{crit}}\right)=0
    $$

    where $T_{e,\mathrm{ped}}^{\mathrm{crit}}$ is the critical pedestal-top
    electron temperature and $\gamma_{\mathrm{PB}}$ is the growth rate of the
    peeling–ballooning mode becoming unstable, with the associated equilibrium
    quantities evaluated self-consistently.

    The threshold applies to the local electron population at the pedestal top,
    not to an average over the pedestal region or over plasma species. Its value
    depends on the pedestal pressure and current distributions, including the
    self-consistent bootstrap-current contribution; it is not a universal
    electron-temperature limit.

    The [electron temperature at the pedestal
    top](name:electron_temperature_at_pedestal_top) denotes the corresponding
    local state quantity and equals this critical value only when the pedestal
    lies on the stated stability boundary.
  unit: eV

- name: electron_temperature
  description: |-
    Temperature of electrons expressed as two-thirds of the mean random kinetic
    energy per bulk electron, excluding directed-flow energy.
  documentation: |-
    Temperature of electrons characterizes the random translational motion of
    the bulk electron population relative to its mean flow. It is a kinetic
    temperature, distinct from the equivalent blackbody temperature assigned to
    emitted radiation.

    The defining energy-equivalent relation is

    $$
    T_e = \frac{2}{3}\left\langle E_{e,\mathrm{rand}}\right\rangle_e
    $$

    where $T_e$ is the electron temperature, $E_{e,\mathrm{rand}}$ is an
    electron's kinetic energy relative to the local mean electron flow, and
    $\langle\cdot\rangle_e$ denotes a particle-number-normalized average over
    the bulk electron velocity distribution. For a Maxwellian population, this
    equals the thermodynamic temperature expressed as an energy.

    This quantity applies to electrons in the core, edge, and scrape-off layer
    without imposing a particular evaluation locus or spatial averaging
    convention. It excludes directed-flow kinetic energy and does not include
    ion thermal energy. As a single temperature, it does not resolve separate
    directional kinetic temperatures.

    The [line-averaged electron
    temperature](name:line_averaged_electron_temperature) is a spatial average
    of this quantity along a plasma chord, while the [volume-averaged electron
    temperature](name:volume_averaged_electron_temperature) is its volume
    average inside the last closed magnetic flux surface. These spatial averages
    are distinct from the velocity-distribution average in the defining
    relation.
  unit: eV

- name: electrostatic_potential
  description: |-
    Electrostatic interaction energy per positive test charge in a plasma or at
    a material boundary, relative to a chosen electrical reference.
  documentation: |-
    This quantity is the electrostatic potential in a plasma or at a material
    boundary, relative to a chosen electrical reference. It specifies
    electrostatic interaction energy per positive test charge.

    The defining energy relation is

    $$
    \Phi = \frac{\Delta U}{q}
    $$

    where $\Phi$ is the reference-relative electrostatic potential, $\Delta U$
    is the change in electrostatic potential energy of a test charge moved from
    the reference to the evaluation location, and $q$ is the positive test
    charge.

    The quantity applies across core plasma, edge plasma, the scrape-off layer,
    and material boundaries. It may denote a local value or an explicitly
    specified spatial average; no particular averaging operation or evaluation
    locus is intrinsic to the general quantity. A flux-surface-averaged value is
    the mean over a specified magnetic flux surface, not an assertion that the
    local potential is constant on that surface.

    For the local potential, the electrostatic electric field is
    $\mathbf{E}_{\mathrm{es}}=-\nabla\Phi$, where $\mathbf{E}_{\mathrm{es}}$
    denotes the electrostatic contribution to the electric field and $\nabla$ is
    the spatial gradient. This relation excludes any inductive electric-field
    contribution. Potential gradients therefore contribute to plasma rotation
    through electric-field-cross-magnetic-field drift. Changing the electrical
    reference adds a spatially constant offset without changing this electric
    field.

    The [potential at a Langmuir-probe
    position](name:electrostatic_potential_at_langmuir_probe_position) is a
    local plasma value, whereas the [floating electrostatic
    potential](name:floating_electrostatic_potential) is the collector value
    constrained by zero net current. A sheath can sustain a difference between
    them. The [real part](name:electrostatic_potential_real_part) and [imaginary
    part](name:electrostatic_potential_imaginary_part) are quadratures of a
    complex representation; a fluctuation amplitude instead characterizes
    magnitude, with any normalization specified separately.

    Sign convention: Positive when a positive test charge has greater
    electrostatic potential energy at the evaluation location than at the chosen
    reference.
  unit: V

- name: electrostatic_potential_imaginary_part
  description: |-
    Electrostatic potential imaginary part is the signed quadrature component
    that multiplies the imaginary unit in a complex representation of an
    electrostatic potential. It denotes only that imaginary component, not the
    full complex potential or its real part.
  documentation: |-
    Electrostatic potential imaginary part is the signed quadrature component of
    an electrostatic potential represented as a complex scalar. It is the part
    multiplying the imaginary unit and is defined only after a complex phase
    reference has been chosen.

    For a complex electrostatic potential $\Phi$, the imaginary part $\Phi_I$ is
    defined by the decomposition:

    $$
    \Phi = \Phi_R + i\Phi_I
    $$

    where $\Phi_R$ is the electrostatic-potential real part, $\Phi_I$ is the
    electrostatic-potential imaginary part, and $i$ is the imaginary unit.

    This quantity excludes the full complex electrostatic potential and excludes
    the real quadrature component. A concrete specialization is the [perturbed
    electrostatic-potential imaginary
    part](name:perturbed_electrostatic_potential_imaginary_part) used for a
    complex perturbation representation.

    Sign convention: Positive when the coefficient of $+i$ in the chosen complex
    representation of the electrostatic potential is positive.
  unit: V

- name: electrostatic_potential_real_part
  description: |-
    Electrostatic potential real part is the real-valued quadrature of a complex
    electrostatic-potential representation. It identifies the in-phase
    scalar-potential component, not the full complex potential or its magnitude.
  documentation: |-
    Electrostatic potential real part is the real-valued quadrature of a complex
    electrostatic-potential field or eigenfunction. It represents the
    scalar-potential component associated with the chosen real phase of the
    complex representation, not the complete complex quantity.

    The real part is defined by the complex decomposition of the electrostatic
    potential:

    $$
    \phi_R = \operatorname{Re}\{\phi\}, \qquad \phi = \phi_R + i\phi_I
    $$

    where $\phi$ is the complex electrostatic potential, $\phi_R$ is this real
    part, and $\phi_I$ is the corresponding imaginary part.

    This quantity excludes the imaginary quadrature, the complex modulus, the
    phase angle, and any reconstructed physical perturbation obtained after
    applying additional mode or time phase factors. The [perturbed
    electrostatic-potential real
    part](name:perturbed_electrostatic_potential_real_part) is the first-order
    perturbation-specific instance of this real-part quantity.

    Sign convention: Positive when the real quadrature of the electrostatic
    potential is above the chosen scalar-potential reference for the specified
    complex phase.
  unit: V

- name: halo_current
  description: |-
    Halo current in the halo plasma region during a disruption is the electric
    current vector carried by the halo plasma on open magnetic field lines
    between the last closed flux surface and the first wall. Its poloidal and
    toroidal components are obtained by integrating the halo current density
    over oriented cross sections of the halo region.
  documentation: |-
    Halo current in the halo plasma region during a disruption is the electric
    current vector carried by the halo plasma flowing on open magnetic field
    lines between the last closed flux surface and the first wall. It resolves
    into a poloidal component and a toroidal component, each obtained by
    integrating the halo current density over an oriented cross section of the
    halo region.

    The component currents are surface integrals of the halo current density,
    and the current vector is their sum along the corresponding unit directions:

    $$
    \mathbf{I}_\mathrm{h} = I_{\mathrm{h},\theta}\,\hat{\mathbf{e}}_\theta + I_{\mathrm{h},\phi}\,\hat{\boldsymbol{\phi}}, \qquad I_{\mathrm{h},a} = \int_{S_a} \mathbf{J}_\mathrm{h}\cdot\hat{\mathbf{e}}_a\,dS,\quad a\in\{\theta,\phi\}
    $$

    where $\mathbf{J}_\mathrm{h}$ is the halo current density, $S_a$ is an
    oriented cross section of the halo region with positive normal
    $\hat{\mathbf{e}}_a$, $\hat{\mathbf{e}}_\theta$ is tangent to increasing
    poloidal angle $\theta$, and $\hat{\boldsymbol{\phi}}$ is tangent to
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame. The poloidal angle $\theta$ is the angular coordinate in the
    meridional plane of that $(R, \phi, Z)$ frame about the chosen magnetic-axis
    reference and is distinct from the toroidal angle $\phi$.

    The scalar coefficient $I_{\mathrm{h},\theta}$ is
    [poloidal_halo_current](name:poloidal_halo_current) and
    $I_{\mathrm{h},\phi}$ is
    [toroidal_halo_current](name:toroidal_halo_current). This integrated current
    vector is distinct from halo_current_density, the local field
    $\mathbf{J}_\mathrm{h}$ prior to integration over $S_a$, and it counts only
    current carried by the halo plasma itself, excluding current confined to
    passive conducting structures after path closure outside the halo region.

    Sign convention: Positive when the poloidal component is directed along
    increasing poloidal angle $\theta$ and the toroidal component is directed
    along increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  unit: A

- name: ion_average_temperature_at_post_sawtooth_crash
  description: |-
    Density-weighted mean random kinetic energy of all ion species and charge
    states, expressed as an energy-equivalent temperature after a sawtooth
    crash.
  documentation: |-
    This quantity is the energy-equivalent temperature of the ion population
    after a sawtooth crash, averaged over every included ion species and charge
    state. It characterizes the mean thermal energy of the post-crash ions and
    is distinct from a temperature assigned to one species or charge state.

    $$
    T_i = \frac{\sum_s n_s T_s}{\sum_s n_s}
    $$

    where $T_i$ is the averaged ion temperature, $T_s$ is the temperature of ion
    species and charge state $s$, and $n_s$ is its number density. The summation
    includes all ion species and charge states in the defined population. The
    corresponding general quantity is [ion average
    temperature](name:ion_average_temperature), while [ion average temperature
    at an internal transport
    barrier](name:ion_average_temperature_at_internal_transport_barrier) applies
    the same averaging concept at a different plasma locus.
  unit: eV

- name: normalized_poloidal_flux_coordinate
  description: |-
    Normalized poloidal flux coordinate labels magnetic surfaces by their
    poloidal-flux fraction or its square root, from zero at the magnetic axis to
    one at the last closed flux surface.
  documentation: |-
    Normalized poloidal flux coordinate

    The linear normalized poloidal-flux fraction is defined by

    $$
    \psi_{\mathrm{N}} = \frac{\psi - \psi_{\mathrm{axis}}}{\psi_{\mathrm{b}} - \psi_{\mathrm{axis}}}
    $$

    where $\psi_{\mathrm{N}}$ is the linear normalized flux fraction, $\psi$ is
    the [poloidal magnetic flux of the
    surface](name:poloidal_magnetic_flux_at_flux_surface),
    $\psi_{\mathrm{axis}}$ is its [magnetic-axis
    value](name:poloidal_magnetic_flux_at_magnetic_axis), and
    $\psi_{\mathrm{b}}$ is its [boundary
    value](name:poloidal_magnetic_flux_at_plasma_boundary) at the last closed
    flux surface used as the normalization reference. The denominator must be
    nonzero.

    The square-root parameterization is $\rho_{\mathrm{pol,norm}} =
    \sqrt{\psi_{\mathrm{N}}}$, where $\rho_{\mathrm{pol,norm}}$ is the
    radius-like normalized poloidal flux coordinate. Both parameterizations
    increase from zero at the magnetic axis to one at the last closed flux
    surface, but their intermediate values differ. Neither is a geometric
    radius, spatial average, or volume integral. Outside the last closed flux
    surface, an extension labels flux levels rather than nested closed surfaces;
    the square-root form requires a nonnegative flux fraction.

    Locus-specific members evaluate the chosen parameterization without changing
    its normalization references. The [coordinate at the reflectometer cutoff
    position](name:normalized_poloidal_flux_coordinate_at_reflectometer_cutoff_position)
    uses the square-root form. The [coordinate of the selected plasma
    boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary) uses
    the linear fraction and can be below one when that selected boundary lies
    inside the last closed flux surface.

    $$\psi_{\mathrm{N}} = (\psi - \psi_{\mathrm{axis}})/(\psi_{\mathrm{b}} - \psi_{\mathrm{axis}})$$
  unit: '1'

- name: per_toroidal_mode_growth_rate
  description: |-
    Per-toroidal-mode growth rate is the exponential growth or damping rate of a
    single linear magnetohydrodynamic eigenmode with a specified toroidal mode
    number. It is the imaginary part of the complex eigenfrequency under the
    time dependence that makes positive values correspond to increasing
    amplitude.
  documentation: |-
    Per-toroidal-mode growth rate is the exponential rate associated with one
    linear magnetohydrodynamic eigenmode at a specified toroidal mode number. It
    characterizes the temporal change of that eigenmode's amplitude, separating
    unstable growth from damping for the same toroidal harmonic.

    For a linear perturbation represented by a toroidal Fourier eigenmode, the
    defining convention is

    $$
    \delta q_n(R,Z,\phi,t) = \tilde{q}_n(R,Z)\exp[i n\phi - i\omega_n t], \qquad \gamma_n = \operatorname{Im}(\omega_n)
    $$

    where $\delta q_n$ is a perturbation of an MHD field quantity, $\tilde{q}_n$
    is its eigenfunction, $n$ is the integer toroidal mode number, $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height in the
    right-handed cylindrical $(R,\phi,Z)$ frame, $t$ is time, $i$ is the
    imaginary unit, $\omega_n$ is the complex mode frequency of the eigenmode,
    and $\gamma_n$ is the per-toroidal-mode growth rate.

    The scope is a single eigenmode within a single toroidal harmonic; there is
    no summation, averaging, maximization, or aggregation over toroidal mode
    numbers or over distinct eigenbranches. This quantity applies to the linear
    perturbation amplitude and excludes nonlinear saturation, mode-coupling
    effects, and spectrum-wide instability measures.

    This quantity is distinct from mode frequency as an oscillation-rate
    quantity and from per-toroidal-mode perturbed energy as an energy-like
    quadratic measure of the same toroidal harmonic. For fixed eigenfunction
    normalization in the linear regime, a modal amplitude scales as
    $\exp(\gamma_n t)$ and a quadratic perturbation measure scales as
    $\exp(2\gamma_n t)$.

    Sign convention: Positive when the mode amplitude increases exponentially in
    time.
  unit: Hz

- name: perturbed_electrostatic_potential_imaginary_part
  description: |-
    Imaginary part of the complex first-order electrostatic potential
    perturbation eigenfunction for a specified toroidal Fourier mode in linear
    MHD stability analysis.
  documentation: |-
    The imaginary part of the perturbed electrostatic potential eigenfunction is
    one of two real-valued components that together fully specify the complex
    scalar perturbation $\delta\phi$ throughout the confined plasma for a single
    linear magnetohydrodynamic eigenmode. The irrotational component of the
    perturbed electric field is $\delta\mathbf{E}_\mathrm{es} =
    -\nabla\delta\phi$, separate from the inductive contribution arising from
    the perturbed magnetic vector potential.

    The complex eigenfunction decomposes as:

    $$
    \delta\phi = \operatorname{Re}(\delta\phi) + i\,\operatorname{Im}(\delta\phi)
    $$

    where $\operatorname{Re}(\delta\phi)$ is the [real
    part](name:perturbed_electrostatic_potential_real_part) and
    $\operatorname{Im}(\delta\phi)$ — this quantity — encodes the spatial phase
    distribution of the electrostatic perturbation for toroidal mode number $n$.

    Linear MHD or extended-MHD stability solvers compute $\delta\phi$ as part of
    the eigenmode solution for a specified $n$; the overall complex
    normalization is fixed by the solver's phase convention, so the imaginary
    part carries physical meaning only in conjunction with the real part. The
    same complex decomposition pattern applies to
    [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)
    and
    [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part)
    within the complete set of MHD perturbation eigenfunctions for the same
    eigenmode.
  unit: V

- name: perturbed_electrostatic_potential_real_part
  description: |-
    Real part of the complex first-order electrostatic potential perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability
    analysis.
  documentation: |-
    The perturbed electrostatic potential $\delta\hat{\phi}$ is a complex
    spatial eigenfunction in linear MHD stability analysis, representing the
    scalar potential part of the first-order electric field perturbation
    $\delta\mathbf{E} = -\nabla\delta\phi - \partial_t\delta\mathbf{A}$ for a
    single toroidal Fourier mode number $n$. This quantity is the real part
    $\mathrm{Re}(\delta\hat{\phi})$, encoding the in-phase component of the
    eigenfunction in the poloidal plane defined by the $(R, Z)$ coordinates of
    the right-handed cylindrical $(R, \phi, Z)$ frame.

    The complex eigenfunction is fully specified by combining this quantity with
    [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part):

    $$
    \delta\hat{\phi}(R,Z) = \mathrm{Re}(\delta\hat{\phi}) + i\,\mathrm{Im}(\delta\hat{\phi})
    $$

    where the physical perturbation field at toroidal angle $\phi$ is recovered
    as $\mathrm{Re}[\delta\hat{\phi}(R,Z)\,e^{in\phi}]$, and $n$ is the toroidal
    mode number.

    The absolute amplitude and phase of the eigenfunction depend on the
    normalization convention adopted by the linear stability solver; only
    relative amplitudes among simultaneously computed perturbation quantities
    carry physical meaning. The analogous real-part components in the same
    eigenfunction family include
    [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and
    [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part),
    all resolved on the same poloidal plane for a given toroidal mode.
  unit: V

- name: plasma_mass_density
  description: |-
    Local plasma mass per unit volume, forming the inertial term in the MHD
    momentum equation and appearing in contexts from equilibrium transport
    profiles to linear MHD stability perturbations.
  documentation: |-
    The plasma mass density is the local plasma mass per unit volume, forming
    the inertial term in the MHD momentum balance and the compressibility term
    in the plasma continuity equation. This parent concept subsumes both
    equilibrium-profile and linear-perturbation contexts: the equilibrium total
    value summed over all charged species, and the complex first-order
    perturbation amplitude used in linear MHD eigenvalue problems.

    In the equilibrium formulation, the mass density is defined by:

    $$
    \rho = \sum_s m_s n_s
    $$

    where $m_s$ is the particle mass and $n_s$ the number density of charged
    species $s$, summed over electrons, main-ion isotopes, and impurity charge
    states; neutral atoms are excluded. Ion contributions dominate because $m_i
    \gg m_e$.

    In deuterium-dominated fusion plasmas at core electron densities of order
    $10^{20}$ m$^{-3}$, the mass density is approximately $3 \times 10^{-7}$ kg
    m$^{-3}$, scaling directly with ion density and average ion mass. The mass
    density sets the local Alfvén speed $v_A = B / \sqrt{\mu_0 \rho}$, where $B$
    is the local magnetic-field magnitude and $\mu_0$ is the permeability of
    free space, governing the [alfven_time](name:alfven_time) and ideal-MHD wave
    dynamics. It enters inertial_current_density through the plasma-fluid
    acceleration term and is inferred from electron_number_density measurements
    combined with plasma composition analysis. This quantity is closely related
    to [mass_density](name:total_plasma_mass_density), which covers the same
    physical concept without explicit species qualification.
  unit: kg.m^-3

- name: plasma_mass_density_imaginary_part
  description: |-
    Plasma mass density imaginary part is the imaginary quadrature of a complex
    plasma mass-density quantity. It is the component multiplying the positive
    imaginary basis, not the complete complex density.
  documentation: |-
    Plasma mass density imaginary part is the imaginary quadrature of a complex
    plasma mass-density quantity. It represents the coefficient of the imaginary
    basis in a complex representation of plasma mass density, not the complete
    complex density itself.

    The complex plasma mass density may be decomposed into real and imaginary
    quadratures as

    $$
    \rho = \rho_{\mathrm{re}} + i\,\rho_{\mathrm{im}}
    $$

    where $\rho$ is the complex plasma mass density, $\rho_{\mathrm{re}}$ is its
    real quadrature, $\rho_{\mathrm{im}}$ is the plasma mass density imaginary
    part, and $i^2=-1$.

    This parent quantity covers imaginary-part plasma mass-density fields
    independent of the particular origin of the complex representation. The
    [perturbed plasma mass density imaginary
    part](name:perturbed_plasma_mass_density_imaginary_part) is a first-order
    perturbation case. It excludes the real quadrature, the complex modulus, the
    phase, and the complete complex plasma mass density.

    Sign convention: Positive when the quadrature coefficient is along the $+i$
    direction in the complex representation of plasma mass density.
  unit: kg.m^-3

- name: perturbed_plasma_mass_density_imaginary_part
  description: |-
    Imaginary part of the complex first-order plasma mass density perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability
    analysis.
  documentation: |-
    The imaginary part of the complex perturbed plasma mass density
    eigenfunction $\tilde{\rho}_m$ arises when the first-order mass density
    perturbation is separated into in-phase and quadrature components relative
    to a chosen eigenmode phase and normalization. In the standard perturbation
    decomposition $\delta\rho(\mathbf{r}, t) =
    \mathrm{Re}[\tilde{\rho}_m(\mathbf{r})\, e^{i(n\phi - \omega t)}]$, where
    $n$ is the toroidal mode number, $\phi$ is the toroidal angle, and $\omega$
    is the complex eigenfrequency, the eigenfunction splits as:

    $$
    \tilde{\rho}_m = \tilde{\rho}_\mathrm{re} + i\,\tilde{\rho}_\mathrm{im}
    $$

    where $\tilde{\rho}_\mathrm{re}$ is the [real
    part](name:perturbed_plasma_mass_density_real_part) and
    $\tilde{\rho}_\mathrm{im}$ is this quantity. Together they encode the local
    amplitude $|\tilde{\rho}_m|$ and spatial phase of the mass density
    perturbation over the poloidal cross-section.

    The equilibrium mass density about which the perturbation is defined is
    $\rho_{m0} = \sum_s m_s n_s$, where $m_s$ and $n_s$ are the mass and number
    density of species $s$; ion contributions dominate in fusion plasmas because
    electron mass is negligible. These eigenfunctions are produced by linear MHD
    eigenvalue solvers that Fourier-decompose perturbations in the toroidal
    direction; the imaginary part is meaningful only relative to the phase
    convention and normalization of the specific eigenmode calculation. The
    companion quantities
    [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)
    and
    [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part)
    form a self-consistent set of perturbed thermodynamic eigenfunctions for the
    same MHD mode.
  unit: kg.m^-3

- name: plasma_mass_density_real_part
  description: |-
    Real part of a complex plasma mass-density quantity, representing the
    in-phase quadrature relative to the chosen complex phase. It is the real
    component only, not the full complex density or its imaginary quadrature.
  documentation: |-
    Plasma mass density real part is the real-valued quadrature of a complex
    plasma mass-density quantity. It represents the component aligned with the
    chosen real phase of the complex representation and is not the full complex
    quantity.

    The decomposition into real and imaginary quadratures is

    $$
    \tilde{\rho} = \rho_R + i\rho_I,\qquad \rho_R = \operatorname{Re}\{\tilde{\rho}\}
    $$

    where $\tilde{\rho}$ is the complex plasma mass-density quantity, $\rho_R$
    is its real part, and $\rho_I$ is its imaginary part.

    This abstraction covers concrete real-part quantities such as the [perturbed
    plasma mass density real
    part](name:perturbed_plasma_mass_density_real_part). It excludes the
    imaginary quadrature, the complex modulus, the phase, and the full complex
    field; for linear-mode quantities, multiplication of the complex field by a
    constant phase changes the numerical split between $\rho_R$ and $\rho_I$ but
    not the represented physical mode.

    Sign convention: Positive when the real quadrature represents an in-phase
    increase of the local plasma mass density for the chosen complex phase.
  unit: kg.m^-3

- name: perturbed_plasma_mass_density_real_part
  description: |-
    In-phase component of the complex first-order plasma mass-density
    eigenfunction for one toroidal Fourier harmonic in linear MHD stability
    theory.
  documentation: |-
    The quantity is the real, in-phase component of the complex first-order
    plasma mass-density perturbation eigenfunction associated with one toroidal
    Fourier harmonic in linear MHD stability theory. The complete complex
    quantity is perturbed plasma mass density.

    The real component is defined by

    $$
    \widetilde{\rho}_{n,\mathrm{real}}(\mathbf{x}) = \operatorname{Re}\!\left[\widetilde{\rho}_n(\mathbf{x})\right]
    $$

    where $\widetilde{\rho}_n$ is the complex first-order mass-density
    eigenfunction, $n$ is the toroidal Fourier mode number, and $\mathbf{x}$
    denotes position. The decomposition is relative to the phase convention of
    the complex eigenfunction.

    This quantity excludes the imaginary quadrature component and must not be
    interpreted as the magnitude of the complex perturbation. Its meaning
    parallels the real component of the corresponding temperature eigenfunction,
    [perturbed plasma temperature real
    part](name:perturbed_plasma_temperature_real_part).
  unit: kg.m^-3

- name: plasma_temperature
  description: |-
    Effective temperature of the plasma in a fluid or MHD description,
    representing the average thermal kinetic energy per degree of freedom of the
    combined charged particle population.
  documentation: |-
    The plasma temperature is a fundamental thermodynamic state variable in
    fluid and single-fluid MHD models, quantifying the mean random kinetic
    energy of the charged particle population. In a single-fluid description it
    is linked to thermal pressure via the equation of state

    $$
    p = n k_B T
    $$

    where $p$ is the scalar pressure, $n$ is the total particle number density,
    and $k_B$ is the Boltzmann constant.

    In multi-species plasmas an effective plasma temperature may be obtained as
    a density-weighted combination of electron and ion contributions;
    applications requiring species resolution use explicitly qualified forms
    such as particle_temperature or
    [neutral_temperature](name:neutral_internal_state_temperature). This
    quantity also appears as the equilibrium background in linear MHD stability
    analysis, where its first-order perturbation is represented by the complex
    eigenfunction perturbed_plasma_temperature, encoding the amplitude and phase
    of the temperature fluctuation for a specified toroidal Fourier harmonic.
    The total isotropic pressure of the plasma, including contributions summed
    over all species, is captured by plasma_pressure.
  unit: eV

- name: plasma_temperature_imaginary_part
  description: |-
    Imaginary part of plasma temperature is the quadrature component of a
    complex-valued plasma-temperature quantity. It is the coefficient of the
    imaginary basis element and is distinct from both the real part and the full
    complex temperature.
  documentation: |-
    Imaginary part of plasma temperature is the scalar component multiplying the
    imaginary basis element in a complex representation of a plasma-temperature
    quantity. It represents the quadrature component relative to the chosen
    complex phase reference, such as the phase used for a harmonic perturbation
    or eigenfunction.

    For a complex plasma-temperature quantity $T_c$, the decomposition is

    $$
    T_c = T_R + i T_I
    $$

    where $T_c$ is the complex plasma temperature, $T_R$ is the real part of
    that quantity, $T_I$ is the imaginary part of plasma temperature, and $i$ is
    the imaginary unit.

    This quantity is not the full complex plasma temperature and does not
    include the real component. The specialization [perturbed plasma temperature
    imaginary part](name:perturbed_plasma_temperature_imaginary_part) applies
    this same imaginary-part concept to a first-order plasma-temperature
    perturbation.

    Sign convention: Positive when the coefficient of $+i$ in the chosen complex
    representation of the plasma temperature is positive.
  unit: eV

- name: perturbed_plasma_temperature_imaginary_part
  description: |-
    Quadrature (out-of-phase) component of the complex first-order
    plasma-temperature eigenfunction for one toroidal Fourier harmonic in linear
    MHD stability analysis.
  documentation: |-
    The imaginary component of the complex first-order plasma-temperature
    eigenfunction for a single toroidal Fourier harmonic in linear MHD. It is
    the quadrature component relative to the real component under the selected
    Fourier phase convention.

    The defining decomposition is:

    $$
    \delta T = \delta T_R + i\,\delta T_I
    $$

    where $\delta T$ is the complex temperature amplitude, $\delta T_R$ is its
    real component, $\delta T_I$ is the imaginary component represented by this
    quantity, and $i$ is the imaginary unit.

    Together with the [real component of the perturbed plasma
    temperature](name:perturbed_plasma_temperature_real_part), this quantity
    reconstructs the complex perturbed plasma temperature. In the perturbation
    $T=T_0+\delta T e^{i(n\phi-\omega t)}$, $T_0$ is the equilibrium
    temperature, $n$ is the toroidal mode number, $\phi$ is the toroidal angle
    in the right-handed cylindrical $(R,\phi,Z)$ frame, $\omega$ is the complex
    eigenfrequency, and $t$ is time. Its value depends on the selected Fourier
    phase origin and does not by itself represent the complete physical
    temperature perturbation.
  unit: eV

- name: plasma_temperature_real_part
  description: |-
    Real quadrature of a first-order plasma-temperature perturbation
    eigenfunction, giving the component in phase with the chosen complex
    reference. It denotes the real part only, not the full complex
    eigenfunction.
  documentation: |-
    Real quadrature of a first-order plasma-temperature perturbation
    eigenfunction is the in-phase scalar temperature perturbation component
    associated with a linear magnetohydrodynamic mode. It denotes only the real
    part of the plasma-temperature eigenfunction relative to the chosen complex
    phase reference.

    The complex temperature perturbation eigenfunction is decomposed into real
    and imaginary quadratures as

    $$
    \widetilde{T} = T_R + i T_I
    $$

    where $\widetilde{T}$ is the complex first-order plasma-temperature
    perturbation eigenfunction, $T_R$ is this real quadrature, $T_I$ is the
    corresponding imaginary quadrature, and $i$ is the imaginary unit.

    This parent quantity abstracts over concrete real-part plasma-temperature
    perturbation names, such as [perturbed plasma temperature real
    part](name:perturbed_plasma_temperature_real_part). It excludes the
    imaginary quadrature, the modulus or phase of $\widetilde{T}$, and the
    equilibrium plasma temperature about which the perturbation is linearized.
    Changing the complex phase reference changes the numerical split between
    $T_R$ and $T_I$.

    Sign convention: Positive when $T_R$ represents an increase of the plasma
    temperature relative to the equilibrium temperature at the chosen complex
    phase reference.
  unit: eV

- name: perturbed_plasma_temperature_real_part
  description: |-
    In-phase component of the complex first-order plasma-temperature
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD
    stability analysis.
  documentation: |-
    The quantity is the real, in-phase component of the first-order
    plasma-temperature perturbation associated with one toroidal Fourier
    harmonic. It is a component of the complex eigenfunction represented by
    perturbed plasma temperature.

    The in-phase component is defined from the complex perturbation amplitude by

    $$
    \delta T_{\mathrm{R}} = \operatorname{Re}\!\left(\delta T\right)
    $$

    where $\delta T_{\mathrm{R}}$ is the real temperature-perturbation component
    and $\delta T$ is the full complex first-order temperature eigenfunction.
    The result depends on the phase reference chosen for the harmonic and
    excludes the quadrature component represented by the imaginary part. It is
    not the equilibrium temperature or the complete complex perturbation.
  unit: eV

- name: plasma_velocity
  description: |-
    Mass-weighted bulk center-of-mass velocity vector of the plasma fluid, whose
    projections onto the right-handed cylindrical (R, φ, Z) coordinate
    directions provide the radial, toroidal, vertical, and parallel flow
    components.
  documentation: |-
    The plasma velocity is the local center-of-mass (barycentric) flow velocity
    of the bulk plasma, representing the momentum per unit mass carried
    collectively by all plasma species. It is the primary kinematic quantity in
    single-fluid and multi-fluid magnetohydrodynamic descriptions of plasma
    transport, rotation, and momentum confinement.

    The center-of-mass velocity vector is defined as:

    $$
    \mathbf{v}_\mathrm{cm} = \frac{\sum_s m_s n_s \mathbf{v}_s}{\sum_s m_s n_s}
    $$

    where the sum runs over all contributing plasma species $s$, $m_s$ is the
    species mass, $n_s$ is the number density, and $\mathbf{v}_s$ is the mean
    fluid velocity of species $s$.

    The full velocity vector decomposes into projections along the right-handed
    cylindrical $(R, \phi, Z)$ frame: the [radial
    component](name:radial_plasma_velocity) along $\hat{R}$, the [toroidal
    component](name:toroidal_center_of_mass_velocity) along $\hat{\phi}$, the
    [vertical component](name:vertical_plasma_velocity) along $\hat{Z}$, and the
    [parallel component](name:parallel_plasma_velocity) along the local
    magnetic-field unit vector $\hat{b}$. Individual projections are inferred
    from Doppler spectroscopy, charge-exchange recombination spectroscopy, and
    motional-Stark-effect diagnostics; Mach probes provide parallel-flow access
    in the scrape-off layer.
  unit: m.s^-1

- name: parallel_plasma_velocity
  description: |-
    Parallel component of the bulk plasma center-of-mass velocity along the
    local magnetic-field direction, representing field-aligned mass transport of
    all contributing species.
  documentation: |-
    The parallel plasma velocity is the projection of the bulk [plasma
    velocity](name:plasma_velocity) onto the local magnetic-field direction. It
    represents the mass-weighted flow of all contributing plasma species along
    magnetic field lines.

    The parallel component is defined by:

    $$
    v_\parallel = \mathbf{v}_\mathrm{cm} \cdot \hat{\mathbf{b}}, \qquad \hat{\mathbf{b}} = \frac{\mathbf{B}}{|\mathbf{B}|}
    $$

    where $\mathbf{v}_\mathrm{cm}$ is the center-of-mass plasma velocity,
    $\mathbf{B}$ is the local magnetic-field vector, $|\mathbf{B}|$ is its
    magnitude, and $\hat{\mathbf{b}}$ is the corresponding unit vector. Unlike
    the [radial plasma velocity](name:radial_plasma_velocity), this quantity
    follows the local magnetic-field direction rather than the outward
    major-radius direction.

    The quantity is a bulk-plasma projection, not a species-resolved flow or a
    diamagnetic-drift velocity.
  unit: m.s^-1

- name: perturbed_plasma_velocity
  description: |-
    Complex vector eigenfunction of the first-order bulk plasma velocity
    perturbation in linear MHD stability analysis, encoding the spatial
    amplitude and phase of oscillatory plasma flow for a specified toroidal
    Fourier mode.
  documentation: |-
    In linear MHD stability theory, the perturbed plasma velocity is the complex
    vector eigenfunction $\delta\hat{\mathbf{v}}(\mathbf{r})$ representing the
    spatial structure of the first-order oscillatory perturbation of the bulk
    plasma flow about a magnetohydrostatic equilibrium — the linearized
    counterpart to the equilibrium [plasma_velocity](name:plasma_velocity). The
    eigenfunction encodes both the spatial amplitude and the relative phase of
    the velocity oscillation as a function of position in the plasma.

    The full space-time perturbation field is assembled as:

    $$
    \delta\mathbf{v}(\mathbf{r},t) = \delta\hat{\mathbf{v}}(\mathbf{r})\,e^{i(n\phi - \omega t)}
    $$

    where $n$ is the toroidal mode number, $\phi$ is the toroidal angle in the
    right-handed cylindrical $(R,\phi,Z)$ frame, and $\omega$ is the complex
    mode frequency whose real part gives the oscillation frequency and imaginary
    part gives the growth or damping rate. In ideal MHD the eigenfunction
    satisfies $\delta\hat{\mathbf{v}} = -i\omega\boldsymbol{\xi}$, where
    $\boldsymbol{\xi}$ is the plasma displacement vector.

    The eigenfunction decomposes into three spatial projections:
    [radial_perturbed_plasma_velocity](name:radial_perturbed_plasma_velocity),
    [toroidal_perturbed_plasma_velocity](name:toroidal_perturbed_plasma_velocity),
    and
    [poloidal_perturbed_plasma_velocity](name:poloidal_perturbed_plasma_velocity),
    all complex-valued. The overall amplitude and phase are
    normalization-dependent unless anchored to a physical constraint such as
    kinetic energy. The growth rate of the associated mode is characterized by
    [per_toroidal_mode_growth_rate](name:per_toroidal_mode_growth_rate) and the
    spatial phase reference by mode_phase; companion scalar perturbed
    eigenfunctions include
    [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part)
    and
    [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part).
  unit: m.s^-1

- name: poloidal_magnetic_flux_at_halo_boundary
  description: |-
    Poloidal magnetic flux evaluated on the outermost flux surface of the
    halo-current region during a disruption. This is the wall-side halo boundary
    of the halo-current domain, not the inner confined-plasma interface.
  documentation: |-
    Poloidal magnetic flux at the halo boundary is the value of the [poloidal
    magnetic flux](name:poloidal_magnetic_flux) function on the outermost
    magnetic flux surface of the halo-current region during a disruption. The
    halo boundary is the wall-side flux-surface limit of the halo-current
    domain, not the inner interface between that domain and any confined-plasma
    core.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major
    radius, $\phi$ the toroidal angle, and $Z$ the vertical height, the value on
    a halo-boundary point $(R_h, Z_h)$ is defined by the flux of the vertical
    magnetic field through the horizontal disk centered on the toroidal symmetry
    axis:

    $$
    \psi_h = \psi(R_h, Z_h) = \int_0^{R_h} B_Z(R', Z_h)\,2\pi R'\,dR'
    $$

    where $\psi_h$ is the poloidal magnetic flux at the halo boundary,
    $\psi(R_h, Z_h)$ is the poloidal magnetic flux function evaluated on that
    boundary, and $B_Z$ is the vertical component of the magnetic field.

    This quantity is the poloidal-flux counterpart of the [toroidal magnetic
    flux at the halo boundary](name:toroidal_magnetic_flux_at_halo_boundary). It
    is a flux-surface value and does not denote the total magnetic flux through
    the halo-current volume or the halo current itself.

    Sign convention: Positive when $B_Z$ on the integration disk points in the
    $+Z$ direction.
  unit: Wb

- name: poloidal_perturbed_plasma_velocity
  description: |-
    Poloidal component of the complex first-order plasma velocity perturbation
    eigenfunction in linear MHD stability analysis, projected onto the poloidal
    direction in the flux-coordinate frame (ρ, θ, φ) for a single toroidal
    Fourier mode.
  documentation: |-
    The poloidal perturbed plasma velocity is the $\theta$-directed component of
    the linearized plasma velocity perturbation eigenfunction
    $\delta\mathbf{v}(\mathbf{r})$, obtained by projecting the full complex
    perturbation vector onto the poloidal basis direction in the flux-coordinate
    frame $(\rho, \theta, \phi)$, where $\rho$ is a radial flux surface label
    and $\theta$ is the poloidal angle. It characterizes the oscillatory
    poloidal plasma flow about a magnetohydrostatic equilibrium for a specified
    toroidal Fourier mode number $n$, encoding both the spatial amplitude and
    phase variation of that flow component along and across flux surfaces.

    The physical perturbation follows the eigenfunction ansatz:

    $$
    \delta v_\theta(\rho, \theta, \phi, t) = \mathrm{Re}\!\left[\delta\hat{v}_\theta(\rho, \theta)\, e^{i(n\phi - \omega t)}\right]
    $$

    where $\delta\hat{v}_\theta(\rho, \theta)$ is the complex poloidal amplitude
    profile, $n$ is the toroidal mode number, $\phi$ is the toroidal angle
    increasing counter-clockwise when viewed from above $+\hat{Z}$, and $\omega$
    is the complex MHD eigenfrequency whose imaginary part gives the mode growth
    or damping rate.

    The complex amplitude decomposes into its [real
    part](name:poloidal_perturbed_plasma_velocity_real_part) and [imaginary
    part](name:poloidal_perturbed_plasma_velocity_imaginary_part), which
    together specify the amplitude and spatial phase of the poloidal velocity
    oscillation at each point on a flux surface. Alongside the [radial
    component](name:radial_perturbed_plasma_velocity_real_part) and the
    [toroidal component](name:toroidal_perturbed_plasma_velocity_real_part), the
    poloidal projection completes the velocity eigenfunction and supports
    incompressibility assessment and MHD energy partition calculations in linear
    stability solvers.

    Sign convention: Positive when the poloidal velocity is directed in the
    direction of increasing poloidal angle $\theta$ in the flux-coordinate frame
    $(\rho, \theta, \phi)$.
  unit: m.s^-1

- name: poloidal_perturbed_plasma_velocity_imaginary_part
  description: |-
    Quadrature poloidal velocity component of a complex first-order
    plasma-velocity perturbation eigenfunction for a specified toroidal Fourier
    harmonic. It is the imaginary part of the projection onto the positive
    poloidal direction, paired with the in-phase real part.
  documentation: |-
    Quadrature poloidal velocity component of a complex first-order
    plasma-velocity perturbation eigenfunction is the imaginary part of the
    poloidal projection of that eigenfunction for a specified toroidal Fourier
    harmonic. The poloidal direction is the unit vector $\hat{\mathbf e}_\theta$
    toward increasing poloidal angle $\theta$ in a flux-coordinate basis
    $(\rho,\theta,\phi)$, with $\phi$ the toroidal angle of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$ is
    vertical height.

    The projected component and its imaginary part are defined by

    $$
    v_{\theta,\mathrm{im}} = \operatorname{Im}\!\left(\tilde v_\theta\right), \qquad \tilde v_\theta = \tilde{\mathbf v}\cdot\hat{\mathbf e}_\theta
    $$

    where $\tilde{\mathbf v}$ is the complex first-order plasma-velocity
    perturbation eigenfunction, $\tilde v_\theta$ is its poloidal component, and
    $v_{\theta,\mathrm{im}}$ is the coefficient of the imaginary term when
    $\tilde v_\theta = v_{\theta,\mathrm{re}} + i v_{\theta,\mathrm{im}}$.

    This quantity is the quadrature component paired with the [poloidal
    perturbed plasma velocity real
    part](name:poloidal_perturbed_plasma_velocity_real_part); together they
    specify the complex [poloidal perturbed plasma
    velocity](name:poloidal_perturbed_plasma_velocity) for the chosen harmonic
    and phase convention. It is distinct from the corresponding [toroidal
    perturbed plasma velocity imaginary
    part](name:toroidal_perturbed_plasma_velocity_imaginary_part), which
    projects the same complex velocity perturbation onto the toroidal direction.

    Sign convention: Positive when the quadrature component of $\tilde{\mathbf
    v}\cdot\hat{\mathbf e}_\theta$ is aligned with $+\hat{\mathbf e}_\theta$,
    toward increasing poloidal angle $\theta$ in the flux-coordinate basis
    $(\rho,\theta,\phi)$.
  unit: m.s^-1

- name: poloidal_perturbed_plasma_velocity_real_part
  description: |-
    Real part of the poloidal perturbed plasma velocity is the in-phase
    component of the complex first-order plasma-velocity amplitude for toroidal
    mode number n, resolved tangent to increasing poloidal angle in the
    flux-coordinate basis (ρ, θ, φ). The toroidal angle φ is that of the
    right-handed cylindrical (R, φ, Z) frame; equilibrium flow and the
    quadrature component are excluded.
  documentation: |-
    Real part of the poloidal perturbed plasma velocity is the in-phase
    component of the complex first-order plasma-velocity perturbation amplitude
    for one toroidal Fourier harmonic with mode number $n$. The poloidal
    component is resolved along the local basis direction tangent to increasing
    poloidal angle $\theta$ in a specified flux-coordinate basis
    $(\rho,\theta,\phi)$, with $\phi$ the toroidal angle of the right-handed
    cylindrical $(R,\phi,Z)$ frame where $R$ is major radius, $Z$ is vertical
    height, and $\phi$ increases counterclockwise when viewed from above
    $+\hat{Z}$. It is distinct from equilibrium plasma flow.

    For a complex poloidal amplitude in that flux-coordinate basis, the real
    part is defined by:

    $$
    v_{\theta,1}^{\mathrm{Re}}(\rho,\theta;n) = \operatorname{Re}\!\left[\tilde{v}_{\theta,1}(\rho,\theta;n)\right]
    $$

    where $v_{\theta,1}^{\mathrm{Re}}$ is this real poloidal perturbation
    amplitude, $\tilde{v}_{\theta,1}$ is the [poloidal perturbed plasma
    velocity](name:poloidal_perturbed_plasma_velocity), $\tilde{\mathbf{v}}_1$
    is the complex first-order plasma-velocity perturbation eigenfunction for
    harmonic $n$, $\hat{\mathbf{e}}_\theta$ is the local normalized direction
    tangent to increasing $\theta$ with
    $\tilde{v}_{\theta,1}=\tilde{\mathbf{v}}_1\cdot\hat{\mathbf{e}}_\theta$,
    $\rho$ is the radial flux label, and $n$ is the toroidal Fourier mode
    number.

    Together with [poloidal perturbed plasma velocity imaginary
    part](name:poloidal_perturbed_plasma_velocity_imaginary_part), this quantity
    specifies the complex poloidal velocity amplitude for the selected harmonic.
    It is not the full real-space poloidal velocity at a particular toroidal
    angle; the dependence on $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame is supplied by the chosen Fourier harmonic convention. Multiplication
    of the complex eigenfunction by a constant phase factor changes the split
    between real and imaginary parts without changing the underlying linear
    mode, so a fixed phase reference is required for this real component.

    Sign convention: Positive when the real first-order velocity perturbation
    component projects along $+\hat{\mathbf{e}}_\theta$, the local direction of
    increasing poloidal angle $\theta$ in the flux-coordinate basis
    $(\rho,\theta,\phi)$, after the complex eigenmode phase reference is fixed.
  unit: m.s^-1

- name: radial_mode_number
  description: |-
    Dimensionless non-negative integer labeling the radial branch of a linear
    MHD eigenmode by its number of radial nodes between the magnetic axis and
    plasma boundary.
  documentation: |-
    Radial mode number is a dimensionless integer branch index that specifies
    the radial branch of a linear MHD perturbation. It identifies radial
    structure rather than periodicity in either angular direction.

    The radial branch index is defined by

    $$
    n_r = N_{\mathrm{nodes}}[\xi(\rho)]
    $$

    where $n_r$ is the radial mode number, $\xi(\rho)$ is the radial
    eigenfunction, $N_{\mathrm{nodes}}$ counts its interior zeros, and $\rho$ is
    the radial coordinate within the flux-coordinate set $(\rho,\theta,\phi)$;
    the count is taken between the magnetic axis and the plasma boundary.

    The radial mode number is one component of the mode number, distinct from
    the angular harmonics represented by the [poloidal mode
    number](name:poloidal_mode_number) and [toroidal MHD mode
    number](name:toroidal_mhd_mode_number).
  unit: '1'

- name: radial_perturbed_plasma_velocity
  description: |-
    Radial component of the complex first-order plasma velocity perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability
    analysis, abstracting over its real and imaginary scalar parts.
  documentation: |-
    The radial perturbed plasma velocity is the radial projection of the full
    complex eigenfunction of
    [perturbed_plasma_velocity](name:perturbed_plasma_velocity), characterizing
    the component of first-order oscillatory plasma flow directed along the
    major-radius coordinate $R$ in the right-handed cylindrical $(R, \phi, Z)$
    frame. This component is central to stability analyzes of interchange,
    ballooning, and peeling modes, where cross-field plasma displacement drives
    the instability.

    The physical time-domain radial perturbation is recovered as:

    $$
    \delta v_r(\mathbf{r}, t) = \mathrm{Re}\!\left[\delta\hat{v}_r(\mathbf{r})\, e^{-i\omega t}\right]
    $$

    where $\omega$ is the complex mode eigenfrequency and
    $\delta\hat{v}_r(\mathbf{r})$ is the complex scalar radial eigenfunction
    amplitude. As a complex phasor, it decomposes into the [real
    part](name:radial_perturbed_plasma_velocity_real_part)
    $\mathrm{Re}(\delta\hat{v}_r)$, the in-phase fluid-velocity amplitude, and
    the [imaginary part](name:radial_perturbed_plasma_velocity_imaginary_part)
    $\mathrm{Im}(\delta\hat{v}_r)$, the quadrature component relative to the
    chosen eigenmode phase normalization. The radial plasma displacement
    eigenfunction is related by $\xi_r = \delta\hat{v}_r / (-i\omega)$, linking
    fluid velocity to flux-surface deformation.

    This eigenfunction component is evaluated by linear MHD eigenvalue solvers
    as part of the full toroidal Fourier harmonic decomposition of the perturbed
    velocity field. It contributes to the per_toroidal_mode_perturbed_energy
    alongside poloidal and toroidal velocity components, and couples to
    eigenfunction components such as
    [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    through the linearized momentum equation.

    Sign convention: Positive when the radial fluid motion is directed in the
    direction of increasing major radius $R$.
  unit: m.s^-1

- name: radial_perturbed_plasma_velocity_imaginary_part
  description: |-
    Imaginary part of the complex amplitude of the radial plasma-velocity
    perturbation for toroidal harmonic index n in linear MHD stability analysis.
    Radial denotes the component along the R direction in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    Imaginary part of the complex amplitude of the radial plasma-velocity
    perturbation is the quadrature component of the cylindrical $R$ projection
    of the first-order plasma velocity eigenfunction for a specified toroidal
    harmonic index $n$. The radial projection is along $\hat{R}$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame with basis
    $(\hat{R},\hat{\phi},\hat{Z})$, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The complex radial perturbation amplitude and its contribution to the
    single-mode physical perturbation are represented by

    $$
    \delta v_R^{\mathrm{phys},(n)}(\mathbf{x},t)
    =
    \operatorname{Re}\!\left[
    \left(\delta v_{R,\mathrm{re}}^{(n)}(\mathbf{x})
    +i\,\delta v_{R,\mathrm{im}}^{(n)}(\mathbf{x})\right)
    e^{i(n\phi-\omega t)}
    \right]
    $$

    where $\delta v_{R,\mathrm{im}}^{(n)}$ is this quantity, $\delta
    v_{R,\mathrm{re}}^{(n)}$ is
    [radial_perturbed_plasma_velocity_real_part](name:radial_perturbed_plasma_velocity_real_part),
    $\delta v_R^{\mathrm{phys},(n)}$ is the corresponding real physical
    perturbation component, $\mathbf{x}$ is position, $\phi$ is the toroidal
    angle of that position, $t$ is time, $\omega$ is the complex mode angular
    frequency under the chosen temporal phase convention, $n$ is the integer
    toroidal harmonic index, and $i$ is the imaginary unit.

    The real and imaginary parts together reconstruct the complex radial
    amplitude
    [radial_perturbed_plasma_velocity](name:radial_perturbed_plasma_velocity). A
    change of the arbitrary global eigenmode phase rotates these two parts, so
    this imaginary part is meaningful only with the same phase reference and
    eigenfunction normalization as the other perturbation components. It is the
    cylindrical $R$ component, not a flux-surface-normal component and not a
    component perpendicular to the magnetic field.

    Sign convention: Positive when $\delta v_{R,\mathrm{im}}^{(n)}$ points in
    the $+\hat{R}$ direction of the right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: m.s^-1

- name: radial_perturbed_plasma_velocity_real_part
  description: |-
    In-phase radial fluid-velocity component obtained from the real part of a
    complex linear-MHD perturbation eigenfunction for a specified toroidal
    Fourier mode.
  documentation: |-
    This quantity is the signed, in-phase radial component of the complex
    first-order plasma-velocity eigenfunction. It is the real-part component of
    [radial perturbed plasma velocity](name:radial_perturbed_plasma_velocity),
    not the velocity magnitude or its imaginary quadrature component.

    $$
    v_{r,\mathrm{Re}}(R,Z;n)=\operatorname{Re}\!\left[\tilde{\mathbf{v}}_1(R,Z;n)\cdot\hat{\mathbf{R}}\right]
    $$

    Here $\tilde{\mathbf{v}}_1$ is the complex perturbed plasma-velocity
    eigenfunction, $\hat{\mathbf{R}}$ is the radial unit vector, $R$ is major
    radius, $Z$ is vertical height, and $n$ is the toroidal Fourier mode number,
    all expressed in the right-handed cylindrical $(R,\phi,Z)$ frame. The real
    part depends on the selected eigenmode phase and normalization.

    Sign convention: Positive when the radial perturbation velocity points
    toward increasing major radius $R$.
  unit: m.s^-1

- name: radial_width_of_neoclassical_tearing_mode
  description: |-
    Radial width of a neoclassical tearing mode is the full magnetic-island span
    along the major-radius direction at a specified time.
  documentation: |-
    Width of neoclassical tearing mode

    The full width is defined by

    $$
    w(t) = R_+(t) - R_-(t)
    $$

    where $w$ is the full island width, $t$ is time, and $R_+$ and $R_-$ are the
    larger and smaller major-radius coordinates of the opposite
    island-separatrix intersections along a major-radius line through the island
    center. Major radius $R$ measures distance from the toroidal symmetry axis
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $\phi$ is
    toroidal angle and $Z$ is vertical height.

    The quantity describes an individual mode at each time, not a sum over modes
    or a temporal average. It is the full width, not the half-width. Its value
    at onset is the seed-island width; the same quantity describes the island
    size during subsequent evolution.

    This width is the island-size variable in the generalized Rutherford
    equation. Its [radial-width time
    derivative](name:radial_width_time_derivative_of_neoclassical_tearing_mode)
    is $dw/dt$, which describes instantaneous island growth or shrinkage.
  unit: m

- name: ratio_of_plasma_upper_bound_current_to_plasma_initial_current_due_to_disruption
  description: |-
    Fraction of the pre-disruptive plasma current represented by the upper
    threshold used to define a custom linear current-quench decay interval.
  documentation: |-
    This quantity is the user-defined upper current threshold, expressed as a
    fraction of the pre-disruptive plasma current during a disruption current
    quench.

    $$
    X_2 = \frac{I_{\mathrm{upper}}}{I_{\mathrm{initial}}}
    $$

    where $X_2$ is the upper threshold fraction, $I_{\mathrm{upper}}$ is the
    plasma current at that threshold, and $I_{\mathrm{initial}}$ is the
    pre-disruptive plasma current.

    The threshold is paired with a lower fraction $X_1$ to define a custom
    linear decay interval, whose effective decay time is
    $(t(X_2)-t(X_1))/(X_1-X_2)$; $t(X_j)$ is the time at which the plasma
    current reaches fraction $X_j$ of its pre-disruptive value. This quantity is
    a threshold fraction, not a decay time, unlike the [thermal energy decay
    time due to disruption](name:thermal_energy_decay_time_due_to_disruption).
  unit: '1'

- name: reference_phase
  description: |-
    Reference phase is the signed angular offset that fixes the phase origin of
    a complex oscillatory perturbation relative to a chosen zero-phase
    reference.
  documentation: |-
    Reference phase is the signed angular offset that sets the phase origin for
    a complex oscillatory perturbation relative to a chosen zero-phase
    reference. It parameterizes a phase gage: changing it rotates the complex
    amplitude without changing invariant perturbation properties such as
    magnitude, growth rate, or eigenfunction shape.

    A perturbation quantity $\tilde{q}$ whose zero-phase representation is
    $\tilde{q}_0$ is shifted by the reference phase $\alpha$ as:

    $$
    \tilde{q} = \tilde{q}_0 \exp(i\alpha)
    $$

    where $\alpha$ is the reference phase and $\tilde{q}_0$ is the complex
    perturbation at the chosen zero-phase reference.

    This parent quantity covers reference phases that choose the complex phase
    origin of perturbations, including the [mode reference
    phase](name:mode_reference_phase). It is not a physical propagation phase, a
    geometric position angle, or a phase difference between two independent
    signals unless that phase difference specifically defines the chosen
    reference offset.

    Sign convention: Positive when the applied phase factor advances the
    perturbation by increasing its complex argument relative to the zero-phase
    reference.
  unit: rad

- name: mode_reference_phase
  description: |-
    Mode reference phase is the signed angular offset that sets the complex
    phase origin of an oscillatory mode relative to its zero-phase reference. It
    shifts the represented mode in phase without changing its amplitude,
    frequency, or mode identifiers.
  documentation: |-
    Mode reference phase is the scalar phase offset applied to the complex
    representation of an oscillatory mode to define its phase origin. It is a
    representation parameter for the mode as a whole, not a local value of the
    oscillating physical field.

    A modal perturbation can be represented with the reference phase added to
    the modal phase argument:

    $$
    \delta f(\xi) = \Re\left\{\hat{f}(\xi)\exp\left[i\left(\Theta(\xi,t)+\varphi_\mathrm{ref}\right)\right]\right\}
    $$

    where $\delta f$ is the physical perturbation, $\hat{f}$ is its complex mode
    amplitude, $\Theta$ is the modal phase argument excluding the reference
    offset, and $\varphi_\mathrm{ref}$ is the mode reference phase.

    This quantity fixes the arbitrary complex phase gage of a mode
    representation; it does not define the mode frequency, mode number,
    amplitude, or spatial eigenfunction. The [MHD mode reference
    phase](name:mhd_mode_reference_phase) is the magnetohydrodynamic
    specialization of this generic mode-level quantity.

    Sign convention: Positive when the offset increases the modal phase argument
    in the complex exponential representation.
  unit: rad

- name: mhd_mode_reference_phase
  description: |-
    Signed angular offset that fixes the complex phase of a mode relative to its
    zero-phase reference.
  documentation: |-
    A mode reference phase is the angular offset applied to a complex
    perturbation or eigenfunction to establish its phase relative to a
    zero-phase reference. It specifies phase orientation without defining the
    mode number, amplitude, or geometric position angle.

    For a complex mode amplitude, the reference phase is represented by

    $$
    \tilde{X} = |\tilde{X}| e^{i\phi_{\rm ref}}
    $$

    where $\tilde{X}$ is the complex perturbation amplitude, $|\tilde{X}|$ is
    its magnitude, and $\phi_{\rm ref}$ is the reference phase. The quantity
    generalizes the phase used by
    [linear_mhd_mode_reference_phase](name:linear_mhd_mode_reference_phase) and
    is the phase component of [mode_reference_phase](name:mode_reference_phase).

    Sign convention: Positive when the complex mode phase is advanced in the
    defined angular direction from its zero-phase reference.
  unit: rad

- name: linear_mhd_mode_reference_phase
  description: |-
    Signed angular offset that fixes the phase origin of a linear MHD eigenmode
    relative to its zero-phase complex representation.
  documentation: |-
    A reference phase is a signed angular offset that establishes the phase
    origin of a complex linear magnetohydrodynamic perturbation or eigenmode.
    For a vector of phase components, each component applies to the
    corresponding angular dependence of the mode.

    For one phase component, the offset rotates the zero-phase eigenfunction
    according to

    $$
    \delta\mathbf{X}(\mathbf{x}) = \Re\left\{\hat{\mathbf{X}}(\mathbf{x})e^{i\phi_{\rm ref}}\right\}
    $$

    where $\delta\mathbf{X}$ is the real perturbation, $\hat{\mathbf{X}}$ is its
    zero-phase complex eigenfunction, $\phi_{\rm ref}$ is the reference phase,
    $\mathbf{x}$ is position, $i$ is the imaginary unit, and $\Re$ denotes the
    real part. The quantity is the phase offset itself, not the mode amplitude,
    mode number, or oscillation frequency. Poloidal and toroidal components
    share this definition; the [toroidal linear MHD mode reference
    phase](name:toroidal_linear_mhd_mode_reference_phase) is a concrete toroidal
    instance, while [MHD mode reference phase](name:mhd_mode_reference_phase)
    denotes the broader angular reference.

    Sign convention: Positive when the complex phase is advanced in the positive
    angular direction of the selected mode representation relative to its
    zero-phase reference; for a toroidal component, this is increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$
    is major radius and $Z$ is vertical height.
  unit: rad

- name: rotation_frequency_of_neoclassical_tearing_mode
  description: |-
    Instantaneous angular rate of phase evolution of an individual neoclassical
    tearing mode, with its sign distinguishing phase advance from phase
    regression.
  documentation: |-
    The angular rotation frequency of a neoclassical tearing mode is the
    instantaneous signed rate at which its phase changes. It applies to an
    individual mode, without averaging over modes or over a time interval.

    The defining relation is:

    $$
    \omega_{\mathrm{NTM}}(t) = \frac{d\Phi_{\mathrm{NTM}}(t)}{dt}
    $$

    where $\omega_{\mathrm{NTM}}$ is the mode's angular rotation frequency,
    $\Phi_{\mathrm{NTM}}$ is its [phase](name:neoclassical_tearing_mode_phase),
    followed continuously across complete turns, and $t$ is time.

    This quantity describes mode-pattern phase motion, not the material angular
    velocity of the plasma. It is distinct from the [cyclic rotation
    frequency](name:frequency_of_neoclassical_tearing_mode): when both refer to
    the same rotation phase, the angular rate equals $2\pi$ times the cyclic
    rate. Its time derivative is the [angular acceleration of the
    mode](name:rotation_frequency_time_derivative_of_neoclassical_tearing_mode),
    not the rotation frequency itself.

    Sign convention: Positive when the continuously followed mode phase
    increases with time.
  unit: rad.s^-1

- name: sawtooth_period
  description: |-
    Time interval between successive sawtooth crash events, representing the
    duration of one complete sawtooth oscillation cycle in a tokamak plasma.
  documentation: |-
    The sawtooth period is the elapsed time from one sawtooth crash to the next
    consecutive crash, including the intervening growth and relaxation phases.

    For successive crash times $t_k$ and $t_{k+1}$, the period is defined by

    $$
    T_{\mathrm{st}} = t_{k+1} - t_k
    $$

    where $T_{\mathrm{st}}$ is the sawtooth period and $t_k$ is the time of the
    $k$th crash. The quantity refers to the temporal spacing of consecutive
    crash events, not the duration of the crash itself or the duration of the
    preceding growth phase alone.
  unit: s

- name: toroidal_halo_current
  description: |-
    Toroidal component of the electric current carried by halo plasma on open
    magnetic field lines between the last closed flux surface and first wall
    during a disruption.
  documentation: |-
    Toroidal halo current is the toroidal component of the electric-current
    vector carried by halo plasma on open magnetic field lines between the last
    closed flux surface and the first wall during a disruption. It is the
    toroidal member of the vector quantity [halo current](name:halo_current).

    The component is defined by

    $$
    I_{\phi} = \mathbf{I}_{\mathrm{halo}} \cdot \hat{\phi}
    $$

    where $\mathbf{I}_{\mathrm{halo}}$ is the integrated halo-current vector and
    $\hat{\phi}$ is the toroidal unit vector in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Unlike [poloidal halo
    current](name:poloidal_halo_current), this component measures current along
    the direction of increasing toroidal angle and excludes the poloidal
    component.

    Sign convention: Positive when the halo current flows in the direction of
    increasing toroidal angle $\phi$.
  unit: A

- name: toroidal_impurity_ion_velocity_at_measurement_position
  description: |-
    Toroidal component of the bulk-flow velocity of an impurity-ion population,
    evaluated at a specified measurement position.
  documentation: |-
    The quantity is the impurity-ion bulk-flow velocity projected onto the
    toroidal direction at the specified measurement position. It is a signed
    velocity component in the right-handed cylindrical $(R,\phi,Z)$ frame.

    $$
    v_\phi(\mathbf{x}_m)=\mathbf{v}_{\mathrm{imp}}(\mathbf{x}_m)\cdot\hat{\phi}
    $$

    where $v_\phi$ is the toroidal velocity component, $\mathbf{x}_m$ is the
    measurement position, $\mathbf{v}_{\mathrm{imp}}$ is the bulk velocity of
    the impurity-ion population, and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle $\phi$.

    For an impurity population combined over charge states, the bulk velocity is
    the density-weighted mean over the included charge states. The species and
    charge-state aggregation must be interpreted from the defined population;
    the related [toroidal ion velocity](name:toroidal_ion_velocity) provides the
    corresponding generic ion quantity.

    Sign convention: Positive when the impurity-ion flow points in the direction
    of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_linear_mhd_mode_reference_phase
  description: |-
    Signed angular offset that fixes the complex phase of a linear MHD
    perturbation’s toroidal Fourier mode relative to its zero-phase reference.
  documentation: |-
    The reference phase is the angular offset assigned to the complex
    eigenfunction of a linear MHD perturbation with a specified toroidal
    harmonic. It fixes the mode’s phase origin and is not a spatial displacement
    or amplitude.

    Using the complex-amplitude convention, the toroidal dependence of a
    perturbation quantity is written as:

    $$
    \widetilde{Q}(R,Z,\phi)=\widehat{Q}(R,Z)\exp\!\left[i\left(n\phi+\phi_{\mathrm{ref}}\right)\right]
    $$

    where $\widetilde{Q}$ is the complex perturbation, $\widehat{Q}$ is its
    complex amplitude, $n$ is the dimensionless integer toroidal mode number,
    $\phi$ is toroidal angle, and $\phi_{\mathrm{ref}}$ is the reference phase.
    $R$ and $Z$ are the major-radius and vertical coordinates in the
    right-handed cylindrical $(R,\phi,Z)$ frame. The toroidal harmonic is
    identified by mode number, while its phase is carried by quantities such as
    the [toroidal perturbed plasma magnetic
    field](name:toroidal_perturbed_plasma_magnetic_field).

    The reference phase does not specify perturbation amplitude, growth rate,
    oscillation frequency, or temporal phase.

    Sign convention: Positive when the complex mode phase advances in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.
  unit: rad

- name: toroidal_magnetic_flux_at_halo_boundary
  description: |-
    Signed toroidal magnetic flux through the poloidal cross-section bounded by
    the outermost flux surface of the halo-current region during a disruption.
  documentation: |-
    The toroidal magnetic flux function evaluated on the outermost flux surface
    bounding the halo-current region during a disruption is the net toroidal
    magnetic-field flux through the enclosed poloidal cross-section. It is
    distinct from the [toroidal halo current](name:toroidal_halo_current), which
    describes current rather than magnetic flux.

    The flux is defined by

    $$
    \Phi_{\mathrm{tor}}(\mathcal{A}_h)=\int_{\mathcal{A}_h}\mathbf{B}\cdot\hat{\phi}\,dA=\int_{\mathcal{A}_h}B_{\phi}\,dA
    $$

    where $\mathcal{A}_h$ is the poloidal area enclosed by the halo boundary,
    $\mathbf{B}$ is the magnetic field in tesla, $\hat{\phi}$ is the toroidal
    unit vector, $B_{\phi}$ is its toroidal component, and $dA$ is the poloidal
    area element. The boundary value is the halo-region counterpart of [toroidal
    magnetic flux at the plasma
    boundary](name:toroidal_magnetic_flux_at_plasma_boundary).

    Sign convention: Positive when the toroidal magnetic field points in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: Wb

- name: toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current
  description: |-
    Toroidal magnetic flux at the halo boundary due to poloidal current is the
    signed flux through the poloidal cross-section bounded by the outermost
    halo-region flux surface, retaining only the toroidal magnetic-field
    contribution generated by poloidal halo current. It excludes contributions
    from all other current systems.
  documentation: |-
    Toroidal magnetic flux at the halo boundary due to poloidal current is the
    signed toroidal magnetic flux through the poloidal cross-section bounded by
    the outermost halo-region flux surface. It contains only the magnetic-field
    contribution generated by the
    [poloidal_halo_current](name:poloidal_halo_current), the poloidal component
    of halo current.

    Let $S_h$ be the area enclosed by the halo-boundary contour in a plane of
    constant toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height. With the
    oriented surface element $d\mathbf{S}=+\hat{\phi}\,dA$, the flux is

    $$
    \Phi_{\mathrm{tor},h}^{(\mathrm{pol})} = \int_{S_h} \mathbf{B}_h^{(\mathrm{pol})}\cdot d\mathbf{S} = \int_{S_h} B_{\phi,h}^{(\mathrm{pol})}\,dA
    $$

    where $\Phi_{\mathrm{tor},h}^{(\mathrm{pol})}$ denotes this quantity,
    $\mathbf{B}_h^{(\mathrm{pol})}$ is the magnetic-field contribution from
    poloidal halo current, $B_{\phi,h}^{(\mathrm{pol})}$ is its component along
    $+\hat{\phi}$ in tesla, $d\mathbf{S}$ is the oriented surface element in
    square meters, and $dA$ is the corresponding scalar area element in square
    meters.

    This quantity is the poloidal-current source component of
    [toroidal_magnetic_flux_at_halo_boundary](name:toroidal_magnetic_flux_at_halo_boundary),
    which includes all magnetic-field sources. It excludes toroidal flux
    contributions generated by any current other than poloidal halo current and
    is distinct from
    [poloidal_magnetic_flux_at_halo_boundary](name:poloidal_magnetic_flux_at_halo_boundary),
    which concerns poloidal magnetic flux at the same halo boundary.

    Sign convention: Positive when the magnetic-field contribution generated by
    the poloidal halo current crosses $S_h$ in the $+\hat{\phi}$ direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: Wb

- name: toroidal_perturbed_plasma_velocity
  description: |-
    Toroidal component of the complex first-order plasma velocity perturbation
    eigenfunction in linear MHD stability analysis, encoding the amplitude and
    phase of toroidal bulk plasma oscillation for a specified Fourier mode.
  documentation: |-
    The toroidal perturbed plasma velocity $\delta\hat{v}_\phi$ is the
    projection of the complex vector eigenfunction
    $\delta\hat{\mathbf{v}}(\mathbf{r})$ representing first-order oscillatory
    perturbations of bulk plasma flow in linear MHD onto the $\hat{\phi}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius and $Z$ is vertical height. For each toroidal Fourier harmonic
    $n$, this component captures how the bulk plasma oscillates along the
    toroidal direction about the magnetostatic equilibrium.

    As a complex scalar, it decomposes into real and imaginary parts:

    $$
    \delta\hat{v}_\phi(\mathbf{r}) = \mathrm{Re}[\delta\hat{v}_\phi] + i\,\mathrm{Im}[\delta\hat{v}_\phi]
    $$

    where $\mathrm{Re}[\delta\hat{v}_\phi]$ is given by
    [toroidal_perturbed_plasma_velocity_real_part](name:toroidal_perturbed_plasma_velocity_real_part)
    and $\mathrm{Im}[\delta\hat{v}_\phi]$ by
    [toroidal_perturbed_plasma_velocity_imaginary_part](name:toroidal_perturbed_plasma_velocity_imaginary_part);
    together they encode the spatial amplitude and phase of the toroidal flow
    perturbation for the eigenmode.

    This is the toroidal projection of the full vector eigenfunction described
    by [perturbed_plasma_velocity](name:perturbed_plasma_velocity); analogous
    complex structures exist for radial and poloidal projections, such as
    [radial_perturbed_plasma_velocity_real_part](name:radial_perturbed_plasma_velocity_real_part)
    and
    [poloidal_perturbed_plasma_velocity_real_part](name:poloidal_perturbed_plasma_velocity_real_part).
    The relative magnitudes of toroidal, poloidal, and radial components
    characterize the mode polarization; the eigenfunction is evaluated by linear
    MHD eigenvalue solvers applied to a reconstructed magnetostatic equilibrium.

    Sign convention: Positive when $\delta\hat{v}_\phi$ points in the direction
    of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_perturbed_plasma_velocity_imaginary_part
  description: |-
    Imaginary part of the complex amplitude of the mode-n toroidal
    plasma-velocity perturbation in the right-handed cylindrical (R, φ, Z)
    frame. It is the φ component of a single toroidal Fourier harmonic and is
    not the equilibrium toroidal flow.
  documentation: |-
    The imaginary part of the complex amplitude of the mode-$n$ toroidal
    plasma-velocity perturbation is the coefficient of $i$ in the toroidal
    component of the first-order plasma velocity perturbation for a single
    toroidal Fourier harmonic. The toroidal component is the projection onto
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is
    a perturbation eigenfunction component, not the equilibrium toroidal flow.

    For a harmonic with phase dependence proportional to $e^{i(n\phi-\omega
    t)}$, the full complex toroidal component combines this quantity with the
    matched real part
    [toroidal_perturbed_plasma_velocity_real_part](name:toroidal_perturbed_plasma_velocity_real_part):

    $$
    \delta \hat{v}_{\phi,n}(R,Z) = \delta \hat{\mathbf{v}}_n(R,Z)\cdot\hat{\phi} = \operatorname{Re}\!\left[\delta \hat{v}_{\phi,n}(R,Z)\right] + i\,\operatorname{Im}\!\left[\delta \hat{v}_{\phi,n}(R,Z)\right]
    $$

    where $\delta \hat{\mathbf{v}}_n$ is the complex first-order velocity
    amplitude for toroidal mode number $n$, $\delta \hat{v}_{\phi,n}$ is its
    toroidal projection, $\omega$ is the mode angular frequency in the phase
    factor, and $i$ is the imaginary unit.

    This quantity is defined for one specified toroidal mode number $n$;
    contributions from other toroidal harmonics are excluded. A global phase
    rotation of the eigenfunction changes the split between real and imaginary
    parts, so this component must be interpreted with the matched real part and
    the chosen eigenfunction phase reference.

    Sign convention: Positive when the imaginary coefficient of the toroidal
    velocity perturbation is directed along $\hat{\phi}$, the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  unit: m.s^-1

- name: toroidal_perturbed_plasma_velocity_real_part
  description: |-
    Toroidal perturbed plasma velocity real part is the real part of the complex
    amplitude of the toroidal component of the first-order plasma velocity
    perturbation for a single toroidal Fourier harmonic with mode number n in
    the right-handed cylindrical (R, φ, Z) frame. It is the in-phase
    eigenfunction component relative to the chosen complex phase, not the
    equilibrium toroidal flow.
  documentation: |-
    Toroidal perturbed plasma velocity real part is the real part of the complex
    amplitude of the toroidal component of the first-order plasma velocity
    perturbation for a single toroidal Fourier harmonic with mode number $n$.
    The toroidal component is the projection along $\hat{\boldsymbol{\phi}}$,
    the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is
    vertical height. It represents the in-phase part of the linear
    magnetohydrodynamic perturbation eigenfunction relative to the chosen
    complex phase, not the equilibrium toroidal flow.

    The component is defined by projecting the complex velocity eigenfunction
    for the selected harmonic onto the toroidal basis direction and taking the
    real part:

    $$
    v_{\phi,\mathrm{Re},n}(R,Z) = \operatorname{Re}\!\left[\widetilde{\mathbf v}_n(R,Z)\cdot\hat{\boldsymbol{\phi}}\right]
    $$

    where $v_{\phi,\mathrm{Re},n}$ is this quantity, $\widetilde{\mathbf v}_n$
    is the complex first-order plasma velocity eigenfunction for toroidal mode
    number $n$, $\hat{\boldsymbol{\phi}}$ is the toroidal unit vector, and
    $\operatorname{Re}$ denotes the real part. With toroidal dependence
    proportional to $\exp(i n\phi)$, $i$ is the imaginary unit.

    Together with [toroidal perturbed plasma velocity imaginary
    part](name:toroidal_perturbed_plasma_velocity_imaginary_part), this quantity
    forms the complex toroidal perturbed velocity amplitude. Because a linear
    eigenfunction may be multiplied by an arbitrary complex constant, the
    division into real and imaginary parts depends on the selected normalization
    and phase; the quadrature component is the linked imaginary part, not a
    separate physical velocity direction.

    Sign convention: Positive when the real toroidal velocity component points
    in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: vertical_plasma_velocity
  description: |-
    Vertical component of the bulk plasma center-of-mass velocity along the Z
    direction in the right-handed cylindrical (R, φ, Z) frame, representing
    vertical mass transport of all contributing plasma species.
  documentation: |-
    The vertical plasma velocity is the projection of the bulk [plasma
    velocity](name:plasma_velocity) onto the vertical basis direction $\hat{Z}$
    of the right-handed cylindrical $(R, \phi, Z)$ frame, whose basis is
    $(\hat{R}, \hat{\phi}, \hat{Z})$. It represents the mass-weighted
    center-of-mass flow of all contributing plasma species in the vertical
    direction.

    The projected component is defined by:

    $$
    v_Z = \mathbf{v}_\mathrm{plasma} \cdot \hat{Z}
    $$

    where $v_Z$ is the vertical plasma velocity, $\mathbf{v}_\mathrm{plasma}$ is
    the bulk [plasma velocity](name:plasma_velocity), and $\hat{Z}$ is the
    vertical basis vector of the right-handed cylindrical $(R, \phi, Z)$ frame.

    This quantity applies to the bulk plasma mixture wherever a local fluid
    center-of-mass velocity is defined. It uses the same aggregation convention
    as the parent plasma velocity: species velocities are weighted by mass
    density and combined over all contributing plasma species. It is a scalar
    cylindrical projection, not the full velocity vector, not a vertical
    position or displacement, and not a species-resolved velocity.

    Together with the [radial plasma velocity](name:radial_plasma_velocity) and
    the [toroidal center-of-mass
    velocity](name:toroidal_center_of_mass_velocity), it forms the cylindrical
    component decomposition of the bulk [plasma velocity](name:plasma_velocity).
    The [parallel plasma velocity](name:parallel_plasma_velocity) is a separate
    projection onto the local magnetic-field unit vector $\hat{b}$ and is not
    generally identical to the vertical component.

    Sign convention: Positive when the plasma center-of-mass velocity has a
    component in the $+\hat{Z}$ direction, toward increasing vertical coordinate
    $Z$.
  unit: m.s^-1

- name: vorticity
  description: |-
    Vorticity is the curl of the plasma bulk velocity field, measuring the
    signed local angular rotation of fluid elements. It is the parent quantity
    for radial, toroidal, vertical, and field-aligned projections of that curl.
  documentation: |-
    Vorticity is the curl of the plasma bulk velocity field and represents the
    local rotational content of the single-fluid plasma flow. For solid-body
    rotation it is twice the angular-velocity vector of a fluid element.

    The vorticity field $\boldsymbol{\omega}$ is defined by the curl of the
    plasma bulk velocity field:

    $$
    \boldsymbol{\omega} = \nabla \times \mathbf{v}
    $$

    where $\boldsymbol{\omega}$ is the vorticity field, $\mathbf{v}$ is the
    plasma bulk velocity, and $\nabla \times$ is the curl operator with
    right-handed orientation.

    The scope is the local magnetohydrodynamic plasma bulk-flow field at a point
    in the plasma. The bare name carries no surface, volume, time, species, or
    charge-state aggregation. It is not vorticity magnitude, flow shear, strain
    rate, divergence, or magnetic-field-line twist.

    The unqualified quantity is the parent for scalar directional projections of
    the same curl. [Radial vorticity](name:radial_vorticity), [toroidal
    vorticity](name:toroidal_vorticity), and [vertical
    vorticity](name:vertical_vorticity) are projections onto $\hat{R}$,
    $\hat{\phi}$, and $\hat{Z}$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, respectively; [parallel vorticity](name:parallel_vorticity) is the
    projection along the local magnetic-field direction. The bare name does not
    designate a poloidal projection.

    Sign convention: Positive when $\boldsymbol{\omega}$ has a positive
    projection on the stated scalar direction: $+\hat{R}$, $+\hat{\phi}$, or
    $+\hat{Z}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, or the
    local magnetic-field direction for a field-aligned projection.

    Related quantities: [poloidal_vorticity](name:poloidal_vorticity).
  unit: s^-1

- name: normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  description: |-
    Normalized toroidal-flux surface label evaluated at the sawtooth mixing
    radius, marking the outer boundary of the plasma region homogenized during a
    sawtooth crash.
  documentation: |-
    This quantity is the normalized toroidal magnetic-flux label of the magnetic
    surface passing through the sawtooth mixing radius. It identifies the outer
    boundary of the plasma region homogenized during a sawtooth crash.

    The coordinate is defined by

    $$
    \rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}}) = \left(\frac{\Phi_{\mathrm{tor}}(r_{\mathrm{mix}}) - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}
    $$

    where $\rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}})$ is the normalized
    toroidal flux coordinate at the mixing radius, $r_{\mathrm{mix}}$ is the
    sawtooth mixing radius, $\Phi_{\mathrm{tor}}(r_{\mathrm{mix}})$ is the
    toroidal magnetic flux enclosed by the mixing surface,
    $\Phi_{\mathrm{tor,axis}}$ is the toroidal magnetic flux at the magnetic
    axis, and $\Phi_{\mathrm{tor,boundary}}$ is the toroidal magnetic flux at
    the equilibrium boundary.

    The scope is the single magnetic surface at the sawtooth mixing radius
    within the plasma region affected by the crash. This is a locus-specific
    evaluation of the broader [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate), not a coordinate
    assigned to every magnetic surface, a volume average, or a flux-surface
    average. It is distinct from the corresponding coordinate at the [sawtooth
    inversion
    radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius),
    because the mixing radius and inversion radius represent different sawtooth
    characteristics.
  unit: '1'

- name: normalized_toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  description: |-
    Dimensionless magnetic-surface label locating the resonant flux surface at
    the center of a neoclassical tearing-mode magnetic island.
  documentation: |-
    This quantity is the normalized toroidal-flux label of the magnetic surface
    passing through the center of a neoclassical tearing-mode magnetic island.
    It identifies the island’s resonant surface rather than describing the
    island’s helical phase or radial extent.

    At the island center, the normalized toroidal-flux coordinate is defined by

    $$
    \rho_{\mathrm{tor,norm}} = \left(\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}
    $$

    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal-flux coordinate,
    $\Phi_{\mathrm{tor}}$ is the enclosed toroidal magnetic flux at the island
    center, $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and
    $\Phi_{\mathrm{tor,boundary}}$ is its value at the equilibrium boundary.

    The quantity applies to the center, or resonant-surface location, of one
    specified neoclassical tearing-mode island and is a pointwise
    magnetic-surface label, not an average over the island or a sum over modes.
    It is not a cylindrical radial distance, a local vector component, or the
    unnormalized toroidal-flux radius represented by [toroidal flux coordinate
    at the neoclassical tearing-mode
    center](name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center).

    It is the locus-specific evaluation of the parent [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate) at the neoclassical
    tearing-mode center. The island’s helical orientation is described
    separately by its [neoclassical tearing-mode
    phase](name:neoclassical_tearing_mode_phase).
  unit: '1'

- name: perturbed_vacuum_magnetic_field
  description: |-
    The perturbed vacuum magnetic field is the complex first-order vector
    eigenfunction of the magnetic-field perturbation for a single toroidal
    harmonic in the current-free vacuum region surrounding the plasma. It is
    defined relative to the background vacuum magnetic field and excludes the
    equilibrium field while retaining all spatial components.
  documentation: |-
    The perturbed vacuum magnetic field $\tilde{\delta\mathbf{B}}_\mathrm{vac}$
    is the complex first-order vector eigenfunction of the magnetic-field
    perturbation for a single toroidal harmonic in the current-free exterior
    domain surrounding the plasma. It is defined relative to the background
    [vacuum magnetic field](name:vacuum_magnetic_field), retains all spatial
    components, and excludes the equilibrium field itself.

    For this single-toroidal-mode quantity, the real time-dependent perturbation
    is reconstructed from the complex amplitude by

    $$
    \delta\mathbf{B}_\mathrm{vac}(R,\phi,Z,t) = \operatorname{Re}\!\left[\tilde{\delta\mathbf{B}}_\mathrm{vac}(R,Z)\exp\!\left(i n\phi - i\omega t\right)\right]
    $$

    where $\delta\mathbf{B}_\mathrm{vac}$ is the real magnetic-field
    perturbation, $\tilde{\delta\mathbf{B}}_\mathrm{vac}$ is the complex
    eigenfunction defined here, $(R,\phi,Z)$ is the right-handed cylindrical
    frame with $R$ major radius, $\phi$ the toroidal angle increasing
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ vertical
    height, $t$ is time, $\operatorname{Re}$ takes the real part, $i$ is the
    imaginary unit, $n$ is the [toroidal MHD mode
    number](name:toroidal_mhd_mode_number), and $\omega$ is the angular
    eigenfrequency. The chosen temporal factor fixes the phase convention; using
    the opposite temporal factor complex-conjugates the eigenfunction, and the
    overall complex scale and phase are set only by an explicit normalization.

    In the current-free vacuum domain, absence of free current and magnetic
    monopoles requires
    $\nabla\times\tilde{\delta\mathbf{B}}_\mathrm{vac}=\mathbf{0}$ and
    $\nabla\cdot\tilde{\delta\mathbf{B}}_\mathrm{vac}=0$, where $\nabla$ is the
    spatial derivative operator and $\mathbf{0}$ is the zero vector.
    Equivalently, $\tilde{\delta\mathbf{B}}_\mathrm{vac}=-\nabla\delta\Phi$ with
    $\nabla^2\delta\Phi=0$, where $\delta\Phi$ is the scalar magnetic potential
    of the perturbation; this potential is defined up to an additive constant.
    At the plasma-vacuum interface, the normal component of this vacuum
    perturbation is the exterior counterpart of the plasma-side perturbed
    magnetic field used for interface matching.

    The scope is the current-free vacuum region outside the plasma and inside
    the relevant conducting or far-field boundary; it does not include
    current-carrying plasma regions or free-current regions in material
    structures. The quantity is one complex vector for one toroidal mode number,
    with no averaging over phase, space, or mode number and no summation over
    multiple toroidal harmonics. It is distinct from scalar field strength, from
    the unperturbed [vacuum magnetic field](name:vacuum_magnetic_field), and
    from any real physical perturbation before the normal-mode reconstruction is
    applied.

    The vector decomposes in the right-handed cylindrical $(R,\phi,Z)$ frame as
    projections on $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$; the
    [radial](name:radial_perturbed_vacuum_magnetic_field) and
    [toroidal](name:toroidal_perturbed_vacuum_magnetic_field) quantities are
    component projections of the same complex eigenfunction. The [poloidal
    projection](name:poloidal_perturbed_vacuum_magnetic_field) is defined
    relative to the explicitly chosen flux-coordinate system $(s,\theta,\phi)$
    for that component and is not the cylindrical $Z$ projection. The
    decomposition
    $\tilde{\delta\mathbf{B}}_\mathrm{vac}=\tilde{\delta\mathbf{B}}_{\mathrm{vac},\mathrm{Re}}+i\tilde{\delta\mathbf{B}}_{\mathrm{vac},\mathrm{Im}}$
    separates real and imaginary phase quadratures; component quantities such as
    the [radial real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part), [radial
    imaginary part](name:radial_perturbed_vacuum_magnetic_field_imaginary_part),
    and [poloidal real
    part](name:poloidal_perturbed_vacuum_magnetic_field_real_part) are
    projections or quadratures of this parent vector.

    Sign convention: Positive when a real component projection of the
    reconstructed perturbation points along its positive basis direction, with
    $+\hat{R}$ increasing major radius, $+\hat{\phi}$ increasing toroidal angle
    $\phi$, and $+\hat{Z}$ increasing vertical height in the right-handed
    cylindrical $(R,\phi,Z)$ frame.
  unit: T

- name: poloidal_perturbed_vacuum_magnetic_field
  description: |-
    Complex poloidal component of the first-order magnetic-field perturbation
    eigenfunction in the current-free vacuum region outside the plasma boundary,
    for a single toroidal Fourier mode in linear MHD stability analysis.
  documentation: |-
    The poloidal component of the perturbed vacuum magnetic field is the
    projection of the first-order magnetic-field eigenfunction onto the poloidal
    direction in the current-free exterior region, where $\nabla \times
    \delta\mathbf{B} = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. In this
    vacuum region the perturbation derives from a Laplace-scalar magnetic
    potential, and the poloidal projection is one of the three components
    characterizing the full spatial structure of the eigenfunction. The complex
    representation — its [real
    part](name:poloidal_perturbed_vacuum_magnetic_field_real_part) and
    [imaginary
    part](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part) together
    — encodes amplitude and phase of the mode, arising from the toroidal Fourier
    expansion for a single mode number $n$.

    The poloidal projection is defined as:

    $$
    \delta B_\theta = \delta\mathbf{B}_{\mathrm{vac}} \cdot \hat{\mathbf{e}}_\theta
    $$

    where $\hat{\mathbf{e}}_\theta$ is the poloidal unit vector and
    $\delta\mathbf{B}_{\mathrm{vac}}$ is the full complex first-order vacuum
    magnetic-field perturbation described by the parent
    [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field).

    This component enters the plasma-vacuum interface matching conditions in
    linear stability analysis, coupling the vacuum eigenfunction to the
    plasma-region solution to determine free-boundary MHD stability. It
    complements the toroidal counterpart documented in
    [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    and
    [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part)
    in characterizing the angular structure of the eigenmode outside the plasma.
    The eigenfunction amplitude is normalization-dependent; only its value
    relative to the plasma-region solution carries physical meaning for
    stability assessments.

    Sign convention: Positive when $\delta B_\theta$ points in the direction of
    increasing poloidal angle $\theta$.
  unit: T

- name: poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  description: |-
    Imaginary component of the complex poloidal projection, along the
    increasing-θ tangent in flux coordinates (ρ, θ, φ), of the first-order
    magnetic-field perturbation eigenfunction in the current-free vacuum region
    outside the plasma boundary for a specified toroidal Fourier mode.
  documentation: |-
    Imaginary component of the complex poloidal projection, along the
    increasing-$\theta$ tangent in flux coordinates $(\rho,\theta,\phi)$, of the
    first-order magnetic-field perturbation eigenfunction in the current-free
    vacuum region outside the plasma boundary for a specified toroidal Fourier
    mode. It is a signed scalar magnetic-field amplitude of the complex vacuum
    perturbation.

    The complex poloidal vacuum perturbation amplitude is decomposed into real
    and imaginary parts by:

    $$
    \delta B_{\theta}^{(V)}(\rho,\theta;n) = \operatorname{Re}\{\delta B_{\theta}^{(V)}(\rho,\theta;n)\} + i\,\operatorname{Im}\{\delta B_{\theta}^{(V)}(\rho,\theta;n)\}
    $$

    where $\delta B_{\theta}^{(V)}$ is the component of $\delta\mathbf{B}^{(V)}$
    along the unit poloidal tangent
    $\hat{e}_{\theta}=(\partial\mathbf{x}/\partial\theta)_{\rho,\phi}/|(\partial\mathbf{x}/\partial\theta)_{\rho,\phi}|$
    in flux coordinates $(\rho,\theta,\phi)$, $\mathbf{x}$ is position, $\rho$
    is the selected magnetic-flux-surface label, $\theta$ is the poloidal angle,
    $\phi$ is the toroidal angle, $n$ is the integer toroidal Fourier mode
    number, $i$ is the imaginary unit, and $\operatorname{Re}$ and
    $\operatorname{Im}$ denote the real-part and imaginary-part operators. The
    quantity named here is $\operatorname{Im}\{\delta B_{\theta}^{(V)}\}$, and
    all magnetic-field amplitudes in the equation have units of tesla.

    The superscript $V$ denotes the vacuum-region perturbation and excludes
    perturbations in the plasma region. In that region the first-order
    perturbation is current-free and solenoidal, satisfying
    $\nabla\times\delta\mathbf{B}^{(V)}=0$ and
    $\nabla\cdot\delta\mathbf{B}^{(V)}=0$. This quantity is paired with
    [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part);
    a common complex rescaling of a linear eigenfunction changes absolute
    amplitude and phase but not the component identity defined here.

    Sign convention: Positive when the imaginary part of the poloidal projection
    is directed along the unit tangent for increasing $\theta$ in flux
    coordinates $(\rho,\theta,\phi)$.
  unit: T

- name: poloidal_perturbed_vacuum_magnetic_field_real_part
  description: |-
    Real part of the single-toroidal-mode poloidal perturbed vacuum magnetic
    field, equal to the in-phase projection of the complex first-order vacuum
    magnetic-field perturbation onto the poloidal unit tangent outside the
    plasma.
  documentation: |-
    Real part of the single-toroidal-mode poloidal perturbed vacuum magnetic
    field is the in-phase scalar component of the complex first-order vacuum
    magnetic-field perturbation projected onto the poloidal unit tangent outside
    the plasma. The poloidal unit tangent is defined in a specified
    flux-coordinate system $(\rho,\theta,\phi)$ as the direction of increasing
    poloidal angle $\theta$ at fixed $\rho$ and $\phi$, where $\phi$ is the
    toroidal angle in the right-handed cylindrical $(R,\phi,Z)$ frame with basis
    $(\hat{R},\hat{\phi},\hat{Z})$. This poloidal direction is a local
    flux-coordinate tangent, not a cylindrical-basis direction.

    The real poloidal vacuum perturbation amplitude is defined by projecting the
    complex vacuum perturbation onto the poloidal unit tangent and taking the
    real part:

    $$
    \delta B_{\theta,\mathrm{real}}^{\mathrm{vac}}(\rho,\theta;n) = \operatorname{Re}\!\left[\delta\mathbf{B}^{\mathrm{vac}}(\rho,\theta;n) \cdot \hat{\mathbf{e}}_{\theta}\right]
    $$

    where $\delta B_{\theta,\mathrm{real}}^{\mathrm{vac}}$ is this real poloidal
    vacuum perturbation amplitude, $\delta\mathbf{B}^{\mathrm{vac}}$ is the
    complex first-order [perturbed vacuum magnetic
    field](name:perturbed_vacuum_magnetic_field) amplitude, $n$ is the integer
    toroidal mode number, and $\hat{\mathbf{e}}_{\theta}$ is the poloidal unit
    tangent defined above.

    The vacuum qualifier restricts the quantity to the current-free region
    exterior to the plasma, where the first-order perturbation satisfies
    $\nabla\times\delta\mathbf{B}^{\mathrm{vac}}=0$ and
    $\nabla\cdot\delta\mathbf{B}^{\mathrm{vac}}=0$. For a single toroidal mode,
    the complex poloidal amplitude is reconstructed as $\delta
    B_{\theta}^{\mathrm{vac}}=\delta
    B_{\theta,\mathrm{real}}^{\mathrm{vac}}+i\,\delta
    B_{\theta,\mathrm{imag}}^{\mathrm{vac}}$ and enters the toroidal dependence
    through the factor $\exp(i n\phi)$; this quantity is the real part of that
    mode amplitude, not a poloidal Fourier coefficient. It is distinct from the
    [imaginary-part
    counterpart](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part),
    the [radial](name:radial_perturbed_vacuum_magnetic_field_real_part) and
    [toroidal](name:toroidal_perturbed_vacuum_magnetic_field_real_part) vacuum
    projections, and the corresponding [plasma-region
    component](name:poloidal_perturbed_plasma_magnetic_field_real_part).

    Sign convention: Positive when the in-phase magnetic-field perturbation
    component points along $\hat{\mathbf{e}}_{\theta}$, the unit tangent toward
    increasing poloidal angle $\theta$ at fixed $\rho$ and $\phi$ in the
    specified flux-coordinate system $(\rho,\theta,\phi)$.
  unit: T

- name: radial_perturbed_vacuum_magnetic_field
  description: |-
    Complex first-order radial component of the magnetic-field perturbation
    eigenfunction in the current-free vacuum outside the plasma, forming part of
    a single-toroidal-mode linear MHD perturbation.
  documentation: |-
    The radial component of the perturbed vacuum magnetic field is the
    projection of the complex first-order magnetic-field eigenfunction onto the
    cylindrical radial direction in the current-free exterior region. It is one
    component of the full [perturbed vacuum magnetic
    field](name:perturbed_vacuum_magnetic_field), which satisfies source-free
    Maxwell conditions in the vacuum.

    The component is defined by

    $$
    \delta B_R = \delta\mathbf{B}_\mathrm{vac} \cdot \hat{R}
    $$

    where $\delta\mathbf{B}_\mathrm{vac}$ is the perturbed vacuum magnetic-field
    vector, $\hat{R}$ is the radial unit vector, and $\delta B_R$ is its radial
    projection in the right-handed cylindrical $(R,\phi,Z)$ frame. The radial
    direction means increasing major radius $R$, not the normal to a magnetic
    flux surface.

    The complex value retains the eigenfunction amplitude and phase; its
    in-phase and quadrature coefficients are represented by the [real radial
    component](name:radial_perturbed_vacuum_magnetic_field_real_part) and
    [imaginary radial
    component](name:radial_perturbed_vacuum_magnetic_field_imaginary_part). In
    the current-free vacuum, the perturbation obeys
    $\nabla\times\delta\mathbf{B}_\mathrm{vac}=0$ and
    $\nabla\cdot\delta\mathbf{B}_\mathrm{vac}=0$.

    Sign convention: Positive when the radial component is directed along
    increasing major radius $R$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.
  unit: T

- name: radial_perturbed_vacuum_magnetic_field_imaginary_part
  description: |-
    Imaginary part of the complex radial component of the linearized
    magnetic-field perturbation eigenfunction in the current-free vacuum region
    outside the plasma, for a specified toroidal Fourier mode in linear MHD
    stability analysis.
  documentation: |-
    The imaginary part of the complex radial vacuum magnetic-field perturbation,
    $\delta B_R^{\rm im}$, is the quadrature component of the first-order
    linearized magnetic-field perturbation projected along $+\hat{R}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, in the current-free vacuum
    region surrounding the plasma. In linear MHD stability analysis, perturbed
    fields are cast as complex Fourier harmonics in the toroidal angle $\phi$;
    the imaginary part encodes the phase of the eigenmode relative to the
    normalization reference, together with the [real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part).

    In the vacuum region, $\delta\mathbf{B}$ satisfies $\nabla \times
    \delta\mathbf{B} = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The complex
    radial component decomposes as:

    $$
    \delta\tilde{B}_R^{\rm vac} = \delta B_R^{\rm re} + i\,\delta B_R^{\rm im}
    $$

    where $\delta B_R^{\rm re}$ is the [real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part) and $\delta
    B_R^{\rm im}$ is this imaginary part. The perturbation amplitude is
    $|\delta\tilde{B}_R^{\rm vac}| = \sqrt{(\delta B_R^{\rm re})^2 + (\delta
    B_R^{\rm im})^2}$ and the phase is $\theta = \mathrm{atan2}(\delta B_R^{\rm
    im},\,\delta B_R^{\rm re})$.

    This quantity is computed by linear MHD stability codes for a specified
    toroidal mode number $n$. Matching conditions at the plasma-vacuum interface
    link it to its plasma-region counterpart, the radial plasma imaginary part.
    Alongside [the toroidal vacuum imaginary
    component](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part), it
    characterizes the helical spatial structure of the perturbed vacuum field.
    As with all linear eigenfunctions, the partition between real and imaginary
    parts depends on the phase normalization convention applied to the
    eigenmode.
  unit: T

- name: radial_perturbed_vacuum_magnetic_field_real_part
  description: |-
    Real part of the radial perturbed vacuum magnetic field is the in-phase
    coefficient of the R component in the right-handed cylindrical (R, φ, Z)
    frame for a complex vacuum magnetic-field perturbation eigenfunction of one
    toroidal Fourier harmonic.
  documentation: |-
    Real part of the radial perturbed vacuum magnetic field is the in-phase
    coefficient of the radial component of a complex magnetic-field perturbation
    eigenfunction in the current-free vacuum region outside the plasma for one
    toroidal Fourier harmonic. Radial means projection onto $\hat R$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height; it is not projection
    onto the equilibrium flux-surface-normal direction.

    For a complex harmonic amplitude $\delta\tilde{\mathbf
    B}^{\mathrm{vac}}_n(\mathbf{x})$, with physical perturbation represented by
    $\operatorname{Re}\{\delta\tilde{\mathbf B}^{\mathrm{vac}}_n(\mathbf{x})
    e^{i(n\phi-\omega t)}\}$, this quantity is defined by:

    $$
    \delta B^{\mathrm{vac,Re}}_{R,n}(\mathbf{x}) = \operatorname{Re}\!\left[\delta\tilde{\mathbf B}^{\mathrm{vac}}_n(\mathbf{x}) \cdot \hat R\right]
    $$

    where $\operatorname{Re}$ denotes real part, $n$ is the toroidal mode
    number, $\omega$ is the angular frequency associated with the chosen complex
    representation, $\mathbf{x}$ is position, and $\hat R$ is the radial basis
    vector of the right-handed cylindrical $(R, \phi, Z)$ frame.

    The [imaginary
    counterpart](name:radial_perturbed_vacuum_magnetic_field_imaginary_part) is
    the quadrature coefficient of the same complex radial component, and the two
    together specify the [complex radial vacuum perturbation
    amplitude](name:radial_perturbed_vacuum_magnetic_field) for the chosen
    eigenfunction phase. This vacuum-region quantity is distinct from the
    corresponding plasma-region perturbation; a linear eigenfunction amplitude
    is defined only up to an overall complex normalization unless a separate
    normalization condition is imposed.

    Sign convention: Positive when, at Fourier phase $n\phi-\omega t=0$ for the
    representation above, the vacuum magnetic-field perturbation has a component
    in the $+\hat R$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.
  unit: T

- name: toroidal_perturbed_vacuum_magnetic_field
  description: |-
    Toroidal component of the complex first-order magnetic-field perturbation
    eigenfunction in the current-free vacuum region outside the plasma, resolved
    for a single toroidal Fourier mode number in linear MHD stability analysis.
  documentation: |-
    The toroidal projection $\delta B_\phi = \delta\mathbf{B} \cdot \hat{\phi}$
    of the linearized magnetic-field perturbation in the current-free vacuum
    surrounding the plasma constitutes one scalar component of the full
    perturbed vacuum magnetic-field vector. In the vacuum exterior, $\nabla
    \times \delta\mathbf{B} = 0$, so $\delta\mathbf{B}$ is derivable from a
    scalar magnetic potential satisfying Laplace's equation; the toroidal
    component is determined by matching conditions at the plasma-vacuum
    interface and at any conducting wall boundaries. The eigenfunction is
    complex-valued, and this parent quantity abstracts over its two real-valued
    projections:
    [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    and
    [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part),
    which carry the in-phase and quadrature contributions of the mode structure
    relative to the toroidal reference angle $\phi$. This projection is one
    component of the full
    [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field)
    vector, alongside the poloidal and radial components captured by
    [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part)
    and
    [radial_perturbed_vacuum_magnetic_field_real_part](name:radial_perturbed_vacuum_magnetic_field_real_part).
    Computed by solving the vacuum Maxwell equations exterior to the plasma
    boundary in linear MHD stability analysis; the absolute amplitude is
    normalization-dependent, while the relative phase between vacuum and plasma
    regions carries reconnection information relevant to resistive and
    resistive-wall modes.

    Sign convention: Positive when $\delta B_\phi$ points in the direction of
    increasing toroidal angle $\phi$.
  unit: T

- name: toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  description: |-
    Imaginary part of the complex toroidal component of the first-order
    magnetic-field perturbation eigenfunction in the current-free vacuum region,
    for a specified toroidal mode number in linear MHD stability analysis.
  documentation: |-
    In linear MHD stability analysis for a specified toroidal mode number $n$,
    the first-order magnetic-field perturbation $\delta\mathbf{B}$ in the
    current-free vacuum region surrounding the plasma is a complex eigenfunction
    satisfying $\nabla \times \delta\mathbf{B} = 0$ and $\nabla \cdot
    \delta\mathbf{B} = 0$. This name gives the imaginary part of the toroidal
    projection of that eigenfunction:

    $$
    \delta B_\phi^\mathrm{vac} = \delta\mathbf{B}^\mathrm{vac} \cdot \hat{\phi}
    $$

    where $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    so that $\delta B_\phi^\mathrm{vac} = \mathrm{Re}(\delta
    B_\phi^\mathrm{vac}) + i\,\mathrm{Im}(\delta B_\phi^\mathrm{vac})$.

    The real part is given by
    [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part),
    and together they constitute the parent complex eigenfunction
    [toroidal_perturbed_vacuum_magnetic_field](name:toroidal_perturbed_vacuum_magnetic_field).
    Boundary conditions at the plasma–vacuum interface link this vacuum
    eigenfunction to the corresponding plasma-region toroidal component
    [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part);
    the radial vacuum counterpart is
    [radial_perturbed_vacuum_magnetic_field_imaginary_part](name:radial_perturbed_vacuum_magnetic_field_imaginary_part).
    Absolute eigenfunction amplitudes are normalization-convention-dependent in
    linear stability calculations.

    Sign convention: Positive when $\mathrm{Im}(\delta B_\phi^\mathrm{vac})$ is
    directed in the direction of increasing toroidal angle $\phi$.
  unit: T

- name: toroidal_perturbed_vacuum_magnetic_field_real_part
  description: |-
    In-phase real coefficient of the toroidal magnetic-field perturbation
    eigenfunction in the current-free vacuum surrounding the plasma, resolved
    for one toroidal Fourier mode.
  documentation: |-
    This quantity is the real part of the toroidal component of the first-order
    complex magnetic-field perturbation eigenfunction in the current-free vacuum
    surrounding the plasma. It is one component of the full [toroidal perturbed
    vacuum magnetic field](name:toroidal_perturbed_vacuum_magnetic_field) and
    excludes the equilibrium field and perturbations within the plasma.

    The real coefficient is defined from the complex toroidal perturbation by

    $$
    \delta B_{\phi,\mathrm{R}} = \operatorname{Re}\!\left[\delta B_\phi\right], \qquad \delta B_\phi = \delta\mathbf{B} \cdot \hat{\phi}
    $$

    where $\delta\mathbf{B}$ is the complex first-order perturbed magnetic-field
    vector, $\hat{\phi}$ is the toroidal unit vector, and $\delta
    B_{\phi,\mathrm{R}}$ is its real part. The projection is defined in the
    right-handed cylindrical $(R,\phi,Z)$ frame, and the quantity belongs to the
    specified toroidal Fourier mode; its quadrature counterpart is the
    [imaginary part of the toroidal perturbed vacuum magnetic
    field](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part). In the
    vacuum region, the perturbation is current-free and satisfies $\nabla \times
    \delta\mathbf{B}=0$.

    Sign convention: Positive when the toroidal perturbation component points in
    the direction of increasing toroidal angle $\phi$.
  unit: T

- name: plasma_magnetic_field
  description: |-
    Plasma magnetic-field strength of the local magnetic induction associated
    with the confined plasma, including equilibrium and plasma-interior
    perturbed contributions while excluding the separate vacuum-field
    definition.
  documentation: |-
    The plasma magnetic field $B_{\rm plasma}$ is the scalar magnitude of the
    local [magnetic induction](name:magnetic_field) associated with the confined
    plasma. It represents field strength at a plasma location, including
    equilibrium and plasma-interior perturbed contributions when present, rather
    than retaining vector direction or selecting a signed component.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, its value may be written
    from the components of the associated plasma magnetic-induction vector as

    $$
    B_{\rm plasma}=\left|\mathbf{B}_{\rm plasma}\right|=\sqrt{B_{R,{\rm plasma}}^2+B_{\phi,{\rm plasma}}^2+B_{Z,{\rm plasma}}^2}
    $$

    where $B_{\rm plasma}$ is the plasma magnetic-field strength,
    $\mathbf{B}_{\rm plasma}$ is the local plasma magnetic-induction vector,
    $B_{R,{\rm plasma}}$ is its signed component along increasing major radius
    $R$, $B_{\phi,{\rm plasma}}$ is its signed component along increasing
    toroidal angle $\phi$, and $B_{Z,{\rm plasma}}$ is its signed component
    along increasing vertical height $Z$.

    This quantity applies locally within the confined plasma region and has no
    species population. Its aggregation convention is a point value of
    magnetic-field strength, not a spatial average, flux-surface average, volume
    integral, or finite-volume reduction.

    This scalar magnitude is distinct from the vector [magnetic
    induction](name:magnetic_field) and from component-resolved fields such as
    the [toroidal magnetic field](name:toroidal_magnetic_field), [radial
    magnetic field](name:radial_magnetic_field), and [vertical magnetic
    field](name:vertical_magnetic_field), which retain directional sign. It is
    also distinct from the [vacuum magnetic field](name:vacuum_magnetic_field),
    which excludes plasma-current and plasma-interior contributions, and from
    the [perturbed plasma magnetic field](name:perturbed_plasma_magnetic_field),
    which denotes the perturbation contribution rather than the total local
    plasma-associated field strength.
  unit: T

- name: perturbed_plasma_magnetic_field
  description: |-
    Perturbed plasma magnetic field is the complex linear-MHD eigenfunction, or
    corresponding real perturbation, of the magnetic-field deviation carried by
    the confined-plasma response about an equilibrium field. It excludes
    externally imposed vacuum perturbations when those are represented
    separately.
  documentation: |-
    Perturbed plasma magnetic field is the complex linear-MHD eigenfunction, or
    corresponding real perturbation, of the magnetic-field deviation carried by
    the confined-plasma response about an equilibrium magnetic field. It
    represents magnetic-field bending and current perturbations inside the
    confined plasma and excludes any externally imposed vacuum perturbation that
    is retained as a separate field.

    The plasma-response perturbation is defined by subtracting the equilibrium
    field and any separately represented vacuum perturbation from the total
    field in the confined plasma region:

    $$
    \delta\mathbf{B}_\mathrm{pl}(\mathbf{x},t) = \mathbf{B}(\mathbf{x},t) - \mathbf{B}_0(\mathbf{x}) - \delta\mathbf{B}_\mathrm{vac}(\mathbf{x},t)
    $$

    where $\delta\mathbf{B}_\mathrm{pl}$ is this quantity, $\mathbf{x}$ is
    position, $t$ is time, $\mathbf{B}$ is the total magnetic field,
    $\mathbf{B}_0$ is the equilibrium magnetic field, and
    $\delta\mathbf{B}_\mathrm{vac}$ is the externally imposed vacuum magnetic
    perturbation that would exist without plasma response. If no separate vacuum
    perturbation is present or retained, set $\delta\mathbf{B}_\mathrm{vac}=0$;
    the field satisfies $\nabla\cdot\delta\mathbf{B}_\mathrm{pl}=0$.

    Externally imposed vacuum-field quantities, including
    [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field),
    [radial_non_axisymmetric_magnetic_field](name:radial_non_axisymmetric_magnetic_field),
    and non_axisymmetric_magnetic_field_at_control_surface, can drive the plasma
    response but are not included in $\delta\mathbf{B}_\mathrm{pl}$ when
    represented separately. Fourier harmonic amplitudes, eigenfunction
    components, and spatial projections must carry their stated phase, harmonic,
    and direction definitions; they are not interchangeable with the
    unrestricted vector. The related component quantities
    [radial_perturbed_plasma_magnetic_field](name:radial_perturbed_plasma_magnetic_field),
    [poloidal_perturbed_plasma_magnetic_field](name:poloidal_perturbed_plasma_magnetic_field),
    and
    [toroidal_perturbed_plasma_magnetic_field](name:toroidal_perturbed_plasma_magnetic_field)
    describe resolved quantities: radial is the $\hat{R}$ projection in the
    right-handed cylindrical $(R,\phi,Z)$ frame, poloidal requires an explicitly
    defined poloidal projection direction such as the tangent to increasing
    $\theta$ in flux coordinates $(\rho,\theta,\phi)$, and the toroidal entry
    denotes the single-harmonic $\hat{\phi}$-resolved quantity specified by that
    standard name.

    Sign convention: Positive when a real resolved component of
    $\delta\mathbf{B}_\mathrm{pl}$, or the real part of a complex resolved
    component after applying its stated phase convention, is directed along the
    positive basis direction; in the right-handed cylindrical $(R,\phi,Z)$ frame
    with $\hat{R}\times\hat{\phi}=\hat{Z}$, $+\hat{R}$ is toward increasing
    major radius $R$, $+\hat{\phi}$ is toward increasing toroidal angle $\phi$
    counter-clockwise when viewed from above $+\hat{Z}$, and $+\hat{Z}$ is
    toward increasing vertical height $Z$.
  unit: T

- name: poloidal_perturbed_plasma_magnetic_field
  description: |-
    Poloidal perturbed plasma magnetic field is the poloidal component of the
    complex linear-MHD eigenfunction, or corresponding real perturbation, of the
    magnetic-field deviation carried by the confined-plasma response about
    equilibrium.
  documentation: |-
    Poloidal perturbed plasma magnetic field is the poloidal component of the
    complex linear-MHD eigenfunction, or corresponding real perturbation, of the
    magnetic-field deviation carried by the confined-plasma response about an
    equilibrium magnetic field. It is the poloidal projection of the [perturbed
    plasma magnetic field](name:perturbed_plasma_magnetic_field), rather than
    the unrestricted magnetic-field vector.

    $$
    \delta B_{\mathrm{pol}}(\mathbf{x},t)=\hat{\mathbf e}_{\mathrm{pol}}(\mathbf{x})\cdot\delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t)
    $$

    Here, $\delta B_{\mathrm{pol}}$ is the poloidal component, $\hat{\mathbf
    e}_{\mathrm{pol}}$ is the chosen poloidal unit vector in the poloidal plane
    of the right-handed cylindrical $(R, \phi, Z)$ frame, and
    $\delta\mathbf{B}_{\mathrm{pl}}$ is the plasma-response perturbation after
    subtracting the equilibrium field and any separately represented externally
    imposed vacuum perturbation. The complex quantity includes the [poloidal
    real part](name:poloidal_perturbed_plasma_magnetic_field_real_part) and
    [poloidal imaginary
    part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part); the
    [toroidal perturbed plasma magnetic
    field](name:toroidal_perturbed_plasma_magnetic_field) is its complementary
    toroidal projection.

    Sign convention: Positive when the perturbed magnetic field points in the
    direction of increasing poloidal angle within the poloidal plane of the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: T

- name: poloidal_perturbed_plasma_magnetic_field_imaginary_part
  description: |-
    The imaginary part of the complex poloidal component of the first-order
    perturbed plasma magnetic-field eigenfunction for a single toroidal Fourier
    mode in linear MHD stability analysis.
  documentation: |-
    The imaginary part of the complex poloidal component of the first-order
    perturbed plasma magnetic-field eigenfunction for a single toroidal Fourier
    mode in linear MHD stability analysis is the coefficient of $+i$ in the
    poloidal projection of that eigenfunction. The projection is onto $\hat
    e_\theta$, the local unit direction of increasing poloidal angle $\theta$ in
    the flux-coordinate system $(s,\theta,\phi)$, where $s$ is a radial
    flux-surface label and $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R,\phi,Z)$ frame with $R$ major radius, $Z$ vertical height,
    and $\phi$ increasing counter-clockwise when viewed from above $+\hat Z$.

    For the normal-mode representation with toroidal Fourier factor
    $\exp[i(n\phi-\omega t)]$, the defining relation is:

    $$
    B_{\theta,\mathrm{Im}}(s,\theta) = \operatorname{Im}\!\left\{\tilde{\mathbf{B}}(s,\theta)\cdot\hat e_\theta\right\}
    $$

    where $B_{\theta,\mathrm{Im}}$ is this quantity, $\tilde{\mathbf{B}}$ is the
    complex first-order perturbed plasma magnetic-field eigenfunction,
    $\operatorname{Im}$ extracts the coefficient multiplying $+i$, and $i$ is
    the imaginary unit. The projection $\tilde{\mathbf{B}}\cdot\hat e_\theta$
    and $B_{\theta,\mathrm{Im}}$ have unit T; $n$, $\omega$, and $t$ are the
    integer toroidal mode number, complex angular eigenfrequency, and time,
    respectively.

    This quantity applies to the perturbed magnetic field in the plasma region
    and excludes the corresponding [poloidal perturbed vacuum magnetic field
    imaginary
    part](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part). It is
    the imaginary counterpart of [poloidal perturbed plasma magnetic field real
    part](name:poloidal_perturbed_plasma_magnetic_field_real_part) and, together
    with that real part, specifies the complex [poloidal perturbed plasma
    magnetic field](name:poloidal_perturbed_plasma_magnetic_field) for the
    chosen eigenfunction normalization and overall complex phase; changing that
    phase rotates the real and imaginary parts without changing the physical
    mode.

    Sign convention: Positive when the coefficient multiplying $+i$ in the
    projection of the complex eigenfunction onto the local $+\hat e_\theta$
    direction is positive for the Fourier factor $\exp[i(n\phi-\omega t)]$.
  unit: T

- name: poloidal_perturbed_plasma_magnetic_field_real_part
  description: |-
    Real part of the complex poloidal component of the first-order plasma
    magnetic-field perturbation eigenfunction for a specified toroidal Fourier
    mode in linear MHD stability analysis.
  documentation: |-
    The poloidal perturbed plasma magnetic field real part gives the in-phase
    component of the complex eigenfunction projection $\delta B_\theta =
    \delta\mathbf{B}_\mathrm{pl} \cdot \hat{\mathbf{e}}_\theta$, where
    $\hat{\mathbf{e}}_\theta$ is the poloidal unit vector in flux coordinates
    $(\psi, \theta, \phi)$, with $\psi$ the poloidal magnetic flux, $\theta$ the
    poloidal angle, and $\phi$ the toroidal angle.

    The defining relation is:

    $$
    \mathrm{Re}(\delta B_\theta) = \mathrm{Re}\!\left[\delta\mathbf{B}_\mathrm{pl} \cdot \hat{\mathbf{e}}_\theta\right]
    $$

    where $\delta\mathbf{B}_\mathrm{pl}$ is the first-order plasma
    magnetic-field perturbation eigenfunction for a single toroidal mode number
    $n$ and $\delta B_\theta$ has unit T.

    Together with
    [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part),
    this quantity fully specifies the complex poloidal eigenfunction component.
    The counterpart quantities
    [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and
    [toroidal_perturbed_plasma_magnetic_field_real_part](name:toroidal_perturbed_plasma_magnetic_field_real_part)
    complete the vector decomposition of $\delta\mathbf{B}_\mathrm{pl}$.
    Absolute eigenfunction amplitudes depend on normalization convention;
    physically meaningful results are obtained from spatial ratios between
    components and from plasma-to-vacuum matching against
    [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part).

    Sign convention: Positive when the real part of
    $\delta\mathbf{B}_\mathrm{pl} \cdot \hat{\mathbf{e}}_\theta$ is directed in
    the direction of increasing poloidal angle $\theta$.
  unit: T

- name: radial_perturbed_plasma_magnetic_field
  description: |-
    Radial perturbed plasma magnetic field is the R component of the complex
    linear-MHD plasma-response perturbation in the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    The radial perturbed plasma magnetic field is the major-radius-directed
    component of the complex linear-MHD magnetic-field perturbation
    eigenfunction, or of its corresponding real perturbation, carried by the
    confined plasma. It is the radial projection of the [perturbed plasma
    magnetic field](name:perturbed_plasma_magnetic_field). The right-handed
    cylindrical $(R,\phi,Z)$ frame has $R$ as major radius, $\phi$ as toroidal
    angle, and $Z$ as vertical height.

    The plasma-response component is defined by

    $$
    \delta B_{R,\mathrm{pl}}(\mathbf{x},t) = \delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t) \cdot \hat{\mathbf{R}}
    $$

    where $\delta B_{R,\mathrm{pl}}$ is the radial component,
    $\delta\mathbf{B}_{\mathrm{pl}}$ is the plasma-response magnetic
    perturbation, $\mathbf{x}$ is position, $t$ is time, and $\hat{\mathbf{R}}$
    is the cylindrical major-radius unit vector. For a Fourier-resolved
    eigenfunction, the projection applies to the specified complex harmonic
    coefficient.

    Here radial means the cylindrical $R$ direction, not the normal to an
    equilibrium magnetic flux surface. The component excludes the equilibrium
    field and any separately represented externally imposed vacuum perturbation.
    Together with the [toroidal perturbed plasma magnetic
    field](name:toroidal_perturbed_plasma_magnetic_field), it describes
    directional components of the plasma response; its in-phase component is
    represented by the [radial perturbed plasma magnetic field real
    part](name:radial_perturbed_plasma_magnetic_field_real_part).

    Sign convention: Positive when the magnetic perturbation points toward
    increasing major radius $R$.
  unit: T

- name: radial_perturbed_plasma_magnetic_field_imaginary_part
  description: |-
    Imaginary part of the radial flux-coordinate component of the complex
    first-order perturbed magnetic-field eigenfunction in the confined plasma,
    for a single toroidal Fourier mode in linear MHD stability analysis. It is
    not the cylindrical major-radius component.
  documentation: |-
    Imaginary part of the radial perturbed plasma magnetic field is the
    imaginary component of the complex first-order magnetic-field perturbation
    eigenfunction in the confined plasma. It applies to one toroidal Fourier
    mode in linear MHD stability analysis and to the radial coordinate component
    in the flux-coordinate system $(\rho, \theta, \phi)$.

    The complex radial component is decomposed into real and imaginary parts as:

    $$
    \delta B_{\rho}^{(n)}(\rho,\theta) = \delta B_{\rho,\mathrm{re}}^{(n)}(\rho,\theta) + i\,\delta B_{\rho,\mathrm{im}}^{(n)}(\rho,\theta)
    $$

    where $\delta B_{\rho}^{(n)}$ is the radial flux-coordinate component of the
    complex perturbed magnetic-field eigenfunction for toroidal mode number $n$,
    $\delta B_{\rho,\mathrm{re}}^{(n)}$ is the corresponding [real
    part](name:radial_perturbed_plasma_magnetic_field_real_part), $\delta
    B_{\rho,\mathrm{im}}^{(n)}$ is this quantity, $i$ is the imaginary unit,
    $\rho$ is the radial flux coordinate, and $\theta$ is the poloidal flux
    coordinate.

    The scope is the confined-plasma region for the specified toroidal mode; it
    excludes the perturbed magnetic field in the vacuum region, any sum over
    toroidal mode numbers, and any real-valued instantaneous perturbation
    obtained after applying a toroidal and temporal phase factor. The radial
    direction here is the coordinate direction associated with increasing $\rho$
    in the flux-coordinate system $(\rho,\theta,\phi)$; it is distinct from the
    major-radius $\hat{R}$ direction in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$ is vertical height.
    The quantity is a local eigenfunction component, not a flux-surface average,
    volume integral, or magnitude.

    Together with the [real
    part](name:radial_perturbed_plasma_magnetic_field_real_part), this quantity
    forms the complex radial component $\delta B_{\rho}^{(n)}$. Together with
    the [poloidal](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    and [toroidal](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part)
    imaginary components, it forms the imaginary vector part of the perturbed
    plasma magnetic-field eigenfunction. The overall complex phase of a linear
    eigenfunction is arbitrary, so a phase rotation mixes the real and imaginary
    parts while leaving the represented complex eigenfunction unchanged.

    Sign convention: Positive when the imaginary radial component points toward
    increasing radial flux coordinate $\rho$ in the flux-coordinate system
    $(\rho,\theta,\phi)$ for the adopted complex eigenfunction phase.
  unit: T

- name: radial_perturbed_plasma_magnetic_field_real_part
  description: |-
    Radial perturbed plasma magnetic field real part is the in-phase radial
    component of the complex first-order plasma magnetic-field perturbation for
    one toroidal Fourier harmonic. The radial direction is the R component in
    the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Radial perturbed plasma magnetic field real part is the real part of the
    cylindrical radial component of a complex first-order plasma magnetic-field
    perturbation for a selected toroidal Fourier harmonic. The radial direction
    is the $+\hat{\mathbf{R}}$ basis direction of the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    The defining component is

    $$
    \delta B_{R,n}^{\mathrm{re}} = \operatorname{Re}\!\left(\widetilde{\delta\mathbf{B}}_n \cdot \hat{\mathbf{R}}\right)
    $$

    where $\delta B_{R,n}^{\mathrm{re}}$ is this real component,
    $\widetilde{\delta\mathbf{B}}_n$ is the complex first-order plasma
    magnetic-field perturbation for toroidal Fourier mode number $n$,
    $\operatorname{Re}$ takes the real part, and $\hat{\mathbf{R}}$ is the
    radial basis vector.

    Together with [radial perturbed plasma magnetic field imaginary
    part](name:radial_perturbed_plasma_magnetic_field_imaginary_part), it
    determines the complex [radial perturbed plasma magnetic
    field](name:radial_perturbed_plasma_magnetic_field); changing the chosen
    complex phase of the harmonic rotates the real and imaginary parts without
    changing the represented perturbation. It is the radial component
    counterpart of [toroidal perturbed plasma magnetic
    field](name:toroidal_perturbed_plasma_magnetic_field) and is distinct from a
    flux-surface-normal projection, which would use a unit normal to a specified
    flux coordinate rather than $\hat{\mathbf{R}}$.

    Sign convention: Positive when the in-phase radial perturbation component
    points in the $+\hat{\mathbf{R}}$ direction of increasing major radius $R$.
  unit: T

- name: toroidal_perturbed_plasma_magnetic_field
  description: |-
    Toroidal perturbed plasma magnetic field is the toroidal component of the
    complex linear-MHD magnetic-field perturbation carried by the
    confined-plasma response about equilibrium.
  documentation: |-
    Toroidal perturbed plasma magnetic field is the toroidal component of the
    complex linear-MHD eigenfunction, or corresponding real perturbation, of the
    magnetic-field deviation carried by the confined-plasma response about an
    equilibrium field. It is the toroidal projection of the [perturbed plasma
    magnetic field](name:perturbed_plasma_magnetic_field) and excludes
    separately represented externally imposed vacuum perturbations.

    The toroidal component is defined by

    $$
    \delta B_{\mathrm{pl},\phi}(\mathbf{x},t) = \delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t) \cdot \hat{\boldsymbol{\phi}}
    $$

    where $\delta B_{\mathrm{pl},\phi}$ is the toroidal component,
    $\delta\mathbf{B}_{\mathrm{pl}}$ is the plasma-response perturbation,
    $\mathbf{x}$ is position, $t$ is time, and $\hat{\boldsymbol{\phi}}$ is the
    toroidal unit vector in the right-handed cylindrical $(R,\phi,Z)$ frame with
    oriented basis
    $(\hat{\mathbf{R}},\hat{\boldsymbol{\phi}},\hat{\mathbf{Z}})$. Here $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The response field is
    $\delta\mathbf{B}_{\mathrm{pl}}=\mathbf{B}-\mathbf{B}_0-\delta\mathbf{B}_{\mathrm{vac}}$,
    where $\mathbf{B}$ is total field, $\mathbf{B}_0$ is equilibrium field, and
    $\delta\mathbf{B}_{\mathrm{vac}}$ is a separately represented vacuum
    perturbation. For a specified toroidal Fourier harmonic, the [real
    part](name:toroidal_perturbed_plasma_magnetic_field_real_part) and
    [imaginary
    part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part) are
    phase components of this same toroidal quantity.

    Sign convention: Positive when the corresponding real-valued perturbation
    points in the direction of increasing toroidal angle $\phi$.
  unit: T

- name: toroidal_perturbed_plasma_magnetic_field_imaginary_part
  description: |-
    Imaginary part of the complex toroidal component of the first-order plasma
    magnetic-field perturbation eigenfunction for a single toroidal Fourier mode
    in linear MHD stability analysis.
  documentation: |-
    The toroidal component of the complex plasma magnetic-field perturbation
    eigenfunction $\delta\mathbf{B}$ is the projection $\delta B_\phi =
    \delta\mathbf{B} \cdot \hat{\phi}$ along the toroidal unit vector
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. This
    imaginary part, $\mathrm{Im}(\delta B_\phi)$, together with the [real
    part](name:toroidal_perturbed_plasma_magnetic_field_real_part), fully
    specifies the complex toroidal component of the [perturbed plasma
    magnetic-field](name:perturbed_plasma_magnetic_field) eigenfunction
    associated with a single toroidal mode number $n$ within the confined plasma
    region.

    The full complex toroidal amplitude is decomposed as:

    $$
    \delta B_\phi = \mathrm{Re}(\delta B_\phi) + i\,\mathrm{Im}(\delta B_\phi)
    $$

    where the ratio of imaginary to real parts encodes the spatial phase of the
    perturbation relative to the chosen eigenmode gage convention. The absolute
    magnitude of the eigenfunction is normalization-dependent and is set by the
    stability solver's normalization choice.

    This quantity is defined within the confined plasma region and is computed
    alongside
    [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    and radial_perturbed_plasma_magnetic_field_imaginary_part to fully
    characterize the phase-resolved perturbed magnetic-field vector inside the
    plasma. The vacuum-region counterpart for the same toroidal component is
    [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part).

    Sign convention: Positive when $\mathrm{Im}(\delta B_\phi)$ is directed
    along increasing toroidal angle $\phi$.
  unit: T

- name: toroidal_perturbed_plasma_magnetic_field_real_part
  description: |-
    Toroidal perturbed plasma magnetic-field real part is the in-phase φ
    component, in the right-handed cylindrical (R, φ, Z) frame, of the complex
    first-order plasma magnetic-field perturbation eigenfunction for one
    specified toroidal Fourier harmonic. In this frame, R is major radius, φ is
    toroidal angle, and Z is vertical height.
  documentation: |-
    Toroidal perturbed plasma magnetic-field real part is the real component of
    the toroidal projection of the complex first-order plasma magnetic-field
    perturbation eigenfunction in the plasma region for one specified toroidal
    Fourier harmonic. The toroidal projection is the component along
    $\hat{\phi}$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle increasing counter-clockwise when
    viewed from above $+\hat{Z}$, and $Z$ is vertical height.

    The physical toroidal perturbation associated with the complex eigenfunction
    is represented by

    $$
    \delta B_\phi(R,\phi,Z,t) = \operatorname{Re}\!\left[\delta\tilde{B}_\phi(R,Z)\exp\!\left(i(n\phi-\omega t)\right)\right]
    $$

    where $\delta B_\phi$ is the physical first-order toroidal magnetic-field
    perturbation, $\delta\tilde{B}_\phi$ is the complex toroidal eigenfunction
    amplitude, $\operatorname{Re}$ denotes the real-part operator, $n$ is the
    toroidal mode number, $\omega$ is the mode angular frequency, and $t$ is
    time. This quantity is $\operatorname{Re}[\delta\tilde{B}_\phi(R,Z)]$.

    Together with
    [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part),
    this quantity specifies the complex toroidal perturbation component
    [toroidal_perturbed_plasma_magnetic_field](name:toroidal_perturbed_plasma_magnetic_field)
    for the selected harmonic. It is distinct from the radial and poloidal
    real-part components
    [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and
    [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part),
    from the equilibrium toroidal magnetic field, and from the vacuum-region
    counterpart
    [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part).
    A global complex phase rotation of the eigenfunction changes the split
    between real and imaginary parts while leaving the reconstructed physical
    perturbation unchanged when the same Fourier convention is used.

    Sign convention: Positive when $\operatorname{Re}[\delta\tilde{B}_\phi]$ is
    directed along increasing toroidal angle $\phi$.
  unit: T

- name: plasma_magnetic_vector_potential
  description: |-
    Plasma-associated magnetic vector potential whose curl gives the
    corresponding magnetic induction, including perturbations relative to a
    reference state in a gage-dependent vector representation.
  documentation: |-
    The plasma magnetic vector potential is the gage-dependent vector field
    associated with the magnetic field in the plasma. It retains the complete
    vector quantity rather than selecting a radial, poloidal, toroidal,
    vertical, or field-parallel component.

    The defining relation connecting the vector potential to its associated
    magnetic induction is:

    $$
    \mathbf{B}_{\rm pl} = \nabla \times \mathbf{A}_{\rm pl}
    $$

    where $\mathbf{A}_{\rm pl}$ is the plasma-associated magnetic vector
    potential, $\mathbf{B}_{\rm pl}$ is the corresponding plasma-associated
    magnetic induction, and $\nabla \times$ is the spatial curl operator. Only
    the curl is directly field-defining; $\mathbf{A}_{\rm pl}$ itself depends on
    the chosen gage.

    This parent denotes the full unprojected plasma-associated vector potential
    across equilibrium and perturbed states. It retains its radial, poloidal,
    toroidal, vertical, and field-parallel components as a vector, without
    component averaging, Fourier selection, or magnitude formation. The concrete
    [perturbed plasma magnetic vector
    potential](name:perturbed_plasma_magnetic_vector_potential) represents the
    change in this quantity relative to a reference state.

    The plasma-associated quantity is distinct from the external-source-only
    [vacuum magnetic vector potential](name:vacuum_magnetic_vector_potential).
    Together with the broader [magnetic vector
    potential](name:magnetic_vector_potential), it provides the
    plasma-associated contribution to the magnetic-field description; the vacuum
    quantity instead excludes plasma-current contributions.
  unit: T.m

- name: perturbed_plasma_magnetic_vector_potential
  description: |-
    Vector-potential perturbation associated with a change in the plasma
    magnetic field relative to a reference state, retaining radial, poloidal,
    and toroidal components.
  documentation: |-
    The perturbed plasma magnetic vector potential is the vector-valued
    departure of the plasma magnetic vector potential from its reference state.
    Its curl determines the associated perturbed magnetic field, subject to the
    chosen vector-potential gage.

    The perturbation is defined by

    $$
    \delta \mathbf{A} = \mathbf{A} - \mathbf{A}_{\mathrm{ref}}
    $$

    where $\delta \mathbf{A}$ is the perturbed plasma magnetic vector potential,
    $\mathbf{A}$ is the plasma magnetic vector potential, and
    $\mathbf{A}_{\mathrm{ref}}$ is its reference-state value. The associated
    magnetic-field perturbation satisfies $\delta \mathbf{B} = \nabla \times
    \delta \mathbf{A}$, where $\delta \mathbf{B}$ is the perturbed magnetic
    field and $\nabla$ is the spatial differential operator.

    This quantity denotes the complete perturbation vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height. It includes the radial,
    poloidal, and toroidal components without summing their signed projections.
    The [radial perturbed plasma magnetic vector
    potential](name:radial_perturbed_plasma_magnetic_vector_potential),
    [poloidal perturbed plasma magnetic vector
    potential](name:poloidal_perturbed_plasma_magnetic_vector_potential), and
    [toroidal perturbed plasma magnetic vector
    potential](name:toroidal_perturbed_plasma_magnetic_vector_potential) are
    component-specific instances of this vector quantity.

    The perturbation excludes the reference-state contribution and is distinct
    from the full [plasma magnetic vector
    potential](name:plasma_magnetic_vector_potential), which includes both
    reference and perturbed parts. Because a vector potential is gage-dependent,
    only its curl determines the corresponding magnetic-field perturbation
    uniquely.

    Sign convention: Positive when a resolved component of $\delta \mathbf{A}$
    points along its defined positive radial, poloidal, or toroidal direction in
    the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: T.m

- name: poloidal_perturbed_plasma_magnetic_vector_potential
  description: |-
    Poloidal component of the first-order perturbed plasma magnetic vector
    potential, represented as a linear MHD eigenfunction and distinct from its
    radial and toroidal components.
  documentation: |-
    The poloidal perturbed plasma magnetic vector potential is the poloidal
    component of the first-order departure of the plasma magnetic vector
    potential from its reference state. In linear magnetohydrodynamic
    eigenfunction descriptions, it carries the poloidal part of the
    magnetic-vector-potential perturbation without selecting a real or imaginary
    phase component.

    The perturbed magnetic field associated with the full vector potential
    perturbation satisfies

    $$
    \delta \mathbf{B} = \nabla \times \delta \mathbf{A}
    $$

    where $\delta \mathbf{B}$ is the perturbed plasma magnetic field, $\nabla$
    is the spatial gradient operator, and $\delta \mathbf{A}$ is the full
    perturbed plasma magnetic vector potential. The poloidal component is
    defined in the right-handed cylindrical $(R,\phi,Z)$ frame, with $R$ the
    major-radius coordinate, $\phi$ the toroidal angle, and $Z$ the vertical
    coordinate.

    This quantity is restricted to the poloidal component and is not the
    complete vector potential, its radial component, its toroidal component, or
    the perturbed magnetic field itself. It is also distinct from the
    real-valued specialization [poloidal perturbed plasma magnetic vector
    potential real
    part](name:poloidal_perturbed_plasma_magnetic_vector_potential_real_part),
    which selects one phase component of the corresponding eigenfunction.

    The component is a specialization of the full [perturbed plasma magnetic
    vector potential](name:perturbed_plasma_magnetic_vector_potential); its curl
    contributes to the associated perturbed magnetic field. A gage
    transformation can change the vector-potential representation without
    changing this curl, so the vector-potential component is not uniquely
    identical to a magnetic-field component. The radial component provides an
    adjacent component specialization of the same perturbed-vector-potential
    family.
  unit: T.m

- name: poloidal_perturbed_plasma_magnetic_vector_potential_real_part
  description: |-
    Real-valued poloidal component of the perturbed plasma
    magnetic-vector-potential eigenfunction for a specified toroidal mode in
    linear MHD stability analysis.
  documentation: |-
    This quantity is the real-valued poloidal component of the perturbed plasma
    magnetic vector-potential eigenfunction associated with one toroidal mode of
    a linear MHD perturbation.

    $$
    A_{\mathrm{pol}}^{\mathrm{real}} = \operatorname{Re}\!\left(\widetilde{A}_{\mathrm{pol}}\right)
    $$

    where $A_{\mathrm{pol}}^{\mathrm{real}}$ is the real poloidal component,
    $\widetilde{A}_{\mathrm{pol}}$ is the complex poloidal component of the
    perturbed plasma magnetic vector potential, and $\operatorname{Re}$ is the
    real-part operator.

    The quantity applies to the confined plasma contribution for a specified
    toroidal mode and retains only the poloidal component and real part of the
    complex eigenfunction. It is not the full perturbed vector potential, its
    imaginary component, a magnitude, or a component of the perturbed magnetic
    field.

    The parent [poloidal perturbed plasma magnetic vector
    potential](name:poloidal_perturbed_plasma_magnetic_vector_potential)
    contains the corresponding complex poloidal component before real-part
    extraction. The real and imaginary components together represent the complex
    eigenfunction amplitude; the perturbed magnetic field is obtained from the
    curl of the full perturbed vector potential rather than from this component
    alone.

    Sign convention: Positive when the real component points along the positive
    poloidal basis direction used to define $\widetilde{A}_{\mathrm{pol}}$.
  unit: T.m

- name: radial_perturbed_plasma_magnetic_vector_potential
  description: |-
    Radial component of the first-order perturbed plasma magnetic
    vector-potential eigenfunction for a linear MHD mode, retaining its signed
    projection toward increasing major radius.
  documentation: |-
    Radial component of the first-order perturbed plasma magnetic
    vector-potential eigenfunction associated with a linear MHD mode.

    The radial component is defined by

    $$
    \delta A_R = \delta\mathbf{A} \cdot \hat{\mathbf{R}}
    $$

    where $\delta A_R$ is the radial component, $\delta\mathbf{A}$ is the
    perturbed plasma magnetic vector potential, and $\hat{\mathbf{R}}$ is the
    unit vector toward increasing major radius in the right-handed cylindrical
    $(R,\phi,Z)$ frame.

    This quantity represents one signed component of the plasma perturbation
    about a reference state; it is not the complete vector, a magnitude, a sum,
    or an average. The complete vector quantity is the [perturbed plasma
    magnetic vector potential](name:perturbed_plasma_magnetic_vector_potential),
    while the [poloidal perturbed plasma magnetic vector
    potential](name:poloidal_perturbed_plasma_magnetic_vector_potential)
    provides an adjacent directional component. It includes the full radial
    eigenfunction rather than selecting only its real or imaginary quadrature;
    the latter is represented by the [radial perturbed plasma magnetic vector
    potential imaginary
    part](name:radial_perturbed_plasma_magnetic_vector_potential_imaginary_part).

    The associated perturbed magnetic field $\delta\mathbf{B}$ is obtained from
    the curl relation $\delta\mathbf{B}=\nabla\times\delta\mathbf{A}$, where
    $\delta\mathbf{B}$ is the perturbed magnetic field and $\nabla\times$ is the
    spatial curl operator. The vector potential is gage-dependent, whereas its
    curl determines the corresponding magnetic-field perturbation.

    Sign convention: Positive when $\delta A_R$ points toward increasing major
    radius $R$ in the right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: T.m

- name: radial_perturbed_plasma_magnetic_vector_potential_imaginary_part
  description: |-
    Imaginary part of the radial component of the first-order perturbed
    magnetic-vector-potential eigenfunction describing a confined-plasma MHD
    mode.
  documentation: |-
    This quantity is the imaginary quadrature of the radial component of a
    first-order perturbed magnetic vector potential eigenfunction in the
    confined plasma.

    The complex radial component is decomposed as

    $$
    \widetilde{A}_r = A_{r,\mathrm{R}} + i A_{r,\mathrm{I}}
    $$

    where $\widetilde{A}_r$ is the complex radial component of the perturbed
    magnetic vector potential, $A_{r,\mathrm{R}}$ is its real part,
    $A_{r,\mathrm{I}}$ is its imaginary part, and $i$ is the imaginary unit.
    This quantity is $A_{r,\mathrm{I}}$.

    The definition is restricted to the radial component in the confined plasma
    and to the selected linear MHD eigenfunction; it is not a sum over vector
    components or modes. It excludes the real quadrature and the poloidal and
    toroidal components. Together with the real part, it fully specifies the
    complex component and is the imaginary-part specialization of the [radial
    perturbed plasma magnetic vector
    potential](name:radial_perturbed_plasma_magnetic_vector_potential).
  unit: T.m

- name: toroidal_perturbed_plasma_magnetic_vector_potential
  description: |-
    Toroidal component of the perturbed plasma magnetic vector potential,
    retaining the signed projection along increasing toroidal angle for
    linear-MHD mode representations.
  documentation: |-
    The toroidal component of the perturbed plasma magnetic vector potential is
    the signed projection of the vector-potential perturbation onto the
    geometric toroidal direction within the plasma. It represents the toroidal
    member of the component family derived from the [perturbed plasma magnetic
    vector potential](name:perturbed_plasma_magnetic_vector_potential).

    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the component
    is defined by

    $$
    \delta A_\phi = \delta\mathbf{A} \cdot \hat{\phi}
    $$

    where $\delta A_\phi$ is the toroidal component, $\delta\mathbf{A}$ is the
    perturbed plasma magnetic vector potential, and $\hat{\phi}$ is the unit
    vector in the direction of increasing toroidal angle. The associated
    perturbed magnetic field is determined by $\delta\mathbf{B} = \nabla \times
    \delta\mathbf{A}$, where $\delta\mathbf{B}$ is the perturbed magnetic field
    and $\nabla$ is the spatial gradient operator.

    This quantity applies to the plasma magnetic-vector-potential perturbation
    itself and is a local toroidal component, not a species sum, charge-state
    sum, surface average, or volume average. The vector potential depends on the
    selected gage, whereas its curl gives the gage-invariant magnetic-field
    perturbation. It is distinct from the [toroidal perturbed plasma magnetic
    field](name:toroidal_perturbed_plasma_magnetic_field), which is the toroidal
    component of $\delta\mathbf{B}$ rather than of $\delta\mathbf{A}$. The
    corresponding component construction in another direction is represented by
    the [poloidal perturbed plasma magnetic vector
    potential](name:poloidal_perturbed_plasma_magnetic_vector_potential). For
    complex linear-MHD eigenfunctions, an imaginary-quadrature specialization
    retains only the imaginary part of this toroidal component.

    Sign convention: Positive when $\delta A_\phi$ points in the direction of
    increasing toroidal angle $\phi$.
  unit: T.m

- name: toroidal_perturbed_plasma_magnetic_vector_potential_imaginary_part
  description: |-
    Imaginary quadrature of the complex toroidal magnetic-vector-potential
    perturbation eigenfunction for a linear MHD mode in the plasma.
  documentation: |-
    This quantity is the imaginary quadrature of the first-order perturbed
    magnetic vector potential eigenfunction for a specified linear MHD mode in
    the plasma. It is projected onto the toroidal direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame.

    The defining relation is

    $$
    \delta A_{\phi}^{\mathrm{im}}(\mathbf{x}) = \operatorname{Im}\!\left[\delta A_{\phi}(\mathbf{x})\right]
    $$

    where $\delta A_{\phi}^{\mathrm{im}}$ is the imaginary component,
    $\operatorname{Im}$ extracts the imaginary part, $\delta A_{\phi}$ is the
    complex toroidal component of the perturbed magnetic vector potential, and
    $\mathbf{x}$ is the position in the plasma. Here, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    The quantity applies only to the perturbed plasma eigenfunction and excludes
    equilibrium or unperturbed magnetic-vector-potential contributions. It is
    the imaginary quadrature, not the full complex component and not the
    toroidal component of the perturbed magnetic field. Its sign and magnitude
    depend on the phase convention selected for the complex eigenfunction.

    This quantity is the imaginary-part transformation of the [toroidal
    perturbed plasma magnetic vector
    potential](name:toroidal_perturbed_plasma_magnetic_vector_potential);
    together with the corresponding real quadrature, it reconstructs the complex
    toroidal component. It is distinct from the [toroidal perturbed plasma
    magnetic field imaginary
    part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part), which
    represents a magnetic-field component rather than a vector-potential
    component.
  unit: T.m

- name: plasma_pressure_imaginary_part
  description: |-
    Plasma pressure imaginary part is the scalar coefficient multiplying the
    imaginary unit in a complex representation of isotropic plasma pressure. It
    is a phase-quadrature part of the pressure representation, not the complete
    complex pressure quantity.
  documentation: |-
    Plasma pressure imaginary part is the scalar coefficient multiplying the
    imaginary unit in a complex representation of isotropic plasma pressure. It
    represents the imaginary phase quadrature of that pressure representation
    and is not the complete complex pressure quantity.

    A complex plasma-pressure quantity is decomposed into real and imaginary
    quadratures as:

    $$
    p = p_\mathrm{R} + i\,p_\mathrm{I}
    $$

    where $p$ is the complex plasma-pressure quantity, $i$ is the imaginary
    unit, $p_\mathrm{R}$ is its real-part quadrature, and $p_\mathrm{I}$ is the
    plasma pressure imaginary part defined here.

    This parent quantity applies to any complex scalar representation of
    isotropic plasma pressure. It does not by itself specify perturbation order,
    Fourier mode number, reference phase, eigenfunction normalization, or
    spatial dependence.

    The perturbation-specific [perturbed plasma pressure imaginary
    part](name:perturbed_plasma_pressure_imaginary_part) is a specialization of
    this parent in which $p$ is restricted to the complex first-order
    plasma-pressure perturbation eigenfunction. The quantity is distinct from
    plasma pressure, which denotes the pressure scalar itself rather than the
    imaginary quadrature of a complex representation.

    Sign convention: Positive when the pressure phasor projects onto the $+i$
    direction of the complex plane.
  unit: Pa

- name: perturbed_plasma_pressure_imaginary_part
  description: |-
    Imaginary part of the complex first-order plasma pressure perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability
    analysis.
  documentation: |-
    The perturbed plasma pressure $\tilde{p}$ is the complex scalar
    eigenfunction representing the linearized first-order pressure perturbation
    for a single toroidal mode number $n$ in a linear MHD stability calculation.
    The total pressure decomposes as $p = p_0 +
    \mathrm{Re}[\tilde{p}\,e^{i(n\phi - \omega t)}]$, where $p_0$ is the
    equilibrium pressure profile, $\phi$ is the toroidal angle in the
    right-handed cylindrical $(R, \phi, Z)$ frame, and $\omega$ is the complex
    eigenfrequency.

    This quantity is the imaginary component of $\tilde{p}$ under the standard
    complex decomposition:

    $$
    \tilde{p} = \mathrm{Re}(\tilde{p}) + i\,\mathrm{Im}(\tilde{p})
    $$

    where both $\mathrm{Re}(\tilde{p})$ and $\mathrm{Im}(\tilde{p})$ are
    real-valued scalar fields resolved on the two-dimensional poloidal
    cross-section. Combined with
    [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part),
    this quantity fully specifies the complex pressure perturbation amplitude at
    each grid point for the given mode.

    The imaginary part encodes the local spatial phase of the pressure
    perturbation relative to the phase reference convention of the linear MHD
    eigenvalue solver. Eigenfunction normalization is solver-dependent, so
    absolute amplitudes are physically meaningful only when a normalization
    convention is explicitly fixed. This quantity is structurally analogous to
    [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part)
    and
    [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part),
    which follow the same Fourier decomposition for their respective physical
    scalars.

    Sign convention: Positive when $\mathrm{Im}(\tilde{p}) > 0$ under the
    decomposition $\tilde{p} = \mathrm{Re}(\tilde{p}) +
    i\,\mathrm{Im}(\tilde{p})$ with toroidal Fourier factor $e^{in\phi}$, where
    $\phi$ increases counter-clockwise viewed from above $+\hat{Z}$.
  unit: Pa

- name: plasma_pressure_real_part
  description: |-
    Plasma pressure real part is the real quadrature of a complex scalar
    representation of isotropic plasma pressure. For perturbation
    eigenfunctions, it is the signed real component of the pressure
    perturbation, not the full complex eigenfunction.
  documentation: |-
    Plasma pressure real part is the scalar real quadrature of a complex
    representation of isotropic plasma pressure. It represents the component
    obtained after the phase convention for the complex pressure quantity has
    been fixed, and it is distinct from the complete complex quantity.

    The real part is defined by applying the real-part operator to the
    corresponding complex plasma-pressure quantity:

    $$
    p_R = \operatorname{Re}(\tilde{p})
    $$

    where $p_R$ is the plasma pressure real part, $\tilde{p}$ is the
    corresponding complex scalar plasma-pressure quantity, and
    $\operatorname{Re}$ denotes extraction of the real component.

    This parent quantity is restricted to real-part quantities of isotropic
    plasma pressure and does not by itself specify perturbation order,
    Fourier-mode labeling, phase normalization, or spatial locus. It applies to
    the plasma scalar pressure field; it is not a species-resolved pressure, a
    pressure-tensor component, or an anisotropic-pressure component.

    It excludes the imaginary quadrature, modulus, phase, and complete complex
    pressure quantity. More specific children add the physics qualifier while
    preserving the same real-part operation; for example, [perturbed plasma
    pressure real part](name:perturbed_plasma_pressure_real_part) is the real
    component of a complex first-order plasma-pressure perturbation
    eigenfunction. If the corresponding complex quantity is written as
    $\tilde{p}=p_R+i p_I$, then $p_I$ is its imaginary quadrature and $i$ is the
    imaginary unit, while this name denotes only $p_R$.

    Sign convention: Positive when the selected real quadrature denotes an
    increase of isotropic plasma pressure relative to the reference pressure
    state.
  unit: Pa

- name: perturbed_plasma_pressure_real_part
  description: |-
    Real part of the complex first-order plasma pressure perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability
    analysis.
  documentation: |-
    The real part of the complex pressure perturbation eigenfunction $\tilde{p}$
    gives the in-phase component of the linearized first-order pressure
    variation associated with a given toroidal MHD mode, distributed over the
    poloidal cross-section.

    The full pressure field decomposes as:

    $$
    p = p_0 + \text{Re}\!\left[\tilde{p}(R,Z)\, e^{i(n_\phi \phi - \omega t)}\right]
    $$

    where $p_0$ is the equilibrium pressure profile, $n_\phi$ is the toroidal
    mode number, $\phi$ is the toroidal angle in the right-handed cylindrical
    $(R, \phi, Z)$ frame, and $\omega$ is the complex MHD eigenfrequency. The
    quantity $\text{Re}(\tilde{p})$ is the real component of the parent
    eigenfunction perturbed_plasma_pressure evaluated on the poloidal plane.

    Together with the
    [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part),
    it fully specifies the complex amplitude and phase of $\tilde{p}$; the
    amplitude is $|\tilde{p}| = \sqrt{\text{Re}(\tilde{p})^2 +
    \text{Im}(\tilde{p})^2}$. Analogous real-part eigenfunctions for other
    linearized MHD perturbation quantities include
    [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part)
    and
    [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part).

    This quantity is produced by linear MHD stability solvers as part of the
    eigenvalue problem on the poloidal grid. Because the eigenfunction phase is
    fixed by the solver normalization convention, the absolute sign of
    $\text{Re}(\tilde{p})$ is convention-dependent; only relative magnitudes and
    phase angles among the perturbed quantities in the same eigenfunction carry
    physical content.
  unit: Pa

- name: radial_coordinate_of_active_wall_point
  description: |-
    Major-radius coordinate of the active wall point where the plasma boundary
    contacts the wall, expressed in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    The quantity is the major-radius location of the active wall point, defined
    as the point where the plasma boundary is in contact with the wall. It
    identifies one specific plasma–wall contact location rather than a general
    wall or boundary position.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the coordinate is
    defined from the horizontal Cartesian position of the contact point by

    $$
    R_{\mathrm{active}} = \sqrt{x_{\mathrm{active}}^2+y_{\mathrm{active}}^2}
    $$

    where $R_{\mathrm{active}}$ is the major-radius coordinate, and
    $x_{\mathrm{active}}$ and $y_{\mathrm{active}}$ are the horizontal Cartesian
    coordinates of the active wall point in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis, with $\hat{z}=\hat{Z}$.

    This is a pointwise coordinate for the active wall contact and is neither an
    average nor a coordinate sequence describing a contour. It is a
    locus-specific specialization of
    [radial_coordinate](name:radial_coordinate), retaining the same major-radius
    meaning while fixing the active wall point as its locus. It differs from
    [radial_coordinate_of_closest_wall_point](name:radial_coordinate_of_closest_wall_point),
    which refers specifically to the wall point nearest the plasma boundary, and
    from
    [radial_outline_of_plasma_boundary](name:radial_outline_of_plasma_boundary),
    which describes coordinates along the boundary outline.
  unit: m

- name: toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  description: |-
    Toroidal flux coordinate at the neoclassical tearing mode center, a
    non-negative, radius-like magnetic-surface label derived from enclosed
    toroidal magnetic flux.
  documentation: |-
    Toroidal flux coordinate

    The coordinate is defined by

    $$
    \rho_{\mathrm{tor}} = \sqrt{\Phi/(\pi B_0)}
    $$

    where $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate at the mode
    center, $\Phi$ is the magnitude of the toroidal magnetic flux enclosed by
    the associated surface, and $B_0$ is the positive vacuum toroidal
    magnetic-field strength at the reference major radius.

    This quantity is the [toroidal flux
    coordinate](name:toroidal_flux_coordinate) evaluated at the stated locus,
    not a geometric major radius or a distance from the magnetic axis. It is
    dimensional rather than normalized; its normalized counterpart is obtained
    by dividing it by the [toroidal flux coordinate at the plasma
    boundary](name:toroidal_flux_coordinate_at_plasma_boundary).
  unit: m

- name: volume_averaged_runaway_electron_kinetic_energy_density
  description: |-
    Mean relativistic kinetic energy per unit volume of the runaway electron
    population, obtained by averaging the local kinetic energy density over the
    confined plasma volume.
  documentation: |-
    The volume-averaged runaway electron kinetic energy density is a global
    scalar characterizing the mean suprathermal energy stored per unit volume in
    the runaway electron (RE) population. It is obtained by integrating the
    local relativistic kinetic energy density over the total confined plasma
    volume $V$ and dividing by $V$.

    The underlying local quantity is the relativistic kinetic energy moment of
    the RE distribution function:

    $$
    u_\mathrm{RE}(\mathbf{r}) = \int f_\mathrm{RE}(\mathbf{r}, \mathbf{p})\,(\gamma - 1)\,m_e c^2 \, d^3p
    $$

    where $f_\mathrm{RE}$ is the runaway electron phase-space distribution
    function, $\gamma = (1 + p^2 / m_e^2 c^2)^{1/2}$ is the Lorentz factor,
    $m_e$ is the electron rest mass, $c$ is the speed of light, and $\mathbf{p}$
    is the relativistic momentum. The volume average is then $\langle
    u_\mathrm{RE} \rangle = V^{-1} \int_V u_\mathrm{RE}\,dV$.

    This quantity is evaluated from kinetic or reduced-fluid runaway electron
    models, particularly in disruption current-quench simulations where RE
    populations can reach energies of several to tens of MeV per particle.
    Multiplying by the plasma volume $V$ recovers the total stored relativistic
    energy given by
    [runaway_electron_kinetic_energy](name:runaway_electron_kinetic_energy). The
    local non-averaged counterpart is runaway_electron_kinetic_energy_density,
    and the corresponding global particle number density is
    [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density).
  unit: J.m^-3
