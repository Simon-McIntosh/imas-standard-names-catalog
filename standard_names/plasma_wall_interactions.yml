- name: y_direction_unit_vector_of_camera
  kind: scalar
  status: active
  description: Y-axis component of the direction unit vector defining the line-of-sight
    orientation of a camera, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The direction unit vector $\hat{d}$ of a camera specifies the orientation
    of its line of sight in the right-handed Cartesian $(x, y, z)$ frame. This scalar
    quantity is the projection of $\hat{d}$ onto the $\hat{y}$ axis:


    $$

    \hat{d}_y = \hat{d} \cdot \hat{y}

    $$


    where $|\hat{d}| = 1$ by construction, bounding $\hat{d}_y \in [-1, 1]$. Together
    with the [x-axis component](name:x_direction_unit_vector_of_camera) and [z-axis
    component](name:z_direction_unit_vector_of_camera), it fully determines the three-dimensional
    camera pointing direction. This quantity is distinct from [y_image_up_unit_vector_of_camera](name:y_image_up_unit_vector_of_camera),
    which gives the image-plane vertical orientation perpendicular to the viewing
    direction rather than the viewing direction itself.


    Sign convention: Positive when the camera line-of-sight direction has a component
    in the $+\hat{y}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: '1'
