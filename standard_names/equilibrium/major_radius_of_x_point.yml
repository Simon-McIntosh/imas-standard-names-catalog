name: major_radius_of_x_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of an X-point in the poloidal magnetic flux
  map.
documentation: "The major radius $R_X$ of an X-point is the $R$ coordinate at which\
  \ the poloidal magnetic flux $\\psi$ has a saddle point, i.e., $\\nabla \\psi =\
  \ 0$ with the Hessian having eigenvalues of opposite sign. X-points define the separatrix\
  \ topology; the primary (lower or upper) X-point separates the confined plasma from\
  \ the scrape-off layer and governs divertor geometry. Typical $R_X$ values are 1.0\u2013\
  2.5 m in medium-size tokamaks (ASDEX Upgrade, DIII-D) and approximately 4.5\u2013\
  5.5 m in ITER, generally displaced outward from the magnetic axis by the Shafranov\
  \ shift plus triangularity effects. The X-point location is extracted from equilibrium\
  \ reconstruction (e.g., EFIT, LIUQE) or real-time magnetic control algorithms. See\
  \ `vertical_coordinate_of_x_point` for the companion $Z_X$ coordinate and `elongation_of_plasma_boundary`\
  \ for the boundary shape it influences."
