- name: normalized_mass
  kind: scalar
  status: draft
  description: Normalized species mass, defined as the raw mass divided by a simulation
    reference mass to yield a dimensionless parameter.
  documentation: 'The normalized mass is defined as $\hat{m}_s = m_s / m_{\mathrm{ref}}$,
    where $m_s$ is the mass of species $s$ and $m_{\mathrm{ref}}$ is a reference mass
    chosen for the simulation, often the mass of the main ion species. As a ratio
    of masses, it is always positive for physical particles (i.e., $\hat{m}_s > 0$).
    Typical values range from about $10^{-5}$ (for electrons relative to a deuterium
    reference) to $10^{0}$ (for main ions) and up to $10^{1}$ or higher for impurity
    species (e.g., tungsten). This dimensionless quantity appears naturally in gyrokinetic
    and turbulence simulations, where it controls the species'' response to electromagnetic
    fluctuations through the gyroradius scaling and the polarization term.


    Sign convention: Positive when the raw mass $m_s$ is positive, which holds for
    all physical particles.'
  unit: '1'
  physics_domain: turbulence
  links: []
  sources:
  - id: dd:gyrokinetics/species/mass_norm
    dd_path: gyrokinetics/species/mass_norm
    status: composed
- name: normalized_minor_radius
  kind: scalar
  status: draft
  description: Dimensionless flux-surface label for local gyrokinetic simulations,
    obtained by normalizing the geometric minor radius to a reference value (typically
    the separatrix).
  documentation: "The normalized minor radius $r/a$ labels the flux surface in a local\
    \ gyrokinetic flux-tube simulation, where $r = \\frac{1}{2}(R_{\\mathrm{max}}\
    \ - R_{\\mathrm{min}})$ is the geometric minor radius of the surface and $a$ is\
    \ the reference minor radius (typically the separatrix value). This coordinate\
    \ is used to specify the radial location of the flux-tube domain in gyrokinetic\
    \ turbulence studies such as GENE, GS2, or GYRO. Typical values range from $r/a\
    \ \\approx 0.2$ in the deep core to $\\approx 0.9$ near the pedestal top. The\
    \ quantity is related to [normalized_temperature](name:normalized_temperature)\
    \ and [normalized_density](name:normalized_density) which, together with $r/a$,\
    \ define the local plasma parameters for the simulation. \n\nSign convention:\
    \ Positive when the flux surface is radially outward of the magnetic axis, with\
    \ $r/a = 0$ at the axis and $r/a = 1$ at the separatrix."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_temperature
  - name:normalized_density
