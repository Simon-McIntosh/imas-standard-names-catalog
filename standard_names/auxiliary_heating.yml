- name: frequency_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Operating radio frequency of an ion-cyclotron heating antenna; a non-negative
    scalar that selects the ion cyclotron harmonic and constrains resonance to plasma
    locations with the corresponding magnetic-field magnitude.
  documentation: 'Operating radio frequency of an ion-cyclotron heating antenna is
    the non-negative scalar oscillation frequency of the electromagnetic wave applied
    by the antenna for ion-cyclotron-range heating. It determines which ion cyclotron
    harmonic can resonate and constrains the resonance to locations where the magnetic-field
    magnitude gives the corresponding ion cyclotron frequency.


    For an ion species with charge number $Z_i$ and mass $m_i$, resonance at harmonic
    $n$ satisfies:


    $$

    2\pi f = n\Omega_{ci} = n\frac{Z_i e B}{m_i}

    $$


    where $f$ is the antenna operating frequency, $n$ is a positive integer harmonic
    number, $\Omega_{ci}$ is the ion cyclotron angular frequency, $e$ is the elementary
    charge, and $B$ is the magnetic-field magnitude at the resonant location.


    This quantity is the antenna operating frequency, not the launched power, antenna
    impedance, strap phase, or spatially varying local ion cyclotron frequency. The
    frequency alone does not identify a unique absorption channel when multiple ion
    species or harmonics can satisfy the resonance relation.'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_electron_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-frequency
    dd_documentation:
      leaf: Frequency (average over modules)
