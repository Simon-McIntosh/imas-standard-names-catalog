- name: radiance_of_soft_xray_detector
  kind: scalar
  status: active
  description: Band-integrated electromagnetic radiance incident on a soft X-ray detector,
    equal to radiant power per projected detector area per incident solid angle over
    the detector photon-energy acceptance. It names the common non-energy-differential
    detector radiance, independent of how the accepted band is represented.
  documentation: 'Radiance of a soft-X-ray detector is the band-integrated electromagnetic
    radiance incident on the detector aperture over the detector photon-energy acceptance.
    It is the radiant power carried by accepted soft-X-ray photons per projected detector
    area normal to the incident ray bundle and per incident solid angle.


    The defining differential relation is


    $$

    L = \frac{d^2 P_{\mathcal{B}}}{dA_\perp \, d\Omega}

    $$


    where $L$ is the detector-incident radiance, $P_{\mathcal{B}}$ is the radiant
    power in the detector photon-energy acceptance $\mathcal{B}$, $A_\perp$ is the
    detector area projected perpendicular to the incident ray bundle, and $\Omega$
    is the incident solid angle.


    This quantity is an accepted-band radiance, not a photon-energy-differential spectral
    density, detector responsivity, count rate, or electronic signal. Related names
    such as [spectral radiance of a soft-X-ray detector](name:spectral_radiance_of_soft_xray_detector)
    may indicate that an energy-dependent radiance has been integrated over the detector
    acceptance; because the detector type is already soft-X-ray, that qualifier is
    not an additional soft-X-ray specialization.'
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  - name:spectral_radiance_of_soft_xray_detector
  - name:power_of_soft_xray_detector
- name: radius_of_bragg_crystal
  kind: scalar
  status: active
  description: Geometric distance from the center of a circular Bragg-crystal aperture
    to the edge of its active diffracting surface.
  documentation: 'The Bragg-crystal aperture radius is the transverse geometric extent
    of the circular active diffracting surface, measured from its center to its circumferential
    edge. It describes aperture size rather than the curvature of the crystal substrate.


    For a boundary point of the aperture, the radius is defined by


    $$

    r_{\mathrm{ap}} = \left\lVert \mathbf{x}_{\mathrm{edge}} - \mathbf{x}_{\mathrm{center}}
    \right\rVert

    $$


    where $r_{\mathrm{ap}}$ is the aperture radius, and $\mathbf{x}_{\mathrm{edge}}$
    and $\mathbf{x}_{\mathrm{center}}$ are position vectors in the aperture plane,
    with $r_{\mathrm{ap}}$ expressed in meters.


    For an ideal circular aperture, this distance is the same for every boundary point.
    It is analogous to the [radius of a diagnostic aperture](name:radius_of_diagnostic_aperture),
    but must not be confused with the [toroidal curvature of the Bragg crystal](name:toroidal_curvature_of_bragg_crystal)
    or its [vertical curvature](name:vertical_curvature_of_bragg_crystal).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
  - name:vertical_curvature_of_bragg_crystal
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/radius
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-radius
