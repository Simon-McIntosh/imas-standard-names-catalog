- name: coulomb_logarithm
  kind: scalar
  status: draft
  description: Dimensionless factor quantifying the effectiveness of Coulomb collisions
    in a plasma, defined as the natural logarithm of the ratio of the Debye length
    to the impact parameter for 90-degree deflection. It characterizes the relative
    importance of small-angle versus large-angle scattering events.
  documentation: The Coulomb logarithm $\ln \Lambda$ is a fundamental parameter in
    plasma physics that determines the effectiveness of small-angle Coulomb collisions
    relative to large-angle scattering. It is defined as $\ln \Lambda = \ln\left(\frac{b_{\max}}{b_{\min}}\right)$,
    where $b_{\max} \approx \lambda_D$ is the Debye length (maximum impact parameter
    for collective shielding, in meters) and $b_{\min}$ is the characteristic impact
    parameter for 90-degree deflection (in meters). For thermal electrons and ions,
    $b_{\min} \approx \frac{Z e^2}{k_B T}$, where $Z$ is the charge number, $e$ is
    the elementary charge, $k_B$ is the Boltzmann constant, and $T$ is the temperature
    (in keV). In fusion plasmas, $\ln \Lambda$ typically ranges from 10 to 20, decreasing
    with higher density and temperature. The Coulomb logarithm appears in expressions
    for the Spitzer resistivity, electron-ion energy equilibration rate, and collision
    frequencies Boosting the resistive current ramp-up rate and the electron-ion temperature
    equilibration timescale during plasma initiation. The value is always positive
    for classical plasmas where $\lambda_D \gg b_{\min}$.
  unit: '1'
  physics_domain: transport
  links:
  - name:effective_charge
  sources:
  - id: dd:plasma_initiation/global_quantities/coulomb_logarithm
    dd_path: plasma_initiation/global_quantities/coulomb_logarithm
    status: composed
  - id: dd:plasma_initiation/global_quantities/coulomb_logarithm/data
    dd_path: plasma_initiation/global_quantities/coulomb_logarithm/data
    status: composed
- name: effective_charge
  kind: scalar
  status: draft
  description: Density-weighted mean ionic charge state of the plasma, quantifying
    the impurity content relative to the electron density.
  documentation: 'The effective ionic charge $Z_{\text{eff}}$ is defined as $Z_{\text{eff}}
    = \sum_i n_i Z_i^2 / n_e$, where $n_i$ is the density of ion species $i$ with
    charge $Z_i$ and $n_e$ is the electron density. It is a key metric for plasma
    purity, as higher $Z_{\text{eff}}$ indicates increased impurity content, which
    enhances radiative power losses and dilutes the fuel. A value of $Z_{\text{eff}}
    = 1$ corresponds to a pure hydrogenic plasma. In tokamak scrape-off layers and
    divertor regions, $Z_{\text{eff}}$ is typically elevated due to erosion of plasma-facing
    components. This quantity is routinely inferred from visible bremsstrahlung measurements
    and from charge-exchange recombination spectroscopy. It is related to the [ion_charge](name:ion_charge)
    of each species and to the [electron_density](name:electron_density) via the quasi-neutrality
    condition.


    Sign convention: Positive when plasma impurity content produces a net positive
    charge balance.


    Typical values in fusion plasmas range from 1.0 to 3.0 in the core, and can exceed
    5.0 in the divertor region during detached conditions.'
  unit: '1'
  physics_domain: transport
  links:
