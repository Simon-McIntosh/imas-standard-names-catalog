name: vertical_component_of_current_density_due_to_parallel_viscosity
description: Vertical ($Z$) projection of the current density driven by the parallel
  (field-aligned) component of the viscosity tensor.
documentation: "This quantity represents the $Z$-component of the current density\
  \ $\\mathbf{j}_{\\|,\\mathrm{visc}}$ generated by the parallel viscous stress $\\\
  pi_{\\|}$ in the momentum balance. Parallel viscosity in a magnetized plasma arises\
  \ from the anisotropy of the pressure tensor along the magnetic field direction\
  \ $\\hat{b}$: $\\pi_{\\|} = p_{\\|} - p_{\\perp}$, where $p_{\\|}$ and $p_{\\perp}$\
  \ are the parallel and perpendicular pressures. The resulting current density contribution\
  \ scales as $j_{\\|,\\mathrm{visc}} \\sim \\nabla \\cdot (\\pi_{\\|} \\hat{b}\\\
  hat{b}) / (n_e e)$, where $n_e$ is the electron density and $e$ the elementary charge.\
  \ In tokamak edge plasmas this term can become significant where magnetic field-line\
  \ pitch varies rapidly (e.g., near the X-point). Evaluated on generalized grids\
  \ in edge transport codes, typical magnitudes are $10^{2}$\u2013$10^{4}$ A m$^{-2}$\
  \ in the divertor region. See `parallel_component_of_ion_momentum_diffusivity` for\
  \ the related transport coefficient and the companion viscosity-driven current components\
  \ for the perpendicular and heat-flux contributions."
kind: vector_component
unit: A.m^-2
status: draft
