name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  
  build:
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - name: Build catalog.db
        run: |
          uv run standard-names build "$PWD/standard_names/" --db standard_names/.catalog/catalog.db
          mkdir -p src/imas_standard_names_catalog
          cp standard_names/.catalog/catalog.db src/imas_standard_names_catalog/catalog.db
      
      - name: Create standard_names.zip
        run: zip -r standard_names.zip standard_names/
      
      - name: Build Python wheel
        run: uv build
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            standard_names/.catalog/catalog.db
            standard_names.zip
            dist/*.whl
          body: |
            ## IMAS Standard Names Catalog ${{ github.ref_name }}
            
            ### Installation
            
            **Python:**
            ```bash
            pip install imas-standard-names-catalog
            ```
            
            ```python
            from imas_standard_names_catalog import get_catalog_db
            db_path = get_catalog_db()
            ```
            
            **Other languages:**
            Download `catalog.db` or `standard_names.zip` from assets below.
