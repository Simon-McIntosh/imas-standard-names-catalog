name: electron_scrape_off_layer_temperature_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the electron temperature mapped to
  the outboard midplane in the scrape-off layer.
documentation: "The electron temperature decay length $\\lambda_{T_e}$ (in m) is the\
  \ radial e-folding distance over which $T_e$ decreases in the scrape-off layer (SOL),\
  \ mapped to the outboard midplane. Under conduction-limited SOL conditions the heat-flux\
  \ decay length and temperature decay length are related by $\\lambda_{q,e} \\approx\
  \ \\frac{2}{7} \\lambda_{T_e}$ for Spitzer conductivity, making $\\lambda_{T_e}$\
  \ broader than $\\lambda_{q,e}$. Typical values range from 5\u201320 mm at the midplane\
  \ in H-mode tokamaks. The quantity is measured by Thomson scattering, Langmuir probes,\
  \ or ECE in the SOL and is used to parameterize 2-point model analyses. The ratio\
  \ $\\lambda_{T_e} / \\lambda_{n_e}$ encodes the relative importance of conductive\
  \ versus convective transport. See also `electron_heat_flux_decay_length_in_scrape_off_layer`\
  \ and `electron_density_decay_length_in_scrape_off_layer`."
