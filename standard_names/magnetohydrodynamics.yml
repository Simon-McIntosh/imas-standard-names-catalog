- name: electron_temperature
  kind: scalar
  status: active
  description: Thermal energy of the bulk electron population expressed as an energy-equivalent
    temperature determined by its random kinetic-energy distribution.
  documentation: 'Electron temperature is the energy-equivalent measure of the mean
    random kinetic energy of the bulk electron population.


    For an isotropic electron population, the defining relation is:


    $$

    T_e = \frac{2}{3}\langle E_e \rangle

    $$


    where $T_e$ is the electron temperature expressed as energy, and $\langle E_e
    \rangle$ is the mean random kinetic energy per electron.


    This is an intensive quantity for the electron population, not a sum of electron
    energies. It may be defined locally or after a specified spatial average, including
    the chord average represented by [line-averaged electron temperature](name:line_averaged_electron_temperature)
    and the confined-volume average represented by [volume-averaged electron temperature](name:volume_averaged_electron_temperature).
    It excludes ion populations and does not itself represent total electron energy
    or electron pressure.


    Electron temperature is related to [total electron pressure](name:total_electron_pressure)
    through the electron velocity-space moments; pressure additionally includes the
    electron number-density weighting. It is distinct from [ion charge-state temperature](name:ion_charge_state_temperature),
    which characterizes ions in a specified charge state.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
