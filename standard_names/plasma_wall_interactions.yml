    status: composed
- name: effective_charge_at_limiter
  kind: scalar
  status: draft
  description: Effective charge number of the ion mixture in the boundary plasma at
    the limiter, quantifying the degree of impurity contamination at this plasma-facing
    surface.
  documentation: 'The effective charge $Z_\text{eff}$ at the limiter is the charge-squared-weighted
    average ion charge of the plasma species in the scrape-off layer immediately adjacent
    to the limiter surface. It captures the aggregate effect of all impurity species
    on plasma resistivity and radiation behavior without resolving individual impurity
    charge states.


    The quantity is defined by


    $$

    Z_\text{eff} = \frac{\sum_i n_i Z_i^2}{n_e}

    $$


    where $n_i$ is the number density of ion species $i$ with integer charge number
    $Z_i$, and $n_e = \sum_i n_i Z_i$ is the electron density enforced by quasi-neutrality.
    For a pure hydrogen-isotope plasma, $Z_\text{eff} = 1$; impurity ions with $Z_i
    > 1$ raise the value above unity.


    At the limiter, $Z_\text{eff}$ is typically elevated compared to the core because
    sputtered wall material and recycled impurities concentrate near the plasma-facing
    surface. Typical values range from 1.5 to 4 in limiter-configuration plasmas,
    depending on the wall material (beryllium, carbon, or tungsten) and fueling conditions.
    This local value complements [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary)
    and [effective_charge_at_divertor_target](name:effective_charge_at_divertor_target),
    which quantify $Z_\text{eff}$ at other boundary reference locations. It is inferred
    from the ratio of total Bremsstrahlung emissivity to the square of the electron
    density integrated along lines of sight through the boundary plasma, or from spectroscopic
    resolution of individual impurity charge states.


    Sign convention: Positive for any plasma consisting of positively charged ions
    and electrons satisfying quasi-neutral balance.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:effective_charge_at_plasma_boundary
  - name:effective_charge_at_divertor_target
  sources:
  - id: dd:summary/local/limiter/zeff/value
    dd_path: summary/local/limiter/zeff/value
    status: composed
- name: electron_density_at_limiter
  kind: scalar
  status: draft
  description: Electron number density in the plasma immediately adjacent to a limiter
    surface, evaluated on the plasma side near the magnetic presheath or sheath entrance.
    It characterizes scrape-off-layer plasma contacting the limiter, not the separatrix
    density at the confined-plasma boundary.
  documentation: 'Electron density at a limiter is the local number of free electrons
    per unit volume in the plasma immediately upstream of a limiter material surface.
    It describes the scrape-off-layer or edge plasma that intersects the limiter and
    helps determine local sheath behavior, recycling, and particle fluxes. It is distinct
    from electron density at the plasma boundary, which refers to the separatrix between
    confined plasma and the scrape-off layer.


    The local electron number density is defined by the electron population contained
    in a small volume element:


    $$

    n_e = \frac{dN_e}{dV}

    $$


    where $n_e$ is the electron density, $N_e$ is the dimensionless number of electrons,
    and $V$ is volume in m$^3$.


    In practice this quantity may be obtained from limiter or edge Langmuir-probe
    analysis, from spectroscopic or microwave diagnostics with suitable spatial localization,
    or from edge plasma modeling constrained by measurements. If inferred from ion-saturation
    current or sheath-transmission relations, the result depends on assumptions about
    sheath physics, electron temperature, ion species, magnetic incidence angle, and
    probe geometry; such relations are diagnostic models and are not the definition
    of the density.


    Physically valid values satisfy $n_e \ge 0$. Typical limiter-adjacent scrape-off-layer
    densities are about $10^{17}$-$10^{20}$ m$^{-3}$, with lower values in tenuous
    far-SOL conditions and higher values near strong plasma-wall contact, high fueling,
    or detached or highly recycling edge conditions.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:electron_density_at_plasma_boundary
  - name:electron_temperature_at_limiter
  arguments:
  - name: density_at_limiter
    operator: electron
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_e/value
    dd_path: summary/local/limiter/n_e/value
    status: composed
- name: electron_source_rate_due_to_surface_emission
  kind: scalar
  status: draft
  description: Rate at which material released from plasma-facing surfaces by recycling,
    outgassing, and physical or chemical sputtering supplies electrons to the plasma
    after ionization, summed over all emitting surfaces and weighted by the number
    of electrons each released species contributes. It is the electron-equivalent
    surface-emission source and is non-negative by construction.
  documentation: 'Electron source rate due to surface emission is the wall-emission
    contribution to the global electron particle balance: the number of electron-equivalent
    particles supplied to the plasma per unit time by material released from plasma-facing
    surfaces. Surface emission collects all release channels \fed by plasma-surface
    interaction, including recycling (prompt return of incident plasma ions as neutrals),
    outgassing (delayed release of retained fuel from the wall bulk), and physical
    and chemical sputtering of wall material. Each emitted atom, molecule, or impurity
    is weighted by the number of electrons it contributes once ionized, so the quantity
    is an all-species, all-surface electron source. It is the electron-specific form
    of source_rate_due_to_surface_emission and one component of [total_electron_source_rate](name:total_electron_source_rate);
    the corresponding electron loss to the wall is the separate incident channel total_incident_electron_particle_flux_at_wall.


    The global rate is obtained by integrating the emitted particle flux density over
    all plasma-facing surface area, with each released species weighted by its electron
    yield on full ionization:


    $$

    S_e = \int_{A_\mathrm{pf}} \sum_{s} Z_s \, \Gamma_{s}^{\mathrm{emit}}(\mathbf{x})
    \, dA

    $$


    where $A_\mathrm{pf}$ is the total plasma-facing surface area, $\Gamma_{s}^{\mathrm{emit}}$
    is the emitted particle flux density of released species $s$ (atoms, molecules,
    or impurity species) in $\mathrm{m^{-2}\,s^{-1}}$, $Z_s$ is the number of electrons
    that species $s$ liberates when fully ionized in the plasma, $\mathbf{x}$ labels
    position on the surface, and $S_e$ is in $\mathrm{s^{-1}}$. The species sum aggregates
    fuel and impurity contributions; for pure hydrogenic recycling $Z_s$ reduces to
    the number of nuclei per emitted neutral.


    In practice the rate is inferred from particle-balance analysis combining plasma
    density evolution with fueling and pumping data, from neutral pressure and spectroscopy
    measurements, from wall outgassing and recycling-coefficient estimates, and from
    edge-plasma or neutral-transport modeling. The calculation should include material
    emitted from all limiters, divertor targets, first-wall panels, and other plasma-facing
    components that returns toward the plasma.


    Typical magnitudes are strongly scenario dependent, often ranging from roughly
    $10^{20}$ to $10^{24}\,\mathrm{s^{-1}}$ and increasing with plasma density, recycling
    fraction, and impurity production. The value approaches zero when surfaces are
    not releasing material into the plasma and is largest under high-recycling divertor
    conditions in large, strongly fueled discharges.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:total_electron_source_rate
  sources:
  - id: dd:wall/global_quantities/electrons/particle_flux_from_wall
    dd_path: wall/global_quantities/electrons/particle_flux_from_wall
    status: composed
- name: electron_temperature_at_limiter
  kind: scalar
  status: draft
  description: Local electron temperature at the plasma-wall interface on the plasma-facing
    side of a limiter, where open scrape-off-layer field lines terminate on material
    surfaces.
  documentation: 'Electron temperature at the limiter is the local temperature of
    the electron population on the plasma-facing side of a limiter surface, at the
    plasma-wall interface where open scrape-off-layer magnetic field lines intersect
    material structures. It characterizes the electron thermal energy available for
    sheath formation, recycling, and plasma-surface interaction, and is not the temperature
    of the solid limiter.


    For an isotropic Maxwellian, or a scalar moment-equivalent electron distribution,
    the value expressed in electronvolts is related to the random kinetic energy per
    electron by:


    $$

    T_e = \frac{2}{3e}\left\langle \frac{1}{2} m_e |\mathbf{v}-\mathbf{u}_e|^2 \right\rangle

    $$


    where $m_e$ is the electron mass in kg, $\mathbf{v}$ is the electron velocity
    in $m\,s^{-1}$, $\mathbf{u}_e$ is the local mean electron flow velocity in $m\,s^{-1}$,
    angle brackets denote an average over the local electron velocity distribution
    at the limiter-side plasma, and $e$ is the elementary-charge energy conversion
    factor in $J\,eV^{-1}$. The kinetic-energy moment is in joules, so division by
    $e$ gives $T_e$ in eV; for non-Maxwellian distributions the reported scalar value
    is an effective or moment temperature.


    In experiments, this quantity is commonly inferred from Langmuir-probe current-voltage
    characteristics at or near the limiter surface, local edge spectroscopy, Thomson
    scattering where spatial access is available, or scrape-off-layer modeling constrained
    by edge and wall measurements. Probe and sheath interpretations usually assume
    a quasineutral sheath-edge plasma, a specified electron energy distribution, and
    corrections for magnetic-field incidence angle, collisionality, secondary electron
    emission, and surface conditions. When combined with [electron density at the
    limiter](name:electron_density_at_limiter), derived quantities must convert eV
    to joules; for example, the electron pressure estimate $p_e = e n_e T_e$ uses
    $n_e$ in $m^{-3}$, $T_e$ in eV, $e$ in $J\,eV^{-1}$, and gives $p_e$ in Pa. Sheath
    heat-flux or sound-speed estimates additionally require explicit assumptions for
    ion mass, charge state, ion temperature, sheath transmission coefficients, and
    the electron distribution.


    Typical limiter-side electron temperatures are 1-5 eV in cold, strongly recycling
    edge plasmas, 5-50 eV in many attached limiter scrape-off-layer conditions, and
    50-200 eV in hot near-limiter or transient high-power phases. The appropriate
    value can vary strongly over a few millimeters near the material surface because
    of parallel heat conduction, recycling neutrals, sheath physics, and impurity
    radiation.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_temperature_at_divertor_target
  - name:electron_temperature_at_wall
  - name:ion_average_temperature_at_limiter
  sources:
  - id: dd:summary/local/limiter/t_e/value
    dd_path: summary/local/limiter/t_e/value
    status: composed
- name: energy_flux_at_wall
  kind: scalar
  status: draft
  description: Total energy flux density incident on a plasma-facing wall surface,
    equal to the sum of contributing particle, photon, and electromagnetic power fluxes
    per unit area.
  documentation: 'Energy flux at the wall is the local power per unit area delivered
    to a plasma-facing surface by plasma, neutral, radiative, and electromagnetic
    processes. It represents the aggregate wall heat-loading density; integrating
    it over a surface gives the corresponding [plasma_deposited_power_at_wall](name:plasma_deposited_power_at_wall),
    while its maximum over a surface is related to [peak_power_density_at_wall](name:peak_power_density_at_wall).


    The total wall energy flux density is the area density of deposited power and
    may be decomposed into resolved physical channels:


    $$

    q_\mathrm{wall}(\mathbf{x}) = \frac{dP_\mathrm{wall}}{dA}(\mathbf{x}) = \sum_{c
    \in \mathcal{C}} q_c(\mathbf{x})

    $$


    where $q_\mathrm{wall}$ is the total energy flux density at wall position $\mathbf{x}$,
    $P_\mathrm{wall}$ is the power crossing into a surface element of area $dA$, and
    $q_c$ is the contribution from channel $c$, such as charged particles, neutral
    atoms, photons, recombination energy, or inductive electromagnetic heating.


    In practice this quantity is estimated from edge-plasma and wall-interaction modeling,
    from heat-transfer inversion of infrared thermography, calorimetry, thermocouples,
    or embedded sensors, and from diagnostic constraints on radiated and particle
    power. Care is needed to distinguish local surface loading from area-integrated
    power and from material temperature response, which also depends on thermal properties,
    geometry, and exposure time.


    Typical values range from 10^2-10^5 W m^-2 on weakly loaded main-chamber wall
    regions, 10^5-10^7 W m^-2 on limiter or divertor target regions during sustained
    plasma contact, and can exceed 10^7 W m^-2 for short transient events.


    Sign convention: Positive when net energy crosses the plasma-facing surface from
    the plasma side into the wall material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_kinetic_energy_flux_at_wall
  - name:energy_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_radiation
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:electron_energy_flux_at_wall
- name: electron_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Kinetic energy flux density carried by electrons emitted from a plasma-facing
    wall surface into the adjacent plasma or vacuum region. It quantifies the surface-emitted
    component of electron energy transport, arising from secondary, backscattered,
    thermionic, or photo-emission processes, and is distinct from the incident electron
    power arriving at the wall from the plasma.
  documentation: 'Electron energy flux at the wall is the kinetic energy flux density
    transported away from a plasma-facing material surface by the emitted electron
    population. Emitted electrons originate from secondary electron emission, backscattering,
    thermionic emission, or photoemission, and this quantity captures the energy these
    electrons carry across the surface into the adjacent plasma or vacuum region.


    For an emitted electron velocity distribution at the surface, the flux density
    is the first kinetic-energy moment of the outgoing electrons:


    $$

    q_{e,\mathrm{emit}} = \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w>0} \tfrac{1}{2}
    m_e v^2 \, (\mathbf{v}\cdot\hat{\mathbf{n}}_w) \, f_{e,\mathrm{emit}}(\mathbf{v})
    \, d^3v = \Gamma_{e,\mathrm{emit}} \, \langle E_k \rangle_\Gamma

    $$


    where $m_e$ is the electron mass, $v$ is the electron speed, $\hat{\mathbf{n}}_w$
    is the unit surface normal pointing from the material into the plasma-facing region,
    and $f_{e,\mathrm{emit}}$ is the emitted electron velocity distribution function
    (units $\mathrm{s^3\,m^{-6}}$, i.e. number density per unit velocity-space volume).
    $\Gamma_{e,\mathrm{emit}}$ is the outward emitted electron particle flux density
    in $\mathrm{m^{-2}\,s^{-1}}$, and $\langle E_k \rangle_\Gamma$ is the flux-weighted
    mean kinetic energy per emitted electron; if expressed in eV it must be multiplied
    by the elementary charge to obtain joules.


    This quantity is obtained from surface-emission models, sheath or kinetic plasma-wall
    calculations, or from diagnostics that infer the emitted electron current together
    with the emitted-electron energy spectrum. The flux-weighted mean energy weights
    each electron by its normal velocity component, so electrons crossing the surface
    more nearly along the normal contribute more strongly than electrons with the
    same energy moving nearly tangentially. The emitted flux enters the surface energy
    balance as a cooling term for the wall, partially offsetting the incident electron
    and ion energy loads.


    Typical magnitudes are strongly model-dependent, governed by the emission yield,
    the emitted-electron energy spectrum, the surface temperature and material, and
    the local sheath potential. The value is generally a fraction of the incident
    electron energy flux and rises sharply when strong secondary or thermionic emission
    is active on hot, intensely loaded divertor surfaces.


    Sign convention: Positive when the emitted electron kinetic energy flows across
    the wall surface along the outward normal $\hat{\mathbf{n}}_w$, from the material
    into the plasma-facing region.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:total_incident_electron_particle_flux_at_wall
  arguments:
  - name: energy_flux_at_wall
    operator: electron
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/electrons/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/electrons/emitted/values
    status: composed
- name: energy_flux_at_wall_due_to_eddy_current
  kind: scalar
  status: draft
  description: Energy flux density crossing the plasma-facing wall surface due to
    Joule heating by eddy currents induced in conducting structures. It represents
    the portion of internally deposited Ohmic power that is transported back to the
    surface and emitted toward the plasma.
  documentation: 'Energy flux at the wall due to eddy current is the thermal power
    per unit wall area that reaches the plasma-facing surface after eddy-current Joule
    heating inside conducting wall material. Time-varying magnetic fields induce currents
    in the wall; their Ohmic dissipation deposits power within the solid, while this
    quantity describes only the emitted surface flux directed toward the plasma.


    The volumetric source that feeds this surface emission is the local Ohmic dissipation
    from the induced current density:


    $$

    p_\mathrm{eddy} = \frac{|\mathbf{J}_\mathrm{eddy}|^2}{\sigma_w}

    $$


    where $p_\mathrm{eddy}$ is the volumetric power density in W m$^{-3}$, $\mathbf{J}_\mathrm{eddy}$
    is the eddy-current density in A m$^{-2}$, and $\sigma_w$ is the wall electrical
    conductivity in S m$^{-1}$. The corresponding surface energy flux density depends
    on the spatial distribution of this source, the wall geometry, thermal conductivity,
    heat capacity, and the timescale over which heat diffuses to the plasma-facing
    surface.


    In practice, the quantity is computed from electromagnetic and thermal analyzes
    of conducting wall structures during magnetic transients such as disruptions,
    current quenches, vertical displacement events, or rapid control-coil field changes.
    It may be inferred by combining reconstructed or modeled eddy-current distributions
    with a heat-transfer calculation that maps internal Ohmic deposition to heat flux
    at the surface.


    Typical values are near zero during steady conditions when magnetic fields vary
    slowly. During fast transients, localized emitted fluxes can be 10^3-10^6 W m$^{-2}$,
    with higher short-duration peaks possible near highly conducting structures or
    geometric current-concentration regions.


    This quantity is part of the wall energy balance together with radiative loading,
    particle energy fluxes, and total Ohmic dissipation in wall structures. It is
    distinct from the total [power_at_wall_due_to_ohmic_dissipation](name:power_at_wall_due_to_ohmic_dissipation),
    because only the portion transported to and emitted from the plasma-facing surface
    contributes to this surface flux density.


    Sign convention: Positive when thermal energy is emitted from the wall surface
    toward the plasma.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_radiation
  - name:electron_energy_flux_at_wall
  - name:ion_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/current/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/current/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/energy_fluxes/current/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/current/incident/values
    status: composed
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/incident/values
    status: composed
- name: energy_flux_at_wall_due_to_radiation
  kind: scalar
  status: draft
  description: Incident radiative energy flux density at a plasma-facing wall is the
    photon power crossing onto the material surface per unit area. It counts arriving
    radiation before absorption, reflection, or re-emission, so it is not by itself
    the net heat deposited in the wall.
  documentation: 'Energy flux at wall due to radiation is the local incident photon
    power per unit wall area arriving at a plasma-facing material surface. It includes
    radiative transport from plasma emission processes such as line radiation, bremsstrahlung,
    and synchrotron emission, but excludes the subsequent material response. It is
    a radiative contribution to [energy_flux_at_wall](name:energy_flux_at_wall_due_to_eddy_current);
    its wall-integrated counterpart is related to radiated_power_at_wall, and its
    largest local value contributes to [peak_power_density_at_wall](name:peak_power_density_at_wall).


    The incident radiative flux density can be written as an integral of incoming
    spectral radiance over frequency and solid angle:


    $$

    q_\mathrm{rad}(\mathbf{x}) = \int_0^\infty \int_{\hat{s}\cdot\hat{n}<0} I_\nu(\mathbf{x},\hat{s})\,[-\hat{s}\cdot\hat{n}]\,d\Omega\,d\nu

    $$


    where $q_\mathrm{rad}$ is this quantity in W m^-2, $\mathbf{x}$ is a point on
    the wall, $I_\nu$ is the incoming spectral radiance in W m^-2 sr^-1 Hz^-1, $\hat{s}$
    is the photon propagation direction, $\hat{n}$ is the unit normal pointing from
    the wall material into the plasma-facing vacuum, $d\Omega$ is a solid-angle element
    in steradians, and $d\nu$ is a frequency interval in hertz. The factor $[-\hat{s}\cdot\hat{n}]$
    is the projected-area cosine for rays crossing from the plasma-facing side into
    the material.


    In practice this quantity is computed from radiation-transport or view-factor
    calculations using plasma emissivity, wall geometry, opacity, and shadowing. Measurements
    such as bolometry can constrain the total radiated power, but the local incident
    wall distribution depends on the assumed radiation source distribution and geometric
    transport model. Net absorbed or deposited radiative heat flux additionally requires
    material optical properties and emitted or reflected radiation terms.


    Typical magnitudes are strongly scenario dependent. Area-averaged incident radiative
    wall loads in tokamak wall-load studies are often assessed on scales of 10^3-10^5
    W m^-2, while localized divertor or first-wall peaks in high-power radiating scenarios
    may reach 10^5-10^6 W m^-2; these ranges are representative engineering scales
    rather than universal limits.


    Sign convention: Positive when photon energy crosses the wall surface from the
    plasma-facing vacuum side into the material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:peak_power_density_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/radiation/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/radiation/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/energy_fluxes/radiation/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/radiation/incident/values
    status: composed
- name: energy_flux_due_to_recombination
  kind: scalar
  status: draft
  description: Recombination-originated surface flux linking energy-resolved particle
    or event fluxes to energy-weighted wall deposition. With unit m^-2 s^-1 it denotes
    a specified energy, state, or channel flux count; weighting by deposited energy
    gives the aggregate wall energy flux.
  documentation: 'Energy flux due to recombination is the surface-normal transport
    associated with particles or recombination events produced by electron-ion, molecular,
    or surface-assisted recombination near a plasma-facing material. As a derived
    parent, it covers both energy-resolved flux-count forms such as [neutral_state_energy_flux_due_to_recombination](name:neutral_state_energy_flux_due_to_recombination)
    and energy-weighted aggregate wall-deposition forms such as [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).
    The m^-2 s^-1 unit represents the energy-resolved or channel-resolved flux-count
    convention; an aggregate energy flux is obtained by weighting those counts by
    deposited energy per particle or event.


    The connection between the flux-count representation and the aggregate deposited
    energy flux can be written as


    $$

    q_{\mathrm{rec}} = \sum_a \langle \epsilon_{\mathrm{dep},a} \rangle\,\Gamma_{\mathrm{rec},a}

    $$


    where $a$ labels recombination channels, particle species, charge states, quantum
    states, or energy bins; $\Gamma_{\mathrm{rec},a}$ is the recombination-produced
    particle or event flux density for that component; $\langle \epsilon_{\mathrm{dep},a}
    \rangle$ is the mean energy deposited at the surface per particle or event; and
    $q_{\mathrm{rec}}$ is the corresponding aggregate wall energy flux.


    In practice this quantity is evaluated from recombination rates, recycling and
    surface-recombination yields, neutral transport, state-resolved population kinetics,
    and sheath or surface energy-deposition models. It can be constrained by combinations
    of calorimetry, spectroscopy of recombination radiation, neutral pressure measurements,
    particle-balance analysis, and near-wall charged-particle flux diagnostics. The
    associated particle source is described by related names such as [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).


    Typical energy-resolved or channel-resolved recombination flux densities in scrape-off-layer
    and divertor conditions are about 1e18-1e23 m^-2 s^-1, with the largest values
    on strongly recycling or detached divertor surfaces. For deposited energies of
    about 1-100 eV per particle or event, these fluxes correspond to aggregate wall
    energy fluxes of roughly 0.1 W m^-2 to 1 MW m^-2.


    Sign convention: Positive when recombination-produced particles or events transport
    energy toward the plasma-facing material surface.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:neutral_state_energy_flux_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
- name: energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Aggregate energy flux density deposited on a plasma-facing wall by
    recombination processes, summed over all incident particle species, charge states,
    and recombination channels.
  documentation: 'Recombination energy flux at the wall is the power per unit wall
    area deposited by plasma particles undergoing neutralization or electron-ion recombination
    at or near a plasma-facing surface, accumulated across all ion species, charge
    states, and recombination pathways. When a multiply-charged ion captures successive
    electrons and recombines, each step releases ionization potential energy plus
    residual kinetic energy; this aggregate quantity collects those contributions
    into a single heat-load density at the material surface.


    The total recombination heat flux density is the sum over all contributing species
    and charge states:


    $$

    q_\mathrm{rec} = \sum_{s,\,z} \Gamma_{s,z}(w)\,E_\mathrm{rec}(s,z)

    $$


    where $\Gamma_{s,z}(w)$ is the particle flux density incident on the wall for
    species $s$ in charge state $z$, and $E_\mathrm{rec}(s,z)$ is the energy released
    per recombination event, including ionization potential and kinetic energy contributions.


    The aggregate can be decomposed into species- and charge-state-resolved contributions.
    Neutral recombination products leaving the surface are tracked by [neutral_energy_flux_at_wall_due_to_recombination](name:neutral_energy_flux_at_wall_due_to_recombination)
    and [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).
    The complementary radiative contribution to wall heat loading is captured by [energy_flux_at_wall_due_to_radiation](name:energy_flux_at_wall_due_to_radiation),
    and the total deposited surface power integrated over the full wall area appears
    in deposited_power_at_wall.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_radiation
  arguments:
  - name: energy_flux_due_to_recombination
    operator: wall
    operator_kind: locus
- name: helium_3_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of helium-3 ions in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface.
  documentation: 'Helium-3 density at a limiter is the number of ionized helium-3
    nuclei per unit volume in the boundary plasma immediately adjacent to a plasma-facing
    limiter surface. It quantifies the local minority-isotope ion population participating
    in recycling, fueling balance, sheath physics, and plasma-wall interactions at
    the limiter.


    For a helium-3 ion distribution function, the density is the zeroth velocity moment
    evaluated at a limiter-adjacent plasma location:


    $$

    n_{{}^3\mathrm{He}}(\mathbf{x}_\ell) = \int f_{{}^3\mathrm{He}}(\mathbf{x}_\ell,
    \mathbf{v})\, d^3v

    $$


    where $\mathbf{x}_\ell$ denotes a point in the plasma immediately next to the
    limiter surface, $\mathbf{v}$ is ion velocity in m s$^{-1}$, $d^3v$ has units
    m$^3$ s$^{-3}$, and $f_{{}^3\mathrm{He}}$ has units m$^{-6}$ s$^3$, giving $n_{{}^3\mathrm{He}}$
    in m$^{-3}$.


    In practice this quantity is usually estimated from edge-plasma analysis and boundary
    modeling rather than measured as a direct local ion density at the material surface.
    Estimates may combine local plasma density and temperature, ionization and recombination
    balance, limiter recycling sources, isotope-resolved fueling or exhaust information,
    and diagnostic constraints such as helium line emission when available.


    Typical trace-minority helium-3 densities near a limiter can span roughly 10$^{16}$-10$^{18}$
    m$^{-3}$, depending strongly on helium-3 fueling rate, confinement, ionization
    state, scrape-off-layer transport, and recycling at the limiter. Values can be
    substantially different in dedicated helium-3 operation or in plasmas with weak
    local helium-3 sources.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:helium_3_density_at_pedestal
  - name:helium_3_density_at_magnetic_axis
  arguments:
  - name: density_at_limiter
    operator: helium_3
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/helium_3/value
    dd_path: summary/local/limiter/n_i/helium_3/value
    status: composed
- name: helium_4_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of helium-4 ions in the boundary plasma immediately
    outside a limiter surface, evaluated on the plasma side of the sheath or presheath.
  documentation: 'Helium-4 density at a limiter is the local number density of helium-4
    ions in the boundary plasma immediately outside the limiter material surface.
    The value is evaluated on the plasma side of the sheath or presheath at the limiter
    contact region, not inside the solid material or in neutral gas retained at the
    surface.


    For a point on the limiter surface, the kinetic definition is the velocity-space
    integral of the helium-4 ion distribution taken as a plasma-side surface limit:


    $$

    n_{\mathrm{He4,lim}}(\mathbf{x}_w) = \lim_{\ell \to 0^+} \int_{\mathbb{R}^3} f_{\mathrm{He4}}(\mathbf{x}_w
    + \ell \hat{\mathbf{n}}_p, \mathbf{v}) \, d^3v

    $$


    where $f_{\mathrm{He4}}$ is the velocity distribution function for helium-4 ions,
    summed over charge states if they are not resolved separately, $\mathbf{x}_w$
    is a point on the limiter surface, and $n_{\mathrm{He4,lim}}$ has units $\mathrm{m}^{-3}$.
    The local right-handed surface basis is $(\hat{\mathbf{t}}_1,\hat{\mathbf{t}}_2,\hat{\mathbf{n}}_p)$
    with $\hat{\mathbf{t}}_1 \times \hat{\mathbf{t}}_2 = \hat{\mathbf{n}}_p$; $\hat{\mathbf{n}}_p$
    points from the material into the plasma and $\ell$ is distance along that normal.


    This quantity is the helium-4 isotope contribution to the local ion population
    at the limiter. In a quasineutral boundary plasma, [electron_density_at_limiter](name:electron_density_at_limiter)
    is balanced to leading order by the charge-weighted sum of ion densities, so helium-4
    contributes $Z n_{\mathrm{He4,lim}}$ for a single dominant charge state $Z$, or
    $\sum_Z Z n_{\mathrm{He4,lim}}^{(Z)}$ when multiple helium charge states coexist.
    The unweighted isotope density contributes to [total_ion_density_at_limiter](name:total_ion_density_at_limiter)
    and to [density_at_limiter](name:density_at_limiter).


    The value is usually inferred rather than directly counted. General methods include
    localized or line-integrated helium line-emission spectroscopy interpreted with
    collisional-radiative modeling, probe-constrained boundary-plasma analysis, particle-balance
    estimates using helium sources and recycling, and boundary-plasma modeling constrained
    by electron density and temperature measurements.


    Typical values are about $10^{16}-10^{19}\ \mathrm{m}^{-3}$ when helium-4 is a
    trace, minority, or fusion-ash species near a limiter. In helium-fueled or strongly
    recycling plasmas, the value can become a substantial fraction of the local total
    ion density, whose boundary values are commonly $10^{17}-10^{20}\ \mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:helium_4_density_at_plasma_boundary
  - name:helium_4_density_at_divertor_target
  - name:helium_4_density_at_pedestal
  arguments:
  - name: density_at_limiter
    operator: helium_4
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/helium_4/value
    dd_path: summary/local/limiter/n_i/helium_4/value
    status: composed
- name: hydrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of hydrogen (protium) ions in the boundary plasma adjacent
    to a limiter surface. It characterizes the local ion population interacting with
    the plasma-facing limiter material.
  documentation: 'Hydrogen density at a limiter is the local number density of hydrogen
    ions in the boundary plasma next to a limiter surface. It describes the plasma
    population available for particle flux, recycling, charge exchange, and plasma-material
    interaction at the limiter location, without implying a universal relation to
    upstream or pedestal densities.


    As a number density, it is defined by the local particle content per unit volume:


    $$

    n_{\mathrm{H}^+} = \frac{dN_{\mathrm{H}^+}}{dV}

    $$


    where $N_{\mathrm{H}^+}$ is the number of hydrogen ions in a small plasma volume
    $V$ near the limiter. The value is non-negative and is expressed in $m^{-3}$.


    In practice this quantity is inferred from boundary-plasma diagnostics and modeling,
    such as Langmuir probes, spectroscopic measurements combined with collisional-radiative
    interpretation, or edge plasma simulations constrained by measurements. Its value
    depends on local ionization, recycling from the limiter, cross-field transport,
    magnetic connection length, plasma fueling, and the limiter geometry.


    Typical values in tokamak boundary plasmas are about $10^{17}$-$10^{20}$ m$^{-3}$,
    with lower values in tenuous scrape-off-layer conditions and higher values near
    dense, strongly recycling limiter plasmas.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_density_at_limiter
  - name:hydrogen_density_at_pedestal
  - name:hydrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: hydrogen
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/hydrogen/value
    dd_path: summary/local/limiter/n_i/hydrogen/value
    status: composed
- name: ion_average_temperature_at_limiter
  kind: scalar
  status: draft
  description: Ion average temperature at a limiter is the density-weighted temperature
    of the boundary-plasma ion population adjacent to a limiter surface, averaged
    over all ion species and their charge states.
  documentation: 'Ion average temperature at a limiter is the local thermal temperature
    of ions in the boundary plasma adjacent to a limiter surface. It represents the
    mixture-averaged ion thermal energy near the plasma-wall interface and includes
    all contributing ion species and ionization states.


    A common definition is the density-weighted average over species and charge states:


    $$

    T_{i,\mathrm{avg}} = \frac{\sum_s \sum_z n_{s,z} T_{i,s,z}}{\sum_s \sum_z n_{s,z}}

    $$


    where $s$ indexes ion species, $z$ indexes charge states, $n_{s,z}$ is the local
    number density of ions in charge state $z$ of species $s$ in $\mathrm{m}^{-3}$,
    and $T_{i,s,z}$ is the corresponding ion temperature in eV. The resulting $T_{i,\mathrm{avg}}$
    is in eV; if charge states are not separately resolved, the same expression applies
    using the available effective species populations and temperatures.


    In practice, this quantity is obtained from boundary-plasma measurements, edge
    modeling, or a combination of both at a location representative of the limiter
    interaction region. It is a plasma ion temperature, not a material surface temperature,
    and may correspond to the ion population approaching the sheath when the limiter
    directly intersects open magnetic field lines.


    Typical limiter-edge values are of order 1-100 eV. Cold, strongly recycling boundary
    plasmas may have ion average temperatures of only a few eV, while attached or
    high-power limiter conditions can reach several tens of eV or higher.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_temperature_at_midplane
  sources:
  - id: dd:summary/local/limiter/t_i_average/value
    dd_path: summary/local/limiter/t_i_average/value
    status: composed
- name: ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Kinetic energy flux density carried by ions leaving the plasma-facing
    wall through surface emission processes such as physical sputtering and ion backscattering.
  documentation: "The kinetic energy flux density at the plasma-facing wall surface\
    \ carried by ions emitted outward via surface emission \u2014 the family of plasma\u2013\
    wall interaction processes, including physical sputtering, chemical sputtering,\
    \ and ion backscattering, that return ionic species from the wall to the plasma.\
    \ The `kinetic` qualifier restricts this to translational kinetic energy of the\
    \ emitted ion velocity distribution, excluding potential energy stored in electronic\
    \ excitation or residual ionization charge, which is captured separately by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).\n\
    \nThe emitted kinetic energy flux $\\Phi_{\\mathrm{kin,emit}}$ sums over all emitted\
    \ ion species $s$:\n\n$$\n\\Phi_{\\mathrm{kin,emit}} = \\sum_s \\int_{v_n > 0}\
    \ \\tfrac{1}{2} m_s v^2 \\, v_n \\, f_{s,\\mathrm{emit}}(\\mathbf{v}) \\, d^3v\n\
    $$\n\nwhere $m_s$ is the ion mass of species $s$, $v = |\\mathbf{v}|$ is the ion\
    \ speed, $v_n > 0$ is the outward surface-normal velocity component at the wall,\
    \ and $f_{s,\\mathrm{emit}}(\\mathbf{v})$ is the velocity distribution function\
    \ of emitted ions.\n\nIn plasma\u2013surface interaction modeling, this flux is\
    \ evaluated by convolving incident plasma conditions with energy-resolved surface\
    \ emission yields and backscattering coefficients from binary-collision approximation\
    \ databases. It is the mechanism-attributed form of [ion_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission)\
    \ and the emitted counterpart to [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),\
    \ which captures the incident kinetic flux. Charge-state-resolved contributions\
    \ are tracked by ion_state_energy_flux_at_wall, and the electron analog is [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_kinetic_energy_flux_at_wall
  - name:electron_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    status: composed
- name: ion_state_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Energy flux density emitted from a plasma-facing wall by recombination
    of a specified ion charge state. It gives the charge-state-resolved contribution
    to the recombination energy released per unit wall area.
  documentation: 'Ion-state recombination energy flux at the wall is the power per
    unit plasma-facing surface area emitted at the surface when ions of a specified
    species and charge state recombine. It represents only that initial charge-state
    contribution; summing over charge states for one ion species gives [ion_energy_flux_at_wall_due_to_recombination](name:ion_energy_flux_at_wall_due_to_recombination),
    and summing over ion species gives [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).
    This quantity refers to recombination energy release, not to the incident ion
    kinetic or thermal energy flux.


    For ions of species $s$ arriving in charge state $z$, a local estimate is the
    recombining particle flux multiplied by the total ionization energy recovered
    during neutralization:


    $$

    q^{\mathrm{rec}}_{s,z} = \Gamma_{s,z} \, e \sum_{k=1}^{z} I_{s,k}

    $$


    where $q^{\mathrm{rec}}_{s,z}$ is the recombination energy flux density in W m$^{-2}$,
    $\Gamma_{s,z}$ is the flux of recombining ions of species $s$ and charge state
    $z$ to the wall in m$^{-2}$ s$^{-1}$, $I_{s,k}$ is the $k$th ionization potential
    of species $s$ in eV, and $e$ converts eV to joule. More detailed surface models
    may partition this released energy among photons, emitted neutrals, electrons,
    and solid-surface heating, but the charge-state-resolved energy scale is set by
    the sum of ionization potentials.


    In practice this quantity is computed from charge-state-resolved ion fluxes to
    plasma-facing components together with atomic ionization energies and surface
    recombination or neutralization models. It may also be constrained indirectly
    by combining particle-flux estimates from probes, spectroscopy, or particle balance
    with atomic data, while keeping it separate from incident kinetic heat flux, radiation
    absorbed at the wall, and chemical or sputtering energy terms.


    Typical charge-state-resolved values range from less than 10$^{2}$ W m$^{-2}$
    on weakly wetted wall regions to 10$^{4}$-10$^{6}$ W m$^{-2}$ in recycling divertor
    or limiter regions. Local values can approach 10$^{6}$-10$^{7}$ W m$^{-2}$ for
    very large particle fluxes or high charge states, but the summed recombination
    contribution is usually below the total plasma heat load.


    Sign convention: Positive when recombination energy is emitted from the wall surface
    into the adjacent plasma or vacuum.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:ion_state_kinetic_energy_flux_at_wall
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: ion_state
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    status: composed
- name: iron_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of iron (Fe) impurity ions in the plasma immediately
    adjacent to a limiter surface, excluding neutral iron atoms.
  documentation: 'Iron density at the limiter is the local number density of ionized
    iron in the plasma-side region next to a limiter surface. It represents iron impurity
    ions only; neutral Fe atoms are excluded from this quantity.


    When charge states are resolved, the total iron ion density is the sum over all
    positive ionization states:


    $$

    n_{\mathrm{Fe}} = \sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}}

    $$


    where $n_{\mathrm{Fe}}$ is the total iron ion number density in m$^{-3}$, $q$
    is the ion charge state, and $n_{\mathrm{Fe}^{q+}}$ is the number density in m$^{-3}$
    of iron ions with charge $+q e$. The sum starts at $q=1$, so neutral iron, $\mathrm{Fe}^0$,
    is not included.


    In practice this quantity is obtained from local or modeled impurity-ion densities
    evaluated at the plasma-facing limiter boundary. If only charge-state-resolved
    densities are available, they are summed over ionized charge states; if a total
    iron ion density is available directly, it should correspond to the same ion-only
    definition.


    Typical values are highly device-, discharge-, material-, and plasma-edge dependent,
    and no universal range is implied by the definition. The value is non-negative
    and is expressed in m$^{-3}$.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:iron_density_at_divertor_target
  - name:iron_density_at_pedestal
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  arguments:
  - name: density_at_limiter
    operator: iron
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/iron/value
    dd_path: summary/local/limiter/n_i/iron/value
    status: composed
- name: kinetic_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Surface power density carried by the translational kinetic energy of
    a specified population of plasma particles reaching a plasma-facing material surface.
    The population may be an aggregate of all incident charged particles or a restricted
    group such as ions.
  documentation: 'Kinetic energy flux at the wall is the rate per unit wall area at
    which translational particle energy, including thermal and directed motion, is
    delivered to a plasma-facing material surface. It excludes non-kinetic contributions
    such as recombination or other potential-energy release. The same physical moment
    may be evaluated for all incident charged particles, as in [incident kinetic energy
    flux at the wall](name:incident_kinetic_energy_flux_at_wall), or for a restricted
    carrier population such as ions, as in [ion kinetic energy flux at the wall](name:ion_kinetic_energy_flux_at_wall).


    For a chosen carrier population $\mathcal{P}$, the kinetic energy flux can be
    written as the incoming half-space moment of the velocity distribution at the
    surface:


    $$

    q_{\mathrm{kin}}(\mathcal{P}) = \sum_{a \in \mathcal{P}} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_{\mathrm{in}}
    > 0} \frac{1}{2} m_a v^2\,(\mathbf{v}\cdot\hat{\mathbf{n}}_{\mathrm{in}})\, f_a(\mathbf{v})\,
    d^3v

    $$


    where $a$ labels particle species or charge states included in $\mathcal{P}$,
    $m_a$ is particle mass, $\mathbf{v}$ is particle velocity, $f_a$ is the velocity
    distribution adjacent to the wall, and $\hat{\mathbf{n}}_{\mathrm{in}}$ is the
    local direction from the plasma-facing side into the material surface. The result
    is a surface power density in W/m^2. For a one-sided Maxwellian without drift,
    this moment gives the familiar scaling $q_{\mathrm{kin}} \simeq 2 k_B T\,\Gamma$,
    where $T$ is the species temperature and $\Gamma$ is the incident [particle flux
    at the wall](name:particle_flux_at_wall).


    Kinetic energy flux at wall surfaces is estimated from scrape-off-layer and sheath
    modeling, kinetic or fluid boundary calculations, and measurements constraining
    particle fluxes and particle energies. Langmuir probes, retarding-field analyzers,
    infrared thermography, and calorimetry can help infer the kinetic component, although
    separating it from the total [energy flux at the wall](name:energy_flux_at_wall_due_to_eddy_current)
    requires assumptions about species composition, sheath acceleration, and non-kinetic
    channels such as [power at the wall due to recombination](name:power_at_wall_due_to_recombination).


    Typical magnitudes depend strongly on the selected carrier population and plasma
    regime: first-wall or weak scrape-off-layer loading may be 10^3-10^5 W/m^2, while
    divertor target values commonly reach 10^5-10^8 W/m^2 near strike points in high-power
    operation. A restricted component, such as the ion contribution alone, is generally
    no larger than the corresponding all-included incident kinetic energy flux.


    Sign convention: Positive when the kinetic-energy transport is directed from the
    plasma-facing side into the material surface.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:incident_kinetic_energy_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall
  - name:particle_flux_at_wall
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:power_at_wall_due_to_recombination
  arguments:
  - name: energy_flux_at_wall
    operator: kinetic
    operator_kind: qualifier
- name: incident_kinetic_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Power per unit wall area delivered by the kinetic energy of plasma
    particles arriving at a plasma-facing surface from the plasma side, aggregated
    over all carrier species including electrons and ion charge states.
  documentation: 'The incident kinetic energy flux at the wall quantifies the rate
    at which particle kinetic energy is transported from the plasma to a plasma-facing
    material surface per unit local wall area. Unlike outward-directed surface components
    such as [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall), which
    arises from secondary or thermionic emission directed away from the surface, this
    quantity captures only the plasma-side incoming contribution, covering both random
    thermal and directed kinetic energy of particles crossing the magnetic pre-sheath
    and sheath.


    The species-resolved contribution from carrier $s$ is:


    $$

    q_s^{\rm kin} = \int_{v_\perp > 0} \tfrac{1}{2} m_s v^2 \, f_s(\mathbf{v}) \,
    v_\perp \, d^3v

    $$


    where $m_s$ is the particle mass, $v$ is the total speed, $v_\perp$ is the velocity
    component normal to the wall surface directed toward it, and $f_s(\mathbf{v})$
    is the particle velocity distribution function. Summing over all incident species
    yields the total incident kinetic power density.


    The electron contribution is modulated by the sheath potential barrier, which
    reflects low-energy electrons back toward the plasma until ambipolarity is satisfied;
    the ion contribution includes kinetic energy acquired through pre-sheath acceleration
    to at least the Bohm velocity. Species-resolved components are given by [electron_incident_kinetic_energy_flux_at_wall](name:electron_incident_kinetic_energy_flux_at_wall)
    and [ion_state_incident_kinetic_energy_flux_at_wall](name:ion_state_incident_kinetic_energy_flux_at_wall).
    For a broader energy budget that additionally includes potential energy released
    upon surface neutralization, see [kinetic_energy_flux_at_wall](name:kinetic_energy_flux_at_wall).


    Typical incident kinetic energy flux on divertor targets and limiters ranges from
    $10^4$ to $10^7$ W m$^{-2}$, depending on local edge plasma temperature and density
    at the sheath entrance.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_energy_flux_at_wall
  - name:electron_incident_kinetic_energy_flux_at_wall
  - name:ion_state_incident_kinetic_energy_flux_at_wall
  - name:kinetic_energy_flux_at_wall
  arguments:
  - name: kinetic_energy_flux_at_wall
    operator: incident
    operator_kind: qualifier
- name: ion_kinetic_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident kinetic energy flux per unit wall area carried by plasma ions,
    summed over ion species and charge states, as they strike the plasma-facing wall.
  documentation: 'Ion kinetic energy flux at the wall is the incident component of
    kinetic power carried by ions crossing a plasma-facing material surface per unit
    area. It includes the translational kinetic energy of ions at impact, summed over
    all ion species and charge states, and is the ionic contribution to the total
    [kinetic_energy_flux_at_wall](name:kinetic_energy_flux_at_wall). It excludes ion
    potential energy, radiation, and energy transported by particles emitted or reflected
    from the wall.


    For a kinetic ion distribution evaluated at a wall point, the local incident flux
    can be written as:


    $$

    Q_{i,\mathrm{kin}}^{\mathrm{inc}}(\mathbf{x}_w) = \sum_{s,z} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w
    < 0} \frac{1}{2} m_s |\mathbf{v}|^2 |\mathbf{v}\cdot\hat{\mathbf{n}}_w| f_{s,z}(\mathbf{x}_w,\mathbf{v})\,d^3v

    $$


    where $Q_{i,\mathrm{kin}}^{\mathrm{inc}}$ is in W m^-2, $\mathbf{x}_w$ is the
    wall-surface position in meters, $s$ labels ion species, $z$ labels charge state,
    $m_s$ is the ion mass in kg, $\mathbf{v}$ is ion velocity in m s^-1, $\hat{\mathbf{n}}_w$
    is the unit normal directed from the wall material into the plasma, and $f_{s,z}$
    is the ion distribution function in m^-3 (m s^-1)^-3. The integration domain selects
    ions moving toward the wall.


    In practice this quantity is estimated from ion particle fluxes and impact energies
    using boundary plasma diagnostics, sheath or edge-plasma modeling, kinetic simulations,
    or wall heat-flux measurements combined with a decomposition of the total heat
    load. Separating the ion kinetic contribution from electron heat flux, neutral
    heat flux, potential-energy terms, radiation, and emitted-particle losses generally
    requires model assumptions.


    Typical magnitudes are strongly dependent on wall location and plasma regime.
    Main-chamber surfaces may receive values from about 10^2-10^5 W m^-2, while divertor
    or limiter strike regions in attached or partially detached operation can reach
    about 10^5-10^7 W m^-2; short transient events can be substantially larger.


    Sign convention: Positive when the wall-normal ion kinetic energy flux is directed
    from the plasma into the wall material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:kinetic_energy_flux_at_wall
  - name:electron_kinetic_energy_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  arguments:
  - name: kinetic_energy_flux_at_wall
    operator: ion
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident/values
    status: composed
- name: krypton_density_at_limiter
  kind: scalar
  status: draft
  description: Local krypton ion number density evaluated at the plasma-facing limiter
    surface, where impurity sputtering and recycling connect edge plasma composition
    to the wall material.
  documentation: 'The krypton number density at the limiter is the local volumetric
    count of krypton ions per unit volume at the plasma-side limiter contact point,
    near the sheath entrance of this plasma-facing component. It is the krypton-species-resolved
    component of the total [density_at_limiter](name:density_at_limiter). When individual
    ionization stages are resolved, this quantity equals their sum:


    $$

    n_\mathrm{Kr}(x_\mathrm{lim}) = \sum_{q=1}^{36} n_{\mathrm{Kr}^{q+}}(x_\mathrm{lim})

    $$


    where $n_{\mathrm{Kr}^{q+}}$ is the number density of krypton ions in charge state
    $q+$ at the limiter evaluation point $x_\mathrm{lim}$; when charge states are
    not individually resolved, this sum is implicit.


    Krypton ($Z = 36$) is a high-atomic-number noble gas that can be seeded into the
    edge plasma for radiative cooling of the scrape-off layer, disruption mitigation
    studies, or impurity transport experiments near plasma-facing components. Its
    local concentration at the limiter is governed by sputtering sources, charge-exchange
    recycling, and cross-field impurity transport from the confined region. Spatial
    counterparts at other poloidal positions include [krypton_density_at_pedestal](name:krypton_density_at_pedestal),
    [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    and [krypton_density_at_magnetic_axis](name:krypton_density_at_magnetic_axis);
    the [volume_averaged_krypton_density](name:volume_averaged_krypton_density) characterizes
    the global impurity inventory.


    Sign convention: Positive when krypton ions are present at the limiter location,
    consistent with particle number density being a non-negative definite quantity.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:krypton_density_at_magnetic_axis
  - name:volume_averaged_krypton_density
  arguments:
  - name: density_at_limiter
    operator: krypton
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/krypton/value
    dd_path: summary/local/limiter/n_i/krypton/value
    status: composed
- name: lithium_density_at_limiter
  kind: scalar
  status: draft
  description: Lithium ion number density in the plasma immediately adjacent to the
    limiter surface, where lithium impurities originate from wall conditioning, sputtering,
    or deliberate injection.
  documentation: 'Lithium ion number density at the limiter quantifies the local concentration
    of lithium ions in the plasma at the limiter contact region, evaluated near the
    sheath entrance on the plasma side rather than within the solid wall material.
    It is the lithium-species contribution to the total [density_at_limiter](name:density_at_limiter),
    isolating lithium impurities arising from sputtering, desorption, or intentional
    wall conditioning from contributions by other ion species present at the same
    location.


    The number density is defined as the lithium ion count per unit volume adjacent
    to the limiter surface, $n_{\mathrm{Li}} = N_{\mathrm{Li}} / V$, where $N_{\mathrm{Li}}$
    is the number of lithium ions within the volume element $V$.


    Measurement relies on passive or active optical emission spectroscopy detecting
    characteristic lithium line emission from the plasma edge, or on edge transport
    models constrained by spectroscopic observations of the limiter vicinity. In lithium
    wall-conditioning experiments, elevated values at the limiter reflect recycled
    and re-ionized lithium returning from the plasma-facing surface. Typical edge
    lithium densities in conditioning regimes range from $10^{15}$ to $10^{18}\ \mathrm{m^{-3}}$,
    depending on conditioning intensity and plasma parameters.


    For the same species at other spatial locations, [lithium_density_at_pedestal](name:lithium_density_at_pedestal)
    and [lithium_density_at_divertor_target](name:lithium_density_at_divertor_target)
    provide analogous localized quantities, while [line_averaged_lithium_density](name:line_averaged_lithium_density)
    gives the chord-integrated complement useful for global impurity inventory estimates.


    Sign convention: Positive for any finite concentration of lithium ions at the
    limiter position, consistent with number density being a non-negative particle
    count per unit volume.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:lithium_density_at_pedestal
  - name:lithium_density_at_divertor_target
  - name:line_averaged_lithium_density
  arguments:
  - name: density_at_limiter
    operator: lithium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/lithium/value
    dd_path: summary/local/limiter/n_i/lithium/value
    status: composed
- name: mass_of_wall_material
  kind: scalar
  status: draft
  description: Mass of one atom of the element constituting a plasma-facing wall material,
    used in plasma-material interaction modeling to determine sputtering yields, nuclear
    stopping cross sections, and ion implantation ranges.
  documentation: "The atomic mass of a wall material element is the mass of a single\
    \ neutral atom of that element, with $1\\,\\text{u} = 1/12$ the mass of a $^{12}\\\
    text{C}$ atom. For pure elemental plasma-facing materials \u2014 tungsten ($A\
    \ \\approx 184\\,\\text{u}$), beryllium ($A \\approx 9\\,\\text{u}$), carbon ($A\
    \ \\approx 12\\,\\text{u}$), and iron ($A \\approx 56\\,\\text{u}$) \u2014 the\
    \ value equals the standard atomic weight of the element.\n\nIn plasma-material\
    \ interaction modeling, $A_\\mathrm{wall}$ appears in sputtering yield formulae\
    \ through the mass ratio $M_1 / M_2$ between the incident plasma ion of mass $M_1$\
    \ and the target wall atom of mass $M_2 = A_\\mathrm{wall}\\,\\text{u}$, governing\
    \ both the kinematic energy transfer factor and nuclear stopping cross sections.\
    \ Erosion rates and ion implantation ranges at plasma-facing surfaces \u2014 including\
    \ limiters and divertor targets \u2014 are sensitive functions of $A_\\mathrm{wall}$\
    \ through standard sputtering threshold and yield models.\n\nThe atomic mass is\
    \ a fixed nuclear property obtained from established atomic data tables and is\
    \ independent of plasma conditions. The specific elemental value for a configured\
    \ wall is provided by [atomic_mass_of_wall_material](name:atomic_mass_of_wall_material)."
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:atomic_mass_of_wall_material
  sources:
  - id: derived:mass_of_wall_material
    status: composed
- name: atomic_mass_of_wall_material
  kind: scalar
  status: draft
  description: Atomic mass of the element or isotope constituting the plasma-facing
    wall material, expressed in unified atomic mass units referenced to one-twelfth
    the mass of a carbon-12 atom.
  documentation: 'The atomic mass of a wall material element is the ratio of the mean
    atomic mass of that element (or of a specific isotope) to the unified atomic mass
    unit $u$, where $u \approx 1.66054 \times 10^{-27}$ kg. This quantity enters sputtering
    yield models, particle momentum transfer calculations, and impurity transport
    equations in the boundary plasma at plasma-wall interfaces.


    The defining relation is:


    $$

    A = \frac{m_{\mathrm{atom}}}{u}

    $$


    where $m_{\mathrm{atom}}$ is the mass of the atom or isotope of interest and $u$
    is the unified atomic mass unit.


    Values are tabulated in standard nuclear data libraries for pure elemental materials;
    for alloys or composite wall materials the relevant constituent element or isotope
    must be identified separately in associated metadata, since a single scalar value
    cannot represent a mixture without additional weighting. Typical values for common
    plasma-facing materials span approximately 9 for beryllium (a first-wall candidate),
    12 for carbon, 56 for iron structural alloys, and 184 for tungsten used as divertor
    armor.


    The companion quantity [nuclear_mass](name:atomic_mass_of_wall_material) provides
    a closely equivalent representation for the same wall-material context. The general
    species-agnostic form [atomic_mass](name:atomic_mass) applies to any atomic species,
    while [ion_atomic_mass](name:ion_atomic_mass) and [neutral_species_atomic_mass](name:neutral_species_atomic_mass)
    specialize this concept to charged and neutral plasma species in the boundary
    region, respectively.'
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:atomic_mass
  - name:ion_atomic_mass
  - name:neutral_species_atomic_mass
  arguments:
  - name: mass_of_wall_material
    operator: atomic
    operator_kind: qualifier
- name: neon_density_at_limiter
  kind: scalar
  status: draft
  description: Neon ion number density in the boundary plasma immediately adjacent
    to a limiter surface, evaluated at the plasma-side sheath entrance. It is summed
    over neon ionization stages unless a charge-state-resolved quantity is specified.
  documentation: 'Neon density at the limiter is the local number density of neon
    ions in the boundary plasma just outside a limiter surface, at the plasma-side
    sheath entrance. It is the limiter-surface analog of [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),
    restricted to the plasma-wall interaction region rather than the global plasma
    boundary.


    For a small plasma volume adjacent to the limiter, the charge-state-summed neon
    ion density is the count of neon ions per unit volume:


    $$

    n_\mathrm{Ne} = \frac{N_\mathrm{Ne}}{V}

    $$


    where $N_\mathrm{Ne}=\sum_z N_{\mathrm{Ne}^{z+}}$ is the total number of neon
    ions over all included ionization stages and $V$ is the sampled plasma volume
    in m^3, giving $n_\mathrm{Ne}$ in m^-3.


    In practice this quantity is inferred from limiter-viewing spectroscopy with collisional-radiative
    modeling, from edge impurity transport analysis constrained by local electron
    density and temperature, or from plasma-wall interaction simulations. It counts
    neon ions in the plasma, not neutral neon at the wall and not a charge-weighted
    quantity such as an effective charge contribution.


    Typical limiter-adjacent neon ion densities are about 10^14-10^18 m^-3 in trace
    to moderately seeded boundary plasmas, with local values approaching 10^19 m^-3
    during strong neon puffing or very dense, cool edge conditions.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_pedestal
  - name:xenon_density_at_limiter
