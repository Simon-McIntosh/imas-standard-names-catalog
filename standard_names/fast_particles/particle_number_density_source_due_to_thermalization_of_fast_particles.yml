name: particle_number_density_source_due_to_thermalization_of_fast_particles
status: draft
description: Volumetric rate at which fast particles thermalize and augment the local
  thermal particle number density.
documentation: "When supra-thermal particles (beam ions, ICRH-accelerated ions, fusion\
  \ alphas) slow down to energies comparable to the thermal energy $E \\lesssim \\\
  frac{3}{2} k_B T_i$, they join the thermal population. The source rate $S_n^{\\\
  rm th}$ (in m$^{-3}$s$^{-1}$) quantifies this transition and enters the thermal\
  \ particle continuity equation $\\partial n / \\partial t + \\nabla \\cdot (n \\\
  mathbf{v}) = S_n^{\\rm th} + \\ldots$. In a 20 MW NBI-heated plasma with $n_e \\\
  sim 5 \\times 10^{19}$ m$^{-3}$, the beam thermalization source is typically $10^{18}$\u2013\
  $10^{20}$ m$^{-3}$s$^{-1}$ near the deposition zone, with the slowing-down time\
  \ $\\tau_s \\sim 50$\u2013200 ms governing the delay between injection and thermalization.\
  \ Evaluated by codes such as NUBEAM, ASCOT, or TRANSP that track the fast-ion distribution\
  \ in energy-pitch-angle-position space. The companion momentum and energy channels\
  \ are `toroidal_angular_momentum_source_due_to_thermalization_of_fast_particles`\
  \ and the energy source from the same thermalization process."
