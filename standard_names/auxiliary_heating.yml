- name: vertical_coordinate_of_lower_hybrid_antenna_row
  kind: scalar
  status: active
  description: "Vertical Z-coordinate of the reference point of a lower-hybrid antenna\
    \ row in the right-handed cylindrical (R, \u03C6, Z) frame, where R is major radius,\
    \ \u03C6 is toroidal angle, and Z is vertical height."
  documentation: 'Vertical $Z$-coordinate of the reference point of a lower-hybrid
    antenna row is the projection of that row reference point onto $\hat{Z}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    For a row reference point with position vector $\mathbf{r}_{\mathrm{ref,row}}$,
    the coordinate is defined by:


    $$

    Z_{\mathrm{row}} = \mathbf{r}_{\mathrm{ref,row}} \cdot \hat{Z}

    $$


    where $\hat{Z}$ is the vertical basis vector of the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    This is a row-level coordinate and is distinct from the antenna-level [vertical
    coordinate of the lower-hybrid antenna](name:vertical_coordinate_of_lower_hybrid_antenna).
    It is distinct from the row vertical extent.


    Sign convention: Positive when the row reference point lies in the $+\hat{Z}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame from the $Z=0$
    plane.'
