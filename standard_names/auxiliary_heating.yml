    version: 4.1.0
  - kind: imas-dd
    ref: summary/heating_current_drive/power_lh/value
    version: 4.1.0
- name: per_toroidal_and_poloidal_mode_number_launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Launched power of a lower-hybrid antenna resolved jointly per unit
    toroidal and poloidal refractive-index interval is the net RF power distribution
    entering the vacuum vessel from one antenna row.
  documentation: 'Launched power of a lower-hybrid antenna is the nonnegative RF power
    entering the vacuum vessel from one selected antenna row, resolved jointly over
    toroidal and poloidal refractive-index coordinates. It is the mode-resolved component
    of the per-antenna quantity [launched power of a lower-hybrid antenna](name:launched_power_of_lower_hybrid_antenna).


    The joint power density is defined by


    $$

    S(n_{\mathrm{tor}},n_{\mathrm{pol}}) = \frac{\mathrm{d}^{2}P_{\mathrm{launched}}}{\mathrm{d}n_{\mathrm{tor}}\,\mathrm{d}n_{\mathrm{pol}}}

    $$


    where $S$ is the launched-power density over the two refractive-index coordinates,
    $P_{\mathrm{launched}}$ is the net launched power of the antenna, $n_{\mathrm{tor}}$
    is the toroidal component of the lower-hybrid wave refractive-index vector, and
    $n_{\mathrm{pol}}$ is its poloidal component. These components correspond to the
    [toroidal launched wave index of a lower-hybrid antenna](name:toroidal_launched_wave_index_of_lower_hybrid_antenna)
    and [poloidal launched wave index of a lower-hybrid antenna](name:poloidal_launched_wave_index_of_lower_hybrid_antenna);
    they are refractive-index coordinates rather than integer Fourier harmonic numbers.


    The quantity applies to one selected lower-hybrid antenna row at a given time.
    It is resolved over both refractive-index coordinates, is not aggregated over
    antenna rows or antennas, and is not a time average.


    Because the underlying launched power is net power after accounting for reflected
    power, this quantity is distinct from [forward power of a lower-hybrid antenna](name:forward_power_of_lower_hybrid_antenna)
    and [reflected power of a lower-hybrid antenna](name:reflected_power_of_lower_hybrid_antenna).
    It represents power entering the vacuum vessel, not generator output, incident
    forward power, returning reflected power, or power absorbed by the plasma.


    Integrating $S$ over $n_{\mathrm{tor}}$ and $n_{\mathrm{pol}}$ recovers the corresponding
    [launched power of a lower-hybrid antenna](name:launched_power_of_lower_hybrid_antenna),
    while integrating over $n_{\mathrm{pol}}$ gives the [per-toroidal-mode launched
    power of a lower-hybrid antenna](name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:per_toroidal_mode_launched_power_of_lower_hybrid_antenna
  arguments:
  - name: launched_power_of_lower_hybrid_antenna
    operator: per_toroidal_and_poloidal_mode_number
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: lh_antennas/antenna/row/power_density_spectrum_2d
    version: 4.1.0
- name: per_toroidal_mode_launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Launched power of a lower-hybrid antenna resolved per unit toroidal
    refractive-index interval is the net lower-hybrid wave-power distribution from
    one selected antenna row.
  documentation: 'Launched power of a lower-hybrid antenna resolved per unit toroidal
    refractive-index interval is the distribution of net RF power entering the vacuum
    vessel over the toroidal refractive-index variable for one selected antenna row.
    It is the toroidal-resolved component of the per-antenna launched-power quantity
    represented by [launched power of a lower-hybrid antenna](name:launched_power_of_lower_hybrid_antenna).


    The distribution is defined by the differential power relation:


    $$

    \frac{dP_{\mathrm{launched}}}{dn_{\mathrm{tor}}}

    = \mathcal{P}_{\mathrm{launched}}(n_{\mathrm{tor}})

    $$


    where $P_{\mathrm{launched}}$ is the total net RF power launched by the selected
    antenna, $n_{\mathrm{tor}}$ is the signed toroidal component of the lower-hybrid
    wave refractive-index vector, and $\mathcal{P}_{\mathrm{launched}}$ is the launched-power
    density with respect to the toroidal refractive-index interval.


    The quantity applies to one selected lower-hybrid antenna row and is resolved
    only over the toroidal refractive-index coordinate; it is not aggregated over
    multiple antenna rows, antennas, or toroidal refractive-index intervals. The coordinate
    $n_{\mathrm{tor}}$ is the toroidal wave index identified by [toroidal launched
    wave index of a lower-hybrid antenna](name:toroidal_launched_wave_index_of_lower_hybrid_antenna).


    It denotes net power entering the vacuum vessel after reflected power is subtracted
    from incident forward power. It is distinct from [reflected power of a lower-hybrid
    antenna](name:reflected_power_of_lower_hybrid_antenna), generator output, and
    [absorbed wave power](name:absorbed_wave_power), which describes power transferred
    to the plasma rather than power launched from the antenna.


    Integrating this distribution over the supported range of $n_{\mathrm{tor}}$ recovers
    the per-antenna quantity [launched power of a lower-hybrid antenna](name:launched_power_of_lower_hybrid_antenna).
    The corresponding [per toroidal and poloidal mode number launched power of a lower-hybrid
    antenna](name:per_toroidal_and_poloidal_mode_number_launched_power_of_lower_hybrid_antenna)
    resolves the same launched-power distribution over both toroidal and poloidal
    refractive-index intervals.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:per_toroidal_and_poloidal_mode_number_launched_power_of_lower_hybrid_antenna
  arguments:
  - name: launched_power_of_lower_hybrid_antenna
    operator: per_toroidal_mode
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: lh_antennas/antenna/row/power_density_spectrum_1d
    version: 4.1.0
- name: power_due_to_ion_cyclotron_heating
  kind: scalar
  status: active
  description: Net ion-cyclotron radio-frequency power launched through a heating
    antenna into the vacuum vessel, equal to forward power minus reflected power at
    the antenna boundary.
  documentation: 'Net ion-cyclotron radio-frequency power is the power delivered through
    an ion-cyclotron heating antenna into the vacuum vessel toward the plasma. It
    is a launcher-boundary quantity, not the generator output or the power ultimately
    absorbed by plasma particles.


    The defining net-power relation is:


    $$

    P_{\rm net}=P_{\rm forward}-P_{\rm reflected}

    $$


    where $P_{\rm net}$ is the net ion-cyclotron power launched toward the plasma,
    $P_{\rm forward}$ is the incident radio-frequency power traveling toward the antenna
    as described by [forward power of an ion-cyclotron heating antenna](name:forward_power_of_ion_cyclotron_heating_antenna),
    and $P_{\rm reflected}$ is the radio-frequency power returned from the antenna
    toward the source.


    At launcher resolution, the quantity applies to a specified ion-cyclotron heating
    antenna and has no species, charge-state, or volumetric deposition resolution.
    The unqualified form represents the launcher-associated value; the system-level
    aggregation is represented separately by [total power due to ion-cyclotron heating](name:total_power_due_to_ion_cyclotron_heating).


    Reflected power and losses upstream of the antenna boundary are excluded. The
    quantity therefore describes power launched toward the plasma rather than forward
    incident power before reflection or the fraction subsequently absorbed by plasma
    particles. The total-power variant is obtained by summing the corresponding launcher-resolved
    values over all ion-cyclotron heating antennas, while [launched power of an ion-cyclotron
    heating antenna](name:launched_power_of_ion_cyclotron_heating_antenna) provides
    the antenna-oriented expression of the same net boundary power.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  - name:total_power_due_to_ion_cyclotron_heating
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/power_launched
    version: 4.1.0
  - kind: imas-dd
    ref: summary/heating_current_drive/ic/power/value
    version: 4.1.0
- name: pressure_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Pressure associated with an ion-cyclotron-heating antenna module, representing
    mechanical normal loading or contained-gas pressure at hardware components.
  documentation: 'Pressure associated with an ion-cyclotron-heating antenna module
    represents the compressive normal stress or contained-gas pressure acting at its
    hardware components.


    At a surface, pressure is defined as the normal force distributed over the loaded
    area:


    $$

    p = \frac{F_n}{A}

    $$


    where $p$ is pressure, $F_n$ is the force normal to the surface, and $A$ is the
    area over which that force acts. For contained gas, the same scalar represents
    the isotropic normal stress exerted by the gas.


    The scope is the antenna module and its associated hardware components, including
    local mechanical or gas-pressure conditions at individual sensing locations. The
    quantity is not a plasma pressure, a pressure amplitude, a pressure variation,
    or an aggregate sum or average over the module.


    Pressure is a mechanical or fluid-state property and is independent of electrical
    properties such as the antenna''s [resistance](name:resistance_of_ion_cyclotron_heating_antenna)
    and [strap current](name:current_of_antenna_strap).'
  unit: Pa
  physics_domain: auxiliary_heating
  links: []
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/pressure
    version: 4.1.1
  - kind: imas-dd
    ref: ic_antennas/antenna/module/pressure/amplitude
    version: 4.1.0
- name: radial_outline_of_antenna_strap
  kind: scalar
  status: active
  description: "Major-radius coordinate locating points on an ion-cyclotron antenna-strap\
    \ outline in the right-handed cylindrical (R, \u03C6, Z) frame; it is the non-negative\
    \ perpendicular distance from the toroidal symmetry axis."
  documentation: 'Major-radius coordinate locating points on an ion-cyclotron antenna-strap
    outline is the cylindrical coordinate $R$ of a point on the strap boundary in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It is the non-negative perpendicular
    distance from the toroidal symmetry axis to that outline point, not a vector component
    or a signed displacement.


    For an outline point with Cartesian coordinates $(x, y, z)$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, with $\hat{z}$ vertical and $\hat{x}$
    and $\hat{y}$ horizontal, the major-radius coordinate is defined by:


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$ is the major-radius coordinate of the outline point, $x$ and $y$ are
    its horizontal Cartesian coordinates, and $z$ is its vertical Cartesian coordinate.


    The domain is $R \ge 0$, with $R = 0$ only on the toroidal symmetry axis. The
    quantity applies pointwise to the geometric outline of an antenna strap and specifies
    only the major-radius coordinate of the boundary; no averaging or aggregation
    over outline points is implied. It differs from the [radial coordinate of the
    antenna strap](name:radial_coordinate_of_antenna_strap), which locates the strap
    geometric center rather than each outline point.


    Together with the [toroidal angle of the antenna strap](name:toroidal_angle_of_antenna_strap)
    and the [vertical coordinate of the antenna-strap outline](name:vertical_outline_of_antenna_strap),
    it gives the cylindrical-coordinate location of the same outline point.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_antenna_strap
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/strap/outline/r
    version: 4.1.1
- name: reflected_phase_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Relative phase angle of a reflected radio-frequency power-wave phasor
    at an antenna element in an ion-cyclotron heating launcher, measured relative
    to the forward power-wave phasor of that same element.
  documentation: 'This quantity is the relative phase of a complex reflected radio-frequency
    power-wave phasor at a selected antenna strap or module with respect to the complex
    forward radio-frequency power-wave phasor of the same strap or module. It specifies
    the element-local reflection phase of an ion-cyclotron heating launcher rather
    than an absolute phase or an inter-element phase.


    For element $i$, the reflected phase is defined by


    $$

    \phi_{\mathrm{ref},i} = \arg\!\left(b_i^{\mathrm{ref}} (a_i^{\mathrm{fwd}})^*\right)
    \pmod{2\pi}

    $$


    where $\phi_{\mathrm{ref},i}$ is this reflected phase, $b_i^{\mathrm{ref}}$ is
    the complex reflected power-wave phasor at element $i$, $a_i^{\mathrm{fwd}}$ is
    the complex forward power-wave phasor at the same element, $(a_i^{\mathrm{fwd}})^*$
    is its complex conjugate, and $\arg$ extracts the phase angle. The phase is defined
    modulo $2\pi$.


    The scope is a single selected launcher strap or module and the pair of forward
    and reflected traveling power waves at the same element reference plane. The forward
    wave propagates toward the antenna element, and the reflected wave propagates
    away from the antenna element toward the feeding network. The first launcher element
    is not the phase reference for this quantity, and the quantity is not averaged
    or summed over launcher elements.


    This quantity is a reflected-wave member of the broader [phase of the ion-cyclotron
    heating antenna](name:phase_of_ion_cyclotron_heating_antenna) family. It is distinct
    from the [wave phase of the ion-cyclotron heating antenna](name:wave_phase_of_ion_cyclotron_heating_antenna),
    which describes inter-element phasing, and together with the [reflected power
    of the ion-cyclotron heating antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)
    it specifies the phase-and-magnitude state of the reflected power wave without
    including the magnitude itself.


    Sign convention: Positive when the reflected-wave phasor at the selected element
    leads the forward-wave phasor at the same element in phase under the adopted temporal
    phasor convention.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:forward_wave_phase_of_ion_cyclotron_heating_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:wave_phase_of_ion_cyclotron_heating_antenna
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/phase_reflected
    version: 4.1.1
- name: reflected_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Reflected power of an ion-cyclotron heating antenna is the backward-traveling
    radio-frequency power returned from one antenna toward the transmission-line source
    rather than coupled into the plasma.
  documentation: 'Reflected power of an ion-cyclotron heating antenna is the backward-traveling
    radio-frequency wave power at a defined reference plane on the feed line, directed
    away from the antenna toward the source. It is the returned component of the antenna-associated
    power and represents incident power rejected by antenna-plasma coupling.


    At a common reference plane, the reflected and forward traveling-wave powers are
    related by


    $$

    P_{\mathrm{ref}} = |\Gamma|^2 P_{\mathrm{fwd}}

    $$


    where $P_{\mathrm{ref}}$ is the reflected power, $\Gamma$ is the complex wave
    reflection coefficient, and $P_{\mathrm{fwd}}$ is the [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)
    traveling toward the antenna.


    This quantity applies to one ion-cyclotron heating antenna and represents the
    aggregate returned power associated with that antenna at the defined reference
    plane. When an antenna contains multiple modules, it is distinct from reflected
    power assigned to an individual module; it also excludes forward power, power
    coupled into the plasma, and source power not present at the reference plane.


    It complements [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)
    as the opposite traveling-wave component at the feed-line reference plane. The
    [launched power] is power delivered from the antenna into the plasma, so it is
    physically distinct from returned reflected power; the two quantities must not
    be identified or substituted for one another.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/power_reflected
    version: 4.1.0
  - kind: imas-dd
    ref: ic_antennas/antenna/power_reflected
    version: 4.1.0
- name: root_mean_square_of_wave_current_of_antenna_strap
  kind: scalar
  status: active
  description: Effective non-negative magnitude of the radio-frequency current oscillating
    along a single ion-cyclotron-heating antenna strap.
  documentation: 'The root-mean-square wave current is the effective magnitude of
    the oscillatory radio-frequency current carried by one ion-cyclotron-heating antenna
    strap during wave excitation. It is a non-negative scalar that represents the
    current waveform over an RF cycle.


    For an RF period, the RMS current is defined by


    $$

    I_{\mathrm{RMS}} = \sqrt{\frac{1}{T_{\mathrm{RF}}}\int_{0}^{T_{\mathrm{RF}}} i^2(t)\,dt}

    $$


    where $I_{\mathrm{RMS}}$ is the RMS wave current, $i(t)$ is the instantaneous
    wave current in the strap, $t$ is time, and $T_{\mathrm{RF}}$ is the RF period.
    The time origin is arbitrary within the period.


    The quantity applies to a single antenna strap and averages over one RF period;
    it is not a sum over straps or antenna modules. It describes the strap-conductor
    current associated with the launched wave and excludes plasma current and non-wave
    direct current.


    It is the RMS transformation of the underlying [wave current of antenna strap](name:wave_current_of_antenna_strap).
    Unlike that parent quantity, it does not retain instantaneous sign or phase. For
    sinusoidal excitation, it equals the peak current magnitude divided by the square
    root of two and therefore differs from the [wave current of antenna strap amplitude](name:wave_current_of_antenna_strap_amplitude).'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:wave_current_of_antenna_strap_amplitude
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/strap/current
    version: 4.1.0
- name: toroidal_angle_of_antenna_strap
  kind: scalar
  status: active
  description: "Toroidal angular coordinate of each antenna-strap outline point around\
    \ the machine symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The toroidal angle is the azimuthal coordinate assigned to each\
    \ point on the geometric outline of an antenna strap. It identifies the point\u2019\
    s circumferential location in the right-handed cylindrical $(R,\\phi,Z)$ frame,\
    \ where $R$ is major radius measured from the machine symmetry axis, $\\phi$ is\
    \ toroidal angle, and $Z$ is vertical height.\n\nThis quantity applies to individual\
    \ strap-outline points and is not a mean, sum, nominal center coordinate, or mechanical\
    \ orientation angle. No aggregation over the outline is implied; each point retains\
    \ its own $\\phi$ value.\n\nTogether with the other coordinates of the outline,\
    \ this angle locates the strap geometry. It is distinct from the [radial coordinate\
    \ of the antenna strap](name:radial_coordinate_of_antenna_strap), which locates\
    \ a strap reference point, while [vertical outline of the antenna strap](name:vertical_outline_of_antenna_strap)\
    \ provides the corresponding signed vertical coordinate for outline points. The\
    \ same angular-coordinate concept is used for a different object by [toroidal\
    \ angle of a coil conductor element](name:toroidal_angle_of_coil_conductor_element).\n\
    \nSign convention: Positive when the angular displacement from the chosen $\\\
    phi=0$ reference is toward increasing toroidal angle $\\phi$, counter-clockwise\
    \ when viewed from above $+Z$."
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:vertical_outline_of_antenna_strap
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/strap/outline/phi
    version: 4.1.0
- name: total_external_heating_power
  kind: scalar
  status: active
  description: Total non-inductive power coupled from external neutral-beam and radio-frequency
    heating systems to the plasma, summed over auxiliary sources and excluding Ohmic
    heating.
  documentation: 'Total external heating power is the aggregate non-inductive power
    coupled to the plasma by auxiliary heating systems. It includes neutral-beam injection
    and electron-cyclotron, ion-cyclotron, and lower-hybrid systems, while excluding
    power associated with Ohmic induction.


    The defining aggregate relation is


    $$

    P_{\mathrm{ext}} = \sum_{s \in \mathcal{S}_{\mathrm{aux}}} P_s

    $$


    where $P_{\mathrm{ext}}$ is the total external heating power, $\mathcal{S}_{\mathrm{aux}}$
    is the set of included auxiliary heating systems, and $P_s$ is the power coupled
    to the plasma by auxiliary source $s$.


    The quantity applies to the whole plasma and is summed over all included auxiliary
    sources rather than resolved by source, species, or spatial region. It represents
    external power input that may contribute to both plasma heating and non-inductive
    current drive; it is distinct from Ohmic heating and from generator power that
    is not coupled to the plasma. Source-specific contributions include [total power
    due to electron-cyclotron heating](name:total_power_due_to_electron_cyclotron_heating),
    [total power due to ion-cyclotron heating](name:total_power_due_to_ion_cyclotron_heating),
    and power absorbed from a [neutral-beam injector](name:absorbed_power_of_neutral_beam_injector),
    whose aggregate forms contribute to the sum.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  sources:
  - kind: imas-dd
    ref: summary/heating_current_drive/power_additional/value
    version: 4.1.0
- name: total_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: active
  description: Total radio-frequency wave power coupled into the plasma across the
    ion-cyclotron launcher boundary, aggregated over all heating launchers after reflected
    and pre-coupling losses.
  documentation: "Total ion-cyclotron heating power is the aggregate radio-frequency\
    \ electromagnetic-wave power coupled from all ion-cyclotron heating launchers\
    \ into the plasma. It is defined at the launcher\u2013plasma boundary rather than\
    \ as the power ultimately deposited in plasma particles.\n\nThe total coupled\
    \ power is the sum of the launcher-resolved coupled powers:\n\n$$\nP_{\\mathrm{IC}}\
    \ = \\sum_{a \\in \\mathcal{L}} P_{\\mathrm{IC},a}\n$$\n\nwhere $P_{\\mathrm{IC}}$\
    \ is the total ion-cyclotron coupled power, $\\mathcal{L}$ is the set of ion-cyclotron\
    \ heating launchers included in the aggregate, $a$ is a launcher index, and $P_{\\\
    mathrm{IC},a}$ is the coupled power for launcher $a$ defined by [power due to\
    \ ion-cyclotron heating](name:power_due_to_ion_cyclotron_heating).\n\nThe aggregation\
    \ includes every launcher in $\\mathcal{L}$ and excludes generator output, reflected\
    \ wave power, and transmission or antenna losses occurring before the launcher\u2013\
    plasma boundary. It is distinct from antenna-side forward or reflected power and\
    \ is not reduced by incomplete absorption of the coupled wave field after it enters\
    \ the plasma."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_ion_cyclotron_heating
  arguments:
  - name: power_due_to_ion_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: summary/heating_current_drive/power_ic/value
    version: 4.1.0
- name: vertical_outline_of_antenna_strap
  kind: scalar
  status: active
  description: Signed vertical coordinate of each contour point defining an ion-cyclotron
    antenna strap boundary, distinguishing the strap outline from its geometric-center
    location.
  documentation: 'The vertical outline coordinate is the signed height of one contour
    point on the geometric boundary of an ion-cyclotron antenna strap, expressed in
    the right-handed cylindrical $(R, \phi, Z)$ frame. It describes boundary geometry
    rather than a field or thermodynamic quantity.


    The quantity applies pointwise to the strap outline: each value belongs to one
    boundary contour point. Values are not summed, averaged, or integrated over the
    outline, and the quantity does not represent the strap''s geometric-center location.


    The geometric-center location is represented separately by the [vertical coordinate
    of the antenna strap](name:vertical_coordinate_of_antenna_strap). Collectively,
    the coordinates of corresponding outline points define the strap boundary geometry.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/strap/outline/z
    version: 4.1.0
- name: wave_current_of_antenna_strap_amplitude
  kind: scalar
  status: active
  description: Peak magnitude of the radio-frequency current oscillating along an
    ion-cyclotron-heating antenna strap at a specified location.
  documentation: 'The strap-current amplitude is the non-negative peak magnitude of
    the radio-frequency current associated with electromagnetic-wave excitation at
    a specified location along an ion-cyclotron-heating antenna strap.


    For the oscillatory current represented by a complex phasor, the amplitude is
    defined as


    $$

    I_{\mathrm{amp}} = |\widetilde{I}|

    $$


    where $I_{\mathrm{amp}}$ is the strap-current amplitude and $\widetilde{I}$ is
    the complex phasor of the strap current at the specified location.


    This quantity applies to one antenna strap within one antenna module and is evaluated
    at the relevant position along that strap. It characterizes the radio-frequency
    excitation associated with the module''s wave current; it is not summed or averaged
    over multiple straps, modules, or the complete antenna system. The amplitude is
    non-negative and therefore excludes the sign and phase information of the instantaneous
    current.


    As the amplitude form of [wave current of antenna strap](name:wave_current_of_antenna_strap),
    it retains the parent quantity''s strap locus and wave-current meaning while selecting
    its peak magnitude. It is distinct from the instantaneous signed current and from
    a root-mean-square representation of the same oscillatory current.'
  unit: A
  physics_domain: auxiliary_heating
  links: []
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/current/amplitude
    version: 4.1.0
- name: wave_phase_of_antenna_strap
  kind: scalar
  status: active
  description: Phase angle of the radio-frequency current phasor carried by one ion-cyclotron-heating
    antenna strap, defined relative to a specified RF phase reference.
  documentation: 'Wave phase of an antenna strap is the phase angle of the oscillatory
    radio-frequency current phasor carried by that strap. It describes the strap-level
    excitation phase used in the antenna''s toroidal phasing configuration.


    The complex strap-current phasor may be represented as


    $$

    I_s = |I_s|e^{i\phi_s}

    $$


    where $I_s$ is the complex radio-frequency current phasor, $|I_s|$ is its current
    amplitude, and $\phi_s$ is the wave phase represented by this quantity. The phase
    is defined modulo $2\pi$ relative to a specified RF reference phase.


    This quantity applies to one antenna strap and is not summed or averaged over
    multiple straps. It refers to the phase of the strap current, not the phase of
    a forward power-wave phasor, which is represented by [forward wave phase of an
    ion-cyclotron-heating antenna](name:forward_wave_phase_of_ion_cyclotron_heating_antenna),
    or the phase associated with a complete antenna element.


    The associated [wave current of antenna strap](name:wave_current_of_antenna_strap)
    provides the phasor whose phase is specified, while [wave current of antenna strap
    amplitude](name:wave_current_of_antenna_strap_amplitude) determines its magnitude
    rather than its phase. Relative phases between straps determine the toroidal phasing
    of the antenna excitation and therefore influence the launched wave excitation
    spectrum. The phase-reference plane and any phase-unwrapping convention must be
    specified separately when comparing values.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:forward_wave_phase_of_ion_cyclotron_heating_antenna
  - name:wave_current_of_antenna_strap_amplitude
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/strap/phase
    version: 4.1.1
- name: wave_phase_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Relative phase angle of a radio-frequency phasor at an antenna element
    in an ion-cyclotron heating launcher, measured relative to the first element for
    inter-element phasing.
  documentation: 'This quantity is the relative phase of a complex radio-frequency
    phasor at a selected antenna strap or module feed with respect to the first reference
    element. It specifies inter-element phasing of an ion-cyclotron heating launcher
    rather than an absolute phase.


    For selected element $i$, the relative phase is defined by


    $$

    \Delta\phi_i = \arg\left(A_i A_1^*\right) \pmod{2\pi}

    $$


    where $\Delta\phi_i$ is the relative phase of element $i$, $A_i$ is its complex
    radio-frequency voltage or wave phasor, $A_1$ is the phasor of the first reference
    element, $A_1^*$ is the complex conjugate of that reference phasor, and $\arg$
    extracts the phase angle. The reference element has zero relative phase, and the
    result is defined modulo $2\pi$.


    The quantity applies independently to one selected antenna element or module feed
    and is not summed or averaged over modules. It describes the radio-frequency signal
    associated with the antenna feed, not a phase belonging to a plasma population
    or integrated over a plasma region. It excludes absolute phase, amplitude, power,
    and reflection coefficient, although the phase may characterize a complex feed
    voltage or traveling-wave quantity.


    The family parent [phase of the ion-cyclotron heating antenna](name:phase_of_ion_cyclotron_heating_antenna)
    provides the common relative-phase meaning. Propagation-specific instances retain
    this definition while selecting the wave direction, as in the [forward wave phase
    of the ion-cyclotron heating antenna](name:forward_wave_phase_of_ion_cyclotron_heating_antenna)
    and the [reflected phase of the ion-cyclotron heating antenna](name:reflected_phase_of_ion_cyclotron_heating_antenna).


    Sign convention: Positive when the selected element''s radio-frequency phasor
    leads the first reference element in phase under the adopted temporal phasor convention.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:forward_wave_phase_of_ion_cyclotron_heating_antenna
  - name:reflected_phase_of_ion_cyclotron_heating_antenna
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/voltage/phase
    version: 4.1.1
- name: forward_wave_phase_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Relative phase of the forward radio-frequency power-wave phasor at
    an ion-cyclotron-heating antenna module, referenced to the first module for inter-module
    toroidal phasing.
  documentation: 'The forward-wave phase is the relative phase angle of the complex
    radio-frequency power-wave phasor associated with one ion-cyclotron-heating antenna
    module. It describes inter-module phasing rather than an absolute phase.


    For selected module $i$, the relative forward-wave phase is defined by


    $$

    \theta_i^{+} = \arg\left(\tilde{a}_i^{+}\right) - \arg\left(\tilde{a}_1^{+}\right)

    $$


    where $\theta_i^{+}$ is the relative forward-wave phase, $i$ identifies the selected
    antenna module, module $1$ is the first reference module, $\tilde{a}_i^{+}$ is
    the complex phasor of the forward radio-frequency power wave associated with module
    $i$, and $\arg$ returns a phasor''s phase angle.


    The quantity applies only to the forward wave at an antenna module and is defined
    relative to the first module; no absolute phase relative to a generator or external
    reference is implied. It concerns the electromagnetic power-wave phasor, not a
    plasma-particle quantity or a spatially distributed plasma field.


    This is the forward-wave specialization of the relative antenna phasor phase defined
    by [wave phase of an ion-cyclotron-heating antenna](name:wave_phase_of_ion_cyclotron_heating_antenna).
    It is distinct from the relative phase of the reflected wave, [reflected phase
    of an ion-cyclotron-heating antenna](name:reflected_phase_of_ion_cyclotron_heating_antenna),
    and from the phase of the RF current carried by an antenna strap, [wave phase
    of an antenna strap](name:wave_phase_of_antenna_strap).


    Sign convention: Positive when the selected module''s forward-wave phasor leads
    the first reference module in phase.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:wave_phase_of_ion_cyclotron_heating_antenna
  - name:reflected_phase_of_ion_cyclotron_heating_antenna
  - name:wave_phase_of_antenna_strap
  arguments:
  - name: wave_phase_of_ion_cyclotron_heating_antenna
    operator: forward
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/phase_forward
    version: 4.1.1
