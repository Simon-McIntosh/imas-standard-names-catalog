- name: launched_power_of_wave_beam
  kind: scalar
  status: draft
  description: Net radio-frequency or microwave power carried by a single wave beam
    as it enters the vacuum vessel. It is the forward power after transmission losses
    minus reflected or returned power at the launch reference plane, representing
    power available for plasma heating or current drive.
  documentation: 'Launched power of a wave beam is the net electromagnetic power carried
    by one RF or microwave beam through the launcher aperture into the vacuum vessel.
    It is evaluated after losses in the transmission and launcher system, but before
    subsequent propagation losses, wall interception, or plasma absorption inside
    the vessel.


    For a beam crossing a launch surface, the beam-level definition is the net Poynting
    flux through that surface, equivalently the forward power minus reflected or returned
    power at the same reference plane:


    $$

    P_{\mathrm{launched}} = \int_A \langle \mathbf{S} \rangle \cdot \hat{\mathbf{n}}\,dA
    = P_{\mathrm{forward}} - P_{\mathrm{reflected}}

    $$


    where $A$ is the launch aperture or beam reference surface, $\langle \mathbf{S}
    \rangle$ is the time-averaged electromagnetic Poynting vector, $\hat{\mathbf{n}}$
    points from the launcher into the vessel, and the forward and reflected powers
    are evaluated for the same beam at that plane.


    In practice this quantity is determined from calibrated directional couplers,
    diode detectors, calorimetry, or power-balance measurements in the transmission
    line and launcher. Corrections account for source-to-launcher attenuation, beam
    splitting, imperfect coupling, and reflected power. It is the beam-level analog
    of net launched RF power used for electron-cyclotron launchers and lower-hybrid
    antennas; totals are formed separately by summing comparable net launched powers
    over beams, launchers, or antenna elements.


    Typical representative values for an active high-power RF or microwave heating
    beam are about $1 \times 10^5$-$2 \times 10^6$ W, while inactive or inhibited
    beams are 0 W. The exact value depends on the source power, transmission efficiency,
    launcher coupling, pulse timing, and protection limits.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_electron_cyclotron_launcher
  - name:power_of_ion_cyclotron_heating_antenna
  arguments:
  - name: power_of_wave_beam
    operator: launched
    operator_kind: qualifier
  sources:
