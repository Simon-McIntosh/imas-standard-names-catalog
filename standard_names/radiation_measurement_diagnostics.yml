- name: spectral_signal_to_noise_ratio_of_spectrometer_channel
  kind: scalar
  status: active
  description: Spectral signal-to-noise ratio of a spectrometer channel is the channel-level
    logarithmic comparison between integrated spectral power in a selected signal
    band and integrated spectral power in a selected line-free reference band. It
    characterizes spectral signal quality independent of the particular spectroscopic
    application motivating the band selection.
  documentation: 'Spectral signal-to-noise ratio of a spectrometer channel is the
    channel-level logarithmic comparison between the integrated spectral power in
    a selected signal band containing spectral features of interest and the integrated
    spectral power in a selected line-free reference band. It characterizes the spectral
    signal quality of the channel as a whole, independent of the particular spectroscopic
    application motivating the band selection.


    The quantity is a base-ten logarithmically scaled power ratio:


    $$

    \mathrm{SNR} = 10 \log_{10}\!\left( \frac{P_{\mathrm{sig}}}{P_{\mathrm{ref}}}
    \right)

    $$


    where $P_{\mathrm{sig}}$ is the spectral power integrated over the selected signal
    band and $P_{\mathrm{ref}}$ is the spectral power integrated over the selected
    line-free reference band of the same channel.


    The quantity applies to a single spectrometer channel and to one selected pair
    of spectral bands. The signal and reference bands are a selection convention of
    the spectroscopic analysis and are not fixed by this name: any band pair chosen
    to compare feature-bearing spectral content against feature-free spectral content
    of the same channel yields an instance of this quantity. The value is positive
    when the signal-band integrated power exceeds the reference-band integrated power
    and negative when it is smaller.


    It is a band-integrated power ratio expressed on a logarithmic scale. It is not
    an amplitude ratio, which would carry a factor of twenty rather than ten before
    the base-ten logarithm; it is not a pointwise spectral-intensity ratio at a single
    wavelength; and it is not a noise variance, noise standard deviation, or detector
    time-domain signal-to-noise ratio.


    The [logarithm of spectral signal-to-noise ratio of a spectrometer channel](name:logarithm_of_spectral_signal_to_noise_ratio_of_spectrometer_channel)
    is the member of this family whose name makes the base-ten logarithmic transform
    explicit; it shares the defining relation above and is attested for band pairs
    selected for isotope-ratio analysis, where the signal band contains the isotope
    lines of interest. This parent subsumes that member together with any analogous
    logarithmically scaled band-pair comparison arising in other spectroscopic applications
    of the channel.'
  unit: dB
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: spectrometer_visible/channel/isotope_ratios/signal_to_noise
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-isotope_ratios-signal_to_noise
    dd_documentation:
      leaf: Log10 of the ratio of the powers in two bands, one with the spectral lines
        of interest (signal) the other without spectral lines (noise).
      parent_path: spectrometer_visible/channel/isotope_ratios
      parent: Isotope ratios and related information
      data_type: FLT_1D
      unit: dB
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/time
    enhanced_context:
      description: Signal-to-noise ratio (SNR) for isotope ratio analysis in visible
        spectroscopy, expressed as log10 of the ratio of integrated power in the spectral
        band containing lines of interest to the power in a line-free reference band.
      kind: llm
- name: temperature_of_soft_xray_detector
  kind: scalar
  status: active
  description: Thermodynamic temperature of the soft X-ray detector assembly, describing
    its physical thermal state for calibration and monitoring rather than a plasma
    temperature inferred from radiation.
  documentation: 'The quantity is the thermodynamic temperature of the physical soft
    X-ray detector assembly and describes the thermal state of its hardware.


    It applies to the detector object as a whole, with no implied plasma population,
    spatial subcomponent, or charge-state aggregation. It is distinct from the plasma
    electron temperature inferred from detected soft X-ray radiation and does not
    represent a photon-energy or spectral-response quantity.


    The temperature is the thermal operating state relevant to calibration and hardware-condition
    monitoring. It is conceptually analogous to [temperature of neutron detector](name:temperature_of_neutron_detector),
    while [spectral efficiency of soft X-ray detector](name:spectral_efficiency_of_soft_xray_detector)
    describes photon-registration probability rather than detector hardware temperature.'
