    enhanced_context:
      description: Lower photon energy bound of a hard X-ray emission energy band
        used in the emissivity profile reconstruction. Defines the lower threshold
        of the photon energy window for a given energy-resolved emissivity channel.
      kind: llm
  - dd_path: soft_x_rays/channel/energy_band/lower_bound
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-energy_band-lower_bound
    dd_documentation:
      leaf: Lower bound of the energy band
      parent_path: soft_x_rays/channel/energy_band
