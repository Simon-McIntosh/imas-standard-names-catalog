- name: poloidal_electron_energy_diffusivity
  kind: scalar
  status: active
  description: Effective Fickian diffusivity for electron thermal energy transport
    in the poloidal direction on magnetic flux surfaces, multiplying the electron-temperature
    gradient to give the conductive electron heat flux.
  documentation: 'Poloidal electron energy diffusivity, usually denoted $\chi_{e,\theta}$,
    is the effective Fickian transport coefficient for conductive transport of electron
    thermal energy in the poloidal direction on a magnetic flux surface. It represents
    the part of the electron heat-flux closure driven by the poloidal electron-temperature
    gradient, distinct from convective transport of electron energy by a pinch or
    flow velocity.


    For flux coordinates $(\rho, \theta, \phi)$, with $\rho$ increasing from the magnetic
    axis toward the plasma boundary, $\theta$ a chosen poloidal angle, and $\phi$
    the toroidal angle of the right-handed cylindrical $(R, \phi, Z)$ frame with basis
    $(\hat{R}, \hat{\phi}, \hat{Z})$, the conductive poloidal heat-flux projection
    is commonly written as:


    $$

    q_{e,\theta}^{\mathrm{cond}} = -\chi_{e,\theta}\,\hat{\mathbf{e}}_\theta \cdot
    \nabla T_e

    $$


    where $q_{e,\theta}^{\mathrm{cond}}$ is the conductive electron heat-flux projection
    along $\hat{\mathbf{e}}_\theta$, $\hat{\mathbf{e}}_\theta$ is the unit vector
    tangent to increasing $\theta$ on a surface of constant $\rho$, $\chi_{e,\theta}$
    is the poloidal electron energy diffusivity, and $T_e$ is the electron temperature
    expressed as the energy variable used in the electron energy equation. The minus
    sign sets the diffusive direction: a positive electron-temperature gradient along
    increasing $\theta$ gives a negative heat-flux projection, so conductive transport
    is toward lower electron temperature.


    This quantity is the poloidal member of [electron_energy_diffusivity](name:electron_energy_diffusivity)
    and is distinct from [parallel_electron_energy_diffusivity](name:parallel_electron_energy_diffusivity).
    It is a scalar diagonal Fickian coefficient; density factors, heat-capacity factors,
    metric factors, nonlocal terms, off-diagonal transport, and advective transport
    are separate elements of a transport closure rather than part of this coefficient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_energy_diffusivity
  - name:poloidal_electron_energy_diffusion_coefficient
  - name:parallel_electron_energy_diffusivity
