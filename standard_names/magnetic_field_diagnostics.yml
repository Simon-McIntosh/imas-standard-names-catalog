- name: toroidal_angle_of_magnetic_field_probe_sensor_normal
  kind: scalar
  status: draft
  description: Toroidal angle of the projection of a magnetic field probe's sensor
    normal vector onto the horizontal plane, measured from the direction of increasing
    major radius $R$.
  documentation: 'The toroidal angle $\phi_n$ characterizes the azimuthal orientation
    of the sensitive axis of a magnetic field probe coil, specifically the projection
    of its sensor normal unit vector $\hat{n}$ onto the horizontal plane. This angle
    is defined relative to $\nabla R$ (the direction of increasing major radius) and
    is taken modulo $\pi$ with values in $(-\pi/2, \pi/2]$; $\phi_n = 0$ when the
    projected sensor normal is parallel to $\nabla R$, and $\phi_n = \pi/2$ when it
    is aligned with $\nabla \phi$ (the toroidal direction). Accurate knowledge of
    $\phi_n$ is essential for decomposing the measured field signal into its physical
    components: a probe whose sensitive axis has a nonzero toroidal projection will
    partially respond to the toroidal field $B_\phi$ in addition to the intended poloidal
    or radial component. This orientation angle is a fixed geometric calibration quantity
    determined from the physical installation of the probe on the device, complementing
    the [poloidal angle of the sensor normal](name:poloidal_angle_of_magnetic_field_probe_sensor_normal),
    which describes the out-of-plane elevation of the sensitive axis. Together the
    two angles fully specify the three-dimensional orientation of the probe''s sensitive
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the projected sensor normal points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    along $+\hat{Z}$).'
  unit: rad
  physics_domain: magnetic_field_diagnostics
  links:
  - name:poloidal_angle_of_magnetic_field_probe_sensor_normal
  constraints: []
  sources:
