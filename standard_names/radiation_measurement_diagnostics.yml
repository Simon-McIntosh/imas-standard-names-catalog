- name: wavelength_of_detector_pixel
  kind: scalar
  status: active
  description: Wavelength of a detector pixel is the vacuum spectral coordinate assigned
    by Bragg diffraction geometry to its representative X-ray response.
  documentation: 'Wavelength of a detector pixel is the vacuum spectral coordinate
    assigned to a detector pixel by the Bragg diffraction geometry of an X-ray crystal
    spectrometer. It identifies a characteristic photon wavelength associated with
    the pixel''s response.


    The assigned wavelength follows Bragg''s relation:


    $$

    n\lambda_0 = 2d\sin(\theta_B)

    $$


    where $\lambda_0$ is the vacuum wavelength, $d$ is the spacing of the diffracting
    crystal lattice planes, $\theta_B$ is the Bragg angle between the incident beam
    and those planes, and $n$ is the diffraction order.


    This pixel-level assignment is a specialization of [wavelength](name:wavelength)
    and is distinct from the channel-level response coordinate [wavelength_of_spectrometer_channel](name:wavelength_of_spectrometer_channel).
    The corresponding photon-energy representation is [energy_of_detector_pixel](name:energy_of_detector_pixel),
    while the accepted spectral bounds are given by [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength
  - name:wavelength_of_spectrometer_channel
  - name:energy_of_detector_pixel
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
  arguments:
  - name: wavelength
    operator: detector_pixel
    operator_kind: locus
  sources:
