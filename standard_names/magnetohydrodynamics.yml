- name: energy_upper_fraction_due_to_disruption
  kind: scalar
  status: draft
  description: Dimensionless upper fractional threshold (commonly labeled X2) for
    the custom linear thermal-energy decay time during a disruption, marking the higher
    of two crossing levels of the normalized thermal energy.
  documentation: 'The energy upper fractional threshold X2 is the higher of two user-specified
    dimensionless levels of the normalized thermal energy $W_\mathrm{th}/W_\mathrm{th,0}$
    used to bracket the thermal-energy quench interval during a disruption. It marks
    the point in the decay sequence that the thermal energy crosses first, and is
    paired with [energy_lower_fraction_due_to_disruption](name:energy_lower_fraction_due_to_disruption)
    (X1, where $X_1 < X_2 \leq 1$) to define the decay-time window.


    The two thresholds jointly define the custom linear thermal-energy decay time
    $\tau_\mathrm{th,lin}$:


    $$

    \tau_\mathrm{th,lin} = \frac{t(X_2) - t(X_1)}{X_1 - X_2}

    $$


    where $t(X_i)$ is the time at which the normalized thermal energy $W_\mathrm{th}(t)/W_\mathrm{th,0}$
    passes through level $X_i$ and $W_\mathrm{th,0}$ is the pre-disruption reference
    energy. Because thermal energy decays monotonically during a quench, $t(X_2) <
    t(X_1)$, so both numerator and denominator are negative and $\tau_\mathrm{th,lin}$
    is positive. The resulting decay time is reported as [thermal_decay_time](name:thermal_decay_time).
    This quantity is the energy-specific instance of the general [upper_fraction_due_to_disruption](name:upper_fraction_due_to_disruption)
    concept, which applies analogously to plasma-current metrics as in [plasma_linear_decay_time](name:plasma_linear_decay_time).


    Sign convention: Positive when the upper threshold level X2 is set to a nonzero
    fraction of the pre-disruption thermal energy and above the lower threshold X1,
    corresponding to a physically valid downward-crossing decay interval.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:energy_lower_fraction_due_to_disruption
  - name:thermal_decay_time
  - name:upper_fraction_due_to_disruption
  - name:plasma_linear_decay_time
  sources:
  - id: dd:summary/disruption/decay_times/energy_thermal/linear_custom/x2
    dd_path: summary/disruption/decay_times/energy_thermal/linear_custom/x2
    status: composed
- name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  kind: scalar
  status: draft
  description: Value of the normalized toroidal flux radius rho_tor_norm at the sawtooth
    inversion surface. This surface is identified by the sign change of the electron-temperature
    perturbation during a sawtooth crash and is often close to the q=1 rational surface.
  documentation: 'The normalized toroidal flux coordinate at the sawtooth inversion
    radius is the value of the flux coordinate $\rho_{\mathrm{tor,norm}}$ on the surface
    where the electron-temperature perturbation changes sign during a sawtooth crash.
    The inversion surface is a marker of the radial extent of the sawtooth crash and
    is commonly associated with the $q=1$ rational surface.


    The normalized toroidal flux radius on a magnetic flux surface is defined by


    $$

    \rho_{\mathrm{tor,norm}} = \left(\frac{\Phi - \Phi_0}{\Phi_b - \Phi_0}\right)^{1/2}

    $$


    where $\Phi$ is the toroidal magnetic flux enclosed by the surface in Wb, $\Phi_0$
    is the magnetic-axis value in Wb, and $\Phi_b$ is the boundary value in Wb. For
    this quantity, the expression is evaluated on the sawtooth inversion surface.


    In practice, the inversion radius is inferred from time-resolved electron-temperature
    or emissivity measurements by locating the radial position where the crash-induced
    perturbation changes sign, then mapping that position to the reconstructed flux
    coordinate $\rho_{\mathrm{tor,norm}}$. When direct inversion-surface localization
    is limited, the nearby $q=1$ rational surface may be used as a physics reference,
    often together with quantities such as [magnetic_shear_at_sawtooth_inversion_radius](name:magnetic_shear_at_sawtooth_inversion_radius).
    The inversion radius is typically inside or comparable to the sawtooth mixing
    radius, described by [normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius).


    Values are dimensionless and lie between 0 at the magnetic axis and 1 at the plasma
    boundary for closed-flux-surface normalization. Sawtooth inversion surfaces are
    usually in the plasma core, commonly around 0.2-0.6, with the exact value depending
    on the current profile, pressure profile, and sawtooth dynamics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  sources:
  - id: dd:sawteeth/diagnostics/rho_tor_norm_inversion
    dd_path: sawteeth/diagnostics/rho_tor_norm_inversion
    status: composed
  - id: dd:sawteeth/diagnostics/rho_tor_norm_q1
    dd_path: sawteeth/diagnostics/rho_tor_norm_q1
    status: attached
- name: normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  kind: scalar
  status: draft
  description: Value of rho_tor_norm at the sawtooth mixing radius, the flux surface
    marking the outer boundary of the plasma region homogenized during a sawtooth
    crash.
  documentation: 'The normalized toroidal flux coordinate at the sawtooth mixing radius
    is the value of $\rho_{\mathrm{tor,norm}}$ on the flux surface that bounds the
    region mixed during a sawtooth crash. It locates the mixing surface in magnetic-flux
    space, with 0 at the magnetic axis and 1 at the last closed flux surface.


    The coordinate value is obtained by evaluating the normalized toroidal flux coordinate
    on the sawtooth mixing surface:


    $$

    \rho_{\mathrm{tor,norm,mix}} = \left(\frac{\Phi_{\mathrm{mix}} - \Phi_0}{\Phi_{\mathrm{LCFS}}
    - \Phi_0}\right)^{1/2}

    $$


    where $\Phi_{\mathrm{mix}}$ is the toroidal magnetic flux in Wb enclosed by the
    sawtooth mixing surface, $\Phi_0$ is the magnetic-axis toroidal flux in Wb, and
    $\Phi_{\mathrm{LCFS}}$ is the boundary toroidal flux in Wb at the last closed
    flux surface.


    In practice the mixing radius is inferred from the radial extent of crash-induced
    redistribution, such as flattening or abrupt changes in core temperature, density,
    radiation, or other sawtooth-sensitive observables, mapped onto equilibrium flux
    surfaces. It should not be assumed to coincide with the inversion surface or with
    any particular magnetic-safety-factor surface unless that identification is part
    of a stated sawtooth model.


    For a closed-flux-surface mixing boundary this dimensionless coordinate lies in
    the interval 0-1 by definition. No universal narrower range applies, because the
    value depends on the discharge, equilibrium, diagnostic interpretation, and crash
    dynamics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  sources:
  - id: dd:sawteeth/diagnostics/rho_tor_norm_mixing
    dd_path: sawteeth/diagnostics/rho_tor_norm_mixing
    status: composed
- name: parallel_plasma_velocity
  kind: scalar
  status: draft
  description: Signed component of the plasma bulk center-of-mass velocity along the
    local magnetic-field direction. The center-of-mass velocity is the mass-weighted
    mean of the contributing species velocities before projection.
  documentation: 'Parallel plasma velocity is the field-aligned component of the plasma
    center-of-mass velocity. The center-of-mass velocity is formed as the mass-weighted
    mean of the contributing species velocities, so this quantity describes bulk plasma
    flow along a magnetic field line rather than the velocity of one selected species.


    It is defined by projecting the center-of-mass velocity onto the local magnetic-field
    unit vector:


    $$

    v_\parallel = \mathbf{v}_{\rm cm}\cdot\hat{\mathbf{b}}, \qquad \hat{\mathbf{b}}
    = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathbf{v}_{\rm cm}$ is the plasma center-of-mass velocity in $\mathrm{m\,s^{-1}}$,
    $\mathbf{B}$ is the local magnetic field in tesla, and $\hat{\mathbf{b}}$ is the
    dimensionless unit vector in the direction of $\mathbf{B}$. Equivalently, $\mathbf{v}_{\rm
    cm}$ may be written as the mass-weighted species mean velocity before the projection
    is applied.


    In practice, this quantity is obtained by determining or modeling the plasma bulk
    velocity and the local magnetic-field direction, then applying the projection.
    Experimental interpretation generally requires a flow-sensitive measurement together
    with magnetic-geometry information, especially when species-resolved measurements
    must be converted into a center-of-mass flow.


    Typical magnitudes are strongly regime dependent: slowly flowing core or edge
    plasmas may have $10^2$-$10^4\ \mathrm{m\,s^{-1}}$, while strongly driven or transient
    field-aligned flows can reach $10^4$-$10^5\ \mathrm{m\,s^{-1}}$ or higher.


    Sign convention: Positive when the plasma center-of-mass velocity has a component
    in the direction of the local magnetic field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:radial_plasma_velocity
  - name:toroidal_plasma_velocity
  - name:vertical_plasma_velocity
  - name:parallel_center_of_mass_velocity
  - name:parallel_particle_velocity
