name: vertical_component_of_magnetic_field_at_ferritic_element_centroid
status: draft
description: Vertical ($Z$) component of the magnetic field evaluated at the centroid
  of a ferritic insert element.
documentation: "The vertical magnetic field component $B_Z = \\mathbf{B} \\cdot \\\
  hat{Z}$ at the volumetric centroid of each ferritic element represents the poloidal-plane\
  \ vertical field contribution at the insert location. Together with $B_R$ and $B_\\\
  phi$, it provides the full field vector needed to evaluate the element's magnetization\
  \ via the nonlinear $B$-$H$ characteristic of the ferritic steel. In tokamaks, $B_Z$\
  \ at in-vessel positions is typically of order $10^{-2}$\u2013$10^{-1}\\;\\mathrm{T}$,\
  \ arising primarily from the poloidal-field coil system and plasma equilibrium currents.\
  \ Positive when directed in the $+Z$ (upward) direction of the machine cylindrical\
  \ coordinate system. The self-consistent loop\u2014computing $\\mathbf{B}$ at centroids,\
  \ deriving $\\mathbf{M}$, updating the total field\u2014is iterated until convergence\
  \ in ferritic modeling codes. See `vertical_component_of_magnetic_field` for the\
  \ general vertical field and the radial and toroidal siblings for the companion\
  \ centroid field components."
