- name: vertical_coordinate_of_x_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the primary magnetic X-point on the separatrix
    in a diverted tokamak equilibrium.
  documentation: 'The primary X-point is the poloidal-field null ($\nabla\psi = 0$)
    on the separatrix in a diverted equilibrium, where the poloidal magnetic flux
    $\psi$ has a saddle point. Its vertical coordinate $Z_{\text{X}}$ determines the
    height of the divertor null relative to the machine midplane ($Z=0$). This location
    is a critical parameter for divertor geometry and controls the magnetic connection
    length to the target plates. Typical values range from $Z_{\text{X}} \approx -0.2$
    to $- tens$ of cm below the midplane in conventional divertors, depending on the
    configuration (lower single-null, double-null). The coordinate is inferred from
    equilibrium reconstruction using magnetic probe and flux-loop data together with
    the [major_radius_of_x_point](name:major_radius_of_x_point) to fully specify the
    null position. See also [vertical_coordinate_of_strike_point](name:vertical_coordinate_of_strike_point),
    which tracks the field-line intersections on the target, and [major_radius_of_secondary_x_point](name:major_radius_of_secondary_x_point)
    for the second null in a double-null or snowflake configuration.


    Sign convention: Positive when the X-point lies above the midplane ($Z=0$) in
    the right-handed cylindrical $(R, \phi, Z)$ frame, with $Z$ increasing upward.'
  unit: m
  physics_domain: equilibrium
