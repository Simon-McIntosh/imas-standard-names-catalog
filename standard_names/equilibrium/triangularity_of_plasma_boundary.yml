name: triangularity_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Average triangularity of the plasma boundary, quantifying the D-shaped
  distortion of the last closed flux surface relative to an ellipse.
documentation: "The triangularity $\\delta$ of the plasma boundary measures the horizontal\
  \ displacement of the flux-surface top and bottom extrema relative to the geometric\
  \ center, normalized to the minor radius $a$: $\\delta = (R_{\\mathrm{geo}} - R_{\\\
  mathrm{upper/lower}}) / a$, where $R_{\\mathrm{geo}}$ is the major radius of the\
  \ geometric center and $R_{\\mathrm{upper/lower}}$ is the major radius at the point\
  \ of maximum $|Z|$. The reported value is typically the average $(\\delta_{\\mathrm{upper}}\
  \ + \\delta_{\\mathrm{lower}}) / 2$. Positive triangularity ($\\delta > 0$, typical\
  \ range $0.2$\u2013$0.5$ in conventional H-mode tokamaks) shifts the extrema inboard,\
  \ improving MHD stability margins; negative triangularity ($\\delta < 0$) is explored\
  \ for improved L-mode confinement scenarios. Obtained from equilibrium reconstruction\
  \ or parametric boundary fitting. See also `lower_triangularity_of_plasma_boundary`,\
  \ `upper_triangularity_of_plasma_boundary`, and `elongation_of_plasma_boundary`."
