- name: cold_neutral_velocity
  kind: scalar
  status: active
  description: Cold neutral velocity is the line-of-sight component of the bulk flow
    of low-energy neutral atoms, identified from the Doppler shift of their emission.
  documentation: 'Cold neutral velocity is the line-of-sight component of the bulk
    drift vector of a cold neutral particle population. It represents convective neutral
    motion after averaging over particle velocities and over the contributing cold-neutral
    population states.


    The component is defined from the parent [neutral velocity](name:neutral_velocity)
    by


    $$

    v_{n,c,ell} = \mathbf{v}_{n,c} \cdot \hat{\ell}

    $$


    where $\mathbf{v}_{n,c}$ is the bulk velocity of the cold neutral population,
    $\hat{\ell}$ is the selected line-of-sight unit vector, and $v_{n,c,\ell}$ is
    the signed projected velocity. The projection is the velocity represented by the
    Doppler centroid of the corresponding cold-neutral emission component.


    This quantity is distinct from [hot neutral velocity](name:hot_neutral_velocity),
    which describes the energetic neutral population, and from [neutral internal state
    velocity](name:neutral_internal_state_velocity), which is resolved for a specified
    internal state. It excludes thermal speed and velocity spread, which are higher
    moments of the velocity distribution.


    Sign convention: Positive when the cold-neutral bulk velocity points along the
    chosen positive line-of-sight unit vector $\hat{\ell}$.'
  unit: m.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutral_velocity
  - name:hot_neutral_velocity
  - name:neutral_internal_state_velocity
  arguments:
