- name: line_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Line-averaged number density of nitrogen nuclei along a plasma diagnostic
    chord, summed over all ionization states. It equals the path integral of the local
    nitrogen density divided by the chord length.
  documentation: 'Line-averaged nitrogen density is the chord-average of the local
    nitrogen number density sampled along a diagnostic line of sight. The nitrogen
    density includes nitrogen nuclei in all ionization states, so different charge
    states contribute according to their local abundance along the chord.


    For a chord path $\Gamma$, the line-averaged nitrogen density is defined by:


    $$

    \langle n_N \rangle_L = \frac{1}{L}\int_{\Gamma} n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local nitrogen number density in m^-3, summed over all
    ionization states, $\ell$ is arclength along the chord in meters, and $L=\int_{\Gamma}d\ell$
    is the chord length in meters over the sampled plasma region.


    In practice this quantity is inferred from diagnostics and analysis methods that
    constrain nitrogen content along a line of sight, often using spectroscopic signals,
    atomic physics modeling, plasma background parameters, and the known viewing geometry.
    Because many measurements are sensitive to emissivity or to particular charge-state
    populations rather than directly to total nitrogen density, the conversion to
    all-ionization-state nitrogen density is model dependent and is not simply a geometric
    division of a raw signal by chord length.


    Typical line-averaged nitrogen densities in tokamak plasmas range from about 1e15-1e18
    m^-3 for trace-seeded conditions and can reach 1e19 m^-3 in strongly seeded or
    detached-edge regimes, depending on fueling, impurity seeding rate, transport,
    and ionization balance.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  - name:line_averaged_carbon_density
  - name:nitrogen_density
  sources:
  - id: dd:summary/line_average/n_i/nitrogen/value
    dd_path: summary/line_average/n_i/nitrogen/value
    status: composed
- name: line_averaged_oxygen_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the total oxygen impurity number density,
    encompassing all charge states from neutral to fully stripped, divided by the
    chord length.
  documentation: "The line-averaged oxygen density is the chord-mean of the local\
    \ oxygen number density\u2014summed over all charge states from neutral O$^0$\
    \ through fully stripped O$^{8+}$\u2014along a measurement path through the plasma.\
    \ It characterizes the mean impurity concentration of oxygen along a given line\
    \ of sight and is directly related to the local [oxygen_density](name:oxygen_density)\
    \ integrated along the chord.\n\nThe defining relation is:\n\n$$\n\\langle n_O\
    \ \\rangle_\\ell = \\frac{1}{L} \\int_0^L n_O(\\ell) \\, d\\ell\n$$\n\nwhere $n_O(\\\
    ell)$ is the local oxygen number density at position $\\ell$ along the chord and\
    \ $L$ is the chord length in m.\n\nLine-averaged impurity densities are extracted\
    \ from chord-integrated spectroscopic measurements of oxygen emission lines combined\
    \ with ionization balance models. Passive spectroscopy of ultraviolet oxygen transitions\
    \ or charge-exchange recombination spectroscopy of helium-like and hydrogen-like\
    \ oxygen lines provides the chord-integrated signal from which the line-averaged\
    \ density is inferred. As a chord-averaged observable, spatial resolution is inherently\
    \ limited, and tomographic inversion or profile modeling is required to recover\
    \ local distributions.\n\nOxygen is a low-concentration impurity in fusion plasmas\
    \ under normal operating conditions; line-averaged values fall several orders\
    \ of magnitude below the electron density, with representative ranges of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ depending on wall conditioning and impurity seeding. The [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ provides the plasma-volume\u2013weighted counterpart, while analogous chord-averaged\
    \ densities for other impurity species include [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)\
    \ and [line_averaged_carbon_density](name:line_averaged_carbon_density).\n\nSign\
    \ convention: Positive when oxygen impurity particles are present along the measurement\
    \ chord at nonzero concentration."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:oxygen_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_carbon_density
  sources:
  - id: dd:summary/line_average/n_i/oxygen/value
    dd_path: summary/line_average/n_i/oxygen/value
    status: composed
- name: voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Instantaneous or sampled raw electrical output voltage of a neutron
    detector module, measured relative to its electronics reference or baseline before
    pulse extraction, filtering, calibration, or conversion to neutron rate.
  documentation: 'Voltage of a neutron detector is the signed electrical potential
    difference produced at the detector output at a specified instant or sample of
    the raw waveform. It represents the direct analog signal relative to an electronics
    reference level or baseline, not a calibrated neutron flux, count rate, pulse
    height, or integrated charge.


    For an output node with electric potential $\Phi_\mathrm{out}(t)$ and a reference
    or baseline potential $\Phi_\mathrm{ref}(t)$, the raw detector voltage is defined
    by:


    $$

    V_\mathrm{raw}(t) = \Phi_\mathrm{out}(t) - \Phi_\mathrm{ref}(t)

    $$


    where $t$ is the sampling time, $\Phi_\mathrm{out}$ is the detector or front-end
    electronics output potential, and $\Phi_\mathrm{ref}$ is the chosen electronics
    ground, bias reference, or estimated baseline.


    In practice this quantity is obtained from the uncalibrated detector readout before
    pulse finding, shaping correction, pile-up rejection, energy calibration, efficiency
    correction, or conversion to neutron rate. For pulsed detectors it is the waveform
    sample value; derived quantities such as pulse maximum, pulse integral, or discriminator
    counts should be treated separately.


    Typical raw amplitudes range from 1e-3-10 V depending on detector type, biasing,
    preamplifier gain, termination, and neutron intensity. Baseline fluctuations and
    electronic noise are often in the 1e-4-1e-2 V range, while large pulses may approach
    the dynamic range or saturation limit of the acquisition electronics.


    Sign convention: Positive when the detector output potential is above the chosen
    electronics reference or baseline potential.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:peak_voltage_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/amplitude_raw
    dd_path: neutron_diagnostic/detectors/amplitude_raw
    status: composed
- name: peak_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Peak voltage of a neutron detector is the baseline-referenced pulse
    height of the processed detector signal, evaluated at the pulse extremum after
    applying the channel pulse-polarity convention. It represents the voltage amplitude
    assigned to an individual detector response.
  documentation: 'Peak voltage of a neutron detector is the pulse height assigned
    to the processed voltage waveform from a detector module. It is referenced to
    the local pre-pulse baseline and uses the channel pulse-polarity convention, so
    it is not simply the raw algebraic maximum of the unprocessed waveform or an absolute
    value over the full record.


    For a pulse-search window, the baseline-referenced peak voltage can be written
    as the maximum polarity-corrected excursion:


    $$

    V_{\mathrm{peak}} = \max_{t \in W}\left[p\left(V_{\mathrm{proc}}(t)-V_{\mathrm{base}}\right)\right]

    $$


    where $V_{\mathrm{peak}}$, $V_{\mathrm{proc}}(t)$, and $V_{\mathrm{base}}$ are
    in volts, $W$ is the time window associated with the pulse, and $p$ is the pulse-polarity
    factor: $p=+1$ for positive-going processed pulses and $p=-1$ for negative-going
    processed pulses.


    In practice, the digitized detector output is conditioned by shaping, filtering,
    or other signal-processing steps before the peak is found. The baseline is usually
    estimated from pre-pulse samples or a nearby quiet interval, and pulse pileup,
    saturation, and electronic noise determine whether the extracted peak is reliable.
    This quantity is distinct from the instantaneous [detector voltage](name:voltage_of_neutron_detector),
    which denotes the voltage signal itself before the peak-height reduction.


    Representative processed pulse heights are strongly instrument-dependent, but
    neutron detector electronics commonly report values from about 0.001-5 V for resolved
    pulses. Values near the noise floor are threshold-dependent, while values approaching
    the acquisition full scale may indicate saturation rather than a proportional
    neutron response.


    Sign convention: Positive when the pulse excursion is in the channel''s configured
    pulse-polarity direction relative to the local baseline; for a positive-going
    channel this means the processed voltage at the pulse peak exceeds the baseline,
    and for a negative-going channel it means it is below the baseline before polarity
    correction.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:voltage_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  - name:requested_upper_voltage_of_neutron_detector
  arguments:
  - name: voltage_of_neutron_detector
    operator: peak
    operator_kind: qualifier
