- name: grid_cell_volume_element
  kind: scalar
  status: draft
  description: Elementary plasma volume enclosed by a single cell of the 2-D computational
    grid used in plasma initiation modeling.
  documentation: The volume element $\Delta V$ (in m$^3$) represents the plasma volume
    enclosed by the quadrilateral cell defined by neighboring grid nodes $[d_1(i),\,d_2(j)]$,
    $[d_1(i\!+\!1),\,d_2(j)]$, $[d_1(i),\,d_2(j\!+\!1)]$, $[d_1(i\!+\!1),\,d_2(j\!+\!1)]$,
    where $d_1$ and $d_2$ are the two grid dimensions (e.g., $R$ and $Z$ in a poloidal
    cross-section). The volume accounts for the toroidal integration, so $\Delta V
    \approx 2\pi R\,\Delta R\,\Delta Z$ for an axisymmetric grid. These volume elements
    are used as weights in volume-integrated quantities during plasma initiation simulations,
    such as the volume-averaged electron temperature and ionization rate. Cell volumes
    in medium-size tokamaks range from $10^{-6}$ to $10^{-2}$ m$^3$ depending on grid
    resolution. See also [major_radius_of_townsend_or_closed_grid_point](name:major_radius_of_townsend_or_closed_grid_point)
    for the associated grid coordinates.
  unit: m^3
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_prefill_gas_pressure
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the prefill gas pressure
    measurement.
  documentation: "This quantity provides the negative-side error bar on the [prefill_gas_pressure](name:prefill_gas_pressure)\
    \ in Pa. Sources of uncertainty include gauge calibration accuracy, wall outgassing\
    \ transients, and spatial inhomogeneity of the neutral fill. Because the Townsend\
    \ criterion is sensitive to the pressure\u2013length product, the lower uncertainty\
    \ bound constrains the optimistic limit of the predicted breakdown region. Together\
    \ with the upper bound, it defines the full asymmetric confidence interval for\
    \ initiation studies. See also [upper_uncertainty_of_prefill_gas_pressure](name:upper_uncertainty_of_prefill_gas_pressure)\
    \ and [townsend_critical_electric_field](name:townsend_critical_electric_field)."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: magnetic_field_line_connection_length
  kind: scalar
  status: draft
  description: Total arc length along a traced magnetic field line from its starting
    point to the point where it intersects a material surface or completes a closed
    loop.
  documentation: 'The connection length $L_c$ (in m) is obtained by integrating $dl$
    along a field line from its launch position until it terminates on a plasma-facing
    component (open line) or returns to its starting flux surface (closed line). For
    closed field lines the convention assigns $L_c = 1$ m (a flag value) to distinguish
    them from genuinely short open lines. During plasma initiation, $L_c$ determines
    the effective path over which the parallel electric field $E_\parallel$ accelerates
    seed electrons; longer connection lengths lower the critical electric field required
    for a Townsend avalanche: $E_{\mathrm{crit}} \propto 1/L_c$ at fixed pressure.
    In existing tokamaks, open-field connection lengths during the pre-breakdown phase
    range from a few meters (strongly stray-field-dominated regions) to several hundred
    meters (near incipient flux surfaces). Connection-length maps in the $(R, Z)$
    plane are a primary tool for optimizing breakdown assistance via electron-cyclotron
    or ohmic pre-ionization. See [open_field_line_fraction](name:open_field_line_fraction),
    [townsend_critical_electric_field](name:townsend_critical_electric_field), and
    [toroidal_component_of_electric_field](name:toroidal_component_of_electric_field).'
  unit: m
  cocos_transformation_type: one_like
  tags:
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_field_line_starting_position
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the launch point from which a magnetic
    field line is traced during the plasma initiation analysis.
  documentation: In plasma initiation field-line tracing, each field line is integrated
    starting from a specified $(R, Z)$ position in the poloidal plane. The major radius
    $R$ of this starting point defines the radial coordinate in the machine cylindrical
    frame $(R, Z, \phi)$. A regular or user-defined grid of starting positions samples
    the vessel cross-section to classify field-line topology (open vs. closed) and
    compute connection lengths. Values range from the high-field-side wall to the
    low-field-side limiter, covering the full accessible plasma volume. The companion
    vertical coordinate completes the 2-D specification. See [magnetic_field_line_connection_length](name:magnetic_field_line_connection_length)
    and [open_field_line_fraction](name:open_field_line_fraction) for quantities derived
    from the traced ensemble.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_townsend_or_closed_grid_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a computational grid point where the
    parallel electric field exceeds the Townsend threshold or the field line is closed.
  documentation: 'This coordinate identifies, in the cylindrical $(R, Z, \phi)$ machine
    frame, the radial position of a grid node that satisfies one of two criteria during
    plasma initiation field-line tracing: either the local parallel electric field
    $E_\parallel$ exceeds the Townsend critical field for the given prefill gas pressure,
    or the traced field line closes on itself without intersecting a material surface.
    Together with [vertical_coordinate_of_townsend_or_closed_grid_position](name:vertical_coordinate_of_townsend_or_closed_grid_position),
    it defines the 2-D poloidal map of candidate breakdown locations. Values span
    from the inner wall radius to the outer limiter radius, with the most favorable
    breakdown positions concentrated where the connection length is long and the loop
    voltage is high. The set of $(R, Z)$ points satisfying the Townsend criterion
    delineates the accessible breakdown region used in plasma initiation scenario
    design; see [townsend_critical_electric_field](name:townsend_critical_electric_field)
    and [major_radius_of_townsend_or_closed_position](name:major_radius_of_townsend_or_closed_position).'
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_townsend_or_closed_position
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a point where the parallel electric
    field exceeds the Townsend threshold or the field line is closed.
  documentation: During plasma initiation analysis, magnetic field lines are traced
    from a grid of starting points and classified according to whether the induced
    parallel electric field exceeds the Townsend critical field or the field line
    closes on itself. This quantity records the major-radius coordinate $R$ (in meters)
    of each such classified point in the $(R, Z)$ poloidal cross-section. Together
    with the corresponding vertical coordinate, these positions map the spatial region
    favorable for gas breakdown or where closed flux surfaces already exist. The data
    supports assessment of whether the breakdown volume is adequate and well-positioned
    for current ramp-up. See also [townsend_critical_electric_field](name:townsend_critical_electric_field)
    and [major_radius_of_field_line_starting_position](name:major_radius_of_field_line_starting_position).
  unit: m
  cocos_transformation_type: one_like
