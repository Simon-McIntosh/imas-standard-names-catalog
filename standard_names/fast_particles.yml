- name: toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volume-integrated toroidal torque transferred to the bulk thermal ion
    population via Coulomb collisions with fast (non-Maxwellian) particles. Defined
    as the toroidal projection of the collisional friction moment integrated over
    the plasma volume, quantifying the net toroidal angular momentum exchange rate
    between fast and thermal ion species.
  documentation: "The toroidal component of the thermal ion torque due to Coulomb\
    \ collisions is the volume integral of the $\\hat{\\phi}$-projection of the collisional\
    \ friction force density acting on the bulk (thermal) ion population. In the cylindrical\
    \ $(R, \\phi, Z)$ frame with $\\hat{R} \\times \\hat{\\phi} = \\hat{Z}$, the toroidal\
    \ scalar torque is\n\n$$T_\\phi^{\\mathrm{th,ion}} = \\int R \\, F_\\phi^{\\mathrm{coll,th\\\
    ,ion}}(\\mathbf{r}) \\, d^3r$$\n\nwhere $F_\\phi^{\\mathrm{coll,th\\,ion}} = m_i\
    \ \\int v_\\phi \\, C_{\\mathrm{coll}}[f_\\mathrm{fast}, f_\\mathrm{th,ion}] \\\
    , d^3v$ is the toroidal component of the collisional friction moment of the Coulomb\
    \ collision operator $C_{\\mathrm{coll}}$ integrated over velocity space, $m_i$\
    \ is the thermal ion mass, $v_\\phi = R \\dot{\\phi}$ is the toroidal velocity,\
    \ and $R$ is the major radius in the cylindrical $(R, \\phi, Z)$ frame.\n\nThis\
    \ quantity appears in the toroidal angular momentum balance of the thermal ion\
    \ population and characterizes the collisional drag or acceleration exerted by\
    \ fast (suprathermal) ions \u2014 e.g. from neutral beam injection or ion cyclotron\
    \ resonance heating \u2014 on the background plasma. For co-injected beams in\
    \ typical tokamak scenarios, this torque tends to be positive (co-current direction),\
    \ with magnitudes of order $10^{-2}$ to $10^{0}$ N$\\cdot$m depending on injected\
    \ power, plasma density, and ion charge state.\n\nSign convention: Positive when\
    \ the collisional friction moment accelerates the thermal ion population in the\
    \ direction of increasing toroidal angle $\\phi$ (co-current direction, counter-clockwise\
    \ viewed from above $+\\hat{Z}$).\n\nThis quantity is the thermal-ion analog of\
    \ the fast-particle toroidal collisional torques and is complementary to the corresponding\
    \ thermal electron torque. Together with the fast-particle toroidal torque, it\
    \ must sum to zero by Newton's third law applied to the total collisional angular\
    \ momentum exchange."
  unit: N.m
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_thermal_ion_torque_density_due_to_coulomb_collisions
  - name:toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
  constraints: []
  arguments:
  - name: thermal_ion_torque_due_to_coulomb_collisions
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_tor
    dd_path: distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_tor
    status: composed
  - id: dd:distributions/distribution/global_quantities/collisions/ion/torque_thermal_tor
    dd_path: distributions/distribution/global_quantities/collisions/ion/torque_thermal_tor
    status: composed
- name: toroidal_component_of_torque_density_due_to_radial_current
  kind: scalar
  status: draft
  description: Toroidal component of the flux-surface-averaged torque density exerted
    on the total particle distribution by the radial current Lorentz force $\mathbf{J}_r
    \times \mathbf{B}$, summed over all particle populations.
  documentation: 'The toroidal torque density due to radial currents arises from the
    Lorentz force $\mathbf{J}_r \times \mathbf{B}$, where $J_r$ is the radial component
    of current density and $\mathbf{B}$ is the magnetic field. The toroidal projection
    of this force per unit volume, $\tau_\phi = (\mathbf{J}_r \times \mathbf{B}) \cdot
    \hat{\phi}$, drives toroidal plasma rotation and contributes to the momentum balance
    in the $\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.
    This quantity represents the total over all particle populations; population-resolved
    contributions are described separately for [co-passing particles](name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current),
    [counter-passing particles](name:toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current),
    and [trapped particles](name:toroidal_component_of_trapped_particle_torque_density_due_to_radial_current).
    Typical magnitudes in neutral-beam-heated tokamak plasmas range from $10^{-2}$
    to $10^{1}$ N m$^{-2}$ depending on injected power and plasma density. It is computed
    from kinetic distribution-function codes and enters the toroidal momentum transport
    equation as a source term alongside other torque contributions such as neoclassical
    toroidal viscosity.


    Sign convention: Positive when the torque density acts in the direction of increasing
    toroidal angle $\phi$.'
  unit: N.m^-2
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_trapped_particle_torque_density_due_to_radial_current
  constraints: []
  arguments:
