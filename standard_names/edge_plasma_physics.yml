- name: momentum_flux_limiter_coefficient
  kind: vector
  status: draft
  description: Dimensionless coefficient that scales the collisionless free-streaming
    upper bound on momentum-flux density in multi-fluid edge plasma transport closures,
    capping the flux magnitude while leaving its sign direction unchanged.
  documentation: "In multi-fluid edge plasma transport models, gradient-driven diffusive\
    \ closures can produce momentum-flux densities that exceed the physically realizable\
    \ collisionless free-streaming limit in steep-gradient regions such as the scrape-off\
    \ layer and divertor. A flux-limiter coefficient $\\alpha_m$ is introduced to\
    \ bound the effective flux: the limited momentum-flux density magnitude cannot\
    \ exceed $\\alpha_m$ times a free-streaming reference scale, while the sign follows\
    \ the underlying diffusive flux direction.\n\nThe limited momentum-flux density\
    \ $\\Pi^{\\mathrm{lim}}$ is formed by the harmonic-mean combination:\n\n$$\n\\\
    Pi^{\\mathrm{lim}} = \\frac{\\alpha_m \\, \\Pi^{\\mathrm{FS}} \\cdot \\Pi^{\\\
    mathrm{diff}}}{|\\Pi^{\\mathrm{diff}}| + \\alpha_m \\, \\Pi^{\\mathrm{FS}}}\n\
    $$\n\nwhere $\\Pi^{\\mathrm{diff}}$ is the collisional diffusive momentum-flux\
    \ estimate, $\\Pi^{\\mathrm{FS}} = m n v_{\\mathrm{th}}^2$ is the free-streaming\
    \ scale with $m$ the particle mass, $n$ the number density, and $v_{\\mathrm{th}}$\
    \ the thermal speed. When $|\\Pi^{\\mathrm{diff}}| \\gg \\alpha_m \\Pi^{\\mathrm{FS}}$\
    \ the flux saturates at $\\pm \\alpha_m \\Pi^{\\mathrm{FS}}$; when $|\\Pi^{\\\
    mathrm{diff}}| \\ll \\alpha_m \\Pi^{\\mathrm{FS}}$ the diffusive value is recovered\
    \ unchanged.\n\nSpecializations target individual projection directions, such\
    \ as parallel_momentum_coefficient for field-aligned transport, and individual\
    \ particle populations, such as ion_state_momentum_coefficient for specific ion\
    \ charge states or parallel_neutral_state_momentum_coefficient for neutral-particle\
    \ parallel transport. The coefficient is intrinsically non-negative; values in\
    \ the range 0.1\u20131 are common in edge-plasma simulations, selected by calibration\
    \ against experimental separatrix and divertor data."
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
- name: neon_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of neon impurity ions at the H-mode pedestal top, summed
    over all ionization stages from singly ionized through fully stripped Ne10+.
  documentation: "Neon density at the pedestal is the local number density of neon\
    \ impurity ions at the top of the H-mode edge transport barrier, where the steep\
    \ edge density gradient transitions toward the less-steep confined core plasma.\
    \ It is summed over all ionization charge states of neon (atomic number $Z=10$),\
    \ from singly ionized Ne$^{1+}$ through fully stripped Ne$^{10+}$:\n\n$$\nn_\\\
    mathrm{Ne} = \\sum_{k=1}^{10} n_{\\mathrm{Ne}^{k+}}\n$$\n\nwhere $n_{\\mathrm{Ne}^{k+}}$\
    \ is the number density of neon ions in charge state $k+$ evaluated on the pedestal-top\
    \ flux surface.\n\nNeon is a medium-Z noble gas seeding impurity deployed in H-mode\
    \ tokamak plasmas for divertor heat-load mitigation and edge radiative cooling;\
    \ its ten available ionization stages contribute bremsstrahlung and line radiation\
    \ across the 10 eV\u20131 keV temperature range characteristic of the pedestal.\
    \ Pedestal-top neon concentrations relevant for active seeding are typically $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$, corresponding to tenths of a percent of the local electron\
    \ density. Charge-state-resolved neon densities are inferred from charge-exchange\
    \ recombination spectroscopy or vacuum-ultraviolet spectroscopy of neon emission\
    \ lines, with the total elemental value recovered by summing over all resolved\
    \ states.\n\nThis quantity is the neon-specific instance of [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ and is directly comparable to other noble-gas seeding impurity pedestal densities\
    \ such as [argon_density_at_pedestal_top](name:argon_density_at_pedestal_top),\
    \ [krypton_density_at_pedestal_top](name:krypton_density_at_pedestal_top), and\
    \ [nitrogen_density_at_pedestal_top](name:nitrogen_density_at_pedestal_top)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:argon_density_at_pedestal_top
  - name:krypton_density_at_pedestal_top
