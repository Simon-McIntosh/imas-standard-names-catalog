- name: energy_diffusion_coefficient
  kind: vector
  status: active
  description: Fick's-law coefficient relating the diffusive thermal energy flux of
    a plasma constituent to its local temperature gradient, serving as the species-agnostic
    parent abstraction over electron, ion, and neutral population specializations.
  documentation: "The energy diffusion coefficient characterizes gradient-driven thermal\
    \ energy transport for any plasma constituent \u2014 electrons, ions, or neutrals\
    \ \u2014 by specifying the proportionality between the diffusive heat flux and\
    \ the local temperature gradient in the Fick's-law sense. It is the thermal-energy\
    \ channel of the general diffusion_coefficient, which governs particle, momentum,\
    \ and energy transport alike, and it is distinct from convective or $E \\times\
    \ B$ contributions to the total heat flux.\n\nThe defining relation for the diffusive\
    \ energy flux $\\mathbf{Q}_\\mathrm{diff}$ of a given constituent is:\n\n$$\n\\\
    mathbf{Q}_\\mathrm{diff} = -D_E \\, \\nabla T\n$$\n\nwhere $D_E$ is the energy\
    \ diffusion coefficient and $\\nabla T$ is the temperature gradient of that constituent.\
    \ In a magnetized plasma $D_E$ is strongly anisotropic; radial cross-field values\
    \ govern energy confinement while values along field lines are orders of magnitude\
    \ larger.\n\nSpecies-resolved children include [electron_energy_diffusion_coefficient](name:electron_energy_diffusion_coefficient)\
    \ for the electron population and [ion_energy_diffusion_coefficient](name:ion_energy_diffusion_coefficient)\
    \ for the total ion population aggregated over all charge states; neutral-particle\
    \ transport is handled by analogous neutral specializations. The effective diffusivity\
    \ that combines diffusive and convective contributions is tracked separately by\
    \ energy_effective_diffusivity."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_energy_diffusion_coefficient
  - name:ion_energy_diffusion_coefficient
- name: flux_surface_averaged_argon_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of argon ions at the plasma boundary
    (separatrix), summed over all ionization stages from Ar+ through fully stripped
    Ar18+.
  documentation: 'The flux-surface-averaged argon density at the plasma boundary is
    the argon ion number density, summed over all ionization states from Ar+ through
    fully stripped Ar18+, averaged over the last closed flux surface (separatrix)
    that divides magnetically confined plasma from the open-field-line scrape-off
    layer.


    The flux-surface average is defined as:


    $$

    \langle n_{\mathrm{Ar}} \rangle = \frac{\oint n_{\mathrm{Ar}} \, dl / B_p}{\oint
    dl / B_p}

    $$


    where $n_{\mathrm{Ar}}$ is the local argon number density summed over all charge
    states, $B_p$ is the poloidal magnetic-field magnitude, and the integrals are
    taken along the separatrix contour at constant poloidal magnetic flux $\psi$.


    This boundary-averaged quantity is inferred from visible and vacuum ultraviolet
    spectroscopy of argon emission lines combined with collisional-radiative ionization
    balance modeling to reconstruct the full charge-state distribution. It serves
    as a boundary condition for impurity transport calculations in the confined plasma
    and is the flux-surface-averaged counterpart of [argon_density_at_plasma_boundary](name:flux_surface_averaged_argon_density_at_plasma_boundary),
    which retains the full poloidal variation along the separatrix.


    Related boundary-averaged impurity densities following the same averaging convention
    include [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary)
    and [flux_surface_averaged_nitrogen_density_at_plasma_boundary](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary).


    Sign convention: Positive when argon ions are present at the separatrix, which
    holds for all plasma states with non-zero argon seeding.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  - name:flux_surface_averaged_nitrogen_density_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/n_i/argon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-argon-value
