        stability and calibration of neutron counting electronics.
      kind: llm
- name: toroidal_plasma_momentum_at_measurement_position
  kind: scalar
  status: active
  description: "Toroidal plasma momentum at a measurement position is the local mechanical\
    \ angular-momentum density of the plasma about the toroidal symmetry axis. It\
    \ equals the major radius in the right-handed cylindrical (R, \u03C6, Z) frame\
    \ multiplied by the total toroidal particle linear-momentum density."
  documentation: 'Toroidal plasma momentum at a measurement position is the local
    mechanical angular-momentum density of the plasma about the toroidal symmetry
    axis at the specified point. It is the major-radius lever arm multiplying the
    toroidal component of the total particle linear-momentum density in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    For a measurement position $\mathbf{x}_m$, the defining relation is:


    $$

    \ell_\phi(\mathbf{x}_m) = R_m \sum_s n_s(\mathbf{x}_m)\, m_s\, V_{\phi,s}(\mathbf{x}_m)

    $$


    where $\mathbf{x}_m$ is the point of evaluation, $\ell_\phi$ is the local toroidal
    plasma momentum, $R_m = R(\mathbf{x}_m)$ is the major radius of that point, $s$
    indexes electrons and all ion species and charge states, $n_s$ is the particle
    number density, $m_s$ is the particle mass, and $V_{\phi,s}$ is the toroidal component
    of the species flow velocity.


    In this definition, toroidal denotes angular momentum about the symmetry axis,
    not the toroidal component of linear momentum alone; the linear-momentum density
    is the species sum before multiplication by $R_m$. The quantity is mechanical
    particle angular-momentum density and excludes canonical toroidal momentum, electromagnetic-field
    angular momentum, and spatially integrated toroidal angular momentum.


    Sign convention: Positive when the total toroidal particle linear-momentum density
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: kg.m^-1.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:toroidal_plasma_momentum_at_magnetic_axis
  sources:
  - dd_path: charge_exchange/channel/momentum_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-momentum_phi
    dd_documentation:
      leaf: Total plasma toroidal momentum, summed over ion species and electrons
        weighted by their density and major radius, i.e. sum_over_species(n*R*m*Vphi),
        at the channel measurement point
      parent_path: charge_exchange/channel
      parent: Set of channels (lines-of-sight). The line-of-sight is defined by the
        centre of the collimating aperture and the position of the measurements.
      data_type: STRUCTURE
      unit: kg.m^-1.s^-1
    enhanced_context:
      description: Total plasma toroidal angular momentum (L_phi) at the CXRS channel
        measurement point, summed over all ion species. Measured via charge exchange
        recombination spectroscopy (CXRS).
      kind: llm
- name: vertical_coordinate_of_beam_tracing_point
  kind: scalar
  status: active
  description: "Vertical Z coordinate of a beam-tracing point in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame; it is the signed height relative to the machine\
    \ equatorial plane."
  documentation: 'Vertical $Z$ coordinate of a beam-tracing point is the signed height
    of that point relative to the machine equatorial plane in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. A beam-tracing point is a point on an electromagnetic
    wave-beam or ray trajectory; this quantity identifies only the point position,
    not the wave vector or deposited energy.


    Together with the corresponding major-radius and toroidal-angle coordinates of
    the same beam-tracing point, this coordinate specifies its spatial location in
    the right-handed cylindrical $(R, \phi, Z)$ frame. At a trajectory point identified
    with the launching position, it is the same vertical coordinate as [vertical coordinate
    of launching position](name:vertical_coordinate_of_launching_position); it shares
    the same vertical-coordinate convention as [vertical coordinate of aperture](name:vertical_coordinate_of_aperture)
    and [z coordinate of divertor target](name:z_coordinate_of_divertor_target).


    Sign convention: Positive when the beam-tracing point lies in the $+\hat{Z}$ direction
    from the machine equatorial plane in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
