- name: power_at_outer_divertor_target
  kind: scalar
  status: active
  description: "Power at the outer divertor target is the non-negative total rate\
    \ of energy deposition on the low-field-side divertor target, the target at larger\
    \ major radius R in the right-handed cylindrical (R, \u03C6, Z) frame, where R\
    \ is major radius, \u03C6 is toroidal angle, and Z is vertical height, integrated\
    \ over its wetted strike-zone surface."
  documentation: 'Power at the outer divertor target is the non-negative total rate
    of energy deposition on the low-field-side divertor target, the target at larger
    major radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is the
    all-channel deposited-power total over the wetted strike-zone surface of that
    single material target.


    The deposited power is defined by integrating the local deposited energy-flux
    density over the wetted area of the outer target:


    $$

    P_{\mathrm{out}} = \int_{A_{w,\mathrm{out}}} q_{\perp,\mathrm{dep}} \, dA

    $$


    where $P_{\mathrm{out}}$ is the power at the outer divertor target, $A_{w,\mathrm{out}}$
    is the wetted strike-zone area of the outer target, $dA$ is a target-surface area
    element, and $q_{\perp,\mathrm{dep}}$ is the local deposited energy-flux density
    through the material surface with the surface normal oriented into the target.


    Only energy crossing into and deposited in the outer-target material is counted.
    This quantity is distinct from the inner-target counterpart [power at the inner
    divertor target](name:power_at_inner_divertor_target), from mechanism- or species-resolved
    target powers, and from spatial peak quantities such as [maximum power at the
    outer divertor target](name:maximum_power_at_outer_divertor_target). The surface-normal
    convention makes inward deposited energy contribute positively to $q_{\perp,\mathrm{dep}}$;
    the target-integrated deposited power is non-negative by definition.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_outer_divertor_target
  - name:maximum_power_at_outer_divertor_target
  - name:energy_flux_at_divertor_target
- name: electron_power_at_outer_divertor_target
  kind: scalar
  status: active
  description: Electron power deposited on the outer divertor target by incident electrons,
    integrated over the wetted strike-zone surface.
  documentation: 'Electron power deposited on the outer divertor target by incident
    electrons integrated over the wetted strike-zone surface is the target-integrated
    electron energy-transfer rate to the material surface of that target. The outer
    divertor target is the target on the larger-major-radius side in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The deposited electron power is the surface integral of the local electron energy-flux
    density directed into the wetted outer-target area:


    $$

    P_{e,\mathrm{outer}} = \int_{A_{w,\mathrm{outer}}} q_{e,\perp}\,dA

    $$


    where $P_{e,\mathrm{outer}}$ is the electron power at the outer divertor target,
    $A_{w,\mathrm{outer}}$ is the wetted strike-zone area, $dA$ is a target-surface
    area element, and $q_{e,\perp}$ is the electron energy-flux density directed from
    the plasma into the target material.


    This is the electron-channel component of [power at the outer divertor target](name:power_at_outer_divertor_target);
    ion, neutral, radiation, and other non-electron contributions are excluded. It
    is the outer-target counterpart of [electron power at the inner divertor target](name:electron_power_at_inner_divertor_target).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_outer_divertor_target
  - name:electron_power_at_inner_divertor_target
  arguments:
