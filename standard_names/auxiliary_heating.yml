    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_density_thermal_n_tor
    dd_path: waves/coherent_wave/profiles_1d/ion/power_density_thermal_n_tor
    status: attached
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_density_thermal_n_phi
