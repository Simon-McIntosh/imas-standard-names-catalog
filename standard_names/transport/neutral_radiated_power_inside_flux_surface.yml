name: neutral_radiated_power_inside_flux_surface
status: draft
description: Volume-integrated radiated power emitted by neutral species from the
  region enclosed by a given flux surface.
documentation: 'The neutral radiated power inside a flux surface $P_{\mathrm{rad},n}(\psi)$
  (unit W) is obtained by integrating the local neutral emissivity $\epsilon_n(\mathbf{x})$
  over the volume $V(\psi)$ enclosed by the flux surface labeled by poloidal flux
  $\psi$: $P_{\mathrm{rad},n}(\psi) = \int_{V(\psi)} \epsilon_n \, dV$, where $\epsilon_n$
  (in $\mathrm{W\,m^{-3}}$) includes line radiation, recombination radiation, and
  bremsstrahlung contributions from neutral atoms and molecules. This quantity is
  dominated by hydrogen Lyman and Balmer series emission in the divertor and edge
  regions and by impurity neutral radiation when sputtered species are present. Typical
  values range from sub-kW in low-density L-mode edges to several MW in detached divertor
  scenarios. It is a cumulative (monotonically non-decreasing with enclosed volume)
  quantity useful for assessing radiated power profiles and divertor power exhaust.
  Bolometer tomography and filtered camera arrays provide experimental estimates.
  See also `fast_neutral_number_density` for the neutral population contributing to
  this emission.'
