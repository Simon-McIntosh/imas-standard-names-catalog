- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic field vector onto the outward major-radius
    direction in the right-handed cylindrical (R, phi, Z) frame, forming the radial
    part of the poloidal field in tokamak geometry.
  documentation: "The radial magnetic field $B_R = \\mathbf{B} \\cdot \\hat{R}$ is\
    \ the component of the magnetic induction resolved along $\\hat{R}$, the unit\
    \ vector pointing away from the toroidal symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. In an axisymmetric tokamak equilibrium, $B_R$ is entirely\
    \ a poloidal-field quantity and is generally much smaller in magnitude than the\
    \ dominant toroidal component; it encodes information about flux-surface shape\
    \ and poloidal field structure.\n\nIn axisymmetric equilibrium, $B_R$ is related\
    \ to the poloidal magnetic flux function $\\psi(R, Z)$ by:\n\n$$\nB_R = -\\frac{1}{R}\\\
    frac{\\partial \\psi}{\\partial Z}\n$$\n\nwhere $R$ is the major radius in meters\
    \ and $Z$ is the vertical coordinate in meters. Together with $B_Z = \\frac{1}{R}\\\
    partial\\psi/\\partial R$, this satisfies the solenoidal constraint $\\nabla \\\
    cdot \\mathbf{B} = 0$ in axisymmetric form. The companion [parallel_magnetic_field](name:parallel_magnetic_field)\
    \ gives the field-aligned projection, while [radial_magnetic_vector_potential](name:radial_magnetic_vector_potential)\
    \ provides the corresponding vector-potential component in the same radial direction.\n\
    \n$B_R$ is obtained by differentiating the reconstructed poloidal flux on a computational\
    \ grid, or evaluated directly on generalized geometry description grids for complex\
    \ wall and boundary regions. Magnitudes in the core plasma are typically 0.001\u2013\
    0.1 T, increasing near the X-point and divertor where the poloidal field changes\
    \ direction rapidly.\n\nSign convention: Positive when $B_R$ points in the direction\
    \ of increasing major radius $R$, away from the toroidal symmetry axis."
  unit: T
  physics_domain: equilibrium
  links:
  - name:parallel_magnetic_field
  - name:radial_magnetic_vector_potential
