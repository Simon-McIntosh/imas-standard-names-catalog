  - name: atomic_count_of_pellet
    operator: outer
    operator_kind: qualifier
- name: oxygen_source_rate
  kind: scalar
  status: draft
  description: Instantaneous rate at which oxygen gas is injected into the plasma
    vessel, expressed as the equivalent number of bound electrons carried by the injected
    oxygen atoms or molecules per second.
  documentation: 'Oxygen source rate is the instantaneous input of oxygen gas into
    the plasma vessel, expressed as an equivalent-electron rate. The equivalent-electron
    convention counts eight electrons per oxygen atom, so the quantity tracks the
    injected oxygen inventory on the same counting basis as total neutral-gas injection
    rates rather than the instantaneous plasma electron source after ionization.


    The relation between the equivalent-electron source rate and the injected neutral
    oxygen flow is


    $$

    S_\mathrm{O} = 8\,\dot{N}_\mathrm{O} = 16\,\dot{N}_{\mathrm{O}_2} = \frac{dN_{\mathrm{O},e}}{dt}

    $$


    where $S_\mathrm{O}$ is the oxygen source rate in equivalent electrons per second,
    $\dot{N}_\mathrm{O}$ is the rate of injected oxygen atoms, $\dot{N}_{\mathrm{O}_2}$
    is the rate of injected oxygen molecules, and $N_{\mathrm{O},e}$ is the accumulated
    equivalent-electron count. For mixed atomic and molecular gas, contributions are
    summed with eight equivalent electrons per oxygen nucleus.


    In practice, $S_\mathrm{O}$ is computed from calibrated gas-handling signals such
    as mass-flow-controller demand, reservoir pressure drop, or piezoelectric valve
    opening together with gas temperature and conductance calibration. Its time integral
    gives [accumulated_oxygen_count_due_to_gas_injection](name:accumulated_oxygen_count_due_to_gas_injection),
    and it contributes to the aggregate [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection)
    along with other injected species such as [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection),
    [nitrogen_source_rate](name:nitrogen_source_rate), and [neon_source_rate](name:neon_source_rate).
    Oxygen injection is commonly used for impurity seeding, radiative-power control,
    radiative mantle formation, and divertor detachment studies; the subsequent ionization
    balance is a plasma response, not part of this injection-rate definition.


    Typical controlled oxygen injection rates are about $10^{19}-10^{22}\ \mathrm{s}^{-1}$
    in equivalent-electron units. Small calibration puffs or wall-conditioning flows
    can be below $10^{19}\ \mathrm{s}^{-1}$, while large impurity puffs in high-density
    plasmas may approach or exceed $10^{22}\ \mathrm{s}^{-1}$.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_oxygen_count_due_to_gas_injection
  - name:neon_source_rate
  - name:nitrogen_source_rate
- name: poloidal_magnetic_flux_at_pellet_path
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at a point on a pellet injection path.
    It provides the flux-surface label used to relate pellet ablation or deposition
    to the magnetic equilibrium.
  documentation: 'At a pellet injection path point, poloidal magnetic flux is the
    value of the equilibrium poloidal-flux function at the pellet position. It identifies
    the magnetic flux surface intersected by the pellet and relates local ablation,
    ionization, and deposited material to the surrounding equilibrium geometry.


    Using a path coordinate $\ell$ along the pellet trajectory in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height, the value along the trajectory is


    $$

    \psi_{\mathrm{pellet}}(\ell) = \psi\!\left(R(\ell), Z(\ell)\right)

    $$


    where $\psi(R,Z)$ is the equilibrium poloidal magnetic flux function and $\psi_{\mathrm{pellet}}$
    has unit Wb. For an axisymmetric equilibrium, $\psi$ is independent of $\phi$;
    $\phi(\ell)$, represented by toroidal_angle_of_along_pellet_path, locates the
    same path point toroidally.


    In practice this quantity is computed by combining a reconstructed magnetic equilibrium
    with the pellet trajectory inferred from injector geometry, timing, and observations
    of pellet emission or ablation. Interpolation of $\psi(R,Z)$ to the trajectory
    point converts ablation versus distance or time into a flux-surface coordinate
    for deposition analysis.


    Typical values are comparable to equilibrium poloidal flux values: the difference
    between the magnetic-axis value and the plasma-boundary value is often 0.1-10
    Wb in tokamaks, and may be larger in high-current devices. Along a pellet path,
    the values usually span only the portion of this interval traversed before complete
    ablation or exit from the confined plasma.


    Sign convention: Positive when the magnetic field crossing a horizontal disk centered
    on the toroidal symmetry axis has positive net flux in the $+\hat{Z}$ direction
    of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: Wb
  physics_domain: plant_systems
  links: []
- name: power_of_plant_subsystem
  kind: scalar
  status: draft
  description: Real electrical power drawn by an individual plant subsystem during
    operation. It is the subsystem-level contribution to plant auxiliary load accounting
    and system-level electrical power balances.
  documentation: 'Power of a plant subsystem is the real electrical power drawn by
    one defined subsystem while carrying out its operational function. It represents
    active electrical load rather than reactive or apparent power, and it is used
    to attribute auxiliary demand within plant electrical power balances.


    For an accounting boundary containing $N$ subsystems, the corresponding system
    load is the sum of the subsystem loads:


    $$

    P_\mathrm{system} = \sum_{i=1}^{N} P_{\mathrm{subsystem},i}

    $$


    where $P_\mathrm{system}$ is the system real power in W, $P_{\mathrm{subsystem},i}$
    is the real power drawn by subsystem $i$ in W, and $N$ is the dimensionless number
    of subsystems included in the accounting boundary. The aggregate system quantity
    is [power_of_plant_system](name:net_absorbed_power_of_plant_system); summing over
    plant systems gives [total_power_of_plant_system](name:total_power_of_plant_system),
    while [absorbed_power_of_plant_system](name:net_absorbed_power_of_plant_system)
    is the closely related system-level absorbed electrical load.


    Subsystem power is measured with calibrated active-power meters, energy monitors
    on subsystem electrical feeds, or control-system estimates based on voltage, current,
    and power factor. Time averaging should match the plant power-balance interval,
    and shared services such as cooling, vacuum support, or control infrastructure
    should be allocated consistently to avoid double counting or omission.


    Typical subsystem loads span about $10^3-10^8$ W. Small instrumentation, control,
    or auxiliary-service subsystems may draw $10^3-10^5$ W; pumps, local cooling loops,
    drives, and medium auxiliary equipment commonly draw $10^5-10^7$ W; major pulsed
    or continuous plant subsystems such as cryogenic, heating, current-drive, magnet-power,
    or large thermal-management equipment can reach $10^7-10^8$ W depending on operating
    phase.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:net_absorbed_power_of_plant_system
  - name:total_power_of_plant_system
- name: power_of_plant_system
  kind: scalar
  status: draft
  description: Real electrical power drawn by an individual plant system during operation,
    evaluated at the system electrical boundary. It is a load-oriented demand quantity;
    net plant-system power uses generated minus consumed accounting.
  documentation: 'Power of a plant system is the real electrical power crossing the
    electrical boundary of one plant system, with consumption represented as draw
    from the plant electrical supply. It describes electrical demand at a system level,
    not thermal power, apparent power, reactive power, or accumulated energy.


    For boundary accounting with a load-positive convention, the system power is defined
    as consumed real electrical power minus generated real electrical power within
    the same system boundary:


    $$

    P_\mathrm{system} = P_\mathrm{consumed} - P_\mathrm{generated} = \sum_{j=1}^{N}
    P_{\mathrm{subsystem},j}

    $$


    where $P_\mathrm{system}$ is this plant-system power, $P_\mathrm{consumed}$ is
    the real electrical power imported by loads in the system, $P_\mathrm{generated}$
    is the real electrical power exported by generators belonging to the system, and
    $P_{\mathrm{subsystem},j}$ are [power_of_plant_subsystem](name:power_of_plant_subsystem)
    values using the same sign convention for the $N$ included subsystems. Internal
    electrical transfers between subsystems cancel in the system total. The corresponding
    [net_power_of_plant_system](name:net_power_of_plant_system) follows generated-minus-consumed
    accounting, so for the same boundary and scope $P_\mathrm{net}=P_\mathrm{generated}-P_\mathrm{consumed}=-P_\mathrm{system}$.


    In practice, this quantity is obtained from electrical metering, power-converter
    telemetry, or a sum of subsystem feeder powers over a consistently defined system
    boundary. For AC supplies it is the real power from phase-wise voltage-current
    measurements averaged over the electrical cycle; for DC supplies it is the signed
    voltage-current product. Summing $P_\mathrm{system}$ over a selected set of consuming
    systems gives that set''s load-positive electrical demand only; plant net electric
    output requires generated and consumed terms to be combined with consistent accounting
    boundaries.


    Typical operating magnitudes are highly system dependent: instrumentation and
    control systems may draw $10^0-10^4$ W, medium auxiliary systems $10^4-10^6$ W,
    and large pumps, compressors, power supplies, or power-conversion systems $10^6-10^8$
    W. Values can be near zero in standby or off states, and may become negative for
    a system exporting more electrical power than it consumes.


    Sign convention: Positive when real electrical power flows from the plant electrical
    supply into the plant system across the system boundary.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:absorbed_power_of_plant_system
  - name:net_power_of_plant_system
  - name:total_power_of_plant_system
  - name:power_of_plant_subsystem
  - name:total_thermal_power_at_inlet
- name: absorbed_power_of_plant_system
  kind: scalar
  status: draft
  description: Real electrical power crossing a plant-system boundary into the plant
    system. It is the absorbed, incoming component of the plant-system electrical
    power balance, distinct from generated, returned, or net power.
  documentation: 'Absorbed power of a plant system is the real electrical power delivered
    across the plant-system boundary into that system. It specializes [power_of_plant_system](name:power_of_plant_system)
    by selecting the incoming electrical boundary-power component before any combination
    with generated, returned, or net power. It is not the same as internal consumption
    or dissipation, because storage, conversion, and later export can occur inside
    the boundary.


    The instantaneous absorbed electrical power is the time derivative of the cumulative
    incoming electrical energy:


    $$

    P_\mathrm{abs}(t) = \frac{dE_{\mathrm{elec,in}}(t)}{dt}

    $$


    where $P_\mathrm{abs}$ is absorbed power in W, $E_{\mathrm{elec,in}}$ is cumulative
    electrical energy delivered into the plant system in J, and $t$ is time in s.


    In practice, absorbed power is obtained from electrical metering at the supply
    connections of the plant system. Terminal voltages and currents are combined as
    real power, summed over all relevant feeds, and averaged over an AC cycle or power-electronics
    switching interval when needed. Reactive power is excluded, and electrical power
    flowing out of the system boundary belongs to generated, returned, or net-power
    accounting rather than to positive absorbed power.


    Typical values range from 1-10^3 W for small control or instrumentation plant
    systems, 10^3-10^6 W for pumps and auxiliary services, and 10^6-10^8 W for major
    heating, cryogenic, pulsed-power, or magnet-support plant systems; short transients
    in large facilities can approach 10^9 W.


    Sign convention: Positive when real electrical power crosses the plant-system
    boundary into the plant system from an external electrical connection.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_subsystem
  - name:total_power_of_plant_system
  - name:power_of_plant_system
  arguments:
  - name: power_of_plant_system
    operator: absorbed
    operator_kind: qualifier
- name: net_absorbed_power_of_plant_system
  kind: scalar
  status: draft
  description: Net electrical power absorbed by a plant system, defined as the system's
    electrical consumption minus electrical power generated locally within the same
    system boundary.
  documentation: 'Net absorbed electrical power is the net electrical import of a
    plant system across its defined electrical boundary. It is positive for an overall
    electrical load and negative for a system that produces more electrical power
    locally than it consumes internally.


    The defining balance is:


    $$

    P_{\mathrm{net,abs}} = P_{\mathrm{consumed}} - P_{\mathrm{local,gen}}

    $$


    where $P_{\mathrm{consumed}}$ is the total electrical power used by equipment
    within the system boundary and $P_{\mathrm{local,gen}}$ is the electrical power
    generated within that same boundary.


    In practice this quantity is obtained from electrical metering, plant power-balance
    calculations, or supervisory control estimates at the system boundary. It differs
    conceptually from a net electrical output quantity: this name represents net import
    required to operate the system, while net output represents export available from
    the system under its own accounting definition.


    Typical values for individual plant systems range from $10^3$-$10^8$ W, depending
    on the size and operating state of loads such as pumps, cryogenic equipment, power
    supplies, auxiliaries, and control systems. Large pulsed or high-power subsystems
    may transiently approach $10^8$-$10^9$ W, while a locally generating subsystem
    can have a negative value.


    Sign convention: Positive when the plant system absorbs electrical power across
    its electrical boundary, so total electrical consumption exceeds electrical power
    generated locally within the same system boundary.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:net_power_of_plant_system
  - name:total_power_of_plant_system
  arguments:
  - name: absorbed_power_of_plant_system
    operator: net
    operator_kind: qualifier
  sources:
  - id: dd:balance_of_plant/power_electric_plant_operation/system/power
    dd_path: balance_of_plant/power_electric_plant_operation/system/power
    status: composed
- name: net_power_of_plant_system
  kind: scalar
  status: draft
  description: Net electrical power of a plant system, equal to generated electrical
    power minus internal operational electrical consumption within the same system
    boundary.
  documentation: 'Net electrical power of a plant system is the algebraic electrical
    power delivered by that system after subtracting the electrical power it consumes
    for its own operation. It indicates whether the chosen system boundary is a net
    source or net sink of electricity at a given operating condition.


    For a defined plant-system boundary, the net power is


    $$

    P_\mathrm{net} = P_\mathrm{elec,gen} - P_\mathrm{elec,cons}

    $$


    where $P_\mathrm{net}$, $P_\mathrm{elec,gen}$, and $P_\mathrm{elec,cons}$ are
    electrical powers in W evaluated over the same time interval. $P_\mathrm{elec,gen}$
    is the electrical power produced within the boundary, such as generator-terminal
    or power-conversion output, and $P_\mathrm{elec,cons}$ is the operational electrical
    power drawn by equipment inside the same boundary.


    In practice, this quantity is computed from electrical metering or plant power-accounting
    models by summing generation feeds and subtracting allocated internal loads such
    as pumps, compressors, cryogenic equipment, control systems, power-conversion
    auxiliaries, and other parasitic consumers. The system boundary must be applied
    consistently: loads outside the boundary are excluded, while recirculating power
    and auxiliary loads inside the boundary are included. During startup, shutdown,
    standby, or operation of systems without local generation, the net power can be
    negative.


    Typical values depend strongly on the boundary. Purely consuming plant systems
    are often about -1e3 to -1e8 W, large balance-of-plant or power-conversion systems
    can range from near 0 W to 1e9 W, and whole-plant net electrical output for power-plant-scale
    devices is commonly of order 1e8-2e9 W. Values near 0 W indicate that internal
    electrical consumption nearly balances local electrical generation.


    Sign convention: Positive when the system exports electrical power across its
    boundary after subtracting internal operational consumption.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_inlet
  - name:power_of_plant_system
  arguments:
  - name: power_of_plant_system
    operator: net
    operator_kind: qualifier
- name: prefill_gas_pressure
  kind: scalar
  status: draft
  description: Neutral gas pressure in the vessel during the prefill phase, which
    sets the ionization conditions for electron avalanche breakdown at plasma startup
    via the Townsend mechanism.
  documentation: 'The prefill gas pressure is the neutral gas pressure established
    in the vacuum vessel before plasma breakdown during the startup phase. A controlled
    amount of working gas is admitted to bring the vessel to a target pressure that
    optimizes the electron avalanche threshold for the available loop voltage.


    The Townsend ionization model relates the gas pressure to the avalanche breakdown
    condition through the first Townsend ionization coefficient:


    $$

    \alpha = A \, p \, \exp\!\left(-\frac{B \, p}{E}\right)

    $$


    where $\alpha$ is the number of ionizations per unit path length, $p$ is the prefill
    gas pressure, $E$ is the applied electric field, and $A$ and $B$ are gas-species
    constants. Breakdown is achieved when $\alpha d \geq \ln(1 + 1/\gamma)$, where
    $d$ is the path length and $\gamma$ is the secondary electron emission coefficient,
    so the prefill gas pressure directly controls the loop voltage required for plasma
    initiation.


    Vessel pressure during the prefill phase is measured by calibrated ionization
    gages or Penning gages and regulated through mass-flow-controlled gas injection
    valves. This quantity is closely related to [prefill_pressure](name:prefill_gas_pressure),
    which captures the same physical pressure in the specific context of the Townsend
    electric field calculation.


    Typical prefill pressures in tokamak startup range from $10^{-4}$ to $10^{-1}$
    Pa, with the optimal working point set by the Paschen curve minimum for the injected
    gas species.'
  unit: Pa
  physics_domain: plant_systems
  links: []
  sources:
  - id: dd:plasma_initiation/b_field_lines/pressure
    dd_path: plasma_initiation/b_field_lines/pressure
    status: composed
- name: pressure_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Gas pressure inside the vacuum tank of a lower hybrid antenna.
  documentation: 'Gas pressure of a lower hybrid antenna is the scalar pressure of
    residual neutral gas in the antenna vacuum tank or waveguide enclosure. It characterizes
    the local vacuum state relevant to RF voltage holdoff, antenna conditioning, and
    operational safety.


    For a uniform gas inventory, pressure is related to the amount of gas by the ideal-gas
    relation:


    $$

    pV = N k_B T

    $$


    where $p$ is gas pressure in Pa, $V$ is tank volume in m$^3$, $N$ is the number
    of neutral molecules, $k_B$ is the Boltzmann constant in J K$^{-1}$, and $T$ is
    gas temperature in K.


    The pressure is normally inferred from vacuum instrumentation connected to the
    antenna tank or nearby pumping manifold. The indicated value can depend on gage
    calibration, gas composition, and conductance between the measurement point and
    the enclosed antenna volume. Operating limits and interlock thresholds are device
    dependent and are set by the antenna design, RF conditioning state, and local
    protection strategy.


    Representative lower-hybrid antenna vacuum-tank pressures during prepared RF operation
    are commonly in the high-vacuum range, about $10^{-6}$-$10^{-3}$ Pa. Higher values
    may occur during conditioning, outgassing, leaks, or abnormal vacuum events.


    The analogous antenna-vacuum quantity for ion-cyclotron systems is [gas_pressure_of_ion_cyclotron_heating_antenna](name:gas_pressure_of_ion_cyclotron_heating_antenna).'
  unit: Pa
  physics_domain: plant_systems
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:gas_pressure_of_ion_cyclotron_heating_antenna
- name: propane_prefill_count
  kind: scalar
  status: draft
  description: Total propane (C3H8) introduced during the plasma prefill phase, expressed
    as an equivalent-electron count using 26 electrons per propane molecule.
  documentation: 'Propane prefill count is the accumulated amount of propane introduced
    before plasma breakdown, expressed on an equivalent-electron basis. A propane
    molecule, C$_3$H$_8$, contains $3 \times 6 + 8 \times 1 = 26$ electrons, so each
    injected molecule contributes 26 to this count.


    The accumulated prefill count is defined from the propane molecular flow integrated
    over the prefill interval:


    $$

    N_{\mathrm{eq}} = 26\,N_{\mathrm{mol}} = 26 \int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}}
    \dot{N}_{\mathrm{mol}}(t)\,dt

    $$


    where $N_{\mathrm{eq}}$ is the dimensionless equivalent-electron count, $N_{\mathrm{mol}}$
    is the dimensionless count of propane molecules injected during prefill, $\dot{N}_{\mathrm{mol}}$
    is the propane molecular flow rate in molecules s$^{-1}$, and $t_{\mathrm{start}}$
    and $t_{\mathrm{bd}}$ are the prefill start time and breakdown time in seconds.


    In practice, the value is obtained from the propane gas-injection accounting over
    the prefill interval, using the inferred or measured molecular throughput and
    the gas-species conversion factor. It contributes to the total prefill inventory
    [prefill_count](name:accumulated_lithium_prefill_count_due_to_gas_injection) and
    is directly comparable with other prefill gas counts because all are expressed
    on the same equivalent-electron scale.


    The physical range is $N_{\mathrm{eq}} \ge 0$, with $N_{\mathrm{eq}} = 0$ when
    no propane is introduced during prefill. No universal numerical range is implied:
    values depend strongly on vessel volume, prefill pressure target, gas-line calibration,
    and pulse scenario, and may vary by many orders of magnitude between devices and
    operating regimes.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
- name: propane_source_rate
  kind: scalar
  status: draft
  description: Instantaneous propane (C3H8) injection source rate into the plasma
    vessel, expressed as equivalent electrons per second rather than as molecule or
    atom counts.
  documentation: 'Propane source rate is the rate at which neutral propane, $\mathrm{C_3H_8}$,
    is supplied to the plasma vessel using the electron-equivalent gas-source convention.
    It counts the number of bound electrons carried by the injected neutral molecules
    per unit time, so one propane molecule contributes 26 equivalent electrons.


    The electron-equivalent rate is related to the molecular propane throughput by:


    $$

    \dot{N}_e^{(\mathrm{C_3H_8})} = 26\,\dot{N}_{\mathrm{C_3H_8}}

    $$


    where $\dot{N}_{\mathrm{C_3H_8}}$ is the molecular injection rate and $26 = 3\times6
    + 8\times1$ is the total nuclear charge, or neutral-electron count, of one propane
    molecule. This convention differs from a molecular rate, which would be smaller
    by a factor of 26, and from an atom-counting rate, which would count 11 neutral
    atoms per molecule rather than their electron inventory.


    In practice the rate is computed from calibrated gas throughput measurements,
    valve flow models, reservoir pressure and temperature evolution, or mass-flow-controller
    signals, with conversion from molecular flow to electron-equivalent flow using
    the factor above. The electron-equivalent convention allows direct comparison
    with other gas source rates such as hydrogenic fueling and impurity-gas injection.


    Typical propane injection rates are strongly scenario-dependent. Trace or diagnostic
    puffs are commonly of order $10^{19}-10^{21}\ \mathrm{s^{-1}}$ in electron-equivalent
    units, while larger short impurity or wall-conditioning injections can reach $10^{22}-10^{23}\
    \mathrm{s^{-1}}$.


    Sign convention: Positive when propane is injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:ammonia_source_rate
  - name:nitrogen_source_rate
  - name:oxygen_source_rate
  - name:neon_source_rate
- name: radial_coordinate_of_shattering_position
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the shatter-cone origin, equal to the\
    \ perpendicular distance from the toroidal symmetry axis to the pellet shattering\
    \ position in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The shattering position is the geometric origin of the shatter cone,
    where an intact cryogenic pellet encounters the shattering element and begins
    to form a directed shard cloud. Its radial coordinate $R$ is the major-radius
    coordinate of that point in the right-handed cylindrical $(R, \phi, Z)$ frame,
    equal to the perpendicular distance from the toroidal symmetry axis. Here $R$
    is non-negative and increases outward along $+\hat{R}$, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    The relation to horizontal Cartesian coordinates in a right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis is


    $$

    \mathbf{r}_\perp = (x, y) = (R\cos\phi, R\sin\phi), \qquad R = \sqrt{x^2 + y^2}

    $$


    where $\mathbf{r}_\perp$ is the projection of the point onto the plane perpendicular
    to the toroidal symmetry axis, $x$ and $y$ are horizontal coordinates in meters,
    and $\hat{z}$ is parallel to $\hat{Z}$.


    The value is a fixed as-built hardware coordinate obtained from mechanical design,
    alignment survey, or direct metrology of the shattering assembly. Together with
    [vertical_coordinate_of_shattering_position](name:vertical_coordinate_of_shattering_position),
    a vertical length in meters, and toroidal_angle_of_shattering_position, an angle
    in radians, it locates the same shatter-cone origin. This location sets the geometric
    launch point for shard trajectories, whose components may be described by quantities
    such as [radial_velocity_of_pellet](name:radial_velocity_of_pellet), [toroidal_velocity_of_pellet](name:toroidal_velocity_of_pellet),
    and [vertical_velocity_of_pellet](name:vertical_velocity_of_pellet).


    Typical values are device and port dependent and should be interpreted relative
    to the machine major radius. Shattering positions in tokamak plant systems are
    generally meter-scale, commonly about 1-10 m in medium and large machines, with
    compact devices often closer to 0.5-2 m.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:vertical_coordinate_of_shattering_position
  - name:radial_velocity_of_pellet
  - name:toroidal_velocity_of_pellet
  - name:vertical_velocity_of_pellet
- name: radial_velocity_of_pellet
  kind: scalar
  status: draft
  description: "Major-radius component of the shattered pellet center-of-mass velocity\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial velocity of a pellet is the component of the pellet center-of-mass
    velocity along the major-radius direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius measured from the machine symmetry
    axis, $\phi$ is toroidal angle, and $Z$ is vertical height. It quantifies motion
    of the pellet material center of mass toward or away from the symmetry axis, separate
    from toroidal and vertical motion.


    The radial component is obtained by projecting the center-of-mass velocity onto
    the local radial basis vector:


    $$

    v_R = \mathbf{v}_\mathrm{cm} \cdot \hat{R}

    $$


    where $v_R$ is the radial velocity in $\mathrm{m\,s^{-1}}$, $\mathbf{v}_\mathrm{cm}$
    is the pellet center-of-mass velocity with components in $\mathrm{m\,s^{-1}}$,
    and $\hat{R}$ is the unit vector in the direction of increasing $R$. Together
    with [toroidal_velocity_of_pellet](name:toroidal_velocity_of_pellet) and [vertical_velocity_of_pellet](name:vertical_velocity_of_pellet),
    it specifies the pellet velocity components in the same right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In practice, $v_R$ is computed from the time derivative of the pellet center-of-mass
    position, or from a specified launch speed and injection direction, followed by
    projection onto $\hat{R}$. For shattered-pellet applications, the same definition
    applies when the tracked center of mass represents the pellet material after fragmentation.


    Typical pellet injection speeds in magnetic-confinement devices are about 100-1000
    m s^-1. The radial component may be near 0 m s^-1 for nearly toroidal or vertical
    launch and may reach magnitudes of 100-1000 m s^-1 for predominantly radial launch;
    signed values depend on whether the motion is inward or outward in major radius.


    Sign convention: Positive when the pellet center of mass moves in the $+\hat{R}$
    direction, toward increasing major radius $R$ and away from the machine symmetry
    axis.'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:vertical_velocity_of_pellet
  - name:toroidal_velocity_of_pellet
- name: shattered_pellet_fragment_density
  kind: scalar
  status: draft
  description: Number density of a specified atomic species within an individual fragment
    produced by a shattered pellet injector.
  documentation: 'Shattered pellet fragment density is the species-resolved number
    of atoms of a given species per unit physical volume of a single condensed fragment.
    It describes the material composition of the fragment before substantial ablation
    or expansion, and differs from the density of the ablated gas or plasma formed
    later.


    For species $s$ in a fragment of volume $V_f$, the density is defined by


    $$

    n_s = \frac{N_s}{V_f}

    $$


    where $n_s$ is the number density of species $s$, $N_s$ is the number of atoms
    of that species in the fragment, and $V_f$ is the physical fragment volume.


    In practice, this quantity is usually inferred from the pellet material composition,
    condensed-phase mass density, and the assigned or reconstructed fragment volume.
    For mixed-material pellets, each species component is determined from the mixture
    fraction; the sum over species gives the total atomic number density. Fragment-to-fragment
    variation can arise from nonuniform composition, porosity, cracks, coatings, thermal
    state, and partial vaporization during shattering.


    Typical condensed hydrogen-isotope and noble-gas pellet materials have atomic
    number densities of about $2 \times 10^{28}$-$8 \times 10^{28}$ m^-3. Pure deuterium,
    tritium, or deuterium-tritium fragments are commonly a few $10^{28}$ m^-3, while
    minority dopants or mixed-species components can be lower in proportion to their
    atomic fraction.'
  unit: m^-3
  physics_domain: plant_systems
  links:
  - name:core_density_of_pellet
- name: shattered_pellet_fragment_volume
  kind: scalar
  status: draft
  description: Volume of a single solid fragment produced by shattered pellet injection.
    It characterizes the fragment size distribution and contributes, together with
    material density, shape, and plasma conditions, to fragment ablation and material
    delivery.
  documentation: 'Shattered pellet fragment volume is the physical volume occupied
    by one solid piece formed when a cryogenic pellet is broken before injection into
    the plasma. It is a geometric size measure for an individual fragment, not the
    total volume of the fragment cloud, and is used to characterize the fragment size
    distribution produced by the shattering process.


    For a fragment represented by an equivalent sphere of diameter $d_

    obreak\mathrm{eq}$, the fragment volume $V_f$ is


    $$

    V_f = \frac{\pi}{6} d_\mathrm{eq}^3

    $$


    where $V_f$ is the fragment volume in m$^3$ and $d_\mathrm{eq}$ is the diameter
    in m of a sphere with the same volume. For irregular fragments, $d_\mathrm{eq}$
    is a convenient size parameter rather than a statement that the fragment is spherical.


    In practice, fragment volume may be estimated from calibrated images of the shattered
    pellet plume, from assumed fragment-shape models, or from a mass estimate divided
    by the solid material density. It is closely related to the parent diameter_of_pellet
    and to material-density quantities such as [core_density_of_pellet](name:core_density_of_pellet).
    Combined with fragment velocity and ablation modeling, it helps determine the
    time-dependent material source represented by quantities such as [radial_velocity_of_pellet](name:radial_velocity_of_pellet)
    and atomic_source_rate_of_pellet.


    Representative fragment volumes in shattered-pellet studies are often in the approximate
    range $10^{-12}$-$10^{-7}$ m$^3$, corresponding to sub-millimeter through several-millimeter
    equivalent spherical diameters. The range depends strongly on pellet size, material,
    shatter-tube geometry, and the fragment-size distribution assumed or measured
    for a particular injector.'
  unit: m^3
  physics_domain: plant_systems
  links:
  - name:core_density_of_pellet
  - name:radial_velocity_of_pellet
- name: silane_prefill_count
  kind: scalar
  status: draft
  description: Accumulated equivalent-electron count of silane (SiH4) gas injected
    during the prefill phase before plasma breakdown, where each SiH4 molecule contributes
    18 equivalent electrons.
  documentation: "The silane prefill count is the dimensionless total of silane (SiH4)\
    \ gas introduced into the plasma vessel during the prefill phase \u2014 before\
    \ plasma breakdown \u2014 expressed using the equivalent-electron convention in\
    \ which each atom contributes a weight equal to its atomic number.\n\nEach SiH4\
    \ molecule contributes 18 equivalent electrons: 14 from the silicon nucleus ($Z_\\\
    mathrm{Si} = 14$) and 1 from each of the four hydrogen atoms ($Z_\\mathrm{H} =\
    \ 1$):\n\n$$\nC_{\\mathrm{SiH_4}} = Z_\\mathrm{Si} + 4\\,Z_\\mathrm{H} = 14 +\
    \ 4 = 18\n$$\n\nwhere $N_\\mathrm{mol}$ is the number of SiH4 molecules injected\
    \ before breakdown, giving a total prefill count of $18\\,N_\\mathrm{mol}$.\n\n\
    The prefill phase precedes plasma ignition and is used to condition the vessel\
    \ or establish a neutral-gas background. The accumulated count records all injection\
    \ events within that window, giving a species-resolved inventory of silicon and\
    \ hydrogen introduced before breakdown. The corresponding post-breakdown tally\
    \ is provided by [accumulated_silane_count](name:accumulated_silane_count), and\
    \ the instantaneous injection rate is tracked by [silane_source_rate](name:silane_source_rate).\
    \ Analogous prefill counts for other species include [accumulated_hydrogen_prefill_count](name:accumulated_hydrogen_prefill_count)\
    \ and [nitrogen_prefill_count](name:nitrogen_prefill_count).\n\nSign convention:\
    \ Positive when silane gas is injected into the vessel during the prefill phase."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_silane_count
  - name:silane_source_rate
  - name:accumulated_hydrogen_prefill_count
  - name:nitrogen_prefill_count
- name: silane_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of silane (SiH4) gas into the plasma vessel,
    expressed in equivalent electrons per second.
  documentation: 'Silane ($\mathrm{SiH_4}$, silicon tetrahydride) is a silicon-bearing
    compound injected as a controlled impurity source in plasma experiments. The source
    rate quantifies the instantaneous rate of silane introduction expressed as an
    equivalent-electron flux, where each $\mathrm{SiH_4}$ molecule contributes the
    combined atomic numbers of its constituent atoms.


    Each silane molecule carries $Z_\mathrm{Si} + 4\,Z_\mathrm{H} = 14 + 4 = 18$ equivalent
    electrons. The equivalent-electron rate $\dot{N}_\mathrm{eq}$ relates to the molecular
    injection flux $\dot{N}_{\mathrm{SiH_4}}$ by:


    $$

    \dot{N}_\mathrm{eq} = 18 \, \dot{N}_{\mathrm{SiH_4}}

    $$


    where $Z_\mathrm{Si} = 14$ is the atomic number of silicon, $Z_\mathrm{H} = 1$
    is the atomic number of hydrogen, and $\dot{N}_{\mathrm{SiH_4}}$ is the molecular
    injection rate in molecules per second.


    The instantaneous rate is inferred from calibrated gas-valve systems monitoring
    flow at the injection manifold. Integrating this rate over the plasma discharge
    from breakdown gives the [accumulated silane count](name:accumulated_silane_count),
    which tracks the total equivalent-electron inventory of silane introduced during
    a discharge. Analogous rate quantities for other injected species include [xenon_source_rate](name:xenon_source_rate)
    and [nitrogen_source_rate](name:nitrogen_source_rate).


    Sign convention: Positive when silane gas is being injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_silane_count
  - name:xenon_source_rate
  - name:nitrogen_source_rate
- name: source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous equivalent-electron source rate delivered to the plasma
    vessel by gas injection systems, where each injected atom contributes Z equivalent
    electrons per second according to its atomic number.
  documentation: 'The source rate due to gas injection characterizes the instantaneous
    rate at which neutral gas is admitted to the plasma vessel by gas injection hardware,
    expressed as an equivalent-electron count rate. Every injected atom of atomic
    number $Z$ contributes $Z$ equivalent electrons per second to the total inventory
    rate, providing a unified accounting framework across species of differing nuclear
    charge.


    The defining relation for a single injected species is:


    $$

    \dot{S} = Z \cdot \dot{N}_{\mathrm{atoms}}

    $$


    where $\dot{N}_{\mathrm{atoms}}$ is the raw atomic delivery rate in atoms per
    second and $Z$ is the atomic number of the injected species. For simultaneous
    multi-species injection, contributions are summed over all active species.


    This rate is inferred from calibrated mass-flow controllers or upstream pressure-rise
    measurements on the gas supply plumbing. It is the instantaneous time derivative
    of the corresponding accumulated equivalent-electron inventories, such as [accumulated_argon_count](name:accumulated_argon_count)
    or [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection).
    The nearest-peer quantity gas_particle_source_rate_over_vessel_due_to_gas_injection
    provides the vessel-integrated analog expressed in raw gas-phase particles rather
    than equivalent electrons.


    Sign convention: Positive when gas is being delivered into the vessel at a nonzero
    rate, increasing the equivalent-electron particle inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:accumulated_hydrogen_count_due_to_gas_injection
- name: argon_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous argon gas injection source rate expressed as equivalent
    electrons per second; the actual argon atom injection rate is multiplied by 18,
    the atomic number of argon.
  documentation: 'Argon source rate due to gas injection is the instantaneous rate
    at which neutral argon is supplied by a gas injection system, expressed in equivalent
    electrons per second. The equivalent-electron convention weights each argon atom
    by its atomic number, so one injected argon atom contributes 18 equivalent electrons
    for bookkeeping of particle throughput and impurity fueling.


    The equivalent-electron source rate is related to the physical argon atom injection
    rate by:


    $$

    S_{\mathrm{Ar,eq}} = 18\,\frac{dN_{\mathrm{Ar}}}{dt}

    $$


    where $S_{\mathrm{Ar,eq}}$ is the argon source rate in equivalent electrons per
    second, $N_{\mathrm{Ar}}$ is the number of injected argon atoms, and $dN_{\mathrm{Ar}}/dt$
    is the atomic injection rate in atoms per second. The corresponding atomic rate
    is therefore $S_{\mathrm{Ar,eq}}/18$.


    In practice this quantity is inferred from calibrated gas-flow measurements, valve
    commands combined with conductance models, reservoir pressure decay, or mass-flow
    controller signals. It represents the delivered source from the injection hardware,
    not the fraction that is ionized, confined, or retained in the plasma.


    Typical impurity-seeding values are about $10^{20}$-$10^{23}$ s^-1 in equivalent-electron
    units, depending on device size and seeding scenario. Short high-throughput argon
    injection pulses used for rapid radiative cooling or disruption mitigation can
    reach about $10^{24}$-$10^{26}$ s^-1 for brief intervals, while the value is zero
    when no argon is being delivered.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:source_rate_due_to_gas_injection
  - name:krypton_source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: argon
    operator_kind: qualifier
- name: carbon_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous electron-equivalent carbon source from gas injection.
    Each injected carbon atom contributes six source counts, so this rate is six times
    the raw carbon-atom delivery rate and is consistent with accumulated carbon source-count
    accounting.
  documentation: 'Carbon source rate due to gas injection is the instantaneous electron-equivalent
    particle source associated with carbon introduced by gas injection. It uses full-ionization
    electron-yield accounting: each carbon atom contributes six counts, independent
    of its later charge-state evolution, so it differs from the raw carbon-atom delivery
    rate.


    Let $\Gamma_C^{\mathrm{atom}}$ denote the raw carbon-atom delivery rate and $N_C^{\mathrm{eq}}$
    the accumulated electron-equivalent carbon count. The defining relation is:


    $$

    S_C = 6\,\Gamma_C^{\mathrm{atom}} = \frac{dN_C^{\mathrm{eq}}}{dt}

    $$


    where $S_C$ is the carbon source rate due to gas injection, the factor 6 is the
    nuclear charge of carbon, and $N_C^{\mathrm{eq}}$ is counted in electron-equivalent
    source counts. The raw rate $\Gamma_C^{\mathrm{atom}}$ corresponds to [carbon_rate_due_to_gas_injection](name:carbon_source_rate_due_to_gas_injection),
    while the time integral of $S_C$ gives changes in [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection)
    in the same equivalent-count convention.


    In practice, the raw carbon-atom rate is inferred from calibrated gas-flow measurements,
    pressure-volume calibrations, or valve models together with the gas composition.
    For molecular injections such as methane or carbon monoxide, the raw carbon-atom
    rate counts the number of carbon atoms per molecule, then the source rate is obtained
    by multiplying by six. Ionization timing, transport, and the instantaneous charge-state
    distribution in the plasma do not change this bookkeeping factor.


    Values are zero when no carbon-containing gas is injected. Diagnostic or trace
    impurity puffs commonly give 10^17-10^20 s^-1 in electron-equivalent counts, while
    stronger impurity dosing or conditioning pulses can reach 10^21-10^22 s^-1; the
    corresponding raw carbon-atom delivery rate is smaller by a factor of six.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_carbon_count_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: carbon
    operator_kind: qualifier
  sources:
  - id: dd:summary/gas_injection_rates/carbon/value
    dd_path: summary/gas_injection_rates/carbon/value
    status: composed
- name: helium_3_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of helium-3 atom delivery into the plasma vessel
    by gas injection, where each He-3 atom counts as two equivalent electrons due
    to its atomic number Z = 2.
  documentation: 'The helium-3 source rate due to gas injection is the instantaneous
    equivalent-electron count rate for helium-3 ($^3$He, $Z = 2$) delivered by external
    gas injection systems into the plasma vessel. In the equivalent-electron counting
    convention, each injected helium-3 atom contributes 2 count units to the rate,
    so the reported value equals twice the physical atom delivery rate.


    The equivalent-electron rate $\dot{N}_{\text{He-3}}$ is the time derivative of
    the cumulative helium-3 inventory:


    $$

    \dot{N}_{\text{He-3}} = \frac{d N_{\text{He-3}}}{dt}

    $$


    where $N_{\text{He-3}}$ is the [accumulated helium-3 count since plasma breakdown](name:accumulated_helium_3_count_due_to_gas_injection).


    The injection rate is inferred from calibrated gas feed diagnostics such as piezoelectric
    or solenoid valves with integrated flow metering. Helium-3 is employed for minority-species
    ion cyclotron heating, specialized fueling experiments, and impurity studies requiring
    a light noble gas. The analogous hydrogen rate is [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection),
    and the species-summed total across all injected gasses is given by [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection).


    Sign convention: Positive when helium-3 gas is being delivered into the plasma
    vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_count_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: helium_3
    operator_kind: qualifier
- name: helium_4_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of helium-4 atom delivery into the plasma vessel
    by gas injection, where each He-4 atom with atomic number Z = 2 contributes two
    equivalent electrons to particle inventory accounting.
  documentation: 'The helium-4 source rate due to gas injection quantifies the instantaneous
    number of $^4$He atoms introduced per unit time into the plasma vessel through
    externally controlled gas injection valves. Helium-4, comprising two protons and
    two neutrons, is used in fusion devices for plasma heating studies, alpha-particle
    ash simulation, and wall conditioning scenarios.


    The source rate $\dot{N}_{\mathrm{He4}}$ is the time derivative of the cumulative
    helium-4 atom count tracked by [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection):


    $$

    \dot{N}_{\mathrm{He4}} = \frac{d N_{\mathrm{He4}}}{dt}

    $$


    where $N_{\mathrm{He4}}$ is the total helium-4 atom count since plasma breakdown.
    For electron-equivalent particle accounting, the contribution to the total inventory
    rate is $Z\,\dot{N}_{\mathrm{He4}} = 2\dot{N}_{\mathrm{He4}}$, reflecting helium''s
    atomic number. This species-resolved rate is one component of the total [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection)
    summed over all injected species, and is directly analogous to [helium_3_source_rate_due_to_gas_injection](name:helium_3_source_rate_due_to_gas_injection)
    for the lighter helium isotope.


    The rate is determined from calibrated mass-flow controllers or conductance-based
    gas metering on the injection lines. Typical values range from $10^{20}$ to $10^{22}$
    s$^{-1}$ for seeding and fueling applications in present-day tokamaks.


    Sign convention: Positive when helium-4 gas is actively flowing into the plasma
    vessel, increasing the helium-4 atom inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  - name:helium_3_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: helium_4
    operator_kind: qualifier
- name: hydrogen_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Source rate of hydrogen atoms supplied into the plasma by gas injection.
    Because hydrogen has unit atomic number, each injected hydrogen atom also counts
    as one electron-equivalent particle per second.
  documentation: 'The hydrogen source rate due to gas injection is the instantaneous
    rate at which hydrogen atoms are supplied toward the plasma by a gas-injection
    system. It is counted as hydrogen atoms per second; because neutral hydrogen has
    atomic number $Z_\mathrm{H}=1$, the same numerical value is also the electron-equivalent
    particle source rate before ionization.


    The rate is the time derivative of the cumulative injected hydrogen count, with
    molecular gas throughput converted by stoichiometry:


    $$

    S_{\mathrm{H,gas}} = \frac{dN_{\mathrm{H,gas}}}{dt} = \sum_k \nu_{\mathrm{H},k}\,\Phi_k

    $$


    where $S_{\mathrm{H,gas}}$ is the hydrogen source rate in s$^{-1}$, $N_{\mathrm{H,gas}}$
    is the accumulated injected hydrogen atom count, $\Phi_k$ is the injected molecular
    throughput of gas component $k$ in s$^{-1}$, and $\nu_{\mathrm{H},k}$ is the number
    of hydrogen atoms in each molecule of component $k$. For example, one atomic H
    particle gives $\nu_{\mathrm{H}}=1$, while one H$_2$ molecule gives $\nu_{\mathrm{H},\mathrm{H}_2}=2$
    and therefore contributes two hydrogen atoms, or two electron-equivalent particles.


    In practice this rate is obtained from calibrated gas valves, mass-flow controllers,
    reservoir pressure-drop measurements, or line-throughput calibrations, followed
    by conversion from molecular flow to atom rate. The quantity is the hydrogen-species
    contribution to the total gas-injection source rate and is time-integrated to
    obtain the accumulated injected hydrogen count.


    Typical values range from about $10^{19}$-$10^{23}$ s$^{-1}$ in tokamak operation,
    with lower values used for small puffs, wall conditioning, or edge-density control,
    and higher values used for strong fueling in larger plasmas.


    Sign convention: Positive when hydrogen gas is supplied from the gas-injection
    system into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  - name:helium_3_source_rate_due_to_gas_injection
  - name:krypton_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: hydrogen
    operator_kind: qualifier
- name: krypton_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous krypton gas injection rate into the plasma vessel, expressed
    in equivalent electrons per second. Each neutral krypton atom contributes 36 equivalent
    electrons according to its nuclear charge.
  documentation: 'Krypton source rate due to gas injection is the rate at which krypton
    atoms are introduced into the plasma vessel by a gas injection system, expressed
    with equivalent-electron weighting. This charge-weighted convention counts one
    neutral krypton atom as 36 equivalent electrons, allowing krypton injection to
    be compared with other particle sources in balance calculations.


    The equivalent-electron krypton source rate is related to the physical krypton
    atom injection rate by:


    $$

    S_{\mathrm{Kr}} = Z_{\mathrm{Kr}}\,\dot{N}_{\mathrm{Kr}} = 36\,\dot{N}_{\mathrm{Kr}}

    $$


    where $S_{\mathrm{Kr}}$ is the krypton source rate in equivalent electrons per
    second, $\dot{N}_{\mathrm{Kr}}$ is the neutral krypton atom injection rate in
    atoms per second, and $Z_{\mathrm{Kr}} = 36$ is the atomic number of krypton.


    In practice this quantity is computed from calibrated gas-valve, piezo-valve,
    or mass-flow-controller throughput using gas species, plenum pressure, temperature,
    valve conductance, and timing response. The weighting is based on nuclear charge
    and does not imply that the injected atoms are fully ionized at the injection
    location.


    Representative controlled krypton seeding rates are about $10^{18}$-$10^{21}$
    s^-1 in equivalent-electron units, corresponding to roughly $3 \times 10^{16}$-$3
    \times 10^{19}$ krypton atoms per second. Short high-throughput puffs may exceed
    this range depending on the fueling hardware and experiment scenario.


    Sign convention: Positive when krypton is injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_krypton_count
  - name:source_rate_due_to_gas_injection
  - name:xenon_source_rate
  - name:hydrogen_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: krypton
    operator_kind: qualifier
- name: lithium_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous lithium gas-injection source rate into the plasma vessel,
    expressed as equivalent electrons per second. Because lithium has atomic number
    3, one injected neutral lithium atom contributes three equivalent electrons.
  documentation: 'Lithium source rate due to gas injection is the instantaneous rate
    at which a lithium gas-feed source delivers lithium into the plasma vessel, expressed
    using the equivalent-electron counting convention. It is the lithium-species contribution
    to the total [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection);
    analogous species-resolved quantities include [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection)
    and [helium_3_source_rate_due_to_gas_injection](name:helium_3_source_rate_due_to_gas_injection).
    Lithium gas injection may be used for wall conditioning, impurity control, or
    plasma-facing-component surface treatment.


    The equivalent-electron source rate is related to the atomic lithium flow rate
    by the lithium atomic number:


    $$

    S_{\mathrm{Li,eq}} = Z_{\mathrm{Li}}\,\frac{dN_{\mathrm{Li,atoms}}}{dt}

    $$


    where $S_{\mathrm{Li,eq}}$ is the lithium equivalent-electron source rate in s$^{-1}$,
    $Z_{\mathrm{Li}} = 3$ is the dimensionless atomic number of lithium, and $dN_{\mathrm{Li,atoms}}/dt$
    is the neutral lithium atom delivery rate in atoms s$^{-1}$. The time integral
    of $S_{\mathrm{Li,eq}}$ gives the accumulated equivalent-electron lithium delivery,
    corresponding to [accumulated_lithium_count](name:accumulated_lithium_count) when
    that cumulative quantity is used.


    The rate is commonly inferred from calibrated gas-valve flow measurements, mass-flow
    controllers, or the time evolution of plenum pressure and temperature upstream
    of the injection valve. Converting an atomic or molecular lithium flow to this
    quantity requires applying the equivalent-electron factor for the number of lithium
    atoms delivered.


    Typical lithium gas-injection source rates span about $10^{18}$-$10^{22}$ s$^{-1}$
    in equivalent-electron units, depending on valve conductance, pulse duration,
    conditioning scenario, and whether the injection is a small perturbative puff
    or a stronger wall-treatment flow.


    Sign convention: Positive when lithium gas flows into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_gas_injection
  - name:accumulated_lithium_count
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: lithium
    operator_kind: qualifier
- name: source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which particles are supplied to the plasma by
    active injection systems, equal to the time derivative of the cumulative injected
    particle inventory across all injected species.
  documentation: "The source rate due to injection quantifies the instantaneous particle\
    \ supply from externally controlled injection hardware \u2014 gas valves, neutral\
    \ beam injectors, pellet launchers \u2014 entering the plasma or vessel. It serves\
    \ as the externally applied source term in the particle balance equation and abstracts\
    \ over species-resolved formulations such as [deuterium_source_rate_due_to_injection](name:deuterium_source_rate_due_to_injection),\
    \ which tallies atomic injection in atoms per second, and electron-equivalent\
    \ formulations such as [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection),\
    \ which weights each injected species $s$ by its nuclear charge number $Z_s$ to\
    \ represent the ionizable electron inventory it can contribute.\n\nThe rate is\
    \ the time derivative of the cumulative injected count $N(t)$:\n\n$$\n\\dot{N}(t)\
    \ = \\frac{dN}{dt}\n$$\n\nwhere $N$ represents either a raw atomic count or an\
    \ electron-equivalent inventory depending on the specific formulation. It is inferred\
    \ from calibrated gas valve throughput and flow-meter readings or from pellet\
    \ injection timing corrected for delivery efficiency. Closely related quantities\
    \ are particle_source_rate_over_vessel_due_to_gas_injection and source_rate_due_to_pellet_injection,\
    \ which distinguish delivery mechanism. Typical values span $10^{20}$\u2013$10^{23}$\
    \ s$^{-1}$ for gas injection in medium-to-large tokamaks.\n\nSign convention:\
    \ Positive when particles flow from the injection system into the plasma vessel."
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:deuterium_source_rate_due_to_injection
  - name:electron_source_rate_due_to_injection
  sources:
  - id: derived:source_rate_due_to_injection
    status: composed
- name: deuterium_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: 'Instantaneous rate at which deuterium is supplied to the plasma by
    active injection systems. Deuterium is a Z=1 isotope, so the deuterium particle
    rate is numerically equal to the equivalent-electron source rate: one delivered
    deuterium nucleus counts as one.'
  documentation: 'Deuterium source rate due to injection is the instantaneous number
    of deuterium nuclei delivered per unit time by active fueling systems such as
    gas valves or pellet injectors. It is a species-resolved particle source: molecular
    deuterium is counted after dissociation, so one $\mathrm{D}_2$ molecule contributes
    two deuterium nuclei. Because deuterium has charge number $Z=1$, this particle
    count is also the equivalent-electron count that would result after full ionization.


    The rate is the time derivative of the cumulative deuterium inventory delivered
    by the included injection systems:


    $$

    S_D^{\mathrm{inj}}(t) = \frac{dN_D^{\mathrm{inj}}(t)}{dt}

    $$


    where $S_D^{\mathrm{inj}}$ is the deuterium injection source rate and $N_D^{\mathrm{inj}}$
    is the cumulative number of injected deuterium nuclei, counted in equivalent-electron
    units for this $Z=1$ isotope.


    In practice the quantity is computed from calibrated gas throughput, valve timing,
    reservoir conditions, pellet mass, pellet repetition rate, or other metered injector
    information, with isotope fractions and molecular composition converted to deuterium
    nuclei. It describes the material supplied by the injector, not the fraction that
    is ionized, confined, recycled from surfaces, or retained by the plasma. A gas-only
    cumulative count, such as [deuterium_count_due_to_gas_injection](name:deuterium_count_due_to_gas_injection),
    is the integral of only the gas-injection subset and must not include pellet or
    other non-gas contributions.


    Typical time-averaged rates are about $10^{19}$-$10^{22}$ s^-1 for gas fueling
    in medium and large magnetic-confinement devices. Pellet events can give short
    apparent rates of about $10^{22}$-$10^{24}$ s^-1 when the pellet inventory is
    divided by the delivery interval.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:deuterium_count_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:carbon_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_injection
    operator: deuterium
    operator_kind: qualifier
- name: electron_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous electron-equivalent source rate supplied by plasma injection
    systems. It is the sum over injected atomic species of nuclear charge number times
    the atomic injection rate, representing the electron inventory that the injected
    material can contribute after ionization.
  documentation: 'Electron source rate due to injection is the electron-equivalent
    particle rate delivered to the plasma or vessel by fueling or material injection
    systems. It counts the number of electrons per second associated with the injected
    atoms after ionization, and is used for particle inventory and density-control
    accounting rather than as a local ionization-rate density.


    For a mixture of injected atomic species, the rate is defined by


    $$

    \dot{N}_{e,\mathrm{inj}} = \sum_s Z_s\,\dot{N}_{s,\mathrm{inj}}

    $$


    where $\dot{N}_{e,\mathrm{inj}}$ is the electron-equivalent injection rate, $s$
    indexes the injected atomic species, $Z_s$ is the nuclear charge number of species
    $s$, and $\dot{N}_{s,\mathrm{inj}}$ is its atomic injection rate. Molecular flows
    are converted to atomic rates before applying the sum; for example, each injected
    $\mathrm{D}_2$ molecule contributes two deuterium atoms and therefore two electron
    equivalents after complete ionization.


    In practice this quantity is computed from calibrated gas-valve throughput, pellet
    or compact-toroid particle content, or other injector flow measurements combined
    with the specified species composition. It may represent a single injector, a
    subsystem, or the total injected electron-equivalent rate, depending on the physical
    scope being described.


    Typical values span about $10^{19}$-$10^{23}$ s$^{-1}$ for ordinary gas fueling
    valves in present-day tokamaks. Short high-throughput events such as massive gas
    injection or pellet injection can reach about $10^{22}$-$10^{25}$ s$^{-1}$ for
    brief intervals.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:krypton_source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:accumulated_argon_count
  arguments:
  - name: source_rate_due_to_injection
    operator: electron
    operator_kind: qualifier
- name: thermal_efficiency_of_plant_system
  kind: scalar
  status: draft
  description: Fraction of total thermal power supplied to the whole plant heat-conversion
    system that becomes gross useful electrical output. Equivalently, one minus the
    ratio of rejected thermal power to thermal power input, evaluated over the same
    plant boundary and time interval.
  documentation: 'Thermal efficiency of the plant system is the dimensionless fraction
    of thermal power supplied to all plant heat-conversion stages that is converted
    into gross useful electrical output. It is an aggregate plant-level heat-balance
    quantity, not the efficiency of a single component or thermodynamic cycle.


    The plant thermal efficiency is defined from the steady or time-averaged power
    balance:


    $$

    \eta_{\mathrm{th,plant}} = \frac{P_{\mathrm{el,gross}}}{P_{\mathrm{th,in}}} =
    1 - \frac{P_{\mathrm{th,reject}}}{P_{\mathrm{th,in}}}

    $$


    where $P_{\mathrm{th,in}}$ is the total positive thermal power supplied to the
    heat-conversion system in W, $P_{\mathrm{th,reject}}$ is the total positive thermal
    power rejected to heat sinks in W, and $P_{\mathrm{el,gross}}$ is the gross electrical
    power generated in W before subtraction of plant auxiliary electrical consumption.
    The definition is valid only for a consistent plant boundary and averaging interval
    with $P_{\mathrm{th,in}} > 0$; for a closed steady-state heat balance without
    unaccounted energy storage, $0 \le \eta_{\mathrm{th,plant}} \le 1$.


    In practice, this efficiency is computed by summing thermal power flows across
    the chosen plant boundary and through all thermal conversion stages. Thermal power
    entering the conversion system is counted as heat input, while thermal power discharged
    to condensers, coolers, exhaust streams, or the environment is counted as rejected
    heat; signed component-port thermal powers must therefore be oriented consistently
    before forming the aggregate sums.


    Typical values are 0.25-0.45 for steam Rankine plant concepts, 0.35-0.50 for high-temperature
    advanced cycles, and up to about 0.60 for idealized or highly optimized high-temperature
    conversion systems. Values outside 0-1 usually indicate inconsistent boundaries,
    transient energy storage, sign errors in heat-flow accounting, or that the quantity
    is not being evaluated as a closed plant thermal balance.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_inlet
  - name:total_thermal_power_at_outlet
  - name:efficiency_of_plant_system
  - name:net_efficiency_of_plant_system
  arguments:
  - name: efficiency_of_plant_system
    operator: thermal
    operator_kind: qualifier
- name: thermal_power_of_breeder_blanket
  kind: scalar
  status: draft
  description: Total non-nuclear thermal power deposited on the tritium breeding blanket,
    integrated over the relevant blanket-facing area. It represents plasma-facing
    heat loads and excludes volumetric neutron and gamma heating within the blanket
    material.
  documentation: 'Thermal power of the breeder blanket is the total rate at which
    non-nuclear heat is deposited on or transferred into the tritium breeding blanket
    from plasma-facing thermal loads. It is an integrated power over the relevant
    blanket-facing area, not a heat flux density, and is distinct from volumetric
    neutron and gamma heating represented by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).


    For a surface heat-load representation, the integrated thermal power is defined
    by the area integral of the local non-nuclear heat flux entering the blanket:


    $$

    P_{\mathrm{th,bb}} = \int_{A_{\mathrm{bb}}} q_{\mathrm{th}} \, dA

    $$


    where $P_{\mathrm{th,bb}}$ is the integrated blanket thermal power in W, $A_{\mathrm{bb}}$
    is the blanket-facing area in m^2, $q_{\mathrm{th}}$ is the local non-nuclear
    heat flux density in W m^-2, and $dA$ is the surface element in m^2.


    In plant energy accounting this quantity is usually obtained from thermal-load
    modeling, radiation transport to plasma-facing surfaces, neutral and charged-particle
    heat-transfer estimates when applicable, or calorimetric heat-balance measurements
    in test modules. Radiative contributions may be related to [incident_radiated_power_of_breeder_blanket_module](name:incident_radiated_power_of_breeder_blanket_module),
    while total and layer-resolved nuclear contributions should be treated separately
    using [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket)
    and [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer).


    Typical integrated non-nuclear blanket thermal powers in reactor studies are of
    order 10^6-10^8 W, depending on plasma radiation distribution, exposed blanket
    area, divertor shielding, and first-wall or blanket module design. Volumetric
    nuclear heating can be larger in power-producing blankets and should not be inferred
    from this quantity alone.


    Sign convention: Positive when thermal energy is deposited in the breeder blanket.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:thermal_power_of_divertor
- name: toroidal_velocity_of_pellet
  kind: scalar
  status: draft
  description: "Toroidal component of the shattered-pellet center-of-mass velocity\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal velocity of a pellet is the component of its center-of-mass
    velocity tangent to circles of constant $R$ and $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It describes motion around the torus rather than radial
    motion in $R$ or vertical motion in $Z$.


    It is defined by projecting the pellet center-of-mass velocity vector onto the
    toroidal unit vector:


    $$

    v_\phi = \mathbf{v} \cdot \hat{\phi}

    $$


    where $\mathbf{v}$ is the pellet center-of-mass velocity vector in m.s^-1, $\hat{\phi}$
    is the toroidal unit vector, and $v_\phi$ is the toroidal component in m.s^-1.


    In practice, $v_\phi$ is specified from the intended pellet trajectory or inferred
    from time-resolved center-of-mass positions by differentiating the toroidal position
    and projecting the resulting velocity onto $\hat{\phi}$. For a shattered pellet,
    the center of mass is the mass-weighted center of the represented pellet material
    or fragment ensemble.


    Representative absolute values are 0-500 m.s^-1 for many pellet-injection applications;
    near-radial launches can have $|v_\phi|$ close to 0, while oblique launches can
    have toroidal components of tens to several hundred m.s^-1.


    Sign convention: Positive when the pellet center of mass moves in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:radial_velocity_of_pellet
  - name:vertical_velocity_of_pellet
- name: total_gas_source_rate_at_midplane_due_to_gas_injection
  kind: scalar
  status: draft
  description: Total gas injection rate from valves located near the equatorial midplane
    of the vacuum vessel, expressed as the number of neutral gas particles supplied
    per unit time. It is the midplane contribution to the overall gas source from
    externally actuated injection valves.
  documentation: 'The total gas source rate at midplane due to gas injection is the
    instantaneous number of neutral gas particles delivered per unit time by all gas
    injection valves located near the vessel equatorial midplane. It represents the
    midplane valve contribution to the externally supplied gas source before subsequent
    transport, ionization, recycling, or pumping processes modify the neutral population.


    For the set of midplane injection valves, the total rate is the sum of the individual
    valve particle throughputs:


    $$

    \dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}} = \sum_{k \in \mathcal{M}_{\mathrm{mid}}}
    \dot{N}_k

    $$


    where $\dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}}$ is the total midplane gas injection
    source rate, $\mathcal{M}_{\mathrm{mid}}$ is the set of valves assigned to the
    midplane region, and $\dot{N}_k$ is the particle throughput of valve $k$ in s^-1.


    In practice, each valve rate is obtained from calibrated gas throughput measurements
    or inferred from valve conductance, opening command, gas species, upstream pressure,
    downstream pressure, and gas temperature. Time integration of this rate gives
    the corresponding accumulated injected particle count for the midplane valves,
    while sums over upper, midplane, and lower valve groups give broader total gas
    source rates.


    Typical tokamak midplane gas injection rates are about 10^19-10^22 s^-1. Small
    diagnostic puffs or edge perturbation pulses are often near 10^19-10^20 s^-1,
    whereas routine fueling or strong feedback-controlled fueling can reach 10^21-10^22
    s^-1.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection
  - name:accumulated_total_gas_count_at_midplane_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_rates/midplane/value
    dd_path: summary/gas_injection_rates/midplane/value
    status: composed
- name: total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection
  kind: scalar
  status: draft
  description: Total particle injection rate from gas valves in the lower region of
    the vacuum vessel.
  documentation: 'The total lower gas source rate is the combined rate at which particles
    are introduced into the vacuum vessel by gas injection valves located near the
    lower wall or lower poloidal region. It represents the lower-region contribution
    to externally supplied neutral fueling.


    The rate is defined as the sum of the particle source rates from all lower-region
    gas injection valves:


    $$

    \dot{N}_\mathrm{lower} = \sum_{i \in \mathrm{lower}} \dot{N}_i

    $$


    where $\dot{N}_\mathrm{lower}$ is the total lower gas source rate and $\dot{N}_i$
    is the particle injection rate from the $i$-th lower-region valve, both in s$^{-1}$.


    In practice, the individual valve rates are obtained by converting calibrated
    gas throughput to particle rate using the injected gas species and molecular or
    atomic content. The quantity is useful for comparing lower-region fueling with
    midplane or upper-region fueling and for identifying poloidal asymmetries in neutral
    particle sources. The corresponding time integral is the accumulated lower gas
    particle count.


    Typical values range from $10^{20}$-$10^{23}$ s$^{-1}$ in tokamak gas fueling,
    depending on device size, injected species, valve configuration, and fueling scenario.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:total_gas_source_rate_at_midplane_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_rates/bottom/value
    dd_path: summary/gas_injection_rates/bottom/value
    status: composed
- name: total_particle_source_rate_at_wall_due_to_gas_injection
  kind: scalar
  status: draft
  description: Total gas-puff particle source rate at the wall is the aggregate rate
    at which wall gas-injection valves introduce particles, summed over all included
    injection ports and species. It contributes to the global particle balance.
  documentation: 'The total particle source rate at the wall due to gas injection
    is the combined gas-puff influx from wall-mounted injection valves, expressed
    as the number of injected particles per unit time. It is an external fueling source
    for particle-balance calculations and represents the aggregate over the selected
    wall ports and gas species.


    If $\dot{N}_{s,v}^{\mathrm{gas}}(t)$ is the particle source rate from valve $v$
    for species $s$, after any molecular throughput has been converted to the counted
    particle basis, the total rate is


    $$

    \dot{N}_{\mathrm{tot,wall}}^{\mathrm{gas}}(t) = \sum_{s \in \mathcal{S}} \sum_{v
    \in \mathcal{V}_{\mathrm{wall}}} \dot{N}_{s,v}^{\mathrm{gas}}(t)

    $$


    where $\mathcal{S}$ is the set of included particle species and $\mathcal{V}_{\mathrm{wall}}$
    is the set of wall gas-injection valves. For molecular gasses, stoichiometric
    factors are applied before summing when the balance is expressed in atomic, neutral-particle,
    or electron-equivalent counts.


    In practice this rate is obtained from calibrated valve commands, plenum pressure
    and temperature, gas species, conductance models, or direct flow-meter measurements.
    Its time integral over a fueling interval gives the corresponding accumulated
    injected particle count, while the instantaneous per-source contribution is conceptually
    related to a gas source rate at the wall.


    Typical values range from 10^19-10^22 s^-1 for steady or moderately pulsed gas
    puffing in small and medium tokamaks, and can reach 10^22-10^24 s^-1 during high-throughput
    fueling transients or in larger devices. The rate is zero when no gas-injection
    valves are open and can vary rapidly with valve timing and plenum conditions.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:total_thermal_particle_source_rate
  sources:
  - id: dd:wall/global_quantities/electrons/gas_puff
    dd_path: wall/global_quantities/electrons/gas_puff
    status: composed
  - id: dd:wall/global_quantities/neutral/gas_puff
    dd_path: wall/global_quantities/neutral/gas_puff
    status: attached
- name: total_power_of_plant_system
  kind: scalar
  status: draft
  description: Aggregate electrical power consumed by all plant systems during operation.
    It represents the total auxiliary electrical load of the plant, summed over individual
    plant-system consumption terms.
  documentation: 'Total plant-system power is the aggregate electrical load required
    to operate all auxiliary plant systems. It includes electrical consumption by
    systems such as pumps, cryogenics, heating and current-drive auxiliaries, tritium
    processing, cooling, control, and other balance-of-plant services when those systems
    are drawing power.


    The total is defined as the sum of the consumed electrical power of each plant
    system:


    $$

    P_{\mathrm{plant,total}} = \sum_i P_{\mathrm{plant},i}

    $$


    where $P_{\mathrm{plant,total}}$ is the total plant-system electrical consumption
    in W, $P_{\mathrm{plant},i}$ is the electrical power consumed by plant system
    $i$ in W, and the sum extends over all plant systems included in the plant operating
    boundary. Each term is treated as a positive electrical load; this quantity is
    not a signed net export or generation term.


    In practice, the quantity is computed from electrical metering, plant control
    signals, or design-point power budgets for the contributing systems. Time averaging
    should be chosen consistently with the plant operating state being represented,
    because pulsed operation, recirculating power, standby loads, and transient actuator
    demands can change the aggregate load substantially.


    Typical values range from 1-100 MW for large experimental facilities and from
    100-1000 MW for power-plant studies, depending strongly on heating and current-drive
    demand, cryogenic load, coolant pumping power, and balance-of-plant design.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_system
  - name:power_of_plant_subsystem
  - name:net_power_of_plant_system
  - name:total_thermal_power_at_inlet
  arguments:
  - name: power_of_plant_system
    operator: total
    operator_kind: qualifier
- name: total_thermal_coolant_absorbed_power_at_wall
  kind: scalar
  status: draft
  description: Total thermal power transferred from plasma-facing wall structures
    to the active coolant circuits, integrating heat-load contributions from all cooled
    plasma-facing surfaces including the first wall, divertor, and limiter tiles.
  documentation: 'This quantity is the aggregate rate at which thermal energy is extracted
    from plasma-facing wall structures by the active cooling circuits. It encompasses
    heat deposited by plasma particle bombardment, charge-exchange neutrals, radiation,
    and nuclear heating that is conducted through the wall material and subsequently
    removed by the coolant, representing the primary thermal energy removal pathway
    from the plasma-facing components.


    In calorimetric practice, this power is inferred from the coolant enthalpy rise
    across each cooling circuit:


    $$

    P_{\rm cool} = \sum_i \dot{m}_i \, c_{p,i} \, (T_{{\rm out},i} - T_{{\rm in},i})

    $$


    where $\dot{m}_i$ is the coolant mass flow rate through circuit $i$, $c_{p,i}$
    is the specific heat capacity of the coolant fluid, and $T_{{\rm out},i}$ and
    $T_{{\rm in},i}$ are the outlet and inlet temperatures of that circuit.


    In steady-state operation, this value closely tracks the total plasma-origin heat
    load described by plasma_deposited_power_at_wall, with discrepancies arising from
    nuclear wall heating, eddy-current losses, and transient thermal storage in wall
    structures. It is a key thermal-hydraulic parameter for assessing plasma-facing
    component load limits and validating cooling system performance against the incident
    heat load captured by total_deposited_plasma_power_at_wall. Typical magnitudes
    range from a few to tens of megawatts in current research tokamaks and are projected
    to reach several hundred megawatts in reactor-class devices.'
  unit: W
  physics_domain: plant_systems
  links: []
  sources:
  - id: dd:wall/global_quantities/power_to_cooling
    dd_path: wall/global_quantities/power_to_cooling
    status: composed
- name: total_thermal_power_at_inlet
  kind: scalar
  status: draft
  description: Gross thermal power delivered to the heat-input side of a power conversion
    cycle in a fusion power plant. It is the total recoverable heat entering the cycle
    before thermal-to-electric conversion, as opposed to the rejected heat or the
    net electrical output.
  documentation: 'Total thermal power at the inlet is the gross heat rate carried
    into the power conversion cycle by the working and coolant fluids, before any
    thermal-to-electric conversion. It is the heat-input reference against which rejected
    heat and thermal conversion efficiency are balanced, and is the counterpart of
    the [total thermal power at the outlet](name:total_thermal_power_at_outlet), which
    carries the rejected heat to the cold sink.


    The inlet thermal power is the sum, over all coolant and working-fluid streams
    feeding the cycle, of mass flow rate multiplied by the enthalpy rise relative
    to the cycle''s cold-return state:


    $$

    P_\mathrm{th,in} = \sum_i \dot{m}_i \left( h_{i,\mathrm{in}} - h_{i,\mathrm{ref}}
    \right)

    $$


    where $\dot{m}_i$ is the mass flow rate of stream $i$ in kg/s, $h_{i,\mathrm{in}}$
    is its specific enthalpy at the cycle inlet in J/kg, and $h_{i,\mathrm{ref}}$
    is the specific enthalpy of the corresponding cold return state in J/kg. The thermal
    conversion efficiency follows inline as $\eta_\mathrm{th} = (P_\mathrm{th,in}
    - P_\mathrm{th,out})/P_\mathrm{th,in}$, where $P_\mathrm{th,out}$ is the heat
    rejected from the cycle.


    In practice this quantity is obtained from a steady-state plant heat balance or
    calorimetrically from measured coolant mass flow rates and enthalpy changes across
    the heat exchangers that feed the conversion cycle. The per-stream contributions
    correspond to the [thermal power of plant component ports](name:thermal_power_of_plant_component_port)
    summed over the inlet ports of the conversion cycle.


    For reactor-scale plants the inlet thermal power is of the order of one to several
    gigawatts, with the precise value set by the heat sources coupled to the cycle
    and the plant design.


    Sign convention: Positive when net heat flows into the power conversion cycle.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_outlet
  - name:total_power_of_plant_system
- name: total_thermal_power_at_outlet
  kind: scalar
  status: draft
  description: Total waste-heat power rejected from the power-conversion cycle to
    the environment rather than converted into useful electrical output.
  documentation: 'Total thermal power at the outlet is the rate at which a power-conversion
    cycle rejects heat to its low-temperature sink. It represents the waste-heat load
    that must be removed by condensers, cooling water systems, dry coolers, cooling
    towers, or other heat-rejection equipment after useful electrical work has been
    extracted.


    For a steady power-conversion cycle, the first-law power balance is:


    $$

    P_\mathrm{out} = P_\mathrm{in} - P_\mathrm{net}

    $$


    where $P_\mathrm{out}$ is the rejected thermal power in W, $P_\mathrm{in}$ is
    the [total thermal power at the inlet](name:total_thermal_power_at_inlet) in W,
    and $P_\mathrm{net}$ is the net useful electrical power delivered by the conversion
    system in W. The thermal efficiency is $\eta = P_\mathrm{net}/P_\mathrm{in}$,
    so the rejected fraction is $P_\mathrm{out}/P_\mathrm{in} = 1 - \eta$; for a heat
    engine operating between hot and cold reservoirs, $\eta$ is limited by the reservoir
    temperatures through the second law of thermodynamics.


    In practice this quantity is obtained from a plant-level energy balance, from
    calorimetry of the heat-sink stream, or from both. Calorimetric estimates use
    measured coolant mass flow rate and enthalpy rise across the heat-rejection equipment,
    while electrical metering provides the net work term needed to close the cycle
    balance.


    For reactor-scale fusion power-plant studies, thermal efficiencies of about 30-40%
    imply rejected heat loads of about 60-70% of the inlet thermal power. Commercial-scale
    cases with several hundred MW of net electrical output typically reject about
    1-3 GW of thermal power, depending on cycle efficiency, auxiliary loads, and heat-sink
    temperature.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_inlet
- name: tritium_prefill_count
  kind: scalar
  status: draft
  description: Accumulated number of tritium atoms injected as gas during the plasma
    prefill phase, expressed in equivalent electrons.
  documentation: "The tritium prefill count records the total number of tritium atoms\
    \ ($^3_1\\text{H}$, charge number $Z = 1$) delivered to the vessel as neutral\
    \ gas during the prefill phase \u2014 the period from the start of gas injection\
    \ up to plasma breakdown. Because tritium is a hydrogen isotope with $Z = 1$,\
    \ the equivalent-electron count equals the raw atom count directly.\n\nThe prefill\
    \ phase establishes the initial neutral gas background required for reproducible\
    \ plasma initiation; the tritium component is particularly relevant in deuterium-tritium\
    \ operations, where it contributes to the initial fuel mix and breakdown conditions.\
    \ The count is accumulated from calibrated gas injection valve signals integrated\
    \ over the duration of the prefill phase. For multi-species prefill scenarios,\
    \ the total electron-equivalent inventory is $\\sum_s Z_s N_s$, where $Z_s$ is\
    \ the charge number and $N_s$ the atom count for species $s$.\n\nThis quantity\
    \ complements [deuterium_prefill_count](name:deuterium_prefill_count), [neon_prefill_count](name:neon_prefill_count),\
    \ and [krypton_prefill_count](name:krypton_prefill_count), which together with\
    \ this name characterize the full multi-species neutral gas inventory available\
    \ at breakdown; the aggregate is captured by [prefill_count](name:accumulated_lithium_prefill_count_due_to_gas_injection).\n\
    \nSign convention: Positive when tritium atoms have been injected into the vessel\
    \ during the prefill phase."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:deuterium_prefill_count
  - name:neon_prefill_count
  - name:krypton_prefill_count
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
- name: tritium_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous source rate of tritium atoms supplied to the plasma by
    gas injection.
  documentation: 'Tritium source rate due to gas injection is the instantaneous rate
    at which neutral gas injection delivers tritium atoms, equivalently tritium nuclei
    carried by injected neutrals, into the plasma particle source. It is the tritium-species
    component of the gas-injection particle source and counts atoms rather than injected
    molecules.


    It is the time derivative of the accumulated tritium atom count delivered by gas
    injection:


    $$

    S_T^{\mathrm{GI}}(t) = \frac{dN_T^{\mathrm{GI}}}{dt}

    $$


    where $S_T^{\mathrm{GI}}$ is the tritium source rate in s$^{-1}$, $N_T^{\mathrm{GI}}$
    is the accumulated number of tritium atoms delivered by gas injection as a dimensionless
    count, and $t$ is time in seconds. Conversely, the tritium atom count delivered
    over any chosen time interval is the time integral of this rate over that interval.


    In practice this rate is computed from calibrated gas throughput, valve actuation
    history, reservoir pressure and temperature changes, or particle-balance estimates,
    with corrections for delivery-line inventory and composition when needed. If the
    metered quantity is a molecular flow, it must be converted to a tritium atom flow:
    one $\mathrm{T}_2$ molecule contributes two tritium atoms, one $\mathrm{DT}$ or
    $\mathrm{HT}$ molecule contributes one tritium atom, and mixtures are summed with
    the corresponding stoichiometric weights.


    No single device-independent range applies, because the value depends on machine
    size, pulse scenario, tritium fraction, and whether tritium is used as a trace
    species or main fuel. The rate is 0 s$^{-1}$ when tritium gas injection is disabled;
    trace injections are often about $10^{17}$-$10^{20}$ s$^{-1}$, while main-fueling
    gas injection in large deuterium-tritium plasmas can be about $10^{20}$-$10^{22}$
    s$^{-1}$ or higher in reactor-scale systems.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_tritium_count_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:helium_3_source_rate_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: tritium
    operator_kind: qualifier
- name: vertical_coordinate_of_pellet_path_point
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of a point on a pellet injection trajectory\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, measured relative to the\
    \ tokamak equatorial plane."
  documentation: 'The vertical coordinate of a pellet path point is the $Z$ position
    of a specified point on a pellet injection trajectory. In the right-handed cylindrical
    $(R,\phi,Z)$ frame, $R$ is major radius in meters, $\phi$ is toroidal angle in
    radians increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height in meters measured relative to the tokamak equatorial plane.
    Together with the [major radius] and [toroidal angle], it specifies the spatial
    location of the path point.


    Values are usually obtained from injector and guide-tube geometry, alignment surveys,
    trajectory modeling, or reconstruction of the pellet path when direct position
    observations are available. The coordinate describes the geometry of the path
    point and does not by itself specify pellet speed, mass, fragmentation, ablation
    rate, or time of flight.


    For paths crossing the confined plasma, $Z$ is commonly within -1 to 1 m in medium-sized
    tokamaks and can span about -3 to 3 m in large tokamaks. Points near injectors
    or external launch structures can lie farther from the equatorial plane, depending
    on the device geometry.


    Sign convention: Positive when the path point lies above the tokamak equatorial
    plane in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: plant_systems
  links: []
- name: vertical_coordinate_of_shattering_position
  kind: scalar
  status: draft
  description: Vertical coordinate of the point where a pellet is shattered in a shattered
    pellet injection system, measured along the machine symmetry axis.
  documentation: 'In a shattered pellet injection (SPI) system, a solid pellet is
    fractured into fragments at a prescribed shattering position before the debris
    enters the plasma. The vertical coordinate $Z$ identifies the height of this shattering
    event in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major
    radius and $Z$ increases upward along the machine symmetry axis.


    Together with the radial companion major_radius_of_pellet_path_point, this $Z$
    coordinate fully specifies the poloidal location of fragment formation, directly
    influencing the spatial distribution of the ablating pellet cloud and the resulting
    material deposition profile in the plasma. The [vertical_coordinate_of_pellet](name:vertical_coordinate_of_pellet_path_point)
    gives the instantaneous $Z$ position of the intact pellet along its trajectory
    before impact.


    The shattering position is a fixed geometric property of the injector assembly,
    set by the guide tube termination and barrel exit geometry; it is determined by
    mechanical survey of the injection system relative to the machine coordinate origin.
    Typical $Z$ values range from approximately $-2$ m to $+2$ m in medium-sized tokamaks,
    depending on the injection port location and whether the system targets midplane,
    upper, or lower regions of the vessel.


    Sign convention: Positive when the shattering position lies above the machine
    equatorial plane, in the direction of increasing $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:vertical_coordinate_of_pellet_path_point
- name: vertical_velocity_of_pellet
  kind: scalar
  status: draft
  description: "Z component of the shattered pellet center-of-mass velocity in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical velocity of a pellet is the $Z$ component $v_Z$ of
    the center-of-mass velocity of a shattered pellet or its fragment cloud. It describes
    motion parallel to the vertical direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. Together with [radial velocity of the pellet](name:radial_velocity_of_pellet)
    and [toroidal velocity of the pellet](name:toroidal_velocity_of_pellet), it forms
    the cylindrical component representation of the pellet translational velocity.


    The pellet center-of-mass velocity decomposes in the right-handed cylindrical
    $(R, \phi, Z)$ frame as:


    $$

    \mathbf{v}_\mathrm{pellet} = v_R \hat{R} + v_\phi \hat{\phi} + v_Z \hat{Z}

    $$


    where $v_R$, $v_\phi$, and $v_Z$ are the radial, toroidal, and vertical velocity
    components, all in m.s^-1, and $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$ are the
    corresponding unit vectors.


    In practice, $v_Z$ is obtained from the time derivative of the pellet or fragment-cloud
    center-of-mass position, or from a reconstructed trajectory and launch geometry.
    For a fragment cloud, the center-of-mass velocity represents the mass-weighted
    translational motion of the cloud rather than the motion of any individual fragment.


    Typical values are configuration- and trajectory-dependent and are reported in
    m.s^-1. For a given pellet speed $|\mathbf{v}_\mathrm{pellet}|$, the component
    satisfies $-|\mathbf{v}_\mathrm{pellet}| \le v_Z \le |\mathbf{v}_\mathrm{pellet}|$;
    it may be near zero for nearly horizontal trajectories or comparable to the total
    speed for strongly inclined trajectories.


    Sign convention: Positive when the pellet center of mass moves in the direction
    of increasing $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:radial_velocity_of_pellet
  - name:toroidal_velocity_of_pellet
- name: x_direction_unit_vector_of_pellet_injector
  kind: scalar
  status: draft
  description: X-axis component of the unit vector defining the injection direction
    of a pellet injector in the right-handed Cartesian frame.
  documentation: 'The injection direction unit vector $\hat{u} = (u_x, u_y, u_z)$
    specifies the orientation of the pellet injector beam axis in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, where $\hat{z}$ is vertical. The
    x-component $u_x$ equals the direction cosine between the injection axis and the
    $\hat{x}$ direction, and carries no physical unit because it is a component of
    a normalized vector.


    The three Cartesian components satisfy the unit-vector normalization constraint:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    where $u_y$ and $u_z$ are given by [y_direction_unit_vector_of_pellet_injector](name:y_direction_unit_vector_of_pellet_injector)
    and [z_direction_unit_vector_of_pellet_injector](name:z_direction_unit_vector_of_pellet_injector)
    respectively. The injection direction is fixed by the mechanical alignment of
    the injector and does not change during a discharge. Combined with [pellet_velocity_magnitude](name:pellet_velocity_magnitude),
    this component enables reconstruction of the full pellet velocity vector for trajectory
    modeling and deposition analysis.


    Sign convention: Positive when the injection direction has a positive projection
    onto the $\hat{x}$ axis.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:y_direction_unit_vector_of_pellet_injector
  - name:z_direction_unit_vector_of_pellet_injector
  - name:pellet_velocity_magnitude
  sources:
  - id: dd:spi/injector/injection_direction/x
    dd_path: spi/injector/injection_direction/x
    status: composed
- name: xenon_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of xenon gas into the plasma vessel, where
    each xenon atom is counted as Z = 54 equivalent electrons.
  documentation: 'The xenon source rate quantifies the instantaneous flux of xenon
    gas delivered to the plasma vessel by gas injection systems. Xenon (atomic number
    Z = 54) is a heavy noble gas used as a high-radiating impurity for plasma control,
    impurity seeding, and disruption mitigation in fusion devices.


    The equivalent-electron rate $\dot{N}_\mathrm{Xe}$ is obtained by weighting the
    instantaneous atom injection rate by xenon''s atomic number:


    $$

    \dot{N}_\mathrm{Xe} = 54 \cdot \dot{n}_\mathrm{Xe}

    $$


    where $\dot{n}_\mathrm{Xe}$ is the xenon atom flux in atoms s$^{-1}$ and 54 is
    the atomic number of xenon.


    The injection rate is inferred from valve conductance and upstream gas pressure
    measurements. Integrating over time yields the cumulative xenon inventory. The
    [krypton_source_rate_due_to_gas_injection](name:krypton_source_rate_due_to_gas_injection)
    follows the same equivalent-electron convention for the neighboring noble gas
    krypton, while [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection)
    aggregates equivalent-electron contributions across all injected species.


    Sign convention: Positive when xenon gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:krypton_source_rate_due_to_gas_injection
  - name:electron_source_rate_due_to_injection
- name: y_direction_unit_vector_of_pellet_injector
  kind: scalar
  status: draft
  description: Y-axis component of the direction unit vector of a pellet injector,
    specifying the injection axis orientation in the right-handed Cartesian (x, y,
    z) frame.
  documentation: 'The y component of the pellet injector direction unit vector specifies
    the projection of the injector''s pointing axis onto the $\hat{y}$ axis of the
    right-handed Cartesian $(x, y, z)$ frame, where $\hat{z}$ is vertical. Together
    with the [x component](name:x_direction_unit_vector_of_pellet_injector) and [z
    component](name:z_direction_unit_vector_of_pellet_injector), this quantity fully
    defines the three-dimensional orientation of the injection axis.


    For a unit vector $\hat{u}$ pointing along the injection axis, the normalization
    constraint reads:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    where $u_x$, $u_y$, and $u_z$ are the three Cartesian components of the direction
    unit vector.


    The injection direction is determined from the mechanical alignment of the injector
    and is obtained from engineering surveys or optical alignment measurements. Values
    are bounded to the interval $[-1, +1]$, with $|u_y| = 1$ indicating a purely y-directed
    injection and $u_y = 0$ for injection wholly within the $xz$-plane.


    Sign convention: Positive when the injection direction has a component in the
    $+\hat{y}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:x_direction_unit_vector_of_pellet_injector
  - name:z_direction_unit_vector_of_pellet_injector
  sources:
  - id: dd:spi/injector/injection_direction/y
    dd_path: spi/injector/injection_direction/y
    status: composed
- name: y_minor_axis_unit_vector_of_shatter_cone
  kind: scalar
  status: draft
  description: Y component of the shatter-cone minor-axis unit vector, expressed in
    the right-handed Cartesian (x, y, z) frame.
  documentation: 'The $y$ component of the shatter-cone minor-axis unit vector is
    the scalar component of the minor-axis direction along the $+\hat{\mathbf{y}}$
    basis direction in the right-handed Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}},
    \hat{\mathbf{z}})$ frame, with $\hat{\mathbf{z}}$ vertical. It is dimensionless
    and is one of the three Cartesian components used to describe the minor-axis orientation
    of an anisotropic shatter cone.


    The component is defined by the scalar projection of the minor-axis unit vector
    onto the Cartesian $y$ basis direction:


    $$

    e_{\mathrm{minor},y} = \mathbf{e}_{\mathrm{minor}} \cdot \hat{\mathbf{y}}

    $$


    where $e_{\mathrm{minor},y}$ is this component, $\mathbf{e}_{\mathrm{minor}}$
    is the shatter-cone minor-axis unit vector, and $\hat{\mathbf{y}}$ is the $y$
    basis vector of the right-handed Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}},
    \hat{\mathbf{z}})$ frame. Because $\mathbf{e}_{\mathrm{minor}}$ is normalized,
    its components satisfy $e_{\mathrm{minor},x}^2 + e_{\mathrm{minor},y}^2 + e_{\mathrm{minor},z}^2
    = 1$.


    In practice, the minor-axis direction is obtained from injector geometry, mechanical
    alignment information, or fits to observations of the post-breakup particle cloud.
    The $x$, $y$, and $z$ components are used together to reconstruct the minor-axis
    orientation; when an orthogonal cone-axis, major-axis, and minor-axis representation
    is assumed, consistency is checked using normalization and near-zero dot products
    between the corresponding unit vectors.


    The allowed dimensionless range is $[-1, 1]$. Values near $+1$ indicate alignment
    with $+\hat{\mathbf{y}}$, values near $-1$ indicate alignment with $-\hat{\mathbf{y}}$,
    and values near $0$ indicate little or no projection onto the $y$ direction.


    Sign convention: Positive when the shatter-cone minor-axis unit vector projects
    onto the $+\hat{\mathbf{y}}$ direction in the right-handed Cartesian $(\hat{\mathbf{x}},
    \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:y_unit_vector_of_shatter_cone
  - name:x_major_axis_unit_vector_of_shatter_cone
  - name:z_unit_vector_of_shatter_cone
  sources:
  - id: dd:spi/injector/shatter_cone/unit_vector_minor/y
    dd_path: spi/injector/shatter_cone/unit_vector_minor/y
    status: composed
- name: z_direction_unit_vector_of_pellet_injector
  kind: scalar
  status: draft
  description: Z-axis component of the unit vector defining the injection direction
    of a pellet injector in the right-handed Cartesian (x, y, z) frame, where z is
    aligned with the vertical direction.
  documentation: 'The Z-axis component $u_z$ of the pellet injector direction unit
    vector specifies the vertical projection of the injector axis in the right-handed
    Cartesian $(x, y, z)$ frame, where $z$ coincides with the machine vertical axis.
    Together with the [x component](name:x_direction_unit_vector_of_pellet_injector)
    and [y component](name:y_direction_unit_vector_of_pellet_injector), it fully defines
    the three-dimensional orientation of the injector barrel.


    As a component of a unit vector $\hat{u} = (u_x, u_y, u_z)$, the three components
    satisfy the normalization constraint:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    so $u_z$ is bounded in the range $[-1, 1]$. A value of $u_z = 1$ corresponds to
    purely upward injection, $u_z = -1$ to purely downward injection, and $u_z = 0$
    to a horizontal trajectory.


    The injector direction is determined by the fixed mechanical geometry of the injector
    assembly. For shattered pellet injection systems, this component applies to both
    the injection barrel axis and the shatter cone orientation, which are related
    to the [vertical coordinate of the shattering position](name:vertical_coordinate_of_shattering_position).
    The value is set at installation and does not vary during a discharge.


    Sign convention: Positive when the injection direction has a component in the
    $+z$ (upward vertical) direction.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:x_direction_unit_vector_of_pellet_injector
  - name:y_direction_unit_vector_of_pellet_injector
  - name:vertical_coordinate_of_shattering_position
  sources:
  - id: dd:spi/injector/injection_direction/z
    dd_path: spi/injector/injection_direction/z
    status: composed
  - id: dd:spi/injector/shatter_cone/direction/z
    dd_path: spi/injector/shatter_cone/direction/z
    status: vocab_gap
- name: thermal_power_of_divertor
  kind: scalar
  status: draft
  description: Total heat-exhaust power deposited on the plasma-facing surfaces of
    the divertor system. It is the surface integral of the local thermal heat flux
    over divertor targets and included divertor components, excluding main-wall loads
    and distinct electrical-current power.
  documentation: 'Thermal power of the divertor is the total rate at which plasma
    exhaust energy is deposited as heat on the divertor system. The relevant integration
    surface is the plasma-facing boundary of the divertor system, including divertor
    targets and any other divertor components included in the thermal-load definition,
    but excluding main-wall surfaces. This quantity represents the thermal heat-exhaust
    load; it is distinct from divertor power associated specifically with electric
    currents.


    For a specified divertor surface set, the total thermal power is the surface integral
    of the deposited thermal heat-flux density:


    $$

    P_{\mathrm{th,div}} = \int_{S_{\mathrm{div}}} q_{\mathrm{th}}(\mathbf{x}) \, dA

    $$


    where $S_{\mathrm{div}}$ is the selected plasma-facing divertor surface, $q_{\mathrm{th}}$
    is the local thermal heat-flux density deposited into that surface in W m$^{-2}$,
    $dA$ is the surface element in m$^2$, and $P_{\mathrm{th,div}}$ is in W. If the
    divertor is treated as a set of components or targets, the same quantity is the
    sum of this integral over those components.


    In practice it is inferred by integrating mapped divertor heat-flux measurements
    from infrared thermography, embedded calorimetry, thermocouples, probes, or radiation
    and neutral-exhaust analysis, often constrained by global power balance. Modeling
    estimates compute the same surface-integrated thermal deposition from parallel
    transport, cross-field spreading, volumetric radiation, charge-exchange neutrals,
    and plasma-surface interaction physics.


    Typical values are strongly device and scenario dependent: small or medium experiments
    may deposit about $10^5$-$10^7$ W on the divertor, large tokamak scenarios about
    $10^7$-$10^8$ W, and reactor or power-plant designs can require exhaust handling
    at about $10^8$-$10^9$ W. The distribution over the wetted area is often as important
    as the total, because material limits are governed by local heat flux as well
    as integrated power.


    Sign convention: Positive when thermal energy is deposited into the divertor system
    from the plasma.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_divertor
  - name:thermal_power_at_wall
  - name:thermal_power_of_breeder_blanket
  - name:power_of_divertor_due_to_fusion
  - name:power_at_divertor_target_due_to_conduction
  - name:power_at_divertor_target_due_to_convection
  arguments:
  - name: power_of_divertor
    operator: thermal
    operator_kind: qualifier
