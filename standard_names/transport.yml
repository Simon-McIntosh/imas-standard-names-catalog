- name: electric_field
  kind: vector
  status: draft
  description: Electromagnetic force per unit charge that drives charged-particle
    acceleration, cross-field drifts, and parallel current in a plasma.
  documentation: 'The electric field is the vector field that gives the electrostatic
    and inductive force per unit charge on electrons and ions. In magnetized plasmas
    it controls $E \times B$ drift motion, parallel acceleration, Ohmic current drive,
    and radial force balance, making it closely coupled to [magnetic field], [electron
    velocity](name:electron_velocity), and [plasma current density].


    A common electromagnetic definition is


    $$

    \mathbf{E} = -\nabla \Phi - \frac{\partial \mathbf{A}}{\partial t}

    $$


    where $\mathbf{E}$ is the electric-field vector in V/m, $\Phi$ is the electric
    potential in V, $\mathbf{A}$ is the magnetic vector potential in V s m$^{-1}$,
    and $t$ is time in s. In conducting plasma, the parallel component is related
    to current through transport coefficients such as [electrical conductivity], while
    perpendicular components enter drift and force-balance relations.


    It is inferred from loop-voltage and magnetic-equilibrium analysis, charge-exchange
    force-balance measurements, heavy-ion-beam probes, Langmuir probes in the edge,
    and kinetic or transport modeling. Representative tokamak values range from 0.1-10
    V/m for inductive toroidal fields, several kV/m to tens of kV/m for core radial
    fields, and 50-300 kV/m in steep edge transport barriers.


    Sign convention: Positive when a component of $\mathbf{E}$ points along the positive
    direction of its stated basis: outward for $+R$ and increasing toroidal angle
    $\phi$ for $+\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  sources:
  - id: dd:core_profiles/profiles_1d/e_field
    dd_path: core_profiles/profiles_1d/e_field
    status: composed
- name: electrical_conductivity
  kind: vector
  status: draft
  description: Anisotropic transport coefficient that relates electric-field components
    to conductive current components in a magnetized plasma.
  documentation: 'Electrical conductivity describes the collisional ability of charged
    particles to carry current in response to an applied electric field. In a magnetized
    plasma it is strongly anisotropic, with the field-aligned response represented
    by [parallel_electrical_conductivity](name:parallel_plasma_electrical_conductivity)
    and directly connected to the conductive part of [plasma_current_density](name:plasma_current_density).


    The defining linear transport relation is


    $$

    \mathbf{j}_{\rm cond} = \boldsymbol{\sigma}\cdot\mathbf{E}

    $$


    where $\mathbf{j}_{\rm cond}$ is the conductive current density in A m$^{-2}$,
    $\mathbf{E}$ is the [electric_field](name:electric_field) in V m$^{-1}$, and $\boldsymbol{\sigma}$
    is the electrical-conductivity tensor in ohm$^{-1}$ m$^{-1}$. In collisional regimes
    the dominant parallel contribution follows Spitzer-like scaling, increasing approximately
    as [electron_temperature](name:electron_temperature)$^{3/2}$ and depending on
    charge state and [normalized_electron_collisionality](name:normalized_electron_collisionality);
    [electron_density](name:electron_density) enters through collision frequencies
    and current response.


    Conductivity is computed from kinetic or transport models, inferred from current
    diffusion and loop-voltage evolution, or constrained by combining magnetic equilibrium
    information with electric-field estimates. Representative core tokamak values
    are about $10^6$-$10^9$ ohm$^{-1}$ m$^{-1}$, while colder edge and scrape-off-layer
    plasmas can fall to $10^3$-$10^6$ ohm$^{-1}$ m$^{-1}$.'
  unit: m^-1.ohm^-1
  physics_domain: transport
  links:
