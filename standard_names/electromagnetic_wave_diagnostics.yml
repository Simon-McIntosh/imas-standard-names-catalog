    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/focs.html#focs-fibre_properties-twist
    dd_documentation:
      leaf: Twist period
      parent_path: focs/fibre_properties
      parent: Intrinsic properties of the fibre installed on the vacuum vessel
      data_type: FLT_0D
