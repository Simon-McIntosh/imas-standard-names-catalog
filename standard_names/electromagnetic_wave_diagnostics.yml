- name: wave_electric_field
  kind: vector
  status: active
  description: Complex vector phasor of a coherent electromagnetic-wave electric field,
    capturing its local amplitude, phase, and polarization as the oscillatory contribution
    to the total electric field.
  documentation: 'The wave electric field is the complex vector phasor representing
    the oscillatory electromagnetic-wave contribution to the local [electric field](name:electric_field).
    It retains the wave amplitude, phase, and polarization before any spatial projection
    or spectral mode decomposition.


    For a single angular frequency, the physical wave field is defined by


    $$

    \mathbf{E}_{\mathrm{wave}}(\mathbf{r},t)=\operatorname{Re}\left\{\widetilde{\mathbf{E}}_{\mathrm{wave}}(\mathbf{r},\omega)e^{-i\omega
    t}\right\}

    $$


    where $\widetilde{\mathbf{E}}_{\mathrm{wave}}$ is the complex wave-electric-field
    phasor, $\mathbf{r}$ is position, $t$ is time, and $\omega$ is angular frequency.
    Its projections include the [parallel wave electric field](name:parallel_wave_electric_field)
    and [vertical wave electric field](name:vertical_wave_electric_field); its toroidal
    Fourier components are represented by the [per-toroidal-mode electric field](name:per_toroidal_mode_electric_field).
    The quantity excludes electrostatic and non-wave contributions unless they are
    explicitly part of the identified electromagnetic wave.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electric_field
  - name:parallel_wave_electric_field
  - name:vertical_wave_electric_field
  - name:per_toroidal_mode_electric_field
  arguments:
  - name: electric_field
    operator: wave
    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: active
  description: Complex phasor of the E-plus left-hand circular polarization component
    of an electromagnetic-wave electric field in a magnetized plasma.
  documentation: 'The left-hand circularly polarized wave electric field is the E-plus
    complex phasor obtained by projecting the electromagnetic-wave electric-field
    phasor onto the circular polarization basis transverse to the local equilibrium
    magnetic field. It retains both polarization amplitude and phase and is a component
    of the [wave electric field](name:wave_electric_field).


    Using the negative-time-harmonic convention, the component is defined by


    $$

    E_{+}=\mathbf{E}_{w}\cdot\mathbf{e}_{+}^{*},\qquad \mathbf{e}_{+}=\frac{\hat{\mathbf{e}}_{1}+i\hat{\mathbf{e}}_{2}}{\sqrt{2}},\qquad
    \hat{\mathbf{e}}_{1}\times\hat{\mathbf{e}}_{2}=\hat{\mathbf{b}},\qquad \hat{\mathbf{b}}=\frac{\mathbf{B}_{0}}{|\mathbf{B}_{0}|}

    $$


    where $\mathbf{E}_{w}$ is the complex wave-electric-field phasor, $\mathbf{B}_{0}$
    is the local background magnetic field, $\hat{\mathbf{b}}$ is its unit direction,
    the transverse unit vectors $\hat{\mathbf{e}}_{1}$ and $\hat{\mathbf{e}}_{2}$
    form a right-handed basis, and the asterisk denotes complex conjugation. The associated
    physical field uses $\exp(-i\omega t)$, so this component carries phase information
    rather than representing a field magnitude. Its real-part sibling [left-hand circularly
    polarized wave electric field real part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    provides one quadrature, while the [right-hand circularly polarized wave electric
    field](name:right_hand_circularly_polarized_wave_electric_field) represents the
    opposite circular polarization.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field_real_part
  kind: complex
  status: active
  description: Signed in-phase real quadrature of the E-plus wave electric-field phasor
    in the left-hand circular polarization basis.
  documentation: 'Signed in-phase real quadrature of the $E_+$ wave electric-field
    phasor in the left-hand circular polarization basis is the real component of the
    complex coefficient obtained by projecting the wave electric-field phasor onto
    the normalized left-hand circular basis perpendicular to the local background
    magnetic field. It retains the phase-relative sign of that coefficient and is
    distinct from the non-negative modulus $|E_+|$.


    With harmonic time dependence $\tilde{\mathbf{E}}\exp(-i\omega t)$ and $\hat{\mathbf{e}}_+=(\hat{\mathbf{e}}_1+i\hat{\mathbf{e}}_2)/\sqrt{2}$,
    this quantity is defined by the Hermitian projection


    $$

    E_{+,\mathrm{re}} = \operatorname{Re}\!\left[\hat{\mathbf{e}}_+^{\,*}\cdot\tilde{\mathbf{E}}\right]

    $$


    where $\tilde{\mathbf{E}}$ is the complex wave electric-field phasor, $\operatorname{Re}$
    denotes the real-part operator, the star denotes complex conjugation, $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$
    is the local background magnetic-field direction, and $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{b}})$
    is an orthonormal triad with $\hat{\mathbf{e}}_1\times\hat{\mathbf{e}}_2=\hat{\mathbf{b}}$.


    Together with the [left-hand circularly polarized wave electric-field imaginary
    part](name:left_hand_circularly_polarized_wave_electric_field_imaginary_part),
    it forms the complex coefficient $E_+=E_{+,\mathrm{re}}+iE_{+,\mathrm{im}}$. The
    complete local phasor in the circular-and-parallel basis is reconstructed as $\tilde{\mathbf{E}}=E_+\hat{\mathbf{e}}_+
    + E_-\hat{\mathbf{e}}_- + E_\parallel\hat{\mathbf{b}}$, where $E_-$ is the right-hand
    circular coefficient and $E_\parallel$ is the field-aligned coefficient.


    Sign convention: Positive when the reference-phase left-hand circularly polarized
    phasor corresponds, for $E_-=E_\parallel=0$, to an electric field pointing along
    $+\hat{\mathbf{e}}_1$ and rotating toward $+\hat{\mathbf{e}}_2$ about $+\hat{\mathbf{b}}$
    under the $\exp(-i\omega t)$ time dependence.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:left_hand_circularly_polarized_wave_electric_field
  - name:parallel_wave_electric_field
  arguments:
  - name: left_hand_circularly_polarized_wave_electric_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - dd_path: ece/channel/beam_tracing/beam/e_field/plus/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-e_field-plus-real
    dd_documentation:
      leaf: Real part
      parent_path: ece/channel/beam_tracing/beam/e_field/plus
      parent: Left hand polarised electric field component
      data_type: FLT_1D
      unit: V.m^-1
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Real part of the left-hand circularly polarised electric field
        component (E+) along the ECE beam or ray path. Used in beam tracing calculations
        to describe the wave polarisation state for electron cyclotron emission diagnostics.
      kind: llm
  - dd_path: waves/coherent_wave/beam_tracing/beam/e_field/plus/real
