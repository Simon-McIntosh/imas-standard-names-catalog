- name: poloidal_magnetic_flux_at_flux_surface
  kind: scalar
  status: active
  description: Signed poloidal magnetic flux assigned to a nested magnetic surface,
    serving as the equilibrium label for its position in the plasma.
  documentation: 'Poloidal magnetic flux at a flux surface is the signed magnetic
    flux through a horizontal disk centered on the toroidal symmetry axis and bounded
    by that surface. In an axisymmetric equilibrium, it is constant over each nested
    magnetic surface and provides its absolute, unnormalized flux label.


    The poloidal flux at cylindrical coordinates $(R,Z)$ is defined by


    $$

    \psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi$ is the poloidal magnetic flux, $R$ is major radius, $Z$ is vertical
    height, $R''$ is the integration radius, and $B_Z$ is the vertical magnetic-field
    component, all expressed in the right-handed cylindrical $(R,\phi,Z)$ frame.


    This quantity applies to nested equilibrium magnetic surfaces within the plasma
    and represents the signed physical flux itself, not a flux-surface average, species
    sum, or normalized radial coordinate. It is distinct from the magnetic flux linked
    by a [poloidal magnetic flux of a flux loop](name:poloidal_magnetic_flux_of_flux_loop),
    which is defined by an oriented diagnostic-loop surface rather than by an equilibrium
    flux surface.


