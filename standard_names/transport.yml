- name: radial_neutral_momentum_flux
  kind: scalar
  status: draft
  description: Radial component of the momentum flux tensor carried by neutral particles
    across a flux surface in the edge plasma.
  documentation: "This quantity represents the radial transport of momentum per unit\
    \ area per unit time by neutral particles. It is a component of the full momentum\
    \ flux tensor $\\Pi_{\\rm neut}$, which in the edge plasma is dominated by charge-exchange\
    \ and elastic collisions with the bulk ions. The radial neutral momentum flux\
    \ plays a key role in the toroidal rotation balance of the edge plasma, as neutrals\
    \ can act as a momentum sink via ion\u2013neutral friction. Typical radial momentum\
    \ flux values in the scrape-off layer of a medium-size tokamak range from $10^{-3}$\
    \ to $10^{-1}\\,\\text{kg}\\,\\text{m}^{-1}\\,\\text{s}^{-2}$, depending on the\
    \ neutral density and parallel flow velocity. This quantity is related to [neutral_momentum_flux](name:neutral_momentum_flux)\
    \ as its radial projectionais measured by edge neutral particle analyzers or inferred\
    \ from spectroscopic measurements of neutral line emission combined with collisional-radiative\
    \ models."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
