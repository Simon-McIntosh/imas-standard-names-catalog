- name: toroidal_component_of_runaway_electron_current
  kind: scalar
  status: draft
  description: Projection of the net current carried by the runaway electron population
    onto the toroidal direction $\hat{\phi}$, integrated over the plasma cross-section.
  documentation: "The toroidal runaway electron current $I_{\\rm RE,\\phi}$ quantifies\
    \ the total charge transport by the runaway population along the toroidal direction\
    \ $\\hat{\\phi}$ in the right-handed cylindrical $(R, \\phi, Z)$ frame. Runaway\
    \ electrons are generated when the accelerating electric field exceeds the critical\
    \ Dreicer field $E_D = n_e e^3 \\ln\\Lambda / (4\\pi\\epsilon_0^2 m_e v_{th,e}^2)$,\
    \ where $n_e$ is the electron density, $e$ the elementary charge, $\\ln\\Lambda$\
    \ the Coulomb logarithm, and $v_{th,e}$ the thermal electron speed; the resulting\
    \ beam current is predominantly toroidal and can reach tens to hundreds of kiloamperes\
    \ during disruptions. This quantity is distinct from [runaway_electron_current](name:runaway_electron_current),\
    \ which refers to the same physical observable under the convention that the total\
    \ runaway current is toroidal \u2014 the present name makes the toroidal projection\
    \ explicit, consistent with the naming pattern used for [toroidal_component_of_total_driven_current_density](name:toroidal_component_of_total_driven_current_density)\
    \ and related current components. It is inferred from hard X-ray emission profiles,\
    \ synchrotron radiation imaging, or from equilibrium reconstruction when a localized\
    \ current channel is identifiable. In ITER-like machines the runaway plateau current\
    \ can reach 1\u201315 MA under worst-case disruption scenarios, making this quantity\
    \ central to disruption mitigation and avoidance strategies.\n\nSign convention:\
    \ Positive when the runaway electron current flows in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: A
  physics_domain: runaway_electrons
  links:
  - name:runaway_electron_current
  - name:toroidal_component_of_total_driven_current_density
  constraints: []
