- name: normalized_frequency_of_gyrokinetic_eigenmode
  kind: scalar
  status: active
  description: Dimensionless real oscillation frequency of a linear gyrokinetic eigenmode,
    normalized by the positive reference angular frequency for the same perpendicular
    wavevector.
  documentation: 'The quantity is the real oscillation-frequency component of a linear
    gyrokinetic eigenmode in the local flux-tube approximation. It is evaluated for
    a specified wavevector perpendicular to the equilibrium magnetic field.


    The normalized frequency is defined by


    $$

    \omega_{\mathrm{norm}} = \frac{\operatorname{Re}(\omega)}{\omega_{\mathrm{ref}}}

    $$


    where $\omega$ is the complex eigenfrequency and $\omega_{\mathrm{ref}}$ is the
    positive reference angular frequency used for the same eigenvalue problem.


    Together with the [normalized linear growth rate](name:normalized_linear_growth_rate_of_gyrokinetic_eigenmode),
    this quantity specifies the real and imaginary components of the normalized complex
    eigenfrequency. Its sign follows the temporal Fourier and wave-propagation convention
    used to define $\omega$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_linear_growth_rate_of_gyrokinetic_eigenmode
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/frequency_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-frequency_norm
    dd_documentation:
