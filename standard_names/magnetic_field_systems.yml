- name: alpha_angle_of_ferritic_element
  description: |-
    Signed inclination of the first axis of an oblique parallelogram
    cross-section of an axisymmetric ferritic element, measured
    counter-clockwise from the outward radial direction.
  documentation: |-
    This quantity is the alpha orientation of the first axis of an oblique,
    parallelogram-shaped cross-section belonging to a single axisymmetric
    ferritic element. It specifies the primary orientation of that element in
    the poloidal plane.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the signed inclination
    is defined by

    $$
    \alpha = \operatorname{atan2}(\mathbf{a}_1 \cdot \hat{\mathbf{Z}},\, \mathbf{a}_1 \cdot \hat{\mathbf{R}})
    $$

    where $\alpha$ is the alpha inclination angle, $\mathbf{a}_1$ is the
    oriented unit vector along the first axis of the parallelogram
    cross-section, $\hat{\mathbf{R}}$ is the outward radial unit vector,
    $\hat{\mathbf{Z}}$ is the vertical unit vector, and $\operatorname{atan2}$
    is the signed two-argument arctangent.

    The quantity applies to one ferritic element and is not an aggregate over
    multiple elements. It describes the first axis only; it is distinct from the
    [tilt angle of the ferritic element](name:tilt_angle_of_ferritic_element),
    which describes the inclination of the second side. Together, the alpha and
    tilt angles specify the orientations of the two oblique sides of the
    parallelogram cross-section.

    The same alpha-orientation concept is used for other oblique component
    cross-sections, including an [alpha angle of an iron core
    segment](name:alpha_angle_of_iron_core_segment).

    Sign convention: Positive when the first axis tilts from the outward radial
    direction toward increasing $Z$, counter-clockwise in the poloidal $(R,Z)$
    plane.
  unit: rad

- name: alpha_angle_of_iron_core_segment
  description: |-
    Signed inclination of the alpha-side edge of an iron core segment
    cross-section, measured from the outward major-radius direction toward
    increasing vertical height.
  documentation: |-
    The alpha angle is the signed orientation of the designated alpha-side edge
    of an iron core segment in the poloidal cross-section of the right-handed
    cylindrical $(R, \phi, Z)$ frame. It identifies the alpha-side orientation
    and is independent of the edge length.

    For an oriented alpha-side vector with signed radial and vertical components
    $\Delta R$ and $\Delta Z$, the angle is defined by

    $$
    \alpha = \operatorname{atan2}(\Delta Z,\Delta R)
    $$

    where $\alpha$ is the alpha angle, $\Delta R$ is the component along the
    outward major-radius direction, and $\Delta Z$ is the component along the
    vertical direction. This quantity is the alpha-side specialization of the
    general iron core segment orientation angle, not a length or cross-sectional
    dimension.

    Sign convention: Positive when the oriented alpha-side vector is inclined
    from the outward $+R$ direction toward increasing $Z$.
  unit: rad

- name: alpha_angle_of_passive_loop_element
  description: |-
    Signed inclination of the first axis of an oblique passive conductor
    loop-element cross-section, measured counterclockwise from the outward
    radial direction in the poloidal plane.
  documentation: |-
    The alpha angle is the signed inclination of the first axis of an oblique,
    trapezoidal or parallelogram-shaped cross-section of one passive conductor
    loop element. It specifies the orientation of that element’s cross-sectional
    geometry in the poloidal plane.

    The angle is defined from the directed first-axis vector:

    $$
    \alpha = \operatorname{atan2}\!\left(\mathbf{a}_1 \cdot \hat{\mathbf{Z}},\,\mathbf{a}_1 \cdot \hat{\mathbf{R}}\right)
    $$

    where $\alpha$ is the alpha inclination angle, $\mathbf{a}_1$ is the
    directed first axis of the cross-section, $\hat{\mathbf{R}}$ is the outward
    radial unit vector, $\hat{\mathbf{Z}}$ is the upward vertical unit vector,
    and $\operatorname{atan2}$ returns the signed angle from the radial
    component to the vertical component. These directions are defined in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    The quantity applies independently to each passive loop element and to its
    own oblique cross-section; it is not an aggregate angle for a complete
    passive loop or a collection of elements. It describes the first
    cross-sectional axis only, not the transverse dimensions of the element and
    not the overall loop reference-axis inclination represented by the [tilt
    angle of the passive loop](name:tilt_angle_of_passive_loop). The alpha angle
    supplies orientation information for interpreting the element’s other
    cross-sectional geometry, but does not determine those dimensions.

    Sign convention: Positive when the first axis rotates counterclockwise from
    the outward radial direction toward the positive vertical direction in the
    poloidal plane.
  unit: rad

- name: area_of_correction_coil
  description: |-
    Non-negative full geometric area of the conducting material in one
    correction-coil cross-section, taken perpendicular to the local conductor
    path and treated as constant along the coil length.
  documentation: |-
    Non-negative full geometric area of the conducting material in one
    correction-coil cross-section is the cross-sectional measure of the
    electrical conductor on a plane normal to the local conductor path. It is a
    property of one correction-coil conductor element, not a sum over separate
    turns or parallel conductor elements.

    The area includes the conducting material in that cross-section and excludes
    voids, insulation, coolant channels, nonconducting supports, and any
    winding-pack or coil-footprint area outside the conductor material. For
    hollow or compound conductors, only regions that are part of the electrical
    conductor are included.

    It is distinct from radius_of_correction_coil,
    [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil), and
    [width_of_correction_coil](name:width_of_correction_coil), which specify
    particular dimensions of a cross-section; different cross-sectional shapes
    can have the same area.
  unit: m^2

- name: area_of_passive_loop
  description: |-
    Area of a passive loop is the non-negative cross-sectional area of
    conducting material in a passive loop element, taken on a section normal to
    the local current path. It excludes the aperture enclosed by the loop.
  documentation: |-
    Area of a passive loop is the non-negative cross-sectional area of the solid
    conducting material of a passive conducting loop element, evaluated on a
    surface normal to the local current path. It is a material cross-section of
    the conductor, not the aperture enclosed by the loop or the area swept out
    by the loop centerline.

    The general geometric definition is the area of the conducting region
    $\mathcal{S}$ in that normal cross-section:

    $$
    A = \int_{\mathcal{S}} dS
    $$

    where $A$ is the passive-loop conductor area, $\mathcal{S}$ is the subset of
    the section occupied by conducting material, and $dS$ is the scalar
    surface-area element.

    For an annular cross-section, this definition gives $A = \pi(r_o^2-r_i^2)$,
    where $r_i$ and $r_o$ are the [inner](name:inner_radius_of_passive_loop) and
    [outer](name:outer_radius_of_passive_loop) radii measured from the annulus
    center to the conducting boundaries. For a non-annular cross-section,
    $\mathcal{S}$ is the bounded conducting region defined by the conductor
    geometry; parameters such as thickness, width, or height describe that
    boundary but are not themselves the area.
  unit: m^2

- name: area_of_poloidal_field_coil
  description: |-
    Non-negative full geometric area of the conducting cross section of one
    poloidal-field-coil element in a poloidal plane at fixed toroidal angle φ of
    the right-handed cylindrical (R, φ, Z) frame, where R is major radius and Z
    is vertical height.
  documentation: |-
    Non-negative full geometric area of the conducting cross section of one
    poloidal-field-coil element is the surface measure of the conductor region
    enclosed by that element boundary. It is defined in a poloidal plane at
    fixed toroidal angle $\phi$ of the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    For an arbitrary conductor cross-section, the area is the integral of the
    differential surface measure over the conductor region $\mathcal{S}$:

    $$
    A = \int_{\mathcal{S}} dS
    $$

    where $A$ is the area of the poloidal-field-coil element, $\mathcal{S}$ is
    the conductor region in the poloidal plane, and $dS$ is the differential
    surface measure on that plane.

    The quantity is per coil element, not a sum over multiple elements or over a
    complete coil. For a rectangular cross-section aligned with the $R$ and $Z$
    directions of the right-handed cylindrical $(R, \phi, Z)$ frame, $A = W H$,
    where $W$ is
    [width_of_poloidal_field_coil](name:width_of_poloidal_field_coil) and $H$ is
    [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil);
    [thickness_of_poloidal_field_coil](name:thickness_of_poloidal_field_coil) is
    a separate geometric extent and is not the radial width in this
    relationship. For an annular cross-section, $A =
    \pi(r_\mathrm{out}^2-r_\mathrm{in}^2)$, where $r_\mathrm{out}$ is
    [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    and $r_\mathrm{in}$ is
    [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).
    An insulation envelope, winding-pack envelope, or effective conducting area
    is a distinct quantity unless it is defined by the same boundary as
    $\mathcal{S}$.
  unit: m^2

- name: area_of_toroidal_field_coil
  description: |-
    Non-negative geometric area of the conducting material within a
    toroidal-field-coil conductor’s cross-sectional boundary, measured normal to
    its local centerline.
  documentation: |-
    The area of a toroidal-field-coil conductor is the geometric area occupied
    by conducting material in a cross-section normal to the conductor’s local
    centerline. It excludes any void, bore, insulation, or surrounding aperture.

    The area is defined by

    $$
    A_{\mathrm{cond}} = \iint_{S_{\mathrm{cond}}} dS
    $$

    where $A_{\mathrm{cond}}$ is the conductor cross-sectional area,
    $S_{\mathrm{cond}}$ is the region enclosed by the conductor boundary, and
    $dS$ is its differential area element.

    This quantity complements the conductor dimensions represented by the [width
    of the toroidal field coil](name:width_of_toroidal_field_coil) and [height
    of the toroidal field coil](name:height_of_toroidal_field_coil); it is not
    the area enclosed by a winding or loop.
  unit: m^2

- name: binormal_coordinate_of_correction_coil
  description: |-
    Signed displacement of a correction-coil conductor outline vertex along the
    local Frenet–Serret binormal, measured from the conductor centerline.
  documentation: |-
    The binormal coordinate specifies the signed position of a correction-coil
    conductor cross-section outline vertex along the local Frenet–Serret
    binormal direction. Together with the [normal coordinate of the correction
    coil](name:normal_coordinate_of_correction_coil), it defines the vertex
    position in the cross-sectional plane.

    For vertex position $\mathbf{r}_v$ and corresponding centerline position
    $\mathbf{r}_c$, the coordinate is

    $$
    b_v = (\mathbf{r}_v - \mathbf{r}_c) \cdot \hat{\mathbf{b}}
    $$

    where $b_v$ is the binormal coordinate in m, $\hat{\mathbf{b}}$ is the local
    unit binormal, and $\mathbf{r}_v$ and $\mathbf{r}_c$ are positions in m. The
    local Frenet–Serret triad is oriented so that $\hat{\mathbf{b}} =
    \hat{\mathbf{t}} \times \hat{\mathbf{n}}$, with $\hat{\mathbf{t}}$ the
    tangent and $\hat{\mathbf{n}}$ the normal unit vector. This coordinate is a
    signed vertex displacement, not the full conductor cross-section height
    represented by the [height of the correction
    coil](name:height_of_correction_coil).

    Sign convention: Positive when the vertex displacement from the conductor
    centerline points in the direction of the local unit binormal
    $\hat{\mathbf{b}}$.
  unit: m

- name: binormal_coordinate_of_toroidal_field_coil
  description: |-
    Signed displacement of each toroidal-field-coil conductor cross-section
    outline vertex along the local Frenet–Serret binormal from the conductor
    centerline.
  documentation: |-
    The binormal coordinate specifies the signed local displacement of a
    toroidal-field-coil conductor cross-section outline vertex from the
    conductor centerline in the direction perpendicular to both the local
    tangent and normal.

    $$
    b_v = (\mathbf{r}_v-\mathbf{r}_c)\cdot\hat{\mathbf{b}}
    $$

    where $b_v$ is the binormal coordinate, $\mathbf{r}_v$ is the vertex
    position in m, $\mathbf{r}_c$ is the corresponding centerline position in m,
    and $\hat{\mathbf{b}}$ is the unit binormal of the local Frenet–Serret
    frame. Together with the [normal coordinate of the toroidal field
    coil](name:normal_coordinate_of_toroidal_field_coil), it defines the
    conductor cross-section outline in the local normal–binormal plane; it is
    not a global vertical coordinate.

    Sign convention: Positive when the vertex displacement has a component in
    the direction of the local Frenet–Serret binormal.
  unit: m

- name: count_of_toroidal_field_coil
  description: |-
    Count of discrete toroidal-field-coil modules forming the device’s toroidal
    magnetic-field system; conductor turns within a module are not counted
    separately.
  documentation: |-
    The toroidal-field-coil module count is the number of distinct coil modules
    forming the device’s toroidal magnetic-field system. Each module is counted
    once, regardless of how many conductor turns or conductor elements it
    contains.

    This count is an inventory of coil modules, not a winding-turn count and not
    a measure of electrical excitation or conductor geometry. Those properties
    are described separately by the [current of a toroidal field
    coil](name:current_of_toroidal_field_coil) and the [area of a toroidal field
    coil](name:area_of_toroidal_field_coil).
  unit: '1'

- name: current_of_passive_loop
  description: |-
    Signed conventional electric current circulating in one axisymmetric passive
    conducting loop, induced by changing linked magnetic flux and
    electromagnetic coupling.
  documentation: |-
    This quantity is the conventional electric current circulating in a single
    passive conducting loop. It represents the electromagnetically induced
    response of the passive conductor to changing linked magnetic flux,
    including transients caused by changing plasma currents, active-coil
    currents, disruptions, and coupling to other conductors.

    For a passive loop with no separately applied circuit voltage, the linear
    circuit response is represented by

    $$
    \mathcal{R} I(t) + L\frac{dI(t)}{dt} = -\frac{d\Phi_{\rm ext}(t)}{dt}
    $$

    where $I(t)$ is the loop current, $\mathcal{R}$ is the loop resistance, $L$
    is its self-inductance, $t$ is time, and $\Phi_{\rm ext}(t)$ is the
    externally linked magnetic flux, including mutual coupling and excluding
    flux generated by the loop's own current. The negative sign expresses Lenz's
    law.

    The quantity applies to one passive conducting loop and denotes its net
    circuit current, with all induced contributions aggregated into that loop
    current. It excludes current imposed by an external power supply and is
    distinct from the current carried by the plasma or by an actively driven
    coil. The loop-resolved current contributes to the net [current of a passive
    structure](name:current_of_passive_structure) when multiple passive
    conducting elements form one structure.

    The magnetic coupling and orientation of the loop are interpreted
    consistently with its [effective turn
    count](name:effective_turn_count_of_passive_loop), whose sign represents the
    element orientation relative to positive loop current.

    Sign convention: Positive when conventional current circulates in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.
  unit: A

- name: current_of_toroidal_field_coil
  description: |-
    Current of a toroidal-field coil is the signed conventional electric current
    carried by one toroidal-field-coil winding. Its sign is defined by the
    toroidal magnetic-field component produced by that coil.
  documentation: |-
    Current of a toroidal-field coil is the signed conventional electric current
    carried by one toroidal-field-coil winding. It represents the coil current
    that sources that coil's contribution to the toroidal magnetic field.

    The signed current is the current-density flux through an oriented
    cross-section of the winding conductor:

    $$
    I = \int_S \mathbf{J} \cdot \hat{\mathbf{n}}\, dA
    $$

    where $I$ is the coil current, $\mathbf{J}$ is the conventional current
    density, $S$ is the oriented cross-section, $\hat{\mathbf{n}}$ is its unit
    normal, and $dA$ is the surface area element.

    This quantity is an individual coil or coil-circuit current. It excludes
    multiplication by the number of turns, summation over a toroidal-field-coil
    set, and currents induced in passive conducting structures such as [current
    of passive structure](name:current_of_passive_structure). It is distinct
    from terminal [voltage of a toroidal-field
    coil](name:voltage_of_toroidal_field_coil) and from [resistance of a
    toroidal-field coil](name:resistance_of_toroidal_field_coil).

    Sign convention: Positive when the toroidal component of the magnetic-field
    contribution from the coil is positive, $B_\phi > 0$, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: A

- name: curvature_of_arc_of_circle_center
  description: |-
    Geometric length scale of a curved boundary or line, with larger values
    indicating gentler bending and smaller values indicating sharper bending.
  documentation: |-
    The radius of curvature is the local geometric length associated with the
    bending of a curve or boundary. It is the radius of the circle that most
    closely represents the curve at the location of interest.

    For curvature represented by its non-negative magnitude, the radius of
    curvature is defined by

    $$
    \rho = \frac{1}{\kappa}
    $$

    where $\rho$ is the radius of curvature and $\kappa$ is the local curvature
    magnitude.

    This quantity applies to a geometric curve or boundary and is not the
    position of the curve's center, its total length, or the full extent of the
    object containing it. The [radius of curvature of an arc-of-circle
    center](name:curvature_inverse_of_arc_of_circle_center) is a specialized
    instance for an iron-core segment boundary; for an exact circular arc,
    $\rho$ equals the circle radius and is constant along that arc.
  unit: m

- name: effective_turn_count_of_coil_conductor_element
  description: |-
    Signed effective winding count used to weight the magnetic-field
    contribution of an individual poloidal-field coil conductor element.
  documentation: |-
    The effective turn count is the signed winding multiplicity assigned to one
    poloidal-field coil conductor element for calculating its contribution to
    the plasma magnetic field. Its magnitude represents the effective number of
    turns attributed to that element, while its sign represents winding
    orientation.

    This quantity applies to an individual conductor element and is not the
    total turn count of a complete coil or coil system. It is an effective
    electromagnetic contribution rather than a purely geometric count of visible
    conductor revolutions, and it excludes the separate winding counts of
    magnetic-field probe coils.

    For a fixed element current and geometry, the element’s magnetic-field
    contribution scales with its effective turn count; reversing the count
    reverses the corresponding field contribution. The same signed-winding
    concept is used for a [poloidal magnetic-field probe turn
    count](name:turn_count_of_poloidal_magnetic_field_probe) and a [toroidal
    magnetic-field probe turn
    count](name:turn_count_of_toroidal_magnetic_field_probe), although this
    quantity applies specifically to a poloidal-field coil conductor element.
  unit: '1'

- name: effective_turn_count_of_passive_loop
  description: |-
    Effective turn count of a passive loop is the signed number of equivalent
    windings assigned to a passive conducting loop for electromagnetic coupling.
    It weights the passive-loop current contribution and may be fractional for
    equivalent or homogenized loop elements.
  documentation: |-
    Effective turn count of a passive loop is the signed number of equivalent
    windings assigned to a passive conducting loop for electromagnetic coupling.
    It may be fractional when the represented conductor is an equivalent or
    homogenized passive-loop element rather than a literal winding.

    The signed current-turn source strength represented by the passive loop is
    defined by:

    $$
    \mathcal{I}_{\mathrm{loop}} = N_{\mathrm{eff}} I_{\mathrm{loop}}
    $$

    where $\mathcal{I}_{\mathrm{loop}}$ is the signed current-turn source
    strength of the passive loop, $N_{\mathrm{eff}}$ is the effective turn count
    of the passive loop, and $I_{\mathrm{loop}}$ is the [current of the passive
    loop](name:current_of_passive_loop).

    This quantity applies to the represented passive loop or passive-loop
    element as one electromagnetic circuit contribution. It has no implicit
    aggregation over multiple passive loops; if several represented windings or
    conductor pieces are collapsed into one loop element, their net orientation
    and coupling are represented by the single algebraic value of
    $N_{\mathrm{eff}}$.

    It is distinct from the [current of the passive
    loop](name:current_of_passive_loop), which is multiplied by
    $N_{\mathrm{eff}}$, and from the [area of the passive
    loop](name:area_of_passive_loop), which describes conductor cross section.
    It is not a turn count for magnetic probes, coil conductor elements,
    toroidal-field coils, or magnetic field-line winding.
  unit: '1'

- name: fast_neutron_flux_of_correction_coil
  description: |-
    Incident crossing rate of fast neutrons per unit area on the inboard-facing
    surface of a non-axisymmetric correction coil.
  documentation: |-
    Fast neutron number flux is the incident crossing rate of the fast-neutron
    population per unit area on the inboard-facing surface of a non-axisymmetric
    correction coil. It is the fast-neutron component of neutron flux of
    correction coil.

    The differential number flux is defined by

    $$
    \Phi_{\mathrm{fast}} = \frac{dN_{\mathrm{fast}}}{dA\,dt}
    $$

    where $N_{\mathrm{fast}}$ is the number of fast neutrons incident on surface
    area $A$ and $t$ is time; $A$ is measured in m$^2$ and $t$ in s.

    The inboard-facing surface is the side directed toward decreasing major
    radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame. This
    quantity includes only incident fast-neutron crossings and excludes outgoing
    crossings and the energy-integrated neutron flux.
  unit: m^-2.s^-1

- name: fast_neutron_flux_of_toroidal_field_coil
  description: |-
    Incident crossing rate of fast neutrons per unit area on the inboard-facing
    surface of a toroidal field coil.
  documentation: |-
    Incident crossing rate of fast neutrons per unit area on the inboard-facing
    surface of a toroidal field coil is the surface density of neutrons whose
    kinetic energy is at or above the fast-neutron threshold and whose
    trajectories cross that surface into the coil. The inboard-facing surface is
    the side of the toroidal field coil facing the toroidal symmetry axis.

    At a point on that surface, the defining angular-flux integral is:

    $$
    \Phi_\mathrm{fast}^{\mathrm{TF,in}}(\mathbf{x}) = \int_{E_\mathrm{fast}}^\infty \int_{4\pi} \varphi_n(\mathbf{x}, E, \hat{\Omega})\, \max\!\left(0, -\hat{\Omega}\!\cdot\!\hat{\mathbf{n}}_\mathrm{TF,in}(\mathbf{x})\right)\, d\Omega\, dE
    $$

    where $\Phi_\mathrm{fast}^{\mathrm{TF,in}}$ is the fast neutron flux of the
    toroidal field coil at surface point $\mathbf{x}$, $\mathbf{x}$ is a point
    on the inboard-facing surface, $E$ is neutron kinetic energy,
    $E_\mathrm{fast}$ is the fast-neutron threshold, $\hat{\Omega}$ is neutron
    flight direction, $\varphi_n$ is the angular neutron flux,
    $\hat{\mathbf{n}}_\mathrm{TF,in}$ is the unit normal directed outward from
    the coil material at the inboard-facing surface, and $d\Omega$ is the
    solid-angle element.

    The scope is limited to toroidal field coils and to their inboard-facing
    surfaces; it does not include correction coils, poloidal field coils, the
    outboard-facing surface, or a whole-coil combination of surfaces. The
    quantity is normalized by the receiving surface area and is not the
    area-integrated neutron rate, cumulative neutron fluence, total neutron
    production rate, or material response caused by the neutron field.

    The fast-neutron threshold is an essential part of the convention: neutrons
    below $E_\mathrm{fast}$ are excluded, and a different threshold defines a
    different fast-neutron flux. The analogous quantity for a correction coil is
    [fast neutron flux of correction
    coil](name:fast_neutron_flux_of_correction_coil); it uses the same incident
    fast-neutron crossing concept but a different coil population.
  unit: m^-2.s^-1

- name: force_of_poloidal_field_coil
  description: |-
    Force of a poloidal-field coil is the signed electromagnetic load obtained
    as a force-combination-matrix linear combination of the coil's radial and
    vertical Lorentz-force components in the right-handed cylindrical (R, φ, Z)
    frame, where R is major radius and Z is vertical height.
  documentation: |-
    Force of a poloidal-field coil is a signed scalar electromagnetic load on an
    individual poloidal-field coil. It is the Lorentz-force resultant selected
    by a force-combination matrix from the coil's radial and vertical force
    components in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The force-combination definition is

    $$
    F_{c\ell} = C_{\ell R} F_{R,c} + C_{\ell Z} F_{Z,c}
    $$

    where $F_{c\ell}$ is this force for coil $c$ and force-combination row
    $\ell$, $C_{\ell R}$ and $C_{\ell Z}$ are the radial and vertical
    coefficients of the force-combination matrix, $F_{R,c}$ is the [radial force
    of a poloidal-field coil](name:radial_force_of_poloidal_field_coil), and
    $F_{Z,c}$ is the [vertical force of a poloidal-field
    coil](name:vertical_force_of_poloidal_field_coil).

    The scope is one poloidal-field coil and one force-combination row; no
    summation over multiple coils is implied. This quantity is distinct from the
    radial and vertical component forces themselves, and it is not a magnetic
    field, current, torque, or structural stress.

    The [minimum force of a poloidal-field
    coil](name:minimum_force_of_poloidal_field_coil) and [maximum force of a
    poloidal-field coil](name:maximum_force_of_poloidal_field_coil) are lower
    and upper bounds on this same force-combination scalar.

    Sign convention: Positive when $C_{\ell R}F_{R,c}+C_{\ell Z}F_{Z,c}>0$ after
    taking $F_{R,c}$ positive outward toward increasing $R$ and $F_{Z,c}$
    positive upward toward increasing $Z$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  unit: N

- name: height_of_correction_coil
  description: |-
    Full non-negative extent of a rectangular correction-coil conductor
    cross-section measured along the local Frenet–Serret binormal.
  documentation: |-
    The correction-coil height is the full external-envelope dimension of its
    rectangular conductor cross-section along the binormal direction of the
    local Frenet–Serret frame $(\hat{\mathbf t}, \hat{\mathbf n}, \hat{\mathbf
    b})$. It is distinct from the transverse dimension measured along the local
    normal direction, defined by the [width of a correction
    coil](name:width_of_correction_coil).

    $$
    h = b_{\max} - b_{\min}
    $$

    where $h$ is the conductor height and $b_{\max}$ and $b_{\min}$ are the
    signed binormal coordinates of the opposing outer faces, consistent with the
    [binormal coordinate of a correction
    coil](name:binormal_coordinate_of_correction_coil). The quantity is the full
    extent, not a half-height, centerline offset, or cross-sectional area.
  unit: m

- name: height_of_iron_core_segment
  description: |-
    Height of an iron-core segment is the full, nonnegative vertical extent of
    its rectangular cross-section.
  documentation: |-
    Height of iron core segment

    The defining relation is

    $$
    h = Z_{\max} - Z_{\min}
    $$

    where $h$ is the height, and $Z_{\max}$ and $Z_{\min}$ are the vertical
    coordinates of the upper and lower edges of the rectangular cross-section.

    This quantity is a full dimension, not a half-height or a vertical position.
    It applies to one segment rather than the complete core. The [width of the
    iron-core segment](name:width_of_iron_core_segment) is the complementary
    full extent along the major-radius direction.
  unit: m

- name: height_of_passive_structure
  description: |-
    Full vertical extent of a rectangular cross-section of a passive conducting
    structure element, measured parallel to Z in the right-handed cylindrical
    (R, φ, Z) frame.
  documentation: |-
    The height is the full vertical extent of a rectangular cross-section of a
    passive conducting structure element, measured along the vertical direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame.

    It is defined by the difference between the upper and lower vertical
    coordinates:

    $$
    H = Z_{\max} - Z_{\min}
    $$

    where $H$ is the full height, and $Z_{\max}$ and $Z_{\min}$ are the vertical
    coordinates of the upper and lower cross-section boundaries, respectively.

    This quantity is the full height, not a half-height, local thickness, or
    horizontal width. Its corresponding horizontal dimension is the [full
    horizontal width of a passive conducting structure
    element](name:width_of_passive_structure).
  unit: m

- name: height_of_poloidal_field_coil
  description: |-
    Height of a poloidal field coil is the nonnegative full vertical extent of
    the rectangular conductor cross-section of an individual active coil
    element.
  documentation: |-
    Height of poloidal field coil

    The height is the difference between the upper and lower vertical boundary
    coordinates:

    $$
    h = Z_{\mathrm{upper}} - Z_{\mathrm{lower}}
    $$

    where $h$ is the full height, and $Z_{\mathrm{upper}}$ and
    $Z_{\mathrm{lower}}$ are the vertical coordinates of the upper and lower
    boundaries in the right-handed cylindrical $(R,\phi,Z)$ frame. Here, $R$ is
    major radius, $\phi$ is toroidal angle increasing counter-clockwise when
    viewed from above, and $Z$ is vertical height.

    This quantity applies to an individual active coil element's rectangular
    conductor cross-section; it is not an aggregate over elements or coils. It
    is the full dimension, not a half-height or the vertical position of the
    cross-section center, and is distinct from the radial cross-sectional extent
    represented by the [width of a poloidal field
    coil](name:width_of_poloidal_field_coil).

    For a rectangular cross-section, the height and width determine the [area of
    a poloidal field coil](name:area_of_poloidal_field_coil) as $A = wh$, where
    $A$ is the cross-sectional area, $w$ is the width, and $h$ is the height.
  unit: m

- name: height_of_toroidal_field_coil
  description: |-
    Full binormal extent of a rectangular toroidal-field-coil conductor
    cross-section, measured across its external envelope in the local
    Frenet–Serret frame.
  documentation: |-
    This quantity is the full dimension of a rectangular toroidal-field-coil
    conductor cross-section along the binormal direction of its local
    right-handed Frenet–Serret frame. The frame consists of tangent, normal, and
    binormal unit vectors, with the binormal perpendicular to the conductor
    centerline and the other two directions.

    For opposing cross-section boundaries, the full binormal height is defined
    by

    $$
    h_b = b_{\max} - b_{\min}
    $$

    where $b_{\max}$ and $b_{\min}$ are the extreme signed binormal coordinates
    of the external cross-section envelope. The coordinate convention is
    consistent with the [binormal coordinate of the toroidal field
    coil](name:binormal_coordinate_of_toroidal_field_coil), which describes
    individual outline vertices.

    This is a gross geometric envelope dimension; it is not the net
    current-carrying material thickness, insulation thickness, or a local signed
    coordinate.
  unit: m

- name: inner_radius_of_correction_coil
  description: |-
    Inner radius of a correction coil is the non-negative distance from the
    center of an annular non-axisymmetric correction-coil conductor
    cross-section to its inner circular boundary.
  documentation: |-
    Inner radius of a correction coil is the non-negative distance from the
    center of an annular non-axisymmetric correction-coil conductor or
    winding-pack cross-section to its inner circular boundary. It defines the
    bore size of the annular material region.

    This quantity applies only to correction-coil cross-sections whose geometry
    is annular. It is a local cross-sectional geometric distance for the
    conductor or winding pack, not an aggregation over multiple coils or turns.

    It is distinct from the correction-coil centerline position, from any
    major-radius coordinate of the coil in space, from the outer cross-sectional
    radius, and from the material cross-sectional area. It describes the inner
    hole boundary, not the amount of conductor material.

    For an annular correction-coil cross-section, this inner radius complements
    the corresponding correction-coil radius in specifying the radial bounds of
    the annulus. The [area of a correction coil](name:area_of_correction_coil)
    is a related cross-sectional quantity, but its definition is
    geometry-dependent and is not generally determined by this inner radius
    alone.
  unit: m

- name: inner_radius_of_ferritic_element
  description: |-
    Inner radial boundary of the annular cross-section of a ferritic element in
    the axisymmetric equivalent geometry, defining the bore of the annulus
    centered at a reference point in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    The inner radius specifies the internal boundary of the annular
    cross-section used to represent a ferritic element in the axisymmetric
    thick-line equivalent geometry. Ferritic elements are ferromagnetic inserts,
    and each element is represented by an axisymmetric body whose cross-section
    is an annulus centered at a reference point $(R_0, Z_0)$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius from the
    toroidal symmetry axis, $\phi$ is toroidal angle, $Z$ is vertical height,
    $R_0$ is the major-radius coordinate of the annulus center, and $Z_0$ is its
    vertical coordinate.

    For an annular cross-section with inner radius $r_\mathrm{in}$ and outer
    radius $r_\mathrm{out}$, the enclosed area is

    $$
    A = \pi\bigl(r_\mathrm{out}^2 - r_\mathrm{in}^2\bigr)
    $$

    where $A$ is the cross-sectional area, $r_\mathrm{in}$ is the inner radius,
    and $r_\mathrm{out}$ is the [outer radius of the ferritic
    element](name:outer_radius_of_ferritic_element); both radii are radial
    distances from the annulus center in the cross-section. The constraint is $0
    \leq r_\mathrm{in} < r_\mathrm{out}$.

    This quantity applies to a single ferritic element in the axisymmetric
    equivalent geometry and is not averaged or summed over multiple elements.
    Together with the [outer radius of the ferritic
    element](name:outer_radius_of_ferritic_element), it defines the annular
    cross-section; the [radial coordinate of the ferritic
    element](name:radial_coordinate_of_ferritic_element) specifies the
    major-radius placement of the element rather than its inner boundary.
  unit: m

- name: inner_radius_of_iron_core_segment
  description: |-
    Non-negative radial distance from the toroidal symmetry axis to the inner
    boundary of an annular iron-core segment. Together with the outer radius, it
    fixes the radial extent of the hollow cross section.
  documentation: |-
    The inner radius of an iron-core segment is the non-negative major-radius
    distance from the toroidal symmetry axis to the inner boundary of an annular
    iron region. It is expressed in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius and $Z$ is vertical height.

    For an annular cross-section, the inner radius $R_{\rm in}$ is the radial
    location of the inner boundary, and it is smaller than the corresponding
    outer radius $R_{\rm out}$:

    $$
    0 \le R_{\rm in} < R_{\rm out}
    $$

    The quantity specifies the hollow-bore boundary and radial extent, not the
    position along the toroidal direction, vertical height, boundary thickness,
    or local curvature of an arc. Unlike the curvature radius represented by
    radius of an iron-core segment, it is a radial boundary dimension. Together
    with the [outer radius of an iron-core
    segment](name:outer_radius_of_iron_core_segment), it defines the annular
    radial interval.
  unit: m

- name: inner_radius_of_poloidal_field_coil
  description: |-
    Bore-side radius of one poloidal-field-coil element's annular conductor
    cross-section, measured from the common center of its circular boundaries.
  documentation: |-
    The inner radius is the smaller of the two radii bounding the annular
    conductor cross-section of one poloidal-field-coil element. It extends from
    the common annulus center to the inner conducting boundary in a poloidal
    plane.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the inner
    radius $R_{\mathrm{in}}$ is defined by

    $$
    R_{\mathrm{in}} = \sqrt{(R_b-R_c)^2 + (Z_b-Z_c)^2}
    $$

    where $R_b$ and $Z_b$ are the coordinates of any point on the inner circular
    boundary, and $R_c$ and $Z_c$ are the coordinates of the annulus center, all
    evaluated at the same toroidal angle.

    Together with the [outer radius](name:outer_radius_of_poloidal_field_coil)
    and their common center, this radius specifies the annular cross-section of
    the individual element, not the combined geometry of all coil elements. The
    radii satisfy $0 \le R_{\mathrm{in}} < R_{\mathrm{out}}$, where
    $R_{\mathrm{out}}$ is the outer boundary radius. The inner radius is
    distinct from the major-radius coordinate of the annulus center. It equals
    the [circular-arc contour radius](name:radius_of_poloidal_field_coil) for an
    arc lying on this inner circular boundary.
  unit: m

- name: inner_radius_of_toroidal_field_coil
  description: |-
    Inner radius of a toroidal field coil is the bore-side radius of an annular
    conductor or winding-pack cross-section, measured from the geometric center
    of that cross-section to its inner boundary.
  documentation: |-
    Inner radius of a toroidal field coil is the non-negative radial distance in
    the local cross-sectional plane normal to the local conductor or
    winding-pack centerline, from the geometric center of an annular
    toroidal-field-coil cross-section to its bore-side inner boundary. It
    defines the bore size of the annular cross-section, not the spatial location
    of the coil.

    For an annular cross-section with circular inner and outer boundaries, the
    conducting or winding-pack cross-sectional area satisfies:

    $$
    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)
    $$

    where $A$ is the annular cross-sectional area in square meters,
    $r_\mathrm{inner}$ is this inner radius in meters, and $r_\mathrm{outer}$ is
    the corresponding outer radius in meters.

    The quantity is defined for hollow annular conductor or winding-pack
    cross-sections and obeys $0 \le r_\mathrm{inner} < r_\mathrm{outer}$; the
    limiting value $r_\mathrm{inner}=0$ represents a solid circular
    cross-section treated as an annulus with no bore. It is the inner-boundary
    member of the toroidal-field-coil cross-section radius family:
    outer_radius_of_toroidal_field_coil gives the outer boundary, while
    radius_of_toroidal_field_coil denotes a generic non-negative cross-section
    radius not tied specifically to the bore-side boundary.
  unit: m

- name: length_of_passive_loop_element
  description: |-
    Geometric length of either inclined side of the oblique cross-section of a
    passive loop element, including its major and minor sides.
  documentation: |-
    This quantity is the geometric side length of an oblique or parallelogram
    cross-section belonging to a passive loop element. It describes the side
    itself rather than an electrical or material property.

    For side endpoints with position vectors $\mathbf{r}_1$ and $\mathbf{r}_2$
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, the
    length $\ell$ is defined by

    $$
    \ell = \|\mathbf{r}_2 - \mathbf{r}_1\|
    $$

    where $\ell$ is the side length, and $\mathbf{r}_1$ and $\mathbf{r}_2$ are
    the endpoint position vectors.

    The scope includes both side orientations of the passive loop element's
    oblique cross-section: the major-side instance [major length of a passive
    loop element](name:major_length_of_passive_loop_element) and the minor-side
    instance [minor length of a passive loop
    element](name:minor_length_of_passive_loop_element). It excludes the
    cross-section thickness measured perpendicular to the element's central
    segment, represented separately by [thickness of a passive loop
    element](name:thickness_of_passive_loop_element). The length is nonnegative
    and is independent of which side orientation is selected.
  unit: m

- name: major_length_of_ferritic_element
  description: |-
    Euclidean length of the alpha-side of a ferritic element’s oblique
    parallelogram cross-section, measured in the poloidal plane of the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the non-negative Euclidean length of the alpha-side, the
    designated inclined edge of a ferritic element’s oblique parallelogram
    cross-section. It is the alpha-side-specific component of length of a
    ferritic element, rather than the length of an unspecified cross-sectional
    edge.

    For endpoints $(R_1,Z_1)$ and $(R_2,Z_2)$ of the alpha-side in the poloidal
    plane,

    $$
    L_\alpha = \sqrt{(R_2-R_1)^2+(Z_2-Z_1)^2}
    $$

    where $R_i$ are major-radius coordinates and $Z_i$ are vertical coordinates,
    both in meters, in the right-handed cylindrical $(R,\phi,Z)$ frame. The
    toroidal coordinate is fixed for this poloidal cross-sectional length. The
    quantity is a magnitude and is therefore non-negative.
  unit: m

- name: major_length_of_iron_core_segment
  description: |-
    Euclidean length of the alpha-side of an iron-core segment’s oblique
    parallelogram cross-section in a constant-toroidal-angle poloidal plane of
    the right-handed cylindrical (R, φ, Z) frame. The side is inclined relative
    to the major-radius direction and the value is a non-negative distance.
  documentation: |-
    Euclidean length of the alpha-side of an iron-core segment’s oblique
    parallelogram cross-section is the non-negative distance between the two
    endpoints of that designated side. The edge lies in a constant-$\phi$
    poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height;
    its inclination is specified by
    [alpha_angle_of_iron_core_segment](name:alpha_angle_of_iron_core_segment).

    For endpoints 1 and 2 of the designated alpha-side, the length is

    $$
    L_\alpha = \sqrt{(R_2 - R_1)^2 + (Z_2 - Z_1)^2}
    $$

    where $L_\alpha$ is this alpha-side length, and $R_i$ and $Z_i$ are the
    major-radius and vertical coordinates of endpoint $i$.

    The quantity is the alpha-side specialization of
    [length_of_iron_core_segment](name:minor_length_of_iron_core_segment). It
    excludes the other parallelogram side, the full cross-sectional extent, and
    [height_of_iron_core_segment](name:height_of_iron_core_segment), which
    denotes a different iron-core segment dimension. Because it is a Euclidean
    length, it is not a signed orientation, coordinate displacement, or vector
    projection.
  unit: m

- name: major_length_of_passive_loop_element
  description: |-
    Geometric length of the alpha-inclined major side of a parallelogram-shaped
    cross-section belonging to a passive conductor element.
  documentation: |-
    The alpha-inclined side length is the geometric length of a
    parallelogram-shaped cross-section of a passive conductor element.

    For the two endpoints of the alpha side, the length is defined by

    $$
    \ell_{\alpha} = \left\|\mathbf{r}_{\alpha,2} - \mathbf{r}_{\alpha,1}\right\|
    $$

    where $\ell_{\alpha}$ is the alpha-side length, $\mathbf{r}_{\alpha,1}$ and
    $\mathbf{r}_{\alpha,2}$ are the position vectors of its endpoints, and
    $\|\cdot\|$ is the Euclidean norm. The side is inclined at angle $\alpha$ to
    the outward major-radius direction $\hat{R}$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    This quantity applies to one passive conductor element and selects its
    alpha-inclined, major side; it is not an electrical or material property and
    is not aggregated over sides or elements. The parent [length of passive loop
    element](name:length_of_passive_loop_element) denotes the corresponding
    inclined-side length without selecting one side, while [minor length of
    passive loop element](name:minor_length_of_passive_loop_element) describes
    the complementary beta-inclined side.
  unit: m

- name: maximum_force_of_poloidal_field_coil
  description: |-
    Upper allowable value of a signed electromagnetic force resultant for a
    poloidal-field coil, with magnitude and sign defined by one
    force-combination-matrix row.
  documentation: |-
    Maximum force of a poloidal-field coil is the upper allowable value of a
    signed electromagnetic force resultant acting on the coil. It bounds the
    resultant derived from radial and vertical Lorentz-force components and is
    distinct from the actual [force of a poloidal-field
    coil](name:force_of_poloidal_field_coil).

    For matrix row $m$, the associated force resultant is defined by

    $$
    F_m = a_m F_R + b_m F_Z
    $$

    where $F_R$ is the [radial force of a poloidal-field
    coil](name:radial_force_of_poloidal_field_coil), $F_Z$ is the [vertical
    force of a poloidal-field coil](name:vertical_force_of_poloidal_field_coil),
    and $a_m$ and $b_m$ are the row-specific force-combination weights. The
    maximum-force quantity is the upper allowable value assigned to the selected
    resultant; it is not a separate Lorentz-force component.

    Sign convention: Positive when the weighted combination of outward radial
    force and upward vertical force, resolved in the right-handed cylindrical
    $(R, \phi, Z)$ frame, is positive.
  unit: N

- name: minimum_force_of_poloidal_field_coil
  description: |-
    Lower allowable value of a signed electromagnetic force resultant for
    poloidal-field coils, with its magnitude and sign defined by one row of the
    force-combination matrix.
  documentation: |-
    Minimum force of a poloidal-field coil is the lower allowable value of a
    signed electromagnetic force resultant acting on the poloidal-field coil
    system. Each row of the force-combination matrix defines one resultant by
    weighting the radial and vertical components of the [force of a
    poloidal-field coil](name:force_of_poloidal_field_coil).

    For combination row $k$, the resultant is defined by

    $$
    F_{\mathrm{comb},k}=w_{kR}F_R+w_{kZ}F_Z
    $$

    where $F_R$ and $F_Z$ are the radial and vertical electromagnetic-force
    components, $w_{kR}$ and $w_{kZ}$ are the row weights, and $k$ identifies
    the combination row. The minimum value satisfies $F_{\min,k}\leq
    F_{\mathrm{comb},k}$ for the applicable row. Unlike the [maximum force of a
    poloidal-field coil](name:maximum_force_of_poloidal_field_coil), this
    quantity specifies the lower structural bound rather than the upper bound.

    Sign convention: Positive when the vertical force component is directed
    upward along $+Z$ and the radial force component is directed outward along
    increasing major radius $R$.
  unit: N

- name: minor_length_of_iron_core_segment
  description: |-
    Minor length of an iron-core segment is the non-negative Euclidean length of
    the beta-side of the segment's oblique poloidal cross-section in the
    right-handed cylindrical (R, φ, Z) frame. The beta-side is inclined with
    respect to the height axis Z and defines the segment's extent along that
    side.
  documentation: |-
    Minor length of an iron-core segment is the non-negative Euclidean length of
    the $\beta$-side of the segment's oblique poloidal cross-section in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. The $\beta$-side is
    the side whose direction in that poloidal cross-section is inclined by the
    angle $\beta$ with respect to the height axis $Z$.

    This quantity applies to the geometric cross-section of one iron-core
    segment. Its aggregation convention is none: it is a single side length for
    the specified segment. It is not the toroidal extent, material volume, or
    any magnetic property of the iron core.

    It is the $\beta$-side counterpart of the [major length of an iron-core
    segment](name:major_length_of_iron_core_segment), which refers to the other
    oblique side length. Together with the corresponding inclination angles,
    these side lengths define the size of the segment's oblique poloidal
    cross-section.
  unit: m

- name: minor_length_of_passive_loop_element
  description: |-
    Length of the minor, beta-inclined side of a parallelogram-shaped
    cross-section in a passive conductor element.
  documentation: |-
    The beta-inclined side length is the geometric length of a
    parallelogram-shaped cross-section of a passive conductor element.

    For the endpoints of the beta side, the length is defined by

    $$
    \ell_{\beta} = \left\|\mathbf{r}_{\beta,2} - \mathbf{r}_{\beta,1}\right\|
    $$

    where $\ell_{\beta}$ is the beta-side length, $\mathbf{r}_{\beta,1}$ and
    $\mathbf{r}_{\beta,2}$ are the position vectors of its two endpoints, and
    the norm is the Euclidean distance between those endpoints.

    This quantity applies to one passive-loop conductor element and to its
    minor, beta-inclined side only; it is not an aggregate over multiple
    elements, the alpha-inclined major side, or the cross-sectional thickness.
    The beta-side convention identifies this dimension as the minor counterpart
    of the alpha-side dimension.

    It is the minor-side component of the broader [length of a passive loop
    element](name:length_of_passive_loop_element), which covers either inclined
    side. The corresponding major-side quantity is the [major length of a
    passive loop element](name:major_length_of_passive_loop_element); the two
    side lengths describe distinct directions of the same oblique cross-section.
  unit: m

- name: normal_coordinate_of_correction_coil
  description: |-
    Signed coordinate of a correction-coil conductor cross-section outline
    vertex along the normal axis of the local Frenet-Serret frame, measured from
    the conductor centerline.
  documentation: |-
    Signed coordinate of a correction-coil conductor cross-section outline
    vertex along the normal axis of the local Frenet-Serret frame, measured from
    the conductor centerline, is the scalar projection of the displacement from
    the centerline point to that vertex onto the local normal direction. The
    local frame is the right-handed Frenet-Serret frame $(\hat{\mathbf{t}},
    \hat{\mathbf{n}}, \hat{\mathbf{b}})$ attached to the correction-coil
    conductor centerline, with $\hat{\mathbf{b}} = \hat{\mathbf{t}} \times
    \hat{\mathbf{n}}$.

    The coordinate is defined by

    $$
    q_n = \left(\mathbf{x}_v - \mathbf{x}_c(s)\right) \cdot \hat{\mathbf{n}}(s)
    $$

    where $q_n$ is the signed normal coordinate of the outline vertex,
    $\mathbf{x}_v$ is the position vector of the outline vertex,
    $\mathbf{x}_c(s)$ is the position vector of the conductor centerline at
    centerline parameter $s$, $s$ identifies the corresponding location along
    the conductor centerline, and $\hat{\mathbf{n}}(s)$ is the normal basis
    vector of the local Frenet-Serret frame.

    The scope is the local cross-sectional boundary of a correction-coil
    conductor; each value refers to one outline vertex at one centerline
    location and describes only its normal-axis displacement in the local
    $(\hat{\mathbf{n}}, \hat{\mathbf{b}})$ cross-section plane. It excludes the
    binormal coordinate, any coordinate of the conductor centerline itself, and
    any projection along a magnetic-flux-surface normal.

    The paired [binormal coordinate of a correction
    coil](name:binormal_coordinate_of_correction_coil) gives the complementary
    component of the same outline vertex in the local $(\hat{\mathbf{n}},
    \hat{\mathbf{b}})$ cross-section plane. Together, the paired outline
    coordinates define the boundary whose enclosed [cross-sectional area of the
    correction coil](name:area_of_correction_coil) is a related geometric
    property. The [normal coordinate of a toroidal-field
    coil](name:normal_coordinate_of_toroidal_field_coil) has the same
    local-coordinate meaning for a different coil class.

    Sign convention: Positive when the displacement from the correction-coil
    conductor centerline to the outline vertex has a component in the
    $+\hat{\mathbf{n}}$ direction of the local Frenet-Serret frame.
  unit: m

- name: normal_coordinate_of_toroidal_field_coil
  description: |-
    Signed coordinate of each toroidal-field-coil conductor cross-section
    outline vertex along the local Frenet–Serret normal, perpendicular to the
    conductor centerline and binormal directions.
  documentation: |-
    The normal coordinate is the signed location of a toroidal-field-coil
    conductor cross-section outline vertex along the local Frenet–Serret normal.
    The cross-section lies in the plane perpendicular to the conductor
    centerline, so this coordinate resolves displacement along one local
    transverse direction.

    For a vertex at centerline position $s$, the defining relation is:

    $$
    x_n(s) = \left[\mathbf{r}_v - \mathbf{r}_c(s)\right] \cdot \hat{\mathbf{n}}(s)
    $$

    where $x_n$ is the normal coordinate in m, $s$ is centerline arc length in
    m, $\mathbf{r}_v$ and $\mathbf{r}_c(s)$ are the vertex and centerline
    position vectors in m, and $\hat{\mathbf{n}}(s)$ is the local Frenet–Serret
    normal unit vector.

    Together with the [binormal coordinate of the toroidal field
    coil](name:binormal_coordinate_of_toroidal_field_coil), this coordinate
    specifies the conductor outline in the local cross-sectional plane. It is
    distinct from a radial coordinate in the right-handed cylindrical $(R, \phi,
    Z)$ frame and has the same geometric role as the [normal coordinate of the
    correction coil](name:normal_coordinate_of_correction_coil).

    Sign convention: Positive when the vertex displacement has a positive
    projection onto the local Frenet–Serret normal unit vector
    $\hat{\mathbf{n}}(s)$.
  unit: m

- name: outer_radius_of_ferritic_element
  description: |-
    Outer radial boundary of the annular cross-section of a ferritic element in
    the axisymmetric equivalent geometry, defining the external extent of the
    annulus centered at a reference point in the right-handed cylindrical (R, φ,
    Z) frame.
  documentation: |-
    The outer radius specifies the external boundary of the annular
    cross-section used to represent a ferritic element in the axisymmetric
    thick-line equivalent geometry. Ferritic elements are ferromagnetic inserts,
    and each element is represented by an axisymmetric body whose cross-section
    is an annulus centered at a reference point $(R_0, Z_0)$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius from the
    toroidal symmetry axis and $Z$ is vertical height.

    For an annular cross-section with inner radius $r_\mathrm{in}$ and outer
    radius $r_\mathrm{out}$, the enclosed area is

    $$
    A = \pi\bigl(r_\mathrm{out}^2 - r_\mathrm{in}^2\bigr)
    $$

    where $A$ is the cross-sectional area and $r_\mathrm{in}$ and
    $r_\mathrm{out}$ are radial distances from the annulus center. The
    constraint is $0 \leq r_\mathrm{in} < r_\mathrm{out}$. Together with [inner
    radius of the ferritic element](name:inner_radius_of_ferritic_element), this
    quantity defines the annular cross-section; [radius of the ferritic
    element](name:radial_coordinate_of_ferritic_element_centroid) specifies its
    radial placement rather than its outer boundary.
  unit: m

- name: outer_radius_of_iron_core_segment
  description: |-
    Radius of an iron-core segment is the non-negative geometry radius used to
    define its outer boundary in the poloidal cross-section of the right-handed
    cylindrical (R, φ, Z) frame about the toroidal symmetry axis.
  documentation: |-
    Radius of an iron-core segment is the non-negative geometry radius that
    defines the outer boundary of an annular iron-core region. This member
    specializes radius of an iron-core segment to the outermost boundary
    measured from the toroidal symmetry axis. The relevant cross-section is the
    plane spanned by $R$ and $Z$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius measured from the toroidal symmetry axis
    and $Z$ is vertical height.

    The outer radius is the maximum major-radius coordinate on the
    cross-sectional boundary:

    $$
    r_{\rm out} = \max_{(R,Z)\in\partial A} R
    $$

    where $r_{\rm out}$ is the outer radius, $A$ is the iron-core
    cross-sectional region, and $\partial A$ is its boundary; $R$, $Z$, and
    $r_{\rm out}$ are expressed in meters.

    For annular geometry, the outer radius together with the [inner radius of an
    iron-core segment](name:inner_radius_of_iron_core_segment) determines the
    radial thickness through $r_{\rm out}-r_{\rm in}$. It is an axis-referenced
    outer extent, not the radius of a local circular arc about an explicit
    off-axis center or the full rectangular extent described by the [width of an
    iron-core segment](name:width_of_iron_core_segment).
  unit: m

- name: outer_radius_of_poloidal_field_coil
  description: |-
    Nonnegative distance from the annulus center to the outer conducting
    boundary of a poloidal field coil's annular conductor cross-section.
  documentation: |-
    The outer [radius](name:radius) is the larger of the two radii bounding the
    annular conductor cross-section of one poloidal field coil. It extends from
    the common annulus center to the outer conducting boundary.

    The outer radius is defined by

    $$
    R_{\mathrm{out}} = \left\|\mathbf{x}_{\mathrm{b}}-\mathbf{x}_{\mathrm{c}}\right\|
    $$

    where $R_{\mathrm{out}}$ is the outer radius, $\mathbf{x}_{\mathrm{b}}$ is
    the position of any point on the outer conducting boundary,
    $\mathbf{x}_{\mathrm{c}}$ is the annulus-center position, and $\|\cdot\|$
    denotes Euclidean distance within the cross-sectional plane.

    The [inner radius](name:inner_radius_of_poloidal_field_coil) bounds the
    central aperture. Together, the inner radius, outer radius, and center
    position specify the annulus geometry. For a nondegenerate conducting
    annulus, $0 \leq R_{\mathrm{in}} < R_{\mathrm{out}}$, where
    $R_{\mathrm{in}}$ is the inner radius.

    This quantity describes one annular cross-section, not the coil's distance
    from the machine symmetry axis. It is distinct from the [circular-segment
    curvature radius](name:radius_of_poloidal_field_coil), which describes an
    arc of the coil cross-sectional contour.
  unit: m

- name: plasma_filament_width
  description: |-
    Full horizontal extent of the rectangular cross-section of a discrete plasma
    current-carrying filament element, measured along the major-radius direction
    in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Full horizontal extent of the rectangular cross-section of a discrete plasma
    current-carrying filament element, measured along the major-radius direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It is the side length
    of the idealized rectangular filament cross-section parallel to the $R$
    coordinate, where $R$ is major radius and $Z$ is vertical height.

    For a rectangular cross-section bounded by minimum and maximum major-radius
    coordinates, the width $w$ is defined by:

    $$
    w = R_{\max} - R_{\min}
    $$

    where $R_{\min}$ and $R_{\max}$ are the lower and upper major-radius
    coordinates of the rectangle boundary.

    This quantity is a non-negative geometric extent: $w \ge 0$ and $R_{\max}
    \ge R_{\min}$ are part of the definition. It is not a signed displacement, a
    coordinate position, or the [current](name:current_of_plasma_filament)
    assigned to the filament; it is distinct from the
    [height](name:height_of_plasma_filament), the vertical extent along $Z$, and
    from the thickness, a separate filament cross-section extent.
  unit: m

- name: radial_force_of_poloidal_field_coil
  description: |-
    Signed radial component of the net electromagnetic Lorentz force on an
    individual poloidal-field coil, resolved along increasing major radius.
  documentation: |-
    The quantity is the net electromagnetic force on an individual
    poloidal-field coil projected onto the radial direction. It describes the
    resultant coil load, not the local electromagnetic body-force density.

    The radial force is defined by

    $$
    F_R = \int_{V_\mathrm{coil}} (\mathbf{J} \times \mathbf{B}) \cdot \hat{\mathbf{R}}\,dV
    $$

    where $V_\mathrm{coil}$ is the conductor volume, $\mathbf{J}$ is the
    current-density vector, $\mathbf{B}$ is the magnetic-field vector,
    $\hat{\mathbf{R}}$ is the radial unit vector, and $dV$ is the volume
    element. The radial and vertical components together determine the
    [electromagnetic force of a poloidal-field
    coil](name:force_of_poloidal_field_coil); the corresponding vertical
    component is given by the [vertical force of a poloidal-field
    coil](name:vertical_force_of_poloidal_field_coil). It is distinct from
    [radial volumetric force](name:radial_volumetric_force), which is a local
    force density rather than a net force.

    Sign convention: Positive when the force points toward increasing major
    radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: N

- name: radial_magnetic_field_at_ferritic_element_centroid
  description: |-
    Radial magnetic-field component at the geometric centroid of a ferritic
    element, projected onto the outward major-radius direction in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the magnetic-field component evaluated at a ferritic
    element’s geometric centroid and projected along the cylindrical
    major-radius direction. It describes the applied magnetic field, not the
    ferritic element’s magnetization.

    The radial component is defined by

    $$
    B_R = \mathbf{B} \cdot \hat{R}
    $$

    where $\mathbf{B}$ is the magnetic-field vector and $\hat{R}$ is the outward
    major-radius unit vector in the right-handed cylindrical $(R, \phi, Z)$
    frame. The evaluation point is the ferritic-element centroid; its radial
    location is given by the [radial coordinate of the ferritic element
    centroid](name:radial_coordinate_of_ferritic_element_centroid). Together
    with the [vertical magnetic field at the ferritic element
    centroid](name:vertical_magnetic_field_at_ferritic_element_centroid) and
    [toroidal magnetic field at the ferritic element
    centroid](name:toroidal_magnetic_field_at_ferritic_element_centroid), it
    specifies the local field vector.

    Sign convention: Positive when $B_R$ points toward increasing major radius
    $R$.
  unit: T

- name: radial_magnetization_of_ferritic_element
  description: |-
    Signed radial component of the effective magnetization vector assigned to a
    ferritic element in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Radial magnetization of a ferritic element is the projection of its
    effective magnetization vector onto the cylindrical major-radius direction.
    It describes the element's magnetization, not the radial component of the
    surrounding magnetic field.

    $$
    M_R = \mathbf{M} \cdot \hat{R}
    $$

    where $M_R$ is the radial magnetization, $\mathbf{M}$ is the effective
    magnetization vector assigned to the ferritic element, and $\hat{R}$ is the
    outward radial unit vector in the right-handed cylindrical $(R, \phi, Z)$
    frame. The [vertical magnetization of the ferritic
    element](name:vertical_magnetization_of_ferritic_element) and [toroidal
    magnetization of the ferritic
    element](name:toroidal_magnetization_of_ferritic_element) are the
    corresponding projections onto the other cylindrical directions. This
    quantity is distinct from the [radial magnetic field at the ferritic element
    centroid](name:radial_magnetic_field_at_ferritic_element_centroid), which
    describes magnetic flux density rather than magnetization.

    Sign convention: Positive when the effective magnetization points toward
    increasing major radius $R$.
  unit: A.m^-2

- name: radial_outline_of_ferritic_element
  description: |-
    Non-negative major-radius coordinate of a point on a ferritic element
    outline in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Non-negative major-radius coordinate $R$ of a point on a ferritic element
    outline in the right-handed cylindrical $(R, \phi, Z)$ frame is the distance
    of that point from the toroidal symmetry axis. It specializes the [radial
    coordinate](name:radial_coordinate) to ferritic-element outline points and
    is paired with the vertical outline coordinate for the same outline point.

    The major radius is equivalently the norm of the horizontal Cartesian
    position vector:

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are horizontal Cartesian coordinate components in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, with $\hat{z}$
    parallel to the vertical direction $\hat{Z}$.

    This coordinate denotes an outline-point location and is not a signed radial
    displacement, aggregate radial size, centroid position, or maximum radial
    boundary coordinate. The aggregate radial size is represented by [width of
    ferritic element](name:width_of_ferritic_element), the centroid position by
    [radial coordinate of ferritic element
    centroid](name:radial_coordinate_of_ferritic_element_centroid), and the
    maximum radial boundary coordinate by [outer radius of ferritic
    element](name:outer_radius_of_ferritic_element).
  unit: m

- name: radial_outline_of_passive_loop_element
  description: |-
    Radial outline of a passive-loop element is the major-radius coordinate of
    each point on the irregular cross-sectional outline of a passive-loop
    conductor element in the right-handed cylindrical (R, φ, Z) frame, where R
    is measured from the machine symmetry axis and Z is vertical height.
  documentation: |-
    Radial outline of a passive-loop element is the major-radius coordinate $R$
    of a point on the irregular cross-sectional boundary contour of a
    passive-loop conductor element. It is expressed in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is the major-radius coordinate
    measured from the machine symmetry axis, $\phi$ is the toroidal angle
    increasing counterclockwise when viewed from above, and $Z$ is the vertical
    coordinate.

    The scope is the boundary contour of the passive-loop conductor element,
    evaluated pointwise over the outline rather than as an aggregate over the
    element. Because $R$ is a distance from the symmetry axis, it is
    non-negative. This quantity is not a radial thickness, a contour length, or
    the radial coordinate of a passive-loop element, which denotes a
    representative radial location of the element rather than an outline point.

    Together with the vertical outline of a passive-loop element, it defines the
    $(R,Z)$ position of the same passive-loop boundary contour in a poloidal
    cross-section: this quantity supplies $R$, while the vertical outline
    supplies $Z$ for the corresponding outline point.
  unit: m

- name: radius_of_coil_conductor_element
  description: |-
    Curvature radius of a circular arc defining an active poloidal-field coil's
    cross-sectional contour, evaluated at the coil conductor element.
  documentation: |-
    This radius specifies the bending of an individual circular arc defining the
    cross-sectional contour of an active poloidal-field coil, evaluated at the
    coil conductor element.

    The defining relation is

    $$
    R = \frac{1}{\kappa}
    $$

    where $R$ is the arc's curvature radius and $\kappa$ is the magnitude of its
    planar curvature.

    The radius is constant along each circular arc and applies separately to
    that arc, rather than representing an average over the contour. It describes
    cross-sectional boundary curvature, not the curvature of the conductor path
    around the device.

    Each arc begins at a contour point and ends at the starting point of the
    next arc. The [radial outline of the poloidal-field
    coil](name:radial_outline_of_poloidal_field_coil) gives the major-radius
    coordinates of these contour points; those coordinates locate the boundary
    relative to the toroidal symmetry axis and are distinct from the arc
    curvature radius.
  unit: m

- name: radius_of_passive_loop
  description: |-
    Radius of the annular cross-section of a passive conducting loop element is
    the Euclidean distance from the cross-section center to a specified
    conducting boundary. It is nonnegative and does not denote the loop center's
    major-radius position.
  documentation: "Radius of the annular cross-section of a passive conducting loop element is\nthe Euclidean distance, in the $(R,Z)$ plane at fixed toroidal angle $\x7Fphi$\nof the right-handed cylindrical $(R, \x7Fphi, Z)$ frame, from the center of the\nannular conductor cross-section to a specified conducting boundary of that\nannulus. Here $R$ is major radius and $Z$ is vertical height.\n\nThe boundary radius is defined by the poloidal-plane distance from the\ncross-section center to the selected boundary point:\n\n$$\nr = \\sqrt{(R_b - R_c)^2 + (Z_b - Z_c)^2}\n$$\n\nwhere $(R_c,Z_c)$ is the center position of the annular cross-section and\n$(R_b,Z_b)$ is the selected boundary position in the same fixed-$\x7Fphi$\nplane; all coordinate components in the equation are expressed in meters.\n\nThis parent quantity abstracts over\n[inner_radius_of_passive_loop](name:inner_radius_of_passive_loop) and\n[outer_radius_of_passive_loop](name:outer_radius_of_passive_loop). It\nsatisfies $r \\ge 0$ and is a size of the conductor cross-section, not a\nsigned component along $\\hat{R}$, $\\hat{\\phi}$, or $\\hat{Z}$ and not the\nmajor-radius coordinate of the loop center. For a circular annulus,\n[area_of_passive_loop](name:area_of_passive_loop) is related by\n$A=\\pi(r_\\mathrm{outer}^2-r_\\mathrm{inner}^2)$, and\nthickness_of_passive_loop is $r_\\mathrm{outer}-r_\\mathrm{inner}$."
  unit: m

- name: inner_radius_of_passive_loop
  description: |-
    Inner radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance from the cross-section center to its inner
    conducting boundary. It is nonnegative.
  documentation: |-
    Inner radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance, in the $(R,Z)$ plane at fixed toroidal
    angle $phi$ of the right-handed cylindrical $(R,phi,Z)$ frame, from the
    center of the annular conductor cross-section to its inner conducting
    boundary. Here $R$ is major radius and $Z$ is vertical height.

    The inner boundary radius is defined by the poloidal-plane distance from the
    cross-section center to the selected inner-boundary point:

    $$
    r_\mathrm{inner} = \sqrt{(R_i - R_c)^2 + (Z_i - Z_c)^2}
    $$

    where $(R_c,Z_c)$ is the annular cross-section center and $(R_i,Z_i)$ is the
    inner-boundary position in the same fixed-$\phi$ plane; all coordinate
    components in the equation are expressed in meters.

    This quantity specializes
    [radius_of_passive_loop](name:radius_of_passive_loop) to the inner
    conducting boundary and complements
    [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop). For a
    circular annulus, the conductor thickness is the outer radius minus this
    inner radius, and [area_of_passive_loop](name:area_of_passive_loop) is
    determined by the difference of the squared outer and inner radii. It is a
    cross-sectional size, not the loop center's major-radius coordinate or a
    signed cylindrical component.
  unit: m

- name: outer_radius_of_passive_loop
  description: |-
    Outer radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance from the cross-section center to its outer
    conducting boundary.
  documentation: |-
    Outer radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance, in the $(R,Z)$ plane at fixed toroidal
    angle $phi$ of the right-handed cylindrical $(R, phi, Z)$ frame, from the
    center of the annular conductor cross-section to its outer conducting
    boundary. Here $R$ is major radius and $Z$ is vertical height.

    The outer boundary radius is defined by the poloidal-plane distance from the
    cross-section center to the selected outer-boundary point:

    $$
    r_\mathrm{outer} = \sqrt{(R_\mathrm{outer} - R_c)^2 + (Z_\mathrm{outer} - Z_c)^2}
    $$

    where $(R_c,Z_c)$ is the annulus-center position and
    $(R_\mathrm{outer},Z_\mathrm{outer})$ is the outer-boundary position in the
    same fixed-$\phi$ plane; all coordinate components in the equation are
    measured in meters.

    This quantity is the outer member of the [radius of a passive
    loop](name:radius_of_passive_loop) family. Together with the [inner radius
    of a passive loop](name:inner_radius_of_passive_loop), it defines the
    conducting annulus; for a circular annulus, the cross-sectional area is
    $A=\pi(r_\mathrm{outer}^2-r_\mathrm{inner}^2)$ and the radial thickness is
    $r_\mathrm{outer}-r_\mathrm{inner}$. It is nonnegative and is not the loop
    center's major-radius coordinate or a signed cylindrical component.
  unit: m

- name: resistance_of_passive_loop
  description: |-
    Ohmic resistance of one passive conducting loop, relating its induced
    current to the resistive voltage drop and determining dissipation during
    electromagnetic transients.
  documentation: |-
    The electrical resistance of a passive conducting loop is the
    proportionality between its current and the voltage drop caused by ohmic
    dissipation. It represents irreversible conversion of electrical energy into
    heat in the conducting path.

    $$
    V_R = R_{\rm loop} I_{\rm loop}
    $$

    where $V_R$ is the resistive voltage drop in volts, $I_{\rm loop}$ is the
    loop current in amperes, and $R_{\rm loop}$ is the resistance in ohms. For a
    uniform conductor, the resistance is governed by $R_{\rm loop}=\rho\ell/A$,
    where $\rho$ is electrical resistivity, $\ell$ is conductor length, and $A$
    is cross-sectional area. The current is the [current of a passive
    loop](name:current_of_passive_loop). This quantity excludes inductive
    voltage and describes only the ohmic contribution; together with the loop
    self-inductance, it determines the resistive electromagnetic decay
    timescale. It is the loop-level counterpart of the [resistance of a vacuum
    vessel](name:resistance_of_vacuum_vessel) and depends on the conductor
    material described by its [resistivity](name:resistivity_of_wall_material).
  unit: ohm

- name: resistance_of_poloidal_field_coil
  description: |-
    Ohmic resistance of an individual poloidal-field coil winding, relating its
    resistive voltage drop to current and determining Joule dissipation.
  documentation: |-
    The ohmic resistance characterizes the opposition to electrical current in
    an individual poloidal-field coil winding and the associated conversion of
    electrical energy into heat.

    For coil current $I$ and resistive voltage drop $V_R$, the resistance is
    defined by

    $$
    V_R = R I
    $$

    where $R$ is the ohmic resistance, $I$ is the signed winding current in
    amperes, and $V_R$ is the resistive voltage drop in volts.

    This quantity excludes inductive back-EMF and other transient voltage
    contributions represented by the [voltage of the poloidal field
    coil](name:voltage_of_poloidal_field_coil). Its value may depend on the
    conductor state, including the [temperature of the poloidal field
    coil](name:temperature_of_coil_conductor), and is conceptually analogous to
    the [resistance of the toroidal field
    coil](name:resistance_of_toroidal_field_coil).
  unit: ohm

- name: external_resistance_of_poloidal_field_coil
  description: |-
    Additional externally introduced resistance in a poloidal-field coil
    circuit, varying with time and added to the winding resistance to form the
    effective coil resistance.
  documentation: |-
    This quantity is the additional lumped ohmic resistance introduced
    externally in the circuit of an individual poloidal-field coil. It
    represents resistance from added circuit elements such as dynamically
    switchable resistors, rather than the coil winding itself.

    At a given time, the effective coil resistance is defined by

    $$
    R_{\mathrm{eff}} = R_{\mathrm{winding}} + R_{\mathrm{ext}}
    $$

    where $R_{\mathrm{eff}}$ is the total effective resistance of the coil
    circuit, $R_{\mathrm{winding}}$ is the static winding resistance represented
    by [resistance of a poloidal-field
    coil](name:resistance_of_poloidal_field_coil), and $R_{\mathrm{ext}}$ is
    this additional external resistance.

    The quantity applies to one poloidal-field coil and is a scalar lumped
    circuit property that may vary as the externally added resistance changes.
    It excludes the static winding resistance itself and does not denote an
    unrelated power-supply or Thevenin resistance. Its additive relationship to
    [resistance of a poloidal-field
    coil](name:resistance_of_poloidal_field_coil) distinguishes it from the
    baseline winding resistance; together they determine the coil circuit's
    effective ohmic opposition and resistive voltage drop.
  unit: ohm

- name: temperature_of_coil_conductor
  description: |-
    Thermodynamic temperature of the conductor in an active poloidal-field or
    central-solenoid coil, used to establish its allowable current limit.
  documentation: |-
    This quantity is the thermodynamic temperature of the conducting material in
    an individual active poloidal-field coil, including central-solenoid and
    shaping-coil conductors.

    It applies to the conductor of one active coil and represents the coil's
    thermal state, not the temperature of a coolant, surrounding structure, or
    plasma. It is not an aggregate temperature over multiple coils and is
    distinct from electrical properties such as the [resistance of a
    poloidal-field coil](name:resistance_of_poloidal_field_coil).

    The temperature serves as the independent variable for the coil's
    temperature-dependent maximum allowable current. It therefore identifies the
    operating-limit condition associated with the conductor temperature, but is
    not itself a current, resistance, or operating-limit value.
  unit: K

- name: thickness_of_iron_core_segment
  description: |-
    Full non-negative toroidal extent of a rectangular iron-core segment between
    its pair of opposite faces, measured along the toroidal direction φ in the
    right-handed cylindrical (R, φ, Z) frame. It is perpendicular to the
    segment's radial width along R and vertical height along Z.
  documentation: |-
    Full non-negative toroidal extent of a rectangular iron-core segment between
    its pair of opposite faces, measured along the toroidal direction $\phi$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major
    radius from the machine symmetry axis, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is the vertical height.

    The thickness is the face-to-face separation of paired points on the two
    opposite toroidal-facing faces along the local toroidal unit vector:

    $$
    t = \left| (\mathbf{x}_+ - \mathbf{x}_-) \cdot \hat{\boldsymbol{\phi}} \right|
    $$

    where $t$ is the segment thickness in m, $\mathbf{x}_-$ and $\mathbf{x}_+$
    are position vectors in m of paired points on the two opposite faces lying
    on the same line parallel to $\hat{\boldsymbol{\phi}}$, and
    $\hat{\boldsymbol{\phi}}$ is the local toroidal unit vector of the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    Together with the [width of the iron-core
    segment](name:width_of_iron_core_segment), the radial extent along $R$, and
    the [height of the iron-core segment](name:height_of_iron_core_segment), the
    vertical extent along $Z$, the thickness completes the mutually orthogonal
    triplet of extents describing the segment as a rectangular block whose cross
    section lies in the poloidal $(R, Z)$ plane and is extruded along $\phi$. It
    excludes any diagonal, chordwise, or arc-length measure across the segment.
  unit: m

- name: thickness_of_passive_loop_element
  description: |-
    Transverse dimension of the rectangular cross-section used to represent each
    passive conductor loop element, measured perpendicular to its central
    segment.
  documentation: |-
    The thickness is the transverse extent of an individual passive conductor
    loop element's rectangular cross-section, measured in the direction
    perpendicular to its central segment.

    The thickness $t$ is defined by the separation of the two opposing
    cross-section boundaries:

    $$
    t = \left|\mathbf{x}_{\perp,2} - \mathbf{x}_{\perp,1}\right|
    $$

    where $\mathbf{x}_{\perp,1}$ and $\mathbf{x}_{\perp,2}$ are the positions of
    the opposing boundaries along the direction perpendicular to the central
    segment, and $t$ is their separation.

    This quantity applies to one passive loop element and describes a
    cross-sectional dimension; it is not an aggregate over the loop or over
    multiple elements. It excludes the longitudinal extent of the element and is
    distinct from the [minor length of the passive loop
    element](name:minor_length_of_passive_loop_element), which describes an
    in-plane side length rather than the transverse thickness.
  unit: m

- name: tilt_angle_of_ferritic_element
  description: |-
    Signed inclination of the second side of a parallelogram-shaped oblique
    cross-section of a ferritic element, measured counterclockwise from
    vertically upward +Z toward decreasing R in the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    Signed inclination of the second side of a parallelogram-shaped oblique
    cross-section of a ferritic element is the $\beta$ orientation angle of that
    side in the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$
    frame. It is measured from the vertically upward $+Z$ direction.

    Let $\mathbf{t}_\beta$ be the directed vector along the second side, with
    radial component $\Delta R_\beta$ along $\hat{R}$ and vertical component
    $\Delta Z_\beta$ along $\hat{Z}$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame. The angle is defined by:

    $$
    \beta = \operatorname{atan2}(-\Delta R_\beta, \Delta Z_\beta)
    $$

    where $\operatorname{atan2}$ selects the signed quadrant of the directed
    side vector.

    This quantity specifies orientation only. The first-side $\alpha$
    inclination is the inclination angle of a ferritic element, the length of
    the $\alpha$ side is the [major length of a ferritic
    element](name:major_length_of_ferritic_element), and the length of the
    $\beta$ side is the minor length of a ferritic element. When the first-side
    and second-side inclinations are both zero, the parallelogram-shaped oblique
    cross-section reduces to the rectangular limiting geometry.

    Sign convention: Positive when the directed second-side vector is rotated
    counterclockwise from the $+Z$ direction toward decreasing $R$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: rad

- name: tilt_angle_of_passive_loop
  description: |-
    Signed inclination of a passive conducting loop element’s overall geometric
    reference axis in the poloidal plane, distinct from oblique cross-section
    shape angles.
  documentation: |-
    The tilt angle specifies the orientation of a passive conducting loop
    element’s directed geometric reference axis in the poloidal plane. It
    describes the overall orientation of the element, not an inclination
    parameter defining the shape of an oblique cross-section, and is analogous
    to the orientation defined for a [tilt angle of a plasma
    filament](name:tilt_angle_of_plasma_filament).

    Let the reference-axis direction have components $t_R$ and $t_Z$ along the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and
    $Z$ is vertical height. The tilt angle is defined by

    $$
    \theta_{\mathrm{tilt}} = \operatorname{atan2}(t_Z,t_R)
    $$

    where $\operatorname{atan2}$ returns the directed angle from the outward
    $+R$ direction toward the upward $+Z$ direction.

    Sign convention: Positive when the reference axis rotates from $+R$ toward
    $+Z$.
  unit: rad

- name: tilt_angle_of_plasma_filament
  description: |-
    Signed beta inclination of the beta-angle side of a plasma-filament
    parallelogram cross-section in the poloidal plane of the right-handed
    cylindrical (R, φ, Z) frame, measured counterclockwise from +Z toward
    decreasing R.
  documentation: |-
    The tilt angle of a plasma filament is the signed inclination $\beta$ of the
    beta-angle side of a plasma-filament parallelogram cross-section. The angle
    lies in the poloidal $(R,Z)$ plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$ is vertical height,
    and is referenced to the upward $+Z$ direction.

    For the ordered parallelogram, let $\mathbf{u}_\beta =
    u_R\hat{R}+u_Z\hat{Z}$ be the unit vector along the beta-angle side,
    directed from the reference vertex shared with the base side toward the
    adjacent beta-side vertex. The signed angle is defined by:

    $$
    \beta = \operatorname{atan2}(-u_R, u_Z)
    $$

    where $u_R$ and $u_Z$ are the components of $\mathbf{u}_\beta$ along
    $\hat{R}$ and $\hat{Z}$, and $\operatorname{atan2}(y,x)$ returns the
    principal branch $-\pi < \beta \le \pi$.

    The beta-angle side terminology follows the same angle-labeled parallelogram
    convention as [length of iron-core
    segment](name:minor_length_of_iron_core_segment), identifying a side by its
    inclination angle rather than by an ordinal label. The directed-edge and
    branch conventions make $\beta$ unique: translating to the opposite parallel
    edge leaves the value unchanged, while reversing the side direction is
    excluded. This angle complements cross-section size quantities such as
    [plasma-filament width](name:plasma_filament_width) and thickness of plasma
    filament; it is not a filament-current direction or a magnetic-field pitch
    angle.

    Sign convention: Positive when the directed beta-angle side is rotated
    counterclockwise from the upward $+Z$ direction in the poloidal $(R,Z)$
    plane of the right-handed cylindrical $(R,\phi,Z)$ frame, drawn with $R$
    increasing to the right.
  unit: rad

- name: toroidal_magnetic_field_at_ferritic_element_centroid
  description: |-
    Signed projection of the magnetic-field vector onto the toroidal direction
    at a ferritic element’s geometric centroid.
  documentation: |-
    The toroidal magnetic-field component at a ferritic element’s geometric
    centroid is the projection of the local magnetic-field vector onto the
    toroidal direction. The projection is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    $$
    B_\phi(\mathbf r_c) = \mathbf B(\mathbf r_c) \cdot \hat{\phi}
    $$

    where $\mathbf B$ is the magnetic-field vector, $\mathbf r_c$ is the
    ferritic-element centroid position, and $\hat{\phi}$ is the unit vector in
    the direction of increasing toroidal angle.

    This quantity is the toroidal counterpart of the [radial magnetic field at a
    ferritic element
    centroid](name:radial_magnetic_field_at_ferritic_element_centroid) and
    [vertical magnetic field at a ferritic element
    centroid](name:vertical_magnetic_field_at_ferritic_element_centroid). It
    describes magnetic field, not the material magnetization represented by
    [toroidal magnetization of a ferritic
    element](name:toroidal_magnetization_of_ferritic_element).

    Sign convention: Positive when $B_\phi$ points in the direction of
    increasing toroidal angle $\phi$.
  unit: T

- name: toroidal_magnetization_of_ferritic_element
  description: |-
    Toroidal component of the ferritic-element magnetization vector: the signed
    projection of the effective magnetization assigned to a discrete ferritic
    element onto the positive toroidal direction in the right-handed cylindrical
    (R, φ, Z) frame. This is the element-level convention, not a pointwise
    bulk-material magnetization field.
  documentation: |-
    Toroidal component of the ferritic-element magnetization vector is the
    signed projection of the effective magnetization assigned to a discrete
    ferritic element onto the toroidal basis direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The projection is defined by:

    $$
    M_\phi^{\mathrm{fe}} = \mathbf{M}^{\mathrm{fe}} \cdot \hat{\phi}
    $$

    where $\mathbf{M}^{\mathrm{fe}}$ is the ferritic-element magnetization
    vector assigned to the element, $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle, and $M_\phi^{\mathrm{fe}}$ is this
    toroidal component.

    In this family, ferritic-element magnetization denotes the effective
    magnetization attributed to the individual ferritic element for its magnetic
    source strength. It is not the pointwise bulk magnetization field inside the
    material, and it is distinct from material properties such as magnetic
    permeability. Together with the [radial
    component](name:radial_magnetization_of_ferritic_element) and [vertical
    component](name:vertical_magnetization_of_ferritic_element), it forms the
    three cylindrical components of the same effective ferritic-element
    magnetization vector.

    Sign convention: Positive when $M_\phi^{\mathrm{fe}}$ points in the
    direction of increasing toroidal angle $\phi$ (counter-clockwise viewed from
    above $+\hat{Z}$).
  unit: A.m^-2

- name: turn_count_of_correction_coil
  description: |-
    Total winding-turn count assigned to one non-axisymmetric correction coil,
    including fractional values when the circuit represents partial coil
    connections.
  documentation: |-
    The correction-coil turn count is the total number of winding turns assigned
    to one non-axisymmetric coil used for magnetic-field correction. It
    represents the coil's winding count rather than a field, current, or
    electromagnetic load.

    The quantity applies to the selected correction coil and aggregates all
    turns assigned to that coil. Fractional values are permitted when the
    circuit description represents partial coil connections; they do not
    indicate a fractional physical turn in an individual winding.

    This un-oriented total winding count is distinct from the signed
    equivalent-winding quantity for a passive conducting loop, [effective turn
    count of a passive loop](name:effective_turn_count_of_passive_loop), which
    weights electromagnetic coupling. Its treatment of fractional connections is
    analogous to [turn count of a toroidal field
    coil](name:turn_count_of_toroidal_field_coil), while retaining the
    correction-coil ownership and non-axisymmetric scope.
  unit: '1'

- name: turn_count_of_toroidal_field_coil
  description: |-
    Total winding count assigned to one toroidal-field coil, with fractional
    values allowed for partial connections that do not make complete turns.
  documentation: |-
    The turn count is the total number of conductor windings assigned to a
    single toroidal-field coil. It represents the winding multiplicity used in
    generating the coil's toroidal magnetic field, including fractional
    contributions when the represented connection contains partial turns.

    The quantity is non-negative and aggregates all winding turns belonging to
    that one coil. It is not an average, a count of discrete coil modules, or a
    signed orientation parameter; fractional values describe partial connections
    rather than a separate type of turn.

    At fixed coil geometry and winding current, the magnetic-field contribution
    scales with the turn count. The signed direction is supplied by the [current
    of a toroidal-field coil](name:current_of_toroidal_field_coil), whereas this
    quantity supplies the winding multiplicity. It is distinct from the [count
    of toroidal-field coils](name:count_of_toroidal_field_coil), which counts
    discrete coil modules, and from the [effective turn count of a passive
    loop](name:effective_turn_count_of_passive_loop), which represents signed
    equivalent windings for passive-loop electromagnetic coupling. The analogous
    [turn count of a correction coil](name:turn_count_of_correction_coil)
    applies to a different coil class.
  unit: '1'

- name: vertical_coordinate_of_annulus_center
  description: |-
    Vertical coordinate of the annulus center specifies its signed height from
    the zero-height plane, parallel to the symmetry axis in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical coordinate of the annulus center is its signed height in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    The coordinate is defined by

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the position vector of the annulus center measured
    from the coordinate origin, and $\hat{\mathbf{z}}$ is the unit vector
    parallel to the symmetry axis toward increasing $Z$.

    The quantity applies to one annular cross-section, not to points along its
    boundary or to an average over multiple elements. It specifies position
    rather than the inner radius, outer radius, or vertical extent of the
    annulus, and applies to both conducting and magnetizable components.

    It uses the same vertical projection as the [vertical coordinate of an
    arc-of-circle center](name:vertical_coordinate_of_arc_of_circle_center),
    with a different geometric locus.

    Sign convention: Positive when the annulus center lies above the zero-height
    plane in the direction of increasing $Z$.
  unit: m

- name: vertical_coordinate_of_conductor_cross_section
  description: |-
    Vertical coordinate of the geometric center of a rectangular conductor
    cross-section in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical coordinate of the geometric center of a rectangular conductor
    cross-section in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical position.

    The coordinate is defined by

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the position vector of the geometric center relative
    to an origin on the toroidal symmetry axis in the chosen zero-height plane,
    and $\hat{\mathbf{z}}$ is the unit vector along that axis toward increasing
    vertical position.

    This is the [vertical coordinate of the rectangle
    center](name:vertical_coordinate_of_rectangle_center) applied to a conductor
    cross-section. It locates one cross-section center, not an average over
    conductor elements, the rectangle's vertical extent, or an outline vertex.

    Sign convention: Positive when the geometric center lies above the
    zero-height plane in the direction of increasing $Z$.
  unit: m

- name: vertical_coordinate_of_passive_loop_element
  description: |-
    Vertical coordinate of a passive-loop element's geometry-defining point: the
    geometric center in oblique geometry or a specified endpoint in thick-line
    geometry, expressed as signed height in the right-handed cylindrical (R, φ,
    Z) frame.
  documentation: |-
    Vertical coordinate of a point associated with a passive-loop element is its
    signed position along the symmetry axis. It gives the geometric-center
    height for oblique geometry and the height of the specified endpoint for
    thick-line geometry.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is the vertical coordinate. The [vertical
    direction] is parallel to the toroidal symmetry axis, and the coordinate is
    defined by its projection:

    $$
    Z = \mathbf{x}\cdot\hat{\mathbf{z}}
    $$

    where $\mathbf{x}$ is the point's position vector relative to the coordinate
    origin and $\hat{\mathbf{z}}$ is the unit vector along the symmetry axis
    toward increasing $Z$.

    The coordinate applies to the geometry-defining point for an individual
    passive-loop element; it is not an aggregate across elements. For thick-line
    geometry it refers to the specified endpoint, not the cross-sectional
    geometric center or an average over the cross-section. It specifies a
    location, not a transverse size such as the [thickness of the passive-loop
    element](name:thickness_of_passive_loop_element).

    Sign convention: Positive when the point lies in the $+Z$ direction from the
    plane $Z=0$.
  unit: m

- name: vertical_force_of_poloidal_field_coil
  description: |-
    Signed vertical component of the net electromagnetic Lorentz force on one
    poloidal-field coil, resolved along increasing Z in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the net electromagnetic Lorentz force on an individual
    poloidal-field-coil conductor projected onto the vertical axis of the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The force component is defined by

    $$
    F_Z = \int_{V_{\mathrm{coil}}} (\mathbf{J} \times \mathbf{B}) \cdot \hat{\mathbf{Z}}\,\mathrm{d}V
    $$

    where $F_Z$ is the vertical force component, $V_{\mathrm{coil}}$ is the
    conductor volume, $\mathbf{J}$ is the current-density vector, $\mathbf{B}$
    is the magnetic-field vector acting on the conductor, $\hat{\mathbf{Z}}$ is
    the vertical unit vector, and $\mathrm{d}V$ is a differential volume
    element.

    This is a signed component rather than the force magnitude or resultant. The
    radial component is represented separately by [radial force of a
    poloidal-field coil](name:radial_force_of_poloidal_field_coil), while [force
    of a poloidal-field coil](name:force_of_poloidal_field_coil) represents the
    coil’s electromagnetic force resultant.

    Sign convention: Positive when the net force points toward increasing $Z$.
  unit: N

- name: vertical_magnetic_field_at_ferritic_element_centroid
  description: |-
    Signed vertical component of the magnetic-field vector at a ferritic
    element’s centroid in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The vertical magnetic field at a ferritic element’s geometric centroid is
    the projection of the local magnetic-field vector onto the vertical
    direction. The centroid location is identified by the [vertical coordinate
    of the ferritic element
    centroid](name:z_coordinate_of_ferritic_element_centroid), while this
    quantity describes the field component there, not the element’s
    magnetization.

    $$
    B_Z(\mathbf r_c)=\mathbf B(\mathbf r_c)\cdot\hat{\mathbf Z}
    $$

    where $\mathbf r_c$ is the centroid position, $\mathbf B$ is the local
    magnetic-field vector, and $\hat{\mathbf Z}$ is the vertical unit vector in
    the right-handed cylindrical $(R, \phi, Z)$ frame. The radial, vertical, and
    toroidal components together describe the local field; the corresponding
    radial and toroidal quantities are [radial magnetic field at ferritic
    element centroid](name:radial_magnetic_field_at_ferritic_element_centroid)
    and [toroidal magnetic field at ferritic element
    centroid](name:toroidal_magnetic_field_at_ferritic_element_centroid).

    Sign convention: Positive when $B_Z$ points in the direction of increasing
    vertical coordinate $Z$.
  unit: T

- name: vertical_magnetization_of_ferritic_element
  description: |-
    Signed vertical component of the effective magnetization vector assigned to
    a ferritic element in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical magnetization of a ferritic element is the signed projection of its
    assigned effective magnetization vector onto the vertical direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The defining projection is:

    $$
    M_Z^{\mathrm{eff}} = \mathbf{M}^{\mathrm{eff}} \cdot \hat{\mathbf{Z}}
    $$

    where $M_Z^{\mathrm{eff}}$ is the vertical magnetization component,
    $\mathbf{M}^{\mathrm{eff}}$ is the effective magnetization vector assigned
    to the ferritic element, and $\hat{\mathbf{Z}}$ is the unit vector toward
    increasing vertical height. The corresponding radial projection is [radial
    magnetization of a ferritic
    element](name:radial_magnetization_of_ferritic_element); neither quantity is
    the magnetic field at the element centroid, such as the [vertical magnetic
    field at a ferritic element
    centroid](name:vertical_magnetic_field_at_ferritic_element_centroid).

    Sign convention: Positive when the effective magnetization vector has a
    component toward increasing vertical height $Z$.
  unit: A.m^-2

- name: voltage_of_poloidal_field_coil
  description: |-
    Signed terminal voltage across a poloidal-field-coil winding, equal to its
    resistive voltage drop plus the voltage induced by changing magnetic flux
    linkage.
  documentation: |-
    The terminal voltage is the total voltage drop across a poloidal-field-coil
    winding. It combines the ohmic voltage drop in the conductor with the
    inductive voltage associated with changing magnetic flux linkage.

    Using a consistent winding orientation, the voltage is defined by

    $$
    V_{\mathrm{term}} = R_{\mathrm{w}} I + \frac{d\Phi_{\mathrm{link}}}{dt}
    $$

    where $V_{\mathrm{term}}$ is the terminal voltage, $R_{\mathrm{w}}$ is the
    winding resistance represented by the [poloidal-field-coil
    resistance](name:resistance_of_poloidal_field_coil), $I$ is the conventional
    current in the winding, $\Phi_{\mathrm{link}}$ is its signed total magnetic
    flux linkage, and $t$ is time.

    This quantity applies to the complete active winding and includes both
    self-field and externally produced flux linkage. It is distinct from the
    induced terminal voltage of a separate [poloidal magnetic-field
    probe](name:voltage_of_poloidal_magnetic_field_probe) and is analogous to
    the [toroidal-field-coil terminal
    voltage](name:voltage_of_toroidal_field_coil).

    Sign convention: Positive when the terminal potential drop is measured in
    the direction of the winding's defined positive conventional-current
    direction.
  unit: V

- name: volume_of_ferritic_element
  description: |-
    Geometric volume enclosed by the boundaries of a ferritic in-vessel element,
    representing its complete material extent rather than a cross-sectional
    dimension.
  documentation: |-
    The volume of a ferritic in-vessel element is the non-negative geometric
    measure of the material region bounded by the element’s physical boundary.
    It represents the element as a whole, rather than a single cross-sectional
    dimension such as its [ferritic-element
    width](name:width_of_ferritic_element).

    The volume is defined by

    $$
    V = \int_{\Omega} d^3x
    $$

    where $V$ is the element volume, $\Omega$ is the region occupied by the
    ferritic element, and $d^3x$ is the differential volume element. The
    quantity excludes surrounding plasma, vacuum, and unrelated neighboring
    structures.
  unit: m^3

- name: width_of_correction_coil
  description: |-
    Full non-negative extent of a non-axisymmetric correction-coil conductor
    cross-section measured along its local normal axis; for circular sections it
    is the diameter, and for annular sections it is the outer diameter.
  documentation: |-
    Full non-negative extent of a non-axisymmetric correction-coil conductor
    cross-section measured along its local normal axis is the characteristic
    transverse size of that cross-section. It is a geometric property of the
    conductor cross-section, not a signed displacement or orientation.

    The defining geometric identification is:

    $$
    w = \begin{cases}
    a_n, & \text{rectangular or square cross-section},\\
    D, & \text{circular cross-section},\\
    D_{\mathrm{out}}, & \text{annular cross-section}.
    \end{cases}
    $$

    where $w$ is this width, $a_n$ is the full cross-section extent along the
    local normal axis, $D$ is the circular cross-section diameter, and
    $D_{\mathrm{out}}$ is the annular cross-section outer diameter.

    The scope is one conductor cross-section of one non-axisymmetric correction
    coil; the quantity is assigned to the whole cross-section. It is not a sum
    or average over multiple coils, separate conductor segments, or turns, and
    it is not the conductor path length or the spatial location of the coil.

    The companion linear size for a rectangular or square section is the [height
    of a correction-coil conductor
    cross-section](name:height_of_correction_coil); the [area of a
    correction-coil conductor cross-section](name:area_of_correction_coil) is
    the corresponding area, not another linear dimension. For an annular
    section, the [inner radius of a correction-coil conductor
    cross-section](name:inner_radius_of_correction_coil) describes the central
    opening, whereas this width describes the outer diameter. The [width of a
    toroidal-field-coil conductor
    cross-section](name:width_of_toroidal_field_coil) is the analogous geometric
    quantity for a toroidal-field coil rather than a non-axisymmetric correction
    coil.
  unit: m

- name: width_of_ferritic_element
  description: |-
    Full non-negative radial extent of a ferritic element’s rectangular
    cross-section, measured along major radius in the right-handed cylindrical
    (R, φ, Z) frame.
  documentation: |-
    The quantity is the full non-negative radial extent of a ferritic element’s
    rectangular cross-section, measured along the major-radius direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It spans the inner and outer
    radial boundaries of the cross-section.

    $$
    w_R = R_{\mathrm{out}} - R_{\mathrm{in}}
    $$

    where $w_R$ is the radial extent, and $R_{\mathrm{out}}$ and
    $R_{\mathrm{in}}$ are the outer and inner major-radius coordinates,
    respectively, measured in meters.

    This is a geometric width, not the radial coordinate of the [ferritic
    element centroid](name:radial_coordinate_of_ferritic_element_centroid), the
    outer boundary radius of an annular representation, or the extent in the
    vertical direction. It is analogous to the [width of an iron core
    segment](name:width_of_iron_core_segment).
  unit: m

- name: width_of_iron_core_segment
  description: |-
    Full non-negative radial extent of an iron core segment’s rectangular
    cross-section, measured along major radius in the right-handed cylindrical
    (R, φ, Z) frame.
  documentation: |-
    The iron core segment width is the complete radial span between the inner
    and outer faces of its rectangular cross-section. It is a geometric extent,
    not the radial position of the segment or the curvature radius of an arc
    boundary.

    The width is defined by

    $$
    w_{\rm iron} = R_{\rm outer} - R_{\rm inner}
    $$

    where $R_{\rm outer}$ and $R_{\rm inner}$ are the major-radius coordinates
    in meters of the outer and inner radial faces, respectively, and $w_{\rm
    iron}$ is the resulting full extent. The width complements the [height of
    the iron core segment](name:height_of_iron_core_segment), while the [outer
    radius of the iron core segment](name:outer_radius_of_iron_core_segment)
    identifies a boundary position rather than a cross-sectional span.
  unit: m

- name: width_of_passive_structure
  description: |-
    Full radial extent of a rectangular passive conducting structure element in
    the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial width is the full major-radius extent of a rectangular passive
    conducting structure element, measured between its inner and outer radial
    boundaries.

    $$
    W = R_{\mathrm{outer}} - R_{\mathrm{inner}}
    $$

    where $W$ is the radial width, and $R_{\mathrm{outer}}$ and
    $R_{\mathrm{inner}}$ are the major-radius coordinates in meters of the outer
    and inner boundaries in the right-handed cylindrical $(R, \phi, Z)$ frame.

    The quantity is non-negative and describes radial extent only; it is
    distinct from the full vertical extent given by [height of passive
    structure](name:height_of_passive_structure) and from the element length
    given by length of passive structure.
  unit: m

- name: width_of_toroidal_field_coil
  description: |-
    Full geometric width of a toroidal-field-coil conductor cross-section,
    measured as the boundary-to-boundary transverse extent along the normal
    direction of the local Frenet-Serret frame. It is an unsigned extent, not a
    centerline location or coil radius.
  documentation: |-
    Full geometric width of a toroidal-field-coil conductor cross-section,
    measured along the normal axis of the local right-handed Frenet-Serret frame
    $(\hat{t}, \hat{n}, \hat{b})$. The tangent $\hat{t}$ follows the conductor
    centerline, the normal $\hat{n}$ lies in the cross-section plane, and the
    binormal $\hat{b} = \hat{t} \times \hat{n}$; the corresponding extent along
    $\hat{b}$ is
    [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil).

    The width is the boundary-to-boundary span of the outer conductor boundary
    $\partial S$ projected onto $\hat{n}$:

    $$
    w = \max_{\mathbf{r} \in \partial S} (\mathbf{r} \cdot \hat{n}) - \min_{\mathbf{r} \in \partial S} (\mathbf{r} \cdot \hat{n})
    $$

    where $\mathbf{r}$ is the position of a boundary point in the cross-section
    plane and $\hat{n}$ is the unit normal. Reversing the sense of $\hat{n}$
    leaves $w$ unchanged, so it is an unsigned extent.

    For a rectangular or square section this is the full side length along
    $\hat{n}$; for a circular section it is the diameter; for an annular section
    it is the outer diameter, not the bore diameter or wall thickness. It is a
    geometric extent of the outer cross-section and is distinct from a
    centerline location or from a coil radius such as
    radius_of_toroidal_field_coil or
    [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil).
  unit: m

- name: x_coordinate_of_ferritic_element_centroid
  description: |-
    Signed Cartesian x coordinate of a ferritic element’s geometric centroid in
    the right-handed (x, y, z) frame, with z aligned with the vertical Z
    direction.
  documentation: |-
    The quantity is the signed Cartesian x position of the geometric centroid of
    a ferritic element. It gives the element’s absolute position in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, with $\hat{z}$
    aligned with the vertical direction; it is not a radial coordinate or a
    local displacement.

    For an element occupying volume $V$, the centroid coordinate is defined by

    $$
    x_c = \frac{1}{V}\int_V x\,\mathrm{d}V
    $$

    where $x_c$ and $x$ are Cartesian x coordinates in meters, $V$ is the
    element volume, and $\mathrm{d}V$ is a volume element. Together with the [y
    coordinate of the ferritic element
    centroid](name:y_coordinate_of_ferritic_element_centroid) and [z coordinate
    of the ferritic element
    centroid](name:z_coordinate_of_ferritic_element_centroid), it locates the
    same geometric centroid; it is distinct from the [radial coordinate of the
    ferritic element
    centroid](name:radial_coordinate_of_ferritic_element_centroid).

    Sign convention: Positive when the centroid lies in the $+x$ direction from
    the Cartesian origin.
  unit: m

- name: z_coordinate_of_ferritic_element_centroid
  description: |-
    Vertical Z coordinate of the geometric centroid of a ferritic element in the
    right-handed cylindrical (R, φ, Z) frame, where Z increases upward from the
    machine midplane.
  documentation: |-
    The vertical coordinate $Z_\mathrm{cent}$ specifies the height of the
    geometric centroid of a ferritic element along the $Z$-axis of the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    from the symmetry axis, $\phi$ is the toroidal angle increasing
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is the vertical
    height measured from the machine midplane.

    Ferritic elements are passive ferromagnetic components installed in some
    tokamak configurations to reduce toroidal magnetic field ripple generated by
    discrete toroidal field coils. The centroid position serves as the
    representative reference point for each element in electromagnetic field
    models that compute the perturbed equilibrium field arising from the
    ferromagnetic material. Together with
    [radial_coordinate_of_ferritic_element_centroid](name:radial_coordinate_of_ferritic_element_centroid),
    this coordinate fully determines the axisymmetric centroid location in the
    poloidal $(R, Z)$ plane.

    For configurations requiring the full three-dimensional centroid location,
    the Cartesian counterparts
    [x_coordinate_of_ferritic_element_centroid](name:x_coordinate_of_ferritic_element_centroid)
    and
    [y_coordinate_of_ferritic_element_centroid](name:y_coordinate_of_ferritic_element_centroid)
    provide the transverse displacement when the element's toroidal position is
    also needed. Centroid coordinates are derived from the engineering design
    geometry of the device and used as inputs to equilibrium reconstruction and
    ripple-compensation analyzes.

    Sign convention: Positive when the centroid lies above the machine midplane
    in the $+Z$ direction.
  unit: m

- name: radial_coordinate_of_arc_of_circle_center
  description: |-
    Major-radius coordinate of an iron-core segment’s annular cross-section
    center in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the major-radius coordinate $R$ of the center of the
    annular cross-section representing one iron-core segment. It identifies the
    radial placement of that annular center in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    The quantity is defined separately for each segment’s annulus center; it is
    neither averaged nor summed over segments. It denotes the center coordinate
    rather than the major-radius coordinate of an arc start point, arc endpoint,
    or arbitrary outline point.

    The [radial outline of the iron-core
    segment](name:radial_outline_of_iron_core_segment) gives major-radius
    coordinates for points on the cross-sectional boundary, whereas this
    quantity gives the major-radius coordinate used to locate the annular
    center.
  unit: m

- name: radial_coordinate_of_coil_conductor_element
  description: |-
    Major-radius coordinate of a coil-conductor element reference point, equal
    to its perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of coil conductor element

    The coordinate is defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $x$ and $y$ are the reference point's transverse coordinates in a
    right-handed Cartesian $(x,y,z)$ frame whose $z$ axis coincides with the
    toroidal symmetry axis; $z$ denotes vertical height.

    This quantity locates the selected reference point of an individual
    coil-conductor element, without averaging over the conductor or coil. It is
    not an arc radius or a displacement measured from the conductor centerline.
  unit: m

- name: radial_coordinate_of_ferritic_element
  description: |-
    Major-radius coordinate of a specified point of a ferritic element, equal to
    its perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    Major-radius coordinate of ferritic element

    The coordinate is defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $R$ is major radius, $x$ and $y$ are horizontal position coordinates,
    and $z$ is vertical position in the right-handed Cartesian $(x,y,z)$ frame
    with its origin on the toroidal symmetry axis.

    For thick-line geometry, the specified point is the first or second
    endpoint, with each coordinate referring to one endpoint separately. For
    oblique geometry, it is the designated geometric point. The coordinate is
    not an average over the element and does not imply its centroid.
  unit: m

- name: radial_coordinate_of_ferritic_element_centroid
  description: |-
    Nonnegative major-radius location of the geometric centroid of one ferritic
    element in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the radial coordinate of the geometric centroid of one
    ferritic element, locating that centroid by its distance from the toroidal
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame. Here $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The centroid radial coordinate is defined by

    $$
    R_c = \sqrt{x_c^2+y_c^2}
    $$

    where $R_c$ is the radial coordinate of the ferritic-element centroid, and
    $x_c$ and $y_c$ are its Cartesian coordinates in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis, with $\hat{z}=\hat{Z}$.

    This quantity applies independently to each ferritic element and is not
    summed or averaged over elements. It is distinct from the [radial outline
    coordinate of a ferritic element](name:radial_outline_of_ferritic_element),
    which locates contour points, and from the [vertical coordinate of a
    ferritic-element centroid](name:z_coordinate_of_ferritic_element_centroid),
    which provides the centroid's $Z$ coordinate. It is the
    ferritic-element-centroid specialization of the general [radial
    coordinate](name:radial_coordinate).
  unit: m

- name: vacuum_magnetic_vector_potential
  description: |-
    Gage-dependent vacuum magnetic vector potential generated by external
    current sources; its curl gives the magnetic induction when plasma-current
    contributions are excluded.
  documentation: |-
    The vacuum magnetic vector potential is a gage-dependent vector field
    representing the external-source contribution to the [magnetic vector
    potential](name:magnetic_vector_potential). It excludes the contribution
    generated by plasma currents while retaining the gage dependence of the full
    potential.

    The defining relation between this potential and the corresponding vacuum
    magnetic induction is:

    $$
    \mathbf{B}_{\mathrm{vac}} = \nabla \times \mathbf{A}_{\mathrm{vac}}
    $$

    where $\mathbf{A}_{\mathrm{vac}}$ is the vacuum magnetic vector potential,
    $\mathbf{B}_{\mathrm{vac}}$ is the magnetic induction produced by the
    external sources alone, and $\nabla \times$ is the curl operator. Replacing
    $\mathbf{A}_{\mathrm{vac}}$ by $\mathbf{A}_{\mathrm{vac}} + \nabla \chi$,
    where $\chi$ is an arbitrary scalar gage function, leaves
    $\mathbf{B}_{\mathrm{vac}}$ unchanged.

    The vector may be resolved into components in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Its radial and vertical projections are represented by
    the [radial vacuum magnetic vector
    potential](name:radial_vacuum_magnetic_vector_potential) and [vertical
    vacuum magnetic vector
    potential](name:vertical_vacuum_magnetic_vector_potential), respectively.

    Sign convention: Positive when a component of the vector points along its
    corresponding positive basis direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  unit: T.m

- name: radial_vacuum_magnetic_vector_potential
  description: |-
    Radial (R) component of the vacuum magnetic vector potential produced solely
    by toroidal-field coil currents in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    The radial component $A_R$ of the vacuum magnetic vector potential is the
    projection of $\mathbf{A}_\mathrm{vac}$ onto the radial direction $\hat{R}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It represents the
    $R$-directed component of the gage-dependent vector potential produced
    solely by toroidal-field coil currents.

    The component projection is defined by:

    $$
    A_R = \mathbf{A}_{\mathrm{vac}} \cdot \hat{R}
    $$

    where $\mathbf{A}_{\mathrm{vac}}$ is the [vacuum magnetic vector
    potential](name:vacuum_magnetic_vector_potential), $\hat{R}$ is the unit
    vector in the direction of increasing major radius $R$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $\phi$ is the toroidal angle, $Z$ is
    vertical height, and $\cdot$ denotes the scalar product.

    The source population is the toroidal-field coil current system only.
    Contributions from plasma currents and from other external-current systems
    are excluded; the quantity is a pointwise scalar component, not a spatial
    average, flux-surface average, integral, magnetic-induction component, or
    the full [magnetic vector potential](name:magnetic_vector_potential).

    The corresponding vacuum magnetic induction $\mathbf{B}_{\mathrm{vac}}$ is
    related to the parent vector by $\mathbf{B}_{\mathrm{vac}} = \nabla \times
    \mathbf{A}_{\mathrm{vac}}$, with $\nabla \times$ denoting the curl operator.
    Replacing $\mathbf{A}_{\mathrm{vac}}$ by $\mathbf{A}_{\mathrm{vac}} + \nabla
    \chi$, where $\chi$ is an arbitrary scalar gage function, changes $A_R$ by
    the radial projection of $\nabla \chi$ while leaving
    $\mathbf{B}_{\mathrm{vac}}$ unchanged; the [vertical vacuum magnetic vector
    potential](name:vertical_vacuum_magnetic_vector_potential) is the analogous
    projection along $\hat{Z}$, the vertical basis direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    Sign convention: Positive when $\mathbf{A}_{\mathrm{vac}}$ has a projection
    along $+\hat{R}$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: T.m

- name: toroidal_vacuum_magnetic_vector_potential
  description: |-
    Toroidal (φ) component of the gage-dependent vacuum magnetic vector
    potential produced solely by toroidal-field coil currents in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The toroidal component $A_\u03c6$ of the vacuum magnetic vector potential is
    the projection of $\mathbf{A}_\mathrm{vac}$ onto the toroidal direction
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It
    represents the toroidally directed external-source contribution produced
    solely by toroidal-field coil currents, excluding the contribution generated
    by plasma currents.

    The component is defined by

    $$
    A_\phi = \mathbf{A}_\mathrm{vac} \cdot \hat{\phi}
    $$

    where $A_\phi$ is the toroidal component, $\mathbf{A}_\mathrm{vac}$ is the
    vacuum magnetic vector potential, and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle. Here, $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    This scalar is the signed toroidal projection of the gage-dependent [vacuum
    magnetic vector potential](name:vacuum_magnetic_vector_potential), not its
    magnitude or full vector. Together with the [radial vacuum magnetic vector
    potential](name:radial_vacuum_magnetic_vector_potential) and [vertical
    vacuum magnetic vector
    potential](name:vertical_vacuum_magnetic_vector_potential), it provides the
    component decomposition of the vacuum vector potential; plasma-current
    contributions remain excluded.

    Sign convention: Positive when $A_\phi$ points in the direction of
    increasing toroidal angle $\phi$.
  unit: T.m

- name: vertical_vacuum_magnetic_vector_potential
  description: |-
    Vertical (Z) component of the vacuum magnetic vector potential produced
    solely by toroidal-field coil currents in the right-handed cylindrical (R,
    φ, Z) frame.
  documentation: |-
    The vertical component $A_Z$ of the vacuum magnetic vector potential is the
    projection of $\mathbf{A}_\mathrm{vac}$ onto the vertical direction
    $\hat{Z}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It
    represents the $Z$-directed contribution of the vector field generated
    exclusively by toroidal-field coil currents in the absence of plasma and
    eddy-current contributions, forming part of the complete [vacuum magnetic
    vector potential](name:vacuum_magnetic_vector_potential) vector $(A_R,
    A_\phi, A_Z)$.

    The vacuum magnetic field is related to the vector potential by

    $$
    \mathbf{B}_\mathrm{vac} = \nabla \times \mathbf{A}_\mathrm{vac}
    $$

    where $\mathbf{B}_\mathrm{vac}$ is the vacuum magnetic field,
    $\mathbf{A}_\mathrm{vac}$ is the vacuum magnetic vector potential, and
    $\nabla \times$ is the curl operator. The curl is gage-invariant, whereas
    $A_Z$ depends on the selected gage and is not itself a magnetic-field
    component. The complementary radial component is
    [radial_vacuum_magnetic_vector_potential](name:radial_vacuum_magnetic_vector_potential);
    unlike
    [vertical_magnetic_vector_potential](name:vertical_magnetic_vector_potential),
    this quantity excludes plasma and eddy-current contributions.

    Sign convention: Positive when $A_Z$ points in the direction of increasing
    vertical height $Z$.
  unit: T.m

- name: vacuum_poloidal_current_function
  description: |-
    Vacuum poloidal current function is the signed product of major radius and
    the combined external-coil toroidal magnetic field, excluding plasma-induced
    modifications.
  documentation: |-
    Vacuum poloidal current function is the major-radius-weighted toroidal
    magnetic field produced by the combined external coils, excluding
    plasma-induced modifications. It is the vacuum specialization of the
    [poloidal current function](name:poloidal_current_function).

    In the right-handed cylindrical $(R, \phi, Z)$ frame, it is defined by

    $$
    F = R B_{\phi}
    $$

    where $F$ is the vacuum poloidal current function, $R$ is major radius
    measured from the symmetry axis, $\phi$ is toroidal angle, $Z$ is vertical
    height, and $B_{\phi}$ is the vacuum toroidal magnetic-field component in
    the direction of increasing $\phi$.

    In an axisymmetric, current-free vacuum region, $F$ is spatially constant
    and the toroidal field varies inversely with major radius. Equivalently, $F
    = R_0 B_0$, where $R_0$ is a reference major radius and $B_0$ is the vacuum
    toroidal magnetic field evaluated there.

    This quantity is the field product itself, not its [change relative to an
    initial
    value](name:difference_of_vacuum_poloidal_current_function_and_initial_vacuum_poloidal_current_function).
    That change is $F-F_{\mathrm{initial}}$, where $F_{\mathrm{initial}}$ is the
    initial vacuum poloidal current function.

    Sign convention: Positive when the vacuum toroidal magnetic field points in
    the direction of increasing toroidal angle $\phi$, counterclockwise when
    viewed from above.
  unit: T.m

- name: difference_of_vacuum_poloidal_current_function_and_initial_vacuum_poloidal_current_function
  description: |-
    Signed change in the combined external-coil vacuum poloidal current function
    relative to its initial reference value, representing variation of the
    toroidal field multiplied by major radius.
  documentation: |-
    The quantity is the signed difference between the present and initial values
    of the vacuum poloidal current function produced by external coil currents.
    It represents the change in the major-radius-weighted toroidal magnetic
    field in the axisymmetric current-free vacuum region.

    Let $F_{\rm vac}$ denote the [vacuum poloidal current
    function](name:vacuum_poloidal_current_function). Its change relative to the
    initial reference state is

    $$
    \Delta F_{\rm vac}=F_{\rm vac}-F_{\rm vac,initial}=R B_{\phi,\rm vac}-R B_{\phi,\rm vac,initial}
    $$

    where $\Delta F_{\rm vac}$ is the signed change, $F_{\rm vac}$ is the
    present external-coil vacuum poloidal current function, $F_{\rm
    vac,initial}$ is its value in the initial reference state, $R$ is major
    radius, and $B_{\phi,\rm vac}$ is the vacuum toroidal magnetic-field
    component in the right-handed cylindrical $(R,\phi,Z)$ frame. Here $\phi$ is
    toroidal angle and $Z$ is vertical height.

    The quantity uses the combined vacuum contribution from external coil
    currents and excludes plasma currents and induced currents in conducting
    structures. It is a difference from one initial reference value, not the
    absolute [vacuum poloidal current
    function](name:vacuum_poloidal_current_function); within an axisymmetric
    current-free region, it inherits the parent function's spatial constancy.

    Sign convention: Positive when the present value of $R B_{\phi,\rm vac}$
    exceeds its initial reference value, with $B_{\phi,\rm vac}$ positive in the
    direction of increasing toroidal angle $\phi$.
  unit: T.m
