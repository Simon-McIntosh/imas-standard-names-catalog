- name: major_radius_of_second_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the second defining point of a diagnostic
    line-of-sight chord, measured as the perpendicular distance from the machine symmetry
    axis in the right-handed cylindrical (R, phi, Z) frame.
  documentation: "A diagnostic line-of-sight chord is geometrically defined by an\
    \ ordered sequence of points; the second point typically lies interior to the\
    \ plasma vessel or at an intermediate position along the chord path between the\
    \ entry and exit points. The major-radius coordinate $R$ of this point is the\
    \ perpendicular distance from the machine symmetry axis, satisfying $R = \\sqrt{x^2\
    \ + y^2}$ in Cartesian $(x, y, z)$ coordinates, where $x$ and $y$ are horizontal\
    \ coordinates in the machine midplane. Together with the corresponding vertical\
    \ coordinate and toroidal angle, $R$ fully specifies the spatial location of this\
    \ chord point. Typical values range from approximately 0.5 m for small tokamaks\
    \ to over 8 m for large devices, bounded below by the inboard wall position and\
    \ above by the outboard wall position. This coordinate is used across multiple\
    \ diagnostic systems \u2014 including polarimetry, interferometry, electron cyclotron\
    \ emission, and soft X-ray cameras \u2014 to define chord geometry for line-integrated\
    \ signal calculations. It forms a sibling set with [major_radius_of_first_point_of_line_of_sight](name:major_radius_of_first_point_of_line_of_sight)\
    \ and [major_radius_of_third_point_of_line_of_sight](name:major_radius_of_third_point_of_line_of_sight),\
    \ which together parameterize the full chord path.\n\nSign convention: Positive\
    \ when R is directed radially outward from the machine symmetry axis, consistent\
    \ with the non-negative definition of the cylindrical radial coordinate."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_first_point_of_line_of_sight
  - name:major_radius_of_third_point_of_line_of_sight
