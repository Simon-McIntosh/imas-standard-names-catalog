- name: voltage_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Terminal voltage of a toroidal magnetic field probe coil, induced by
    the time variation of the local toroidal magnetic field component threading the
    coil windings.
  documentation: 'A toroidal magnetic field probe is a pickup coil wound to sense
    the toroidal component of the magnetic field at a specific location. The terminal
    voltage is the raw inductive signal produced as the local toroidal field $B_\phi$
    evolves in time.


    The coil voltage follows from Faraday''s law of induction:


    $$

    V = -N A \frac{dB_\phi}{dt}

    $$


    where $N$ is the number of turns and $A$ is the effective cross-sectional area
    per turn. Time-integrating the voltage signal and dividing by the coil sensitivity
    $NA$ recovers the local toroidal field value; the geometric parameters are provided
    by [count_of_toroidal_magnetic_field_probe](name:count_of_toroidal_magnetic_field_probe)
    and [area_of_toroidal_magnetic_field_probe](name:area_of_toroidal_magnetic_field_probe).


    Probes are mounted on the vacuum vessel wall or plasma-facing surfaces and sampled
    on fast analog-to-digital converters to capture the full temporal evolution of
    the toroidal field. The analogous measurement for the poloidal field component
    is given by [voltage_of_poloidal_magnetic_field_probe](name:voltage_of_poloidal_magnetic_field_probe).


    Sign convention: Positive when $dB_\phi/dt > 0$ for a coil wound in the direction
    of increasing toroidal angle $\phi$.'
  unit: V
  physics_domain: magnetic_field_diagnostics
  links:
  - name:count_of_toroidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  - name:voltage_of_poloidal_magnetic_field_probe
