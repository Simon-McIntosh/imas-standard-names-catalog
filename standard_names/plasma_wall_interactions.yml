- name: effective_charge_at_limiter
  kind: scalar
  status: active
  description: Effective charge number of the local ion mixture in boundary plasma
    immediately adjacent to a plasma-facing limiter surface.
  documentation: 'The effective charge at a limiter quantifies the charge-squared-weighted
    composition of the local positive-ion mixture immediately adjacent to the plasma-facing
    limiter surface. It is the limiter-local specialization of [charge_at_limiter](name:charge_at_limiter).


    $$

    Z_\mathrm{eff} = \frac{\sum_i n_i Z_i^2}{\sum_i n_i Z_i}

    $$


    where $Z_\mathrm{eff}$ is the effective charge number, $n_i$ is the number density
    of ion population $i$ in m$^{-3}$, and $Z_i$ is its positive integer charge number.
    The sum includes positive ion species and charge states, while neutral atoms are
    excluded. A pure hydrogenic ion mixture gives $Z_\mathrm{eff}=1$; admixture of
    multiply charged impurity ions raises the value. The limiter location distinguishes
    this quantity from [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary),
    which is evaluated at the plasma boundary.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:charge_at_limiter
  - name:effective_charge_at_plasma_boundary
  arguments:
  - name: charge_at_limiter
    operator: effective
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/zeff/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-zeff-value
    dd_documentation:
