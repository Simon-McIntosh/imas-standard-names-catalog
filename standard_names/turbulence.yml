- name: parallel_normalized_perturbed_magnetic_field_amplitude
  kind: scalar
  status: draft
  description: Modulus of the complex normalized perturbed magnetic field parallel
    to the equilibrium magnetic field for a gyrokinetic eigenmode. It measures compressional
    magnetic fluctuation strength independent of eigenmode phase.
  documentation: 'Parallel normalized perturbed magnetic field amplitude is the non-negative
    modulus of the complex eigenmode for the magnetic-field perturbation along the
    equilibrium magnetic-field direction. It quantifies the strength of compressional
    magnetic fluctuations after normalization to a positive reference magnetic-field
    magnitude, with the arbitrary complex phase of the eigenmode removed.


    The amplitude is defined by projecting the complex perturbed magnetic field onto
    the equilibrium field direction and normalizing by the reference field magnitude:


    $$

    A_{\delta B_\parallel} = \frac{\left|\hat{\mathbf{b}}\cdot\widetilde{\delta\mathbf{B}}\right|}{B_\mathrm{ref}}

    $$


    where $A_{\delta B_\parallel}$ is the normalized amplitude, $\widetilde{\delta\mathbf{B}}$
    is the complex perturbed magnetic-field eigenfunction, $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$
    is the unit vector along the equilibrium magnetic field, $B_\mathrm{ref}$ is a
    positive reference magnetic-field magnitude in tesla, and the vertical bars denote
    complex modulus. The resulting amplitude has unit 1.


    In linear electromagnetic gyrokinetic theory, the quantity is computed from the
    eigenmode fields after a common eigenfunction normalization has been chosen, either
    from a solved $\delta B_\parallel$ field or from $\delta\mathbf{B}=\nabla\times\delta\mathbf{A}$
    when the vector-potential representation is used. It is commonly analyzed along
    a selected magnetic field line in flux coordinates $(\rho,\theta,\phi)$, where
    $\rho$ labels the magnetic flux surface, $\theta$ is a poloidal angle, and $\phi$
    is the toroidal angle; the variable used along the field line may be parameterized
    by $\theta$ but represents position along the selected field line rather than
    an independent geometric poloidal coordinate.


    Typical values depend strongly on the eigenmode normalization. For physical fluctuation
    estimates, $|\delta B_\parallel|/B_\mathrm{ref}$ is often $10^{-5}$-$10^{-3}$
    in weakly electromagnetic drift-wave cases and $10^{-3}$-$10^{-1}$ in electromagnetic
    or high-beta branches; a normalized eigenfunction can have an order-unity maximum
    when it has been rescaled for numerical convenience.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential_amplitude
