- name: poloidal_neutral_internal_state_energy_diffusivity
  kind: scalar
  status: active
  description: Effective diagonal diffusivity for down-gradient transport of energy
    carried by neutral particles in a specified internal state along poloidal flux
    surfaces.
  documentation: 'The poloidal component of the [effective neutral internal-state
    energy diffusivity](name:effective_neutral_internal_state_energy_diffusivity)
    tensor expresses effective Fickian transport of energy carried by neutral particles
    occupying a specified internal state. It acts along the poloidal tangent to a
    flux surface, rather than along the magnetic-field direction.


    $$

    \Gamma_{E,\theta}=-D^{\mathrm{eff}}_{E,\theta}\left.\frac{\partial e_{n,s}}{\partial
    \ell_\theta}\right|_{\rho,\phi}

    $$


    Here $\Gamma_{E,\theta}$ is the poloidal energy flux, $D^{\mathrm{eff}}_{E,\theta}$
    is this diffusivity, $e_{n,s}$ is the energy density of neutral particles in internal
    state $s$, and $\ell_\theta$ is distance along the poloidal tangent. The coordinates
    $(\rho,\theta,\phi)$ are the flux-surface, poloidal-angle, and toroidal-angle
    coordinates; the derivative is taken at fixed $\rho$ and $\phi$.


    This effective coefficient represents the net phenomenological response, not a
    single microscopic mechanism. Its directional and state scope is shared by the
    [poloidal neutral internal-state energy diffusion coefficient](name:poloidal_neutral_internal_state_energy_diffusion_coefficient),
    while the parallel counterpart resolves transport along magnetic field lines.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:effective_neutral_internal_state_energy_diffusivity
  - name:poloidal_neutral_internal_state_energy_diffusion_coefficient
