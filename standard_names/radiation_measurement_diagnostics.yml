- name: detector_channel_wavelength_lower_bound
  kind: scalar
  status: draft
  description: Lower bound of the detector channel spectral sensitivity range, defining
    the short-wavelength cutoff below which detector response (or combined optical-detector
    transmittance) falls to a negligible or specified threshold level. Together with
    the upper bound, it delimits the channel passband $[\lambda_{\min}, \lambda_{\max}]$.
  documentation: "The lower wavelength bound $\\lambda_{\\min}$ is the short-wavelength\
    \ edge of the spectral window for a named detector channel. It is defined as the\
    \ wavelength at which the channel spectral response function $R(\\lambda)$ \u2014\
    \ accounting for detector quantum efficiency, optical coatings, and any in-line\
    \ filter \u2014 falls to a specified threshold (commonly 1% or 10% of peak, or\
    \ the half-power point at $R(\\lambda_{\\min}) = R_{\\max}/2$). The convention\
    \ requires $\\lambda_{\\min} < \\lambda_{\\max}$, where $\\lambda_{\\max}$ is\
    \ the corresponding upper bound.\n\nThe detected signal $S$ integrated over the\
    \ passband is\n$$S = \\int_{\\lambda_{\\min}}^{\\lambda_{\\max}} R(\\lambda)\\\
    , I(\\lambda)\\, d\\lambda,$$\nwhere $I(\\lambda)$ is the spectral radiance incident\
    \ on the detector. Accurate knowledge of $\\lambda_{\\min}$ is therefore essential\
    \ for interpreting line-integrated photon fluxes, evaluating continuum or line\
    \ emission contributions, and cross-calibrating channels with overlapping spectral\
    \ ranges.\n\nTypical values span a wide range depending on diagnostic type: roughly\
    \ 300\u2013400 nm for near-UV visible-light cameras, 600\u2013800 nm for visible\
    \ CCD-based spectroscopy, and below 1 nm for soft X-ray crystal spectrometers.\
    \ The cutoff is set by the combined response of the detector material, optical\
    \ coatings, bandpass filters, and any other wavelength-selective element in the\
    \ optical path.\n\nThis quantity is the channel-specific form of the detector\
    \ lower wavelength bound; see also `detector_wavelength_lower_bound` for the channel-agnostic\
    \ variant and `detector_channel_sensitive_wavelength_lower_bound` for the form\
    \ explicitly labeled as defining the sensitive spectral window."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:detector_channel_sensitive_wavelength_lower_bound
  - name:detector_wavelength_lower_bound
  - name:optical_filter_central_wavelength
  constraints: []
  sources:
  - id: dd:camera_visible/channel/detector/wavelength_lower
    dd_path: camera_visible/channel/detector/wavelength_lower
    status: composed
- name: diameter_of_optical_channel_image_plane
  kind: scalar
  status: draft
  description: Diameter of the optical image formed at the focal plane of a charge-exchange
    recombination spectroscopy collection channel. Equal to the fiber-core diameter
    multiplied by the optical magnification of the collection system, reducing to
    the fiber-core diameter when magnification is unity.
  documentation: 'In a charge-exchange recombination spectroscopy (CXRS) diagnostic,
    each optical channel focuses plasma emission onto an optical fiber. The image-plane
    diameter $d_\mathrm{im}$ is the projected size of the fiber entrance aperture
    at the focal plane of the collection optics. The general relation is


    $$d_\mathrm{im} = M \, d_\mathrm{fiber}$$


    where $M$ is the optical magnification of the collection system and $d_\mathrm{fiber}$
    is the physical fiber-core diameter. For a unit-magnification ($M = 1$) system,
    $d_\mathrm{im}$ equals $d_\mathrm{fiber}$ directly. For $M \neq 1$, the image-plane
    diameter differs from the fiber-core diameter, and both quantities are needed
    to fully characterize the optical channel.


    This quantity contributes to the spatial resolution of the observation chord and
    influences the optical throughput. Typical values for CXRS systems range from
    approximately 0.2 mm to 2 mm, depending on fiber type, collection optics design,
    and desired spatial sampling resolution.


    When the fiber image cross-section departs from a perfect circle, the complementary
    shape parameter [ellipticity_of_optical_fiber_image_cross_section](name:ellipticity_of_optical_fiber_image_cross_section)
    provides the additional geometric characterization needed to fully describe the
    aperture. The closely related name [image_plane_diameter](name:image_plane_diameter)
    covers the same physical concept without the explicit optical-channel qualification.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:ellipticity_of_optical_fiber_image_cross_section
  - name:image_plane_diameter
  constraints: []
  sources:
  - id: dd:charge_exchange/channel/image_diameter
    dd_path: charge_exchange/channel/image_diameter
    status: composed
- name: ellipticity_of_optical_fiber_image_cross_section
  kind: scalar
  status: draft
  description: Axis ratio (minor axis b divided by major axis a) of the elliptic cross-sectional
    shape of an optical fiber image on the focal plane, quantifying deviation from
    circularity. A value of 1 indicates a perfectly circular image; values less than
    1 indicate increasing ellipticity. Note that some conventions define ellipticity
    as 1 - b/a or as the eccentricity sqrt(1 - b^2/a^2); this quantity uses the axis-ratio
    definition b/a.
  documentation: "## Ellipticity of Optical Fiber Image Cross-Section\n\nThis quantity\
    \ is the dimensionless axis ratio\n\n$$e = \\frac{b}{a}, \\quad 0 < e \\leq 1,$$\n\
    \nwhere $a$ is the semi-major axis and $b$ is the semi-minor axis of the best-fit\
    \ ellipse to the fiber image cross-section on the detector focal plane. The best-fit\
    \ ellipse is typically obtained by second-moment (intensity-weighted) analysis\
    \ of the recorded spot image:\n\n$$\\mu_{20} = \\langle (x - \\bar{x})^2 \\rangle,\
    \ \\quad \\mu_{02} = \\langle (y - \\bar{y})^2 \\rangle, \\quad \\mu_{11} = \\\
    langle (x - \\bar{x})(y - \\bar{y}) \\rangle,$$\n\nfrom which the semi-axes are\n\
    \n$$a, b = \\sqrt{\\frac{\\mu_{20} + \\mu_{02}}{2} \\pm \\sqrt{\\left(\\frac{\\\
    mu_{20} - \\mu_{02}}{2}\\right)^2 + \\mu_{11}^2}}.$$\n\n### Definition and conventions\n\
    \nThe axis-ratio definition $e = b/a$ used here satisfies $e = 1$ for a perfect\
    \ circle and $e \\to 0$ for a highly elongated ellipse. **This definition differs\
    \ from two other common conventions** that should not be confused with it:\n\n\
    - *Geometric eccentricity*: $\\varepsilon = \\sqrt{1 - b^2/a^2}$, which equals\
    \ 0 for a circle and approaches 1 for a highly elongated ellipse.\n- *Flattening\
    \ (oblateness)*: $f = 1 - b/a$, which equals 0 for a circle.\n\nThis quantity\
    \ uses exclusively the axis-ratio convention $e = b/a$. Eccentricity $\\varepsilon$\
    \ and flattening $f$ can be recovered as $\\varepsilon = \\sqrt{1 - e^2}$ and\
    \ $f = 1 - e$.\n\n### Physical context\n\nFor a well-designed and well-aligned\
    \ spectrometer, the fiber image on the focal plane is ideally circular ($e = 1$).\
    \ Deviations arise from:\n\n- Optical aberrations (astigmatism, coma) in the coupling\
    \ optics or spectrometer fore-optics.\n- Mechanical misalignment of the fiber\
    \ with respect to the optical axis.\n- Non-uniform illumination of the fiber face.\n\
    - Intrinsic fiber geometry (e.g., non-circular fiber cores).\n\n**Typical values**:\
    \ For well-aligned systems, $e$ is typically in the range $0.90$\u2013$1.00$.\
    \ Values below $\\sim 0.85$ indicate significant aberration or misalignment and\
    \ may degrade spectral resolution and throughput uniformity across the fiber bundle.\n\
    \n### Impact on spectroscopic measurements\n\nEllipticity of the fiber image affects\
    \ the effective spectral resolution: an elongated image oriented along the dispersion\
    \ direction of the spectrometer broadens the instrumental profile, increasing\
    \ the effective instrument function width. Monitoring $e$ is therefore a diagnostic\
    \ for optical alignment quality and for estimating contributions to spectral line-shape\
    \ uncertainty.\n\nSee also the related quantity `diameter_of_optical_channel_image_plane`\
    \ for the image-plane spot size, which is governed by the geometric relation $d_{\\\
    mathrm{image}} = d_{\\mathrm{fiber}} \\times M$ where $M$ is the optical magnification."
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:optical_fiber_image_ellipticity
  - name:image_plane_diameter
  constraints: []
  sources:
  - id: dd:spectrometer_visible/channel/fibre_image/circular/ellipticity
    dd_path: spectrometer_visible/channel/fibre_image/circular/ellipticity
    status: composed
- name: first_coordinate_of_crystal_outline
  kind: scalar
  status: draft
  description: First local coordinate (X1) of vertices defining the polygonal boundary
    of the dispersing crystal element in its local (X1, X2) instrument reference frame.
  documentation: 'The crystal outline is described as a closed polygon in the local
    instrument coordinate system $(X1, X2)$, where $X1$ and $X2$ are orthogonal axes
    fixed to the crystal element and defined by the diagnostic geometry. This quantity
    gives the $X1$-coordinate positions of the polygon vertices that bound the active
    dispersing surface of the crystal, enabling accurate solid-angle and ray-tracing
    calculations for X-ray crystal spectrometer channels. The companion coordinate
    [second_coordinate_of_crystal_outline](name:second_coordinate_of_crystal_outline)
    provides the $X2$ positions of the same vertices; together the two arrays fully
    specify the crystal boundary polygon. Analogous outline coordinates exist for
    other optical elements in the spectrometer: [first_coordinate_of_reflector_outline](name:first_coordinate_of_reflector_outline)
    and [first_coordinate_of_aperture_outline](name:first_coordinate_of_aperture_outline)
    follow the same geometric convention. Typical vertex coordinate magnitudes are
    on the order of millimeters to a few centimeters, reflecting the physical size
    of crystal elements used in X-ray crystal spectrometers.


    Sign convention: Positive when the vertex position lies in the positive $X1$ direction
    of the local instrument reference frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_coordinate_of_crystal_outline
  - name:first_coordinate_of_reflector_outline
  - name:first_coordinate_of_aperture_outline
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/outline/x1
    dd_path: spectrometer_x_ray_crystal/channel/crystal/outline/x1
    status: composed
- name: first_coordinate_of_filter_window_outline
  kind: scalar
  status: draft
  description: First local coordinate (X1) of vertices defining the polygonal boundary
    of a diagnostic filter window in its local (X1, X2) instrument reference frame.
  documentation: 'The filter window outline is specified as a closed polygon in a
    two-dimensional local coordinate system $(X1, X2)$ attached to the diagnostic
    instrument. This quantity gives the $X1$ position of each vertex of that polygon,
    enabling precise geometric description of rectangular, trapezoidal, or other non-circular
    window apertures used in X-ray and photon diagnostics. Together with [second_coordinate_of_filter_window_outline](name:second_coordinate_of_filter_window_outline),
    the full polygon is reconstructed by iterating over the vertex list. The local
    frame is instrument-specific and is oriented by the unit vectors associated with
    the channel geometry; the $X1$ axis is typically the first transverse axis of
    the optical assembly. Typical vertex coordinates range from a fraction of a millimeter
    to several centimeters depending on the size of the filter window. For circular
    windows, the scalar quantity [radius_of_filter_window](name:radius_of_filter_window)
    provides an alternative parameterization. The analogous coordinate for aperture
    and detector outlines follows the same pattern as [first_coordinate_of_aperture_outline](name:first_coordinate_of_aperture_outline)
    and [first_coordinate_of_detector_outline](name:first_coordinate_of_detector_outline).


    Sign convention: Positive when the vertex position lies in the positive $X1$ direction
    of the local instrument coordinate frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_coordinate_of_filter_window_outline
  - name:radius_of_filter_window
  - name:first_coordinate_of_aperture_outline
