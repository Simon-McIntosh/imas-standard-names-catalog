    dd_path: summary/local/separatrix_average/n_i/beryllium/value
    status: composed
- name: flux_surface_averaged_boron_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total boron number density on a magnetic
    flux surface, summed over neutral boron atoms and all ionization states from B+
    through B5+.
  documentation: 'Flux-surface-averaged boron density is the total elemental boron
    number density averaged over a magnetic flux surface labeled by [poloidal magnetic
    flux](name:poloidal_magnetic_flux) $\psi$ in flux coordinates $(\psi,\theta,\phi)$,
    where $\theta$ is a poloidal angle and $\phi$ is the toroidal angle. It includes
    neutral boron and ionized charge states from B$^+$ through B$^{5+}$, so the species-level
    density is charge-state-summed rather than charge-state-resolved.


    The flux-surface average on the surface $\psi=\mathrm{constant}$ is defined by
    the inverse-$B_p$ weighted contour average in an axisymmetric toroidal equilibrium:


    $$

    \langle n_\mathrm{B} \rangle_\psi =

    \frac{\oint_{\psi} n_\mathrm{B}(\ell)\, d\ell / B_p(\ell)}

    {\oint_{\psi} d\ell / B_p(\ell)}

    $$


    where $\ell$ is arclength along the closed poloidal contour, $B_p$ is the poloidal
    magnetic-field magnitude on that contour, and $n_\mathrm{B}$ is the local total
    boron density. The local total is the charge-state sum $n_\mathrm{B}=\sum_{z=0}^{5}
    n_\mathrm{B}^{(z)}$, where $n_\mathrm{B}^{(z)}$ denotes boron in charge state
    $z$.


    In practice, the local boron distribution is inferred from vacuum ultraviolet
    spectroscopy, charge-exchange recombination spectroscopy, soft X-ray measurements,
    and collisional-radiative modeling, while equilibrium reconstruction supplies
    the flux-surface geometry and the $B_p$ weighting. This quantity is the flux-surface
    counterpart of [boron_density](name:boron_density), [volume_averaged_boron_density](name:volume_averaged_boron_density),
    and [line_averaged_boron_density](name:line_averaged_boron_density). Charge-state-resolved
    local contributions are represented by [boron_density_z0], [boron_density_z1],
    [boron_density_z2], [boron_density_z3], [boron_density_z4], and [boron_density_z5]
    when individual ionization stages are needed; a global concentration measure is
    [boron_fraction](name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density).


    Typical flux-surface-averaged boron densities near the confined-plasma edge or
    separatrix are $10^{16}$-$10^{18}$ m$^{-3}$, varying with wall conditioning, boronization
    history, impurity screening, and transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_magnetic_flux
  - name:boron_density
  - name:volume_averaged_boron_density
  - name:line_averaged_boron_density
  - name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  arguments:
  - name: boron_density
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/boron/value
    dd_path: summary/local/separatrix_average/n_i/boron/value
    status: composed
- name: flux_surface_averaged_carbon_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total elemental carbon number density on
    a closed magnetic surface. The local carbon density is summed over all charge
    states from neutral carbon to fully stripped carbon before averaging.
  documentation: 'Flux-surface-averaged carbon density is the mean total elemental
    carbon number density on a closed magnetic flux surface. The local carbon density
    is summed over all charge states from neutral carbon through fully stripped carbon
    before averaging, matching the charge-state scope of [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    and [line_averaged_carbon_density](name:line_averaged_carbon_density) while using
    a magnetic-surface average.


    For an axisymmetric closed surface labeled by the poloidal magnetic flux $\psi$,
    the flux-surface average over the closed poloidal contour is


    $$

    \langle n_C \rangle_\psi = \frac{\oint_\psi n_C(R,Z)\, R\, dl / |\nabla\psi|}{\oint_\psi
    R\, dl / |\nabla\psi|}

    $$


    where $n_C = \sum_{q=0}^{6} n_{\mathrm{C},q}$ is the total carbon density, $n_{\mathrm{C},0}$
    is neutral carbon, and $n_{\mathrm{C},6}$ is fully stripped carbon. The contour
    lies in a poloidal cross-section of the right-handed cylindrical $(R,\phi,Z)$
    frame, with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical
    height; $dl$ is the arc-length element in meters, $\psi$ is in webers, and $|\nabla\psi|$
    is in Wb m$^{-1}$. The denominator normalizes the geometric weighting so the result
    retains units of m$^{-3}$.


    In practice, local charge-state densities are estimated from impurity spectroscopy,
    charge-exchange recombination measurements when available, collisional-radiative
    modeling, and particle-balance constraints for weakly observed charge states.
    A magnetic equilibrium maps those local estimates to the same closed flux surfaces
    used for [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density),
    and the charge-state sum is formed consistently before applying the average.


    Representative edge-plasma values are commonly $10^{16}-10^{18}\ \mathrm{m}^{-3}$
    in carbon-wall or carbon-seeded conditions, with smaller values possible in low-carbon
    metal-wall plasmas and larger transient values during sputtering or injection
    events. Comparison with [ratio_of_carbon_density_to_electron_density](name:ratio_of_carbon_density_to_electron_density)
    expresses the carbon burden relative to electrons, while [carbon_density_at_magnetic_axis](name:carbon_density_at_magnetic_axis)
    gives the corresponding central local value. The analogous [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density)
    applies the same magnetic-surface average to iron.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_iron_density
  - name:ratio_of_carbon_density_to_electron_density
  arguments:
  - name: carbon_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_carbon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of carbon ions at the plasma boundary
    (separatrix), summed over all ionization stages from singly ionized C+ through
    fully stripped C6+.
  documentation: 'The flux-surface-averaged carbon ion number density at the plasma
    boundary is the mean of the local carbon ion count per unit volume over the last
    closed flux surface that separates the magnetically confined plasma from the open
    scrape-off layer. The averaging eliminates poloidal asymmetries along the separatrix
    contour and yields a single representative scalar for total carbon impurity content,
    summed over all charge states from C+ through fully stripped C6+ (atomic number
    $Z_C = 6$).


    The flux-surface average is defined as:


    $$

    \langle n_C \rangle = \frac{\oint n_C \, dl/B}{\oint dl/B}

    $$


    where $n_C$ is the local carbon number density summed over all ionization states,
    $B$ is the magnetic field magnitude, and the line integral runs along the poloidal
    contour of the plasma boundary flux surface.


    Carbon enters the plasma primarily through physical sputtering and chemical erosion
    of carbon-based plasma-facing components; its concentration at the separatrix
    reflects edge wall source rates, cross-field diffusion, and parallel transport
    in the scrape-off layer. The boundary value is inferred from passive spectroscopy
    of carbon emission lines or active charge-exchange recombination spectroscopy,
    or computed by impurity transport simulations tracking wall sources.


    This quantity is the flux-surface-averaged transformation of its parent [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary),
    which gives the local (non-averaged) separatrix density. The volume-integrated
    carbon content is captured by [carbon_density](name:carbon_density). Analogous
    flux-surface-averaged boundary densities exist for other impurity species: [flux_surface_averaged_oxygen_density_at_plasma_boundary],
    [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary),
    and [flux_surface_averaged_iron_density_at_plasma_boundary](name:flux_surface_averaged_iron_density_at_plasma_boundary).


    Sign convention: Positive when carbon ions are present at the plasma boundary;
    zero in the carbon-free limit.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:carbon_density_at_plasma_boundary
  - name:carbon_density
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  - name:flux_surface_averaged_iron_density_at_plasma_boundary
  arguments:
  - name: carbon_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
