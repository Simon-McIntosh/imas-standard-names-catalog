name: coolant_inlet_pressure_of_breeding_blanket_module
status: draft
cocos_transformation_type: one_like
description: Static pressure of the coolant fluid at the inlet manifold of a breeding
  blanket module, before heat exchange with the blanket structure.
documentation: "The coolant inlet pressure $p_{\\mathrm{in}}$ is the thermodynamic\
  \ pressure measured at the point where the coolant (typically pressurized water\
  \ at 15\u201316 MPa for WCLL concepts, or helium at 8 MPa for HCPB concepts) enters\
  \ a breeding blanket module. Together with the outlet pressure, it determines the\
  \ pressure drop $\\Delta p = p_{\\mathrm{in}} - p_{\\mathrm{out}}$ across the module,\
  \ which governs the required pumping power $P_{\\mathrm{pump}} \\approx \\dot{V}\
  \ \\Delta p$, where $\\dot{V}$ is the volumetric flow rate in m$^3$/s. Typical inlet\
  \ pressures for water-cooled blanket designs are 15.5 MPa (consistent with pressurized-water-reactor\
  \ technology), while helium-cooled designs operate near 8 MPa. The quantity is monitored\
  \ by pressure transducers installed at the coolant supply headers of each blanket\
  \ module. See also the companion thermal quantities `coolant_inlet_temperature_of_breeding_blanket_module`\
  \ and `coolant_outlet_temperature_of_breeding_blanket_module`, as well as `nuclear_heating_power_of_breeding_blanket`\
  \ for the thermal load driving coolant requirements."
