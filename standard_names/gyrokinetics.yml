- name: parallel_component_of_ion_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Flux-surface and time-averaged parallel component of the ion toroidal
    momentum flux driven by perturbed parallel magnetic field fluctuations $\delta
    B_\parallel$, normalized to the gyrobohm momentum flux scale, evaluated in the
    rotating frame.
  documentation: In nonlinear gyrokinetic turbulence simulations, the toroidal angular
    momentum transported along the parallel magnetic-field direction receives contributions
    from distinct electromagnetic fluctuation channels. This quantity isolates the
    ion species contribution from the perturbed parallel magnetic field $\delta B_\parallel$
    to the parallel component of the normalized toroidal momentum flux $\Pi_\parallel^{\delta
    B_\parallel}$, defined as the flux-surface and time average of $\langle v_\parallel
    \delta B_\parallel \delta f_i \rangle$ projected onto the toroidal $\hat{\phi}$
    direction and normalized by the gyrobohm momentum-flux scale $Q_{\rm gB} = n_i
    m_i v_{ti}^3 / \Omega_i$ (where $n_i$ is the ion density, $m_i$ the ion mass,
    $v_{ti} = \sqrt{T_i/m_i}$ the ion thermal speed, and $\Omega_i = eB/m_i$ the ion
    cyclotron frequency), evaluated in the frame co-rotating with the plasma. The
    perturbed parallel magnetic field $\delta B_\parallel$ arises from finite-beta
    electromagnetic effects and can contribute non-negligibly to momentum transport
    in high-beta plasmas or when electromagnetic fluctuations are strong. This quantity
    complements [parallel component of total-species toroidal momentum flux due to
    perturbed parallel magnetic field](name:parallel_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field),
    which sums over all species, and is distinguished from the binormal-projected
    counterpart [perpendicular component of the same flux](name:perpendicular_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field).
    The parallel vector potential channel is captured separately in [parallel component
    of toroidal momentum flux due to perturbed parallel vector potential](name:parallel_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_vector_potential).
  unit: '1'
  physics_domain: gyrokinetics
