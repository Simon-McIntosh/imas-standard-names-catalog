- name: resistivity_of_passive_structure
  kind: scalar
  status: active
  description: Effective isotropic electrical resistivity of passive conducting-structure
    material, relating local electric field to induced current density and distinct
    from lumped resistance.
  documentation: 'Effective isotropic electrical resistivity characterizes the local
    ohmic response of material in a passive conducting structure carrying induced
    eddy currents. It is a material property and is nonnegative.


    The constitutive relation is


    $$

    \mathbf{E} = \rho\,\mathbf{J}

    $$


    where $\mathbf{E}$ is the local electric-field vector, $\mathbf{J}$ is the induced
    current-density vector, and $\rho$ is the electrical resistivity. Isotropy requires
    the same $\rho$ for every current direction.


    This quantity applies to the conducting material of passive structures, including
    the material represented by [resistivity of the vacuum vessel](name:resistivity_of_vacuum_vessel).
    It excludes geometry-dependent lumped resistance, such as [resistance of the cryostat](name:resistance_of_cryostat),
    which also depends on current-path length and cross-sectional geometry.'
  unit: m.ohm
  physics_domain: magnetic_field_systems
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistance_of_cryostat
  sources:
  - dd_path: pf_passive/loop/resistivity
    dd_version: 4.1.0
