        blanket module at a given time slice. Serves as a thermodynamic boundary condition
        for coolant flow analysis.
      kind: llm
- name: radiated_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Radiated power associated with a single breeder blanket module, abstracting
    over plasma electromagnetic power incident on the module surface, the reflected
    portion, and the absorbed portion retained as a module heat load as distinct radiation
    energy-budget components.
  documentation: 'Radiated power of a breeder blanket module quantifies the rate at
    which plasma electromagnetic emission, chiefly bremsstrahlung continuum and atomic
    line radiation, is assigned to the module-level radiation channel. It is the umbrella
    scalar for the incident photon power crossing onto the module surface and the
    absorbed photon power retained after surface reflection, represented by [incident_radiated_power_of_breeder_blanket_module](name:incident_radiated_power_of_breeder_blanket_module)
    and [absorbed_radiated_power_of_breeder_blanket_module](name:absorbed_radiated_power_of_breeder_blanket_module).


    The radiated-power component for a single module is defined by integrating the
    corresponding radiative surface energy flux over the module surface:


    $$

    P_{\mathrm{rad},c} = \int_{A_m} \Phi_{\mathrm{rad},c}\, dA,\qquad c \in \{\mathrm{inc},\mathrm{abs}\}

    $$


    where $P_{\mathrm{rad},c}$ is the module-level radiated-power component in watts,
    $A_m$ is the module plasma-facing surface, $dA$ is a surface element, $\Phi_{\mathrm{rad},\mathrm{inc}}$
    is the incident photon energy flux density onto that surface, and $\Phi_{\mathrm{rad},\mathrm{abs}}$
    is the retained photon energy flux density after reflection.


    The incident and absorbed components are related by the surface-reflection balance
    $P_{\mathrm{rad},\mathrm{abs}} = P_{\mathrm{rad},\mathrm{inc}} - P_{\mathrm{rad},\mathrm{ref}}$,
    equivalently $P_{\mathrm{rad},\mathrm{abs}} = (1-\mathcal{R})P_{\mathrm{rad},\mathrm{inc}}$
    for an effective reflectance $\mathcal{R}$. The parent quantity is not a sum of
    incident and absorbed terms; it identifies the module radiation channel, while
    the component qualifier identifies which surface-budget term is represented. Neutron
    surface loads, volumetric nuclear energy deposition, auxiliary heating, and thermal
    radiation emitted by the module itself are outside this radiated-power channel;
    the absorbed part contributes to [thermal_power_of_breeder_blanket_module](name:thermal_power_of_breeder_blanket_module)
    within [power_of_breeder_blanket_module](name:power_of_breeder_blanket_module).'
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_radiated_power_of_breeder_blanket_module
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:power_of_breeder_blanket_module
  - name:thermal_power_of_breeder_blanket_module
  arguments:
  - name: power_of_breeder_blanket_module
    operator: radiated
    operator_kind: qualifier
- name: absorbed_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Net photon power retained by a breeding blanket module after reflection
    of incident plasma radiation at its plasma-facing surface.
  documentation: 'The absorbed radiated power of a breeding blanket module is the
    net electromagnetic photon power retained by the module after plasma radiation
    interacts with its plasma-facing surface. It includes absorbed bremsstrahlung
    and atomic line radiation and is the absorbed component of the broader [radiated
    power of a breeder blanket module](name:radiated_power_of_breeder_blanket_module).


    The absorbed power is related to the [incident radiated power of a breeder blanket
    module](name:incident_radiated_power_of_breeder_blanket_module) by:


    $$

    P_\text{abs} = (1 - \mathcal{R}) P_\text{inc}

    $$


    where $P_\text{inc}$ is the incident radiative power, $\mathcal{R}$ is the effective
    hemispherical surface reflectance averaged over the incident photon spectrum,
    and $P_\text{abs}$ is the absorbed radiated power. This quantity excludes photon
    power reflected from the surface and nuclear energy deposited within the module.'
  unit: W
  physics_domain: structural_components
  links:
  - name:radiated_power_of_breeder_blanket_module
  - name:incident_radiated_power_of_breeder_blanket_module
  arguments:
  - name: radiated_power_of_breeder_blanket_module
    operator: absorbed
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/time_slice/power_thermal_radiated
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-power_thermal_radiated
    dd_documentation:
      leaf: Total radiated power (incident - reflected) in the blanket module
      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Net radiated thermal power absorbed by a breeding blanket module,
        calculated as incident radiated power minus reflected power. Represents the
        radiative heat load component deposited in the module.
      kind: llm
- name: incident_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Total electromagnetic radiative power from the plasma arriving at the
    outer surface of a breeding blanket module, including bremsstrahlung and line
    radiation contributions, before accounting for surface reflection losses.
  documentation: 'The incident radiated power of a breeding blanket module is the
    total electromagnetic power from the surrounding plasma that arrives at the module''s
    outer surface, integrated over that surface per unit time. Plasma radiation sources
    contributing to this load include bremsstrahlung from electron-ion Coulomb collisions,
    impurity line radiation, and synchrotron emission, all transported across the
    scrape-off layer to the first-wall and blanket boundary.


    The incident radiative load is defined as:


    $$

    P_\mathrm{inc,rad} = \int_S \mathbf{q}_\mathrm{rad} \cdot \hat{n} \, dA

    $$


    where $\mathbf{q}_\mathrm{rad}$ is the local incident radiative heat-flux vector,
    $\hat{n}$ is the inward surface unit normal, and the integral extends over the
    total module surface area $A$.


    This quantity represents the gross radiative power before surface reflection;
    the net thermally retained fraction is captured by [absorbed_radiated_power_of_breeder_blanket_module](name:absorbed_radiated_power_of_breeder_blanket_module),
    which subtracts the reflected component. Together with nuclear heating quantified
    by [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    this term enters the full surface thermal balance of the blanket and is a key
    input for coolant circuit design and blanket lifetime assessment.'
  unit: W
  physics_domain: structural_components
  links:
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  arguments:
  - name: radiated_power_of_breeder_blanket_module
    operator: incident
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/time_slice/power_incident_radiated
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-power_incident_radiated
    dd_documentation:
      leaf: Total incident radiative power on the blanket module
      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Total incident radiative power (P_rad) deposited on a breeding
        blanket module from plasma radiation, including bremsstrahlung and line radiation
        contributions. A key thermal load parameter for blanket design and power balance
        accounting.
      kind: llm
- name: resistance_of_cryostat
  kind: scalar
  status: active
  description: Resistance of a cryostat passive-conductor element is its lumped ohmic
    opposition to current flow in the conducting vessel or thermal-shield structure.
    It sets Joule dissipation and, with inductance, induced-current decay timescales
    in passive electromagnetic response.
  documentation: 'Resistance of a cryostat passive-conductor element is the scalar
    branch resistance assigned to a localized conducting part of the cryostat passive
    structure. It characterizes the ohmic voltage drop associated with current through
    the conducting vessel or thermal-shield structure.


    The defining relation for a lumped ohmic element is:


    $$

    R = \frac{V}{I}

    $$


    where $R$ is the resistance, $V$ is the voltage across the element in volts, and
    $I$ is the current through the element in amperes, with $V$ and $I$ referenced
    to the same chosen branch direction.


    This quantity is an element-level passive-conductor parameter, not a bulk material
    property; for a homogeneous current path it is related to [resistivity of cryostat](name:resistivity_of_cryostat)
    by the element geometry, such as the inline relation $R = \eta \ell/A$ with resistivity
    $\eta$, current-path length $\ell$, and cross-sectional area $A$. It is distinct
    from [resistance of vacuum vessel](name:resistance_of_vacuum_vessel), which applies
    to passive-conductor elements of the vacuum vessel rather than the cryostat.'
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_cryostat
  - name:resistance_of_vacuum_vessel
  sources:
  - dd_path: cryostat/description_2d/cryostat/unit/element/resistance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/cryostat.html#cryostat-description_2d-cryostat-unit-element-resistance
    dd_documentation:
      leaf: Resistance of the block element
      parent_path: cryostat/description_2d/cryostat/unit/element
      parent: Set of block elements
      data_type: FLT_0D
      unit: ohm
    enhanced_context:
      description: Electrical resistance (R) of a block element of the cryostat passive
        conductor structure. Used in electromagnetic and eddy-current analyses of
        the conducting segments of the cryostat.
      kind: llm
  - dd_path: cryostat/description_2d/thermal_shield/unit/element/resistance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/cryostat.html#cryostat-description_2d-thermal_shield-unit-element-resistance
    dd_documentation:
      leaf: Resistance of the block element
      parent_path: cryostat/description_2d/thermal_shield/unit/element
      parent: Set of block elements
      data_type: FLT_0D
      unit: ohm
    enhanced_context:
