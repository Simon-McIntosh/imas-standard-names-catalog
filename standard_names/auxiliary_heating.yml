    dd_path: ec_launchers/beam/power_launched
    status: composed
- name: pressure_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Pressure of an ion cyclotron heating antenna is the scalar normal load
    per unit area associated with antenna module media or interfaces. It denotes absolute
    thermodynamic pressure for gas or liquid in antenna volumes and nonnegative compressive
    contact pressure for solid hardware interfaces.
  documentation: 'Pressure of an ion cyclotron heating antenna is the scalar pressure
    characterizing normal compressive loading in or on an ion cyclotron heating antenna
    module. For a gas or liquid, it is the absolute thermodynamic pressure of the
    medium, with zero corresponding to perfect vacuum. For a solid interface, it is
    the nonnegative compressive contact pressure; tensile normal stress and shear
    stress are not included.


    The shared mechanical interpretation is normal compressive force per unit area:


    $$

    p = \frac{F_c}{A}

    $$


    where $p$ is pressure in Pa, $F_c$ is the compressive normal force in N transmitted
    by the medium or contact, and $A$ is the averaging area in m^2. For a fluid at
    rest this scalar is the isotropic normal stress on a surface; for hardware contact
    it is the compressive part of the normal traction averaged over the actual or
    effective contact area.


    Gas or liquid pressure is measured with pressure transducers connected to antenna
    volumes, feed lines, or cooling circuits; if an instrument reports gage pressure,
    the reference pressure is added to obtain absolute pressure. Contact pressure
    is measured by force or contact-pressure sensors, or inferred from known preload,
    electromagnetic load, and contact area in a mechanical model. The related [gas_pressure_of_ion_cyclotron_heating_antenna](name:gas_pressure_of_ion_cyclotron_heating_antenna)
    is restricted to the neutral-gas thermodynamic component and excludes liquid-coolant
    and mechanical or interface contact pressure.


    Representative values are strongly medium dependent. Neutral-gas absolute pressures,
    liquid-circuit pressures, and local contact pressures can differ by many orders
    of magnitude, so no single numerical range is physically meaningful for the combined
    concept; comparisons should be made within the identified medium or interface
    and in Pa.'
  unit: Pa
  physics_domain: auxiliary_heating
  links:
  - name:gas_pressure_of_ion_cyclotron_heating_antenna
  - name:resistance_of_ion_cyclotron_heating_antenna
  - name:frequency_of_ion_cyclotron_heating_antenna
- name: gas_pressure_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Gas-phase absolute pressure associated with the neutral gas volume
    of an ion cyclotron heating antenna. It excludes mechanical contact or structural
    pressure and is nonnegative relative to perfect vacuum.
  documentation: 'Gas pressure of an ion cyclotron heating antenna is the thermodynamic
    pressure exerted by neutral gas in the antenna-associated vacuum volume. It is
    the gas component of antenna pressure and excludes mechanical contact pressure,
    structural stress, or electromagnetic force density. The quantity is an absolute
    pressure, with zero corresponding to perfect vacuum, not a gage pressure relative
    to atmospheric pressure.


    For a dilute gas close to thermal equilibrium, it may be related to neutral species
    densities and gas temperatures by the ideal-gas approximation:


    $$

    p_\mathrm{gas} = \sum_s n_s k_B T_s

    $$


    where $p_\mathrm{gas}$ is the gas pressure in Pa, $n_s$ is the number density
    of neutral species $s$ in m^-3, $T_s$ is its gas temperature in K, and $k_B$ is
    the Boltzmann constant in J K^-1. This relation assumes a dilute gas, known composition,
    and a representative gas temperature; nonuniform temperature, rarefaction near
    surfaces, and species-dependent gage sensitivity can make the inferred pressure
    differ from a simple density measure.


    The quantity is normally obtained from absolute vacuum gages or pressure transducers
    coupled to the antenna region. Capacitance manometers measure absolute pressure
    directly over their range, while ionization or cold-cathode gages infer pressure
    from ionization current and require calibration for gas species. RF operation,
    outgassing, pumping conductance, and gas injection can produce local and transient
    pressure changes.


    Representative values are strongly operating-regime dependent. High-vacuum background
    pressures near antenna structures are often about $10^{-7}$-$10^{-4}$ Pa; RF conditioning,
    outgassing, or deliberate gas dosing commonly produces $10^{-4}$-$10^{-1}$ Pa,
    with short poor-vacuum or conditioning transients sometimes approaching $1$ Pa.
    The physically valid range is $p_\mathrm{gas} \ge 0$; negative values indicate
    gage offset, subtraction of a reference, or an unconverted gage-pressure convention
    rather than a physical gas pressure.'
  unit: Pa
  physics_domain: auxiliary_heating
