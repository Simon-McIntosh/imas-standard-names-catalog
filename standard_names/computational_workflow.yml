- name: upper_uncertainty_of_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the toroidal flux coordinate
    $\rho_{\mathrm{tor}}$.
  documentation: This quantity is the positive (upper) error bar on [toroidal_flux_coordinate](name:toroidal_flux_coordinate).
    The asymmetric uncertainty model gives a confidence interval $[\rho_{\mathrm{tor}}
    - \delta\rho_{\mathrm{lower}},\; \rho_{\mathrm{tor}} + \delta\rho_{\mathrm{upper}}]$,
    where $\delta\rho_{\mathrm{upper}}$ is this field. Uncertainty in $\rho_{\mathrm{tor}}$
    originates from errors in the toroidal flux $\Phi_{\mathrm{tor}}$ and the reference
    field $B_0$ that propagate through the definition $\rho_{\mathrm{tor}} = \sqrt{\Phi_{\mathrm{tor}}/(\pi
    B_0)}$. See also [lower_uncertainty_of_toroidal_flux_coordinate](name:lower_uncertainty_of_toroidal_flux_coordinate)
    and [toroidal_flux_coordinate](name:toroidal_flux_coordinate).
  unit: m
