- name: frequency_of_diagnostic_antenna
  kind: scalar
  status: active
  description: Temporal oscillation frequency assigned to a coherent electromagnetic
    probing wave, defining the wave-frequency coordinate for plasma interaction.
  documentation: 'This quantity is the temporal oscillation rate of a coherent electromagnetic
    wave used to probe a plasma. It characterizes the selected probing wave itself
    rather than the amplitude or phase of the associated signal.


    The temporal frequency is related to angular frequency by


    $$

    f = \frac{\omega}{2\pi}

    $$


    where $f$ is the temporal frequency, $\omega$ is the angular frequency of the
    wave, and $\pi$ is the mathematical circle constant.


    The quantity applies to the probing-wave frequency associated with an electromagnetic
    diagnostic channel. During a frequency sweep, each value identifies one probing
    frequency and therefore one frequency-dependent plasma interaction; for electron-cyclotron
    emission it identifies the frequency associated with the probed cyclotron harmonic,
    while for reflectometry it determines the corresponding cutoff-layer condition.
    It is a frequency value, not a sweep duration, frequency bandwidth, or fluctuation
    amplitude.


    The quantity is the channel-associated form of [wave_frequency](name:wave_frequency);
    [reference_frequency_of_wave_beam](name:reference_frequency_of_wave_beam) denotes
    a reference carrier frequency specified before frequency conversion or mode-specific
    processing.'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: ece/channel/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-frequency
    dd_documentation:
      leaf: Frequency of the channel
      parent_path: ece/channel
      parent: Set of channels (frequency)
      data_type: STRUCTURE
      unit: Hz
    enhanced_context:
      description: Measurement frequency of an electron cyclotron emission (ECE) channel,
        corresponding to the cyclotron harmonic resonance frequency probed. Determines
        the radial measurement position of the electron temperature (Te) via the magnetic
        field profile.
      kind: llm
