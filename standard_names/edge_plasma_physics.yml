- name: radial_component_of_e_cross_b_drift_velocity
  kind: scalar
  status: draft
  description: "Major-radius ($R$) component of the E\xD7B drift velocity, arising\
    \ from the cross product of the electric field and magnetic field divided by the\
    \ squared magnetic field magnitude."
  documentation: "The E\xD7B drift velocity is a fundamental plasma drift given by\
    \ $\\mathbf{v}_{E\\times B} = (\\mathbf{E} \\times \\mathbf{B}) / B^2$, where\
    \ $\\mathbf{E}$ is the electric field and $\\mathbf{B}$ is the magnetic field.\
    \ This quantity is the projection of that drift onto the major-radius direction\
    \ $\\hat{R}$ in the right-handed cylindrical $(R, \\phi, Z)$ frame, yielding $v_{E\\\
    times B,R} = (\\mathbf{v}_{E\\times B}) \\cdot \\hat{R}$. Unlike species-dependent\
    \ drifts such as the [ion diamagnetic drift](name:radial_component_of_ion_diamagnetic_drift_velocity),\
    \ the E\xD7B drift is identical for all charged species and for neutral particles\
    \ advected by it, making it a key driver of cross-field transport in the edge\
    \ plasma. In the edge and scrape-off layer, the radial E\xD7B velocity can reach\
    \ tens to hundreds of m/s, contributing significantly to radial particle and heat\
    \ transport. It is commonly inferred from plasma potential profiles measured by\
    \ Langmuir probes or beam emission spectroscopy combined with magnetic equilibrium\
    \ data. The parent vector quantity is [e_cross_b_drift_velocity](name:e_cross_b_drift_velocity),\
    \ and the radial neutral bulk flow [radial_component_of_neutral_velocity](name:radial_component_of_neutral_velocity)\
    \ may include this drift as a component.\n\nSign convention: Positive when the\
    \ E\xD7B drift is directed toward increasing major radius $R$ (outward radially\
    \ in the cylindrical $(R, \\phi, Z)$ frame)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_component_of_ion_diamagnetic_drift_velocity
  - name:e_cross_b_drift_velocity
  - name:radial_component_of_neutral_velocity
  constraints: []
