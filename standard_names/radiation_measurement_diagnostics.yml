  documentation: "The radial coordinate of a filter window is the major-radius coordinate\
    \ $R$ locating the geometric center of the filter-window surface relative to the\
    \ toroidal symmetry axis.\n\nFor Cartesian coordinates of the geometric center,\
    \ the major radius is defined by\n\n$$\nR = \\sqrt{x^2+y^2}\n$$\n\nwhere $R$ is\
    \ the major-radius coordinate, and $x$ and $y$ are the Cartesian coordinates in\
    \ the right-handed Cartesian basis $(\\hat{x},\\hat{y},\\hat{z})$. In the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, $\\phi$ is the toroidal angle and $Z$ is\
    \ the vertical coordinate.\n\nThis quantity applies to each filter-window center\
    \ individually and is not an average, integral, or radial size of the window.\
    \ It identifies the center position of the filter window, including circular or\
    \ rectangular window geometries, and excludes the [radius of the filter window](name:radius_of_filter_window),\
    \ which describes the window\u2019s spatial extent.\n\nThis is the filter-window-specific\
    \ realization of the general [radial coordinate](name:radial_coordinate). The\
    \ complete center position is described jointly with the [toroidal coordinate\
    \ of the filter window](name:toroidal_coordinate_of_filter_window) and the [vertical\
    \ coordinate of the filter window](name:vertical_coordinate_of_filter_window)."
