name: electron_pressure_pedestal_maximum_gradient_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate $\psi_N$ at which the gradient of
  the electron pressure profile is steepest in the pedestal.
documentation: "The maximum gradient position identifies the $\\psi_N$ location where\
  \ $|dp_e/d\\psi_N|$ reaches its peak within the pedestal barrier, representing the\
  \ inflection point of the mtanh fit to the $p_e(\\psi_N)$ profile. For symmetric\
  \ mtanh profiles this coincides with the pedestal center, but asymmetric pedestals\
  \ (finite mtanh $\\alpha$ parameter) shift the steepest gradient outward. Typical\
  \ values lie at $\\psi_N \\approx 0.94$\u2013$0.98$ in standard H-mode discharges.\
  \ This location is a key input for local stability analysis (e.g., infinite-$n$\
  \ ballooning) and for anchoring inter-ELM transport models. See also `electron_pressure_pedestal_position`,\
  \ `electron_temperature_pedestal_maximum_gradient_position`."
validity_domain: ''
