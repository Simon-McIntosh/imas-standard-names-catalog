    status: composed
- name: parallel_heat_flux
  kind: scalar
  status: draft
  description: Power flux density carried by particles and heat along the magnetic
    field line, measured by Langmuir probes in the scrape-off layer.
  documentation: 'The parallel heat flux density $q_{\parallel}$ quantifies the thermal
    energy transported per unit area per unit time along the magnetic field direction.
    For a Langmuir probe, it is inferred from the measured ion saturation current
    and electron temperature using the relation $q_{\parallel} = \gamma k_B T_e j_{\text{sat}}$,
    where $\gamma \approx 7\!-\!8$ is the sheath heat transmission coefficient. In
    the scrape-off layer of diverted tokamaks, $q_{\parallel}$ at the outer midplane
    typically ranges from $1\!-\!100\;\text{MW}\,\text{m}^{-2}$, with the exact value
    depending on the upstream density and heating power. Together with the scrape-off
    layer heat flux decay length, $q_{\parallel}$ determines the divertor target peak
    heat load critical for power exhaust design. This quantity is the parallel component
    of the total [heat flux](name:heat_flux) and complements measurements of [electron
    density](name:electron_density) from the same probe.


    Sign convention: Positive when the heat flows in the direction of increasing poloidal
    angle (i.e., along the magnetic field toward the outboard midplane).'
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:heat_flux
  - name:electron_density
  arguments:
  - name: heat_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:langmuir_probes/probe/heat_flux_parallel
    dd_path: langmuir_probes/probe/heat_flux_parallel
    status: composed
- name: vertical_coordinate_of_langmuir_probe
  kind: scalar
  status: draft
  description: Vertical coordinate (Z) of the collector of a reciprocating Langmuir
    probe in the cylindrical $(R, \phi, Z)$ frame, specifying its position relative
    to the machine midplane.
  documentation: 'The vertical coordinate $Z_{\text{LP}}$ locates the Langmuir probe
    collector along the machine symmetry axis, measured from the midplane. It is essential
    for mapping probe measurements to flux surfaces, especially when the probe plunges
    across the scrape-off layer into the core plasma edge. Typical vertical positions
    range from $-1$ to $+1\,\text{m}$ for medium-size tokamaks. This coordinate is
    paired with $[\text{major\_radius\_of\_langmuir\_probe}](\text{name:major\_radius\_of\_langmuir\_probe})$
    to define the full position in the $(R, \phi, Z)$ frame. Unlike the reciprocating
    probe variant $[\text{vertical\_coordinate\_of\_reciprocating\_probe}](\text{name:vertical\_coordinate\_of\_reciprocating\_probe})$,
    this quantity refers to a static probe installation without plunging motion.


    Sign convention: Positive when the probe is located above the machine midplane.


    The coordinate is measured in meters and is referenced to the machine geometry;
    it is independent of plasma conditions.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:major
  - name:vertical
  sources:
