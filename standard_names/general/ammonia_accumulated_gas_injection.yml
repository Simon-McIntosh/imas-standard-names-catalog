name: ammonia_accumulated_gas_injection
status: draft
cocos_transformation_type: one_like
description: Total number of ammonia (NH$_3$) molecules injected into the vessel,
  accumulated over the discharge.
documentation: 'The accumulated ammonia gas injection counts the total NH$_3$ molecules
  delivered through gas-injection valves over the discharge, expressed as a dimensionless
  particle number: $N_{\mathrm{NH_3,acc}} = \int_0^t \dot{N}_{\mathrm{NH_3}}(t'')\,dt''$,
  where $\dot{N}_{\mathrm{NH_3}}$ is the instantaneous injection rate in $\mathrm{s}^{-1}$.
  Ammonia injection is explored for nitrogen seeding (radiative cooling) and, in some
  devices, for lithium-wall conditioning when combined with lithium surfaces. Typical
  accumulated counts range from $10^{18}$ to $10^{21}$ molecules depending on the
  seeding purpose and vessel volume. The quantity is monotonically non-decreasing
  over time.'
