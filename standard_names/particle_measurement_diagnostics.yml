- name: major_radius_of_neutron_detector_geometric_center
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the geometric center of a neutron detector
    element in the right-handed cylindrical (R, phi, Z) frame.
  documentation: The major radius $R$ locates the geometric center of a neutron detector
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the perpendicular
    distance from the machine symmetry axis in meters. This coordinate is used to
    define the detector position for line-of-sight geometry calculations, neutron
    flux attenuation corrections, and field-of-view modeling of neutron emission profiles.
    Typical values range from roughly 1 m to beyond 8 m depending on the device size
    and whether the detector is installed inside the vacuum vessel, in a diagnostic
    port, or in an external counting hall. The companion vertical position is given
    by [vertical_coordinate_of_diagnostic_component_center](name:vertical_coordinate_of_diagnostic_component_center),
    and the associated emission-grid node positions used to discretize the detector
    field of view are described by [major_radius_of_emission_grid_point](name:major_radius_of_emission_grid_point).
    For geometrically extended detector assemblies the geometric center may differ
    from the collimator or aperture reference point; see [major_radius_of_neutron_detector_reference_point](name:major_radius_of_neutron_detector_reference_point)
    for that alternative locus.
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_diagnostic_component_center
  - name:major_radius_of_emission_grid_point
  - name:major_radius_of_neutron_detector_reference_point
