- name: per_toroidal_mode_fast_ion_power_density
  kind: scalar
  status: active
  description: Coherent-wave power absorbed per unit volume by the nonthermal fast-ion
    population for one toroidal Fourier mode, summed over all included fast-ion charge
    states.
  documentation: 'Per-toroidal-mode fast-ion power density is the local rate of energy
    transfer from a coherent electromagnetic wave to the nonthermal fast-ion population,
    resolved by toroidal Fourier mode and aggregated over included charge states.
    It is a modal component of the [fast-ion power density](name:fast_ion_power_density),
    distinct from power transferred to thermal ions, electrons, or other channels.


    The charge-state aggregation is defined by


    $$

    P_{\mathrm{fast},n_\phi}(\mathbf{x}) = \sum_q P_{\mathrm{fast},q,n_\phi}(\mathbf{x})

    $$


    where $P_{\mathrm{fast},n_\phi}(\mathbf{x})$ is the modal power density, $P_{\mathrm{fast},q,n_\phi}(\mathbf{x})$
    is the corresponding quantity for charge state $q$, $n_\phi$ is the toroidal Fourier
    mode number, and $\mathbf{x}$ is the local plasma position. The charge-state-resolved
    contribution is represented by [per-toroidal-mode fast-ion charge-state power
    density](name:per_toroidal_mode_fast_ion_charge_state_power_density). Under the
    adopted Fourier normalization, summing the modal contributions over $n_\phi$ recovers
    the [fast-ion power density](name:fast_ion_power_density).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_density
