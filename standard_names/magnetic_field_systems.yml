- name: voltage_of_correction_coil
  kind: scalar
  status: draft
  description: Terminal voltage of a non-axisymmetric correction coil is the signed
    electric potential difference between its two electrical terminals. It includes
    the resistive drop and the self- and mutual-inductive voltage associated with
    changing currents.
  documentation: 'Voltage of a correction coil is the signed terminal electric potential
    difference across a coil or conductor that is used to compensate field errors
    or impose controlled non-axisymmetric magnetic perturbations. It is a circuit
    quantity, not a magnetic-field amplitude, and represents the voltage applied to
    or absorbed at the coil terminals.


    For a lumped coupled-circuit model using a passive terminal polarity, the terminal
    voltage of coil $k$ can be written as:


    $$

    V_k = R_k I_k + L_k \frac{d I_k}{dt} + \sum_{j \ne k} M_{kj} \frac{d I_j}{dt}

    $$


    where $V_k$ is the terminal voltage in volts, $R_k$ is the coil resistance in
    ohms, $I_k$ and $I_j$ are currents in amperes, $L_k$ is the self-inductance in
    henries, $M_{kj}$ is the mutual inductance from circuit $j$ to coil $k$ in henries,
    and $t$ is time in seconds. The sign of each $M_{kj}$ is the sign of the flux
    linkage in coil $k$ produced by positive $I_j$, so mutual coupling contributes
    as a signed voltage term.


    The voltage is measured with terminal voltage taps, isolation amplifiers, or calibrated
    power-supply monitors. For analysis it can be computed from measured current waveforms
    together with the coil resistance and the self- and mutual-inductance matrix;
    cable drops, feedthroughs, and power-supply output filters are treated separately
    when the reference terminals do not coincide with the coil terminals.


    Typical values are 1-100 V for slowly varying error-field correction and 100-5000
    V during fast current ramps, resonant magnetic perturbation pulses, or rapid feedback
    action. Steady operation is dominated by $R_k I_k$, while transient operation
    is dominated by $L_k dI_k/dt$ and coupled-current terms.


    Sign convention: Positive when the electric potential at the terminal where positive
    current enters the coil in the chosen winding orientation is greater than the
    electric potential at the terminal where it leaves.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_correction_coil
  - name:resistance_of_correction_coil
  - name:voltage_of_poloidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/voltage
    dd_path: coils_non_axisymmetric/coil/conductor/voltage
    status: attached
  - id: dd:coils_non_axisymmetric/coil/voltage
    dd_path: coils_non_axisymmetric/coil/voltage
    status: composed
- name: voltage_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Terminal voltage across a poloidal field coil winding, equal to the
    sum of the resistive drop and inductive back-EMF presented to the power supply
    circuit.
  documentation: 'The voltage of a poloidal field coil is the electric potential difference
    measured across the coil terminals, combining the ohmic drop through the winding
    resistance and the inductive back-EMF arising from changes in coil current and
    mutual coupling with neighboring coils.


    The terminal voltage is governed by the coil circuit equation:


    $$

    V = R \, I + L \frac{dI}{dt} + \sum_j M_j \frac{dI_j}{dt}

    $$


    where $R$ is the winding resistance, $I$ is the coil current (see [current_of_poloidal_field_coil](name:current_of_poloidal_field_coil)),
    $L$ is the self-inductance, and $M_j$ is the mutual inductance with the $j$-th
    neighboring coil carrying current $I_j$.


    In plasma shape and position control, the power supply imposes this voltage as
    the primary actuator to ramp, sustain, or reduce the coil current, thereby shaping
    the poloidal field and controlling plasma boundaries. Terminal voltage is measured
    directly by transducers at the power supply output or coil junction and is monitored
    continuously for control and protection. Typical values range from near zero during
    steady-state flat-top operation to several kilovolts during fast current transients.
    The analogous quantity for the toroidal system is [voltage_of_toroidal_field_coil](name:voltage_of_toroidal_field_coil),
    and three-dimensional correction coil voltages are described by [voltage_of_correction_coil](name:voltage_of_correction_coil).'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:voltage_of_toroidal_field_coil
  - name:voltage_of_correction_coil
  sources:
  - id: dd:pf_active/coil/voltage
    dd_path: pf_active/coil/voltage
    status: composed
- name: voltage_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Terminal voltage of a toroidal field coil, including the resistive
    voltage drop and the inductive voltage associated with changes in coil current.
  documentation: 'Voltage of a toroidal field coil is the electrical potential difference
    between the two coil terminals for a specified terminal polarity. It represents
    the terminal voltage required to drive the toroidal-field-coil current and the
    voltage developed by the coil circuit during current transients.


    For a lumped circuit representation in which mutual-coupling terms are absent
    or treated separately, the principal passive-sign terminal-voltage relation is:


    $$

    V_{\mathrm{TF}} = R_{\mathrm{TF}} I_{\mathrm{TF}} + L_{\mathrm{TF}} \frac{d I_{\mathrm{TF}}}{dt}

    $$


    where $V_{\mathrm{TF}}$ is the terminal voltage in V, $R_{\mathrm{TF}}$ is the
    effective series resistance in ohms, $I_{\mathrm{TF}}$ is the [toroidal-field-coil
    current](name:current_of_toroidal_field_coil) in A, $L_{\mathrm{TF}}$ is the effective
    self-inductance in H, and $t$ is time in s. The $R_{\mathrm{TF}} I_{\mathrm{TF}}$
    term is the ohmic voltage drop, while the $L_{\mathrm{TF}} dI_{\mathrm{TF}}/dt$
    term is the self-inductive terminal voltage associated with changing the magnetic
    energy stored by the coil.


    The quantity is obtained from calibrated voltage measurement across the coil terminals
    or from a circuit calculation using the measured coil current and effective circuit
    parameters. In a more complete coupled-circuit model, additional mutually induced
    voltage terms may be included, but the terminal voltage remains the signed potential
    difference between the same two connection points.


    Typical magnitudes are strongly machine and operating-mode dependent. During steady-current
    operation they may be near 0 V for superconducting coils or from tens to thousands
    of volts for resistive coils; during ramping or other current transients they
    can range from a few volts to many kilovolts depending on coil inductance and
    $dI_{\mathrm{TF}}/dt$.


    Sign convention: Positive when the terminal at which positive toroidal-field-coil
    current enters the coil conductor is at higher electric potential than the terminal
    from which it leaves.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_toroidal_field_coil
  - name:voltage_of_poloidal_field_coil
  - name:voltage_of_correction_coil
  sources:
  - id: dd:tf/coil/conductor/voltage
    dd_path: tf/coil/conductor/voltage
    status: attached
  - id: dd:tf/coil/voltage
    dd_path: tf/coil/voltage
    status: composed
- name: volume_of_ferritic_element
  kind: scalar
  status: draft
  description: Total physical volume occupied by a ferritic in-vessel element. It
    is a non-negative geometric measure used with material properties and magnetization
    components, with dimensional consistency set by the units of those companion quantities.
  documentation: 'Volume of a ferritic element is the amount of physical space occupied
    by the ferromagnetic material assigned to that element. It excludes voids or non-ferritic
    regions unless they are intentionally homogenized into the element definition.


    The element volume $V_e$ is the volume integral over the material region $\Omega_e$:


    $$

    V_e = \int_{\Omega_e} d^3x

    $$


    where $\Omega_e$ is the region occupied by the ferritic element and $d^3x$ is
    the differential volume element.


    In practice, $V_e$ is computed from a geometric model, mesh, or material inventory
    by summing the volumes of the cells or subregions assigned to the ferritic element.
    For homogenized components, the reported volume should correspond to the effective
    ferritic material volume used in the magnetic model.


    The physical range is $V_e \ge 0$ m^3, with $V_e = 0$ only for an absent or idealized
    zero-volume element. Typical modeled elements range from about $10^{-6}$-$10^{-2}$
    m^3 for small mesh cells or inserts to $10^{-3}$-1 m^3 for larger ferritic structures.


    When combined with ferritic-element magnetization components, the product must
    respect the component units. For a component expressed in A m^-2, multiplying
    by $V_e$ in m^3 gives a quantity with unit A m in that component direction; it
    is not an SI magnetic dipole moment in A m^2 unless the magnetization component
    has first been converted to true magnetization in A m^-1 or an equivalent model
    conversion supplies the missing length factor.'
  unit: m^3
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_ferritic_element
  - name:toroidal_magnetization_of_ferritic_element
  - name:radial_magnetization_of_ferritic_element
  - name:vertical_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/volume
    dd_path: ferritic/object/volume
    status: composed
- name: width_of_correction_coil
  kind: scalar
  status: draft
  description: Full transverse dimension of a non-axisymmetric correction-coil conductor
    cross-section, measured along the local normal axis; for circular or annular sections
    it equals the outer diameter.
  documentation: 'Width of a correction coil is the full transverse extent of its
    conductor cross-section measured along the local normal axis, in the plane perpendicular
    to the conductor centerline. In the local right-handed conductor frame $(\hat{t},
    \hat{n}, \hat{b})$, $\hat{t}$ is tangent to the conductor centerline, $\hat{n}$
    is the normal direction that defines the width, and $\hat{b}=\hat{t}\times\hat{n}$
    is the binormal direction that defines the complementary height.


    For a cross-section $C$ taken at centerline point $\mathbf{r}_0$, the width is
    the full outer extent along $\hat{n}$:


    $$

    w \equiv \max_{\mathbf{r}\in C} \left[(\mathbf{r}-\mathbf{r}_0)\cdot\hat{n}\right]
    - \min_{\mathbf{r}\in C} \left[(\mathbf{r}-\mathbf{r}_0)\cdot\hat{n}\right]

    =\begin{cases}

    a_n, & \text{rectangular or square conductor},\\

    D, & \text{solid circular conductor},\\

    D_{\mathrm{out}}, & \text{annular conductor},

    \end{cases}

    $$


    where $a_n$ is the outer rectangular dimension along $\hat{n}$, $D$ is the diameter
    of a solid circular conductor, and $D_{\mathrm{out}}$ is the outer diameter of
    an annular conductor. This quantity is the direct analog, for non-axisymmetric
    error-field and edge-localized-mode control coils, of [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil),
    and is complementary to the binormal-direction [height_of_correction_coil](name:height_of_correction_coil).


    The value is taken from the conductor engineering geometry, the manufacturing
    drawing, or dimensional inspection of the outer conductor envelope. It is a gross
    outer-envelope dimension that bounds the full conductor footprint, including any
    jacket, insulation, or cooling channel; it is therefore generally larger than
    the net current-carrying region implied by the conductor [area_of_correction_coil](name:area_of_correction_coil).
    Width should be used consistently with the binormal height: solid circular conductors
    have equal width and height, whereas annular conductors use the outer diameter
    here rather than the bore diameter set by [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil).


    Representative correction-coil conductor widths are design dependent, commonly
    about 0.005-0.1 m for individual conductors and up to roughly 0.2-0.3 m for large
    external conductor assemblies. The chosen width is governed by required current
    capacity, cooling channel layout, structural support, and the space available
    around the coil path.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_correction_coil
  - name:area_of_correction_coil
  - name:inner_radius_of_correction_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/width
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/width
    status: attached
- name: width_of_ferritic_element
  kind: scalar
  status: draft
  description: Non-negative scalar full radial extent of the rectangular cross-section
    of a ferritic element, measured along major radius R in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'Width of a ferritic element is the non-negative scalar full radial
    extent of its rectangular cross-section in an axisymmetric thick-line geometric
    model. The cross-section lies in the plane spanned by $R$ and $Z$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, and the width is measured parallel to major
    radius $R$, not as a directed displacement.


    The radial width is defined by the separation of the two radial edges of the rectangle:


    $$

    w = R_{\mathrm{max}} - R_{\mathrm{min}}

    $$


    where $w$ is the width, and $R_{\mathrm{max}}$ and $R_{\mathrm{min}}$ are the
    major-radius coordinates, in meters, of the outer and inner radial edges, with
    $R_{\mathrm{max}} \ge R_{\mathrm{min}}$. The complementary size of the same rectangular
    section is [thickness_of_ferritic_element](name:thickness_of_ferritic_element),
    the extent transverse to the ferritic element''s central segment line; with complementary
    thickness $d$, the rectangular cross-sectional area $A$ satisfies $A = w d$.


    The value is normally obtained from engineering geometry or from the geometric
    model used in magnetic-field and equilibrium calculations. Together with [major_radius_of_ferritic_element](name:major_radius_of_ferritic_element),
    it fixes the radial span of the rectangle; annular approximations instead use
    [inner_radius_of_ferritic_element](name:inner_radius_of_ferritic_element) and
    [outer_radius_of_ferritic_element](name:outer_radius_of_ferritic_element). The
    analogous dimension for an iron-core magnetic-circuit segment is [width_of_iron_core_segment](name:width_of_iron_core_segment).


    Typical values are strongly device- and component-specific. Small ferritic inserts
    may be centimeter-scale, whereas larger ferritic structures can be decimeter-
    to meter-scale; in all cases the value is a non-negative length in meters set
    by the component design.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:thickness_of_ferritic_element
  - name:major_radius_of_ferritic_element
  - name:inner_radius_of_ferritic_element
  - name:outer_radius_of_ferritic_element
  - name:width_of_iron_core_segment
  sources:
  - id: dd:ferritic/object/axisymmetric/rectangle/width
    dd_path: ferritic/object/axisymmetric/rectangle/width
    status: attached
- name: width_of_iron_core_segment
  kind: scalar
  status: draft
  description: Non-negative full extent of an iron core segment's rectangular cross-section
    in the major-radius direction of the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Width of an iron core segment is the non-negative full extent of
    its rectangular cross-section in the major-radius direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height. It is the horizontal radial dimension of the rectangle; the complementary
    vertical dimension is the [height](name:height_of_iron_core_segment), while [thickness](name:thickness_of_iron_core_segment)
    denotes a separate distance normal to the segment centerline and is not the vertical
    side of this rectangle.


    For a rectangular cross-section bounded by two radial faces, the width is the
    separation between their extrema in major radius:


    $$

    w = R_{\max} - R_{\min}

    $$


    where $w$ is the width in meters, and $R_{\max}$ and $R_{\min}$ are the maximum
    and minimum major-radius coordinates of the rectangular cross-section in meters.
    For an $R$-$Z$ aligned rectangle, the cross-sectional area is given inline by
    $A = w h$, where $h$ is the height in meters and $A$ is in square meters.


    The width is obtained from engineering geometry, design drawings, or geometric
    reconstruction of the iron core segment by measuring the horizontal radial separation
    of the two vertical sides of the rectangular cross-section. It is used with the
    height and material properties to estimate magnetic flux capacity, saturation
    behavior, structural envelope, and neutronics shielding effects.


    Typical values range from 0.03-0.5 m for many tokamak iron core segments, with
    larger return-yoke or transformer-core pieces reaching about 1 m depending on
    the magnetic-circuit design.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_iron_core_segment
  - name:thickness_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/rectangle/width
    dd_path: iron_core/segment/geometry/rectangle/width
    status: composed
- name: width_of_passive_structure
  kind: scalar
  status: draft
  description: Full horizontal width of a rectangular passive conducting structure
    element, measured along R in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Width of a passive structure is the full horizontal size of a rectangular
    conducting cross-section in the poloidal plane. In the conductor-local rectangular
    cross-section, the horizontal axis is parallel to $\hat{R}$ and the vertical axis
    is parallel to $\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.


    The width is the separation between the two radial faces of the rectangular element:


    $$

    w = R_{\max} - R_{\min}

    $$


    where $R_{\min}$ and $R_{\max}$ are the smaller and larger major radii of those
    faces in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The value is obtained from the engineering geometry of the passive conductor.
    Together with [height_of_passive_structure](name:height_of_passive_structure),
    it defines the rectangular cross-section used to compute geometric area, resistance,
    inductance, and electromagnetic coupling to coils and plasma currents.


    Typical values are 0.01-0.5 m for individual passive conductor elements, and can
    exceed 1 m for coarse vessel, shell, or stabilizing-structure segments depending
    on the engineering model.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_passive_structure
  - name:area_of_passive_loop
  - name:width_of_poloidal_field_coil
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/rectangle/width
    dd_path: pf_passive/loop/element/geometry/rectangle/width
    status: composed
- name: width_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Width of a poloidal field coil is the non-negative scalar full radial
    extent of a rectangular conductor cross-section. It is a length measured along
    the major-radius direction, not a directed displacement.
  documentation: 'Width of a poloidal field coil is the full radial extent of a rectangular
    conductor cross-section. It is a non-negative scalar length in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    For a rectangular cross-section with radial bounds $R_\mathrm{in}$ and $R_\mathrm{out}$,
    the width is


    $$

    w = R_\mathrm{out} - R_\mathrm{in} = \max(R) - \min(R)

    $$


    where $w$ is the coil width, $R_\mathrm{out}$ and $R_\mathrm{in}$ are the larger
    and smaller radial bounds of the conductor cross-section, and all lengths are
    measured in meters.


    The width is determined from the conductor geometry, for example from the radial
    bounds represented by the [radial_outline_of_poloidal_field_coil](name:radial_outline_of_poloidal_field_coil).
    Together with the [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil),
    it defines the rectangular cross-section used in electromagnetic and structural
    calculations; for a rectangle, the [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)
    satisfies the inline relation $A = w h$, where $h$ is in meters and $A$ is in
    square meters.


    Valid values satisfy $w \ge 0$. A strictly positive value represents a finite
    conductor cross-section, while $w = 0$ is a degenerate geometric limit rather
    than a physical coil width.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/width
    dd_path: pf_active/coil/element/geometry/rectangle/width
    status: composed
  - id: dd:pf_active/coil/geometry/rectangle/width
    dd_path: pf_active/coil/geometry/rectangle/width
    status: attached
- name: width_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Non-negative transverse width of a toroidal field coil conductor cross-section,
    measured in the local normal direction of the conductor frame and perpendicular
    to the conductor path. It is the full normal-direction extent for rectangular
    or square sections and the outer diameter for circular or annular sections.
  documentation: 'The width of a toroidal field coil conductor is the non-negative
    length describing the normal-direction size of the conductor cross-section. At
    each point on the conductor centerline, use the local right-handed conductor frame
    $(\hat{t}, \hat{n}, \hat{b})$, where $\hat{t}$ follows the conductor path, $\hat{n}$
    is the cross-section normal direction, and $\hat{b}=\hat{t}\times\hat{n}$ is the
    binormal; the width is measured along $\hat{n}$, while [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil)
    is measured along $\hat{b}$. For rectangular or square conductors it is the full
    extent along $\hat{n}$; for circular sections it is the diameter, and for annular
    sections it is the outer diameter.


    For a rectangular conductor cross-section, the width and height determine the
    geometric cross-sectional area:


    $$

    A = w h

    $$


    where $A$ is the [area_of_toroidal_field_coil](name:area_of_toroidal_field_coil)
    in m^2, $w$ is the width in m, and $h$ is the [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil)
    in m.


    In practice, the width is taken from the coil conductor design definition, manufacturing
    survey, or a reconstructed conductor outline in the local cross-section plane
    $(\hat{n}, \hat{b})$. For an outline-based description, it corresponds to the
    full projected extent of the conductor boundary along $\hat{n}$, with the geometric
    model determining whether the same parameter represents a rectangular width, a
    circular diameter, or an annular outer diameter.


    Typical toroidal field coil conductor widths in medium-to-large tokamaks are about
    0.01-0.10 m, with larger values possible for heavily reinforced cases or winding
    packs in high-field devices.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/width
    dd_path: tf/coil/conductor/cross_section/width
    status: composed
- name: x_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Signed x position of the geometric centroid of a ferritic element in
    the right-handed Cartesian (x, y, z) frame, with z along the vertical toroidal
    symmetry axis.
  documentation: 'The x coordinate of a ferritic element centroid is the signed Cartesian
    position of the element''s geometric center along the $\hat{x}$ direction. It
    is defined in the right-handed Cartesian $(x, y, z)$ coordinate frame with basis
    $(\hat{x}, \hat{y}, \hat{z})$, where $\hat{z}$ is vertical and coincides with
    $\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame, and $x=y=0$ lies
    on the toroidal symmetry axis.


    For a centroid with cylindrical position $(R_c, \phi_c, Z_c)$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, the Cartesian coordinate is


    $$

    x_c = R_c \cos \phi_c

    $$


    where $x_c$ is the centroid x coordinate, $R_c$ is the major radius of the centroid,
    and $\phi_c$ is its toroidal angle measured from the $+\hat{x}$ radial half-plane.


    The coordinate is obtained from the component geometry or metrology after fixing
    the machine Cartesian axes. Together with [y_centroid_of_ferritic_element](name:y_coordinate_of_ferritic_element_centroid)
    and [vertical_coordinate_of_ferritic_element](name:vertical_coordinate_of_ferritic_element_centroid),
    it specifies the centroid position used to describe the placement of passive ferritic
    structures in magnetic-field calculations.


    Typical values are set by the machine radius: compact devices commonly have centroid
    x coordinates from -1 m to +1 m, medium-sized tokamaks from -4 m to +4 m, and
    large devices can approach -10 m to +10 m.


    Sign convention: Positive when the centroid lies on the $+\hat{x}$ side of the
    $y$-$z$ plane in the right-handed Cartesian $(x, y, z)$ coordinate frame, toward
    the $\phi=0$ radial half-plane.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
