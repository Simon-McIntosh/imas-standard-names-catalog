- name: poloidal_magnetic_flux_at_pellet_path
  kind: scalar
  status: active
  description: Poloidal magnetic flux at a pellet-path point is the value of the equilibrium
    poloidal magnetic-flux function evaluated at the position of a pellet along its
    injection trajectory. For an axisymmetric equilibrium it depends only on the major-radius
    and vertical coordinates of that trajectory point.
  documentation: 'Poloidal magnetic flux at a pellet-path point is the value of the
    equilibrium [poloidal_magnetic_flux](name:poloidal_magnetic_flux) function sampled
    at the location of a pellet along its injection trajectory. It labels the magnetic
    flux surface threading that trajectory point and shares the sign and normalization
    of the underlying equilibrium flux function.


    The quantity is the equilibrium poloidal flux function evaluated at the pellet
    position:


    $$

    \psi_p = \psi\!\left(R_p, Z_p\right)

    $$


    where $\psi(R, Z)$ is the axisymmetric equilibrium poloidal magnetic-flux function
    in the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius
    and $Z$ the vertical height, and $(R_p, Z_p)$ are the major-radius and vertical
    coordinates of the pellet-path point. Because the equilibrium is axisymmetric,
    $\psi$ is independent of the toroidal angle $\phi$, so the toroidal location of
    the trajectory point does not enter this value.


    This is one scalar flux value associated with a single point on the pellet trajectory;
    sampled at successive points or instants along the path it traces the sequence
    of flux-surface labels crossed by the pellet. It differs from [poloidal_magnetic_flux_at_flux_surface](name:poloidal_magnetic_flux_at_flux_surface),
    which is the flux value attached to a specified magnetic flux surface independent
    of any trajectory. It is not the toroidal magnetic flux, the pellet trajectory
    geometry, or a derivative of the flux label with respect to a flux coordinate.


    Sign convention: Positive when the vertical magnetic field on the horizontal disk
    that defines the equilibrium poloidal flux points in the $+Z$ direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: plant_systems
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:toroidal_magnetic_flux
  sources:
  - dd_path: pellets/time_slice/pellet/path_profiles/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pellets.html#pellets-time_slice-pellet-path_profiles-psi
