- name: radiative_temperature_at_magnetic_axis
  kind: scalar
  status: active
  description: Temperature-equivalent radiation energy scale of electron-cyclotron
    emission, evaluated at the magnetic axis, the degenerate innermost magnetic surface
    where the poloidal magnetic-flux gradient vanishes. It is a brightness-temperature
    quantity, not necessarily the local kinetic electron temperature.
  documentation: 'Temperature-equivalent radiation energy scale of electron-cyclotron
    emission, evaluated at the magnetic axis. The magnetic axis is the degenerate
    innermost magnetic surface of the equilibrium, the locus in the poloidal cross-section
    where the gradient of the [poloidal magnetic flux](name:poloidal_magnetic_flux)
    vanishes; evaluation at this locus does not imply that the radiative temperature
    has an extremum there.


    The blackbody-equivalent radiation energy scale is defined by matching the radiation
    field''s specific intensity to the Planck spectral intensity:


    $$

    I_\nu = \frac{2 h \nu^3}{c^2}\left[\exp\!\left(\frac{h\nu}{T_\mathrm{rad}}\right)-1\right]^{-1}

    $$


    where $I_\nu$ is the radiation specific intensity, $\nu$ is the radiation frequency,
    $h$ is the Planck constant, $c$ is the speed of light, and $T_\mathrm{rad}$ is
    the [radiative temperature].


    This quantity is restricted to the radiation field associated with electron-cyclotron
    emission at the magnetic-axis locus. For layer-resolved electron-cyclotron emission,
    the axis value is the radiative temperature of the resonance layer whose effective
    emission location is closest to the magnetic axis; the aggregation convention
    is nearest-layer selection, not a spatial average over neighboring layers. Ordinary-mode
    and extraordinary-mode electron-cyclotron emission are polarization-specific variants;
    the unqualified quantity does not select a polarization mode and is not a sum
    or mean over modes.


    It is the radiation-field member of [temperature at the magnetic axis](name:temperature_at_magnetic_axis)
    and the magnetic-axis counterpart of [radiative temperature]. It must not be identified
    with the local kinetic [electron temperature at the magnetic axis](name:electron_temperature_at_magnetic_axis)
    except in the limiting case of optically thick thermal emission, where the brightness
    temperature approaches the electron thermal energy scale.'
  unit: eV
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_temperature_at_magnetic_axis
  sources:
  - dd_path: ece/t_radiation_central
    dd_version: 4.1.0
