- name: toroidal_component_of_electric_field
  kind: scalar
  status: draft
  description: Projection of the plasma electric field onto the toroidal direction
    $\hat{\phi}$, governing the parallel current drive and Ohmic heating in the toroidal
    circuit.
  documentation: 'The toroidal electric field component $E_\phi = \mathbf{E} \cdot
    \hat{\phi}$ is the component of the total [electric field](name:electric_field)
    aligned with the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It is the primary driver of Ohmic plasma current
    via $\mathbf{j} = \sigma \mathbf{E}$, where $\sigma$ is the parallel plasma conductivity,
    and enters the toroidal loop voltage equation $V_{\rm loop} = 2\pi R \, E_\phi$,
    where $R$ is the major radius. In the presence of a changing poloidal magnetic
    flux $\psi$, Faraday''s law gives $E_\phi = -(2\pi R)^{-1} \partial \psi / \partial
    t$, directly linking the toroidal field to flux-surface evolution during current
    ramp-up or ramp-down. Typical magnitudes range from a few tens of mV/m during
    steady H-mode to several V/m during disruptions or aggressive current ramps. It
    is inferred from magnetic loop measurements and equilibrium reconstruction, or
    computed self-consistently in transport codes from the current diffusion equation.
    The companion components [poloidal_component_of_electric_field](name:poloidal_component_of_electric_field)
    and [radial_component_of_electric_field](name:radial_component_of_electric_field)
    complete the decomposition of the full field vector.


    Sign convention: Positive when $E_\phi$ points in the direction of increasing
    toroidal angle $\phi$.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:poloidal_component_of_electric_field
  - name:radial_component_of_electric_field
