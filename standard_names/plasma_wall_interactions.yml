    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-power_conducted
    dd_documentation:
      leaf: Power conducted by the plasma onto the wall
      parent_path: wall/global_quantities
      parent: Simple 0D description of plasma-wall interaction
      data_type: FLT_1D
      unit: W
      coordinates:
      - wall/time
    enhanced_context:
      description: "Power conducted by the plasma onto the first wall and divertor\
        \ surfaces, representing the conductive heat flux channel in the plasma\u2013\
        wall power balance. Distinct from convected, radiated, recombination, and\
        \ neutral power channels tracked in the same structure."
      kind: llm
- name: power_at_wall_due_to_convection
  kind: scalar
  status: active
  description: Power deposited on plasma-facing wall and divertor surfaces by convective
    plasma particle flux, comprising thermal enthalpy and directed kinetic energy
    carried by streaming ions and electrons from the scrape-off layer.
  documentation: 'Convective power at plasma-facing wall and divertor surfaces quantifies
    the energy transported by bulk plasma-particle flow from the scrape-off layer
    into the material surfaces. It comprises thermal enthalpy and directed kinetic-energy
    contributions and is the surface-integrated component of [power due to convection](name:power_due_to_convection).


    $$

    P_{\mathrm{conv,wall}} = \int_{A_{\mathrm{wall}}} q_{\mathrm{conv}}(\mathbf{x})\,\mathrm{d}A

    $$


    where $P_{\mathrm{conv,wall}}$ is the total convective power, $q_{\mathrm{conv}}(\mathbf{x})$
    is the local convective energy flux density at surface position $\mathbf{x}$,
    and $A_{\mathrm{wall}}$ is the combined plasma-facing wall and divertor surface
    area included in the quantity.


    Only convective particle-energy transport is included; conductive and radiative
    deposition are excluded. [Power at a single divertor target due to convection](name:power_at_divertor_target_due_to_convection)
    isolates one target, while [convective power summed over divertor targets](name:power_of_divertor_due_to_convection)
    includes only the divertor-target subset. The conductive counterpart is [power
    at the wall due to conduction](name:power_at_wall_due_to_conduction).'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_convection
  - name:power_at_divertor_target_due_to_convection
  - name:power_of_divertor_due_to_convection
  - name:power_at_wall_due_to_conduction
  arguments:
  - name: power_due_to_convection
    operator: wall
    operator_kind: locus
  sources:
