name: tendency_of_electron_number_density
status: draft
cocos_transformation_type: one_like
description: Partial time derivative of the total electron number density $\partial
  n_e / \partial t$, representing the local rate of density evolution at a fixed spatial
  position.
documentation: "The tendency $\\partial n_e / \\partial t$ appears as the left-hand\
  \ side of the electron particle continuity equation $\\partial n_e / \\partial t\
  \ = S_e - \\nabla \\cdot \\Gamma_e$, where $S_e$ (m$^{-3}$\xB7s$^{-1}$) is the net\
  \ volumetric source rate encompassing ionization, recombination, and pellet ablation,\
  \ and $\\Gamma_e$ (m$^{-2}$\xB7s$^{-1}$) is the electron particle flux. Note that\
  \ the cataloged unit is m$^{-3}$ rather than m$^{-3}$\xB7s$^{-1}$; this follows\
  \ the convention of transport-solver numerical-derivative arrays in which the time-step\
  \ normalization is handled separately by the solver. In steady-state discharges\
  \ $\\partial n_e / \\partial t \\approx 0$; significant values arise during transient\
  \ events such as edge-localized modes, pellet injection, or density ramp-up phases,\
  \ where magnitudes can exceed $10^{20}\\;\\mathrm{m^{-3}}$ (in the solver-normalized\
  \ sense) in the core. The tendency is computed internally by transport solvers rather\
  \ than measured directly. See `electron_number_density` for the base profile, `tendency_of_ion_number_density`\
  \ for the ion counterpart, and `tendency_of_electron_pressure` for the energy-channel\
  \ analog."
