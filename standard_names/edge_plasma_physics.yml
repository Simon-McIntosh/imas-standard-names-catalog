- name: toroidal_current_density_due_to_parallel_viscosity
  kind: scalar
  status: draft
  description: Toroidal component of the current density resulting from the parallel
    viscous force in the edge plasma.
  documentation: 'The toroidal component $j_{\phi,\|\nu} = \mathbf{j}_{\|\nu} \cdot
    \hat{\phi}$ quantifies the projection of the parallel-viscosity-driven current
    density $\mathbf{j}_{\|\nu}$ onto the geometric toroidal direction $\hat{\phi}$.
    This current arises from neoclassical parallel-force balance: when the ion pressure
    tensor becomes anisotropic along the magnetic field, the resulting parallel viscous
    force drives a current that flows predominantly along field lines. The toroidal
    component links the viscous momentum transport to the toroidal current density
    profile in the edge plasma. Typical edge values are in the range $10^3\!-\!10^5$
    A/m$^2$, depending on the local pressure gradient and collisionality. It is evaluated
    from fluid/MHD edge models or inferred from neoclassical transport analysis.


    Sign convention: Positive when $j_{\phi,\|\nu}$ points in the direction of increasing
    toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
