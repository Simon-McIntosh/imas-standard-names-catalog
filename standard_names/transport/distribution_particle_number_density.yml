name: distribution_particle_number_density
status: draft
cocos_transformation_type: one_like
description: Total (thermal plus non-thermal) particle number density obtained from
  the full velocity-space distribution function of a given species.
documentation: "The distribution particle number density $n_s = \\int f_s(\\mathbf{v})\\\
  , d^3v$, where $f_s(\\mathbf{v})$ is the velocity-space distribution function (m$^{-6}$\
  \ s$^3$) of species $s$, gives the zeroth velocity-space moment. Unlike `electron_density`\
  \ or `ion_number_density`, which may be restricted to a single species or charge\
  \ state, this quantity represents the full density derived from an explicit distribution\
  \ function that may include supra-thermal tails (e.g., NBI or ICRH fast-ion populations).\
  \ Typical core values range from $10^{19}$ to $10^{20}$ m$^{-3}$ in tokamak plasmas.\
  \ It is obtained from Fokker\u2013Planck solvers, Monte Carlo orbit-following codes,\
  \ or synthetic diagnostic forward-models. The integral is performed over the entire\
  \ velocity space so that the result is always non-negative."
validity_domain: ''
constraints: []
tags:
- integrated-modeling
- spatial-profile
links: []
kind: scalar
unit: m^-3
