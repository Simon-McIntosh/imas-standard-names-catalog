- name: vertical_coordinate_of_conductor_cross_section
  kind: scalar
  status: active
  description: "Signed vertical position of the geometric center of a rectangular\
    \ conductor cross-section in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the signed vertical coordinate of the geometric
    center of one rectangular conductor cross-section. It locates the rectangle in
    the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius,
    $\\phi$ is toroidal angle, and $Z$ is vertical height.


    For a rectangle with upper and lower vertical boundary coordinates, the geometric-center
    coordinate is


    $$

    Z_c = \\frac{Z_{\\mathrm{top}} + Z_{\\mathrm{bottom}}}{2}

    $$


    where $Z_c$ is the vertical coordinate of the rectangle center, and $Z_{\\mathrm{top}}$
    and $Z_{\\mathrm{bottom}}$ are the vertical coordinates of its upper and lower
    boundaries.


    The quantity applies to a single rectangular conductor cross-section, including
    a rectangular representation of an axisymmetric magnetic component. It is not
    summed or averaged over multiple conductors, cross-sections, or the conductor''s
    longitudinal extent, and it is distinct from the rectangle''s full vertical extent
    or area. For coil conductor elements, its geometric-center meaning is closely
    related to [vertical centroid of coil conductor element](name:vertical_centroid_of_coil_conductor_element);
    unlike [vertical coordinate of passive structure](name:vertical_coordinate_of_passive_structure),
    it is tied specifically to the center of a rectangular cross-section rather than
    to a generic structure reference point.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - dd_path: ferritic/object/axisymmetric/rectangle/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-axisymmetric-rectangle-z
