- name: toroidal_angle_of_shattered_pellet
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of the location along a shattered pellet
    injection path where the pellet fractures into fragments.
  documentation: "The toroidal angle $\\phi_{\\mathrm{SP}}$ (in radians) identifies\
    \ the shattering position along a shattered pellet injector (SPI) path in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame. This position determines the\
    \ toroidal location where the injected pellet breaks apart, releasing a spray\
    \ of solid fragments that then ablate along the remaining trajectory; the shattering\
    \ location influences the deposition pattern and the resulting density perturbation.\
    \  Typical shattering positions for SPI systems in present-day tokamaks (DIII-D,\
    \ JET) and planned for ITER are located in the outer half of the plasma cross-section,\
    \ with $\\phi_{\\mathrm{SP}}$ spanning the full $0$\u2013$2\\pi$ range depending\
    \ on the injector port.  This quantity is used together with [major_radius_of_pellet_path](name:major_radius_of_pellet_path)\
    \ and [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector)\
    \ to fully define the SPI geometry, and is complementary to [toroidal_angle_of_pellet_path](name:toroidal_angle_of_pellet_path)\
    \ which records the launch point rather than the fracture point.\n\nSign convention:\
    \ Positive when the shattering position lies in the direction of increasing toroidal\
    \ angle $\\phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: rad
  physics_domain: plant_systems
  links:
  - name:major_radius_of_pellet_path
  - name:vertical_coordinate_of_neutral_beam_injector
  - name:toroidal_angle_of_pellet_path
  sources:
  - id: dd:spi/injector/shattering_position/phi
    dd_path: spi/injector/shattering_position/phi
    status: composed
- name: tritium_source_rate
  kind: scalar
  status: draft
  description: Instantaneous rate at which tritium atoms are injected into the plasma
    vessel.
  documentation: 'The tritium source rate quantifies the number of tritium atoms introduced
    per unit time into the vacuum vessel through gas injection systems. This quantity
    is critical for controlling the tritium inventory, fueling requirements, and fusion
    power production in deuterium-tritium (D-T) burning plasmas. The injection rate
    is typically regulated by piezoelectric valves or fast gas injectors, with flow
    rates monitored by pressure and temperature measurements upstream of the injection
    point.


    Sign convention: Positive when tritium atoms flow into the plasma vessel from
    the gas injection system.


    This quantity is directly related to the deuterium fueling rate via [deuterium_gas_source_rate_of_inlet](name:deuterium_gas_source_rate_of_inlet),
    which shares the same units and functional role. The total gas injection across
    all species is captured by [total_gas_source_rate_due_to_injection](name:total_gas_source_rate_due_to_injection).
    For neon or other impurity species, analogous quantities such as [neon_source_rate_due_to_gas_injection](name:neon_source_rate_due_to_gas_injection)
    follow the same physical definition.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:deuterium_gas_source_rate_of_inlet
  - name:total_gas_source_rate_due_to_injection
  - name:neon_source_rate_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_rates/tritium/value
    dd_path: summary/gas_injection_rates/tritium/value
    status: composed
- name: xenon_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which xenon atoms are injected into the vacuum
    vessel via gas puffing systems.
  documentation: Xenon is a high-Z noble gas used as a radiating species in tokamak
    experiments to control divertor heat flux and mitigate edge localized modes (ELMs).
    The source rate quantifies the number of xenon atoms per second introduced into
    the vacuum vessel from gas injection hardware, typically piezo-electric valves
    or regulated gas puffs. Typical values range from $10^{18}$ to $10^{21}$ atoms
    per second, depending on the injection scenario (e.g., short-pulse ELM pacing
    vs. steady-state radiative cooling). The rate is measured at the injection point
    before any ionization or transport; it does not account for wall recycling or
    pumping losses. This quantity is distinct from the neutral influx rate, which
    may include reflected or desorbed atoms.
  unit: s^-1
  physics_domain: plant_systems
