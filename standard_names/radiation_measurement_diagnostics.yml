- name: radiated_power_density
  kind: scalar
  status: active
  description: Power density due to radiation is the local volumetric rate at which
    plasma energy is converted into emitted electromagnetic radiation.
  documentation: 'Power density due to radiation is the local volumetric rate at which
    plasma energy is converted into emitted electromagnetic radiation. It is the non-negative
    magnitude of radiative energy loss from the emitting plasma volume.


    The radiated power density is defined by


    $$

    P_{\mathrm{rad}} = \frac{\mathrm{d}P_{\mathrm{emit}}}{\mathrm{d}V}

    $$


    where $P_{\mathrm{emit}}$ is the emitted electromagnetic power and $V$ is the
    emitting volume. This quantity represents radiative emission rather than the signed
    source term in the plasma energy balance; radiation contributes negatively to
    that balance. It is a volumetric quantity and is distinct from the incident surface
    flux represented by [flux at wall due to radiation](name:flux_at_wall_due_to_radiation).
    The broader [power density](name:power_density) includes radiative and non-radiative
    source or loss mechanisms.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:flux_at_wall_due_to_radiation
  - name:power_density
  arguments:
  - name: power_density
    operator: radiated
    operator_kind: qualifier
  sources:
  - dd_path: bolometer/power_density
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/bolometer.html#bolometer-power_density
    dd_documentation:
