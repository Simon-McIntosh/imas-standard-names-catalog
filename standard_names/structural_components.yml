- name: major_radius_of_plasma_facing_component_outline_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of a point on the discrete outline contour
    of a plasma-facing component, in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The major radius $R$ measures the horizontal distance from the machine\
    \ symmetry axis to a given point on the outline contour of a plasma-facing component,\
    \ defined in the right-handed cylindrical $(R, \\phi, Z)$ frame where $R$ is measured\
    \ from the symmetry axis in meters. Plasma-facing component outlines are typically\
    \ represented as ordered sequences of $(R, Z)$ pairs that trace the poloidal cross-section\
    \ of the component surface; this quantity gives the $R$ coordinate of each such\
    \ point. Typical values range from roughly 0.5 m (inner wall) to 10 m (outer wall)\
    \ depending on the device size, with ITER-scale machines spanning approximately\
    \ 4\u20138 m for main-chamber components. This coordinate is used in neutronics,\
    \ thermal-hydraulics, and structural analysis codes to define the component geometry\
    \ in the poloidal plane. Related geometry coordinates in the same family include\
    \ [major_radius_of_annular_outer_outline_point](name:major_radius_of_annular_outer_outline_point),\
    \ [major_radius_of_annular_inner_outline_point](name:major_radius_of_annular_inner_outline_point),\
    \ and [major_radius_of_plasma_boundary_outline_point](name:major_radius_of_plasma_boundary_outline_point);\
    \ the paired vertical coordinate $Z$ of the same contour family should be consulted\
    \ alongside this quantity.\n\nSign convention: Positive when the outline point\
    \ lies at a finite distance from the machine symmetry axis in the outward radial\
    \ direction, i.e. $R > 0$."
  unit: m
  physics_domain: structural_components
  links:
