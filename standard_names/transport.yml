- name: thermal_ion_state_pressure
  kind: scalar
  status: draft
  description: Isotropic thermal pressure of a specific ion charge state arising from
    random thermal motion, excluding fast-particle contributions.
  documentation: "The thermal pressure of an ion charge state is the isotropic scalar\
    \ pressure contributed by ions in a particular ionization state through their\
    \ random thermal motions. It is the thermal component of the full [ion_state_pressure](name:ion_state_pressure)\
    \ and explicitly excludes fast (non-thermal) particle contributions, which are\
    \ tracked separately in parallel and perpendicular fast-pressure quantities.\n\
    \nThe defining relation is:\n\n$$\nP_{\\mathrm{th},s} = n_s \\, k_B \\, T_s\n\
    $$\n\nwhere $n_s$ is the number density of ions in charge state $s$, $k_B$ is\
    \ the Boltzmann constant, and $T_s$ is the thermal temperature of that charge\
    \ state. Summing $P_{\\mathrm{th},s}$ over all charge states of a given ion species\
    \ recovers the species-level [thermal_ion_pressure](name:thermal_ion_pressure).\
    \ Adding the fast-particle pressure contributions yields the [total_ion_state_pressure](name:total_ion_state_pressure)\
    \ for the same charge state.\n\nThis quantity is derived from charge-state-resolved\
    \ ion density and temperature profiles, obtained through charge-exchange recombination\
    \ spectroscopy, collisional-radiative modeling, or kinetic equilibrium reconstruction.\
    \ It is defined across both the core and edge plasma regions, where the charge-state\
    \ distribution varies significantly with local temperature and density through\
    \ the ionization balance. The analogous quantity for neutral species in a specific\
    \ internal state is [thermal_neutral_state_pressure](name:thermal_neutral_state_pressure).\n\
    \nTypical values range from a few Pa in the scrape-off layer to $10^3$\u2013$10^5$\
    \ Pa in the core of high-performance tokamak discharges, depending on the charge\
    \ state density and temperature.\n\nSign convention: Positive for any non-zero\
    \ thermal ion population in the given charge state."
  unit: Pa
  physics_domain: transport
  links:
  - name:ion_state_pressure
