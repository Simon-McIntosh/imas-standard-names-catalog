name: plasma_resistance
status: draft
description: Effective electrical resistance of the plasma column, defined as the
  ratio of Ohmic dissipated power to the square of the plasma current.
documentation: "The plasma resistance $R_p$ (\u03A9) is defined by $R_p = \\int \\\
  mathbf{E} \\cdot \\mathbf{j} \\, dV \\;/\\; I_p^2$, where $\\mathbf{E}$ is the electric\
  \ field, $\\mathbf{j}$ is the current density, $I_p$ is the total plasma current,\
  \ and the integral extends over the plasma volume $V$. This quantity characterizes\
  \ the bulk resistive dissipation and is a key input for current-drive and Ohmic-heating\
  \ power balance. Typical values in large tokamak H-mode plasmas are $R_p \\sim 1$\u2013\
  $50\\;\\mu\\Omega$, decreasing with higher electron temperature due to the Spitzer\
  \ resistivity scaling $\\eta \\propto T_e^{-3/2}$. $R_p$ is derived from equilibrium\
  \ reconstruction combined with the measured loop voltage and plasma current. See\
  \ also `plasma_current` and the related coil quantity `resistance_of_poloidal_field_coil`."
