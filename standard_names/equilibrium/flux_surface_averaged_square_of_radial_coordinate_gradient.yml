name: flux_surface_averaged_square_of_radial_coordinate_gradient
status: draft
cocos_transformation_type: one_like
description: Flux-surface average of the squared gradient of the toroidal-flux radial
  coordinate, $\langle |\nabla \rho_{\mathrm{tor}}|^2 \rangle$.
documentation: 'This dimensionless metric coefficient $gm3 = \langle |\nabla \rho_{\mathrm{tor}}|^2
  \rangle$ is the flux-surface average of the squared magnitude of the gradient of
  the normalized toroidal-flux coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi/\Phi_{\mathrm{edge}}}$,
  where $\Phi$ is the toroidal magnetic flux enclosed by the flux surface and $\Phi_{\mathrm{edge}}$
  its value at the last closed flux surface. It enters the diffusive transport equations
  in flux coordinates: the effective diffusion coefficient across a flux surface is
  proportional to $\langle |\nabla \rho_{\mathrm{tor}}|^2 \rangle D$, where $D$ is
  the local diffusivity. Typical values are of order unity, approaching 1 for nearly
  circular, large-aspect-ratio plasmas and departing significantly from 1 for shaped
  or tight-aspect-ratio configurations. Evaluated by equilibrium reconstruction codes
  (EFIT, CHEASE, HELENA) on the reconstructed flux-surface geometry. Related metric
  quantities include `flux_surface_averaged_radial_coordinate_gradient_magnitude`
  ($\langle |\nabla \rho_{\mathrm{tor}}| \rangle$) and `flux_surface_averaged_inverse_square_magnetic_field_strength_times_squared_radial_gradient`
  ($\langle |\nabla \rho_{\mathrm{tor}}|^2 / B^2 \rangle$).'
