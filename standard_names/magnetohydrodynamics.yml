- name: vorticity_on_ggd
  kind: scalar
  status: draft
  description: Scalar vorticity field of the plasma fluid velocity, stored on a generalized
    grid description (GGD) mesh.
  documentation: "The vorticity $\\omega = (\\nabla \\times \\mathbf{v})_{\\parallel}$\
    \ (in s$^{-1}$) characterizes the rotational component of the plasma flow, where\
    \ $\\mathbf{v}$ is the bulk plasma velocity. In reduced-MHD formulations the vorticity\
    \ equation governs the evolution of the electrostatic stream function and couples\
    \ to the magnetic flux through $\\partial \\omega / \\partial t + [\\phi, \\omega]\
    \ = [\\psi, j_{\\parallel}] + \\nu \\nabla^2 \\omega$, where $\\phi$ is the electrostatic\
    \ potential, $\\psi$ the poloidal flux, $j_{\\parallel}$ the parallel current\
    \ density, and $\\nu$ the viscosity. The quantity is discretized on the GGD mesh\
    \ allowing complex domain geometries including X-point regions. In extended-MHD\
    \ simulations (JOREK, M3D-C1) vorticity amplitudes can reach $10^4$\u2013$10^6$\
    \ s$^{-1}$ during disruptions or ELM crashes. See also [vorticity_per_major_radius_on_ggd](name:vorticity_per_major_radius_on_ggd)\
    \ and [electrostatic_potential_on_ggd](name:electrostatic_potential_on_ggd)."
  unit: s^-1
  cocos_transformation_type: one_like
  tags:
  - spatial-profile
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: vorticity_per_major_radius_on_ggd
  kind: scalar
  status: draft
  description: Plasma vorticity divided by the major radius $R$, stored on a generalized
    grid description (GGD) mesh.
  documentation: "The quantity $\\omega/R$ (in m$^{-1}$ s$^{-1}$) appears naturally\
    \ in the vorticity equation for toroidal MHD, where the toroidal angular momentum\
    \ equation can be cast in terms of $\\omega/R$ rather than $\\omega$ alone to\
    \ account for the toroidal geometry factor. Here $\\omega$ denotes the fluid vorticity\
    \ (s$^{-1}$) and $R$ (m) is the major-radius coordinate. This formulation is standard\
    \ in extended-MHD codes (e.g., JOREK, NIMROD) that solve the reduced or full MHD\
    \ equations on unstructured GGD meshes. The GGD representation provides one scalar\
    \ value per grid element, enabling flexible handling of X-point geometry and divertor\
    \ regions where structured grids are impractical. Values depend strongly on the\
    \ MHD activity; during sawtooth crashes or ELMs, $|\\omega/R|$ can reach $10^4$\u2013\
    $10^6$ m$^{-1}$ s$^{-1}$. See [vorticity_on_ggd](name:vorticity_on_ggd) for the\
    \ un-divided vorticity field."
  unit: m^-1.s^-1
  tags:
  - mhd-stability-analysis
  - simulated
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
