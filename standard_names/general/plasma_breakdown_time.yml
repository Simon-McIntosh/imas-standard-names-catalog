name: plasma_breakdown_time
status: draft
cocos_transformation_type: one_like
description: Absolute time at which plasma breakdown occurs, marking the onset of
  ionization and measurable plasma current.
documentation: "The plasma breakdown time $t_{\\rm bd}$ marks the instant when the\
  \ applied loop voltage induces sufficient ionization to form a self-sustaining plasma\
  \ discharge. It is conventionally identified as the time when the plasma current\
  \ $I_p$ first exceeds a threshold (often a few kA) or when spectroscopic line emission\
  \ from the working gas rises sharply. In tokamaks with ohmic start-up, $t_{\\rm\
  \ bd}$ occurs within a few milliseconds of the central-solenoid flux swing; in electron\
  \ cyclotron assisted start-up it can be advanced by pre-ionization. Typical values\
  \ are 0\u20132 s relative to the start of the power-supply trigger sequence. This\
  \ quantity anchors the time base for all subsequent discharge phases and is essential\
  \ for calculating `plasma_duration`."
