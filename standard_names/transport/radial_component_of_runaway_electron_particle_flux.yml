name: radial_component_of_runaway_electron_particle_flux
description: Radial projection of the runaway electron particle flux density, quantifying
  cross-field transport of runaway electrons per unit area.
documentation: "This quantity is the radial component of the runaway electron particle\
  \ flux $\\Gamma_{\\mathrm{RE},r}$ (m$^{-2}$s$^{-1}$), representing the net rate\
  \ at which runaway electrons cross a flux surface per unit area in the radial (perpendicular)\
  \ direction. It is related to the runaway density $n_{\\mathrm{RE}}$ by the continuity\
  \ equation $\\partial n_{\\mathrm{RE}} / \\partial t + \\nabla \\cdot \\Gamma_{\\\
  mathrm{RE}} = S_{\\mathrm{RE}}$, where $S_{\\mathrm{RE}}$ is the runaway source\
  \ rate due to primary (Dreicer) and secondary (avalanche) generation mechanisms.\
  \ Perpendicular transport of runaways is typically dominated by magnetic perturbations\
  \ (stochastic field diffusion) rather than collisional diffusion; effective diffusion\
  \ coefficients $D_{\\mathrm{RE}} \\sim 0.01$\u2013$1$ m$^2$/s have been inferred\
  \ experimentally. Positive values indicate outward flux (away from the magnetic\
  \ axis). This quantity is central to disruption mitigation modeling and is constrained\
  \ by hard X-ray camera and synchrotron imaging data. See `runaway_electron_density`\
  \ for the associated density and `runaway_electron_pitch_angle` for the directional\
  \ distribution."
kind: vector_component
unit: m^-2.s^-1
