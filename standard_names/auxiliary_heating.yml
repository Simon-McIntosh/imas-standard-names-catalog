    \ and [z_component_of_direction_unit_vector](name:z_component_of_direction_unit_vector)\
    \ the trio fully specifies the orientation of the device component in three dimensions.\
    \ This quantity applies generically to any directional element \u2014 mirror launchers,\
    \ camera lines of sight, injection cones, or operational instrumentation sensors\
    \ \u2014 whose orientation is expressed in the facility Cartesian frame. For a\
    \ specialized application to shattered-pellet injection the analogous quantity\
    \ is [y_component_of_shattered_pellet_injection_direction_unit_vector](name:y_component_of_shattered_pellet_injection_direction_unit_vector),\
    \ which follows the same component convention. The direction unit vector is defined\
    \ by the parent quantity [direction_unit_vector](name:direction_unit_vector).\n\
