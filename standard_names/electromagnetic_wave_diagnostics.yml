- name: radiative_temperature
  kind: scalar
  status: active
  description: Blackbody-equivalent brightness temperature inferred from electron
    cyclotron emission, approaching the local electron temperature when the resonant
    layer is optically thick.
  documentation: 'Electron-cyclotron radiative temperature is the energy-equivalent
    blackbody temperature whose thermal radiation has the observed electron-cyclotron
    spectral radiance. It characterizes the radiation field and is not necessarily
    the local electron temperature.


    At frequency $\nu$, the brightness temperature is defined by the Planck relation:


    $$

    I_\nu = \frac{2 h \nu^3}{c^2}\left[\exp\left(\frac{h\nu}{T_{\mathrm{rad}}}\right)-1\right]^{-1}

    $$


    where $I_\nu$ is the electron-cyclotron spectral radiance, $h$ is Planck''s constant,
    $c$ is the speed of light, and $T_{\mathrm{rad}}$ is the brightness temperature
    expressed as thermal energy.


    For an optically thick, thermalized resonant layer, $T_{\mathrm{rad}}$ approaches
    the local electron temperature. At finite optical depth, it instead represents
    the radiation emerging from the emitting and absorbing plasma along the observation
    path and can differ from the local value. The axis-specific counterpart is [radiative
    temperature at the magnetic axis](name:radiative_temperature_at_magnetic_axis).'
  unit: eV
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radiative_temperature_at_magnetic_axis
  sources:
  - dd_path: ece/channel/t_radiation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-t_radiation
    dd_documentation:
