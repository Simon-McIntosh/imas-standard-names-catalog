name: vertical_iron_core_segment_magnetization_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the vertical magnetization of an iron
  core segment is treated as exact input (1) or fitted (0) in equilibrium reconstruction.
documentation: This flag controls how the vertical ($Z$) component of the iron core
  segment magnetization $M_Z$ is handled by the equilibrium solver. When set to 1,
  $M_Z$ is imposed exactly without fitting; when 0, the measurement enters the $\chi^2$
  cost functional alongside its associated weight. Tokamaks with ferromagnetic iron
  cores (e.g., EAST, WEST) require explicit treatment of the non-linear magnetization
  in equilibrium reconstruction to avoid systematic errors in the recovered flux map.
  The vertical direction corresponds to the $Z$-axis of the standard cylindrical coordinate
  system $(R, \phi, Z)$. See the radial counterpart `radial_iron_core_segment_magnetization_constraint_exact_flag`.
