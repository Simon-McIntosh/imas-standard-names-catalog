- name: ion_state_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Power flux density incident on the wall surface, carried by ions in
    a given charge state and associated with volume recombination processes.
  documentation: This quantity represents the energy flux density $\Gamma_E = n_i^{Z+}
    \, v_\perp \, E_{\rm rec}$ incident on the plasma-facing wall, where $n_i^{Z+}$
    is the density of ions in charge state $Z+$, $v_\perp$ is the perpendicular impact
    velocity, and $E_{\rm rec}$ is the energy released per recombination event. It
    is computed by fluid or kinetic edge codes (e.g., SOLPS, EMC3-EIRENE) from the
    recombination rate coefficient and the local ion energy. Typical values range
    from $10^3$ to $10^6$ W/m$^2$ in detached divertor conditions, where volumetric
    recombination dominates. This flux is distinguished from the kinetic energy flux
    (see `[state_kinetic_energy_flux_at_wall](name:state_kinetic_energy_flux_at_wall)`)
    which excludes the recombination contribution. Compare also with `[parallel_ion_state_energy_flux](name:parallel_ion_state_energy_flux)`
    for the parallel component along the magnetic field.
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:state_kinetic_energy_flux_at_wall
  - name:parallel_ion_state_energy_flux
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    status: composed
- name: ion_state_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Net particle flux density of ions in a given charge state incident
    on wall surfaces.
  documentation: "The ion state particle flux at the wall represents the rate at which\
    \ ions of a specific charge state impact the plasma-facing wall per unit area,\
    \ typically directed along the magnetic field lines or due to cross-field transport.\
    \ This quantity is a key metric for quantifying net wall erosion, material migration,\
    \ and tritium retention in fusion devices. Measured units are particles per square\
    \ meter per second (m\u207B\xB2\xB7s\u207B\xB9). Typical values in the scrape-off\
    \ layer of tokamaks range from 10\xB2\xB9 to 10\xB2\u2074 m\u207B\xB2\xB7s\u207B\
    \xB9, with higher fluxes near the divertor. The flux for a given charge state\
    \ is related to the line-integrated density and flow velocity via $\\Gamma_{Z}\
    \ = n_{Z} \\cdot v_{\\parallel}$, where $n_{Z}$ is the ion density of that charge\
    \ state and $v_{\\parallel}$ is the parallel flow velocity. This quantity complements\
    \ the total ion particle flux, as in [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall),\
    \ by resolving the charge-state dependence critical for understanding impurity\
    \ transport and plasma-facing component lifetime."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_particle_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/particle_fluxes/ion/state/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/ion/state/incident/values
    status: composed
- name: neon_fraction
  kind: scalar
  status: draft
  description: Ratio of the volume-averaged neon impurity density to the electron
    density, evaluated at the time of peak electron density in the plasma discharge.
  documentation: The neon fraction quantifies the relative concentration of neon impurity
    ions, defined as $f_{\text{Ne}} = n_\text{Ne} / n_e$, where $n_\text{Ne}$ is the
    volume-averaged neon density and $n_e$ is the electron density. This fraction
    is typically inferred from spectroscopic measurements of neon emission lines combined
    with plasma modeling, or from baseline-impurity gas-puffing rates. Values range
    from $10^{-4}$ to $10^{-1}$ in fusion plasmas, depending on impurity seeding and
    transport. The quantity is sign-invariant (positive definite), as both densities
    are inherently non-negative. See also [oxygen_fraction](name:oxygen_fraction)
    and [xenon_fraction_at_separatrix](name:xenon_fraction_at_separatrix) for other
    impurity species.
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:oxygen_fraction
  - name:xenon_fraction_at_separatrix
  sources:
  - id: dd:summary/composition/neon/value
    dd_path: summary/composition/neon/value
    status: composed
- name: neutral_gas_source_rate_at_wall
  kind: scalar
  status: draft
  description: Total instantaneous rate at which neutral gas particles are emitted
    from the entire plasma-facing wall surface due to plasma-wall interactions, integrated
    over the wall area and summed over all neutral species.
  documentation: 'The neutral gas source rate at the wall quantifies the total number
    of neutral gas particles released per second from the plasma-facing wall surface,
    encompassing contributions from processes such as desorption, sputtering, and
    recycling. This quantity is integrated over the entire wall (units of s$^{-1}$),
    distinct from a volumetric source density (e.g., m$^{-3}$s$^{-1}$).


    Typical values in fusion devices range from 10$^{18}$ to 10$^{22}$ s$^{-1}$, depending
    on the plasma confinement mode, wall material, and fueling conditions. The rate
    is often inferred from pressure measurements in the vacuum vessel or from modeling
    of neutral particle transport. It is a key input for predicting the neutral density
    distribution and fueling efficiency in the scrape-off layer and core plasma.


    Sign convention: Positive when neutral particles are emitted outward from the
    wall into the plasma-facing volume.


    This quantity aggregates contributions from all neutral species (e.g., hydrogen
    isotopes, helium, impurities) incident upon the wall.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
