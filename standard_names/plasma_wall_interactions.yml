- name: nitrogen_density_at_limiter
  kind: scalar
  status: active
  description: Nitrogen ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all ionization states and excluding
    neutral nitrogen.
  documentation: 'Nitrogen density at a limiter is the local number density of nitrogen
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, where the limiter terminates open field lines in the scrape-off layer.


    The charge-state-summed density is defined from the velocity distribution functions
    by:


    $$

    n_{\mathrm{N}} = \sum_{q=1}^{q_{\max}} \int f_{\mathrm{N}^{q+}}(\mathbf{v})\,d^3v

    $$


    where $q$ is the positive nitrogen ion charge state, $q_{\max}$ is the highest
    included ionization state, and $f_{\mathrm{N}^{q+}}(\mathbf{v})$ is the velocity
    distribution function of that ion state at the evaluation point.


    This is the nitrogen-specific component of [density_at_limiter](name:density_at_limiter).
    It excludes neutral nitrogen and is distinct from [neon_density_at_limiter](name:neon_density_at_limiter),
    which applies the same boundary definition to neon ions.'
