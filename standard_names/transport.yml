- name: neutron_flux
  kind: scalar
  status: active
  description: Total neutron production rate from fusion reactions, integrated over
    the plasma volume and summed across reaction channels and reacting-population
    classes.
  documentation: "This quantity is the global rate at which fusion reactions produce\
    \ neutrons in the plasma. It represents an integrated production rate, not a local\
    \ neutron source density or a surface-crossing particle flux.\n\nThe total neutron\
    \ production rate is defined by\n\n$$\n\\Gamma_n = \\int_{\\mathcal{V}_{\\mathrm{plasma}}}\
    \ S_n(\\mathbf{r})\\,d^3\\mathbf{r} = \\sum_c \\Gamma_{n,c}\n$$\n\nwhere $\\Gamma_n$\
    \ is the total neutron production rate, $\\mathcal{V}_{\\mathrm{plasma}}$ is the\
    \ plasma volume, $S_n(\\mathbf{r})$ is the local volumetric neutron production\
    \ rate from fusion at position $\\mathbf{r}$, $d^3\\mathbf{r}$ is the volume element,\
    \ $c$ indexes fusion reaction channels, and $\\Gamma_{n,c}$ is the volume-integrated\
    \ neutron production rate for channel $c$.\n\nThe aggregation includes deuterium\u2013\
    deuterium, deuterium\u2013tritium, and tritium\u2013tritium fusion channels, with\
    \ thermal, beam-thermal, and beam-beam reacting-population contributions combined\
    \ within each channel. It excludes neutron production from non-fusion processes\
    \ and is nonnegative as a production rate.\n\nThe reaction-specific [deuterium\u2013\
    deuterium neutron flux](name:deuterium_deuterium_neutron_flux) and [tritium\u2013\
    tritium neutron flux](name:tritium_tritium_neutron_flux) are channel-resolved\
    \ components of this aggregate. The spatially resolved counterpart is the local\
    \ [fusion neutron emissivity](name:emissivity_due_to_fusion), whose volume integral\
    \ supplies the corresponding contribution to the total."
  unit: Hz
  physics_domain: transport
  links: []
  sources:
  - kind: imas-dd
    ref: summary/fusion/neutron_rates/total/value
    version: 4.1.0
- name: nitrogen_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the nitrogen ion population evaluated at
    the magnetic axis is the local nitrogen-ion count per physical volume at that
    location, summed over all nitrogen ionic charge states and excluding neutral nitrogen.
  documentation: 'Particle number density of the nitrogen ion population evaluated
    at the magnetic axis is the local nitrogen-ion count per physical volume at that
    location, summed over all nitrogen ionic charge states. It represents nitrogen
    ions specifically, rather than neutral nitrogen, electrons, or other ion species.


    The defining relation is


    $$

    n_{\mathrm{N,axis}} = \left.\frac{dN_{\mathrm{N,ion}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{N,axis}}$ is the nitrogen-ion number density at the magnetic
    axis, $N_{\mathrm{N,ion}}$ is the total number of nitrogen ions summed over all
    ionic charge states, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete nitrogen-ion population at that location, uses a sum over
    nitrogen ionic charge states, and excludes neutral nitrogen; it is neither a flux-surface
    or volume integral nor a density of another species.


    This is the nitrogen-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It follows the same charge-state-summed
    convention as [helium-4 density at the magnetic axis](name:helium_4_density_at_magnetic_axis),
    while differing in the ion species counted.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:helium_4_density_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/nitrogen/value
    version: 4.1.0
- name: oxygen_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the oxygen ion population evaluated at the
    magnetic axis is the local oxygen-ion count per physical volume at that location,
    summed over all oxygen ionic charge states.
  documentation: 'Particle number density of the oxygen ion population evaluated at
    the magnetic axis is the local oxygen-ion count per physical volume at that location,
    summed over all oxygen ionic charge states. It represents oxygen ions specifically,
    rather than electrons, neutral oxygen, or another plasma population.


    The defining relation is


    $$

    n_{\mathrm{O,axis}} = \left.\sum_q \frac{dN_{\mathrm{O},q}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{O,axis}}$ is the oxygen-ion number density at the magnetic axis,
    $q$ is an oxygen ionic charge state, $N_{\mathrm{O},q}$ is the number of oxygen
    ions in charge state $q$, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the oxygen ion population and is summed over all oxygen ionic charge
    states; neutral oxygen is excluded. It is a local density, not a flux-surface
    or volume integral.


    This is the oxygen-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It differs from [neon density
    at the magnetic axis](name:neon_density_at_magnetic_axis), which applies the same
    local, charge-state-summed convention to neon ions.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:neon_density_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/oxygen/value
    version: 4.1.0
- name: safety_factor
  kind: scalar
  status: active
  description: 'Signed field-line winding ratio on a magnetic flux surface: the number
    of toroidal turns completed per poloidal circuit.'
  documentation: 'The safety factor is the signed helical winding of magnetic field
    lines on an individual magnetic flux surface, counting toroidal turns per poloidal
    circuit. It is the general flux-surface quantity, without imposing a particular
    evaluation locus.


    The defining flux-increment relation is:


    $$

    q = \frac{d\Phi_{\rm tor}}{d\Phi_{\rm pol}/(2\pi)}

    $$


    where $q$ is the safety factor, $\Phi_{\rm tor}$ is the toroidal magnetic flux
    enclosed by the flux surface, $\Phi_{\rm pol}$ is the poloidal magnetic flux encircled
    by the flux-surface boundary, $d$ denotes the differential change between neighboring
    flux surfaces, and $\pi$ is the circle constant.


    The quantity applies to magnetic flux surfaces throughout the defined plasma domain,
    including surfaces at the magnetic axis, internal transport barriers, and plasma
    boundary. It is not species-, charge-state-, or population-resolved; no particle
    or species summation and no volume or surface average is inherent. The toroidal
    magnetic-field component $B_\phi$ and net plasma current $I_p$ determine its sign,
    while $B_\phi$ denotes the projection of the magnetic field onto the toroidal
    direction and $I_p$ denotes the net current carried by the plasma.


    A value at a selected locus is a specialization of the general quantity, such
    as the [safety factor at the magnetic axis](name:safety_factor_at_magnetic_axis)
    or the [safety factor at the plasma boundary](name:safety_factor_at_plasma_boundary).
    In contrast, [minimum safety factor](name:minimum_safety_factor) is the extremal
    value over the relevant flux-surface domain rather than the value at a prescribed
    surface. Rational surfaces satisfying $q=m/n$, where $m$ and $n$ are integer poloidal
    and toroidal mode numbers, are resonant with magnetic perturbations having those
    mode numbers. The [rotational transform](name:rotational_transform) expresses
    the reciprocal field-line winding convention, counting poloidal turns per toroidal
    turn.


    Sign convention: Positive when the toroidal magnetic field component $B_\phi$
    and net plasma current $I_p$ are parallel in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is the major-radius coordinate, $\phi$ is the toroidal angle,
    and $Z$ is the vertical coordinate; negative when they are antiparallel.'
  unit: '1'
  physics_domain: transport
  links:
  - name:safety_factor_at_magnetic_axis
  - name:minimum_safety_factor
  sources:
  - kind: imas-dd
    ref: core_profiles/profiles_1d/q
    version: 4.1.0
