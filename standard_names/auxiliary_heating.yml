- name: capacitance
  kind: scalar
  status: active
  description: Charge-storage coefficient relating incremental electrical charge to
    the voltage across an electrical component.
  documentation: 'Electrical capacitance quantifies the charge stored by an electrical
    component per unit change in the voltage across its terminals.


    $$

    C = \frac{\mathrm{d}Q}{\mathrm{d}V}

    $$


    where $C$ is capacitance, $Q$ is the charge associated with the component, and
    $V$ is the terminal voltage difference. For a linear component, this relation
    reduces to $Q = CV$.


    For a passive lumped element, capacitance is non-negative and represents electric-field
    energy storage. It is distinct from resistance, which describes dissipative loading;
    the antenna-specific instance is [capacitance of an ion-cyclotron heating antenna](name:capacitance_of_ion_cyclotron_heating_antenna).'
  unit: F
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ic_antennas/antenna/module/matching_element/capacitance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-matching_element-capacitance
    dd_documentation:
      leaf: Capacitance of the macthing element
      parent_path: ic_antennas/antenna/module/matching_element
      parent: Set of matching elements
      data_type: STRUCTURE
      unit: F
    enhanced_context:
      description: Capacitance of an impedance matching element in an ICRH antenna
        module. Represents the time-dependent capacitance used to tune the transmission
        line circuit for optimal power coupling to the plasma.
      kind: llm
- name: current_density_due_to_wave_driven_current_drive
  kind: scalar
  status: active
  description: "Electric current density attributable to non-inductive drive by plasma\
    \ waves through wave\u2013particle interactions, distinct from inductive and non-wave\
    \ current contributions."
  documentation: "Wave-driven current density is the electric current-density contribution\
    \ produced by wave\u2013particle interactions that preferentially drive charged-particle\
    \ motion. It is non-inductive and is distinct from the total [current density](name:current_density)\
    \ and from non-inductive contributions not driven by waves.\n\n$$\n\\mathbf{J}_{\\\
    mathrm{wave}} = \\sum_s q_s\\,\\boldsymbol{\\Gamma}_{s,\\mathrm{wave}}\n$$\n\n\
    where $\\mathbf{J}_{\\mathrm{wave}}$ is the wave-driven current density, $q_s$\
    \ is the charge of particle species $s$, and $\\boldsymbol{\\Gamma}_{s,\\mathrm{wave}}$\
    \ is that species\u2019 wave-driven particle flux. A resolved instance such as\
    \ [per-toroidal-mode wave-driven current density](name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive)\
    \ attributes this contribution to an individual toroidal Fourier mode; the parent\
    \ quantity does not impose that mode resolution."
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:current_density
  - name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive
- name: current_due_to_electron_cyclotron_current_drive
  kind: scalar
  status: active
  description: "Net toroidal plasma current generated non-inductively by electron-cyclotron\
    \ wave absorption and resonant wave\u2013particle interactions, summed over all\
    \ wave sources."
  documentation: 'This quantity is the net toroidal plasma current attributable to
    electron-cyclotron wave-driven current generation. It excludes inductive current
    and current produced by other non-inductive mechanisms.


    The total driven current is the toroidal projection of the driven current density
    integrated over a poloidal cross-section:


    $$

    I_{\mathrm{EC}} = \int_A j_{\phi,\mathrm{EC}}(R,Z)\,dA

    $$


    where $j_{\phi,\mathrm{EC}}$ is the electron-cyclotron-driven current-density
    component in the direction of increasing toroidal angle $\phi$, $A$ is the plasma
    cross-sectional area in the right-handed cylindrical $(R,\phi,Z)$ frame, and $dA$
    is its differential area. The quantity is a current contribution, not the absorbed
    electron-cyclotron wave power; its broader wave-driven-current counterpart is
    [current due to wave-driven current drive](name:current_due_to_wave_driven_current_drive).


    Sign convention: Positive when the driven current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_wave_driven_current_drive
  sources:
  - dd_path: summary/heating_current_drive/ec/current/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-ec-current-value
    dd_documentation:
