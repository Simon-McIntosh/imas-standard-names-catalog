    counterpart of [nitrogen density at the plasma boundary](name:nitrogen_density_at_plasma_boundary).


    Sign convention: Positive when the nitrogen ion number density is counted as a
    particle density, independent of orientation of the right-handed cylindrical $(R,\phi,Z)$
    frame.'
