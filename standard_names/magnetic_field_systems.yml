- name: radius_of_correction_coil
  kind: scalar
  status: active
  description: "Radial dimension from the center of a correction-coil conductor\u2019\
    s annular cross-section to a specified conductor boundary."
  documentation: 'The radius of a correction-coil conductor is the non-negative distance
    from the center of its annular cross-section to a specified inner or outer conductor
    boundary. It is a geometric boundary location, not the conductor thickness, transverse
    width, or cross-sectional area.


    For a specified boundary point, the radius is defined by


    $$

    r_b = \left\lVert \mathbf{x}_b - \mathbf{x}_c \right\rVert

    $$


    where $r_b$ is the boundary radius, $\mathbf{x}_b$ is the boundary-point position,
    and $\mathbf{x}_c$ is the annulus-center position; the position vectors and radius
    are measured in meters.


    The boundary designation identifies the specific quantity: [inner radius of the
    correction coil](name:inner_radius_of_correction_coil) is the inner-boundary case
    and defines the conductor bore size. The radius is non-negative and is distinct
    from annular thickness, conductor width, and cross-sectional area.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_correction_coil
- name: inner_radius_of_correction_coil
  kind: scalar
  status: active
  description: Inner radius of the annular cross-section of a non-axisymmetric correction
    coil conductor, defining the bore size of the hollow conductor or winding pack.
  documentation: 'The inner radius defines the bore boundary of the annular cross-section
    used to model a correction coil conductor or winding pack. Together with the outer
    radius given by radius_of_correction_coil, it fully specifies the hollow circular
    geometry, with conductor material occupying the annular region between $r_{\rm
    in}$ (this quantity) and $r_{\rm out}$.


    The cross-sectional area enclosed by the conductor annulus is


    $$

    A = \pi \left( r_{\rm out}^2 - r_{\rm in}^2 \right)

    $$


    where $r_{\rm out}$ is the outer radius and $r_{\rm in}$ is the inner radius,
    both in meters.


    This parameter enters electromagnetic and structural models of non-axisymmetric
    coils used for error field correction or ELM suppression. The area_of_correction_coil
    is computed directly from the inner and outer radii. An analogous bore parameter
    for poloidal field coils is given by [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).


    Sign convention: Positive when measured as a radial distance from the conductor
    bore axis to the inner conducting surface.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_poloidal_field_coil
  arguments:
  - name: radius_of_correction_coil
    operator: inner
    operator_kind: qualifier
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-conductor-cross_section-radius_inner
    dd_documentation:
      leaf: Inner radius of the annulus, used only if geometry_type/index = 5
      parent_path: coils_non_axisymmetric/coil/conductor/cross_section
      parent: The cross-section perpendicular to the conductor contour is described
        by a series of contour points, given by their relative position with respect
        to the start point of the first element. This cross-section is assumed constant
        for all elements.
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Inner radius of an annular conductor cross-section for a non-axisymmetric
        coil, applicable when the geometry type is set to annulus. Defines the hole
        radius of the annular conductor shape.
      kind: llm
- name: radius_of_iron_core_segment
  kind: scalar
  status: active
  description: "Radius of an iron-core segment is the non-negative geometry radius\
    \ used to define that segment\u2019s boundary in the poloidal cross-section of\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, where R is major radius and\
    \ Z is vertical height. It is axis-referenced only for boundary geometry defined\
    \ about the toroidal symmetry axis; otherwise it is the radius about the specified\
    \ arc center."
  documentation: 'Radius of an iron-core segment is the non-negative geometry radius
    that defines an axis-centered boundary or a circular-arc boundary of the segment.
    The relevant cross-section is the plane spanned by $R$ and $Z$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius measured from the
    toroidal symmetry axis and $Z$ is vertical height. The reference is the toroidal
    symmetry axis only for boundary geometry specified about that axis; when an explicit
    arc center is specified in the poloidal cross-section, that center is the reference.


    The defining distance is selected by the reference geometry:


    $$

    r = \begin{cases}

    R_b, & \text{for boundary geometry referenced to the toroidal symmetry axis},
    \\

    \sqrt{(R_b - R_c)^2 + (Z_b - Z_c)^2}, & \text{for boundary geometry referenced
    to an explicit arc center}.

    \end{cases}

    $$


    where $r$ is the radius, $(R_b, Z_b)$ is the boundary point, and $(R_c, Z_c)$
    is the explicit circular-arc center; $r$, $R_b$, $Z_b$, $R_c$, and $Z_c$ are expressed
    in meters. In the axis-referenced case, $R_b$ is the shortest distance from the
    boundary point to the toroidal symmetry axis.


    This quantity is a boundary-geometry radius, not the [radial coordinate of an
    iron-core segment](name:radial_coordinate_of_iron_core_segment), which is the
    $R$ coordinate of a point in the right-handed cylindrical $(R, \phi, Z)$ frame.
    It is distinct from the [outer radius of an iron-core segment](name:outer_radius_of_iron_core_segment),
    which is the outermost axis-referenced radial extent of the segment; a local or
    specified radius of an iron-core segment need not be that maximum. The radius
    alone does not specify the boundary point, arc endpoints, angular sweep, or traversal
    orientation.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
