- name: frequency_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: RF carrier frequency at which a lower-hybrid antenna launches waves
    into the plasma. It is a per-antenna operating parameter that influences wave
    accessibility, penetration, and current-drive performance together with launcher
    phasing and launched power.
  documentation: 'The frequency of a lower-hybrid antenna is the radio-frequency carrier
    frequency of the electromagnetic wave applied to that antenna. It fixes the temporal
    oscillation rate of the launched lower-hybrid wave, while the launched refractive-index
    spectrum is also determined by launcher phasing and geometry.


    The antenna frequency is commonly compared with the lower-hybrid resonance using
    angular frequency:


    $$

    \omega_\mathrm{RF}=2\pi f_\mathrm{LH,ant}, \qquad \omega_\mathrm{RF} \gtrsim \omega_\mathrm{LH}
    \approx \frac{\omega_{pi}}{\sqrt{1+\omega_{pe}^2/\omega_{ce}^2}}

    $$


    where $f_\mathrm{LH,ant}$ is the antenna frequency, $\omega_\mathrm{RF}$ is the
    launched wave angular frequency in rad s$^{-1}$, $\omega_\mathrm{LH}$ is the lower-hybrid
    resonance angular frequency, $\omega_{pi}$ and $\omega_{pe}$ are the ion and electron
    plasma angular frequencies, and $\omega_{ce}$ is the electron cyclotron angular
    frequency. In more complete cold-plasma accessibility estimates, the required
    launched parallel refractive index $n_\parallel$ is dimensionless and depends
    on frequency, density, magnetic field, and ion species.


    In practice this frequency is specified by the RF source chain and antenna design,
    and is checked using RF frequency monitoring such as frequency counters or spectrum
    analyzers. For modulated or multi-frequency operation, it denotes the carrier
    or reference frequency associated with the antenna, distinct from the launched
    power described by [launched_power_of_lower_hybrid_antenna](name:launched_power_of_lower_hybrid_antenna)
    and from the summed system power described by [total_launched_power_of_lower_hybrid_antenna](name:launched_power_of_lower_hybrid_antenna).
    Together with [toroidal_launched_wave_index_of_lower_hybrid_antenna](name:toroidal_launched_wave_index_of_lower_hybrid_antenna)
    and [poloidal_launched_wave_index_of_lower_hybrid_antenna](name:poloidal_launched_wave_index_of_lower_hybrid_antenna),
    it affects the resonant electron velocity range and the efficiency of lower-hybrid
    current drive.


    Typical lower-hybrid current-drive antenna frequencies are about $1\times10^9$-$8\times10^9$
    Hz. Representative design frequencies can be near $2.45\times10^9$ Hz or $3.7\times10^9$
    Hz, but the selected value is device-, launcher-, and scenario-specific.'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:toroidal_launched_wave_index_of_lower_hybrid_antenna
  - name:poloidal_launched_wave_index_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/antenna/frequency
    dd_path: lh_antennas/antenna/frequency
    status: composed
  - id: dd:summary/heating_current_drive/lh/frequency/value
    dd_path: summary/heating_current_drive/lh/frequency/value
