- name: maximum_neutron_escape_flux_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Peak neutron energy flux density (W m^-2) escaping through the plasma-distal
    (back) face of a breeding blanket module, defined as the maximum value of the
    local outward normal component of the neutron energy current density over that
    surface.
  documentation: "The maximum neutron escape flux $\\Phi_\\mathrm{esc,max}$ is the\
    \ supremum of the outward-normal neutron energy flux density $\\mathbf{J}_n \\\
    cdot \\hat{n}$ evaluated over the plasma-distal (back) face $\\partial V_\\mathrm{back}$\
    \ of a breeding blanket module:\n\n$$\\Phi_\\mathrm{esc,max} = \\max_{\\mathbf{r}\\\
    ,\\in\\,\\partial V_\\mathrm{back}} \\bigl(\\mathbf{J}_n(\\mathbf{r}) \\cdot \\\
    hat{n}(\\mathbf{r})\\bigr)$$\n\nwhere $\\hat{n}$ is the outward unit normal to\
    \ the back face (pointing away from the plasma) and $\\mathbf{J}_n$ is the local\
    \ neutron energy current density in W m$^{-2}$. The module-integrated power escaping\
    \ through the back face is obtained by surface integration:\n\n$$P_\\mathrm{esc}\
    \ = \\int_{\\partial V_\\mathrm{back}} \\mathbf{J}_n(\\mathbf{r}) \\cdot \\hat{n}(\\\
    mathbf{r})\\, \\mathrm{d}A$$\n\nso that $\\Phi_\\mathrm{esc,max} \\geq P_\\mathrm{esc}\
    \ / A_\\mathrm{back}$, with $A_\\mathrm{back}$ the area of the back face.\n\n\
    This quantity characterizes the neutron leakage past the breeding zone and multiplier\
    \ region. For a well-designed blanket the back-face flux is substantially attenuated\
    \ relative to the first-wall neutron flux $\\Phi_\\mathrm{FW}$; typical attenuation\
    \ ratios $\\Phi_\\mathrm{esc,max}/\\Phi_\\mathrm{FW}$ are of order $10^{-3}$\u2013\
    $10^{-1}$ depending on blanket thickness and material composition. Given a first-wall\
    \ neutron wall loading of order $10^6$\u2013$10^7$ W m$^{-2}$ for a reactor-class\
    \ device, the back-face escape flux is typically in the range $10^3$\u2013$10^5$\
    \ W m$^{-2}$. The spatial maximum (rather than the mean) is the relevant figure\
    \ of merit for shielding design because local hot-spots drive activation and heating\
    \ in the vacuum vessel and superconducting magnets behind the blanket.\n\nSign\
    \ convention: Positive when the neutron energy flux is directed outward through\
    \ the back face, i.e. away from the plasma."
  unit: W.m^-2
  physics_domain: structural_components
  links:
  - name:maximum_neutron_flux_at_first_wall_of_breeding_blanket_module
  - name:incident_neutron_power_of_breeding_blanket_module
  - name:neutron_heating_power_of_breeding_blanket_module
  - name:blanket_neutron_energy_multiplication
  - name:side_wall_thickness_of_breeding_blanket_module
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/time_slice/escape_flux_max
    dd_path: breeding_blanket/module/time_slice/escape_flux_max
    status: composed
- name: midplane_thickness_of_breeding_blanket_layer
  kind: scalar
  status: draft
  description: Radial distance between the inner and outer bounding surfaces of a
    breeding blanket layer, measured at the equatorial midplane. This is a non-negative
    scalar geometric parameter defining the local radial extent of the layer where
    the blanket cross-section is evaluated at the horizontal mid-height of the machine.
  documentation: "The midplane thickness of a breeding blanket layer is defined as\
    \ the non-negative radial distance $t \\geq 0$ between the two bounding surfaces\
    \ of the layer, evaluated at the equatorial midplane (the horizontal plane passing\
    \ through the machine axis at mid-height, $Z = 0$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame).\n\nFormally, if $R_\\mathrm{inner}$ and $R_\\mathrm{outer}$\
    \ denote the major-radius positions of the inner and outer bounding surfaces of\
    \ the layer at the midplane, then\n\n$$t = R_\\mathrm{outer} - R_\\mathrm{inner}\
    \ \\geq 0.$$\n\nBecause the blanket geometry may taper or curve away from the\
    \ midplane, the midplane thickness is the standard reference dimension used in\
    \ blanket design. It characterizes the local radial extent at the equatorial plane\
    \ where the neutron flux and tritium breeding rates are typically highest in a\
    \ tokamak.\n\nTypical values range from a few centimeters for thin functional\
    \ layers (e.g., first-wall armor or coolant channels, $\\sim 0.01$\u2013$0.05$\
    \ m) to tens of centimeters for the main tritium-breeding zone ($\\sim 0.3$\u2013\
    $0.8$ m), depending on the blanket concept. The sum of all layer midplane thicknesses\
    \ gives the total radial build of the blanket module at the midplane.\n\nThis\
    \ quantity is a purely geometric, non-negative scalar; it carries no sign ambiguity."
  unit: m
  physics_domain: structural_components
  links:
