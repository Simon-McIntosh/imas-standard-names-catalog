name: electron_temperature_at_divertor_target
status: draft
cocos_transformation_type: one_like
description: Electron temperature at the divertor target plate strike point, governing
  sheath energy transmission and material erosion conditions.
documentation: "The electron temperature at the divertor target $T_{e,\\mathrm{target}}$\
  \ characterizes the thermal energy of the electron population where open magnetic\
  \ field lines terminate on the divertor plate. Within the two-point model, $T_{e,\\\
  mathrm{target}}$ is connected to the upstream temperature $T_{e,u}$ through parallel\
  \ heat conduction along the SOL flux tube: $q_\\parallel \\propto \\kappa_0 T_e^{5/2}\
  \ \\nabla_\\parallel T_e$, where $\\kappa_0 \\approx 2000\\,\\mathrm{W\\,m^{-1}\\\
  ,eV^{-7/2}}$ is the Spitzer\u2013H\xE4rm electron thermal conductivity coefficient.\
  \ The sheath heat transmission factor $\\gamma_{\\mathrm{sh}} \\approx 7$\u2013\
  8 multiplies $T_{e,\\mathrm{target}}$ to set the conducted power density at the\
  \ plate surface. Typical values range from 1\u201350 eV in attached plasmas, dropping\
  \ below 5 eV during partial detachment and below 1 eV in fully detached conditions.\
  \ Measured by flush-mounted Langmuir probes (IV characteristic fitting) or divertor\
  \ Thomson scattering systems. Low target temperature is a key operational goal for\
  \ ITER and reactor divertor designs to limit physical sputtering and avoid tungsten\
  \ impurity influx. See `electron_density_at_divertor_target` for the companion density\
  \ condition and `scrape_off_layer_heat_flux_decay_length` for the upstream power\
  \ width."
