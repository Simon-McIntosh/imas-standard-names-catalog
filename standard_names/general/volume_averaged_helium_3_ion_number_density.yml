name: volume_averaged_helium_3_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of helium-3 ions, relevant to minority
  ion-cyclotron heating and advanced fuel cycles.
documentation: "The volume-averaged helium-3 ion number density $\\langle n_{{}^3\\\
  mathrm{He}} \\rangle_V = V^{-1} \\int n_{{}^3\\mathrm{He}}(\\mathbf{r})\\, dV$ where\
  \ $n_{{}^3\\mathrm{He}}$ is the local ${}^3\\mathrm{He}^{2+}$ density in m$^{-3}$\
  \ and $V$ is the plasma volume in m$^3$. Helium-3 is injected as a minority species\
  \ for ion-cyclotron resonance heating (ICRH) schemes; typical minority concentrations\
  \ are 1\u201310% of $n_e$, giving $\\langle n_{{}^3\\mathrm{He}} \\rangle_V \\sim\
  \ 10^{17}$\u2013$10^{19}$ m$^{-3}$. The quantity is inferred from CXRS on the He$^{2+}$\
  \ spectral lines or from residual gas analysis combined with transport modeling.\
  \ In D-${}^3$He fuel cycles, the ${}^3$He density directly determines the fusion\
  \ reactivity for the $\\mathrm{D} + {}^3\\mathrm{He} \\rightarrow {}^4\\mathrm{He}\
  \ + p$ reaction. See also `volume_averaged_helium_4_ion_number_density` and `volume_averaged_deuterium_ion_number_density`."
