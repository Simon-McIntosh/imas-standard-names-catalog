- name: converter_material_nuclear_number_density
  kind: scalar
  status: draft
  description: Number density of atomic nuclei in the converter material of a neutron
    detector, governing neutron interaction probability.
  documentation: The converter material nuclear number density $n_{\mathrm{nuc}}$
    (in m$^{-3}$) quantifies the volumetric concentration of target nuclei in the
    neutron-sensitive converter layer of a detector. This density determines the macroscopic
    interaction cross section $\Sigma = n_{\mathrm{nuc}} \sigma$, where $\sigma$ is
    the microscopic neutron cross section (in m$^{2}$), and therefore controls the
    detector's intrinsic sensitivity to incident neutrons. For common converter materials
    such as $^{6}$Li, $^{10}$B, or $^{3}$He, $n_{\mathrm{nuc}}$ ranges from approximately
    $10^{22}$ to $10^{28}$ m$^{-3}$ depending on the material phase and enrichment.
    Combined with the [converter_volume_of_neutron_detector](name:converter_volume_of_neutron_detector)
    and the [neutron_detector_converter_sensitivity](name:neutron_detector_converter_sensitivity),
    this quantity is essential for absolute calibration of neutron flux measurements.
    See also [converter_temperature_of_neutron_detector](name:converter_temperature_of_neutron_detector).
  unit: m^-3
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: converter_temperature_of_neutron_detector
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the converter element within a neutron
    detector, influencing nuclear cross-section Doppler broadening and material properties.
  documentation: "The converter temperature $T_{\\text{conv}}$ (in kelvin) quantifies\
    \ the thermal state of the neutron-sensitive material (e.g., $^{235}$U, $^{10}$B,\
    \ $^{6}$Li) within the detector. Elevated temperatures cause Doppler broadening\
    \ of nuclear resonance cross-sections and can shift the effective detection efficiency,\
    \ particularly for epithermal and thermal neutron energies where resonance structure\
    \ is significant. For fission chambers operating near the plasma vessel, converter\
    \ temperatures may reach 400\u2013600 K due to nuclear heating and proximity to\
    \ the first wall; active cooling maintains stability in precision measurement\
    \ scenarios. Temperature monitoring also serves as a diagnostic for converter\
    \ material integrity over long irradiation campaigns. See also [converter_volume_of_neutron_detector](name:converter_volume_of_neutron_detector)\
    \ and [converter_material_nuclear_number_density](name:converter_material_nuclear_number_density)."
  unit: K
  tags:
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: converter_volume_of_neutron_detector
  kind: scalar
  status: draft
  description: Physical volume of the neutron-sensitive converter element within a
    neutron detector.
  documentation: The converter volume $V_c$ (in m$^{3}$) is the active material volume
    in which incoming neutrons interact with converter nuclei (e.g., $^{6}$Li, $^{10}$B,
    or $^{3}$He) to produce detectable charged-particle products. The detection rate
    is proportional to the product $n_{\mathrm{nuc}} \sigma \, V_c$, where $n_{\mathrm{nuc}}$
    is the nuclear number density (m$^{-3}$, see [converter_material_nuclear_number_density](name:converter_material_nuclear_number_density))
    and $\sigma$ is the relevant neutron cross section (m$^{2}$). Values range from
    $\sim 10^{-6}$ m$^{3}$ for compact diamond or silicon detectors to $\sim 10^{-2}$
    m$^{3}$ for large fission chambers. Knowledge of $V_c$ is essential for absolute
    calibration of the [neutron_detector_converter_sensitivity](name:neutron_detector_converter_sensitivity)
    and contributes to the solid-angle-corrected reconstruction of [neutron_flux_total](name:neutron_flux_total).
    See also [converter_temperature_of_neutron_detector](name:converter_temperature_of_neutron_detector).
  unit: m^3
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_detector_converter_sensitivity
  kind: scalar
  status: draft
  description: "Sensitivity of the neutron-detector converter material, relating incident\
    \ neutron fluence to detector count rate via a response kernel with units cps\xB7\
    m\xB2\xB7s."
  documentation: "The converter sensitivity $S$ (in cps\xB7m\xB2\xB7s) characterizes\
    \ the efficiency with which the converter material transforms an incident neutron\
    \ field into a measurable count rate. It is defined such that the detected count\
    \ rate $C = S \\cdot \\Phi / (A \\cdot \\Delta t)$, where $\\Phi$ is the neutron\
    \ fluence (m$^{-2}$), $A$ is the effective converter area (m$^{2}$), and $\\Delta\
    \ t$ is the integration time (s); the compound unit arises from the specific normalization\
    \ convention in the data model. The sensitivity depends on the nuclear cross-section\
    \ of the converter isotope (e.g., $^{235}$U for fission chambers, $^{10}$B or\
    \ $^{6}$Li for proportional counters), the converter thickness, and the neutron\
    \ energy spectrum. It is determined through calibration against a known neutron\
    \ source or Monte Carlo transport calculations. See also [converter_material_nuclear_number_density](name:converter_material_nuclear_number_density)\
    \ and [converter_volume_of_neutron_detector](name:converter_volume_of_neutron_detector)."
  unit: cps.m^2.s
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_detector_dead_time
  kind: scalar
  status: draft
  description: Minimum time interval after a detected event during which the neutron
    detector cannot register a subsequent event.
  documentation: The dead time $\tau_d$ (in s) of a neutron detector defines the temporal
    window following each recorded pulse during which the detector electronics or
    converter medium is insensitive to additional neutron interactions. For non-paralyzable
    (Type I) detectors, the true count rate $n$ relates to the measured rate $m$ by
    $n = m / (1 - m \tau_d)$; for paralyzable (Type II) detectors the relation is
    $m = n \exp(-n \tau_d)$. Dead-time corrections become significant when $m \tau_d
    \gtrsim 0.01$, i.e., when the measured rate exceeds a few percent of $1/\tau_d$.
    Values range from $\sim 10^{-9}$ s for fast scintillation detectors to $\sim 10^{-5}$
    s for fission chambers in current-mode operation. This parameter is essential
    for accurate reconstruction of the [neutron_flux_total](name:neutron_flux_total)
    and is closely related to [neutron_pulse_overlap_probability](name:neutron_pulse_overlap_probability),
    which quantifies the resulting pulse pile-up fraction. See also [neutron_detector_converter_sensitivity](name:neutron_detector_converter_sensitivity).
  unit: s
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - real-time
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_detector_energy_band_upper_bound
  kind: scalar
  status: draft
  description: Upper energy threshold defining the acceptance window of a neutron
    detector energy band.
  documentation: The upper bound $E_{\mathrm{up}}$ (in eV) specifies the maximum neutron
    energy accepted by a given energy band of the detector. Together with the [neutron_detector_energy_band_lower_bound](name:neutron_detector_energy_band_lower_bound),
    it delimits the spectral acceptance window for counting or spectroscopic modes.
    For a DD-neutron spectrometer the upper bound is set above the 2.45 MeV peak to
    capture Doppler-broadened tails, while DT spectrometers extend above 14.1 MeV;
    fast-neutron threshold detectors may use $E_{\mathrm{up}} \sim 20$ MeV. This parameter
    enters the response-matrix construction used in the inversion of detector signals
    to obtain the [neutron_flux_total](name:neutron_flux_total). See also [neutron_source_energy_grid](name:neutron_source_energy_grid)
    and [neutron_detector_detection_efficiency](name:neutron_detector_detection_efficiency).
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_detector_recording_end_time
  kind: scalar
  status: draft
  description: Absolute time at which the neutron detector ceases data acquisition
    for the current discharge.
  documentation: The recording end time $t_{\mathrm{end}}$ (in s) marks the moment
    at which the neutron diagnostic stops collecting data, referenced to the same
    time base as other plasma diagnostics (usually the discharge trigger). It defines
    the upper bound of the valid data window for all signals from this detector channel.
    The interval between the recording start time and $t_{\mathrm{end}}$ determines
    the effective measurement duration available for time-integrated quantities such
    as neutron yield. For pulse-counting detectors, $t_{\mathrm{end}}$ also sets the
    boundary for dead-time and pile-up correction windows; see [neutron_detector_dead_time](name:neutron_detector_dead_time).
    This quantity is a metadata timestamp and does not carry independent physical
    content beyond defining the acquisition window.
  unit: s
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_energy_grid_of_detector_energy_band
  kind: scalar
  status: draft
  description: Array of discrete neutron energy values (in eV) that define the sampling
    points within a detector energy band.
  documentation: This array provides the discrete energy nodes $E_i$ (in eV) at which
    the neutron detector response or source spectrum is evaluated within a given energy
    band. The energy band is bounded by lower and upper thresholds (see [neutron_detector_energy_band_upper_bound](name:neutron_detector_energy_band_upper_bound)),
    and the grid points within that band enable spectral resolution of the detector
    sensitivity or neutron source distribution. For DT fusion plasmas, the 14.1 MeV
    peak and the 2.45 MeV DD peak are the primary spectral features; grids are chosen
    to resolve these peaks and any scattering-induced spectral broadening. The grid
    spacing may be uniform or non-uniform depending on the required resolution near
    spectral features. See also [neutron_detector_energy_band_upper_bound](name:neutron_detector_energy_band_upper_bound)
    and [converter_material_nuclear_number_density](name:converter_material_nuclear_number_density).
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - energy-balance
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_pulse_overlap_probability
  kind: scalar
  status: draft
  description: Probability that successive neutron detection pulses overlap in time,
    causing pile-up in the detector signal.
  documentation: "The pulse overlap probability $P_{\\mathrm{ov}}$ (dimensionless,\
    \ range 0\u20131) quantifies the fraction of detector events that are expected\
    \ to suffer temporal pile-up given the current neutron count rate and pulse shape.\
    \ For a Poisson-distributed arrival process with mean rate $\\dot{n}$ (s$^{-1}$)\
    \ and pulse duration $\\tau_p$ (s), a simple estimate gives $P_{\\mathrm{ov}}\
    \ \\approx 1 - \\exp(-\\dot{n} \\tau_p)$. Elevated overlap probabilities degrade\
    \ count-rate linearity and spectral resolution, requiring model-based corrections\
    \ when $P_{\\mathrm{ov}} \\gtrsim 0.05$. This quantity is closely tied to the\
    \ [neutron_detector_dead_time](name:neutron_detector_dead_time), which sets the\
    \ effective insensitivity window, and to the reconstructed [neutron_flux_total](name:neutron_flux_total),\
    \ whose accuracy depends on proper pile-up correction. See also [neutron_detector_converter_sensitivity](name:neutron_detector_converter_sensitivity)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: radius_of_neutron_detector_aperture
  kind: scalar
  status: draft
  description: Radius of the circular aperture of a neutron detector, applicable when
    the aperture geometry type is circular (geometry_type = 2).
  documentation: 'The aperture radius $r_{\text{ap}}$ (in meters) defines the circular
    opening through which neutrons pass before reaching the converter material. This
    parameter is used only when the detector aperture is modeled as a circle (geometry_type
    = 2); for rectangular apertures, the [x2_width_of_neutron_detector_aperture](name:x2_width_of_neutron_detector_aperture)
    is used instead. The solid angle subtended by the aperture at the plasma source
    determines the geometric contribution to detector sensitivity: $\Omega \approx
    \pi r_{\text{ap}}^2 / d^2$, where $d$ is the source-to-aperture distance. Values
    range from a few millimeters for compact fission chambers to several centimeters
    for large-area activation foil detectors. See also [converter_volume_of_neutron_detector](name:converter_volume_of_neutron_detector)
    and [neutron_flux_green_function_of_detector](name:neutron_flux_green_function_of_detector).'
  unit: m
  cocos_transformation_type: one_like
  tags:
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: solid_angle_of_neutron_detector_field_of_view
  kind: scalar
  status: draft
  description: Average solid angle subtended by the neutron detector within a plasma
    voxel, characterizing the geometric acceptance of the sight line.
  documentation: "The solid angle $\\Omega$ (in steradians) quantifies the angular\
    \ extent of the detector as seen from a given plasma voxel along the collimated\
    \ line of sight. It enters directly into the forward model that converts volumetric\
    \ neutron emissivity $\\varepsilon(\\mathbf{r})$ into the predicted detector count\
    \ rate via $C = \\int \\varepsilon(\\mathbf{r})\\,\\Omega(\\mathbf{r})\\,\\eta(E)\\\
    ,dV$, where $\\eta(E)$ is the energy-dependent detection efficiency and $dV$ is\
    \ the voxel volume. For tightly collimated neutron cameras on large tokamaks,\
    \ $\\Omega$ is on the order of $10^{-5}$\u2013$10^{-3}$ sr per voxel. This quantity\
    \ is computed from the aperture and detector geometry (dimensions, positions,\
    \ and orientations) using ray-tracing or analytic integration. See also [neutron_detector_detection_efficiency](name:neutron_detector_detection_efficiency)\
    \ and [neutron_detector_response_function](name:neutron_detector_response_function)."
  unit: sr
  tags:
  - derived
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: test_pulse_fall_time
  kind: scalar
  status: draft
  description: Time for the test-generator pulse amplitude to decay from its peak
    to a specified lower fraction, characterizing detector response.
  documentation: "The test pulse fall time $\\tau_f$ (in s) is the interval required\
    \ for the amplitude of a calibration pulse injected by the detector's built-in\
    \ test generator to decrease from its peak value to a defined threshold (commonly\
    \ 10% of peak or the $1/e$ level). Together with the rise time, it characterizes\
    \ the bandwidth and temporal resolution of the neutron detection electronics.\
    \ For fast scintillator-based systems $\\tau_f$ is on the order of $10^{-9}$\u2013\
    $10^{-7}$ s, while fission-chamber systems may exhibit $\\tau_f \\sim 10^{-6}$\u2013\
    $10^{-5}$ s. Accurate knowledge of $\\tau_f$ is required for dead-time modeling;\
    \ see [neutron_detector_dead_time](name:neutron_detector_dead_time). The complementary\
    \ quantity is [neutron_detector_test_pulse_fall_time](name:neutron_detector_test_pulse_fall_time),\
    \ which may refer to the same physical parameter through a different naming path."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: x1_coordinate_of_neutron_detector_aperture_outline_point
  kind: scalar
  status: draft
  description: Position along the local X1 axis of a vertex defining the arbitrary-shape
    outline of a neutron detector aperture.
  documentation: "The X1 coordinate (in meters) gives the position of a single outline\
    \ point along the first local transverse axis of the detector aperture. The full\
    \ aperture shape is described by an ordered set of such outline points in the\
    \ (X1, X2) plane, which together form a closed polygon or spline boundary. This\
    \ representation supports arbitrary aperture geometries beyond the simple circular\
    \ (geometry_type = 2) or rectangular (geometry_type = 3) cases. The local X1\u2013\
    X2 coordinate system is aligned with the detector mounting orientation; consult\
    \ the detector geometry metadata for the transformation to machine coordinates.\
    \ See also [x2_width_of_neutron_detector_aperture](name:x2_width_of_neutron_detector_aperture)\
    \ and [radius_of_neutron_detector_aperture](name:radius_of_neutron_detector_aperture)\
    \ for simplified aperture descriptions."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: x1_coordinate_of_neutron_detector_outline_point
  kind: scalar
  status: draft
  description: Position along the first local coordinate axis ($x_1$) for a vertex
    of the neutron detector body outline.
  documentation: The $x_1$ coordinate (in m) gives the position of a vertex point
    of the neutron detector body outline along the first axis of the detector's local
    coordinate system. The outline, specified as an ordered set of $(x_1, x_2)$ vertex
    pairs, describes the cross-sectional shape of the detector housing or active element.
    This geometric description is required for ray-tracing and solid-angle calculations
    that determine the detector's field of view and sensitivity pattern. Combined
    with the aperture outline coordinates (see [x2_coordinate_of_neutron_detector_aperture_outline_point](name:x2_coordinate_of_neutron_detector_aperture_outline_point)),
    the full collimation geometry is defined, enabling computation of the [solid_angle_of_neutron_detector_field_of_view](name:solid_angle_of_neutron_detector_field_of_view).
    The local coordinate convention ($x_1$, $x_2$) is specific to each detector and
    must be transformed to the tokamak $(R, Z, \phi)$ frame using position and orientation
    metadata.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: x1_width_of_neutron_detector_aperture
  kind: scalar
  status: draft
  description: Full width of the neutron detector aperture along the local X1 direction,
    used when the aperture geometry is rectangular (geometry_type = 3).
  documentation: The X1 width $w_1$ specifies one of the two transverse dimensions
    of a rectangular neutron-detector aperture in the local coordinate frame defined
    by the X1 and X2 unit vectors attached to the aperture plane. This parameter,
    together with the X2 width, determines the geometric solid-angle acceptance and
    the collimation properties of the detector sight line. It is used only when the
    aperture is described by a rectangular model (geometry_type = 3); for circular
    apertures a radius parameter replaces both widths. Values range from a few millimeters
    for tightly collimated neutron cameras to several centimeters for broad-view flux
    monitors. See also [solid_angle_of_neutron_detector_field_of_view](name:solid_angle_of_neutron_detector_field_of_view)
    and [neutron_detector_detection_efficiency](name:neutron_detector_detection_efficiency).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: x2_coordinate_of_neutron_detector_aperture_outline_point
  kind: scalar
  status: draft
  description: Position along the second local coordinate axis ($x_2$) for a vertex
    of the neutron detector aperture outline.
  documentation: The $x_2$ coordinate (in m) gives the position of a vertex point
    of the neutron detector aperture outline along the second axis of the detector's
    local coordinate system. The aperture outline, defined by a set of $(x_1, x_2)$
    vertex pairs, determines the geometric collimation of the neutron line of sight
    and thus the solid angle subtended by the detector. This geometric information
    is essential for computing the [solid_angle_of_neutron_detector_field_of_view](name:solid_angle_of_neutron_detector_field_of_view)
    and enters the Green's function calculation used to reconstruct [neutron_flux_total](name:neutron_flux_total).
    The coordinate convention ($x_1$, $x_2$) is defined in the detector's local frame;
    conversion to the tokamak $(R, Z, \phi)$ frame requires the detector position
    and orientation metadata. See also [radius_of_neutron_detector_aperture](name:radius_of_neutron_detector_aperture).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: x2_width_of_neutron_detector_aperture
  kind: scalar
  status: draft
  description: Full width of the neutron detector aperture in the local X2 direction,
    applicable when the aperture geometry type is rectangular (geometry_type = 3).
  documentation: The X2 width $w_2$ (in meters) specifies the full extent of a rectangular
    neutron detector aperture along the local second transverse axis (X2). This dimension
    is used only when geometry_type = 3, indicating a rectangular opening. Together
    with the X1 width, it defines the aperture area $A = w_1 \times w_2$ that determines
    the geometric solid-angle acceptance of the detector. The local coordinate system
    (X1, X2, X3) is defined per the detector orientation in the machine coordinate
    frame. Values range from millimeters to centimeters depending on detector design
    requirements for spatial resolution versus counting statistics. See also [radius_of_neutron_detector_aperture](name:radius_of_neutron_detector_aperture)
    for the circular geometry case and [neutron_flux_green_function_of_detector](name:neutron_flux_green_function_of_detector)
    for the resulting flux kernel.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
