name: ion_to_electron_density_ratio_radial_derivative
status: draft
cocos_transformation_type: one_like
description: First derivative of the total-ion to electron density ratio with respect
  to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}$.
documentation: "Defined as $d(n_i^{\\mathrm{tot}} / n_e) / d\\rho_{\\mathrm{tor,norm}}$,\
  \ where $n_i^{\\mathrm{tot}}$ is the total ion density summed over all species and\
  \ charge states (thermal + non-thermal) and $n_e$ is the electron number density.\
  \ This gradient characterizes the radial variation of the effective ion-to-electron\
  \ density ratio and is relevant to impurity transport modeling, where $Z_{\\mathrm{eff}}$\
  \ gradients couple to particle and momentum transport equations. In a pure single-species\
  \ plasma the ratio is unity and this derivative vanishes identically. In reactor-relevant\
  \ scenarios with moderate impurity seeding, typical magnitudes are of order $10^{-2}$\u2013\
  $10^{-1}$ per unit $\\rho_{\\mathrm{tor,norm}}$ in the pedestal region. The quantity\
  \ is produced by transport solvers as an intermediate numerical derivative. See\
  \ `second_radial_derivative_of_ion_to_electron_density_ratio` for the second derivative\
  \ and `electron_number_density` for the denominator."
