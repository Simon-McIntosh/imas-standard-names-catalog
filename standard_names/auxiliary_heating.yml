- name: thickness_of_oblique_cross_section_of_ion_cyclotron_antenna_strap
  kind: scalar
  status: draft
  description: Perpendicular thickness of the oblique (parallelogram or trapezoidal)
    cross-section of an ion cyclotron antenna strap conductor, measured as the perpendicular
    distance between the two parallel edges that span the strap in the poloidal plane
    (R, Z). This is the height of the cross-sectional shape, not the slant-side length.
  documentation: 'The oblique cross-section of an ion cyclotron antenna strap lies
    in the poloidal $(R, Z)$ plane and has a parallelogram or trapezoidal shape defined
    by a dominant span length $L$, inclination angles $\alpha$ and $\beta$ that tilt
    the lateral sides away from the normal, and the thickness $d$.


    The quantity $d$ is the **perpendicular distance** between the two parallel edges
    of the cross-section that run along the dominant span direction (i.e., along $L$).
    It is the geometric height of the shape, not the length of the slant sides $a$
    or $b$.


    **Parallelogram case:** Both parallel sides have the same length $L$, and the
    cross-sectional area is exactly

    $$A = d \times L.$$


    **Trapezoid case:** The two parallel sides have lengths $L_1$ and $L_2$ (which
    differ due to differing inclination angles $\alpha$ and $\beta$), and the cross-sectional
    area is

    $$A = \tfrac{1}{2}(L_1 + L_2)\,d.$$


    In both cases $d$ is the perpendicular height measured in the poloidal $(R, Z)$
    plane between the two mutually parallel edges. The slant sides $a$ (alpha side)
    and $b$ (beta side) are related to $d$ and the inclination angles by $a = d /
    \cos\alpha$ and $b = d / \cos\beta$.


    Typical values of $d$ for ICRF antenna strap conductors range from approximately
    $0.01\,\mathrm{m}$ to $0.10\,\mathrm{m}$, depending on the machine and strap design.


    This thickness governs the conductor cross-sectional area and thus the current-carrying
    capacity and RF surface impedance of the strap. It enters directly into electromagnetic
    modeling of the antenna near field and into structural stress analysis under electromagnetic
    and thermal loads.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:length_of_oblique_geometry
  - name:alpha_side_length_of_oblique_geometry
  - name:beta_side_length_of_oblique_geometry
  - name:height_of_rectangle_geometry
  - name:toroidal_width_of_rectangle_geometry_of_ion_cyclotron_antenna_strap
  constraints: []
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/thickness
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/thickness
    status: composed
  - id: dd:iron_core/segment/geometry/oblique/thickness
    dd_path: iron_core/segment/geometry/oblique/thickness
    status: composed
- name: thickness_of_thick_line_geometry
  kind: scalar
  status: draft
  description: Perpendicular thickness of a conductor element modeled using the thick-line
    geometric approximation. This non-negative scalar length quantifies the cross-sectional
    extent of the element in the direction normal to the segment centerline within
    the cross-sectional plane.
  documentation: "In the thick-line geometric model, a conductor element (e.g., an\
    \ ion-cyclotron antenna strap or an iron-core segment) is approximated by a planar\
    \ cross-section characterized by two orthogonal dimensions: a length $L$ along\
    \ the segment direction and a thickness $d$ perpendicular to it. The thickness\
    \ $d$ is defined as the extent of the cross-section along the unit normal $\\\
    hat{n}$ to the segment centerline, lying in the cross-sectional plane.\n\nThe\
    \ cross-sectional area of the thick-line element is related to its geometric parameters\
    \ by:\n\n$$A = L \\times d$$\n\nfor a rectangular cross-section, where $L$ is\
    \ the in-plane length (see `length_of_thick_line_geometry`). Because $d$ is defined\
    \ as a geometric extent (a distance), it is intrinsically non-negative: $d \\\
    geq 0$. A value of $d = 0$ corresponds to the degenerate case of an infinitesimally\
    \ thin (pure line) element.\n\nTypical values:\n- IC antenna straps: $d \\approx\
    \ 0.005$\u2013$0.05$ m\n- Iron-core segments: $d \\approx 0.01$\u2013$0.5$ m\n\
    \nThe thick-line parameterization is used in electromagnetic modeling to capture\
    \ the finite cross-sectional extent of conductors without resolving full 3-D geometry,\
    \ enabling efficient computation of inductance, current distribution, and near-field\
    \ coupling."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_width_of_ion_cyclotron_antenna_strap
  - name:distance_of_antenna_strap_to_conducting_wall
  constraints: []
  sources:
