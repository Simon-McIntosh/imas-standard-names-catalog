name: poloidal_field_coil_current_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the poloidal field coil current is treated
  as exact input (1) or fitted (0) in equilibrium reconstruction.
documentation: This flag specifies whether the measured poloidal field (PF) coil current
  $I_{\rm PF}$ is imposed as an exact constraint or enters the least-squares cost
  functional during equilibrium reconstruction. When set to 1, the solver uses the
  provided coil current directly to compute the external vacuum field contribution;
  when 0, $I_{\rm PF}$ is treated as a soft measurement and may be adjusted within
  its uncertainty. PF coil currents are typically measured by Hall-effect sensors
  or Rogowski coils with relative precision better than 0.1%, making exact treatment
  common in practice. Accurate PF current specification is essential because the external
  field dominates the total poloidal flux at the plasma boundary. See the companion
  constraint weight for the soft-constraint mode.
