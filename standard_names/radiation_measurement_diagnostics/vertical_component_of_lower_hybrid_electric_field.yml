name: vertical_component_of_lower_hybrid_electric_field
status: draft
description: Projection of the lower-hybrid wave electric field onto the vertical
  direction $\hat{Z}$ in cylindrical coordinates.
documentation: 'The vertical component $E_{\mathrm{LH},Z} = \mathbf{E}_{\mathrm{LH}}
  \cdot \hat{Z}$ is the oscillating electric field of lower-hybrid waves resolved
  along the vertical axis of the tokamak cylindrical coordinate system $(R, \phi,
  Z)$. Together with the radial and toroidal components, it fully specifies the local
  LH wave polarization, which determines the wave''s coupling to particle orbits and
  its efficiency for non-inductive current drive. Measured via Stark-effect polarization
  spectroscopy on visible emission lines in the plasma edge, typical amplitudes range
  from 0.1 to 10 kV/m for multi-megawatt LH launchers. Note: the stated unit $\mathrm{m^{-1}
  \cdot V}$ is dimensionally equivalent to $\mathrm{V/m}$. The three cylindrical components
  together enable reconstruction of the wave polarization ellipse and comparison with
  full-wave simulation codes. See also `toroidal_component_of_lower_hybrid_electric_field`
  and `radial_component_of_lower_hybrid_electric_field`.'
