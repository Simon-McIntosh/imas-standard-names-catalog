    dd_path: summary/line_average/n_i/oxygen/value
    status: composed
- name: solid_angle_of_neutron_detector
  kind: scalar
  status: draft
  description: Solid angle subtended by a neutron detector aperture at a neutron emission
    point, or the volume-averaged value over a finite source region. It is a nonnegative
    geometric acceptance in steradians, separate from detector efficiency or material
    response.
  documentation: 'Solid angle of a neutron detector is the apparent angular size of
    its accepting aperture as seen from where neutrons are emitted. When one value
    represents a finite source region, it is the volume average of the pointwise solid
    angle over that region. It is a non-negative geometric acceptance and does not
    include intrinsic detector efficiency, neutron conversion probability, attenuation,
    or scattering.


    The pointwise solid angle for an unobstructed aperture is the surface integral
    of the visible projected area divided by squared distance:


    $$

    \Omega(\mathbf{x}) = \int_S \frac{\max\left[0,\hat{\mathbf{n}}(\mathbf{y})\cdot(\mathbf{x}-\mathbf{y})\right]}{|\mathbf{x}-\mathbf{y}|^3}\,dA(\mathbf{y})

    $$


    where $\mathbf{x}$ is the emission point, $\mathbf{y}$ is a point on the transmitting
    aperture surface $S$, $dA$ is an aperture area element, and $\hat{\mathbf{n}}$
    points toward the side from which neutrons are accepted. The $\max$ operation
    enforces a non-negative projection: aperture elements facing away from the emission
    point contribute zero. For a small flat aperture of area $A$ at distance $d$ and
    incidence angle $\alpha$, this reduces to $\Omega \simeq A\max(0,\cos\alpha)/d^2$;
    for isotropic emission, the purely geometric intercepted fraction is $\Omega/(4\pi)$
    before applying any efficiency or transport factors.


    For a finite source region $V$ with physical volume $|V|$, the averaged value
    is $\langle\Omega\rangle_V=|V|^{-1}\int_V\Omega(\mathbf{x})\,dV$. This average
    lies between the minimum and maximum pointwise solid angles within the region
    and is bounded by the full-sphere value, $0 \le \langle\Omega\rangle_V \le 4\pi$.
    It is computed from the measured aperture, collimator, and line-of-sight geometry
    using analytic formulas for simple apertures or numerical surface integration
    and ray tracing for finite openings and partial visibility.


    Typical values are $10^{-6}$-$10^{-3}$ sr for narrow collimated neutron viewing
    channels and $10^{-3}$-$10^{-1}$ sr for nearby or wide-aperture views. Values
    approaching 1 sr require a very large or very close accepting aperture; no physical
    aperture can exceed $4\pi$ sr as seen from an emission point.'
  unit: sr
  physics_domain: particle_measurement_diagnostics
  links:
  - name:surface_area_of_neutron_detector
  - name:efficiency_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/field_of_view/solid_angle
    dd_path: neutron_diagnostic/detector/field_of_view/solid_angle
    status: attached
  - id: dd:neutron_diagnostic/detectors/field_of_view/solid_angle
    dd_path: neutron_diagnostic/detectors/field_of_view/solid_angle
    status: composed
- name: surface_area_of_neutron_detector
  kind: scalar
  status: draft
  description: Total geometric area of the neutron detector's neutron-sensitive active
    surface, excluding passive housing, shielding, supports, and electronics. For
    segmented or curved detectors it is the sum or integral of the active surface
    area, not a projected area or solid angle.
  documentation: 'Surface area of a neutron detector is the unsigned geometric area
    of the detector surface that can register or convert incident neutrons. It refers
    to active neutron-sensitive material or the active entrance face coupled to that
    material, and excludes passive structures such as housings, shielding, supports,
    cables, and electronics.


    For an active surface $S$, the area $A$ is defined by integrating the local surface
    element over the active region:


    $$

    A = \int_S dA

    $$


    where $dA$ is the differential geometric surface area element. For a detector
    made of multiple active patches, $A$ is the sum of the patch areas; for a flat
    circular or rectangular face it reduces to the usual geometric face area.


    This quantity is commonly determined from mechanical drawings, aperture definitions,
    metrology, or manufacturer specifications of the neutron-sensitive face. In count-rate
    estimates for a uniform mono-directional neutron flux normally incident on a flat
    active face, an approximate relation is $C \approx \Phi A \epsilon$, where $C$
    is count rate in s$^{-1}$, $\Phi$ is neutron flux in m$^{-2}$ s$^{-1}$ at the
    detector face, and $\epsilon$ is the detection efficiency. For oblique incidence,
    the effective projected area includes angular factors such as $\cos\alpha$ or
    a measured angular response; collimator width, aperture shape, and solid angle
    are separate geometric quantities and should not be inferred from area alone.


    Typical active surface areas range from $10^{-6}$-$10^{-4}$ m$^2$ for small diamond,
    silicon, or compact scintillator detectors, $10^{-4}$-$10^{-2}$ m$^2$ for common
    scintillator or proportional-counter faces, and up to about $10^{-1}$ m$^2$ for
    large moderated or extended detector assemblies.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_neutron_detector
  - name:efficiency_of_neutron_detector
  - name:solid_angle_of_neutron_detector
  - name:volume_of_neutron_detector_converter
  - name:neutron_flux_of_neutron_detector
