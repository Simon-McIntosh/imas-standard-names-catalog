      kind: llm
- name: plasma_power_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Power deposited on plasma-facing wall surfaces when incident plasma
    ions recombine at the material boundary, representing the ion-channel contribution
    to total wall recombination power.
  documentation: 'Plasma-ion recombination power at the wall is the rate at which
    recombination energy from incident plasma ions is deposited in plasma-facing wall
    material. It is the ion-channel contribution to the total wall heat load from
    recombination.


    The contribution is defined by


    $$

    P_{\mathrm{rec,wall}}^{\mathrm{plasma}} = \sum_s \int_A \Gamma_s^{\mathrm{ion}}
    E_{\mathrm{rec},s}\,\mathrm{d}A

    $$


    where $s$ indexes the contributing plasma-ion species and charge states, $\Gamma_s^{\mathrm{ion}}$
    is the incident particle flux, $E_{\mathrm{rec},s}$ is the recombination energy
    deposited per event, and $A$ is the total plasma-facing wall area.


    This quantity excludes surface recombination of incident neutral particles into
    molecules, represented by [neutral recombination power at the wall](name:neutral_power_at_wall_due_to_recombination).
    Together, the two channels form [total recombination power at the wall](name:power_at_wall_due_to_recombination),
    which is distinct from volumetric [power due to recombination](name:power_due_to_recombination).'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_power_at_wall_due_to_recombination
  - name:power_at_wall_due_to_recombination
