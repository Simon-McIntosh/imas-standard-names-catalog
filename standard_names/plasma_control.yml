- name: vertical_coordinate_of_gap_reference_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the reference point defining a plasma boundary
    gap in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z$ of a gap reference point specifies the
    height, measured along the machine symmetry axis, of the geometric reference location
    used to define a plasma boundary gap. Plasma boundary gaps are scalar distances
    between the last closed flux surface and a specified first-wall or limiter geometry
    element; the reference point anchors the gap measurement in the poloidal cross-section.
    This coordinate is used in real-time position control and in post-shot equilibrium
    reconstruction to characterize the plasma shape and proximity to plasma-facing
    surfaces, with typical values spanning roughly $-3$ m to $+3$ m depending on machine
    size and the vertical extent of the vacuum vessel. The companion radial coordinate
    of the same reference point provides the full poloidal location of the gap anchor,
    while the analogous [vertical coordinate of an oblique reference point](name:vertical_coordinate_of_oblique_reference_point)
    and [vertical coordinate of a plasma-facing component outline point](name:vertical_coordinate_of_plasma_facing_component_outline_point)
    follow the same spatial convention.


    Sign convention: Positive when the gap reference point is above the machine midplane,
    i.e., in the direction of increasing $Z$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_control
  links:
