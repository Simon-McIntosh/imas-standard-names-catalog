- name: runaway_electron_kinetic_energy
  kind: scalar
  status: draft
  description: Total relativistic kinetic energy integrated over the entire runaway
    electron population, providing a global measure of runaway beam energy content
    relevant to disruption mitigation.
  documentation: "The runaway electron kinetic energy is the total relativistic kinetic\
    \ energy carried by all electrons in the runaway population, integrated over both\
    \ velocity space and the plasma volume. It quantifies the collective destructive\
    \ energy of a runaway beam and is a primary figure of merit for assessing damage\
    \ potential to plasma-facing components during disruptions.\n\nThe quantity is\
    \ obtained by integrating the single-particle relativistic kinetic energy over\
    \ the runaway electron distribution function $f_{RE}(\\mathbf{p})$:\n\n$$\nW_{RE}\
    \ = \\int (\\gamma - 1)\\, m_e c^2 \\, f_{RE}(\\mathbf{p}) \\, d^3\\mathbf{p}\
    \ \\, dV\n$$\n\nwhere $\\gamma = \\sqrt{1 + p^2/(m_e^2 c^2)}$ is the Lorentz factor,\
    \ $m_e$ is the electron rest mass, $c$ is the speed of light, $\\mathbf{p}$ is\
    \ the relativistic momentum, and $V$ is the plasma volume.\n\nThis global integral\
    \ complements the local [runaway_electron_energy_density](name:runaway_electron_energy_density),\
    \ which expresses the same energy per unit volume. Combined with [runaway_electron_count](name:runaway_electron_count),\
    \ it yields the mean kinetic energy per runaway electron, characterizing the typical\
    \ particle energy in the beam.\n\nIn large-tokamak disruption scenarios, runaway\
    \ beam energies range from tens of kJ in minor events to tens of MJ in full-current\
    \ disruptions, with individual electron energies of 1\u2013100 MeV. The total\
    \ energy is inferred from hard X-ray bremsstrahlung spectroscopy, synchrotron\
    \ radiation imaging, or computed from kinetic simulations of runaway generation\
    \ and transport."
  unit: J
  physics_domain: transport
  links: []
  sources:
  - id: dd:runaway_electrons/global_quantities/energy_kinetic
    dd_path: runaway_electrons/global_quantities/energy_kinetic
    status: composed
- name: runaway_electron_source_rate_due_to_compton_scattering
  kind: scalar
  status: draft
  description: Local volumetric production rate of runaway electrons generated by
    Compton scattering of high-energy gamma-ray photons off plasma electrons. It counts
    scattering events in which the recoiling electron gains enough momentum to exceed
    the critical runaway momentum and join the runaway population.
  documentation: 'Runaway-electron source rate due to Compton scattering is the local
    rate of increase of runaway-electron number density caused by Compton scattering
    of high-energy gamma-ray photons off plasma electrons. In a scattering event a
    photon transfers part of its energy and momentum to an electron; if the recoiling
    electron''s momentum exceeds the critical runaway momentum, the electron joins
    the runaway population. The relevant threshold is the critical momentum shared
    by avalanche, Compton, and tritium-decay generation channels, described by [volume_averaged_critical_momentum](name:volume_averaged_critical_momentum)
    and [critical_momentum_due_to_avalanche](name:critical_momentum_due_to_avalanche).


    This source rate is obtained schematically by folding the local photon flux against
    the Compton scattering kinematics and retaining only events that push the electron
    above the runaway threshold:


    $$

    S_\mathrm{Compton} = n_e \int \Phi_\gamma(E_\gamma) \left[ \int_{p > p_\mathrm{crit}}
    \frac{d\sigma}{dp}\, dp \right] dE_\gamma

    $$


    where $S_\mathrm{Compton}$ is this source rate in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$,
    $n_e$ is the target-electron number density in $\mathrm{m}^{-3}$, $\Phi_\gamma(E_\gamma)$
    is the differential gamma-ray photon flux as a function of photon energy $E_\gamma$,
    $d\sigma/dp$ is the Compton differential cross section for producing a recoil
    electron of momentum $p$, and $p_\mathrm{crit}$ is the critical runaway momentum.
    This term enters the local runaway-electron density balance additively alongside
    other source and loss terms such as Dreicer generation, hot-tail seeding, avalanche
    multiplication, tritium-decay seeding, and transport losses.


    In practice this rate is computed rather than measured directly: it relies on
    a model of the local gamma-ray photon spectrum (typically from activated structural
    materials), the local electron density, the Compton differential cross section,
    and the runaway-threshold momentum. It is constrained indirectly through photon-source
    modeling, gamma-ray measurements, and comparison with the resulting runaway-electron
    density or current evolution.


    Typical values are strongly scenario dependent because the rate scales with the
    local gamma-ray flux, the photon energy spectrum, the target-electron density,
    and the critical momentum. In configurations without a penetrating high-energy
    gamma source the appropriate value is $0\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$. As
    a local volumetric rate it should be compared with sibling local source terms
    such as [runaway_electron_source_rate_due_to_hot_tail](name:runaway_electron_source_rate_due_to_hot_tail);
    its spatial mean over the plasma volume, with the same unit, is [volume_averaged_runaway_electron_source_rate](name:volume_averaged_runaway_electron_source_rate),
    which is a volume average rather than the volume-integrated total production rate.
    The corresponding source rate for the broader suprathermal population produced
    by the same mechanism is [fast_electron_source_rate_due_to_compton_scattering](name:fast_electron_source_rate_due_to_compton_scattering).


    Sign convention: Positive when Compton scattering increases the local runaway-electron
    number density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:runaway_electrons/ggd_fluid/ddensity_dt_compton/values
    dd_path: runaway_electrons/ggd_fluid/ddensity_dt_compton/values
    status: attached
- name: runaway_electron_source_rate_due_to_hot_tail
  kind: scalar
  status: draft
  description: Local volumetric rate at which a rapid thermal quench converts surviving
    suprathermal electrons of the pre-quench distribution into runaway electrons by
    the hot-tail mechanism. It counts only electrons driven above the runaway threshold,
    and is a non-negative production term.
  documentation: 'Runaway electron source rate due to hot-tail generation is the local
    rate of increase of runaway electron density produced when suprathermal electrons
    fail to thermalize during a rapid electron-temperature collapse and are left above
    the runaway threshold. It is a scalar volumetric source density in real space;
    its value at a point is independent of the coordinate labeling, including the
    right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    The source rate is defined as the hot-tail contribution to the time derivative
    of the runaway electron density:


    $$

    S_\mathrm{ht} = \left.\frac{\partial n_\mathrm{RE}}{\partial t}\right|_\mathrm{hot\text{-}tail}

    $$


    where $n_\mathrm{RE}$ is the runaway electron density in m$^{-3}$. The magnitude
    depends on the competition between collisional slowing-down and the thermal-quench
    time scale, and on the evolving critical runaway momentum threshold, quantified
    by [critical_momentum_due_to_hot_tail](name:critical_momentum_due_to_hot_tail)
    (expressed as a physical momentum in kg m$^{-1}$ s$^{-1}$); electrons retaining
    momentum above this threshold after cooling are counted as runaways.


    This quantity is computed from kinetic or reduced runaway-electron models by integrating
    the part of the pre-quench electron distribution that survives above the critical
    momentum after rapid cooling. By construction it is a one-sided production term:
    it represents only the addition of runaway electrons and is therefore non-negative,
    with losses handled by separate sink terms. It is often compared with the [Dreicer
    source](name:runaway_electron_source_rate_due_to_dreicer) and can dominate seed
    formation when the temperature drop is fast compared with suprathermal-electron
    collisional relaxation. The analogous rate for the broader fast-electron population
    produced by the same mechanism is [fast_electron_source_rate_due_to_hot_tail](name:fast_electron_source_rate_due_to_hot_tail),
    part of the aggregate [fast_electron_source_rate](name:fast_electron_source_rate);
    the volume-averaged counterpart of all runaway generation channels is [volume_averaged_runaway_electron_source_rate](name:volume_averaged_runaway_electron_source_rate).


    The rate is essentially zero outside a rapid thermal quench and rises sharply
    during disruptions, with the peak local value set by the pre-quench temperature
    and density, the cooling time, the effective charge, and the post-quench electric
    field.'
  unit: m^-3.s^-1
  physics_domain: transport
  links:
  - name:critical_momentum_due_to_hot_tail
  - name:runaway_electron_source_rate_due_to_dreicer
  - name:fast_electron_source_rate_due_to_hot_tail
  - name:volume_averaged_runaway_electron_source_rate
  sources:
  - id: dd:runaway_electrons/ggd_fluid/ddensity_dt_hot_tail/values
    dd_path: runaway_electrons/ggd_fluid/ddensity_dt_hot_tail/values
    status: attached
- name: safety_factor
  kind: scalar
  status: draft
  description: Dimensionless ratio of toroidal to poloidal magnetic flux increments
    per field-line circuit, equal to the number of times a field line winds toroidally
    per complete poloidal transit of a flux surface.
  documentation: "The safety factor $q(\\psi)$ measures the helical winding of magnetic\
    \ field lines on a given flux surface: it equals the number of complete toroidal\
    \ transits a field line completes for each poloidal circuit around the inner plasma\
    \ region.\n\nThe formal definition relates $q$ to the ratio of magnetic flux increments:\n\
    \n$$\nq = \\frac{d\\Phi_{\\rm tor}}{d\\Phi_{\\rm pol} / (2\\pi)}\n$$\n\nwhere\
    \ $\\Phi_{\\rm tor}$ is the toroidal magnetic flux (Wb) enclosed within the flux\
    \ surface and $\\Phi_{\\rm pol}$ is the poloidal magnetic flux (Wb) encircled\
    \ by the flux-surface boundary. Surfaces where $q = m/n$ (integers $m$, $n$) are\
    \ resonant with magnetohydrodynamic perturbations of poloidal mode number $m$\
    \ and toroidal mode number $n$, enabling tearing modes and neoclassical tearing\
    \ modes; the $q = 1$ resonant surface underpins sawtooth instabilities, and the\
    \ $q = 2$ surface is associated with the onset of neoclassical tearing modes in\
    \ high-performance discharges.\n\nIn conventional H-mode operation, the [safety\
    \ factor at the magnetic axis](name:safety_factor_at_magnetic_axis) is typically\
    \ near 1, while the [safety factor at the 95% normalized poloidal flux surface](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95)\
    \ lies in the range 3\u20135. Reversed-shear configurations have an interior $q$\
    \ minimum, and elevated $q$ at the [pedestal](name:safety_factor_at_pedestal)\
    \ constrains edge stability. The $q$ profile is inferred from equilibrium reconstruction\
    \ augmented by internal measurements such as motional Stark effect polarimetry\
    \ or Faraday rotation; it is also evaluated locally on individual flux surfaces\
    \ in gyrokinetic turbulence simulations.\n\nSign convention: Positive when the\
    \ toroidal magnetic field $B_\\phi$ and the plasma current $I_p$ are both directed\
    \ in the sense of increasing toroidal angle $\\phi$."
  unit: '1'
  physics_domain: transport
  links:
  - name:safety_factor_at_magnetic_axis
  - name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  - name:safety_factor_at_pedestal
