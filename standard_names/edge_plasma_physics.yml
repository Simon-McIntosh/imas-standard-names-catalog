- name: flux_surface_averaged_oxygen_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of oxygen impurity ions evaluated at the plasma boundary
    is the flux-surface average of the charge-state-summed oxygen ion concentration
    on the last closed flux surface. It is summed over all ionization states of oxygen
    and excludes neutral oxygen.
  documentation: 'Number density of oxygen impurity ions evaluated at the plasma boundary
    is the flux-surface-averaged particle concentration of ionized oxygen on the last
    closed flux surface. It is summed over all oxygen charge states from singly ionized
    oxygen through fully stripped oxygen, excludes neutral oxygen, and counts each
    ion as one oxygen particle rather than weighting it by charge.


    The boundary flux-surface average is defined by


    $$

    \left\langle n_{\mathrm{O}} \right\rangle_b =

    \lim_{\psi \to \psi_b^-}

    \frac{\oint_{\psi} \left(\sum_{j=1}^{8} n_{\mathrm{O}^{j+}}\right)\, dl/B_p}

    {\oint_{\psi} dl/B_p}

    $$


    where $\psi$ is the poloidal magnetic-flux surface label, $\psi_b$ is its value
    at the last closed flux surface, $n_{\mathrm{O}^{j+}}$ is the number density of
    oxygen ions in charge state $j$, $j=1,\ldots,8$ spans singly ionized through fully
    stripped oxygen, $dl$ is a poloidal contour-length element on the flux surface,
    $B_p$ is the magnitude of the poloidal magnetic field, and $\oint_{\psi}$ denotes
    integration around that flux surface. The limit is taken from the confined-plasma
    side when the boundary is a separatrix.


    This quantity is one charge-state-summed impurity-species contribution to [flux-surface-averaged
    ion density at the plasma boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary).
    It is distinct from [volume-averaged oxygen density](name:volume_averaged_oxygen_density),
    which averages the same charge-state-summed oxygen ion density over a confined
    plasma volume rather than over the boundary flux surface, and from [oxygen density
    at the plasma boundary], which does not carry the flux-surface-average qualifier.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_ion_density_at_plasma_boundary
  - name:volume_averaged_oxygen_density
  sources:
  - dd_path: summary/local/separatrix_average/n_i/oxygen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-oxygen-value
    dd_documentation:
      leaf: Value
