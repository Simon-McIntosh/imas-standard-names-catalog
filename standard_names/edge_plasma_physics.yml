- name: oxygen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of oxygen impurity ions at the
    plasma boundary, defined by the last closed flux surface separating the confined
    plasma from the scrape-off layer. It represents the sum over oxygen ion charge
    states, not neutral oxygen.
  documentation: 'Oxygen density at the plasma boundary is the elemental number density
    of ionized oxygen on the last closed flux surface, taken as a flux-surface average
    over that boundary. It is one impurity-species contribution to [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary);
    the quantity counts oxygen ions as particles and is not charge-weighted.


    The total oxygen ion density at the boundary is obtained by summing charge-state-resolved
    oxygen ion densities and applying the boundary flux-surface average:


    $$

    n_{\mathrm{O},b} = \left\langle \sum_{q=1}^{8} n_{\mathrm{O}^{q+}} \right\rangle_{\mathrm{LCFS}}

    $$


    where $n_{\mathrm{O}^{q+}}$ is the number density of oxygen ions with charge $q
    e$, $q=1$ to $8$ spans singly ionized through fully stripped oxygen, and $\langle\cdot\rangle_{\mathrm{LCFS}}$
    denotes the flux-surface average over the last closed flux surface, normally understood
    as the closed-surface limit approaching the separatrix.


    In practice this density is inferred from impurity spectroscopy combined with
    electron temperature, electron density, ionization balance, and impurity transport
    modeling. Line emission constrains charge states with bound electrons, while the
    fully stripped contribution is inferred indirectly from ionization balance or
    recombination-related information.


    Typical boundary oxygen ion densities are highly scenario dependent. In tokamak
    edge analyzes oxygen is usually a trace impurity, with representative values around
    10^14-10^18 m^-3, and should be interpreted relative to the local total ion and
    electron densities.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:nitrogen_density_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/oxygen/value
    dd_path: summary/local/separatrix/n_i/oxygen/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/oxygen/value
    dd_path: summary/local/separatrix_average/n_i/oxygen/value
    status: composed
- name: radial_plasma_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Effective radial diffusion coefficient for cross-field transport of
    ion-fluid momentum in the edge plasma. It aggregates the momentum carried by all
    ion species and charge states into a single transport parameter, rather than resolving
    it per species or charge state.
  documentation: 'Radial plasma momentum diffusion coefficient is the scalar coefficient
    that relates the radial (cross-field) diffusive flux of ion-fluid momentum to
    the radial gradient of momentum density in the edge plasma. It is an aggregate
    quantity summed over all ion species and charge states; electron inertial momentum
    is usually negligible in these ion-dominated edge regimes and is not included.
    It complements the species- and charge-state-resolved [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity).


    In a Fickian transport closure, the radial diffusive flux of a momentum component
    is proportional to the radial gradient of the corresponding aggregate momentum
    density:


    $$

    \Gamma_j = -D \, \frac{\partial \mathcal{P}_j}{\partial r_\perp}

    $$


    where $D$ is the radial plasma momentum diffusion coefficient, $\Gamma_j$ is the
    radial flux of the $j$-th momentum component in kg m^-1 s^-2, $r_\perp$ is the
    distance measured outward normal to flux surfaces in m, and $\mathcal{P}_j = \sum_{a,z}
    m_a\, n_{a,z}\, u_{a,z,j}$ is the aggregate ion momentum density in kg m^-2 s^-1,
    with $m_a$ the ion mass in kg, $n_{a,z}$ the number density of charge state $z$
    of species $a$ in m^-3, and $u_{a,z,j}$ the corresponding fluid-velocity component
    in m s^-1. The leading minus sign means a positive coefficient drives momentum
    down its gradient, from regions of higher toward lower momentum density.


    The coefficient is typically inferred as an effective transport parameter from
    edge momentum-balance analysis, measured ion flows and rotation shear, and comparisons
    with collisional, neoclassical, or turbulence-based transport estimates. It is
    the aggregate momentum counterpart to the aggregate energy and particle transport
    coefficients [radial_total_energy_diffusion_coefficient](name:radial_total_energy_diffusion_coefficient)
    and [radial_diffusion_coefficient](name:radial_diffusion_coefficient), and pairs
    with the convective term radial_ion_effective_momentum_convection_velocity in
    diffusion-convection closures.


    Representative effective edge-plasma values used in transport modeling are of
    order 0.01-10 m^2 s^-1, with smaller values where diffusive coupling is weak and
    larger values in regions of strong turbulent or externally driven momentum redistribution.
    This range is indicative and not a physical bound.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_momentum_diffusivity
  - name:radial_total_energy_diffusion_coefficient
  - name:radial_diffusion_coefficient
  sources:
  - id: dd:edge_transport/model/ggd/momentum/d_radial/values
    dd_path: edge_transport/model/ggd/momentum/d_radial/values
    status: composed
- name: toroidal_argon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of argon impurity bulk flow velocity evaluated at
    the H-mode pedestal top, a key quantity for determining the pedestal radial electric
    field through the impurity force balance.
  documentation: 'The toroidal velocity of argon ions at the pedestal top quantifies
    the $\hat{\phi}$-directed bulk flow of this impurity species within the steep-gradient
    edge transport barrier of H-mode plasmas. Alongside [toroidal nitrogen velocity
    at the pedestal](name:toroidal_nitrogen_velocity_at_pedestal) and [toroidal tungsten
    velocity at the pedestal](name:toroidal_tungsten_velocity_at_pedestal), it enables
    species-resolved comparison of impurity momentum transport in the pedestal region.


    The toroidal velocity component $v_\phi^{\rm Ar}$ enters the radial force balance
    for argon ions:


    $$

    E_r = v_\phi^{\rm Ar} B_\theta - v_\theta^{\rm Ar} B_\phi + \frac{1}{Z_{\rm Ar}
    e n_{\rm Ar}} \frac{dp_{\rm Ar}}{dr}

    $$


    where $E_r$ is the radial electric field, $B_\theta$ and $B_\phi$ are the poloidal
    and toroidal magnetic field components, $v_\theta^{\rm Ar}$ is the argon poloidal
    velocity, $Z_{\rm Ar}$ is the mean ionization state of argon, $n_{\rm Ar}$ is
    the argon number density (see [argon density at the pedestal](name:argon_density_at_pedestal)),
    and $p_{\rm Ar}$ is the argon pressure.


    Argon toroidal velocity at the pedestal is measured by charge exchange recombination
    spectroscopy (CXRS), which detects the Doppler shift of argon emission lines excited
    by neutral beam injection in the pedestal region. The full radial profile of argon
    rotation is built from this pedestal value together with the counterpart quantities
    [at the magnetic axis](name:toroidal_argon_velocity_at_magnetic_axis), [at the
    internal transport barrier](name:toroidal_argon_velocity_at_internal_transport_barrier),
    and [at the plasma boundary](name:toroidal_argon_velocity_at_plasma_boundary).


    Sign convention: Positive when the argon flow points in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_pedestal
  - name:toroidal_tungsten_velocity_at_pedestal
  - name:argon_density_at_pedestal
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_internal_transport_barrier
  - name:toroidal_argon_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/argon/value
    dd_path: summary/local/pedestal/velocity_phi/argon/value
    status: composed
  - id: dd:summary/local/pedestal/velocity_tor/argon/value
    dd_path: summary/local/pedestal/velocity_tor/argon/value
    status: composed
- name: toroidal_beryllium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of beryllium impurity ion velocity at the H-mode
    pedestal, where the steep electron pressure gradient defines the edge transport
    barrier.
  documentation: 'The toroidal velocity of beryllium ions at the pedestal is the projection
    of the beryllium impurity ion fluid velocity onto the toroidal direction $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, evaluated at the pedestal
    location.


    The defining projection is:


    $$

    v_{\phi}^{\rm Be} = \mathbf{v}_{\rm Be} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\rm Be}$ is the beryllium ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    Toroidal impurity rotation is measured by charge exchange recombination spectroscopy
    (CXRS), in which the Doppler shift of Be emission lines at the pedestal chord
    positions yields the local toroidal velocity. The pedestal''s steep pressure gradient
    and associated radial electric field well can drive strong toroidal velocity shear,
    contributing to turbulence suppression at the edge transport barrier. Toroidal
    velocities at the pedestal range from near-zero in low-momentum-input plasmas
    to tens of km/s in discharges with strong neutral-beam injection. Position-resolved
    analogs are available via [toroidal_beryllium_velocity_at_plasma_boundary](name:toroidal_beryllium_velocity_at_plasma_boundary)
    and [toroidal_beryllium_velocity_at_magnetic_axis](name:toroidal_beryllium_velocity_at_magnetic_axis);
    the analogous quantity for tritium at the same location is [toroidal_tritium_velocity_at_pedestal](name:toroidal_tritium_velocity_at_pedestal).


    Sign convention: Positive when $v_{\phi}^{\rm Be}$ is directed in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_beryllium_velocity_at_plasma_boundary
  - name:toroidal_beryllium_velocity_at_magnetic_axis
  - name:toroidal_tritium_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/beryllium/value
    dd_path: summary/local/pedestal/velocity_phi/beryllium/value
    status: composed
  - id: dd:summary/local/pedestal/velocity_tor/beryllium/value
    dd_path: summary/local/pedestal/velocity_tor/beryllium/value
    status: composed
- name: toroidal_carbon_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the carbon impurity ion fluid velocity evaluated
    at the pedestal top, the steep-gradient transport barrier just inside the separatrix
    in H-mode plasmas.
  documentation: 'The toroidal carbon velocity at the pedestal top quantifies the
    $\phi$-component of the carbon impurity ion fluid velocity at the top of the H-mode
    transport barrier, where the steep pressure-gradient region transitions to the
    flatter core profile. Carbon (typically fully stripped C$^{6+}$ in hot plasmas)
    provides a widely used spectroscopic tracer for plasma toroidal rotation because
    inter-species Coulomb collisions couple impurity and main-ion momenta on the neoclassical
    timescale.


    The toroidal velocity component is defined as:


    $$

    v_\phi = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{C}}$ is the carbon ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.


    This quantity is measured by charge exchange recombination spectroscopy (CXRS):
    a neutral beam excites carbon ions in the pedestal region, and the resulting Doppler-shifted
    C VI emission line encodes the line-of-sight velocity component. Spatial resolution
    is set by the beam geometry and viewing configuration. Typical pedestal-top values
    range from a few km/s up to tens of km/s depending on plasma current, heating
    scheme, and device size. The analogous carbon velocity at other radial locations
    includes [toroidal carbon velocity at the magnetic axis](name:toroidal_carbon_velocity_at_magnetic_axis),
    [at the internal transport barrier](name:toroidal_carbon_velocity_at_internal_transport_barrier),
    and [at the plasma boundary](name:toroidal_carbon_velocity_at_plasma_boundary).
    The hydrogen-isotope counterpart in the pedestal region is [toroidal hydrogen
    velocity at the pedestal](name:toroidal_hydrogen_velocity_at_pedestal).


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_magnetic_axis
  - name:toroidal_carbon_velocity_at_internal_transport_barrier
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_hydrogen_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/carbon/value
    dd_path: summary/local/pedestal/velocity_phi/carbon/value
    status: attached
  - id: dd:summary/local/pedestal/velocity_tor/carbon/value
    dd_path: summary/local/pedestal/velocity_tor/carbon/value
    status: composed
- name: toroidal_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the carbon impurity ion bulk flow velocity at
    the plasma boundary, resolved in the right-handed cylindrical (R, phi, Z) frame.
    It is the local value at the last-closed flux surface, not a flux-surface average.
  documentation: 'Toroidal carbon velocity at the plasma boundary is the component
    of the carbon impurity ion bulk flow along the toroidal direction at the last-closed
    flux surface or separatrix. The toroidal direction is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. This quantity denotes a local boundary value;
    the corresponding flux-surface-averaged quantity is [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary).


    The local toroidal component is defined by projecting the carbon bulk velocity
    onto the toroidal unit vector:


    $$

    v_{\phi}^{\mathrm{C}} = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi} = R\Omega_{\mathrm{C}}

    $$


    where $v_{\phi}^{\mathrm{C}}$ is the carbon toroidal velocity in m.s^-1, $\mathbf{v}_{\mathrm{C}}$
    is the carbon ion bulk velocity in m.s^-1, $\hat{\phi}$ is the unit vector in
    the direction of increasing toroidal angle $\phi$, $R$ is the major radius in
    m, and $\Omega_{\mathrm{C}}$ is the carbon toroidal angular rotation frequency
    in s^-1.


    In practice, this velocity is commonly inferred from Doppler shifts of carbon
    spectral lines, often using charge-exchange or passive edge spectroscopy, after
    correcting for viewing geometry and projecting the measured line-of-sight velocity
    onto the toroidal direction. The plasma boundary location is usually supplied
    by magnetic equilibrium reconstruction, and the measured or modeled velocity is
    mapped to the last-closed flux surface. When only an average over the boundary
    flux surface is intended, the flux-surface-averaged standard name should be used
    instead.


    Typical absolute values at the plasma boundary are of order $10^3-5 \times 10^4$
    m.s^-1 in tokamak edge plasmas. Values can be close to zero in weakly rotating
    conditions and can approach $10^5$ m.s^-1 in plasmas with strong external torque
    or steep edge rotation gradients.


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_magnetic_axis
