- name: vertical_coordinate_of_rectangular_element_center
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the geometric center of a rectangular cross-section
    element belonging to an axisymmetric machine component, measured in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $Z$ is the signed vertical height along
    the machine symmetry axis.
  documentation: 'The vertical coordinate $Z$ locates the geometric center of a rectangular
    cross-section element along the machine symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is the major radius, $\phi$ is the toroidal angle,
    and $Z$ is the signed vertical height.


    For a rectangle whose corners span $[Z_\min, Z_\max]$, the center coordinate is
    defined as

    $$Z_\mathrm{center} = \frac{Z_\min + Z_\max}{2}.$$


    Positive $Z$ values correspond to positions above the device midplane ($Z = 0$),
    while negative values correspond to positions below it; there is no implied symmetry
    about the midplane.


    Typical values for axisymmetric machine components such as ferritic inserts, passive
    conductors, or structural elements range from approximately $-5\,\mathrm{m}$ to
    $+5\,\mathrm{m}$, depending on machine size.


    This quantity is the $Z$ component of the two-component center position $(R_\mathrm{center},
    Z_\mathrm{center})$ that fully specifies the centroid of the rectangle in the
    poloidal cross-section. The companion quantity is the major-radial coordinate
    $R_\mathrm{center}$ (see `major_radius_of_rectangular_element_center`). Together
    with the rectangle half-widths in $R$ and $Z$, this center coordinate defines
    the bounding geometry of the element.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_rectangular_element_center
  - name:vertical_coordinate_of_annulus
  - name:vertical_coordinate_of_conductor_element_center
  constraints: []
  arguments:
  - name: coordinate_of_rectangular_element_center
