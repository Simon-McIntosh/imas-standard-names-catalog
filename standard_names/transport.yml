- name: toroidal_thermal_ion_state_torque_due_to_collisions
  kind: scalar
  status: draft
  description: Volume-integrated toroidal torque transferred to the thermal ion population
    of a specific charge state via Coulomb collisions with fast particles, quantifying
    the toroidal angular momentum deposited into that ion state by the suprathermal
    distribution.
  documentation: 'This quantity gives the net toroidal component of the angular momentum
    transferred from a fast-particle distribution to thermal ions of a specific charge
    state through Coulomb collisions, integrated over the entire plasma volume. It
    is a global scalar that resolves momentum deposition at the level of individual
    ion charge states, providing a detailed accounting of how suprathermal particles
    (e.g., from neutral beam injection or fusion reactions) slow down and transfer
    toroidal angular momentum to each ionization stage of main or impurity ions.


    The defining relation is:


    $$\tau_\phi^{\mathrm{th},Z} = \int_V C_\phi^{\mathrm{fast}\to\mathrm{th},Z}(\mathbf{r})\,
    dV$$


    where $C_\phi^{\mathrm{fast}\to\mathrm{th},Z}$ is the toroidal component of the
    Coulomb-collision momentum-transfer rate density from the fast-particle distribution
    to the thermal ions of charge state $Z$, and $V$ is the plasma volume.


    This quantity is computed from kinetic modeling that solves for the fast-particle
    distribution function and evaluates the linearized Coulomb collision operator
    against the thermal ion background. Resolving contributions per charge state allows
    momentum deposition to be tracked separately for each ionization level, which
    is essential for impurity transport and toroidal momentum balance modeling.


    Summing over all thermal ion charge states and adding the electron contribution
    from [toroidal_thermal_electron_torque_due_to_collisions](name:toroidal_thermal_electron_torque_due_to_collisions)
    recovers the total thermal-particle collisional torque in [toroidal_thermal_torque_due_to_collisions](name:toroidal_thermal_torque_due_to_collisions).
    The complementary momentum received by the fast-ion charge state is given by [toroidal_fast_ion_state_torque_due_to_collisions](name:toroidal_fast_ion_state_torque_due_to_collisions).


    Sign convention: Positive when the collisional momentum transfer acts in the direction
    of increasing toroidal angle $\phi$.'
  unit: N.m
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_phi
    dd_path: distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_phi
    status: attached
  - id: dd:distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_tor
    dd_path: distributions/distribution/global_quantities/collisions/ion/state/torque_thermal_tor
    status: composed
- name: toroidal_trapped_fast_electron_torque_density_due_to_collisions
  kind: scalar
  status: draft
  description: Toroidal (phi) component, in the IMAS cylindrical (R, phi, Z) frame,
    of the Coulomb-collisional torque density transferred to trapped fast electrons.
    It is the local rate of toroidal momentum exchange per unit volume for the trapped
    fast-electron population.
  documentation: 'Toroidal trapped fast-electron collisional torque density is the
    $\hat{\phi}$ component, in the right-handed cylindrical $(R,\phi,Z)$ system where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height, of
    the torque density transferred to trapped fast electrons by Coulomb collisions.
    It describes the local rate per unit volume at which collisions change the toroidal
    mechanical angular momentum of fast electrons whose pitch angles keep them on
    magnetically trapped bounce orbits.


    The local torque density can be written as the toroidal angular-momentum moment
    of the collisional kinetic operator over the trapped part of phase space:


    $$

    T_{\phi,\mathrm{coll}}^{\mathrm{fe,tr}} = \int_{\Gamma_\mathrm{tr}} m_e R v_\phi\,
    C_\mathrm{coll}[f_\mathrm{fe}]\, \mathrm{d}\Gamma_\mathrm{tr}

    $$


    where $T_{\phi,\mathrm{coll}}^{\mathrm{fe,tr}}$ has unit N m^-2, $m_e$ is the
    electron mass in kg, $R$ is major radius in m, $v_\phi$ is the particle velocity
    component along $+\hat{\phi}$ in m s^-1, $f_\mathrm{fe}$ is the fast-electron
    distribution, and $C_\mathrm{coll}[f_\mathrm{fe}]$ is its Coulomb-collisional
    rate of change with units of $f_\mathrm{fe}$ s^-1. The measure $\mathrm{d}\Gamma_\mathrm{tr}$
    denotes the trapped-region phase-space measure: in a local velocity-space representation
    it is $\mathrm{d}^3v$ restricted to trapped pitch angles, while in a bounce- or
    orbit-averaged representation it includes the appropriate trapped-orbit Jacobian
    and bounce-time weighting, normalized so that $\int_{\Gamma_\mathrm{tr}} f_\mathrm{fe}\,\mathrm{d}\Gamma_\mathrm{tr}$
    has unit m^-3.


    In practice, this quantity is computed from kinetic Fokker-Planck, guiding-center,
    or bounce-averaged fast-electron models by applying the relevant Coulomb collision
    operator to the trapped part of the distribution and taking the toroidal momentum
    moment. It is usually inferred through modeling constrained by equilibrium, current,
    radiation, and fast-electron diagnostics rather than measured directly. The sum
    of this trapped contribution and the corresponding [passing fast-electron contribution]
    gives the [total fast-electron collisional toroidal torque density](name:toroidal_fast_electron_torque_density_due_to_collisions).


    Typical absolute magnitudes are strongly scenario dependent: auxiliary-heated
    fast-electron tails often give $10^{-5}$-$10^{-1}$ N m^-2, while runaway-electron
    or strongly driven current-relaxation cases can reach $10^{-1}$-$10$ N m^-2 locally.
    Values may be near zero or change sign where collisional friction balances sources
    or where trapped-particle phase-space gradients reverse.


    Sign convention: Positive when collisions transfer toroidal momentum to the trapped
    fast-electron population in the $+\hat{\phi}$ direction, the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ system.'
  unit: N.m^-2
  physics_domain: transport
  links:
