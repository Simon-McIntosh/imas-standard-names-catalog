      kind: llm
- name: parallel_normalized_perturbed_magnetic_field
  kind: scalar
  status: active
  description: Signed dimensionless component of a magnetic-field perturbation along
    the local equilibrium magnetic-field direction, identifying compressional fluctuations.
  documentation: 'The parallel normalized perturbed magnetic field is the component
    of the magnetic-field perturbation aligned with the local equilibrium field, scaled
    by the equilibrium field magnitude. It describes compressional magnetic fluctuations
    rather than perturbations that only bend field lines.


    $$

    \delta \hat{B}_{\parallel} = \frac{\delta \mathbf{B} \cdot \mathbf{b}_0}{B_0}

    $$


    where $\delta \mathbf{B}$ is the perturbed magnetic-field vector, $\mathbf{B}_0$
    is the equilibrium magnetic field, $B_0 = |\mathbf{B}_0|$ is its magnitude, and
    $\mathbf{b}_0 = \mathbf{B}_0/B_0$ is the equilibrium field-line unit vector. This
    is the parallel projection of the [normalized perturbed magnetic field](name:normalized_perturbed_magnetic_field).
    For a complex mode representation, taking the modulus yields the phase-independent
    [parallel normalized perturbed magnetic field amplitude](name:parallel_normalized_perturbed_magnetic_field_amplitude).


    Sign convention: Positive when the perturbation has a component in the direction
    of the local equilibrium magnetic field.'
  unit: '1'
  physics_domain: turbulence
  links:
