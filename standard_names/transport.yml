- name: parallel_neutral_state_velocity
  kind: scalar
  status: draft
  description: "Projection of the E\xD7B drift velocity of neutral particles in a\
    \ given charge state onto the direction parallel to the local magnetic field line."
  documentation: "The parallel component of the E\xD7B drift velocity for neutrals\
    \ in a specific charge state is defined as $v_{\\parallel, \\mathrm{E}\\times\\\
    mathrm{B}} = (\\mathbf{E} \\times \\mathbf{B}) \\cdot \\hat{b} / B^2$, where $\\\
    hat{b} = \\mathbf{B}/B$ is the unit vector along the magnetic field. This quantity\
    \ captures the field-aligned flow of charge-state-resolved neutral populations\
    \ driven by the cross-field electric field, and is essential for modeling neutral\
    \ particle transport and momentum exchange with the background plasma. Typical\
    \ values in the edge region of tokamaks range from hundreds of m/s to a few km/s,\
    \ depending on the radial electric field and magnetic configuration. The quantity\
    \ is distinguished from the charge-state-averaged counterpart by resolving the\
    \ velocity for a specific quantum state of the neutral population. See also the\
    \ parent quantity [neutral_state_velocity](name:neutral_state_velocity), the charge-state-averaged\
    \ [parallel_neutral_velocity](name:parallel_neutral_velocity), and the poloidal\
    \ counterpart [poloidal_neutral_state_velocity_due_to_e_cross_b_drift](name:poloidal_neutral_state_velocity_due_to_e_cross_b_drift).\n\
    \nSign convention: Positive when the projection of the E\xD7B drift velocity onto\
    \ the local magnetic field direction points in the same direction as the magnetic\
    \ field vector $\\mathbf{B}$."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:neutral_state_velocity
  - name:parallel_neutral_velocity
  - name:poloidal_neutral_state_velocity_due_to_e_cross_b_drift
  arguments:
