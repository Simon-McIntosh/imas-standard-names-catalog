      kind: template
- name: temperature_of_neutron_detector
  kind: scalar
  status: active
  description: Absolute thermodynamic temperature of a neutron detector assembly or
    converter material, describing its thermal state independently of neutron-counting
    response.
  documentation: 'This quantity is the thermodynamic temperature of the neutron detector
    assembly or neutron-conversion material, characterizing its thermal state rather
    than the detector''s electrical response or neutron-counting behavior.


    The temperature is defined thermodynamically by


    $$

    \frac{1}{T}=\left(\frac{\partial S}{\partial U}\right)_{V,N}

    $$


    where $T$ is thermodynamic temperature, $S$ is entropy, $U$ is internal energy,
    $V$ is volume, and $N$ is the amount of material or particle number held fixed
    in the derivative. The quantity applies to the specified detector or converter
    material and is distinct from the local material temperature at a [sensor attachment
    point](name:temperature_at_sensor_attachment_point). It is not the neutron-energy
    threshold represented by [energy of a neutron detector](name:energy_of_neutron_detector).'
  unit: K
  physics_domain: particle_measurement_diagnostics
  links:
  - name:energy_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/temperature
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-temperature
    dd_documentation:
