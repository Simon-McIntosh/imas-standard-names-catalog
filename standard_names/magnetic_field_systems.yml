- name: area_of_correction_coil
  kind: scalar
  status: draft
  description: Cross-sectional conductor area of a non-axisymmetric correction coil
    element, defining its current-carrying capacity.
  documentation: 'The $A_\text{coil}$ of a correction coil is the geometric cross-sectional
    area of the conductor winding, typically an annulus defined by an inner and outer
    radius. This area determines the average current density $J = I/A_\text{coil}$
    for a given coil current $I$ and is a key input to electromagnetic models of the
    magnetic-field perturbation produced by the correction coil for resonant magnetic
    perturbation (RMP) or error-field control. Typical values range from $10^{-4}$
    to $10^{-2}\ \text{m}^2$ depending on the conductor type (copper or superconducting
    cable). See also [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil)
    for the inner boundary and [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)
    for the analogous parameter in axisymmetric coils.


    Sign convention: Positive when the conductor cross-sectional area is finite.


    In tokamak applications, correction coils are often saddle-shaped and may have
    non-circular cross-sections; the recorded area is the effective conduction area,
    accounting for void fractions in cable-in-conduit conductors. This quantity is
    obtained from engineering drawings or direct measurement during coil fabrication
    and is invariant under sign changes of the coil current or magnetic field. The
    companion quantity [area_of_toroidal_field_coil](name:area_of_toroidal_field_coil)
    serves the same role for the toroidal field system.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_correction_coil
  - name:area_of_poloidal_field_coil
  - name:area_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/area
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/area
    status: composed
- name: area_of_passive_loop
  kind: scalar
  status: draft
  description: Cross-sectional conductor area of a passive loop element used for electromagnetic
    modeling of eddy and halo currents.
  documentation: 'The cross-sectional conductor area quantifies the transverse extent
    of a passive loop element through which induced or halo currents flow. This geometric
    parameter directly determines the loop''s electrical resistance and, together
    with material conductivity, influences the time constant for eddy current decay.
    Typical values range from $10^{-6}\;\mathrm{m}^2$ for small in-vessel elements
    to $10^{-2}\;\mathrm{m}^2$ for large passive stabilizing conductors. In electromagnetic
    simulations, the area is used with the loop''s effective length to compute resistance;
    for halo current paths, it defines the current-carrying cross-section. This scalar
    is distinct from the loop''s enclosed area, which relates to magnetic flux coupling.


    Related geometric quantities for the same passive loop element include the inner
    and outer radii, which together define the radial extent of the conductor in the
    machine cylindrical $(R, \phi, Z)$ frame.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:area_of_toroidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_passive/loop/element/area
    dd_path: pf_passive/loop/element/area
    status: composed
- name: area_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional conductor area of a poloidal field coil element, used
    to compute current density and magnetic field from applied coil current.
  documentation: "The cross-sectional conductor area of a poloidal field (PF) coil\
    \ element determines the current density $J = I / A$ for a given coil current\
    \ $I$, which directly influences the magnetic field generated by the coil. This\
    \ geometric parameter is essential for electromagnetic design, thermal analysis,\
    \ and structural stress calculations of the PF coil system. Typical PF coil conductor\
    \ areas range from 100\u20132000 $\\mathrm{mm}^2$ depending on the coil location\
    \ and required current capacity (10\u2013100 kA). The area is used together with\
    \ the inner radius and outer radius of the poloidal field coil to fully describe\
    \ the annular conductor cross-section geometry. The companion quantity is [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil),\
    \ which defines the outer boundary of the same conductor cross-section.\n\nSign\
    \ convention: Positive when the cross-sectional area is defined as a positive\
    \ scalar quantity.\n\nThis quantity is independent of the poloidal field coil\
    \ winding direction and is always taken as a positive physical area in the plane\
    \ perpendicular to the conductor axis."
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/b_field_max
    dd_path: pf_active/coil/b_field_max
    status: attached
  - id: dd:pf_active/coil/element/area
    dd_path: pf_active/coil/element/area
    status: composed
- name: area_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional conductor area of a single toroidal field coil element,
    determining the coil's current-carrying capacity and average current density.
  documentation: 'The cross-sectional conductor area $A_{\mathrm{TF}}$ is the geometric
    area of the conducting material within a toroidal field coil element, measured
    in a plane perpendicular to the local coil direction. It directly sets the achievable
    toroidal field strength through $I_{\mathrm{TF}} = J_{\mathrm{avg}} \cdot A_{\mathrm{TF}}$,
    where $I_{\mathrm{TF}}$ is the coil current in amperes and $J_{\mathrm{avg}}$
    is the average current density in A/m$^2$. This area is a key design parameter
    for TF coils; typical values range from $0.01$ to $0.5$ m$^2$ in existing tokamaks,
    with ITER TF coils having a conductor area of approximately $0.12$ m$^2$.


    Sign convention: Positive when the conductor cross-section is oriented such that
    a positive current through it produces a toroidal field in the direction of increasing
    toroidal angle $\phi$.


    The conductor cross-sectional area is related to the coil''s electrical resistance
    $R = \rho L / A_{\mathrm{TF}}$ (where $\rho$ is resistivity and $L$ is conductor
    length), and to the radial build of the coil via [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil).
    For comparison, the corresponding quantity for other coil systems is [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)
    and [area_of_correction_coil](name:area_of_correction_coil).'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_toroidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:area_of_correction_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/area
    dd_path: tf/coil/conductor/cross_section/area
    status: composed
- name: binormal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate along the binormal direction of the local Frenet frame for
    a toroidal field coil conductor cross-section.
  documentation: "The binormal coordinate defines the position of vertices in the\
    \ toroidal field (TF) coil conductor cross-section outline along the binormal\
    \ axis of the local Frenet\u2013Serret frame. Together with the normal coordinate,\
    \ it fully describes the conductor's cross-sectional shape in the plane perpendicular\
    \ to the coil's winding direction. This coordinate is fundamental for electromagnetic\
    \ and structural modeling of the TF coil, as it determines the current density\
    \ distribution within the conductor and the mechanical stresses due to Lorentz\
    \ forces.\n\nSign convention: Positive when the binormal direction is oriented\
    \ such that the (normal, binormal) pair forms a right-handed orthonormal frame\
    \ with the conductor tangent direction.\n\nTypical binormal dimensions range from\
    \ 0.01 m to 1.0 m depending on the coil design. The cross-section outline is typically\
    \ a polygon defined by paired (normal, binormal) vertices, analogous to [normal_coordinate_of_toroidal_field_coil](name:normal_coordinate_of_toroidal_field_coil)\
    \ for the normal axis."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:normal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/binormal
    dd_path: tf/coil/conductor/cross_section/outline/binormal
    status: composed
- name: height_of_ferritic_element
  kind: scalar
  status: draft
  description: Vertical full height of a rectangular cross-section of a ferritic element,
    used in axisymmetric electromagnetic modeling of the machine structure.
  documentation: 'The vertical height $h$ of the rectangular cross-section of a ferritic
    element defines its geometric extent along the machine vertical $(Z)$ direction.
    Together with the horizontal width $w$, it determines the cross-sectional area
    $A = h \times w$, which governs the element''s magnetic response and eddy-current
    characteristics in axisymmetric electromagnetic simulations. Typical ferritic
    element heights in tokamak applications range from several centimeters to tens
    of centimeters, depending on the structural design and placement relative to the
    plasma-facing components. The height is referenced to the local coordinate frame
    of the rectangular geometry element and is measured in meters.


    Sign convention: Positive when the extent is defined in the direction of increasing
    vertical coordinate $Z$.


    The height is geometrically orthogonal to the `[width](name:width_of_ferritic_element)`,
    and together with the local magnetization properties, determines the `[vertical_magnetic_field_of_ferritic_element](name:vertical_magnetic_field_of_ferritic_element)`
    and `[radial_magnetic_field_of_ferritic_element](name:radial_magnetic_field_of_ferritic_element)`
    generated by the element under applied fields.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_ferritic_element
  - name:vertical_magnetic_field_of_ferritic_element
  - name:radial_magnetic_field_of_ferritic_element
  sources:
  - id: dd:ferritic/object/axisymmetric/rectangle/height
    dd_path: ferritic/object/axisymmetric/rectangle/height
    status: composed
- name: height_of_iron_core_segment
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section defining the
    geometry of an iron core segment in the machine's magnetic circuit.
  documentation: 'The quantity specifies the vertical extent of a rectangular cross-section
    element used to model an iron core segment in the tokamak''s magnetic circuit.
    Together with the horizontal full width [width_of_iron_core_segment](name:width_of_iron_core_segment)
    and the major radius coordinate [major_radius_of_iron_core_segment](name:major_radius_of_iron_core_segment),
    the height defines the rectangular geometry for electromagnetic finite-element
    or circuit-model calculations. Typical heights for iron core segments in medium-size
    tokamaks range from 0.1 m to 2.0 m, depending on the core leg design. The vertical
    orientation is aligned with the cylindrical $Z$ coordinate of the IMAS $(R, \phi,
    Z)$ frame.


    Sign convention: Positive when the cross-section extends in the direction of increasing
    $Z$.


    The related quantities [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil)
    and [height_of_ferritic_element](name:height_of_ferritic_element) describe analogous
    vertical extents for other conducting and structural components.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_iron_core_segment
  - name:major_radius_of_iron_core_segment
  - name:height_of_poloidal_field_coil
  - name:height_of_ferritic_element
  sources:
  - id: dd:iron_core/segment/geometry/rectangle/height
    dd_path: iron_core/segment/geometry/rectangle/height
    status: composed
- name: inner_radius_of_correction_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a correction coil conductor,
    measured from the conductor centerline to the inner edge of the cross-section.
  documentation: The inner radius defines the innermost boundary of the annular conductor
    cross-section for a correction coil. Together with the outer radius, it sets the
    radial thickness of the conductor. The radius is a non-negative length that does
    not change sign under any coil operation; it is purely a geometric dimension of
    the winding pack. Typical values for correction coils range from 0.01 m to 0.10
    m, depending on the coil location (in-vessel or ex-vessel) and the required current
    capacity.
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    status: composed
- name: inner_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a passive conducting loop
    element used for electromagnetic modeling.
  documentation: 'The inner radius of an annular passive loop cross-section, denoted
    $R_\mathrm{in}$, defines the inner radial boundary of the conducting loop conductor.
    Together with the outer radius, this parameter determines the annular conductor
    geometry used to compute the loop''s self-inductance and eddy-current response
    during plasma transients. Typical values range from 0.05 to 0.5 m depending on
    the loop location inside the vacuum vessel. This quantity follows the same geometric
    parameterization as [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil),
    applied here to the passive loop elements. Passive loops are modeled as toroidally
    continuous or discrete conductors; the inner radius defines the loop''s inner
    boundary, with the area given by [area_of_passive_loop](name:area_of_passive_loop).


    Sign convention: Positive when the inner radius is measured radially outward from
    the geometric center of the annular cross-section.


    The inner radius is measured in the local poloidal plane of the loop element.
    Unlike magnetic field components, the sign convention for a geometric length such
    as the inner radius is defined relative to the cross-section centroid rather than
    the global toroidal direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_toroidal_field_coil
  - name:area_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_inner
    dd_path: pf_passive/loop/element/geometry/annulus/radius_inner
    status: composed
- name: inner_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular conductor cross-section of a poloidal field
    coil.
  documentation: 'The inner radius of the annular conductor cross-section of a poloidal
    field coil. This is a strictly non-negative scalar length, measured in meters,
    from the center of the coil conductor to the inner edge of its annular cross-section.
    Larger values correspond to a wider annulus given a fixed outer radius, affecting
    the conductor area and thus the coil''s current-carrying capacity and inductance.
    Typical values range from a few centimeters for internal control coils to over
    a meter for large central solenoid coils. Related standard names: `outer_radius_of_poloidal_field_coil`,
    `inner_radius_of_toroidal_field_coil`.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  - name:inner_radius_of_toroidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/geometry/annulus/radius_inner
    dd_path: pf_active/coil/geometry/annulus/radius_inner
    status: composed
- name: inner_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular conductor cross-section of a toroidal field
    coil.
  documentation: 'The inner radius $R_{\text{in}}$ defines the inner radial boundary
    of the annular conductor cross-section for a toroidal field (TF) coil. Together
    with the outer radius, it specifies the radial extent of the conducting annulus,
    which is used to compute the conductor cross-sectional area and, when combined
    with the coil current density, the total current in the TF coil. This geometric
    parameter is essential for electromagnetic and structural modeling of the TF coil
    system. The inner radius is measured from the center of the conductor cross-section;
    the annular geometry is defined by `[inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil)`
    and `[outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)`
    for the poloidal field counterpart.


    Sign convention: Positive when the inner radius is measured radially outward from
    the center of the conductor cross-section.


    Typical values range from 0.3 m to 1.0 m for TF coils in medium-scale tokamaks,
    depending on the coil design and the desired conductor cross-sectional area for
    current-carrying capacity.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/radius_inner
    dd_path: tf/coil/conductor/cross_section/radius_inner
    status: composed
- name: major_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the outline element defining the geometry
    of an iron core segment.
  documentation: 'The major radius $R_{\rm outline}$ is the $R$ coordinate of a point
    on the polygonal outline that describes the cross-sectional shape of a ferromagnetic
    iron core segment. This outline is part of the machine''s magnetic circuit, typically
    used in axisymmetric electromagnetic models to compute the poloidal flux distribution
    and the inductive coupling with the plasma and poloidal field coils. The outline
    is defined as a series of $(R, Z)$ points in the right-handed cylindrical $(R,
    \phi, Z)$ coordinate system, where $R$ is the major radius measured from the machine
    symmetry axis and $Z$ is the vertical height. Typical values for $R_{\rm outline}$
    range from $0.5$ to $2.0\, \mathrm{m}$ for medium-size tokamaks, depending on
    the segment location. See also `vertical_coordinate_of_iron_core_segment` for
    the companion Z-coordinate.


    Sign convention: Positive when the R coordinate points radially outward from the
    machine symmetry axis.


    This quantity is paired with the Z-coordinate to define the full geometry of the
    segment outline.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
