- name: toroidal_magnetic_flux
  kind: scalar
  status: active
  description: Toroidal magnetic flux is the net magnetic flux through the poloidal
    cross-section enclosed by a nested magnetic flux surface, complementing poloidal
    flux as a radial surface label.
  documentation: 'The toroidal magnetic flux is the surface integral of the magnetic
    field through the poloidal cross-section enclosed by a nested magnetic flux surface.
    It is the toroidal member of the [magnetic flux](name:magnetic_flux) family and
    quantifies the net field threading that cross-section.


    The defining surface integral is:


    $$

    \Phi_{\mathrm{tor}} = \int_{S_{\mathrm{pol}}} \mathbf{B} \cdot \hat{\phi}\, dA

    $$


    where $\mathbf{B}$ is the magnetic-field vector, $S_{\mathrm{pol}}$ is the enclosed
    poloidal cross-section, $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle, and $dA$ is the scalar area element in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In an axisymmetric equilibrium, the toroidal flux is constant on each nested flux
    surface and provides a radial flux label complementary to the [poloidal magnetic
    flux](name:poloidal_magnetic_flux). Its boundary value is the [toroidal magnetic
    flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary).


    Sign convention: Positive when the magnetic field threading the poloidal cross-section
    points in the direction of increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux
  - name:toroidal_magnetic_flux_at_plasma_boundary
  arguments:
  - name: magnetic_flux
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
