- name: argon_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of argon ions at the magnetic axis, the innermost point
    of the confined plasma where the gradient of the poloidal magnetic flux vanishes.
  documentation: 'The argon ion number density at the magnetic axis gives the on-axis
    concentration of argon impurity ions, the species-specific realization of [density_at_magnetic_axis](name:density_at_magnetic_axis),
    evaluated at the point where $\nabla\psi = 0$ (with $\psi$ the poloidal magnetic
    flux) at coordinates $(R_\mathrm{axis}, Z_\mathrm{axis})$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. Neoclassical impurity transport tends to drive
    high-$Z$ species inward under collisional H-mode conditions, making this on-axis
    value a sensitive indicator of core argon accumulation relative to outer radii,
    distinct from the boundary concentration captured by [argon_density_at_plasma_boundary](name:argon_density_at_plasma_boundary).


    Argon is introduced into fusion plasmas for radiative power balance experiments,
    edge cooling, and disruption mitigation; the on-axis density reflects both the
    seeded impurity inventory and any neoclassical inward pinch, with the peaking
    factor $n_\mathrm{Ar}(0)/\langle n_\mathrm{Ar}\rangle$ serving as a quantitative
    measure of core accumulation. On-axis impurity concentrations are typically orders
    of magnitude below the bulk ion density under trace-seeding conditions, increasing
    substantially during massive-injection disruption mitigation.


    This quantity is commonly inferred from charge exchange recombination spectroscopy
    of argon charge-state line emission or from soft X-ray tomography, with the magnetic
    axis position supplied by equilibrium reconstruction. Comparing this value with
    [argon_density_at_pedestal](name:argon_density_at_pedestal) characterizes the
    radial impurity gradient between the core and the transport barrier. The analogous
    on-axis density for neon is [neon_density_at_magnetic_axis](name:neon_density_at_magnetic_axis),
    governed by the same neoclassical transport physics but with different charge-dependent
    accumulation rates.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_magnetic_axis
  - name:argon_density_at_plasma_boundary
  - name:argon_density_at_pedestal
  - name:neon_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/argon/value
    dd_path: summary/local/magnetic_axis/n_i/argon/value
    status: composed
- name: carbon_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Unweighted local number density of carbon ions at the internal-transport-barrier
    reference radius. It counts carbon ion particles per unit volume, summed over
    ionization states when charge-state-resolved densities are combined, and excludes
    neutral carbon and charge weighting.
  documentation: 'Carbon density at an internal transport barrier is the local unweighted
    number density of carbon ions on the radial surface selected as the barrier reference.
    It counts ion particles per unit volume and excludes neutral carbon; it is not
    an electric charge density or an effective-charge weighting. It is the carbon-species
    counterpart of [total_ion_density_at_internal_transport_barrier](name:total_ion_density_at_internal_transport_barrier)
    and can be compared with other impurity densities at the same location.


    With a dimensional radial coordinate $r$ measured in meters, the compact definition
    is the carbon-ion density field evaluated at the prescribed internal-transport-barrier
    reference radius:


    $$

    n_{\mathrm{C,ion}}(r_{\mathrm{ITB}}) = \sum_{q=1}^{6} n_{\mathrm{C}^{q+}}(r_{\mathrm{ITB}})

    $$


    where $q$ is the carbon ion charge state, $n_{\mathrm{C}^{q+}}$ is the number
    density of carbon ions in that charge state, and $r_{\mathrm{ITB}}$ is the value
    of the same radial coordinate at the selected ITB reference surface. All number
    densities in this expression are particle number densities with unit m^-3; if
    carbon is represented as a single elemental ion species, $n_{\mathrm{C,ion}}$
    denotes the same charge-state-summed carbon ion density.


    In practice, the ITB reference surface is identified from measured or reconstructed
    kinetic and transport behavior, and the carbon-ion density is evaluated locally
    on that surface rather than averaged over the full barrier width. Carbon abundance
    may be inferred from impurity spectroscopy together with atomic population modeling
    or transport analysis, with the charge-state sum made explicitly when charge-state-resolved
    information is available.


    Typical values are highly scenario dependent. For trace-carbon conditions in confined
    tokamak plasmas, ITB-local carbon ion densities are often of order $10^{16}-10^{18}$
    m^-3; carbon-rich wall sources, impurity injection, or strong accumulation can
    move the value outside this range.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:iron_density_at_internal_transport_barrier
  - name:oxygen_density_at_internal_transport_barrier
  - name:nitrogen_density_at_internal_transport_barrier
  - name:density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/carbon/value
    dd_path: summary/local/itb/n_i/carbon/value
    status: composed
- name: co_passing_fast_particle_density
  kind: scalar
  status: draft
  description: Number density of suprathermal particles in the co-passing orbit class,
    from the fast-particle distribution function restricted to the co-passing region
    of velocity space.
  documentation: 'Co-passing fast particle density is the number of non-thermal particles
    per unit physical volume whose guiding-center orbits are passing and belong to
    the co-passing branch. It is a partial zeroth moment of the fast-particle distribution
    function, complementary to the counter-passing and trapped fast-particle contributions.


    The density at position $\mathbf{x}$ is defined by integrating the fast-particle
    distribution over the co-passing velocity-space domain:


    $$

    n_{\mathrm{fast}}^{\mathrm{co}}(\mathbf{x}) = \int_{\Omega_{\mathrm{co}}(\mathbf{x})}
    f_{\mathrm{fast}}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $f_{\mathrm{fast}}$ is the suprathermal distribution function with units
    $\mathrm{s^3\,m^{-6}}$, $\mathbf{x}$ is position in m, $\mathbf{v}$ is particle
    velocity in m s$^{-1}$, $d^3v$ has units m$^3$ s$^{-3}$, and $\Omega_{\mathrm{co}}(\mathbf{x})$
    is the subset of velocity space corresponding to co-passing orbits. The trapped-passing
    boundary is set by magnetic geometry and particle invariants such as energy and
    magnetic moment; in pitch coordinates it should be treated as the local trapped-passing
    separatrix rather than a universal pitch cutoff.


    In practice, this quantity is computed by applying an orbit-classification operator
    to a kinetic fast-particle distribution and taking the partial zeroth moment over
    the co-passing domain. The same definition applies whether the distribution is
    expressed in Cartesian velocity, energy-pitch, or guiding-center variables, provided
    the appropriate velocity-space Jacobian is included. When the orbit classes form
    a complete disjoint partition, the total fast-particle density is the sum of the
    co-passing, counter-passing, and trapped contributions.


    Typical values are strongly scenario dependent because fast-particle populations
    are set by sources, slowing-down, redistribution, and loss processes. Representative
    values can range from below $10^{14}$ m$^{-3}$ in weak suprathermal populations
    to $10^{17}$-$10^{19}$ m$^{-3}$ in strongly heated or fusion-product-rich plasmas,
    usually remaining below the bulk thermal particle density.'
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/density_fast
    dd_path: distributions/distribution/profiles_1d/co_passing/density_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/density_fast
    dd_path: distributions/distribution/profiles_2d/co_passing/density_fast
    status: attached
- name: co_passing_fast_particle_pressure
  kind: scalar
  status: draft
  description: Total pressure of the suprathermal co-passing particle population,
    obtained by integrating both parallel and perpendicular kinetic energy contributions
    of the fast-particle distribution function over the co-passing velocity-space
    domain.
  documentation: 'Co-passing fast particles are suprathermal guiding-center orbits
    that circulate toroidally in the same direction as the plasma current, covering
    the velocity-space region where the pitch-angle cosine $\xi = v_\parallel/v$ exceeds
    the magnetic trapping boundary. This quantity is the orbit-class-resolved scalar
    pressure component of the total [fast_particle_pressure](name:fast_particle_pressure),
    complementing the [counter_passing_fast_particle_pressure](name:counter_passing_fast_particle_pressure)
    and [trapped_fast_particle_pressure](name:trapped_fast_particle_pressure) contributions
    that together partition the full fast-particle pressure.


    The co-passing fast-particle pressure is defined as the second velocity moment
    of the fast-particle distribution function $f_\mathrm{fast}$ restricted to the
    co-passing domain $\Omega_\mathrm{co}$:


    $$

    P_\mathrm{co} = \frac{m}{3} \int_{\Omega_\mathrm{co}} v^2 \, f_\mathrm{fast}(\mathbf{v})
    \, d^3v

    $$


    where $m$ is the particle mass, $v = |\mathbf{v}|$ is the speed, and $\Omega_\mathrm{co}$
    denotes the co-passing region ($\xi > \xi_\mathrm{trap}$, with $\xi_\mathrm{trap}$
    the trapping-boundary cosine). Equivalently, $P_\mathrm{co} = \tfrac{1}{3}(P_{\parallel,\mathrm{co}}
    + 2P_{\perp,\mathrm{co}})$, decomposing into the [parallel component](name:parallel_co_passing_fast_particle_pressure)
    and the [perpendicular component](name:perpendicular_co_passing_fast_particle_pressure).


    This quantity is computed from kinetic distribution-function solvers or Monte
    Carlo transport codes that resolve velocity-space orbit classes. Tangential neutral
    beam injection preferentially populates the co-passing orbit class, making this
    pressure component particularly prominent in NBI-heated plasmas where beam geometry
    and injection energy determine the co-passing fraction.


    Sign convention: Positive when suprathermal particles occupy the co-passing orbit
    class with finite kinetic energy density.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_particle_pressure
  - name:counter_passing_fast_particle_pressure
  - name:trapped_fast_particle_pressure
  - name:parallel_co_passing_fast_particle_pressure
  - name:perpendicular_co_passing_fast_particle_pressure
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure_fast
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/pressure_fast
    dd_path: distributions/distribution/profiles_2d/co_passing/pressure_fast
    status: attached
- name: co_passing_thermal_ion_state_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Volumetric Coulomb-collisional power density transferred to thermal
    ions in a specified charge state from the co-passing component of a fast-particle
    distribution.
  documentation: 'This quantity is the local rate per unit volume at which Coulomb
    collisions deposit kinetic energy in thermal ions of a specified charge state,
    considering only the co-passing orbit component of the fast-particle distribution.
    The co-passing qualifier selects passing fast particles moving in the co-current
    direction, and the charge-state qualifier resolves which thermal ion population
    receives the energy.


    It is commonly defined as the negative kinetic-energy moment of the Coulomb collision
    operator acting on the co-passing fast-particle distribution due to collisions
    with the specified thermal ion charge state:


    $$

    p_{\mathrm{th},z}^{\mathrm{co,coll}}(\mathbf{x}) = -\int \frac{1}{2} m_f v^2\,
    C_{fz}^{\mathrm{coll}}\!\left[f_{\mathrm{co}}, f_{\mathrm{th},z}\right](\mathbf{x},\mathbf{v})\,
    d^3v

    $$


    where $p_{\mathrm{th},z}^{\mathrm{co,coll}}$ is in W m$^{-3}$, $\mathbf{x}$ is
    position, $m_f$ is the fast-particle mass in kg, $v=|\mathbf{v}|$ is speed in
    m s$^{-1}$, and $d^3v$ has units m$^3$ s$^{-3}$. If $f_{\mathrm{co}}$ and $f_{\mathrm{th},z}$
    are normalized so that $\int f\,d^3v$ gives number density in m$^{-3}$, then they
    have units s$^3$ m$^{-6}$ and the operator $C_{fz}^{\mathrm{coll}}$ has units
    of phase-space density per second, s$^2$ m$^{-6}$. The minus sign converts the
    fast-particle collisional energy loss into heating of the thermal ion charge state
    $z$.


    In practice this power density is computed from a kinetic or reduced distribution-function
    model by applying a Coulomb or Fokker-Planck collision operator to the co-passing
    part of the fast-particle distribution and taking its energy moment. The local
    scalar value is independent of coordinate basis; when a spatial label is needed,
    it may be given in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is vertical height. Summing over charge states
    gives [co_passing_thermal_ion_power_density_due_to_collisions](name:co_passing_thermal_ion_power_density_due_to_collisions),
    while comparison with [co_passing_fast_ion_state_power_density_due_to_collisions](name:co_passing_fast_ion_state_power_density_due_to_collisions)
    checks energy conservation between the fast and thermal populations.


    Typical magnitudes are 10$^2$-10$^6$ W m$^{-3}$ in the heated core of neutral-beam,
    ion-cyclotron, or fusion-alpha scenarios, with peaks approaching 10$^7$ W m$^{-3}$
    in compact high-power plasmas. Values can be much smaller for trace ion charge
    states, weak fast-particle populations, or radial regions with little co-passing
    fast-particle density.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy from
    the co-passing fast-particle distribution to the specified thermal ion charge
    state.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:co_passing_thermal_ion_power_density_due_to_collisions
  - name:thermal_ion_state_power_density_due_to_collisions
  - name:co_passing_fast_ion_state_power_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/collisions/ion/state/power_thermal
    dd_path: distributions/distribution/profiles_1d/co_passing/collisions/ion/state/power_thermal
    status: attached
  - id: dd:distributions/distribution/profiles_2d/co_passing/collisions/ion/state/power_thermal
    dd_path: distributions/distribution/profiles_2d/co_passing/collisions/ion/state/power_thermal
    status: composed
- name: co_passing_thermal_particle_source_rate
  kind: scalar
  status: draft
  description: Flux-surface-averaged volumetric source rate of thermal particle density
    for the co-passing orbit population. It represents the net rate at which particles
    are added to or removed from that orbit class.
  documentation: 'Co-passing thermal particle source rate is the rate per unit volume
    at which thermal particles enter or leave the co-passing passing-orbit population
    after averaging over a magnetic flux surface. Co-passing denotes the passing orbit
    class whose guiding-center motion is aligned with the reference plasma-current
    direction, complementary to counter-passing and trapped orbit classes.


    It is the source term in the flux-surface-averaged particle balance for the co-passing
    population:


    $$

    \frac{\partial \langle n_{\mathrm{cp}}\rangle_\rho}{\partial t}

    + \frac{1}{V''}\frac{\partial}{\partial \rho}\left(V''\left\langle \boldsymbol{\Gamma}_{\mathrm{cp}}\cdot\nabla\rho\right\rangle_\rho\right)

    = \langle S_{\mathrm{cp}}\rangle_\rho

    $$


    where $\langle\cdot\rangle_\rho$ denotes an average over the magnetic flux surface
    labeled by the dimensionless radial flux coordinate $\rho$, $V''=dV/d\rho$ is
    the differential volume in $\mathrm{m^3}$, $n_{\mathrm{cp}}$ is the co-passing
    thermal-particle density in $\mathrm{m^{-3}}$, $\boldsymbol{\Gamma}_{\mathrm{cp}}$
    is the particle flux density in $\mathrm{m^{-2}\,s^{-1}}$, and $S_{\mathrm{cp}}$
    is the volumetric source rate in $\mathrm{m^{-3}\,s^{-1}}$.


    In practice this quantity is obtained from kinetic or transport modeling by integrating
    the modeled collisional, wave-particle, and orbit-class transition terms over
    the co-passing part of velocity space and over the flux surface. It may also be
    inferred as the residual source required by a particle balance when the co-passing
    density evolution and radial particle flux are known.


    No device-independent typical magnitude follows from the definition alone, because
    the value depends on species, radial location, distribution function, wave fields,
    collision rates, and the chosen separation between passing and trapped orbit classes.
    A useful scale is the particle replacement time $\tau_{\mathrm{cp}}=\langle n_{\mathrm{cp}}\rangle_\rho/|\langle
    S_{\mathrm{cp}}\rangle_\rho|$; for example, $10^{20}\ \mathrm{m^{-3}\,s^{-1}}$
    changes a $10^{19}\ \mathrm{m^{-3}}$ co-passing population on a 0.1 s time scale.


    Sign convention: Positive when local processes add thermal particles to the co-passing
    orbit population.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/source/particles
    dd_path: distributions/distribution/profiles_1d/co_passing/source/particles
    status: composed
- name: counter_passing_fast_particle_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Local collisional power density for the counter-passing part of a fast-particle
    distribution. It is the rate at which Coulomb collisions with the included charged
    collision partners change the kinetic-energy density of counter-passing fast particles.
  documentation: 'Counter-passing fast-particle collisional power density is the local
    rate at which Coulomb collisions change the kinetic-energy density of fast particles
    in the counter-passing orbit class. The counter-passing class contains passing
    guiding-center trajectories whose parallel transit is opposite to the reference
    co-passing direction, and this quantity is a collisional source or sink for that
    class rather than its stored energy.


    For fast species $a$, it is commonly evaluated as the second velocity moment of
    the Coulomb collision operator restricted to counter-passing phase space:


    $$

    P_{\mathrm{cp}}^{\mathrm{coll}}(\mathbf{x}) = \sum_{a\in\mathrm{fast}} \sum_b
    \int_{\Omega_{\mathrm{cp}}} \frac{1}{2} m_a v^2 C_{ab}[f_a,f_b](\mathbf{x},\mathbf{v})
    \, d^3v

    $$


    where $P_{\mathrm{cp}}^{\mathrm{coll}}$ has units $W m^{-3}$, $\mathbf{x}$ is
    position in meters, $m_a$ is the fast-particle mass in kg, $v=|\mathbf{v}|$ is
    speed in $m s^{-1}$, $f_a$ has units $m^{-3}(m s^{-1})^{-3}$, and $C_{ab}$ has
    units $m^{-3}(m s^{-1})^{-3}s^{-1}$ and gives the time derivative of $f_a$ due
    to Coulomb collisions with partner species $b$. The index $b$ denotes the charged
    collision partners included in the kinetic model, typically thermal electrons,
    main ions, impurity ions, and other fast species only when fast-fast collisions
    are explicitly retained; for a partner-resolved quantity the corresponding single
    $b$ term is used instead of the full sum. The use of $C_{ab}$, not $f_a$, makes
    this an energy-transfer rate and not the kinetic-energy density of the counter-passing
    particles.


    This quantity is not measured directly. It is inferred by applying a Fokker-Planck
    or guiding-center collision operator to a fast-particle distribution constrained
    by diagnostics and by the local background plasma density, temperature, composition,
    and magnetic equilibrium.


    Typical magnitudes range from 10^2-10^5 W m^-3 for weak fast-particle tails or
    outer-plasma regions to 10^5-10^7 W m^-3 in core regions with strong neutral-beam,
    radio-frequency, or alpha-particle populations. Values can be close to zero where
    the counter-passing population is small or nearly collisionally equilibrated.


    Sign convention: Positive when Coulomb collisions increase the kinetic-energy
    density of the counter-passing fast-particle population.'
  unit: W.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/collisions/electrons/power_fast
    dd_path: distributions/distribution/profiles_1d/counter_passing/collisions/electrons/power_fast
    status: composed
- name: counter_passing_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged volumetric energy source rate for the counter-passing
    orbit population. It is the local power density transferred to or from that population
    by wave-particle interactions, collisions, or particle sources.
  documentation: 'Counter-passing power density is the flux-surface-averaged rate
    at which kinetic energy is added to the counter-passing orbit population per unit
    physical volume. Counter-passing refers to the passing part of velocity space
    whose guiding-center motion is opposite to the co-passing direction; it excludes
    trapped orbits.


    A kinetic definition is the energy moment of the net source operator over the
    counter-passing velocity-space domain, followed by a flux-surface average:


    $$

    S_{\mathrm{cp}}^{\varepsilon}(\rho,t) = \left\langle \int_{\Omega_{\mathrm{cp}}}
    \frac{1}{2} m_s v^2\, \mathcal{S}_s(\mathbf{x},\mathbf{v},t)\, d^3v \right\rangle_{\rho}

    $$


    where $S_{\mathrm{cp}}^{\varepsilon}$ has units W m$^{-3}$, $\rho$ is a radial
    flux-surface label in flux coordinates $(\rho,\theta,\phi)$, $\Omega_{\mathrm{cp}}$
    is the counter-passing velocity-space domain, $m_s$ is the species mass in kg,
    $v=|\mathbf{v}|$ is speed in m s$^{-1}$, and $d^3v$ has units m$^3$ s$^{-3}$.
    The operator $\mathcal{S}_s$ is the net time rate of change of the distribution
    function from sources, collisions, and wave interactions; if $\int f_s d^3v$ is
    a number density in m$^{-3}$, then $\mathcal{S}_s$ has units s$^2$ m$^{-6}$. The
    notation $\langle A\rangle_{\rho}$ denotes the flux-surface average at fixed $\rho$,
    equivalently the surface integral of $A$ weighted by $1/|\nabla\rho|$ divided
    by the corresponding weighted surface area.


    In practice this quantity is computed from kinetic or Fokker-Planck models by
    taking the velocity-space energy moment of the relevant collision, external source,
    and wave-particle operators over the counter-passing domain. It is constrained
    indirectly by deposited heating, fast-particle measurements, loss measurements,
    and power-balance analysis. Together with [co_passing_power_density](name:co_passing_power_density)
    and [trapped_power_density](name:trapped_power_density), it partitions the orbit-integrated
    [power_density](name:power_density).


    Typical magnitudes are 10$^3$-10$^6$ W m$^{-3}$ in auxiliary-heated tokamak plasmas,
    with localized radio-frequency or neutral-beam deposition reaching about 10$^7$
    W m$^{-3}$. Weakly driven regions can be near zero, and collisional drag or loss
    terms can give negative values with comparable magnitudes.


    Sign convention: Positive when the counter-passing orbit population gains kinetic
    energy from the net source operator.'
  unit: W.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/source/energy
    dd_path: distributions/distribution/profiles_1d/counter_passing/source/energy
    status: composed
- name: deuterium_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of deuterium ions evaluated at the radial position of
    the internal transport barrier, the flux surface where turbulent cross-field transport
    is locally suppressed and steep radial gradients can form.
  documentation: 'The deuterium ion number density at the internal transport barrier
    (ITB) characterizes the local fuel-ion concentration at the barrier''s reference
    flux surface, where cross-field turbulent diffusion is suppressed and steep radial
    density gradients can persist. Internal transport barriers form when $E \times
    B$ velocity shear or reversed magnetic shear quenches dominant drift-wave turbulence,
    creating a region of locally enhanced particle confinement.


    The quantity is the deuterium ion density profile $n_D(\rho)$ evaluated at the
    ITB reference radius $\rho_\mathrm{ITB}$:


    $$

    n_D^\mathrm{ITB} = n_D(\rho_\mathrm{ITB})

    $$


    where $\rho_\mathrm{ITB}$ is the ITB position in the chosen radial coordinate,
    such as the normalized toroidal flux radius, and corresponds to the surface where
    the transport suppression is most pronounced.


    In practice, this value is inferred from Thomson scattering, charge-exchange recombination
    spectroscopy, or reflectometry measurements resolved at the barrier location,
    combined with equilibrium reconstruction to map measurement positions to flux-surface
    coordinates.


    The parent quantity [density_at_internal_transport_barrier](name:density_at_internal_transport_barrier)
    covers all constituent species using the same locus convention. The analogous
    fuel-ion siblings for hydrogen and tritium are [hydrogen_density_at_internal_transport_barrier](name:hydrogen_density_at_internal_transport_barrier)
    and [tritium_density_at_internal_transport_barrier](name:tritium_density_at_internal_transport_barrier).
    The pedestal counterpart for deuterium is [deuterium_density_at_pedestal](name:deuterium_density_at_pedestal).


    Sign convention: Positive when deuterium ions are present; particle number density
    is an intrinsically non-negative quantity.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_internal_transport_barrier
  - name:hydrogen_density_at_internal_transport_barrier
  - name:tritium_density_at_internal_transport_barrier
  - name:deuterium_density_at_pedestal
  sources:
  - id: dd:summary/local/itb/n_i/deuterium/value
    dd_path: summary/local/itb/n_i/deuterium/value
    status: composed
- name: deuterium_tritium_density
  kind: scalar
  status: draft
  description: Ion number density of the fictitious combined deuterium-tritium fuel
    pseudo-species, equal to the sum of the local deuterium and tritium ion densities
    in transport models treating both isotopes as one effective ion.
  documentation: 'The deuterium-tritium density is the local ion count per unit volume
    belonging to the fictitious combined fuel pseudo-species formed by merging the
    deuterium and tritium populations into a single effective ion. This simplification
    reduces the fuel ion description to a single continuity equation and is employed
    in transport simulations that do not resolve D and T as separately evolved species.


    The DT pseudo-species density $n_{DT}$ equals the sum of the individual isotope
    number densities:


    $$

    n_{DT} = n_D + n_T

    $$


    where $n_D$ is the deuterium ion number density and $n_T$ is the tritium ion number
    density.


    The local density is inferred from neutron emission profiles, hydrogen isotope
    spectroscopy, or charge-exchange recombination spectroscopy combined with charge-state
    balance. In integrated modeling, it is evolved by a continuity equation incorporating
    ionization, recombination, and transport source terms. The volume average of this
    quantity is [volume_averaged_deuterium_tritium_density](name:volume_averaged_deuterium_tritium_density),
    and the on-axis value is [deuterium_tritium_density_at_magnetic_axis](name:deuterium_tritium_density_at_magnetic_axis).
    When D and T are resolved as separate species, the individual isotope densities
    are tracked by [volume_averaged_deuterium_density](name:volume_averaged_deuterium_density)
    and [volume_averaged_tritium_density](name:volume_averaged_tritium_density).


    Typical core values in DT burning plasmas range from $10^{19}$ to $10^{20}$ m$^{-3}$,
    decreasing toward the edge and scrape-off layer.'
  unit: m^-3
  physics_domain: transport
