    $$


    where $R$ is the major-radius coordinate, and $X$ and $Y$ are the Cartesian coordinates
    perpendicular to the toroidal symmetry axis in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$
    basis. The cylindrical angle $\phi$ is the toroidal angular coordinate and $Z$
    is the vertical coordinate of the same point.


    This quantity applies to each point defining the control-surface outline. The
    control surface is defined by an outline in a poloidal plane and extends in the
    toroidal direction with axisymmetric geometry; this quantity is the local coordinate
    of an outline point, not a surface average or an integrated surface property.
    It is distinct from displacement along a flux-surface normal, which describes
    a different geometric direction.


    This entry specializes [radial coordinate](name:radial_coordinate) by restricting
    its locus to a point on a control-surface outline while retaining the same major-radius
    definition.'
