name: monte_carlo_marker_phase_space_position
status: draft
cocos_transformation_type: one_like
description: Phase-space coordinates of each Monte Carlo marker particle, encoding
  spatial position and velocity (or energy-pitch) information.
documentation: "The Monte Carlo marker phase-space position stores the full kinetic\
  \ state of each computational marker used in particle-following or orbit-tracking\
  \ codes (e.g., ASCOT, SPIRAL, NUBEAM). The coordinate set typically comprises spatial\
  \ coordinates $(R, Z, \\phi)$ or $(x, y, z)$ together with velocity-space coordinates\
  \ such as $(v_\\parallel, v_\\perp)$ or $(E, \\lambda)$, where $E$ (eV) is the kinetic\
  \ energy and $\\lambda = v_\\parallel / v$ is the pitch parameter. The first array\
  \ dimension indexes the marker population (typically $10^4$\u2013$10^7$ markers),\
  \ and the second dimension spans the chosen coordinate set (commonly 5 or 6 entries).\
  \ The dimensionless unit (1) reflects the fact that the coordinate components have\
  \ heterogeneous physical units packed into a single array; individual components\
  \ carry units of m, rad, m/s, or eV depending on the convention. Marker weights,\
  \ birth distributions, and slowing-down physics determine how the discrete marker\
  \ ensemble samples the physical distribution function. See also `distribution_particle_number_density`\
  \ for the continuum counterpart."
