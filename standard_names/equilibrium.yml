- name: poloidal_plane_cross_sectional_area_of_plasma_boundary
  kind: scalar
  status: active
  description: Area enclosed by the last closed magnetic flux surface in a poloidal
    plane, defining the equilibrium plasma cross-sectional size at the plasma boundary.
  documentation: 'This quantity is the geometric area enclosed by the last closed
    magnetic flux surface (LCFS), which forms the plasma boundary, in a poloidal cross-section.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, the enclosed area is defined
    by


    $$

    A_{\rm LCFS} = \iint_{\mathcal{S}_{\rm LCFS}} dR\,dZ

    $$


    where $A_{\rm LCFS}$ is the LCFS cross-sectional area, $\mathcal{S}_{\rm LCFS}$
    is the region enclosed by the LCFS contour at fixed toroidal angle $\phi$, $R$
    is major radius, $\phi$ is toroidal angle, $Z$ is vertical height, and $dR\,dZ$
    is the poloidal-plane area element.


    This is a global equilibrium quantity for the complete plasma-boundary contour.
    It is not a local surface element, a flux-surface average, or the area of a toroidal
    surface formed by revolving the contour.


    It is the plasma-boundary specialization of [poloidal plane cross-sectional area
    of a flux surface](name:poloidal_plane_cross_sectional_area_of_flux_surface),
    whose corresponding area is defined for an arbitrary closed magnetic flux surface;
    the LCFS is the outermost such surface enclosing the plasma.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:poloidal_plane_cross_sectional_area_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-area
    dd_documentation:
      leaf: Area of the LCFS poloidal cross section
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of the last closed flux surface (LCFS) in
        the poloidal plane. A global equilibrium scalar characterizing the plasma
        cross-sectional size, used in confinement scaling and geometric normalizations.
      kind: llm
- name: product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  kind: scalar
  status: active
  description: "Grad\u2013Shafranov equilibrium source term equal to the poloidal\
    \ current function multiplied by its derivative with respect to poloidal magnetic\
    \ flux."
  documentation: "This quantity is the flux-function product that represents the toroidal-field\
    \ contribution to the Grad\u2013Shafranov equilibrium balance. It is formed from\
    \ the poloidal current function and its variation across nested magnetic flux\
    \ surfaces.\n\nThe defining expression is\n\n$$\nF\\,\\frac{dF}{d\\psi}\n$$\n\n\
    where $F$ is the [poloidal current function](name:poloidal_current_function),\
    \ equal to the major-radius-weighted toroidal magnetic field, and $\\psi$ is the\
    \ signed [poloidal magnetic flux](name:poloidal_magnetic_flux) labeling the nested\
    \ equilibrium flux surfaces.\n\nThis quantity applies to an axisymmetric equilibrium\
    \ and is evaluated as a function of the poloidal-flux label. It has no species,\
    \ population, region, or mechanism restriction, and its aggregation convention\
    \ is the direct product of two flux-function quantities: it is neither a flux-surface\
    \ average nor a sum over surfaces. It is distinct from the undifferentiated poloidal\
    \ current function and from the product $F^2$.\n\nWithin the Grad\u2013Shafranov\
    \ equation, this term supplies the magnetic contribution associated with the variation\
    \ of the poloidal current function and therefore participates in the balance determining\
    \ toroidal current density and plasma pressure. The derivative factor distinguishes\
    \ it from the parent [poloidal current function](name:poloidal_current_function)\
    \ itself.\n\nSign convention: Positive when the poloidal current function and\
    \ its derivative with respect to signed poloidal magnetic flux have the same sign;\
    \ the poloidal current function is positive when the toroidal magnetic field points\
    \ toward increasing toroidal angle $\\phi$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: T^2.Wb^-1.m^2
  physics_domain: equilibrium
  links:
  - name:poloidal_current_function
  arguments:
  - name: poloidal_current_function
    operator: product
    operator_kind: binary
    role: a
    separator: and
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/f_df_dpsi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-f_df_dpsi
    dd_documentation:
      leaf: Derivative of F w.r.t. Psi, multiplied with F
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T^2.m^2.Wb^-1
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Product F\xB7dF/d\u03C8, where F = R\xB7B\u03C6 is the poloidal\
        \ current function and \u03C8 is the poloidal flux. Appears in the Grad-Shafranov\
        \ equation and relates toroidal current density to pressure balance on flux\
        \ surfaces."
      kind: llm
- name: radial_coordinate_at_inboard_midplane
  kind: scalar
  status: active
  description: Major-radius coordinate of a magnetic flux surface at its inboard midplane
    intersection, locating the high-field-side point relative to the toroidal symmetry
    axis.
  documentation: 'This quantity is the major-radius coordinate of the point where
    a magnetic flux surface intersects the inboard midplane, identifying the high-field-side
    location of that surface relative to the toroidal symmetry axis. It is a locus-specific
    form of the [radial coordinate](name:radial_coordinate).


    For a magnetic flux surface $\mathcal{S}$, the inboard-midplane radial coordinate
    is defined by


    $$

    R_{\mathrm{in}}(\mathcal{S}) = R\!\left(\mathbf{x}_{\mathrm{in}}(\mathcal{S})\right)

    $$


    where $R_{\mathrm{in}}(\mathcal{S})$ is the quantity defined here, $R(\mathbf{x})$
    is the major-radius coordinate of spatial position $\mathbf{x}$, $\mathcal{S}$
    is the specified magnetic flux surface, and $\mathbf{x}_{\mathrm{in}}(\mathcal{S})$
    is its inboard midplane intersection. The coordinates are expressed in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The scope is one coordinate value for each specified magnetic flux surface at
    its inboard, high-field-side midplane intersection. It is not a flux-surface average,
    a poloidal or toroidal average, or the corresponding outboard-midplane coordinate;
    the latter is represented by [radial coordinate at outboard midplane](name:radial_coordinate_at_outboard_midplane).
    Unlike [radial magnetic field](name:radial_magnetic_field), this quantity describes
    the location of a surface and not a magnetic-field component.


    This quantity specializes [radial coordinate](name:radial_coordinate) by fixing
    the evaluation locus to the inboard midplane. Comparing it with the outboard-midplane
    value characterizes the horizontal extent and radial placement of the same magnetic
    flux surface.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_at_outboard_midplane
  - name:radial_magnetic_field
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/r_inboard
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-r_inboard
    dd_documentation:
      leaf: Radial coordinate (major radius) on the inboard side of the magnetic axis
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: m
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: Major radius (R) of the flux surface at the inboard (high-field
        side) midplane intersection, provided as a 1D radial profile. Used in flux
        surface geometry characterization and transport calculations.
      kind: llm
- name: radial_coordinate_at_outboard_midplane
  kind: scalar
  status: active
  description: Major-radius coordinate of the low-field-side intersection between
    a magnetic flux surface and the equatorial midplane.
  documentation: 'This quantity is the major-radius coordinate $R$ of the point where
    a specified magnetic flux surface intersects the equatorial midplane on its outboard,
    low-field side. It gives the outboard radial extent of that surface rather than
    a distance across the plasma or an average over the surface.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, with unit-vector basis $(\hat{R},\hat{\phi},\hat{Z})$,
    the major-radius coordinate is related to the right-handed Cartesian basis $(\hat{x},\hat{y},\hat{z})$
    by:


    $$

    R = \sqrt{x^2+y^2}

    $$


    Here $R$ is the perpendicular distance from the toroidal symmetry axis, $\phi$
    is the toroidal angle, $Z$ is the vertical coordinate, and $x$ and $y$ are the
    horizontal Cartesian coordinates measured from that axis.


    The quantity applies to one specified magnetic flux surface, identified by its
    poloidal magnetic-flux label $\psi$, where $\psi$ denotes the flux function labeling
    nested magnetic surfaces. It is evaluated only at the outboard intersection with
    the equatorial midplane; it excludes the inboard intersection and any flux-surface
    average.


    It is a locus-specific specialization of the [radial coordinate](name:radial_coordinate),
    obtained by evaluating $R$ at the outboard midplane. The corresponding [inboard-midplane
    radial coordinate](name:radial_coordinate_at_inboard_midplane) describes the distinct
    high-field-side intersection of the same type of magnetic surface.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_at_inboard_midplane
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/r_outboard
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-r_outboard
    dd_documentation:
