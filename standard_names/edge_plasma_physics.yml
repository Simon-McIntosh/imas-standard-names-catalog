- name: nitrogen_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of nitrogen impurity ions evaluated at the H-mode pedestal
    top, summed over all ionization states unless a specific charge state is named.
  documentation: 'Number density of nitrogen impurity ions at the H-mode pedestal
    top is the local particle count per volume at the core-side shoulder of the H-mode
    edge transport barrier. It is the nitrogen-specific member of the shared [density
    at the pedestal top](name:density_at_pedestal_top) concept and is distinct from
    the corresponding [ion density at the pedestal top](name:ion_density_at_pedestal_top).


    The number density is defined by


    $$

    n_{\mathrm{N}}(r_p) = \frac{dN_{\mathrm{N}}}{dV}

    $$


    where $n_{\mathrm{N}}$ is the nitrogen-ion number density, $N_{\mathrm{N}}$ is
    the number of nitrogen ions, $V$ is physical volume, and $r_p$ identifies the
    pedestal-top location.


    This quantity is summed over nitrogen ionization states from singly ionized $\mathrm{N}^{+}$
    through fully stripped $\mathrm{N}^{7+}$. Neutral nitrogen and any individual
    charge-state-resolved density are excluded.'
  unit: m^-3
  physics_domain: edge_plasma_physics
