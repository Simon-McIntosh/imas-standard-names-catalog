      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Radiated power from atomic line radiation (Pline), representing
        photon emission from bound-electron transitions in impurity and hydrogen ions.
        A component of the total radiated power contributing to plasma energy losses.
      kind: template
- name: power_due_to_synchrotron_radiation
  kind: scalar
  status: active
  description: Total electromagnetic power emitted by relativistic electrons as synchrotron
    radiation while their gyromotion is curved by the plasma magnetic field.
  documentation: 'Power due to synchrotron radiation is the total electromagnetic
    power emitted by relativistic electrons as synchrotron radiation while their gyromotion
    is curved by the plasma magnetic field. It is a mechanism-specific contribution
    to the plasma radiative power and refers to emitted radiation, not stored electromagnetic
    energy.


    For an emitting plasma volume $V$, the quantity is defined by the volume integral
    of the local synchrotron volumetric emissivity:


    $$

    P_{\mathrm{syn}} = \int_V p_{\mathrm{syn}}(\mathbf{x})\,dV

    $$


    where $P_{\mathrm{syn}}$ is the power due to synchrotron radiation, $p_{\mathrm{syn}}(\mathbf{x})$
    is the local synchrotron volumetric emissivity formed from the relativistic electron
    phase-space distribution and the local magnetic field, $\mathbf{x}$ denotes position,
    and $dV$ is a volume element.


    This quantity includes only synchrotron emission and excludes [bremsstrahlung
    power](name:bremsstrahlung_power) and [power due to line radiation](name:power_due_to_line_radiation).
    It denotes gross electromagnetic power emitted by the radiating electrons and
    is distinct from net synchrotron power escaping a plasma-facing or material boundary
    after reabsorption or reflection.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bremsstrahlung_power
  - name:radiated_power_over_scrape_off_layer
  sources:
  - dd_path: summary/global_quantities/power_synchrotron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_synchrotron-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/power_synchrotron
      parent: Radiated power from synchrotron radiation
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Radiated power from synchrotron radiation.
      kind: template
- name: power_of_soft_xray_detector
  kind: scalar
  status: active
  description: Band-integrated radiant power received by a soft X-ray detector channel
    over its selected photon-energy band or bands.
  documentation: "Soft X-ray detector power is the radiant power carried by incident\
    \ soft X-ray photons and received by one detector channel after spectral selection.\
    \ It represents radiation power rather than the detector\u2019s electrical output.\n\
    \nFor a selected photon-energy band, the received power is defined by:\n\n$$\n\
    P_{\\mathcal{B}} = \\int_{\\mathcal{B}} E\\,\\Phi_E(E)\\,dE\n$$\n\nwhere $P_{\\\
    mathcal{B}}$ is the received power for band $\\mathcal{B}$, $E$ is photon energy,\
    \ $\\Phi_E(E)$ is the photon arrival-rate density as a function of photon energy,\
    \ $\\mathcal{B}$ is the selected energy interval, and $dE$ is an infinitesimal\
    \ photon-energy interval.\n\nThe quantity applies to soft X-ray radiation received\
    \ by a particular detector channel and is integrated over photon energy within\
    \ its selected bandpass. It is not summed over detector channels, viewing directions,\
    \ or distinct energy bands; when multiple bands are resolved, each band has its\
    \ own band-integrated received-power value. It excludes plasma-emitted power before\
    \ arrival at the detector and electrical power generated by detector electronics.\n\
    \nThe quantity is distinct from [spectral_efficiency_of_soft_xray_detector](name:spectral_efficiency_of_soft_xray_detector),\
    \ which describes the probability of registering an incident photon rather than\
    \ the received radiant power. It is also distinct from [hard_xray_brightness](name:hard_xray_brightness),\
    \ which describes photon radiance rather than the power collected by a channel\
    \ over its energy band and collection geometry."
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  sources:
  - dd_path: soft_x_rays/channel/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-power
    dd_documentation:
      leaf: Power received on the detector, in multiple energy bands if available
        from the detector
      parent_path: soft_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power received on a soft X-ray (SXR) detector channel, potentially
        resolved into multiple energy bands defined by filter windows. Used in plasma
        tomography and MHD mode monitoring.
      kind: llm
- name: radial_coordinate_of_aperture
  kind: scalar
  status: active
  description: "Radial coordinate of the aperture is the major-radius R coordinate\
    \ of the geometric center of an aperture in the right-handed cylindrical (R, \u03C6\
    , Z) frame, where R is the perpendicular distance from the toroidal symmetry axis\
    \ measured outward. It locates the aperture center along the radial axis and is\
    \ a non-negative distance."
  documentation: 'Radial coordinate of the aperture is the major-radius coordinate
    $R$ of the geometric center of an aperture in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the perpendicular distance from the toroidal symmetry
    axis measured outward, $\phi$ is the toroidal angle increasing counter-clockwise
    viewed from above $+\hat{Z}$, and $Z$ is the vertical height. As a distance from
    the symmetry axis, $R \ge 0$.


    This is the radial component of the aperture-center position and is paired with
    [toroidal_coordinate_of_aperture](name:toroidal_coordinate_of_aperture) and [vertical_coordinate_of_aperture](name:vertical_coordinate_of_aperture),
    which give the other two coordinates of the same geometric center. It encodes
    only the radial position of the center: two aperture centers at different toroidal
    angles but the same distance from the symmetry axis share the same radial coordinate.
    It is distinct from the signed horizontal Cartesian component x_coordinate_of_aperture,
    and it does not encode aperture size, which is represented separately by [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_aperture
  - name:radius_of_diagnostic_aperture
  sources:
