      kind: llm
- name: total_ion_temperature
  kind: scalar
  status: active
  description: Density-weighted effective temperature of the combined thermal ion
    population, with all species and charge states contributing according to their
    number densities.
  documentation: "The total ion temperature is the density-weighted effective temperature\
    \ of the combined thermal ion population, including all included thermal ion species\
    \ and charge states. It represents random thermal motion and excludes directed\
    \ bulk-flow energy.\n\nThe local effective temperature is defined by\n\n$$\nT_{i,\\\
    mathrm{tot}} = \\frac{\\sum_{s\\in\\mathcal{S}} n_s T_s}{\\sum_{s\\in\\mathcal{S}}\
    \ n_s}\n$$\n\nwhere $n_s$ is the number density and $T_s$ is the ion temperature\
    \ of species or charge state $s$, and $\\mathcal{S}$ is the set of included thermal\
    \ ion populations. Thus, \u201Ctotal\u201D denotes a density-weighted combination,\
    \ not an arithmetic sum of temperatures. Spatially transformed instances apply\
    \ line or volume averaging to this combined quantity, as in [line_averaged_total_ion_temperature](name:line_averaged_total_ion_temperature)\
    \ and [volume_averaged_total_ion_temperature](name:volume_averaged_total_ion_temperature);\
    \ the underlying species-resolved quantity is [ion_temperature](name:ion_temperature).\n\
    \nSign convention: Positive when the density-weighted random kinetic energy of\
    \ the included thermal ions is positive."
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_total_ion_temperature
  - name:volume_averaged_total_ion_temperature
- name: line_averaged_total_ion_temperature
  kind: scalar
  status: active
  description: Density-weighted effective temperature of the combined thermal ion
    population, with all species and charge states contributing by number density
    and averaged along a specified plasma chord.
  documentation: 'The line-averaged total ion temperature is the line average of the
    local density-weighted effective temperature of the combined thermal ion population,
    including all included thermal ion species and charge states. It represents random
    thermal motion and excludes directed bulk-flow energy.


    The chord average is defined by


    $$

    T_{i,\mathrm{line}} = \frac{\int_{\mathcal{C}} T_{i,\mathrm{tot}}(\ell)\,d\ell}{\int_{\mathcal{C}}d\ell}

    $$


    where $T_{i,\mathrm{line}}$ is the line-averaged quantity, $T_{i,\mathrm{tot}}(\ell)$
    is the local [total ion temperature](name:total_ion_temperature), $\ell$ is path
    length along the chord, and $\mathcal{C}$ is the specified chord. Species and
    charge states are combined by number density before the line average is taken.
    Unlike the [volume-averaged total ion temperature](name:volume_averaged_total_ion_temperature),
    this quantity weights positions by chord length rather than plasma volume.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:total_ion_temperature
  - name:volume_averaged_total_ion_temperature
  arguments:
  - name: total_ion_temperature
