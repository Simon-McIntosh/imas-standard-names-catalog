        of a neutron detector module. Groups the commanded voltage waveform and associated
        uncertainty, representing the target bias voltage as opposed to the measured
        output voltage.
      kind: llm
- name: saturated_ion_current
  kind: scalar
  status: active
  description: Ion charge flux collected by a Langmuir probe at the ion-saturation
    limit, expressed as the non-negative magnitude of the area-integrated ion current
    when electron collection is suppressed.
  documentation: 'Ion charge flux collected by a Langmuir probe at the ion-saturation
    limit is the non-negative magnitude of the current due to ions reaching the collecting
    surface when the probe bias is sufficiently negative that electron collection
    is suppressed and the ion branch is in its saturation regime. It represents the
    area-integrated counterpart of the local saturated ion current density.


    The saturated ion current is defined by integration of the saturated ion current
    density over the effective collecting surface:


    $$

    I_{\mathrm{sat},i} = \int_{A_{\mathrm{eff}}} j_{\mathrm{sat},i}(\mathbf{x})\,
    dA

    $$


    where $j_{\mathrm{sat},i}$ is the [saturated ion current density](name:saturated_ion_current_density),
    $A_{\mathrm{eff}}$ is the [effective area of a Langmuir probe](name:effective_area_of_langmuir_probe),
    $\mathbf{x}$ labels position on the collecting surface, and $dA$ is a surface-area
    element.


    Any sheath-expansion factor, incidence-angle correction, ion-species assumption,
    or Bohm-speed estimate is model dependent and belongs to the evaluation of $j_{\mathrm{sat},i}$
    or $A_{\mathrm{eff}}$, not to the definition of this quantity. This quantity excludes
    electron current and does not encode a signed electrode-current convention.'
  unit: A
  physics_domain: particle_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:saturated_ion_current_density
  - name:fluctuating_saturated_ion_current_density
  arguments:
  - name: ion_current
    operator: saturated
    operator_kind: qualifier
  sources:
