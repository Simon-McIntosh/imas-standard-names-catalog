name: volume_averaged_hydrogen_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of protium (H$^+$) ions, characterizing
  the hydrogen fuel or minority species content.
documentation: "The volume-averaged hydrogen ion number density $\\langle n_{\\mathrm{H}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{H}}(\\mathbf{r})\\, dV$ where $n_{\\mathrm{H}}$\
  \ is the local protium ion density in m$^{-3}$ and $V$ is the plasma volume in m$^3$.\
  \ Hydrogen plasmas are used in tokamak commissioning, wall conditioning, and non-nuclear\
  \ operational phases; typical volume-averaged densities are $10^{19}$\u2013$10^{20}$\
  \ m$^{-3}$. In D-T campaigns, residual hydrogen acts as a fuel diluent; its concentration\
  \ is tracked via Balmer-alpha spectroscopy (H$_\\alpha$ vs D$_\\alpha$ isotope separation)\
  \ and neutral particle analyzers. The H/(H+D) ratio is an important parameter for\
  \ isotope-ratio control and affects L-H power threshold scaling. See also `volume_averaged_deuterium_ion_number_density`\
  \ and `electron_number_density`."
