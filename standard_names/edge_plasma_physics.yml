- name: toroidal_helium_4_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal velocity of helium-4 ions at the pedestal.
  documentation: 'Toroidal helium-4 velocity at the pedestal is the toroidal component
    of the bulk flow velocity of helium-4 ions evaluated in the edge transport-barrier
    region. The component is defined in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The signed toroidal component is the projection of the helium-4 ion flow velocity
    onto the toroidal basis direction:


    $$

    v_{\phi,\mathrm{He4,ped}} = \mathbf{v}_{\mathrm{He4,ped}} \cdot \hat{\phi}

    $$


    where $v_{\phi,\mathrm{He4,ped}}$ is the pedestal toroidal helium-4 velocity in
    $\mathrm{m\,s^{-1}}$, $\mathbf{v}_{\mathrm{He4,ped}}$ is the bulk helium-4 ion
    flow velocity at the pedestal in $\mathrm{m\,s^{-1}}$, and $\hat{\phi}$ is the
    dimensionless unit vector in the direction of increasing toroidal angle.


    In practice this quantity is obtained from measurements or modeling that resolve
    ion flow in the pedestal region. Spectroscopic Doppler measurements of suitable
    helium emission, combined with viewing geometry and equilibrium information, can
    constrain the toroidal component when the relevant charge-state emission is available;
    otherwise it may be inferred from transport or momentum-balance analysis.


    Representative signed pedestal toroidal velocities may range from near 0 to several
    $10^4\ \mathrm{m\,s^{-1}}$, with values of either sign depending on the rotation
    direction and discharge conditions. The magnitude should be interpreted relative
    to local edge thermal speeds and collisional coupling to other ion species.


    Sign convention: Positive when the helium-4 ion bulk flow is in the $+\hat{\phi}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_pedestal
  - name:toroidal_helium_4_velocity_at_magnetic_axis
