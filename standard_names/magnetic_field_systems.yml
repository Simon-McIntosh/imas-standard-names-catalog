- name: vertical_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the geometric centroid of a ferritic element
    in the right-handed cylindrical (R, phi, Z) frame, where Z increases upward from
    the machine midplane.
  documentation: "The vertical coordinate $Z$ locates the geometric centroid of a\
    \ ferritic element along the machine vertical axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is the major radius from the toroidal symmetry\
    \ axis and $Z$ is measured from the machine midplane, increasing upward.\n\nFerritic\
    \ elements are passive ferromagnetic components \u2014 typically ferritic steel\
    \ tiles or inserts \u2014 installed within the vacuum vessel to reduce toroidal\
    \ magnetic field ripple and improve single-particle confinement. Accurate centroid\
    \ positions are required for electromagnetic modeling of ripple fields and for\
    \ equilibrium reconstruction codes that account for the perturbed toroidal field.\n\
    \nTogether with the corresponding radial position [major_radius_of_ferritic_element](name:major_radius_of_ferritic_element),\
    \ this quantity fully specifies the centroid location in the poloidal cross-section\
    \ for axisymmetric geometric representations. The equivalent Cartesian description\
    \ uses [x_coordinate_of_ferritic_element_centroid](name:x_coordinate_of_ferritic_element_centroid)\
    \ and [y_centroid_of_ferritic_element](name:y_coordinate_of_ferritic_element_centroid)\
    \ for three-dimensional positioning. Centroid coordinates are typically derived\
    \ from engineering drawings or CAD geometry of the as-built device.\n\nSign convention:\
    \ Positive when the centroid lies above the machine midplane in the direction\
    \ of increasing $Z$."
  unit: m
  physics_domain: magnetic_field_systems
  links:
