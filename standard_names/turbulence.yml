- name: density_at_outboard_midplane
  kind: scalar
  status: active
  description: Particle number density of a specified plasma species at the outboard
    midplane is the local particle count per volume for that species at the low-field-side
    intersection of a magnetic flux surface with the equatorial midplane.
  documentation: 'Particle number density of a specified plasma species at the outboard
    midplane is the local particle count per physical volume for that species at the
    fixed outboard-midplane locus of the selected magnetic flux surface. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ increases
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical height,
    this locus is the larger-$R$ crossing of that flux surface with the equatorial
    midplane.


    The local density is defined by the differential particle count evaluated at the
    outboard-midplane position:


    $$

    n_s(\mathbf{x}_{\mathrm{omp}}) = \left.\frac{dN_s}{dV}\right|_{\mathbf{x}=\mathbf{x}_{\mathrm{omp}}}

    $$


    where $N_s$ is the particle number of species $s$, $V$ is physical volume, and
    $\mathbf{x}_{\mathrm{omp}}$ is the outboard-midplane point on the selected magnetic
    flux surface.


    The species label is the abstraction axis of this parent quantity; the evaluation
    position is always the outboard midplane. For a species not resolved by charge
    state, this per-volume amount is summed over all charge states. Species-specific
    standard names, such as [electron density at the outboard midplane](name:electron_density_at_outboard_midplane),
    instantiate the same fixed-locus quantity for a particular population. This is
    a local value, not a flux-surface average, line average, or volume average.'
  unit: m^-3
  physics_domain: turbulence
  links:
  - name:electron_density_at_outboard_midplane
- name: electron_density_at_outboard_midplane
  kind: scalar
  status: active
  description: Electron particle number density at the low-field-side intersection
    of a magnetic flux surface with the equatorial midplane.
  documentation: 'Electron number density at the outboard midplane is the local density
    of the electron population at the low-field-side intersection of a specified magnetic
    flux surface with the equatorial midplane. It is the electron-specific member
    of [density_at_outboard_midplane](name:density_at_outboard_midplane).


    At that location, the density is defined by the zeroth velocity-space moment


    $$

    n_e(R,\phi,Z)=\int f_e(R,\phi,Z,\mathbf{v})\,d^3\mathbf{v}

    $$


    where $n_e$ is electron number density, $f_e$ is the electron velocity-distribution
    function, $\mathbf{v}$ is velocity, and $d^3\mathbf{v}$ is the velocity-space
    volume element. The position is described in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. This quantity counts electrons only and is distinct from total particle
    density and from electron density evaluated at the magnetic axis.'
  unit: m^-3
  physics_domain: turbulence
  links:
  - name:density_at_outboard_midplane
  arguments:
  - name: density_at_outboard_midplane
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: gyrokinetics_local/normalizing_quantities/n_e
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-normalizing_quantities-n_e
    dd_documentation:
