name: poloidal_magnetic_flux_of_halo_boundary
status: draft
cocos_transformation_type: psi_like
description: Poloidal magnetic flux $\psi$ evaluated at the flux surface defining
  the halo current region boundary during a disruption.
documentation: "The poloidal magnetic flux at the halo boundary, $\\psi_{\\rm halo}$\
  \ (Wb), labels the flux surface that separates the halo current region from the\
  \ open field-line domain or the wall. It is defined as $\\psi = \\frac{1}{2\\pi}\\\
  int \\mathbf{B}_p \\cdot d\\mathbf{S}$, where $\\mathbf{B}_p$ is the poloidal magnetic\
  \ field. During vertical displacement events and current quenches, the halo boundary\
  \ shifts as field lines reconnect with material surfaces; $\\psi_{\\rm halo}$ therefore\
  \ evolves on the resistive or Alfv\xE9nic timescale of the quench. This quantity\
  \ is extracted from free-boundary equilibrium reconstructions that account for halo-current\
  \ paths and is a key input to disruption load analysis codes. In ITER-class devices,\
  \ halo-boundary flux values during major disruptions typically lie within tens of\
  \ Wb of the last-closed-flux-surface value."
