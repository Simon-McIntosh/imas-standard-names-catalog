name: runaway_electron_pitch_angle
status: draft
cocos_transformation_type: one_like
description: Flux-surface-averaged pitch angle of the runaway electron distribution,
  defined as $\langle v_\parallel / |v| \rangle$ over the runaway population.
documentation: "The runaway electron pitch angle $\\xi = \\langle v_\\parallel / |v|\
  \ \\rangle_{\\mathrm{RE}}$ characterizes the directional alignment of the runaway\
  \ population with the magnetic field, where $v_\\parallel$ is the velocity component\
  \ parallel to $\\mathbf{B}$ and $|v|$ is the total speed. A value near $\\pm 1$\
  \ indicates a strongly field-aligned (beam-like) distribution, while values closer\
  \ to zero imply significant perpendicular momentum, as can arise from synchrotron\
  \ radiation reaction or pitch-angle scattering. In post-disruption runaway beams,\
  \ typical values are $|\\xi| \\approx 0.9$\u2013$1.0$; during the avalanche growth\
  \ phase, collisional pitch-angle scattering can broaden the distribution to $|\\\
  xi| \\approx 0.7$\u2013$0.9$. This quantity is used in runaway electron modeling\
  \ codes (e.g., DREAM, CODE) and can be constrained by synchrotron emission imaging\
  \ and hard X-ray diagnostics. See `runaway_electron_density` for the associated\
  \ density profile and `radial_component_of_runaway_electron_particle_flux` for the\
  \ cross-field transport."
