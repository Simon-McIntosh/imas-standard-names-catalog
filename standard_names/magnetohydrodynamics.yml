- name: area_of_flux_surface
  kind: scalar
  status: draft
  description: Poloidal cross-sectional area of a magnetic flux surface in an axisymmetric
    plasma, used as a radial geometric metric for flux-surface-averaged transport
    calculations.
  documentation: 'The area $A(\psi)$ of a given flux surface is the area of the closed
    toroidal surface formed by rotating the poloidal contour around the machine symmetry
    axis. It is a fundamental geometric quantity for evaluating flux-surface-averaged
    quantities such as particle and energy confinement times. In a tokamak equilibrium,
    $A(\psi)$ is computed from the poloidal flux function and the coordinates $(R,
    \phi, Z)$ of the surface. Typical values range from about $1\,\mathrm{m}^2$ near
    the magnetic axis to over $100\,\mathrm{m}^2$ at the plasma boundary for a medium-sized
    tokamak. The area generally increases monotonically from the axis to the edge,
    but local variations can occur due to shaping effects such as elongation or triangularity.
    This quantity is closely related to the toroidal magnetic flux enclosed by the
    surface.


    Sign convention: Positive when the flux surface is oriented outward from the magnetic
    axis, following the right-hand rule in the cylindrical $(R, \phi, Z)$ frame.'
  unit: m^2
  physics_domain: magnetohydrodynamics
  links:
