[project]
name = "imas-standard-names-catalog"
dynamic = ["version"]
description = "IMAS Standard Names Catalog - pre-built SQLite database"
readme = "README.md"
authors = [
    { name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }
]
license = { text = "CC BY-ND 4.0" }
requires-python = ">=3.13"
dependencies = []

[project.urls]
"Documentation" = "https://iterorganization.github.io/imas-standard-names-catalog/"
"Repository" = "https://github.com/iterorganization/imas-standard-names-catalog"

[dependency-groups]
dev = [
    "imas-standard-names[quality] @ git+https://github.com/Simon-McIntosh/imas-standard-names.git@v0.7.0rc36",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/imas_standard_names_catalog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imas_standard_names_catalog"]
artifacts = [
    "src/imas_standard_names_catalog/catalog.db",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "standard_names/",
    "README.md",
    "pyproject.toml",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
