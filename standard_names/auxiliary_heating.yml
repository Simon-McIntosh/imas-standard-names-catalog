    status: composed
- name: per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_amplitude
  kind: scalar
  status: draft
  description: Amplitude (modulus) of the right-hand circularly polarized (RHC, E+)
    component of the wave electric field, resolved per toroidal mode number. This
    polarization rotates in the same sense as ions gyrate about the background magnetic
    field and is the resonant component for ion cyclotron resonance heating.
  documentation: "The right-hand circularly polarized (RHC) component of the wave\
    \ electric field is defined in the Stix convention as\n$$E_+ = \\frac{1}{\\sqrt{2}}(E_1\
    \ + i\\,E_2),$$\nwhere $E_1$ and $E_2$ are orthogonal components of the electric\
    \ field in the plane perpendicular to the equilibrium magnetic field $\\mathbf{B}_0$,\
    \ with the ordering chosen so that $E_+$ co-rotates with the ion Larmor gyration.\
    \ In the right-handed cylindrical $(R, \\phi, Z)$ coordinate system, when $\\\
    mathbf{B}_0$ is directed along $+\\hat{Z}$, one may identify $E_1 = E_R$ and $E_2\
    \ = E_\\phi$.\n\nThe toroidal mode decomposition represents the field as a discrete\
    \ Fourier series in the toroidal angle $\\phi$:\n$$E_+(R, \\phi, Z) = \\sum_n\
    \ \\hat{E}_+^{(n)}(R, Z)\\, e^{in\\phi}.$$\nThe quantity documented here is the\
    \ modulus $|\\hat{E}_+^{(n)}|$ of the complex Fourier coefficient for a given\
    \ toroidal mode number $n$. It is a real, non-negative scalar.\n\nThe unit of\
    \ this quantity is $\\mathrm{V \\cdot m^{-1}}$, identical to the physical electric\
    \ field unit (volts per meter), written equivalently as $\\mathrm{m^{-1} \\cdot\
    \ V}$. The Fourier decomposition in the periodic toroidal angle is dimensionless\
    \ and does not alter the units of the field.\n\nIn ICRH scenarios, typical values\
    \ of $|\\hat{E}_+^{(n)}|$ range from $10^2$ to $10^5\\;\\mathrm{V/m}$ depending\
    \ on launched power, antenna spectrum, and plasma coupling. The ion-cyclotron\
    \ power density absorbed by a resonant species is proportional to $|E_+|^2$ weighted\
    \ by the resonance function, making this quantity a key diagnostic of heating\
    \ efficiency.\n\nFull-wave solvers (e.g., those integrating the Maxwell\u2013\
    Vlasov system in toroidal geometry) produce this quantity as a function of flux-surface\
    \ label and toroidal mode number $n$. Summing $|\\hat{E}_+^{(n)}|^2$ over all\
    \ retained toroidal modes and applying Parseval's theorem recovers the total RHC\
    \ field intensity on a given surface.\n\nThe corresponding phase of the complex\
    \ Fourier coefficient is given by [per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase](name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase).\
    \ The left-hand circularly polarized (LHC) analog, which co-rotates with electrons\
    \ and is relevant for electron cyclotron interactions, is documented as [per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude](name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude).\
    \ The parallel component of the wave electric field, which drives electron Landau\
    \ damping, is given by [per_toroidal_mode_of_parallel_component_of_wave_electric_field_amplitude](name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_amplitude)."
  unit: V.m^-1
  physics_domain: auxiliary_heating
