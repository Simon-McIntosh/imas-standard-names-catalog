    enhanced_context:
      description: Lower triangularity of the plasma boundary.
      kind: template
- name: upper_triangularity_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless upper triangularity shape parameter for a nested magnetic
    flux surface, given by the normalized inward radial displacement of its upper
    vertical extremum.
  documentation: 'Upper triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the upper vertical extremum of a nested magnetic flux
    surface. It is the normalized inward radial displacement of that upper extremum
    in a poloidal cross-section.


    For the upper vertical extremum, the defining relation is:


    $$

    \delta_u = \frac{R_{\mathrm{axis}} - R_u}{a}

    $$


    where $\delta_u$ is upper triangularity, $R_{\mathrm{axis}}$ is the major-radius
    coordinate of the magnetic axis, $R_u$ is the major-radius coordinate of the upper
    vertical extremum, and $a$ is the minor radius of the flux surface. These coordinates
    are defined in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    This quantity applies separately to each nested magnetic flux surface identified
    by its poloidal magnetic-flux label. It represents only the upper extremum and
    is not an aggregate over the upper and lower extrema or over multiple flux surfaces.


    It is distinct from [lower triangularity of a flux surface](name:lower_triangularity_of_flux_surface),
    which uses the lower vertical extremum. It also differs from [upper triangularity
    of the plasma boundary](name:upper_triangularity_of_plasma_boundary), which applies
    only to the outer plasma boundary rather than to an arbitrary nested flux surface.


    Upper triangularity is the upper-extremum branch of [triangularity of a flux surface](name:triangularity_of_flux_surface),
    whose definition permits the relevant upper or lower vertical extremum. The upper
    and lower quantities together describe the asymmetric triangular shaping of a
    flux-surface cross-section.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_triangularity_of_flux_surface
  - name:upper_triangularity_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/triangularity_upper
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-triangularity_upper
    dd_documentation:
      leaf: Upper triangularity w.r.t. magnetic axis
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Upper triangularity (\u03B4_u) of nested flux surfaces as a function\
        \ of the poloidal flux coordinate, measured with respect to the magnetic axis.\
        \ Describes the shape of the upper part of flux surface cross-sections in\
        \ the 1D equilibrium profile."
      kind: llm
