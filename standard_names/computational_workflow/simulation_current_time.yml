name: simulation_current_time
status: draft
cocos_transformation_type: one_like
description: Instantaneous simulation time at which the current state of the solver
  is recorded, in seconds relative to the pulse start.
documentation: The simulation current time $t_{\mathrm{cur}}$ tracks the temporal
  position of the numerical integrator within the main time loop, satisfying $t_{\mathrm{start}}
  \le t_{\mathrm{cur}} \le t_{\mathrm{end}}$. It is updated after each successful
  time step and serves as the primary clock for all coupled physics actors in an integrated-modeling
  workflow. Monitoring $t_{\mathrm{cur}}$ alongside wall-clock time provides a measure
  of computational efficiency (simulated seconds per wall-clock second). In checkpoint/restart
  scenarios, $t_{\mathrm{cur}}$ at the time of the last dump equals the `simulation_restart_time`
  from which the run can be resumed. Typical values span 0 to $\sim 1000$ s depending
  on the simulated scenario duration. See `simulation_end_time` for the target termination
  time and `simulation_component_elapsed_time_interval` for per-component timing.
