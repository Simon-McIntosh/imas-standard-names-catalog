- name: plasma_resistance
  kind: scalar
  status: active
  description: Effective resistance of the plasma column, defined by irreversible
    ohmic power divided by the square of the total plasma current.
  documentation: 'The effective plasma-column resistance is the circuit-level coefficient
    relating irreversible electrical dissipation in the plasma to the total plasma
    current. It is distinct from local electrical resistivity and from inductive contributions
    to the plasma voltage.


    $$

    R_{\rm pl} = \frac{P_{\rm ohm}}{I_{\rm p}^{2}}

    $$


    where $R_{\rm pl}$ is the effective resistance, $P_{\rm ohm}$ is the [power due
    to ohmic dissipation](name:power_due_to_ohmic_dissipation) in W, and $I_{\rm p}$
    is the total conventional plasma current in A. The quantity is non-negative for
    irreversible ohmic dissipation. It represents only the resistive part of the plasma
    circuit response; inductive electromotive-force contributions are included in
    the [loop voltage at the plasma boundary](name:loop_voltage_at_plasma_boundary),
    not in this resistance.'
  unit: ohm
  physics_domain: equilibrium
  links:
  - name:power_due_to_ohmic_dissipation
  - name:loop_voltage_at_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/plasma_resistance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-plasma_resistance
    dd_documentation:
      leaf: Plasma resistance = int(e_field.j.dV) / Ip^2
      parent_path: equilibrium/time_slice/global_quantities
