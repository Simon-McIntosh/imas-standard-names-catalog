- name: flux_due_to_radiation
  kind: scalar
  status: active
  description: Radiative energy-transfer rate delivered per unit surface area to a
    receiving surface by photon transport.
  documentation: 'Radiative energy flux density is the rate at which photon-carried
    energy arrives at a receiving surface, normalized by the surface area. It represents
    the radiation-specific contribution to energy transfer and is independent of conductive,
    particle, or mechanical transport.


    The quantity is defined by


    $$

    q_{\mathrm{rad}} = \frac{\mathrm{d}E_{\mathrm{rad}}}{\mathrm{d}A\,\mathrm{d}t}

    $$


    where $q_{\mathrm{rad}}$ is the radiative energy flux density, $E_{\mathrm{rad}}$
    is the arriving radiative energy, $A$ is the receiving surface area, and $t$ is
    time. The wall-localized instance [flux at wall due to radiation](name:flux_at_wall_due_to_radiation)
    applies this general quantity to a plasma-facing wall. It is the radiation-specific
    component of [energy flux](name:energy_flux).'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_radiation
  - name:energy_flux
- name: flux_at_wall_due_to_radiation
  kind: scalar
  status: active
  description: Flux at wall due to radiation is the radiation-caused areal flux incident
    on a material wall or plasma-facing surface. It is the wall-scoped member of radiation-flux
    quantities; concrete descendants specify the transported quantity, such as photon-carried
    energy.
  documentation: 'Flux at wall due to radiation is the radiation-caused areal flux
    incident on a material wall or plasma-facing surface. It is the wall-scoped radiation-flux
    abstraction; concrete descendants specify the transported quantity carried by
    photons.


    For a radiation-carried quantity $Q$, the incident wall flux is defined as the
    areal rate at which that quantity crosses onto a wall surface element:


    $$

    F_{Q,\mathrm{wall}}^{\mathrm{rad}} = \frac{dQ_{\mathrm{rad}\to\mathrm{wall}}}{dA\,dt}

    $$


    where $Q_{\mathrm{rad}\to\mathrm{wall}}$ is the amount of $Q$ transported by photons
    onto the wall surface element, $dA$ is that wall surface element, and $dt$ is
    the time interval.


    This parent standard name does not by itself choose the transported quantity;
    concrete descendants specify it, such as the [energy flux at wall due to radiation](name:energy_flux_at_wall_due_to_radiation).
    It describes incident radiative transfer to the wall and excludes non-radiative
    particle, conductive, convective, and electromagnetic-work contributions, as well
    as changes after incidence such as absorption, reflection, or re-emission.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_due_to_radiation
  - name:energy_flux_at_wall_due_to_radiation
  arguments:
  - name: flux_due_to_radiation
    operator: wall
    operator_kind: locus
- name: energy_flux_at_wall_due_to_radiation
  kind: scalar
  status: active
  description: Incident photon energy crossing onto a plasma-facing material surface
    per unit area, before absorption, reflection, or re-emission modifies the radiation.
  documentation: 'Incident radiative energy flux density is the incoming photon power
    crossing a plasma-facing material surface, resolved per unit surface area. It
    is the incident component of [flux at wall due to radiation](name:flux_at_wall_due_to_radiation),
    not the net energy deposited in the material.


    For an incident radiation field, the flux is defined by


    $$

    q_{\mathrm{rad}}^{\mathrm{inc}} = \int_{\Omega_{\mathrm{in}}} I_{\mathrm{rad}}(\hat{\mathbf{s}})\,[-\hat{\mathbf{s}}\cdot\hat{\mathbf{n}}]
    \, d\Omega

    $$


    where $I_{\mathrm{rad}}$ is the frequency-integrated radiance, $\hat{\mathbf{s}}$
    is the photon propagation direction, $\hat{\mathbf{n}}$ is the outward surface
    normal, $\Omega_{\mathrm{in}}$ is the set of directions propagating toward the
    surface, and $d\Omega$ is solid angle. The quantity excludes energy removed by
    absorption, redirected by reflection, or returned by surface re-emission; those
    effects are not part of the incident flux itself.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_radiation
  arguments:
  - name: flux_at_wall_due_to_radiation
    operator: energy
    operator_kind: qualifier
