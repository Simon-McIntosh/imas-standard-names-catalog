- name: toroidal_component_of_fast_ion_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the current density carried by fast (non-thermal)
    ions, summed over all orbit classes (co-passing, counter-passing, and trapped),
    excluding electron and thermal ion back-currents (drag-currents). This is a local
    quantity defined at each spatial point in the poloidal cross-section, not a flux-surface
    average.
  documentation: "The toroidal fast-ion current density $j_{\\phi,\\mathrm{fast}}$\
    \ is the $\\hat{\\phi}$-component of the current density contributed by fast (non-thermal)\
    \ ions in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ is\
    \ the toroidal angle increasing counter-clockwise when viewed from above $+\\\
    hat{Z}$.\n\nThis quantity represents the total fast-ion contribution summed over\
    \ all orbit classes:\n$$j_{\\phi,\\mathrm{fast}} = j_{\\phi,\\mathrm{co}} + j_{\\\
    phi,\\mathrm{ctr}} + j_{\\phi,\\mathrm{trap}}$$\nwhere $j_{\\phi,\\mathrm{co}}$\
    \ is the co-passing contribution, $j_{\\phi,\\mathrm{ctr}}$ is the counter-passing\
    \ contribution, and $j_{\\phi,\\mathrm{trap}}$ is the trapped-particle contribution.\
    \ Electron and thermal ion back-currents (drag-currents) are explicitly excluded.\n\
    \nThe quantity is local \u2014 it is defined at each point $(R, Z)$ in the poloidal\
    \ cross-section (or on a flux-surface label grid in 1-D representations). The\
    \ flux-surface-averaged version $\\langle j_{\\phi,\\mathrm{fast}} \\rangle$ feeds\
    \ into the non-inductive current balance:\n$$\\langle j_{\\phi,\\mathrm{non-ind}}\
    \ \\rangle = \\langle j_{\\phi,\\mathrm{fast}} \\rangle + \\langle j_{\\phi,\\\
    mathrm{thermal}} \\rangle + \\langle j_{\\phi,\\mathrm{RF}} \\rangle + \\cdots$$\n\
    The distinction between the local quantity and its flux-surface average is important:\
    \ this standard name refers to the local $j_{\\phi,\\mathrm{fast}}(R,Z)$, and\
    \ flux-surface averaging is a separate operation.\n\nFast ions arise primarily\
    \ from neutral beam injection (NBI), ion cyclotron resonance heating (ICRH), and\
    \ fusion-born alpha particles. Typical magnitudes range from $\\sim 10^4$ to $\\\
    sim 10^6\\,\\mathrm{A\\,m^{-2}}$ depending on the device, injected power, and\
    \ plasma conditions.\n\nSign convention: Positive when the fast-ion current flows\
    \ in the direction of increasing toroidal angle $\\phi$ (counter-clockwise when\
    \ viewed from above $+\\hat{Z}$)."
  unit: A.m^-2
  physics_domain: transport
