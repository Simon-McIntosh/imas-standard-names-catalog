- name: radiative_temperature_at_magnetic_axis
  kind: scalar
  status: active
  description: Radiative temperature at the magnetic axis is the blackbody-equivalent
    brightness temperature of electron cyclotron emission from the resonance layer
    nearest the magnetic axis.
  documentation: 'Radiative temperature at the magnetic axis is the local blackbody-equivalent
    brightness temperature assigned to electron cyclotron emission from the resonance
    layer nearest the central singular point of the confined plasma. It is the radiative
    component of [temperature_at_magnetic_axis](name:temperature_at_magnetic_axis),
    rather than a direct definition of the local kinetic electron temperature.


    The energy-equivalent brightness temperature is defined by the blackbody relation


    $$

    I_\nu = \frac{2h\nu^3}{c^2\left[\exp\left(h\nu/\Theta_{\rm rad}\right)-1\right]}

    $$


    where $I_\nu$ is the specific intensity, $\nu$ is frequency, $h$ is Planck''s
    constant, $c$ is the speed of light, and $\Theta_{\rm rad}$ is the radiative temperature
    expressed as energy. The magnetic-axis locus is defined by $\nabla\psi=0$, where
    $\psi$ is poloidal magnetic flux.


    For optically thick thermal emission, this quantity approaches the local electron
    kinetic temperature represented by [electron_temperature_at_magnetic_axis](name:electron_temperature_at_magnetic_axis);
    it remains a brightness-temperature proxy and can differ when the emission is
    not optically thick. The corresponding non-local radiative quantity is [radiative_temperature](name:radiative_temperature).'
  unit: eV
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:temperature_at_magnetic_axis
  - name:electron_temperature_at_magnetic_axis
  - name:radiative_temperature
  arguments:
  - name: temperature_at_magnetic_axis
    operator: radiative
    operator_kind: qualifier
  sources:
  - dd_path: ece/t_radiation_central
    dd_version: 4.1.0
