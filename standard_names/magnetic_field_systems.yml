- name: y_coordinate_of_ferritic_object_centroid
  kind: scalar
  status: draft
  description: Cartesian y-coordinate of the geometric centroid of a ferritic object,
    measured in the right-handed Cartesian (x, y, z) frame where the z-axis is vertical
    and the x-axis lies along the phi = 0 direction.
  documentation: "The y-coordinate $y_c$ of a ferritic object centroid is defined\
    \ by the volume-weighted integral\n$$y_c = \\frac{\\int y\\, dV}{\\int dV}$$\n\
    over the ferritic element, evaluated in the right-handed Cartesian $(x, y, z)$\
    \ frame with $\\hat{z} = \\hat{Z}$ (vertical) and $\\hat{x}$ aligned with the\
    \ $\\phi = 0$ direction. Together with the paired quantity $z_c$ (see [vertical_coordinate_of_ferritic_object_centroid](name:vertical_coordinate_of_ferritic_object_centroid)),\
    \ this scalar forms part of the centroid descriptor [coordinate_of_ferritic_object_centroid](name:coordinate_of_ferritic_object_centroid)\
    \ used to characterize the placement of ferritic inserts and iron core segments\
    \ for non-axisymmetric magnetic field perturbation calculations.\n\nFerritic components\
    \ \u2014 including test blanket modules, ferritic steel inserts, and correction\
    \ coil support structures \u2014 produce static field errors whose amplitude and\
    \ phase depend sensitively on the Cartesian centroid position. Typical values\
    \ of $y_c$ range from approximately $-5$ m to $+5$ m depending on device size\
    \ and toroidal sector placement.\n\nSign convention: Positive when the centroid\
    \ lies in the $+y$ direction of the right-handed Cartesian $(x, y, z)$ frame."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_coordinate_of_ferritic_object_centroid
  - name:coordinate_of_ferritic_object_centroid
  constraints: []
  arguments:
