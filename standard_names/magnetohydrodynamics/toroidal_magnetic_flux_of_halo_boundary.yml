name: toroidal_magnetic_flux_of_halo_boundary
status: draft
description: Toroidal magnetic flux $\Phi_{\rm tor}$ evaluated at the boundary of
  the halo current region during a disruption.
documentation: "The toroidal magnetic flux at the halo boundary quantifies the enclosed\
  \ toroidal flux $\\Phi_{\\rm tor} = \\int \\mathbf{B} \\cdot d\\mathbf{S}_{\\rm\
  \ tor}$ through the poloidal cross-section up to the flux surface that delimits\
  \ the halo region from the scrape-off layer or wall. During vertical displacement\
  \ events (VDEs) and thermal quenches, the halo boundary migrates as the last closed\
  \ flux surface opens and current is diverted into surrounding structures; tracking\
  \ $\\Phi_{\\rm tor}$ at this boundary is essential for estimating electromagnetic\
  \ loads on plasma-facing components. Typical values depend strongly on the disruption\
  \ phase and machine size; for ITER-class devices the enclosed toroidal flux at the\
  \ separatrix is of order 10\u2013100 Wb, but the halo boundary may enclose a smaller\
  \ fraction during the current quench. The quantity is usually obtained from axisymmetric\
  \ MHD equilibrium reconstructions constrained by external magnetics and halo-current\
  \ measurements. See also `poloidal_magnetic_flux_of_halo_boundary` for the poloidal\
  \ counterpart and `toroidal_magnetic_flux_of_halo_boundary_due_to_poloidal_current`\
  \ for the poloidal-current-driven contribution."
