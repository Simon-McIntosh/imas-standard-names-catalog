- name: momentum_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Normalized toroidal momentum flux contribution from the perturbed parallel
    electromagnetic vector potential in gyrokinetic turbulence, combining both parallel
    and perpendicular transport channels.
  documentation: 'In nonlinear gyrokinetic turbulence, the perturbed parallel electromagnetic
    vector potential $\delta A_\parallel$ drives magnetic-flutter fluctuations that
    displace gyrocenters along perturbed field lines and transport toroidal angular
    momentum across flux surfaces. This quantity represents the total normalized toroidal
    momentum flux attributed to the $\delta A_\parallel$ contribution, abstracting
    over the parallel and perpendicular velocity-space projections resolved by its
    component children.


    The flux arises from the flux-surface-averaged correlation between the magnetic-flutter-induced
    velocity perturbation and the gyrocenter toroidal canonical momentum, summed over
    all species $s$ and wavevectors $\mathbf{k}$:


    $$

    \Pi_\phi^{A_\parallel} = \sum_s \sum_{\mathbf{k}} \left\langle \frac{q_s \, \delta
    A_\parallel}{m_s} \, \hat{p}_{\phi,s} \, \hat{f}_s \right\rangle_{FS}

    $$


    where $q_s$ is the species charge, $m_s$ is the species mass, $\hat{p}_{\phi,s}$
    is the normalized gyrocenter toroidal canonical momentum, $\hat{f}_s$ is the perturbed
    gyrocenter distribution function, and $\langle \cdot \rangle_{FS}$ denotes a flux-surface
    average. The normalization employs outboard-midplane reference values including
    [electron_temperature_at_outboard_midplane](name:electron_temperature_at_outboard_midplane)
    and [electron_density_at_outboard_midplane](name:electron_density_at_outboard_midplane).


    The [parallel component](name:parallel_momentum_flux_due_to_perturbed_parallel_vector_potential)
    captures magnetic-flutter-driven parallel momentum transport; the perpendicular
    component captures cross-field angular momentum transport via $\delta A_\parallel$-induced
    drifts. The analogous contribution from the perturbed parallel magnetic field
    is [momentum_flux_due_to_perturbed_parallel_magnetic_field](name:momentum_flux_due_to_perturbed_parallel_magnetic_field),
    and the electrostatic contribution is normalized_parallel_momentum_flux.


    Sign convention: Positive when toroidal angular momentum is transported outward,
    in the direction of increasing minor radial coordinate across flux surfaces.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:electron_temperature_at_outboard_midplane
  - name:electron_density_at_outboard_midplane
