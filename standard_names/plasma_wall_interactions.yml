- name: vertical_coordinate_of_optical_element
  kind: scalar
  status: active
  description: "Signed vertical coordinate of the geometric center of an optical element,\
    \ measured from the machine midplane in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'This quantity is the vertical position of an optical element''s
    geometric center relative to the machine midplane. It refers to the element as
    a whole, not to an aperture, active optical surface, or another internal feature.


    The coordinate is defined by


    $$

    Z_{\mathrm{opt}} = Z_{\mathrm{center}} - Z_{\mathrm{midplane}}

    $$


    where $Z_{\mathrm{center}}$ is the center''s vertical coordinate and $Z_{\mathrm{midplane}}$
    is the vertical coordinate of the machine midplane. Both are defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The quantity is analogous to the [vertical
    coordinate of an aperture](name:vertical_coordinate_of_aperture) and [vertical
    coordinate of a Bragg crystal](name:vertical_coordinate_of_bragg_crystal), but
    applies to the geometric center of the optical element.


    Sign convention: Positive when the geometric center lies above the machine midplane,
    in the direction of increasing $Z$.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_coordinate_of_aperture
  - name:vertical_coordinate_of_bragg_crystal
