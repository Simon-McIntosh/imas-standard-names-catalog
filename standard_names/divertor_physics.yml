- name: tungsten_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of tungsten ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary, summed over positive ionization states and excluding neutral
    tungsten.
  documentation: 'Number density of tungsten ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the tungsten-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The charge-state-summed tungsten number density is defined by


    $$

    n_W = \sum_{Z=1}^{74} n_{W^{Z+}}

    $$


    where $n_W$ is the total local number density of tungsten ions, $n_{W^{Z+}}$ is
    the local number density of tungsten ions with positive charge state $Z$, and
    $Z$ is the integer tungsten ionization state from 1 through 74.


    This quantity applies only to tungsten ions immediately upstream of the electrostatic
    sheath at a divertor target. It includes every positive tungsten ionization state
    once, without charge-state weighting, and excludes neutral tungsten atoms and
    ions of all other elements.


    The charge-state sum makes this the species-level tungsten component of [density_at_divertor_target](name:density_at_divertor_target).
    Its divertor-target locus distinguishes it from [tungsten_density_at_limiter](name:tungsten_density_at_limiter),
    which describes tungsten ion density at a limiter, and from [tungsten_density_at_plasma_boundary](name:tungsten_density_at_plasma_boundary),
    which applies at the plasma boundary.'
  unit: m^-3
  physics_domain: divertor_physics
  links: []
