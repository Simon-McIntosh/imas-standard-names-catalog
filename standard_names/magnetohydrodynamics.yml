- name: toroidal_linear_mhd_mode_reference_phase
  kind: scalar
  status: active
  description: "Signed angular offset that fixes the complex phase of a linear MHD\
    \ perturbation\u2019s toroidal Fourier mode relative to its zero-phase reference."
  documentation: "The reference phase is the angular offset assigned to the complex\
    \ eigenfunction of a linear MHD perturbation with a specified toroidal harmonic.\
    \ It fixes the mode\u2019s phase origin and is not a spatial displacement or amplitude.\n\
    \nUsing the complex-amplitude convention, the toroidal dependence of a perturbation\
    \ quantity is written as:\n\n$$\n\\widetilde{Q}(R,Z,\\phi)=\\widehat{Q}(R,Z)\\\
    exp\\!\\left[i\\left(n\\phi+\\phi_{\\mathrm{ref}}\\right)\\right]\n$$\n\nwhere\
    \ $\\widetilde{Q}$ is the complex perturbation, $\\widehat{Q}$ is its complex\
    \ amplitude, $n$ is the dimensionless integer toroidal mode number, $\\phi$ is\
    \ toroidal angle, and $\\phi_{\\mathrm{ref}}$ is the reference phase. $R$ and\
    \ $Z$ are the major-radius and vertical coordinates in the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame. The toroidal harmonic is identified by [mode number](name:mode_number),\
    \ while its phase is carried by quantities such as the [toroidal perturbed plasma\
    \ magnetic field](name:toroidal_perturbed_plasma_magnetic_field).\n\nThe reference\
    \ phase does not specify perturbation amplitude, growth rate, oscillation frequency,\
    \ or temporal phase.\n\nSign convention: Positive when the complex mode phase\
    \ advances in the direction of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame."
