name: flux_surface_averaged_effective_charge_at_separatrix
status: draft
cocos_transformation_type: one_like
description: Flux-surface-averaged effective ion charge $\langle Z_{\rm eff} \rangle$
  on the last closed flux surface.
documentation: "The flux-surface average $\\langle Z_{\\rm eff} \\rangle = \\oint\
  \ Z_{\\rm eff}\\, d\\ell / \\oint d\\ell$ (where $d\\ell$ is the poloidal arc-length\
  \ element along the separatrix contour) smooths poloidal asymmetries in the effective\
  \ charge at the plasma boundary. This averaged quantity is more representative than\
  \ a single midplane measurement when in\u2013out impurity asymmetries are significant,\
  \ as in diverted configurations with strong recycling. Typical values range from\
  \ 1.5 to 4 depending on impurity species and seeding level. The quantity is derived\
  \ by combining local $Z_{\\rm eff}$ profiles with the magnetic equilibrium geometry.\
  \ See also `effective_charge_at_plasma_boundary` for the local (midplane) value\
  \ and `effective_charge_at_pedestal` for the pedestal-top evaluation."
