- name: accumulated_methane_carbon_13_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative equivalent-electron count for carbon-13-labeled methane
    injected after plasma breakdown. Each 13CH4 molecule contributes 10 equivalent
    electrons, using atomic number 6 for carbon and 1 for each of the four hydrogen
    atoms.
  documentation: 'Accumulated carbon-13 methane count due to gas injection is the
    running equivalent-electron count associated with neutral ${}^{13}\mathrm{CH}_4$
    molecules admitted after plasma breakdown. The carbon isotope label identifies
    the injected tracer species, while the electron-budget conversion is the same
    as for ordinary methane because ${}^{12}\mathrm{C}$ and ${}^{13}\mathrm{C}$ have
    the same nuclear charge. The accumulation starts from zero at plasma breakdown
    and remains constant during intervals with no ${}^{13}\mathrm{CH}_4$ injection.


    The accumulation at time $t$ is defined from the molecular injection rate by:


    $$

    N_\mathrm{acc}(t) = 10 \int_{t_\mathrm{bd}}^{t} \dot{n}_{{}^{13}\mathrm{CH}_4}(t'')
    \, dt''

    $$


    where $N_\mathrm{acc}$ is the dimensionless equivalent-electron count, $t_\mathrm{bd}$
    is the plasma-breakdown time in seconds, $t$ and $t''$ are times in seconds, and
    $\dot{n}_{{}^{13}\mathrm{CH}_4}$ is the calibrated molecular injection rate in
    molecules per second. The factor $10 = Z_\mathrm{C} + 4 Z_\mathrm{H}$ uses $Z_\mathrm{C}=6$
    for carbon and $Z_\mathrm{H}=1$ for each hydrogen atom.


    In practice this quantity is computed by integrating calibrated gas-valve or mass-flow
    measurements over the discharge, with corrections for valve conductance, reservoir
    pressure, gas temperature, and isotopic purity when needed. It is an isotope-resolved
    component of [accumulated_gas_count](name:accumulated_methane_carbon_13_count_due_to_gas_injection)
    and is directly comparable with accumulated_methane_count_due_to_gas_injection,
    [accumulated_deuterated_methane_count_due_to_gas_injection](name:accumulated_deuterated_methane_count_due_to_gas_injection),
    [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection),
    and [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection)
    in particle and wall-retention accounting.


    Typical accumulated values for small ${}^{13}\mathrm{CH}_4$ tracer puffs are $10^{17}$-$10^{20}$
    equivalent electrons per discharge. Larger calibration, fueling, or wall-conditioning
    injections can reach $10^{20}$-$10^{22}$ equivalent electrons; the corresponding
    number of injected ${}^{13}\mathrm{CH}_4$ molecules is one tenth of the equivalent-electron
    count.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_deuterated_methane_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/methane/value
    dd_path: summary/gas_injection_accumulated/methane/value
    status: attached
  - id: dd:summary/gas_injection_accumulated/methane_carbon_13/value
    dd_path: summary/gas_injection_accumulated/methane_carbon_13/value
