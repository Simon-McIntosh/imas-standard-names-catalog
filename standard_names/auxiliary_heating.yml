- name: normal_component_of_wave_electric_field
  kind: scalar
  status: draft
  description: Normal component of the coherent wave electric field in the local field-aligned
    triad (parallel, normal, binormal), where the normal direction is perpendicular
    to the background magnetic field and lies in the plane of field-line curvature.
    Stored as a Fourier-normalized complex phasor amplitude with units V/m (equivalently
    m^-1.V).
  documentation: "The normal component $E_n$ is the projection of the coherent wave\
    \ electric field $\\mathbf{E}$ onto the normal unit vector $\\hat{n}$ of the local\
    \ field-aligned coordinate triad $(\\hat{b}, \\hat{n}, \\hat{b} \\times \\hat{n})$,\
    \ where $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along the background\
    \ magnetic field and $\\hat{n}$ lies in the osculating plane of the field line,\
    \ nominally directed toward the center of field-line curvature. The binormal direction\
    \ is then $\\hat{b}_\\perp = \\hat{b} \\times \\hat{n}$, completing the right-handed\
    \ orthonormal triad.\n\nThe quantity is the local complex phasor amplitude resulting\
    \ from a Fourier decomposition of the wave field in time (and, where applicable,\
    \ in toroidal angle $\\phi$). The real part of $E_n e^{-i\\omega t}$ gives the\
    \ instantaneous physical field. The unit V/m (recorded in the data dictionary\
    \ as m$^{-1}$\xB7V) reflects this Fourier-normalized amplitude.\n\nTypical magnitudes\
    \ in wave-heating scenarios range from $\\sim 10^2$ to $\\sim 10^6$ V/m in the\
    \ core plasma depending on the heating scheme (e.g., lower-hybrid, ion-cyclotron,\
    \ or electron-cyclotron) and the launched power level. The normal component is\
    \ particularly relevant in regions of strong field-line curvature, where it can\
    \ couple to compressional Alfv\xE9n or slow-wave polarizations.\n\nThe normal\
    \ direction convention (toward the curvature center) is adopted as a consistent\
    \ triad orientation within this standard-name family; however, the sign of $E_n$\
    \ at any given point depends on the local geometry and the field-line curvature\
    \ direction, which may vary along the field line."
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
