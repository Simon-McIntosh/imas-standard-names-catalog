- name: ethylene_count
  kind: scalar
  status: active
  description: Cumulative ethylene (C2H4) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethylene molecule contributes 16 equivalent
    electrons.
  documentation: 'Cumulative ethylene (C2H4) delivered by gas injection since plasma
    breakdown, expressed as a dimensionless equivalent-electron count. Each neutral
    ethylene molecule contributes 16 equivalent electrons, reflecting two carbon atoms
    at atomic number $Z = 6$ and four hydrogen atoms at $Z = 1$.


    The equivalent-electron count $N_\mathrm{eq}$ for an injected number of ethylene
    molecules $N_\mathrm{mol}$ is:


    $$

    N_\mathrm{eq} = 16 \, N_\mathrm{mol}

    $$


    where the factor $16 = 2 \times 6 + 4 \times 1$ is the total bound-electron inventory
    of a neutral C$_2$H$_4$ molecule. The count accumulates from the moment of plasma
    breakdown and resets between discharges, providing a measure of the total electron
    inventory introduced via ethylene injection. It complements hydrocarbon siblings
    such as [accumulated_ethane_count](name:accumulated_ethane_count) and contributes
    to the cross-species total captured by [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection)


    Sign convention: Positive when ethylene gas has been injected into the vessel
    since plasma breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:accumulated_total_particle_count_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_accumulated/ethylene/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-ethylene-value
    dd_documentation:
