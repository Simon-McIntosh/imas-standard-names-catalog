- name: toroidal_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Toroidal direction cosine of the local electromagnetic wave vector
    along a beam-tracing ray, equal to the toroidal wave vector component divided
    by the total wave vector magnitude.
  documentation: 'The toroidal normalized wave vector component is the projection
    of the unit wave vector onto the geometric toroidal direction $\hat{\phi}$, quantifying
    the fraction of the wave''s phase advance occurring in the toroidal direction
    at each point along a beam-tracing path. It characterizes the propagation geometry
    of electromagnetic waves in magnetized plasma and enters the local dispersion
    relation governing wave accessibility and resonance conditions.


    The defining relation is:


    $$

    k_{\phi,\mathrm{norm}} = \frac{k_\phi}{|\mathbf{k}|}

    $$


    where $k_\phi$ is the toroidal component of the wave vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame and $|\mathbf{k}|$ is the total wave vector magnitude.
    The three normalized direction cosines satisfy $k_{R,\mathrm{norm}}^2 + k_{\phi,\mathrm{norm}}^2
    + k_{Z,\mathrm{norm}}^2 = 1$, linking this component to the [radial normalized
    wave vector](name:radial_normalized_wave_vector_of_beam_tracing_beam) and the
    [vertical normalized wave vector](name:vertical_normalized_wave_vector_of_beam_tracing_beam).
    The unnormalized toroidal component is available as the [toroidal wave vector
    of beam tracing beam](name:toroidal_wave_vector_of_beam_tracing_beam).


    This quantity is computed by beam-tracing or ray-tracing solvers integrating the
    geometric-optics equations for RF or ECE wave propagation in inhomogeneous magnetized
    plasma. It governs polarization selection at cyclotron harmonic layers and mode-conversion
    regions along the beam path.


    Values are bounded by $-1 \leq k_{\phi,\mathrm{norm}} \leq 1$. For beams launched
    near-perpendicular to the magnetic field the toroidal direction cosine is near
    zero; oblique launches into the plasma yield larger magnitudes.


    Sign convention: Positive when the toroidal wave vector component $k_\phi$ points
    in the direction of increasing toroidal angle $\phi$.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  - name:toroidal_wave_vector_of_beam_tracing_beam
