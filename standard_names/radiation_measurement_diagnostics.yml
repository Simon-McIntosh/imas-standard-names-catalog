- name: spectral_radiance
  kind: scalar
  status: active
  description: Calibrated photon-number spectral radiance of plasma emission, resolved
    by wavelength and viewing direction per projected area, solid angle, and wavelength
    interval.
  documentation: 'Spectral radiance is the calibrated photon-emission rate from plasma
    radiation resolved by wavelength and viewing direction. It represents the radiance
    density associated with an infinitesimal projected collecting area, solid angle,
    wavelength interval, and time interval.


    The photon-number spectral radiance is defined by


    $$

    L_\lambda = \frac{\mathrm{d}^3 N_\gamma}{\mathrm{d}A_{\mathrm{proj}}\,\mathrm{d}t\,\mathrm{d}\Omega\,\mathrm{d}\lambda}

    $$


    where $L_\lambda$ is spectral radiance, $N_\gamma$ is the number of emitted photons,
    $A_{\mathrm{proj}}$ is projected collecting area normal to the viewing direction,
    $t$ is time, $\Omega$ is solid angle, and $\lambda$ is wavelength.


    This quantity applies to plasma emission over the resolved wavelength and viewing-direction
    domains and is calibrated to an absolute photon-number radiance scale. It is a
    spectral density, not radiance integrated over a wavelength band or an identified
    emission line.


    Integrating $L_\lambda$ over the wavelength interval of an identified transition
    gives the corresponding [photon radiance at a spectral line](name:photon_radiance_at_spectral_line).
    The quantity remains generic with respect to the emission mechanism, whereas [spectral
    bremsstrahlung radiance](name:spectral_bremsstrahlung_radiance) is restricted
    to free-free emission.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:photon_radiance_at_spectral_line
  - name:spectral_bremsstrahlung_radiance
  sources:
  - dd_path: charge_exchange/channel/spectrum/radiance_spectral
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-spectrum-radiance_spectral
    dd_documentation:
      leaf: Calibrated spectral radiance (radiance per unit wavelength)
      parent_path: charge_exchange/channel/spectrum
      parent: Set of spectra obtained by various gratings
      data_type: STRUCTURE
      unit: m^-2.s^-1.sr^-1.m^-1
    enhanced_context:
      description: Calibrated spectral radiance of the charge exchange emission spectrum,
        representing radiance per unit wavelength interval. Used in CXRS analysis
        to derive ion temperature, rotation, and impurity density profiles.
      kind: llm
  - dd_path: spectrometer_uv/channel/radiance_spectral
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_uv.html#spectrometer_uv-channel-radiance_spectral
    dd_documentation:
