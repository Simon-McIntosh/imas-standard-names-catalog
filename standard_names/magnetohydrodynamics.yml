- name: electron_temperature
  kind: scalar
  status: draft
  description: Thermal energy of the bulk electron population expressed as a kinetic
    temperature, equal to two-thirds of the mean electron kinetic energy per particle.
  documentation: 'The electron temperature $T_e$ quantifies the mean thermal kinetic
    energy of the electron population, parameterizing the second moment of the electron
    velocity distribution under the Maxwellian approximation. It is the primary scalar
    measure of the electron thermal state at a given spatial point.


    The defining relation connects $T_e$ to the mean electron kinetic energy per particle
    $\langle E_e \rangle$:


    $$

    T_e = \frac{2}{3} \langle E_e \rangle

    $$


    where both $T_e$ and $\langle E_e \rangle$ are in eV, and the conversion to absolute
    temperature is $1\;\text{eV} = 11605\;\text{K}$.


    Thomson scattering measures $T_e$ from the spectral width of scattered laser light
    and is the gold-standard profile diagnostic from the plasma core to the edge.
    Electron cyclotron emission resolves $T_e$ with high temporal resolution in optically
    thick core regions. Langmuir probes extract $T_e$ from the exponential slope or
    multi-temperature fits to the probe I-V characteristic near plasma-facing surfaces,
    providing point measurements such as [electron temperature at the wall](name:electron_temperature_at_wall)
    and [at the outboard midplane](name:electron_temperature_at_midplane).


    Typical values span 1-20 keV in the plasma core during H-mode operation, decreasing
    to 10-200 eV in the pedestal and scrape-off layer, and 1-30 eV near plasma-facing
    surfaces.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:electron_temperature_at_wall
  - name:electron_temperature_at_midplane
