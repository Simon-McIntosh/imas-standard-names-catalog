name: tendency_of_electron_pressure
status: draft
cocos_transformation_type: one_like
description: Time derivative of the electron pressure, quantifying the rate of change
  of the electron thermal energy density.
documentation: "The tendency $\\partial p_e / \\partial t$ (Pa s$^{-1}$) represents\
  \ how the electron pressure $p_e = n_e k_B T_e$ evolves under the combined action\
  \ of ohmic and auxiliary heating, radiation losses, electron\u2013ion equipartition,\
  \ and radial energy and particle transport. Here $n_e$ is the electron number density\
  \ and $T_e$ the electron temperature. In integrated transport solvers this term\
  \ forms the left-hand side of the electron energy-balance equation. Typical core\
  \ electron pressures in tokamak H-mode plasmas span 10\u2013200 kPa; tendencies\
  \ during transient events such as pellet injection or ECRH switch-on can reach $\\\
  sim 10^{6}$ Pa s$^{-1}$. The quantity is obtained from time-resolved Thomson scattering\
  \ or predicted self-consistently by the transport solver. See `derivative_of_electron_pressure_with_respect_to_normalized_toroidal_flux_coordinate`\
  \ for the spatial gradient and `tendency_of_ion_pressure` for the corresponding\
  \ ion channel."
