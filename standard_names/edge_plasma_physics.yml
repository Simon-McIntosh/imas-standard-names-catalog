- name: ion_average_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Density-weighted kinetic temperature of all ion species and charge
    states evaluated at the core-side shoulder of the H-mode pedestal.
  documentation: 'Ion average temperature at the pedestal top is the density-weighted
    kinetic temperature of the combined ion population at the core-side shoulder of
    the H-mode pedestal. It is the ion-specific component of [average temperature
    at the pedestal top](name:average_temperature_at_pedestal_top).


    $$

    T_{i,\mathrm{avg}} = \frac{\sum_s n_s T_s}{\sum_s n_s}

    $$


    where $T_{i,\mathrm{avg}}$ is the ion average temperature, $n_s$ is the number
    density of ion species or charge state $s$, and $T_s$ is its kinetic temperature.
    The sum includes all ion species and charge states in the defined ion population;
    it is not an electron temperature or a temperature for a single ion species. The
    weighting denominator is the total ion density represented by [total ion density
    at the pedestal top](name:total_ion_density_at_pedestal_top).'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:average_temperature_at_pedestal_top
  - name:total_ion_density_at_pedestal_top
