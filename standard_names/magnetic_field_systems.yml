- name: toroidal_angle_of_conductor_element_start_point
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the start point of a coil conductor element\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, measured counter-clockwise\
    \ when viewed from above."
  documentation: 'The toroidal coordinate $\phi$ locates the start point of a conductor
    element along the azimuthal direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the major radius from the machine symmetry axis and $Z$
    is the vertical height. Each conductor element in a coil geometry is bounded by
    a start point and an end point; this angle, together with the corresponding $R$
    and $Z$ coordinates, fully specifies the three-dimensional position of the element''s
    start point. For coils wound helically around the torus, $\phi$ spans $[0, 2\pi
    N]$ where $N$ is the number of toroidal turns, while for single-turn non-axisymmetric
    coils the range is $[0, 2\pi]$. The companion quantity [toroidal_angle_of_conductor_element_end_point](name:toroidal_angle_of_conductor_element_end_point)
    gives the corresponding angle at the element''s end point, and [toroidal_angle_of_conductor_element_center](name:toroidal_angle_of_conductor_element_center)
    provides the midpoint angle useful for field-line tracing and field-map computations.


    Sign convention: Positive when $\phi$ increases in the counter-clockwise direction
    when viewed from above the $+\hat{Z}$ axis.'
  unit: rad
  physics_domain: magnetic_field_systems
