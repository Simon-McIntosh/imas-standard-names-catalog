- name: wave_electric_field
  kind: vector
  status: draft
  description: Complex vector phasor of the electric field of an electromagnetic wave
    propagating in a magnetized plasma. It encodes the local field amplitude, phase,
    and polarization state from which the real time-dependent electric field is recovered.
  documentation: 'The wave electric field $\mathbf{E}_w$ is the complex vector phasor
    representing the electric oscillation of an electromagnetic wave in a magnetized
    plasma. It contains the relative amplitudes and phases of the vector components,
    so it determines whether the wave is linearly, elliptically, or circularly polarized
    and how much field is parallel or perpendicular to the background magnetic field.


    Using the negative-time-harmonic phasor convention, in which the physical field
    is obtained by multiplying the phasor by $\exp(-i\omega t)$ and taking the real
    part, a homogeneous cold-plasma normal mode satisfies:


    $$

    \left[n^2\left(\hat{\mathbf{k}}\hat{\mathbf{k}}-\mathbf{I}\right)+\boldsymbol{\epsilon}(\omega,\mathbf{B}_0)\right]\cdot\mathbf{E}_w=\mathbf{0}

    $$


    where $\mathbf{E}_w$ has units V m^-1, $n=c|\mathbf{k}|/\omega$ is the dimensionless
    [refractive index](name:refractive_index), $c$ is the speed of light in vacuum
    in m s^-1, $\mathbf{k}=|\mathbf{k}|\hat{\mathbf{k}}$ is the wave vector in m^-1,
    $\omega$ is the angular frequency in rad s^-1, $\mathbf{I}$ is the identity tensor,
    $\boldsymbol{\epsilon}$ is the dimensionless plasma dielectric tensor, and $\mathbf{B}_0$
    is the background magnetic field in T. Nonzero solutions determine the allowed
    dispersion and polarization.


    Components of $\mathbf{E}_w$ must be interpreted with the basis used for the vector.
    In a right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis the components
    are projections on $\hat{x}$, $\hat{y}$, and $\hat{z}$; in a right-handed field-aligned
    $(\hat{e}_1, \hat{e}_2, \hat{b}_0)$ basis, where $\hat{b}_0=\mathbf{B}_0/|\mathbf{B}_0|$
    and $\hat{e}_1\times\hat{e}_2=\hat{b}_0$, the parallel projection gives the complex
    quantity whose parts are represented by [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).
    The transverse projections may be combined as $E_\pm=(\mathbf{E}_w\cdot\hat{e}_1\pm
    i\mathbf{E}_w\cdot\hat{e}_2)/\sqrt{2}$; these circular components are related
    to [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude)
    and [right_hand_circularly_polarized_wave_electric_field](name:right_hand_circularly_polarized_wave_electric_field).


    Wave electric fields are usually computed from antenna launching models, cold-
    or hot-plasma full-wave calculations, ray tracing with polarization evolution,
    or local dispersion calculations normalized to launched power. Measurements infer
    them indirectly from calibrated edge probes, microwave polarimetry, reflectometry,
    scattering, or absorbed-power and current-drive constraints; phase and polarization
    are often determined more robustly than absolute local amplitude.


    Typical phasor magnitudes are strongly power-normalization dependent. Weak probing
    waves can be 10^-1-10^2 V m^-1, while RF and microwave heating or current-drive
    fields are often 10^3-10^5 V m^-1 for local power fluxes of about 0.01-10 MW m^-2;
    evanescent layers, resonances, and near-antenna regions can fall outside these
    ranges.


    Sign convention: Positive when a real component of $\mathbf{E}_w$ points along
    the corresponding positive basis vector, such as $+\hat{x}$, $+\hat{y}$, or $+\hat{z}$
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electric_field
  - name:parallel_wave_electric_field_real_part
  - name:parallel_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:perpendicular_refractive_index
  - name:parallel_refractive_index
