- name: total_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: System-level net radio-frequency power launched into the vacuum vessel
    by all ion-cyclotron heating antennas. It is the sum over antennas of forward
    power minus reflected power, so it represents launched rather than absorbed heating
    power.
  documentation: 'Total power of the ion-cyclotron heating antenna system is the system-level
    net RF power launched through the antenna array into the vacuum vessel. It is
    the aggregate of the per-antenna launched powers, distinguishing launched power
    from the power ultimately absorbed by the plasma, such as [total_power_due_to_ion_cyclotron_heating](name:total_power_due_to_ion_cyclotron_heating).


    The total launched power is defined by summing the net contribution from each
    antenna:


    $$

    P_{\mathrm{ICRH,tot}} = \sum_{a=1}^{N_{\mathrm{ant}}} \left(P_{\mathrm{fwd},a}
    - P_{\mathrm{refl},a}\right)

    $$


    where $N_{\mathrm{ant}}$ is the number of ion-cyclotron heating antennas, $P_{\mathrm{fwd},a}$
    is the forward RF power for antenna $a$, and $P_{\mathrm{refl},a}$ is the corresponding
    reflected RF power, with all powers expressed in W. The per-antenna net term corresponds
    to [power_of_ion_cyclotron_heating_antenna](name:power_of_ion_cyclotron_heating_antenna),
    while the reflected component is represented by [reflected_power_of_ion_cyclotron_heating_antenna](name:reflected_power_of_ion_cyclotron_heating_antenna).


    In practice, the forward and reflected RF powers are inferred from calibrated
    measurements in the antenna feeding system and combined over the active antennas.
    The value is used as a launched-power input for heating efficiency and power-balance
    analysis; it should not be interpreted as the absorbed ion-cyclotron heating power,
    because coupling losses, reflection, edge interactions, and wave absorption determine
    the fraction deposited in the plasma.


    Typical total launched ICRH powers range from about $10^5$-$10^7$ W, depending
    on antenna configuration, coupling conditions, and device size. High-power tokamak
    systems commonly operate in the MW range.


    Sign convention: Positive when the net RF power flow is from the antenna system
    into the vacuum vessel.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_ion_cyclotron_heating_antenna
  - name:total_power_of_electron_cyclotron_launcher
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:total_power_of_neutral_beam_injector
  arguments:
  - name: power_of_ion_cyclotron_heating_antenna
    operator: total
    operator_kind: qualifier
