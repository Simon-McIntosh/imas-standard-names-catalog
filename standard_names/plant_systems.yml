- name: carbon_prefill_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory introduced as carbon gas during
    plasma prefill, with six count units assigned to each injected carbon atom.
  documentation: 'This quantity is the cumulative equivalent-electron inventory of
    carbon introduced by gas injection during the plasma prefill phase, before plasma
    breakdown. It represents injected carbon atoms rather than an instantaneous injection
    rate.


    The defining relation is


    $$

    N_{\mathrm{C,eq}} = Z_{\mathrm{C}}N_{\mathrm{C}} = 6N_{\mathrm{C}}

    $$


    where $N_{\mathrm{C,eq}}$ is the equivalent-electron count, $N_{\mathrm{C}}$ is
    the cumulative number of injected carbon atoms, and $Z_{\mathrm{C}}=6$ is the
    carbon atomic number. Both counts are dimensionless.


    The prefill interval ends at plasma breakdown, so post-breakdown carbon delivery
    is represented separately by [accumulated carbon count due to gas injection](name:accumulated_carbon_count_due_to_gas_injection).
    The aggregation convention parallels [accumulated hydrogen prefill count](name:accumulated_hydrogen_prefill_count),
    with the atomic number providing the equivalent-electron weighting.'
