name: deuterium_tritium_fusion_power_density
status: draft
description: "Volumetric power released by D\u2013T fusion reactions, the dominant\
  \ energy source in burning-plasma scenarios."
documentation: "The deuterium\u2013tritium fusion power density $P_{\\rm DT}(\\mathbf{r})$\
  \ (in W m$^{-3}$) quantifies the local thermal energy production from the D(t,n)$^4$He\
  \ reaction channel. It is given by $P_{\\rm DT} = n_D \\, n_T \\, \\langle \\sigma\
  \ v \\rangle_{\\rm DT} \\, E_{\\rm DT}$, where $n_D$ and $n_T$ are the deuterium\
  \ and tritium number densities, $\\langle \\sigma v \\rangle_{\\rm DT}$ is the Maxwellian-averaged\
  \ reactivity, and $E_{\\rm DT} \\approx 17.6$ MeV is the energy per reaction shared\
  \ between the 14.1 MeV neutron and the 3.5 MeV alpha particle. Reconstructed from\
  \ 14.1 MeV neutron emissivity profiles measured by neutron cameras and scintillator-based\
  \ detectors, often combined with tomographic inversion. In ITER-class burning plasmas,\
  \ core values of $P_{\\rm DT}$ are expected to reach $10^5$\u2013$10^6$ W m$^{-3}$.\
  \ See `deuterium_tritium_neutron_emissivity` for the neutron source profile and\
  \ `deuterium_deuterium_fusion_power_density` for the D\u2013D counterpart."
