- name: voltage_of_spectrometer_channel
  kind: scalar
  status: active
  description: Electrical output signal from a spectrometer channel before offset
    correction or conversion to calibrated radiometric quantities.
  documentation: 'The channel voltage is the electrical potential difference delivered
    by a spectrometer detector channel relative to its electronics reference. It represents
    the raw detector and front-end response associated with that channel, not calibrated
    radiance, irradiance, photon flux, or optical power.


    $$

    V_{\mathrm{ch}} = \Phi_{\mathrm{sig}} - \Phi_{\mathrm{ref}}

    $$


    where $V_{\mathrm{ch}}$ is the channel voltage in V, and $\Phi_{\mathrm{sig}}$
    and $\Phi_{\mathrm{ref}}$ are the electrical potentials of the signal and reference
    terminals, respectively. The polarity follows this reference definition; positive
    voltage means that the signal-terminal potential exceeds the reference-terminal
    potential. Offset or dark-signal subtraction and radiometric calibration are excluded.
    The quantity provides the common physical context for [measured voltage of a spectrometer
    channel](name:measured_voltage_of_spectrometer_channel) and is distinct from the
    calibrated [calibration factor of a spectrometer](name:calibration_factor_of_spectrometer).'
  unit: V
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:calibration_factor_of_spectrometer
- name: width_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Width of a diagnostic aperture is the full clear-opening span of a
    rectangular diagnostic aperture measured along X1, the first local tangential
    axis, in the right-handed local aperture frame (X1, X2, X3). X2 is the second
    local tangential axis and X3 is normal to the aperture plane.
  documentation: 'Width of a diagnostic aperture is the full clear-opening span of
    a rectangular diagnostic aperture measured along $X_1$, the first local tangential
    axis of the right-handed local aperture frame $(X_1, X_2, X_3)$. The axes $X_1$
    and $X_2$ span the aperture plane, with $X_2$ the second local tangential axis,
    and $X_3$ is normal to that plane.


    For a rectangular clear opening, the width is the coordinate extent of the transmitting
    interval along $X_1$:


    $$

    w = x_{1,\max} - x_{1,\min}

    $$


    where $w$ is the aperture width, and $x_{1,\max}$ and $x_{1,\min}$ are the maximum
    and minimum transmitting-boundary coordinates along $X_1$, measured in meters.


    The width is a clear-opening dimension: opaque supports, masks, bevels, housing
    material, and other non-transmitting parts of the aperture plane are excluded.
    It is the rectangular first-local-tangential size of a diagnostic aperture, distinct
    from [diameter of diagnostic aperture](name:diameter_of_diagnostic_aperture) for
    a circular opening and from [width of aperture](name:width_of_aperture) for the
    corresponding non-diagnostic aperture concept.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:diameter_of_diagnostic_aperture
  - name:width_of_aperture
