- name: vacuum_magnetic_vector_potential
  kind: vector
  status: draft
  description: Gage-dependent vector potential whose curl yields the vacuum magnetic
    field produced by externally driven coil currents, with components resolved in
    the right-handed cylindrical (R, phi, Z) frame.
  documentation: "The vacuum magnetic vector potential $\\mathbf{A}_\\text{vac}$ is\
    \ the gage-dependent vector field generated solely by external coil currents in\
    \ the absence of plasma current or eddy-current contributions. In the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame \u2014 where $R$ is the major radius, $\\\
    phi$ the toroidal angle increasing counter-clockwise when viewed from above, and\
    \ $Z$ the vertical coordinate \u2014 the vector is characterized by its cylindrical\
    \ projections; the [radial component](name:radial_vacuum_magnetic_vector_potential)\
    \ and [vertical component](name:vertical_vacuum_magnetic_vector_potential) together\
    \ capture the poloidal-plane content of the coil-driven field.\n\nThe defining\
    \ relation connecting $\\mathbf{A}_\\text{vac}$ to the vacuum magnetic field $\\\
    mathbf{B}_\\text{vac}$ is:\n\n$$\n\\mathbf{B}_\\text{vac} = \\nabla \\times \\\
    mathbf{A}_\\text{vac}\n$$\n\nwhere $\\mathbf{B}_\\text{vac}$ is in T. Because\
    \ the curl determines $\\mathbf{A}_\\text{vac}$ only up to a gradient, a gage\
    \ condition \u2014 for example the Coulomb gage $\\nabla \\cdot \\mathbf{A}_\\\
    text{vac} = 0$ \u2014 must be imposed to make the field unique. The vacuum potential\
    \ enters single-particle canonical dynamics through $\\mathbf{p} = m\\mathbf{v}\
    \ + q\\mathbf{A}_\\text{vac}$, where $m$ is particle mass, $\\mathbf{v}$ velocity,\
    \ and $q$ charge, and thereby appears in gyrokinetic Hamiltonians and inductance\
    \ integrals.\n\nThe vacuum contribution is computed analytically via Biot-Savart\
    \ integration over discrete coil filaments or numerically through magnetostatic\
    \ finite-element solvers, and represents the external-source term in the total\
    \ [magnetic_vector_potential](name:magnetic_vector_potential) before plasma-current\
    \ contributions are added in full magnetohydrodynamic equilibrium formulations."
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_vacuum_magnetic_vector_potential
  - name:vertical_vacuum_magnetic_vector_potential
  - name:magnetic_vector_potential
  arguments:
  - name: magnetic_vector_potential
    operator: vacuum
    operator_kind: qualifier
- name: radial_vacuum_magnetic_vector_potential
  kind: scalar
  status: draft
  description: Radial (R) component of the vacuum magnetic vector potential produced
    by toroidal-field coil currents, evaluated in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: 'The radial component $A_R$ of the vacuum magnetic vector potential
    is the projection of $\mathbf{A}_\mathrm{vac}$ onto the major-radius direction
    $\hat{R}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It represents
    the $R$-directed contribution of the vector field generated exclusively by toroidal-field
    coil conductor currents in the absence of any plasma contribution, forming part
    of the complete [vacuum magnetic vector potential](name:vacuum_magnetic_vector_potential)
    vector $(A_R, A_\phi, A_Z)$.


    The vacuum magnetic field is related to the vector potential by $\mathbf{B}_\mathrm{vac}
    = \nabla \times \mathbf{A}_\mathrm{vac}$, so the poloidal field components follow
    from the cylindrical curl of $(A_R, A_\phi, A_Z)$. Because only $\nabla \times
    \mathbf{A}_\mathrm{vac}$ is gage-invariant, $A_R$ individually depends on the
    chosen gage; the Coulomb gage $\nabla \cdot \mathbf{A} = 0$ is standard for static
    TF coil computations.


    This component is calculated numerically via Biot-Savart integration over the
    TF coil conductor geometry and current distribution, and is used in equilibrium
    reconstruction and MHD stability analysis on both structured and unstructured
    spatial grids. The complementary vertical component is provided by [vertical_vacuum_magnetic_vector_potential](name:vertical_vacuum_magnetic_vector_potential),
    while the analogous quantity incorporating full plasma and coil contributions
    is [radial_magnetic_vector_potential](name:radial_magnetic_vector_potential).


    Sign convention: Positive when $A_R$ points in the direction of increasing major
    radius $R$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:vacuum_magnetic_vector_potential
  - name:vertical_vacuum_magnetic_vector_potential
  - name:radial_magnetic_vector_potential
  arguments:
  - name: vacuum_magnetic_vector_potential
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:tf/field_map/a_field_r/values
    dd_path: tf/field_map/a_field_r/values
    status: composed
- name: vertical_vacuum_magnetic_vector_potential
  kind: scalar
  status: draft
  description: Vertical Z component of the vacuum magnetic vector potential produced
    by toroidal-field coil currents, evaluated in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: 'The vertical vacuum magnetic vector potential is the $Z$ component
    $A_Z$ of the magnetic vector potential $\mathbf{A}_{\mathrm{vac}}$ produced by
    toroidal-field coil currents with plasma-current and material-response currents
    excluded. It is evaluated along $\hat{Z}$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The associated vacuum magnetic field satisfies $\mathbf{B}_{\mathrm{vac}}
    = \nabla \times \mathbf{A}_{\mathrm{vac}}$.


    In the Coulomb gage with reference $\mathbf{A}_{\mathrm{vac}} \to 0$ far from
    localized coils, the Biot-Savart definition of the component is:


    $$

    A_Z(R, \phi, Z) = \hat{Z}\cdot\frac{\mu_0}{4\pi}\int_{\Omega_{\mathrm{TF}}}\frac{\mathbf{J}_{\mathrm{TF}}(\mathbf{r}'')}{|\mathbf{r}-\mathbf{r}''|}\,d^3r''

    $$


    where $\mathbf{r}$ is the field point with cylindrical coordinates $(R, \phi,
    Z)$ in meters, $\mathbf{r}''$ is a source point in meters, $\Omega_{\mathrm{TF}}$
    is the toroidal-field-coil conductor volume, $\mathbf{J}_{\mathrm{TF}}$ is the
    coil current density in A m$^{-2}$, $d^3r''$ is the source volume element in m$^3$,
    $\mu_0$ is the vacuum permeability in N A$^{-2}$, and $A_Z$ is in T m.


    It is normally computed from coil geometry and currents using Biot-Savart quadrature
    or a magnetostatic vector-potential solver. Together with the radial and toroidal
    components of $\mathbf{A}_{\mathrm{vac}}$, it determines associated vacuum-field
    components through the cylindrical curl, including [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field)
    and non-axisymmetric field components such as [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field).


    Typical magnitudes in the plasma region are about $10^{-3}$-$10$ T m for medium
    to large tokamaks, with larger local values possible near high-current coil conductors.
    The value depends on coil current, conductor geometry, distance from the coils,
    and the specified gage reference.


    Sign convention: Positive when the gage-fixed vacuum magnetic vector potential
    has a component in the $+Z$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_vacuum_magnetic_vector_potential
  arguments:
  - name: vacuum_magnetic_vector_potential
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:tf/field_map/a_field_z/values
    dd_path: tf/field_map/a_field_z/values
    status: composed
