        = 3
      parent_path: spectrometer_x_ray_crystal/channel/crystal
      parent: Characteristics of the crystal used
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Full width of the X-ray crystal spectrometer crystal in the X1
        direction, applicable only for rectangular crystal geometry (geometry_type
