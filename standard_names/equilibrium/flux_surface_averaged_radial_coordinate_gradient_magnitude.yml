name: flux_surface_averaged_radial_coordinate_gradient_magnitude
status: draft
cocos_transformation_type: one_like
description: Flux-surface average of the magnitude of the toroidal-flux radial coordinate
  gradient, $\langle |\nabla \rho_{\mathrm{tor}}| \rangle$.
documentation: The dimensionless metric coefficient $gm7 = \langle |\nabla \rho_{\mathrm{tor}}|
  \rangle$ is the flux-surface average of the absolute value of the gradient of the
  normalized toroidal-flux coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi/\Phi_{\mathrm{edge}}}$,
  where $\Phi$ is the enclosed toroidal flux and $\Phi_{\mathrm{edge}}$ its edge value.
  Unlike the squared variant $\langle |\nabla \rho_{\mathrm{tor}}|^2 \rangle$, this
  first-moment average enters convective transport terms and certain neoclassical
  expressions that weight the gradient linearly. Values are of order unity for standard
  tokamak shapes; strong elongation or triangularity causes departures on outboard
  versus inboard midplane. Computed as a post-processing step in equilibrium solvers
  such as CHEASE, HELENA, or LIUQE by numerically integrating over the poloidal contour
  of each flux surface. See also `flux_surface_averaged_square_of_radial_coordinate_gradient`
  for the second moment and `flux_surface_averaged_inverse_major_radius` for the $\langle
  1/R \rangle$ metric.
