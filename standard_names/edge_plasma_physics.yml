- name: poloidal_total_current_density
  kind: scalar
  status: active
  description: "Poloidal total current density is the component of the aggregated\
    \ current-density vector resolved along the poloidal unit vector tangent to increasing\
    \ \u03B8 at fixed \u03C1 and \u03C6 in flux coordinates (\u03C1, \u03B8, \u03C6\
