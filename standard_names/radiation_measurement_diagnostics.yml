        Used together with x1 to compute the detector geometric etendue and sight-line
        integrals.
      kind: llm
- name: second_local_tangential_coordinate_of_optical_element
  kind: scalar
  status: active
  description: Second local tangential coordinate of an optical element is the signed
    coordinate of a point on the optical-element surface along the second in-plane
    tangential axis, measured from the aperture vertex. It belongs to the element-local
    frame formed by the first local tangential, second local tangential, and plasma-facing
    surface-normal axes.
  documentation: 'Second local tangential coordinate of an optical element is the
    signed coordinate of a point on the optical-element surface along the second in-plane
    tangential axis, measured from the aperture vertex. It is one of the two surface-tangent
    coordinates of the optical-element local triad and is distinct from the [first
    local tangential coordinate of the optical element](name:first_local_tangential_coordinate_of_optical_element).


    The coordinate is the projection of the surface-point displacement from the aperture
    vertex onto the second local tangential unit vector:


    $$

    \eta_2 = (\mathbf{r} - \mathbf{r}_\mathrm{v}) \cdot \hat{\mathbf{e}}_2

    $$


    where $\eta_2$ is the second local tangential coordinate of the optical element,
    $\mathbf{r}$ is the position vector of the surface point, $\mathbf{r}_\mathrm{v}$
    is the position vector of the aperture vertex, and $\hat{\mathbf{e}}_2$ is the
    second local tangential unit vector.


    The object-local triad $(\hat{\mathbf{e}}_1, \hat{\mathbf{e}}_2, \hat{\mathbf{e}}_3)$
    is right-handed. For a steered optical element, $\hat{\mathbf{e}}_3$ is the plasma-facing
    surface-normal unit vector, $\hat{\mathbf{e}}_1$ is the first local tangential
    unit vector oriented with positive projection along increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ increases counterclockwise when viewed from $+\hat{Z}$, and $Z$
    is vertical height; the second local tangential unit vector is $\hat{\mathbf{e}}_2
    = \hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$. This coordinate is not a coordinate
    along $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame unless the optical-element
    orientation makes the second local tangential axis coincide with that direction.


    Sign convention: Positive when the displacement from the optical-element aperture
    vertex has a positive projection in the $\hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$
    direction.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_optical_element
  - name:vertical_coordinate_of_optical_element
