- name: safety_factor_at_plasma_boundary
  kind: scalar
  status: active
  description: Safety factor at the plasma boundary is the field-line winding number
    on the boundary flux surface, giving toroidal turns during one complete poloidal
    turn.
  documentation: 'The safety factor at the plasma boundary is the value of the [safety
    factor](name:safety_factor) on the outermost closed magnetic flux surface, identified
    with the plasma boundary. It characterizes magnetic-field-line winding by the
    number of toroidal turns per complete poloidal turn.


    The boundary value is defined from neighboring nested flux surfaces by


    $$

    q_{\mathrm{b}} = \left.\frac{d\Phi_{\mathrm{tor}}}{d\left(\Phi_{\mathrm{pol}}/2\pi\right)}\right|_{\mathrm{plasma\
    boundary}}

    $$


    where $q_{\mathrm{b}}$ is the boundary safety factor, $\Phi_{\mathrm{tor}}$ is
    the toroidal magnetic flux enclosed by a flux surface, $\Phi_{\mathrm{pol}}$ is
    the poloidal magnetic flux linked by that surface, and the derivative is taken
    across the nested-flux-surface label.


    This is a flux-surface boundary value, not a local magnetic pitch angle or field-direction
    component. Unlike the [safety factor at the magnetic axis](name:safety_factor_at_magnetic_axis),
    it is evaluated at the outermost closed surface; it is the reciprocal of rotational
    transform on the same surface.


    Sign convention: Positive when the toroidal magnetic-field direction and the toroidal
    plasma-current direction are parallel in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:safety_factor_at_magnetic_axis
  arguments:
  - name: safety_factor
    operator: plasma_boundary
    operator_kind: locus
