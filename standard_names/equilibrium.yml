        flux
      data_type: FLT_1D
      unit: m
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Flux surface averaged major radius (gm8 = \u3008R\u3009), a geometric\
        \ metric coefficient used in flux-surface-averaged transport equations. Represents\
        \ the mean major radius over a flux surface."
      kind: llm
- name: maximum_magnetic_field
  kind: scalar
  status: active
  description: The maximum magnetic field is the scalar upper extremum of total magnetic-field
    strength over a specified magnetic locus, with qualifiers selecting the locus
    or concrete realization. It is not a signed vector component and is paired with
    the minimum magnetic field in mirror-ratio concepts.
  documentation: 'The maximum magnetic field $B_{\max}$ is the largest value of the
    total [magnetic induction](name:magnetic_field) strength selected by the quantity''s
    qualifying context. It is a scalar upper extremum of $|\mathbf{B}|$, not a magnetic-field
    vector and not a signed component.


    For a specified evaluation set $S$, the abstract extremum is


    $$

    B_{\max}(S) = \sup_{\mathbf{x}\in S} |\mathbf{B}(\mathbf{x})|

    $$


    where $S$ is the selected magnetic locus, $\mathbf{x}$ is position on that locus,
    and $\mathbf{B}$ is the total magnetic induction vector.


    A concrete child such as the [maximum magnetic-field magnitude](name:maximum_magnetic_field_magnitude)
    fixes the selected locus to a nested toroidal magnetic flux surface and realizes
    the value as a surface extremum. The paired [minimum magnetic field](name:minimum_magnetic_field)
    is the corresponding lower extremum; mirror-ratio quantities derived from the
    two are not part of this definition.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:minimum_magnetic_field
  - name:maximum_magnetic_field_magnitude
  arguments:
  - name: magnetic_field
    operator: maximum
    operator_kind: qualifier
- name: maximum_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Maximum magnetic-field magnitude is the largest total magnetic-field
    magnitude attained on one nested toroidal magnetic flux surface. It is a surface
    extremum of field strength, not a maximum of any signed magnetic-field component.
  documentation: 'Maximum magnetic-field magnitude is the largest total magnetic-field
    magnitude attained on one nested toroidal magnetic flux surface. It is a scalar
    surface extremum of the norm of the magnetic-field vector.


    For a surface $S(\lambda)$ labeled by scalar flux-surface label $\lambda$, the
    quantity is defined by the surface maximum:


    $$

    B_{\max}(\lambda) = \max_{\mathbf{x} \in S(\lambda)} \lVert \mathbf{B}(\mathbf{x})
    \rVert

    $$


    where $\lambda$ is any scalar label constant on each nested toroidal magnetic
    flux surface, $S(\lambda)$ is the surface with that label, $\mathbf{x}$ is position
    restricted to that surface, $\mathbf{B}(\mathbf{x})$ is the magnetic-field vector
    at that position, and $\lVert \mathbf{B}(\mathbf{x}) \rVert$ is magnetic-field
    magnitude.


    This quantity is the explicit-magnitude spelling of [maximum_magnetic_field](name:maximum_magnetic_field),
    which denotes the same surface maximum of $\lVert \mathbf{B} \rVert$. Together
    with [minimum_magnetic_field_magnitude](name:minimum_magnetic_field_magnitude),
    it defines the field-strength interval on the same flux surface; in magnetic-mirror
    dynamics, for particle kinetic energy $E$ and magnetic moment $\mu$, the condition
    $E = \mu B_{\max}$ marks the boundary between orbits that can reach the highest-field
    point and those reflected before it. It must not be interpreted as the maximum
    of any signed component of the magnetic-field vector.'
  unit: T
