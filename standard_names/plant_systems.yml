    count. Each neutral krypton atom contributes 36 equivalent electrons.


    The equivalent-electron count is obtained by accumulating the injected krypton
    atoms over the prefill interval and weighting them by the krypton atomic number:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{Kr,prefill}} = Z_{\mathrm{Kr}} N_{\mathrm{Kr,prefill}}
    = Z_{\mathrm{Kr}} \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{Kr}}(t)\,dt = 36
    \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{Kr}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{Kr,prefill}}$ is the dimensionless equivalent-electron
    count, $N_{\mathrm{Kr,prefill}}$ is the dimensionless accumulated neutral-krypton
    atom count, $Z_{\mathrm{Kr}}=36$ is the dimensionless atomic number of krypton,
    $\dot{N}_{\mathrm{Kr}}$ is the neutral-krypton atom injection rate, $t_0$ is the
    start of prefill, and $t_\mathrm{bd}$ is the plasma-breakdown time.


    This quantity includes only krypton introduced before breakdown and excludes later
    fueling, other gas species, and the retained or ionized inventory. It uses the
    common equivalent-electron bookkeeping of [prefill_count](name:prefill_count),
