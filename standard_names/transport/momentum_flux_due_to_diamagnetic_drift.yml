name: momentum_flux_due_to_diamagnetic_drift
status: draft
description: Momentum flux density component arising from the diamagnetic drift, driven
  by perpendicular pressure gradients in a magnetized plasma.
documentation: "The diamagnetic contribution to the momentum flux tensor originates\
  \ from the fluid drift $\\mathbf{v}_{\\rm dia} = (\\mathbf{B} \\times \\nabla p)\
  \ / (q n B^2)$, where $\\mathbf{B}$ is the magnetic field (T), $\\nabla p$ the pressure\
  \ gradient (Pa/m), $q$ the species charge (C), and $n$ the number density (m$^{-3}$).\
  \ This term enters the momentum transport equation as $\\Pi_{\\rm dia} = n m \\\
  langle v_{\\rm dia} v \\rangle$ (kg m$^{-1}$ s$^{-2}$) and is essential for capturing\
  \ intrinsic rotation and momentum redistribution in the absence of external torque.\
  \ In edge and scrape-off-layer transport models the diamagnetic momentum flux is\
  \ evaluated element-wise on a generalized grid descriptor (GGD). Typical magnitudes\
  \ in H-mode pedestals can reach $10^{-2}$\u2013$10^{0}$ Pa depending on the pressure\
  \ gradient scale length. See also `ion_momentum_flux_due_to_diamagnetic_drift` for\
  \ the ion-specific counterpart and `ion_momentum_diffusivity_due_to_diamagnetic_drift`\
  \ for the associated diffusion coefficient."
