name: line_averaged_carbon_number_density
status: draft
cocos_transformation_type: one_like
description: Carbon number density averaged along a diagnostic line of sight, integrating
  over all charge states.
documentation: The line-averaged carbon number density $\langle n_{\mathrm{C}} \rangle_\ell
  = L^{-1} \int n_{\mathrm{C}}(l)\,dl$ represents the path-integrated carbon content
  divided by the chord length $L$ (in m). This scalar is commonly derived from visible
  or VUV spectroscopy along a single line of sight, where carbon emission line intensities
  are inverted to yield a density. Typical values in graphite-walled tokamaks range
  from $10^{16}$ to $10^{18}\;\mathrm{m^{-3}}$, scaling with the carbon source rate
  and edge temperature. As a line-integrated measurement, it provides a volume-weighted
  average that may differ substantially from local values at the magnetic axis or
  pedestal. See also `carbon_number_density_at_magnetic_axis` for the local on-axis
  value and `argon_ion_number_density` for analogous impurity density data.
