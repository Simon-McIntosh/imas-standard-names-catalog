- name: toroidal_flux_radius_at_plasma_boundary
  kind: scalar
  status: active
  description: Non-negative radius-like coordinate assigned to the plasma boundary
    from its enclosed toroidal magnetic flux and a reference toroidal field.
  documentation: 'Toroidal flux radius at the plasma boundary is the non-negative,
    radius-like label of the outermost closed magnetic flux surface. It is the boundary
    value of the [toroidal flux radius](name:toroidal_flux_radius) coordinate and
    provides an effective minor-radius scale rather than a cylindrical major-radius
    coordinate.


    The boundary coordinate is defined by


    $$

    \rho_{\mathrm{tor},b} = \sqrt{\frac{\Phi_{\mathrm{tor},b}}{\pi B_0}}

