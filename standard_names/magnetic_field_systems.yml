      kind: llm
- name: thickness_of_iron_core_segment
  kind: scalar
  status: active
  description: "Full non-negative toroidal extent of a rectangular iron-core segment\
    \ between its pair of opposite faces, measured along the toroidal direction \u03C6\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame. It is perpendicular to\
    \ the segment's radial width along R and vertical height along Z."
  documentation: 'Full non-negative toroidal extent of a rectangular iron-core segment
    between its pair of opposite faces, measured along the toroidal direction $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    from the machine symmetry axis, $\phi$ increases counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is the vertical height.


    The thickness is the face-to-face separation of paired points on the two opposite
    toroidal-facing faces along the local toroidal unit vector:


    $$

    t = \left| (\mathbf{x}_+ - \mathbf{x}_-) \cdot \hat{\boldsymbol{\phi}} \right|

    $$


    where $t$ is the segment thickness in m, $\mathbf{x}_-$ and $\mathbf{x}_+$ are
    position vectors in m of paired points on the two opposite faces lying on the
    same line parallel to $\hat{\boldsymbol{\phi}}$, and $\hat{\boldsymbol{\phi}}$
    is the local toroidal unit vector of the right-handed cylindrical $(R, \phi, Z)$
    frame.


    Together with the [width of the iron-core segment](name:width_of_iron_core_segment),
    the radial extent along $R$, and the [height of the iron-core segment](name:height_of_iron_core_segment),
    the vertical extent along $Z$, the thickness completes the mutually orthogonal
    triplet of extents describing the segment as a rectangular block whose cross section
    lies in the poloidal $(R, Z)$ plane and is extruded along $\phi$. It excludes
    any diagonal, chordwise, or arc-length measure across the segment.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_iron_core_segment
  - name:width_of_iron_core_segment
  sources:
  - dd_path: iron_core/segment/geometry/thick_line/thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/iron_core.html#iron_core-segment-geometry-thick_line-thickness
    dd_documentation:
      leaf: Thickness
      parent_path: iron_core/segment/geometry/thick_line
      parent: The element is approximated by a rectangle defined by a central segment
        and a thickness in the direction perpendicular to the segment
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Thickness of the thick-line rectangular element representing an
        iron core segment geometry, measured perpendicular to the segment centerline.
        Defines the cross-sectional extent of the segment in the magnetic circuit
        model.
      kind: llm
- name: thickness_of_passive_loop
  kind: scalar
  status: active
  description: Non-negative thickness of a passive conducting loop element measured
    between parallel bounding sides in its poloidal cross-section.
  documentation: 'This quantity is the shortest distance between the two parallel
    bounding sides of a passive conducting loop element''s cross-section in the poloidal
    plane of the right-handed cylindrical $(R, \phi, Z)$ frame. It defines the loop''s
    transverse geometric thickness.


    The thickness $w$ is defined by


    $$

    w = \left|\left(\mathbf{r}_2-\mathbf{r}_1\right)\cdot\hat{\mathbf{n}}\right|

    $$


    where $\mathbf{r}_1$ and $\mathbf{r}_2$ are position vectors of points on the
    two opposing sides, and $\hat{\mathbf{n}}$ is a unit vector normal to those sides
    within the poloidal plane. The absolute value makes the thickness non-negative.


    This linear dimension is distinct from the conducting cross-sectional [area of
    the passive loop](name:area_of_passive_loop) and from the inner and outer radii
    that describe an annular cross-section.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_passive_loop
  sources:
