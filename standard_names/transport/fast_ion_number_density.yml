name: fast_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of the suprathermal (non-Maxwellian) ion population, summed
  over charge states for a given ion species.
documentation: "The fast ion number density $n_{i,\\mathrm{fast}}$ ($\\mathrm{m^{-3}}$)\
  \ counts ions whose kinetic energies significantly exceed the local thermal energy,\
  \ typically produced by neutral beam injection (NBI), ion cyclotron resonance heating\
  \ (ICRH), or fusion reactions (e.g., 3.5 MeV alpha particles). It is defined as\
  \ the velocity-space integral of the fast-ion distribution function above a demarcation\
  \ energy, often chosen at $E \\gtrsim 1.5\\,T_i$, where $T_i$ is the local thermal\
  \ ion temperature (eV). The total ion density satisfies $n_i = n_{i,\\mathrm{thermal}}\
  \ + n_{i,\\mathrm{fast}}$. In NBI-heated H-mode tokamak plasmas, typical core values\
  \ are $10^{17}$\u2013$10^{19}\\;\\mathrm{m^{-3}}$, representing 1\u201310% of the\
  \ total ion density; in burning-plasma scenarios the fusion-born alpha fraction\
  \ can reach several percent. Diagnostics include fast-ion D-alpha (FIDA) spectroscopy,\
  \ neutral particle analyzers (NPA), and neutron emission spectrometry. The fast-ion\
  \ population drives Alfv\xE9nic instabilities when $\\beta_{\\mathrm{fast}} / \\\
  beta_{\\mathrm{total}}$ becomes significant. See `thermal_ion_number_density` for\
  \ the Maxwellian complement and `ion_number_density` for the total."
