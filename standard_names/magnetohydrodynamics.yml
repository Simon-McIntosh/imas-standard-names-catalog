        \ to the pre-disruptive value."
      kind: llm
- name: rotation_frequency_of_neoclassical_tearing_mode
  kind: scalar
  status: active
  description: Angular rate at which a neoclassical tearing-mode magnetic island advances
    or regresses in helical phase on its resonant flux surface.
  documentation: 'The angular rotation frequency of a neoclassical tearing-mode magnetic
    island describes the instantaneous evolution of its helical phase. The phase identifies
    the island''s orientation on the resonant flux surface, while its first derivative
    gives the rotation rate.


    $$

    \omega_{\mathrm{NTM}}(t) = \frac{d\phi_{\mathrm{NTM}}(t)}{dt}

    $$


    where $\omega_{\mathrm{NTM}}$ is the angular rotation frequency, $\phi_{\mathrm{NTM}}$
    is the island''s helical phase, and $t$ is time. The phase may advance or regress,
    so the frequency can have either sign. Its time derivative is the angular acceleration
    represented by [tendency of rotation frequency of a neoclassical tearing mode](name:tendency_of_rotation_frequency_of_neoclassical_tearing_mode).
    The phase itself is defined by [neoclassical tearing mode phase](name:neoclassical_tearing_mode_phase).'
  unit: rad.s^-1
  physics_domain: magnetohydrodynamics
