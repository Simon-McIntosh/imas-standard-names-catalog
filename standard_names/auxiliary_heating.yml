- name: z_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Vertical component of the third local unit vector that completes the
    right-handed orthonormal orientation frame of an electron cyclotron (EC) launcher
    mirror, projected onto the $\hat{z}$ axis of the Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.
  documentation: 'The EC launcher mirror orientation is fully specified by three mutually
    orthogonal unit vectors. This quantity gives the $\hat{z}$ projection of the third
    vector, $\hat{e}_3$, of that triad: $z_3 = \hat{e}_3 \cdot \hat{z}$, where $\hat{z}$
    is the vertical axis of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame. Because $\hat{e}_3$ is a unit vector, this component is bounded in $[-1,
    1]$, and together with [x_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror](name:x_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [y_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror](name:y_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror)
    it satisfies $x_3^2 + y_3^2 + z_3^2 = 1$. The third unit vector completes the
    triad formed with [first_unit_vector_of_electron_cyclotron_launcher_mirror](name:first_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [second_unit_vector_of_electron_cyclotron_launcher_mirror](name:second_unit_vector_of_electron_cyclotron_launcher_mirror),
    fully encoding the mirror pointing geometry needed for beam-steering calculations;
    see the parent vector [third_unit_vector_of_electron_cyclotron_launcher_mirror](name:third_unit_vector_of_electron_cyclotron_launcher_mirror)
    for the full vector definition. The $z$-component is particularly sensitive to
    the mirror tilt relative to the horizontal plane and is zero when $\hat{e}_3$
    lies entirely in the $xy$-plane. Values are derived from the mirror mechanical
    geometry or from in-situ survey measurements of the launcher orientation.


    Sign convention: Positive when the third unit vector has a component in the $+\hat{z}$
    (upward vertical) direction.'
  unit: '1'
  physics_domain: auxiliary_heating
