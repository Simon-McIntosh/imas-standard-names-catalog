- name: toroidal_co_passing_fast_current_density
  kind: scalar
  status: draft
  description: Toroidal current density from co-passing fast (non-thermal) particles,
    excluding back-current contributions from thermal electrons and ions.
  documentation: "The toroidal co-passing fast current density $J_{\\phi,\\text{fast,co-pass}}$\
    \ quantifies the toroidal component of current density carried exclusively by\
    \ fast (suprathermal) particles occupying co-passing orbits \u2014 trajectories\
    \ that circulate around the torus without being magnetically trapped, in the direction\
    \ aligned with the magnetic field.\n\nThe quantity is obtained by integrating\
    \ the product of the toroidal velocity $v_\\phi$ and the fast-particle distribution\
    \ function $f_\\text{fast}$ over the co-passing region $\\Omega_\\text{co-pass}$\
    \ of velocity space:\n\n$$\nJ_{\\phi,\\text{fast,co-pass}} = q_s \\int_{\\Omega_\\\
    text{co-pass}} v_\\phi \\, f_\\text{fast}(\\mathbf{r}, \\mathbf{v}) \\, d^3v\n\
    $$\n\nwhere $q_s$ is the particle charge. Back-currents induced in the thermal\
    \ electron and ion populations by Coulomb drag on the fast particles are explicitly\
    \ excluded, distinguishing this quantity from [toroidal_co_passing_current_density](name:toroidal_co_passing_current_density),\
    \ which retains the thermal back-current.\n\nThe quantity is computed from fast-particle\
    \ distribution functions generated by Fokker-Planck solvers or Monte Carlo codes\
    \ tracking the suprathermal population separately from the bulk plasma. In neutral\
    \ beam injection scenarios, co-passing fast ions typically dominate the net fast-particle\
    \ current drive because co-passing orbits carry a net toroidal drift preferentially\
    \ aligned with the injection geometry. The complementary counter-passing contribution\
    \ is given by [toroidal_counter_passing_fast_current_density](name:toroidal_counter_passing_fast_current_density),\
    \ the trapped-particle contribution by [toroidal_trapped_fast_current_density](name:toroidal_trapped_fast_current_density),\
    \ and the orbit-class sum by [toroidal_fast_current_density](name:toroidal_fast_current_density).\n\
    \nSign convention: Positive when the fast-particle current flows in the direction\
    \ of increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/current_fast_phi
    dd_path: distributions/distribution/profiles_1d/co_passing/current_fast_phi
    status: composed
  - id: dd:distributions/distribution/profiles_1d/co_passing/current_fast_tor
    dd_path: distributions/distribution/profiles_1d/co_passing/current_fast_tor
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/current_fast_phi
    dd_path: distributions/distribution/profiles_2d/co_passing/current_fast_phi
    status: attached
