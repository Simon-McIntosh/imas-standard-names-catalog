- name: vertical_coordinate_of_coil_conductor_element_centre
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of the geometric center of a coil conductor
    element in the machine cylindrical frame.
  documentation: The vertical coordinate $Z$ (in meters) of the conductor element
    center locates the centroid of each discrete segment composing a TF or non-axisymmetric
    coil winding in the $(R, \phi, Z)$ coordinate system. It is used for force, inductance,
    and field-map calculations that approximate conductor paths as sequences of current-carrying
    filaments centered at these points. Together with the major-radius coordinate
    and toroidal angle of the center, it fully specifies the element's spatial position.
    Values span the full vertical extent of the coil geometry. See [vertical_coordinate_of_coil_conductor_element_start_point](name:vertical_coordinate_of_coil_conductor_element_start_point)
    for the start point and [vertical_coordinate_of_endpoint](name:vertical_coordinate_of_endpoint)
    for the end point of each element.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_endpoint
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of a geometric endpoint in the cylindrical
    $(R, \phi, Z)$ machine coordinate system.
  documentation: The vertical coordinate $Z$ specifies the height of an endpoint used
    to define conductor element geometry (TF/PF coils, non-axisymmetric coils), diagnostic
    lines of sight, or halo-current area boundaries. It is measured in meters relative
    to the machine midplane ($Z = 0$). Together with the major-radius coordinate $R$
    and the toroidal angle $\phi$, it fully locates the point in the tokamak cylindrical
    frame. Values span the full vertical extent of the device, from approximately
    $-6$ m to $+6$ m for large tokamaks such as ITER. See [vertical_coordinate_of_coil_conductor_element_start_point](name:vertical_coordinate_of_coil_conductor_element_start_point)
    for the start-point counterpart and [toroidal_angle_of_coil_conductor_element_end_point](name:toroidal_angle_of_coil_conductor_element_end_point)
    for the toroidal coordinate of end points.
  unit: m
