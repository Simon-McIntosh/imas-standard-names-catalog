- name: z_component_of_second_unit_vector
  kind: scalar
  status: draft
  description: Vertical (Z-axis) Cartesian component of the second local unit vector
    defining the orientation of a diagnostic aperture, optical element, or antenna
    in the machine right-handed Cartesian frame.
  documentation: 'The quantity $\hat{x}_{2,z}$ is the projection of the second unit
    vector $\hat{x}_2$ onto the vertical $\hat{z}$ axis of the machine right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, where $\hat{z}$ is the vertical
    direction coinciding with the tokamak symmetry axis direction. Together with [z_component_of_first_unit_vector](name:z_component_of_first_unit_vector)
    and [z_component_of_third_unit_vector](name:z_component_of_third_unit_vector),
    this component completes the third row of the $3\times3$ rotation matrix mapping
    the local diagnostic frame to the machine frame. The full triad $\{\hat{x}_1,
    \hat{x}_2, \hat{x}_3\}$ forms a right-handed orthonormal basis for the local orientation
    of elements such as bolometer apertures, reflectometer antennas, polarimeters,
    and X-ray crystal spectrometer channels; the $z$-components of all three vectors
    specify how each local axis projects onto the vertical machine direction. As a
    component of a unit vector, $\hat{x}_{2,z}$ is dimensionless and satisfies $|\hat{x}_{2,z}|
    \leq 1$, with the full normalization constraint $\hat{x}_{2,x}^2 + \hat{x}_{2,y}^2
    + \hat{x}_{2,z}^2 = 1$. These values are determined by the physical installation
    geometry and are obtained from engineering surveys or CAD models of the diagnostic.
    The parent vector is described in [second_unit_vector](name:second_unit_vector).


    Sign convention: Positive when $\hat{x}_{2,z}$ points in the direction of increasing
    $Z$ (upward along the machine symmetry axis).'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
