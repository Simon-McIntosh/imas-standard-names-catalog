- name: volume_averaged_runaway_electron_source_rate
  kind: scalar
  status: active
  description: Volume-averaged production rate of runaway-electron number density
    over the confined plasma, including all active generation mechanisms and excluding
    runaway-electron losses.
  documentation: 'This quantity is the confined-plasma volume average of the local
    runaway-electron number-density production rate. It represents a production contribution
    to the runaway-electron balance, not a loss rate.


    The volume average is defined by


    $$

    \langle S_{\rm RE} \rangle_V = \frac{1}{V_c} \int_{V_c} S_{\rm RE}(\mathbf{x})\,dV

    $$


    where $S_{\rm RE}(\mathbf{x})$ is the local volumetric source rate, $V_c$ is the
    confined-plasma volume, $\mathbf{x}$ is position, and $dV$ is the volume element.
    The integrand is the total [runaway electron source rate](name:runaway_electron_source_rate),
    including all active generation mechanisms. Sink and loss terms are excluded.
    This quantity is distinct from the volume-averaged runaway-electron density, which
    describes the population rather than its production rate.'
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate
  arguments:
  - name: runaway_electron_source_rate
    operator: volume_averaged
    operator_kind: qualifier
  sources:
