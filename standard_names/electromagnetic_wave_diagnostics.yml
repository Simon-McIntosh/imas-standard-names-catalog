        plasma frequency at the reflection layer and is directly related to the local
        electron density (ne).
      kind: llm
- name: poloidal_perturbed_suprathermal_electron_angle_at_measurement_position
  kind: scalar
  status: active
  description: Poloidal angular offset estimate of the electron cyclotron emission
    measurement position due to the presence of suprathermal electrons, relative to
    the thermal-electron emission reference.
  documentation: 'Poloidal angular offset estimate of the electron cyclotron emission
    measurement position due to the presence of suprathermal electrons is the signed
    change in the assigned poloidal coordinate of that position relative to the thermal-electron
    emission reference. The poloidal angle $\theta$ is measured about the magnetic
    axis in a constant-$\phi$ cross-section of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height; $\theta=0$ is at the outboard midplane and $\theta$ increases from larger
    $R$ toward $+Z$.


    The offset is the difference between the poloidal coordinate assigned when suprathermal
    emission is included and the thermal-electron reference coordinate:


    $$

    \Delta\theta_\mathrm{supra} = \theta_\mathrm{meas,supra} - \theta_\mathrm{meas,thermal}

    $$


    where $\theta_\mathrm{meas,supra}$ is the assigned measurement-position poloidal
    angle with the suprathermal-electron contribution included, $\theta_\mathrm{meas,thermal}$
    is the corresponding thermal-electron reference angle, and $\Delta\theta_\mathrm{supra}$
    is this quantity; all angular quantities are in radians.


    This quantity is only the poloidal angular component of the suprathermal-electron
    offset at the measurement position; it is not a radial displacement, toroidal
    angular offset, or full spatial correction. It is distinguished from [poloidal_suprathermal_electron_perturbed_angle_of_ece_channel_emission_position](name:poloidal_perturbed_suprathermal_electron_angle_at_measurement_position),
    which applies to the ECE-channel emission position. No universal signed range,
    magnitude, or sign is implied by the name; the value is zero when the presence
    of suprathermal electrons leaves the assigned measurement position unchanged.


    Sign convention: Positive when $\Delta\theta_\mathrm{supra}$ shifts the assigned
    electron cyclotron emission measurement position in the direction of increasing
    poloidal angle $\theta$, from the outboard midplane toward $+Z$ in the constant-$\phi$
    cross-section of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: ece/channel/delta_position_suprathermal/theta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-delta_position_suprathermal-theta
    dd_documentation:
      leaf: Poloidal angle (oriented clockwise when viewing the poloidal cross section
        on the right hand side of the tokamak axis of symmetry, with the origin placed
        on the plasma magnetic axis)
      parent_path: ece/channel/delta_position_suprathermal
      parent: Simple estimate of the difference in position induced by the presence
        of suprathermal electrons. Position without corrections = position - delta_position_suprathermal
      data_type: STRUCTURE
      unit: rad
      coordinates:
      - ece/channel/time
    enhanced_context:
      description: "Poloidal angle (\u03B8) component of the position shift of the\
        \ ECE measurement location induced by suprathermal electrons. Part of the\
        \ correction vector estimating how non-thermal electrons bias the apparent\
        \ emission position relative to the thermal resonance layer."
      kind: llm
- name: radial_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Radial (major-radius) component of the local wave vector along the
    beam tracing ray path.
  documentation: 'The wave vector $\mathbf{k}$ characterizes the local spatial frequency
    and propagation direction of an electromagnetic wave at each point along a beam
    tracing ray. Its radial component $k_R = \mathbf{k} \cdot \hat{R}$ quantifies
    how rapidly the wave phase advances in the major-radius direction $\hat{R}$ of
    the right-handed cylindrical $(R, \phi, Z)$ frame.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the wave vector decomposes
    as:


    $$

    \mathbf{k} = k_R \hat{R} + k_\phi \hat{\phi} + k_Z \hat{Z}

    $$


    where $k_\phi = n_\phi / R$ with $n_\phi$ the toroidal mode number and $R$ the
    major radius in meters, and $k_Z$ is the [vertical wave vector component](name:vertical_wave_vector_of_beam_tracing_beam).
    Together with [toroidal_wave_vector_of_beam_tracing_beam](name:toroidal_wave_vector_of_beam_tracing_beam),
    these three components fully specify the local wave propagation geometry consistent
    with the local dispersion relation $D(\mathbf{k}, \omega, \mathbf{x}) = 0$.


    This component is computed by beam tracing along the ray path for electron cyclotron
    heating, current drive, and electron cyclotron emission diagnostic beams. For
    electron cyclotron waves near 170 GHz, the vacuum wavenumber $|\mathbf{k}_0| =
    \omega/c$ is approximately 3600 m$^{-1}$; in-plasma values of $k_R$ vary along
    the ray according to plasma geometry and the local dispersion relation.


    The dimensionless counterpart [radial_normalized_wave_vector_of_beam_tracing_beam](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    gives the direction cosine $k_R / |\mathbf{k}|$.


    Sign convention: Positive when the radial wave vector component points in the
    direction of increasing major radius $R$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:toroidal_wave_vector_of_beam_tracing_beam
