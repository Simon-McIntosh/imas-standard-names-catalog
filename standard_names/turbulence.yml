    status: attached
- name: normalized_particle_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of a particle species number density to a chosen
    reference number density.
  documentation: 'Normalized particle density is the number density of a specified
    particle species divided by a reference number density used to nondimensionalize
    the system. It preserves the relative abundance of each species while removing
    the physical density unit.


    The defining ratio is:


    $$

    n_{s,\mathrm{norm}} = \frac{n_s}{n_\mathrm{ref}}

    $$


    where $n_s$ is the particle number density of species $s$ in m$^{-3}$ and $n_\mathrm{ref}$
    is the reference number density in m$^{-3}$; the result is dimensionless.


    In gyrokinetic and turbulence calculations, $n_s$ is usually taken from the equilibrium
    or background density at the simulated location, while $n_\mathrm{ref}$ is a common
    normalization density shared by all species. With a common reference density,
    the set of normalized densities provides the charge-weighted equilibrium density
    balance, such as inline $\sum_s Z_s n_{s,\mathrm{norm}} = 0$ for signed charge
    number $Z_s$ when all relevant species are included. This balance is a normalization
    and background quasineutrality condition, not the complete gyrokinetic quasineutrality
    relation for fluctuations and fields.


    Physically allowed values are non-negative, with no fixed upper bound. Typical
    values are 0.1-3 for bulk electrons and main ions when the reference density is
    close to the plasma density, 10$^{-6}$-10$^{-2}$ for trace impurities, and 10$^{-3}$-1
    for minority or non-trace impurity species depending on composition and normalization
    choice.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_density
  - name:electron_density_at_outboard_midplane
  - name:ratio_of_particle_number_density_to_reference_number_density
  arguments:
