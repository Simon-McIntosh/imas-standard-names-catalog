- name: x_coordinate_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Signed x coordinate of the geometric center of a diagnostic aperture,
    measured from the origin of its right-handed camera Cartesian (x, y, z) frame.
  documentation: 'This quantity locates the geometric center of a diagnostic aperture
    along the x axis of its right-handed camera Cartesian basis $(\hat{x},\hat{y},\hat{z})$.
    It is a signed geometric position, not an aperture dimension or orientation.


    The coordinate is defined by


    $$

    x_A = (\mathbf{r}_A - \mathbf{r}_0) \cdot \hat{x}

    $$


    where $\mathbf{r}_A$ is the position of the aperture center, $\mathbf{r}_0$ is
    the frame origin, $\hat{x}$ is the unit vector along the x axis, and $x_A$ is
    measured in m. The corresponding [y coordinate of the diagnostic aperture](name:y_coordinate_of_diagnostic_aperture)
    uses the same origin and camera basis; this quantity is distinct from cylindrical
    radial and vertical aperture coordinates.


    Sign convention: Positive when the aperture center lies in the direction of increasing
    x from the frame origin.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_diagnostic_aperture
  sources:
  - dd_path: camera_ir/channel/camera/pinhole/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-pinhole-x
    dd_documentation:
      leaf: Component along X axis
