- name: elongation_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless ratio of the vertical to horizontal semi-axis of each
    nested magnetic flux surface, parameterizing the poloidal elongation of plasma
    shape as a function of the flux label.
  documentation: "The elongation $\\kappa$ of a flux surface is a dimensionless measure\
    \ of how vertically stretched the poloidal cross-section of a nested toroidal\
    \ magnetic surface is relative to its horizontal extent. A value of $\\kappa =\
    \ 1$ denotes a circular cross-section, while $\\kappa > 1$ characterizes the vertically\
    \ elongated shapes used in modern tokamaks to improve MHD stability and energy\
    \ confinement.\n\nThe defining relation is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\
    \nwhere $b$ is the vertical semi-axis (half-height measured from the geometric\
    \ center of the surface) and $a$ is the horizontal semi-axis (half-width) of the\
    \ flux surface in the poloidal cross-section.\n\nThe elongation profile is derived\
    \ from MHD equilibrium reconstruction by extracting the geometric shape parameters\
    \ of each nested flux surface obtained from the Grad-Shafranov solution, parameterized\
    \ as a function of the poloidal flux coordinate $\\psi$ across the minor radius.\
    \ The radial variation of $\\kappa$ is captured by [radial_derivative_of_elongation_of_flux_surface](name:radial_derivative_of_elongation_of_flux_surface).\
    \ Complementary poloidal shape descriptors include [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface),\
    \ which characterizes the poloidal corner geometry, and [area_of_flux_surface](name:surface_area_of_flux_surface),\
    \ which gives the total enclosed cross-sectional area.\n\nTypical values rise\
    \ from $\\kappa \\approx 1.0$ near the magnetic axis to $\\kappa \\approx 1.5$\u2013\
    $2.0$ at the plasma boundary in shaped tokamak discharges; ITER is designed for\
    \ a boundary elongation near $\\kappa = 1.85$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/elongation
    dd_path: equilibrium/time_slice/profiles_1d/elongation
    status: composed
  - id: dd:gyrokinetics/flux_surface/elongation
    dd_path: gyrokinetics/flux_surface/elongation
    status: attached
  - id: dd:gyrokinetics_local/flux_surface/elongation
    dd_path: gyrokinetics_local/flux_surface/elongation
    status: attached
- name: elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless ratio of the plasma boundary vertical half-height to
    its minor radius, quantifying the overall vertical elongation of the plasma cross-sectional
    shape at the last closed flux surface.
  documentation: "The elongation $\\kappa$ is a global dimensionless shape parameter\
    \ characterizing the vertical-to-horizontal aspect ratio of the plasma cross-section\
    \ at the plasma boundary. It enters directly into MHD stability criteria, the\
    \ Troyon beta limit, and confinement scaling relations, making it one of the primary\
    \ descriptors of plasma shaping alongside triangularity.\n\nThe defining relation\
    \ is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\nwhere $b$ is the vertical half-height\
    \ of the plasma boundary (half the total poloidal extent between the uppermost\
    \ and lowermost boundary points) and $a$ is the plasma minor radius (half the\
    \ horizontal full width at the midplane).\n\nThe quantity is obtained from equilibrium\
    \ reconstruction by fitting the closed poloidal boundary contour to external magnetic\
    \ measurements and internal pressure or current profiles. The boundary extremal\
    \ coordinates determine $b$ and $a$ directly.\n\nA circular cross-section corresponds\
    \ to $\\kappa = 1$. Modern shaped tokamaks typically operate in the range $\\\
    kappa = 1.5$\u2013$2.0$; strongly elongated configurations approach $\\kappa \\\
    approx 1.8$\u2013$2.0$. Higher elongation increases plasma volume at fixed minor\
    \ radius and improves the MHD beta limit, but at the cost of reduced vertical\
    \ stability requiring active position control.\n\nWhen up-down asymmetry is significant,\
    \ this global parameter decomposes into [upper elongation](name:upper_elongation_of_plasma_boundary)\
    \ and [lower elongation], each measuring the half-boundary contribution. The radial\
    \ variation of elongation across nested flux surfaces is captured by [elongation_of_flux_surface](name:elongation_of_flux_surface)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation
    dd_path: equilibrium/time_slice/boundary/elongation
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation
    status: attached
