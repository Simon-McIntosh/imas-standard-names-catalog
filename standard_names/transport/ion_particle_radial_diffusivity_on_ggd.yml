name: ion_particle_radial_diffusivity_on_ggd
status: draft
description: Effective radial diffusion coefficient for ion particle transport, discretized
  on a generalized grid description (GGD) mesh.
documentation: The radial ion particle diffusivity $D_{\perp,i}$ (in $\mathrm{m^2\,s^{-1}}$)
  parameterizes cross-field ion transport in the gradient-driven diffusive approximation
  $\Gamma_i = -D_{\perp,i} \nabla n_i + n_i v_{\rm pinch}$, where $n_i$ is the ion
  number density ($\mathrm{m^{-3}}$), $\Gamma_i$ the radial particle flux ($\mathrm{m^{-2}\,s^{-1}}$),
  and $v_{\rm pinch}$ the convective pinch velocity ($\mathrm{m\,s^{-1}}$). Stored
  per element of a GGD mesh, this coefficient resolves spatially varying transport
  in complex 2-D or 3-D geometries including the scrape-off layer, divertor legs,
  and private-flux region. Typical values span $\sim 0.01\;\mathrm{m^2\,s^{-1}}$ in
  H-mode pedestal regions to $\sim 1\text{--}10\;\mathrm{m^2\,s^{-1}}$ in the far
  SOL, reflecting the transition from suppressed to open-field-line transport. The
  coefficient is either prescribed from interpretive analysis, fitted to experimental
  profiles, or predicted by turbulence and edge transport codes (SOLPS-ITER, SOLEDGE2D-EIRENE,
  UEDGE). See also `ion_energy_radial_diffusivity_on_ggd` for the thermal channel
  and `neutral_particle_radial_diffusivity_on_ggd` for the neutral counterpart.
