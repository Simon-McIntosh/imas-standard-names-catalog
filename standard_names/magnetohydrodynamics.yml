- name: accumulated_radiated_energy_due_to_impurity_radiation
  kind: scalar
  status: active
  description: "Cumulative energy emitted through electron\u2013impurity radiation\
    \ over the disruption interval, obtained by integrating the corresponding radiated\
    \ power in time."
  documentation: "Accumulated impurity-radiation energy is the total energy carried\
    \ away by photons produced through electron interactions with impurity ions over\
    \ the disruption interval. It is a cumulative quantity, distinct from the instantaneous\
    \ [impurity-radiation power](name:power_due_to_impurity_radiation).\n\n$$\nE_{\\\
    mathrm{imp}}(t_0,t_1)=\\int_{t_0}^{t_1}P_{\\mathrm{imp}}(t)\\,dt\n$$\n\nwhere\
    \ $E_{\\mathrm{imp}}$ is the accumulated radiated energy, $P_{\\mathrm{imp}}(t)$\
    \ is the total radiative power attributed to electron\u2013impurity interactions\
    \ in W, and $t$, $t_0$, and $t_1$ are times in s. The integration interval spans\
    \ the defined disruption duration. The quantity includes the impurity-radiation\
    \ channels represented in $P_{\\mathrm{imp}}$ and excludes radiation not attributed\
    \ to impurity interactions; it is therefore not equivalent to [total plasma radiated\
    \ power](name:total_plasma_radiated_power)."
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:power_due_to_impurity_radiation
  - name:total_plasma_radiated_power
  sources:
  - dd_path: disruption/global_quantities/energy_radiated_electrons_impurities
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-energy_radiated_electrons_impurities
    dd_documentation:
      leaf: Total cumulated energy (integral of the power over the disruption duration)
        radiated by electrons on impurities
      parent_path: disruption/global_quantities
      parent: Global quantities
      data_type: FLT_1D
      unit: J
      coordinates:
      - disruption/time
    enhanced_context:
      description: Total cumulative energy radiated by electrons interacting with
        impurity ions during a disruption (E_rad_imp), integrated over the disruption
        duration. A key metric for assessing impurity-driven radiative collapse and
        thermal quench energy balance.
      kind: llm
  - dd_path: disruption/global_quantities/energy_radiated_electrons_impurities_halo
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-energy_radiated_electrons_impurities_halo
    dd_documentation:
      leaf: Cumulated energy (integral of the power over the disruption duration)
        radiated by electrons on impurities in the halo region
      parent_path: disruption/global_quantities
      parent: Global quantities
      data_type: FLT_1D
      unit: J
      coordinates:
      - disruption/time
    enhanced_context:
      description: Cumulative energy radiated by electrons colliding with impurity
        ions in the halo region during a disruption. Represents the time-integrated
        radiative power from electron-impurity interactions specifically in the halo
        current zone.
      kind: llm
- name: alfven_frequency
  kind: scalar
  status: active
  description: "Alfv\xE9n frequency at a given radial position for a single toroidal\
    \ mode number is the complex local shear-Alfv\xE9n continuum angular frequency;\
    \ its real part gives oscillation and its imaginary part gives growth or damping\
    \ for the stated time dependence."
  documentation: "Alfv\xE9n frequency at a given radial position for a single toroidal\
    \ mode number is the complex local shear-Alfv\xE9n continuum angular frequency\
    \ for perturbations propagating along the magnetic field on the flux surface at\
    \ that radial position. Its [real part](name:alfven_frequency_real_part) is the\
    \ oscillatory component, and its [imaginary part](name:alfven_frequency_imaginary_part)\
    \ is the temporal growth or damping component.\n\nThe ideal shear-Alfv\xE9n continuum\
    \ relation defining the underlying continuum frequency is\n\n$$\n\\omega_A = |k_\\\
    parallel| v_A\n$$\n\nwhere $\\omega_A$ is the real continuum angular frequency,\
    \ $k_\\parallel$ is the component of the wave vector parallel to the magnetic\
    \ field, and $v_A$ is the Alfv\xE9n speed, $B/\\sqrt{\\mu_0\\rho_m}$ with $B$\
    \ the magnetic-field magnitude, $\\mu_0$ the vacuum permeability, and $\\rho_m$\
    \ the plasma mass density.\n\nThis quantity denotes the full complex frequency\
    \ $\\Omega_A=\\operatorname{Re}(\\Omega_A)+i\\operatorname{Im}(\\Omega_A)$, not\
    \ either component alone, and it is an angular frequency rather than a cyclic\
    \ frequency. The radial position is a flux-surface label in explicitly named flux\
    \ coordinates such as $(\\rho,\\theta,\\phi)$ or $(\\psi,\\theta,\\phi)$, not\
    \ a cylindrical vector component in the right-handed cylindrical $(R,\\phi,Z)$\
    \ frame. At fixed [toroidal mode number], $k_\\parallel$ is determined by field-line\
    \ pitch, magnetic geometry, and poloidal harmonic content, with the [safety factor](name:safety_factor)\
    \ entering common single-harmonic specializations.\n\nSign convention: Positive\
    \ when $\\operatorname{Im}(\\Omega_A)$ makes perturbations proportional to $\\\
    exp(-i\\Omega_A t)$ grow exponentially in time."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:alfven_frequency_imaginary_part
  - name:safety_factor
- name: alfven_frequency_imaginary_part
  kind: complex
  status: active
  description: "Damping rate when negative or growth rate when positive, the imaginary\
    \ part of the complex shear Alfv\xE9n continuum frequency, for a single toroidal\
    \ mode number at a given radial position."
  documentation: "The imaginary part of the complex shear Alfv\xE9n continuum frequency,\
    \ $\\gamma = \\operatorname{Im}(\\omega_A)$, sets how fast a shear Alfv\xE9n perturbation\
    \ grows or decays at a given radial position for a chosen toroidal mode number\
    \ $n$. Together with the oscillation frequency [alfven_frequency_real_part](name:alfven_frequency_real_part)\
    \ it fixes the full time dependence, which under the $e^{-i\\omega_A t}$ convention\
    \ evolves as\n\n$$\n\\delta f(t) \\propto e^{\\gamma t}\\, e^{-i\\omega_r t}\n\
    $$\n\nso a positive $\\gamma$ marks an unstable, growing response and a negative\
    \ $\\gamma$ a linearly damped one. A linear MHD calculation resolves $\\gamma$\
    \ as a function of minor radius and toroidal mode number. The continuum is purely\
    \ real in ideal MHD, and a finite $\\gamma$ arises from resistive, kinetic, or\
    \ energetic-particle effects, the same drives that excite the discrete Alfv\xE9\
    n eigenmodes occupying the continuum gaps. The full complex value is the [alfven_frequency](name:alfven_frequency).\n\
    \nSign convention: Positive when the mode amplitude grows exponentially in time\
    \ under the $e^{-i\\omega_A t}$ convention."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:perturbed_plasma_temperature_imaginary_part
  arguments:
  - name: alfven_frequency
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-alfven_frequency_spectrum-imaginary
    dd_documentation:
      leaf: Imaginary part of the frequency, for a given radial position and every
        root found at this position
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum
      parent: "Local shear Alfv\xE9n spectrum as a function of radius (only in case\
        \ grid/dim1 is a radial coordinate)"
      data_type: FLT_1D
      unit: s^-1
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    enhanced_context:
      description: "Imaginary part of the local shear Alfv\xE9n frequency spectrum\
        \ as a function of radius and root index in linear MHD stability analysis.\
        \ Represents the damping or growth rate component of Alfv\xE9n continuum eigenfrequencies."
      kind: llm
- name: alfven_frequency_real_part
  kind: complex
  status: active
  description: "Oscillation frequency, the real part of the complex frequency, of\
    \ the local shear Alfv\xE9n continuum at a given radial position for a single\
    \ toroidal mode number."
  documentation: "The shear Alfv\xE9n continuum is the set of frequencies at which\
    \ shear Alfv\xE9n waves resonate on each flux surface, and its real part gives\
    \ the local oscillation frequency for a chosen toroidal mode number $n$. A linear\
    \ MHD calculation returns one frequency for every root of the local continuum\
    \ equation at each radial position, so the spectrum varies continuously with minor\
    \ radius. In the cylindrical limit the continuum frequency for poloidal harmonic\
    \ $m$ is\n\n$$\n\\operatorname{Re}(\\omega_A) = \\frac{|n - m/q|}{R}\\, v_A\n\
    $$\n\nwhere $q$ is the safety factor, $R$ the major radius in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, and $v_A = B/\\sqrt{\\mu_0 \\rho}$ the Alfv\xE9\
    n speed for total field magnitude $B$ and mass density $\\rho$. Toroidal coupling\
    \ of neighboring poloidal harmonics opens frequency gaps in which discrete Alfv\xE9\
    n eigenmodes, such as the toroidicity-induced and reversed-shear modes, can form.\
    \ The companion damping or growth rate is the [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part),\
    \ the two together forming the complex [alfven_frequency](name:alfven_frequency),\
    \ and the associated timescale is the [alfven_time](name:alfven_time).\n\nSign\
    \ convention: Positive when the wave phase advances in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_imaginary_part
  - name:alfven_frequency
  - name:alfven_time
  arguments:
  - name: alfven_frequency
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-alfven_frequency_spectrum-real
    dd_documentation:
      leaf: Real part of the frequency, for a given radial position and every root
        found at this position
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum
      parent: "Local shear Alfv\xE9n spectrum as a function of radius (only in case\
        \ grid/dim1 is a radial coordinate)"
      data_type: FLT_1D
      unit: s^-1
      coordinates:
      - 1...N
    enhanced_context:
      description: "Real part of the local shear Alfv\xE9n frequency spectrum as a\
        \ function of radius, for each root found at a given radial position. Represents\
        \ the oscillatory part of the Alfv\xE9n continuum frequency for the specified\
        \ toroidal mode number."
      kind: llm
- name: alfven_time
  kind: scalar
  status: active
  description: "Characteristic shear-Alfv\xE9n transit time across the magnetic-axis\
    \ major-radius scale, set by local ion inertia and the reference magnetic-field\
    \ strength."
  documentation: "The Alfv\xE9n time is the characteristic shear-Alfv\xE9n propagation\
    \ time across a reference major-radius scale in the confined plasma. It is a physical\
    \ MHD timescale, not an event timestamp or a growth rate.\n\nIts defining relation\
    \ is\n\n$$\n\\tau_A(\\rho) = \\frac{R_0\\sqrt{m_i n_i(\\rho)}}{B_0}\n$$\n\nwhere\
    \ $\\tau_A(\\rho)$ is the local Alfv\xE9n time, $R_0$ is the magnetic-axis major-radius\
    \ scale, $m_i$ is the mass of the reference ion population, $n_i(\\rho)$ is its\
    \ number density at radial coordinate $\\rho$, and $B_0$ is the reference magnetic-field\
    \ strength.\n\nThe quantity applies locally at each radial coordinate in the confined\
    \ plasma; it is not a radial average or radial integral, and it does not represent\
    \ a charge-state-resolved time unless the reference ion population is so specified.\
    \ As a timescale, it is distinct from the frequency represented by [alfven_frequency](name:alfven_frequency)\
    \ and from the general temporal quantity [time](name:time). It provides the characteristic\
    \ time used to normalize MHD growth rates and other dynamical rates."
  unit: s
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/tau_alfven
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-tau_alfven
    dd_documentation:
      leaf: Alven time=R/vA=R0 sqrt(mi ni(rho))/B0
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma
      parent: MHD modes in the confined plasma
      data_type: FLT_1D
      unit: s
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
    enhanced_context:
      description: "Alfv\xE9n time (\u03C4_A) as a function of radial coordinate,\
        \ defined as \u03C4_A = R0\xB7\u221A(m_i\xB7n_i(\u03C1))/B0. This local MHD\
        \ timescale characterises shear Alfv\xE9n wave propagation speed and normalises\
        \ MHD growth rates."
      kind: llm
- name: alpha_parameter
  kind: scalar
  status: active
  description: Alpha parameter is the dimensionless normalized plasma pressure-gradient
    drive entering local ideal-MHD ballooning stability theory.
  documentation: 'Alpha parameter is the dimensionless normalized plasma pressure-gradient
    drive entering local ideal-MHD ballooning stability theory. It represents the
    destabilizing pressure-gradient contribution relative to magnetic-field-line bending
    and curvature in a local equilibrium description.


    For a local minor radius $r$ increasing from the magnetic axis toward the plasma
    boundary, the ballooning normalization is:


    $$

    \alpha = -\frac{2\mu_0 q^2 R}{B_\phi^2}\frac{dp}{dr}

    $$


    where $p$ is the scalar plasma pressure entering the ideal-MHD equilibrium, $q$
    is the safety factor, $R$ is major radius in the right-handed cylindrical $(R,
    \phi, Z)$ frame, $B_\phi$ is the toroidal magnetic-field component in that frame,
    and $\mu_0$ is the vacuum permeability.


    The normalization makes $\alpha$ dimensionless. This quantity is the pressure-gradient
    drive itself, not a marginal-stability threshold; a critical alpha parameter is
    a threshold for the same drive, and [ratio of critical alpha parameter to alpha
    parameter at pedestal](name:ratio_of_critical_alpha_parameter_to_alpha_parameter_at_pedestal)
    is a distinct stability-margin quantity.


    Sign convention: Positive when the plasma pressure decreases in the outward direction
    of the chosen local minor radius $r$ ($dp/dr < 0$).'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: summary/pedestal_fits/mtanh/stability/alpha_experimental/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-mtanh-stability-alpha_experimental-value
    dd_documentation:
      leaf: Value
      parent_path: summary/pedestal_fits/mtanh/stability/alpha_experimental
      parent: Experimental normalized pressure gradient reconstructed by an MHD stability
        code (with assumptions on the ion pressure). See definition in [Miller PoP
        5 (1998),973,Eq. 42]
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Experimental normalized pressure gradient reconstructed by an MHD
        stability code (with assumptions on the ion pressure). See definition in [Miller
        PoP 5 (1998),973,Eq. 42].
      kind: template
  - dd_path: summary/pedestal_fits/mtanh/stability/bootstrap_current_sauter/alpha_ratio/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-mtanh-stability-bootstrap_current_sauter-alpha_ratio-value
