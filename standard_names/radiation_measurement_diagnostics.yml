- name: second_coordinate_width_of_filter_window
  kind: scalar
  status: draft
  description: Full width of a rectangular diagnostic filter window measured along
    the X2 direction of the local instrument reference frame. This non-negative extent,
    together with the X1-direction width, defines the active transmissive area of
    the filter window for rectangular geometry (geometry_type index 3).
  documentation: "The second-coordinate width $w_2$ is the edge-to-edge extent of\
    \ the clear optical opening of a rectangular filter window along the X2 axis of\
    \ the local instrument reference frame. For a rectangular filter geometry (geometry\\\
    _type index 3), the active transmissive area is\n\n$$A_\\mathrm{filter} = w_1\
    \ \\times w_2$$\n\nwhere $w_1$ is the complementary X1-direction extent given\
    \ by `first_coordinate_width_of_filter_window`. Here $w_2 \\geq 0$ by definition;\
    \ it is a non-negative scalar extent, not an oriented displacement.\n\nThis area\
    \ $A_\\mathrm{filter}$ enters the geometric throughput (\xE9tendue) of the diagnostic\
    \ channel alongside the solid angle subtended at the filter by the detector aperture.\
    \ For X-ray crystal spectrometer and soft X-ray channels, the filter window area\
    \ directly governs the photon flux admitted to the detector; narrower windows\
    \ reduce background contamination but at the cost of signal throughput.\n\nTypical\
    \ values range from fractions of a millimeter up to several centimeters depending\
    \ on the diagnostic design and spectral range. This quantity is used only when\
    \ the filter geometry is specified as rectangular (geometry\\_type index 3); for\
    \ circular or annular filter geometries the window extent is instead described\
    \ by a radius."
  unit: m
  physics_domain: radiation_measurement_diagnostics
