name: electron_pressure_pedestal_top
status: draft
cocos_transformation_type: one_like
description: Electron pressure at the top of the H-mode pedestal, representing the
  confined-side boundary of the edge transport barrier.
documentation: "The pedestal-top electron pressure $p_{e,\\rm ped}$ is defined as\
  \ the electron pressure evaluated at the inner (core-side) knee of the H-mode edge\
  \ transport barrier, typically located at $\\psi_N \\approx 0.9$\u20130.95. It is\
  \ related to the electron density and temperature pedestal heights via $p_{e,\\\
  rm ped} = n_{e,\\rm ped} T_{e,\\rm ped}$, where $n_{e,\\rm ped}$ and $T_{e,\\rm\
  \ ped}$ are the electron number density and temperature at the pedestal top, respectively.\
  \ Typical values range from 2 to 20 kPa in conventional H-mode tokamak plasmas;\
  \ the pedestal pressure is a primary determinant of core confinement through profile\
  \ stiffness. Extracted from mtanh or linear fits to Thomson scattering edge profiles.\
  \ See also `electron_pressure_at_separatrix` for the separatrix value and `maximum_of_derivative_of_electron_pressure_with_respect_to_normalized_poloidal_flux_at_pedestal`\
  \ for the gradient constraint on MHD stability."
