- name: radial_derivative_of_poloidal_magnetic_flux
  kind: scalar
  status: active
  description: Rate of change of signed poloidal magnetic flux with the dimensionful
    toroidal-flux radius labeling nested equilibrium flux surfaces.
  documentation: 'The radial derivative of poloidal magnetic flux is the rate at which
    the signed poloidal magnetic flux changes across nested equilibrium magnetic flux
    surfaces. It is a metric coefficient relating the poloidal-flux and toroidal-flux
    coordinate descriptions.


    The defining relation is


    $$

    \frac{d\psi}{d\rho_{\mathrm{tor}}}

    $$


    where $\psi$ is the [poloidal magnetic flux](name:poloidal_magnetic_flux), and
    $\rho_{\mathrm{tor}}$ is the dimensionful toroidal-flux radius that labels the
    nested surfaces.


    This quantity is evaluated as a function of the toroidal-flux radius, with one
    derivative value associated with each nested equilibrium surface. It is not a
    surface integral or average, and it is distinct from a derivative with respect
    to the cylindrical major radius, minor radius, or a normalized flux coordinate.


    Relative to [poloidal magnetic flux](name:poloidal_magnetic_flux), this quantity
    describes how the flux label changes in the outward toroidal-flux-radial direction.
    It has the same independent coordinate as the [derivative with respect to toroidal
    flux coordinate of area of flux surface](name:derivative_with_respect_to_toroidal_flux_coordinate_of_area_of_flux_surface),
    but differentiates poloidal magnetic flux rather than enclosed surface area.


    Sign convention: Positive when the poloidal magnetic flux increases as $\rho_{\mathrm{tor}}$
    increases outward from the magnetic axis toward the plasma boundary.'
  unit: Wb.m^-1
  physics_domain: equilibrium
  links:
  - name:derivative_with_respect_to_toroidal_flux_coordinate_of_area_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/dpsi_drho_tor
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-dpsi_drho_tor
    dd_documentation:
      leaf: Derivative of Psi with respect to Rho_Tor
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: Wb.m^-1
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Derivative of poloidal magnetic flux (\u03C8) with respect to\
        \ the toroidal flux coordinate (\u03C1_tor), d\u03C8/d\u03C1_tor. A metric\
        \ coefficient linking the poloidal and toroidal flux coordinate systems on\
        \ equilibrium flux surfaces."
      kind: llm
- name: radial_magnetic_field
  kind: scalar
  status: active
  description: "Radial magnetic-field component of the local total induction, resolved\
    \ along increasing major radius in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'The radial magnetic field $B_R$ is the signed component of the local
    total [magnetic induction](name:magnetic_field) resolved along the radial direction.
    It represents directional field strength rather than the full magnetic-induction
    vector or its magnitude.


    The radial component is defined by


    $$

    B_R = \mathbf{B} \cdot \hat{R}

    $$


    where $\mathbf{B}$ is the local total magnetic induction, $\hat{R}$ is the unit
    vector in the direction of increasing major radius, and $B_R$ is the resulting
    radial component.


    This quantity is defined locally in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It does not select a plasma, vacuum, perturbed, or other source contribution,
    and it has no restriction to a particular region or species. The named quantity
    is the local projection, not a spatial average; any finite-volume average is a
    separate aggregation.


    The radial direction is the cylindrical $\hat{R}$ direction and is distinct from
    the normal to a magnetic flux surface and from the direction perpendicular to
    the magnetic field. It is distinct from the [toroidal magnetic field](name:toroidal_magnetic_field)
    and [vertical magnetic field](name:vertical_magnetic_field), which are projections
    onto the other cylindrical directions. Together with those components, it resolves
    the local magnetic induction; its radial and vertical components form the [poloidal
    magnetic field](name:poloidal_magnetic_field).


    Sign convention: Positive when $B_R$ points in the direction of increasing major
    radius $R$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_field
  - name:vertical_magnetic_field
  - name:poloidal_magnetic_field
  sources:
  - dd_path: edge_profiles/ggd/b_field/r
