- name: first_measurement_direction_unit_vector_of_shatter_cone
  kind: vector
  status: active
  description: Unit vector specifying the first measurement direction of the shatter
    cone, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'Unit vector specifying the first measurement direction of the shatter
    cone, resolved in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.
    It gives the directed orientation associated with the first shatter-cone measurement
    direction, not a position, displacement, cone opening angle, or axis length.


    The vector is represented by its Cartesian basis expansion and constrained to
    have unit Euclidean norm:


    $$

    \hat{\mathbf{d}}_{\mathrm{sc},1} = d_x\hat{x} + d_y\hat{y} + d_z\hat{z}, \qquad
    \hat{\mathbf{d}}_{\mathrm{sc},1}\cdot\hat{\mathbf{d}}_{\mathrm{sc},1}=1

    $$


    where $\hat{\mathbf{d}}_{\mathrm{sc},1}$ is the first measurement direction unit
    vector of the shatter cone, $d_x$, $d_y$, and $d_z$ are its Cartesian scalar components,
    and $\hat{x}$, $\hat{y}$, and $\hat{z}$ are the basis vectors of the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, with $\hat{z}$ vertical.


    The first measurement direction is distinct from the second measurement direction
    and from the major-axis and minor-axis directions of an elliptic shatter-cone
    description, except in geometries where those directions are explicitly aligned.'
  unit: '1'
  physics_domain: plant_systems
  links: []
  sources:
  - dd_path: spi/injector/shatter_cone/direction/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-shatter_cone-direction-x
    dd_documentation:
