- name: launched_wave_duration
  kind: scalar
  status: active
  description: Duration of a single frequency sweep during which a probing electromagnetic
    wave is launched.
  documentation: 'Launched wave duration is the time interval of one complete swept-frequency
    launch of a probing electromagnetic wave. It is defined by the start and end times
    of the same launched-wave sweep, independent of how any received signal is analyzed.


    For a sweep beginning at $t_{\mathrm{start}}$ and ending at $t_{\mathrm{end}}$,
    the launched wave duration is:


    $$

    \Delta t_{\mathrm{lw}} = t_{\mathrm{end}} - t_{\mathrm{start}}

    $$


    where $\Delta t_{\mathrm{lw}}$ is the launched wave duration, and $t_{\mathrm{start}}$
    and $t_{\mathrm{end}}$ are the sweep start and end times, all measured in seconds.


    The corresponding launched frequency during this interval is described by [launched_wave_frequency](name:launched_wave_frequency).
    This quantity specifies only the duration of the complete sweep; it does not define
    the detailed frequency waveform, dwell time at individual frequencies, received-wave
    interval, or signal-analysis interval.'
  unit: s
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:launched_wave_frequency
  sources:
  - dd_path: reflectometer_fluctuation/channel/sweep_time
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/reflectometer_fluctuation.html#reflectometer_fluctuation-channel-sweep_time
    dd_documentation:
