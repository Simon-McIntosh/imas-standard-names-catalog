- name: triangularity
  kind: scalar
  status: draft
  description: Dimensionless D-shaping parameter measuring the horizontal displacement
    of the plasma-boundary apex relative to an untriangular elliptical cross-section.
  documentation: 'Triangularity describes how far a plasma boundary departs from an
    up-down symmetric ellipse toward a D-shaped cross-section. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, it measures the horizontal displacement of a
    boundary apex relative to the geometric center and minor radius, complementing
    vertical stretching described by [elongation](name:elongation). More specific
    variants such as [upper triangularity](name:upper_triangularity), [lower triangularity](name:lower_triangularity),
    [inner triangularity](name:inner_triangularity), and [outer triangularity](name:outer_triangularity)
    resolve which part of the boundary is being characterized.


    A common local definition is


    $$

    \delta = \frac{R_{\rm geo} - R_{\rm apex}}{a}

    $$


    where $R_{\rm geo}$ is the midplane geometric-center major radius, $R_{\rm apex}$
    is the major radius of the selected upper or lower boundary apex, and $a$ is the
    midplane minor radius. Positive triangularity corresponds to the familiar inboard-shifted
    D shape used to improve MHD stability and confinement access.


    Triangularity is obtained from equilibrium reconstruction of the last closed flux
    surface or separatrix, using magnetic measurements and, when available, kinetic
    or internal magnetic constraints. Shape-control systems use it together with boundary
    size measures such as [area of plasma boundary](name:area_of_plasma_boundary)
    to regulate plasma-wall clearance and divertor geometry.


    Representative tokamak values range from about -0.2 to 0.6, with conventional
    positive-triangularity H-mode plasmas often near 0.2-0.5 and negative-triangularity
    scenarios below zero.


    Sign convention: Positive when the selected plasma-boundary apex is displaced
    toward smaller major radius $R$ relative to the untriangular elliptical reference.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation
  - name:upper_triangularity
  - name:lower_triangularity
  - name:inner_triangularity
  - name:outer_triangularity
  - name:area_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/triangularity
    dd_path: equilibrium/time_slice/boundary/triangularity
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/triangularity
    dd_path: equilibrium/time_slice/boundary_separatrix/triangularity
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/triangularity_minor
    dd_path: equilibrium/time_slice/boundary_separatrix/triangularity_minor
    status: composed
- name: upper_elongation
  kind: scalar
  status: draft
  description: Dimensionless upper-half vertical shaping parameter comparing the plasma-boundary
    height above the geometric axis with the horizontal minor radius.
  documentation: 'Upper elongation describes the vertical stretching of the upper
    half of the plasma boundary relative to its horizontal size. It isolates up-down
    asymmetric shaping by measuring only the portion of the boundary above the geometric
    axis, complementing [lower elongation](name:lower_elongation_of_plasma_boundary)
    and the full-boundary [elongation](name:elongation).


    A common geometric definition in the right-handed cylindrical $(R, \phi, Z)$ frame
    is


    $$

    \kappa_u = \frac{Z_{\max} - Z_{\mathrm{geo}}}{a}

    $$


    where $\kappa_u$ is the upper elongation, $Z_{\max}$ is the highest vertical coordinate
    of the plasma boundary, $Z_{\mathrm{geo}}$ is the vertical coordinate of the geometric
    axis, and $a$ is the horizontal minor radius of the boundary. The explicit boundary-qualified
    quantity [upper elongation of plasma boundary](name:upper_elongation_of_plasma_boundary)
    carries the same physical interpretation when the boundary object is named explicitly.


    Upper elongation is computed from reconstructed plasma-boundary contours inferred
    from magnetic measurements, flux-surface fitting, and, when available, kinetic
    or imaging constraints on the last closed flux surface. It is used with shape
    parameters such as [outer triangularity](name:outer_triangularity) to characterize
    diverted and elongated equilibria.


    Representative tokamak values are about 1.0 for nearly circular plasmas, 1.5-2.0
    for elongated H-mode shapes, and above 2 only in strongly shaped configurations
    limited by vertical stability and wall clearance.


    Sign convention: Positive when the highest point of the plasma boundary lies in
    the +$Z$ direction relative to the geometric axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_elongation_of_plasma_boundary
  - name:elongation
  - name:upper_elongation_of_plasma_boundary
  - name:outer_triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_upper
    dd_path: equilibrium/time_slice/boundary/elongation_upper
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation_upper
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation_upper
    status: attached
- name: upper_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Ratio of the upper vertical half-height of the last closed plasma boundary
    to its horizontal minor radius, describing up-down shape asymmetry.
  documentation: 'Upper boundary elongation describes the vertical stretching of the
    upper half of the last closed plasma boundary relative to its horizontal minor
    radius. It separates the top-side shaping from the bottom-side shaping represented
    by [lower elongation of the plasma boundary](name:lower_elongation_of_plasma_boundary),
    while the full-boundary measure is summarized by [elongation](name:elongation).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, a common geometric definition
    is:


    $$

    \kappa_\mathrm{upper} = \frac{Z_\mathrm{top} - Z_\mathrm{geo}}{a}

    $$


    where $\kappa_\mathrm{upper}$ is the upper elongation, $Z_\mathrm{top}$ is the
    highest point of the plasma boundary, $Z_\mathrm{geo}$ is the vertical coordinate
    of the geometric axis, and $a=(R_\mathrm{out}-R_\mathrm{in})/2$ is the horizontal
    minor radius from the outer and inner midplane boundary intersections.


    The quantity is computed from an equilibrium boundary contour inferred from magnetic
    measurements, pressure constraints, and shape-control diagnostics. It is closely
    coupled to other boundary-shape parameters such as [outer triangularity](name:outer_triangularity),
    because elongation and triangularity together determine the D-shaped cross-section
    used for vertical stability and confinement optimization.


    Typical values are about 1.0 for nearly circular plasmas, 1.5-2.0 in elongated
    diverted tokamak plasmas, and up to about 2.2 or higher in strongly shaped scenarios
    limited by vertical stability and wall clearance.


    Sign convention: Positive when the upper boundary extremum lies at larger $Z$
    than the plasma geometric axis in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_elongation_of_plasma_boundary
  - name:elongation
  - name:outer_triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_upper
    dd_path: equilibrium/time_slice/boundary/elongation_upper
    status: composed
- name: upper_inner_squareness
  kind: scalar
  status: draft
  description: Dimensionless boundary-shape parameter measuring the quadratic deviation
    of the upper inboard plasma contour from an elliptical cross-section.
  documentation: 'Upper inner squareness describes the higher-order shaping of the
    plasma boundary in the upper inboard quadrant. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height, it
    separates corner-like distortion from the lower-order elongation and triangularity
    captured by [upper triangularity](name:upper_triangularity). The corresponding
    quadrant parameters [lower inner squareness](name:lower_inner_squareness), [upper
    outer squareness](name:upper_outer_squareness), and [lower outer squareness](name:lower_outer_squareness)
    describe the other boundary corners.


    A local geometric representation uses the signed displacement of the boundary
    from a reference ellipse fitted to the same lower-order shape:


    $$

    \zeta_{ui} = \frac{\left[\mathbf{x}_b(\theta_{ui}) - \mathbf{x}_{ell}(\theta_{ui})\right]
    \cdot \hat{\mathbf{c}}_{ui}}{a}

    $$


    where $\zeta_{ui}$ is the upper inner squareness, $\mathbf{x}_b=(R_b,Z_b)$ is
    the boundary point in the poloidal cross-section, $\mathbf{x}_{ell}$ is the corresponding
    reference-ellipse point, $\theta_{ui}$ labels the upper inboard quadrant, $\hat{\mathbf{c}}_{ui}$
    points toward the upper inboard corner, and $a$ is the minor radius.


    It is obtained from equilibrium reconstruction by fitting the last closed flux
    surface or separatrix contour with a boundary-shape parameterization. Magnetic
    probes, flux loops, polarimetry, and pressure-profile constraints can all influence
    the reconstructed contour from which the squareness is inferred.


    Representative values are near 0 for an elliptical boundary and commonly fall
    in the range -0.2-0.3 for shaped tokamak plasmas; larger absolute values indicate
    stronger corner-like distortion and can affect vertical stability, divertor geometry,
    and plasma-wall clearance.


    Sign convention: Positive when the upper inboard boundary is displaced from the
    reference elliptical contour toward the upper inboard rectangular corner of the
    cross-section.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity
  - name:lower_inner_squareness
  - name:upper_outer_squareness
  - name:lower_outer_squareness
  sources:
  - id: dd:equilibrium/time_slice/boundary/squareness_upper_inner
    dd_path: equilibrium/time_slice/boundary/squareness_upper_inner
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/squareness_upper_inner
    dd_path: equilibrium/time_slice/boundary_separatrix/squareness_upper_inner
    status: attached
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_upper_inner
    dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_inner
    status: attached
- name: upper_outer_squareness
  kind: scalar
  status: draft
  description: Dimensionless boundary-shape parameter measuring departure of the upper
    outboard plasma corner from an elliptical cross-section.
  documentation: 'Upper outer squareness describes the higher-order shaping of the
    plasma boundary in the upper outboard quadrant. It complements elongation and
    triangularity by measuring how full or flattened that corner is relative to an
    ellipse with the same midplane radii and vertical extent, and is naturally paired
    with [upper inner squareness](name:upper_inner_squareness) and [lower outer squareness](name:lower_outer_squareness).


    A practical definition uses the signed radial displacement of the boundary from
    a reference ellipse at the upper outer diagonal location:


    $$

    \zeta_{uo} = \frac{R_b(Z_{uo}) - R_{\mathrm{ell}}(Z_{uo})}{a}

    $$


    where $\zeta_{uo}$ is the upper outer squareness, $R_b(Z_{uo})$ is the boundary
    major radius at the chosen upper outboard height, $R_{\mathrm{ell}}(Z_{uo})$ is
    the corresponding reference-ellipse major radius, and $a$ is the plasma minor
    radius in the right-handed cylindrical $(R, \phi, Z)$ frame.


    It is obtained from equilibrium reconstruction of the last-closed flux surface
    using magnetic measurements, and may be constrained further by boundary-sensitive
    diagnostics. Near-elliptical plasmas have values close to 0; shaped tokamak boundaries
    commonly fall in the range -0.3 to 0.3, with stronger corner shaping approaching
    about 0.5. Related asymmetries are captured by [lower inner squareness](name:lower_inner_squareness),
    while [outer triangularity](name:outer_triangularity) and [upper triangularity](name:upper_triangularity)
    describe lower-order radial shifts of the boundary.


    Sign convention: Positive when the upper outboard boundary lies at larger major
    radius than the reference ellipse at the upper outer diagonal location.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_inner_squareness
  - name:lower_outer_squareness
  - name:lower_inner_squareness
  - name:outer_triangularity
  - name:upper_triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary/squareness_upper_outer
    dd_path: equilibrium/time_slice/boundary/squareness_upper_outer
    status: composed
