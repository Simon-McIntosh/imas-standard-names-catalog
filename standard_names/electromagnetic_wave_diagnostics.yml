- name: right_hand_circularly_polarized_wave_electric_field_real_part
  kind: complex
  status: active
  description: Signed in-phase real quadrature of the E-minus electric-field phasor
    in the right-hand circular polarization basis.
  documentation: 'The quantity is the in-phase real quadrature of the complex right-hand
    circularly polarized, or E-minus, wave electric-field phasor. It preserves the
    signed field component relative to the phase reference of the parent [right-hand
    circularly polarized wave electric field](name:right_hand_circularly_polarized_wave_electric_field),
    rather than representing the field magnitude.


    It is defined by


    $$

    E_{-,R} = \operatorname{Re}(E_-)

