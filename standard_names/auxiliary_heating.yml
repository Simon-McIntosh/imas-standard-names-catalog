- name: normal_component_of_wave_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the coherent wave magnetic field onto the normal direction
    of the local field-aligned (parallel, normal, binormal) coordinate triad. The
    normal direction is perpendicular to the local magnetic field line and lies in
    the osculating plane of the field line, pointing toward the center of field-line
    curvature.
  documentation: 'The normal component $B_\mathrm{n}$ of the coherent wave magnetic
    field is defined as the scalar projection of the wave magnetic field vector $\mathbf{B}_\mathrm{wave}$
    onto the unit vector $\hat{n}$ of the local field-aligned coordinate triad:


    $$B_\mathrm{n} = \mathbf{B}_\mathrm{wave} \cdot \hat{n}$$


    The field-aligned triad $(\hat{b}, \hat{n}, \hat{g})$ is constructed locally at
    each point in the plasma as follows:

    - $\hat{b} = \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along the equilibrium
    magnetic field $\mathbf{B}_0$,

    - $\hat{n} = (\hat{b} \cdot \nabla) \hat{b} \,/\, |(\hat{b} \cdot \nabla) \hat{b}|$
    is the principal normal, pointing toward the local center of curvature of the
    field line, and

    - $\hat{g} = \hat{b} \times \hat{n}$ is the binormal direction.


    All three unit vectors are defined in the IMAS cylindrical $(R, \phi, Z)$ frame
    (right-handed, with $R$ the major radius from the machine symmetry axis, $\phi$
    the toroidal angle increasing counter-clockwise viewed from above $+\hat{Z}$,
    and $Z$ the vertical height).


    **Unit convention:** The stored quantity carries the unit $\mathrm{m}^{-1} \cdot
    \mathrm{V}$. Although the physical wave magnetic field has SI units of tesla ($\mathrm{T}
    = \mathrm{V} \cdot \mathrm{s} \cdot \mathrm{m}^{-2}$), the full-wave solver family
    in IMAS reports wave electromagnetic fields in a Fourier/spectral representation
    where the field amplitude has been divided by an angular frequency or multiplied
    by a wavenumber-like factor, yielding $\mathrm{m}^{-1} \cdot \mathrm{V}$. This
    convention is shared by all members of the coherent-wave field family (`wave_magnetic_field`,
    `parallel_component_of_wave_magnetic_field`, `binormal_component_of_wave_magnetic_field`,
    and the corresponding electric-field counterparts).


    **Wave-field representation:** The quantity represents the complex amplitude of
    the coherent (single-frequency, single-mode) wave field as computed by a full-wave
    solver. It is not a time-averaged or RMS quantity; the physical instantaneous
    field is obtained as the real part of $B_\mathrm{n}\, e^{-i\omega t}$.


    **Physical role:** The normal component governs coupling to field-line-curvature-driven
    perturbations and is related to compressional and drift-wave type oscillations.
    In contrast to the parallel component, which captures field-aligned perturbations,
    $B_\mathrm{n}$ characterizes the bending of field lines in their curvature plane.
    Its magnitude relative to the total wave field amplitude depends sensitively on
    wave mode, frequency, and plasma geometry; typical normalized values $|B_\mathrm{n}|
    / |\mathbf{B}_\mathrm{wave}|$ span the range $0$ to $1$ across different wave
    types and propagation geometries encountered in ion cyclotron, electron cyclotron,
    and lower-hybrid heating scenarios.


    Sign convention: Positive when the wave magnetic field has a component in the
    direction of the principal normal $\hat{n}$, which points toward the local center
    of curvature of the equilibrium magnetic field line.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:parallel_component_of_wave_magnetic_field
  - name:binormal_component_of_wave_magnetic_field
  - name:wave_magnetic_field
  - name:normal_component_of_wave_electric_field
  constraints: []
  arguments:
  - name: wave_magnetic_field
    operator: component
    operator_kind: projection
    axis: normal
    shape: component
  sources:
  - id: dd:waves/coherent_wave/full_wave/b_field/normal/values
    dd_path: waves/coherent_wave/full_wave/b_field/normal/values
    status: composed
- name: outer_radius_of_annular_conductor_cross_section
  kind: scalar
  status: draft
  description: Outer radius of the annular (hollow-circular) cross-section of a conductor
    element, defining the external boundary of the annulus.
  documentation: 'The outer radius $r_{\rm out}$ defines the external boundary of
    an annular conductor cross-section, where the conductor material occupies the
    region between $r_{\rm in}$ (the [inner radius](name:inner_radius_of_annular_conductor_cross_section))
    and $r_{\rm out}$. Together these two radii fully specify the cross-sectional
    geometry of a hollow cylindrical conductor, with the annular area given by $A
    = \pi (r_{\rm out}^2 - r_{\rm in}^2)$. In ion cyclotron resonance heating (ICRH)
    antenna design, the conductor cross-sectional geometry governs current-carrying
    capacity, resistive losses, and mechanical strength; typical outer radii for antenna
    strap conductors range from a few millimeters to several centimeters depending
    on current and cooling requirements. The annular cross-section geometry is one
    of several parameterizations used alongside rectangular ([width_of_rectangle_geometry](name:width_of_rectangle_geometry),
    [height_of_rectangle_geometry](name:height_of_rectangle_geometry)) and oblique
    geometries to describe ICRH antenna strap conductor elements.


    Sign convention: Positive when the radius is measured outward from the conductor
    axis in the plane of the cross-section.'
