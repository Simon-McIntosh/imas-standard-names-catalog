- name: toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Radial toroidal-flux coordinate of the rational magnetic surface about
    which a neoclassical tearing mode island is centered. It is a nonnegative flux-surface
    radius derived from enclosed toroidal magnetic flux relative to the magnetic axis,
    expressed in meters.
  documentation: 'The toroidal flux coordinate of a neoclassical tearing mode center
    is the radial coordinate $\rho_\mathrm{tor}$, in flux coordinates $(\rho_\mathrm{tor},
    \theta, \phi)$, assigned to the rational magnetic surface about which the magnetic
    island is centered. It locates the island by enclosed toroidal magnetic flux relative
    to the magnetic axis, rather than by geometric minor radius.


    For a flux surface $S$ associated with the island center, the coordinate is obtained
    by converting the toroidal magnetic flux increment from the magnetic axis into
    an equivalent radius:


    $$

    \rho_\mathrm{tor}(S) = \left(\frac{|\Phi_\mathrm{tor}(S) - \Phi_{\mathrm{tor},0}|}{\pi
    B_\mathrm{ref}}\right)^{1/2}

    $$


    where $\Phi_\mathrm{tor}(S)$ is the toroidal magnetic flux in Wb enclosed by surface
    $S$, $\Phi_{\mathrm{tor},0}$ is the toroidal magnetic flux in Wb at the magnetic
    axis reference, and $B_\mathrm{ref}$ is a positive reference magnetic-field magnitude
    in T. The absolute flux increment and positive reference-field magnitude make
    $\rho_\mathrm{tor}$ a nonnegative radius: it is zero at the magnetic axis and
    increases outward for nested closed flux surfaces.


    In practice, the NTM center is associated with the resonant surface satisfying
    $q=m/n$, where $m$ is the poloidal mode number and $n$ is the toroidal mode number.
    The coordinate is evaluated from the equilibrium toroidal flux at that surface;
    the [radial width of the neoclassical tearing mode](name:radial_width_of_neoclassical_tearing_mode)
    describes the island extent about this center, while the [neoclassical tearing
    mode phase](name:neoclassical_tearing_mode_phase) describes its angular position.


    Typical values lie between 0 m at the magnetic axis and the boundary toroidal
    flux coordinate $\rho_{\mathrm{tor},b}$ for islands inside the last closed flux
    surface. Absolute values scale with plasma size and reference-field choice, so
    normalized toroidal-flux coordinates such as [normalized_toroidal_flux_coordinate_at_magnetic_axis](name:normalized_toroidal_flux_coordinate_at_magnetic_axis)
    and [normalized_toroidal_flux_coordinate_at_measurement_position](name:normalized_toroidal_flux_coordinate_at_measurement_position)
    are often used when comparing radial locations.'
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_width_of_neoclassical_tearing_mode
  - name:rotation_frequency_of_neoclassical_tearing_mode
  - name:neoclassical_tearing_mode_phase
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/rho_tor
    dd_path: ntms/time_slice/mode/detailed_evolution/rho_tor
    status: composed
  - id: dd:ntms/time_slice/mode/rho_tor
    dd_path: ntms/time_slice/mode/rho_tor
