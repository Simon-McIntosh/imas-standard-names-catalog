      data_type: FLT_0D
      unit: u
    enhanced_context:
      description: Data field in charge_exchange.
      kind: template
- name: neutron_flux_of_neutron_detector
  kind: scalar
  status: active
  description: "Fusion-neutron number flux incident on the neutron detector\u2019\
    s active surface, giving the rate at which neutrons cross each unit of that surface."
  documentation: 'This quantity is the incident fusion-neutron number flux on the
    neutron-sensitive active surface of the detector. It is the surface-crossing flux,
    not the neutron production rate or the registered detection-event rate described
    by [rate of neutron detector](name:rate_of_neutron_detector). The parent quantity
    [flux of neutron detector](name:flux_of_neutron_detector) expresses the same surface-transport
    concept.


    The defining relation is


    $$

    \Phi_n = \frac{dN_n}{dA\,dt}

    $$


    where $\Phi_n$ is the incident neutron number flux, $N_n$ is the number of neutrons
    crossing the active surface, $A$ is active surface area, and $t$ is time. The
    surface is the neutron-sensitive area characterized by [area of neutron detector](name:area_of_neutron_detector);
    passive housing, shielding, supports, and electronics are excluded. Registered
    event rates additionally depend on detector response and efficiency.'
  unit: m^-2.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:rate_of_neutron_detector
  - name:flux_of_neutron_detector
  - name:area_of_neutron_detector
  arguments:
  - name: flux_of_neutron_detector
    operator: neutron
    operator_kind: qualifier
  sources:
  - dd_path: neutron_diagnostic/detector/mode/neutron_flux
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-mode-neutron_flux
    dd_documentation:
