name: lower_elongation_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Elongation of the lower half of the plasma boundary measured with respect
  to the geometric axis.
documentation: The lower elongation $\kappa_{\rm low}$ is defined as $\kappa_{\rm
  low} = (Z_{\rm axis} - Z_{\rm min}) / a$, where $Z_{\rm axis}$ is the vertical coordinate
  of the geometric axis, $Z_{\rm min}$ is the lowest point of the plasma boundary
  (last closed flux surface or separatrix), and $a$ is the plasma minor radius, all
  in meters. It characterizes the up-down asymmetry of the plasma shape independently
  of the upper half; equal upper and lower elongations correspond to an up-down symmetric
  equilibrium. Typical values for diverted tokamak plasmas range from 1.4 to 2.0,
  depending on the divertor geometry and shaping coil configuration. The quantity
  is obtained from equilibrium reconstruction and is a target parameter in plasma
  shape control systems. See also `upper_elongation_of_plasma_boundary` and `elongation_of_plasma_boundary`
  for the full-boundary counterpart.
