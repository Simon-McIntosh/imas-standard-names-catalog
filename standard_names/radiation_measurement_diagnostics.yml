- name: vertical_back_surface_curvature_of_optical_element
  kind: scalar
  status: active
  description: "Vertical back-surface curvature of an optical element is the signed\
    \ directional radius of curvature of the rear optical surface along the second\
    \ local tangential aperture direction. Here vertical means object-local aperture\
    \ vertical, not the Z direction of the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Vertical back-surface curvature of an optical element is the signed
    directional radius of curvature of the back optical surface in its second local
    tangential aperture direction. The right-handed local optical-surface frame is
    $(\hat{\mathbf{e}}_1, \hat{\mathbf{e}}_2, \hat{\mathbf{n}}_b)$ with $\hat{\mathbf{e}}_1
    \times \hat{\mathbf{e}}_2 = \hat{\mathbf{n}}_b$, where $\hat{\mathbf{e}}_1$ and
    $\hat{\mathbf{e}}_2$ are the first and second surface-tangential aperture directions
    and $\hat{\mathbf{n}}_b$ is the positive normal of the back surface; this quantity
    uses $\hat{\mathbf{e}}_2$, the object-local aperture vertical direction.


    The defining relation is the reciprocal of the signed normal curvature of the
    back-surface normal section tangent to $\hat{\mathbf{e}}_2$:


    $$

    R_{b,2} = \frac{1}{\kappa_{n,b}(\hat{\mathbf{e}}_2)}

    $$


    where $R_{b,2}$ is the vertical back-surface curvature of the optical element
    and $\kappa_{n,b}(\hat{\mathbf{e}}_2)$ is the signed normal curvature of the back
    surface in the $\hat{\mathbf{e}}_2$ direction.


    This is a local directional radius, not the scalar parent [optical-element curvature](name:curvature_of_optical_element)
    and not the direction-agnostic [back-surface curvature](name:back_surface_curvature_of_optical_element).
    It equals the first-direction radius only for locally spherical or otherwise direction-independent
    curvature, and it is not a principal, sagittal, or meridional radius unless the
    surface definition aligns $\hat{\mathbf{e}}_2$ with that direction. Together with
    an orthogonal directional radius it may characterize simple aligned toroidal curvature,
    but it does not fully characterize a general aspherical surface.


    Sign convention: Positive when the center of curvature of the normal section tangent
    to $\hat{\mathbf{e}}_2$ lies in the $+\hat{\mathbf{n}}_b$ half-space of the back-surface
    local frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:back_surface_curvature_of_optical_element
  - name:vertical_front_surface_curvature_of_optical_element
  sources:
  - dd_path: spectrometer_visible/channel/optical_element/back_surface/x2_curvature
