- name: ion_atomic_number
  kind: scalar
  status: draft
  description: Nuclear charge number (proton number) identifying a specific ion element
    in the plasma.
  documentation: 'The ion atomic number $Z$ identifies the element of an ion species
    by its nuclear charge (number of protons). In magnetically confined fusion plasmas,
    $Z$ distinguishes fuel species (deuterium $Z=1$, helium $Z=2$) from impurity species
    (carbon $Z=6$, tungsten $Z=74$). This quantity is an input parameter for transport
    modeling and atomic physics calculations, used together with the ion density to
    compute radiative losses and effective charge. For a given ion species, $Z$ is
    independent of the ionization state and remains fixed across the plasma domain.
    Related quantities include `[ion_density](name:ion_density)` for the species density
    and `[ion_state_average_charge](name:ion_state_average_charge)` for the mean charge
    state.


    Sign convention: Positive when the ion species has a positive nuclear charge,
    which always holds for physical plasma elements.


    In simulations, $Z$ is typically specified at the domain boundary as part of the
    species composition and is constant in time. The range of $Z$ values encountered
    spans $Z=1$ (hydrogen isotopes) to $Z=74$ (tungsten) in present-day tokamaks,
    and up to $Z=92$ (uranium) in inertial confinement experiments.'
  unit: '1'
  physics_domain: transport
  links:
  - name:ion_density
  - name:ion_state_average_charge
