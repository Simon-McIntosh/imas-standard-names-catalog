- name: toroidal_anomalous_current_density
  kind: scalar
  status: draft
  description: 'Toroidal component of the anomalous current density: the turbulence-driven
    net charge flow projected along the direction of increasing toroidal angle in
    a right-handed cylindrical (R, phi, Z) frame. It is distinct from inductive Ohmic,
    neoclassical bootstrap, and equilibrium diamagnetic currents, and is relevant
    to anomalous transport in the plasma core, edge, and scrape-off layer.'
  documentation: 'Toroidal anomalous current density is the projection onto the toroidal
    direction $\hat{\phi}$ of the current density carried by correlated turbulent
    fluctuations. In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is the
    major radius, $\phi$ is the toroidal angle increasing counter-clockwise viewed
    from above $+\hat{Z}$, and $Z$ is the vertical height. It represents the net charge
    flow attributable to anomalous (turbulent) processes, as opposed to inductive
    Ohmic, neoclassical bootstrap, or equilibrium diamagnetic contributions.


    The quantity is defined by the projection of the anomalous current density vector
    onto the toroidal unit vector:


    $$

    J_{\mathrm{ano},\phi} = \mathbf{J}_{\mathrm{ano}} \cdot \hat{\phi}

    $$


    where $\mathbf{J}_{\mathrm{ano}}$ is the full [anomalous current density] vector
    (in A m$^{-2}$) and $\hat{\phi}$ is the dimensionless toroidal unit vector. In
    a fluctuation-averaged turbulence description, the anomalous current arises from
    the correlated transport of charged species, $\mathbf{J}_{\mathrm{ano}} = \sum_s
    q_s \langle \tilde{n}_s \tilde{\mathbf{v}}_s \rangle$, where $q_s$ is the charge
    of species $s$ (in C), $\tilde{n}_s$ is the fluctuating density (in m$^{-3}$),
    $\tilde{\mathbf{v}}_s$ is the fluctuating velocity (in m s$^{-1}$), and the angle
    brackets denote an ensemble or time average over the turbulent fluctuations.


    In practice this quantity is computed from gyrokinetic or fluid turbulence models,
    or inferred through transport analysis that separates fluctuation-driven current
    from Ohmic, bootstrap, and equilibrium contributions. It may be evaluated locally
    or averaged over a flux surface, but the physical quantity is always the toroidal
    projection of the anomalous charge-flow response. It complements the directional
    projections [radial_anomalous_current_density](name:radial_anomalous_current_density),
    [poloidal_anomalous_current_density](name:poloidal_anomalous_current_density),
    and [vertical_anomalous_current_density](name:vertical_anomalous_current_density),
    and parallels the non-anomalous toroidal contributions such as toroidal_bootstrap_current_density
    and toroidal_ohmic_current_density.


    Magnitudes are strongly model, regime, and averaging dependent, so no device-independent
    numerical range is implied. As order-of-magnitude guidance, modeled values are
    typically far smaller than the total toroidal plasma current density, of order
    $10^{-1}$-$10^{2}$ A m$^{-2}$ in weakly turbulent core conditions and rising toward
    $10^{2}$-$10^{4}$ A m$^{-2}$ in strongly driven edge or scrape-off-layer conditions.


    Sign convention: Positive when the anomalous current flows in the direction of
    increasing toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:radial_anomalous_current_density
  sources:
  - id: dd:edge_profiles/ggd/j_anomalous/phi
    dd_path: edge_profiles/ggd/j_anomalous/phi
    status: attached
  - id: dd:edge_profiles/ggd/j_anomalous/toroidal
    dd_path: edge_profiles/ggd/j_anomalous/toroidal
    status: attached
  - id: dd:plasma_profiles/ggd/j_anomalous/phi
    dd_path: plasma_profiles/ggd/j_anomalous/phi
