- name: alfven_frequency
  kind: scalar
  status: draft
  description: "Complex frequency of the local shear Alfv\xE9n continuum for a single\
    \ toroidal mode number, whose real part is the oscillation frequency and imaginary\
    \ part the damping or growth rate."
  documentation: "The shear Alfv\xE9n continuum collects the frequencies at which\
    \ shear Alfv\xE9n waves resonate on each flux surface for a chosen toroidal mode\
    \ number $n$. A linear MHD calculation returns the complex frequency $\\omega_A\
    \ = \\omega_r + i\\omega_i$ for every root of the local continuum equation, resolving\
    \ both the oscillation frequency and its damping or growth rate as continuous\
    \ functions of minor radius. The local continuum frequency follows\n\n$$\n\\omega_A\
    \ = k_\\parallel v_A\n$$\n\nwith parallel wavenumber $k_\\parallel = (nq - m)/(qR_0)$\
    \ for poloidal harmonic $m$, safety factor $q$, and major radius $R_0$, and Alfv\xE9\
    n speed $v_A = B/\\sqrt{\\mu_0 \\rho}$ for total field magnitude $B$ and mass\
    \ density $\\rho$. Under the $e^{-i\\omega t}$ convention a positive $\\omega_i$\
    \ grows and a negative $\\omega_i$ damps; the continuum is purely real in ideal\
    \ MHD, with finite $\\omega_i$ arising from resistive, kinetic, or energetic-particle\
    \ effects. The separate parts are the [alfven_frequency_real_part](name:alfven_frequency_real_part)\
    \ and [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part),\
    \ discrete Alfv\xE9n eigenmodes form in the gaps the continuum leaves open, and\
    \ the characteristic timescale is the [alfven_time](name:alfven_time)."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:alfven_frequency_imaginary_part
- name: alfven_frequency_imaginary_part
  kind: complex
  status: draft
  description: "Damping rate when negative or growth rate when positive, the imaginary\
    \ part of the complex shear Alfv\xE9n continuum frequency, for a single toroidal\
    \ mode number at a given radial position."
  documentation: "The imaginary part of the complex shear Alfv\xE9n continuum frequency,\
    \ $\\gamma = \\operatorname{Im}(\\omega_A)$, sets how fast a shear Alfv\xE9n perturbation\
    \ grows or decays at a given radial position for a chosen toroidal mode number\
    \ $n$. Together with the oscillation frequency [alfven_frequency_real_part](name:alfven_frequency_real_part)\
    \ it fixes the full time dependence, which under the $e^{-i\\omega_A t}$ convention\
    \ evolves as\n\n$$\n\\delta f(t) \\propto e^{\\gamma t}\\, e^{-i\\omega_r t}\n\
    $$\n\nso a positive $\\gamma$ marks an unstable, growing response and a negative\
    \ $\\gamma$ a linearly damped one. A linear MHD calculation resolves $\\gamma$\
    \ as a function of minor radius and toroidal mode number. The continuum is purely\
    \ real in ideal MHD, and a finite $\\gamma$ arises from resistive, kinetic, or\
    \ energetic-particle effects, the same drives that excite the discrete Alfv\xE9\
    n eigenmodes occupying the continuum gaps. The full complex value is the [alfven_frequency](name:alfven_frequency).\n\
    \nSign convention: Positive when the mode amplitude grows exponentially in time\
    \ under the $e^{-i\\omega_A t}$ convention."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:perturbed_plasma_temperature_imaginary_part
  arguments:
  - name: alfven_frequency
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/imaginary
    status: composed
- name: alfven_frequency_real_part
  kind: complex
  status: draft
  description: "Oscillation frequency, the real part of the complex frequency, of\
    \ the local shear Alfv\xE9n continuum at a given radial position for a single\
    \ toroidal mode number."
  documentation: "The shear Alfv\xE9n continuum is the set of frequencies at which\
    \ shear Alfv\xE9n waves resonate on each flux surface, and its real part gives\
    \ the local oscillation frequency for a chosen toroidal mode number $n$. A linear\
    \ MHD calculation returns one frequency for every root of the local continuum\
    \ equation at each radial position, so the spectrum varies continuously with minor\
    \ radius. In the cylindrical limit the continuum frequency for poloidal harmonic\
    \ $m$ is\n\n$$\n\\operatorname{Re}(\\omega_A) = \\frac{|n - m/q|}{R}\\, v_A\n\
    $$\n\nwhere $q$ is the safety factor, $R$ the major radius in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, and $v_A = B/\\sqrt{\\mu_0 \\rho}$ the Alfv\xE9\
    n speed for total field magnitude $B$ and mass density $\\rho$. Toroidal coupling\
    \ of neighboring poloidal harmonics opens frequency gaps in which discrete Alfv\xE9\
    n eigenmodes, such as the toroidicity-induced and reversed-shear modes, can form.\
    \ The companion damping or growth rate is the [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part),\
    \ the two together forming the complex [alfven_frequency](name:alfven_frequency),\
    \ and the associated timescale is the [alfven_time](name:alfven_time).\n\nSign\
    \ convention: Positive when the wave phase advances in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_imaginary_part
  - name:alfven_frequency
  - name:alfven_time
  arguments:
  - name: alfven_frequency
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    status: composed
- name: effective_charge
  kind: scalar
  status: draft
  description: Effective ionic charge Z_eff of the plasma, equal to the density-weighted
    mean-squared ion charge normalized to electron density, governing resistivity,
    bremsstrahlung emission, and neoclassical transport coefficients.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the net ionic\
    \ charge state of the full plasma mixture, replacing the multi-species ion distribution\
    \ with a single equivalent charge that reproduces the electron\u2013ion collision\
    \ frequency. It is dimensionless and always at least unity for any quasi-neutral\
    \ plasma, with values exceeding 1 indicating the presence of impurity species.\n\
    \nThe defining relation is:\n\n$$\nZ_\\text{eff} = \\frac{\\sum_i n_i Z_i^2}{n_e}\n\
    $$\n\nwhere $n_i$ is the number density of ion species $i$, $Z_i$ is the charge\
    \ number of species $i$, and $n_e = \\sum_i n_i Z_i$ is the electron density obtained\
    \ from quasi-neutrality. For a pure hydrogen plasma $Z_\\text{eff} = 1$; high-$Z$\
    \ impurities drive it substantially above unity.\n\n$Z_\\text{eff}$ enters the\
    \ Spitzer resistivity $\\eta \\propto Z_\\text{eff} \\ln\\Lambda / T_e^{3/2}$,\
    \ the bremsstrahlung radiation power $P_\\text{brem} \\propto n_e^2 Z_\\text{eff}\
    \ T_e^{1/2}$, and neoclassical transport coefficients. It is most commonly inferred\
    \ from visible or near-infrared bremsstrahlung continuum emissivity, which scales\
    \ as $n_e^2 Z_\\text{eff}$, or estimated from resistive flux consumption during\
    \ the ohmic heating phase.\n\nTypical values range from 1 in clean hydrogen plasmas\
    \ to 2\u20135 in H-mode discharges with moderate impurity seeding, and can exceed\
    \ 5 near the plasma edge in impurity-rich regimes. The [line-averaged effective\
    \ charge](name:line_averaged_effective_charge) is obtained from a spectroscopic\
    \ chord integral, while the [volume-averaged effective charge](name:volume_averaged_effective_charge)\
    \ provides a single global impurity metric; radial profiles capture the local\
    \ $Z_\\text{eff}$ variation across the plasma.\n\nSign convention: Positive for\
    \ all physically realizable plasmas, since $Z_\\text{eff} \\geq 1$ follows from\
    \ quasi-neutrality and the positivity of all ion charge-state densities."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:line_averaged_effective_charge
  - name:volume_averaged_effective_charge
