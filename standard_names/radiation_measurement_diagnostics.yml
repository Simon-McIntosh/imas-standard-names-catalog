- name: spectral_absorptivity_of_filter
  kind: scalar
  status: active
  description: Wavelength-resolved fraction of incident photon flux absorbed within
    filter material at each photon wavelength, excluding transmitted and reflected
    photons.
  documentation: 'Spectral absorptivity of a filter is the fraction of incident photons
    at a specified wavelength that are absorbed within the filter material. It describes
    absorption alone, rather than transmission, reflection, scattering, or detector
    registration.


    The spectral absorptivity is defined by


    $$

    \alpha(\lambda) = \frac{\Phi_{\mathrm{abs}}(\lambda)}{\Phi_{\mathrm{inc}}(\lambda)}

    $$


    where $\alpha(\lambda)$ is the absorptivity, $\Phi_{\mathrm{abs}}(\lambda)$ is
    the absorbed spectral photon-flux density, $\Phi_{\mathrm{inc}}(\lambda)$ is the
    incident spectral photon-flux density, and $\lambda$ is photon wavelength measured
    in meters; the two flux densities have units of photons per square meter per second
    per meter. The value lies between zero and one wherever the incident flux is nonzero.


    The broadband [absorptivity of a filter](name:absorptivity_of_filter) is the incident-flux-weighted
    average of $\alpha(\lambda)$. This quantity is distinct from [spectral efficiency
    of a filter](name:spectral_efficiency_of_filter), which includes the probability
    that an incident photon produces a registered detection event.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:absorptivity_of_filter
  - name:spectral_efficiency_of_filter
  arguments:
  - name: absorptivity_of_filter
    operator: spectral
    operator_kind: qualifier
  sources:
  - dd_path: camera_x_rays/filter_window/photon_absorption
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-filter_window-photon_absorption
    dd_documentation:
      leaf: 'Probability of absorbing a photon passing through the filter as a function
        of its wavelength '
      parent_path: camera_x_rays/filter_window
      parent: Characteristics of the filter window
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - camera_x_rays/filter_window/wavelengths
    enhanced_context:
      description: Photon absorption probability of the X-ray camera filter window
        as a function of photon wavelength. Characterizes the spectral attenuation
        of the filter material across its operating wavelength range.
      kind: llm
  - dd_path: hard_x_rays/channel/filter_window/photon_absorption
