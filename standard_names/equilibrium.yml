- name: electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume for the local
    continuum plasma state, excluding spatial averages that have distinct standard
    names.
  documentation: 'Number density of free electrons per physical volume is the local
    continuum count density of electrons not bound to atoms, molecules, or ions. Unless
    a population qualifier is present, it denotes the unqualified local free-electron
    density at a point, not a line-averaged or volume-averaged quantity.


    For a representative physical volume surrounding the point, the defining ratio
    is:


    $$

    n_e = \frac{N_e}{V}

    $$


    where $n_e$ is the electron density, $N_e$ is the number of free electrons in
    the representative volume, and $V$ is that physical volume. The continuum value
    is understood for volumes small on macroscopic plasma scales but large enough
    to contain many particles.


    Population-specific quantities are distinct: [thermal_electron_density](name:thermal_electron_density)
    and [fast_electron_density](name:fast_electron_density) denote component densities,
    while [total_electron_density](name:total_electron_density) denotes the explicit
    aggregate over the free-electron populations in a decomposition, for example $n_{e,\mathrm{tot}}
    = n_{e,\mathrm{thermal}} + n_{e,\mathrm{fast}}$ when those are the only components.
    Spatially averaged quantities such as [line_averaged_electron_density](name:line_averaged_electron_density)
    and [volume_averaged_electron_density](name:volume_averaged_electron_density)
    are separate from this local density.'
  unit: m^-3
  physics_domain: equilibrium
  links:
  - name:neutral_density
  - name:thermal_electron_density
  - name:fast_electron_density
  - name:total_electron_density
  - name:line_averaged_electron_density
