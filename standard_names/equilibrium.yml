- name: gap_at_plasma_boundary
  kind: scalar
  status: active
  description: Minimum geometric clearance between the plasma separatrix and the nearest
    limiter or wall element.
  documentation: 'The plasma-boundary gap is the shortest Euclidean separation between
    the last closed magnetic-flux surface, or separatrix, and any limiter or wall
    element. It characterizes the closest plasma-facing boundary clearance.


    The gap is defined by


    $$

    d_{\mathrm{gap}}=\min_{\mathbf{x}\in\Gamma_{\mathrm{sep}},\,\mathbf{y}\in\Gamma_{\mathrm{pw}}}\left\|\mathbf{x}-\mathbf{y}\right\|_2

    $$


    where $d_{\mathrm{gap}}$ is the plasma-boundary gap, $\mathbf{x}$ is a point on
    the separatrix $\Gamma_{\mathrm{sep}}$, $\mathbf{y}$ is a point on the combined
    limiter-or-wall boundary $\Gamma_{\mathrm{pw}}$, and $\|\mathbf{x}-\mathbf{y}\|_2$
    is their Euclidean distance.


    The quantity applies to the plasma separatrix and the nearest eligible limiter
    or wall element, with aggregation by the minimum over all eligible boundary-point
    pairs. The geometric points are interpreted in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    This quantity is a shortest geometric clearance, not a radial coordinate, a distance
    to an arbitrarily selected wall point, or an average over the wall. The separatrix
    is the boundary identified by the [normalized poloidal flux coordinate of the
    plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary);
    the gap then measures its closest separation from plasma-facing material.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/boundary/closest_wall_point/distance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-closest_wall_point-distance
    dd_documentation:
      leaf: Distance to the plasma boundary
      parent_path: equilibrium/time_slice/boundary/closest_wall_point
      parent: Position and distance to the plasma boundary of the point of the first
        wall which is the closest to plasma boundary
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Distance from the nearest first-wall point to the reconstructed
        plasma boundary. Quantifies the plasma-wall gap at the closest wall location,
        a key geometric parameter for limiter and confinement margin assessment.
      kind: llm
  - dd_path: equilibrium/time_slice/boundary_separatrix/closest_wall_point/distance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary_separatrix-closest_wall_point-distance
    dd_documentation:
