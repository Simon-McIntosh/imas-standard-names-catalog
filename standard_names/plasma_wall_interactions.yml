- name: ion_charge_state_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Outgoing energy flux per unit plasma-facing wall area produced when
    incident plasma ions of a specified species and charge state recombine at the
    surface, restricted to the ion-associated channel and summed over surface recombination
    channels and emitted product species and states.
  documentation: 'Ion charge-state energy flux at the wall due to recombination quantifies
    the rate at which recombination-associated energy from incident plasma ions of
    a specified species and charge state leaves a plasma-facing surface per unit area.
    It is the ion-associated component for that incident-ion population, not the incident
    plasma energy flux or heat deposited in the wall material.


    The ion charge-state recombination energy flux at wall location $\mathbf{x}_w$
    for incident species $i$ and charge state $\zeta$ is defined as the product-energy
    moment of the outgoing ion-associated recombination source:


    $$

    Q^{\mathrm{ion}}_{\mathrm{rec},i,\zeta}(\mathbf{x}_w) = \sum_{c,\,a,\,k}\int E_\mathrm{out}\,\frac{d\Gamma^{\mathrm{ion}}_{i,\zeta,c,a,k}}{dE_\mathrm{out}}(\mathbf{x}_w,E_\mathrm{out})\,dE_\mathrm{out}

    $$


    where $i$ identifies the incident-ion species, $\zeta$ the incident-ion charge
    state, $c$ an ion-associated surface recombination or neutralization channel,
    $a$ the emitted product species, $k$ the product internal state or emission class,
    $E_\mathrm{out}$ the energy carried into the plasma-facing half-space by an emitted
    product or quantum, and $d\Gamma^{\mathrm{ion}}_{i,\zeta,c,a,k}/dE_\mathrm{out}$
    the corresponding outgoing recombination-product flux distribution with respect
    to product energy. For discrete product energies, the integral is replaced by
    the corresponding sum.


    This quantity resolves the incident-ion species and charge state within the ion-associated
    recombination energy channel. Summing over incident-ion charge states and incident-ion
    species gives [ion energy flux at the wall due to recombination](name:ion_energy_flux_at_wall_due_to_recombination);
    the broader [energy flux at the wall due to recombination](name:energy_flux_at_wall_due_to_recombination)
    also includes recombination energy channels outside this ion-associated component.
    It is the energy-weighted counterpart of [particle flux at the wall due to recombination](name:particle_flux_at_wall_due_to_recombination)
    for the same surface recombination source.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: ion_charge_state
    operator_kind: qualifier
  sources:
  - dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/emitted/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-energy_fluxes-recombination-ion-state-emitted-values
    dd_documentation:
