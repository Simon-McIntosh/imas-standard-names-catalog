- name: major_radius_of_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the reference point defining the distance
    between the plasma boundary and the first wall in an equilibrium reconstruction.
  documentation: 'The major radius $R_{\mathrm{gap}}$ of the reference point used
    to define the plasma boundary gap, a control parameter for the distance between
    the separatrix and the first wall in tokamaks. This coordinate is part of a set
    of gap definitions that describe the plasma position and shape relative to the
    surrounding vessel, and is derived from equilibrium reconstruction (e.g., EFIT,
    LIUQE). Together with the vertical coordinate $Z_{\mathrm{gap}}$ (see `vertical_coordinate_of_gap_reference_point`),
    it defines the location of a specific gap measurement used in real-time plasma
    position control and pulse scheduling. Typical values for $R_{\mathrm{gap}}$ range
    from 1.5 to 3.0 m for medium-size tokamaks (e.g., DIII-D, ASDEX Upgrade) and up
    to 6.2 m for ITER, depending on the vessel geometry and the gap reference point.
    This quantity is also closely related to the major radius of the separatrix and
    the plasma boundary (see `major_radius_of_separatrix`).


    Sign convention: Positive when the gap reference point is at a larger major radius
    than the machine symmetry axis.


    See also the plasma boundary gap reference defined by the poloidal flux geometry
    and the corresponding `vertical_coordinate_of_gap_reference_point`.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/gap/r
    dd_path: equilibrium/time_slice/boundary_separatrix/gap/r
    status: composed
  - id: dd:pulse_schedule/position_control/gap/r
    dd_path: pulse_schedule/position_control/gap/r
    status: vocab_gap
- name: major_radius_of_strike_point
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the point where the secondary separatrix
    intersects the divertor target plate.
  documentation: "The major radius of the strike point is the $R$ coordinate, in the\
    \ IMAS cylindrical $(R, \\phi, Z)$ frame, of the intersection between the secondary\
    \ separatrix (divertor leg) and the divertor target plate. This quantity is critical\
    \ for divertor heat load management, as the strike point position determines the\
    \ peak heat flux deposition area. It is obtained from equilibrium reconstruction\
    \ using magnetic diagnostics and is used together with $\\texttt{major\\_radius\\\
    _of\\_magnetic\\_axis}$ and $\\texttt{major\\_radius\\_of\\_x\\_point}$ to characterize\
    \ the plasma boundary geometry. Typical strike point major radii lie in the range\
    \ 1.5\u20133.0 m for medium-size tokamaks, depending on the divertor configuration\
    \ and magnetic equilibrium.\n\nSign convention: Positive when the strike point\
    \ lies at a major radius $R > 0$ in the cylindrical frame.\n\nSee also $\\texttt{major\\\
    _radius\\_of\\_closest\\_wall\\_point}$ for the first wall intersection coordinate,\
    \ and $\\texttt{distance\\_of\\_secondary\\_separatrix}$ for the radial separation\
    \ between inner and outer strike points."
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
