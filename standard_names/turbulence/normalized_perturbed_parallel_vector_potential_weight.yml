name: normalized_perturbed_parallel_vector_potential_weight
status: draft
cocos_transformation_type: one_like
description: Fractional amplitude of the perturbed parallel vector potential relative
  to the total perturbed field amplitude in a gyrokinetic eigenmode.
documentation: "In gyrokinetic eigenvalue analyses, each eigenmode is characterized\
  \ by three fluctuating field components: the electrostatic potential $\\delta\\\
  phi$, the parallel vector potential $\\delta A_\\parallel$, and the parallel magnetic\
  \ field perturbation $\\delta B_\\parallel$. The normalized perturbed parallel vector\
  \ potential weight $w_{A_\\parallel}$ is defined as $w_{A_\\parallel} = |\\delta\
  \ A_\\parallel| / (|\\delta\\phi| + |\\delta A_\\parallel| + |\\delta B_\\parallel|)$,\
  \ where each amplitude is evaluated in normalized (gyro-Bohm) units. A value close\
  \ to unity indicates a predominantly electromagnetic, shear-Alfv\xE9nic character\
  \ of the mode (e.g., kinetic ballooning modes or microtearing modes), while a value\
  \ near zero signals an electrostatic-dominated instability such as ITG or TEM. Typical\
  \ values range from $\\lesssim 0.01$ for electrostatic modes to $\\sim 0.3$\u2013\
  $0.5$ for strongly electromagnetic modes at high $\\beta$. The companion weights\
  \ `normalized_perturbed_electrostatic_potential_weight` and `normalized_perturbed_parallel_magnetic_field_weight`\
  \ complete the decomposition and sum to unity. See also `normalized_perturbed_parallel_vector_potential_real_part`\
  \ for the eigenfunction itself."
