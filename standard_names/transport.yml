    dd_path: plasma_transport/model/ggd/ion/particles/flux_parallel/values
    status: composed
- name: parallel_ion_state_momentum_damping_rate
  kind: scalar
  status: draft
  description: Inverse relaxation time for dissipation of the field-aligned flow momentum
    of a specific ion charge state, driven by Coulomb collisions and neoclassical
    viscous stresses.
  documentation: "The parallel ion state momentum damping rate $\\nu_\\parallel$ is\
    \ the inverse time scale at which the magnetic-field-aligned flow momentum of\
    \ an ion species in a specified charge state is removed by collisional friction,\
    \ pitch-angle scattering, and neoclassical viscous stresses. It provides charge-state\
    \ resolution of the parallel momentum sink, distinguishing contributions from\
    \ individual ionization levels and enabling accurate tracking of impurity momentum\
    \ balance across species.\n\nThe rate enters the parallel component of the ion\
    \ momentum transport equation as a linear sink:\n\n$$\n\\frac{\\partial u_\\parallel}{\\\
    partial t} = \\cdots - \\nu_\\parallel \\, u_\\parallel\n$$\n\nwhere $u_\\parallel\
    \ = \\mathbf{u} \\cdot \\hat{b}$ is the parallel flow velocity of the charge state,\
    \ $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along the local magnetic\
    \ field $\\mathbf{B}$, and $\\nu_\\parallel$ is this damping rate. The parallel\
    \ component is distinguished from the poloidal and radial projections: see [poloidal_ion_state_momentum_damping_rate](name:poloidal_ion_state_momentum_damping_rate)\
    \ and [radial_ion_state_momentum_damping_rate](name:radial_ion_state_momentum_damping_rate).\
    \ The charge-state-summed counterpart is [parallel_ion_momentum_damping_rate](name:parallel_ion_momentum_damping_rate),\
    \ and this quantity is a directional component of [ion_state_momentum_damping_rate](name:ion_state_momentum_damping_rate).\
    \ The rate is computed from neoclassical transport theory or Fokker\u2013Planck\
    \ kinetic models as a function of plasma density, temperature, ion charge, and\
    \ collisionality regime.\n\nSign convention: Positive when the parallel momentum\
    \ of the ion charge state is being dissipated, corresponding to a damping sink\
    \ acting to reduce the parallel flow velocity toward zero."
  unit: s^-1
  physics_domain: transport
  links:
  - name:poloidal_ion_state_momentum_damping_rate
