- name: angle_of_iron_core_segment
  kind: scalar
  status: active
  description: "Signed orientation angle of a slanted side in a poloidal cross-section,\
    \ measured from the outward major-radius direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is a signed inclination angle for an oriented slanted
    side or edge in a poloidal cross-section. It characterizes orientation relative
    to the outward major-radius direction and is independent of the side''s length.
    The representative [alpha angle of an iron core segment](name:alpha_angle_of_iron_core_segment)
    is a concrete instance.


    The inclination $\theta$ is defined from the oriented side unit vector $\hat{s}$
    by


    $$

    \theta = \operatorname{atan2}(\hat{s}\cdot\hat{Z},\hat{s}\cdot\hat{R})

    $$


    where $\hat{R}$ and $\hat{Z}$ are the outward radial and upward vertical unit
    vectors in the right-handed cylindrical $(R,\phi,Z)$ frame, and $\hat{s}$ is the
    oriented unit vector along the side. The toroidal unit vector is $\hat{\phi}$,
    completing the basis. This angle describes cross-sectional orientation rather
    than the side length, for which [major length of an iron core segment](name:major_length_of_iron_core_segment)
    is a distinct quantity.


    Sign convention: Positive when the oriented side direction is rotated from the
    outward $+\hat{R}$ direction toward $+\hat{Z}$.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:alpha_angle_of_iron_core_segment
- name: alpha_angle_of_iron_core_segment
  kind: scalar
  status: active
  description: Signed inclination of the alpha-side edge of an iron core segment cross-section,
    measured from the outward major-radius direction toward increasing vertical height.
  documentation: 'The alpha angle is the signed orientation of the designated alpha-side
    edge of an iron core segment in the poloidal cross-section of the right-handed
    cylindrical $(R, \phi, Z)$ frame. It identifies the alpha-side orientation and
    is independent of the edge length.


    For an oriented alpha-side vector with signed radial and vertical components $\Delta
    R$ and $\Delta Z$, the angle is defined by


    $$

    \alpha = \operatorname{atan2}(\Delta Z,\Delta R)

    $$


    where $\alpha$ is the alpha angle, $\Delta R$ is the component along the outward
    major-radius direction, and $\Delta Z$ is the component along the vertical direction.
    This quantity is the alpha-side specialization of the general [iron core segment
    orientation angle](name:angle_of_iron_core_segment), not a length or cross-sectional
    dimension.


    Sign convention: Positive when the oriented alpha-side vector is inclined from
    the outward $+R$ direction toward increasing $Z$.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:angle_of_iron_core_segment
  arguments:
  - name: angle_of_iron_core_segment
    operator: alpha
    operator_kind: qualifier
  sources:
  - dd_path: iron_core/segment/geometry/oblique/alpha
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/iron_core.html#iron_core-segment-geometry-oblique-alpha
    dd_documentation:
      leaf: Inclination of first angle TBD
      parent_path: iron_core/segment/geometry/oblique
      parent: Trapezoidal description of the element
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "First inclination angle (\u03B1) of the oblique (trapezoidal/parallelogram)\
        \ cross-sectional geometry of an iron core segment, measured counter-clockwise\
        \ from a reference axis. Part of the geometric parametrisation of transformer\
        \ core elements."
      kind: llm
- name: area_of_correction_coil
  kind: scalar
  status: active
  description: Non-negative full geometric area of the conducting material in one
    correction-coil cross-section, taken perpendicular to the local conductor path
    and treated as constant along the coil length.
  documentation: 'Non-negative full geometric area of the conducting material in one
    correction-coil cross-section is the cross-sectional measure of the electrical
    conductor on a plane normal to the local conductor path. It is a property of one
    correction-coil conductor element, not a sum over separate turns or parallel conductor
    elements.


    The area includes the conducting material in that cross-section and excludes voids,
    insulation, coolant channels, nonconducting supports, and any winding-pack or
    coil-footprint area outside the conductor material. For hollow or compound conductors,
    only regions that are part of the electrical conductor are included.


    It is distinct from [radius_of_correction_coil](name:radius_of_correction_coil),
    [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil), and [width_of_correction_coil](name:width_of_correction_coil),
    which specify particular dimensions of a cross-section; different cross-sectional
    shapes can have the same area.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_poloidal_field_coil
  - name:inner_radius_of_correction_coil
  - name:width_of_correction_coil
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/cross_section/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-conductor-cross_section-area
    dd_documentation:
      leaf: Area of the conductor cross-section, derived from the above geometric
        data
      parent_path: coils_non_axisymmetric/coil/conductor/cross_section
      parent: The cross-section perpendicular to the conductor contour is described
        by a series of contour points, given by their relative position with respect
        to the start point of the first element. This cross-section is assumed constant
        for all elements.
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of a non-axisymmetric coil conductor, derived
        from its geometric contour. Characterizes the conductor cross-section, assumed
        constant along the conductor length, for ELM control, error field, or RMP
        coils.
      kind: llm
- name: area_of_passive_loop
  kind: scalar
  status: active
  description: Area of a passive loop is the non-negative cross-sectional area of
    conducting material in a passive loop element, taken on a section normal to the
    local current path. It excludes the aperture enclosed by the loop.
  documentation: 'Area of a passive loop is the non-negative cross-sectional area
    of the solid conducting material of a passive conducting loop element, evaluated
    on a surface normal to the local current path. It is a material cross-section
    of the conductor, not the aperture enclosed by the loop or the area swept out
    by the loop centerline.


    The general geometric definition is the area of the conducting region $\mathcal{S}$
    in that normal cross-section:


    $$

    A = \int_{\mathcal{S}} dS

    $$


    where $A$ is the passive-loop conductor area, $\mathcal{S}$ is the subset of the
    section occupied by conducting material, and $dS$ is the scalar surface-area element.


    For an annular cross-section, this definition gives $A = \pi(r_o^2-r_i^2)$, where
    $r_i$ and $r_o$ are the [inner](name:inner_radius_of_passive_loop) and [outer](name:outer_radius_of_passive_loop)
    radii measured from the annulus center to the conducting boundaries. For a non-annular
    cross-section, $\mathcal{S}$ is the bounded conducting region defined by the conductor
    geometry; parameters such as [thickness](name:thickness_of_passive_loop), width,
    or height describe that boundary but are not themselves the area.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_passive_loop
  - name:inner_radius_of_passive_loop
  sources:
  - dd_path: pf_passive/loop/element/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_passive.html#pf_passive-loop-element-area
    dd_documentation:
      leaf: Cross-sectional areas of the element
      parent_path: pf_passive/loop/element
      parent: Each loop is comprised of a number of cross-section elements described  individually
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of an individual passive conductor loop element.
        Used in electromagnetic circuit modelling of the tokamak passive conducting
        structures for eddy current and vertical stability analysis.
      kind: llm
- name: area_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Non-negative full geometric area of the conducting cross section of\
    \ one poloidal-field-coil element in a poloidal plane at fixed toroidal angle\
    \ \u03C6 of the right-handed cylindrical (R, \u03C6, Z) frame, where R is major\
    \ radius and Z is vertical height."
  documentation: 'Non-negative full geometric area of the conducting cross section
    of one poloidal-field-coil element is the surface measure of the conductor region
    enclosed by that element boundary. It is defined in a poloidal plane at fixed
    toroidal angle $\phi$ of the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For an arbitrary conductor cross-section, the area is the integral of the differential
    surface measure over the conductor region $\mathcal{S}$:


    $$

    A = \int_{\mathcal{S}} dS

    $$


    where $A$ is the area of the poloidal-field-coil element, $\mathcal{S}$ is the
    conductor region in the poloidal plane, and $dS$ is the differential surface measure
    on that plane.


    The quantity is per coil element, not a sum over multiple elements or over a complete
    coil. For a rectangular cross-section aligned with the $R$ and $Z$ directions
    of the right-handed cylindrical $(R, \phi, Z)$ frame, $A = W H$, where $W$ is
    [width_of_poloidal_field_coil](name:width_of_poloidal_field_coil) and $H$ is [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil);
    [thickness_of_poloidal_field_coil](name:thickness_of_poloidal_field_coil) is a
    separate geometric extent and is not the radial width in this relationship. For
    an annular cross-section, $A = \pi(r_\mathrm{out}^2-r_\mathrm{in}^2)$, where $r_\mathrm{out}$
    is [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    and $r_\mathrm{in}$ is [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).
    An insulation envelope, winding-pack envelope, or effective conducting area is
    a distinct quantity unless it is defined by the same boundary as $\mathcal{S}$.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  sources:
  - dd_path: pf_active/coil/element/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-area
    dd_documentation:
      leaf: Cross-sectional areas of the element
      parent_path: pf_active/coil/element
      parent: Each PF coil is comprised of a number of cross-section elements described  individually
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of an individual element of a poloidal field
        (PF) coil, describing the conductor cross-section geometry used in electromagnetic
        and structural modelling of the coil assembly.
      kind: llm
