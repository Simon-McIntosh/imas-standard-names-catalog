- name: maximum_power_at_outer_divertor_target
  kind: scalar
  status: active
  description: Maximum total power deposited on the outer divertor target by all incident
    energy channels over a specified interval, evaluated from the wetted strike-zone
    power.
  documentation: 'Maximum total power deposited on the outer divertor target by all
    incident energy channels over a specified time interval is the largest target-integrated
    deposited energy-transfer rate attained during that interval. The outer divertor
    target is the target on the larger-major-radius side in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The maximum is defined from the instantaneous [power at the outer divertor target](name:power_at_outer_divertor_target)
    by


    $$

    P_{\mathrm{max,outer}} = \max_{t_1 \leq t \leq t_2} P_{\mathrm{outer}}(t)

    $$


    where $P_{\mathrm{max,outer}}$ is the maximum deposited power, $P_{\mathrm{outer}}(t)$
    is the all-channel power integrated over the wetted outer-target strike zone at
    time $t$, and $t_1$ and $t_2$ are the bounds of the specified interval, measured
    in seconds.


    This quantity is a temporal maximum, not an instantaneous value, time integral,
    or average. It is the outer-target counterpart of [maximum power at the inner
    divertor target](name:maximum_power_at_inner_divertor_target) and remains distinct
    from mechanism-resolved power or the instantaneous parent quantity.'
  unit: W
  physics_domain: divertor_physics
