- name: length_of_pellet
  kind: scalar
  status: draft
  description: Axial length of the intact cylindrical pellet before injection or shattering,
    measured end to end along the pellet symmetry axis.
  documentation: 'Pellet length is the end-to-end axial extent of an intact cylindrical
    pellet before injection or shattering. It specifies the pellet geometry together
    with the pellet diameter and is independent of the later fragment distribution
    produced during shattering.


    For an ideal right circular cylindrical pellet, the geometric volume is related
    to length and diameter by:


    $$

    V = \frac{\pi}{4} d^2 L

    $$


    where $V$ is the initial pellet volume in m$^3$, $d$ is the pellet diameter in
    m, and $L$ is the pellet length in m. This volume characterizes the initial geometry;
    the delivered material inventory also depends on pellet density, composition,
    shape fidelity, and losses or changes during injection, shattering, ablation,
    and transport.


    In practice, pellet length is determined from the fabrication or injector geometry
    and may be checked by mechanical, optical, or cryogenic metrology before launch.
    It is used with diameter to estimate initial pellet volume and, when combined
    with material density and isotopic or impurity composition, the initial mass and
    particle content.


    Typical lengths for cryogenic pellets used in shattered pellet injection are about
    0.003-0.05 m, depending on injector bore, pellet material, and disruption-mitigation
    requirements.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:diameter_of_pellet
  - name:normalized_atomic_count_of_pellet
- name: maximum_gas_flow
  kind: scalar
  status: draft
  description: Operational upper limit on pressure-weighted gas throughput through
    a gas injection valve, expressed as gas pressure times volumetric flow rate in
    the injection direction.
  documentation: 'Maximum gas flow $Q_{\max}$ is the upper engineering limit on pressure-weighted
    volumetric gas throughput deliverable by a gas injection valve. It bounds the
    instantaneous gas_flow in the positive injection direction and, together with
    [minimum_gas_flow](name:minimum_gas_flow), defines the usable valve throughput
    range.


    The pressure-throughput limit is defined from the product of gas pressure and
    volumetric flow rate over the allowed operating states of the valve:


    $$

    Q_{\max} = \max_{\mathrm{allowed}} \left(p\,\dot{V}\right)

    $$


    where $p$ is the gas pressure in Pa at the specified reference section, $\dot{V}$
    is the volumetric flow rate in m$^3$ s$^{-1}$ for the same gas state, and $Q_{\max}$
    is in Pa m$^3$ s$^{-1}$.


    The value is usually obtained from valve specifications, calibrated flow-bench
    measurements, or pressure-decay tests under specified gas species, temperature,
    and upstream/downstream pressure conditions. It is a pressure-throughput limit,
    not directly a particle source rate: for an ideal gas at gas temperature $T_g$,
    the molecule rate is $\dot{N}=Q/(k_B T_g)$ and the molar rate is $\dot{n}=Q/(R
    T_g)$, so comparison with total_upper_source_rate requires the gas temperature
    and composition.


    Typical maximum throughputs range from $0.01-10\ \mathrm{Pa\,m^3\,s^{-1}}$ for
    small fueling or impurity-seeding valves, $10-10^3\ \mathrm{Pa\,m^3\,s^{-1}}$
    for high-capacity gas puffing valves, and $10^3-10^6\ \mathrm{Pa\,m^3\,s^{-1}}$
    for fast disruption-mitigation injection systems.


    Sign convention: Positive when gas is transported from the upstream supply side
    of the valve toward the injection outlet.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:minimum_gas_flow
- name: methane_carbon_13_prefill_count
  kind: scalar
  status: draft
  description: Equivalent-electron count of carbon-13-labeled methane injected during
    the prefill phase before plasma breakdown.
  documentation: 'Methane-carbon-13 prefill count is the total amount of $^{13}\mathrm{CH}_4$
    introduced before plasma breakdown, expressed as an equivalent-electron count.
    Each neutral $^{13}\mathrm{CH}_4$ molecule contributes 10 equivalent electrons:
    6 from the carbon-13 atom and 4 from the hydrogen atoms.


    The equivalent-electron count is obtained from the accumulated molecular amount
    over the prefill interval:


    $$

    N_{e,\mathrm{eq}}^{^{13}\mathrm{CH}_4,\mathrm{prefill}} = 10\,N_{^{13}\mathrm{CH}_4,\mathrm{prefill}}
    = 10\int_{t_0}^{t_\mathrm{bd}} \dot{N}_{^{13}\mathrm{CH}_4}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{^{13}\mathrm{CH}_4,\mathrm{prefill}}$ is the equivalent-electron
    count with unit 1, $N_{^{13}\mathrm{CH}_4,\mathrm{prefill}}$ is the accumulated
    molecular count with unit 1, $\dot{N}_{^{13}\mathrm{CH}_4}$ is the molecular injection
    rate, $t_0$ is the start of the prefill interval, and $t_\mathrm{bd}$ is the plasma-breakdown
    time.


    In practice this quantity is computed from calibrated gas-valve throughput, reservoir
    pressure drop, or mass-flow measurements integrated over the prefill interval
    and then multiplied by the factor 10. It is used to compare isotopically labeled
    methane fueling or wall-conditioning doses on the same equivalent-electron basis
    as other prefill gasses.


    Typical values range from 0 to $10^{23}$ in small and medium devices, depending
    on vessel volume, requested prefill pressure, gas species mix, and the fraction
    of methane that is carbon-13 labeled.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_methane_carbon_13_count_due_to_gas_injection
  - name:accumulated_hydrogen_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/methane/value
    dd_path: summary/gas_injection_prefill/methane/value
    status: attached
  - id: dd:summary/gas_injection_prefill/methane_carbon_13/value
    dd_path: summary/gas_injection_prefill/methane_carbon_13/value
    status: composed
- name: methane_carbon_13_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of carbon-13-labeled methane (13CH4) into
    the plasma vessel, expressed as an equivalent-electron rate where each molecule
    contributes 10 equivalent electrons.
  documentation: 'Carbon-13-labeled methane (13CH4) is deployed as a controlled tracer
    gas for erosion and carbon transport studies in fusion devices, because the stable
    13C isotope can be discriminated spectroscopically from the naturally occurring
    12C background. The equivalent-electron weighting assigns a factor of 10 to each
    injected 13CH4 molecule, reflecting the total electron count of the neutral species:
    atomic number $Z = 6$ for carbon plus $Z = 1$ for each of the four hydrogen atoms.


    The instantaneous equivalent-electron source rate $\dot{S}$ accumulates over time
    to give the total equivalent-electron inventory:


    $$

    N(t) = \int_0^t \dot{S}(t'') \, dt''

    $$


    where $N(t)$ is the cumulative equivalent-electron count tracked by [accumulated
    13CH4 injection](name:accumulated_methane_carbon_13_count_due_to_gas_injection).


    The rate is inferred from upstream reservoir pressure and valve conductance measurements.
    For comprehensive carbon gas accounting, this quantity complements [carbon_rate_due_to_gas_injection](name:carbon_source_rate_due_to_gas_injection),
    which sums contributions from all carbon-bearing gas species.


    Sign convention: Positive when 13CH4 gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_methane_carbon_13_count_due_to_gas_injection
  - name:carbon_source_rate_due_to_gas_injection
- name: methane_source_rate
  kind: scalar
  status: draft
  description: Instantaneous molecular source rate of methane (CH4) delivered to the
    plasma vessel by gas injection systems, expressed as CH4 molecules per second.
    It is not an electron-equivalent rate; under complete ionization, one methane
    molecule corresponds to ten electron-equivalent particles.
  documentation: 'Methane source rate is the instantaneous number of CH4 molecules
    introduced into the plasma vessel per unit time by gas injection. It is a molecular
    flow rate: one count corresponds to one methane molecule entering the vessel,
    independent of later dissociation, ionization, pumping, recycling, or wall retention.


    For a cumulative methane molecule count $N_{\mathrm{CH}_4}(t)$, the rate $S_{\mathrm{CH}_4}(t)$
    is defined by:


    $$

    S_{\mathrm{CH}_4}(t) = \frac{dN_{\mathrm{CH}_4}(t)}{dt}

    $$


    where $t$ is time in seconds and $N_{\mathrm{CH}_4}(t)$ is the cumulative number
    of methane molecules delivered over the chosen accounting interval. Integrating
    $S_{\mathrm{CH}_4}$ between two times gives the number of methane molecules delivered
    during that interval, not necessarily a retained inventory in the plasma.


    Each methane molecule contains one carbon atom and four hydrogen atoms. If the
    delivered methane is converted to constituent atom rates, the associated carbon
    atom rate is $S_C = S_{\mathrm{CH}_4}$ and the associated hydrogen atom rate is
    $S_H = 4S_{\mathrm{CH}_4}$, linking this quantity to [carbon_rate_due_to_gas_injection](name:carbon_source_rate_due_to_gas_injection)
    and [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection).
    If an electron-equivalent source rate is required using atomic numbers, complete
    ionization gives $S_{e,\mathrm{eq}} = (Z_C + 4Z_H)S_{\mathrm{CH}_4} = 10S_{\mathrm{CH}_4}$
    with $Z_C=6$ and $Z_H=1$; that is a derived convention, not the methane molecular
    rate itself.


    In practice this rate is computed from calibrated gas-injection throughput, valve
    timing, reservoir pressure and temperature, mass-flow-controller calibration,
    and gas composition. A pressure-volume throughput can be converted to a molecular
    rate using the ideal-gas relation with the local gas temperature; corrections
    may be needed for line conductance, valve response, calibration-gas differences,
    and back-pressure near the injection point.


    Typical methane puff rates in fusion experiments are about $10^{17}$-$10^{21}$
    s^-1. Short diagnostic tracer puffs often lie near the lower end of this range,
    while stronger impurity-seeding, wall-conditioning, or disruption-mitigation-related
    injections can approach $10^{21}$-$10^{22}$ s^-1 depending on the injector and
    pulse duration.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:carbon_source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
- name: minimum_gas_flow
  kind: scalar
  status: draft
  description: Minimum gas flow is the smallest pressure-volume gas throughput that
    a gas injection valve can reliably deliver. It is the lower bound of the controllable
    flow range.
  documentation: 'Minimum gas flow is the lower reliable operating limit of the pressure-volume
    throughput delivered by a gas injection valve. It is a static hardware capability
    that bounds the same physical quantity represented by gas_flow, while [maximum_gas_flow](name:maximum_gas_flow)
    gives the corresponding upper limit.


    The underlying pressure-volume gas throughput is defined by


    $$

    Q = p\,\dot{V}

    $$


    where $Q$ is the gas throughput in $\mathrm{Pa\,m^3\,s^{-1}}$, $p$ is the gas
    pressure in $\mathrm{Pa}$, and $\dot{V}$ is the volumetric flow rate in $\mathrm{m^3\,s^{-1}}$.
    The minimum gas flow is the calibrated lower reliable value of $Q$ for the valve,
    not a particle source rate; for an ideal gas, an approximate molecular source
    rate is $\dot{N}=Q/(k_B T_g)$, where $T_g$ is the gas temperature and $k_B$ is
    Boltzmann''s constant.


    In practice this limit is obtained from factory qualification, bench calibration,
    or in-system flow calibration by identifying the smallest command or valve opening
    that gives reproducible throughput within the required tolerance. It is used in
    fueling, wall-conditioning, density-control, and disruption-mitigation gas systems
    to determine the smallest controllable gas puff and, together with the maximum
    flow, the valve turndown ratio.


    Typical minimum reliable flows range from about $10^{-4}$-$10^{-1}\ \mathrm{Pa\,m^3\,s^{-1}}$
    for fine metering or leak valves, $10^{-2}$-$10^{1}\ \mathrm{Pa\,m^3\,s^{-1}}$
    for general fueling valves, and can be higher for large fast-injection or disruption-mitigation
    valves. The applicable value is strongly dependent on valve design, gas species,
    upstream pressure, pulse duration, and calibration tolerance.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:maximum_gas_flow
- name: molecular_neutral_species_flow_at_outlet
  kind: scalar
  status: draft
  description: Throughput of a molecular neutral species at a gas pumping duct outlet,
    equal to the volumetric pumping speed at the outlet multiplied by the outlet partial
    pressure of that species.
  documentation: 'Molecular neutral species flow at an outlet is the pressure-weighted
    gas throughput of one molecular neutral species crossing the outlet of a pumping
    duct. It represents the exhaust rate in vacuum-engineering units and is specific
    to the species partial pressure, not the total gas pressure when multiple species
    are present.


    The outlet throughput is defined by the product of local pumping speed and species
    partial pressure at the outlet:


    $$

    Q_{s,\mathrm{out}} = S_{\mathrm{out}}\,p_{s,\mathrm{out}}

    $$


    where $Q_{s,\mathrm{out}}$ is the molecular neutral species throughput, $S_{\mathrm{out}}$
    is the volumetric pumping speed at the duct outlet, and $p_{s,\mathrm{out}}$ is
    the outlet partial pressure of species $s$.


    In practice this quantity is inferred from calibrated pumping speed, conductance
    modeling, and pressure or residual-gas measurements near the duct outlet. For
    an ideal gas at temperature $T$, the corresponding particle flow is $\dot{N}_s
    = Q_{s,\mathrm{out}}/(k_B T)$ and the molar flow is $\dot{n}_s = Q_{s,\mathrm{out}}/(R
    T)$.


    Typical values range from about 0.01-100 Pa m^3 s^-1 for individual molecular
    species in fusion-vacuum pumping systems, with larger transient or high-throughput
    exhaust cases reaching 100-1000 Pa m^3 s^-1.


    Sign convention: Positive when the molecular neutral species is extracted through
    the duct outlet in the pumping direction away from the vessel.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links: []
  sources:
  - id: dd:gas_pumping/duct/species/flow_rate
    dd_path: gas_pumping/duct/species/flow_rate
    status: composed
- name: neon_prefill_count
  kind: scalar
  status: draft
  description: Total number of neon atoms injected as gas during the plasma prefill
    phase, expressed as an electron-equivalent count using the 10 bound electrons
    of neutral neon.
  documentation: 'Neon prefill count is the total amount of neon gas introduced before
    plasma breakdown or current initiation, represented as an electron-equivalent
    particle count. It is species resolved and prefill-only: it excludes neon injected
    after breakdown and excludes other gas species used for fueling, wall conditioning,
    or radiative control.


    The electron-equivalent normalization is defined from the injected neutral-neon
    atom count:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{Ne,prefill}} = Z_{\mathrm{Ne}}\,N_{\mathrm{atom}}^{\mathrm{Ne,prefill}}

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{Ne,prefill}}$ is the neon prefill count, $N_{\mathrm{atom}}^{\mathrm{Ne,prefill}}$
    is the number of injected neon atoms during the prefill interval, and $Z_{\mathrm{Ne}}=10$
    is the atomic number of neon. This convention is an accounting normalization based
    on neutral atomic composition; it is not a statement that the gas is fully ionized
    during the prefill phase.


    In practice, the injected atom count is obtained from calibrated gas-injection
    measurements such as valve throughput, pressure-volume-temperature accounting,
    or mass-flow integration over the prefill time window. The electron-equivalent
    count allows gas quantities for different species to be compared on a common atomic-electron
    basis while preserving the species identity.


    Typical values are scenario and device dependent. Neon prefill may be zero when
    not used; nonzero values in tokamak applications can span roughly $10^{18}$-$10^{22}$
    electron-equivalent counts, with larger values possible for large vacuum volumes
    or deliberately high-quantity gas-puff scenarios.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:prefill_count
  - name:krypton_prefill_count
  - name:deuterium_prefill_count
  - name:tritium_prefill_count
  - name:accumulated_neon_count
- name: neon_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of neon gas into the plasma vessel, expressed
    in equivalent electrons per second.
  documentation: 'The neon source rate quantifies the instantaneous rate at which
    neon gas is introduced into the plasma vessel through gas injection systems. Each
    neon atom (atomic number $Z = 10$) contributes 10 equivalent electrons to the
    count, so the source rate equals 10 times the atomic injection rate expressed
    in atoms per second. Neon seeding is widely applied in fusion devices to control
    edge radiation and protect plasma-facing components from excessive heat loads,
    and is also employed in disruption mitigation scenarios requiring rapid radiative
    cooling. The source rate is inferred from calibrated flow controllers or gas injection
    valve diagnostics, with values ranging from $10^{20}$ to $10^{23}$ s$^{-1}$ depending
    on the seeding scenario. Integrating this rate over time yields the [accumulated
    neon count](name:accumulated_neon_count). Analogous injection rates for other
    species include [nitrogen_source_rate](name:nitrogen_source_rate) and [oxygen_source_rate](name:oxygen_source_rate),
    which follow the same equivalent-electron convention.


    Sign convention: Positive when neon gas is being injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_neon_count
  - name:nitrogen_source_rate
  - name:oxygen_source_rate
- name: net_efficiency_of_plant_system
  kind: scalar
  status: draft
  description: Net efficiency of a plant system is the dimensionless ratio of signed
    net electrical power exported by the plant to the total electrical power consumed
    by plant subsystems over the same operating interval.
  documentation: 'Net efficiency of a plant system characterizes plant-level electrical
    gain by comparing signed net electrical export with the electrical power consumed
    by plant subsystems inside the chosen accounting boundary. It is a dimensionless
    ratio, so the numerator and denominator should refer to the same operating interval
    and accounting boundary.


    The net plant efficiency is defined from signed net electrical power and plant
    electrical consumption:


    $$

    \eta_{\mathrm{net,plant}} = \frac{P_{\mathrm{net}}}{P_{\mathrm{plant}}}

    $$


    where $P_{\mathrm{net}}$ is the [net electrical power of the plant system](name:net_power_of_plant_system)
    in W and $P_{\mathrm{plant}}$ is the [electrical power consumed by the plant system](name:net_absorbed_power_of_plant_system)
    in W. The denominator is the positive sum of included internal electrical loads,
    commonly represented inline as $P_{\mathrm{plant}} = \sum_i P_{\mathrm{cons},i}$
    over plant subsystems such as heating and current drive, cryogenic cooling, pumping,
    control systems, and other auxiliaries as applicable.


    The quantity is computed from plant-level electrical accounting, using time-averaged
    powers or interval-integrated energies divided over the same duration. Unlike
    [thermal efficiency of a plant system](name:thermal_efficiency_of_plant_system),
    which relates electrical generation to thermal input, net efficiency includes
    the effect of recirculating electrical loads and therefore measures net electrical
    gain relative to internal electrical consumption.


    Representative values are negative during net-importing intervals, 0 at net electrical
    break-even, between 0 and 1 when net export is positive but smaller than internal
    consumption, and greater than 1 when net export exceeds internal consumption.
    No universal numerical range applies because the value depends on the plant boundary,
    operating phase, auxiliary loads, and averaging interval.


    Sign convention: Positive when signed net electrical power is exported from the
    plant to an external electrical network or load.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:net_power_of_plant_system
  - name:net_absorbed_power_of_plant_system
  - name:thermal_efficiency_of_plant_system
  arguments:
  - name: efficiency_of_plant_system
    operator: net
    operator_kind: qualifier
  sources:
  - id: dd:balance_of_plant/gain_plant
    dd_path: balance_of_plant/gain_plant
    status: composed
- name: nitrogen_prefill_count
  kind: scalar
  status: draft
  description: Nitrogen prefill count is the accumulated amount of nitrogen injected
    during the plasma prefill phase, expressed as a dimensionless equivalent-electron
    count. Each nitrogen atom contributes 7 count units; molecular nitrogen N2 contributes
    14 through its two constituent nitrogen atoms.
  documentation: 'Nitrogen prefill count quantifies the externally injected nitrogen
    delivered during the plasma prefill interval, expressed in equivalent-electron
    count units. The quantity counts nitrogen nuclei, not gas molecules: molecular
    nitrogen contributes through its two constituent nitrogen atoms.


    Using the equivalent-electron convention, the count is


    $$

    C_\mathrm{N} = Z_\mathrm{N} N_\mathrm{N}

    $$


    where $C_\mathrm{N}$ is the nitrogen prefill count in dimensionless count units,
    $N_\mathrm{N}$ is the dimensionless number of nitrogen atoms injected, and $Z_\mathrm{N}=7$
    is the dimensionless atomic number of nitrogen. For molecular nitrogen, $N_\mathrm{N}=2N_{\mathrm{N}_2}$,
    so each $\mathrm{N}_2$ molecule contributes 14 count units.


    In practice, this quantity is computed from the calibrated nitrogen throughput
    during the prefill time window, using mass-flow-controller data, valve conductance
    calibrations, or reservoir pressure-drop measurements. It includes only externally
    commanded nitrogen injection during prefill, typically before breakdown or before
    the explicitly defined end of the prefill interval; it excludes nitrogen from
    wall recycling, desorption, neutral beams, pellets, and gas injection occurring
    after the prefill phase.


    Typical trace nitrogen prefill values are about $10^{17}$-$10^{21}$ dimensionless
    count units, while large devices or deliberately nitrogen-rich prefill scenarios
    can reach $10^{21}$-$10^{23}$. As a scale reference, a $1\,\mathrm{Pa\,m^3}$ dose
    of $\mathrm{N}_2$ at 300 K contains about $2.4\times10^{20}$ molecules and corresponds
    to about $3.4\times10^{21}$ nitrogen prefill count units.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ammonia_prefill_count
  - name:accumulated_hydrogen_prefill_count
  - name:accumulated_nitrogen_count
- name: nitrogen_source_rate
  kind: scalar
  status: draft
  description: Instantaneous neutral nitrogen gas injection rate into the plasma vessel,
    reported as an electron-equivalent particle rate. For molecular nitrogen N2, the
    value is 14 times the molecular flow rate because each molecule contains 14 electrons.
  documentation: 'Nitrogen source rate is the rate at which neutral nitrogen gas is
    introduced into the plasma vessel, expressed as an electron-equivalent particle
    rate. The convention is molecular nitrogen, so each injected N2 molecule contributes
    the equivalent of 14 electrons before any dissociation or ionization processes
    are considered.


    The electron-equivalent rate is related to the molecular nitrogen flow rate by:


    $$

    S_{\mathrm{N},e} = 14\,\dot{N}_{\mathrm{N}_2}

    $$


    where $S_{\mathrm{N},e}$ is the nitrogen source rate in electron-equivalent s^-1
    and $\dot{N}_{\mathrm{N}_2}$ is the molecular N2 flow rate in molecules s^-1.
    Equivalently, a quoted electron-equivalent rate may be converted back to molecular
    flow as $\dot{N}_{\mathrm{N}_2}=S_{\mathrm{N},e}/14$.


    In practice this quantity is inferred from calibrated gas-delivery measurements
    such as mass-flow calibration, valve conductance calibration, pressure-rise measurements,
    or gas-balance calculations. It represents the neutral gas admitted through the
    vessel boundary, not the subsequent local ionization, radiation, or impurity transport
    response inside the plasma.


    Typical nitrogen injection rates used for impurity seeding are about 10^18-10^22
    s^-1 in electron-equivalent units, with 0 s^-1 corresponding to no nitrogen injection
    and larger transient rates possible in large devices or short gas puffs. Physically
    valid values are finite and non-negative; if a molecular N2 flow is reported instead,
    its numerical value is smaller by a factor of 14.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_nitrogen_count
  - name:neon_source_rate
  - name:oxygen_source_rate
  - name:ammonia_source_rate
- name: normalized_atomic_count_of_pellet
  kind: scalar
  status: draft
  description: 'Dimensionless pellet propellant-gas atom inventory equal to the physical
    number of atoms divided by 10^20. It counts atoms, not gas entities: a diatomic
    molecule contributes two atoms and a monatomic atom contributes one.'
  documentation: 'Normalized atomic count of a pellet is the total number of atoms
    in the pellet gas load expressed in units of $10^{20}$ atoms. It is an atom inventory
    rather than a molecule inventory, so molecular species are converted to their
    constituent atoms before summing.


    For a mixture of gas species or molecular forms, the normalized atomic count is


    $$

    N_{\mathrm{atom},n} = \frac{N_{\mathrm{atom}}}{10^{20}} = \frac{1}{10^{20}} \sum_s
    A_s N_s

    $$


    where $N_{\mathrm{atom},n}$ is dimensionless, $N_{\mathrm{atom}}$ is the physical
    atom count, $N_s$ is the count of gas entities of species or molecular form $s$,
    and $A_s$ is the atomicity in atoms per entity. The denominator represents $10^{20}$
    atoms, so $N_{\mathrm{atom},n}=1$ corresponds to $10^{20}$ atoms.


    In practice this quantity is computed from the gas amount, pellet composition,
    injection calibration, or pressure-volume-temperature estimates using an appropriate
    equation of state. For molecular gasses, the measured molecule count is multiplied
    by atomicity before normalization; for mixtures, all components are summed after
    this conversion.


    The physical range is $0 \le N_{\mathrm{atom},n} < \infty$. A value of 0 indicates
    no atoms in the counted gas load, and values greater than 1 are allowed because
    the normalization is a scale factor, not a fraction or probability. Device-independent
    numerical ranges are not implied because pellet inventories depend strongly on
    pellet size, species, and injection scenario.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:atomic_count_of_pellet
  arguments:
  - name: atomic_count_of_pellet
    operator: normalized
    operator_kind: qualifier
- name: outer_atomic_count_of_pellet
  kind: scalar
  status: draft
  description: Total number of atoms contained in the outer shell layer of a composite
    pellet. It counts atomic nuclei in that layer independent of molecular binding
    and complements the inner-core inventory in the whole-pellet atom count.
  documentation: 'Outer atomic count of a pellet is the total inventory of atomic
    nuclei contained in the pellet''s outer shell layer. It is an unnormalized count:
    molecules, compounds, or mixtures are converted to their constituent atoms before
    summation, so one D$_2$ molecule contributes two atoms. Together with the [core
    atomic count of a pellet](name:core_atomic_count_of_pellet), it contributes to
    the total [atomic count of a pellet](name:atomic_count_of_pellet) and may be used
    to form a [normalized atomic count of a pellet](name:normalized_atomic_count_of_pellet).


    For a shell volume $V_\mathrm{outer}$ with local atomic number density $n_\mathrm{atom}$,
    the count is


    $$

    N_\mathrm{outer} = \int_{V_\mathrm{outer}} n_\mathrm{atom}(\mathbf{x})\, dV

    $$


    where $N_\mathrm{outer}$ is the outer-shell atom count, $n_\mathrm{atom}$ is the
    total number density of atoms after accounting for molecular stoichiometry and
    species composition, and $\mathbf{x}$ labels position within the shell material.


    In practice, the count is computed from the shell geometry, material density,
    isotopic or elemental composition, and molecular formula of the pellet material.
    For multi-species shells, each component contributes according to its molar or
    atomic fraction; for example, molecular deuterium is counted by atoms rather than
    by molecules. The related [density of pellet](name:core_density_of_pellet) helps
    determine the number density used in the inventory calculation.


    Typical values range from about $10^{18}$-$10^{21}$ atoms for small fueling or
    tracer shell payloads and about $10^{21}$-$10^{23}$ atoms for large mitigation
    pellets, depending on pellet size, shell thickness, material density, and composition.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:core_atomic_count_of_pellet
  - name:atomic_count_of_pellet
  - name:normalized_atomic_count_of_pellet
  - name:core_density_of_pellet
