- name: safety_factor
  kind: scalar
  status: draft
  description: Safety factor q evaluated at the 95% poloidal flux surface, a standard
    global MHD stability indicator.
  documentation: "The safety factor $q_{95} = d\\Phi_{\\rm tor}/d\\Phi_{\\rm pol}$\
    \ evaluated at the surface enclosing 95% of the poloidal magnetic flux is a key\
    \ dimensionless ratio of toroidal to poloidal field line turns. This edge quantity\
    \ is routinely used in tokamak operations to assess proximity to the $q=2$ and\
    \ $q=3$ rational surfaces that seed tearing modes and the $q=3/2$ neoclassical\
    \ tearing mode threshold; typical H-mode values range from 3 to 5. $q_{95}$ is\
    \ derived from equilibrium reconstruction (e.g., EFIT, LIUQE) using external magnetic\
    \ measurements and internal profile constraints. The quantity is positive by convention;\
    \ the sign of $q$ follows the sign of the toroidal plasma current in the $(R,\
    \ \\phi, Z)$ frame. See also [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis)\
    \ for the core value and [poloidal_magnetic_flux](name:poloidal_magnetic_flux)\
    \ for the underlying flux coordinate. \n\nSign convention: Positive when the plasma\
    \ current flows in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ viewed from above $+\\hat{Z}$)."
  unit: '1'
  physics_domain: equilibrium
  links:
