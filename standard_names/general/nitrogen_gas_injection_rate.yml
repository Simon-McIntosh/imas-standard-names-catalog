name: nitrogen_gas_injection_rate
status: draft
cocos_transformation_type: one_like
description: Instantaneous molecular flow rate of nitrogen gas being injected into
  the vacuum vessel, expressed in molecules per second.
documentation: "The nitrogen gas injection rate $\\Gamma_{\\mathrm{N}_2}$ (in s$^{-1}$)\
  \ quantifies the number of N$_2$ molecules per unit time delivered through gas injection\
  \ valves. Its time integral gives the accumulated nitrogen injection: $N_{\\mathrm{acc}}(t)\
  \ = \\int_0^t \\Gamma_{\\mathrm{N}_2}(t')\\,dt'$. Nitrogen seeding is the primary\
  \ radiative-cooling actuator in metallic-wall devices (e.g., ITER, JET-ILW, ASDEX\
  \ Upgrade) for divertor heat-flux mitigation; typical feedback-controlled rates\
  \ span $10^{19}$\u2013$10^{22}$ s$^{-1}$ depending on device size and detachment\
  \ requirements. The rate is measured by calibrated piezoelectric or electromagnetic\
  \ valves with known conductance curves, or inferred from plenum pressure time derivatives.\
  \ Real-time control loops adjust $\\Gamma_{\\mathrm{N}_2}$ to maintain a target\
  \ radiated-power fraction or divertor temperature."
