name: shattered_pellet_injector_trigger_time
status: draft
cocos_transformation_type: one_like
description: Time at which the trigger command is issued to the shattered pellet injector
  power supply, referenced to the discharge management system clock.
documentation: "The trigger time $t_{\\rm trig}$ records when the discharge management\
  \ system (DMS) sends the firing command to the SPI injector's propellant valve or\
  \ fast gas generator. It is the earliest time stamp in the SPI event chain: $t_{\\\
  rm trig} < t_{\\rm shatter} < t_{\\rm arr}$. In disruption mitigation applications,\
  \ $t_{\\rm trig}$ is typically issued by a real-time disruption predictor once thermal\
  \ or current quench precursors are detected; the latency between the disruption\
  \ decision and actual material delivery is bounded below by the interval $t_{\\\
  rm arr} - t_{\\rm trig}$, which sets the system response time. Typical values of\
  \ $t_{\\rm trig}$ relative to the disruption onset are 10\u2013100 ms before the\
  \ thermal quench, depending on the prediction algorithm and injector technology.\
  \ See `shattered_pellet_shattering_time` for the downstream shattering event and\
  \ `shattered_pellet_fragment_arrival_time_at_optical_diagnostic` for the fragment\
  \ detection time."
