- name: faraday_angle
  kind: scalar
  status: draft
  description: Signed rotation angle of the plane of linear polarization of an electromagnetic
    probe beam after propagation through a magnetized plasma. It is produced by Faraday
    circular birefringence and is proportional to wavelength squared times the line
    integral of electron density multiplied by the magnetic-field component along
    the beam path.
  documentation: 'Faraday angle is the signed change in orientation of a linearly
    polarized electromagnetic wave after it traverses a magnetized plasma. The rotation
    arises because the left- and right-circularly polarized components of the wave
    have different refractive indices in the presence of a magnetic field component
    along the beam path. Since a linear polarization plane is physically unchanged
    by a rotation of $\pi$, reported angles may be phase-unwrapped when rotations
    exceed this periodicity.


    For a cold plasma away from wave resonances, the single-pass Faraday angle is
    commonly approximated by:


    $$

    \chi_F = C_F \lambda^2 \int_{\mathcal{L}} n_e(l)\,B_\parallel(l)\,dl

    $$


    where $\chi_F$ is the Faraday angle, $C_F \simeq 2.63 \times 10^{-13}\,\mathrm{T}^{-1}$
    in SI units, $\lambda$ is the vacuum wavelength, $n_e$ is the electron number
    density, $l$ is distance along the beam path $\mathcal{L}$, and $B_\parallel =
    \mathbf{B}\cdot\hat{k}$ is the magnetic-field component along the propagation
    direction $\hat{k}$.


    Faraday angle is measured by polarimetry, using the change between the injected
    and received linear polarization states of a probing beam. It is computed in forward
    models by integrating density and magnetic-field information along the optical
    path, with corrections for refraction, multiple passes, window rotations, and
    calibration offsets when they are significant.


    Typical absolute values in magnetically confined plasmas range from 0.01-5 rad
    for far-infrared or submillimeter polarimetry, depending strongly on wavelength,
    path length, density, and magnetic-field strength. Low-density plasmas or short
    chords can give milliradian rotations, while long paths through dense, high-field
    plasmas can produce rotations of several radians.


    Sign convention: Positive when the emergent polarization plane is rotated counter-clockwise
    relative to the incident plane as viewed looking along the beam propagation direction.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_averaged_electron_density
- name: frequency_of_diagnostic_antenna
  kind: scalar
  status: draft
  description: Temporal frequency of the electromagnetic wave to which a diagnostic
    antenna channel transmits, receives, or is tuned. It sets the wave interaction
    scale; for some diagnostics it helps infer resonance, cutoff, or phase-shift locations,
    but it does not by itself specify a plasma position.
  documentation: 'Frequency of a diagnostic antenna is the non-negative temporal oscillation
    rate of the electromagnetic field selected by a transmitting or receiving diagnostic
    channel. It identifies the spectral component used by the diagnostic and is distinct
    from a plasma characteristic frequency, although it is often compared with characteristic
    frequencies such as cutoff, plasma, or cyclotron frequencies.


    The temporal frequency $f$ is related to angular frequency $\omega$ by:


    $$

    f = \frac{\omega}{2\pi}

    $$


    where $f$ is in hertz and $\omega$ is in radians per second. In vacuum the corresponding
    wavelength is $c/f$, where $c$ is the speed of light in meters per second.


    In practice, the frequency is set by the transmitter synthesizer, local oscillator,
    receiver filter, or channel passband. Reflectometry and refractometry use one
    or more probe frequencies and interpret the measured phase, amplitude, or reflection
    behavior through the plasma dispersion relation; a cutoff or phase-shift location
    also depends on density, magnetic field, launch geometry, polarization, and propagation
    effects. For electron cyclotron emission diagnostics, a channel frequency is compared
    with the electron cyclotron resonance condition; in the nonrelativistic, zero-Doppler
    limit $f \simeq s e B/(2\pi m_e)$, where $s$ is the harmonic number, $e$ is the
    elementary charge in coulombs, $B$ is magnetic-field strength in tesla, and $m_e$
    is the electron mass in kilograms. This comparison can help localize emission,
    but the antenna frequency alone is not a universal radial coordinate.


    Typical diagnostic antenna frequencies in magnetized fusion experiments range
    from about $10^6-10^{12}$ Hz depending on the diagnostic. Microwave reflectometry
    and refractometry commonly use about $10^{10}-2 \times 10^{11}$ Hz, while electron
    cyclotron emission channels often use about $5 \times 10^{10}-10^{12}$ Hz. The
    appropriate range is determined by the target density, magnetic-field strength,
    propagation accessibility, and hardware bandwidth.'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  - name:voltage_of_diagnostic_antenna
  - name:frequency_of_electron_cyclotron_heating_antenna
- name: launched_wave_duration
  kind: scalar
  status: draft
  description: Elapsed time for one complete swept-frequency launch of a probing electromagnetic
    wave, from the beginning of the sweep to its end.
  documentation: 'Launched wave duration is the elapsed time over which a probing
    electromagnetic wave is emitted while completing one frequency sweep. It describes
    the time span of the swept launch itself, independent of how the received signal
    is analyzed.


    For a single sweep, the duration is the difference between the end and start times
    of the launched frequency ramp:


    $$

    \Delta t_{\mathrm{sw}} = t_{\mathrm{end}} - t_{\mathrm{start}}

    $$


    where $\Delta t_{\mathrm{sw}}$ is the launched wave duration in seconds, $t_{\mathrm{start}}$
    is the time at which the sweep begins, and $t_{\mathrm{end}}$ is the time at which
    the sweep ends.


    In swept-frequency reflectometry or refractometry, this duration is determined
    from the launch timing waveform or from the timing markers that delimit one sweep.
    The corresponding frequency evolution during the same interval is described by
    [launched_wave_frequency](name:launched_wave_frequency). This quantity represents
    the same sweep-duration concept as [launched_duration](name:launched_wave_duration),
    with the wording emphasizing the emitted probing wave.


    Typical values are diagnostic- and operating-mode dependent, because the selected
    sweep duration must cover the desired frequency span while providing the required
    temporal sampling of the plasma evolution.'
  unit: s
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - id: dd:reflectometer_fluctuation/channel/sweep_time
    dd_path: reflectometer_fluctuation/channel/sweep_time
    status: composed
- name: length_of_electron_cyclotron_beam
  kind: scalar
  status: draft
  description: Curvilinear arc length measured along the propagation path of an electron
    cyclotron beam-tracing ray. It parameterizes position along the wave trajectory
    and can be evaluated at any point along the beam path through the plasma.
  documentation: 'Length of an electron cyclotron beam is the accumulated curvilinear
    distance along the beam-tracing ray from a chosen launch or reference point to
    a point on the propagation path. It is a path coordinate for the wave trajectory,
    not the straight-line distance between endpoints, and it can be evaluated at any
    point reached by the traced beam.


    For a ray position vector $\mathbf{r}(s)$ parameterized by an arbitrary monotonic
    ray parameter $s$, the arc length $\ell$ is defined by the line integral along
    the path:


    $$

    \ell(s) = \int_{s_0}^{s} \left|\frac{d\mathbf{r}}{ds''}\right|\,ds''

    $$


    where $\ell$ is the arc length in meters, $\mathbf{r}$ is the ray position in
    meters, $s_0$ is the launch or reference value of the ray parameter, and $s''$
    is the integration variable. If the ray is parameterized by physical time $t$
    in seconds, the equivalent differential relation is $d\ell = |\mathbf{v}_g|\,dt$,
    where $\mathbf{v}_g = \partial\omega/\partial\mathbf{k}$ is the group velocity
    in meters per second, $\omega$ is angular frequency in radians per second, and
    $\mathbf{k}$ is the wave vector in radians per meter.


    In beam-tracing calculations, this quantity is computed by integrating incremental
    path segments along the numerically traced ray or beam centerline. It is used
    to locate absorption, emission, refraction, or diagnostic weighting along the
    electron cyclotron wave path without assuming that the path is straight.


    Typical values range from about 0.1-10 m in laboratory magnetic-confinement devices,
    depending on launcher position, viewing geometry, plasma size, and the amount
    of refraction along the trajectory.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_absorbed_power_of_beam_tracing_beam
  - name:length_of_beam_tracing_beam
- name: length_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Total non-negative arclength of the optical fiber used by a Fiber Optic
    Current Sensor, measured along the fiber centerline. It sets the optical propagation
    length and scales the accumulated Faraday rotation, while the spatial trajectory
    of the winding determines which magnetic-field line integral is sampled.
  documentation: 'Length of a Fiber Optic Current Sensor fiber is the total arclength
    of the sensing optical fiber centerline between the defined optical endpoints.
    It is a non-negative geometric length and does not by itself define the magnetic-field
    integration path; the full path requires the fiber trajectory, for example coordinates
    $R(s)$, $\phi(s)$, and $Z(s)$ in the right-handed cylindrical $(R, \phi, Z)$ frame
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The arclength is defined from the fiber centerline curve $\mathbf{r}(u)$ as:


    $$

    L = \int_{u_0}^{u_1} \left|\frac{d\mathbf{r}}{du}\right|\,du

    $$


    where $L$ is the fiber length in meters, $\mathbf{r}$ is the centerline position
    in meters, and $u$ is any monotonic parameter along the fiber. The Faraday rotation
    measured by the sensor is governed more generally by the line integral $\Phi_F
    = \int_\Gamma V\,\mathbf{B}\cdot d\mathbf{l}$, where $\Phi_F$ is the optical rotation
    in radians, $V$ is the [Verdet constant](name:verdet_constant_of_fiber_optic_current_sensor)
    in rad T$^{-1}$ m$^{-1}$, $\mathbf{B}$ is the magnetic field in tesla, and $d\mathbf{l}$
    is the oriented fiber path element in meters.


    In practice, the length is obtained from fiber manufacture records, installation
    metrology, optical time-domain measurements, or by integrating the surveyed centerline
    of the installed winding. Related geometric quantities describe parts of the trajectory
    or optical setup, such as the [vertical outline](name:vertical_outline_of_fiber_optic_current_sensor),
    which constrains vertical positions of outline points, and the [initial angle],
    which specifies an azimuthal reference for the spun fiber rather than the total
    path length. The [spun wavelength] characterizes the twist period along this same
    length.


    Typical installed sensing-fiber lengths are 10-100 m for compact or partial windings
    and 50-300 m for full-vessel tokamak installations, depending on vessel size,
    number of turns, routing allowances, and lead-in fiber included in the sensing
    path.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:verdet_constant_of_fiber_optic_current_sensor
  - name:vertical_outline_of_fiber_optic_current_sensor
- name: parallel_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Dimensionless signed fraction of the beam power flow parallel to the
    local magnetic field along a beam-tracing ray path, normalized to the initial
    launched power. It is based on the time-averaged wave power flow; positive values
    indicate local propagation along the magnetic field.
  documentation: 'The parallel normalized power of a beam-tracing beam is the field-aligned
    component of the beam power flow divided by the initial launched power. It describes
    how much of the surviving wave power is transported along the local magnetic field
    direction at each point on the ray path, with the sign retained.


    For an arc-length coordinate $s$ along the beam path, the quantity is defined
    by


    $$

    p_{\parallel,\mathrm{norm}}(s) = \frac{\mathbf{P}(s) \cdot \hat{\mathbf{b}}(s)}{P_0}

    $$


    where $\mathbf{P}(s)$ is the time-averaged beam power-flow vector obtained from
    the electromagnetic Poynting flux integrated over the local beam cross-section
    and has unit W, $P_0$ is the initial launched power and has unit W, and $\hat{\mathbf{b}}(s)=\mathbf{B}(s)/|\mathbf{B}(s)|$
    is the dimensionless unit vector along the local magnetic field.


    In beam tracing, this quantity is computed from the ray direction, wave amplitude
    or wave-action evolution, and the local magnetic-field direction. Absorption,
    mode conversion, or other power-loss mechanisms reduce the magnitude as the beam
    propagates; the sign is evaluated locally throughout propagation relative to $\hat{\mathbf{b}}(s)$,
    not fixed by the initial launch direction. It complements the perpendicular normalized
    power by separating field-aligned and cross-field transport of the time-averaged
    wave power.


    Typical values are between -1 and 1 for passive propagation without gain. Values
    near 1 indicate power flow nearly parallel to the local magnetic field, values
    near -1 indicate power flow nearly antiparallel to it, and values near 0 indicate
    predominantly perpendicular power flow or a strongly attenuated beam.


    Sign convention: Positive when the time-averaged beam power flow at the evaluated
    point has a component in the direction of the local magnetic field.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_normalized_power_of_beam_tracing_beam
  - name:length_of_electron_cyclotron_beam
  - name:parallel_refractive_index
  - name:electron_absorbed_power_of_beam_tracing_beam
- name: perpendicular_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Non-negative fraction of the beam power-flow vector lying in the plane
    perpendicular to the local magnetic field, normalized to the initial launch power.
    It is a magnitude, not a signed projection onto a chosen perpendicular direction.
  documentation: 'Perpendicular normalized power of a beam-tracing beam is the magnitude
    of the beam power flow across the local magnetic-field direction, divided by the
    initial launched beam power. The perpendicular direction is the plane normal to
    the local magnetic field, so this scalar does not choose or encode a signed direction
    within that plane.


    A dimensionally consistent definition uses the beam power-flow vector, not a Poynting
    flux density:


    $$

    p_{\perp,N}(s) = \frac{P_\perp(s)}{P_0} = \frac{\left|\mathbf{P}(s) - \left[\mathbf{P}(s)\cdot\hat{\mathbf{b}}(s)\right]\hat{\mathbf{b}}(s)\right|}{P_0}

    $$


    where $s$ parameterizes position along the ray path, $\mathbf{P}(s)$ is the local
    beam power-flow vector integrated over the beam cross-section, $P_0$ is the initial
    launch power, and $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the unit vector
    along the local magnetic field. Both $\mathbf{P}$ and $P_0$ represent powers in
    W, making $p_{\perp,N}$ dimensionless.


    In beam tracing, this quantity is computed from the local group-velocity or power-flow
    direction together with the remaining beam power after absorption, emission, or
    gain processes included in the model. It is used to distinguish cross-field transport
    of wave energy from power flow along the magnetic field.


    Typical values range from 0-1 in passive calculations normalized to the launched
    power. Values near 0 indicate propagation nearly along the magnetic field, while
    values near the local normalized remaining beam power indicate predominantly cross-field
    propagation; values above 1 require net amplification or a source term in the
    modeled beam power.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:initial_power_of_beam_tracing_beam
  - name:parallel_normalized_power_of_beam_tracing_beam
- name: perpendicular_wave_vector_magnitude
  kind: scalar
  status: draft
  description: Magnitude of the wave vector component perpendicular to the local equilibrium
    magnetic field, setting the cross-field spatial scale of wave-plasma coupling
    and turbulent density fluctuation backscattering.
  documentation: 'The perpendicular wave vector magnitude $k_\perp$ is the modulus
    of the wave propagation vector projected onto the plane perpendicular to the local
    equilibrium magnetic field $\mathbf{B}_0$. It governs the cross-field spatial
    periodicity of the wave and is fundamental to both electromagnetic wave propagation
    calculations and fluctuation turbulence diagnostics. This scalar quantity is the
    magnitude of perpendicular_wave_vector.


    $$

    k_\perp = |\mathbf{k} - (\mathbf{k} \cdot \hat{b})\hat{b}|

    $$


    where $\hat{b} = \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along the equilibrium
    magnetic field and $\mathbf{k}$ is the full wave vector.


    In Doppler reflectometry, the Bragg backscattering condition selects density fluctuations
    at $k_\perp \approx 2 k_0 \sin\theta$, where $k_0 = \omega/c$ is the vacuum wavenumber
    and $\theta$ is the beam tilt angle. The doppler_frequency shift of the backscattered
    signal is proportional to $k_\perp$ times the perpendicular plasma flow velocity,
    enabling turbulence wavenumber spectra to be resolved across the spectral_frequency
    grid. In wave beam tracing, $k_\perp$ characterizes the cross-field propagation
    scale relevant for finite Larmor radius effects and mode conversion, complementing
    the field-aligned scale encoded in the [parallel_refractive_index](name:parallel_refractive_index).


    Typical values in Doppler reflectometry range from a few to several hundred m$^{-1}$,
    probing turbulent density fluctuations from the plasma minor-radius scale down
    toward the ion gyroradius.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_refractive_index
- name: plasma_frequency_at_measurement_position
  kind: scalar
  status: draft
  description: Local electron plasma frequency at the diagnostic measurement position,
    set by the electron number density through the cold-plasma oscillation frequency.
    In reflectometry it equals the ordinary-mode cutoff frequency at the reflection
    layer; for extraordinary-mode operation it is the density-dependent plasma-frequency
    component inferred from the cutoff condition.
  documentation: 'Electron plasma frequency at a measurement position is the local
    natural oscillation frequency of electrons about a quasi-neutral ion background,
    with ions effectively fixed on the electron time scale. It is a specialized form
    of frequency_at_measurement_position in which the frequency is determined by local
    electron density and fundamental constants.


    The electron plasma frequency is defined by


    $$

    f_{pe} = \frac{1}{2\pi}\sqrt{\frac{n_e e^2}{\varepsilon_0 m_e}}

    $$


    where $n_e$ is the local electron number density in $\mathrm{m}^{-3}$, $e=1.602\,176\,634\times10^{-19}\
    \mathrm{C}$ is the elementary charge, $\varepsilon_0=8.854\,187\,8128\times10^{-12}\
    \mathrm{F}\,\mathrm{m}^{-1}$ is the vacuum permittivity, and $m_e=9.109\,383\,7015\times10^{-31}\
    \mathrm{kg}$ is the electron mass. The reported value is the cycles-per-second
    frequency in Hz; for harmonic fields written as $\mathrm{Re}\{\tilde{A}\exp(-i\omega
    t)\}$, $\omega=2\pi f_{pe}$, and the opposite exponential convention gives the
    same frequency.


    In ordinary-mode (O-mode) reflectometry, the cold-plasma cutoff layer is the location
    where the probing [frequency_of_diagnostic_antenna](name:frequency_of_diagnostic_antenna)
    equals $f_{pe}$, so the local density follows from $n_e=(2\pi f_{pe})^2\varepsilon_0
    m_e/e^2$. In extraordinary-mode (X-mode) reflectometry, cutoff frequencies also
    depend on electron cyclotron frequency and propagation geometry; in that case
    this quantity is the density-dependent plasma frequency inferred at the reflection
    layer from the appropriate dispersion relation, not the full X-mode cutoff frequency.


    Typical values in magnetic-confinement plasmas are $2\times10^{10}-3\times10^{11}$
    Hz, corresponding approximately to electron densities from $5\times10^{18}$ to
    $1\times10^{21}\ \mathrm{m}^{-3}$. At $n_e=1\times10^{20}\ \mathrm{m}^{-3}$, $f_{pe}\approx9.0\times10^{10}$
    Hz.'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:frequency_of_diagnostic_antenna
- name: poloidal_perturbed_suprathermal_electron_angle_at_measurement_position
  kind: scalar
  status: draft
  description: Poloidal angular shift of the ECE measurement position caused by suprathermal
    electrons, relative to the thermal-emission position.
  documentation: 'This quantity is the signed poloidal-angle component of the displacement
    between the nominal thermal-electron ECE emission position and the apparent measurement
    position when suprathermal electrons contribute to the emission. The poloidal
    angle $\theta$ is measured around the magnetic axis in a constant-$\phi$ cross-section
    of the right-handed cylindrical $(R, \phi, Z)$ frame, with $\theta=0$ at the outboard
    midplane and $\theta$ increasing from larger $R$ toward $+Z$. It isolates the
    suprathermal-electron contribution rather than a generic viewing or equilibrium-position
    correction.


    The additive correction to the poloidal coordinate of the assigned measurement
    position is represented by:


    $$

    \theta_\mathrm{meas} = \theta_\mathrm{th} + \Delta\theta_\mathrm{supra}

    $$


    where $\theta_\mathrm{meas}$ is the corrected poloidal angle of the measurement
    position, $\theta_\mathrm{th}$ is the poloidal angle inferred for the thermal-emission
    position, and $\Delta\theta_\mathrm{supra}$ is this quantity; all three angular
    quantities are measured in radians.


    The correction is normally obtained by comparing the localization of ECE emission
    for a thermal-electron population with the localization obtained when the suprathermal
    electron population is included, using the viewing geometry and magnetic equilibrium.
    This name refers to the diagnostic measurement position; the related poloidal_suprathermal_electron_perturbed_angle_of_ece_channel_emission_position
    applies specifically to the ECE-channel emission position, while poloidal_perturbed_angle_at_measurement_position
    denotes the corresponding generic poloidal perturbation without specifying suprathermal
    electrons as the cause.


    There is no device-independent typical range for this signed angular offset. It
    is zero when suprathermal-electron effects are absent or negligible, and its magnitude
    depends on the suprathermal distribution, optical depth, observing frequency,
    harmonic, viewing geometry, and equilibrium.


    Sign convention: Positive when $\Delta\theta_\mathrm{supra}$ shifts the assigned
    measurement position in the direction of increasing poloidal angle $\theta$, defined
    from the outboard midplane toward $+Z$ in a constant-$\phi$ cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - id: dd:ece/channel/delta_position_suprathermal/theta
    dd_path: ece/channel/delta_position_suprathermal/theta
    status: composed
- name: radial_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Radial (major-radius) component of the local wave vector along the
    beam tracing ray path.
  documentation: 'The wave vector $\mathbf{k}$ characterizes the local spatial frequency
    and propagation direction of an electromagnetic wave at each point along a beam
    tracing ray. Its radial component $k_R = \mathbf{k} \cdot \hat{R}$ quantifies
    how rapidly the wave phase advances in the major-radius direction $\hat{R}$ of
    the right-handed cylindrical $(R, \phi, Z)$ frame.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the wave vector decomposes
    as:


    $$

    \mathbf{k} = k_R \hat{R} + k_\phi \hat{\phi} + k_Z \hat{Z}

    $$


    where $k_\phi = n_\phi / R$ with $n_\phi$ the toroidal mode number and $R$ the
    major radius in meters, and $k_Z$ is the [vertical wave vector component](name:vertical_wave_vector_of_beam_tracing_beam).
    Together with [toroidal_wave_vector_of_beam_tracing_beam](name:toroidal_wave_vector_of_beam_tracing_beam),
    these three components fully specify the local wave propagation geometry consistent
    with the local dispersion relation $D(\mathbf{k}, \omega, \mathbf{x}) = 0$.


    This component is computed by beam tracing along the ray path for electron cyclotron
    heating, current drive, and electron cyclotron emission diagnostic beams. For
    electron cyclotron waves near 170 GHz, the vacuum wavenumber $|\mathbf{k}_0| =
    \omega/c$ is approximately 3600 m$^{-1}$; in-plasma values of $k_R$ vary along
    the ray according to plasma geometry and the local dispersion relation.


    The dimensionless counterpart [radial_normalized_wave_vector_of_beam_tracing_beam](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    gives the direction cosine $k_R / |\mathbf{k}|$.


    Sign convention: Positive when the radial wave vector component points in the
    direction of increasing major radius $R$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:toroidal_wave_vector_of_beam_tracing_beam
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
- name: radiative_temperature
  kind: scalar
  status: draft
  description: Radiative temperature is the brightness temperature obtained by converting
    electron cyclotron emission intensity measured by an ECE radiometer channel to
    an equivalent blackbody temperature. It approaches the local electron temperature
    at the resonant layer when the selected polarization and propagation path are
    optically thick.
  documentation: 'Radiative temperature is the equivalent blackbody temperature associated
    with the electron cyclotron emission received by a radiometer channel. It represents
    the emitted microwave brightness, not necessarily the kinetic [electron temperature](name:electron_temperature),
    because finite optical depth, polarization coupling, reflections, and absorption
    along the propagation path can make the detected brightness differ from the local
    thermal value.


    For spectral radiance expressed in the Rayleigh-Jeans convention, the energy-equivalent
    radiative temperature is


    $$

    T_\mathrm{rad} = \frac{c^2 I_\nu}{2\nu^2 e}

    $$


    where $I_\nu$ is the calibrated spectral radiance at frequency $\nu$, $c$ is the
    speed of light, and $e$ is the elementary charge. The result $T_\mathrm{rad}$
    is in eV; the corresponding thermodynamic temperature in kelvin is $eT_\mathrm{rad}/k_B$,
    where $k_B$ is the Boltzmann constant. Polarization-specific measurements fold
    the X-mode or O-mode response, mode purity, and coupling efficiency into the calibrated
    radiance used in this definition.


    In practice, radiative temperature is obtained from absolutely calibrated radiometer
    power after correction for receiver gain, offsets, electronic noise, background
    emission, filter bandwidth, antenna pattern, and the channel spectral response.
    Forward calculations use polarized radiative transfer for the selected ordinary
    or extraordinary mode, including emission, absorption, optical depth, relativistic
    broadening, harmonic overlap, and possible mode coupling. The channel frequency
    maps to electron-cyclotron harmonic layers set by the local magnetic-field strength;
    in tokamak geometry this often corresponds to a major-radius location in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is measured from the symmetry axis
    and $Z$ is vertical height.


    Typical thermal ECE radiative temperatures are about 100-1000 eV for cooler edge
    or pedestal sightlines and 1000-20000 eV for hot core sightlines, with higher
    values possible in high-performance plasmas. When the plasma is optically thick,
    $T_\mathrm{rad}$ is a close proxy for local electron temperature and may be compared
    with [electron_temperature_at_magnetic_axis](name:electron_temperature_at_magnetic_axis)
    or [radiative_temperature_at_magnetic_axis](name:radiative_temperature_at_magnetic_axis)
    for central channels. In optically thin regions or channels affected by polarization
    mismatch, mode conversion, or wall reflections, the measured radiative temperature
    can be substantially lower than the local electron temperature.'
  unit: eV
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radiative_temperature_at_magnetic_axis
- name: refractive_index
  kind: vector
  status: draft
  description: Dimensionless refractive-index vector of an electromagnetic wave in
    plasma, equal to the local wave vector divided by the vacuum wave number k0 =
    omega/c.
  documentation: 'The refractive-index vector $\mathbf{N}$ specifies the local phase-gradient
    direction and normalized wavelength of an electromagnetic wave in a plasma. It
    is the wave vector scaled by the vacuum wave number, so its magnitude gives the
    refractive index of the propagating branch when the wave vector is real.


    The defining relation is


    $$

    \mathbf{N} = \frac{\mathbf{k}}{k_0} = \frac{c\,\mathbf{k}}{\omega}

    $$


    where $\mathbf{N}$ is dimensionless, $\mathbf{k}$ is the local wave vector in
    m$^{-1}$, $k_0=\omega/c$ is the vacuum wave number in m$^{-1}$, $\omega$ is the
    angular frequency in rad s$^{-1}$, and $c$ is the speed of light in vacuum in
    m s$^{-1}$. Relative to the magnetic-field unit vector $\hat{b}=\mathbf{B}/|\mathbf{B}|$,
    the linked components are the [parallel refractive index](name:parallel_refractive_index)
    $N_\parallel=\mathbf{N}\cdot\hat{b}$ and the [perpendicular refractive index](name:perpendicular_refractive_index)
    $N_\perp=|\mathbf{N}\times\hat{b}|$.


    In ray-tracing and beam-tracing descriptions, $\mathbf{N}$ is obtained from the
    local electromagnetic dispersion relation and evolves along the trajectory together
    with position. Where a dispersion branch is propagating, $\mathbf{k}$ and $\mathbf{N}$
    are real; near cutoffs or in evanescent regions the relevant dispersion root can
    make one or more components of $\mathbf{k}$ complex, with the imaginary part describing
    spatial attenuation.


    Typical values are dimensionless. In vacuum $|\mathbf{N}|=1$; in weakly dispersive
    propagating plasma waves $|\mathbf{N}|$ is usually of order unity, while individual
    components such as $N_\parallel$ may be much smaller than one or may become larger
    depending on launch angle, plasma density, magnetic field, and the selected wave
    branch.


    Sign convention: Positive when a component of $\mathbf{N}$ has the same sign as
    the corresponding component of the wave vector $\mathbf{k}$ in the chosen basis.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_refractive_index
  - name:perpendicular_refractive_index
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
- name: parallel_refractive_index
  kind: scalar
  status: draft
  description: Projection of the refractive-index vector onto the local equilibrium
    magnetic field direction, equal to the wave vector component parallel to the magnetic
    field normalized by the vacuum wave number.
  documentation: "The parallel refractive index $N_\\parallel$ is the component of\
    \ the refractive-index vector $\\mathbf{N} = \\mathbf{k}/k_0$ projected along\
    \ the local equilibrium magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$, where $k_0 = \\omega/c$ is the vacuum wave number at angular frequency\
    \ $\\omega$ and $c$ is the speed of light in vacuum. It governs the phase velocity\
    \ of a wave along the field line and controls parallel resonance effects including\
    \ Landau damping and transit-time magnetic pumping.\n\nThe defining relation is:\n\
    \n$$\nN_\\parallel = \\mathbf{N} \\cdot \\hat{b} = \\frac{\\mathbf{k} \\cdot \\\
    mathbf{B}}{k_0 |\\mathbf{B}|}\n$$\n\nwhere $\\mathbf{k}$ is the local wave vector\
    \ and $\\mathbf{B}$ is the background magnetic field.\n\nTogether with [perpendicular_refractive_index](name:perpendicular_refractive_index),\
    \ $N_\\parallel$ fully decomposes the parent [refractive_index](name:refractive_index)\
    \ vector into its field-aligned and cross-field components. In beam-tracing or\
    \ ray-tracing calculations, $N_\\parallel$ is evaluated at each point along the\
    \ ray path; for lower hybrid current drive it is a primary launch parameter controlled\
    \ by the phasing between antenna straps, and for electron cyclotron emission diagnostics\
    \ it determines the Doppler shift of the resonance layer.\n\nFor lower hybrid\
    \ waves, $N_\\parallel$ at launch lies in the range 1.5\u20133.5 to satisfy the\
    \ wave accessibility condition in the core plasma. For nearly perpendicular electron\
    \ cyclotron beams, $|N_\\parallel|$ is well below unity.\n\nSign convention: Positive\
    \ when the wave vector projected onto the magnetic field $\\mathbf{B}$ points\
    \ in the same direction as $\\mathbf{B}$."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_refractive_index
  - name:refractive_index
  arguments:
  - name: refractive_index
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: perpendicular_refractive_index
  kind: scalar
  status: draft
  description: Component of the refractive-index vector perpendicular to the local
    equilibrium magnetic field, evaluated at each point along a beam or ray tracing
    path in a magnetized plasma.
  documentation: "The perpendicular refractive index $N_\\perp$ is the magnitude of\
    \ the component of the refractive-index vector $\\mathbf{N} = \\mathbf{k}/k_0$\
    \ (where $\\mathbf{k}$ is the local wave vector and $k_0 = \\omega/c$ is the vacuum\
    \ wave number) that lies perpendicular to the local equilibrium magnetic field\
    \ direction $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$. Together with the [parallel\
    \ refractive index](name:parallel_refractive_index) $N_\\parallel$, it fully characterizes\
    \ the field-aligned decomposition of wave propagation geometry in a magnetized\
    \ plasma.\n\nThe two components satisfy the identity:\n\n$$\nN_\\perp^2 + N_\\\
    parallel^2 = |\\mathbf{N}|^2\n$$\n\nwhere $N_\\parallel = \\mathbf{N} \\cdot \\\
    hat{b}$ and $N_\\perp = |\\mathbf{N} - N_\\parallel \\hat{b}|$. For a cold magnetized\
    \ plasma, the Appleton-Hartree dispersion relation constrains the allowed pairs\
    \ $(N_\\parallel, N_\\perp)$ for each propagating normal mode; cutoff surfaces\
    \ occur where $N_\\perp \\to 0$ and mark wave reflection or mode-conversion layers,\
    \ while cyclotron resonances correspond to $N_\\perp \\to \\infty$.\n\n$N_\\perp$\
    \ is evaluated at each step along beam or ray tracing trajectories and enters\
    \ directly into calculations of single-pass absorption, mode conversion efficiency,\
    \ and wave accessibility for electron cyclotron heating, current drive, and emission\
    \ diagnostics. Typical values for electron cyclotron beams in the plasma core\
    \ range from near zero at cutoff layers to approximately 1\u20133 for O-mode and\
    \ X-mode propagation, depending on wave frequency, local electron density, and\
    \ magnetic field strength.\n\nSign convention: Positive when the refractive-index\
    \ vector has a non-zero component perpendicular to the local equilibrium magnetic\
    \ field direction $\\hat{b}$; $N_\\perp$ is non-negative by construction as it\
    \ represents the magnitude of a vector projection."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_refractive_index
  arguments:
  - name: refractive_index
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
- name: tilt_angle_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Tilt angle of the elliptical beam-spot cross-section for a beam-tracing
    wave beam. It is measured in the plane normal to propagation, from e1 toward e2
    in the local right-handed beam frame (e1, e2, e_parallel), where e_parallel follows
    the beam direction.
  documentation: 'The tilt angle of a beam-tracing beam is the orientation of the
    principal axes of the elliptical beam-spot cross-section in the plane perpendicular
    to the local propagation direction. It specifies how the spot ellipse is rotated
    relative to the transverse axes of the local right-handed beam frame $(\hat{e}_1,\hat{e}_2,\hat{e}_\parallel)$,
    with $\hat{e}_\parallel$ along the beam direction. It is the beam-tracing specialization
    of the more general [tilt_angle_of_wave_beam](name:tilt_angle_of_beam_tracing_beam)
    and should be interpreted together with the transverse spot sizes.


    If the beam spot is represented by the symmetric transverse second-moment matrix
    $\Sigma$ in the basis $(\hat{e}_1,\hat{e}_2)$, the tilt angle $\alpha$ of the
    major principal axis is obtained by diagonalizing that matrix:


    $$

    \alpha = \frac{1}{2}\operatorname{atan2}\!\left(2\Sigma_{12},\,\Sigma_{11}-\Sigma_{22}\right)

    $$


    where $\Sigma_{11}$ and $\Sigma_{22}$ are the second moments along $\hat{e}_1$
    and $\hat{e}_2$, $\Sigma_{12}$ is the cross moment, and $\operatorname{atan2}$
    selects the correct quadrant. Equivalently, $\tan(2\alpha)=2\Sigma_{12}/(\Sigma_{11}-\Sigma_{22})$
    when the denominator is nonzero; the orthogonal principal axis is at $\alpha+\pi/2$.


    In beam-tracing or Gaussian-optics calculations, the spot matrix is propagated
    with the beam through optical elements and plasma, and the tilt is computed from
    the eigenvectors of that matrix at each location. Near launch or reception, it
    can also be inferred from fitted beam patterns or optical design parameters. The
    angle becomes poorly conditioned when the two spot sizes are nearly equal, because
    a circular spot has no unique orientation.


    Typical values are reported modulo $\pi$, commonly in the interval $-\pi/2$ to
    $\pi/2$ rad. Well-aligned beams often have $|\alpha| < 0.2$ rad near launch, while
    astigmatic optics, oblique propagation, or strong refraction can produce rotations
    of order $0.5-1.5$ rad.


    Sign convention: Positive when the major principal axis of the beam-spot ellipse
    is rotated from $\hat{e}_1$ toward $\hat{e}_2$ in the local right-handed beam
    frame $(\hat{e}_1,\hat{e}_2,\hat{e}_\parallel)$.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
