- name: vertical_neutral_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Dimensionless vertical momentum flux-limiter coefficient that scales
    the free-streaming upper bound on neutral-particle momentum-flux density in edge-plasma
    transport closures.
  documentation: 'The vertical neutral momentum flux-limiter coefficient is the vertical
    component of the neutral-particle specialization of the general momentum flux-limiter
    coefficient vector, providing the dimensionless limiter factor for neutral momentum
    transport along the vertical $Z$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame in multi-fluid edge-plasma models. It bounds the vertical neutral
    momentum-flux density by the free-streaming limit when the neutral mean free path
    is large relative to macroscopic gradient scales.


    The vertical component $\alpha_Z$ is defined as the ratio of the magnitude of
    the modeled vertical neutral momentum-flux density to its positive free-streaming
    upper bound:


    $$

    \alpha_Z = \frac{|\Pi_Z|}{\Pi_Z^{\rm free}}, \qquad \Pi_Z^{\rm free} = m_n n_n
    \left(u_Z^{\rm free}\right)^2

    $$


    where $\Pi_Z$ is the modeled vertical neutral momentum-flux density component
    along $\hat{Z}$, $\Pi_Z^{\rm free}$ is the corresponding free-streaming upper
    bound, $m_n$ is the neutral particle mass, $n_n$ is the neutral number density,
    and $u_Z^{\rm free}$ is the nonnegative free-streaming reference speed for neutral
    motion along $\hat{Z}$. The constraint $\alpha_Z \in [0, 1]$ makes the coefficient
    a magnitude limiter; any sign of the vertical momentum flux is carried by $\Pi_Z$,
    not by $\alpha_Z$.


    This quantity is the vertical member of the [neutral momentum flux-limiter coefficient](name:neutral_momentum_flux_limiter_coefficient)
    vector and is distinct from the [parallel neutral momentum flux-limiter coefficient](name:parallel_neutral_momentum_flux_limiter_coefficient),
    which is taken along the magnetic-field direction, and the [toroidal neutral momentum
    flux-limiter coefficient](name:toroidal_neutral_momentum_flux_limiter_coefficient),
    which is taken along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$
    frame. It is a limiter coefficient, not the neutral momentum-flux density itself.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_flux_limiter_coefficient
  - name:parallel_neutral_momentum_flux_limiter_coefficient
