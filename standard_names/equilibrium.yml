- name: flux_surface_averaged_inverse_of_square_of_major_radius
  kind: scalar
  status: active
  description: Flux-surface average of reciprocal squared major radius, providing
    a geometric metric coefficient for parallel-gradient and neoclassical transport
    calculations.
  documentation: 'This quantity is the flux-surface average of the reciprocal square
    of the major radius on a nested equilibrium magnetic flux surface. It is a positive
    geometric metric coefficient used in parallel-gradient operators and neoclassical
    and gyrokinetic transport equations.


    It is defined by


    $$

    g_{m1}(\psi)=\left\langle \frac{1}{R^2}\right\rangle_{\psi}

    $$


    where $g_{m1}$ denotes this metric coefficient, $R$ is the major radius measured
    from the toroidal symmetry axis, $\psi$ is the poloidal magnetic flux labeling
    the surface, and $\langle\cdot\rangle_{\psi}$ denotes the flux-surface average
    on that surface.


    The quantity applies to the entire magnetic flux surface and has no species, field-component,
    or source-process restriction. Its aggregation convention is a flux-surface average
    of the local reciprocal-square geometric factor; it is not the reciprocal square
    of a flux-surface-averaged major radius.


    It is the flux-surface-averaged form of the pointwise [inverse of square of major
    radius](name:inverse_of_square_of_major_radius). It differs from the related [flux-surface-averaged
    inverse of major radius](name:flux_surface_averaged_inverse_of_major_radius),
    which averages the first reciprocal power of $R$ rather than its reciprocal square.'
  unit: m^-2
