      parent: Set of ports (input or output) of the component
      data_type: FLT_1D
      unit: Pa
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Fluid pressure (p) at a component port in the balance-of-plant
        power conversion system. Characterizes the thermodynamic state of the working
        fluid at the interface between connected system components.
      kind: llm
- name: coolant_temperature
  kind: scalar
  status: active
  description: Coolant temperature is the absolute thermodynamic temperature of a
    coolant or working fluid at a plant-system component port. It characterizes the
    local thermal state of the fluid stream.
  documentation: 'Coolant temperature is the absolute thermodynamic temperature of
    a coolant or working fluid at a plant-system component port. It is a local equilibrium
    state variable of the fluid and may denote an unspecified port unless the locus
    is restricted by a more specific name.


    The absolute temperature is the thermodynamic variable conjugate to entropy in
    the fundamental relation for internal energy, equivalently defined by the entropy
    derivative:


    $$

    \frac{1}{T} = \left(\frac{\partial S}{\partial U}\right)_{V,\{N_i\}}

    $$


    where $T$ is coolant temperature, $S$ is entropy in joules per kelvin, $U$ is
    internal energy in joules, $V$ is volume in cubic meters, and $N_i$ is the amount
    of species $i$ in moles held fixed in the derivative.


    This name is not specific to inlet or outlet; use [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    or [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet) when the
    port location is part of the quantity identity. It denotes the fluid temperature,
    not the solid component temperature, wall temperature, or a temperature difference
    across the component.'
  unit: K
  physics_domain: plant_systems
  links:
  - name:temperature_at_inlet
  - name:temperature_at_outlet
  - name:coolant_pressure
  sources:
  - dd_path: balance_of_plant/power_plant/system/component/port/temperature
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-system-component-port-temperature
    dd_documentation:
      leaf: Fluid temperature
