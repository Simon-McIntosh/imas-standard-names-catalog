name: vertical_component_of_ion_momentum_flux
status: draft
description: Vertical ($Z$-axis) component of the ion momentum flux vector on an edge
  plasma grid.
documentation: "The vertical ion momentum flux $\\Pi_z^i$ (in $\\mathrm{kg\\,m^{-1}\\\
  ,s^{-2}}$) represents the rate of transport of ion momentum density in the direction\
  \ of the machine height axis $\\hat{z}$. It combines convective and diffusive contributions:\
  \ $\\Pi_z^i = m_i n_i v_z v + \\text{(viscous/diffusive terms)}$, where $m_i$ is\
  \ the ion mass, $n_i$ the ion number density, $v_z$ the vertical velocity component,\
  \ and $v$ the momentum-carrying velocity. In GGD-based edge transport models this\
  \ quantity is evaluated per grid element and is essential for resolving poloidal\
  \ asymmetries in the divertor and X-point regions where vertical flows are significant.\
  \ Typical magnitudes in the divertor leg can reach $10^{-2}$\u2013$10^{0}\\;\\mathrm{Pa}$\
  \ equivalent stress levels, depending on plasma density and flow patterns. The vertical\
  \ component complements the radial and toroidal momentum flux components to close\
  \ the 2-D/3-D momentum balance."
