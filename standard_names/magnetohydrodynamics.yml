- name: decay_time_due_to_disruption
  kind: scalar
  status: active
  description: Decay time due to disruption is a characteristic timescale for the
    disruption-driven reduction of a specified plasma quantity. The specialized quantity
    defines the decaying variable and whether the time is an exponential e-folding
    time or another effective decay interval.
  documentation: 'Decay time due to disruption is the characteristic time associated
    with the decrease of a specified plasma quantity during the disruptive phase of
    a plasma discharge. It represents the temporal scale of disruption-driven loss
    or removal of that quantity, independent of which plasma population or state variable
    is being described.


    The defining decay convention belongs to the specialized quantity. An exponential
    decay time is an e-folding time only when that specialized definition assumes
    exponential behavior, while other specialized disruption decay times may be effective
    intervals between defined levels; this parent quantity does not impose a universal
    single-exponential law. A representative specialization is the [runaway-electron
    decay time due to disruption](name:runaway_electron_decay_time_due_to_disruption).'
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_decay_time_due_to_disruption
  - name:thermal_energy_decay_time_due_to_disruption
  sources:
  - dd_path: summary/disruption/decay_times/current_runaways/exponential/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-disruption-decay_times-current_runaways-exponential-value
    dd_documentation:
      leaf: Value
      parent_path: summary/disruption/decay_times/current_runaways/exponential
      parent: Exponential decay time (tau) used when the process is described by an
        exponential function (exp(-(t-t0)/tau))). Here "t" is time and "t0" is the
        time where the decay process starts
      data_type: FLT_0D
      unit: s
      lifecycle_status: active
    enhanced_context:
      description: "Exponential decay time constant (\u03C4) characterizing the decay\
        \ of runaway electron current during a disruption, describing the process\
        \ as exp(-(t-t0)/\u03C4). Quantifies how rapidly the runaway current diminishes\
        \ after onset."
      kind: template
- name: effective_charge
  kind: scalar
  status: active
  description: Dimensionless effective ionic charge of a plasma mixture, given by
    the second ionic charge moment divided by free-electron density and indicating
    impurity content.
  documentation: 'Effective charge $Z_\mathrm{eff}$ is the charge-weighted mean ionic
    charge of a plasma mixture, formed from the second moment of the ionic charge
    distribution and normalized by the free-electron density.


    The defining relation is


    $$

    Z_\mathrm{eff} = \frac{\sum_s n_s Z_s^2}{n_e}

    $$


    where $n_s$ is the number density of ions in species and charge-state category
    $s$, $Z_s$ is the positive ionic charge number for that category, and $n_e$ is
    the free-electron number density. For a quasineutral mixture, $n_e$ equals the
    sum of $n_s Z_s$ over the same ion population.


    This quantity applies to the complete included ion mixture, with contributions
    summed over all represented ion species and charge states; it is not restricted
    to one species, charge state, plasma region, or spatial averaging geometry. A
    local value and a prescribed spatially averaged value share this same charge aggregation
    convention.


    Effective charge is distinct from the charge number of an individual ion and from
    the [square of an ion charge number](name:square_of_ion_charge_number), which
    describes a single-species charge moment rather than the mixture-level ratio.
    Spatially averaged instances retain the local definition: [line-averaged effective
    charge](name:line_averaged_effective_charge) averages this quantity along a line,
    whereas [volume-averaged effective charge](name:volume_averaged_effective_charge)
    averages it over a plasma volume.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:line_averaged_effective_charge
  - name:volume_averaged_effective_charge
  sources:
  - dd_path: core_profiles/global_quantities/z_eff_resistive
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-global_quantities-z_eff_resistive
