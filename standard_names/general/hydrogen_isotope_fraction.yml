name: hydrogen_isotope_fraction
status: draft
cocos_transformation_type: one_like
description: Volume-averaged fractional abundance of hydrogen (protium) relative to
  the total hydrogenic ion population, $n_{\rm H}/(n_{\rm H}+n_{\rm D}+n_{\rm T})$.
documentation: "The hydrogen isotope fraction $f_{\\rm H} = n_{\\rm H}/(n_{\\rm H}+n_{\\\
  rm D}+n_{\\rm T})$ quantifies the protium content of the hydrogenic fuel mix, where\
  \ $n_{\\rm H}$, $n_{\\rm D}$, and $n_{\\rm T}$ are the volume-averaged number densities\
  \ (m$^{-3}$) of protium, deuterium, and tritium respectively. In pure deuterium\
  \ plasmas $f_{\\rm H}$ is typically 0.01\u20130.10, reflecting residual wall recycling;\
  \ in D-T campaigns the target is $f_{\\rm H} \\lesssim 0.02$ to maximize fusion\
  \ reactivity. The fraction is inferred from Balmer-$\\alpha$ spectroscopy, charge-exchange\
  \ recombination spectroscopy, or neutral particle analyzers, each exploiting the\
  \ mass-dependent Doppler shift or energy spectrum of hydrogenic species. A high\
  \ hydrogen fraction degrades the fusion power output because the D-T cross section\
  \ exceeds the D-H or H-H cross sections by orders of magnitude at reactor temperatures.\
  \ See also the effective hydrogenic mass."
