- name: pressure_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Pressure of an ion cyclotron heating antenna is the scalar absolute
    pressure of fluids contained in antenna-associated volumes or the nonnegative
    compressive normal pressure transmitted at antenna hardware interfaces. It excludes
    tensile normal stress, shear stress, and pressures not physically localized to
    the antenna assembly.
  documentation: 'Pressure of an ion cyclotron heating antenna is the scalar normal
    pressure associated with material media contained within the antenna assembly
    or with compressive contact at antenna hardware interfaces. For a gas or liquid
    it denotes the absolute thermodynamic pressure of that medium; for a solid contact
    it denotes the nonnegative compressive part of the normal traction transmitted
    across the contact.


    The common mechanical definition is the area-averaged compressive normal traction:


    $$

    p = \frac{1}{A}\int_A \max\!\left[-\mathbf{t}\cdot\hat{\mathbf{n}},\,0\right]
    \, dA

    $$


    where $p$ is this pressure, $A$ is the surface area over which it is defined,
    $\mathbf{t}=\boldsymbol{\sigma}\cdot\hat{\mathbf{n}}$ is the traction vector acting
    on a surface with unit normal $\hat{\mathbf{n}}$, and $\boldsymbol{\sigma}$ is
    the Cauchy stress tensor of the medium or contacting body. For a static isotropic
    fluid, the compressive normal traction is independent of surface orientation,
    so this scalar equals the absolute thermodynamic pressure.


    The locus is restricted to media volumes and mechanical interfaces that are part
    of, or mechanically intrinsic to, the ion cyclotron heating antenna assembly,
    including contained gas, contained liquid, seals, windows, supports, and current-carrying
    component contacts when the scalar represents their normal load. It excludes plasma
    pressure, vessel pressure not attributable to the antenna assembly, tensile normal
    stress, shear traction, and signed components of a stress tensor. The related
    [gas pressure of an ion cyclotron heating antenna](name:gas_pressure_of_ion_cyclotron_heating_antenna)
    is the subset restricted to neutral-gas thermodynamic pressure and excludes liquid-coolant
    and solid-contact pressure.'
  unit: Pa
  physics_domain: auxiliary_heating
  links:
  - name:gas_pressure_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/module/pressure/amplitude
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-pressure-amplitude
    dd_documentation:
      leaf: Amplitude of the measurement
      parent_path: ic_antennas/antenna/module/pressure
      parent: Set of pressure measurements
      data_type: STRUCTURE
      unit: Pa
    enhanced_context:
      description: Amplitude of a pressure measurement on an ion cyclotron (IC) antenna
        module. Stores time-resolved pressure data for monitoring mechanical or gas
        pressure conditions at a specific sensor location on the module.
      kind: llm
- name: gas_pressure_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Absolute thermodynamic pressure of gas within or associated with an
    ion cyclotron heating antenna, excluding mechanical contact pressure in solid
    hardware.
  documentation: 'The gas pressure of an ion cyclotron heating antenna is the absolute
    thermodynamic pressure of the neutral gas occupying an antenna volume or gas boundary.
    It is the gas-phase component of [pressure of an ion cyclotron heating antenna](name:pressure_of_ion_cyclotron_heating_antenna),
    not a structural or contact load.


    For a dilute gas in local thermodynamic equilibrium, the pressure is related to
    its state by


    $$

    p = n k_B T

    $$


    where $p$ is the gas pressure, $n$ is the neutral-gas number density, $k_B$ is
    Boltzmann''s constant, and $T$ is the thermodynamic temperature. For a nonideal
    gas, $p$ retains its thermodynamic meaning and is determined by the appropriate
    equation of state.


    The quantity excludes pressure exerted by solid hardware interfaces and mechanical
    contact forces; zero corresponds to perfect vacuum.'
  unit: Pa
  physics_domain: auxiliary_heating
  links:
  - name:pressure_of_ion_cyclotron_heating_antenna
  arguments:
  - name: pressure_of_ion_cyclotron_heating_antenna
    operator: gas
    operator_kind: qualifier
  sources:
