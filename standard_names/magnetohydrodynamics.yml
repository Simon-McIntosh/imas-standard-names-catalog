- name: perturbed_plasma_mass_density_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex first-order plasma mass density perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The imaginary part of the complex perturbed plasma mass density
    eigenfunction $\tilde{\rho}_m$ arises when the first-order mass density perturbation
    is separated into in-phase and quadrature components relative to a chosen eigenmode
    phase and normalization. In the standard perturbation decomposition $\delta\rho(\mathbf{r},
    t) = \mathrm{Re}[\tilde{\rho}_m(\mathbf{r})\, e^{i(n\phi - \omega t)}]$, where
    $n$ is the toroidal mode number, $\phi$ is the toroidal angle, and $\omega$ is
    the complex eigenfrequency, the eigenfunction splits as:


    $$

    \tilde{\rho}_m = \tilde{\rho}_\mathrm{re} + i\,\tilde{\rho}_\mathrm{im}

    $$


    where $\tilde{\rho}_\mathrm{re}$ is the [real part](name:perturbed_plasma_mass_density_real_part)
    and $\tilde{\rho}_\mathrm{im}$ is this quantity. Together they encode the local
    amplitude $|\tilde{\rho}_m|$ and spatial phase of the mass density perturbation
    over the poloidal cross-section.


    The equilibrium mass density about which the perturbation is defined is $\rho_{m0}
    = \sum_s m_s n_s$, where $m_s$ and $n_s$ are the mass and number density of species
    $s$; ion contributions dominate in fusion plasmas because electron mass is negligible.
    These eigenfunctions are produced by linear MHD eigenvalue solvers that Fourier-decompose
    perturbations in the toroidal direction; the imaginary part is meaningful only
    relative to the phase convention and normalization of the specific eigenmode calculation.
    The companion quantities [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)
    and [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part)
    form a self-consistent set of perturbed thermodynamic eigenfunctions for the same
    MHD mode.'
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_mass_density_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_temperature_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/imaginary
    status: composed
- name: perturbed_plasma_mass_density_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma mass density perturbation
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD stability
    analysis.
  documentation: 'The real part of the perturbed plasma mass density eigenfunction
    is the in-phase component of the first-order mass density variation associated
    with a linear MHD eigenmode. In the linear expansion the total plasma mass density
    is $\rho_m = \rho_{m0} + \delta\rho_m$, where the equilibrium value $\rho_{m0}
    = \sum_s m_s n_s$ sums over particle species with particle mass $m_s$ and number
    density $n_s$ (electron mass is typically negligible in fusion plasmas).


    The physical mass density perturbation for toroidal mode number $n$ is reconstructed
    from the complex eigenfunction as


    $$\delta\rho_m(R, Z, \phi, t) = \mathrm{Re}\!\left[\tilde{\rho}_m(R, Z)\,e^{i(n\phi
    - \omega t)}\right]$$


    where $\omega = \omega_r + i\gamma$ is the complex eigenfrequency with oscillation
    frequency $\omega_r$ and growth or damping rate $\gamma$, $\phi$ is the toroidal
    angle, and $R$, $Z$ are cylindrical coordinates in the right-handed $(R, \phi,
    Z)$ frame. The real and imaginary parts of $\tilde{\rho}_m(R, Z)$ together encode
    the full amplitude and phase structure of the perturbation in the poloidal plane.


    This eigenfunction component is produced by linear MHD stability solvers as part
    of the solution to the linearized compressible MHD eigenvalue problem. The absolute
    magnitude is normalization-dependent; the physically significant information lies
    in the spatial structure across the poloidal cross-section. The complementary
    in-quadrature component is [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part),
    and together they constitute the full complex eigenfunction [perturbed_plasma_mass_density](name:perturbed_plasma_mass_density).
    The analogous real-part quantity for the plasma pressure perturbation is [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part).'
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_mass_density_imaginary_part
  - name:perturbed_plasma_mass_density
  - name:perturbed_plasma_pressure_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/real
    status: composed
- name: perturbed_plasma_temperature_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex perturbed plasma temperature eigenfunction
    for a linear MHD mode.
  documentation: 'Perturbed plasma temperature imaginary part is the quadrature component
    of the complex first-order temperature perturbation eigenfunction of a linear
    MHD mode. Together with the [real part](name:perturbed_plasma_temperature_real_part),
    it forms the complex temperature eigenfunction; it sets the local phase relative
    to a chosen real reference and is not a separate thermodynamic temperature.


    For a toroidal Fourier harmonic, the convention used here represents the physical
    temperature perturbation in the right-handed cylindrical $(R, \phi, Z)$ system
    as:


    $$

    \delta T(R, \phi, Z, t) = \operatorname{Re}\left\{\left[\delta T_\mathrm{R}(R,
    Z) + i\,\delta T_\mathrm{I}(R, Z)\right]\exp\left[i(n\phi - \omega t)\right]\right\}

    $$


    where $\delta T_\mathrm{I}$ is this quantity, $\delta T_\mathrm{R}$ is the real
    part, $n$ is the integer toroidal mode number, and $\omega$ is the angular eigenfrequency.
    Here $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height. The local complex
    amplitude is $|\tilde{T}| = \sqrt{\delta T_\mathrm{R}^2 + \delta T_\mathrm{I}^2}$,
    and the local phase is $\alpha = \operatorname{atan2}(\delta T_\mathrm{I}, \delta
    T_\mathrm{R})$ radians; the quadrant-aware $\operatorname{atan2}$ form is required
    to distinguish all phases.


    In practice, $\delta T_\mathrm{I}$ is computed as one component of a linear MHD
    eigenvector, coupled to displacement, pressure, density, and electromagnetic perturbations.
    Temperature fluctuation measurements can constrain comparable amplitude and phase
    information when projected onto the same toroidal harmonic, but a phase reference
    is needed to separate real and imaginary components.


    A homogeneous linear eigenmode can be multiplied by an arbitrary complex constant,
    so the absolute eV scale and the split between real and imaginary parts are meaningful
    only after an amplitude normalization and global phase reference are fixed. For
    normalized perturbation levels $|\tilde{T}|/T_0$ of 10^-4-10^-1 and equilibrium
    temperatures of 100-20000 eV, component magnitudes of about 0.01-2000 eV are typical
    illustrative values; nodes and phase choices can make this component zero or change
    its sign.


    Sign convention: Positive when, for the Fourier convention above, the local eigenfunction
    phase returned by $\operatorname{atan2}(\delta T_\mathrm{I}, \delta T_\mathrm{R})$
    lies between $0$ and $\pi$ radians relative to the chosen real-axis phase reference
    after the eigenmode phase and normalization have been fixed.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    status: composed
- name: perturbed_plasma_temperature_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma temperature perturbation
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD stability
    analysis.
  documentation: 'In linear MHD stability analysis, plasma perturbations for a given
    toroidal mode number are expressed as complex spatial eigenfunctions. This quantity
    gives $\text{Re}[\tilde{T}]$, the real part of the complex temperature perturbation
    eigenfunction $\tilde{T}(\mathbf{r})$, encoding the in-phase spatial structure
    of the temperature mode relative to the chosen eigenmode normalization.


    The time-evolving perturbation field is reconstructed from the eigenfunction components
    as:


    $$

    \delta T(\mathbf{r}, t) = \text{Re}\!\left[\tilde{T}(\mathbf{r})\, e^{i(n\phi
    - \omega t)}\right]

    $$


    where $n$ is the toroidal mode number, $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $\omega$ is the complex eigenfrequency whose
    imaginary part gives the linear growth or damping rate.


    This component is computed by linear MHD stability solvers as one element of a
    complete set of perturbed field eigenfunctions; together with the [imaginary part](name:perturbed_plasma_temperature_imaginary_part),
    it fully specifies the complex eigenfunction $\tilde{T}$. Analogous decompositions
    apply to [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part).
    The absolute magnitude of $\text{Re}[\tilde{T}]$ is set by the eigenmode normalization
    convention and must be scaled by the physical mode amplitude to represent an actual
    temperature perturbation.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_imaginary_part
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_mass_density_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    status: composed
- name: perturbed_plasma_velocity
  kind: vector
  status: draft
  description: Complex vector eigenfunction of the first-order bulk plasma velocity
    perturbation in linear MHD stability analysis, encoding the spatial amplitude
    and phase of oscillatory plasma flow for a specified toroidal Fourier mode.
  documentation: "In linear MHD stability theory, the perturbed plasma velocity is\
    \ the complex vector eigenfunction $\\delta\\hat{\\mathbf{v}}(\\mathbf{r})$ representing\
    \ the spatial structure of the first-order oscillatory perturbation of the bulk\
    \ plasma flow about a magnetohydrostatic equilibrium \u2014 the linearized counterpart\
    \ to the equilibrium [plasma_velocity](name:plasma_velocity). The eigenfunction\
    \ encodes both the spatial amplitude and the relative phase of the velocity oscillation\
    \ as a function of position in the plasma.\n\nThe full space-time perturbation\
    \ field is assembled as:\n\n$$\n\\delta\\mathbf{v}(\\mathbf{r},t) = \\delta\\\
    hat{\\mathbf{v}}(\\mathbf{r})\\,e^{i(n\\phi - \\omega t)}\n$$\n\nwhere $n$ is\
    \ the toroidal mode number, $\\phi$ is the toroidal angle in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame, and $\\omega$ is the complex mode frequency\
    \ whose real part gives the oscillation frequency and imaginary part gives the\
    \ growth or damping rate. In ideal MHD the eigenfunction satisfies $\\delta\\\
    hat{\\mathbf{v}} = -i\\omega\\boldsymbol{\\xi}$, where $\\boldsymbol{\\xi}$ is\
    \ the plasma displacement vector.\n\nThe eigenfunction decomposes into three spatial\
    \ projections: [radial_perturbed_plasma_velocity](name:radial_perturbed_plasma_velocity),\
    \ [toroidal_perturbed_plasma_velocity](name:toroidal_perturbed_plasma_velocity),\
    \ and [poloidal_perturbed_plasma_velocity](name:poloidal_perturbed_plasma_velocity),\
    \ all complex-valued. The overall amplitude and phase are normalization-dependent\
    \ unless anchored to a physical constraint such as kinetic energy. The growth\
    \ rate of the associated mode is characterized by [per_toroidal_mode_growth_rate](name:per_toroidal_mode_growth_rate)\
    \ and the spatial phase reference by [mode_phase](name:mode_phase); companion\
    \ scalar perturbed eigenfunctions include [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part)\
    \ and [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:radial_perturbed_plasma_velocity
  - name:toroidal_perturbed_plasma_velocity
  - name:poloidal_perturbed_plasma_velocity
  - name:per_toroidal_mode_growth_rate
