- name: per_toroidal_mode_right_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: active
  description: Complex toroidal Fourier coefficient of the right-hand circularly polarized
    E-minus wave-electric-field component for a single toroidal mode.
  documentation: 'This quantity is the complex Fourier coefficient of the right-hand
    circularly polarized E-minus component of the wave electric field for one toroidal
    mode. It preserves the circular-polarization projection defined by the [right-hand
    circularly polarized wave electric field](name:right_hand_circularly_polarized_wave_electric_field)
    while resolving its toroidal dependence.


    $$

    \widetilde{E}_{-}(n_\phi)=\frac{1}{2\pi}\int_{0}^{2\pi}E_{-}(\phi)e^{-i n_\phi\phi}\,d\phi

    $$


    Here $E_{-}(\phi)$ is the parent complex electric-field phasor, $\phi$ is the
    toroidal angle in radians, and $n_\phi$ is the dimensionless integer toroidal
    mode number. The result is a single-mode coefficient, not a sum over modes and
    not necessarily the real part of the phasor.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:right_hand_circularly_polarized_wave_electric_field
