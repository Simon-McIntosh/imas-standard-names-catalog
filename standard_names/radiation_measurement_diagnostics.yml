- name: width_of_spectrometer_channel
  kind: scalar
  status: active
  description: "Wavelength-domain measure of a spectrometer channel\u2019s response\
    \ spread, quantifying instrumental broadening around its characteristic response\
    \ wavelength."
  documentation: "A spectral width is a wavelength-domain measure of the spread of\
    \ a spectrometer channel\u2019s instrument response to monochromatic radiation.\
    \ It describes the broadening of the response about the channel\u2019s [reference\
    \ wavelength](name:reference_wavelength_of_spectrometer_channel).\n\nFor the Gaussian\
    \ representation used by [spectral_width_of_spectrometer_channel](name:spectral_width_of_spectrometer_channel),\
    \ the response is modeled as\n\n$$\nR(\\lambda) = R_0 \\exp\\left[-\\frac{(\\\
    lambda-\\lambda_{\\rm ref})^2}{2\\sigma_\\lambda^2}\\right]\n$$\n\nwhere $R(\\\
    lambda)$ is the response at wavelength $\\lambda$, $R_0$ is the peak response,\
    \ $\\lambda_{\\rm ref}$ is the reference wavelength, and $\\sigma_\\lambda$ is\
    \ the spectral width.\n\nThe width parameter must be distinguished from [effective_spectral_width_of_spectrometer_channel](name:effective_spectral_width_of_spectrometer_channel),\
    \ which is the equivalent-width bandwidth for a response profile and is not generally\
    \ a Gaussian standard deviation."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:reference_wavelength_of_spectrometer_channel
  - name:spectral_width_of_spectrometer_channel
  - name:effective_spectral_width_of_spectrometer_channel
- name: spectral_width_of_spectrometer_channel
  kind: scalar
  status: active
  description: Spectral width of a spectrometer channel is the Gaussian standard deviation
    of the channel spectral response to monochromatic radiation about its reference
    vacuum wavelength. It specifies instrumental broadening and is distinct from an
    effective full-response width or a passband interval.
  documentation: 'Spectral width of a spectrometer channel is the Gaussian standard
    deviation of the channel response in vacuum wavelength about the channel reference
    wavelength. It characterizes the instrumental spectral broadening produced by
    the channel for a monochromatic input, excluding the physical line width of the
    radiation source.


    For a Gaussian spectral response component $G(\lambda)$ centered at $\lambda_0$,
    the spectral width $\sigma_\lambda$ is defined by the second central moment:


    $$

    \sigma_\lambda^2 = \frac{\int (\lambda - \lambda_0)^2 G(\lambda)\, d\lambda}{\int
    G(\lambda)\, d\lambda}

    $$


    where $\lambda$ is vacuum wavelength, $\lambda_0$ is the [reference wavelength
    of the spectrometer channel](name:reference_wavelength_of_spectrometer_channel),
    both are expressed in meters, and $G(\lambda)$ is the non-negative Gaussian spectral
    response component. The normalization of $G(\lambda)$ cancels in the ratio.


    This name denotes the Gaussian $\sigma_\lambda$ convention. It excludes the Gaussian
    full width at half maximum, related to this quantity by $2\sqrt{2\ln 2}\,\sigma_\lambda$,
    and excludes the equivalent full-response or rectangular-bandwidth measure denoted
    by [effective spectral width of spectrometer channel](name:effective_spectral_width_of_spectrometer_channel).
    The valid physical domain is $\sigma_\lambda \ge 0$; $\sigma_\lambda = 0$ is the
    ideal limit of no instrumental spectral broadening by that Gaussian component.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:width_of_spectrometer_channel
  - name:effective_spectral_width_of_spectrometer_channel
  arguments:
  - name: width_of_spectrometer_channel
    operator: spectral
    operator_kind: qualifier
  sources:
  - dd_path: charge_exchange/channel/spectrum/instrument_function
