- name: tilt_angle_of_plasma_filament
  kind: scalar
  status: active
  description: "Signed beta inclination of the beta-angle side of a plasma-filament\
    \ parallelogram cross-section in the poloidal plane of the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, measured counterclockwise from +Z toward decreasing R."
  documentation: 'The tilt angle of a plasma filament is the signed inclination $\beta$
    of the beta-angle side of a plasma-filament parallelogram cross-section. The angle
    lies in the poloidal $(R,Z)$ plane of the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius and $Z$ is vertical height, and is referenced
    to the upward $+Z$ direction.


    For the ordered parallelogram, let $\mathbf{u}_\beta = u_R\hat{R}+u_Z\hat{Z}$
    be the unit vector along the beta-angle side, directed from the reference vertex
    shared with the base side toward the adjacent beta-side vertex. The signed angle
    is defined by:


    $$

    \beta = \operatorname{atan2}(-u_R, u_Z)

    $$


    where $u_R$ and $u_Z$ are the components of $\mathbf{u}_\beta$ along $\hat{R}$
    and $\hat{Z}$, and $\operatorname{atan2}(y,x)$ returns the principal branch $-\pi
    < \beta \le \pi$.


    The beta-angle side terminology follows the same angle-labeled parallelogram convention
    as [length of iron-core segment](name:length_of_iron_core_segment), identifying
    a side by its inclination angle rather than by an ordinal label. The directed-edge
    and branch conventions make $\beta$ unique: translating to the opposite parallel
    edge leaves the value unchanged, while reversing the side direction is excluded.
    This angle complements cross-section size quantities such as [plasma-filament
    width](name:plasma_filament_width) and [thickness of plasma filament](name:thickness_of_plasma_filament);
    it is not a filament-current direction or a magnetic-field pitch angle.


    Sign convention: Positive when the directed beta-angle side is rotated counterclockwise
    from the upward $+Z$ direction in the poloidal $(R,Z)$ plane of the right-handed
    cylindrical $(R,\phi,Z)$ frame, drawn with $R$ increasing to the right.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_angle_of_poloidal_field_coil
  sources:
  - dd_path: pf_plasma/element/geometry/oblique/beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_plasma.html#pf_plasma-element-geometry-oblique-beta
    dd_documentation:
