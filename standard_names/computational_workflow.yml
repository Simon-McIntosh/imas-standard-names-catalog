- name: lower_uncertainty_of_normalized_poloidal_flux_coordinate
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the normalized poloidal
    flux coordinate $\rho_{\rm pol}$.
  documentation: "This quantity gives the magnitude of the downward (negative-side)\
    \ error bar on the [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate),\
    \ such that the true value is expected to lie in the interval $[\\rho_{\\rm pol}\
    \ - \\delta\\rho^{-}_{\\rm pol},\\; \\rho_{\\rm pol} + \\delta\\rho^{+}_{\\rm\
    \ pol}]$, where $\\delta\\rho^{-}_{\\rm pol}$ is this lower uncertainty and $\\\
    delta\\rho^{+}_{\\rm pol}$ is the corresponding upper uncertainty. Uncertainty\
    \ in $\\rho_{\\rm pol}$ propagates from errors in the equilibrium reconstruction\
    \ of $\\psi$, $\\psi_{\\rm axis}$, and $\\psi_{\\rm LCFS}$. It is dimensionless\
    \ (unit 1) and non-negative. For well-diagnosed tokamak plasmas, values on the\
    \ order of 0.01\u20130.05 are common in the core, increasing near the separatrix\
    \ where flux gradients steepen. See also [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - spatial-profile
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the normalized toroidal
    flux coordinate $\rho_{\mathrm{tor,N}}$.
  documentation: The lower uncertainty quantifies the negative-side error bar on the
    normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}} = \rho_{\mathrm{tor}}
    / \rho_{\mathrm{tor,LCFS}}$, where $\rho_{\mathrm{tor}}$ is the square root of
    the enclosed toroidal magnetic flux divided by $\pi B_0$ and $\rho_{\mathrm{tor,LCFS}}$
    is its value at the last closed flux surface. This quantity is dimensionless (unit
    1), consistent with the parent coordinate. It arises in equilibrium reconstruction
    and transport-solver grids where the radial coordinate carries propagated uncertainties
    from magnetic measurements and profile fitting; the actual value represents $\rho_{\mathrm{tor,N}}
    - \rho_{\mathrm{tor,N}}^{\mathrm{low}}$, i.e., the magnitude of the downward deviation.
    See also [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)
    for the parent quantity and [lower_uncertainty_of_normalized_poloidal_flux_coordinate](name:lower_uncertainty_of_normalized_poloidal_flux_coordinate)
    for the analogous poloidal-flux coordinate uncertainty.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the toroidal flux coordinate
    $\rho_{\mathrm{tor}}$, representing the negative deviation from the nominal value.
  documentation: The toroidal flux coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi_{\mathrm{tor}}
    / (\pi B_0)}$ (where $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux enclosed
    by a flux surface in Wb and $B_0$ is the vacuum toroidal field in T) labels flux
    surfaces with a dimension of length (unit m). This lower uncertainty field stores
    the magnitude of the negative error bar, so that the confidence interval is $[\rho_{\mathrm{tor}}
    - \delta\rho^{-},\; \rho_{\mathrm{tor}} + \delta\rho^{+}]$. Asymmetric uncertainties
    arise when the mapping from diagnostic data to flux-surface labels involves nonlinear
    equilibrium reconstructions whose error distributions are non-Gaussian. Combined
    with [upper_uncertainty_of_toroidal_flux_coordinate](name:upper_uncertainty_of_toroidal_flux_coordinate),
    the full asymmetric confidence interval is recovered. The parent coordinate is
    [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)
    after normalization to the last closed flux surface value.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_poloidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial coordinate defined as the square root of the poloidal
    flux normalized between the magnetic axis and the last closed flux surface.
  documentation: The normalized poloidal flux coordinate is defined as $\rho_{\rm
    pol} = \sqrt{(\psi - \psi_{\rm axis}) / (\psi_{\rm LCFS} - \psi_{\rm axis})}$,
    where $\psi$ is the poloidal magnetic flux in Wb, $\psi_{\rm axis}$ its value
    at the magnetic axis, and $\psi_{\rm LCFS}$ its value at the last closed flux
    surface (LCFS). By construction $\rho_{\rm pol} = 0$ on the magnetic axis and
    $\rho_{\rm pol} = 1$ at the separatrix, providing a convenient label for nested
    flux surfaces that is independent of the absolute sign of $\psi$. It is the standard
    radial coordinate for one-dimensional profile representations in transport solvers,
    equilibrium reconstructions, and integrated-modeling workflows. Values beyond
    unity ($\rho_{\rm pol} > 1$) correspond to the scrape-off layer. See also [poloidal_magnetic_flux](name:poloidal_magnetic_flux)
    for the un-normalized quantity and [vacuum_toroidal_magnetic_field_at_reference_major_radius](name:vacuum_toroidal_magnetic_field_at_reference_major_radius)
    for the reference field entering many related normalizations.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial coordinate defined as $\rho_{\mathrm{tor,N}} =
    \rho_\mathrm{tor} / \rho_\mathrm{tor,\,LCFS}$, mapping flux surfaces from axis
    (0) to boundary (1).
  documentation: The normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}}$ is
    defined as $\rho_{\mathrm{tor,N}} = \rho_\mathrm{tor} / \rho_\mathrm{tor,\,LCFS}$,
    where $\rho_\mathrm{tor} = \sqrt{\Phi_\mathrm{tor} / (\pi B_0)}$ is the toroidal
    flux coordinate, $\Phi_\mathrm{tor}$ is the toroidal magnetic flux enclosed by
    the flux surface, $B_0$ is the vacuum toroidal magnetic field at the magnetic
    axis (in T), and $\rho_\mathrm{tor,\,LCFS}$ is the value of $\rho_\mathrm{tor}$
    evaluated at the last closed flux surface (LCFS) or, for fixed-boundary equilibria,
    at approximately 99% of the LCFS flux. By construction, $\rho_{\mathrm{tor,N}}
    = 0$ on the magnetic axis and $\rho_{\mathrm{tor,N}} = 1$ at the plasma boundary.
    This coordinate is the standard radial label for one-dimensional transport profiles
    and is produced by equilibrium reconstruction codes (EFIT, LIUQE, CHEASE) and
    used as the independent variable in transport solvers. It provides a more uniform
    radial spacing than the [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)
    in the plasma core due to the typically weaker variation of toroidal flux with
    minor radius. The unnormalized counterpart is the [toroidal_flux_coordinate](name:toroidal_flux_coordinate).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: second_derivative_of_toroidal_ion_velocity_wrt_normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Second radial derivative of the flux-surface-averaged ion toroidal
    velocity with respect to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}}$.
  documentation: This quantity stores $d^2 v_{\phi,i} / d\rho_{\mathrm{tor,N}}^2$,
    where $v_{\phi,i}$ (m s$^{-1}$) is the charge-state-averaged toroidal velocity
    of an ion species and $\rho_{\mathrm{tor,N}}$ is the dimensionless normalized
    toroidal flux coordinate. Because $\rho_{\mathrm{tor,N}}$ is dimensionless, the
    second derivative retains the unit m s$^{-1}$. It is computed by transport solvers
    that require analytic or spline-based second derivatives of the rotation profile
    for diffusive and convective flux evaluations in the momentum-balance equation.
    The toroidal rotation is measured by charge-exchange recombination spectroscopy,
    with values ranging from $\sim$0 to $\sim 5 \times 10^5$ m s$^{-1}$ in strongly
    rotating beam-heated tokamak plasmas. See also [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)
    for the radial coordinate definition.
  unit: m.s^-1
  cocos_transformation_type: one_like
  tags:
  - derived
  - integrated-modeling
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: second_radial_derivative_of_electron_temperature
  kind: scalar
  status: draft
  description: Second derivative of the electron temperature profile $T_e$ with respect
    to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}}$.
  documentation: "The quantity $d^2 T_e / d\\rho_{\\mathrm{tor,N}}^2$ (in eV, since\
    \ $\\rho_{\\mathrm{tor,N}}$ is dimensionless) characterizes the curvature of the\
    \ electron temperature profile on a given flux surface. It enters the radial heat-flux\
    \ divergence in 1-D diffusive transport models where $q_e = -n_e \\chi_e \\, dT_e/d\\\
    rho_{\\mathrm{tor,N}}$, with $n_e$ the electron density in m$^{-3}$ and $\\chi_e$\
    \ the electron heat diffusivity in m$^2$\xB7s$^{-1}$; the second derivative appears\
    \ when computing $\\partial q_e / \\partial \\rho_{\\mathrm{tor,N}}$ and in the\
    \ linearized Jacobian used by iterative transport solvers. Large positive curvature\
    \ indicates profile peaking (e.g., inside an internal transport barrier), while\
    \ large negative curvature is associated with profile flattening as seen near\
    \ sawtooth mixing radii. This derivative is computed internally by the solver\
    \ via finite-difference or spectral collocation on the radial grid and is stored\
    \ for diagnostic and restart purposes. See also [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)\
    \ for the independent variable definition."
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - derived
  - integrated-modeling
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: simulation_time
  kind: scalar
  status: draft
  description: Time coordinate within a simulation or workflow, marking the physical
    instant to which computed results correspond.
  documentation: The simulation time $t$ (in seconds) serves as the primary temporal
    coordinate for integrated-modeling workflows and standalone simulation codes.
    It can represent a start time, end time, or the current time at which results
    are stored, depending on context within the workflow time loop. For pulse-predictive
    simulations the range spans from the start of the plasma current ramp-up ($t \sim
    0$ s) through the flat-top and into termination, with values reaching hundreds
    of seconds for long-pulse devices such as ITER. The internal solver may advance
    with sub-step resolution (see [simulation_time_step](name:simulation_time_step)),
    while results are archived at coarser intervals. This quantity is distinct from
    experimental wall-clock time and refers exclusively to the physical time axis
    of the simulated plasma evolution.
  unit: s
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Effective minor-radius-like coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi_{\mathrm{tor}}
    / (\pi B_0)}$, where $\Phi_{\mathrm{tor}}$ is the enclosed toroidal flux.
  documentation: The toroidal flux coordinate $\rho_{\mathrm{tor}}$ is defined as
    $\rho_{\mathrm{tor}} = \sqrt{\Phi_{\mathrm{tor}} / (\pi B_0)}$, where $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the flux surface and $B_0$ is the vacuum
    toroidal magnetic field at the reference major radius $R_0$ (stored as [vacuum_toroidal_magnetic_field_at_reference_major_radius](name:vacuum_toroidal_magnetic_field_at_reference_major_radius)).
    The definition yields a quantity with dimensions of length (unit m) that reduces
    to the geometric minor radius in the large-aspect-ratio circular limit. It serves
    as the radial coordinate for 1-D transport profiles and monotonically increases
    from 0 at the magnetic axis to $\rho_{\mathrm{tor,LCFS}}$ at the last closed flux
    surface. The normalized variant $\rho_{\mathrm{tor,N}} = \rho_{\mathrm{tor}} /
    \rho_{\mathrm{tor,LCFS}}$ maps the profile to $[0,1]$ (see [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)).
    Computed from equilibrium reconstruction codes. See also [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_normalized_poloidal_flux_coordinate
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the normalized poloidal
    flux coordinate $\rho_{\rm pol}$.
  documentation: This quantity gives the magnitude of the upward (positive-side) error
    bar on the [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate),
    such that the true value is expected to lie in $[\rho_{\rm pol} - \delta\rho^{-}_{\rm
    pol},\; \rho_{\rm pol} + \delta\rho^{+}_{\rm pol}]$, where $\delta\rho^{+}_{\rm
    pol}$ is this upper uncertainty. The uncertainty originates from the equilibrium-reconstruction
    errors on $\psi$, $\psi_{\rm axis}$, and $\psi_{\rm LCFS}$ and is dimensionless
    (unit 1) and non-negative. Near the magnetic axis, where flux gradients are small,
    $\delta\rho^{+}_{\rm pol}$ can be relatively larger; near the separatrix, mapping
    uncertainties dominate. See also [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)
    and [lower_uncertainty_of_normalized_poloidal_flux_coordinate](name:lower_uncertainty_of_normalized_poloidal_flux_coordinate).
