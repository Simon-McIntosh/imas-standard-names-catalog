      kind: llm
- name: pressure_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Pressure of a lower-hybrid antenna is the scalar compressive stress
    associated with the antenna or a medium contained by its antenna volume. It includes
    thermodynamic gas or fluid pressure and mechanical contact pressure acting on
    antenna surfaces or structures, defined as an absolute, nonnegative quantity.
  documentation: 'Pressure of a lower-hybrid antenna is the scalar compressive stress
    associated with the antenna or a medium contained by its antenna volume. It includes
    the thermodynamic pressure of gas or fluid within the antenna enclosure and the
    compressive normal contact pressure exerted on antenna surfaces or structural
    interfaces. The quantity is absolute and nonnegative: fluid pressure is referenced
    to ideal vacuum, and mechanical pressure denotes compressive normal stress only.


    As a scalar reduction of the mechanical state, the pressure is the compressive
    isotropic part of the Cauchy stress tensor:


    $$

    p = -\frac{1}{3}\,\mathrm{tr}\,\boldsymbol{\sigma}

    $$


    where $\boldsymbol{\sigma}$ is the Cauchy stress tensor of the medium or interface
    under consideration, with the convention that tensile normal stress is positive
    in $\boldsymbol{\sigma}$ so that compression yields $p > 0$. For an isotropic
    fluid at rest this reduces to the absolute thermodynamic pressure of the fluid.


    The quantity is restricted to pressure physically localized to the lower-hybrid
    antenna assembly and the media it contains or contacts. It excludes tensile normal
    stress, shear stress, and any pressure not physically localized to the antenna
    assembly, such as bulk plasma pressure or pressures in remote transmission-line
    or pumping systems. It is broader than a gas-only antenna pressure, which is restricted
    to the neutral-gas thermodynamic pressure of the antenna vacuum volume; the analogous
    quantities for ion-cyclotron systems are [pressure_of_ion_cyclotron_heating_antenna](name:pressure_of_ion_cyclotron_heating_antenna)
    and [gas_pressure_of_ion_cyclotron_heating_antenna](name:gas_pressure_of_ion_cyclotron_heating_antenna).'
  unit: Pa
  physics_domain: auxiliary_heating
  links:
  - name:gas_pressure_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: lh_antennas/antenna/pressure_tank
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-pressure_tank
    dd_documentation:
