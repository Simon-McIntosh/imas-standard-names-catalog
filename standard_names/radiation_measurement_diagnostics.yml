- name: deuterium_density
  kind: scalar
  status: draft
  description: Number density of deuterium ions in a plasma fuel population, used
    locally or as the deuterium-density basis for line averages, volume averages,
    and isotope-density ratios. It represents absolute deuterium fuel content; any
    dimensionless abundance or ratio must state its normalization separately.
  documentation: 'Deuterium density is the species-resolved number density of deuterium
    ions in a plasma, conventionally denoted $n_D$. It counts ionized deuterium fuel
    particles per unit physical volume and is distinct from a deuterium fraction,
    concentration, or isotope ratio, which require an additional normalization. Local,
    chord-averaged, volume-averaged, and ratio quantities all derive from the same
    underlying $n_D$ field.


    The local absolute density is defined by the particle count in an infinitesimal
    volume:


    $$

    n_D = \frac{dN_D}{dV}

    $$


    where $N_D$ is the number of deuterium ions in volume $V$; the absolute density
    has SI unit $\mathrm{m^{-3}}$. Neutral deuterium atoms and non-hydrogenic impurity
    ions are not included unless a more specific quantity states a different population.


    In practice, $n_D$ is obtained from isotope-sensitive particle diagnostics, spectroscopic
    constraints, fusion-product information, and particle-balance or transport analysis.
    A [line-averaged deuterium density](name:line_averaged_deuterium_density) is the
    path average of $n_D$ along a diagnostic chord, while a [volume-averaged deuterium
    density](name:volume_averaged_deuterium_density) is its average over the plasma
    volume. The [ratio of tritium density to deuterium density](name:ratio_of_tritium_density_to_deuterium_density)
    uses the same $n_D$ as the deuterium reference density in a dimensionless isotope-density
    ratio.


    Typical local or averaged deuterium ion densities in magnetically confined fusion
    plasmas range from $10^{18}-10^{20}\ \mathrm{m^{-3}}$, with core values in fueled
    tokamak plasmas often $10^{19}-10^{20}\ \mathrm{m^{-3}}$. In nearly pure deuterium
    operation, $n_D$ can be close to the total hydrogenic ion density; in balanced
    deuterium-tritium mixtures, it is often of the same order as the tritium density.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:line_averaged_deuterium_density
  - name:volume_averaged_deuterium_density
  - name:ratio_of_tritium_density_to_deuterium_density
  - name:volume_averaged_deuterium_fraction
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fuel_ratio
    dd_path: neutron_diagnostic/reconstructed_emissivity/fuel_ratio
    status: composed
- name: efficiency_of_spectrometer_channel
  kind: scalar
  status: draft
  description: 'Dimensionless optical throughput of a spectrometer channel: the fraction
    of photons within the channel acceptance that are delivered to the active detector
    area after collection, transmission, reflection, dispersion, aperture, and window
    losses.'
  documentation: 'Efficiency of a spectrometer channel is the dimensionless probability
    that a photon within the channel acceptance reaches the active detector area.
    It represents optical throughput losses only, and is distinct from the geometrical
    or spectral acceptance described by spectral_etendue_of_spectrometer_channel.


    The channel efficiency can be defined as a ratio of photon fluxes:


    $$

    \eta_\mathrm{ch}(\lambda) = \frac{\Phi_\mathrm{det}(\lambda)}{\Phi_\mathrm{acc}(\lambda)}

    $$


    where $\Phi_\mathrm{det}(\lambda)$ is the photon flux delivered to the detector
    and $\Phi_\mathrm{acc}(\lambda)$ is the photon flux from the observed source that
    lies within the channel acceptance before optical losses. Both quantities must
    be expressed in the same units, such as photons s$^{-1}$ for band-integrated photon
    flux or photons s$^{-1}$ m$^{-1}$ for wavelength-resolved photon flux.


    In practice, this efficiency is obtained from radiometric calibration using calibrated
    lamps, integrating spheres, laser sources, or transfer-standard detectors. The
    calibration may include mirror reflectivity, lens or fiber transmission, slit
    throughput, grating efficiency, filter transmission, detector-window transmission,
    and alignment losses; detector quantum efficiency may be included only when the
    efficiency is intended to describe the full photon-to-signal response.


    The physical range is $0 \leq \eta_\mathrm{ch} \leq 1$. Well-aligned visible spectroscopy
    channels commonly have efficiencies from about 0.01-0.8, depending on wavelength,
    optical coatings, fiber coupling, grating order, and aperture losses.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:spectrometer_visible/channel/light_collection_efficiencies/values
    dd_path: spectrometer_visible/channel/light_collection_efficiencies/values
    status: composed
- name: emissivity_due_to_fusion
  kind: scalar
  status: draft
  description: Local volumetric rate of neutron production from thermonuclear fusion
    reactions, giving the spatial distribution of fusion neutron emission per unit
    volume at each point in the plasma.
  documentation: 'The neutron emissivity due to fusion quantifies the number of fusion-born
    neutrons generated per unit volume per unit time at a given plasma location. This
    volumetric source term encodes the combined effect of local fuel-ion densities
    and the thermally-averaged fusion reactivity, and drives the global neutron field
    from which plasma performance is diagnosed.


    For a binary fusion reaction between ion species $a$ and $b$, the emissivity is
    given by:


    $$

    \epsilon_{ab} = \frac{n_a \, n_b}{1 + \delta_{ab}} \langle \sigma v \rangle_{ab}

    $$


    where $n_a$ and $n_b$ are the number densities of the reacting ions, $\langle
    \sigma v \rangle_{ab}$ is the fusion reactivity (velocity-averaged fusion cross-section)
    at the local ion temperature, and $\delta_{ab} = 1$ for identical-species reactions
    to avoid double-counting.


    The emissivity profile is inferred from measurements by neutron camera arrays
    and collimated detector systems via Abel inversion or tomographic reconstruction.
    The two principal reaction channels are resolved as [deuterium_deuterium_emissivity_due_to_fusion](name:deuterium_deuterium_emissivity_due_to_fusion),
    covering the neutron-emitting D-D branch, and [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion),
    which dominates in D-T operation due to the much larger fusion cross-section.
    Integrating this emissivity over the plasma volume and weighting by the per-reaction
    neutron energy connects to the [total_neutron_power](name:total_neutron_power).'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_emissivity_due_to_fusion
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:total_neutron_power
- name: deuterium_deuterium_emissivity_due_to_fusion
  kind: scalar
  status: draft
  description: Local volumetric rate of neutron production from deuterium-deuterium
    fusion reactions, giving the spatial distribution of DD neutron emission per unit
    volume across the plasma.
  documentation: 'The deuterium-deuterium neutron emissivity $\varepsilon_{DD}$ is
    the local number of neutrons produced per unit volume per unit time from D-D fusion
    reactions. Of the two equally probable D-D reaction branches, only the neutron-producing
    channel $^2\text{H} + ^2\text{H} \rightarrow {^3\text{He}} + n$ (releasing a 2.45
    MeV neutron) contributes to this quantity; the proton-producing branch $^2\text{H}
    + ^2\text{H} \rightarrow T + p$ does not.


    The emissivity is related to the local fuel conditions by:


    $$

    \varepsilon_{DD} = \frac{n_D^2}{2} \langle \sigma v \rangle_{DD,n}

    $$


    where $n_D$ is the local deuterium number density and $\langle \sigma v \rangle_{DD,n}$
    is the velocity-averaged reaction rate coefficient for the neutron-producing branch;
    the factor $1/2$ prevents double-counting of identical reactants.


    The spatial profile of $\varepsilon_{DD}$ is reconstructed from chord-integrated
    signals recorded by multiple neutron detectors distributed around the device,
    using tomographic inversion to recover the local distribution. Volume integration
    of $\varepsilon_{DD}$ yields the global neutron emission rate characterized by
    [deuterium_deuterium_flux_due_to_thermal_fusion](name:deuterium_deuterium_flux_due_to_thermal_fusion)
    for the purely thermal component and includes beam-related contributions captured
    by [deuterium_deuterium_flux_due_to_beam_thermal_fusion](name:deuterium_deuterium_flux_due_to_beam_thermal_fusion).
    The D-T plasma analog is [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion),
    and the corresponding local fusion power density from all D-D channels is [deuterium_deuterium_power_density_due_to_fusion](name:deuterium_deuterium_power_density_due_to_fusion).'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_flux_due_to_thermal_fusion
  - name:deuterium_deuterium_flux_due_to_beam_thermal_fusion
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:deuterium_deuterium_power_density_due_to_fusion
  arguments:
  - name: emissivity_due_to_fusion
    operator: deuterium_deuterium
    operator_kind: qualifier
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/emissivity_dd
    dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dd
    status: composed
- name: deuterium_tritium_emissivity_due_to_fusion
  kind: scalar
  status: draft
  description: Neutron emissivity due to deuterium-tritium fusion reactions in the
    plasma.
  documentation: 'Deuterium-tritium fusion emissivity is the local volumetric rate
    at which neutrons are produced by deuterium-tritium fusion reactions. Each D-T
    reaction produces one neutron with energy near 14.1 MeV, so this quantity is equal
    to the D-T fusion reaction-rate density and is the source-rate counterpart of
    [deuterium_tritium_power_density_due_to_fusion](name:deuterium_tritium_power_density_due_to_fusion).


    For a mixture of thermal and nonthermal deuterium and tritium populations, the
    total emissivity can be written as a sum over reacting population pairs:


    $$

    \epsilon_{DT} = \sum_{i,j} n_{D,i} n_{T,j} \langle \sigma v_{\mathrm{rel}} \rangle_{DT,ij}

    $$


    where $\epsilon_{DT}$ is the D-T neutron emissivity in $m^{-3}.s^{-1}$, $i$ and
    $j$ label thermal, beam, or other fast-ion populations, $n_{D,i}$ and $n_{T,j}$
    are deuterium and tritium number densities in $m^{-3}$, and $\langle \sigma v_{\mathrm{rel}}
    \rangle_{DT,ij}$ is the D-T fusion reactivity for that pair in $m^3.s^{-1}$. For
    a thermal deuterium-thermal tritium pair, this factor is the thermally averaged
    D-T fusion reactivity.


    In practice, this quantity is computed from ion densities, temperatures, and fast-ion
    distribution functions, or inferred from absolutely calibrated neutron measurements
    such as neutron counters, activation systems, neutron cameras, and spectrometers.
    Spatial reconstruction may use tomographic or model-constrained inversion. The
    total can be decomposed into thermal-thermal, beam/fast-thermal, thermal-fast,
    and fast-fast terms, corresponding to distinctions used for quantities such as
    [neutron_flux_due_to_thermal_fusion](name:total_neutron_source_rate_due_to_thermal_fusion)
    and [deuterium_tritium_flux_due_to_beam_thermal_fusion](name:deuterium_tritium_flux_due_to_beam_thermal_fusion).


    Typical values span many orders of magnitude: low-temperature or trace-tritium
    regions may be below $10^{14}$ $m^{-3}.s^{-1}$, while hot D-T cores in high-performance
    tokamak plasmas can reach about $10^{16}$-$10^{19}$ $m^{-3}.s^{-1}$. The rate
    rises steeply with ion temperature in the several-keV to tens-of-keV range and,
    for thermal reactants, scales approximately with the product of deuterium and
    tritium densities.'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_power_density_due_to_fusion
  - name:total_neutron_source_rate_due_to_thermal_fusion
  - name:deuterium_tritium_flux_due_to_beam_thermal_fusion
  arguments:
  - name: emissivity_due_to_fusion
    operator: deuterium_tritium
    operator_kind: qualifier
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/emissivity_dt
    dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dt
    status: composed
- name: energy_of_detector_pixel
  kind: scalar
  status: draft
  description: Characteristic photon energy assigned to a detector pixel in an X-ray
    crystal spectrometer from the pixel's Bragg diffraction geometry.
  documentation: 'The energy of a detector pixel is the central photon energy represented
    by that pixel''s spectral channel in an X-ray crystal spectrometer. It is set
    by the pixel position relative to the diffracting crystal and detector surface,
    and is the energy counterpart of the pixel Bragg wavelength [wavelength_of_detector_pixel](name:wavelength_of_detector_pixel).
    The finite spectral acceptance of the pixel is bracketed by [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).


    For diffraction order $n$, the central pixel energy follows from Bragg''s law
    and the photon relation $E = hc/\lambda$:


    $$

    E_\mathrm{pix} = \frac{n h c}{2 e d \sin\theta_\mathrm{pix}}

    $$


    where $E_\mathrm{pix}$ is the photon energy in eV, $n$ is the dimensionless positive
    integer diffraction order, $h$ is Planck''s constant in J s, $c$ is the speed
    of light in vacuum in m s^-1, $e$ is the elementary charge used to convert joules
    to electronvolts, $d$ is the crystal-plane spacing in meters, and $\theta_\mathrm{pix}$
    is the Bragg angle for the pixel in radians.


    The energy-to-pixel mapping is obtained from the spectrometer geometry by ray
    tracing, from an optical model of the crystal and detector, or by calibration
    against emission lines with well-known photon energies. In fusion applications
    these lines often come from highly ionized impurities, such as He-like or H-like
    argon, krypton, or other injected species.


    Typical photon energies range from a few hundred eV for soft X-ray instruments
    to 5-20 keV for harder X-ray crystal spectrometers, depending on the chosen crystal
    spacing, diffraction order, viewing geometry, and target spectral lines.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_detector_pixel
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
- name: etendue_of_spectrometer_channel
  kind: scalar
  status: draft
  description: 'Optical throughput factor for a spectrometer channel, expressed as
    a linear etendue: an effective entrance-aperture length multiplied by the channel
    collection solid angle. It is the m.sr reduced counterpart of full area etendue,
    which uses aperture area and has units m^2.sr.'
  documentation: 'Etendue of a spectrometer channel is the optical acceptance that
    determines how much radiation from an extended source can be delivered through
    that channel. In general optics, etendue is an area-solid-angle throughput; this
    quantity represents the linear or reduced form used for slit-like or channelized
    spectrometers, where the aperture area has been reduced to an effective linear
    entrance dimension. More specific quantities, such as [spectral etendue of a spectrometer
    channel](name:spectral_etendue_of_spectrometer_channel), may include additional
    weighting by the spectral instrument function while retaining the same underlying
    throughput concept.


    The linear spectrometer-channel etendue can be written as an acceptance-weighted
    integral over entrance position and collection direction:


    $$

    G_\ell = \int_\ell \int_\Omega W(\ell'', \hat{s}) \, d\Omega \, d\ell''

    $$


    where $G_\ell$ is the linear etendue, $\ell''$ is position along the effective
    entrance aperture, $\hat{s}$ is a ray direction, $d\Omega$ is differential solid
    angle, and $W$ is a dimensionless acceptance weight including vignetting or other
    geometric acceptance effects. For uniform acceptance this reduces to the effective
    entrance length multiplied by the effective collection solid angle.


    It is usually computed from aperture dimensions, stops, fiber or slit geometry,
    optical magnification, and collection cone angle, often with ray tracing when
    the acceptance is not uniform. It can also be inferred experimentally by observing
    a calibrated extended radiance source and comparing the detected signal with the
    known source radiance and instrument response.


    Typical values for narrow-slit or fiber-coupled fusion spectrometer channels are
    about $10^{-10}$-$10^{-5}$ m.sr, with large-aperture high-throughput channels
    reaching roughly $10^{-4}$ m.sr. The value is non-negative and decreases with
    smaller apertures, stronger vignetting, or narrower collection cones.'
  unit: m.sr
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:etendue
  - name:efficiency_of_spectrometer_channel
  - name:effective_spectral_width_of_spectrometer_channel
  - name:spectral_etendue_of_spectrometer_channel
  sources:
  - id: derived:etendue_of_spectrometer_channel
    status: composed
- name: exposure_time_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Duration of the detector integration window for a spectrometer channel,
    defining the temporal interval over which incident photons are accumulated to
    form a single spectral measurement frame.
  documentation: "The exposure time of a spectrometer channel is the duration of the\
    \ detector integration window for a single spectral acquisition \u2014 the temporal\
    \ interval during which incident photons are continuously accumulated by the detector\
    \ to produce one spectral measurement. It directly controls the fundamental trade-off\
    \ between temporal resolution and signal-to-noise ratio: shorter exposures resolve\
    \ faster plasma dynamics, while longer exposures build up signal for weak emission\
    \ lines at the cost of temporal averaging.\n\nFor an integrating detector, the\
    \ accumulated signal count $N$ relates to the exposure time $t_\\mathrm{exp}$\
    \ and the incident photon rate $\\Phi$ as:\n\n$$\nN = \\Phi \\cdot t_\\mathrm{exp}\n\
    $$\n\nwhere $\\Phi$ is the photon flux reaching the detector active area. For\
    \ shot-noise-limited detection the signal-to-noise ratio scales as $\\sqrt{N}$,\
    \ so longer exposures are beneficial for faint spectral features.\n\nThe exposure\
    \ time is set by the acquisition timing system and may be configured independently\
    \ per channel in multi-channel or scanning spectrometer systems. It is selected\
    \ based on the expected emission intensity, the saturation threshold of the detector,\
    \ and the timescale of the plasma phenomenon under observation. The [spectral\
    \ flux of spectrometer channel](name:spectral_flux_of_spectrometer_channel) gives\
    \ the photon count rate accumulated within this integration window; together they\
    \ determine the total count per frame.\n\nTypical values span from a few microseconds\
    \ for fast transient events such as disruptions or edge-localized modes to tens\
    \ of milliseconds for quasi-steady emission measurements in ohmic or H-mode plasmas.\n\
    \nSign convention: Positive when the detector is actively integrating the spectral\
    \ signal over a valid acquisition interval."
  unit: s
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_flux_of_spectrometer_channel
  sources:
  - id: dd:spectrometer_visible/channel/filter_spectrometer/exposure_time
    dd_path: spectrometer_visible/channel/filter_spectrometer/exposure_time
    status: composed
- name: extent_of_detector_pixel
  kind: scalar
  status: draft
  description: Physical linear span of a detector pixel footprint along a specified
    direction in the detector plane. It supports pixel-index to physical-position
    calibration, but is distinct from optical resolution and from pixel pitch when
    inactive gaps or non-square pixels are present.
  documentation: 'Extent of a detector pixel is the linear span of one pixel footprint
    along a chosen detector-plane direction. The footprint may represent the active
    sensitive area for photon collection or the effective pixel cell used in a geometric
    calibration; it should not be confused with the center-to-center pitch unless
    neighboring pixels tile the detector plane without appreciable inactive gaps.
    For rectangular pixels, the horizontal and vertical extents are separate quantities;
    for square pixels they are equal.


    The extent along one local detector-plane axis is defined by the coordinate bounds
    of the pixel footprint:


    $$

    d_a = a_+ - a_-

    $$


    where $a \in \{u,v\}$ selects a coordinate of the local detector-plane frame $(\hat{u},\hat{v})$
    with coordinates $(u,v)$, $a_-$ and $a_+$ are the lower and upper footprint boundaries
    in meters, and the pixel center on that axis is $a_c=(a_-+a_+)/2$.


    Values are obtained from sensor design data, detector metrology, or calibration
    images of a target with known spacing. For index-to-position mappings, the origin
    and the center-versus-edge convention must be specified independently: if $u_0$
    is the lower edge of pixel $i=0$ in the local detector-plane frame $(\hat{u},\hat{v})$
    and $p_u$ is the pitch, the center of pixel $i$ lies at $u_0+(i+1/2)p_u$; $p_u=d_u$
    only for contiguous pixels with negligible gaps, with $u_0$, $p_u$, and $d_u$
    expressed in meters.


    Typical values are $5 \times 10^{-6}$-$2 \times 10^{-4}$ m. Infrared focal-plane
    sensors commonly use $1 \times 10^{-5}$-$5 \times 10^{-5}$ m pixel extents, while
    x-ray cameras and crystal-spectrometer detectors often use $1 \times 10^{-5}$-$1
    \times 10^{-4}$ m depending on sensor technology and required sampling.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_detector_pixel
  - name:extent_of_soft_xray_detector
  sources:
  - id: dd:camera_ir/channel/camera/pixel_size
    dd_path: camera_ir/channel/camera/pixel_size
    status: attached
  - id: dd:camera_x_rays/camera/pixel_dimensions
    dd_path: camera_x_rays/camera/pixel_dimensions
    status: attached
  - id: dd:spectrometer_x_ray_crystal/camera/pixel_dimensions
    dd_path: spectrometer_x_ray_crystal/camera/pixel_dimensions
    status: attached
  - id: dd:spectrometer_x_ray_crystal/channel/camera/pixel_dimensions
    dd_path: spectrometer_x_ray_crystal/channel/camera/pixel_dimensions
    status: attached
- name: extent_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Edge-to-edge active length of a soft X-ray detector measured along
    a specified in-plane detector axis, such as its horizontal or vertical sensitive
    direction. It describes the physical span that can register soft X-ray photons,
    excluding inactive borders or support structures.
  documentation: 'The extent of a soft X-ray detector is the physical edge-to-edge
    length of the photon-sensitive active area along one specified axis in the detector
    plane, such as the horizontal or vertical sensitive direction. It is a geometric
    calibration quantity for converting detector position to viewing angle, crystal-dispersion
    coordinate, or image position, and it is distinct from the size of non-sensitive
    packaging, mounts, or camera housing.


    If $u$ denotes distance along the measured detector-plane axis, the active extent
    is


    $$

    L_{\mathrm{det}} = u_{\max} - u_{\min}

    $$


    where $u_{\min}$ and $u_{\max}$ are the two active-edge coordinates of the photon-sensitive
    region in meters, and $L_{\mathrm{det}}$ is the detector extent along the same
    axis.


    The extent is determined from detector specifications, mechanical metrology, calibration
    masks, or image-based edge calibration. For a contiguous detector with uniform
    pixels along the same measured axis, it may be computed as $L_{\mathrm{det}} \simeq
    N_{\mathrm{pix}}\,\Delta u_{\mathrm{pix}}$, where $N_{\mathrm{pix}}$ is the number
    of active pixels and $\Delta u_{\mathrm{pix}}$ is the pixel pitch along that same
    axis; this relation should not mix horizontal and vertical pixel pitches, and
    it must be modified when gaps, dead margins, binning, or nonuniform pixels are
    present. For a detector at distance $D$ from an aperture or reference point, the
    small-angle angular span along the same axis is approximately $L_{\mathrm{det}}/D$.


    Typical active extents for soft X-ray cameras and crystal-spectrometer detectors
    are 0.005-0.3 m, with compact semiconductor sensors often near 0.005-0.05 m and
    larger spectroscopic imaging detectors commonly near 0.05-0.3 m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:angular_width_of_bragg_crystal
  - name:extent_of_detector_pixel
  sources:
  - id: dd:spectrometer_x_ray_crystal/camera/camera_dimensions
    dd_path: spectrometer_x_ray_crystal/camera/camera_dimensions
    status: attached
  - id: dd:spectrometer_x_ray_crystal/channel/camera/camera_dimensions
    dd_path: spectrometer_x_ray_crystal/channel/camera/camera_dimensions
    status: composed
- name: filter_window_width
  kind: scalar
  status: draft
  description: Filter window width is the full physical opening of a rectangular X-ray
    filter aperture measured along the X1 axis of the local right-handed aperture
    frame (X1, X2, X3), where X1 and X2 lie in the aperture plane and X3 is normal
    to the filter surface. It is the X1 counterpart of the aperture extent along X2
    given by the filter window height.
  documentation: 'Filter window width is the full linear extent of a rectangular filter
    window along the X1 axis of the local right-handed aperture frame (X1, X2, X3).
    The X1 and X2 axes lie in the aperture plane, X3 is the outward normal to the
    filter surface, and the orthogonal transverse extent along X2 is the [filter_window_height](name:filter_window_height).


    The width is the span of the rectangular opening between its two edges along the
    X1 axis:


    $$

    w = x_{1,\mathrm{max}} - x_{1,\mathrm{min}}

    $$


    where $x_{1,\mathrm{min}}$ and $x_{1,\mathrm{max}}$ are the X1 coordinates of
    the opposing aperture edges, measured in the local aperture plane. Together with
    the height $h$ from [filter_window_height](name:filter_window_height), the width
    $w$ sets the geometric open area $A = w\,h$ (see [surface_area_of_filter](name:surface_area_of_filter)),
    which contributes to the diagnostic etendue, the product of collecting area and
    accepted solid angle.


    The width is usually obtained from the mechanical design of the aperture, manufacturing
    drawings, or metrology of the filter holder. In transmission calculations it is
    used together with the filter material, angle of incidence, and [thickness_of_filter](name:thickness_of_filter)
    to determine the photon throughput and spectral response. It is the rectangular-geometry
    analog of the more general [width_of_diagnostic_aperture](name:width_of_diagnostic_aperture).


    Typical values range from $1 \times 10^{-4}$-$5 \times 10^{-2}$ m, with sub-millimeter
    openings used for narrow slits or high-resolution views and centimeter-scale openings
    used where larger photon collection is required.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:filter_window_height
  - name:surface_area_of_filter
  - name:thickness_of_filter
  - name:width_of_diagnostic_aperture
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/filter_window/x1_width
    dd_path: spectrometer_x_ray_crystal/channel/filter_window/x1_width
    status: composed
- name: flux_due_to_thermal_fusion
  kind: scalar
  status: draft
  description: Total neutron emission rate from all thermal fusion channels in the
    plasma, integrating D-D, D-T, and T-T thermonuclear reactions driven by Maxwellian
    bulk ion velocity distributions.
  documentation: "The global thermal-fusion neutron emission rate is the total count\
    \ of neutrons produced per unit time by thermonuclear reactions between fuel ions\
    \ whose velocity distributions are Maxwellian at the local ion temperature. It\
    \ aggregates all neutron-producing isotope-pair channels\u2014D-D, D-T, and T-T\u2014\
    while excluding contributions from beam-target or beam-beam fast-ion reactions.\n\
    \nThe total rate is the plasma-volume integral of the summed channel emissivities:\n\
    \n$$\n\\Phi_{\\mathrm{th}} = \\int_V \\sum_{a,b} f_{ab}\\, n_a\\, n_b\\, \\langle\
    \ \\sigma v \\rangle_{ab}(T_i) \\, dV\n$$\n\nwhere $n_a$ and $n_b$ are the reacting\
    \ species number densities, $\\langle \\sigma v \\rangle_{ab}(T_i)$ is the Maxwellian-averaged\
    \ fusion reactivity at local ion temperature $T_i$, and $f_{ab} = 1/2$ for identical-species\
    \ pairs to avoid double-counting. Channel-resolved contributions are provided\
    \ by [deuterium-deuterium thermal flux](name:deuterium_deuterium_flux_due_to_thermal_fusion)\
    \ and [tritium-tritium thermal flux](name:tritium_tritium_flux_due_to_thermal_fusion);\
    \ the D-T channel is described by [neutron flux due to thermal fusion](name:total_neutron_source_rate_due_to_thermal_fusion).\n\
    \nMeasured using neutron detectors\u2014activation foils, fission chambers, or\
    \ scintillator arrays\u2014positioned outside the vacuum vessel and absolutely\
    \ calibrated with activation samples or time-of-flight spectrometry. The companion\
    \ quantity [total neutron flux] includes non-thermal beam-target and beam-beam\
    \ contributions in addition to this thermal channel.\n\nIn pure DD plasmas the\
    \ rate is of order $10^{14}$\u2013$10^{16}$ s$^{-1}$; in DT-burning reactor-scale\
    \ plasmas the 14.1 MeV DT channel dominates and rates reach $10^{18}$\u2013$10^{20}$\
    \ s$^{-1}$.\n\nSign convention: Positive when neutrons are emitted from the plasma\
    \ at a net outward rate."
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_flux_due_to_thermal_fusion
  - name:tritium_tritium_flux_due_to_thermal_fusion
  - name:total_neutron_source_rate_due_to_thermal_fusion
- name: hard_xray_brightness
  kind: scalar
  status: draft
  description: Photon radiance of hard X-ray emission incident on a diagnostic channel,
    giving the photon flux per unit detector area and per unit solid angle, integrated
    over the channel energy band.
  documentation: "Hard X-ray brightness is the photon radiance of bremsstrahlung emission\
    \ arriving at a diagnostic channel, quantifying the photon arrival rate per unit\
    \ detector area and per unit solid angle. In tokamak plasmas, hard X-ray emission\
    \ above a few tens of keV is generated predominantly by non-thermal bremsstrahlung\
    \ from suprathermal electrons colliding with bulk plasma ions and impurity ions;\
    \ the channel brightness therefore constrains the suprathermal electron energy\
    \ distribution.\n\nThe photon radiance is defined as:\n\n$$\nL_\\gamma = \\frac{d^2\
    \ \\dot{N}_\\gamma}{dA \\, d\\Omega}\n$$\n\nwhere $\\dot{N}_\\gamma$ is the photon\
    \ arrival rate at the detector surface element $dA$, and $d\\Omega$ is the solid\
    \ angle element subtended at the source. The power-equivalent counterpart of this\
    \ photon radiance is given by [spectral_radiance_of_hard_xray_detector](name:spectral_radiance_of_hard_xray_detector),\
    \ which relates to $L_\\gamma$ via $L_P = \\langle h\\nu \\rangle L_\\gamma$,\
    \ where $\\langle h\\nu \\rangle$ is the mean photon energy in the detection band.\n\
    \nHard X-ray diagnostic channels employ collimated scintillator or semiconductor\
    \ detectors with defined energy bandpass filters. The brightness is obtained by\
    \ dividing the measured photon count rate by the detector \xE9tendue (product\
    \ of area and solid angle), and absolute calibration across multiple energy bands\
    \ enables reconstruction of the suprathermal electron spectrum through bremsstrahlung\
    \ inversion. The analogous photon-radiance quantity for the soft X-ray regime\
    \ is [brightness_of_soft_xray_detector](name:brightness_of_soft_xray_detector),\
    \ and the total integrated power over the channel acceptance is captured by hard_xray_power."
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance_of_hard_xray_detector
  - name:brightness_of_soft_xray_detector
  sources:
  - id: dd:hard_x_rays/channel/radiance
    dd_path: hard_x_rays/channel/radiance
    status: composed
- name: hard_xray_emissivity
  kind: scalar
  status: draft
  description: Local photon emission rate per unit volume and per unit solid angle,
    integrated over a specified hard-X-ray energy band. It is mainly produced by bremsstrahlung
    from suprathermal or runaway electrons decelerating in the Coulomb fields of plasma
    ions, and is not a per-energy spectral quantity.
  documentation: 'Hard-X-ray emissivity is the local rate at which photons are emitted
    into unit solid angle within a specified hard-X-ray energy interval. It is a non-negative,
    band-integrated bremsstrahlung quantity produced mainly by suprathermal or runaway
    electrons interacting with plasma ions. It differs from [bremsstrahlung_spectral_emissivity](name:bremsstrahlung_spectral_emissivity),
    which is resolved per photon energy.


    The band-integrated emissivity is obtained by integrating the spectral photon
    emissivity over the selected photon-energy interval:


    $$

    \varepsilon_{\mathrm{HXR}}(\mathbf{x}; E_1,E_2) = \int_{E_1}^{E_2} \varepsilon_E(\mathbf{x},E)\,dE

    $$


    where $\varepsilon_{\mathrm{HXR}}$ is the hard-X-ray emissivity, $\varepsilon_E$
    is the spectral photon emissivity per unit photon energy, $\mathbf{x}$ is position,
    and $E_1$ and $E_2$ define the analysis or detector energy band.


    In an optically thin plasma, the corresponding photon-rate brightness is related
    by the line-of-sight integral $B_{\mathrm{HXR}} = \int_{\mathrm{LOS}} \varepsilon_{\mathrm{HXR}}\,dl$
    before instrumental effects are applied. In practice, emissivity is inferred from
    multi-channel hard-X-ray measurements using forward modeling or tomographic reconstruction,
    including detector efficiency, viewing geometry, attenuation, and the chosen energy
    response. It depends on the suprathermal electron distribution, ion density and
    charge state, and bremsstrahlung cross sections, so it should not be interpreted
    as directly proportional to suprathermal electron density without a kinetic emission
    model. The related hard_xray_power is a detector or radiated energy-rate quantity
    in watts and requires weighting photon rates by photon energy and instrument response.


    Typical reconstructed band-integrated values range from near diagnostic background
    to about 10^10-10^15 m^-3.s^-1.sr^-1 for weak suprathermal tails, and can reach
    10^15-10^18 m^-3.s^-1.sr^-1 during strong runaway-electron or intense hard-X-ray
    events. The magnitude depends strongly on the lower energy threshold, bandwidth,
    plasma density and composition, and the high-energy tail of the electron distribution.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bremsstrahlung_spectral_emissivity
  sources:
  - id: dd:hard_x_rays/emissivity_profile_1d/emissivity
    dd_path: hard_x_rays/emissivity_profile_1d/emissivity
    status: composed
- name: height_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Full physical extent of a hard X-ray detector aperture along the local
    X2 axis of the detector coordinate frame, applicable to rectangular aperture geometry.
  documentation: "The height of a hard X-ray detector is the full dimension of the\
    \ detector aperture measured along the local X2 axis of the detector coordinate\
    \ frame (X1, X2, X3), where X1 and X2 lie in the nominal aperture plane and X3\
    \ is normal to the detector surface. This geometric parameter is defined for rectangular\
    \ aperture geometries and represents one of two orthogonal in-plane dimensions\
    \ required to fully characterize the aperture opening.\n\nTogether with [width_of_hard_xray_detector](name:width_of_hard_xray_detector),\
    \ which gives the X1 extent, the height defines the total aperture area $A = h\
    \ \\times w$, where $h$ is the X2 extent and $w$ is the X1 extent. The aperture\
    \ area enters the \xE9tendue calculation that determines the photon collection\
    \ efficiency of the diagnostic channel. The analogous X2 dimension for X-ray diagnostic\
    \ filter windows is [filter_window_height](name:filter_window_height), which follows\
    \ the same local-frame X2 convention.\n\nSign convention: Positive when the aperture\
    \ extent is measured in the direction of increasing X2 coordinate in the local\
    \ detector frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:width_of_hard_xray_detector
  - name:filter_window_height
  sources:
  - id: dd:hard_x_rays/channel/detector/x2_width
    dd_path: hard_x_rays/channel/detector/x2_width
    status: composed
- name: height_of_optical_element
  kind: scalar
  status: draft
  description: Height of an optical element is the usable physical aperture extent
    measured along X2 in the right-handed local aperture frame (X1, X2, n), where
    X1 and X2 span the aperture plane and n is the surface normal. It applies to rectangular
    optical elements and is distinct from the X1 width.
  documentation: 'Height of an optical element is the full usable clear-aperture dimension
    along $X_2$ in the right-handed local aperture frame $(X_1, X_2, n)$, where $X_1$
    and $X_2$ lie in the aperture plane and $n$ is the aperture normal. For a rectangular
    aperture it is the second transverse dimension of the element that can transmit,
    reflect, or otherwise accept radiation. It is distinct from [optical_element_width](name:optical_element_width),
    which is the corresponding $X_1$ dimension; the closely related [optical_element_height](name:height_of_optical_element)
    denotes the same physical $X_2$ extent with different standard-name wording.


    If the usable aperture is represented by the set $\mathcal{A}$ of points on the
    element projected onto the local aperture plane, the height is the extent of their
    $X_2$ coordinates:


    $$

    h_\mathrm{opt} = \max_{\mathbf{p}\in\mathcal{A}} X_2(\mathbf{p}) - \min_{\mathbf{p}\in\mathcal{A}}
    X_2(\mathbf{p})

    $$


    where $X_2(\mathbf{p})$ is the coordinate of point $\mathbf{p}$ along the second
    transverse aperture axis. For an ideal centered rectangle this reduces to the
    rectangle side length along $X_2$.


    In practice the value is obtained from mechanical design, metrology, or alignment
    surveys of mirrors, crystals, windows, filters, collimators, and camera apertures.
    It should represent the clear or illuminated usable extent that limits optical
    throughput and ray tracing, excluding opaque mounts, bevels, clamps, or damaged
    regions unless those regions are intentionally part of the aperture model.


    Typical values range from 0.001-0.05 m for small x-ray crystals, pinholes, and
    collimating apertures, 0.01-0.3 m for infrared camera apertures and relay optics,
    and 0.1-1 m for large windows or mirrors. The value is non-negative and may be
    smaller than the manufactured part size when the clear aperture is limited by
    holders or masks.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:optical_element_width
  sources:
  - id: dd:camera_ir/optical_element/geometry/x2_width
    dd_path: camera_ir/optical_element/geometry/x2_width
    status: attached
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/x2_width
    dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_width
    status: composed
- name: lower_bound_energy_of_detector_pixel
  kind: scalar
  status: draft
  description: Minimum photon energy accepted by a detector pixel in an X-ray crystal
    spectrometer. It is the low-energy edge of that pixel's photon-energy bandpass.
  documentation: 'The lower bound energy of a detector pixel is the minimum photon
    energy in the spectral interval accepted by that pixel. Together with the corresponding
    upper bound, it defines the pixel bandpass around the calibrated photon_energy
    coordinate.


    For a crystal spectrometer calibrated by Bragg diffraction, the lower bound for
    pixel $p$ can be written as the minimum energy over the Bragg-angle interval accepted
    by that pixel:


    $$

    E_{\mathrm{lower},p} = \min_{\theta \in \Omega_p} \frac{n h c}{2 d \sin\theta\,
    e}

    $$


    where $\Omega_p$ is the accepted Bragg-angle interval of pixel $p$, $n$ is the
    positive integer diffraction order for the calibrated spectral branch, $d$ is
    the crystal lattice-plane spacing, $h$ is Planck''s constant, $c$ is the speed
    of light, and $e$ is the elementary charge converting joules to electronvolts.
    Equivalently, if $d$ is expressed in nm, $hc/e = 1239.841984\ \mathrm{eV\,nm}$
    gives $E$ directly in eV.


    In practice this bound is obtained from the spectrometer geometry, crystal spacing
    and orientation, detector position, pixel aperture, and a wavelength or line-emission
    calibration. The finite pixel size and optical response determine the accepted
    angular interval, so the lower bound is the low-energy edge of the pixel response
    rather than merely the energy at its center.


    Typical lower bounds for fusion X-ray crystal spectrometers are 500-20000 eV,
    with common impurity-line measurements in the 3000-8000 eV range and harder spectral
    branches extending to 10000-50000 eV. Adjacent-pixel energy intervals are often
    a few eV to tens of eV, depending on dispersion and pixel size.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links: []
  arguments:
  - name: energy_of_detector_pixel
    operator: lower_bound
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/energy_bound_lower
    dd_path: spectrometer_x_ray_crystal/channel/energy_bound_lower
    status: attached
  - id: dd:spectrometer_x_ray_crystal/energy_bound_lower
    dd_path: spectrometer_x_ray_crystal/energy_bound_lower
    status: composed
- name: lower_photon_energy
  kind: scalar
  status: draft
  description: Minimum photon energy defining the low-energy edge of an X-ray detector,
    camera pixel, or energy-resolved emission band. Incident photons below this cutoff
    are rejected, not counted, or excluded from the corresponding photon-energy window.
  documentation: 'Lower photon energy is the minimum photon energy admitted by a photon-counting
    or energy-selective X-ray measurement. Together with an upper cutoff such as [upper_photon_energy](name:upper_photon_energy),
    it defines the accepted photon-energy interval; for pixel-specific thresholds
    it is the lower-edge counterpart of [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and is paired with [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).


    Photon energy is related to radiation frequency and wavelength by:


    $$

    E_\gamma = h\nu = \frac{hc}{\lambda}

    $$


    where $E_\gamma$ is photon energy, $h$ is Planck''s constant, $\nu$ is photon
    frequency, $c$ is the speed of light, and $\lambda$ is wavelength. The lower threshold
    $E_\mathrm{lower}$ selects photons satisfying $E_\gamma \ge E_\mathrm{lower}$,
    usually in combination with an upper threshold $E_\mathrm{upper}$.


    In practice this threshold is set by detector absorption filters, scintillator
    or semiconductor response, electronic discrimination levels, pulse-height analysis,
    or analysis choices used to isolate an energy band for emissivity inference. Calibration
    with known radiation sources or modeled detector response functions is used to
    relate the threshold setting to photon energy.


    Typical lower thresholds are about 100-1000 eV for soft X-ray measurements and
    about 1e3-1e5 eV for hard X-ray measurements, depending on detector material,
    filter stack, electronic noise floor, and the intended spectral band.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_photon_energy
  - name:lower_bound_energy_of_detector_pixel
  sources:
  - id: dd:camera_x_rays/energy_threshold_lower
    dd_path: camera_x_rays/energy_threshold_lower
    status: composed
