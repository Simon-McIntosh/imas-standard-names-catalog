- name: breakdown_initial_time
  kind: scalar
  status: active
  description: Timestamp at which plasma breakdown begins and discharge current starts to
    flow.
  documentation: 'This quantity identifies the instant at which plasma breakdown begins:
    plasma is initiated and discharge current starts to flow.


    It applies specifically to the onset of the plasma-breakdown phase in a discharge.
    It is an event timestamp, not an elapsed duration, period, or time assigned to
    a later phase of the discharge.


    The [pulse duration](name:pulse_duration) uses this breakdown instant as its starting
    point and measures the subsequent confined-plasma interval; therefore, this quantity
    and pulse duration represent distinct timing concepts.'
  unit: s
  physics_domain: machine_operations
  links:
  - name:pulse_duration
  sources:
  - kind: imas-dd
    ref: summary/time_breakdown/value
    version: 4.1.0
- name: pulse_duration
  kind: scalar
  status: active
  description: Elapsed duration from plasma breakdown until termination of auxiliary heating
    in a single discharge.
  documentation: 'The quantity is the elapsed duration for which a confined plasma
    exists during one discharge pulse. It is a global interval bounded by plasma breakdown
    and confined-plasma termination.


    The duration is defined by:


    $$

    \tau_{\rm plasma}=t_{\rm end}-t_{\rm breakdown}

    $$


    where $\tau_{\rm plasma}$ is the confined-plasma duration, $t_{\rm breakdown}$
    is the plasma-breakdown instant identified by the [breakdown initial time](name:breakdown_initial_time),
    and $t_{\rm end}$ is the instant at which the confined plasma terminates.


    The scope is one complete discharge pulse and the aggregation is one elapsed interval
    per pulse; durations from separate pulses are not combined. The quantity covers
    the existence of confined plasma, not the duration of an auxiliary-system pulse
    or an isolated event timestamp.


    The [breakdown initial time](name:breakdown_initial_time) supplies the lower endpoint
    of this interval. Unlike that timestamp, this quantity measures the elapsed time
    through the confined-plasma phase and ends at confined-plasma termination.'
  unit: s
  physics_domain: machine_operations
  links:
  - name:breakdown_initial_time
  sources:
  - kind: imas-dd
    ref: summary/plasma_duration/value
    version: 4.1.0
