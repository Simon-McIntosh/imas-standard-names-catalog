  status: active
  description: Particle number density of the electron population evaluated at the
    magnetic axis is the local electron count per physical volume at that location.
  documentation: 'Particle number density of the electron population evaluated at
    the magnetic axis is the local electron count per physical volume at that location.
    It represents electrons specifically, rather than ions, neutrals, or another plasma
    population.


    The defining relation is


    $$

    n_{e,\mathrm{axis}} = \left.\frac{dN_e}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{e,\mathrm{axis}}$ is the electron number density at the magnetic axis,
    $N_e$ is the number of electrons, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete electron population at that location and is neither a
    flux-surface or volume integral nor an ion or neutral density.


    This is the electron-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It must be distinguished
    from [total ion density at the magnetic axis](name:total_ion_density_at_magnetic_axis),
    which counts ions, and from [electron temperature at the magnetic axis](name:electron_temperature_at_magnetic_axis),
    which characterizes electron energy rather than particle count.'
