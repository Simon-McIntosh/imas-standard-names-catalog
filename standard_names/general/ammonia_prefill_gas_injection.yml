name: ammonia_prefill_gas_injection
status: draft
cocos_transformation_type: one_like
description: Number of ammonia (NH$_3$) molecules injected into the vessel as a prefill
  before plasma breakdown.
documentation: The ammonia prefill gas injection records the total NH$_3$ molecule
  count introduced into the vacuum vessel before plasma initiation, expressed as a
  dimensionless number. Prefilling with ammonia supplies both hydrogen and nitrogen
  to the initial neutral gas, influencing the breakdown electric-field threshold and
  early impurity content. Typical prefill values range from $10^{17}$ to $10^{20}$
  molecules, set by the target fill pressure and vessel volume. This quantity pairs
  with the accumulated injection (discharge-integrated total) and the instantaneous
  injection rate for a complete gas-balance picture.
