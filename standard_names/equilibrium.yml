- name: electron_density
  kind: scalar
  status: draft
  description: Number density of free electrons per unit volume in the plasma, encompassing
    both bulk thermal and non-thermal (fast or suprathermal) electron populations.
  documentation: "The electron density $n_e$ quantifies the number of free electrons\
    \ per unit volume at a given point in the plasma and is a fundamental scalar of\
    \ plasma state, entering directly into fluid, kinetic, and transport equations\
    \ governing plasma behavior.\n\nIn a quasi-neutral plasma, $n_e$ is constrained\
    \ by charge neutrality:\n\n$$\nn_e \\approx \\sum_s Z_s \\, n_s\n$$\n\nwhere $Z_s$\
    \ is the charge number and $n_s$ the number density of ion species $s$, with the\
    \ sum extending over all ion species. Departures from quasi-neutrality are confined\
    \ to length scales of order the Debye length $\\lambda_D$.\n\nThomson scattering\
    \ measures $n_e$ locally from the total intensity of incoherently scattered laser\
    \ light; interferometry and reflectometry provide line-integrated or cutoff-layer\
    \ measurements; and Langmuir probes at the plasma boundary infer $n_e$ from the\
    \ ion saturation current. Together these diagnostics span the full radial range\
    \ from core to scrape-off layer.\n\nCore electron densities in H-mode tokamaks\
    \ lie in the range $1$\u2013$20 \\times 10^{19}$ m$^{-3}$, falling to $10^{17}$\u2013\
    $10^{18}$ m$^{-3}$ in the scrape-off layer. The bulk thermal component alone is\
    \ captured by [thermal_electron_density](name:thermal_electron_density), the non-thermal\
    \ component by [fast_electron_density](name:fast_electron_density), and the plasma-volume\
    \ average by [volume_averaged_electron_density](name:volume_averaged_electron_density)."
  unit: m^-3
  physics_domain: equilibrium
  links:
  - name:thermal_electron_density
  - name:fast_electron_density
  - name:volume_averaged_electron_density
