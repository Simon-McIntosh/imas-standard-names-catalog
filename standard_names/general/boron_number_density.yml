name: boron_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of boron particles (all charge states combined) in the
  plasma, typically present as a light impurity species.
documentation: The boron number density $n_{\mathrm{B}}$ (in $\mathrm{m^{-3}}$) represents
  the total volumetric concentration of boron atoms and ions across all ionization
  stages. Boron is one of the most common low-$Z$ impurities in tokamak plasmas, introduced
  intentionally through boronization wall conditioning to reduce oxygen and carbon
  influx, or eroded from boron-carbide plasma-facing components. Typical core values
  range from $10^{16}$ to $10^{18}\;\mathrm{m^{-3}}$ depending on wall conditioning
  and plasma regime. $n_{\mathrm{B}}$ contributes to the effective charge $Z_{\mathrm{eff}}
  = \sum_s n_s Z_s^2 / n_e$, where $n_s$ and $Z_s$ are the density and charge number
  of species $s$ and $n_e$ is the electron density. It is commonly inferred from charge-exchange
  recombination spectroscopy (CXRS) or visible bremsstrahlung measurements. See also
  `boron_ion_number_density` for the ionized fraction and `electron_number_density`
  for the total electron population.
