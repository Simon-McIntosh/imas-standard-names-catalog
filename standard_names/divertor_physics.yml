- name: argon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of singly- or multiply-ionized argon atoms measured
    at the divertor target surface.
  documentation: 'The argon ion density $n_{\mathrm{Ar}^{+}}$ at the divertor target
    quantifies the local concentration of argon impurity ions in the plasma incident
    on the target plate. Argon is commonly injected as a radiating impurity for divertor
    power exhaust mitigation, and its density influences the local radiation balance
    and plasma detachment. Typical values range from $10^{16}$ to $10^{19}\,\mathrm{m}^{-3}$
    in the divertor region of magnetically confined fusion devices, depending on the
    seeding rate and divertor conditions. This quantity is often inferred from spectroscopic
    measurements of argon line emission combined with collisional-radiative modeling,
    or from Langmuir probe data with known argon fraction. The sign of the density
    is positive by definition; a zero value indicates no argon ions present.


    Sign convention: Positive when argon ions are present at the divertor target,
    zero otherwise. Provides a local measurement of argon impurity density, complementary
    to integrated quantities such as [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)
    and [nitrogen_density_at_divertor_target](name:nitrogen_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:carbon_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/argon/value
    dd_path: summary/local/divertor_target/n_i/argon/value
    status: composed
- name: beryllium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of beryllium ions incident upon or residing at the divertor
    target.
  documentation: 'The beryllium ion density at the divertor target quantifies the
    local concentration of sputtered or transported beryllium atoms that have been
    ionized, typically by electron impact, and reach the target surface. Beryllium
    is a common plasma-facing material in fusion devices such as ITER; its eroded
    ions re-deposit on divertor components, affecting plasma composition and fueling.
    The density is measured using spectroscopic line emission (e.g., Be II or Be IV
    lines) interpreted via collisional-radiative models, or inferred from target probes
    and post-mortem surface analysis. Typical values span $10^{16}$ to $10^{20}$ m$^{-3}$
    depending on the erosion rate, divertor geometry, and plasma conditions. This
    quantity relates directly to erosion sources and the overall impurity content
    in the divertor region and is a counterpart to similar species densities such
    as [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)
    and [boron_density_at_divertor_target](name:boron_density_at_divertor_target).


    Sign convention: Positive when the flux of beryllium ions is directed toward the
    target surface.


    The quantity is inherently positive for a measured or modeled density; the sign
    convention applies to the associated flux interpretation.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/beryllium/value
    dd_path: summary/local/divertor_target/n_i/beryllium/value
    status: composed
- name: boron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of boron ions in the plasma at the divertor target.
  documentation: "The number density $n_{\\text{B},\\text{target}}$ quantifies the\
    \ concentration of boron ions incident on the divertor target surface. Boron originates\
    \ from the plasma-facing wall coatings and from boronization conditioning, acting\
    \ as an intrinsic low-Z impurity that burdens the divertor with its transport\
    \ into the scrape-off layer. At the target, typical boron densities range $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ in tokamaks, depending on erosion rates and wall conditioning.\
    \ This quantity is related to the total ion density through the sum of all impurity\
    \ species densities, and is used alongside other intrinsic impurities such as\
    \ [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target)\
    \ and [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)\
    \ to assess divertor erosion and core impurity content.\n\nSign convention: Positive\
    \ for the physical boron ion concentration at the target location."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:beryllium_density_at_divertor_target
  - name:carbon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/boron/value
    dd_path: summary/local/divertor_target/n_i/boron/value
    status: composed
- name: carbon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local number density of carbon particles at the plasma-facing surface
    of the divertor target, representing the concentration of carbon atoms and ions
    irrespective of their direction of travel relative to the surface.
  documentation: 'The carbon density at the divertor target, $n_{\mathrm{C,target}}$,
    is the volumetric number density of carbon species (atoms, ions, and molecules)
    in the plasma region immediately adjacent to the target surface. This quantity
    is governed by the balance between carbon influx from sputtering or impurity injection
    and losses due to ionization, transport, and redeposition.


    A common model relates the carbon density to the incident ion flux and the effective
    sputtering yield:


    $$n_{\mathrm{C,target}} \approx \frac{Y_{\mathrm{C}}\, \Gamma_{\mathrm{ion}}}{v_{\mathrm{C}}}$$


    where $Y_{\mathrm{C}}$ is the carbon sputtering yield, $\Gamma_{\mathrm{ion}}$
    is the incident ion flux density, and $v_{\mathrm{C}}$ is the characteristic carbon
    transport velocity near the target.


    Typical values for carbon density at the divertor target in tokamaks range from
    $10^{16}\,\mathrm{m}^{-3}$ in low-recycling detached regimes to $10^{19}\,\mathrm{m}^{-3}$
    in attached high-flux conditions.


    This quantity is distinct from the carbon flux density; it is a local state variable
    reflecting the instantaneous carbon particle concentration at the target surface,
    independent of the direction of carbon motion.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:hydrogen_density_at_divertor_target
  - name:electron_density_at_divertor_plate
  sources:
  - id: dd:summary/local/divertor_target/n_i/carbon/value
    dd_path: summary/local/divertor_target/n_i/carbon/value
    status: composed
- name: deuterium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of deuterium ions in the plasma flux impinging on the
    divertor target.
  documentation: The deuterium ion density at the divertor target is a key quantity
    for characterizing the particles and heat flux reaching the divertor surface in
    a fusion plasma. It is derived from the plasma-facing ion flux and the ion velocity
    parallel to the magnetic field at the target sheath entrance. This density is
    distinct from the upstream core density and is typically much higher due to plasma
    compression in the divertor leg. Typical values in a detached divertor regime
    can range from 10^19 to 10^21 m^-3, depending on the upstream density and power
    entering the divertor. It is closely related to [electron_density_at_divertor_plate](name:electron_density_at_divertor_plate)
    through quasineutrality, though the electron density may be slightly lower in
    the presence of negative ions or dust. The deuterium density is also linked to
    [ion_temperature_at_divertor_plate](name:ion_temperature_at_divertor_plate) via
    the sheath heat transmission. Measurements are typically inferred from Langmuir
    probes or from spectroscopic line emission using collisional-radiative models.
    This quantity is always non-negative; physically it represents a particle density
    magnitude, so it is sign-invariant.
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_plate
  - name:ion_temperature_at_divertor_plate
  sources:
  - id: dd:summary/local/divertor_target/n_i/deuterium/value
    dd_path: summary/local/divertor_target/n_i/deuterium/value
    status: composed
- name: deuterium_tritium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of deuterium-tritium (D-T) fuel ions incident on the
    divertor target surface.
  documentation: 'This quantity gives the total number density of deuterium and tritium
    ions (both D+ and T+) in the plasma that is incident on the divertor target surface.
    It is a non-negative scalar field on the target surface, representing the volumetric
    ion density at the sheath entrance or target boundary, not a particle flux. The
    total D-T density is approximately the sum of the individual deuterium and tritium
    densities, i.e., $n_{\mathrm{DT}} \approx n_{\mathrm{D}^+} + n_{\mathrm{T}^+}$,
    assuming negligible molecular or impurity contributions at the target. This density
    is closely related to the electron density at the target via quasi-neutrality:
    $n_e \approx n_{\mathrm{D}^+} + n_{\mathrm{T}^+} + \sum_i Z_i n_i$ for other ion
    species. Typical values in a divertor plasma range from $10^{18}\,\mathrm{m}^{-3}$
    (low-recycling, attached conditions) to $10^{21}\,\mathrm{m}^{-3}$ (detached,
    high-recycling regimes). The measurement context includes Langmuir probe analysis,
    spectroscopy, and fluid modeling of the divertor region, where the D-T ion density
    is a key input for interpreting target heat flux, plasma-neutral interactions,
    and erosion.


    Sign convention: Positive when the density is determined at the location of the
    divertor target surface, regardless of direction; density is a scalar and has
    no sign with respect to flow direction.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/deuterium_tritium/value
    dd_path: summary/local/divertor_target/n_i/deuterium_tritium/value
    status: composed
- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Density-weighted mean ionic charge of the plasma mixture at the divertor
    target surface, quantifying the effective charge state of all ion species present.
  documentation: 'The effective charge $Z_{\text{eff}} = \sum_i n_i Z_i^2 / \sum_i
    n_i Z_i$ represents the average ionic charge weighted by density, where $n_i$
    is the number density of ion species $i$ and $Z_i$ is its charge state. This quantity
    directly influences the plasma resistivity and bremsstrahlung radiation losses.
    At the divertor target, $Z_{\text{eff}}$ is typically elevated relative to the
    core due to influx of impurity species (e.g., carbon, beryllium, argon) from plasma-surface
    interactions, with values ranging from 1.5 in clean deuterium plasmas to above
    5 in impurity-dominated regimes. It is inferred from spectroscopic measurements
    of line emission from multiple charge states combined with collisional-radiative
    modeling. $Z_{\text{eff}}$ is sign-invariant as a non-negative scalar; it carries
    no directional sign convention.


    Sign convention: Positive when the weighted mean ionic charge is positive.


    The quantity contrasts with individual impurity densities such as [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)
    and [argon_density_at_divertor_target](name:argon_density_at_divertor_target),
    which specify concentrations of a single species without summing charge states.'
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:carbon_density_at_divertor_target
  - name:argon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/zeff/value
    dd_path: summary/local/divertor_plate/zeff/value
    status: composed
- name: electron_density_at_divertor_plate
  kind: scalar
  status: draft
  description: Electron number density (ne) at the divertor plate, characterizing
    the plasma density at the plasma-material interface.
  documentation: 'This quantity represents the electron number density $n_e$ at the
    divertor plate, the component of the divertor where the plasma-facing surface
    intersects the SOL flux tubes. The electron density at this location is a key
    parameter for estimating heat flux deposition, plasma recycling, and impurity
    generation rates at the divertor targets. It is typically derived from Langmuir
    probe measurements or from spectroscopic line-ratio analysis of the divertor plasma,
    with values ranging from approximately $10^{18}\text{ m}^{-3}$ in the far SOL
    to over $10^{20}\text{ m}^{-3}$ near the strike point in detached divertor regimes.
    The density is related to the particle flux to the plate via $\Gamma_e = n_e c_s$,
    where $c_s = \sqrt{(T_e + T_i)/m_i}$ is the ion sound speed. For consistency,
    compare with [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    and [ion_density_at_divertor_plate](name:ion_density_at_divertor_plate).


    Sign convention: Positive when $n_e$ is a positive real number, as electron density
    is an inherently non-negative quantity.


    Measurements are typically performed by Langmuir probe arrays embedded in the
    divertor plates, or by analysis of Stark-broadened hydrogenic line emission. The
    quantity is essential for divertor power balance calculations and for validating
    models of scrape-off-layer transport.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:ion_density_at_divertor_plate
  sources:
  - id: dd:summary/local/divertor_plate/n_e/value
    dd_path: summary/local/divertor_plate/n_e/value
    status: composed
- name: electron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Electron number density (ne) at the divertor target surface. Governs
    sheath physics, power flux dissipation, and atomic processes in the divertor region.
  documentation: "The electron density at the divertor target $n_{e,t}$ is a fundamental\
    \ parameter in the two-point model of scrape-off-layer (SOL) plasma. It determines\
    \ the ion saturation current density $j_\\mathrm{sat} = e n_e c_s$ via the sound\
    \ speed $c_s = \\sqrt{(T_e + T_i)/m_i}$, where $T_e$ and $T_i$ are the electron\
    \ and ion temperatures (in eV) and $m_i$ is the ion mass. Typical values range\
    \ from $1 \\times 10^{19}$ to $1 \\times 10^{21}\\,\\mathrm{m}^{-3}$ depending\
    \ on the plasma regime (e.g., low-density L-mode vs. high-recycling or detached\
    \ H-mode). Measurements are obtained from Langmuir probes (analyzing the IV characteristic\
    \ for the electron branch), Thomson scattering (near the target), or from divertor\
    \ spectroscopy via Balmer line ratios (e.g., $n_e$ from Stark broadening). The\
    \ accuracy depends on probe sheath expansion factor corrections (typically 0.5\u2013\
    1) and the validity of the thin-sheath assumption; in detached conditions, the\
    \ low temperature $T_e \\lesssim 5$ eV makes probe interpretation more uncertain.\
    \ The value is often used to infer the power flux parallel to the field line via\
    \ $q_\\parallel = \\gamma k_B T_e n_e c_s$ with sheath heat transmission coefficient\
    \ $\\gamma \\approx 7$.\n\nSign convention: Positive when physically present."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:ion_density_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/two_point_model/n_e_target
    dd_path: divertors/divertor/target/two_point_model/n_e_target
    status: composed
  - id: dd:summary/local/divertor_target/n_e/value
    dd_path: summary/local/divertor_target/n_e/value
    status: composed
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Power deposited on the inner divertor target by the incident electron
    flux.
  documentation: This quantity represents the total power reaching the inner (high-field
    side) divertor target from the electron population. It is a key component of the
    divertor heat load and is determined by the electron density and temperature at
    the target, $P_e = \gamma_e k_B T_e \Gamma_e A$, where $\gamma_e \sim 2-5$ is
    the sheath heat transmission coefficient for electrons, $k_B T_e$ is the electron
    thermal energy, $\Gamma_e$ is the electron particle flux, and $A$ is the target
    area. The power is typically inferred from target Langmuir probe arrays and infrared
    thermography, with values ranging from a few MW/m$^2$ in L-mode to tens of MW/m$^2$
    in H-mode and detached regimes. This name is the inboard counterpart of [electron_power_at_outer_divertor_target](name:electron_power_at_outer_divertor_target)
    and complements the total power deposition from both species described by [ion_power_at_inner_divertor_target](name:ion_power_at_inner_divertor_target).
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_outer_divertor_target
  - name:ion_power_at_inner_divertor_target
  sources:
  - id: dd:wall/global_quantities/electrons/power_inner_target
    dd_path: wall/global_quantities/electrons/power_inner_target
    status: composed
- name: electron_power_at_outer_divertor_target
  kind: scalar
  status: draft
  description: Power deposited on the outer divertor target by the incident electron
    flux, contributing to the total target heat load.
  documentation: "The electron power incident on the outer divertor target represents\
    \ the energy flux carried by electrons that strike the target surface. It combines\
    \ the electron particle flux with the electron temperature via $P_e = \\gamma_e\
    \ \\, k_B T_e \\, \\Gamma_e \\, A_{\\text{target}}$, where $\\Gamma_e$ is the\
    \ electron particle flux density, $k_B T_e$ is the electron thermal energy, $A_{\\\
    text{target}}$ is the target area, and $\\gamma_e$ is the electron sheath transmission\
    \ coefficient (typically $\\gamma_e \\sim 2$). This power governs the heat load\
    \ on the outer strike-point region and is a critical input for divertor design\
    \ and plasma-facing component lifetime. In detached divertor conditions, the electron\
    \ power is strongly reduced by volumetric momentum and power losses from atomic\
    \ processes such as ionization, radiation, and charge-exchange. The quantity is\
    \ routinely inferred from Langmuir probe arrays and infrared thermography measurements\
    \ at the outer target. Typical values range from 1\u2013100 MW/m\xB2 in high-performance\
    \ H-mode plasmas, depending on the divertor regime. See also [electron_power_at_inner_divertor_target](name:electron_power_at_inner_divertor_target)\
    \ for the corresponding inner target quantity and [ion_power_at_inner_divertor_target](name:ion_power_at_inner_divertor_target)\
    \ for the ion contribution."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_inner_divertor_target
  - name:ion_power_at_inner_divertor_target
  sources:
  - id: dd:wall/global_quantities/electrons/power_outer_target
    dd_path: wall/global_quantities/electrons/power_outer_target
    status: composed
- name: electron_temperature_at_divertor_plate
  kind: scalar
  status: draft
  description: Thermal energy of the electron population at the divertor plate, expressed
    as a temperature via the second moment of the velocity distribution.
  documentation: "The electron temperature at the divertor plate, $T_e$, characterizes\
    \ the thermal energy of electrons incident on the plasma-material interface. It\
    \ is a critical parameter determining the sheath potential, heat flux to the surface,\
    \ and the onset of plasma detachment. $T_e$ at the plate is typically several\
    \ electronvolts in detached regimes and can exceed 10\u201330 eV in attached,\
    \ high-recycling conditions. Measurement is often performed by swept Langmuir\
    \ probes or Thomson scattering in the divertor region. The heat flux parallel\
    \ to the magnetic field carried by electrons scales as $q_{\\parallel e} \\approx\
    \ \\gamma_e n_e T_e c_s$, where $\\gamma_e \\approx 4.5$ is the electron sheath\
    \ heat transmission factor, $n_e$ is the [electron density at the divertor plate](name:electron_density_at_divertor_plate),\
    \ and $c_s$ is the ion sound speed. The corresponding ion temperature is given\
    \ by [ion temperature at the divertor plate](name:ion_temperature_at_divertor_plate),\
    \ and $T_e$ at the upstream target can be compared via [electron temperature at\
    \ the divertor target](name:electron_temperature_at_divertor_target).\n\nSign\
    \ convention: Positive when the electron population has a positive temperature."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_plate
  - name:ion_temperature_at_divertor_plate
  - name:electron_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/t_e/value
    dd_path: summary/local/divertor_plate/t_e/value
    status: composed
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Thermal energy of the electron population at the divertor target surface,
    expressed as a temperature via the second moment of the velocity distribution.
  documentation: "The electron temperature at the divertor target, $T_{e,\\text{target}}$,\
    \ quantifies the thermal energy of the electron population incident on the plasma-facing\
    \ surface. It is a critical parameter controlling the sheath potential, the incident\
    \ ion energy, and the power flux to the target. The power flux parallel to the\
    \ magnetic field is given by $q_\\parallel = \\gamma n_e T_{e,\\text{target}}\
    \ c_s \\, (e\\,\\text{eV}^{-1})$, where $\\gamma$ is the sheath heat transmission\
    \ coefficient (typically 5\u20137), $n_e$ is the electron density, $T_{e,\\text{target}}$\
    \ is in eV (converted to Joules via the elementary charge $e$ to ensure dimensional\
    \ consistency with $q_\\parallel$ in W/m\xB2), and $c_s = \\sqrt{(T_{e,\\text{target}}\
    \ + T_i)/m_i}$ is the ion sound speed. Typical values range from 1\u201310 eV\
    \ in a detached divertor to 20\u2013100 eV in an attached regime, measured by\
    \ Langmuir probes, Thomson scattering, or spectroscopic line-ratio methods. Lower\
    \ $T_{e,\\text{target}}$ reduces physical sputtering and heat loads, making it\
    \ a key actuator for divertor detachment control. This quantity is directly related\
    \ to the plasma density and power deposition at the target."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:electron_power_at_inner_divertor_target
  - name:electron_temperature_at_divertor_plate
  sources:
  - id: dd:divertors/divertor/target/two_point_model/t_e_target
    dd_path: divertors/divertor/target/two_point_model/t_e_target
    status: composed
  - id: dd:summary/local/divertor_target/t_e/value
    dd_path: summary/local/divertor_target/t_e/value
    status: composed
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of helium-3 ions in the plasma flux impinging on the
    divertor target.
  documentation: 'The helium-3 ion density at the divertor target quantifies the local
    concentration of $^3$He$^+$ ions in the plasma that reaches the target surface.
    This density is a key input for assessing helium exhaust efficiency, fuel mixture
    control, and plasma-wall interaction processes in fusion devices. It is typically
    inferred from spectroscopic measurements of He-II emission lines or from target
    Langmuir probe analysis combined with charge-state modeling, with values ranging
    from $10^{17}$ to $10^{20}$ m$^{-3}$ depending on the divertor regime and fueling
    conditions. The helium-3 density is related to the total ion density via $n_{i,\text{total}}
    = \sum_s n_s$, where $n_s$ includes all species such as [deuterium](name:deuterium_density_at_divertor_target)
    and [tritium](name:tritium_density_at_divertor_target). Alongside the total ion
    density at the divertor target and the electron density at the divertor target,
    this quantity constrains the ion flux and pressure balance in the divertor region.


    Sign convention: Positive when the density of helium-3 ions at the divertor target
    is greater than zero.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:tritium_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/helium_3/value
    dd_path: summary/local/divertor_target/n_i/helium_3/value
    status: composed
- name: helium_4_density_at_divertor_target
  kind: scalar
  status: draft
  description: "Number density of singly ionized helium-4 (\u03B1-particle) ions incident\
    \ on the plasma-facing surface of the divertor target."
  documentation: "The helium-4 density at the divertor target characterizes the flux\
    \ of fusion-born alpha particles transported into the divertor region diagnosing\
    \ helium exhaust efficiency and core fueling balance. For a D-T fusion plasma\
    \ the local He$^{2+}$ density $n_{\\mathrm{He\\text{-}4}}$ at the target results\
    \ from thermal alpha particle production ($n_{\\mathrm{He}} \\propto n_D n_T \\\
    langle \\sigma v \\rangle_{\\mathrm{DT}}$) plus any external helium injection.\
    \ Typical divertor target densities for He$^{2+}$ range $10^{18}$\u2013$10^{19}\\\
    ,\\mathrm{m}^{-3}$ in attached regimes rising above $10^{20}\\,\\mathrm{m}^{-3}$\
    \ in detached or partially detached conditions. Inferred from spectroscopy of\
    \ neutral helium line emission (e.g. He~I 587.6~nm) or from Langmuir probe ion\
    \ saturation current combined with charge-state modeling. Closely related to [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target)\
    \ for the lighter isotope and to [ion_density_at_divertor_target](name:ion_density_at_divertor_target)\
    \ for the total ion inventory. The quantity is always non-negative and physically\
    \ bounded by the total particle source in the scrape-off layer.\n\nSign convention:\
    \ Positive when He$^{4+}$ ions are present at the divertor target surface, zero\
    \ in the absence of such ions."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:helium_3_density_at_divertor_target
  - name:ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/helium_4/value
    dd_path: summary/local/divertor_target/n_i/helium_4/value
