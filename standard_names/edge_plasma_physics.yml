- name: helium_4_density_at_pedestal
  kind: scalar
  status: draft
  description: Volume number density of helium-4 (alpha) ions at the pedestal top,
    the radial location of maximum pressure gradient in the edge transport barrier.
  documentation: "The helium-4 density at the pedestal top, $n_{\\mathrm{He\\text{-}4},\\\
    mathrm{ped}}$, is a key parameter for characterizing the edge pedestal structure\
    \ in H-mode plasmas. It is typically inferred from charge-exchange recombination\
    \ spectroscopy or measured by neutral-particle analyzers, and often appears in\
    \ pedestal pressure and stability analyzes together with [electron_density_at_separatrix](name:electron_density_at_separatrix)\
    \ and [ion_temperature](name:ion_temperature). The pedestal top is defined as\
    \ the location of steepest pressure gradient within the edge transport barrier,\
    \ and the helium-4 density there sets the boundary condition for core alpha-particle\
    \ confinement and scrape-off-layer fueling.\n\nSign convention: Positive when\
    \ the local number density of helium-4 ions is physically present \u2014 this\
    \ quantity is intrinsically non-negative.\n\nTypical core helium-4 densities range\
    \ from $10^{17}\\,\\mathrm{m}^{-3}$ in low-density regimes to $10^{20}\\,\\mathrm{m}^{-3}$\
    \ in high-performance H-mode scenarios; the pedestal-top value is typically a\
    \ fraction (0.1\u20130.5) of the central density. The density is radially localized\
    \ at the pedestal top, distinct from the [helium_4_density_at_separatrix](name:helium_4_density_at_separatrix)\
    \ or [helium_4_density_at_magnetic_axis](name:helium_4_density_at_magnetic_axis)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_separatrix
  - name:ion_temperature
  - name:helium_4_density_at_separatrix
  - name:helium_4_density_at_magnetic_axis
