- name: height_of_ion_cyclotron_heating_antenna_strap
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of an ICRH antenna
    strap conductor, defining its extent in the poloidal (Z) direction.
  documentation: 'The height of an ion cyclotron resonance heating (ICRH) antenna
    strap is the full vertical extent of its rectangular cross-section, measured along
    the $Z$ axis of the right-handed cylindrical $(R, \phi, Z)$ frame where $Z$ is
    the vertical coordinate. Together with [width](name:width_of_ion_cyclotron_heating_antenna_strap)
    and [thickness](name:thickness_of_ion_cyclotron_heating_antenna_strap), this dimension
    fully characterizes the cross-sectional geometry of the strap conductor, which
    governs its current-carrying capacity, RF impedance, and thermal loading during
    high-power operation. The strap cross-sectional geometry is a fixed engineering
    parameter specified at design time and verified by metrology; typical heights
    for tokamak ICRH straps fall in the range of a few centimeters to tens of centimeters
    depending on the machine size and power requirements. The [vertical coordinate
    of the rectangle center](name:vertical_coordinate_of_rectangle_center_of_ion_cyclotron_heating_antenna_strap)
    locates the strap in the poloidal plane, while the [length](name:length_of_ion_cyclotron_heating_antenna_strap)
    describes the strap''s extent along its principal conductor axis.


    Sign convention: Positive when the height extends in the direction of increasing
    $Z$ (upward from the machine midplane).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_ion_cyclotron_heating_antenna_strap
  - name:thickness_of_ion_cyclotron_heating_antenna_strap
  - name:vertical_coordinate_of_rectangle_center_of_ion_cyclotron_heating_antenna_strap
  - name:length_of_ion_cyclotron_heating_antenna_strap
  constraints: []
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/height
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/height
    status: composed
- name: length_of_ion_cyclotron_heating_antenna_strap
  kind: scalar
  status: draft
  description: Length of an ion cyclotron resonance heating (ICRH) antenna strap conductor
    measured along its longest axis in the oblique cross-sectional geometry, corresponding
    to the strap's extent in the direction perpendicular to its cross-section plane.
    This dimension is distinct from the strap width and thickness, which characterize
    the cross-sectional face.
  documentation: "## Length of ICRH Antenna Strap\n\nThis quantity specifies the length\
    \ of an individual strap conductor belonging to an ion cyclotron resonance heating\
    \ (ICRH) antenna module, as stored at `ic_antennas/antenna/module/strap/geometry/oblique/length`\
    \ in the IMAS data dictionary.\n\nIn the oblique strap geometry, the strap is\
    \ characterized by three independent linear dimensions:\n- **length**: the extent\
    \ along the strap's longest (longitudinal) axis, i.e., the dimension perpendicular\
    \ to the oblique cross-sectional face;\n- **width**: the cross-sectional dimension\
    \ in the poloidal or toroidal direction, depending on strap orientation;\n- **height**\
    \ (or **thickness**): the remaining cross-sectional dimension.\n\nThe length dimension\
    \ governs the resonant electrical behavior of the strap and is a key parameter\
    \ in antenna modeling codes (e.g., TOPICA, ANTITER). Typical ICRH strap lengths\
    \ on medium-to-large tokamaks range from approximately $0.3\\,\\mathrm{m}$ to\
    \ $1.5\\,\\mathrm{m}$, consistent with quarter-wave or half-wave resonance conditions\
    \ at frequencies in the range $25\\text{\u2013}120\\,\\mathrm{MHz}$.\n\nThe oblique\
    \ geometry means the strap cross-section is not necessarily aligned with the cylindrical\
    \ $(R, \\phi, Z)$ frame; the length is always measured along the conductor's own\
    \ longitudinal axis regardless of its orientation in the machine. When precise\
    \ directional decomposition is required, companion quantities such as the toroidal\
    \ component of the strap width should be consulted.\n\n**DD source path:** `ic_antennas/antenna/module/strap/geometry/oblique/length`\
    \ (unit: m)"
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_ion_cyclotron_heating_antenna_strap
  - name:height_of_ion_cyclotron_heating_antenna_strap
  - name:thickness_of_ion_cyclotron_heating_antenna_strap
  constraints: []
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/length
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/length
    status: composed
- name: toroidal_component_of_width_of_ion_cyclotron_heating_antenna_strap
  kind: scalar
  status: draft
  description: Toroidal extent of an ion cyclotron resonance heating (ICRH) antenna
    strap, measuring the arc length or linear dimension of the strap conductor along
    the toroidal direction $\hat{\phi}$.
  documentation: "The toroidal width of an ICRH antenna strap defines the dimension\
    \ of the strap conductor measured along the toroidal direction $\\hat{\\phi}$\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame. This dimension directly\
    \ governs the toroidal current distribution on the strap and influences the antenna's\
    \ coupling resistance and the spectrum of waves launched into the plasma; a wider\
    \ strap shifts the parallel wave-number spectrum $k_\\parallel$ toward lower values.\
    \ Together with [width_of_ion_cyclotron_heating_antenna_strap](name:width_of_ion_cyclotron_heating_antenna_strap)\
    \ (the horizontal cross-sectional width), [height_of_ion_cyclotron_heating_antenna_strap](name:height_of_ion_cyclotron_heating_antenna_strap)\
    \ (the poloidal extent), and [thickness_of_ion_cyclotron_heating_antenna_strap](name:thickness_of_ion_cyclotron_heating_antenna_strap)\
    \ (the depth), this quantity fully characterizes the strap conductor geometry\
    \ for electromagnetic modeling of antenna-plasma coupling. Typical values range\
    \ from a few centimeters to tens of centimeters depending on the machine size\
    \ and antenna design, with ITER-scale straps spanning on the order of 0.1\u2013\
    0.3 m in the toroidal direction. The value is determined from engineering drawings\
    \ or direct metrology of the fabricated antenna structure.\n\nSign convention:\
    \ Positive when the strap extent is measured in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_ion_cyclotron_heating_antenna_strap
  - name:height_of_ion_cyclotron_heating_antenna_strap
  - name:thickness_of_ion_cyclotron_heating_antenna_strap
  constraints: []
  arguments:
