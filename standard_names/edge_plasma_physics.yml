    dd_path: summary/local/separatrix_average/n_i/helium_4/value
    status: composed
- name: flux_surface_averaged_helium_4_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of helium-4 ions at the plasma
    boundary (separatrix), summed over all helium-4 charge states (He+ and He2+).
  documentation: "The flux-surface-averaged helium-4 ion number density at the plasma\
    \ boundary is the poloidal average of $n_{\\rm He4}$ over the last closed flux\
    \ surface, the separatrix dividing the magnetically confined plasma from the open-field-line\
    \ scrape-off layer. Helium-4, produced primarily by deuterium\u2013tritium fusion\
    \ reactions, constitutes the principal fusion ash species; its concentration at\
    \ the boundary characterizes helium exhaust efficiency and the risk of core fuel\
    \ dilution. The density is summed over all helium-4 charge states present as ions,\
    \ $\\mathrm{He}^+$ and fully stripped $\\mathrm{He}^{2+}$, consistent with the\
    \ parent quantity [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary).\n\
    \nThe flux-surface average reduces the poloidal variation to a single scalar via:\n\
    \n$$\n\\langle n_{\\rm He4} \\rangle = \\frac{\\oint n_{\\rm He4} \\, dS \\, /\
    \ |\\nabla \\psi|}{\\oint dS \\, / |\\nabla \\psi|}\n$$\n\nwhere $dS$ is the surface\
    \ element on the flux surface and $\\nabla \\psi$ is the gradient of the poloidal\
    \ magnetic flux $\\psi$.\n\nThis scalar boundary value provides an outer boundary\
    \ condition for helium-4 transport modeling in the confined plasma. It is inferred\
    \ from charge-exchange recombination spectroscopy or passive spectroscopic emission\
    \ measurements in the edge region, or from integrated edge transport simulations.\
    \ Elevated values relative to the main ion density indicate insufficient helium\
    \ pumping. The analogous quantity for the helium-3 isotope is [flux_surface_averaged_helium_3_density_at_plasma_boundary](name:flux_surface_averaged_helium_3_density_at_plasma_boundary),\
    \ and [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary)\
    \ provides the corresponding main fuel species reference.\n\nSign convention:\
    \ Positive when helium-4 ions are present at the plasma boundary; as a particle\
    \ number density, this quantity is non-negative by definition."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_4_density_at_plasma_boundary
  - name:flux_surface_averaged_helium_3_density_at_plasma_boundary
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
  arguments:
  - name: helium_4_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
