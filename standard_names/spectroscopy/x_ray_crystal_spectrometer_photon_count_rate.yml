name: x_ray_crystal_spectrometer_photon_count_rate
status: draft
description: Number of X-ray photons detected per unit time on a pixel of the crystal
  spectrometer, before spectral inversion.
documentation: "The photon count rate $\\dot{N}$ (in counts s$^{-1}$) records the\
  \ raw detection rate on each pixel of a spatially or spectrally resolving X-ray\
  \ crystal spectrometer (XRCS). The crystal (typically quartz, silicon, or germanium)\
  \ Bragg-diffracts plasma X-ray emission in a narrow energy band onto a position-sensitive\
  \ detector (CCD, GEM, or multi-wire proportional counter), so each pixel maps to\
  \ a specific wavelength or spatial chord. Typical count rates range from $10^2$\u2013\
  $10^6$ counts s$^{-1}$ per pixel depending on plasma density, impurity concentration,\
  \ and crystal reflectivity; pile-up corrections become necessary above $\\sim 10^5$\
  \ counts s$^{-1}$ per pixel for photon-counting detectors. The spectral distribution\
  \ of $\\dot{N}$ across pixels is used to extract ion temperature $T_i$ from Doppler\
  \ broadening and toroidal rotation velocity from the line centroid shift of He-like\
  \ or H-like impurity transitions (e.g., Ar XVII at $\\sim$3.95 \xC5). Signal-to-noise\
  \ scales as $\\sqrt{\\dot{N}\\,\\Delta t}$ where $\\Delta t$ is the integration\
  \ time. See also `thomson_scattering_spectral_signal_amplitude` for an analogous\
  \ spectral amplitude quantity and `isotope_ratio_signal_to_noise` for SNR characterization\
  \ in visible spectroscopy."
