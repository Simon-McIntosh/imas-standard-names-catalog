name: tendency_of_poloidal_magnetic_flux
status: draft
description: Time derivative of the poloidal magnetic flux $\psi$, equal to the induced
  loop voltage profile via Faraday's law.
documentation: "Defined as $\\partial \\psi / \\partial t$ (V), where $\\psi$ is the\
  \ poloidal magnetic flux function (Wb). By Faraday's law, $\\partial \\psi / \\\
  partial t = -V_{\\mathrm{loop}}$, linking this quantity directly to the loop voltage\
  \ profile. In the flux-diffusion equation used by transport solvers, $\\partial\
  \ \\psi / \\partial t = \\frac{1}{\\mu_0 \\sigma_\\parallel} \\nabla^2 \\psi + \\\
  text{(non-inductive sources)}$, where $\\mu_0$ is the vacuum permeability (H/m)\
  \ and $\\sigma_\\parallel$ is the parallel electrical conductivity (S/m). Positive\
  \ $\\partial \\psi / \\partial t$ corresponds to increasing enclosed poloidal flux;\
  \ the COCOS convention determines the overall sign relationship with the toroidal\
  \ current direction. Typical magnitudes are of order 0.1\u201310 V in tokamak equilibria.\
  \ This quantity is a primary output of diffusion-equation-based transport solvers\
  \ (e.g., RAPTOR, JINTRAC). See `poloidal_magnetic_flux` for the base profile and\
  \ `poloidal_component_of_magnetic_field` for the related field component."
