name: fast_neutral_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of non-thermal (supra-thermal) neutral particles whose
  energies significantly exceed the local thermal energy.
documentation: "The fast neutral number density $n_0^{\\mathrm{fast}}$ (in $\\mathrm{m^{-3}}$)\
  \ counts the population of neutral atoms or molecules whose kinetic energies lie\
  \ well above the local thermal distribution, typically originating from charge-exchange\
  \ reactions with energetic beam or fast ions. In a neutral beam injection (NBI)\
  \ scenario, fast neutrals at the beam energy (30\u2013100 keV per nucleon) penetrate\
  \ the plasma edge before ionizing; the resulting $n_0^{\\mathrm{fast}}$ profile\
  \ peaks near the beam deposition zone with values of order $10^{14}$\u2013$10^{16}\\\
  ;\\mathrm{m^{-3}}$, falling off with the charge-exchange mean free path. When multiple\
  \ charge states are present, the fast neutral density is summed over all states.\
  \ This quantity is computed by Monte Carlo neutral transport codes (EIRENE, FIDASIM)\
  \ or inferred from fast-ion $D_\\alpha$ (FIDA) spectroscopy. See also `neutral_number_density`\
  \ for the total (thermal plus non-thermal) counterpart."
