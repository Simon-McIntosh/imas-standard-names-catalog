- name: temperature_at_outboard_midplane
  kind: scalar
  status: active
  description: Temperature at the outboard midplane is the scalar kinetic temperature
    of a specified plasma particle population at the low-field-side equatorial intersection
    of a chosen magnetic flux surface. It represents the local random kinetic energy
    of that population, independent of species-specific specialization.
  documentation: 'Temperature at the outboard midplane is the scalar kinetic temperature
    of a specified plasma particle population evaluated where a chosen magnetic flux
    surface intersects the low-field-side equatorial plane. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height, this
    is the midplane intersection on the larger-$R$ side of the magnetic axis.


    The energy-equivalent scalar temperature for population $a$ is defined from the
    local pressure tensor by:


    $$

    T_a = \frac{\operatorname{tr}\mathbf{P}_a}{3 n_a}

    $$


    where $\mathbf{P}_a$ is the pressure tensor, $n_a$ is the number density, and
    both are evaluated locally at the outboard midplane. For an isotropic velocity
    distribution this is equivalently two thirds of the mean random kinetic energy
    per particle.


    This parent quantity is population-generic; species-specific instances, such as
    [electron temperature at outboard midplane](name:electron_temperature_at_outboard_midplane),
    use the same outboard-midplane locus and scalar kinetic-temperature definition.
    It is distinct from a flux-surface average, a volume average, or a temperature
    evaluated at any other midplane or radial location.'
  unit: eV
  physics_domain: turbulence
  links:
  - name:electron_temperature_at_outboard_midplane
  - name:energy_density
- name: electron_temperature_at_outboard_midplane
  kind: scalar
  status: active
  description: Kinetic temperature of the bulk electron population at the low-field-side
    intersection of a chosen magnetic flux surface with the equatorial midplane.
  documentation: 'The electron temperature at the outboard midplane is the local energy-equivalent
    kinetic temperature of the bulk electron population at the low-field-side equatorial
    intersection of a chosen magnetic flux surface. It is the electron-specific component
    of [temperature at outboard midplane](name:temperature_at_outboard_midplane).


    For an isotropic electron velocity distribution, the energy-equivalent temperature
    is defined by


    $$

    T_e = \frac{2}{3}\left\langle E_{e,\mathrm{rand}} \right\rangle

    $$


    where $T_e$ is the electron temperature, and $\left\langle E_{e,\mathrm{rand}}
    \right\rangle$ is the mean random kinetic energy per electron, with both expressed
    on the same energy scale.


    This quantity is local to the outboard-midplane intersection and is not a field-line
    average, flux-surface average, or value at the plasma boundary.'
  unit: eV
  physics_domain: turbulence
  links:
  - name:temperature_at_outboard_midplane
  arguments:
  - name: temperature_at_outboard_midplane
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: gyrokinetics_local/normalizing_quantities/t_e
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-normalizing_quantities-t_e
    dd_documentation:
