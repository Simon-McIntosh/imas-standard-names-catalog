- name: tilt_angle_of_passive_loop
  kind: scalar
  status: active
  description: "Signed inclination of a passive conducting loop element\u2019s overall\
    \ geometric reference axis in the poloidal plane, distinct from oblique cross-section\
    \ shape angles."
  documentation: "The tilt angle specifies the orientation of a passive conducting\
    \ loop element\u2019s directed geometric reference axis in the poloidal plane.\
    \ It describes the overall orientation of the element, not an inclination parameter\
    \ defining the shape of an oblique cross-section, and is analogous to the orientation\
    \ defined for a [tilt angle of a plasma filament](name:tilt_angle_of_plasma_filament).\n\
    \nLet the reference-axis direction have components $t_R$ and $t_Z$ along the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical\
    \ height. The tilt angle is defined by\n\n$$\n\\theta_{\\mathrm{tilt}} = \\operatorname{atan2}(t_Z,t_R)\n\
    $$\n\nwhere $\\operatorname{atan2}$ returns the directed angle from the outward\
    \ $+R$ direction toward the upward $+Z$ direction.\n\nSign convention: Positive\
    \ when the reference axis rotates from $+R$ toward $+Z$."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:tilt_angle_of_plasma_filament
  sources:
