name: toroidal_momentum_source_due_to_j_cross_b_force
status: draft
description: Volumetric source of toroidal angular momentum arising from the Lorentz
  ($\mathbf{j} \times \mathbf{B}$) force acting on the thermal plasma.
documentation: "This quantity represents the toroidal projection of the $\\mathbf{j}\
  \ \\times \\mathbf{B}$ force density acting as a momentum source in the toroidal\
  \ angular momentum transport equation: $\\partial (m_i n_i R v_\\phi) / \\partial\
  \ t + \\nabla \\cdot \\Pi_\\phi = \\tau_{\\phi}$, where $\\tau_\\phi$ includes this\
  \ $\\mathbf{j} \\times \\mathbf{B}$ torque contribution. Specifically, the toroidal\
  \ torque density is $\\tau_{j \\times B} = R\\,(\\mathbf{j} \\times \\mathbf{B})\
  \ \\cdot \\hat{\\phi}$, where $R$ is the major-radius coordinate (m), $\\mathbf{j}$\
  \ the current density ($\\mathrm{A\\,m^{-2}}$), $\\mathbf{B}$ the magnetic field\
  \ (T), and $\\hat{\\phi}$ the unit toroidal vector. This torque arises from radial\
  \ currents (e.g., induced by NBI-driven fast ions, neoclassical effects, or MHD\
  \ activity) crossing the poloidal magnetic field. In NBI-heated H-mode plasmas,\
  \ this term can reach $\\sim 0.1$\u2013$10\\;\\mathrm{N\\,m^{-2}}$ locally. Evaluated\
  \ from equilibrium reconstruction combined with current-density profiles, or self-consistently\
  \ in transport solvers. See also `ion_particle_flux` for related transport quantities."
validity_domain: ''
