- name: poloidal_magnetic_field_at_constraint_position
  kind: scalar
  status: active
  description: Poloidal magnetic field at a constraint position is the signed poloidal-field
    value at a spatial locus used as an equilibrium magnetic constraint. If the locus
    corresponds to a local field probe, the value represents the calibrated field
    after nonlinear probe response is accounted for, not a linear-response signal.
  documentation: 'Poloidal magnetic field at a constraint position is the signed projection
    of the local magnetic field onto the positive poloidal-plane direction associated
    with an equilibrium magnetic constraint. The poloidal plane is spanned by $(\hat{R},\hat{Z})$
    in the right-handed cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$
    and $\hat{R}\times\hat{\phi}=\hat{Z}$, where $R$ is major radius, $\phi$ is toroidal
    angle increasing counterclockwise when viewed from above $+\hat{Z}$, and $Z$ is
    vertical height. The magnetic-field component along $\hat{\phi}$ is excluded.


    The scalar value is defined by the local projection


    $$

    B_{\mathrm{pol},c} = \mathbf{B}(R_c,\phi_c,Z_c)\cdot\hat{\mathbf{s}}_{\mathrm{pol},c}
    = B_R(R_c,\phi_c,Z_c)s_R + B_Z(R_c,\phi_c,Z_c)s_Z

    $$


    where $B_{\mathrm{pol},c}$ is this scalar, $\mathbf{B}$ is the [magnetic field](name:magnetic_field),
    $(R_c,\phi_c,Z_c)$ are the major-radius, toroidal-angle, and vertical-height coordinates
    of the constraint position in the right-handed cylindrical $(R,\phi,Z)$ frame,
    $B_R$ is the [radial magnetic-field component](name:radial_magnetic_field), $B_Z$
    is the [vertical magnetic-field component](name:vertical_magnetic_field), and
    $\hat{\mathbf{s}}_{\mathrm{pol},c}=s_R\hat{R}+s_Z\hat{Z}$ is the unit vector defining
    the positive poloidal-plane direction for the constraint, with no $\hat{\phi}$
    component.


    The scope is one point-evaluated scalar at the constraint position, the spatial
    locus at which the magnetic-field value constrains an equilibrium. It is not a
    spatial average, a flux-surface average, a field-line average, or a surface integral,
    and the constraint position does not by itself define an extended region. When
    the locus is associated with a local poloidal-field probe, this quantity denotes
    the calibrated magnetic-field value after nonlinear probe response is represented
    in the field value; it is distinct from an uncorrected linear-response signal.


    This quantity is a direction-resolved local component of the total [magnetic field](name:magnetic_field)
    and of its [poloidal magnetic field](name:poloidal_magnetic_field) part. It reduces
    to [radial magnetic field](name:radial_magnetic_field) when $\hat{\mathbf{s}}_{\mathrm{pol},c}=\hat{R}$
    and to [vertical magnetic field](name:vertical_magnetic_field) when $\hat{\mathbf{s}}_{\mathrm{pol},c}=\hat{Z}$.
    It differs from [toroidal magnetic field](name:toroidal_magnetic_field), which
    is the $\hat{\phi}$ component, and from a magnetic-field magnitude, which does
    not retain this signed projection direction.


    Sign convention: Positive when the local magnetic field at the constraint position
    has a component in the specified positive poloidal-plane direction.'
  unit: T
  physics_domain: equilibrium
  links: []
  sources:
