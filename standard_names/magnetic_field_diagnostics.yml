- name: beat_length_of_optical_fiber
  kind: scalar
  status: draft
  description: Polarization beat length of a birefringent optical fiber, the axial
    distance over which the polarization state completes one full cycle due to modal
    birefringence.
  documentation: "The polarization beat length $L_B$ of an optical fiber is defined\
    \ by $L_B = \\lambda / B$, where $\\lambda$ is the free-space optical wavelength\
    \ and $B = |n_x - n_y|$ is the modal birefringence \u2014 the difference between\
    \ the effective refractive indices of the two orthogonal polarization eigenmodes.\
    \ A shorter beat length corresponds to stronger birefringence and faster polarization\
    \ rotation. In fiber-optic current sensor (FOCS) diagnostics, $L_B$ governs the\
    \ sensitivity of the polarimetric signal to the Faraday effect; it must be distinguished\
    \ from the [spun period](name:spun_period_of_optical_fiber) and [twist period](name:twist_period_of_optical_fiber),\
    \ which describe geometric helical structure rather than polarization cycling.\
    \ Typical beat lengths for high-birefringence (PANDA or bow-tie) fibers used in\
    \ FOCS applications range from a few millimeters to tens of centimeters, whereas\
    \ standard single-mode fibers may have beat lengths of several meters. The beat\
    \ length is measured via distributed polarimetry, white-light interferometry,\
    \ or polarization-mode dispersion techniques applied along the [fiber length](name:length_of_optical_fiber).\n\
    \nSign convention: Positive when $L_B$ is the physical axial distance in the direction\
    \ of light propagation along the fiber."
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:spun_period_of_optical_fiber
  - name:twist_period_of_optical_fiber
  - name:length_of_optical_fiber
  constraints: []
  sources:
  - id: dd:focs/beat_length
    dd_path: focs/beat_length
    status: composed
- name: cross_sectional_area_of_magnetic_field_probe
  kind: scalar
  status: draft
  description: Geometric cross-sectional area of each sensing turn of a magnetic field
    probe coil, determining the effective flux aperture per turn for inductive voltage
    measurements.
  documentation: 'The cross-sectional area $A$ of each coil turn sets the magnetic
    flux $\Phi = B_\perp A$ linked per turn, where $B_\perp$ is the component of magnetic
    field normal to the coil plane. This area is a primary calibration parameter:
    the induced voltage per turn is $V = -d\Phi/dt = -A \, dB_\perp/dt$, so an accurate
    value of $A$ is required to convert raw voltage signals into field or flux-density
    measurements. For poloidal field probes (pickup coils) on present-day tokamaks,
    typical turn areas range from $10^{-4}$ to $10^{-2}$ m$^2$ depending on probe
    size and installation constraints; toroidal field probes tend toward the lower
    end of this range. The area is measured mechanically (caliper or coordinate metrology)
    or inferred from in-situ calibration against a known field source, and must account
    for the actual winding geometry rather than the housing cross-section. Together
    with [winding turns](name:winding_turns_of_pickup_coil), this quantity fully characterizes
    the flux sensitivity of a pickup coil; for Rogowski coils, the analogous geometric
    parameter is the [linear winding density](name:winding_turns_per_unit_length_of_rogowski_coil)
    times the turn area.


    Sign convention: Positive when the outward normal of the coil plane is oriented
    such that a positive normal magnetic-field component produces a positive flux
    linkage.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:winding_turns_of_pickup_coil
  - name:winding_turns_per_unit_length_of_rogowski_coil
  constraints: []
  sources:
  - id: dd:magnetics/b_field_tor_probe/area
    dd_path: magnetics/b_field_tor_probe/area
    status: composed
  - id: dd:magnetics/bpol_probe/area
    dd_path: magnetics/bpol_probe/area
    status: composed
- name: mutual_inductance_of_flux_loop_plasma_coupling
  kind: scalar
  status: draft
  description: Mutual inductance matrix coupling distributed plasma current filaments
    to poloidal flux loop diagnostics, giving the total poloidal flux linked by each
    loop per unit current in each plasma filament. Entries depend on the geometry
    of both the plasma discretization and the loop winding, and vary with equilibrium
    configuration.
  documentation: 'The mutual inductance matrix $M^{\mathrm{loop,plasma}}$ has elements

    $$M_{il} = \frac{\Psi_i}{I_l},$$

    where $\Psi_i$ is the total poloidal flux (in Webers) linked by flux loop $i$
    due to a unit current $I_l = 1\,\mathrm{A}$ carried by plasma filament $l$, with
    all other filament currents set to zero. The quantity $\Psi_i$ is the flux threading
    the full loop circuit, accounting for the number of turns $N_i$ and the winding
    orientation of the diagnostic, so $\Psi_i = N_i \int_{S_i} \mathbf{B}\cdot d\mathbf{S}$,
    where $S_i$ is the oriented surface bounded by loop $i$.


    Matrix indexing convention: the first index $i$ runs over flux loops and the second
    index $l$ runs over plasma filaments. Each plasma filament is modeled as an infinitely
    thin current-carrying wire whose axis is parallel to $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame; the filament position is specified by its $(R,
    Z)$ coordinates in the poloidal plane, and it carries current in the $+\hat{\phi}$
    direction when $I_l > 0$. Each flux loop is oriented such that positive poloidal
    flux threading its surface in the $+\hat{\phi}$-winding sense contributes positively
    to $\Psi_i$.


    Sign convention: Positive when a filament current flowing in the direction of
    increasing toroidal angle $\phi$ links positive poloidal flux into the flux loop
    according to the right-hand rule applied to the loop''s winding orientation.


    For a single axisymmetric filament at $(R_l, Z_l)$ and a single-turn loop, $M_{il}$
    can be expressed via the Neumann formula adapted for an axisymmetric filament
    and an arbitrary loop contour $\mathcal{C}_i$:

    $$M_{il} = \frac{\mu_0}{4\pi} \oint_{\mathcal{C}_i} \oint_{\mathcal{C}_l} \frac{d\mathbf{s}_i
    \cdot d\mathbf{s}_l}{|\mathbf{r}_i - \mathbf{r}_l|},$$

    where $\mathcal{C}_l$ is the circular filament path at radius $R_l$ and height
    $Z_l$. In practice, because plasma filaments represent a discretization of distributed
    current, the elements are computed numerically from Green''s functions of the
    poloidal flux for a unit toroidal current ring, evaluated at each loop''s geometry.


    Typical values for a medium-sized tokamak lie in the range $10^{-8}$ to $10^{-5}\,\mathrm{H}$,
    depending on the proximity of the filament to the loop and the number of turns.
    The matrix is configuration-dependent: it changes with the equilibrium current
    distribution, so it must be recomputed whenever the plasma geometry is updated.
    It is the plasma analog of the active-coil-to-flux-loop mutual inductance matrix
    and is used in equilibrium reconstruction codes to relate measured loop voltages
    or flux signals to the reconstructed plasma current distribution.'
  unit: H
  physics_domain: magnetic_field_diagnostics
  links:
  - name:mutual_inductance_of_flux_loop_passive_coupling
  - name:mutual_inductance_of_plasma_passive_coupling
  - name:mutual_inductance_of_plasma_active_coupling
  - name:mutual_inductance_of_plasma_filament_to_plasma_filament_coupling
  - name:mutual_inductance_of_plasma_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_loops_plasma
    dd_path: em_coupling/mutual_loops_plasma
    status: composed
- name: non_linear_response_corrected_magnetic_field_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Magnetic field measured at a poloidal magnetic field probe after correction
    for the probe's non-linear response, accounting for saturation effects that render
    the linear calibration inaccurate at high field amplitudes.
  documentation: "Poloidal magnetic field probes \u2014 typically Hall-effect sensors\
    \ or wound coils \u2014 exhibit a non-linear input\u2013output relationship at\
    \ elevated field amplitudes where the linear assumption $B = k \\cdot V$ (with\
    \ $k$ the sensitivity and $V$ the probe signal) breaks down due to core saturation\
    \ or sensor non-linearity. The non-linear response correction replaces the linear-calibration\
    \ estimate with a field value $B_{\\rm NL}$ derived from a calibrated non-linear\
    \ transfer function, so that $B_{\\rm NL} = f^{-1}(V)$ where $f$ is the empirically\
    \ determined response curve of the sensor. This corrected quantity supersedes\
    \ the [linear-response calibration field](name:linear_response_calibration_magnetic_field_of_poloidal_magnetic_field_probe)\
    \ when the probe operates near or beyond its linear dynamic range, and the two\
    \ values agree closely at low field amplitudes where the linear regime holds.\
    \ The directly analogous correction applied to toroidal probes is captured by\
    \ [non-linear-response-corrected toroidal field](name:non_linear_response_corrected_magnetic_field_of_toroidal_magnetic_field_probe).\
    \ Typical poloidal field amplitudes measured in this way range from a few millitesla\
    \ in the far scrape-off layer to several tesla near high-field coils; accurate\
    \ non-linear correction is particularly important for probes located close to\
    \ poloidal field coils during transient events such as disruptions or fast current\
    \ ramps."
  unit: T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:linear_response_calibration_magnetic_field_of_poloidal_magnetic_field_probe
  - name:non_linear_response_corrected_magnetic_field_of_toroidal_magnetic_field_probe
  constraints: []
  sources:
  - id: dd:magnetics/b_field_pol_probe/non_linear_response/b_field_non_linear
    dd_path: magnetics/b_field_pol_probe/non_linear_response/b_field_non_linear
    status: composed
- name: non_linear_response_corrected_magnetic_field_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Magnetic field measured by a toroidal magnetic field probe after correction
    for the probe's non-linear response. This calibrated estimate accounts for sensor
    saturation and non-linear sensitivity at high field amplitudes, providing the
    best available measurement of the toroidal magnetic field component over the full
    operating range.
  documentation: 'The non-linear-response-corrected magnetic field $B_{\phi,\mathrm{NL}}$
    is the calibrated estimate of the toroidal magnetic field component $B_\phi$ produced
    by a toroidal magnetic field probe, in which the full non-linear transfer function
    $B = f(V)$ has been applied to the raw probe signal $V$. This supersedes the linear-calibration
    estimate when the field amplitude is large enough for non-linear effects (sensor
    saturation, permeability variation) to be significant, but the corrected value
    is defined and valid over the entire operating range of the probe.


    The measured component is the toroidal component $B_\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $\phi$ is the toroidal angle increasing
    counter-clockwise when viewed from above $+\hat{Z}$. The probe is oriented so
    that its sensitive axis is aligned along $\hat{\phi}$ at the probe location $(R_0,
    \phi_0, Z_0)$.


    Sign convention: Positive when the measured toroidal magnetic field points in
    the direction of increasing toroidal angle $\phi$ (counter-clockwise viewed from
    above $+\hat{Z}$).


    Typical values for a tokamak toroidal field probe range from $\sim 1\,\mathrm{T}$
    to $\sim 10\,\mathrm{T}$ depending on machine size and operating scenario. The
    non-linear correction becomes important when the instantaneous field exceeds the
    linear dynamic range of the sensor, typically a few percent or more of the nominal
    field. The non-linear calibration function $f$ is determined during dedicated
    bench calibration campaigns and may be stored as a polynomial or look-up table.


    This quantity is the toroidal analog of the non-linear-response-corrected field
    for poloidal probes, and complements the linear-response estimate obtained from
    the same probe using a first-order sensitivity coefficient.'
  unit: T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:linear_response_calibration_magnetic_field_of_poloidal_magnetic_field_probe
  - name:non_linear_response_corrected_magnetic_field_of_poloidal_magnetic_field_probe
  - name:toroidal_angle_of_magnetic_field_probe_sensor_normal
  constraints: []
  sources:
