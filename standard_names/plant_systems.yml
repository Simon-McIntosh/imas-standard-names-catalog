  description: "Major-radius component of the shattered-pellet center-of-mass velocity\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the velocity of a shattered pellet\u2019s center\
    \ of mass projected onto the major-radius direction. It describes the collective\
    \ radial motion of the fragments, not the velocity of an individual fragment or\
    \ the plasma.\n\nThe radial component is defined by\n\n$$\nv_R = \\mathbf{v}_{\\\
    mathrm{cm}} \\cdot \\hat{\\mathbf{R}}\n$$\n\nwhere $\\mathbf{v}_{\\mathrm{cm}}$\
    \ is the center-of-mass velocity, $\\hat{\\mathbf{R}}$ is the outward radial unit\
    \ vector, and $v_R$ is the resulting component. The frame is the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame with basis $(\\hat{\\mathbf{R}}, \\hat{\\\
    boldsymbol{\\phi}}, \\hat{\\mathbf{Z}})$. The center-of-mass velocity is mass-weighted\
    \ over the shattered fragments. Together with the [toroidal velocity of the pellet](name:toroidal_velocity_of_pellet)\
    \ and [vertical velocity of the pellet](name:vertical_velocity_of_pellet), this\
    \ component specifies the pellet center-of-mass velocity in the cylindrical frame.\n\
    \nSign convention: Positive when the shattered-pellet center of mass moves toward\
    \ increasing major radius $R$, along $+\\hat{\\mathbf{R}}$."
  unit: m.s^-1
