- name: vertical_coordinate_of_shatter_cone_origin
  kind: scalar
  status: draft
  description: Vertical height coordinate $Z$ of the origin point of the shatter cone
    in the right-handed cylindrical $(R, \phi, Z)$ frame, locating where the SPI pellet
    impacts the shattering target.
  documentation: 'The vertical coordinate of the shatter cone origin specifies the
    $Z$-position (height above the machine midplane) of the apex point from which
    the shatter cone geometry is defined for a Shattered Pellet Injector (SPI). Together
    with the corresponding radial and toroidal (or Cartesian $x$, $y$) origin coordinates,
    it fully localizes the point at which the intact pellet strikes the shattering
    target and fragments into a debris cloud. This location determines the initial
    spatial distribution of ablating pellet fragments and directly affects where material
    is deposited in the plasma. The $Z$ coordinate is typically specified from mechanical
    survey or injector alignment data and remains fixed for a given injector geometry.
    In tokamak installations, values range from near the midplane ($Z \approx 0$)
    to several tenths of a meter above or below it, depending on injector port location.
    The shatter cone orientation is fully described by the [shatter_cone_direction_unit_vector](name:shatter_cone_direction_unit_vector),
    [shatter_cone_major_unit_vector](name:shatter_cone_major_unit_vector), and [shatter_cone_minor_unit_vector](name:shatter_cone_minor_unit_vector),
    while the full origin position is the parent quantity [coordinate_of_shatter_cone_origin](name:coordinate_of_shatter_cone_origin).


    Sign convention: Positive when $Z$ is above the machine midplane (in the $+Z$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame).'
  unit: m
  physics_domain: plant_systems
  links:
  - name:shatter_cone_direction_unit_vector
  - name:shatter_cone_major_unit_vector
  - name:shatter_cone_minor_unit_vector
  - name:coordinate_of_shatter_cone_origin
  constraints: []
