    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/pressure_parallel
    status: composed
- name: particle_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: "Normalized gyrocenter particle flux due to the perturbed parallel\
    \ magnetic field, representing the \u03B4B\u2225 contribution to radial particle\
    \ transport in gyrokinetic simulations."
  documentation: "This scalar quantifies the normalized particle flux resulting from\
    \ magnetic flutter (\u03B4B\u2225), an electromagnetic contribution to turbulent\
    \ cross-field transport. In gyrokinetic theory, the radial particle flux \u0393\
    \ is decomposed into electrostatic (ExB) and electromagnetic (magnetic flutter\
    \ and parallel vector potential) channels; this term isolates the \u03B4B\u2225\
    \ component. It is proportional to the correlation of the perturbed parallel magnetic\
    \ field with the perturbed radial drift, capturing particles transported by stochastic\
    \ parallel field components. Typical normalized values for near-marginal core\
    \ turbulence are order 10\u207B\xB3\u20131, depending on plasma \u03B2 and collisionality,\
    \ and increase with stronger electromagnetic effects. This flux is computed from\
    \ linear eigenmode or nonlinear gyrokinetic simulations using flux-tube or global\
    \ geometry.\n\nSign convention: Positive for outward radial particle flux.\n\n\
    Related standard names include [energy_flux_due_to_perturbed_parallel_magnetic_field](name:energy_flux_due_to_perturbed_parallel_magnetic_field)\
    \ for the corresponding energy channelcars, and [particle_flux_due_to_perturbed_parallel_vector_potential](name:particle_flux_due_to_perturbed_parallel_vector_potential)\
    \ for the \u03B4A\u2225 contribution."
  unit: '1'
  physics_domain: turbulence
