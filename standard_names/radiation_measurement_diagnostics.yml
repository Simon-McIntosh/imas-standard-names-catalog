- name: requested_voltage_of_spectrometer
  kind: scalar
  status: active
  description: Commanded bias potential between a spectrometer detector or electrode
    and its supply return, specifying the intended setpoint rather than the measured
    detector-output voltage.
  documentation: 'This quantity is the commanded electrical bias setpoint applied
    by a spectrometer high-voltage supply between a detector or electrode terminal
    and the supply return or reference terminal. It specifies the intended operating
    potential, not a detector readout signal.


    The commanded voltage is defined by


    $$

    V_{\mathrm{set}} = \phi_{\mathrm{terminal,set}} - \phi_{\mathrm{return}}

    $$


    where $V_{\mathrm{set}}$ is the commanded voltage, $\phi_{\mathrm{terminal,set}}$
    is the requested electric potential of the detector or electrode terminal, and
    $\phi_{\mathrm{return}}$ is the electric potential of the supply return or reference
    terminal. A positive value therefore commands a terminal potential above the return
    potential.


    This setpoint is distinct from the raw detector signal represented by [voltage
    of a spectrometer](name:voltage_of_spectrometer), which can include detector response,
    bias, dark signal, gain, and electronic offset. It does not represent the actual
    measured supply output or calibrated radiometric signal.'
  unit: V
  physics_domain: radiation_measurement_diagnostics
