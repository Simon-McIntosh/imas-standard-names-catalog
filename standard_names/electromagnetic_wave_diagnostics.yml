- name: poloidal_magnetic_flux_at_measurement_position
  kind: scalar
  status: active
  description: Signed equilibrium poloidal magnetic-flux function evaluated at a diagnostic
    measurement location, identifying the nested magnetic surface intersecting that
    location.
  documentation: 'The signed poloidal magnetic flux $\psi$ is the equilibrium flux
    function evaluated at a physical measurement position. It labels the nested magnetic
    surface passing through that position in the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    For an axisymmetric equilibrium, the poloidal magnetic-flux function is defined
    by


    $$

    \psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi(R,Z)$ is the poloidal magnetic flux at cylindrical coordinates $(R,Z)$,
    $B_Z(R'',Z)$ is the vertical magnetic-field component, $R$ and $R''$ are major-radius
    coordinates, $Z$ is vertical height, and $\pi$ is the circle constant. The toroidal
    angle $\phi$ completes the right-handed cylindrical frame; axisymmetry makes $\psi$
    independent of $\phi$.


    This quantity applies to the equilibrium magnetic field at one physical measurement
    position and has no species or population restriction. It is a point evaluation,
    not a sum, average, or integral over multiple measurement positions. It is not
    a normalized flux coordinate and does not represent a perturbation or fluctuation
    of the equilibrium flux.


    The same flux-function definition is used for [poloidal magnetic flux at a beam-tracing
    point](name:poloidal_magnetic_flux_at_beam_tracing_point), but that quantity differs
    in evaluation locus. A normalized surface label at the same type of location is
    [normalized poloidal flux coordinate at a measurement position](name:normalized_poloidal_flux_coordinate_at_measurement_position),
    which is derived by applying axis and boundary references to the signed flux value.


    Sign convention: Positive when the net vertical magnetic flux through the defining
    horizontal disk is directed in the $+Z$ direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_poloidal_flux_coordinate_at_measurement_position
  sources:
