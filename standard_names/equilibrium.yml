- name: major_radius_of_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: Major-radius coordinate, measured from the toroidal symmetry axis,
    of the boundary reference point used to define plasma-wall gap distance.
  documentation: 'The plasma boundary gap reference point is the point on the plasma
    boundary or separatrix used to evaluate the clearance to nearby wall structures.
    Its major radius locates that point in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is distance from the toroidal symmetry axis, $\phi$ is toroidal
    angle, and $Z$ is vertical height. Together with the [vertical coordinate of the
    plasma boundary gap reference point](name:vertical_coordinate_of_plasma_boundary_gap_reference_point),
    it defines the poloidal-plane location used to form the [distance of the plasma
    boundary gap].


    For a reference point with Cartesian position $(x_\mathrm{ref}, y_\mathrm{ref},
    z_\mathrm{ref})$ in a right-handed $(\hat{x}, \hat{y}, \hat{z})$ basis with $\hat{z}=\hat{Z}$,
    the major-radius coordinate is


    $$

    R_\mathrm{ref} = \sqrt{x_\mathrm{ref}^2 + y_\mathrm{ref}^2}

    $$


    where $R_\mathrm{ref}$ is the major radius of the gap reference point and $x_\mathrm{ref}$
    and $y_\mathrm{ref}$ are its horizontal Cartesian coordinates relative to the
    toroidal symmetry axis.


    This coordinate is obtained from equilibrium reconstruction or shape-control geometry
    by locating the relevant point on the reconstructed boundary, often in relation
    to the [major radius of the plasma boundary](name:major_radius_of_plasma_boundary)
    and the [major radius of the closest wall point](name:major_radius_of_closest_wall_point).
    Representative values span about 0.5-10 m across present and reactor-scale tokamaks,
    depending on device size and which boundary sector defines the active gap.


    Sign convention: Positive when the reference point lies in the $+R$ direction
    from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary_gap_reference_point
  - name:major_radius_of_plasma_boundary
  - name:major_radius_of_closest_wall_point
