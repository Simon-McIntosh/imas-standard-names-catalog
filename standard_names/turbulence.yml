- name: parallel_normalized_perturbed_magnetic_field_amplitude
  kind: scalar
  status: active
  description: Phase-independent magnitude of a complex normalized parallel magnetic-field
    perturbation, representing the strength of compressional fluctuations.
  documentation: 'This quantity is the phase-independent magnitude of the magnetic-field
    perturbation aligned with the local equilibrium magnetic field. It represents
    compressional magnetic fluctuations and does not retain the sign or phase of the
    underlying perturbation.


    $$

    A_{\u005cparallel B} = \frac{\left|\widetilde{\u005cdelta\mathbf{B}} \u005ccdot
    \hat{\mathbf{b}}_0\right|}{B_0}

    $$


    where $A_{\parallel B}$ is the normalized amplitude, $\widetilde{\delta\mathbf{B}}$
    is the complex perturbed magnetic-field coefficient, $\hat{\mathbf{b}}_0$ is the
    unit vector along the equilibrium magnetic field, and $B_0$ is its magnitude.
    Unlike the signed [parallel normalized perturbed magnetic field](name:parallel_normalized_perturbed_magnetic_field),
    this modulus is invariant under a change of perturbation phase and is non-negative.
    It is distinct from the amplitude of the parallel perturbed vector potential,
    which describes a different electromagnetic field quantity.'
  unit: '1'
  physics_domain: turbulence
  links:
