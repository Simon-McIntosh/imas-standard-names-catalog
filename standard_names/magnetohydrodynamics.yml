- name: radial_width_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Full, non-negative radial width of the magnetic island associated with
    a neoclassical tearing mode, measured across the island separatrix through the
    resonant surface. It is a length, not a signed displacement or half-width.
  documentation: 'The radial width of a neoclassical tearing mode is the full cross-island
    extent of the magnetic island associated with the mode. It is measured across
    the island separatrix through the resonant rational surface and is reported as
    a non-negative full width, not as a signed radial displacement or a half-width.


    A local definition is the separation between the outer and inner separatrix crossings
    along the chosen radial label:


    $$

    w = r_\mathrm{out} - r_\mathrm{in}

    $$


    where $r_\mathrm{in}$ and $r_\mathrm{out}$ are radial positions in meters on opposite
    sides of the island, ordered so that $r_\mathrm{out} \ge r_\mathrm{in}$, and $w$
    is the full island width. If a model or diagnostic fit uses the island half-width,
    the corresponding full width is twice that value.


    In practice, the width is inferred from magnetic fluctuation measurements, electron-temperature
    flattening, soft-x-ray or electron-cyclotron-emission imaging, and equilibrium
    or MHD reconstruction of the island separatrix. In generalized Rutherford modeling,
    $w$ is the evolving island-size variable; stability and drive terms such as classical
    tearing and neoclassical contributions are often expressed with inverse-length
    dimensions and must be combined with the model''s normalization before they represent
    an island growth rate.


    Typical seed island widths at onset are about 0.005-0.05 m. Evolved neoclassical
    tearing mode islands commonly have full widths of 0.02-0.3 m in medium to large
    tokamaks, with larger values possible for strongly growing or disruptive cases.'
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:time_derivative_of_mode_width
  - name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
