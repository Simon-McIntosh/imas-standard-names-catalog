name: tendency_of_ion_temperature
status: draft
cocos_transformation_type: one_like
description: Time derivative of the thermal ion temperature, representing the rate
  of ion thermal energy change per particle.
documentation: "The tendency of ion temperature $\\partial T_i / \\partial t$ (eV\
  \ s$^{-1}$) captures how the ion temperature profile evolves under the combined\
  \ effects of auxiliary heating (NBI, ICRH), collisional energy exchange with electrons,\
  \ charge-exchange losses, and radial heat transport. Here $T_i$ is the thermal ion\
  \ temperature expressed in eV. In a 1-D integrated transport solver, this quantity\
  \ appears as the time-advance term in the ion energy-balance equation, often coupled\
  \ to the electron channel through the equipartition term $Q_{ei} = \\nu_{ei} n_e\
  \ (T_e - T_i)$, where $\\nu_{ei}$ is the electron\u2013ion energy-exchange frequency.\
  \ Typical core $T_i$ values in H-mode tokamak plasmas are 2\u201325 keV; transient\
  \ tendencies during sawtooth crashes or heating step changes can exceed $10^{3}$\
  \ eV s$^{-1}$. See `tendency_of_ion_pressure` for the corresponding pressure evolution\
  \ and `ion_number_density` for the associated density."
