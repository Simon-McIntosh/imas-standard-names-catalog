- name: normalized_particle_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Dimensionless electromagnetic contribution to the turbulent radial
    particle flux carried by fluctuations of the perturbed parallel vector potential,
    isolating the magnetic-flutter transport channel and normalized to a gyro-Bohm
    particle-flux scale.
  documentation: 'The normalized particle flux due to the perturbed parallel vector
    potential is the species-resolved electromagnetic contribution to turbulent radial
    particle transport produced by fluctuations of the parallel vector potential $A_\parallel$.
    It captures the part of the gyrocenter particle flux carried by parallel streaming
    along magnetic field lines that are bent by the fluctuating field, separated from
    the electrostatic $E \times B$ channel and from the compressional perturbed-parallel-magnetic-field
    channel.


    A representative gyrokinetic definition is the radial magnetic-flutter moment
    of the perturbed distribution function normalized to a gyro-Bohm particle-flux
    scale:


    $$

    \widehat{\Gamma}_{s,A_\parallel} = \frac{1}{\Gamma_\mathrm{gB}}\left\langle \int
    f_{1s}\, v_\parallel\, \frac{\delta B_r}{B}\, d^3v \right\rangle

    $$


    where $s$ labels the particle species, $f_{1s}$ is the perturbed gyrocenter distribution
    function (in $\mathrm{s^3\,m^{-6}}$, so that $\int f_{1s}\,d^3v$ is a number density
    in $\mathrm{m^{-3}}$), $v_\parallel$ is the velocity parallel to the equilibrium
    magnetic field (in $\mathrm{m\,s^{-1}}$), $\delta B_r$ is the radial component
    of the magnetic perturbation generated by $A_\parallel$ (in $\mathrm{T}$), $B$
    is the equilibrium magnetic-field magnitude (in $\mathrm{T}$), and $\langle\cdots\rangle$
    denotes the flux-surface and time or fluctuation average. The gyro-Bohm normalization
    is $\Gamma_\mathrm{gB} = n_\mathrm{ref}\, v_\mathrm{th,ref}\,(\rho_\mathrm{ref}/a)^2$,
    where $n_\mathrm{ref}$ is a reference density ($\mathrm{m^{-3}}$), $v_\mathrm{th,ref}$
    is a reference thermal speed ($\mathrm{m\,s^{-1}}$), $\rho_\mathrm{ref}$ is a
    reference gyroradius ($\mathrm{m}$), and $a$ is the minor radius ($\mathrm{m}$).
    The precise moment form, averaging convention, and reference quantities follow
    the conventions of the particular gyrokinetic framework that produces the quantity.


    In practice this channel is obtained from gyrokinetic fluctuation fields and the
    perturbed distribution function by taking the velocity-space moment of the radial
    magnetic-flutter velocity, evaluated separately for each species. Linear eigenmode
    studies report the channel with a chosen mode-amplitude normalization, while nonlinear
    turbulence studies report saturated time averages or fluctuation-spectrum averages.


    This electromagnetic channel is typically small in low-beta, near-electrostatic
    regimes and grows in importance as plasma beta increases. The sign may be either
    outward or inward depending on the phase relation between $f_{1s}$ and $A_\parallel$.


    Sign convention: Positive when the particle flux is directed outward across magnetic
    flux surfaces, from the magnetic axis toward the plasma edge.'
  unit: '1'
  physics_domain: turbulence
