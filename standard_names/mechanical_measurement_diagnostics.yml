- name: voltage_of_mass_spectrometer
  kind: scalar
  status: draft
  description: Detector bias voltage of a mass spectrometer is the potential difference
    applied between the detector electrode or electron-multiplying stage and its bias
    reference, setting collection efficiency or gain for ion-current measurement.
    It is a device-level setting; voltage_of_mass_spectrometer_channel denotes a channel-specific
    detector bias.
  documentation: 'The detector bias voltage of a mass spectrometer is the electrical
    potential difference applied by the detector bias circuit to the detector electrode
    or electron-multiplying detector stage. It sets the electric-field conditions
    that affect ion collection efficiency and detector gain for converting mass-selected
    ions into a measured current or pulse signal. This is a device-level detector
    setting, distinct from the channel-specific [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel).


    With a specified bias reference node, the detector bias voltage is defined as
    the detector bias-node potential relative to that reference:


    $$

    V_\mathrm{det} = \Phi_\mathrm{det} - \Phi_\mathrm{ref}

    $$


    where $\Phi_\mathrm{det}$ is the electric potential of the detector electrode
    or detector-stage bias node, and $\Phi_\mathrm{ref}$ is the potential of the reference
    node chosen by the detector bias circuit, such as the supply return, detector
    housing, or another designated electrode.


    The value is normally set and monitored by the detector high-voltage or bias supply
    and is interpreted together with detector calibration, gain setting, and measured
    [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel).
    In operation it is chosen to provide adequate sensitivity for the expected ion
    flux while avoiding detector overloading or operation outside the rated bias range.


    Representative setpoints are strongly instrument- and detector-dependent: an unbiased
    or disabled detector may be near 0 V, while high-voltage electron-multiplying
    detector stages commonly use hundreds of volts to a few kilovolts. The allowable
    range should be interpreted from the detector and power-supply ratings rather
    than from a universal physical limit.


    Sign convention: Positive when the detector electrode or detector-stage bias node
    is at a higher electric potential than the bias reference node.'
  unit: V
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:voltage_of_mass_spectrometer_channel
  - name:ion_current_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/detector_voltage
    dd_path: spectrometer_mass/detector_voltage
    status: composed
- name: voltage_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Signed potential difference applied between the electron-multiplying
    detector stage of a single mass spectrometer channel and its electronics reference.
    It sets the channel-specific gain for converting collected ion current into an
    electrical signal.
  documentation: 'Voltage of a mass spectrometer channel is the signed detector-bias
    potential difference applied to the electron-multiplying detector element associated
    with one mass-discriminated channel. It controls the secondary-electron multiplication
    gain and therefore the sensitivity of that channel to collected ions. This per-channel
    quantity is distinct from [voltage_of_mass_spectrometer](name:voltage_of_mass_spectrometer),
    which denotes an instrument-level detector bias.


    The signed channel bias is the detector-electrode potential relative to the channel
    reference node:


    $$

    V_\mathrm{ch} = \Phi_{\mathrm{det},\mathrm{ch}} - \Phi_{\mathrm{ref},\mathrm{ch}}

    $$


    where $V_\mathrm{ch}$ is the reported channel voltage, $\Phi_{\mathrm{det},\mathrm{ch}}$
    is the electric potential of the biased detector electrode, and $\Phi_{\mathrm{ref},\mathrm{ch}}$
    is the potential of the electronics reference or return electrode for the same
    channel.


    In practice the value is set by a high-voltage supply or bias module and may be
    monitored through calibrated voltage dividers or supply readbacks. Channel-specific
    bias adjustment is used to equalize detector response, extend dynamic range, or
    protect the detector from saturation while the resulting signal is reported as
    [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel).


    Typical absolute bias magnitudes for electron-multiplying mass spectrometer detectors
    are 100-3000 V, depending on detector type, gain setting, ion current level, and
    protection limits.


    Sign convention: Positive when the detector-bias electrode of the channel is at
    a higher electric potential than the channel''s electronics reference or return
    electrode.'
  unit: V
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_current_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer
  sources:
  - id: dd:spectrometer_mass/channel/photomultiplier_voltage
    dd_path: spectrometer_mass/channel/photomultiplier_voltage
    status: composed
- name: wetted_area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Total geometric surface area of a Langmuir probe collector that is
    directly exposed to plasma and able to collect charged particles.
  documentation: 'The wetted area of a Langmuir probe is the geometric surface area
    of the conductive collector that is in direct contact with plasma. It excludes
    insulated supports, covered or recessed portions, and any nominal collector surface
    that is not accessible to plasma particle collection. It is a true surface area,
    distinct from a magnetic-field-projected collection area.


    For the plasma-exposed collector surface $S_w$, the wetted area is the surface
    integral of the local area element:


    $$

    A_w = \int_{S_w} dS

    $$


    where $A_w$ is the wetted area in m$^2$, $S_w$ is the plasma-contacting part of
    the collector surface, and $dS$ is a differential surface area element in m$^2$.


    In practice, $A_w$ is computed from the as-built collector geometry after accounting
    for masks, insulation, recess depth, and mounting features that prevent direct
    plasma exposure. It is the area used to normalize the measured [ion_saturated_current](name:ion_saturated_current),
    commonly through the inline relation $j_{\mathrm{sat}} = I_{\mathrm{sat}}/A_w$,
    where $I_{\mathrm{sat}}$ is the ion-saturated current in A and $j_{\mathrm{sat}}$
    is the ion-saturated current density in A m$^{-2}$. The [area_of_langmuir_probe](name:wetted_area_of_langmuir_probe)
    refers to the nominal probe area, while the [effective_area_of_langmuir_probe](name:effective_area_of_langmuir_probe)
    further accounts for projection relative to the local magnetic-field direction.


    Typical values for individual Langmuir probe collectors are of order $10^{-6}$-$10^{-4}$
    m$^2$, set mainly by collector diameter, exposed length, and whether the probe
    is a small protruding pin or an extended flush-mounted electrode.'
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current
  - name:effective_area_of_langmuir_probe
  arguments:
  - name: area_of_langmuir_probe
    operator: wetted
    operator_kind: qualifier
  sources:
  - id: dd:langmuir_probes/embedded/surface_area
    dd_path: langmuir_probes/embedded/surface_area
    status: composed
  - id: dd:langmuir_probes/reciprocating/surface_area
    dd_path: langmuir_probes/reciprocating/surface_area
    status: attached
- name: x_angle_of_camera
  kind: scalar
  status: draft
  description: Total angular span of a camera field of view along the detector-plane
    x direction. It is a non-negative angle describing lateral coverage in the camera
    projection, independent of the scene being imaged.
  documentation: 'The x angle of a camera is the total angular separation covered
    by the field of view along the horizontal axis of the detector plane''s local
    $(x,y)$ coordinates. It is the horizontal analog of the vertical field-of-view
    angle and describes the angular coverage of viewing directions rather than the
    physical size of an imaged object.


    For an ideal rectilinear or pinhole imaging model with negligible distortion,
    the angle is related to detector width and focal length by:


    $$

    \theta_x = 2 \arctan\left(\frac{w_x}{2 f}\right)

    $$


    where $\theta_x$ is the horizontal field-of-view angle in radians, $w_x$ is the
    active detector width along the local $x$ direction, and $f$ is the effective
    focal length in the same length unit as $w_x$. This relation assumes central rectilinear
    projection; fisheye, telecentric, anamorphic, cropped, or strongly distorted optical
    systems require the appropriate calibrated projection model instead.


    In practice, the value is obtained from optical design data, geometric calibration,
    or ray tracing as the angular separation between the chief rays reaching the two
    horizontal limits of the usable detector area. Together with the vertical field-of-view
    angle it gives a compact summary of coverage, but the full angular mapping also
    depends on quantities such as principal point, pixel pitch, focal lengths in each
    detector direction, distortion coefficients, and any projection-model convention.


    Physically meaningful values are non-negative angular extents. A finite non-wrapping
    angular span satisfies $0 \le \theta_x \le 2\pi$ rad, while ordinary rectilinear
    cameras require $0 < \theta_x < \pi$ rad. Typical diagnostic camera values are
    about 0.05-1.5 rad, with narrow-view optics near the lower end and wide-angle
    optics near the upper end.'
  unit: rad
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:vertical_angle_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/field_of_view_horizontal
    dd_path: camera_ir/channel/camera/field_of_view_horizontal
    status: composed
- name: x_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: X coordinate of the point where a sensor is mechanically attached to
    a device component, expressed in the right-handed Cartesian (x, y, z) frame. It
    is signed relative to the Cartesian origin and +x direction.
  documentation: 'The $x$ coordinate of a sensor attachment point is the signed horizontal
    position component of the mechanical point at which a sensor or its mount is fixed
    to a device component. It is defined in a right-handed Cartesian $(x, y, z)$ frame
    with basis $(\hat{x}, \hat{y}, \hat{z})$; $+\hat{z}$ is vertical and parallel
    to $+\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame. The origin
    lies on the toroidal symmetry axis at the machine midplane, so $z=0$ and $Z=0$
    denote the midplane.


    Relative to the right-handed cylindrical $(R, \phi, Z)$ frame, the horizontal
    Cartesian component is


    $$

    x = R \cos\phi

    $$


    where $R$ is major radius in meters and $\phi$ is toroidal angle in radians; $\phi=0$
    lies along $+\hat{x}$ and increasing $\phi$ points toward $+\hat{y}$ when viewed
    from $+\hat{z}$.


    Together with the [y coordinate of the sensor attachment point](name:y_coordinate_of_sensor_attachment_point)
    and the [vertical coordinate of the sensor attachment point](name:vertical_coordinate_of_sensor_attachment_point),
    this quantity specifies the mechanical attachment location. In practice it is
    obtained from engineering design geometry or from alignment surveys using coordinate-measuring
    equipment, laser trackers, photogrammetry, or optical metrology of the installed
    sensor and mount. The attachment point is a mechanical reference point, not necessarily
    the sensitive volume, viewing aperture, or line-of-sight origin of the sensor.


    Typical values are set by device size and by whether the sensor is mounted inside
    the vessel, on the vessel wall, or on external support structures. Compact devices
    often fall within $\pm 2$ m, medium-sized devices within $\pm 5$ m, and large
    devices or external diagnostic supports can reach $\pm 15$ m.


    Sign convention: Positive when the attachment point is displaced from the Cartesian
    origin in the $+\hat{x}$ direction.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:y_coordinate_of_sensor_attachment_point
  - name:vertical_coordinate_of_sensor_attachment_point
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/x
    dd_path: operational_instrumentation/sensor/attachement_points/x
    status: composed
- name: x_direction_unit_vector
  kind: scalar
  status: draft
  description: X-axis projection of a direction unit vector encoding the spatial orientation
    of a device or sensor in the right-handed Cartesian (x, y, z) frame.
  documentation: "The x component of the [direction_unit_vector](name:direction_unit_vector)\
    \ gives the projection of a hardware device's pointing direction onto the $\\\
    hat{x}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where $\\hat{z}$\
    \ coincides with the vertical $+Z$ direction and the azimuthal origin $\\phi =\
    \ 0$ is defined by facility convention.\n\nFor a unit vector $\\hat{d}$ specifying\
    \ device orientation, the three Cartesian components satisfy the unit-norm identity:\n\
    \n$$\nd_x^2 + d_y^2 + d_z^2 = 1\n$$\n\nwhere $d_x$ is this quantity, $d_y$ is\
    \ the [y_direction_unit_vector](name:y_direction_unit_vector_of_strain_gauge_sensor),\
    \ and $d_z$ is the [vertical_direction_unit_vector](name:vertical_direction_unit_vector).\
    \ This constraint restricts the valid range to $d_x \\in [-1, 1]$, with $|d_x|\
    \ = 1$ only when the device points purely along the $\\pm x$ axis.\n\nThis component\
    \ is determined from mechanical installation geometry \u2014 precision survey\
    \ measurements or engineering alignment procedures \u2014 rather than from plasma\
    \ diagnostics. It applies to a broad class of hardware components including sensors,\
    \ cameras, injector nozzles, and launcher mirrors whose spatial pointing must\
    \ be registered in a common Cartesian frame.\n\nSign convention: Positive when\
    \ the direction vector has a component in the $+x$ direction of the right-handed\
    \ Cartesian $(x, y, z)$ frame."
