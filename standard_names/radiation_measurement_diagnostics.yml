    second local tangential axis of the right-handed detector-local Cartesian basis
    (first local tangential, second local tangential, local normal).
  documentation: 'Second local tangential coordinate of a hard X-ray detector is the
    signed scalar coordinate of a detector outline vertex along the detector-local
    second tangential direction. It is defined in the right-handed object-local Cartesian
    basis $(\hat{\mathbf e}_1, \hat{\mathbf e}_2, \hat{\mathbf e}_3)$, where $\hat{\mathbf
    e}_1$ is the first local tangential unit vector, $\hat{\mathbf e}_3$ is the detector-local
    normal unit vector, and $\hat{\mathbf e}_2 = \hat{\mathbf e}_3 \times \hat{\mathbf
    e}_1$.


    The coordinate $q_2$ of a vertex at position $\mathbf r$ is the signed projection
    of its displacement from the detector-local origin:


    $$

    q_2 = (\mathbf r - \mathbf r_0) \cdot \hat{\mathbf e}_2

    $$


    where $\mathbf r_0$ is the detector-local origin and $\hat{\mathbf e}_2$ is the
    second local tangential unit vector.


    Only the component along $\hat{\mathbf e}_2$ is included. The companion coordinate
    along $\hat{\mathbf e}_1$ is the [first local tangential coordinate of a hard
    X-ray detector]; neither quantity is a radial, toroidal, or vertical component
    in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the vertex displacement from the detector-local
    origin is toward $\hat{\mathbf e}_3 \times \hat{\mathbf e}_1$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: hard_x_rays/channel/detector/outline/x2
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/hard_x_rays.html#hard_x_rays-channel-detector-outline-x2
    dd_documentation:
