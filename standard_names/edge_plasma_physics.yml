- name: toroidal_neon_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: Toroidal component of the density-weighted neon-ion fluid velocity
    at the core-side top of the H-mode edge transport barrier.
  documentation: 'Toroidal neon-ion velocity at the H-mode pedestal top is the density-weighted
    mean of the toroidal fluid velocities of all represented neon ion charge states
    at the core-side shoulder of the edge transport barrier. It is a signed projection
    in the right-handed cylindrical $(R, \phi, Z)$ frame.


