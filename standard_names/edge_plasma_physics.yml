- name: parallel_total_momentum_convection_velocity
  kind: scalar
  status: active
  description: Effective field-aligned convection velocity multiplying convective
    transport of total plasma momentum in the edge plasma.
  documentation: 'Effective field-aligned convection velocity multiplying convective
    transport of total plasma momentum in the edge plasma is the scalar transport
    coefficient that relates the field-line-parallel convective flux of total parallel
    momentum density to that total parallel momentum density. It is defined for the
    total plasma momentum variable summed over the plasma species and charge states
    included in the total-momentum balance, and it is not necessarily the parallel
    bulk velocity of any single species.


    The constitutive definition of the coefficient is:


    $$

    v_{\parallel,\mathrm{conv}} = \frac{\Gamma_{P_\parallel}^{\mathrm{conv}}}{P_\parallel}

    $$


    where $\Gamma_{P_\parallel}^{\mathrm{conv}}$ is the field-line-parallel convective
    flux of total parallel momentum density, $P_\parallel$ is the total parallel momentum
    density, and $v_{\parallel,\mathrm{conv}}$ is this convection velocity. The density
    $P_\parallel$ may be written inline as $P_\parallel = \sum_a m_a n_a u_{a,\parallel}$,
    where $a$ indexes the included plasma species or charge states, $m_a$ is particle
    mass, $n_a$ is number density, and $u_{a,\parallel}$ is field-line-parallel velocity.


    This quantity is an effective coefficient for the transported total momentum variable:
    it equals a center-of-mass parallel flow only when the closure uses that same
    flow to advect the summed momentum. Related effective-velocity coefficients for
    different transported variables include [parallel total ion energy convection
    velocity](name:parallel_total_ion_energy_convection_velocity), [parallel ion charge
    state convection velocity](name:parallel_ion_charge_state_convection_velocity),
    and [parallel neutral internal state momentum convection velocity](name:parallel_neutral_internal_state_momentum_convection_velocity);
    the cross-field counterpart for total momentum transport is [radial effective
    momentum convection velocity].


    Sign convention: Positive when the velocity is directed along the local magnetic
    field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_total_ion_energy_convection_velocity
  - name:parallel_neutral_internal_state_momentum_convection_velocity
  sources:
