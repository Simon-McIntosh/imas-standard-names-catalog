- name: toroidal_halo_current
  kind: scalar
  status: active
  description: Toroidal component of the electric current carried by halo plasma on
    open magnetic field lines between the last closed flux surface and first wall
    during a disruption.
  documentation: 'Toroidal halo current is the toroidal component of the electric-current
    vector carried by halo plasma on open magnetic field lines between the last closed
    flux surface and the first wall during a disruption. It is the toroidal member
    of the vector quantity [halo current](name:halo_current).


    The component is defined by


    $$

    I_{\phi} = \mathbf{I}_{\mathrm{halo}} \cdot \hat{\phi}

    $$


    where $\mathbf{I}_{\mathrm{halo}}$ is the integrated halo-current vector and $\hat{\phi}$
    is the toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame.
    Unlike [poloidal halo current](name:poloidal_halo_current), this component measures
    current along the direction of increasing toroidal angle and excludes the poloidal
    component.


    Sign convention: Positive when the halo current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: disruption/global_quantities/current_halo_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-current_halo_phi
    dd_documentation:
      leaf: Toroidal halo current
      parent_path: disruption/global_quantities
      parent: Global quantities
      data_type: FLT_1D
      unit: A
      coordinates:
      - disruption/time
    enhanced_context:
      description: Toroidal component of the halo current (I_phi,halo) flowing in
        the halo plasma region during a disruption, where plasma contacts the first
        wall. A key quantity for assessing electromagnetic loads on plasma-facing
        components.
      kind: llm
- name: toroidal_impurity_ion_velocity_at_measurement_position
  kind: scalar
  status: active
  description: Toroidal component of the bulk-flow velocity of an impurity-ion population,
    evaluated at a specified measurement position.
  documentation: 'The quantity is the impurity-ion bulk-flow velocity projected onto
    the toroidal direction at the specified measurement position. It is a signed velocity
    component in the right-handed cylindrical $(R,\phi,Z)$ frame.


    $$

    v_\phi(\mathbf{x}_m)=\mathbf{v}_{\mathrm{imp}}(\mathbf{x}_m)\cdot\hat{\phi}

    $$


    where $v_\phi$ is the toroidal velocity component, $\mathbf{x}_m$ is the measurement
    position, $\mathbf{v}_{\mathrm{imp}}$ is the bulk velocity of the impurity-ion
    population, and $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle $\phi$.


    For an impurity population combined over charge states, the bulk velocity is the
    density-weighted mean over the included charge states. The species and charge-state
    aggregation must be interpreted from the defined population; the related [toroidal
    ion velocity](name:toroidal_ion_velocity) provides the corresponding generic ion
    quantity.


    Sign convention: Positive when the impurity-ion flow points in the direction of
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_ion_velocity
  sources:
  - dd_path: mhd/ggd/velocity_phi/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd.html#mhd-ggd-velocity_phi-values
