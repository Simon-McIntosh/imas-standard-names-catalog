- name: radial_conductivity
  kind: scalar
  status: draft
  description: Radial conductivity is the diagonal radial component of the electrical
    conductivity tensor. In the cylindrical (R, phi, Z) frame, it gives the scalar
    coefficient multiplying the radial electric-field component to form the radial
    Ohmic current-density contribution, excluding off-diagonal tensor couplings.
  documentation: 'Radial conductivity is the radial diagonal component $\sigma_R \equiv
    \sigma_{RR}$ of the electrical conductivity tensor in the right-handed cylindrical
    $(R, \phi, Z)$ system, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It represents the local radial Ohmic response to the radial
    electric-field component, not the full tensor response of the plasma.


    For the diagonal scalar component, the local constitutive relation is


    $$

    J_R = \sigma_R E_R

    $$


    where $J_R$ is the radial current density in $\mathrm{A\,m^{-2}}$, $E_R$ is the
    radial electric field in $\mathrm{V\,m^{-1}}$, and $\sigma_R$ is the radial conductivity
    in $\Omega^{-1}\,\mathrm{m^{-1}}$. Off-diagonal tensor contributions such as $\sigma_{R\phi}E_\phi$
    or $\sigma_{RZ}E_Z$ are separate conductivity components and are not included
    in this scalar coefficient.


    In practice, radial conductivity is usually a modeled or inferred transport coefficient
    rather than a directly measured material property. It may be obtained from collisional,
    neoclassical, turbulent, or edge-closure transport models, or inferred from radial
    current balance when the radial electric field and non-Ohmic current contributions
    are independently constrained.


    Typical effective values are highly model dependent because cross-field electrical
    conduction in a magnetized plasma is strongly suppressed compared with parallel
    conduction. Representative core-to-edge modeling values can span about $10^{-8}$-$10^{2}\
    \Omega^{-1}\,\mathrm{m^{-1}}$, with edge, scrape-off-layer, or numerical closure
    values sometimes lying outside this range.


    Sign convention: Positive when a positive radial electric-field component $E_R$
    in the $+R$ direction of the right-handed cylindrical $(R, \phi, Z)$ system produces
    a radial current-density component $J_R$ in the $+R$ direction.'
  unit: m^-1.ohm^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_transport/model/ggd/conductivity/r
    dd_path: edge_transport/model/ggd/conductivity/r
    status: attached
  - id: dd:edge_transport/model/ggd/conductivity/radial
    dd_path: edge_transport/model/ggd/conductivity/radial
