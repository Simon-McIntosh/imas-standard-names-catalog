- name: toroidal_ion_state_velocity_due_to_e_cross_b_drift
  kind: scalar
  status: draft
  description: "Toroidal component of the E\xD7B drift velocity for a specific ion\
    \ charge state in the edge plasma."
  documentation: "The toroidal component of the E\xD7B drift velocity $v_{E\\times\
    \ B,\\phi}$ for a resolved ion charge state quantifies the toroidal rotation driven\
    \ by the radial electric field in the edge plasma. From the parent quantity $\\\
    mathbf{v}_{E\\times B} = (\\mathbf{E} \\times \\mathbf{B}) / B^2$, where $\\mathbf{E}$\
    \ is the electric field and $\\mathbf{B}$ is the magnetic field, this component\
    \ is $v_{E\\times B,\\phi} = (E_r B_\\theta - E_\\theta B_r) / B^2$ in a flux-surface\
    \ coordinate system. This quantity is a primary contributor to toroidal rotation\
    \ in the edge and scrape-off layer, typically reaching values of 1\u201320 km/s\
    \ in H-mode pedestals. It is distinct from the bulk toroidal ion velocity by also\
    \ including diamagnetic and other drift contributions. Resolved per charge state\
    \ via generalized gradient descent (GGD) grid subsets. See also the radial and\
    \ poloidal components: `[radial_ion_state_velocity_due_to_e_cross_b_drift](name:radial_ion_state_velocity_due_to_e_cross_b_drift)`\
    \ and `[poloidal_ion_state_velocity_due_to_e_cross_b_drift](name:poloidal_ion_state_velocity_due_to_e_cross_b_drift)`.\n\
    \nSign convention: Positive when $v_{E\\times B,\\phi}$ points in the direction\
    \ of increasing toroidal angle $\\phi$ (counter-clockwise viewed from above).\n\
    \nThis component is part of the vector [ion_state_velocity_due_to_e_cross_b_drift](name:ion_state_velocity_due_to_e_cross_b_drift)\
    \ and contributes to the total toroidal rotation in the edge plasma alongside\
    \ [toroidal_ion_state_velocity](name:toroidal_ion_state_velocity)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_velocity_due_to_e_cross_b_drift
  - name:poloidal_ion_state_velocity_due_to_e_cross_b_drift
  - name:ion_state_velocity_due_to_e_cross_b_drift
