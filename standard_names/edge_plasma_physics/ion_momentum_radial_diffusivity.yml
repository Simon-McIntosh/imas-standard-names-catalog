name: ion_momentum_radial_diffusivity
status: draft
description: Effective radial diffusion coefficient for ion momentum, parameterizing
  cross-field viscous momentum transport in the gradient-driven diffusive approximation.
documentation: "The ion momentum radial diffusivity $D_i^{\\mathrm{mom,rad}}$ (m$^{2}$\
  \ s$^{-1}$) relates the radial momentum flux to the radial gradient of the ion flow\
  \ velocity: $\\Pi_{i,r} = -m_i n_i D_i^{\\mathrm{mom,rad}} \\nabla_r v_i$, where\
  \ $m_i$ is the ion mass (kg), $n_i$ the ion number density (m$^{-3}$), and $v_i$\
  \ the ion velocity (m/s). Neoclassical contributions arise from banana-orbit-mediated\
  \ viscosity, while turbulent (anomalous) transport often provides the dominant radial\
  \ momentum diffusion in the tokamak edge. Typical anomalous values are 0.1\u2013\
  5 m$^{2}$ s$^{-1}$ in the SOL; the ratio $\\chi_i^{\\mathrm{mom}} / \\chi_i^{\\\
  mathrm{energy}}$ (Prandtl number) is an important dimensionless diagnostic of the\
  \ dominant turbulence regime. Computed by edge fluid codes or inferred from rotation\
  \ profile measurements via charge-exchange recombination spectroscopy."
