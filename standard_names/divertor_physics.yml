- name: total_ion_density_at_divertor_target
  kind: scalar
  status: active
  description: Total positive-ion number density at the divertor target, summed over
    all ionic species and charge states at the entrance to the electrostatic sheath.
  documentation: 'This quantity is the local number density of all positive ions in
    the plasma immediately adjacent to a divertor target surface. It is the all-ion
    aggregate of [ion density at the divertor target](name:ion_density_at_divertor_target),
    rather than a species-specific or charge-state-resolved density.


    The total ion density is defined by


    $$

    n_{i,total} = \sum_{s \in \mathcal{S}} \sum_{Z \in \mathcal{Z}_s} n_{s,Z}

    $$


    where $n_{i,\mathrm{total}}$ is the total ion number density, $s$ indexes the
    included ionic species, $Z$ indexes their positive charge states, and $n_{s,Z}$
    is the number density of species $s$ in charge state $Z$. The sums include all
    positive-ion populations evaluated at the entrance to the electrostatic sheath.


    Neutral atoms and molecules, as well as free electrons, are excluded. A density
    resolved for one charge state is represented separately by [ion charge state density](name:ion_charge_state_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  arguments:
