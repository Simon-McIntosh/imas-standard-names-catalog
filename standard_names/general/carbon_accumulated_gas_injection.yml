name: carbon_accumulated_gas_injection
status: draft
cocos_transformation_type: one_like
description: Total number of carbon atoms (or carbon-containing molecules) injected
  into the vessel, accumulated over the discharge.
documentation: 'The accumulated carbon gas injection is the time-integrated count
  of carbon particles (atoms or molecules) delivered to the plasma vessel through
  gas-injection valves, expressed as a dimensionless number of particles. It is obtained
  by integrating the instantaneous carbon gas injection rate $\dot{N}_{\mathrm{C}}$
  (in $\mathrm{s}^{-1}$) over the discharge duration: $N_{\mathrm{C,acc}} = \int_0^t
  \dot{N}_{\mathrm{C}}(t'')\,dt''$. Carbon injection is used for radiative-mantle
  experiments, divertor detachment studies, and wall-conditioning scenarios; typical
  accumulated values range from $10^{18}$ to $10^{21}$ particles depending on the
  purpose and device size. See also the instantaneous injection rate and the prefill
  quantity for the pre-discharge gas load.'
