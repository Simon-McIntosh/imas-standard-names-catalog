- name: plasma_velocity
  kind: vector
  status: active
  description: "Mass-weighted bulk center-of-mass velocity vector of the plasma fluid,\
    \ whose projections onto the right-handed cylindrical (R, \u03C6, Z) coordinate\
    \ directions provide the radial, toroidal, vertical, and parallel flow components."
  documentation: 'The plasma velocity is the local center-of-mass (barycentric) flow
    velocity of the bulk plasma, representing the momentum per unit mass carried collectively
    by all plasma species. It is the primary kinematic quantity in single-fluid and
    multi-fluid magnetohydrodynamic descriptions of plasma transport, rotation, and
    momentum confinement.


    The center-of-mass velocity vector is defined as:


    $$

    \mathbf{v}_\mathrm{cm} = \frac{\sum_s m_s n_s \mathbf{v}_s}{\sum_s m_s n_s}

    $$


    where the sum runs over all contributing plasma species $s$, $m_s$ is the species
    mass, $n_s$ is the number density, and $\mathbf{v}_s$ is the mean fluid velocity
    of species $s$.


    The full velocity vector decomposes into projections along the right-handed cylindrical
    $(R, \phi, Z)$ frame: the [radial component](name:radial_plasma_velocity) along
    $\hat{R}$, the [toroidal component](name:toroidal_center_of_mass_velocity) along
    $\hat{\phi}$, the [vertical component](name:vertical_plasma_velocity) along $\hat{Z}$,
    and the [parallel component](name:parallel_plasma_velocity) along the local magnetic-field
    unit vector $\hat{b}$. Individual projections are inferred from Doppler spectroscopy,
    charge-exchange recombination spectroscopy, and motional-Stark-effect diagnostics;
    Mach probes provide parallel-flow access in the scrape-off layer.


    Sign convention: Positive when the velocity vector component points in the direction
    of increasing $R$ (outward), increasing $\phi$ (counter-clockwise viewed from
    above $+\hat{Z}$), or increasing $Z$ (upward) for the respective cylindrical projections.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_plasma_velocity
  - name:toroidal_center_of_mass_velocity
  - name:vertical_plasma_velocity
  - name:parallel_plasma_velocity
- name: parallel_plasma_velocity
  kind: scalar
  status: active
  description: Parallel component of the bulk plasma center-of-mass velocity, projected
    onto the local magnetic-field direction and representing field-aligned mass transport
    of all contributing species.
  documentation: 'The parallel plasma velocity $v_\parallel$ is the projection of
    the [plasma velocity](name:plasma_velocity) vector onto the local magnetic-field
    unit vector $\hat{\mathbf{b}}$. It represents the field-aligned component of the
    mass-weighted bulk center-of-mass flow of all contributing plasma species, not
    the velocity of one selected species.


    The projection is defined by:


    $$

    v_\parallel = \mathbf{v}_\mathrm{cm} \cdot \hat{\mathbf{b}}

    $$


    where $v_\parallel$ is the parallel plasma velocity, $\mathbf{v}_\mathrm{cm}$
    is the [plasma velocity](name:plasma_velocity) vector, $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$
    is the local magnetic-field unit vector, and $\mathbf{B}$ is the local magnetic
    field.


    This quantity is synonymous with [parallel center-of-mass velocity](name:parallel_center_of_mass_velocity):
    both denote the field-aligned projection of the mass-weighted plasma center-of-mass
    flow. It differs from [radial plasma velocity](name:radial_plasma_velocity), [toroidal
    center-of-mass velocity](name:toroidal_center_of_mass_velocity), and [vertical
    plasma velocity](name:vertical_plasma_velocity), which are projections onto the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height; it is also not the speed magnitude
    $|\mathbf{v}_\mathrm{cm}|$ or a flux-surface-normal component. The quantity is
    defined only where the local magnetic-field direction is defined.


    Sign convention: Positive when the plasma center-of-mass velocity has a component
    in the direction of the local magnetic-field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:radial_plasma_velocity
  arguments:
  - name: plasma_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: mhd/ggd/velocity_parallel/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd.html#mhd-ggd-velocity_parallel-values
    dd_documentation:
