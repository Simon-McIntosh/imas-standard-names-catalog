- name: toroidal_krypton_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of the krypton ion bulk flow velocity at the H-mode
    pedestal top, resolved along the direction of increasing phi in the right-handed
    cylindrical (R, phi, Z) frame, where R is major radius, phi is toroidal angle,
    and Z is vertical height.
  documentation: 'Toroidal krypton velocity at the pedestal is the signed toroidal
    component of the bulk-flow velocity of krypton ions evaluated at the H-mode pedestal
    top. The toroidal direction is the $\hat{\phi}$ basis direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is the krypton-specific pedestal quantity
    corresponding to the more general [toroidal ion velocity](name:toroidal_ion_velocity)
    and can be compared with [toroidal krypton velocity at the internal transport
    barrier](name:toroidal_krypton_velocity_at_internal_transport_barrier).


    The scalar toroidal component is defined by projection of the krypton ion velocity
    vector onto the toroidal unit vector:


    $$

    v_\phi^{\mathrm{Kr}} = \mathbf{v}^{\mathrm{Kr}} \cdot \hat{\phi}

    $$


    where $v_\phi^{\mathrm{Kr}}$ is the signed toroidal scalar velocity in m.s$^{-1}$,
    $\mathbf{v}^{\mathrm{Kr}}$ is the krypton ion bulk-flow velocity vector in m.s$^{-1}$,
    and $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle.


    In practice this quantity is inferred from impurity-velocity measurements or calculations
    localized to the pedestal top. Spectroscopic determinations use Doppler shifts
    of krypton emission and viewing-geometry corrections to isolate the toroidal component;
    modeled values are obtained from impurity momentum balance or transport calculations
    constrained by edge plasma conditions.


    No device-independent krypton-specific range is universal. Representative signed
    pedestal impurity toroidal velocities are often of order $10^3$-$10^5$ m.s$^{-1}$
    in either toroidal direction, with values near zero indicating little resolved
    toroidal bulk flow.


    Sign convention: Positive when the krypton ion bulk flow at the pedestal is along
    $+\hat{\phi}$, the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
