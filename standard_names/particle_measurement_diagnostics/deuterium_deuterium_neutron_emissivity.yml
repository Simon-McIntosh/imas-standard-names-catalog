name: deuterium_deuterium_neutron_emissivity
status: draft
description: "Local volumetric emission rate of neutrons from deuterium\u2013deuterium\
  \ fusion reactions in the plasma."
documentation: "The DD neutron emissivity $\\varepsilon_{\\mathrm{DD}}$ (in m$^{-3}$\
  \ s$^{-1}$) is the number of 2.45 MeV neutrons produced per unit volume per unit\
  \ time by the D(d,n)$^3$He branch of deuterium\u2013deuterium fusion. It is given\
  \ by $\\varepsilon_{\\mathrm{DD}} = \\frac{1}{2} n_D^2 \\langle\\sigma v\\rangle_{\\\
  mathrm{DD}}$, where $n_D$ is the deuterium ion density (m$^{-3}$) and $\\langle\\\
  sigma v\\rangle_{\\mathrm{DD}}$ is the Maxwellian-averaged DD fusion reactivity\
  \ (m$^{3}$ s$^{-1}$), which is a strong function of ion temperature $T_i$. The factor\
  \ $1/2$ accounts for identical-particle statistics. In current tokamaks with $T_i\
  \ \\approx 1$\u201310 keV and $n_D \\approx 10^{19}$\u2013$10^{20}$ m$^{-3}$, typical\
  \ core emissivities range from $10^{12}$ to $10^{16}$ m$^{-3}$ s$^{-1}$. The emissivity\
  \ profile is reconstructed from line-integrated neutron camera measurements via\
  \ tomographic inversion. See also the DT counterpart `deuterium_tritium_neutron_emissivity`\
  \ and the derived quantity `deuterium_deuterium_fusion_power_density`."
