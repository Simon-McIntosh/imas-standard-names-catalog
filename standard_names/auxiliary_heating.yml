- name: per_toroidal_mode_left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Power-deposition-weighted flux-surface average of the phase-resolved
    left-hand circularly polarized wave electric-field phasor for one toroidal mode
    number. Its phase is referenced to the chosen zero-phase toroidal location and
    is represented on the (-pi, pi] branch.
  documentation: 'This quantity is the left-hand circularly polarized component of
    the RF wave electric-field phasor for a single toroidal mode number, averaged
    over a magnetic flux surface with local absorbed power density as the weight.
    It describes the non-axisymmetric wave field seen by the plasma and complements
    the right-hand circular and parallel components needed to reconstruct the wave
    polarization state.


    For toroidal mode number $n$, the weighted flux-surface average is


    $$

    \overline{E}_{+,n}(\rho)=\frac{\left\langle p_{\mathrm{abs},n}\,E_{+,n}\right\rangle_{\rho}}{\left\langle
    p_{\mathrm{abs},n}\right\rangle_{\rho}},\qquad E_{+,n}=A_{+,n}\exp(i\varphi_{+,n}),\quad
    \varphi_{+,n}\in(-\pi,\pi]

    $$


    where $\rho$ is the explicitly chosen flux-surface label, $\langle\cdot\rangle_{\rho}$
    is a flux-surface average on that surface, $p_{\mathrm{abs},n}$ is the absorbed
    power density for the same toroidal mode in W m$^{-3}$, $E_{+,n}$ and $\overline{E}_{+,n}$
    are electric-field phasors in V m$^{-1}$, $A_{+,n}$ is the local amplitude in
    V m$^{-1}$, and $\varphi_{+,n}$ is the local phase angle in radians. The toroidal
    Fourier dependence is referenced to $\phi=0$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, and phase angles are reduced to the principal branch $(-\pi,\pi]$.


    In practice, this quantity is computed from a full-wave or ray-based RF solution
    by decomposing the perpendicular electric field into circular polarization components
    relative to the local magnetic-field direction, selecting one toroidal Fourier
    harmonic, and applying the absorbed-power weighting on each flux surface. The
    weighting emphasizes regions where the wave-plasma interaction actually deposits
    energy, so the result is not a simple geometric average of the field over the
    surface. The left-hand component is useful for polarization balance, mode conversion,
    and consistency checks; it should not be identified by itself as the primary ion-cyclotron
    resonant component without specifying the species, harmonic, propagation direction,
    and polarization convention.


    Typical magnitudes in ion-cyclotron-range heating calculations are about $10^2$-$10^5$
    V m$^{-1}$ near the plasma edge and antenna-facing region, and about $10$-$10^4$
    V m$^{-1}$ in strongly damped core regions. The phase normally spans the selected
    branch $(-\pi,\pi]$ and can vary rapidly near cutoffs, mode-conversion layers,
    and absorption peaks.


    Sign convention: Positive when the phasor phase of $\overline{E}_{+,n}$ leads
    the chosen zero-phase reference after reduction to the $(-\pi,\pi]$ branch.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:per_toroidal_mode_right_hand_circularly_polarized_electric_field
  - name:parallel_per_toroidal_mode_electric_field
