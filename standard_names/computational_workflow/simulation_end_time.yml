name: simulation_end_time
status: draft
cocos_transformation_type: one_like
description: Termination time of the simulation, expressed in seconds relative to
  the start of the pulse or an absolute reference clock.
documentation: The simulation end time $t_{\mathrm{end}}$ defines the upper bound
  of the temporal domain over which the numerical workflow advances the plasma state.
  Together with the simulation start time it sets the total simulated interval $\Delta
  t = t_{\mathrm{end}} - t_{\mathrm{start}}$. In integrated-modeling workflows (e.g.,
  JINTRAC, IMAS workflow manager) this parameter controls the main time loop and determines
  when all coupled physics actors cease execution. Typical values range from fractions
  of a second for fast-transient studies (ELMs, disruptions) to tens or hundreds of
  seconds for full-discharge predictive simulations. The time base is usually referenced
  to the beginning of the plasma pulse, consistent with the experimental shot clock.
  See also `simulation_current_time` for the instantaneous progress of the solver
  and `simulation_restart_time` for the checkpoint from which the run may resume.
