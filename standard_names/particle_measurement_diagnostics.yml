- name: first_coordinate_of_detector_outline
  kind: scalar
  status: draft
  description: First local coordinate (X1) of vertices defining the polygonal boundary
    of a neutron diagnostic detector element in its local (X1, X2) frame.
  documentation: "The first local coordinate $X_1$ specifies the positions of vertices\
    \ along the principal axis of the local two-dimensional frame used to describe\
    \ the cross-sectional outline of a detector element. Together with the [second\
    \ coordinate](name:second_coordinate_of_detector_outline), the ordered sequence\
    \ of $(X_1, X_2)$ vertex pairs defines the closed polygon representing the active\
    \ detection area or physical boundary of the detector. This local frame is defined\
    \ by the detector's orientation vectors, decoupled from the global cylindrical\
    \ $(R, \\phi, Z)$ machine frame, allowing a compact description of arbitrarily\
    \ oriented detector geometries. Typical detector outlines for neutron diagnostics\
    \ range from millimeters to tens of centimeters in extent, with vertex counts\
    \ of 4\u201316 points sufficient to capture rectangular, hexagonal, or irregular\
    \ shapes. The same (X1, X2) outline convention is used consistently across optical\
    \ and particle-measurement diagnostic components, as seen in [first_coordinate_of_aperture_outline](name:first_coordinate_of_aperture_outline),\
    \ [first_coordinate_of_reflector_outline](name:first_coordinate_of_reflector_outline),\
    \ [first_coordinate_of_crystal_outline](name:first_coordinate_of_crystal_outline),\
    \ and [first_coordinate_of_filter_window_outline](name:first_coordinate_of_filter_window_outline).\n\
    \nSign convention: Positive when the vertex position lies in the positive $X_1$\
    \ direction of the detector's local coordinate frame."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:second_coordinate_of_detector_outline
  - name:first_coordinate_of_aperture_outline
  - name:first_coordinate_of_reflector_outline
  - name:first_coordinate_of_crystal_outline
  - name:first_coordinate_of_filter_window_outline
