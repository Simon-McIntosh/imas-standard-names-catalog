- name: radial_mode_number
  kind: scalar
  status: draft
  description: Dimensionless non-negative integer labeling the radial branch of a
    linear MHD eigenmode by the number of radial nodes between the magnetic axis and
    the plasma boundary.
  documentation: 'Radial mode number is a non-negative integer that distinguishes
    radial branches of a linear magnetohydrodynamic eigenmode. It complements the
    toroidal mode number $n$ and poloidal mode number $m$: $n$ and $m$ describe angular
    harmonic content, while the radial mode number counts how many times the mode
    structure changes node in the radial direction.


    For a radial eigenfunction envelope $A(\rho)$ expressed on a monotonic flux coordinate
    $\rho$ such as normalized toroidal flux radius, with $\rho=0$ at the magnetic
    axis and $\rho=1$ at the plasma boundary, the radial mode number $l$ is the number
    of distinct interior radial nodes:


    $$

    l = \#\{\rho_i \in (0,1) \mid A(\rho_i)=0\}

    $$


    where $\#$ denotes the number of elements in the set and endpoint zeros imposed
    by regularity or boundary conditions are not counted.


    The value is obtained from the radial structure of a computed or inferred linear
    MHD eigenfunction after the relevant toroidal and poloidal harmonic content has
    been identified. It is not a directly measured local quantity; it is assigned
    by analyzing the spatial pattern of the perturbation from equilibrium-based mode
    calculations or from diagnostics capable of resolving the radial mode structure.


    Typical values are small integers. A node-free radial branch has $l=0$, successive
    radial overtones have $l=1,2,\ldots$, and practical mode classifications commonly
    use values from 0-10 depending on the equilibrium, boundary conditions, mode family,
    and radial resolution.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:mode_frequency
  - name:mode_phase
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/radial_mode_number
    dd_path: mhd_linear/time_slice/toroidal_mode/radial_mode_number
    status: composed
