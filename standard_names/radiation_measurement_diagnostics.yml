- name: second_coordinate_width_of_crystal
  kind: scalar
  status: draft
  description: Full width of the dispersing crystal in the second local coordinate
    (X2) direction, measured as a non-negative extent between opposing crystal edges
    for rectangular crystal geometry. This quantity characterizes the physical size
    of the crystal along its X2 axis and applies only when the crystal geometry type
    is rectangular.
  documentation: 'The second local coordinate width $w_{X2}$ is the total physical
    extent of the dispersing crystal along the local X2 axis, measured as the non-negative
    distance between the two opposing crystal edges in that direction. For a rectangular
    crystal, the crystal face spans from $-w_{X2}/2$ to $+w_{X2}/2$ about the crystal
    center in the X2 direction, so $w_{X2} \geq 0$ by definition; it is not a signed
    coordinate displacement.


    This quantity refers to the full physical extent of the crystal body, not restricted
    to the active reflecting area unless otherwise specified by the geometry definition.
    Typical values for laboratory or tokamak X-ray crystal spectrometers range from
    a few millimeters to several tens of millimeters, depending on the crystal material
    and optical design.


    The local coordinate system $(X1, X2, X3)$ is an intrinsic crystal-frame system
    in which X1 and X2 are along the two crystal face directions and X3 is normal
    to the crystal surface. This width applies only when the crystal geometry type
    is rectangular (geometry_type index = 3). For non-rectangular geometries, the
    crystal outline is described by explicit boundary coordinates rather than axis-aligned
    widths.


    Related quantities include the first local coordinate width $w_{X1}$ and the explicit
    outline of the crystal in both local coordinate directions.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
