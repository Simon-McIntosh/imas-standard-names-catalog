- name: plasma_magnetic_field
  kind: scalar
  status: draft
  description: Magnetic field in the confined plasma interior, generalizing over equilibrium
    and perturbed configurations arising from MHD modes or non-axisymmetric fields,
    and distinct from equivalent field definitions in the surrounding vacuum region.
  documentation: 'The plasma magnetic field designates the magnetic-field vector evaluated
    within the confined plasma volume, where both the equilibrium field from external
    coil systems and plasma-current-driven contributions are present, together with
    first-order departures driven by MHD instabilities or applied non-axisymmetric
    perturbations. This quantity serves as the conceptual parent for field quantities
    that are explicitly localized to the plasma interior, as opposed to vacuum-region
    counterparts that satisfy $\nabla \times \mathbf{B} = 0$.


    In the linearized MHD framework the total field decomposes as


    $$

    \mathbf{B} = \mathbf{B}_0 + \delta\mathbf{B}

    $$


    where $\mathbf{B}_0$ is the axisymmetric equilibrium field and $\delta\mathbf{B}$
    is the first-order perturbation. Inside the plasma, $\delta\mathbf{B}$ couples
    to the perturbed current density $\delta\mathbf{J}$ and pressure gradient through
    the linearized MHD force balance, a physical constraint absent in the vacuum region.


    The concrete vector realization of the first-order plasma-interior perturbation
    is [perturbed_plasma_magnetic_field](name:perturbed_plasma_magnetic_field), which
    carries the eigenfunction field in tesla and is explicitly distinguished from
    perturbation fields defined in the vacuum region. For the scalar amplitude of
    the equilibrium departure without the plasma-interior qualification, the sibling
    quantity perturbed_magnetic_field applies. Measurement of the perturbation field
    inside the plasma relies on Mirnov coil arrays for edge fluctuations, polarimetry
    for line-integrated signals, and MHD eigenfunction reconstruction from equilibrium
    data.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  arguments:
  - name: magnetic_field
    operator: plasma
    operator_kind: qualifier
  sources:
  - id: derived:plasma_magnetic_field
    status: composed
- name: perturbed_plasma_magnetic_field
  kind: vector
  status: draft
  description: First-order or fluctuating magnetic-field vector evaluated in the plasma
    region relative to an equilibrium magnetic field. It is the MHD perturbation or
    eigenfunction field inside the plasma, distinct from perturbation quantities defined
    in the surrounding vacuum region.
  documentation: 'The perturbed plasma magnetic field $\delta\mathbf{B}_\mathrm{pl}$
    is the first-order or fluctuating part of the magnetic field evaluated inside
    the plasma region relative to an equilibrium field. It is the magnetic perturbation
    used in MHD stability, eigenmode, and plasma-response descriptions, and each resolved
    component has unit tesla. The word plasma identifies the region of the field,
    not an exclusive source attribution; perturbation fields defined in the surrounding
    vacuum region are separate quantities.


    The basic perturbative decomposition in the plasma region is


    $$

    \delta\mathbf{B}_\mathrm{pl}(\mathbf{x},t) = \mathbf{B}(\mathbf{x},t) - \mathbf{B}_0(\mathbf{x})

    $$


    where $\mathbf{x}$ is position in meters, $t$ is time in seconds, and $\mathbf{B}$,
    $\mathbf{B}_0$, and $\delta\mathbf{B}_\mathrm{pl}$ are magnetic fields in tesla.
    If externally imposed non-axisymmetric fields are present, this equation still
    refers to the perturbation of the total magnetic field at points in the plasma
    region; a response-only decomposition that subtracts an applied vacuum field is
    a model choice, not the defining convention for this quantity. Magnetic-field
    perturbations satisfy $\nabla\cdot\delta\mathbf{B}_\mathrm{pl}=0$ up to numerical
    or measurement error.


    In ideal linear MHD, the perturbation is often computed from the plasma displacement
    $\boldsymbol{\xi}$ through $\delta\mathbf{B}_\mathrm{pl}=\nabla\times(\boldsymbol{\xi}\times\mathbf{B}_0)$,
    where $\boldsymbol{\xi}$ is in meters; vector-potential formulations use $\delta\mathbf{B}_\mathrm{pl}=\nabla\times\delta\mathbf{A}$
    with $\delta\mathbf{A}$ in T m. Experimentally it is inferred by subtracting an
    equilibrium contribution from magnetic measurements and fitting mode structures;
    internal reconstructions combine boundary magnetics with equilibrium and stability
    constraints. For linear eigenfunctions, the absolute amplitude is normalization-dependent
    until fixed by a physical boundary condition, diagnostic calibration, or nonlinear
    saturation level, so shapes, phases, and relative component amplitudes are often
    the robust quantities.


    Components may be resolved in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius in meters, $\phi$ is toroidal angle in radians increasing
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical height
    in meters. The $R$ and $Z$ components are direct cylindrical projections; a poloidal
    component is a projection onto a specified poloidal direction, for example tangent
    to increasing $\theta$ in flux coordinates $(\rho, \theta, \phi)$, and is not
    interchangeable with either the $R$ or $Z$ component. Related plasma-region component
    quantities include the [radial perturbed plasma magnetic field real part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [poloidal perturbed plasma magnetic field real part](name:poloidal_perturbed_plasma_magnetic_field_real_part);
    the [poloidal perturbed vacuum magnetic field real part](name:poloidal_perturbed_vacuum_magnetic_field_real_part)
    describes the analogous perturbation in a vacuum region.


    Typical physical amplitudes are strongly position and normalization dependent.
    After an eigenfunction or time-dependent perturbation is placed on an absolute
    scale, small coherent fluctuations are often $10^{-6}$-$10^{-4}$ T, stronger tearing,
    kink, or edge-localized perturbations near magnetic sensors are commonly $10^{-4}$-$10^{-2}$
    T, and relative amplitudes $|\delta\mathbf{B}_\mathrm{pl}|/|\mathbf{B}_0|$ are
    often $10^{-6}$-$10^{-2}$. Unnormalized linear eigenfunctions should not be compared
    by absolute tesla value alone.


    Sign convention: Positive when a resolved component points along the positive
    direction of its stated basis vector; in the right-handed cylindrical $(R, \phi,
    Z)$ frame this is $+\hat{R}$ outward with increasing major radius $R$, $+\hat{\phi}$
    toward increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    $+\hat{Z}$), and $+\hat{Z}$ upward.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:non_axisymmetric_magnetic_field_at_control_surface
  arguments:
  - name: plasma_magnetic_field
    operator: perturbed
    operator_kind: qualifier
  sources:
  - id: derived:perturbed_plasma_magnetic_field
    status: composed
- name: poloidal_perturbed_plasma_magnetic_field
  kind: scalar
  status: draft
  description: Scalar poloidal component, in a specified flux-coordinate system (rho,
    theta, phi), of the first-order plasma magnetic-field perturbation eigenfunction
    for one toroidal Fourier mode in linear MHD stability analysis. The harmonic-mode
    amplitude is represented by real and imaginary quadrature parts.
  documentation: 'Poloidal perturbed plasma magnetic field is the poloidal scalar
    component of the first-order magnetic-field perturbation eigenfunction in the
    plasma region for a single toroidal Fourier mode in linear MHD. It is resolved
    along the direction of increasing poloidal angle $\theta$ in a specified flux-coordinate
    system $(\rho, \theta, \phi)$; $\phi$ is the toroidal angle of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height. Although the instantaneous physical field is real, a normal-mode eigenfunction
    is represented by a complex scalar amplitude whose [real part](name:poloidal_perturbed_plasma_magnetic_field_real_part)
    and [imaginary part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    give the in-phase and $+i$ quadrature components.


    The component is defined by projection of the perturbed magnetic-field eigenfunction
    onto the local poloidal unit direction:


    $$

    \delta B_\theta = \hat{\mathbf{e}}_\theta \cdot \delta\mathbf{B}

    $$


    where $\delta B_\theta$ is this poloidal component in T, $\delta\mathbf{B}$ is
    the first-order magnetic-field perturbation eigenfunction in T evaluated in the
    plasma region, and $\hat{\mathbf{e}}_\theta$ is the unit vector tangent to increasing
    $\theta$ on a flux surface.


    In linear MHD stability analysis, $\delta B_\theta$ is computed from the linearized
    magnetic perturbation together with the equilibrium field and the displacement
    or velocity eigenfunction. It is one component of the [perturbed plasma magnetic
    field](name:perturbed_plasma_magnetic_field), complementary to toroidal components
    such as the [toroidal real part](name:toroidal_perturbed_plasma_magnetic_field_real_part)
    and to any radial or surface-normal component defined in the same flux-coordinate
    system $(\rho, \theta, \phi)$. Using a normal-mode convention such as the physical
    signal $\mathrm{Re}[\tilde{\delta B}_\theta(\rho,\theta)\exp(i(n\phi-\omega t))]$,
    $\tilde{\delta B}_\theta$ is the complex eigenfunction in T, $n$ is the dimensionless
    toroidal mode number, $\omega$ is angular frequency in rad s$^{-1}$, and $t$ is
    time in s; a different global phase rotation changes the numerical split between
    real and imaginary parts but not the physical perturbation.


    Typical absolute values are not intrinsic because multiplying a linear eigenfunction
    by a constant leaves the mode shape unchanged. Uncalibrated outputs may therefore
    be normalized to a maximum displacement, magnetic perturbation, or mode energy.
    When scaled to measured or prescribed fluctuation levels, poloidal magnetic perturbations
    in tokamak MHD studies are commonly about $10^{-6}$-$10^{-2}$ T, far below equilibrium
    magnetic fields, though the range is scenario- and normalization-dependent.


    Sign convention: Positive when the poloidal component of the perturbation points
    in the direction of increasing poloidal angle $\theta$ in the specified flux-coordinate
    system $(\rho, \theta, \phi)$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_perturbed_plasma_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the poloidal projection of the first-order plasma
    magnetic-field perturbation eigenfunction for a single toroidal Fourier mode in
    linear MHD. It is the +i quadrature component relative to the specified normal-mode
    phase.
  documentation: 'This quantity is the imaginary part of the complex poloidal component
    of the first-order perturbed plasma magnetic-field eigenfunction. The component
    is the projection of the perturbation eigenfunction onto the local poloidal basis
    direction associated with the poloidal angle in flux coordinates $(s, \theta,
    \phi)$.


    Using the normal-mode convention with toroidal Fourier factor $\exp[i(n\phi -
    \omega t)]$, the poloidal component is represented by


    $$

    \delta\mathbf{B}(s,\theta,\phi,t)\cdot\hat e_\theta = \operatorname{Re}\left\{\tilde
    B_\theta(s,\theta)\exp[i(n\phi - \omega t)]\right\}, \qquad B_{\theta,\mathrm{Im}}(s,\theta)=\operatorname{Im}\{\tilde
    B_\theta(s,\theta)\}

    $$


    where $B_{\theta,\mathrm{Im}}$ is this quantity in T, $\tilde B_\theta$ is the
    complex poloidal magnetic-field perturbation eigenfunction in T, $\hat e_\theta$
    is the local poloidal unit basis direction, $n$ is a dimensionless integer toroidal
    mode number, $s$ is a dimensionless radial flux-surface label, $\theta$ is poloidal
    angle in rad, $\phi$ is toroidal angle in rad, $t$ is time in s, and $\omega$
    is the complex angular eigenfrequency in s^-1. The toroidal angle $\phi$ increases
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    In practice this quantity is computed by linear MHD stability or response calculations
    after selecting an equilibrium, a toroidal mode number, an eigenfunction normalization,
    and an overall complex phase. It is interpreted together with the corresponding
    real part, because changing the arbitrary eigenfunction phase rotates the real
    and imaginary parts into one another without changing the physical perturbation.


    There is no universal typical magnitude for this quantity: the amplitude of a
    linear eigenfunction is normalization dependent. Physically meaningful comparisons
    usually use ratios to an equilibrium magnetic-field scale, comparisons between
    components, or the reconstructed real-time perturbation obtained from the real
    and imaginary parts with the stated Fourier phase.


    Sign convention: Positive when the coefficient multiplying $+i$ in the projection
    of the complex eigenfunction onto the local $+\hat e_\theta$ poloidal basis direction
    is positive under the Fourier factor $\exp[i(n\phi - \omega t)]$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: poloidal_perturbed_plasma_magnetic_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/imaginary
    status: composed
- name: poloidal_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex poloidal component of the first-order plasma
    magnetic-field perturbation eigenfunction for a specified toroidal Fourier mode
    in linear MHD stability analysis.
  documentation: 'The poloidal perturbed plasma magnetic field real part gives the
    in-phase component of the complex eigenfunction projection $\delta B_\theta =
    \delta\mathbf{B}_\mathrm{pl} \cdot \hat{\mathbf{e}}_\theta$, where $\hat{\mathbf{e}}_\theta$
    is the poloidal unit vector in flux coordinates $(\psi, \theta, \phi)$, with $\psi$
    the poloidal magnetic flux, $\theta$ the poloidal angle, and $\phi$ the toroidal
    angle.


    The defining relation is:


    $$

    \mathrm{Re}(\delta B_\theta) = \mathrm{Re}\!\left[\delta\mathbf{B}_\mathrm{pl}
    \cdot \hat{\mathbf{e}}_\theta\right]

    $$


    where $\delta\mathbf{B}_\mathrm{pl}$ is the first-order plasma magnetic-field
    perturbation eigenfunction for a single toroidal mode number $n$ and $\delta B_\theta$
    has unit T.


    Together with [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part),
    this quantity fully specifies the complex poloidal eigenfunction component. The
    counterpart quantities [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [toroidal_perturbed_plasma_magnetic_field_real_part](name:toroidal_perturbed_plasma_magnetic_field_real_part)
    complete the vector decomposition of $\delta\mathbf{B}_\mathrm{pl}$. Absolute
    eigenfunction amplitudes depend on normalization convention; physically meaningful
    results are obtained from spatial ratios between components and from plasma-to-vacuum
    matching against [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part).


    Sign convention: Positive when the real part of $\delta\mathbf{B}_\mathrm{pl}
    \cdot \hat{\mathbf{e}}_\theta$ is directed in the direction of increasing poloidal
    angle $\theta$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_real_part
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:poloidal_perturbed_vacuum_magnetic_field_real_part
  arguments:
  - name: poloidal_perturbed_plasma_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/real
