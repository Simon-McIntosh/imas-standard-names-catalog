- name: difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line
  kind: scalar
  status: active
  description: Signed wavelength displacement of a selected fast-neutral-beam spectral-line
    component from its reference wavelength, caused by the motional Stark electric
    field.
  documentation: 'The motional-Stark wavelength displacement is the signed separation
    between a selected spectral-line component from fast neutral beam particles and
    its unshifted reference wavelength. It represents the Lorentz shift produced by
    the electric field arising from particle motion across the magnetic field.


    $$

    \Delta\lambda_{\mathrm{MS}} = \lambda_{\mathrm{component}} - \lambda_{\mathrm{reference}}

    $$


    where $\Delta\lambda_{\mathrm{MS}}$ is the motional-Stark wavelength displacement,
    $\lambda_{\mathrm{component}}$ is the wavelength of the selected component, and
    $\lambda_{\mathrm{reference}}$ is the corresponding unshifted wavelength. The
    motional electric field is $\mathbf{E}_{\mathrm{motional}} = \mathbf{v} \times
    \mathbf{B}$, where $\mathbf{v}$ is the fast-neutral velocity and $\mathbf{B}$
    is the magnetic field.


    This quantity is distinct from the Doppler wavelength difference caused by line-of-sight
    motion, represented by [difference of neutral-beam Doppler wavelength and neutral-beam
    reference wavelength](name:difference_of_neutral_beam_doppler_wavelength_and_neutral_beam_reference_wavelength).
    Positive displacement denotes a component at a longer wavelength than the reference.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links: []
  sources:
  - dd_path: charge_exchange/channel/bes/lorentz_shift
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-bes-lorentz_shift
    dd_documentation:
      leaf: Lorentz shift due to the Lorentz electric field (vxB) in the frame of
        the diagnostic neutral beam particles moving with a velocity v across the
        magnetic field B
      parent_path: charge_exchange/channel/bes
      parent: Derived Beam Emission Spectroscopy (BES) parameters
      data_type: STRUCTURE
      unit: m
    enhanced_context:
      description: "Lorentz shift of the BES spectral line due to the motional Stark\
        \ electric field (v\xD7B) acting on fast diagnostic neutral beam particles.\
        \ Used as a wavelength correction in beam emission spectroscopy and CXRS spectral\
        \ analysis."
      kind: llm
- name: effective_area_of_langmuir_probe
  kind: scalar
  status: active
  description: Effective collection area of a Langmuir probe, obtained by projecting
    its plasma-facing collector surface onto the plane normal to the local magnetic
    field.
  documentation: 'The effective area of a Langmuir probe is the plasma-facing collector
    surface area projected onto the plane perpendicular to the local magnetic-field
    direction. It represents the area governing particle collection when the sheath
    is magnetized.


    $$

    A_{\mathrm{eff}} = \int_{S_{\mathrm{w}}} \left|\hat{\mathbf{n}} \cdot \hat{\mathbf{b}}\right|\,dA

    $$


    where $A_{\mathrm{eff}}$ is the effective collection area, $S_{\mathrm{w}}$ is
    the plasma-exposed collector surface, $\hat{\mathbf{n}}$ is the local outward
    unit normal, $\hat{\mathbf{b}}$ is the local magnetic-field unit vector, and $dA$
    is an element of collector surface area. The absolute dot product gives the geometrical
    projection factor.


    Unlike the total [area of a Langmuir probe](name:area_of_langmuir_probe), this
    quantity accounts for magnetic-field orientation; unlike the [wetted area of a
    Langmuir probe](name:wetted_area_of_langmuir_probe), it is not the unprojected
    plasma-exposed surface area.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_langmuir_probe
  - name:wetted_area_of_langmuir_probe
  arguments:
  - name: area_of_langmuir_probe
    operator: effective
    operator_kind: qualifier
  sources:
  - dd_path: langmuir_probes/embedded/surface_area_effective
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-surface_area_effective
    dd_documentation:
      leaf: Effective collection area of the probe surface, varying with time due
        to e.g. changes in the magnetic field line incidence angle
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: STRUCTURE
      unit: m^2
    enhanced_context:
      description: Effective collection area of an embedded Langmuir probe, which
        varies with time as the magnetic field line incidence angle changes. Determines
        the effective ion collection area for accurate ion saturation current and
        heat flux measurements.
      kind: llm
- name: efficiency_of_neutron_detector
  kind: scalar
  status: active
  description: "Probability that a neutron incident on the detector\u2019s sensitive\
    \ surface within the selected energy band produces an accepted registered count\
    \ event."
  documentation: 'Detection efficiency is the conditional probability that an incident
    neutron within the selected energy band produces an accepted registered count
    event. It characterizes the detector response, not the incident neutron flux or
    the geometric area of the sensitive surface.


    For an energy band $\mathcal{B}$, the efficiency is defined by


    $$

    \eta_{\mathcal{B}} = \frac{N_{\mathrm{registered},\mathcal{B}}}{N_{\mathrm{incident},\mathcal{B}}}

    $$


    where $N_{\mathrm{registered},\mathcal{B}}$ is the number of accepted neutron-induced
    count events and $N_{\mathrm{incident},\mathcal{B}}$ is the number of neutrons
    incident on the sensitive surface within $\mathcal{B}$. The incident population
    is related to the [neutron flux of the neutron detector](name:neutron_flux_of_neutron_detector),
    while the registered events contribute to the [neutron rate of the neutron detector](name:neutron_rate_of_neutron_detector).
    The efficiency excludes counts unrelated to incident neutrons and does not itself
    represent detector area.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/energy_band/detection_efficiency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-energy_band-detection_efficiency
    dd_documentation:
      leaf: 'Probability of detection of a photon impacting the detector as a function
        of its energy '
      parent_path: neutron_diagnostic/detector/energy_band
      parent: Set of energy bands in which neutrons are counted by the detector
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - neutron_diagnostic/detector/energy_band/energies
    enhanced_context:
      description: Detection efficiency of a neutron detector energy band as a function
        of incident neutron energy. Gives the probability that a neutron impacting
        the detector within the specified energy interval is recorded as a count.
      kind: llm
- name: energy_at_launching_position
  kind: scalar
  status: active
  description: Energy at launching position is the total energy carried by a launched
    beam or pulse at its launch reference position, before downstream interaction,
    absorption, or transport loss changes that energy.
  documentation: 'Energy at launching position is the total energy carried by a launched
    beam, pulse, or directed emission at the specified launching locus along its trajectory.
    It is defined at the launch reference position, not after propagation through
    or interaction with a target medium.


    When represented through the instantaneous power carried through the launch reference
    position, the launch energy is


    $$

    E_\mathrm{launch} = \int_{t_1}^{t_2} P_\mathrm{launch}(t)\,dt

    $$


    where $E_\mathrm{launch}$ is the energy at launching position, $P_\mathrm{launch}(t)$
    is the instantaneous power carried by the launched beam or pulse through that
    position, and $t_1$ and $t_2$ bound the launch interval.


    This parent quantity is independent of the physical carrier or beam species. The
    [wave-beam energy at launching position](name:wave_beam_energy_at_launching_position)
    is the specialization for coherent electromagnetic wave beams; this parent also
    excludes energy stored in the source, energy absorbed in the target, and energy
    evaluated at downstream positions.'
  unit: J
  physics_domain: particle_measurement_diagnostics
  links:
  - name:wave_beam_energy_at_launching_position
- name: energy_of_neutron_detector
  kind: scalar
  status: active
  description: Energy threshold defining a boundary of a neutron detector spectral
    energy band, such that only neutrons with kinetic energy within the bounded interval
    register as counts.
  documentation: "Neutron detectors used in fusion diagnostics operate over discrete\
    \ spectral energy bands, each delimited by lower and upper kinetic-energy thresholds.\
    \ These thresholds define the interval of neutron kinetic energies to which a\
    \ given detector channel responds, determining which reaction products are distinguished\
    \ and how the detector partitions the measured neutron emission spectrum.\n\n\
    The registered count rate $\\dot{N}$ for a band with lower threshold $E_{\\min}$\
    \ and upper threshold $E_{\\max}$ is:\n\n$$\n\\dot{N} = \\int_{E_{\\min}}^{E_{\\\
    max}} \\epsilon(E) \\, \\Phi(E) \\, A \\, dE\n$$\n\nwhere $\\epsilon(E)$ is the\
    \ energy-dependent detection efficiency, $\\Phi(E)$ is the incident neutron energy\
    \ spectrum per unit area per unit energy, and $A$ is the active detector area.\n\
    \nIn deuterium\u2013deuterium burning plasmas the primary neutron peak falls near\
    \ 2.45 MeV, while deuterium\u2013tritium fusion produces neutrons near 14.1 MeV;\
    \ detector energy bands are selected to bracket these peaks or to isolate background\
    \ contributions. The [lower_bound_energy_of_neutron_detector](name:lower_bound_energy_of_neutron_detector)\
    \ specifies the minimum kinetic energy of a given band, while [neutron_maximum_energy_of_neutron_detector](name:neutron_maximum_energy_of_neutron_detector)\
    \ specifies its upper limit. Detection efficiency over the band is captured by\
    \ [efficiency_of_neutron_detector](name:efficiency_of_neutron_detector), and the\
    \ resulting event rate by [neutron_rate_of_neutron_detector](name:neutron_rate_of_neutron_detector)."
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:lower_bound_energy_of_neutron_detector
  - name:neutron_maximum_energy_of_neutron_detector
  - name:efficiency_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
- name: fast_ion_radiance_of_spectral_line_due_to_charge_exchange
  kind: scalar
  status: active
  description: Fast-ion charge-exchange spectral-line radiance is photon radiance
    in a selected transition emitted by charge-exchange products of fast ions, integrated
    along a viewing path. It is counted per projected area perpendicular to the viewing
    direction, per solid angle, and per time.
  documentation: 'Fast-ion charge-exchange spectral-line radiance is the photon radiance
    of a specified atomic transition emitted by the excited product formed when a
    fast ion undergoes charge exchange with a neutral atom. It is integrated along
    the viewing path and over the selected spectral line, and is defined per projected
    area perpendicular to the viewing direction, per solid angle, and per time. Physical
    values are non-negative.


    The defining relation is the line integral of the local photon emissivity for
    that transition along the viewing path:


    $$

    \mathcal{R}_{\ell} = \int_{\Gamma} \varepsilon_{\ell}^{\mathrm{FICX}}\bigl(\mathbf{r}(l),
    \hat{\mathbf{n}}\bigr)\, dl

    $$


    where $\mathcal{R}_{\ell}$ is the radiance of transition $\ell$ with photon-radiance
    units, $\Gamma$ is the viewing path, $l$ is path length along $\Gamma$ with length
    units, $\mathbf{r}(l)$ is position on that path, $\hat{\mathbf{n}}$ is the dimensionless
    unit viewing direction, and $\varepsilon_{\ell}^{\mathrm{FICX}}$ is the local
    photon emissivity of transition $\ell$ from radiating charge-exchange products
    with photon-emissivity units. The emissivity includes the relevant relative-velocity-dependent
    charge-exchange or excitation rates and the radiative branching for the selected
    transition.


    The selected-line qualifier means the photon radiance is integrated over the transition''s
    spectral line and is not a wavelength-differential radiance. This quantity is
    the spectral-line counterpart of [fast-ion radiance due to charge exchange](name:fast_ion_radiance_of_spectral_line_due_to_charge_exchange)
    and is equivalent in meaning to [line-integrated fast-ion emissivity of a spectral
    line due to charge exchange](name:fast_ion_radiance_of_spectral_line_due_to_charge_exchange)
    when expressed as a path-integrated emissivity. It is distinct from [Motional
    Stark radiance at a spectral line](name:motional_stark_radiance_at_spectral_line),
    which describes radiation from beam-neutral Motional Stark emission rather than
    fast-ion charge-exchange products.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:motional_stark_radiance_at_spectral_line
  sources:
  - dd_path: charge_exchange/channel/ion_fast/radiance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-ion_fast-radiance
    dd_documentation:
      leaf: 'Calibrated radiance of the fast ion charge exchange spectrum assuming
        the shape is pre-defined (e.g. by the Fokker-Planck slowing-down function).
        Note: radiance is integrated over the sightline crossing the neutral beam'
      parent_path: charge_exchange/channel/ion_fast
      parent: Derived Fast Ion Charge eXchange (FICX) parameters
      data_type: STRUCTURE
      unit: m^-2.s^-1.sr^-1
    enhanced_context:
      description: Calibrated radiance of the fast ion charge exchange (FICX) spectrum,
        integrated over the sightline crossing the neutral beam. The spectral shape
        is assumed pre-defined, e.g., by the Fokker-Planck slowing-down function.
      kind: llm
- name: first_local_tangential_coordinate_of_neutron_detector
  kind: scalar
  status: active
  description: Signed coordinate of a neutron-detector outline vertex along the first
    local tangential axis of the right-handed local basis (e1, e2, e3), paired with
    the second coordinate to define the detector cross section.
  documentation: 'Signed coordinate of a neutron-detector outline vertex along the
    first local tangential axis is the scalar displacement of that vertex from the
    detector cross-section local origin projected onto $\hat{e}_1$. The right-handed
    local detector basis $(\hat{e}_1,\hat{e}_2,\hat{e}_3)$ has $\hat{e}_3$ as the
    plasma-facing normal to the detector cross section, $\hat{e}_1$ as the tangential
    axis whose positive sense is toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame, and $\hat{e}_2 = \hat{e}_3 \times \hat{e}_1$.


    The coordinate is defined by the local tangent-plane projection:


    $$

    \ell_1 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{e}_1

    $$


    where $\ell_1$ is this first local tangential coordinate, $\mathbf{r}_v$ is the
    position vector of the outline vertex, $\mathbf{r}_0$ is the position vector of
    the detector cross-section local origin, and $\hat{e}_1$ is the first local tangential
    unit vector.


    Together with the [second local tangential coordinate of the neutron detector](name:second_local_tangential_coordinate_of_neutron_detector),
    this coordinate specifies the in-plane position of an outline vertex of the detector
    cross section. It is not a cylindrical $R$, $\phi$, or $Z$ position in the right-handed
    cylindrical $(R,\phi,Z)$ frame and does not denote displacement normal to the
    detector cross section.


    Sign convention: Positive when the outline vertex is displaced from the local
    origin in the $+\hat{e}_1$ direction.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links: []
  sources:
  - dd_path: neutron_diagnostic/detector/geometry/outline/x1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-geometry-outline-x1
    dd_documentation:
      leaf: Positions along x1 axis
      parent_path: neutron_diagnostic/detector/geometry/outline
      parent: Irregular outline of the detector/aperture in the (X1, X2) coordinate
        system. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: Positions of the neutron detector or aperture outline vertices
        along the X1 axis of the local (X1, X2) coordinate system. Used to specify
        the cross-sectional geometry of the detector for neutron diagnostic systems.
      kind: llm
- name: flux_of_neutron_detector
  kind: scalar
  status: active
  description: Rate at which fusion neutrons cross a specified surface per unit area,
    providing the local intensity of neutron transport through that surface.
  documentation: 'Neutron number flux is the rate at which fusion neutrons cross a
    specified surface, normalized by the surface area. It describes neutron transport
    through the surface rather than neutron production within a volume.


    $$

    \Phi_n = \frac{dN_n}{dA\,dt}

    $$


    where $\Phi_n$ is the neutron number flux, $dN_n$ is the number of neutrons crossing
    the surface element $dA$ during time interval $dt$, and $dA$ is the relevant surface-area
    element. The detector-specific quantity [neutron flux incident on a detector surface](name:neutron_flux_of_neutron_detector)
    is an instance evaluated on an active detector surface. This quantity is distinct
    from the [local volumetric neutron production rate](name:emissivity_due_to_fusion),
    which describes neutron creation per unit volume and time.'
  unit: m^-2.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux_of_neutron_detector
  - name:emissivity_due_to_fusion
- name: fraction_of_neutron_detector_converter
  kind: scalar
  status: active
  description: Fraction of neutron detector converter is the part-to-whole composition
    ratio of a specified constituent within the total neutron-detector converter material.
    The constituent and total are evaluated on the same composition basis, such as
    atom count, mass, volume, or amount of substance.
  documentation: 'Fraction of neutron detector converter is the part-to-whole composition
    ratio for a specified constituent of the material that converts incident neutrons
    into detectable secondary particles or radiation in a neutron detector. It compares
    that constituent with the full converter material over the same converter composition
    domain and on one non-negative extensive composition basis, such as atom count,
    mass, volume, or amount of substance.


    For constituent $c$, the converter composition fraction is defined by


    $$

    f_c = \frac{Q_c}{Q_{\mathrm{tot}}}

    $$


    where $Q_c$ is the amount of constituent $c$ in the converter material on the
    selected composition basis, and $Q_{\mathrm{tot}} = \sum_j Q_j$ is the corresponding
    total over all constituents $j$ included in the same converter material. Both
    $Q_c$ and $Q_{\mathrm{tot}}$ must have the same physical dimension: particle count
    for an atomic fraction, mass for a mass fraction, volume for a volume fraction,
    or amount of substance for a mole fraction.


    This generic fraction does not by itself impose atom-count weighting; [atomic
    fraction of neutron detector converter](name:atomic_fraction_of_neutron_detector_converter)
    is the specialized case in which the basis is atom count. For mutually exclusive
    constituents that exhaust the defined converter composition domain, the fractions
    sum to unity and each fraction lies between zero and one; the quantity excludes
    surrounding detector structures and detector response quantities such as conversion
    efficiency.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:atomic_fraction_of_neutron_detector_converter
- name: atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: active
  description: Atomic fraction characterizing the composition of a neutron detector
    converter, the material that transforms incident neutrons into detectable secondary
    charged particles.
  documentation: "A neutron detector converter is a material placed within or adjacent\
    \ to the active detection medium to transform incident neutrons \u2014 electrically\
    \ neutral particles that interact weakly with most matter \u2014 into secondary\
    \ charged particles (alpha particles, protons, or tritons) that produce measurable\
    \ ionization or scintillation signals. The compositional fractions of the converter\
    \ govern the macroscopic neutron absorption cross-section and hence the detection\
    \ sensitivity for a given neutron energy range.\n\nThe most diagnostically specific\
    \ instance of this quantity is the target atomic fraction, which gives the share\
    \ of converter atoms that are the reactive nuclei for the neutron-capture or neutron-scattering\
    \ channel of interest. For boron-based converters this corresponds to the B-10\
    \ enrichment fraction; for helium-3 proportional detectors it is the He-3 purity.\
    \ Converter fractions are dimensionless and bounded between 0 and 1, with values\
    \ close to unity for highly enriched materials used in high-sensitivity fusion\
    \ diagnostics.\n\nConverter composition fractions are manufacturing parameters\
    \ determined from isotopic enrichment specifications and chemical analysis of\
    \ the converter material. They enter the detector response model alongside the\
    \ [efficiency_of_neutron_detector](name:efficiency_of_neutron_detector) to relate\
    \ measured count rates to absolute neutron fluxes during fusion plasma diagnostics."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  arguments:
  - name: fraction_of_neutron_detector_converter
    operator: atomic
    operator_kind: qualifier
- name: height_of_neutron_detector
  kind: scalar
  status: active
  description: Full physical extent of a rectangular neutron-detector aperture along
    its second local tangential direction, the X2 axis of the detector-local Cartesian
    frame.
  documentation: 'The quantity is the full end-to-end extent of a rectangular neutron-detector
    aperture along its second local tangential direction. This direction is the $X_2$
    axis of the detector-local Cartesian basis $(\hat{X}_1, \hat{X}_2)$.


    The extent is defined by the separation of the two boundary coordinates along
    $X_2$:


    $$

    H_2 = X_{2,\max} - X_{2,\min}

    $$


    where $X_{2,\max}$ and $X_{2,\min}$ are the maximum and minimum aperture-boundary
    coordinates along $X_2$, and $H_2$ is the resulting length.


    This quantity describes the second local tangential dimension and is distinct
    from the [width of the neutron detector](name:width_of_neutron_detector), which
    measures the corresponding first local tangential dimension. For a circular aperture,
    the radial size is instead characterized by the [radius of the neutron detector](name:radius_of_neutron_detector).'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:width_of_neutron_detector
  - name:radius_of_neutron_detector
