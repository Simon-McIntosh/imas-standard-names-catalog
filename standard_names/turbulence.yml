- name: parallel_normalized_perturbed_magnetic_field
  kind: scalar
  status: draft
  description: Signed dimensionless projection of a magnetic-field perturbation onto
    the local equilibrium magnetic-field direction, divided by the equilibrium reference
    magnetic-field magnitude. It captures the compressional electromagnetic fluctuation
    channel, in which the perturbation changes the field strength rather than only
    bending the field line.
  documentation: 'Parallel normalized perturbed magnetic field is the dimensionless
    signed component of a magnetic-field perturbation along the local equilibrium
    magnetic-field direction. Physically it represents the compressional part of an
    electromagnetic fluctuation: to first order it alters the local field strength
    rather than only tilting the field line, and it is distinct from the shear (field-bending)
    channel carried by the perturbed vector potential.


    The quantity is obtained by projecting the real magnetic perturbation onto the
    equilibrium-field unit vector and dividing by a positive reference field strength:


    $$

    \delta B_{\parallel,\mathrm{norm}} = \frac{\delta\mathbf{B}\cdot\hat{\mathbf{b}}_0}{B_\mathrm{ref}}

    $$


    where $\delta\mathbf{B}$ is the perturbed magnetic field in tesla, $\mathbf{B}_0$
    is the equilibrium magnetic field in tesla, $\hat{\mathbf{b}}_0 = \mathbf{B}_0/|\mathbf{B}_0|$
    is the dimensionless equilibrium field-line-following unit vector, and $B_\mathrm{ref}$
    is the positive reference magnetic-field strength in tesla, conventionally taken
    as the equilibrium field magnitude $|\mathbf{B}_0|$ evaluated at the reference
    position of the flux surface. The parallel direction $\hat{\mathbf{b}}_0$ follows
    the total equilibrium field, which in the right-handed cylindrical $(R, \phi,
    Z)$ frame combines the toroidal and poloidal components.


    In turbulence analysis this signed variable is formed from the fluctuating field
    after subtracting the equilibrium field and is normalized by the same $B_\mathrm{ref}$
    used for the rest of the electromagnetic fluctuation set. Statistics such as fluctuation
    intensities or spectra derived from it describe the amplitude of this signed quantity;
    they should not be confused with a complex eigenmode coefficient or its modulus,
    the latter represented by [parallel_normalized_perturbed_magnetic_field_amplitude](name:parallel_normalized_perturbed_magnetic_field_amplitude).


    Typical magnitudes in magnetized-plasma turbulence span roughly $10^{-6}$ to $10^{-2}$,
    with the larger values reached at high plasma pressure where electromagnetic effects
    are strong. The signed instantaneous value fluctuates about zero and may be positive
    or negative.


    Sign convention: Positive when the parallel component of the magnetic perturbation
    is aligned with the local equilibrium magnetic-field direction $\hat{\mathbf{b}}_0$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential_amplitude
  - name:parallel_normalized_perturbed_magnetic_field_amplitude
  - name:normalized_particle_flux_due_to_perturbed_parallel_magnetic_field
  - name:normalized_energy_flux_due_to_perturbed_parallel_magnetic_field
  - name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field
