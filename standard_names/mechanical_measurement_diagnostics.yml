- name: electrostatic_potential_at_midplane
  kind: scalar
  status: draft
  description: Electrostatic potential of the plasma evaluated at the equatorial midplane,
    providing the local plasma potential reference in the boundary plasma and scrape-off
    layer.
  documentation: "The electrostatic potential $V_p$ at the midplane is the local electric\
    \ potential of the unperturbed plasma, setting the reference against which sheath\
    \ voltages, probe biases, and radial electric fields are measured in the boundary\
    \ region. It is distinct from the [floating electrostatic potential](name:floating_electrostatic_potential),\
    \ which is the potential at which a probe draws zero net current; the two differ\
    \ by a sheath correction proportional to the local electron temperature.\n\nThe\
    \ plasma\u2013floating potential difference follows:\n\n$$\n\\Delta V = V_p -\
    \ V_f \\approx \\frac{k_B T_e}{e}\\,\\Lambda\n$$\n\nwhere $k_B T_e / e$ is the\
    \ electron temperature expressed as a voltage, and $\\Lambda = \\tfrac{1}{2}\\\
    ln(m_i / 2\\pi m_e)$ is a dimensionless sheath factor of order 2\u20133 for hydrogen-isotope\
    \ plasmas ($m_i$ is the ion mass and $m_e$ the electron mass).\n\nIn practice,\
    \ $V_p$ at the midplane is inferred from Langmuir probe I\u2013V characteristics\
    \ collected during radial plunges through the scrape-off layer; it is identified\
    \ at the knee of the electron-saturation branch or estimated by adding the sheath\
    \ correction to the floating potential using the co-located [electron_temperature_at_midplane](name:electron_temperature_at_midplane).\
    \ The `midplane` locus is unqualified, but in diverted tokamak configurations\
    \ the probe traverse most commonly samples the outboard equatorial plane.\n\n\
    Typical SOL values range from a few to approximately 50 V above machine ground,\
    \ consistently positive with respect to the [electrostatic_potential_at_wall](name:electrostatic_potential_at_wall)\
    \ due to the ambipolar sheath constraint."
  unit: V
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:floating_electrostatic_potential
  - name:electron_temperature_at_midplane
  - name:electrostatic_potential_at_wall
  arguments:
  - name: electrostatic_potential
    operator: midplane
    operator_kind: locus
- name: electrostatic_potential_at_wall
  kind: scalar
  status: draft
  description: Local plasma electrostatic potential immediately adjacent to a plasma-facing
    wall, relative to the chosen electrical reference. It is distinct from the material
    wall voltage, floating potential, and any applied wall bias.
  documentation: 'Electrostatic potential at wall is the voltage-valued scalar potential
    of the quasineutral plasma just outside the sheath adjacent to a plasma-facing
    surface. It is the plasma-side reference for sheath potential drops and near-wall
    electric fields, not the electrical potential of the solid wall material itself.


    In the electrostatic approximation, the electric field is related to the scalar
    potential by


    $$

    \mathbf{E} = -\nabla \Phi

    $$


    where $\Phi$ is the electrostatic potential in volts and $\mathbf{E}$ is the electric
    field in volts per meter. Only potential differences are physically meaningful;
    changing the electrical reference shifts $\Phi$ by a constant without changing
    $\mathbf{E}$.


    In practice this quantity is commonly inferred from a near-wall Langmuir-probe
    current-voltage characteristic, sheath analysis, or an edge-plasma reconstruction
    tied to a specified electrical reference. It differs from [floating electrostatic
    potential](name:floating_electrostatic_potential), which is the potential of an
    electrically isolated probe or surface when the net collected current is zero,
    and from [electrostatic potential at midplane](name:electrostatic_potential_at_midplane),
    which refers to the local plasma potential at a different position. A grounded
    or biased wall can have a material voltage that differs from the adjacent plasma
    potential by the sheath voltage drop.


    Typical values are strongly reference- and regime-dependent. In many low-temperature
    boundary-plasma measurements relative to a grounded vessel, values are of order
    a few volts to several tens of volts, with larger offsets possible near biased
    components, strong emission, or hotter edge conditions.


    Sign convention: Positive when the local plasma potential at the wall is above
    the chosen electrical reference potential.'
  unit: V
