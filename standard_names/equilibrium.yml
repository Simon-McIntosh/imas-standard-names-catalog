      coordinates:
      - sawteeth/profiles_1d/grid/rho_tor_norm
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of profiles 1d."
      kind: template
- name: toroidal_magnetic_flux_due_to_diamagnetic_drift
  kind: scalar
  status: active
  description: Signed toroidal magnetic-flux contribution calculated for a plasma
    equilibrium from the pressure-gradient-driven diamagnetic response relative to
    its reference field.
  documentation: 'Toroidal diamagnetic flux is the signed magnetic flux associated
    with the toroidal component of the magnetic-field change caused by the plasma''s
    pressure-gradient-driven diamagnetic response. For a specified equilibrium, it
    denotes the equilibrium-derived value of this contribution.


    The defining toroidal flux contribution is


    $$

    \Phi_{\mathrm{dia},\phi} = \int_{S_p} \left(\mathbf{B} - \mathbf{B}_{\mathrm{ref}}\right)
    \cdot \hat{\boldsymbol{\phi}}\,\mathrm{d}S

    $$


    where $\Phi_{\mathrm{dia},\phi}$ is the toroidal diamagnetic flux, $\mathbf{B}$
    is the plasma magnetic-field vector, $\mathbf{B}_{\mathrm{ref}}$ is the corresponding
    magnetic field without the pressure-gradient-driven diamagnetic response, $S_p$
    is the poloidal surface enclosing the plasma cross-section, $\mathrm{d}S$ is an
    oriented surface element, and $\hat{\boldsymbol{\phi}}$ is the toroidal unit vector;
    $\phi$ is the toroidal angle.


    This quantity applies to the global plasma region and aggregates the diamagnetic
    magnetic-field change over the enclosing poloidal surface after selecting its
    toroidal component. It excludes magnetic flux already present in the reference
    field and contributions not attributable to the diamagnetic response; it is not
    the total toroidal magnetic flux.


    The toroidal component is a directional specialization of the [magnetic-flux contribution
    due to diamagnetic drift](name:magnetic_flux_due_to_diamagnetic_drift), whose
    vector quantity retains the corresponding directional components. It is also distinct
    from [external magnetic flux](name:external_magnetic_flux), which is produced
    by sources outside the plasma current distribution rather than by the plasma''s
    diamagnetic response.


    Sign convention: Positive when the diamagnetic magnetic-field change points in
    the direction of increasing toroidal angle $\phi$ through a poloidal surface oriented
    along $\hat{\boldsymbol{\phi}}$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/constraints/diamagnetic_flux/reconstructed
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-diamagnetic_flux-reconstructed
    dd_documentation:
      leaf: Value calculated from the reconstructed equilibrium
      parent_path: equilibrium/time_slice/constraints/diamagnetic_flux
      parent: Diamagnetic flux
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: Reconstructed value of diamagnetic flux.
      kind: template
    semantic_facet: reconstructed
  - dd_path: magnetics/diamagnetic_flux
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-diamagnetic_flux
    dd_documentation:
      leaf: Diamagnetic flux. The array of structure corresponds to a set of calculation
        methods (starting with the generally recommended method).
      data_type: STRUCT_ARRAY
