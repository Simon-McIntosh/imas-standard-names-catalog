- name: maximum_power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Maximum total power deposited on the inner, high-field-side divertor
    target over a specified interval, integrating all incident energy channels across
    the wetted strike-zone surface.
  documentation: 'Maximum power at the inner divertor target is the greatest total
    rate at which energy is deposited on the high-field-side target surface during
    a specified time interval. It includes electron, ion, neutral, and radiative contributions
    integrated over the wetted strike-zone area, rather than a local heat-flux density.


    The maximum is defined from the instantaneous quantity [power at the inner divertor
    target](name:power_at_inner_divertor_target) by


    $$

    P_{\mathrm{max,inner}} = \max_{t \in [t_1,t_2]} P_{\mathrm{inner}}(t)

    $$


    where $P_{\mathrm{max,inner}}$ is the maximum target power, $t$ is time, $t_1$
    and $t_2$ are the interval endpoints, and $P_{\mathrm{inner}}(t)$ is the total
    instantaneous deposited power. The total includes the ion contribution represented
    by [ion power at the inner divertor target](name:ion_power_at_inner_divertor_target).


    This quantity is a temporal maximum, not the energy deposited over the interval
    and not the power at a particular target location.'
