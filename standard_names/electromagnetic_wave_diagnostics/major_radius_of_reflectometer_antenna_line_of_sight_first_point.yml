name: major_radius_of_reflectometer_antenna_line_of_sight_first_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the first point defining the line of sight
  of a reflectometer antenna.
documentation: "This quantity gives the major-radius coordinate $R$ (in meters) of\
  \ the starting point of the geometric line of sight for a reflectometer channel\
  \ antenna, used for both detection and emission paths. Together with the vertical\
  \ and toroidal-angle coordinates of the same point, and the corresponding second\
  \ (end) point, it defines the straight-line geometric approximation of the antenna's\
  \ viewing chord through the plasma. This geometric information is input to ray-\
  \ or beam-tracing codes that compute the actual wave propagation path, accounting\
  \ for refraction in the plasma density profile. Typical values correspond to the\
  \ antenna port location on the vacuum vessel, for example $R \\approx 2$\u2013$4$\
  \ m on medium-size tokamaks and $R \\approx 5$\u2013$9$ m on ITER-class devices.\
  \ See also the measurement position major radius and the antenna orientation unit\
  \ vectors."
