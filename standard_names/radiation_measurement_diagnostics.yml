- name: spectral_calibration_factor_of_spectrometer
  kind: scalar
  status: active
  description: "Wavelength-channel calibration coefficient that converts a spectrometer\
    \ photon count rate into absolute photon spectral radiance density at the channel\u2019\
    s selected wavelength."
  documentation: 'This quantity is the wavelength-specific component of the [calibration
    factor of a spectrometer](name:calibration_factor_of_spectrometer). It converts
    a dark-corrected photon count rate from one channel into absolute photon spectral
    radiance density at that channel''s wavelength.


    For channel wavelength $\lambda_c$, the calibrated spectral radiance density is
    defined by


    $$

    L_\lambda(\lambda_c) = C(\lambda_c) S(\lambda_c)

    $$


    where $L_\lambda$ is photon spectral radiance density, $C(\lambda_c)$ is this
    calibration factor, and $S(\lambda_c)$ is the dark-corrected count rate in s$^{-1}$.
    The wavelength $\lambda_c$ is the channel value defined by [wavelength of spectrometer
    channel](name:wavelength_of_spectrometer_channel). The coefficient includes the
    channel''s wavelength-dependent optical throughput, detector response, etendue,
    and effective spectral-width normalization; its spectral response is related to
    the [effective spectral width of a spectrometer channel](name:effective_spectral_width_of_spectrometer_channel).'
  unit: m^-3.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:calibration_factor_of_spectrometer
  - name:wavelength_of_spectrometer_channel
  - name:effective_spectral_width_of_spectrometer_channel
  arguments:
  - name: calibration_factor_of_spectrometer
    operator: spectral
    operator_kind: qualifier
  sources:
