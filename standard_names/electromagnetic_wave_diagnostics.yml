- name: electron_absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Wave power absorbed by the electron population from a single coherent
    beam-tracing beam, representing the electron contribution to total path-integrated
    wave energy deposition.
  documentation: "The electron absorbed power of a beam-tracing beam is the total\
    \ wave power transferred from a single traced coherent electromagnetic beam to\
    \ the electron population over its computed propagation path. It represents the\
    \ electron contribution to wave energy deposition and sums with the ion species\
    \ contributions \u2014 ion_absorbed_power_of_beam_tracing_beam and ion_state_absorbed_power_of_beam_tracing_beam\
    \ \u2014 to give the species-summed [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam).\n\
    \nThe path-integrated electron absorbed power is determined by the local electron\
    \ damping coefficient $\\alpha_e(s)$ and the evolving beam power $P(s)$:\n\n$$\n\
    P_{e,\\mathrm{abs}} = \\int_{\\mathrm{path}} 2\\,\\alpha_e(s)\\,P(s)\\,ds\n$$\n\
    \nwhere $s$ is the arc length along the ray and $\\alpha_e$ derives from the electron\
    \ contribution to the anti-Hermitian part of the plasma dielectric tensor. For\
    \ electron cyclotron resonance heating and ECE diagnostics, $\\alpha_e$ peaks\
    \ near the resonance layer where the wave frequency satisfies $\\omega = n\\,\\\
    Omega_{ce}$, with $\\Omega_{ce} = eB/m_e$ the local electron cyclotron frequency\
    \ and $n$ a harmonic integer.\n\nThis quantity is computed by beam-tracing solvers\
    \ that propagate ray equations through a plasma equilibrium and evaluate the electron\
    \ dielectric response at each point along the path. The ratio $P_{e,\\mathrm{abs}}\
    \ / P_0$ \u2014 where $P_0$ is the [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam)\
    \ \u2014 characterizes single-pass absorption efficiency, which approaches unity\
    \ in strongly absorbing scenarios such as fundamental or second-harmonic electron\
    \ cyclotron resonance heating."
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:absorbed_power_of_beam_tracing_beam
  - name:initial_power_of_beam_tracing_beam
  arguments:
  - name: absorbed_power_of_beam_tracing_beam
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: ece/channel/beam_tracing/beam/electrons/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-electrons-power
    dd_documentation:
      leaf: Power absorbed along the beam by the species
      parent_path: ece/channel/beam_tracing/beam/electrons
      parent: Quantities related to the electrons
      data_type: FLT_1D
      unit: W
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Power absorbed along the beam or ray path by the electron population
        during ECE beam tracing calculations. Quantifies local electron absorption
        of the probing electromagnetic wave as a function of position along the ray.
      kind: llm
  - dd_path: waves/coherent_wave/beam_tracing/beam/electrons/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-electrons-power
    dd_documentation:
      leaf: Power absorbed along the beam by the species
      parent_path: waves/coherent_wave/beam_tracing/beam/electrons
      parent: Quantities related to the electrons
      data_type: FLT_1D
      unit: W
      coordinates:
      - waves/coherent_wave/beam_tracing/beam/length
    enhanced_context:
      description: Wave power absorbed along a beam or ray path by the electron species,
        as computed by beam tracing. Represents the cumulative power deposition profile
        for electron heating from RF or EC waves along the propagation path.
      kind: llm
- name: initial_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Electromagnetic wave power assigned to a single beam-tracing beam at
    launch, providing the reference for evaluating attenuation and plasma absorption
    along its trajectory.
  documentation: 'The electromagnetic power associated with a single coherent-wave
    beam propagated through the plasma by beam-tracing methods at its launch point.
    It is the initial forward wave-power reference for the beam trajectory.


    $$

    P_{\mathrm{launch}} = P(0)

    $$


    where $P_{\mathrm{launch}}$ is the launch power and $P(s)$ is the beam power at
    arc length $s$ from the launch point. Along the trajectory, local absorption gives
    $dP/ds = -\alpha(\mathbf{r})P(s)$, where $\alpha(\mathbf{r})$ is the local wave
    power absorption coefficient at position $\mathbf{r}$. The launch value supplies
    the normalization for [power_of_beam_tracing_beam](name:power_of_beam_tracing_beam)
    and is distinct from [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam),
    which is the net power transferred to the plasma. It is also distinct from [launched_power_of_wave_beam](name:launched_power_of_wave_beam),
    which denotes power entering the vacuum vessel rather than the beam-tracing launch-point
    quantity.'
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:power_of_beam_tracing_beam
  - name:absorbed_power_of_beam_tracing_beam
  - name:launched_power_of_wave_beam
  arguments:
  - name: power_of_beam_tracing_beam
    operator: initial
    operator_kind: qualifier
  sources:
  - dd_path: ece/channel/beam_tracing/beam/power_initial
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-power_initial
    dd_documentation:
      leaf: Initial power in the ray/beam
      parent_path: ece/channel/beam_tracing/beam
      parent: Set of rays/beams describing the wave propagation
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Initial power of a ray or beam at the starting point of beam-tracing
        calculations for an ECE channel. Represents the wave power carried at the
        launch point of the ray or beam propagation.
      kind: llm
- name: launched_wave_frequency
  kind: scalar
  status: active
  description: Launched wave frequency is the non-negative temporal carrier frequency
    of a coherent electromagnetic wave at launch. It is the absolute launch reference
    used when forming launch-referenced spectral frequency differences, not the frequency
    difference itself.
  documentation: 'Launched wave frequency is the non-negative temporal carrier frequency
    of a coherent electromagnetic wave at the launching reference before any comparison
    with a returned or observed spectrum. It identifies the launched component used
    as the reference wave in launch-referenced spectral quantities.


    For a coherent component with temporal phase $\varphi_\mathrm{launch}(t)$, the
    launch frequency is defined by the phase-rate magnitude:


    $$

    f_\mathrm{launch}(t) = \frac{1}{2\pi}\left|\frac{d\varphi_\mathrm{launch}}{dt}\right|

    $$


    where $\varphi_\mathrm{launch}(t)$ is the phase of the launched electric or magnetic
    field component and $t$ is time. For a steady sinusoidal component with period
    $T_\mathrm{launch}$, this reduces to $f_\mathrm{launch}=1/T_\mathrm{launch}$.


    This quantity excludes the frequency of a received, reflected, or observed spectral
    feature and excludes any difference between such a feature and the launch reference.
    A launch-referenced offset such as [difference of reflected-wave spectral-peak
    frequency and launched-wave frequency](name:difference_of_reflected_wave_spectral_peak_frequency_and_launched_wave_frequency)
    is a separate signed quantity formed using $f_\mathrm{launch}$ as the reference
    operand.'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_frequency
  arguments:
  - name: wave_frequency
    operator: launched
    operator_kind: qualifier
  sources:
  - dd_path: waves/coherent_wave/global_quantities/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-global_quantities-frequency
    dd_documentation:
      leaf: Wave frequency
      parent_path: waves/coherent_wave/global_quantities
      parent: Global quantities for various time slices
      data_type: FLT_0D
      unit: Hz
    enhanced_context:
      description: Wave frequency (f) of a coherent electromagnetic wave in the plasma.
        Determines resonance conditions for wave-particle interactions and selects
        the relevant heating regime (EC, IC, LH).
      kind: llm
- name: line_averaged_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume averaged along
    a complete plasma propagation chord, equal to the path integral divided by chord
    length.
  documentation: 'Number density of free electrons per physical volume averaged along
    a complete propagation chord is the path-normalized continuum count density of
    the unqualified free-electron population along that chord.


    For local [electron density](name:electron_density) $n_e(l)$, the defining relation
    is:


    $$

    \bar{n}_e = \frac{1}{L}\int_0^L n_e(l)\,dl

    $$


    where $\bar{n}_e$ is the line-averaged electron density, $n_e(l)$ is the local
    free-electron density at path coordinate $l$, $l$ is distance along the complete
    propagation chord, and $L$ is the full chord length.


    This quantity applies to the complete unqualified free-electron population along
    the chord, aggregating all contributing free-electron populations rather than
    selecting thermal or fast electrons. It is a path average over the chord and is
    not a pointwise [electron density](name:electron_density) or a line-integrated
    column density.


    The numerator in the defining relation is the [line-integrated electron number
    density](name:line_integrated_electron_number_density); dividing it by the chord
    length produces this path-normalized quantity. The same line-averaging construction
    applies to species-specific quantities such as [line-averaged hydrogen density](name:line_averaged_hydrogen_density),
    while this quantity remains specific to free electrons.'
  unit: m^-3
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_density
  - name:line_integrated_electron_number_density
  - name:line_averaged_hydrogen_density
  arguments:
  - name: electron_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: interferometer/channel/n_e_line_average
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-n_e_line_average
    dd_documentation:
      leaf: Line average density, possibly obtained by a combination of multiple interferometry
        wavelengths. Corresponds to the density integrated along the full line-of-sight
        and then divided by the length of the line-of-sight
      parent_path: interferometer/channel
      parent: Set of channels (lines-of-sight)
      data_type: STRUCTURE
      unit: m^-3
    enhanced_context:
      description: "Line-average electron density (n\u0304e), the line-integrated\
        \ electron density along the full interferometer chord divided by the chord\
        \ length. May combine multiple wavelengths for dispersion correction."
      kind: llm
  - dd_path: summary/line_average/n_e/value
