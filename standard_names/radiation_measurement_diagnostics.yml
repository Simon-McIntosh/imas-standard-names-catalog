- name: vertical_coordinate_of_filter_window
  kind: scalar
  status: draft
  description: Vertical Z coordinate, in meters, of the geometric center of a diagnostic
    filter window in the right-handed cylindrical (R, phi, Z) frame. Z is measured
    from the machine midplane and is positive upward along the vertical axis.
  documentation: 'The vertical coordinate of a filter window is the $Z$ position of
    the geometric center of the window that transmits selected radiation to a diagnostic.
    It is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height measured
    in meters from the machine midplane.


    This coordinate is normally determined from the mechanical survey, engineering
    model, or installed diagnostic geometry. Together with the corresponding radial
    coordinate and toroidal angle, it locates the filter-window center for line-of-sight,
    aperture, and ray-tracing calculations. The related quantity [vertical_coordinate_of_filter](name:vertical_coordinate_of_filter_window)
    may denote the same center when the filter is represented by its window center
    rather than by a distinct body coordinate.


    Typical values are device- and diagnostic-dependent, commonly ranging from -5-5
    m in large tokamaks and from -1-1 m in smaller laboratory devices. Values near
    0 m are close to the machine midplane, while positive and negative values identify
    windows mounted above and below that plane.


    Sign convention: Positive when the filter-window center lies above the machine
    midplane in the $+Z$ direction.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
