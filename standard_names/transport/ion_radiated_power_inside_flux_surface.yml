name: ion_radiated_power_inside_flux_surface
status: draft
description: Volume-integrated electromagnetic power radiated by a single ion species
  from the region enclosed by a given flux surface.
documentation: 'The ion radiated power inside a flux surface, $P_{\mathrm{rad,ion}}(\psi)$,
  is the volume integral of the emissivity $\epsilon_{\mathrm{ion}}(\mathbf{r})$ of
  a particular ion species over the volume enclosed by the flux surface at normalized
  poloidal flux $\psi$: $$P_{\mathrm{rad,ion}}(\psi) = \int_{V(\psi)} \epsilon_{\mathrm{ion}}(\mathbf{r})\,
  dV.$$ The emissivity $\epsilon_{\mathrm{ion}}$ (W m$^{-3}$) encompasses line radiation
  from bound-bound transitions, radiative recombination, and charge-exchange recombination
  emission. For light impurities such as C$^{4+}$ the line radiation dominates; for
  high-$Z$ species like tungsten the quasi-continuum unresolved transition array (UTA)
  emission near 5 nm is the primary contributor. This quantity provides the cumulative
  radial profile per ion species, and the sum over all ion species yields `total_ion_radiated_power_inside_flux_surface`.
  Typical per-species values range from kW to MW depending on impurity concentration
  and charge state distribution. The profile is reconstructed from bolometric tomography
  with spectroscopic decomposition or predicted by impurity-transport codes (STRAHL,
  SANCO). See also `electron_radiated_power_inside_flux_surface` for the electron
  contribution.'
