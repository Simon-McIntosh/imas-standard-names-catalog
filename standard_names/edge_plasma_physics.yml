- name: toroidal_lithium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the ionized lithium bulk\
    \ flow velocity at the plasma boundary, the last closed flux surface. It is the\
    \ projection onto the direction of increasing toroidal angle in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame; neutral lithium is excluded and unresolved\
    \ charge states are represented by a population-averaged ion flow."
  documentation: 'The toroidal lithium velocity at the plasma boundary is the flux-surface-averaged
    toroidal projection of the ionized lithium bulk flow on the last closed flux surface.
    It characterizes edge impurity rotation and is governed by momentum balance, radial
    electric field effects, collisions with main ions, and external torque sources.
    The lithium population refers to ionized lithium; neutral lithium atoms are not
    included, and unresolved charge states are represented by a density-weighted ion-population
    flow.


    The boundary value is defined by the flux-surface average of the toroidal projection
    over the last closed flux surface:


    $$

    v_{\phi,\mathrm{Li},b} = \frac{\displaystyle \oint_{\mathrm{LCFS}} \left(\mathbf{v}_{\mathrm{Li}}
    \cdot \hat{\phi}\right)\,\frac{dl}{B_p}}{\displaystyle \oint_{\mathrm{LCFS}} \frac{dl}{B_p}}

    $$


    where $v_{\phi,\mathrm{Li},b}$ is the boundary-averaged toroidal lithium ion velocity
    in $\mathrm{m\,s^{-1}}$, $\mathbf{v}_{\mathrm{Li}}$ is the bulk velocity of ionized
    lithium in $\mathrm{m\,s^{-1}}$, $\hat{\phi}$ is the unit vector in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, $dl$ is poloidal arc length on the last closed flux surface, and $B_p$
    is the poloidal magnetic-field magnitude. The $dl/B_p$ factor gives the flux-surface-average
    weighting for an axisymmetric boundary.


    In practice this quantity can be inferred from spectroscopic Doppler measurements
    of lithium ion emission when suitable lines are available, or estimated by edge
    transport and momentum-balance modeling constrained by measurements. Local estimates
    are mapped to equilibrium flux surfaces, interpolated or extrapolated to the last
    closed flux surface or to the limiting closed-surface approach to it, and then
    averaged with the same $dl/B_p$ weighting. Analogous species-resolved boundary
    velocities include [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary),
    [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary),
    and [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary).


    Typical boundary-averaged impurity toroidal velocities are strongly device- and
    regime-dependent. As an order-of-magnitude guide, edge values may be close to
    $0\,\mathrm{m\,s^{-1}}$, with absolute magnitudes of $10^3-10^4\,\mathrm{m\,s^{-1}}$
    in rotating plasmas; substantially larger magnitudes are case-specific and usually
    indicate strong external torque or steep edge momentum gradients.


    Sign convention: Positive when the lithium ion bulk flow has a toroidal component
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_beryllium_velocity_at_plasma_boundary
  - name:toroidal_lithium_velocity_at_magnetic_axis
- name: toroidal_neon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Toroidal component of the neon ion fluid velocity in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, evaluated at the H-mode pedestal."
  documentation: 'The toroidal neon velocity at the pedestal is the component of the
    neon ion fluid velocity along the toroidal direction, evaluated in the steep-gradient
    edge region characteristic of H-mode confinement. The pedestal lies near the outer
    edge of the confined plasma and is defined by strong radial gradients in quantities
    such as temperature, density, or pressure.


    The toroidal component is the projection of the neon ion fluid velocity onto the
    toroidal basis direction:


    $$

    v_{\phi,\mathrm{Ne}} = \mathbf{v}_{\mathrm{Ne}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{Ne}}$ is the neon ion fluid velocity in m.s^-1, $v_{\phi,\mathrm{Ne}}$
    is its toroidal component in m.s^-1, and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In practice, the pedestal location is identified from edge-gradient structure,
    and the neon toroidal flow is evaluated at that location from impurity-flow measurements
    or from impurity momentum-balance calculations. The value represents directed
    rotation of the neon impurity population rather than a thermal speed.


    Typical absolute magnitudes for impurity toroidal flow at the pedestal are of
    order 10^3-10^5 m.s^-1 in tokamak edge plasmas, with the sign and magnitude depending
    on torque input, radial electric field, collisional coupling, and neoclassical
    transport.


    Sign convention: Positive when the neon ion fluid velocity component points in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
