- name: thickness_of_optical_element
  kind: scalar
  status: active
  description: Perpendicular separation between the opposing optical surfaces of an
    optical element, measured along the local surface normal as its physical material
    thickness.
  documentation: 'The physical thickness of an optical element is the separation between
    corresponding points on its opposing optical surfaces, measured along the local
    surface normal. It describes the material dimension of the element rather than
    its optical path length, focal length, or clear-aperture dimensions.


    For corresponding front- and back-surface position vectors, the thickness is defined
    by


    $$

    t = \left|\left(\mathbf{r}_{\mathrm{back}}-\mathbf{r}_{\mathrm{front}}\right)\cdot\hat{\mathbf{n}}\right|

    $$


    where $t$ is the thickness in m, $\mathbf{r}_{\mathrm{front}}$ and $\mathbf{r}_{\mathrm{back}}$
    are the surface position vectors, and $\hat{\mathbf{n}}$ is the local unit normal.
    For a nonuniform or curved element, the definition applies locally along the corresponding
    surface normal.


    This geometric definition is specialized for a [Bragg crystal](name:thickness_of_bragg_crystal)
    or a [diagnostic filter](name:thickness_of_filter) when those components are the
    optical element.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:thickness_of_bragg_crystal
