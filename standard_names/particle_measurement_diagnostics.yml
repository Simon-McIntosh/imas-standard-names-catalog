- name: line_averaged_boron_density
  kind: scalar
  status: active
  description: Line-averaged boron density is the total elemental boron number density
    averaged along a chord through the plasma. It includes neutral boron and all boron
    ionization states, giving a chord-averaged measure of elemental boron impurity
    content.
  documentation: 'Line-averaged boron density is the total elemental boron number
    density averaged along a chord through the plasma. It includes neutral boron and
    all ionization states of boron, so it represents the chord-averaged elemental
    boron impurity content rather than a local point value.


    The line average over a chord of path length $L$ is defined by the path integral
    of the local charge-state-summed boron density along arc length $l$:


    $$

    \bar{n}_{\mathrm{B},\ell} = \frac{1}{L}\int_0^L \sum_{z=0}^{5} n_\mathrm{B}^{(z)}(l)\,
    dl

    $$


    where $\bar{n}_{\mathrm{B},\ell}$ is the line-averaged boron density, $n_\mathrm{B}^{(z)}(l)$
    is the local boron number density in ionization state $z$ at position $l$ along
    the chord, $z=0$ denotes neutral boron, $z=5$ denotes fully stripped B$^{5+}$,
    and $L$ is the total path length used for the average.


    This quantity is a chord average of the charge-state-summed elemental [boron density](name:boron_density);
    it is not a charge-state-resolved boron density and does not exclude neutral boron.
    It differs from [volume-averaged boron density](name:volume_averaged_boron_density),
    which averages the same elemental density over the confined plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:boron_density
  - name:volume_averaged_boron_density
  arguments:
  - name: boron_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/boron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-boron-value
    dd_documentation:
