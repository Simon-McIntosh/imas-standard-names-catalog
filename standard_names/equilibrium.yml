- name: poloidal_plane_cross_sectional_area_of_flux_surface
  kind: scalar
  status: active
  description: "Geometric area enclosed by a closed magnetic-flux-surface contour\
    \ in a fixed-toroidal-angle poloidal plane of the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'Geometric area enclosed by a closed magnetic-flux-surface contour
    in a fixed-toroidal-angle poloidal plane of the right-handed cylindrical $(R,
    \phi, Z)$ frame is the poloidal-plane cross-sectional area of that flux surface.
    It characterizes the planar section enclosed by one closed magnetic flux surface.


    The area is defined by the planar contour integral


    $$

    A_{\mathrm{pol}} = \frac{1}{2}\left|\oint_{\mathcal{C}} \left(R\,dZ - Z\,dR\right)\right|

    $$


    where $A_{\mathrm{pol}}$ is the poloidal-plane cross-sectional area, $\mathcal{C}$
    is the closed poloidal contour of the flux surface at fixed toroidal angle $\phi$,
    $R$ is major radius measured from the toroidal symmetry axis, $Z$ is vertical
    height, $\phi$ is the toroidal angle in the right-handed cylindrical $(R, \phi,
    Z)$ frame, and $dR$ and $dZ$ are differentials along the contour. The absolute
    value makes the area independent of the contour traversal orientation.


    This quantity applies to the nested family of closed magnetic flux surfaces from
    the magnetic axis to the plasma boundary; its limiting value at the magnetic axis
    is zero. It is an individual-surface geometric measure at fixed toroidal angle,
    not an average over toroidal angle, not an aggregate over multiple flux surfaces,
    and not a measure of open field-line regions.


    It is distinct from the [surface area of flux surface](name:surface_area_of_flux_surface),
    which is the area of the toroidal surface generated by the flux-surface contour.
    At the last closed flux surface, the corresponding boundary quantity is the [poloidal-plane
    cross-sectional area of plasma boundary](name:poloidal_plane_cross_sectional_area_of_plasma_boundary);
    it is also distinct from the [volume of flux surface](name:volume_of_flux_surface),
    which measures the toroidal volume enclosed by the same nested surface.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  - name:poloidal_plane_cross_sectional_area_of_plasma_boundary
  sources:
