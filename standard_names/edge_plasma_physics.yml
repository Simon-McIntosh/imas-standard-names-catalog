- name: flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of deuterium-tritium pseudo-species
    ions at the plasma boundary (separatrix), representing an effective single fuel
    species with atomic mass number 2.5 and summed over all charge states.
  documentation: 'Flux-surface-averaged number density of deuterium-tritium pseudo-species
    ions at the plasma boundary (separatrix) is the charge-state-summed particle density
    of an effective D-T fuel species averaged over the last closed magnetic flux surface.
    The pseudo-species represents the combined deuterium-tritium fuel mixture as one
    ion constituent with mean atomic mass number 2.5, rather than as separate deuterium
    and tritium species. This scalar characterizes the confined-plasma edge fuel content
    relevant to fueling balance, recycling, and separatrix conditions.


    For an axisymmetric equilibrium, the flux-surface average is commonly written
    as a poloidal-contour average with inverse poloidal-field weighting; at an X-point
    separatrix, the value is understood as the limit from closed flux surfaces just
    inside the boundary:


    $$

    \langle n_{DT} \rangle_{\mathrm{sep}} = \frac{\oint_{\mathrm{sep}} n_{DT}(l)\,
    dl/B_p(l)}{\oint_{\mathrm{sep}} dl/B_p(l)}

    $$


    where $n_{DT}$ is the local deuterium-tritium pseudo-species ion density summed
    over all charge states, $l$ is poloidal arc length in meters, and $B_p$ is the
    poloidal magnetic-field magnitude in tesla.


    In practice, this boundary value is inferred by evaluating reconstructed or simulated
    density fields on closed flux surfaces approaching the separatrix and applying
    the same averaging operation. Experimental estimates combine edge density constraints
    from Thomson scattering, interferometry, reflectometry, neutral-particle analysis,
    charge-exchange recombination spectroscopy, and isotope-fraction information;
    transport calculations may instead evolve the effective D-T pseudo-species directly.


    This boundary scalar is the separatrix member of [flux_surface_averaged_deuterium_tritium_density](name:flux_surface_averaged_deuterium_tritium_density)
    and the flux-surface-averaged counterpart of [deuterium_tritium_density_at_plasma_boundary](name:deuterium_tritium_density_at_plasma_boundary),
    which retains variation around the same boundary surface. The closely related
    single-isotope fuel quantity is [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary),
    while [volume_averaged_deuterium_tritium_density](name:volume_averaged_deuterium_tritium_density)
    summarizes the bulk confined-plasma fuel inventory.


    Typical values are $1\times10^{18}$-$5\times10^{19}$ m^-3 in attached or weakly
    detached D-T edge plasmas, and can approach $1\times10^{20}$ m^-3 in high-density
    detached conditions.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_deuterium_tritium_density
  - name:deuterium_tritium_density_at_plasma_boundary
  - name:volume_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_tritium_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/deuterium_tritium/value
    dd_path: summary/local/separatrix_average/n_i/deuterium_tritium/value
    status: composed
- name: flux_surface_averaged_electron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron number density averaged over the last closed flux surface
    at the plasma boundary. It represents the separatrix density as the limiting flux-surface
    average from the confined plasma side.
  documentation: 'Flux-surface-averaged electron density at the plasma boundary is
    the electron number density averaged over the separatrix, or last closed flux
    surface. Because the separatrix is the boundary between closed magnetic surfaces
    and open scrape-off-layer field lines, the quantity is interpreted as the limit
    of the closed-surface average taken from inside the confined plasma.


    The separatrix value is defined from the flux-surface average of the electron
    density as the closed magnetic surface approaches the separatrix:


    $$

    \langle n_e \rangle_{\mathrm{sep}} = \lim_{\psi \to \psi_{\mathrm{sep}}^-} \frac{\oint_{\psi=\mathrm{const}}
    n_e \, dS / |\nabla\psi|}{\oint_{\psi=\mathrm{const}} dS / |\nabla\psi|}

    $$


    where $n_e$ is the local electron number density in m^-3, $\psi$ is a poloidal
    magnetic flux label, $\psi_{\mathrm{sep}}$ is its value at the separatrix, $dS$
    is the surface-area element on a closed magnetic surface, and $|\nabla\psi|$ accounts
    for the differential volume between neighboring flux surfaces. The weighting is
    therefore a volume-shell weighting of the flux-surface average, not a measure
    of field-line spacing.


    In practice this quantity is inferred by combining edge density measurements,
    such as Thomson scattering, interferometry, reflectometry, or Langmuir-probe information,
    with an equilibrium reconstruction that identifies the last closed flux surface.
    Because diagnostics rarely sample the mathematical separatrix exactly, the value
    is usually obtained by fitting or mapping measurements to flux coordinates and
    extrapolating or interpolating to the separatrix from the confined-plasma side.


    Typical values in tokamak plasmas are about $0.1-5 \times 10^{19}$ m^-3, with
    lower values in low-density limiter-like or detached-edge conditions and higher
    values in high-density H-mode or reactor-relevant edge plasmas. The value depends
    strongly on fueling, recycling, pedestal conditions, and divertor or scrape-off-layer
    transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:electron_pressure_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
  - name:electron_density_at_plasma_boundary
  arguments:
  - name: electron_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: gradient_of_radial_electron_density
  kind: scalar
  status: draft
  description: Core-side derivative of electron number density with respect to normalized
    poloidal flux at the H-mode pedestal, representing the density slope just inside
    the steep pedestal region.
  documentation: 'The gradient of radial electron density is the derivative of electron
    number density with respect to the normalized poloidal flux coordinate $\psi_N$,
    evaluated on the core-side branch of an H-mode pedestal density fit. It characterizes
    the gentler radial variation just inside the steep pedestal layer and is distinct
    from the maximum pedestal density gradient gradient_of_electron_density.


    The core-side pedestal slope is defined by evaluating the derivative of the fitted
    electron density $n_e$ at the core-side pedestal location $\psi_{N,\mathrm{core}}$:


    $$

    G_{n_e,\mathrm{core}} = \left.\frac{d n_e}{d\psi_N}\right|_{\psi_N = \psi_{N,\mathrm{core}}}

    $$


    where $G_{n_e,\mathrm{core}}$ is this quantity, $n_e$ is electron number density,
    and $\psi_N$ is the normalized poloidal flux coordinate. Because $\psi_N$ is dimensionless,
    the derivative has the same unit as electron number density.


    In practice, this quantity is obtained by fitting edge electron density measurements
    with a pedestal representation and taking the derivative of that fitted function
    on the core side of the pedestal. The value should not be interpreted as the steepest
    pedestal slope; that maximum-gradient quantity is usually larger in magnitude
    and located within the narrow pedestal transition region.


    Typical H-mode core-side values are often negative, with magnitudes about $10^{18}$-$10^{20}$
    m^-3 for weakly varying or moderately sloped density, and occasionally approaching
    $10^{21}$ m^-3 in strongly shaped or high-density pedestals. Values near zero
    indicate an almost flat core-side density variation over the fitted interval.


    Sign convention: Positive when electron number density increases with increasing
    normalized poloidal flux coordinate $\psi_N$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
- name: heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of the heat flux profile in the scrape-off
    layer, without specifying the electron or ion heat channel.
  documentation: "The heat decay length in the scrape-off layer (SOL) is the radial\
    \ distance over which the heat flux profile falls to $1/e$ of its value at the\
    \ separatrix, characterizing the spatial scale of heat exhaust across the open-field-line\
    \ region. This parent quantity leaves the contributing heat channel unspecified,\
    \ generalizing over both the electron and ion contributions captured by its species-resolved\
    \ children.\n\nThe decay length is formally defined as the inverse of the magnitude\
    \ of the logarithmic radial gradient of the heat flux $q$:\n\n$$\n\\lambda_q =\
    \ \\left| \\frac{\\partial \\ln q}{\\partial r} \\right|^{-1}\n$$\n\nwhere $r$\
    \ is the radial coordinate measured outward from the separatrix into the SOL.\
    \ The species-specific children [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer)\
    \ and [ion_heat_decay_length_over_scrape_off_layer](name:ion_heat_decay_length_over_scrape_off_layer)\
    \ resolve this quantity into the electron and ion heat channels, respectively;\
    \ users requiring species resolution should reference those names directly.\n\n\
    The heat decay length is inferred from infrared thermography of the divertor target,\
    \ which images the radial heat load footprint, or from radially distributed Langmuir\
    \ probe arrays in the SOL. Typical midplane-mapped values in H-mode tokamak plasmas\
    \ span 1\u201310 mm.\n\nSign convention: Positive when the heat flux decreases\
    \ with increasing radial distance outward from the separatrix toward the first\
    \ wall."
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: heat
    operator_kind: qualifier
- name: electron_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of electron heat flux in the scrape-off
    layer, equal to the inverse magnitude of its logarithmic radial gradient.
  documentation: 'The electron heat decay length over the scrape-off layer is the
    radial e-folding distance over which the electron heat flux decreases outside
    the last closed flux surface. It quantifies how narrowly the electron heat channel
    is localized in the scrape-off layer; smaller values correspond to a steeper radial
    falloff.


    For a local outward radial coordinate $r$, the decay length is defined from the
    logarithmic radial gradient of the electron heat flux:


    $$

    \lambda_{q_e} = \left|\frac{q_e}{d q_e / dr}\right| = \left|\frac{d \ln q_e}{dr}\right|^{-1}

    $$


    where $q_e(r)$ is the electron heat flux density in W m$^{-2}$, $r$ is the outward
    radial distance in m, and $\lambda_{q_e}$ is in m. The absolute value makes the
    decay length non-negative; for an outwardly decreasing heat flux, $d q_e / dr
    < 0$.


    In practice, $\lambda_{q_e}$ is obtained by fitting an exponential falloff of
    the electron heat flux as a function of a consistently defined radial coordinate,
    or by evaluating the local logarithmic gradient from measurements or edge-plasma
    transport calculations. If distances are mapped between locations, such as from
    a target surface to an outer-midplane radial coordinate, the geometric mapping
    should be treated consistently with the heat-flux definition.


    Typical values in tokamak scrape-off layers are of order millimeters to centimeters,
    approximately 0.001-0.05 m, with the value depending on confinement regime, collisionality,
    connection length, and magnetic geometry.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
