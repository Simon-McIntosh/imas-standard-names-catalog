name: electron_temperature_pedestal_width
status: draft
cocos_transformation_type: one_like
description: Width in normalized poloidal flux $\psi_N$ of the steep-gradient region
  in the electron temperature pedestal.
documentation: "The electron temperature pedestal width $\\Delta_{T_e}$ quantifies\
  \ the radial extent in normalized poloidal flux over which $T_e$ drops steeply from\
  \ the pedestal top to near scrape-off layer values. It is obtained from mtanh or\
  \ linear fits to high-resolution Thomson scattering or ECE radiometer data. Typical\
  \ values span $\\Delta_{T_e} \\approx 0.02$\u2013$0.06$ in $\\psi_N$ for standard\
  \ H-mode plasmas, with narrower widths at higher magnetic field and lower collisionality.\
  \ The width enters the EPED pedestal prediction framework through the kinetic-ballooning-mode\
  \ (KBM) constraint and is correlated with the inter-ELM pressure gradient. See also\
  \ `electron_temperature_pedestal_position`, `electron_pressure_pedestal_width`."
