name: toroidal_component_of_current_density_due_to_parallel_viscosity
status: draft
description: Toroidal projection of the current density generated by parallel viscous
  stress in the plasma momentum balance.
documentation: "The parallel-viscosity-driven toroidal current density $j_{\\pi\\\
  parallel,\\phi}$ (A\xB7m$^{-2}$) originates from anisotropic momentum transport\
  \ along the magnetic field. In the Braginskii formalism the parallel viscous stress\
  \ tensor is $\\pi_{\\parallel} = -\\eta_0 (\\hat{b}\\hat{b} - \\tfrac{1}{3}\\mathbf{I})(\\\
  hat{b}\\hat{b} - \\tfrac{1}{3}\\mathbf{I}) : \\nabla \\mathbf{v}$, where $\\eta_0$\
  \ is the parallel viscosity coefficient (Pa\xB7s), $\\hat{b} = \\mathbf{B}/B$ is\
  \ the unit vector along the magnetic field, and $\\mathbf{v}$ is the plasma flow\
  \ velocity. The divergence of this stress contributes a current component through\
  \ the generalized Ohm's law. In tokamak plasmas, parallel viscosity is the dominant\
  \ viscous channel due to long mean free paths along field lines; the resulting current\
  \ is important for self-consistent edge equilibrium reconstruction and neoclassical\
  \ flow modeling. Typical magnitudes are $10^2$\u2013$10^4$ A\xB7m$^{-2}$ in the\
  \ pedestal region. Positive when $j_{\\pi\\parallel,\\phi}$ points in the $+\\phi$\
  \ direction under the chosen COCOS convention. See `parallel_component_of_ion_momentum_diffusivity`\
  \ for the associated transport coefficient."
