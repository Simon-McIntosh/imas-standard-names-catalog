- name: neutron_flux_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Neutron flux from a unit fusion-reaction ring source, incident on the
    converter material in a neutron detector.
  documentation: The neutron flux $\Gamma_n$ (m$^{-2}$) quantifies the number of neutrons
    per unit area arriving at the converter layer of a neutron detector from a unit
    ring source (a thin toroidal shell) in the plasma. This flux is the Green's function
    element for the detector response, relating a localized fusion source to the signal
    at the converter. For typical DT plasmas, the flux from a unit source may be computed
    via ray tracing or Monte Carlo methods through the machine geometry. The flux
    is integrated over the [area_of_neutron_detector_converter](name:area_of_neutron_detector_converter)
    to obtain the total neutron rate incident on the detector. The nuclear interactions
    within the converter, which depend on its [nuclear_density_of_neutron_detector_converter](name:nuclear_density_of_neutron_detector_converter)
    and volume given by [volume_of_neutron_detector_converter](name:volume_of_neutron_detector_converter),
    determine the detection efficiency. This quantity is closely related to the [gradient_of_neutron_flux](name:gradient_of_neutron_flux),
    which describes the spatial derivative of the same Green's function. Typical neutron
    flux values at the detector position in a burning-plasma tokamak (e.g. ITER) range
    from $10^{12}$ to $10^{16}$ m$^{-2}$ for a 14.1 MeV DT source.
  unit: m^-2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_neutron_detector_converter
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:gradient_of_neutron_flux
  sources:
  - id: dd:neutron_diagnostic/unit_source/radiation/reaction/flux
    dd_path: neutron_diagnostic/unit_source/radiation/reaction/flux
    status: composed
- name: temperature_of_neutron_detector
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the neutron detector hardware, influencing
    gain stability, noise characteristics, and calibration drift.
  documentation: "The temperature of a neutron detector governs the thermal equilibrium\
    \ of its constituent materials, directly affecting electronic noise, signal gain,\
    \ and the detector's response to incident neutron flux. Temperature variations\
    \ can cause drift in the detector's calibration, requiring corrections to maintain\
    \ accurate fusion neutron yield measurements. Typical operating temperatures range\
    \ from 300\u2013350 K for detectors in tokamak environments, though active cooling\
    \ may be used to stabilize conditions. Temperature measurements are used in conjunction\
    \ with [temperature_of_neutron_detector_converter](name:temperature_of_neutron_detector_converter)\
    \ to model the full detector system's thermal behavior. The quantity is a scalar\
    \ field that is inherently sign-invariant, as thermodynamic temperature is always\
    \ defined in Kelvin and never negative."
  unit: K
  physics_domain: particle_measurement_diagnostics
