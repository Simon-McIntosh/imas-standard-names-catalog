      kind: llm
- name: power_due_to_impurity_radiation
  kind: scalar
  status: active
  description: Power due to impurity radiation is the instantaneous electromagnetic
    power radiated by impurity species through electron-impurity radiation processes
    in the plasma volume. It includes impurity line emission, recombination continuum,
    and the impurity contribution to bremsstrahlung, summed over impurity species
    and charge states.
  documentation: 'Power due to impurity radiation is the instantaneous electromagnetic
    power emitted by impurity species through electron-impurity radiation processes
    in a plasma volume. It represents a non-negative radiative loss from the electron
    energy population, summed over all impurity species and over all charge states
    included in that volume.


    The defining volume integral is the integral of the impurity-radiation volumetric
    emissivity over the emitting plasma volume:


    $$

    P_{\mathrm{imp\,rad}} = \int_V \epsilon_{\mathrm{imp\,rad}}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{imp\,rad}}$ is the impurity-radiation power, $V$ is the emitting
    plasma volume, $dV$ is a volume element, $\mathbf{x}$ is position, and $\epsilon_{\mathrm{imp\,rad}}$
    is the local volumetric emissivity attributable to electron-impurity radiation.


    The included channels are impurity bound-bound line emission, recombination and
    other impurity continuum emission, and the part of bremsstrahlung produced by
    electron interactions with impurity ions. Radiation from main-ion or neutral-fuel
    species is excluded unless those species are treated as impurity species for the
    quantity being defined.


    This quantity is narrower than [total plasma radiated power](name:total_plasma_radiated_power),
    which includes all plasma radiating species and processes. It is distinct from
    [power due to line radiation](name:power_due_to_line_radiation), which denotes
    total bound-bound line emission by plasma atoms and ions rather than the impurity-only
    line contribution; it overlaps [bremsstrahlung power](name:bremsstrahlung_power)
    only through the impurity-attributable bremsstrahlung component. Its interval
    integral is [accumulated radiated energy due to impurity radiation](name:accumulated_radiated_energy_due_to_impurity_radiation),
    with $E_{\mathrm{imp\,rad}}(t_2)-E_{\mathrm{imp\,rad}}(t_1)=\int_{t_1}^{t_2} P_{\mathrm{imp\,rad}}(t)\,dt$.'
  unit: W
  physics_domain: magnetohydrodynamics
  links:
  - name:total_plasma_radiated_power
  - name:power_due_to_line_radiation
  - name:bremsstrahlung_power
  sources:
