- name: parallel_component_of_non_inductive_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel component of the total non-inductive
    current density, $\langle J_\mathrm{ni} \cdot B \rangle / B_0$, encompassing bootstrap
    and all externally driven (RF, NBI, ECCD, LHCD) contributions.
  documentation: "The parallel non-inductive current density characterizes all current\
    \ drive mechanisms that do not rely on the ohmic transformer, projected along\
    \ the magnetic field direction and flux-surface averaged. It is formally defined\
    \ as $J_{\\parallel,\\mathrm{ni}} = \\langle \\mathbf{J}_\\mathrm{ni} \\cdot \\\
    mathbf{B} \\rangle / B_0$, where $\\mathbf{B}$ is the local magnetic field vector,\
    \ $B_0$ is the vacuum toroidal reference field, and the angle brackets denote\
    \ a flux-surface average. The non-inductive contributions include the neoclassical\
    \ bootstrap current (driven by pressure and temperature gradients) and any externally\
    \ driven currents from neutral beam injection (NBI), electron cyclotron current\
    \ drive (ECCD), lower hybrid current drive (LHCD), or ion cyclotron resonance\
    \ heating (ICRH); the complement is the [ohmic parallel current density](name:parallel_component_of_current_density_due_to_ohmic).\
    \ The parallel projection captures the net current flowing along field lines and\
    \ is the physically relevant decomposition for current diffusion in 1D transport\
    \ models, since the toroidal component $J_\\phi$ and the parallel component differ\
    \ by the field-line pitch encoded in the safety factor; the [toroidal non-inductive\
    \ current density](name:toroidal_component_of_non_inductive_current_density) is\
    \ the corresponding toroidal projection. Together these components sum with the\
    \ ohmic contribution to give the total parallel current density. Typical core\
    \ values span $0.1$\u2013$2 \\times 10^6$ A m$^{-2}$ in tokamak H-mode plasmas,\
    \ with bootstrap fraction reaching 50\u201380% in advanced-scenario operations.\
    \ The quantity enters the current-diffusion equation and is essential input to\
    \ MHD stability analysis and profile control; the parent quantity is [non_inductive_current_density](name:non_inductive_current_density).\n\
    \nSign convention: Positive when the non-inductive current flows in the direction\
    \ of the magnetic field $\\mathbf{B}$, consistent with $B_0 > 0$ and plasma current\
    \ in the direction of increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: transport
  links:
