        \ discrete filamentary plasma current element representation."
      kind: llm
- name: toroidal_angle_of_coil_conductor_element
  kind: scalar
  status: active
  description: "Toroidal azimuthal coordinate locating a coil conductor element around\
    \ the symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal angle $\phi$ specifies the azimuthal location of a
    coil conductor element about the machine symmetry axis. It is the object-specific
    counterpart of the [toroidal angle](name:toroidal_angle) coordinate and does not
    specify the element''s radial or vertical position.


    With the Cartesian $x$ axis chosen at $\phi=0$, the angle is defined by


    $$

    \phi = \operatorname{atan2}(y,x) \pmod{2\pi}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates in the right-handed
    $(\hat{x},\hat{y},\hat{z})$ basis, with $\hat{z}=\hat{Z}$. The corresponding cylindrical
    frame is the right-handed $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$
    is vertical height.


    Sign convention: Positive when $\phi$ increases counter-clockwise when viewed
    from above the $+\hat{Z}$ direction.'
  unit: rad
  physics_domain: magnetic_field_systems
  links: []
  sources:
