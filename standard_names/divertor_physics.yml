        balance and recycling studies.
      kind: llm
- name: tritium_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the tritium species at the divertor target is the
    local particle count per volume for tritium ions at the sheath entrance immediately
    upstream of the target-facing plasma boundary.
  documentation: 'Number density of the tritium species at the divertor target is
    the local particle count per volume at the sheath entrance immediately upstream
    of the target-facing plasma boundary. It is the tritium-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local tritium ion number density is defined by the positive-ion count:


    $$

    n_T = n_{T^+} = \frac{dN_T}{dV}

    $$


    where $n_T$ is the tritium ion number density, $n_{T^+}$ is the number density
    of singly ionized tritium ions, $N_T$ is the number of tritium ions in a small
    plasma volume, and $V$ is that plasma volume as its center approaches the sheath
    entrance from the plasma side.


    This quantity applies to the tritium ion population immediately adjacent to the
    divertor target and is summed over all positive atomic ionization states; for
    tritium, the included atomic ion is $T^+$. Neutral tritium atoms and molecules,
    electrons, deuterium ions, and other ion species are excluded.


    It specializes [density_at_divertor_target](name:density_at_divertor_target) by
    selecting only tritium ions. Unlike [deuterium_tritium_density_at_divertor_target](name:deuterium_tritium_density_at_divertor_target),
    it does not aggregate the deuterium and tritium fuel-ion populations.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_tritium_density_at_divertor_target
  sources:
  - dd_path: summary/local/divertor_target/n_i/tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-n_i-tritium-value
    dd_documentation:
      leaf: Value
