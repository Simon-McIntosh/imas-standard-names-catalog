        \ heating (ICRH) waves launched by an IC antenna. Characterizes the transverse\
        \ spatial scale of the wave in the plasma."
      kind: template
- name: poloidal_launched_wave_index_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Signed dimensionless poloidal component of the launched lower-hybrid
    wave refractive-index vector, measured along increasing geometric poloidal angle
    about the antenna reference point.
  documentation: 'The poloidal launched-wave index is the projection of the lower-hybrid
    launched wave refractive-index vector onto the direction of increasing geometric
    poloidal angle about the antenna reference point. It describes the poloidal part
    of the launch spectrum and is distinct from the corresponding [toroidal launched-wave
    index](name:toroidal_launched_wave_index_of_lower_hybrid_antenna).


    The index is defined by


    $$

    N_\theta = \frac{\mathbf{k}\cdot\hat{\boldsymbol{e}}_\theta}{k_0} = \frac{k_\theta}{k_0}

    $$


    where $\mathbf{k}$ is the launched wave vector, $\hat{\boldsymbol{e}}_\theta$
    is the unit vector in the direction of increasing geometric poloidal angle $\theta$,
    $k_\theta$ is the corresponding wave-vector projection, and $k_0 = \omega/c$ is
    the free-space wavenumber for angular frequency $\omega$ and speed of light $c$.
    The projection is defined in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The quantity describes the launch condition only; it is not the local poloidal
    wave index after propagation or interaction with the plasma.


    Sign convention: Positive when the launched wave-vector projection points in the
    direction of increasing geometric poloidal angle $\theta$.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_launched_wave_index_of_lower_hybrid_antenna
  sources:
  - dd_path: lh_antennas/antenna/row/n_pol
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-row-n_pol
    dd_documentation:
      leaf: Refraction index in the poloidal direction. The poloidal angle is defined
        from the reference point; the angle at a point (R,Z) is given by atan((Z-Zref)/(R-Rref)),
        where Rref=reference_point/r and Zref=reference_point/z
      parent_path: lh_antennas/antenna/row
      parent: Set of horizontal rows of waveguides (corresponding to different poloidal
        positions). A power spectrum is provided for each row.
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - lh_antennas/antenna/row/time
    enhanced_context:
      description: Poloidal refractive index (n_pol) of the lower hybrid wave spectrum
        launched by a row of LH antenna waveguides. Characterizes the poloidal wavenumber
        spectrum of the launched LH wave relative to the antenna reference point.
      kind: llm
- name: poloidal_magnetic_flux_at_beam_tracing_point
  kind: scalar
  status: active
  description: Signed poloidal magnetic flux function evaluated at a beam-tracing
    point, serving as the magnetic-surface label at that location.
  documentation: 'Poloidal magnetic flux at a beam-tracing point is the value of the
    equilibrium flux function at the point where the ray or beam path intersects the
    plasma. In an axisymmetric equilibrium, it labels the nested magnetic surface
    passing through that point and is distinct from the normalized coordinate derived
    from axis and boundary values.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the flux function is defined
    by


    $$

    \psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $R$ is major radius, $Z$ is vertical height, $R''$ is the integration radius,
    and $B_Z$ is the vertical magnetic-field component. The beam-tracing point supplies
    the coordinates at which $\psi$ is evaluated. Its value is related to [poloidal
    magnetic flux at a flux surface](name:poloidal_magnetic_flux_at_flux_surface),
    while [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)
    uses the magnetic-axis and plasma-boundary flux values for normalization.


    Sign convention: Positive when $B_Z$ on the integration disk points in the $+Z$
    direction.'
  unit: Wb
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:normalized_poloidal_flux_coordinate
  sources:
  - dd_path: waves/coherent_wave/beam_tracing/beam/position/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-position-psi
    dd_documentation:
      leaf: Poloidal flux
      parent_path: waves/coherent_wave/beam_tracing/beam/position
      parent: Position of the ray/beam along its path
      data_type: FLT_1D
      unit: Wb
      coordinates:
      - waves/coherent_wave/beam_tracing/beam/length
    enhanced_context:
