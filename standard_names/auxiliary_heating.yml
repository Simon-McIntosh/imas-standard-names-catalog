- name: per_toroidal_mode_of_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Total absorbed wave power density per unit volume resolved per toroidal
    mode number, summed over all plasma species, on the poloidal cross-section.
  documentation: The quantity $dP_\mathrm{abs}/dn_\phi$ gives the absorbed wave power
    per unit volume contributed by each toroidal mode number $n_\phi$, integrated
    over all plasma species (electrons and all ion populations). Integrating over
    all toroidal mode numbers recovers the total local absorbed power density $P_\mathrm{abs}$
    in W m$^{-3}$. This all-species form complements the species-resolved siblings
    [per_toroidal_mode_of_fast_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_density),
    [per_toroidal_mode_of_fast_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_density),
    and [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density);
    summing those species-specific densities yields this total. In RF heating scenarios
    (ICRF, ECRH, LH), the toroidal mode spectrum of absorbed power reveals which wave
    components couple most efficiently to the plasma. Typical values range from $10^4$
    to $10^7$ W m$^{-3}$ per dominant mode in core heating scenarios. Flux-surface
    averaging of this quantity yields the corresponding 1D profile resolved per toroidal
    mode, and volume integration over a flux surface yields [per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface).
