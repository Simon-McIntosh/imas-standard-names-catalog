name: plasma_duration
status: draft
cocos_transformation_type: one_like
description: Total time interval during which a confined plasma exists in the vessel,
  measured from breakdown to termination.
documentation: "The plasma duration $\\Delta t_{\\rm plasma}$ is the elapsed time\
  \ between plasma breakdown (first measurable plasma current) and plasma termination\
  \ (current quench or controlled ramp-down to zero). It is a global discharge scalar\
  \ used for operational statistics, duty-cycle planning, and steady-state performance\
  \ assessment. Typical values range from a few seconds in short-pulse tokamaks (e.g.,\
  \ DIII-D, ASDEX Upgrade) to tens of seconds in long-pulse devices (EAST, KSTAR)\
  \ and up to 300\u2013500 s projected for ITER. The quantity is derived from plasma\
  \ current waveforms or from bolometry/spectroscopy signals that indicate plasma\
  \ presence. See also `plasma_breakdown_time` for the absolute time of breakdown."
validity_domain: ''
