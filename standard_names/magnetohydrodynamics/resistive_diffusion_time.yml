name: resistive_diffusion_time
status: draft
cocos_transformation_type: one_like
description: Characteristic timescale for resistive diffusion of the magnetic field
  through the plasma, governing flux penetration and current profile evolution.
documentation: "The resistive diffusion time is defined as $\\tau_R = \\mu_0 \\rho^2\
  \ / (1.22\\,\\eta_{\\mathrm{neo}})$, where $\\mu_0$ is the vacuum permeability ($4\\\
  pi \\times 10^{-7}$ H/m), $\\rho$ is a characteristic radial scale length (m), and\
  \ $\\eta_{\\mathrm{neo}}$ is the neoclassical resistivity ($\\Omega\\cdot$m). The\
  \ factor 1.22 arises from the eigenvalue of the lowest resistive diffusion mode\
  \ in cylindrical geometry. In tokamak plasmas, $\\tau_R$ sets the timescale over\
  \ which externally driven or bootstrap-generated current profiles relax toward the\
  \ Ohmic steady state; typical values range from $\\sim 0.1$ s in small research\
  \ devices to $\\sim 100$\u2013$1000$ s in reactor-grade plasmas (ITER). This timescale\
  \ is critical for assessing tearing mode growth rates, which scale with a hybrid\
  \ of $\\tau_R$ and the Alfv\xE9n time $\\tau_A$. It is computed from equilibrium\
  \ reconstruction profiles of resistivity and geometry rather than directly measured."
