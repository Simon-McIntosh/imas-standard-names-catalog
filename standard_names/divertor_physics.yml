    dd_path: summary/local/divertor_plate/n_i/beryllium/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/beryllium/value
    dd_path: summary/local/divertor_target/n_i/beryllium/value
    status: composed
- name: carbon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of carbon ions in the plasma immediately adjacent to
    a divertor target surface, summed over charge states C+ through C6+. Neutral carbon
    atoms and molecules are excluded unless a neutral-inclusive quantity is explicitly
    specified.
  documentation: 'Carbon density at a divertor target is the local number density
    of carbon ions in the plasma immediately adjacent to a divertor target surface.
    It is a charge-state-summed impurity ion density, so neutral carbon atoms and
    molecules are treated as separate species and are not included.


    The charge-state-summed carbon ion density is obtained by summing over the ionization
    stages of carbon:


    $$

    n_{C,\mathrm{ion}} = \sum_{q=1}^{6} n_{C^{q+}}

    $$


    where $n_{C,\mathrm{ion}}$ is the total carbon ion density in m^-3, $n_{C^{q+}}$
    is the density of carbon ions in charge state $q$ in m^-3, and $q$ is the dimensionless
    positive ion charge state ranging from $1$ up to the nuclear charge $6$.


    This density is commonly inferred from divertor spectroscopy of carbon emission
    lines combined with local electron density and temperature estimates and a collisional-radiative
    model, or evolved per charge state in edge-plasma transport calculations and then
    summed.


    Typical values near divertor targets span a wide range depending on plasma-facing
    material composition, recycling regime, and detachment state, and are generally
    a fraction of the local total ion density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:neon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/carbon/value
    dd_path: summary/local/divertor_plate/n_i/carbon/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/carbon/value
    dd_path: summary/local/divertor_target/n_i/carbon/value
    status: composed
- name: current_of_divertor_tile
  kind: scalar
  status: draft
  description: Net electric current flowing from the plasma across the electrostatic
    sheath onto the plasma-facing surface of an individual divertor tile.
  documentation: 'The current of a divertor tile is the net electric current flowing
    from the plasma across the electrostatic sheath onto the plasma-facing surface
    of a single tile. It provides tile-resolved resolution of the current distribution
    across the divertor strike zone, complementing the target-integrated quantity
    [current_at_divertor_target](name:current_at_divertor_target).


    The tile current integrates the local net sheath current density $j_s$ over the
    plasma-facing tile area $A_\mathrm{tile}$:


    $$

    I_\mathrm{tile} = \int_{A_\mathrm{tile}} j_s \, dA

    $$


    where $j_s$ depends on the local ion saturation current density, the tile-to-plasma
    sheath potential, and the local [electron temperature at the divertor target](name:electron_temperature_at_divertor_target).
    Dividing by the tile area, available from [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),
    converts this quantity to a mean incident current density.


    Tile currents are measured using isolated tile circuits or embedded Langmuir probes
    whose signals are routed through the mechanical tile support structure, enabling
    time-resolved acquisition during plasma operation including transient ELM events.


    Summing contributions from all tiles on a given target recovers [current_at_divertor_target](name:current_at_divertor_target),
    and summing over all targets gives [current_of_divertor](name:current_of_divertor).
    Tile-level current data are used to diagnose thermoelectric current loops, local
    erosion hot spots, and strike-zone asymmetries driven by 3D magnetic perturbations.


    Sign convention: Positive when net electric current flows from the plasma onto
    the tile surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:surface_area_of_divertor_tile
  - name:current_of_divertor
  sources:
  - id: dd:divertors/divertor/target/tile/current_incident
    dd_path: divertors/divertor/target/tile/current_incident
    status: composed
- name: deuterium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of deuterium ions in the plasma immediately adjacent
    to a divertor target. It is the species-resolved fuel-ion population at the plasma-material
    interface in deuterium-fueled operation.
  documentation: 'Deuterium density at the divertor target is the local number density
    of deuterium ions, usually singly ionized $D^+$, in the plasma next to a divertor
    target surface. It is a species-resolved ion density, distinct from the species-agnostic
    [density at divertor target](name:density_at_divertor_target) and from [total
    ion density at divertor target](name:total_ion_density_at_divertor_target), which
    sums over all ion species present.


    For a small volume element adjacent to the target, the deuterium ion density is
    defined by the local particle population per unit volume:


    $$

    n_D = \frac{dN_D}{dV}

    $$


    where $N_D$ is the number of deuterium ions in the volume element $dV$ and $n_D$
    is the corresponding number density.


    In practice, this quantity is inferred from local divertor plasma measurements
    and modeling, such as target-region probe analysis, spectroscopic interpretation
    of deuterium emission, or divertor Thomson scattering when available. The inferred
    value depends strongly on recycling, ionization balance, cross-field transport,
    sheath-edge conditions, and whether the divertor is attached, partially detached,
    or detached.


    Typical values are about $10^{18}-10^{20}$ m^-3 in attached divertor conditions
    and can reach $10^{20}-10^{21}$ m^-3 in high-recycling or detached divertor conditions,
    depending on fueling, target heat flux, and divertor geometry.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:tritium_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/deuterium/value
    dd_path: summary/local/divertor_plate/n_i/deuterium/value
    status: attached
  - id: dd:summary/local/divertor_target/n_i/deuterium/value
    dd_path: summary/local/divertor_target/n_i/deuterium/value
    status: composed
- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Effective charge (Zeff) of the plasma evaluated at the divertor target,
    a dimensionless composite indicator of impurity content equal to unity for a pure
    hydrogen plasma and rising above unity as high-charge impurity species accumulate.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the multi-species\
    \ ion composition at the divertor target by weighting each ion species by the\
    \ square of its charge number, normalized to the electron density. It reflects\
    \ the local impurity content arising from sputtering of plasma-facing components,\
    \ deliberate impurity seeding for power exhaust control, and recycling processes\
    \ at the divertor surface.\n\nThe quantity is defined under quasi-neutrality by:\n\
    \n$$\nZ_\\text{eff} = \\frac{\\sum_s n_s Z_s^2}{n_e}\n$$\n\nwhere $n_s$ is the\
    \ number density of ion species $s$ with charge number $Z_s$, and $n_e = \\sum_s\
    \ n_s Z_s$ is the electron number density enforced by quasi-neutrality. High-$Z$\
    \ impurities contribute disproportionately: a trace fraction of [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ or [argon_density_at_divertor_target](name:argon_density_at_divertor_target)\
    \ raises $Z_\\text{eff}$ far more than an equivalent density of [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target).\n\
    \n$Z_\\text{eff}$ at the divertor is inferred from spectroscopic impurity line\
    \ emission or from the Bremsstrahlung continuum, whose volumetric emissivity scales\
    \ as $n_e^2 Z_\\text{eff}$. Impurity seeding enhances radiative power dissipation\
    \ in detachment scenarios, thereby reducing the [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\
    \ This is the effective-charge component of the [charge_at_divertor_target](name:charge_at_divertor_target)\
    \ family.\n\nTypical values range from 1 for a pure hydrogen plasma to 2\u2013\
    8 in seeded or erosion-dominated divertor conditions.\n\nSign convention: Positive\
    \ when at least one ion species with nonzero charge number is present in the plasma,\
    \ as the numerator $\\sum_s n_s Z_s^2$ and denominator $n_e$ are both positive\
    \ under quasi-neutrality, ensuring $Z_\\text{eff} \\geq 1$."
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
  - name:charge_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/zeff/value
    dd_path: summary/local/divertor_plate/zeff/value
    status: composed
  - id: dd:summary/local/divertor_target/zeff/value
    dd_path: summary/local/divertor_target/zeff/value
    status: attached
- name: electron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Electron number density in the plasma immediately adjacent to the divertor
    target surface. It is the downstream scrape-off-layer electron density at the
    target and is distinct from the electron density at the plasma boundary or separatrix.
  documentation: 'Electron density at the divertor target is the local number of free
    electrons per unit volume in the plasma adjacent to the plasma-facing target,
    usually interpreted as a sheath-entrance or near-target plasma density rather
    than a property inside the solid surface. It characterizes downstream scrape-off-layer
    conditions at the material boundary and should not be identified with the separatrix
    value [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    which is evaluated upstream at the plasma boundary.


    As a local number density it is defined by


    $$

    n_{e,t} = \left.\frac{dN_e}{dV}\right|_{\mathrm{target}}

    $$


    where $N_e$ is the number of free electrons in a small plasma volume $V$ adjacent
    to the target and $n_{e,t}$ is expressed in m$^{-3}$.


    In practice, $n_{e,t}$ is obtained from near-target diagnostics and edge-plasma
    modeling. Flush or embedded Langmuir probes infer it from ion-saturation current
    using sheath assumptions, effective ion mass, and local electron and ion temperatures;
    divertor Thomson scattering and spectroscopic analysis can provide independent
    constraints where available. Reduced two-point scrape-off-layer estimates may
    infer $n_{e,t}$ from upstream or separatrix conditions and target temperature
    using quasineutrality and parallel pressure or momentum balance, but the coefficient
    relating upstream and target quantities depends on ion temperature, Mach number,
    sheath boundary conditions, volumetric momentum losses, radiation, recycling,
    and detachment state. Therefore a fixed electron-only pressure-balance factor
    is not a general definition; in such formulas both $n_{e,t}$ and any upstream
    density $n_{e,u}$ are electron number densities in m$^{-3}$.


    Typical values are about $10^{18}$-$10^{20}$ m$^{-3}$ in sheath-limited or attached
    divertor conditions and $10^{20}$-$10^{21}$ m$^{-3}$ in high-recycling conditions.
    During detachment, the near-target density may rise before rollover and then decrease
    as the ionization front moves away from the target, so the range is strongly dependent
    on fueling, magnetic geometry, and power exhaust regime.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/two_point_model/n_e_target
    dd_path: divertors/divertor/target/two_point_model/n_e_target
    status: attached
  - id: dd:summary/local/divertor_plate/n_e/value
    dd_path: summary/local/divertor_plate/n_e/value
    status: attached
  - id: dd:summary/local/divertor_target/n_e/value
    dd_path: summary/local/divertor_target/n_e/value
    status: attached
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Electron thermal power deposited on the inner divertor target.
  documentation: 'Electron power at the inner divertor target is the total rate at
    which electron thermal energy is deposited on the inner, high-field-side divertor
    target surface. It is the electron contribution to the deposited target power
    and is distinct from ion, neutral, radiative, or electromagnetic power contributions.


    The deposited electron power is the surface integral of the electron heat-flux
    density normal to the target and directed into the material:


    $$

    P_{e,\mathrm{inner}} = \int_{A_\mathrm{inner}} q_{e,n}^{\mathrm{dep}} \, dA

    $$


    where $A_\mathrm{inner}$ is the inner target surface area over which electron
    heat is deposited, $dA$ is an element of target area in m$^2$, and $q_{e,n}^{\mathrm{dep}}$
    is the deposited electron heat-flux density in W m$^{-2}$. If a vector electron
    heat flux is used, $q_{e,n}^{\mathrm{dep}}$ is its projection onto the unit normal
    pointing into the target material; only the into-surface electron thermal component
    is included.


    In practice this quantity is obtained by integrating local electron heat-flux
    estimates over the inner target. Those estimates may come from Langmuir probe
    measurements with a sheath heat-transmission model, from surface calorimetry or
    infrared thermography combined with a model that separates the electron channel,
    or from edge-plasma simulations constrained by divertor diagnostics.


    As a deposited power it is reported as a non-negative scalar; 0 W means that no
    resolved electron thermal power reaches the inner target. Values are strongly
    device- and scenario-dependent, ranging from near 0 W during highly detached or
    low-power phases to kilowatt or megawatt scales in powered divertor plasmas. The
    corresponding outer-target quantity is [electron_power_at_outer_divertor_target](name:electron_power_at_outer_divertor_target),
    while integrated divertor power balances are described by [thermal_power_of_divertor](name:thermal_power_of_divertor)
    and power_of_divertor.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_outer_divertor_target
  - name:thermal_power_of_divertor
  sources:
  - id: dd:wall/global_quantities/electrons/power_inner_target
    dd_path: wall/global_quantities/electrons/power_inner_target
    status: composed
- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of hydrogen ions evaluated locally in the plasma adjacent
    to the divertor target surface.
  documentation: 'Hydrogen density at the divertor target is the local number density
    of hydrogen ions in the plasma immediately adjacent to the target surface. It
    represents the hydrogen contribution to the ion population that enters the divertor
    sheath and participates in recycling, ionization balance, and target particle
    loading.


    For an attached sheath-limited target, the hydrogen ion particle flux to the surface
    is often related to the local density by the Bohm sheath estimate:


    $$

    \Gamma_H \simeq n_H c_s

    $$


    where $n_H$ is the hydrogen ion density in m$^{-3}$, $\Gamma_H$ is the hydrogen
    ion particle flux density in m$^{-2}$ s$^{-1}$, and $c_s$ is the ion sound speed
    at the sheath entrance in m s$^{-1}$. In collisional or detached conditions, the
    same density may require a more detailed treatment of ionization, recombination,
    charge exchange, and flow between the plasma and the material surface.


    This quantity is usually inferred rather than measured directly. Langmuir probes
    can constrain local electron density and ion saturation current, spectroscopy
    can constrain hydrogen emission and ionization sources through collisional-radiative
    analysis, and edge plasma modeling combines these observations with particle-balance
    assumptions to separate the hydrogen ion contribution from other ion species.


    A universal numerical range is not intrinsic to the quantity because divertor
    target density varies strongly with machine size, fueling, detachment state, impurity
    seeding, and isotope mix. In hydrogen-dominated, singly ionized target plasma,
    $n_H$ is typically of the same order as the local [electron density](name:electron_density_at_divertor_target);
    in mixed-species plasmas it is the hydrogen component of the local [ion density](name:ion_density_at_divertor_target)
    and is reduced by deuterium, tritium, helium, or impurity dilution.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:neon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/hydrogen/value
    dd_path: summary/local/divertor_plate/n_i/hydrogen/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/hydrogen/value
    dd_path: summary/local/divertor_target/n_i/hydrogen/value
    status: attached
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of iron ions at the divertor target, summed over all
    ionization stages, providing a local measure of this high-Z metallic impurity
    from erosion of iron-containing plasma-facing and structural materials.
  documentation: 'Iron is a high-Z metallic impurity in fusion plasmas, originating
    from sputtering and erosion of iron-containing structural components and plasma-facing
    materials. The iron number density at the divertor target represents the total
    number of iron ions per unit volume at the divertor target location, aggregated
    over all ionization states $z = 1, \ldots, 26$.


    The combined iron density is defined as:


    $$

    n_\text{Fe} = \sum_{z=1}^{26} n_{\text{Fe}^{z+}}

    $$


    where $n_{\text{Fe}^{z+}}$ is the local density of iron ions in charge state $z$,
    in m$^{-3}$.


    This quantity is a species-resolved component of the broader [density_at_divertor_target](name:density_at_divertor_target),
    characterizing how much high-Z impurity load reaches the divertor target from
    the scrape-off layer. Elevated iron concentrations at the divertor target indicate
    strong erosion or enhanced impurity transport toward the target, and can substantially
    increase radiated power through iron line emission. The density is inferred from
    spectroscopic analysis of iron emission lines in the divertor region, combined
    with collisional-radiative modeling to convert observed line intensities to absolute
    number densities.


    Comparison with [volume_averaged_iron_density](name:volume_averaged_iron_density)
    reveals the degree of impurity accumulation near the target relative to the bulk
    plasma, while [iron_density_at_pedestal](name:iron_density_at_pedestal) gives
    the corresponding local density at the pedestal. Analogous divertor-target densities
    for other impurity species include [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), and
    [boron_density_at_divertor_target](name:boron_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:volume_averaged_iron_density
  - name:iron_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/iron/value
    dd_path: summary/local/divertor_plate/n_i/iron/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/iron/value
    dd_path: summary/local/divertor_target/n_i/iron/value
    status: composed
- name: major_inner_radius_of_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the inner divertor strike point, where the
    inner separatrix leg intersects the divertor target plate.
  documentation: 'The inner divertor strike point is the location where the inner
    (high-field-side) leg of the magnetic separatrix terminates on the divertor target
    surface. Its major-radius coordinate $R_\mathrm{sp,inner}$ locates the primary
    heat-load footprint on the inner target in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the perpendicular distance from the machine symmetry axis
    and $Z$ is the vertical height.


    This coordinate is a fundamental boundary-shape parameter in diverted tokamak
    operation, setting the reference position for divertor heat-flux and particle-flux
    calculations on the inner target. It is obtained from equilibrium reconstruction
    by tracing the separatrix field line from the lower X-point to the divertor plate
    geometry. The companion [major_outer_radius_of_strike_point](name:major_outer_radius_of_strike_point)
    provides the equivalent on the outer low-field-side target; [major_radius_of_secondary_strike_point](name:major_radius_of_secondary_strike_point)
    marks the secondary intersection in double-null configurations; and [major_radius_of_strike_point](name:major_radius_of_strike_point)
    is the unqualified single-null form.


    Typical values range from approximately 1.0 to 2.5 m in medium-to-large conventional
    tokamaks, lying inboard of the geometric midplane separatrix and shifting with
    plasma current, triangularity, and divertor geometry.


    Sign convention: Positive when the strike-point position is measured in the $+\hat{R}$
    direction away from the machine symmetry axis.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:major_outer_radius_of_strike_point
  - name:major_radius_of_secondary_strike_point
  - name:major_radius_of_strike_point
  sources:
  - id: dd:summary/boundary/strike_point_inner_r/value
    dd_path: summary/boundary/strike_point_inner_r/value
    status: composed
- name: maximum_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Maximum power deposited on the inner high-field-side divertor target
    during a specified time interval. It is a non-negative surface-integrated power
    in watts, not a local heat-flux density, and supports assessment of target thermal
    margins.
  documentation: 'Maximum power at the inner divertor target is the largest total
    power deposited on the high-field-side divertor target over a specified time interval.
    It is a non-negative surface integral of deposited heat flux over the wetted target
    surface, expressed in watts, and is distinct from a local power-flux density expressed
    in W m^-2.


    The maximum deposited power is defined from the time-resolved surface heat-flux
    distribution as:


    $$

    P_{\mathrm{inner}}^{\max} = \max_{t \in [t_1,t_2]} \int_{A_{\mathrm{inner}}(t)}
    q_{\perp,\mathrm{dep}}(\mathbf{x}, t)\, dA

    $$


    where $[t_1,t_2]$ is the time interval of interest, $A_{\mathrm{inner}}(t)$ is
    the wetted area of the inner divertor target, $dA$ is a surface area element in
    m^2, and $q_{\perp,\mathrm{dep}}$ is the non-negative heat flux deposited through
    the target surface into the plasma-facing material in W m^-2. The subscript $\perp$
    refers to the normal to the material surface; this quantity should not be confused
    with field-parallel heat flux $q_\parallel$ carried along magnetic field lines
    before interception by the target.


    In practice this quantity is obtained by integrating time-resolved target heat-flux
    maps inferred from infrared thermography, embedded calorimetry, Langmuir probes,
    or boundary-plasma power-balance analysis. The definition concerns net power deposited
    at the target surface and does not require assigning the deposited energy to individual
    carrier channels; electron, ion, neutral, or radiative contributions may be treated
    separately when such resolved information is available.


    Typical magnitudes are strongly device- and scenario-dependent. Present tokamak
    discharges commonly span about $10^5-10^7$ W for an individual inner target, with
    lower values during detached or low-power phases and higher values possible in
    large, high-power plasmas.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_inner_divertor_target
  - name:maximum_power_at_outer_divertor_target
  - name:electron_power_at_inner_divertor_target
  - name:total_ion_power_at_inner_divertor_target
  sources:
  - id: dd:wall/global_quantities/power_density_inner_target_max
    dd_path: wall/global_quantities/power_density_inner_target_max
    status: composed
- name: maximum_power_at_outer_divertor_target
  kind: scalar
  status: draft
  description: Maximum, over a specified time interval, of the total power deposited
    on the outer divertor target. The outer target is the divertor target on the larger-major-radius
    side in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Maximum power at the outer divertor target is the largest value,
    within a chosen time interval, of the total power deposited on the plasma-facing
    target surface at larger major radius. The outer target is identified in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The quantity is non-negative because it counts
    deposited energy flow into the target material.


    For a time interval $T$, it is obtained from the local deposited heat-flux density
    by integrating over the outer target surface and taking the temporal maximum:


    $$

    P_{\mathrm{max,OT}} = \max_{t \in T} \int_{S_{\mathrm{OT}}} q_{\perp,\mathrm{dep}}(\mathbf{r},
    t)\, dA

    $$


    where $P_{\mathrm{max,OT}}$ is this maximum power, $S_{\mathrm{OT}}$ is the plasma-facing
    surface of the outer divertor target, $q_{\perp,\mathrm{dep}}(\mathbf{r}, t)$
    is the local perpendicular deposited heat-flux density at surface position $\mathbf{r}$
    and time $t$, and $dA$ is the surface-area element. The deposited heat-flux density
    is defined as positive for heat flux into the target surface. The corresponding
    instantaneous integrated quantity is [power_at_outer_divertor_target](name:power_at_outer_divertor_target).


    In practice, the time-dependent outer-target power is inferred from infrared thermography
    with thermal modeling, embedded calorimetry, probe-based heat-flux estimates,
    and global power-balance constraints, or computed by integrating modeled loads
    over the target. Conductive, convective, and radiative contributions are related
    to [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction),
    [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection),
    and [power_at_divertor_target_due_to_radiation](name:power_at_divertor_target_due_to_radiation).
    Comparison with [maximum_power_at_inner_divertor_target](name:maximum_power_at_inner_divertor_target)
    separates larger- and smaller-major-radius divertor loading, while [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target)
    describes the local peak heat-flux density rather than integrated power.


    Representative order-of-magnitude maxima are device and scenario dependent: $10^5-10^6$
    W in low-power or strongly detached cases, $10^6-10^7$ W in many diverted tokamak
    scenarios, and $10^7-10^8$ W in large high-heating-power cases. These ranges are
    indicative rather than definitional; the actual value depends on heating power,
    radiated fraction, detachment state, strike-point sharing, and wetted area.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_outer_divertor_target
  - name:maximum_power_at_inner_divertor_target
  - name:peak_power_density_at_divertor_target
  - name:electron_power_at_outer_divertor_target
  sources:
  - id: dd:wall/global_quantities/power_density_outer_target_max
    dd_path: wall/global_quantities/power_density_outer_target_max
    status: composed
- name: neon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of ionized neon immediately adjacent to the divertor
    target, summed over all neon charge states Ne1+ through Ne10+ and excluding neutral
    neon atoms.
  documentation: 'Neon density at the divertor target is the local number density
    of ionized neon in the plasma directly next to the material target surface. It
    represents the total population of neon ions over all bound-electron configurations,
    excluding neutral neon, and is used to quantify impurity content, radiative cooling,
    and dilution in the divertor plasma.


    The total ionized neon density is the sum over neon charge-state densities:


    $$

    n_{\mathrm{Ne}} = \sum_{q=1}^{10} n_{\mathrm{Ne}^{q+}}

    $$


    where $n_{\mathrm{Ne}^{q+}}$ is the number density of neon ions with charge $q$
    and the upper limit corresponds to fully stripped neon.


    In practice this quantity is inferred from impurity emission measurements combined
    with atomic-physics modeling, or obtained from edge and divertor plasma simulations
    that evolve impurity ionization, recombination, radiation, and transport. The
    ratio to [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    gives the local neon ionic fraction; interpretation is also coupled to local [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    and [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target).


    Typical values range from about $10^{15}$-$10^{20}$ m$^{-3}$, depending strongly
    on neon seeding level, divertor detachment state, plasma density, and impurity
    transport. In trace-seeded attached conditions the value may be far below the
    main-ion density, while in strongly radiating or detached divertor plasmas it
    can approach percent-level fractions of the local ion density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:krypton_density_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:ion_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/neon/value
    dd_path: summary/local/divertor_plate/n_i/neon/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/neon/value
    dd_path: summary/local/divertor_target/n_i/neon/value
    status: composed
- name: neutral_power_at_divertor_target
  kind: scalar
  status: draft
  description: Net power deposited on a single divertor target by incident neutral
    particles, including contributions from charge-exchange neutrals and volume-recombined
    ions.
  documentation: "Neutral particles reaching the divertor \u2014 primarily hydrogen\
    \ isotopes produced through charge exchange with the edge plasma and through volume\
    \ recombination \u2014 carry both kinetic and potential energy that is released\
    \ on the target surface upon impact. This quantity gives the net power deposited\
    \ by all such neutrals on a single divertor target, forming one component of the\
    \ total per-target heat load alongside the ion and electron contributions.\n\n\
    The net neutral power at the target is the surface integral of the incident neutral\
    \ energy flux density:\n\n$$\nP_{\\mathrm{n}} = \\int_A \\Gamma_{\\mathrm{n}}(\\\
    mathbf{r})\\,\\langle E_{\\mathrm{n}} \\rangle\\, dA\n$$\n\nwhere $\\Gamma_{\\\
    mathrm{n}}$ is the incident neutral particle flux density in m$^{-2}$ s$^{-1}$,\
    \ $\\langle E_{\\mathrm{n}} \\rangle$ is the mean energy per incident neutral\
    \ in J, and $A$ is the wetted target area in m$^2$.\n\nThis quantity is computed\
    \ from edge transport models that couple fluid plasma equations to Monte Carlo\
    \ neutral solvers, or estimated by subtracting ion and electron power contributions\
    \ from calorimetrically measured total heat loads. The neutral power contribution\
    \ grows most significant under detached divertor conditions, where the recombination\
    \ front approaches the target and the mechanism quantified by [neutral_power_at_divertor_target_due_to_recombination](name:neutral_power_at_divertor_target_due_to_recombination)\
    \ dominates. To obtain the neutral power summed over all divertor targets, see\
    \ [neutral_power_of_divertor](name:neutral_power_of_divertor). The conduction-dominated\
    \ plasma power channel at the same target is given by [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction).\n\
    \nSign convention: Positive when neutral particles deposit net energy on the target\
    \ surface, corresponding to power flow directed from the divertor plasma volume\
    \ toward the target."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_at_divertor_target_due_to_recombination
  - name:neutral_power_of_divertor
  - name:power_at_divertor_target_due_to_conduction
  sources:
  - id: dd:divertors/divertor/target/power_neutrals
    dd_path: divertors/divertor/target/power_neutrals
    status: composed
- name: neutral_power_of_divertor
  kind: scalar
  status: draft
  description: Net power deposited on all divertor targets by neutral particles, aggregated
    over all targets in the divertor assembly.
  documentation: "Neutral particles \u2014 charge-exchange atoms, recycled hydrogen\
    \ atoms and molecules, and dissociation products \u2014 transport energy to divertor\
    \ target surfaces through thermal accommodation, dissociation, and recombination\
    \ processes. This quantity aggregates the neutral-particle heat load over all\
    \ individual divertor targets, capturing the total neutral-particle contribution\
    \ to the divertor power balance without resolving individual targets or specific\
    \ interaction processes.\n\nThe neutral power deposition arises from both the\
    \ kinetic energy and the internal (potential) energy carried by neutral particles\
    \ to the target surface. In attached divertor operation, this channel is typically\
    \ smaller than the electron and ion heat-flux contributions; in deeply detached\
    \ regimes, where volumetric recombination is strong and plasma recedes from the\
    \ target, the neutral component can grow substantially as energy is transported\
    \ to the surface via neutral atom and molecule flux rather than direct plasma\
    \ contact. The process-specific subset due to recombination is given by [neutral\
    \ power of divertor due to recombination](name:neutral_power_of_divertor_due_to_recombination),\
    \ while [neutral power at divertor target](name:neutral_power_at_divertor_target)\
    \ provides the same physical quantity resolved for an individual target. The electric-current\
    \ component of the divertor heat load is separately captured by [power of divertor].\
    \ This quantity is computed from edge-plasma transport modeling or inferred by\
    \ decomposing calorimetric measurements of total target heat load into species-resolved\
    \ channels.\n\nSign convention: Positive when net power is directed from the neutral\
    \ particles toward the divertor targets."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_of_divertor_due_to_recombination
  - name:neutral_power_at_divertor_target
  sources:
  - id: dd:divertors/divertor/power_neutrals
    dd_path: divertors/divertor/power_neutrals
    status: composed
- name: nitrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Nitrogen ion number density evaluated at the divertor target.
  documentation: 'Nitrogen ion number density at the divertor target quantifies the
    local concentration of ionized nitrogen in the plasma immediately adjacent to
    the divertor plate surface. Nitrogen is commonly seeded as an impurity into the
    divertor region to enhance radiative power dissipation through atomic line emission,
    promoting plasma detachment and reducing peak heat loads on the target.


    The ion number density $n_\mathrm{N}$ is defined as the zeroth velocity moment
    of the nitrogen ion velocity distribution:


    $$

    n_\mathrm{N} = \int f_\mathrm{N}(\mathbf{v}) \, d^3v

    $$


    where $f_\mathrm{N}(\mathbf{v})$ is the nitrogen ion phase-space distribution
    function and integration is over all velocities $\mathbf{v}$.


    This quantity is inferred from optical spectroscopy of nitrogen line emission
    in the divertor plasma, or from Langmuir probe measurements combined with spectroscopic
    impurity fraction estimates. It is a key parameter for characterizing impurity
    seeding scenarios and controlling plasma detachment. Analogous quantities for
    other seeded impurity species include [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    and [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    this quantity is the nitrogen-specific component of the parent [density_at_divertor_target](name:density_at_divertor_target).


    Sign convention: Positive when nitrogen ions are present at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:neon_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:oxygen_density_at_divertor_target
  - name:xenon_density_at_divertor_target
  - name:density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/nitrogen/value
    dd_path: summary/local/divertor_plate/n_i/nitrogen/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/nitrogen/value
    dd_path: summary/local/divertor_target/n_i/nitrogen/value
    status: composed
- name: peak_power_density_at_divertor_target
  kind: scalar
  status: draft
  description: Spatial maximum of the heat flux density deposited on the divertor
    target surface, equal to the most severe local thermal load per unit area at the
    point of highest power concentration in the strike zone.
  documentation: "The peak power flux density at the divertor target quantifies the\
    \ maximum local heat load per unit area deposited anywhere on the divertor target\
    \ surface under a given plasma condition. It is the spatial maximum of the heat\
    \ flux distribution across the strike zone and governs the thermal stress, erosion\
    \ rate, and component lifetime of divertor plasma-facing components.\n\nFor a\
    \ heat flux profile $q(\\mathbf{x})$ distributed over the target surface, the\
    \ peak value is:\n\n$$\nq_\\mathrm{peak} = \\max_{\\mathbf{x} \\in S_\\mathrm{target}}\
    \ q(\\mathbf{x})\n$$\n\nwhere $\\mathbf{x}$ denotes position on the target surface\
    \ $S_\\mathrm{target}$ and $q$ is the local power per unit area from combined\
    \ particle and radiation loads.\n\nThe spatial heat flux distribution on target\
    \ tiles is resolved primarily by infrared thermography, with the peak extracted\
    \ from the measured surface temperature rise and the known surface thermal diffusivity\
    \ of the tile material. In numerical simulations, the peak is determined as the\
    \ maximum over the computed deposition profile on the strike zone.\n\nSteady-state\
    \ peak heat flux values in H-mode operation range from 1-20 MW/m\xB2 in present-day\
    \ devices; reactor design limits for tungsten monoblock divertor components are\
    \ set near 10 MW/m\xB2 for continuous operation, with transient events exceeding\
    \ steady-state limits by large factors. Analogous peak loads on other plasma-facing\
    \ surfaces are captured by [peak power density at the limiter](name:peak_power_density_at_limiter),\
    \ [peak power density at the first wall](name:peak_power_density_at_first_wall),\
    \ and the device-level [peak power density at the wall](name:peak_power_density_at_wall),\
    \ while [power at the divertor target due to radiation](name:power_at_divertor_target_due_to_radiation)\
    \ quantifies the integrated radiative contribution to the total target heat load."
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:peak_power_density_at_limiter
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_wall
  - name:power_at_divertor_target_due_to_radiation
  sources:
  - id: dd:divertors/divertor/target/power_flux_peak
    dd_path: divertors/divertor/target/power_flux_peak
    status: attached
  - id: dd:summary/local/divertor_target/power_flux_peak/value
    dd_path: summary/local/divertor_target/power_flux_peak/value
    status: composed
- name: power_of_divertor_due_to_radiation
  kind: scalar
  status: draft
  description: Total net radiative power deposited on the divertor, summed over all
    targets, from photon emission by impurity and hydrogenic species during plasma-wall
    interaction.
  documentation: "The total net radiative power deposited on the divertor is the aggregate\
    \ photon power absorbed across all divertor targets, contributed by line radiation\
    \ from impurity species (carbon, neon, argon, tungsten, and similar) and hydrogenic\
    \ Balmer and Lyman continuum emission. The net value equals the total incident\
    \ radiative flux integrated over all target surfaces minus the fraction reflected\
    \ by the plasma-facing materials, and is summed over all targets in the divertor\
    \ assembly.\n\n$$\nP_{\\mathrm{div,rad}} = \\sum_k \\int_{A_k} \\left(1 - \\rho_k\\\
    right) F_{\\mathrm{rad}}(\\mathbf{x})\\, dA\n$$\n\nwhere $k$ indexes individual\
    \ divertor targets, $A_k$ is the wetted surface area of target $k$, $\\rho_k$\
    \ is the effective surface reflectivity, and $F_{\\mathrm{rad}}$ is the local\
    \ incident radiative power flux density in W m$^{-2}$.\n\nThis aggregate is inferred\
    \ from bolometric tomography using fan-array or tangential bolometers that reconstruct\
    \ the radiated power distribution in the divertor volume, or estimated from integrated\
    \ impurity spectroscopy combined with impurity transport modeling.\n\nIn high-recycling\
    \ attached conditions, radiative losses to the divertor are a modest fraction\
    \ of the power crossing the separatrix; in detached or impurity-seeded regimes\
    \ they can constitute 30\u201380% of the total divertor heat load, substantially\
    \ reducing the conducted and convected channels quantified by [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction)\
    \ and [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection).\
    \ The per-target counterpart is [power_at_divertor_target_due_to_radiation](name:power_at_divertor_target_due_to_radiation),\
    \ and the analogous radiation to the main chamber wall is [radiated_power_at_wall](name:radiated_power_at_wall)."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:power_of_divertor_due_to_convection
  - name:power_at_divertor_target_due_to_radiation
  - name:radiated_power_at_wall
  sources:
  - id: dd:divertors/divertor/power_black_body
    dd_path: divertors/divertor/power_black_body
    status: composed
  - id: dd:divertors/divertor/power_radiated
    dd_path: divertors/divertor/power_radiated
    status: composed
- name: surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: Geometric surface area of the plasma-facing side of one divertor tile.
    It is a per-tile area used to convert integrated heat or particle loads on that
    tile into tile-averaged flux densities.
  documentation: 'Surface area of a divertor tile is the geometric area of the individual
    tile face exposed to the scrape-off-layer plasma and recycling neutrals. It is
    defined per tile, not as an aggregate over a divertor target, cassette, or full
    divertor, and represents the area used when tile-integrated loads are averaged
    over that specific component.


    For a plasma-facing tile surface $S_\mathrm{tile}$, the area is


    $$

    A_\mathrm{tile} = \int_{S_\mathrm{tile}} dA

    $$


    where $A_\mathrm{tile}$ is the tile surface area and $dA$ is the differential
    element of the actual exposed surface, including geometric shaping, bevels, or
    curvature when they are part of the plasma-facing face.


    The value is normally obtained from engineering geometry, metrology, or a surface
    mesh of the divertor component. It can be used with an integrated power or particle
    load on the same tile, for example as $q_\mathrm{tile}=P_\mathrm{tile}/A_\mathrm{tile}$,
    to form a tile-averaged heat flux density.


    Typical divertor-tile surface areas are about $10^{-3}$-$10^{-1}$ m^2, depending
    on tile size, segmentation, strike-point region coverage, and whether detailed
    shaped features are included.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:wetted_area_of_divertor_target
  - name:wetted_area_of_divertor
  sources:
  - id: dd:divertors/divertor/target/tile/surface_area
    dd_path: divertors/divertor/target/tile/surface_area
    status: composed
- name: total_ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of the total ion population at the divertor target,
    summed over all ionic species and charge states present in the local plasma.
  documentation: "The total ion number density at the divertor target is the sum of\
    \ all positive-ion contributions \u2014 fuel ions (hydrogen isotopes), helium\
    \ ash, and seeded or intrinsic impurities \u2014 evaluated locally at the plasma-facing\
    \ divertor surface. It characterizes the aggregate ion particle concentration\
    \ in the sheath-entrance region and governs plasma\u2013surface interaction processes\
    \ including sputtering, recycling, and heat load.\n\nThe total ion density $n_{i,\\\
    mathrm{total}}$ is defined as:\n\n$$\nn_{i,\\mathrm{total}} = \\sum_{s} n_{i,s}\n\
    $$\n\nwhere $s$ indexes all ion species and charge states present at the target.\
    \ By quasi-neutrality, $n_{i,\\mathrm{total}}$ closely approximates the [electron\
    \ density at the divertor target](name:electron_density_at_divertor_target), with\
    \ deviations scaling with the mean effective charge of the impurity mixture.\n\
    \nThis quantity is measured via Langmuir probe saturation-current analysis at\
    \ the divertor surface, or derived from edge-transport modeling constrained by\
    \ spectroscopic observations. In attached and high-recycling regimes, typical\
    \ values range from $10^{19}$ to $10^{21}$ m$^{-3}$, rising toward the upper end\
    \ near detachment onset. Species-resolved contributions are available from [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target),\
    \ [neon_density_at_divertor_target](name:neon_density_at_divertor_target), and\
    \ [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).\n\
    \nSign convention: Positive when ions are present at the divertor target surface."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:neon_density_at_divertor_target
  - name:carbon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i_total/value
    dd_path: summary/local/divertor_plate/n_i_total/value
    status: attached
  - id: dd:summary/local/divertor_target/n_i_total/value
    dd_path: summary/local/divertor_target/n_i_total/value
    status: composed
- name: tungsten_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tungsten ions at the divertor target, summed over
    all ionization stages and excluding neutral tungsten atoms.
  documentation: 'Tungsten (atomic number $Z = 74$) is the primary plasma-facing material
    in the divertor regions of present-day and next-generation fusion devices, where
    ion bombardment causes physical sputtering and releases tungsten atoms that rapidly
    ionize in the scrape-off-layer plasma. The tungsten ion number density at the
    divertor target quantifies the total local concentration of tungsten ions per
    unit volume in the plasma immediately adjacent to the strike-zone surface, and
    is a key component of the broader [density_at_divertor_target](name:density_at_divertor_target)
    species set.


    When charge states are not individually resolved, this quantity represents the
    sum over all ionization stages:


    $$

    n_W = \sum_{q=1}^{74} n_{W^{q+}}

    $$


    where $n_{W^{q+}}$ is the number density of tungsten ions in charge state $q$
    at the target location. Neutral tungsten atoms are excluded from this sum.


    This quantity is inferred from optical emission spectroscopy of tungsten line
    radiation, charge-exchange recombination spectroscopy, or impurity transport codes
    constrained by global particle balance. It characterizes the local impurity source
    strength at the plasma-material interface and is a key input for assessing core
    contamination risk, since tungsten fractional concentrations above approximately
    $10^{-5}$ relative to the electron density can produce intolerable radiated power
    losses in the confined plasma. The boundary impurity content reaching the separatrix
    is tracked separately by [tungsten_density_at_plasma_boundary](name:tungsten_density_at_plasma_boundary).
    Co-seeded impurity densities at the same location, such as [nitrogen_density_at_divertor_target](name:nitrogen_density_at_divertor_target)
    and [argon_density_at_divertor_target](name:argon_density_at_divertor_target),
    are routinely compared with this quantity in divertor detachment control studies.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:tungsten_density_at_plasma_boundary
  - name:nitrogen_density_at_divertor_target
  - name:argon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/tungsten/value
    dd_path: summary/local/divertor_plate/n_i/tungsten/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/tungsten/value
    dd_path: summary/local/divertor_target/n_i/tungsten/value
    status: attached
- name: vertical_coordinate_of_inner_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the point where the inner separatrix leg intersects
    the inner divertor target in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical coordinate of the inner divertor strike point specifies\
    \ the $Z$ position in the right-handed cylindrical $(R, \\phi, Z)$ frame \u2014\
    \ where $Z$ is the height measured along the machine symmetry axis \u2014 at which\
    \ the inner leg of the magnetic separatrix meets the inner divertor target plate.\
    \ This geometry parameter determines the poloidal location of the inner heat and\
    \ particle deposition zone, the parallel connection length between the X-point\
    \ and the target, and the margin between the strike footprint and the edges of\
    \ protected divertor tiles.\n\nThe coordinate is obtained from equilibrium reconstruction\
    \ using external magnetic diagnostics, optionally supplemented by internal profile\
    \ constraints. Real-time plasma control systems track this $Z$ position to keep\
    \ the heat-load footprint within the designed wetted area of the inner target.\n\
    \nIn lower single-null configurations the inner strike point typically lies at\
    \ negative $Z$ values, below the midplane, with magnitudes of order 0.5\u2013\
    2.5 m depending on machine size and plasma shaping. The companion quantity [vertical_coordinate_of_outer_divertor_target](name:vertical_coordinate_of_outer_divertor_target)\
    \ provides the equivalent $Z$ coordinate for the outer separatrix leg, and [major_inner_radius_of_strike_point](name:major_inner_radius_of_strike_point)\
    \ gives the major-radius $R$ coordinate of the same inner strike point.\n\nSign\
    \ convention: Positive when $Z$ is above the geometric midplane, in the $+\\hat{Z}$\
    \ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_coordinate_of_outer_divertor_target
  - name:major_inner_radius_of_strike_point
  sources:
  - id: dd:summary/boundary/strike_point_inner_z/value
    dd_path: summary/boundary/strike_point_inner_z/value
    status: composed
- name: vertical_coordinate_of_outer_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the outer divertor strike point, defined as
    the intersection of the outer separatrix leg with the outer divertor target plate.
  documentation: "The outer divertor strike point is the geometric location where\
    \ the outer separatrix leg meets the outer divertor target plate. Its $Z$ coordinate,\
    \ measured along the symmetry axis in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame where $Z$ increases upward, locates the outer strike point axially\
    \ and is a primary descriptor of the divertor configuration, directly influencing\
    \ heat load distribution and plasma exhaust geometry.\n\nThe strike-point position\
    \ is determined from magnetohydrodynamic equilibrium reconstruction by tracing\
    \ the outer separatrix flux surface to its intersection with the target geometry.\
    \ The location shifts axially as the plasma shape, current profile, and vertical\
    \ position evolve, making this coordinate an important real-time shape-control\
    \ parameter. Paired with [major_outer_radius_of_strike_point](name:major_outer_radius_of_strike_point),\
    \ the two coordinates fully specify the outer strike point in the poloidal $(R,\
    \ Z)$ plane; [vertical_coordinate_of_inner_divertor_target](name:vertical_coordinate_of_inner_divertor_target)\
    \ provides the analogous measurement for the inner separatrix leg, enabling asymmetry\
    \ analysis between the two divertor legs.\n\nIn lower single-null configurations,\
    \ typical values lie in the range \u22121.5 to \u22120.3 m for medium-sized tokamaks;\
    \ upper single-null configurations yield positive $Z$ values.\n\nSign convention:\
    \ Positive when the outer divertor strike point lies above the machine geometric\
    \ midplane in the direction of increasing $Z$."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:major_outer_radius_of_strike_point
  - name:vertical_coordinate_of_inner_divertor_target
  sources:
  - id: dd:summary/boundary/strike_point_outer_z/value
    dd_path: summary/boundary/strike_point_outer_z/value
    status: composed
- name: vertical_outline_of_divertor_tile
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the surface outline defining the geometric
    boundary of an individual divertor tile in the poloidal cross-section.
  documentation: 'The vertical height component of each point defining the surface
    outline of a divertor tile within the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius from the toroidal symmetry axis and $Z$ is
    the vertical coordinate measured from the machine midplane. Paired with the corresponding
    radial outline coordinate, this quantity fully specifies the cross-sectional geometry
    of the tile surface in any toroidally axisymmetric representation, enabling computation
    of wetted surface area, heat-load distribution, and geometric shadowing between
    adjacent plasma-facing components.


    Divertor tile outlines are obtained from engineering or CAD specifications of
    the first-wall assembly. The geometric boundary of the tile determines which surface
    elements intercept the scrape-off-layer heat flux in the vicinity of the magnetic
    strike-point. The outline is also used in optical and infrared camera line-of-sight
    calculations to monitor tile erosion and thermal response. For the analogous geometry
    of limiter tiles, see [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile);
    for the vacuum vessel boundary, see [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel).
    The center-point location of the divertor target surface is given by [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target),
    which captures a single reference point rather than a full outline contour.


    Sign convention: Positive when the outline point is located above the machine
    midplane, in the direction of increasing $Z$.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:vertical_coordinate_of_divertor_target
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/z
    dd_path: divertors/divertor/target/tile/surface_outline/z
    status: composed
- name: power_at_divertor_target_due_to_conduction
  kind: scalar
  status: draft
  description: Thermal power deposited on a single divertor target by conductive plasma
    heat flow along magnetic field lines. It is the target-surface integral of the
    conductive heat-flux component into the material, excluding heat carried by convective
    particle flow.
  documentation: 'Power at a divertor target due to conduction is the thermal power
    deposited on one divertor target by electron and ion heat conduction along magnetic
    field lines in the scrape-off-layer plasma. It represents only the temperature-gradient-driven
    heat-flow channel and excludes enthalpy and kinetic energy carried to the target
    by net particle flow, which belongs to [power_at_divertor_target_due_to_convection](name:power_at_divertor_target_due_to_convection).


    For a target surface $A_t$, with unit normal $\mathbf{n}_t$ directed from the
    target material toward the plasma, a surface-integral definition is:


    $$

    P_{\mathrm{cond},t} = -\int_{A_t} \left(q_{\parallel e,\mathrm{cond}} + q_{\parallel
    i,\mathrm{cond}}\right)\left(\mathbf{b}\cdot\mathbf{n}_t\right)\,dA,\qquad q_{\parallel
    s,\mathrm{cond}} = -\kappa_{\parallel s}\nabla_\parallel T_s,\ s\in\{e,i\}

    $$


    where $P_{\mathrm{cond},t}$ is in W; $q_{\parallel e,\mathrm{cond}}$ and $q_{\parallel
    i,\mathrm{cond}}$ are electron and ion conductive parallel heat-flux densities
    in W m$^{-2}$; $\mathbf{b}$ is the unit vector along the magnetic field; $dA$
    is a target-surface element in m$^2$; $\nabla_\parallel=\mathbf{b}\cdot\nabla$;
    $T_s$ is the species temperature; and $\kappa_{\parallel s}$ is the species parallel
    thermal conductivity, in W m$^{-1}$ eV$^{-1}$ if $T_s$ is expressed in eV. The
    leading minus sign follows from the chosen normal direction, so heat entering
    the material from the plasma contributes positively.


    In practice, this quantity is computed by integrating separated electron and ion
    conductive heat-flux channels over the wetted part of a divertor target. It can
    also be inferred from measured target heat loads when an edge-plasma power-balance
    model separates conductive heat flow from convective particle-energy transport.
    Summing this quantity over all divertor targets gives [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction),
    and it is one contribution to the broader divertor thermal power balance represented
    by [thermal_power_of_divertor](name:thermal_power_of_divertor).


    Typical per-target values are highly scenario dependent: an unloaded target is
    near 0 W, while a wetted strike region in present tokamaks is often in the 10^4-10^7
    W range. The value is constrained by the exhaust power entering the scrape-off
    layer and by how much of that power is dissipated before the field lines intersect
    the target.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_convection
  - name:thermal_power_of_divertor
  sources:
  - id: dd:divertors/divertor/target/power_conducted
    dd_path: divertors/divertor/target/power_conducted
    status: composed
- name: power_of_divertor_due_to_conduction
  kind: scalar
  status: draft
  description: Power transported to all divertor targets via parallel thermal conduction
    in the scrape-off layer, summed over targets.
  documentation: "The total power conducted from the scrape-off layer (SOL) plasma\
    \ to the divertor represents the conductive channel of the plasma\u2013divertor\
    \ power exhaust balance, summed over all individual targets. In attached divertor\
    \ operation, parallel electron and ion thermal conduction along open magnetic\
    \ field lines is the dominant heat transport mechanism, driven by the temperature\
    \ gradient between the high-temperature upstream SOL and the cooler target.\n\n\
    The electron conductive heat flux density along a field line follows the Spitzer\u2013\
    H\xE4rm relation:\n\n$$\nq_{\\parallel,e} = -\\kappa_0 T_e^{5/2} \\nabla_\\parallel\
    \ T_e\n$$\n\nwhere $\\kappa_0 \\approx 2000$ W m$^{-1}$ eV$^{-7/2}$ is the electron\
    \ Spitzer conductivity prefactor and $\\nabla_\\parallel T_e$ is the parallel\
    \ electron temperature gradient. Integrating over the wetted target area and summing\
    \ over all divertor targets yields the total conducted power.\n\nTogether with\
    \ [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection),\
    \ this quantity partitions the total plasma heat load reaching the divertor surface;\
    \ the conductive fraction dominates at high upstream temperatures in attached\
    \ conditions and diminishes progressively as the plasma approaches detachment,\
    \ when $T_e$ at the target drops toward the ionization threshold. In detached\
    \ states, processes such as [plasma_power_of_divertor_due_to_recombination](name:plasma_power_of_divertor_due_to_recombination)\
    \ and volumetric radiation absorb an increasing fraction of the exhaust power\
    \ before it reaches the targets.\n\nThis quantity is assessed from integrated\
    \ power balance accounting or from multi-fluid SOL transport modeling. Typical\
    \ values range from 1\u201310 MW in medium-power present-day devices to tens of\
    \ MW in high-performance reactor-relevant operations."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_convection
  - name:plasma_power_of_divertor_due_to_recombination
  sources:
  - id: dd:divertors/divertor/power_conducted
    dd_path: divertors/divertor/power_conducted
    status: composed
