- name: toroidal_ion_state_velocity_due_to_e_cross_b_drift
  kind: scalar
  status: draft
  description: "Toroidal component of the E\xD7B drift velocity for an ion charge\
    \ state, arising from the cross-product of the local electric and magnetic fields\
    \ perpendicular to both."
  documentation: "The E\xD7B drift is a charge-independent bulk plasma drift that\
    \ transports all species at the same velocity perpendicular to both the electric\
    \ field $\\mathbf{E}$ and magnetic field $\\mathbf{B}$. The full drift velocity\
    \ is given by\n\n$$\n\\mathbf{v}_{E\\times B} = \\frac{\\mathbf{E} \\times \\\
    mathbf{B}}{B^2}\n$$\n\nwhere $\\mathbf{E}$ is the local electric field and $B\
    \ = |\\mathbf{B}|$ is the magnetic field magnitude. The toroidal component reported\
    \ here is the projection of $\\mathbf{v}_{E\\times B}$ onto the $\\hat{\\phi}$\
    \ direction in the right-handed cylindrical $(R, \\phi, Z)$ frame. In the edge\
    \ and scrape-off layer regions of tokamaks, radial electric fields of order 1\u2013\
    100 kV/m combined with poloidal magnetic fields of 0.1\u20131 T yield toroidal\
    \ E\xD7B velocities of order $10^3$\u2013$10^5$ m/s. This quantity is relevant\
    \ to particle and momentum transport modeling, where toroidal E\xD7B flow contributes\
    \ to the total toroidal rotation of a given ion charge state alongside diamagnetic\
    \ and neoclassical drifts. The complementary spatial projections [radial_ion_state_velocity_due_to_e_cross_b_drift](name:radial_ion_state_velocity_due_to_e_cross_b_drift)\
    \ and [poloidal_ion_state_velocity_due_to_e_cross_b_drift](name:poloidal_ion_state_velocity_due_to_e_cross_b_drift)\
    \ complete the vector decomposition, while [toroidal_neutral_state_velocity_due_to_e_cross_b_drift](name:toroidal_neutral_state_velocity_due_to_e_cross_b_drift)\
    \ provides the analogous quantity for neutral charge states.\n\nSign convention:\
    \ Positive when the toroidal E\xD7B drift velocity component points in the direction\
    \ of increasing toroidal angle $\\phi$."
