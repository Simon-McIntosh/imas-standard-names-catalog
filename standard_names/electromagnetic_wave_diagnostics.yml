- name: spectral_calibration_factor_at_line_of_sight
  kind: scalar
  status: active
  description: Wavelength-specific interferometric conversion coefficient that converts
    a signed phase change along a line of sight into electron column density.
  documentation: 'The spectral calibration factor is the wavelength-specific proportionality
    that maps an interferometric phase change along one line of sight to the electron
    column density on that optical path.


    The conversion is defined by


    $$

    N_{e,\mathrm{line}} = K_{\mathrm{spec}}\,\Delta\varphi

    $$


    where $N_{e,\mathrm{line}}$ is the [line-integrated electron number density](name:line_integrated_electron_number_density),
    $K_{\mathrm{spec}}$ is this spectral calibration factor, and $\Delta\varphi$ is
    the signed interferometric phase change.


    The factor applies to the complete electron-density integral along the associated
    line of sight and to its corresponding probing wavelength. It represents the electron
    contribution only and is not a local density, a line-averaged density, or an optical
    phase itself.


    Applying this factor produces the line-integrated electron number density; dividing
    that result by the optical chord length gives [line-averaged electron density](name:line_averaged_electron_density).
    The associated wavelength is the spectral parameter of the probing electromagnetic
    wave, related to [wavelength of wave beam](name:wavelength_of_wave_beam).'
  unit: m^-2.rad^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_integrated_electron_number_density
  - name:line_averaged_electron_density
  - name:wavelength_of_wave_beam
  sources:
  - dd_path: interferometer/channel/wavelength/phase_to_n_e_line
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-wavelength-phase_to_n_e_line
    dd_documentation:
