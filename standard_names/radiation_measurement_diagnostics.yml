- name: vertical_curvature_of_bragg_crystal
  kind: scalar
  status: active
  description: Radius of curvature of the diffracting surface of a Bragg crystal along
    its local vertical (X2) direction, defining one axis of its focusing geometry.
  documentation: 'The quantity is the local radius of curvature of the Bragg crystal''s
    diffracting surface along its local vertical, or X2, tangent direction. It characterizes
    the crystal bending used for Bragg-diffraction focusing in a doubly curved geometry.


    $$

    R_v = \frac{1}{|\kappa_v|}

    $$


    where $R_v$ is the radius of curvature in m and $\kappa_v$ is the signed normal
    curvature in m$^{-1}$ along the local vertical tangent direction. A planar surface
    corresponds to zero curvature and an unbounded radius.


    This quantity describes the diffracting surface, not the geometric aperture radius
    given by [radius of Bragg crystal](name:radius_of_bragg_crystal). Together with
    the [toroidal curvature of the Bragg crystal](name:toroidal_curvature_of_bragg_crystal),
    it specifies the directional curvature scales of a doubly curved crystal.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radius_of_bragg_crystal
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/x2_curvature
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-x2_curvature
    dd_documentation:
      leaf: Radius of curvature in the X2 direction, to be filled only for curvature_type/index
        = 3 or 5
      parent_path: spectrometer_x_ray_crystal/channel/crystal
      parent: Characteristics of the crystal used
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Radius of curvature of the diffracting crystal surface in the X2
        direction for an X-ray crystal spectrometer, applicable for doubly-curved
        crystal geometries. Defines the crystal focusing geometry for Bragg diffraction.
      kind: llm
- name: vertical_front_surface_curvature_of_optical_element
  kind: scalar
  status: active
  description: Vertical front surface curvature of an optical element is the signed
    principal radius of curvature of the front, beam-entry surface along X2, the second
    local tangential aperture direction in the right-handed local aperture frame (X1,
    X2, z).
  documentation: 'Vertical front surface curvature of an optical element is the signed
    principal radius of curvature of the element''s front, beam-entry surface along
    the second local tangential aperture direction. The direction is $X_2$ in the
    right-handed local aperture frame $(X_1, X_2, z)$, where $X_1$ and $X_2$ are local
    tangential aperture coordinates at the surface vertex and $z$ is the local sag
    coordinate along the chosen surface-normal or optical-axis direction.


    For a differentiable front-surface sag function $z_s(X_1,X_2)$ expressed in that
    frame, the radius $R_{2,\mathrm{front}}$ is defined by the second derivative at
    the vertex:


    $$

    \left.\frac{\partial^2 z_s}{\partial X_2^2}\right|_{X_1=0,\,X_2=0} = \frac{1}{R_{2,\mathrm{front}}}

    $$


    where $z_s$ is the displacement of the front surface along $z$, $X_1=X_2=0$ is
    the surface vertex, and $R_{2,\mathrm{front}}$ is this quantity. The reciprocal
    local curvature is $\kappa_{2,\mathrm{front}}=1/R_{2,\mathrm{front}}$.


    The quantity is the signed-radius form of the second-direction front-surface curvature,
    not the reciprocal curvature magnitude. It uses the same local-frame convention
    as [vertical front surface radius](name:vertical_front_surface_radius_of_optical_element);
    [vertical back surface curvature](name:vertical_back_surface_curvature_of_optical_element)
    is the corresponding quantity for the back surface. The word vertical denotes
    the aperture $X_2$ direction in the local aperture frame $(X_1, X_2, z)$ and not
    the $Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the center of curvature of the front-surface normal
    section in the second local tangential aperture direction lies on the $+z$ side
    of the surface vertex in the local aperture frame $(X_1, X_2, z)$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:curvature_of_optical_element
  sources:
  - dd_path: camera_visible/channel/optical_element/front_surface/x2_curvature
