- name: lower_photon_energy
  kind: scalar
  status: active
  description: Minimum photon energy at the lower edge of a defined photon-energy
    acceptance interval; photons below this boundary lie outside the interval.
  documentation: 'The lower photon-energy boundary specifies the smallest photon energy
    included in a defined acceptance interval. It applies to an energy-selective response
    or emission band and does not represent the energy of an individual detected photon.


    The boundary is defined by


    $$

    E_{\min} = \inf\{E_\gamma \mid E_\gamma \text{ belongs to the accepted photon-energy
    interval}\}

    $$


    where $E_\gamma$ is photon energy and $E_{\min}$ is the lower interval boundary.
    The corresponding upper boundary is represented separately by the [upper photon
    energy bound](name:upper_photon_energy). Photons below $E_{\min}$ are excluded
    from the specified interval, regardless of whether they are physically present.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
