- name: plasma_current_density
  kind: vector
  status: draft
  description: Net electric current density vector of the plasma, equal to the sum
    of charge-weighted mean particle flows over all charged plasma species (electrons
    and ions) at each point.
  documentation: "The plasma current density $\\mathbf{j}$ is the vector field representing\
    \ the net conventional electric charge flux per unit area at each spatial point\
    \ in the plasma, contributed by all charged species collectively. It is the plasma-only\
    \ component of the broader [current_density](name:current_density) field, entering\
    \ both Amp\xE8re's law and the MHD pressure balance.\n\nThe defining relation\
    \ is:\n\n$$\n\\mathbf{j} = \\sum_s n_s q_s \\mathbf{v}_s\n$$\n\nwhere $n_s$ is\
    \ the number density, $q_s$ is the charge, and $\\mathbf{v}_s$ is the mean fluid\
    \ velocity for species $s$. This vector field appears in Amp\xE8re's law $\\nabla\
    \ \\times \\mathbf{B} = \\mu_0 \\mathbf{j}$ and determines the Lorentz force density\
    \ $\\mathbf{j} \\times \\mathbf{B}$ that, in MHD equilibrium, balances the pressure\
    \ gradient $\\nabla p$.\n\nThe current density profile is inferred from motional\
    \ Stark effect polarimetry combined with magnetics-based equilibrium reconstruction;\
    \ on-axis values in H-mode tokamaks range from approximately 1 to 10 MA m$^{-2}$.\
    \ Component-resolved contributions from specific mechanisms\u2014such as friction-driven\
    \ currents\u2014are captured in related names including [poloidal_current_density_due_to_ion_neutral_friction](name:poloidal_current_density_due_to_ion_neutral_friction)\
    \ and [parallel_current_density_due_to_ion_neutral_friction](name:parallel_current_density_due_to_ion_neutral_friction).\n\
    \nSign convention: Positive when the current vector points in the direction of\
    \ conventional current flow, with the toroidal projection positive when the plasma\
    \ bulk current flows in the direction of increasing toroidal angle $\\phi$ in\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame where $\\hat{R} \\times \\\
    hat{\\phi} = \\hat{Z}$."
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:poloidal_current_density_due_to_ion_neutral_friction
  - name:parallel_current_density_due_to_ion_neutral_friction
- name: plasma_resistance
  kind: scalar
  status: draft
  description: Effective non-negative electrical resistance of the plasma column,
    defined as the volume-integrated ohmic dissipation power divided by the square
    of the total plasma current. It represents the resistive part of the plasma circuit
    response, distinct from inductive voltage associated with changing current or
    magnetic stored energy.
  documentation: 'Plasma resistance is the effective scalar resistance associated
    with collisional ohmic dissipation in the conducting plasma column. It is a non-negative
    quantity for positive ohmic dissipation and characterizes how strongly the plasma
    converts current-driven electrical work into heat, separately from inductive effects
    described by total_plasma_inductance.


    The effective resistance is defined from the ohmic power dissipated in the plasma:


    $$

    R_\mathrm{plasma} = \frac{\int_{V_p} \mathbf{E}\cdot\mathbf{J}\,dV}{I_p^2} = \frac{P_\Omega}{I_p^2}

    $$


    where $R_\mathrm{plasma}$ is in ohm, $V_p$ is the plasma volume, $\mathbf{E}$
    is the electric field in V m$^{-1}$, $\mathbf{J}$ is the current density in A
    m$^{-2}$, $dV$ is a volume element in m$^3$, $P_\Omega$ is the volume-integrated
    ohmic heating power in W, and $I_p$ is the total plasma current in A. When a circuit
    representation is used, this corresponds to the resistive voltage component divided
    by $I_p$ for nonzero current; it should not be identified with the total loop
    voltage unless inductive and other non-resistive voltage contributions have been
    removed.


    In equilibrium and transport analysis, plasma resistance is computed from reconstructed
    current density together with an electrical resistivity or parallel conductivity
    model, or inferred from the resistive component of the plasma voltage balance.
    Its time integral is related to resistive magnetic-flux consumption, represented
    by [poloidal_accumulated_resistive_magnetic_flux](name:poloidal_accumulated_resistive_magnetic_flux),
    while the inductive part of the voltage balance is associated with changes in
    current and magnetic energy through total_plasma_inductance.


    Typical values in tokamak plasmas are about 0.01-10 microohm, decreasing strongly
    as electron temperature rises and increasing with effective ion charge and collisionality.
    Cold startup, ramp-down, or low-temperature edge-dominated conditions can have
    substantially larger effective resistance than hot flattop conditions.'
  unit: ohm
  physics_domain: equilibrium
  links:
  - name:poloidal_accumulated_resistive_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/plasma_resistance
    dd_path: equilibrium/time_slice/global_quantities/plasma_resistance
    status: composed
  - id: dd:summary/global_quantities/resistance/value
    dd_path: summary/global_quantities/resistance/value
    status: attached
- name: polarization_angle_at_constraint_position
  kind: scalar
  status: draft
  description: Motional Stark effect polarization angle evaluated at a discrete spatial
    location designated as a measurement constraint in tokamak equilibrium reconstruction.
  documentation: 'The polarization angle at a constraint position is the angle of
    linear polarization of Stark-split Balmer-alpha emission from fast neutral beam
    ions traversing the plasma, evaluated at a discrete spatial site where this measurement
    serves as an input constraint in equilibrium reconstruction. The motional Stark
    effect (MSE) diagnostic exploits the Lorentz electric field experienced by injected
    beam neutrals to align the polarization plane of the emitted light in a direction
    encoding the local magnetic-field pitch angle.


    The MSE polarization angle $\gamma$ is related to the local magnetic field components
    by:


    $$

    \tan(\gamma) = \frac{B_Z}{A_1 B_R + A_2 B_\phi}

    $$


    where $B_Z$ is the vertical field component, $B_R$ is the radial field component,
    $B_\phi$ is the toroidal field component, and $A_1$, $A_2$ are dimensionless geometric
    weighting factors determined by the beam trajectory and sightline orientation.


    During equilibrium reconstruction, the measured value at each constraint position
    is compared against the corresponding reconstructed [polarization_angle](name:polarization_angle_at_constraint_position)
    to form residuals that enter the least-squares cost functional. The [motional_stark_radiance](name:motional_stark_radiance)
    provides complementary spectral intensity data from the same beam-emission event.
    MSE polarization angles in conventional-aspect-ratio tokamak configurations span
    a few degrees to roughly 20 degrees, varying with local field pitch, beam geometry,
    and viewing-sightline angle.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:motional_stark_radiance
  sources:
  - id: dd:equilibrium/time_slice/constraints/faraday_angle/measured
    dd_path: equilibrium/time_slice/constraints/faraday_angle/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/mse_polarisation_angle/measured
    dd_path: equilibrium/time_slice/constraints/mse_polarisation_angle/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/mse_polarisation_angle/reconstructed
