- name: parallel_energy_diffusivity
  kind: scalar
  status: active
  description: Fickian diffusivity for neutral thermal-energy transport along magnetic
    field lines, relating the parallel diffusive energy flux to the parallel gradient
    of neutral thermal-energy density.
  documentation: 'Parallel neutral energy diffusivity is the effective scalar transport
    coefficient for local diffusive smoothing of neutral thermal-energy density along
    magnetic field lines. It represents the Fickian part of neutral energy transport,
    distinct from particle diffusion, bulk-flow convection, and explicitly nonlocal
    kinetic transport.


    The defining closure for the parallel diffusive energy flux is:


    $$

    \mathbf{q}_{E,\parallel} = -\chi_{E,\parallel}\,\hat{\mathbf{b}}\left(\hat{\mathbf{b}}\cdot\nabla
    w_n\right)

    $$


    where $\mathbf{q}_{E,\parallel}$ is the parallel diffusive thermal-energy flux,
    $\chi_{E,\parallel}$ is the parallel neutral energy diffusivity, $\hat{\mathbf{b}}$
    is the unit vector tangent to magnetic field lines, and $w_n$ is neutral thermal-energy
    density. The negative sign specifies down-gradient transport. This coefficient
    acts on energy density rather than the particle density governed by [neutral_diffusivity](name:neutral_diffusivity);
    when neutral internal states are resolved, it is distinct from [parallel_neutral_internal_state_energy_diffusivity](name:parallel_neutral_internal_state_energy_diffusivity)
    and is a directional component of [energy_diffusivity](name:energy_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_diffusivity
  - name:parallel_neutral_internal_state_energy_diffusivity
  - name:energy_diffusivity
  arguments:
