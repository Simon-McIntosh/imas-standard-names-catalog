- name: ratio_of_volume_averaged_oxygen_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Volume-averaged oxygen ion density relative to volume-averaged electron
    density for the plasma, with oxygen summed over ionized charge states and neutral
    oxygen excluded.
  documentation: 'Volume-averaged oxygen ion density relative to volume-averaged electron
    density is a scalar oxygen impurity fraction for the plasma. It compares the charge-state-summed
    volume average of ionized oxygen number density with the corresponding volume
    average of electron number density over the same averaging volume.


    The ratio is defined by


    $$

    f_O = \frac{\left\langle \sum_{q=1}^{8} n_{O^{q+}} \right\rangle_V}{\langle n_e
    \rangle_V}

    $$


    where $f_O$ is this oxygen-to-electron density ratio, $\langle\cdot\rangle_V$
    denotes a volume average over the averaging volume $V$, $q$ is the oxygen charge-state
    index, $n_{O^{q+}}$ is the local number density of oxygen ions in charge state
    $q+$, and $n_e$ is the local electron number density. The denominator $\langle
    n_e\rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density).


    The numerator is summed over ionized oxygen charge states $O^{1+}$ through $O^{8+}$
    and excludes neutral oxygen. This quantity is a single scalar composition fraction
    formed from volume-averaged populations; it is distinct from a local [oxygen density](name:oxygen_density),
    from a [line-averaged oxygen density](name:line_averaged_oxygen_density), and
    from a neutral-inclusive [volume-averaged oxygen density](name:volume_averaged_oxygen_density)
    when that quantity includes neutral oxygen.


    The essential relationship is normalization: the charge-state-summed volume-averaged
    oxygen ion density is divided by the [volume-averaged electron density](name:volume_averaged_electron_density),
    so the result represents oxygen ion abundance relative to the electron population
    rather than an absolute density.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links: []
  sources:
  - dd_path: summary/composition/oxygen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-composition-oxygen-value
    dd_documentation:
