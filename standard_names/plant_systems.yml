- name: accumulated_ammonia_count
  kind: scalar
  status: draft
  description: Accumulated ammonia count is the total NH3 injected into the plasma
    vessel since plasma breakdown, expressed as an equivalent-electron count. Each
    ammonia molecule contributes 10 equivalent electrons, equal to the total number
    of electrons in neutral NH3.
  documentation: 'Accumulated ammonia count is the time-integrated amount of ammonia
    gas injected into the plasma vessel after plasma breakdown, represented as an
    equivalent-electron count rather than as a molecule count or particle inventory.
    For neutral ammonia, each $\mathrm{NH_3}$ molecule contains 10 electrons: 7 from
    nitrogen and 1 from each of the 3 hydrogen atoms.


    The equivalent-electron count is related to the injected molecular amount by:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{NH_3}}(t) = 10 \int_{t_\mathrm{bd}}^{t} \dot{N}_{\mathrm{NH_3}}(t'')\,dt''

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{NH_3}}$ is the accumulated equivalent-electron
    count, $\dot{N}_{\mathrm{NH_3}}$ is the ammonia molecular injection rate, and
    $t_\mathrm{bd}$ is the plasma breakdown time. The factor 10 is stoichiometric
    and does not imply that the molecule is fully ionized at the point of injection.


    In practice, this quantity is computed from calibrated gas-injection valve commands,
    flow-meter signals, reservoir pressure drops, or gas-box models, with corrections
    for line conductance, temperature, and valve response where available. It is an
    injected-source measure and may differ from the number of ammonia-derived particles
    that enter the confined plasma because of wall retention, dissociation, pumping,
    and edge neutral transport.


    Typical values depend strongly on device size and gas-injection purpose. Small
    diagnostic or impurity-seeding puffs may correspond to about $10^{18}$-$10^{20}$
    equivalent electrons, while larger fueling or disruption-mitigation injections
    can reach $10^{21}$-$10^{23}$ equivalent electrons.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_nitrogen_count
  - name:ammonia_prefill_count
  - name:accumulated_ammonia_deuterated_count
  - name:ammonia_source_rate
  sources:
  - id: dd:summary/gas_injection_accumulated/ammonia/value
    dd_path: summary/gas_injection_accumulated/ammonia/value
    status: composed
- name: accumulated_ammonia_deuterated_count
  kind: scalar
  status: draft
  description: 'Accumulated deuterated ammonia (ND3) introduced after plasma breakdown,
    expressed as an equivalent-electron count. Each neutral ND3 molecule contributes
    10 equivalent electrons: 7 from nitrogen and 1 from each of the three deuterium
    atoms.'
  documentation: 'Accumulated deuterated ammonia count is the cumulative amount of
    neutral ND3 gas injected after plasma breakdown, expressed as the number of electrons
    associated with those neutral molecules in complete ionization accounting. It
    tracks delivered deuterated-ammonia inventory, not net plasma electron density
    or electric charge, and is the deuterated-isotopologue counterpart of [accumulated_ammonia_count](name:accumulated_ammonia_count).


    The conversion from molecular injection to equivalent-electron count is


    $$

    N_\mathrm{eq}(t) = 10 \int_{t_\mathrm{bd}}^{t} \Gamma_{\mathrm{ND}_3}(t'')\, dt''

    $$


    where $N_\mathrm{eq}$ is a dimensionless equivalent-electron count, $t_\mathrm{bd}$
    is the plasma-breakdown time, and $\Gamma_{\mathrm{ND}_3}$ is the neutral ND3
    molecular injection rate in molecules per second. The factor 10 is the neutral-molecule
    electron inventory, $7+1+1+1$, from nitrogen plus three deuterium atoms.


    In practice this quantity is computed by integrating a calibrated ND3 molecular
    flow rate, commonly inferred from gas-injection hardware such as mass-flow controllers,
    pulsed valves, plenum pressure and temperature evolution, and calibrated line
    conductance. The accumulation starts at breakdown, increases during ND3 delivery,
    and remains unchanged when no deuterated ammonia is injected.


    Typical values are strongly device- and scenario-dependent. Small calibrated impurity
    puffs may correspond to $10^{18}-10^{21}$ equivalent electrons, routine radiative-seeding
    injections to $10^{21}-10^{23}$ equivalent electrons, and large cooling or mitigation
    injections to $10^{23}-10^{25}$ equivalent electrons or higher.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_count
  - name:ammonia_prefill_count
  - name:ammonia_source_rate
  sources:
  - id: dd:summary/gas_injection_accumulated/ammonia_deuterated/value
    dd_path: summary/gas_injection_accumulated/ammonia_deuterated/value
    status: composed
- name: accumulated_argon_count
  kind: scalar
  status: draft
  description: Cumulative count of argon delivered by gas injection since plasma breakdown,
    expressed as an equivalent-electron inventory. The count increases by 18 for each
    argon atom, using the atomic number of argon.
  documentation: 'The accumulated argon count is the time-integrated amount of argon
    delivered by gas injection after plasma breakdown, represented as a dimensionless
    equivalent-electron inventory. It counts injected argon atoms with a weighting
    equal to the argon atomic number, so one argon atom contributes 18 count units.
    This is an injected inventory measure, not a measure of free electrons, plasma
    content, retained argon, or ionization state.


    The accumulated count is defined by integrating the argon atom injection rate
    from breakdown time:


    $$

    N_{\mathrm{Ar,eq}}(t) = 18 \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Ar}}(t'')\,dt''

    $$


    where $N_{\mathrm{Ar,eq}}$ is the dimensionless equivalent-electron argon count,
    $\dot{N}_{\mathrm{Ar}}$ is the argon atom injection rate in atoms per second,
    $t$ is time in seconds, and $t_{\mathrm{bd}}$ is the plasma-breakdown time in
    seconds. Argon introduced before breakdown belongs to the prefill contribution
    represented by [argon_count](name:argon_count), not to this accumulated post-breakdown
    quantity.


    In practice, the injection rate is obtained from calibrated gas-valve systems,
    reservoir pressure drops, conductance models, or mass-flow measurements, and then
    integrated from the breakdown reference time. Because this quantity represents
    delivered gas, it is not decremented by subsequent ionization, radiation, pumping,
    exhaust, wall retention, or redistribution within the vessel. It is analogous
    to [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_xenon_count](name:accumulated_xenon_count),
    with the numerical weighting set by the atomic number of each species, and can
    contribute to a total injected-particle inventory such as [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).


    Typical values are about $10^{19}$-$10^{22}$ count units for routine argon puffs
    or impurity seeding, corresponding to roughly $6 \times 10^{17}$-$6 \times 10^{20}$
    argon atoms. Larger disruption-mitigation injections can reach about $10^{22}$-$10^{24}$
    count units, depending on the valve system, reservoir pressure, and mitigation
    strategy.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_count
  - name:accumulated_xenon_count
  - name:accumulated_neon_count
  sources:
  - id: dd:summary/gas_injection_accumulated/argon/value
    dd_path: summary/gas_injection_accumulated/argon/value
    status: composed
- name: accumulated_carbon_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative carbon injected by gas injection after plasma breakdown,
    expressed as an equivalent-electron count with six counts per carbon atom.
  documentation: 'The accumulated carbon count due to gas injection is the running
    total of carbon introduced after plasma breakdown by gas injection, expressed
    as an equivalent-electron count. Each injected carbon atom contributes 6 to the
    dimensionless count, corresponding to the atomic number of carbon, so the value
    is non-negative and increases only when carbon-bearing gas is injected.


    The accumulated equivalent-electron count is related to the carbon atom source
    rate by


    $$

    N_{C,\mathrm{acc}}(t) = 6 \int_{t_\mathrm{bd}}^{t} \Gamma_{C,\mathrm{gas}}(t'')\,dt''

    $$


    where $N_{C,\mathrm{acc}}$ is the accumulated dimensionless equivalent-electron
    count, $t_\mathrm{bd}$ is the plasma-breakdown time, $t$ and $t''$ are times in
    seconds, and $\Gamma_{C,\mathrm{gas}}$ is the injected carbon atom rate in atoms
    per second. The corresponding physical number of injected carbon atoms is $N_{C,\mathrm{acc}}/6$.


    In practice this quantity is computed by integrating calibrated gas-injection
    flow rates from breakdown onward, converting molecular flow to carbon atom flow
    using the gas stoichiometry, and applying the factor of 6. It is the time integral
    of [carbon_rate_due_to_gas_injection](name:carbon_rate_due_to_gas_injection) and
    excludes the pre-breakdown inventory represented by [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection).


    Typical values are 0 for pulses without deliberate carbon-bearing gas injection
    and about $10^{18}$-$10^{22}$ for trace or impurity-gas injection cases, depending
    on injected gas species, calibrated valve throughput, and injection duration.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:carbon_rate_due_to_gas_injection
  - name:carbon_prefill_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/carbon/value
    dd_path: summary/gas_injection_accumulated/carbon/value
    status: composed
- name: accumulated_ethane_count
  kind: scalar
  status: draft
  description: Cumulative ethane (C2H6) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethane molecule contributes 18 equivalent
    electrons.
  documentation: 'The accumulated ethane count tracks the time-integrated amount of
    ethane (C2H6) gas injected into the plasma vessel since plasma breakdown, expressed
    as a dimensionless equivalent-electron count. Each ethane molecule consists of
    two carbon atoms (atomic number $Z_C = 6$) and six hydrogen atoms (atomic number
    $Z_H = 1$), contributing $2 \times 6 + 6 \times 1 = 18$ equivalent electrons per
    molecule, so the accumulated count $N_{\rm acc}$ and the total number of injected
    molecules $N_{\rm mol}$ are related by:


    $$

    N_{\rm acc} = 18 \, N_{\rm mol}

    $$


    where $N_{\rm mol}$ is the number of ethane molecules delivered since plasma breakdown.


    The accumulated count is obtained by integrating the instantaneous ethane injection
    rate from the moment of plasma breakdown. It provides a direct measure of the
    combined carbon and hydrogen impurity load introduced via ethane injection over
    the discharge. This quantity complements [ethane_prefill_count](name:ethane_prefill_count),
    which covers only the prefill phase preceding breakdown. Related hydrocarbon injection
    counts include [accumulated_propane_count](name:accumulated_propane_count) (C3H8,
    26 electrons per molecule) and [ethylene_count](name:accumulated_ethylene_count)
    (C2H4, 16 electrons per molecule).


    Sign convention: Positive when ethane gas is injected into the plasma vessel.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ethane_prefill_count
  - name:accumulated_propane_count
  - name:accumulated_ethylene_count
  sources:
  - id: dd:summary/gas_injection_accumulated/ethane/value
    dd_path: summary/gas_injection_accumulated/ethane/value
    status: composed
- name: accumulated_ethylene_count
  kind: scalar
  status: draft
  description: Cumulative ethylene (C2H4) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethylene molecule contributes 16 equivalent
    electrons (2 carbon atoms at Z = 6 each, 4 hydrogen atoms at Z = 1 each).
  documentation: 'Ethylene (C2H4) is a two-carbon hydrocarbon molecule in which each
    molecule contributes 2 carbon atoms (atomic number $Z_C = 6$) and 4 hydrogen atoms
    ($Z_H = 1$), yielding 16 equivalent electrons per molecule.


    The accumulated equivalent-electron count is defined by:


    $$

    N_{\mathrm{eq}}(t) = 16 \int_{t_{\mathrm{bd}}}^{t} \frac{dN_{\mathrm{C_2H_4}}}{dt''}
    \, dt''

    $$


    where $t_{\mathrm{bd}}$ is the time of plasma breakdown and $dN_{\mathrm{C_2H_4}}/dt$
    is the instantaneous ethylene injection rate in molecules per second.


    The integral runs from plasma breakdown onward, excluding any prefill contribution.
    The quantity is inferred from calibrated gas-valve flow measurements and tracks
    the hydrocarbon-based electron inventory added to the plasma, relevant to impurity
    seeding and disruption mitigation experiments. Closely related hydrocarbon counts
    include [accumulated_ethane_count](name:accumulated_ethane_count) (C2H6, 18 equivalent
    electrons per molecule) and [accumulated_propane_count](name:accumulated_propane_count)
    (C3H8, 26 equivalent electrons per molecule). For the species-summed inventory
    across all injected gasses, see [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:accumulated_propane_count
  - name:accumulated_total_particle_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/ethylene/value
    dd_path: summary/gas_injection_accumulated/ethylene/value
    status: composed
- name: accumulated_helium_3_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Time-integrated helium-3 inventory added by gas injection since plasma
    breakdown, represented as an equivalent-electron count. Each helium-3 atom contributes
    2 equivalent electrons because its atomic number is Z = 2.
  documentation: 'Accumulated helium-3 count due to gas injection is the total amount
    of helium-3 introduced after plasma breakdown by gas injection, expressed as a
    dimensionless equivalent-electron count. The equivalent-electron convention weights
    each neutral helium-3 atom by its atomic number, so one injected helium-3 atom
    contributes two counts.


    The accumulated equivalent-electron count is defined from the injected helium-3
    atomic source rate:


    $$

    N_{e,\mathrm{eq}}^{^{3}\mathrm{He}}(t) = 2 \int_{t_\mathrm{bd}}^{t} \Gamma_{^{3}\mathrm{He}}(t'')
    \, dt''

    $$


    where $N_{e,\mathrm{eq}}^{^{3}\mathrm{He}}$ is the accumulated equivalent-electron
    count, $t_\mathrm{bd}$ is the plasma-breakdown time, and $\Gamma_{^{3}\mathrm{He}}$
    is the helium-3 atom injection rate in atoms/s. The factor 2 is the helium atomic
    number and converts atoms to equivalent electrons.


    In practice this quantity is computed from calibrated gas-injection measurements
    such as valve flow calibrations, pressure-volume-temperature accounting, or mass-flow
    controller signals, with isotope-specific calibration for helium-3 when available.
    It represents gas injected after breakdown and is distinct from any prefill inventory
    present before the plasma is formed.


    Typical accumulated values are about $10^{18}-10^{21}$ equivalent electrons for
    trace or minority helium-3 puffs, and can reach $10^{22}-10^{23}$ equivalent electrons
    in large devices or long pulses with deliberate helium-3 fueling.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:helium_3_source_rate_due_to_gas_injection
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/helium_3/value
    dd_path: summary/gas_injection_accumulated/helium_3/value
    status: composed
- name: accumulated_helium_3_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of helium-3 atoms introduced by gas injection during
    the prefill phase, reported as an equivalent electron count. Each helium-3 atom
    contributes two equivalent electrons because its atomic number is 2.
  documentation: 'The accumulated helium-3 prefill count due to gas injection is the
    total amount of helium-3 admitted by gas valves before plasma breakdown, reported
    as an electron-equivalent particle count. It is an accounting convention for particle
    inventory: each neutral helium-3 atom contributes two equivalent electrons, but
    the gas need not be ionized during the prefill phase.


    The electron-equivalent prefill count is obtained by integrating the helium-3
    atomic injection rate over the prefill interval:


    $$

    N_{\mathrm{eq,prefill}}(^{3}\mathrm{He}) = 2 \int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}}
    \dot{N}_{^{3}\mathrm{He}}(t)\,dt

    $$


    where $\dot{N}_{^{3}\mathrm{He}}(t)$ is the helium-3 atomic injection rate in
    atoms s$^{-1}$, $t_{\mathrm{start}}$ is the start time of helium-3 prefill, $t_{\mathrm{bd}}$
    is the breakdown time or end of the prefill phase in seconds, and the factor 2
    converts atoms to equivalent electrons. The resulting count is dimensionless.


    In practice this quantity is inferred from calibrated gas-valve flow, reservoir
    depletion, pressure-rise measurements, or gas-balance analysis integrated over
    the prefill interval. It counts the amount introduced by injection, not the amount
    retained in the vessel after pumping, wall adsorption, or ionization. It is closely
    related to [helium_3_initial_count](name:accumulated_helium_3_prefill_count_due_to_gas_injection),
    is the prefill contribution to [accumulated_helium_3_count](name:accumulated_helium_3_count_due_to_gas_injection),
    and is the helium-3 counterpart of [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Typical values are $10^{19}$-$10^{22}$ equivalent electrons for small to medium
    devices and can approach $10^{23}$ equivalent electrons in large-volume machines
    or high-minority-fraction helium-3 prefills. These counts correspond to half as
    many injected helium-3 atoms and are often chosen to set the initial minority
    concentration for ion-cyclotron-resonance-heating scenarios.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_count_due_to_gas_injection
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/helium_3/value
    dd_path: summary/gas_injection_prefill/helium_3/value
    status: composed
- name: accumulated_helium_4_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Time-integrated count of helium-4 atoms from gas injection accumulated
    since plasma breakdown, expressed in equivalent electrons, where each helium-4
    atom contributes 2 equivalent electrons.
  documentation: "The accumulated helium-4 gas injection count is the time-integrated\
    \ total of helium-4 delivered via gas injection over the full discharge, expressed\
    \ as an equivalent-electron count. Unlike the phase-restricted quantity [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),\
    \ this quantity accumulates contributions from all injection phases \u2014 prefill,\
    \ flat-top fueling, and ramp-down \u2014 and represents the total helium-4 gas\
    \ throughput for the entire pulse, making it the discharge-level integral of [helium_4_count_due_to_gas_injection](name:helium_4_count_due_to_gas_injection).\n\
    \nThe cumulative count is defined as:\n\n$$\nN_\\text{acc}(t) = \\int_{t_0}^{t}\
    \ \\dot{N}_{\\mathrm{He}_4}(t') \\, dt'\n$$\n\nwhere $\\dot{N}_{\\mathrm{He}_4}$\
    \ is the instantaneous equivalent-electron injection rate and $t_0$ marks plasma\
    \ breakdown. Since helium-4 has atomic number $Z = 2$, each atom contributes 2\
    \ equivalent electrons; the atomic particle count is therefore this value divided\
    \ by 2. This equivalent-electron convention is shared across the gas-injection\
    \ count family, including [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection)\
    \ and [accumulated_argon_count](name:accumulated_argon_count), enabling uniform\
    \ cross-species fueling accounting.\n\nThe accumulated count is obtained by integrating\
    \ calibrated gas-valve flow signals over time and is used for helium inventory\
    \ management, fueling budget analysis, and helium-ash simulation studies.\n\n\
    Sign convention: Positive when helium-4 is injected into the plasma vessel, increasing\
    \ the accumulated equivalent-electron count."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:helium_4_count_due_to_gas_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:accumulated_argon_count
  sources:
