name: electron_density_pedestal_width
status: draft
cocos_transformation_type: one_like
description: Width of the electron density pedestal in normalized poloidal flux, characterizing
  the radial extent of the H-mode transport barrier.
documentation: "The electron density pedestal width $\\Delta\\psi_{N,n_e}$ is extracted\
  \ from a modified hyperbolic tangent (mtanh) fit to the $n_e(\\psi_N)$ profile and\
  \ represents the full radial span (in normalized poloidal flux) over which the electron\
  \ density drops from its pedestal-top value to the scrape-off-layer level. Typical\
  \ widths are $\\Delta\\psi_N \\approx 0.02$\u2013$0.08$ in conventional H-mode tokamak\
  \ plasmas, with narrower pedestals observed at higher field and lower collisionality.\
  \ The pedestal width is a critical parameter in the EPED model and related peeling-ballooning\
  \ plus kinetic-ballooning-mode frameworks, where it constrains the predicted pedestal\
  \ height and therefore the overall confinement. It is typically derived from Thomson\
  \ scattering or reflectometry profile fits. See also `electron_density_pedestal_position`\
  \ and `electron_density_pedestal_maximum_gradient_position`."
