- name: power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Generic RF power at a single lower-hybrid antenna, encompassing the
    forward, reflected, and launched power components that collectively characterize
    the wave-power budget at the antenna interface.
  documentation: "RF power at a lower hybrid antenna encompasses the distinct power\
    \ quantities that characterize the wave-power budget at the antenna interface,\
    \ where RF energy carried by a transmission line is coupled into a phased waveguide\
    \ array facing the plasma.\n\nThe three principal per-antenna power quantities\
    \ are related by:\n\n$$\nP_\\mathrm{launched} = P_\\mathrm{forward} - P_\\mathrm{reflected}\n\
    $$\n\nwhere $P_\\mathrm{forward}$ is the [forward power](name:forward_power_of_lower_hybrid_antenna)\
    \ (incident RF power arriving at the antenna input reference plane), $P_\\mathrm{reflected}$\
    \ is the [reflected power](name:reflected_power_of_lower_hybrid_antenna) (the\
    \ fraction returning toward the transmission line due to impedance mismatch between\
    \ the waveguide array and the plasma load), and $P_\\mathrm{launched}$ is the\
    \ [launched power](name:launched_power_of_lower_hybrid_antenna) (the net power\
    \ entering the vacuum vessel). Directional couplers installed on the transmission\
    \ line simultaneously measure both forward and reflected power, from which launched\
    \ power is derived. System-level aggregates \u2014 [total_launched_power_of_lower_hybrid_antenna](name:launched_power_of_lower_hybrid_antenna)\
    \ and [total_absorbed_power_of_lower_hybrid_antenna](name:total_absorbed_power_of_lower_hybrid_antenna)\
    \ \u2014 sum these per-antenna values over the full lower hybrid system and quantify,\
    \ respectively, the total injected and deposited power."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
- name: forward_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Incident RF power carried by the wave propagating toward a lower hybrid
    antenna at its input reference plane. It is a per-antenna quantity, not a sum
    over multiple antennas.
  documentation: 'Forward power of a lower hybrid antenna is the nonnegative RF power
    carried by the incident traveling wave at the antenna input reference plane. It
    represents power propagating from the generator and transmission-line side toward
    the antenna structure; "forward" specifies this propagation direction rather than
    a signed power convention. The quantity applies to one antenna, so totals over
    several antennas are separate quantities.


    The launched RF power is the part of the forward power that remains after subtracting
    the oppositely propagating reflected power:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the forward power, $P_\mathrm{reflected}$ is the
    reflected power, and $P_\mathrm{launched}$ is the launched power for the same
    antenna and the same reference plane. If a complex voltage-wave reflection coefficient
    $\Gamma$ is used, $\Gamma$ is dimensionless and $|\Gamma|^2$ gives the reflected-to-forward
    power ratio under the corresponding calibration convention.


    In practice, forward power is inferred from calibrated RF measurements that separate
    waves traveling toward and away from the antenna, commonly using directional RF
    measurements or equivalent network measurements near the antenna input. Corrections
    may account for transmission-line attenuation, calibration factors, and the chosen
    reference plane. Forward power can exceed launched power when antenna-plasma mismatch
    or loading changes produce reflected power.


    Typical per-antenna values in lower-hybrid heating or current-drive operation
    are about $10^5$-$5 \times 10^6$ W, while commissioning, conditioning, or low-power
    phases can use $10^3$-$10^5$ W.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:frequency_of_lower_hybrid_antenna
  - name:electron_density_at_launching_position
