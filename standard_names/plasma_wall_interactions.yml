        vessel structures, representing resistive Joule heating from induced or halo
        currents. Positive values indicate power deposition on the wall.
      kind: llm
- name: power_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Total power deposited on plasma-facing wall surfaces by all recombination
    processes, encompassing both plasma-ion recombination and surface recombination
    of incident neutral particles into molecules.
  documentation: 'The total recombination power at the wall aggregates two distinct
    heat-load channels: the plasma-ion channel, in which ions arriving at the surface
    capture free electrons and release their recombination energy into the wall material,
    and the neutral surface-recombination channel, in which incident hydrogen-isotope
    atoms combine into diatomic molecules on the material surface and deposit the
    molecular binding energy as heat.


    This quantity is the wall-surface component of the broader [power due to recombination](name:power_due_to_recombination),
    which encompasses volumetric recombination throughout the plasma volume. The two
    contributing channels are resolved separately: [plasma_power_at_wall_due_to_recombination](name:plasma_power_at_wall_due_to_recombination)
    carries the ion-channel contribution and [neutral_power_at_wall_due_to_recombination](name:neutral_power_at_wall_due_to_recombination)
    carries the neutral surface-recombination contribution, their sum giving:


    $$

    P_{\mathrm{rec,wall}} = P_{\mathrm{rec,wall}}^{\mathrm{ion}} + P_{\mathrm{rec,wall}}^{\mathrm{neutral}}

    $$


    where $P_{\mathrm{rec,wall}}^{\mathrm{ion}}$ is the integrated plasma-ion recombination
    power and $P_{\mathrm{rec,wall}}^{\mathrm{neutral}}$ is the neutral surface-recombination
    power, both summed over all plasma-facing surfaces.


    In edge plasma models, this quantity is evaluated from particle-balance calculations
    coupled to surface-interaction models, with each channel weighted by the recombination
    energy per event and the incident particle flux to the wall.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  - name:neutral_power_at_wall_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: wall
    operator_kind: locus
- name: neutral_power_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Power deposited on plasma-facing wall surfaces when incident neutral
    hydrogen-isotope particles recombine at the material surface, primarily through
    molecular formation and release of binding energy.
  documentation: 'Neutral surface-recombination power at the wall is the rate at which
    recombination energy from incident neutral particles is deposited in plasma-facing
    wall material. It represents the neutral-channel contribution to the wall heat
    load from recombination.


    The deposited power is defined by


    $$

    P_{\mathrm{rec,wall}}^{\mathrm{neutral}} = \int_{A_{\mathrm{wall}}} \sum_r \Gamma_r
    Q_r \, \mathrm{d}A

    $$


    where $A_{\mathrm{wall}}$ is the set of plasma-facing wall surfaces, $r$ indexes
    neutral surface-recombination channels, $\Gamma_r$ is the corresponding recombination-event
    rate per unit area, and $Q_r$ is the energy deposited per event. The quantity
    is the neutral component of [power at wall due to recombination](name:power_at_wall_due_to_recombination),
    complementary to [plasma power at wall due to recombination](name:plasma_power_at_wall_due_to_recombination);
    plasma-ion electron-capture recombination is excluded.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  arguments:
  - name: power_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
