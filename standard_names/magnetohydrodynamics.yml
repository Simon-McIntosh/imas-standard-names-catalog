      kind: template
- name: poloidal_magnetic_flux_at_halo_boundary
  kind: scalar
  status: active
  description: Poloidal magnetic flux evaluated on the outermost flux surface of the
    halo-current region during a disruption. This is the wall-side halo boundary of
    the halo-current domain, not the inner confined-plasma interface.
  documentation: 'Poloidal magnetic flux at the halo boundary is the value of the
    [poloidal magnetic flux](name:poloidal_magnetic_flux) function on the outermost
    magnetic flux surface of the halo-current region during a disruption. The halo
    boundary is the wall-side flux-surface limit of the halo-current domain, not the
    inner interface between that domain and any confined-plasma core.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius,
    $\phi$ the toroidal angle, and $Z$ the vertical height, the value on a halo-boundary
    point $(R_h, Z_h)$ is defined by the flux of the vertical magnetic field through
    the horizontal disk centered on the toroidal symmetry axis:


    $$

    \psi_h = \psi(R_h, Z_h) = \int_0^{R_h} B_Z(R'', Z_h)\,2\pi R''\,dR''

    $$


    where $\psi_h$ is the poloidal magnetic flux at the halo boundary, $\psi(R_h,
    Z_h)$ is the poloidal magnetic flux function evaluated on that boundary, and $B_Z$
    is the vertical component of the magnetic field.


    This quantity is the poloidal-flux counterpart of the [toroidal magnetic flux
    at the halo boundary](name:toroidal_magnetic_flux_at_halo_boundary). It is a flux-surface
    value and does not denote the total magnetic flux through the halo-current volume
    or the halo current itself.


    Sign convention: Positive when $B_Z$ on the integration disk points in the $+Z$
    direction.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_poloidal_flux_coordinate
  sources:
  - dd_path: disruption/global_quantities/psi_halo_boundary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-psi_halo_boundary
    dd_documentation:
      leaf: Poloidal flux at halo region boundary
      parent_path: disruption/global_quantities
