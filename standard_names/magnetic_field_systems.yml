- name: vertical_coordinate_of_annulus
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the center of an annular cross-section element
    of an axisymmetric machine component in the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  documentation: 'The vertical coordinate $Z$ locates the center of an annular (ring-shaped)
    cross-section element along the machine axis in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius from the machine symmetry axis
    and $Z$ is the height above the machine midplane. An annulus is defined by its
    center position $(R_0, Z_0)$ together with its inner and outer radii; this quantity
    supplies the $Z_0$ component of that center, fully specifying the axial location
    of the element. Such annular elements appear in passive conducting structures,
    poloidal-field coils, ferritic inserts, and antenna straps whose cross-sections
    are idealized as axisymmetric rings. The companion radial coordinate [coordinate_of_annulus](name:coordinate_of_annulus)
    provides the $R_0$ component, and analogous coordinates for other cross-section
    shapes are given by [vertical_coordinate_of_rectangle_center](name:vertical_coordinate_of_rectangle_center)
    and [vertical_coordinate_of_first_point_of_thick_line](name:vertical_coordinate_of_first_point_of_thick_line).
    Typical values range from roughly $-4$ m to $+4$ m depending on device size and
    component placement.


    Sign convention: Positive when the annulus center lies above the machine midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
