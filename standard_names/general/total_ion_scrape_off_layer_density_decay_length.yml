name: total_ion_scrape_off_layer_density_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the total ion number density mapped
  to the outboard midplane in the scrape-off layer.
documentation: "The total ion density decay length $\\lambda_{n_i}$ (in m) is the\
  \ radial e-folding distance of the total ion number density (summed over all charge\
  \ states) in the scrape-off layer (SOL), referenced to the outboard midplane. In\
  \ quasi-neutral conditions $n_i \\approx n_e / \\bar{Z}$ (where $\\bar{Z}$ is the\
  \ mean charge), so $\\lambda_{n_i}$ closely tracks $\\lambda_{n_e}$ but can deviate\
  \ when impurity content varies across the SOL. Typical midplane-mapped values are\
  \ 5\u201330 mm in H-mode tokamaks. Measurement is indirect, usually combining electron\
  \ density from Thomson scattering with $Z_{\\mathrm{eff}}$ or charge-exchange data\
  \ to infer $n_i$. The ion density decay length, together with the ion temperature\
  \ decay length, determines the ion pressure gradient in the SOL, which drives parallel\
  \ flows toward the divertor. See also `electron_density_decay_length_in_scrape_off_layer`\
  \ and `ion_heat_flux_decay_length_in_scrape_off_layer`."
