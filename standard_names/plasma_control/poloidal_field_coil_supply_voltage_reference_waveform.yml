name: poloidal_field_coil_supply_voltage_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent voltage setpoint for a poloidal-field coil
  power supply, used as the reference trajectory in the plasma control system.
documentation: "The poloidal-field (PF) coil supply voltage reference waveform $V_{\\\
  mathrm{ref}}(t)$ defines the target voltage that the power-supply controller must\
  \ track during a plasma discharge. It is part of the pulse schedule and serves as\
  \ the primary input to the voltage loop controller, which regulates the current\
  \ flowing through each PF coil circuit. The actual supply voltage is compared against\
  \ $V_{\\mathrm{ref}}(t)$ to compute the control error; an associated control envelope\
  \ (encoded in the error-bar metadata) specifies the acceptable deviation band. Typical\
  \ reference waveforms span $\\pm$1\u201320 kV depending on the machine size and\
  \ PF coil circuit inductance, with ramp rates constrained by power-supply bandwidth\
  \ and coil stress limits. In ITER, PF coil supply voltages reach up to $\\pm$1.5\
  \ kV per unit during plasma initiation and ramp-down. The dimensionless unit (1)\
  \ indicates that the waveform is expressed in normalized or per-unit form relative\
  \ to a machine-specific voltage base. See also the companion measurement and control\
  \ quantities for PF coils."
