- name: lower_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Ratio of the plasma-boundary vertical extent below the geometric axis
    to the horizontal minor radius in the cylindrical (R, phi, Z) frame.
  documentation: 'Lower elongation describes the vertical stretching of the lower
    half of the last closed plasma boundary relative to its horizontal size. It separates
    up-down asymmetric shaping from the whole-boundary [elongation](name:elongation)
    and complements [upper elongation](name:upper_elongation), which measures the
    corresponding upper half.


    A common geometric definition is


    $$

    \kappa_\mathrm{lower} = \frac{Z_\mathrm{geo} - Z_\mathrm{min}}{a}

    $$


    where $Z_\mathrm{geo}$ is the vertical coordinate of the geometric axis, $Z_\mathrm{min}$
    is the lowest vertical coordinate of the plasma boundary, and $a = (R_\mathrm{max}-R_\mathrm{min})/2$
    is the horizontal minor radius formed from the outermost and innermost boundary
    major radii in the right-handed cylindrical $(R, \phi, Z)$ frame.


    It is obtained from magnetic-equilibrium reconstruction constrained by external
    magnetic measurements and, when available, profile or polarimetric constraints
    that improve the boundary shape. Boundary-shape families often use lower elongation
    together with [lower triangularity](name:lower_triangularity), [lower inner squareness](name:lower_inner_squareness),
    and [lower outer squareness](name:lower_outer_squareness) to describe the lower
    divertor-facing contour.


    Typical values are near 1 for nearly circular plasmas, 1.4-2.0 for shaped tokamak
    H-mode equilibria, and can exceed 2 in strongly elongated lower single-null configurations
    before vertical-stability limits become restrictive.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation
  - name:upper_elongation
  - name:lower_triangularity
  - name:lower_inner_squareness
  - name:lower_outer_squareness
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_lower
    dd_path: equilibrium/time_slice/boundary/elongation_lower
    status: composed
- name: lower_inner_squareness
  kind: scalar
  status: draft
  description: Dimensionless boundary-shape parameter measuring how the lower inboard
    quadrant departs from an elliptical plasma cross-section toward a squarer or boxier
    contour.
  documentation: 'Lower inner squareness describes fourth-order shaping of the plasma
    boundary in the lower inboard quadrant of a poloidal cross-section. It separates
    corner-like boxiness from elongation and triangularity, complementing [upper inner
    squareness](name:upper_inner_squareness), [lower outer squareness](name:lower_outer_squareness),
    and [upper outer squareness](name:upper_outer_squareness) for the other three
    boundary quadrants.


    A common geometric definition compares the reconstructed boundary point with a
    matched elliptical reference in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    \zeta_{\mathrm{li}} = \frac{\left(\mathbf{x}_{\mathrm{b,li}} - \mathbf{x}_{\mathrm{ell,li}}\right)
    \cdot \hat{\mathbf{e}}_{\mathrm{li}}}{a}

    $$


    where $\mathbf{x}_{\mathrm{b,li}}$ is the lower-inboard boundary point, $\mathbf{x}_{\mathrm{ell,li}}$
    is the corresponding point on the matched ellipse, $\hat{\mathbf{e}}_{\mathrm{li}}$
    points toward decreasing $R$ and decreasing $Z$, and $a$ is the minor radius.
    [Inner triangularity](name:inner_triangularity) describes an inboard left-right
    displacement of the boundary, whereas squareness measures the residual corner
    shape after the lower and inner extrema are fixed.


    The parameter is computed from equilibrium reconstruction by fitting the last
    closed flux contour or separatrix and evaluating the lower-inboard quadrant relative
    to an elliptical reference shape. Magnetic diagnostics, plasma boundary imaging,
    and flux-surface reconstruction constrain the boundary points used in the fit.


    Common values are near 0 for an approximately elliptical boundary, about -0.2
    to 0.2 for moderate shaping, and can approach absolute values of 0.3-0.4 in strongly
    shaped scenarios.


    Sign convention: Positive when the lower inboard boundary in the cylindrical $(R,
    \phi, Z)$ frame lies farther toward the lower-inner corner than the elliptical
    reference shape used in the squareness definition.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_inner_squareness
  - name:lower_outer_squareness
  - name:upper_outer_squareness
  - name:inner_triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary/squareness_lower_inner
    dd_path: equilibrium/time_slice/boundary/squareness_lower_inner
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/squareness_lower_inner
    dd_path: equilibrium/time_slice/boundary_separatrix/squareness_lower_inner
