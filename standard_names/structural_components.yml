      kind: llm
- name: resistivity_of_plasma_facing_component
  kind: scalar
  status: active
  description: Electrical resistivity of limiter-unit material, relating local electric
    field to current density and governing induced and eddy-current response.
  documentation: 'Electrical resistivity of a limiter unit is the intrinsic material
    property that characterizes opposition to electric current in the plasma-facing
    component and governs its electromagnetic response.


    Under the effective isotropic-material approximation, Ohm''s law is


    $$

    \mathbf{E} = \rho\mathbf{J}

    $$


    where $\mathbf{E}$ is the local electric-field vector, $\mathbf{J}$ is the local
    current-density vector, and $\rho$ is the electrical resistivity. The scalar value
    is nonnegative and represents the limiter material itself; geometry-dependent
    total resistance is a separate quantity determined by the component dimensions
    and current paths. Its role is analogous to the material property defined for
    a [limiter tile](name:resistivity_of_limiter_tile) and a [passive structure](name:resistivity_of_passive_structure).'
