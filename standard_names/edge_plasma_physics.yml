      description: Array of values for d parallel.
      kind: template
- name: parallel_ion_charge_state_diffusivity
  kind: scalar
  status: active
  description: Parallel ion charge-state diffusivity is the effective Fickian particle
    diffusivity for a specified ionization state along magnetic-field lines.
  documentation: 'Parallel ion charge-state diffusivity is the effective Fickian particle
    diffusivity for ions in a specified ionization state along the magnetic-field
    direction. It is the scalar transport coefficient that relates the field-aligned
    diffusive particle flux of that charge state to the negative field-aligned gradient
    of its number density.


    For the local magnetic-field unit vector $\hat{\mathbf b}$, the defining Fickian
    relation is:


    $$

    \Gamma^{\mathrm{diff}}_{s,\parallel} = -D_{s,\parallel}\,\nabla_\parallel n_s

    $$


    where $\Gamma^{\mathrm{diff}}_{s,\parallel}$ is the diffusive particle-flux density
    projected along $\hat{\mathbf b}$, $D_{s,\parallel}$ is this parallel diffusivity,
    $n_s$ is the number density of ionization state $s$, and $\nabla_\parallel n_s
    = \hat{\mathbf b}\cdot\nabla n_s$ is its field-aligned gradient.


    This quantity is charge-state-resolved and excludes cross-field diffusion, convective
    or pinch transport, particle sources and sinks, and energy or momentum transport.
    It is the parallel directional counterpart of [ion charge-state diffusivity](name:ion_charge_state_diffusivity),
    distinct from [radial ion charge-state diffusivity](name:radial_ion_charge_state_diffusivity);
    [ion charge-state diffusion coefficient](name:ion_charge_state_diffusion_coefficient)
    denotes the same Fickian coefficient when that convention is used.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_charge_state_diffusivity
  - name:radial_ion_charge_state_diffusivity
  - name:ion_charge_state_diffusion_coefficient
