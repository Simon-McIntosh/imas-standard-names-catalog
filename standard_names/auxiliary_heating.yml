- name: per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by fast (suprathermal) electrons inside
    a given flux surface, resolved per toroidal mode number $n_\phi$.
  documentation: "This quantity gives the cumulative volume integral of the wave power\
    \ density deposited on the fast (non-thermal) electron population from a coherent\
    \ wave, enclosed within a flux surface and attributed to a single toroidal mode\
    \ number $n_\\phi$. Formally, it is defined as $P_{\\rm fast,e}(\\rho, n_\\phi)\
    \ = \\int_0^\\rho p_{\\rm fast,e}(\\rho', n_\\phi)\\, dV'$, where $p_{\\rm fast,e}$\
    \ is the fast-electron absorbed power density per toroidal mode and $dV'$ is the\
    \ volume element, so that summing over all $n_\\phi$ recovers the total [fast_electron_wave_absorbed_power_inside_flux_surface](name:fast_electron_wave_absorbed_power_inside_flux_surface).\
    \ The mode-resolved decomposition is essential for understanding which toroidal\
    \ harmonics of the wave spectrum drive the fast-electron population \u2014 particularly\
    \ relevant for lower-hybrid current drive and electron-cyclotron heating, where\
    \ the resonance condition $\\omega - n_\\phi \\Omega_{ce} - k_\\parallel v_\\\
    parallel = 0$ selects specific $n_\\phi$ values. Typical values range from watts\
    \ to megawatts per mode depending on launched power and spectral width. This name\
    \ is the fast-electron counterpart of [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface)\
    \ and [per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface);\
    \ the local (non-cumulative) mode-resolved power density is given by [per_toroidal_mode_of_fast_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_density)."
  unit: W
  physics_domain: auxiliary_heating
  links:
