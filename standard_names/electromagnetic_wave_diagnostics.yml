- name: second_coordinate_width_of_detector_aperture
  kind: scalar
  status: draft
  description: Full width of a detector aperture element in the second local coordinate
    (X2) direction for a rectangular aperture geometry. This is the nonnegative edge-to-edge
    side length of the clear opening along the X2 axis, not a projected or effective
    width.
  documentation: "The second-coordinate width $w_{X2}$ is the nonnegative edge-to-edge\
    \ side length of the clear opening of a detector aperture measured along the local\
    \ instrument axis $\\hat{X}_2$. Together with the companion quantity $w_{X1}$\
    \ (see [first_coordinate_width_of_detector_aperture](name:first_coordinate_width_of_detector_aperture)),\
    \ it fully specifies the rectangular aperture cross-section in the local orthonormal\
    \ frame $(\\hat{X}_1, \\hat{X}_2, \\hat{X}_3)$, where $\\hat{X}_3$ is the nominal\
    \ boresight direction of the detector.\n\nFor a rectangular aperture the clear-opening\
    \ area is\n$$A = w_{X1} \\times w_{X2},$$\nwhich enters directly into the geometric\
    \ throughput (\xE9tendue) of the detection channel, $\\mathcal{E} = A \\, \\Omega$,\
    \ where $\\Omega$ is the solid angle subtended at the aperture.\n\nThis width\
    \ is defined only when the aperture geometry is rectangular, as opposed to circular\
    \ or polygonal geometries that are described instead by outline vertex coordinates\
    \ such as [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline).\
    \ The analogous width for non-aperture detector elements is [second_coordinate_width_of_detector](name:second_coordinate_width_of_detector),\
    \ and the corresponding quantity for a generic aperture is [second_coordinate_width_of_aperture](name:second_coordinate_width_of_aperture).\n\
    \nThe quantity is unsigned: $w_{X2} \\geq 0$. Typical values range from a few\
    \ millimeters to several centimeters, depending on the diagnostic system and the\
    \ desired balance between throughput and spatial resolution. For reflectometer\
    \ and camera systems, this width governs the effective beam footprint and spatial\
    \ averaging in the X2 direction."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:first_coordinate_width_of_detector_aperture
