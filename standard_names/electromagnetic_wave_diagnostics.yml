      kind: llm
- name: vertical_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Signed spatial phase gradient of an electromagnetic wave along the\
    \ vertical direction in the right-handed cylindrical (R, \u03C6, Z) frame at each\
    \ point on a beam-tracing ray."
  documentation: 'The vertical wave-vector component is the signed projection of the
    local electromagnetic-wave vector onto the vertical direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame. It gives the local spatial phase gradient along
    $Z$ at each point of a beam-tracing ray, rather than a launch-point-only value.


    Using the phase convention $\mathbf{k}=\nabla S$, it is defined by


    $$

    k_Z = \mathbf{k}\cdot\hat{\mathbf{Z}} = \frac{\partial S}{\partial Z}

    $$


    where $\mathbf{k}$ is the local wave vector, $\hat{\mathbf{Z}}$ is the vertical
    unit vector, $S$ is the spatial phase, and $Z$ is vertical height. Unlike the
    direction cosine [vertical normalized wave vector of a beam-tracing beam](name:vertical_normalized_wave_vector_of_beam_tracing_beam),
    this component retains the wave-number scale; [vertical wave vector](name:vertical_wave_vector)
    denotes the corresponding launch-point quantity.


    Sign convention: Positive when the local wave vector has a component in the $+Z$
    direction, so the phase increases with increasing vertical height $Z$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/wave_vector/k_z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-wave_vector-k_z
    dd_documentation:
      leaf: Wave vector component in the vertical direction
      parent_path: ece/channel/beam_tracing/beam/wave_vector
      parent: Wave vector of the ray/beam along its path
      data_type: FLT_1D
      unit: m^-1
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Vertical (z) component of the wave vector (k_z) along the ECE beam
        or ray path in beam tracing calculations. Characterizes the vertical propagation
        direction of the electromagnetic wave.
      kind: llm
  - dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/k_z
