- name: poloidal_angle_at_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: Angle in the poloidal plane of the right-handed cylindrical (R, phi,
    Z) frame that specifies the direction used for a plasma boundary gap distance
    from its reference point. It is measured clockwise from the outward radial (+R)
    direction.
  documentation: 'Poloidal angle at a plasma boundary gap reference point is the orientation
    of the line along which the associated [plasma boundary gap distance] is evaluated.
    The angle lies in the poloidal $(R,Z)$ plane of the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius and $Z$ is vertical height; $\alpha_\mathrm{gap}=0$
    points in the outward radial $+\hat{R}$ direction.


    The reported angle $\alpha_\mathrm{gap}$, in radians, defines the unit direction
    vector for the gap measurement as


    $$

    \hat{\mathbf{g}} = \cos(\alpha_\mathrm{gap})\,\hat{R} - \sin(\alpha_\mathrm{gap})\,\hat{Z}

    $$


    where $\hat{\mathbf{g}}$ is the unit vector along the specified gap direction,
    and $\hat{R}$ and $\hat{Z}$ are the local radial and vertical basis vectors of
    the right-handed cylindrical $(R,\phi,Z)$ frame.


    In practice this angle is chosen from the position-control geometry or computed
    from the direction vector between the gap reference point and the intended boundary-intersection
    direction in the poloidal cross-section. It specifies only the direction; the
    companion gap quantity gives the distance along that direction from the reference
    point.


    Typical values may be represented over $-\pi$ to $\pi$ rad or equivalently over
    $0$ to $2\pi$ rad, with angles differing by $2\pi$ rad describing the same direction.
    Common reference directions include $0$ rad for outward radial, $\pi/2$ rad for
    downward, $\pi$ rad for inward radial, and $3\pi/2$ rad or $-\pi/2$ rad for upward.


    Sign convention: Positive when the gap direction is rotated clockwise from $+\hat{R}$
    toward $-\hat{Z}$ in the poloidal $(R,Z)$ plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: plasma_control
