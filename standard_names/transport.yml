- name: toroidal_ion_momentum_damping_rate
  kind: scalar
  status: draft
  description: Inverse relaxation time for damping the bulk ion momentum component
    along the toroidal phi direction in the right-handed cylindrical (R, phi, Z) frame,
    where R is major radius and Z is vertical height. It quantifies how rapidly toroidal
    ion rotation is relaxed by collisional, neoclassical, neutral, or modeled transport
    processes.
  documentation: 'The toroidal ion momentum damping rate is an inverse timescale for
    relaxation of the bulk ion momentum density associated with velocity along $\hat{\phi}$
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height. It is a rate coefficient: larger values imply faster loss
    of organized toroidal ion rotation to collisional, neoclassical, neutral, or other
    modeled momentum sinks.


    A common local relaxation representation defines the damping contribution to the
    toroidal momentum source density as


    $$

    S_{\phi,\mathrm{damp}} = -m_i n_i \nu_{\phi,i}\left(u_{\phi,i}-u_{\phi,i}^{\mathrm{ref}}\right)

    $$


    where $S_{\phi,\mathrm{damp}}$ is the damping part of the toroidal ion momentum
    source density in kg m^-2 s^-2, $m_i$ is the ion mass in kg, $n_i$ is the ion
    density in m^-3, $\nu_{\phi,i}$ is the toroidal ion momentum damping rate in s^-1,
    and $u_{\phi,i}$ and $u_{\phi,i}^{\mathrm{ref}}$ are toroidal ion velocities in
    m s^-1 along $\hat{\phi}$ in the right-handed cylindrical $(R,\phi,Z)$ frame.
    If the full momentum balance uses $S_\phi$ for a total toroidal momentum source
    density, $S_\phi$ has the same units. For a damping term $\nu_{\phi,i}$ is non-negative
    and reduces the velocity relative to the reference rotation; a negative fitted
    coefficient represents anti-damping or drive rather than damping.


    The rate is usually inferred rather than measured directly. It can be estimated
    from ion momentum-balance analysis using toroidal rotation measurements, ion density
    and temperature, neutral interaction estimates, and equilibrium geometry, or computed
    from neoclassical and kinetic transport models that represent collisional viscosity,
    trapped-particle effects, charge-exchange with neutrals, applied three-dimensional
    magnetic perturbations, and other effective momentum sinks. Transient spin-up
    or spin-down observations constrain it through the observed exponential relaxation
    time of toroidal ion rotation.


    Typical effective values in confined tokamak core conditions are about 0.1-100
    s^-1, corresponding to relaxation times of 10 ms-10 s. Neutral-rich edge plasmas,
    high-collisionality regimes, or strong applied non-axisymmetric magnetic perturbations
    can give modeled local values of 10^2-10^4 s^-1, while weakly damped core conditions
    may be below 0.1 s^-1.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:poloidal_ion_momentum_damping_rate
  - name:radial_ion_momentum_damping_rate
  - name:toroidal_ion_state_momentum_damping_rate
  - name:ion_momentum_damping_rate
