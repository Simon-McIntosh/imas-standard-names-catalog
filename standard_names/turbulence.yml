        flux surface (poloidal angle = 0), used as the normalizing reference quantity
        for local gyrokinetic simulations. Links simulation units to physical plasma
        conditions.
      kind: llm
- name: normalized_collisionality
  kind: scalar
  status: active
  description: Dimensionless ratio of a specified interspecies collision frequency
    to the characteristic streaming, transit, or bounce frequency used for the plasma
    population.
  documentation: 'This collisionality measures the strength of interspecies collisional
    relaxation relative to collisionless motion along magnetic-field trajectories.


    $$

    \nu_{ab}^{*} = \frac{\nu_{ab}}{\omega_{\mathrm{char}}}

    $$


    where $\nu_{ab}$ is the collision frequency between species $a$ and $b$, and $\omega_{\mathrm{char}}$
    is the relevant characteristic streaming, transit, or bounce angular frequency;
    both quantities have reciprocal-time units.


    The denominator must be interpreted according to the selected orbit or motion
    class, so this quantity is distinct from the collision frequency itself. It generalizes
    the population-specific [electron collisionality](name:electron_collisionality)
    and complements [collisionality at the pedestal top](name:collisionality_at_pedestal_top)
    when the characteristic frequency is evaluated there.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:electron_collisionality
  - name:collisionality_at_pedestal_top
  sources:
  - dd_path: gyrokinetics_local/collisions/collisionality_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-collisions-collisionality_norm
    dd_documentation:
