- name: per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power per unit volume deposited on the thermal electron
    population from a coherent wave, resolved per toroidal mode number $n_\phi$.
  documentation: The thermal electron wave absorbed power density per toroidal mode,
    $dP_\mathrm{th,e}/dV\,dn_\phi$, quantifies how power from a coherent electromagnetic
    wave (such as electron cyclotron or lower hybrid waves) is deposited locally in
    the plasma volume among thermal electrons as a function of the toroidal mode number
    $n_\phi$. Integrating over all toroidal mode numbers $n_\phi$ recovers the total
    [thermal electron wave absorbed power density](name:thermal_electron_wave_absorbed_power_density).
    This per-mode decomposition is essential for identifying which wave harmonics
    dominate the electron heating and for validating full-wave and ray-tracing codes
    against mode-resolved measurements. The quantity is computed on the poloidal cross-section,
    providing a spatially resolved view of mode-by-mode power deposition; volume-integrating
    further inside a flux surface yields the cumulative absorbed power captured by
    [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface).
    The analogous quantity for thermal ions is [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density),
    and for fast electrons see [per_toroidal_mode_of_fast_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_density).
    Typical core values in electron cyclotron heating scenarios range from $10^5$
    to $10^8$ W m$^{-3}$ per mode for reactor-relevant plasmas, concentrated in narrow
    resonance layers near the electron cyclotron resonance surface.
  unit: W.m^-3
  physics_domain: auxiliary_heating
