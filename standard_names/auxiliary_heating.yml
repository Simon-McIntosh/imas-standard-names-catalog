- name: reflected_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Reflected power of an ion cyclotron heating antenna is the non-negative
    RF power carried by the backward-traveling wave from the antenna toward the feed
    line at a specified reference plane. It quantifies antenna matching and coupling
    shortfall, but equals forward power minus plasma-coupled power only when losses
    and reference-plane effects are excluded.
  documentation: 'Reflected power of an ion cyclotron heating antenna is the RF power
    in the wave traveling back from the antenna load toward the transmission line
    source. It is reported as a non-negative power-flow magnitude at a specified antenna
    or feed-line reference plane, not as a signed net power.


    At the same reference plane, the reflected power is related to the forward and
    net powers by the local power balance:


    $$

    P_{\mathrm{refl}} = P_{\mathrm{fwd}} - P_{\mathrm{net}}

    $$


    where $P_{\mathrm{refl}}$, $P_{\mathrm{fwd}}$, and $P_{\mathrm{net}}$ are powers
    in W; $P_{\mathrm{fwd}}$ is the incident power traveling toward the antenna, and
    $P_{\mathrm{net}}$ is the net RF power crossing the reference plane toward the
    antenna-plasma load. Only when losses between the reference plane and the plasma
    are negligible does $P_{\mathrm{net}}$ approximate the power coupled to the plasma.


    In practice, reflected power is obtained from calibrated directional couplers
    or from a voltage-current traveling-wave decomposition in the antenna feed system.
    The reference plane should be specified because standing waves, impedance transformations,
    and transmission-line or antenna losses can change the apparent reflected power
    measured at different locations.


    Typical reflected powers range from near 0 W in well-matched conditions to 10^3-10^6
    W in high-power ion-cyclotron operation. Well-matched systems commonly aim for
    reflected fractions $P_{\mathrm{refl}}/P_{\mathrm{fwd}}$ below about 0.05-0.2,
    while poor coupling or rapid load changes can produce much larger fractions approaching
    unity.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  - name:reflected_power_of_lower_hybrid_antenna
  arguments:
  - name: power_of_ion_cyclotron_heating_antenna
    operator: reflected
    operator_kind: qualifier
  sources:
  - id: dd:ic_antennas/antenna/module/power_reflected
    dd_path: ic_antennas/antenna/module/power_reflected
    status: attached
  - id: dd:ic_antennas/antenna/power_reflected
    dd_path: ic_antennas/antenna/power_reflected
    status: composed
- name: reflected_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: RF power returning from a lower hybrid antenna back toward the transmission
    line, representing the portion of forward power not coupled into the plasma.
  documentation: "Reflected power from a lower hybrid antenna is the component of\
    \ incident RF power that fails to couple into the plasma and propagates back toward\
    \ the transmission line source. Poor coupling arises from unfavorable edge plasma\
    \ density gradients, suboptimal launcher\u2013plasma distance, or antenna phasing\
    \ conditions that mismatch the slow-wave accessibility window of the lower hybrid\
    \ wave.\n\nThe power reflection coefficient $|\\Gamma|^2$ relates reflected power\
    \ $P_\\text{ref}$ to forward power $P_\\text{fwd}$:\n\n$$\n|\\Gamma|^2 = \\frac{P_\\\
    text{ref}}{P_\\text{fwd}}\n$$\n\nwhere $P_\\text{fwd}$ is the total power delivered\
    \ to the antenna from the transmission line. The [launched power](name:launched_power_of_lower_hybrid_antenna)\
    \ into the vacuum vessel is the difference $P_\\text{fwd} - P_\\text{ref}$, and\
    \ the [total absorbed power](name:total_absorbed_power_of_lower_hybrid_antenna)\
    \ accounts for remaining waveguide and plasma losses. The gross RF input to the\
    \ antenna system is captured by the parent quantity `power_of_lower_hybrid_antenna`.\n\
    \nReflected power is monitored in real time using directional couplers embedded\
    \ in the transmission line feeding the lower hybrid launcher. In well-coupled\
    \ regimes, $P_\\text{ref}/P_\\text{fwd}$ is typically below 5\u201310%; transients\
    \ such as L\u2013H mode transitions or edge density fluctuations can briefly increase\
    \ the reflected fraction to 30\u201350%, triggering protection interlocks. The\
    \ analogous quantity for ion cyclotron systems is [reflected power of an IC antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:lh_antennas/antenna/power_reflected
    dd_path: lh_antennas/antenna/power_reflected
    status: composed
- name: thermal_electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the bulk thermal electron population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal electron power at an inside flux surface quantifies the
    total rate at which coherent wave energy is absorbed by the bulk (Maxwellian)
    thermal electron population within the plasma volume bounded by a given flux surface.
    It represents the radially cumulative wave deposition profile for the thermal
    electron channel, complementing the fast-electron contribution [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface)
    to form the total [electron_power_at_inside_flux_surface](name:electron_power_at_inside_flux_surface).


    The quantity is obtained by integrating the flux-surface-averaged [thermal_electron_power_density](name:thermal_electron_power_density)
    $p_{\mathrm{th,e}}$ over the enclosed plasma volume:


    $$

    P_{\mathrm{th,e}}(\rho) = \int_0^\rho p_{\mathrm{th,e}}(\rho'') \frac{dV}{d\rho''}
    \, d\rho''

    $$


    where $\rho$ labels the flux surface and $dV/d\rho''$ is the differential volume
    element per unit radial coordinate.


    This profile is computed by RF wave propagation and absorption solvers; the value
    at the outermost closed flux surface gives the total wave power absorbed by thermal
    electrons. The analogous quantity for thermal ions is [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface),
    and the charge-state-resolved thermal ion analog is [thermal_ion_state_power_at_inside_flux_surface](name:thermal_ion_state_power_at_inside_flux_surface).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
  - name:electron_power_at_inside_flux_surface
  - name:thermal_electron_power_density
  - name:thermal_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    status: composed
- name: thermal_ion_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the thermal ion population within
    the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal ion power at an inside flux surface is the cumulative rate
    at which wave energy is deposited in the bulk ion population inside the volume
    enclosed by that magnetic flux surface. It represents thermal-ion heating integrated
    from the magnetic axis to the chosen surface and excludes direct deposition to
    electrons and fast ions.


    The cumulative power for a flux surface labeled by the dimensionless radial coordinate
    $\rho$ in a flux coordinate system $(\rho,\theta,\phi)$ is defined from the local
    thermal-ion wave-power density:


    $$

    P_{\mathrm{th\,ion}}(\rho) = \int_{V(\rho)} p_{\mathrm{th\,ion}} \, dV''

    $$


    where $V(\rho)$ is the plasma volume enclosed by the flux surface, $p_{\mathrm{th\,ion}}$
    is the local net wave-power density for thermal ions in W m^-3, $dV''$ is a volume
    element in m^3, and $P_{\mathrm{th\,ion}}$ is the cumulative power.


    In practice this quantity is computed by integrating wave-power deposition densities
    from wave propagation and wave-particle absorption modeling over the reconstructed
    plasma volume. Experimental constraints include injected wave power, coupling
    losses, ion temperature evolution, species composition, and other heating and
    transport terms needed to separate thermal-ion absorption from electron or fast-ion
    channels.


    Typical values are near 0 W at the magnetic axis and increase toward the total
    thermal-ion absorbed wave power at the plasma boundary. Medium-size tokamak discharges
    commonly have 10^4-10^6 W, while high-power wave-heating scenarios in large devices
    can reach 10^6-2 x 10^7 W within the outer flux surfaces.


    Sign convention: Positive when wave energy is transferred to the thermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_power
  - name:thermal_electron_power_at_inside_flux_surface
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    status: composed
- name: thermal_ion_state_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative radio-frequency wave power absorbed by a specified thermal
    ion charge state inside the plasma volume enclosed by a selected magnetic flux
    surface. It is the volume integral of the charge-state-resolved absorbed power
    density.
  documentation: "Thermal ion state power at an inside flux surface is the cumulative\
    \ radio-frequency wave power transferred to one specified thermal ion species\
    \ and charge state within the volume bounded by that magnetic flux surface. It\
    \ is the charge-state-resolved contribution to cumulative thermal-ion RF absorption.\n\
    \nThe cumulative absorbed power for charge state $z$ of ion species $s$ inside\
    \ the flux surface labeled by $\rho$ is defined by the volume integral of the\
    \ local absorbed power density:\n\n$$\nP_{\\mathrm{th},s,z}(\\rho) = \\int_{V(\\\
    rho)} p_{\\mathrm{th},s,z}(\\mathbf{x})\\, dV\n$$\n\nwhere $P_{\\mathrm{th},s,z}$\
    \ is in W, $p_{\\mathrm{th},s,z}$ is the local RF power density transferred to\
    \ that thermal ion charge state in W m$^{-3}$, $dV$ is the differential volume\
    \ element in m$^3$, and $V(\\rho)$ is the plasma volume enclosed by the magnetic\
    \ flux surface labeled by the dimensionless normalized flux-surface coordinate\
    \ $\\rho$.\n\nIn practice this quantity is computed from wave propagation and\
    \ wave-particle interaction models by integrating the charge-state-resolved absorption\
    \ over nested equilibrium volumes. Summing over all relevant charge states and\
    \ all thermal ion species gives the total cumulative RF power absorbed by thermal\
    \ ions inside the same flux surface; summing over charge states for only one species\
    \ gives the species-resolved contribution.\n\nTypical values for an individual\
    \ thermal ion charge state range from near 0 W for weakly absorbing states to\
    \ 10^5-10^7 W when the state is a dominant RF absorber. The value depends on coupled\
    \ RF power, resonance location, ion composition, charge-state population, temperature,\
    \ density, and the chosen flux surface.\n\nSign convention: Positive when net\
    \ RF energy is transferred from the wave field to the specified thermal ion charge\
    \ state."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_state_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    status: composed
- name: total_absorbed_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power deposited into the plasma by the lower hybrid antenna
    system, aggregated over all individual antennas.
  documentation: 'The total absorbed power of the lower hybrid antenna system quantifies
    the net RF energy deposition rate from the LHCD launcher array into the confined
    plasma, summed over all individual antennas. It is the primary power accounting
    metric for lower hybrid current drive and supplemental electron heating, governing
    the wave energy available for driving non-inductive plasma current.


    The absorbed power is defined as the volume integral of the local LH wave power
    deposition density over the plasma volume:


    $$

    P_\text{abs} = \int_V q_\text{LH}(\mathbf{r}) \, dV

    $$


    where $q_\text{LH}(\mathbf{r})$ is the volumetric LH wave absorption density at
    position $\mathbf{r}$ within the plasma volume $V$.


    This quantity is distinct from the [total launched power](name:total_launched_power_of_lower_hybrid_antenna),
    which represents power entering the vacuum vessel and can exceed the absorbed
    power by any residual absorption in the edge region or scrape-off layer that does
    not reach the confined plasma. In practice, the absorbed power is estimated from
    directional-coupler measurements of the [forward power](name:forward_power_of_lower_hybrid_antenna)
    and [reflected power](name:reflected_power_of_lower_hybrid_antenna) on the high-power
    RF transmission lines, corrected for resistive dissipation in the launcher structure
    and waveguide network.


    In current LHCD systems on medium-to-large tokamaks, total absorbed power levels
    range from 1-10 MW.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/power
    dd_path: lh_antennas/power
    status: composed
- name: fast_ion_state_power
  kind: scalar
  status: draft
  description: Total RF wave power absorbed by the fast (suprathermal) ion population
    of a specified charge state, volume-integrated over the entire plasma and excluding
    collisional energy exchange between populations.
  documentation: 'Fast-ion-state power is the total electromagnetic-wave energy per
    unit time deposited into the fast (suprathermal) ion component of a single, specified
    ion charge state, integrated over the entire plasma volume. It is the charge-state-resolved
    fast-ion contribution to [ion_state_power](name:ion_state_power), which also includes
    the thermal population''s absorbed wave power; collisional energy exchange between
    the fast and thermal ion populations is excluded by definition. Fast ions typically
    absorb RF energy through direct wave-particle resonance mechanisms such as minority-species
    fundamental resonance or second-harmonic absorption in ion cyclotron resonance
    heating schemes.


    The quantity is the volume integral of the fast-ion absorbed power density $p_{\mathrm{fast},s}(\mathbf{r})$
    for charge state $s$:


    $$

    P_{\mathrm{fast},s} = \int_V p_{\mathrm{fast},s}(\mathbf{r}) \, dV

    $$


    where $V$ is the total plasma volume and $p_{\mathrm{fast},s}$ is the local deposition
    rate given by [fast_ion_state_power_density](name:fast_ion_state_power_density).


    In RF wave modeling, the local deposition profile is obtained from quasi-linear
    wave-particle interaction calculations, then integrated over all flux surfaces.
    Summing over all charge states of a given ion species recovers [fast_ion_power](name:fast_ion_power),
    the total fast-ion absorbed wave power without charge-state resolution. The toroidal-mode-resolved
    cumulative variant is available via [per_toroidal_mode_fast_ion_state_power](name:per_toroidal_mode_fast_ion_state_power).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_state_power
  - name:fast_ion_state_power_density
  - name:fast_ion_power
  - name:per_toroidal_mode_fast_ion_state_power
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_fast
    status: composed
- name: fast_ion_state_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power density deposited on fast (non-thermal) ions in
    a specified charge state, expressed per unit plasma volume. When averaged over
    a magnetic flux surface, it is the local radial source whose volume integral gives
    the cumulative absorbed power for that state.
  documentation: 'Fast-ion state power density is the volumetric rate at which wave
    energy is transferred to the non-thermal ion population in a specified charge
    state. It is a charge-state-resolved component of [fast_ion_power_density](name:fast_ion_power_density)
    and is distinct from heating of the thermal-ion population represented by [thermal_ion_power_density](name:thermal_ion_power_density).


    For nested magnetic flux surfaces labeled by a dimensionless radial label $\rho$,
    the flux-surface-averaged density is


    $$

    p_{\mathrm{fast},c}(\rho) = \frac{1}{V''(\rho)} \int_{S(\rho)} \frac{q_{\mathrm{fast},c}(\mathbf{x})}{|\nabla
    \rho|} \, dA

    $$


    where $p_{\mathrm{fast},c}$ is this power density in W m^-3, $c$ denotes the charge
    state, $q_{\mathrm{fast},c}$ is the local wave-to-fast-ion energy-transfer density
    in W m^-3, $S(\rho)$ is the magnetic flux surface, $dA$ is the area element in
    m^2, $|\nabla\rho|$ has units m^-1, and $V''(\rho)$ is the differential volume
    in m^3 per unit $\rho$. Integrating $p_{\mathrm{fast},c}(\rho)V''(\rho)$ from
    the magnetic axis to a chosen surface gives [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_state_power_at_inside_flux_surface)
    in W.


    In practice, this quantity is computed from wave absorption or energy-balance
    modeling that partitions deposited wave power among ion species, charge states,
    and thermal or fast components. Inputs typically include wave fields, resonance
    physics, the fast-ion distribution, charge-state populations, equilibrium geometry,
    and collisional energy exchange; no particular reconstruction or heating code
    is implied.


    Typical flux-surface-averaged magnitudes are 10^3-10^6 W m^-3 for charge-state-resolved
    fast-ion wave heating in present tokamaks. Strongly localized resonant absorption
    can approach 10^7 W m^-3, while regions with little matching fast-ion population
    are near 0 W m^-3.


    Sign convention: Positive when energy is transferred from the wave field to fast
    ions in the specified charge state.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_density
  - name:ion_state_power_density
  - name:thermal_ion_power_density
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_fast_ion_state_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_density_fast
    dd_path: waves/coherent_wave/profiles_1d/ion/state/power_density_fast
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/ion/state/power_density_fast
    dd_path: waves/coherent_wave/profiles_2d/ion/state/power_density_fast
    status: attached
- name: thermal_electron_power
  kind: scalar
  status: draft
  description: Thermal electron power is the total coherent-wave power absorbed by
    the bulk thermal electron population, integrated over the plasma volume. It excludes
    power deposited in fast electrons, ions, or other channels.
  documentation: 'Thermal electron power is the volume-integrated rate at which a
    coherent electromagnetic wave transfers energy to the bulk thermal electron population.
    It represents the thermal-electron heating channel of wave absorption and excludes
    absorption assigned to fast electrons, ions, or other particle populations.


    The quantity is defined as the volume integral of the local thermal-electron wave
    power density:


    $$

    P_{e,\mathrm{th}} = \int_V p_{e,\mathrm{th}}(\mathbf{x}) \, dV

    $$


    where $P_{e,\mathrm{th}}$ is the total thermal electron power in W, $p_{e,\mathrm{th}}$
    is the local power density in W m$^{-3}$, $\mathbf{x}$ is position in m, $dV$
    is the volume element in m$^3$, and $V$ is the plasma volume over which absorption
    is evaluated.


    In practice this power is inferred from wave-heating power balance, electron energy
    balance, heating modulation, or wave-absorption calculations constrained by launched
    power, transmission, reflection, and measured plasma conditions. It is a channel-resolved
    absorbed power, so consistency with the total absorbed wave power requires summing
    over all absorbing populations and accounting for unabsorbed or lost wave power.


    Typical values range from near 0 W when thermal-electron absorption is weak to
    10^4-10^7 W in many wave-heated tokamak plasmas, with values of several 10^7 W
    possible in high-power heating scenarios. The value depends on launched wave power,
    coupling efficiency, wave frequency, plasma density and temperature, magnetic
    configuration, and competing absorption by ions or fast particles.


    Sign convention: Positive when the coherent wave transfers net energy to the bulk
    thermal electron population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power
  - name:absorbed_power
  - name:thermal_electron_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_electron_power
  - name:fast_electron_power
  sources:
  - id: dd:waves/coherent_wave/global_quantities/electrons/power_thermal
    dd_path: waves/coherent_wave/global_quantities/electrons/power_thermal
    status: composed
- name: per_toroidal_mode_thermal_electron_power
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the thermal electron population from
    a coherent wave inside a flux surface, resolved per toroidal mode number.
  documentation: "The thermal electron power per toroidal mode number quantifies the\
    \ wave energy deposition rate into the bulk Maxwellian electron population attributed\
    \ to a single toroidal harmonic $n_\\phi$ of a coherent wave's spectrum. When\
    \ evaluated as a cumulative (volume-integrated) quantity inside a given flux surface,\
    \ it reveals the radial deposition profile contributed by each toroidal harmonic\
    \ to thermal electron heating.\n\nThe cumulative absorbed power from toroidal\
    \ mode $n_\\phi$ inside the flux surface at normalized radial coordinate $\\rho$\
    \ is:\n\n$$\nP_{\\rm th,e}(n_\\phi, \\rho) = \\int_0^\\rho p_{\\rm th,e}(n_\\\
    phi, \\rho') \\, dV'\n$$\n\nwhere $p_{\\rm th,e}(n_\\phi, \\rho')$ is the [per_toroidal_mode_thermal_electron_power_density](name:per_toroidal_mode_thermal_electron_power_density)\
    \ and $dV'$ is the differential plasma volume element.\n\nSumming over all toroidal\
    \ mode numbers $n_\\phi$ recovers the total [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface),\
    \ whose global limit is the parent quantity [thermal_electron_power](name:thermal_electron_power).\
    \ This quantity is computed from full-wave or ray/beam-tracing models of RF wave\
    \ propagation and absorption, where quasilinear wave\u2013particle interaction\
    \ determines how each toroidal harmonic deposits power into the thermal electrons.\
    \ The analogous mode-resolved quantities for other species are [per_toroidal_mode_thermal_ion_power](name:per_toroidal_mode_thermal_ion_power)\
    \ and [per_toroidal_mode_fast_electron_power](name:per_toroidal_mode_fast_electron_power).\n\
    \nSign convention: Positive when net wave power flows from the coherent wave field\
    \ into the thermal electron population."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_electron_power_density
  - name:thermal_electron_power_at_inside_flux_surface
  - name:thermal_electron_power
  - name:per_toroidal_mode_thermal_ion_power
  - name:per_toroidal_mode_fast_electron_power
