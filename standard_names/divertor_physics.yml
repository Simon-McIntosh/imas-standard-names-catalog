      kind: llm
- name: power_of_divertor_due_to_conduction
  kind: scalar
  status: active
  description: Thermal power deposited on all divertor targets by parallel electron
    and ion heat conduction along open scrape-off-layer magnetic field lines, excluding
    convective, radiative, and neutral-particle channels.
  documentation: 'The power of the divertor due to conduction is the total thermal
    energy deposited on all divertor target surfaces by electron and ion heat conduction
    along open scrape-off-layer magnetic field lines. It excludes convective particle
    enthalpy, absorbed radiation, recombination, and neutral-particle contributions,
    and is the divertor-wide counterpart of [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction).


    The total conductive power is defined by integrating the conductive heat-flux
    vector over every wetted divertor target surface:


    $$

    P_{\mathrm{div,cond}} = \sum_k \int_{A_k} \mathbf{q}_{\mathrm{cond}} \cdot \hat{\mathbf{n}}_k\,dA

    $$


    where $A_k$ is the wetted surface of target $k$, $\hat{\mathbf{n}}_k$ points from
    the plasma toward the target material, and $\mathbf{q}_{\mathrm{cond}}$ is the
    sum of the electron and ion conductive heat-flux vectors. This aggregate quantity
    covers the complete divertor assembly and is a locus-specific component of [power_due_to_conduction](name:power_due_to_conduction),
    rather than the global wall quantity [power_at_wall_due_to_conduction](name:power_at_wall_due_to_conduction).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_conduction
  - name:power_due_to_conduction
  - name:power_at_wall_due_to_conduction
  arguments:
  - name: power_due_to_conduction
    operator: divertor
    operator_kind: locus
