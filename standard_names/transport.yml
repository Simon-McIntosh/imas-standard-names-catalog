- name: parallel_component_of_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity relating the radial flux of ion parallel momentum
    density to the radial gradient of ion parallel velocity in a flux-surface-averaged
    radial transport model. This species-summed quantity aggregates contributions
    from all ion species.
  documentation: "The parallel component of ion momentum diffusivity, $\\chi_{\\parallel,i}$\
    \ (units: m$^2$ s$^{-1}$), is the effective diffusion coefficient that appears\
    \ in the radial transport equation for ion parallel momentum. In the flux-surface-averaged\
    \ 1-D radial transport framework, the diffusive contribution to the radial flux\
    \ of parallel momentum density is expressed as\n\n$$\\Gamma_{\\parallel,\\mathrm{diff}}\
    \ = -n_i m_i \\chi_{\\parallel,i} \\frac{\\partial v_{\\parallel,i}}{\\partial\
    \ \\rho} |\\nabla \\rho|,$$\n\nwhere $n_i$ is the ion number density (m$^{-3}$),\
    \ $m_i$ is the ion mass (kg), $v_{\\parallel,i}$ is the ion fluid velocity projected\
    \ along the magnetic field direction $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ (m\
    \ s$^{-1}$), $\\rho$ is the dimensionless radial coordinate (e.g., normalized\
    \ toroidal flux radius $\\rho_{\\mathrm{tor,norm}}$), and $|\\nabla \\rho|$ is\
    \ the metric factor that converts the coordinate derivative to a physical gradient\
    \ (m$^{-1}$). This makes $\\Gamma_{\\parallel,\\mathrm{diff}}$ a momentum flux\
    \ density with units kg m$^{-1}$ s$^{-2}$.\n\nThe label \"parallel component\"\
    \ denotes that the transported quantity is the component of momentum along the\
    \ magnetic field; the transport itself is in the radial direction across flux\
    \ surfaces.\n\nThis is the species-summed (total) ion parallel momentum diffusivity,\
    \ aggregating over all ion species present in the plasma. It is a flux-surface-averaged\
    \ scalar coefficient evaluated as a function of the radial coordinate.\n\nPhysical\
    \ mechanisms contributing to $\\chi_{\\parallel,i}$ include neoclassical parallel\
    \ viscosity (ion-ion and ion-neutral collisions) and turbulent momentum redistribution.\
    \ Typical values in tokamak core plasmas are of order $0.1$\u2013$10$ m$^2$ s$^{-1}$,\
    \ comparable in magnitude to the toroidal momentum diffusivity, since parallel\
    \ and toroidal directions are closely aligned in standard aspect-ratio tokamaks.\n\
    \nSign convention: Positive when the diffusive flux transports parallel momentum\
    \ from regions of higher parallel velocity to regions of lower parallel velocity\
    \ (i.e., down the radial gradient of $v_{\\parallel,i}$).\n\nThe charge-state-resolved\
    \ analog is available as [parallel_component_of_ion_state_momentum_diffusivity](name:parallel_component_of_ion_state_momentum_diffusivity).\
    \ Sibling projections describing radial transport of other momentum components\
    \ include the [toroidal](name:toroidal_component_of_ion_momentum_diffusivity),\
    \ [poloidal](name:poloidal_component_of_ion_momentum_diffusivity), and [radial](name:radial_component_of_ion_momentum_diffusivity)\
    \ momentum diffusivities."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_component_of_ion_momentum_diffusivity
  - name:poloidal_component_of_ion_momentum_diffusivity
  - name:parallel_component_of_ion_state_momentum_diffusivity
  - name:ion_momentum_diffusivity
  constraints: []
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/parallel/d
    dd_path: core_transport/model/profiles_1d/ion/momentum/parallel/d
    status: composed
- name: parallel_component_of_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Parallel component of the effective momentum diffusivity for a specific
    ion charge state, governing diffusive transport of parallel momentum along magnetic
    field lines.
  documentation: 'The parallel component of the ion-state momentum diffusivity, $\chi_{\parallel}^{\rm
    state}$, enters the flux-gradient closure for parallel momentum transport of a
    charge-state-resolved ion population: $\Gamma_{m,\parallel} = -n_i m_i \chi_{\parallel}^{\rm
    state} \nabla_{\parallel} v_{\parallel}$, where $n_i$ is the ion number density
    and $m_i$ is the ion mass. This coefficient captures both anomalous (turbulent)
    and neoclassical contributions to parallel momentum diffusion, and is distinct
    from the [radial component](name:radial_component_of_ion_state_momentum_diffusivity)
    and [poloidal component](name:poloidal_component_of_ion_state_momentum_diffusivity)
    of the same tensor family. Parallel momentum diffusivity is typically larger than
    its cross-field counterparts due to the relatively unimpeded flow of momentum
    along field lines; in tokamak core plasmas, values of $\chi_{\parallel}^{\rm state}$
    can range from $10^{-1}$ to $10^{1}$ m$^2$s$^{-1}$ depending on collisionality
    regime and turbulence level. It is inferred from transport analysis codes using
    measured toroidal rotation profiles and neoclassical theory, and feeds into multi-fluid
    transport models that resolve individual ion charge states. The parent tensor
    quantity is described under [ion_state_momentum_diffusivity](name:ion_state_momentum_diffusivity);
    the analogous quantity integrated over all charge states is the [parallel component
    of ion momentum diffusivity](name:parallel_component_of_ion_momentum_diffusivity).'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_component_of_ion_state_momentum_diffusivity
  - name:poloidal_component_of_ion_state_momentum_diffusivity
  - name:ion_state_momentum_diffusivity
  - name:parallel_component_of_ion_momentum_diffusivity
  constraints: []
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/parallel/d
