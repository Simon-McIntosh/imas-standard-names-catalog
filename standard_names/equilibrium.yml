      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Minimum q value and position.
      kind: template
- name: normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: active
  description: Dimensionless normalized poloidal-flux coordinate locating the closed
    magnetic surface where the safety-factor magnitude is globally minimized.
  documentation: 'This quantity is the normalized poloidal-flux coordinate assigned
    to the closed magnetic surface where the magnitude of the [safety factor](name:safety_factor)
    is globally smallest inside the last-closed flux surface. It identifies the radial
    location of the minimum safety factor rather than the minimum safety-factor value
    itself.


    The coordinate of this surface is defined by


    $$

    \rho_{\mathrm{p},q_{\min}} = \operatorname*{arg\,min}_{0 \le \rho_{\mathrm{p}}
    \le 1} \left|q(\rho_{\mathrm{p}})\right|

    $$


    where $\rho_{\mathrm{p},q_{\min}}$ is the normalized poloidal-flux coordinate
    at the minimum-safety-factor surface, $\rho_{\mathrm{p}}$ is the normalized poloidal-flux
    coordinate, and $q(\rho_{\mathrm{p}})$ is the [safety factor](name:safety_factor)
    evaluated on the closed flux surface labeled by $\rho_{\mathrm{p}}$.


    The minimization is global over nested closed magnetic flux surfaces in the confined
    plasma. The coordinate follows the convention of [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate),
    increasing from zero at the magnetic axis to one at the last-closed flux surface.
    It is a single locus value, not a flux-surface average, volume average, or integral.
    If multiple surfaces attain the same global minimum of $|q|$, the arg-min is non-unique
    unless an additional tie-breaking convention is supplied.


    The minimand is the magnitude $|q|$, so this quantity locates the minimum of the
    safety-factor magnitude rather than the minimum of signed $q$. It must not be
    confused with the value of $q_{\min}$ itself or with the dimensional flux on the
    same surface, given by [poloidal magnetic flux at minimum safety factor](name:poloidal_magnetic_flux_at_minimum_safety_factor).
    The corresponding toroidal-flux coordinate is [normalized toroidal flux coordinate
    at minimum safety factor](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/psi_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-psi_norm
    dd_documentation:
