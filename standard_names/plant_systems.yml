- name: prefill_gas_pressure
  kind: scalar
  status: active
  description: Pressure of the neutral gas introduced before plasma breakdown, governing
    the pressure-dependent ionization conditions for early electron-avalanche breakdown.
  documentation: 'Prefill gas pressure is the thermodynamic pressure of the neutral
    gas present before plasma breakdown. It establishes the gas conditions used in
    the Townsend electron-avalanche criterion during plasma initiation.


    For an ideal neutral gas, pressure is related to particle density and temperature
    by:


    $$

    p_g = n_g k_B T_g

    $$


    where $p_g$ is the prefill gas pressure, $n_g$ is the neutral particle number
    density, $k_B$ is Boltzmann''s constant, and $T_g$ is the neutral-gas temperature.
    This ideal-gas relation applies when the ideal-gas approximation is valid.


    This quantity describes the prebreakdown gas state; it is not the accumulated
    injected inventory represented by [prefill_count](name:prefill_count) or the pressure
    of the plasma formed after breakdown.'
  unit: Pa
  physics_domain: plant_systems
  links:
  - name:prefill_count
  sources:
  - dd_path: plasma_initiation/b_field_lines/pressure
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/plasma_initiation.html#plasma_initiation-b_field_lines-pressure
    dd_documentation:
      leaf: Prefill gas pressure used in Townsend E field calculation
      parent_path: plasma_initiation/b_field_lines
      parent: Magnetic field line tracing results, given at various time slices
      data_type: FLT_0D
      unit: Pa
    enhanced_context:
      description: Prefill gas pressure used as input to the Townsend electric field
        calculation during plasma initiation. Determines the ionization conditions
        for electron avalanche breakdown in the early startup phase.
      kind: llm
