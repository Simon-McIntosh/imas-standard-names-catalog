- name: perpendicular_fast_particle_energy
  kind: scalar
  status: draft
  description: Perpendicular fast-particle energy is the non-negative kinetic energy
    content of the suprathermal particle population associated with motion perpendicular
    to the local magnetic field. For a gyrotropic fast-particle pressure tensor, it
    equals the plasma-volume integral of the perpendicular fast-particle pressure.
  documentation: 'Perpendicular fast-particle energy is the volume-integrated kinetic
    energy of the fast, suprathermal particle population associated with velocity
    components perpendicular to the local magnetic field. It includes the two perpendicular
    velocity-space degrees of freedom and excludes the kinetic energy associated with
    motion parallel to the magnetic field. The value is non-negative and is zero when
    the plasma volume contains no perpendicular fast-particle pressure.


    For a gyrotropic fast-particle pressure tensor, the perpendicular energy is defined
    by the volume integral of the perpendicular pressure component:


    $$

    W_{\perp,\mathrm{fast}} = \int_V p_{\perp,\mathrm{fast}}(\mathbf{x})\, dV

    $$


    where $W_{\perp,\mathrm{fast}}$ is in J, $p_{\perp,\mathrm{fast}}$ is the [perpendicular
    fast-particle pressure](name:perpendicular_fast_particle_pressure) in Pa ($\mathrm{J\,m^{-3}}$),
    $dV$ is a volume element in $\mathrm{m^3}$, and $V$ is the plasma volume considered.
    For the pressure tensor $\mathbf{P}_\mathrm{fast}=p_{\perp,\mathrm{fast}}(\mathbf{I}-\mathbf{b}\mathbf{b})+p_{\parallel,\mathrm{fast}}\mathbf{b}\mathbf{b}$,
    the total fast-particle energy is $W_\mathrm{fast}=W_{\perp,\mathrm{fast}}+W_{\parallel,\mathrm{fast}}$,
    with $W_{\parallel,\mathrm{fast}}=\frac{1}{2}\int_V p_{\parallel,\mathrm{fast}}\,dV$.
    Thus the isotropic relation $3p/2$ applies to total scalar-pressure energy density,
    not to the perpendicular component alone.


    In practice this quantity is computed from modeled or reconstructed fast-particle
    distribution functions by taking the perpendicular kinetic-energy moment to obtain
    $p_{\perp,\mathrm{fast}}$ and integrating it over the plasma volume. It may include
    contributions from neutral-beam ions, radio-frequency-heated ions, fusion alpha
    particles, or other suprathermal species, constrained by fast-particle diagnostics,
    neutron emission, diamagnetic measurements, and equilibrium pressure balance.


    Typical values range from $10^3$-$10^5$ J in low- to moderate-power heated plasmas
    and $10^5$-$10^7$ J in strongly heated or reactor-scale plasmas. For an isotropic
    fast-particle distribution, the perpendicular part is about two thirds of the
    total fast-particle kinetic energy; pitch-angle anisotropy can make this fraction
    larger or smaller.'
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:parallel_fast_particle_energy
  - name:fast_particle_energy
  - name:perpendicular_fast_particle_pressure
  arguments:
  - name: fast_particle_energy
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
