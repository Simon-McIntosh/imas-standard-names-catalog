- name: nitrogen_fraction
  kind: scalar
  status: draft
  description: 'Volume-averaged nitrogen concentration: the total nitrogen-particle
    density over all charge states divided by electron density.'
  documentation: 'Nitrogen fraction is the dimensionless volume-averaged abundance
    of nitrogen relative to electrons in a plasma. It counts nitrogen nuclei in all
    ionization states, from neutral $\mathrm{N}^{0}$ through fully stripped $\mathrm{N}^{7+}$,
    and normalizes their total number density by the local electron density.


    Using a volume average over the plasma volume, the fraction is defined as:


    $$

    f_\mathrm{N} = \left\langle \frac{\sum_{q=0}^{7} n_{\mathrm{N}^{q+}}}{n_e} \right\rangle_V

    $$


    where $n_{\mathrm{N}^{q+}}$ is the number density of nitrogen with charge state
    $q$, $q=0$ denotes neutral nitrogen, $q=7$ denotes fully stripped nitrogen, $n_e$
    is electron density, and $\langle\cdot\rangle_V$ denotes volume averaging. Fully
    stripped nitrogen is $\mathrm{N}^{7+}$; there is no $\mathrm{N}^{8+}$ charge state
    for nitrogen.


    In practice, this quantity is inferred from a combination of impurity spectroscopy,
    charge-exchange recombination measurements when available, bolometric radiation
    constraints, electron-density measurements, and collisional-radiative or transport
    modeling to complete the charge-state distribution. Neutral and fully stripped
    populations can be difficult to observe directly, so their contributions are often
    inferred from ionization-balance modeling rather than measured as isolated emission
    features.


    Typical values are $10^{-4}$-$10^{-3}$ for trace background nitrogen and $10^{-3}$-$5\times10^{-2}$
    during deliberate nitrogen seeding for radiative divertor or edge-cooling control.
    Larger fractions increase radiated power and fuel dilution and therefore strongly
    affect plasma performance.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_nitrogen_density
  - name:neon_fraction
  - name:total_plasma_fraction
  sources:
  - id: dd:summary/composition/nitrogen/value
    dd_path: summary/composition/nitrogen/value
    status: composed
- name: radiated_power_density
  kind: scalar
  status: draft
  description: Local non-negative volumetric rate at which plasma emits electromagnetic
    radiation, representing radiated power per unit volume.
  documentation: 'Radiated power density is the local, non-negative volumetric rate
    at which plasma thermal energy is converted to electromagnetic radiation. It includes
    continuum, line, recombination, and other photon emission processes that contribute
    to bolometric radiated power.


    The total radiated power associated with a plasma volume is the volume integral
    of the local emission density:


    $$

    P_\mathrm{rad} = \int_V p_\mathrm{rad}(\mathbf{x})\,dV

    $$


    where $P_\mathrm{rad}$ is total radiated power in W, $p_\mathrm{rad}$ is radiated
    power density in W m$^{-3}$, $\mathbf{x}$ denotes spatial position, and $dV$ is
    a volume element in m$^3$. For an axisymmetric reconstruction in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise
    when viewed from above, and $Z$ is vertical height, the poloidal-plane volume
    element is $dV = 2\pi R\,dR\,dZ$; this reduction assumes toroidal symmetry of
    $p_\mathrm{rad}$.


    Bolometer measurements infer this quantity from calibrated line-of-sight signals
    through an optically thin plasma. For channel $i$, the measured signal is commonly
    modeled as a path integral, $b_i \approx \int_{\ell_i} G_i(\mathbf{x})\,p_\mathrm{rad}(\mathbf{x})\,dl$,
    where $b_i$ is the calibrated channel response, $G_i$ is the geometric and instrumental
    response kernel, $\ell_i$ is the viewing chord, and $dl$ is path length in meters.
    Tomographic inversion combines many such chords, with regularization and uncertainty
    estimates, to recover the spatial emission distribution.


    Typical local values are about $10^3$-$10^6$ W m$^{-3}$ in relatively low-radiation
    core plasmas, $10^6$-$10^8$ W m$^{-3}$ in strongly radiating edge, divertor, or
    impurity-accumulation regions, and near zero outside the emitting plasma within
    measurement uncertainty.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:bolometer/power_density
    dd_path: bolometer/power_density
    status: composed
- name: radius_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Radius of a circular diagnostic aperture, defined as the distance from
    the aperture center to its circular edge. It characterizes the opening size used
    to compute the corresponding aperture area.
  documentation: 'The radius of a circular diagnostic aperture is the distance from
    the center of an idealized circular opening to its edge. It is the appropriate
    size parameter when the entrance aperture, collimating aperture, or sensitive
    circular region is modeled as a circle; non-circular apertures are characterized
    by quantities such as [width_of_diagnostic_aperture](name:width_of_diagnostic_aperture).


    For an ideal circular aperture, the associated aperture area is


    $$

    A = \pi r^2

    $$


    where $r$ is the aperture radius in meters and $A$ is the [area_of_diagnostic_aperture](name:area_of_diagnostic_aperture)
    in square meters. The corresponding [diameter_of_diagnostic_aperture](name:diameter_of_diagnostic_aperture)
    is $d = 2r$, where $d$ is the full edge-to-edge distance through the aperture
    center.


    The radius is obtained from mechanical drawings, dimensional metrology, optical
    inspection, or calibration of the fabricated diagnostic component. For a non-ideal
    or partially obscured circular opening, an effective radius may be chosen so that
    the ideal circular area matches the usable open area. The radius contributes to
    geometric throughput and solid-angle calculations together with the aperture position,
    orientation, and viewing geometry, but it does not by itself determine the full
    acceptance.


    Representative engineering scales are device- and diagnostic-dependent. Small
    pinholes or tightly collimated openings may have radii of about 0.0001-0.001 m,
    while many optical, fiber, or detector apertures use millimeter- to centimeter-scale
    radii of about 0.001-0.01 m; larger values can occur in wide-aperture systems.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
