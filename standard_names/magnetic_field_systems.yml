    \ specialization defined by [major length of iron-core segment](name:major_length_of_iron_core_segment).\n\
    \nThe side length is defined by\n\n$$\nL = \\sqrt{(\\Delta R)^2 + (\\Delta Z)^2}\n\
    $$\n\nwhere $L$ is the side length, and $\\Delta R$ and $\\Delta Z$ are the major-radius\
    \ and vertical-coordinate differences between the side\u2019s endpoints in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame; the side lies in a poloidal\
    \ plane at fixed $\\phi$.\n\nThis is the length of one oblique side, not the full\
    \ perimeter, cross-sectional area, vertical height, or radial width of the segment.\
    \ The corresponding side angle determines the relationship between $\\Delta R$,\
    \ $\\Delta Z$, and $L$."
  unit: m
