    in $[-1, 1]$. This component completes the Cartesian trio alongside [x_component_of_shatter_cone_major_unit_vector](name:x_component_of_shatter_cone_major_unit_vector)
    and [y_component_of_shatter_cone_major_unit_vector](name:y_component_of_shatter_cone_major_unit_vector),
