name: toroidal_component_of_non_axisymmetric_vacuum_magnetic_field
description: Toroidal ($\phi$) component of the vacuum magnetic field arising from
  non-axisymmetric sources such as field errors and ripple.
documentation: "The non-axisymmetric vacuum toroidal field $\\delta B_\\phi = \\delta\\\
  mathbf{B}_{\\mathrm{vac}} \\cdot \\hat{\\phi}$ captures the $\\phi$-directed perturbation\
  \ of the magnetic field that breaks toroidal symmetry in the absence of plasma currents.\
  \ Sources include discrete toroidal-field coil ripple, manufacturing and assembly\
  \ tolerances, test-blanket-module ports, and intentional resonant magnetic perturbation\
  \ (RMP) coils for ELM suppression. In ITER the peak-to-mean toroidal ripple $\\\
  delta B_\\phi / B_\\phi$ is designed to stay below $\\sim 0.5\\%$; ferritic inserts\
  \ reduce it from $\\sim 1.2\\%$ to this target. The field is computed on a 3D $(R,\\\
  phi,Z)$ grid by Biot\u2013Savart integration over all non-axisymmetric current sources\
  \ in vacuum. Positive when directed in the $+\\phi$ direction (counter-clockwise\
  \ viewed from above) under COCOS-11. This perturbation field is an essential input\
  \ for neoclassical transport codes evaluating ripple-induced fast-ion losses and\
  \ for 3D equilibrium solvers (VMEC, HINT). See `toroidal_component_of_magnetic_field`\
  \ for the axisymmetric baseline and `toroidal_component_of_magnetic_field_at_ferritic_element_centroid`\
  \ for the local field at ferritic elements."
