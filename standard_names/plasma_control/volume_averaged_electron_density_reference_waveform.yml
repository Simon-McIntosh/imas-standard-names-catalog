name: volume_averaged_electron_density_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for the volume-averaged electron density
  used by the plasma density control system.
documentation: "The volume-averaged electron density reference waveform provides the\
  \ temporal set-point $\\langle n_e \\rangle_V = \\int n_e\\,dV / V_p$ (where $V_p$\
  \ is the plasma volume) for density feedback control. The density controller adjusts\
  \ fueling actuators\u2014gas puffing valves, pellet injectors, or supersonic molecular\
  \ beam injection\u2014to track this reference trajectory. Error bars on the waveform\
  \ define a control envelope rather than statistical uncertainty. Typical target\
  \ values span $1 \\times 10^{19}$\u2013$1.5 \\times 10^{20}\\,\\mathrm{m^{-3}}$\
  \ in absolute terms; the dimensionless unit (1) indicates device-specific normalization.\
  \ Interferometric line-integrated measurements are commonly used as the real-time\
  \ proxy for volume-averaged density. See also the profile-averaged variant and the\
  \ line-integrated electron density reference."
