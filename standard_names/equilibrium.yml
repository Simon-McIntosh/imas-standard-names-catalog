  - id: dd:equilibrium/time_slice/constraints/bpol_probe/measured
    dd_path: equilibrium/time_slice/constraints/bpol_probe/measured
    status: attached
- name: poloidal_magnetic_field_at_measurement_position
  kind: scalar
  status: draft
  description: Local projection of the magnetic-field vector onto the poloidal direction
    at a specified magnetic measurement point, used to constrain equilibrium fields.
  documentation: 'This quantity is the local component of the magnetic-field vector
    in the poloidal plane at the measurement position. The poloidal plane is the meridional
    $R$-$Z$ plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is the
    point-sampled counterpart of the broader [poloidal magnetic field](name:poloidal_magnetic_field)
    and complements the [radial magnetic field](name:radial_magnetic_field) component.


    The measured projection is defined by the local dot product:


    $$

    B_{\mathrm{pol}}(\mathbf{x}_m) = \mathbf{B}(\mathbf{x}_m) \cdot \hat{e}_{\mathrm{pol}}(\mathbf{x}_m)

    $$


    where $\mathbf{B}(\mathbf{x}_m)$ is the magnetic-field vector at measurement position
    $\mathbf{x}_m$, and $\hat{e}_{\mathrm{pol}}$ is the local unit vector in the selected
    positive poloidal direction.


    It is measured with calibrated magnetic pickup coils, Hall probes, or other local
    magnetic sensors, and it is computed in equilibrium reconstruction by evaluating
    the reconstructed magnetic field at the sensor location and applying the same
    projection. Its interpretation is tied to the local flux geometry governed by
    poloidal flux quantities such as [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis).


    Values near the plasma boundary commonly range from a few mT to several tenths
    of a tesla, with larger excursions during rapid current redistribution, vertical
    motion, or strong shaping-control transients.


    Sign convention: Positive when the magnetic-field projection is along the positive
    local poloidal unit vector $\hat{e}_{\mathrm{pol}}$ at the measurement position
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_field
