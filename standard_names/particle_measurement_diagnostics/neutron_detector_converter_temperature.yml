name: neutron_detector_converter_temperature
status: draft
description: Temperature of the neutron-to-signal converter element inside a neutron
  detector, affecting detection efficiency and gain stability.
documentation: "The converter temperature $T_{\\mathrm{conv}}$ (K) is the operating\
  \ temperature of the material layer (e.g., ${}^{10}\\mathrm{B}$, ${}^{6}\\mathrm{Li}$,\
  \ ${}^{235}\\mathrm{U}$ fission foil, or diamond crystal) that converts incident\
  \ neutrons into detectable charged particles or scintillation light. Temperature\
  \ variations alter the converter's detection efficiency, leakage current, and signal-to-noise\
  \ ratio; for example, CVD diamond detectors exhibit increasing dark current above\
  \ approximately 400\\,K. Monitoring $T_{\\mathrm{conv}}$ is essential for maintaining\
  \ calibration accuracy, especially in high-radiation environments close to the tokamak\
  \ vessel where nuclear heating can elevate local temperatures by tens of kelvin\
  \ above ambient. Typical operating values are 290\u2013350\\,K under normal conditions,\
  \ but can exceed 400\\,K during extended high-power discharges if active cooling\
  \ is insufficient. See also `total_neutron_flux` for the physics signal the detector\
  \ measures and `fusion_power` for the quantity ultimately derived from the neutron\
  \ measurement."
