- name: per_toroidal_mode_thermal_ion_state_power
  kind: scalar
  status: draft
  description: Wave power absorbed by a specified thermal ion species and charge state
    from one toroidal Fourier harmonic of a coherent wave. It is volume-integrated
    over the region enclosed by a magnetic flux surface; at the outer boundary it
    is the global contribution of that mode to charge-state-resolved ion heating.
  documentation: 'Per-toroidal-mode thermal ion state power is the coherent-wave power
    absorbed by the thermal population of a specified ion species and charge state
    for one toroidal mode number. For an interior magnetic flux surface, it is a cumulative
    volume integral over the plasma region enclosed by that surface; at the outer
    boundary it is the total absorbed power for that charge state and mode. The toroidal
    mode number is the integer harmonic in a Fourier decomposition with respect to
    the toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    For a magnetic flux surface $S$, the cumulative contribution of mode $n$ can be
    written as


    $$

    P^{\mathrm{th}}_{a,z,n}(S) = \int_{V(S)} p^{\mathrm{th}}_{a,z,n}(\mathbf{x})\,
    dV

    $$


    where $P^{\mathrm{th}}_{a,z,n}$ is the absorbed power in W, $p^{\mathrm{th}}_{a,z,n}$
    is the local absorbed power density in W m$^{-3}$, $dV$ is the volume element
    in m$^3$, $V(S)$ is the volume enclosed by $S$, $a$ labels the ion species, $z$
    labels the charge state, and $n$ is dimensionless. Summing over toroidal mode
    numbers gives the total charge-state-resolved thermal ion power, $P^{\mathrm{th}}_{a,z}(S)=\sum_n
    P^{\mathrm{th}}_{a,z,n}(S)$, while summing over the relevant ion species and charge
    states gives the aggregate per-mode thermal ion power, $P^{\mathrm{th}}_{\mathrm{i},n}(S)=\sum_{a,z}
    P^{\mathrm{th}}_{a,z,n}(S)$.


    In practice this quantity is obtained from coherent-wave absorption calculations,
    using local wave fields and thermal ion distribution functions to evaluate the
    absorbed power density before integrating over the enclosed volume. It may be
    constrained or checked against global power balance, charge-state composition,
    and diagnostics sensitive to ion heating, but it is fundamentally a mode-resolved
    deposition quantity rather than a directly local thermodynamic state variable.


    Typical values for an individual charge-state and toroidal-mode contribution range
    from near 0 W for weakly coupled modes or nonresonant charge states to $10^3$-$10^7$
    W in strongly heated plasmas. The sum over modes and charge states is bounded
    by the coherent-wave power coupled to the plasma and by losses to other particle
    populations or damping channels.


    Sign convention: Positive when net wave energy is transferred from the coherent
    wave field to the specified thermal ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_state_power
  - name:per_toroidal_mode_thermal_ion_power
  - name:per_toroidal_mode_fast_ion_state_power
