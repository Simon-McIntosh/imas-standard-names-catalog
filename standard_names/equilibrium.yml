- name: plasma_inductance
  kind: scalar
  status: draft
  description: Poloidal magnetic energy stored in the plasma current channel, expressed
    as an inductance via $L_p = 2E_{mag}/I_p^2$.
  documentation: "The plasma inductance quantifies the magnetic energy stored in the\
    \ poloidal field generated by the toroidal plasma current $I_p$. It is defined\
    \ as $L_p = 2 E_{mag} / I_p^2$, where $E_{mag} = \\frac{1}{2}\\int \\psi \\, j_{\\\
    phi} \\, dS$ is the poloidal magnetic energy integrated over the plasma poloidal\
    \ cross-section, $\\psi$ (Wb) is the poloidal magnetic flux, and $j_{\\phi}$ (A/m\xB2\
    ) is the toroidal current density. This global scalar is distinct from the normalized\
    \ internal inductance $l_i$, which is a dimensionless shape factor used in MHD\
    \ stability analysis. The plasma inductance is typically inferred from equilibrium\
    \ reconstruction codes (e.g., EFIT) and is closely related to the [mutual_inductance_of_flux_loop_due_to_induction](name:mutual_inductance_of_flux_loop_due_to_induction)\
    \ that couples the plasma to external diagnostics. Typical values for medium-size\
    \ tokamaks range from 0.5\u20132 \u03BCH, depending on the current profile peaking\
    \ and plasma geometry. The inductance increases as the current profile becomes\
    \ more peaked (larger $l_i$) and decreases as the plasma becomes more hollow."
  unit: H
  physics_domain: equilibrium
  links:
  - name:mutual_inductance_of_flux_loop_due_to_induction
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/plasma_inductance
    dd_path: equilibrium/time_slice/global_quantities/plasma_inductance
    status: composed
- name: plasma_resistance
  kind: scalar
  status: draft
  description: Effective bulk electrical resistance of the plasma column, relating
    the toroidal loop voltage to the total toroidal plasma current through Ohm's law.
  documentation: "The global plasma resistance $R_p$ quantifies the total resistive\
    \ dissipation of the toroidal current in the plasma column. It is defined via\
    \ the integral relation $R_p = \\int \\mathbf{E} \\cdot \\mathbf{j} \\, dV \\\
    ,/\\, I_p^2$, where $\\mathbf{E}$ is the electric field, $\\mathbf{j}$ is the\
    \ current density, and $I_p$ is the total toroidal plasma current [toroidal_total_plasma_current](name:toroidal_total_plasma_current).\
    \ This resistance is dominated by the Spitzer resistivity $\\eta \\propto Z_{\\\
    text{eff}} \\, T_e^{-3/2}$ and is therefore a sensitive function of the core electron\
    \ temperature $T_e$ and effective ion charge $Z_{\\text{eff}}$. Typical values\
    \ range from 1\u201310 $\\mu\\Omega$ in high-temperature H-mode plasmas to tens\
    \ of $\\mu\\Omega$ in L-mode, directly determining the Ohmic heating power [ohmic_power](name:ohmic_power)\
    \ deposited in the plasma. The plasma resistance is inferred from the measured\
    \ loop voltage and plasma current during the current flat-top phase of a discharge.\n\
    \nSign convention: Positive for passive resistive dissipation when toroidal loop\
    \ voltage and plasma current are aligned.\n\nThe global resistance is a lumped\
    \ parameter distinct from the local resistivity profile and is complementary to\
    \ the [mutual_inductance_of_flux_loop_due_to_induction](name:mutual_inductance_of_flux_loop_due_to_induction)\
    \ in the circuit equation of the plasma column."
  unit: ohm
  physics_domain: equilibrium
  links:
  - name:toroidal_total_plasma_current
  - name:ohmic_power
  - name:mutual_inductance_of_flux_loop_due_to_induction
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/plasma_resistance
    dd_path: equilibrium/time_slice/global_quantities/plasma_resistance
    status: composed
  - id: dd:summary/global_quantities/resistance/value
    dd_path: summary/global_quantities/resistance/value
    status: composed
- name: poloidal_angle
  kind: scalar
  status: draft
  description: Angular coordinate parameterizing positions along a flux surface in
    the poloidal plane, measured from the low-field-side midplane.
  documentation: 'The poloidal angle $\theta$ is an angular coordinate in the poloidal
    plane, measured from the outboard midplane of a given flux surface. It is a fundamental
    coordinate for describing plasma equilibrium and for mapping flux-surface quantities,
    such as pressure and current density. The poloidal angle is typically defined
    in the range $[0, 2\pi)$ or $(-\pi, \pi]$, increasing in the direction from the
    outboard midplane toward the lower divertor region. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, the poloidal angle is measured in radians originated at
    the outboard midplane (where $R > R_\text{axis}$, $Z = Z_\text{axis}$), providing
    a natural label for the poloidal location on a flux surface. The poloidal angle
    is related to the poloidal magnetic flux $\psi_\text{pol}$ and the safety factor
    $q$ through the differential relation $d\psi_\text{pol}/d\theta = -I(\psi_\text{pol})/(2\pi
    q(\psi_\text{pol}))$, where $I(\psi_\text{pol})$ is the diamagnetic function.
    Common ranges span $[0, 2\pi)$ for full poloidal coverage. Related standard names
    include [poloidal_magnetic_flux](name:poloidal_magnetic_flux) for the flux-surface
    label, [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis) for
    the field-line helicity parameter, and [straight_field_line_poloidal_angle](name:straight_field_line_poloidal_angle)
    for the flux-aligned version.


    Sign convention: Positive when the angle increases clockwise in the poloidal plane,
    which corresponds to increasing direction of the toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/ggd/theta/values
    dd_path: equilibrium/time_slice/ggd/theta/values
    status: composed
  - id: dd:gyrokinetics/wavevector/eigenmode/poloidal_angle
    dd_path: gyrokinetics/wavevector/eigenmode/poloidal_angle
    status: composed
  - id: dd:gyrokinetics_local/species_all/angle_pol
    dd_path: gyrokinetics_local/species_all/angle_pol
    status: composed
- name: poloidal_field_coil_current
  kind: scalar
  status: draft
  description: Measured electric current in a poloidal field coil used as a constraint
    in equilibrium reconstruction.
  documentation: "The measured current $I_{\\text{PF}}$ in a poloidal field coil is\
    \ a critical input constraint for axisymmetric equilibrium reconstruction codes,\
    \ which solve the Grad\u2013Shafranov equation to determine the plasma boundary\
    \ and internal current distribution. These measurements, obtained from calibrated\
    \ current transducers on each PF coil circuit, provide essential boundary conditions\
    \ that constrain the poloidal magnetic flux generated by the external coil set.\
    \ Typical values range from tens of kiloamperes in the central solenoid to several\
    \ kiloamperes in equilibrium shaping coils, depending on the tokamak size and\
    \ operating scenario. The reconstructed PF coil currents are compared against\
    \ these measured values to form a \u03C7\xB2 cost function that quantifies the\
    \ fit quality, alongside constraints from magnetic probes and flux loops. See\
    \ [passive_structure_current](name:passive_structure_current) for the analogous\
    \ quantity in passive structures.\n\nSign convention: Positive when the current\
    \ flows in the direction that generates a positive poloidal magnetic flux within\
    \ the plasma region.\n\nThe reconstructed counterpart [weight_of_poloidal_magnetic_field_probe](name:weight_of_poloidal_magnetic_field_probe)\
    \ (for magnetic probes) demonstrates the analogous statistical weighting applied\
    \ in the equilibrium reconstruction cost function."
  unit: A
  physics_domain: equilibrium
  links:
  - name:passive_structure_current
  - name:weight_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:equilibrium/time_slice/constraints/pf_current/measured
    dd_path: equilibrium/time_slice/constraints/pf_current/measured
    status: composed
- name: poloidal_magnetic_field
  kind: scalar
  status: draft
  description: The poloidal component of the magnetic field vector, providing the
    field that confines the plasma in the poloidal cross-section, generated primarily
    by the plasma current.
  documentation: "The poloidal magnetic field $B_\\theta = \\mathbf{B} \\cdot \\hat{\\\
    theta}$ is the projection of the total magnetic field vector onto the poloidal\
    \ direction. In a tokamak, the poloidal field is essential for the nested-flux-surface\
    \ topology that confines the plasma; it is produced by the toroidal plasma current\
    \ $I_p$ and is related to the poloidal magnetic flux $\\psi$ gradient by $B_\\\
    theta = -|\\nabla \\psi|/R$. The poloidal field direction determines the pitch\
    \ of the helical magnetic field lines and controls MHD stability through the safety\
    \ factor $q = d\\Phi/d\\psi$. Typical on-axis values are near zero, while the\
    \ poloidal field increases to 0.2\u20132 T at the plasma boundary in present-day\
    \ tokamaks. The poloidal field is inferred from external magnetic probe arrays\
    \ mounted at the vessel wall and is a primary constraint in equilibrium reconstruction\
    \ codes such as EFIT and LIUQE.\n\nSign convention: Positive when the poloidal\
    \ field points from the inboard to the outboard midplane on the low-field side.\n\
    \nSee the cylindrical $(R, \\phi, Z)$ components [radial_magnetic_field](name:radial_magnetic_field)\
    \ and [toroidal_magnetic_field](name:toroidal_magnetic_field), as well as the\
    \ scalar magnitude [magnetic_field_magnitude](name:magnetic_field_magnitude).\
    \ The poloidal magnetic flux [poloidal_magnetic_flux](name:poloidal_magnetic_flux)\
    \ is the integral of this component over a toroidal surface."
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field
  - name:magnetic_field_magnitude
  - name:poloidal_magnetic_flux
