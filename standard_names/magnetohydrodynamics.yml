- name: thermal_energy_decay_time_due_to_disruption
  kind: scalar
  status: draft
  description: Effective linear decay time for the decrease of thermal plasma energy
    during a disruption. It is the elapsed time between the upper normalized-energy
    fraction X2 and lower fraction X1 divided by the fractional drop X2 - X1.
  documentation: 'Thermal-energy decay time due to disruption is an effective linear
    time scale for the reduction of thermal plasma energy during the thermal quench.
    It characterizes the loss rate between two specified fractions of the pre-disruptive
    thermal energy and is not an exponential e-folding time.


    Let $t(X)$ be the time at which the normalized thermal energy $W_\mathrm{th}(t)/W_{\mathrm{th},0}$
    reaches the fraction $X$. With $X_2$ the upper fraction and $X_1$ the lower fraction,
    where $0 \le X_1 < X_2 \le 1$, the decay time is defined by:


    $$

    \tau_{W_\mathrm{th}} = \frac{t(X_1) - t(X_2)}{X_2 - X_1}

    $$


    where $W_\mathrm{th}$ and $W_{\mathrm{th},0}$ are thermal energies in joules,
    $t(X_1)$, $t(X_2)$, and $\tau_{W_\mathrm{th}}$ are in seconds, and $X_1$ and $X_2$
    are dimensionless fractions. For an 80%-to-20% definition, $X_2 = 0.8$, $X_1 =
    0.2$, and the denominator is $0.6$.


    In practice, $W_\mathrm{th}(t)$ is obtained from an analyzed thermal-energy time
    trace, with the pre-disruptive reference value chosen just before the rapid energy
    collapse. Threshold crossing times are commonly determined by interpolation, and
    smoothing or monotonicity checks may be used to avoid noise-induced multiple crossings.
    The chosen upper and lower fractions determine which portion of the thermal quench
    is summarized.


    Representative values in tokamak disruption thermal quenches are often 0.0001-0.01
    s, but the definition itself imposes no universal range; device size, plasma conditions,
    and threshold choice can shift the reported value.'
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:energy_upper_fraction_due_to_disruption
  - name:energy_lower_fraction_due_to_disruption
  - name:energy_decay_time_due_to_disruption
  sources:
  - id: dd:summary/disruption/decay_times/energy_thermal/linear_20_80/value
    dd_path: summary/disruption/decay_times/energy_thermal/linear_20_80/value
    status: composed
  - id: dd:summary/disruption/decay_times/energy_thermal/linear_custom/decay_time/value
    dd_path: summary/disruption/decay_times/energy_thermal/linear_custom/decay_time/value
    status: composed
- name: time_derivative_of_mode_width
  kind: scalar
  status: draft
  description: Instantaneous time derivative of the full magnetic island width for
    a tearing or neoclassical tearing mode. Positive values indicate island growth
    and negative values indicate shrinkage; a value near zero only means the width
    is locally stationary over the evaluated time interval.
  documentation: 'The time derivative of mode width is the instantaneous rate of change
    of the full width of a magnetic island associated with a tearing or neoclassical
    tearing mode. It applies to the full island width, not the island half-width,
    and should be interpreted together with the time history of [mode_width](name:radial_width_of_neoclassical_tearing_mode)
    because a near-zero derivative alone does not prove saturation or marginal stability.


    In generalized Rutherford modeling, a dimensionally consistent schematic balance
    for the full island width $W$ is


    $$

    \frac{dW}{dt} = \frac{r_s^2}{\tau_R}\,\Delta_{\mathrm{eff}}(W,t)

    $$


    where $W$ is the full island width in meters, $r_s$ is the resonant-surface minor
    radius in meters, $\tau_R$ is the resistive diffusion time in seconds, and $\Delta_{\mathrm{eff}}$
    is the net tearing-mode stability drive in m^-1. The effective drive may include
    classical tearing stability, bootstrap-current drive represented by quantities
    such as neoclassical_coefficient, polarization-current effects, and externally
    driven current terms; the factor $r_s^2/\tau_R$ converts an inverse-length drive
    into a width-evolution rate in m.s^-1.


    In practice, this quantity is obtained either by differentiating a time-resolved
    estimate of the full island width or directly from an island-evolution model.
    Because numerical differentiation amplifies noise, estimates are usually based
    on local fits, smoothing, or model-constrained evolution over a finite time interval.
    Its interpretation may be combined with other mode properties such as [mode_rotation_frequency](name:rotation_frequency_of_neoclassical_tearing_mode),
    but the rotation frequency does not by itself determine the island growth rate.


    Typical magnitudes vary widely with device size, resistive time, and stability
    drive. Slowly evolving neoclassical tearing modes often have magnitudes of about
    10^-4-10^-2 m.s^-1, while rapid growth or active-stabilization transients can
    reach about 10^-1-1 m.s^-1.


    Sign convention: Positive when the full magnetic island width increases with time.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_width_of_neoclassical_tearing_mode
  - name:rotation_frequency_of_neoclassical_tearing_mode
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/dwidth_dt
    dd_path: ntms/time_slice/mode/detailed_evolution/dwidth_dt
    status: composed
  - id: dd:ntms/time_slice/mode/dwidth_dt
    dd_path: ntms/time_slice/mode/dwidth_dt
