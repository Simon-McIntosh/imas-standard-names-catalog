    minor semi-axis is given by [z_component_of_shatter_cone_minor_unit_vector](name:z_component_of_shatter_cone_minor_unit_vector).


    Sign convention: Positive when $\hat{e}_{\mathrm{major}}$ has a component in the
    $+\hat{z}$ (upward vertical) direction.'
