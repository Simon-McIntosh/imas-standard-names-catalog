name: poloidal_component_of_tendency_of_ion_velocity
description: Partial time derivative of the poloidal component of the bulk ion fluid
  velocity, $\partial v_{\theta,i}/\partial t$.
documentation: "This quantity represents the rate of change $\\partial v_{\\theta,i}/\\\
  partial t$ (in $\\mathrm{m\\,s^{-1}}$ per second of evolution, but stored as the\
  \ instantaneous value in $\\mathrm{m\\,s^{-1}}$ per solver time step) of the poloidal\
  \ ion flow $v_{\\theta,i}$. In neoclassical theory, the poloidal ion velocity is\
  \ driven by the radial ion pressure gradient and the radial electric field $E_r$,\
  \ and relaxes toward the neoclassical prediction on a damping timescale $\\tau_{\\\
  theta,i} \\sim q^2 / \\nu_{ii}$, where $q$ is the safety factor (dimensionless)\
  \ and $\\nu_{ii}$ ($\\mathrm{s^{-1}}$) the ion-ion collision frequency. Rapid changes\
  \ in $v_{\\theta,i}$ occur during L\u2013H transitions, edge-localized mode (ELM)\
  \ crashes, and momentum injection transients, with typical poloidal flow speeds\
  \ of $10^2$\u2013$10^4\\;\\mathrm{m\\,s^{-1}}$ in the core and evolution timescales\
  \ on the order of milliseconds. The time derivative enters the ion poloidal momentum\
  \ balance and is essential for self-consistent evolution of the radial electric\
  \ field profile and the $\\mathbf{E}\\times\\mathbf{B}$ flow shear that regulates\
  \ turbulent transport. When multiple charge states are tracked, this quantity may\
  \ represent either the charge-state-averaged or state-resolved tendency. See also\
  \ `toroidal_component_of_tendency_of_ion_velocity` for the toroidal counterpart\
  \ and `poloidal_component_of_tendency_of_electron_velocity` for the electron channel."
kind: vector_component
unit: m.s^-1
