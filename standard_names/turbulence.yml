  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_0/v_perpendicular_square_energy
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_0/v_perpendicular_square_energy
    status: composed
- name: perpendicular_normalized_gyrocenter_perturbed_pressure
  kind: scalar
  status: draft
  description: Dimensionless perpendicular gyrotropic pressure moment of the perturbed
    gyrocenter distribution function for a linear gyrokinetic eigenmode, normalized
    to a reference thermal pressure.
  documentation: 'The perpendicular normalized gyrocenter perturbed pressure is the
    second velocity-space moment of the perturbed gyrocenter distribution function
    $\delta f_s$, integrated with the perpendicular kinetic-energy weight and normalized
    by a reference thermal pressure $p_{\mathrm{ref}} = n_{\mathrm{ref}} T_{\mathrm{ref}}$.
    It characterizes the perturbation to the gyrotropic pressure component in the
    plane orthogonal to the background magnetic field $\mathbf{B}_0$ for a given linear
    gyrokinetic eigenmode.


    The defining velocity-space integral is:


    $$

    \delta \tilde{p}_{\perp} = \frac{1}{p_{\mathrm{ref}}} \int \frac{m_s v_{\perp}^2}{2}
    \, \delta f_s \, d^3v

    $$


    where $m_s$ is the particle mass, $v_{\perp}$ is the gyrocenter speed perpendicular
    to $\mathbf{B}_0$, and $\delta f_s$ is the perturbed gyrocenter distribution function.
    The absence of the $J_0(k_{\perp} \rho_s)$ gyroaveraging factor distinguishes
    this moment from [normalized_perpendicular_gyroaveraged_gyrocenter_perturbed_pressure](name:normalized_perpendicular_gyroaveraged_gyrocenter_perturbed_pressure),
    where $k_{\perp}$ is the perpendicular wavenumber and $\rho_s$ is the species
    Larmor radius.


    This moment is computed in local delta-f flux-tube gyrokinetic simulations as
    part of the linear eigenmode structure. It is the second (perpendicular) entry
    of the ordered component pair in [normalized_gyrocenter_perturbed_pressure](name:normalized_gyrocenter_perturbed_pressure),
    complementing [parallel_normalized_gyrocenter_perturbed_pressure](name:parallel_normalized_gyrocenter_perturbed_pressure)
    which carries the parallel component. Together these two moments fully characterize
    the gyrotropic pressure response of each kinetic species to the eigenmode perturbation.


    Sign convention: Positive when the perturbed gyrocenter distribution contributes
    a net increase in perpendicular thermal pressure relative to the local equilibrium
    value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perpendicular_gyroaveraged_gyrocenter_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_pressure
  - name:parallel_normalized_gyrocenter_perturbed_pressure
