- name: parallel_component_of_toroidal_momentum_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: Gyrobohm-normalized toroidal angular momentum flux driven by the perturbed
    electrostatic potential, projected onto the equilibrium magnetic field direction
    and summed over all species, time-averaged and flux-surface-averaged.
  documentation: 'The parallel component of the toroidal angular momentum flux due
    to the electrostatic potential quantifies the transport of toroidal angular momentum
    along the equilibrium magnetic field direction $\hat{b} = \mathbf{B}/|\mathbf{B}|$
    that is driven by the perturbed electrostatic potential $\delta\phi$.


    The total toroidal momentum flux vector $\boldsymbol{\Pi}_\phi^{\delta\phi}$ admits
    a geometric decomposition into parallel and perpendicular parts:


    $$\boldsymbol{\Pi}_\phi^{\delta\phi} = \Pi_{\phi,\parallel}^{\delta\phi}\,\hat{b}
    + \Pi_{\phi,\perp}^{\delta\phi}\,(\hat{b}\times\hat{\phi})\times\hat{b}/|\hat{b}\times\hat{\phi}|$$


    The parallel component is obtained as the projection


    $$\Pi_{\phi,\parallel}^{\delta\phi} = \hat{b}\cdot\boldsymbol{\Pi}_\phi^{\delta\phi}
    = \left\langle \sum_s m_s \int d^3v\, R\,v_\phi\, \mathbf{v}_{E\times B}^{\delta\phi}\cdot\hat{b}\,
    \delta f_s \right\rangle_{\!t,\psi}$$


    where the sum runs over all kinetic species $s$, $m_s$ is the species mass, $R\,v_\phi$
    is the toroidal angular momentum per particle with $R$ the major radius in the
    cylindrical $(R,\phi,Z)$ frame, $\mathbf{v}_{E\times B}^{\delta\phi}$ is the $E\times
    B$ drift velocity arising from $\delta\phi$, $\delta f_s$ is the perturbed distribution
    function, and $\langle\cdots\rangle_{t,\psi}$ denotes time-averaging and flux-surface-averaging.


    The quantity is normalized by the gyrobohm momentum-flux scale


    $$\Pi_\mathrm{gB} = n_0\, m_i\, v_{\mathrm{th},i}^2\,\left(\frac{\rho_i}{a}\right)^2$$


    where $n_0$ is the reference density, $m_i$ the reference ion mass, $v_{\mathrm{th},i}
    = \sqrt{2T_{0,i}/m_i}$ the ion thermal speed, $\rho_i = v_{\mathrm{th},i}/\Omega_i$
    the ion thermal Larmor radius, and $a$ the minor radius. The normalized quantity
    is therefore dimensionless.


    In typical nonlinear gyrokinetic turbulence, $\Pi_{\phi,\parallel}^{\delta\phi}/\Pi_\mathrm{gB}$
    is of order $10^{-3}$ to $10^{-1}$, depending on toroidal rotation, gradient drives,
    and collisionality. The electrostatic channel is usually the dominant contributor
    to toroidal momentum transport in low-$\beta$ plasmas.


    Sign convention: Positive when the net species-summed toroidal angular momentum
    flux projected along $\hat{b}$ is directed toward increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: turbulence
