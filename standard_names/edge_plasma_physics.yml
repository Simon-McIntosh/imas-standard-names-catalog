- name: toroidal_hydrogen_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Local toroidal component of the hydrogen-ion bulk-flow velocity at
    the plasma boundary, density-weighted over all hydrogen charge states.
  documentation: 'The quantity is the local hydrogen-ion bulk-flow velocity component
    tangent to the toroidal direction at the plasma boundary, rather than a flux-surface
    average. Hydrogen denotes the combined hydrogen-ion population.


    The toroidal component is defined by


    $$

    v_{phi,H}(R,Z)=\mathbf{v}_H(R,Z)\cdot\hat{\phi},\qquad \mathbf{v}_H=\frac{\sum_q
    n_{H,q}\mathbf{v}_{H,q}}{\sum_q n_{H,q}}

    $$


    where $\mathbf{v}_H$ is the hydrogen bulk-flow velocity, $\hat{\phi}$ is the toroidal
    unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame, $n_{H,q}$ is
    the density of hydrogen charge state $q$, and $\mathbf{v}_{H,q}$ is its bulk-flow
    velocity. The coordinates $R$ and $Z$ are major radius and vertical height, respectively.
    The local quantity is distinct from the [toroidal flux-surface-averaged hydrogen
    velocity at the plasma boundary](name:toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary).


    Sign convention: Positive when the hydrogen bulk flow points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
