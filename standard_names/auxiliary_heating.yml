- name: thermal_ion_power
  kind: scalar
  status: draft
  description: Total RF wave power absorbed by the bulk Maxwellian (thermal) ion population
    from a coherent wave, volume-integrated over the entire plasma.
  documentation: "Thermal ion power is the net rate at which a coherent RF wave deposits\
    \ energy into the bulk Maxwellian ion distribution, integrated over the entire\
    \ plasma volume. As the thermal ion-channel component of [ion_power](name:ion_power),\
    \ it isolates wave energy transferred directly to the thermal bulk, distinct from\
    \ absorption by suprathermal populations captured by [fast_ion_power](name:fast_ion_power).\n\
    \nThe absorbed power follows from the volume integral of the wave\u2013plasma\
    \ energy coupling:\n\n$$\nP_{\\rm th,i} = \\frac{1}{2} \\int_V \\mathrm{Re}\\\
    !\\left(\\mathbf{J}_{\\rm th,i}^* \\cdot \\mathbf{E}\\right) dV\n$$\n\nwhere $\\\
    mathbf{J}_{\\rm th,i}$ is the thermal ion current density driven by the coherent\
    \ wave electric field $\\mathbf{E}$, and $V$ is the plasma volume.\n\nFull-wave\
    \ or ray-tracing codes that incorporate the Maxwellian ion dielectric response\
    \ (via the plasma dispersion function) are used to evaluate this quantity. Together\
    \ with [thermal_electron_power](name:thermal_electron_power), [fast_ion_power](name:fast_ion_power),\
    \ and [fast_electron_power](name:fast_electron_power), it partitions [absorbed_power](name:absorbed_power)\
    \ across all plasma populations. In ion cyclotron resonance heating, the fraction\
    \ directed to the thermal bulk versus fast minority ions depends on the resonance\
    \ harmonic, minority concentration, and wave polarization at the resonance layer.\
    \ The spatially resolved volumetric deposition per toroidal mode is described\
    \ by [per_toroidal_mode_thermal_ion_power_density](name:per_toroidal_mode_thermal_ion_power_density)."
  unit: W
  physics_domain: auxiliary_heating
