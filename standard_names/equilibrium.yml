- name: flux_surface_averaged_square_of_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Flux-surface average of the squared magnitude of the total equilibrium
    magnetic field, providing a geometric coefficient for equilibrium and neoclassical
    transport relations.
  documentation: 'This quantity is the surface-averaged squared strength of the total
    magnetic field on a nested magnetic flux surface. It is a geometric metric coefficient
    used in equilibrium descriptions and in bounce-averaged and neoclassical transport
    relations.


    The flux-surface average is defined by


    $$

    \left\langle B^2 \right\rangle_\psi = \frac{\displaystyle\oint_{S(\psi)} \frac{B^2}{\lvert\nabla\psi\rvert}\,dS}{\displaystyle\oint_{S(\psi)}
    \frac{1}{\lvert\nabla\psi\rvert}\,dS}

    $$


    where $B^2$ is the [square of the magnetic-field magnitude](name:square_of_magnetic_field_magnitude),
    $\psi$ is the poloidal magnetic-flux label of the surface, $S(\psi)$ is the closed
    magnetic flux surface with that label, $\nabla\psi$ is the gradient of the flux
    label, and $dS$ is the surface-area element.


    The quantity applies to the total equilibrium magnetic field, including all of
    its components, and is aggregated over each closed flux surface with the inverse-$\lvert\nabla\psi\rvert$
    weighting shown above. It is not the pointwise value of $B^2$, the square of a
    flux-surface-averaged magnetic-field magnitude, or a single magnetic-field component.


    It is the flux-surface-averaged form of [square_of_magnetic_field_magnitude](name:square_of_magnetic_field_magnitude).
    It differs from [flux_surface_averaged_magnetic_field_magnitude](name:flux_surface_averaged_magnetic_field_magnitude),
    which averages the field magnitude before squaring, and from [flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude](name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude),
    which averages its reciprocal.'
  unit: T^2
  physics_domain: equilibrium
