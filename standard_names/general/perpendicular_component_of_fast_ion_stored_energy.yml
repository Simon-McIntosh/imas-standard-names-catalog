name: perpendicular_component_of_fast_ion_stored_energy
status: draft
description: Volume-integrated kinetic energy of fast (suprathermal) ions associated
  with motion perpendicular to the magnetic field.
documentation: 'The perpendicular fast-ion stored energy $W_{\mathrm{fast},\perp}$
  (in J) is the integral over the plasma volume of the kinetic energy carried by suprathermal
  ions in the direction perpendicular to the local magnetic field: $W_{\mathrm{fast},\perp}
  = \int \frac{1}{2} m_i v_\perp^2 f_{\mathrm{fast}}\,d^3v\,dV$, where $v_\perp$ is
  the velocity component perpendicular to $\mathbf{B}$ and $f_{\mathrm{fast}}$ the
  fast-ion distribution function. A dominant perpendicular component indicates trapped-particle-rich
  populations typical of perpendicular neutral beam injection or ion cyclotron resonance
  heating (ICRH). In ITER-class devices $W_{\mathrm{fast},\perp}$ can reach several
  hundred kJ during ICRH minority heating. Diagnostics include neutral particle analyzers
  (NPA), FIDA, and gamma-ray spectroscopy; orbit-following codes provide complementary
  predictions. The total fast-ion energy satisfies $W_{\mathrm{fast}} = W_{\mathrm{fast},\parallel}
  + W_{\mathrm{fast},\perp}$. See `parallel_component_of_fast_ion_stored_energy` for
  the parallel contribution.'
