- name: major_radius_of_current_center
  kind: scalar
  status: draft
  description: Current-weighted major-radius coordinate of the centroid of the toroidal
    plasma current distribution in a poloidal cross-section.
  documentation: 'The current-center major radius locates the radial centroid of the
    toroidal plasma current distribution in the right-handed cylindrical $(R, \phi,
    Z)$ system, where $R$ is distance from the toroidal symmetry axis and $Z$ is vertical
    height. It complements the [vertical coordinate of the current center](name:vertical_coordinate_of_current_center)
    and can differ from both the [magnetic-axis major radius](name:major_radius_of_magnetic_axis)
    and the [geometric-axis major radius](name:major_radius_of_geometric_axis) when
    the current profile is asymmetric or vertically displaced.


    For an axisymmetric equilibrium, the current-weighted centroid is defined over
    the plasma poloidal cross-section $S$ by


    $$

    R_J = \frac{1}{I_p}\int_S R\, j_\phi(R,Z)\, dS

    $$


    where $R_J$ is the current-center major radius, $j_\phi$ is the [toroidal plasma
    current density](name:toroidal_plasma_current_density), $dS$ is an element of
    poloidal cross-sectional area, and $I_p = \int_S j_\phi\,dS$ is the [plasma current].


    This quantity is computed from equilibrium reconstruction by integrating the reconstructed
    toroidal current density over the plasma cross-section, with constraints from
    magnetic probes, flux loops, polarimetry, motional-Stark-effect measurements,
    and kinetic pressure information when available.


    Representative values are close to the device major radius: about 1-3 m in medium-size
    tokamaks and 6-7 m in reactor-scale devices. Differences between the current center
    and magnetic or geometric axes are often a few centimeters to several tens of
    centimeters, depending on shaping, pressure, current-profile peaking, and vertical
    position control.


    Sign convention: Positive when measured outward from the toroidal symmetry axis
    in the $+R$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_current_center
  - name:major_radius_of_magnetic_axis
  - name:major_radius_of_geometric_axis
  - name:toroidal_plasma_current_density
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/r
    dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    status: composed
- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Horizontal center position of the plasma cross-section, expressed as
    the major-radius coordinate in the tokamak geometry.
  documentation: 'The major radius of the geometric axis is the $R$ coordinate of
    the geometric center of a closed plasma cross-section in the right-handed cylindrical
    $(R, \phi, Z)$ frame. It describes the horizontal placement of the plasma shape
    independently of the magnetic-axis location, which is captured by [major radius
    of magnetic axis](name:major_radius_of_magnetic_axis). Together with the [vertical
    coordinate of geometric axis](name:vertical_coordinate_of_geometric_axis), it
    specifies the geometric center used in equilibrium shape characterization.


    For an axisymmetric closed contour, the geometric-axis major radius is commonly
    defined from the inner and outer radial extrema:


    $$

    R_{\mathrm{geo}} = \frac{R_{\mathrm{out}} + R_{\mathrm{in}}}{2}

    $$


    where $R_{\mathrm{out}}$ and $R_{\mathrm{in}}$ are the outermost and innermost
    major-radius coordinates of the contour. The related quantities [outer major radius
    of flux surface](name:outer_major_radius_of_flux_surface) and [inner major radius
    of flux surface](name:inner_major_radius_of_flux_surface) provide these extrema
    for individual flux surfaces.


    This quantity is computed from equilibrium reconstruction by locating the radial
    extrema of the reconstructed boundary or flux-surface contour; magnetic probes,
    flux loops, and internal constraints improve the inferred plasma position. Typical
    values range from about 0.5-1.5 m in compact tokamaks, 1.5-3.5 m in medium-size
    devices, and near 6 m in large reactor-scale configurations.


    Sign convention: Positive when the geometric axis lies at positive major radius
    $R$ measured outward from the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  - name:vertical_coordinate_of_geometric_axis
  - name:outer_major_radius_of_flux_surface
  - name:inner_major_radius_of_flux_surface
