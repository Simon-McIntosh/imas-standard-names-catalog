      kind: llm
- name: volume_of_plasma_boundary
  kind: scalar
  status: active
  description: Volume enclosed by the plasma boundary, representing the total confined-plasma
    region inside the last closed magnetic flux surface.
  documentation: 'This quantity is the geometric volume of the confined plasma enclosed
    by the plasma boundary, identified with the last closed magnetic flux surface.
    It represents the full enclosed region rather than a local flux-surface shell
    or material volume.


    The volume is defined by


    $$

    V = \int_{\Omega_{\mathrm{plasma}}} d^3\mathbf{x}

    $$


    where $V$ is the enclosed plasma volume, $\Omega_{\mathrm{plasma}}$ is the spatial
    domain inside the plasma boundary, and $d^3\mathbf{x}$ is the differential volume
    element at position $\mathbf{x}$.


    The integration domain is the entire confined-plasma region bounded by the last
    closed magnetic flux surface, and the result is the total volume aggregated over
    that domain. It excludes regions outside the plasma boundary and volumes belonging
    to material structures or other non-confined regions.


    This quantity is the terminal enclosed value of [volume of a flux surface](name:volume_of_flux_surface)
    when the flux surface coincides with the plasma boundary. It provides the integration
    domain for volume-averaged quantities such as [volume-averaged ion temperature](name:volume_averaged_ion_temperature).'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:volume_of_flux_surface
  sources:
