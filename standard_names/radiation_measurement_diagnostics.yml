- name: normalized_count_at_detector_pixel
  kind: scalar
  status: active
  description: Normalized count at detector pixel is the detector-pixel count divided
    by a positive count-equivalent reference from the same acquisition frame. It also
    covers count rates when numerator and reference use identical exposure normalization.
  documentation: 'Normalized count at detector pixel is the detector-pixel count divided
    by a positive count-equivalent reference from the same acquisition frame. The
    reference is a relative scale for that frame and must be common to the detector
    pixels whose normalized values are compared.


    The defining ratio for detector pixel $p$ is


    $$

    C_\mathrm{norm}(p) = \frac{C(p)}{C_\mathrm{ref}}, \qquad C_\mathrm{ref} > 0

    $$


    where $C_\mathrm{norm}(p)$ is the normalized count, $C(p)$ is the [count at detector
    pixel], and $C_\mathrm{ref}$ is the positive count-equivalent reference for the
    same acquisition frame.


    The same definition applies to count rates or exposure-normalized count-equivalent
    signals only when $C(p)$ and $C_\mathrm{ref}$ use identical time or exposure normalization.
    The quantity is a relative normalization; it does not specify whether $C_\mathrm{ref}$
    is a total-frame, peak, mean, or externally specified reference count, and it
    is distinct from an absolute calibration factor.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/frame/counts_bin_n
    dd_version: 4.1.0
