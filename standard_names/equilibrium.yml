- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: draft
  description: Height of the magnetic-axis point where nested poloidal flux surfaces
    contract to their innermost closed contour.
  documentation: 'The vertical coordinate of the magnetic axis is the $Z_\mathrm{axis}$
    position of the innermost closed magnetic flux surface in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. Together
    with [major radius of magnetic axis](name:major_radius_of_magnetic_axis), it locates
    the center of the equilibrium flux-surface topology rather than the purely geometric
    center described by [vertical coordinate of geometric axis](name:vertical_coordinate_of_geometric_axis).


    The magnetic axis is identified as a stationary point of the poloidal magnetic
    flux $\psi(R,Z)$:


    $$

    \nabla_{R,Z}\psi(R_\mathrm{axis}, Z_\mathrm{axis}) = 0

    $$


    where $\psi$ is the poloidal magnetic flux, and $R_\mathrm{axis}$ and $Z_\mathrm{axis}$
    are the major-radius and vertical coordinates of that stationary point.


    It is computed from magnetic-equilibrium reconstruction constrained by external
    magnetic probes, flux loops, plasma-boundary information, and internal pitch-angle
    measurements when available. In controlled tokamak plasmas, values often remain
    within about -0.2-0.2 m of the device midplane, while deliberately vertically
    shifted equilibria or transient control excursions can reach several tenths of
    a meter. Its position is also relevant when comparing axis-local quantities such
    as [toroidal magnetic field at magnetic axis](name:toroidal_magnetic_field_at_magnetic_axis)
    and vertical reference points such as the [vertical coordinate of an X-point](name:vertical_coordinate_of_x_point).


    Sign convention: Positive when the magnetic axis lies in the +Z direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  - name:vertical_coordinate_of_geometric_axis
  - name:toroidal_magnetic_field_at_magnetic_axis
  - name:vertical_coordinate_of_x_point
