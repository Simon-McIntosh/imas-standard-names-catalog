- name: magnetic_shear_at_pedestal_top
  kind: scalar
  status: active
  description: Magnetic shear evaluated at the H-mode pedestal top, defined as the
    normalized logarithmic derivative of the safety factor with respect to normalized
    toroidal flux radius.
  documentation: 'Magnetic shear at the pedestal top is the value of [magnetic shear](name:magnetic_shear)
    at the core-side shoulder of the H-mode edge transport barrier.


    Using the normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$ as the radial
    label, the defining relation is


    $$

    s_{\mathrm{ped}} = \left.\frac{\rho_{\mathrm{tor,norm}}}{q}\frac{dq}{d\rho_{\mathrm{tor,norm}}}\right|_{\rho_{\mathrm{tor,norm}}=\rho_{\mathrm{ped}}}

    $$


    where $q$ is the safety factor, $\rho_{\mathrm{ped}}$ is the normalized toroidal
    flux radius of the pedestal top, and $s_{\mathrm{ped}}$ is the corresponding magnetic
    shear. This is a point evaluation at the pedestal-top location, distinct from
    the flux-surface-averaged [magnetic shear at the plasma boundary](name:magnetic_shear_at_plasma_boundary)
    and from magnetic shear at the magnetic axis.


    Sign convention: Positive when $q^{-1}dq/d\rho_{\mathrm{tor,norm}}$ is positive
    as the normalized toroidal flux radius increases outward from the magnetic axis.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_plasma_boundary
- name: magnetic_shear_at_plasma_boundary
  kind: scalar
  status: active
  description: Magnetic shear evaluated at the plasma boundary, equal to the normalized
    logarithmic derivative of the safety factor with respect to normalized toroidal
    flux radius, flux-surface averaged over the separatrix.
  documentation: "Magnetic shear at the plasma boundary is the flux-surface average\
    \ of [magnetic shear] over the outermost closed flux surface \u2014 the separatrix\
    \ bounding the confined plasma from the scrape-off layer.\n\nUsing the [normalized\
    \ toroidal flux coordinate](name:normalized_toroidal_flux_coordinate) $\\rho_{\\\
    mathrm{tor,norm}}$ as the radial label ($\\rho_{\\mathrm{tor,norm}} = 1$ at the\
    \ separatrix), the defining relation is\n\n$$\ns_{\\mathrm{bdy}} = \\left\\langle\
    \ \\frac{\\rho_{\\mathrm{tor,norm}}}{q} \\frac{dq}{d\\rho_{\\mathrm{tor,norm}}}\
    \ \\right\\rangle_{\\mathrm{sep}}\n$$\n\nwhere $q$ is the safety factor and $\\\
    langle \\cdot \\rangle_{\\mathrm{sep}}$ denotes the flux-surface average over\
    \ the separatrix.\n\nThis boundary evaluation is distinct from interior counterparts\
    \ such as [magnetic_shear_at_pedestal_top](name:magnetic_shear_at_pedestal_top)\
    \ and [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis),\
    \ which are evaluated on flux surfaces interior to the last closed flux surface.\n\
    \nSign convention: Positive when $q^{-1}dq/d\\rho_{\\mathrm{tor,norm}}$ is positive\
    \ as $\\rho_{\\mathrm{tor,norm}}$ increases outward at the separatrix."
  unit: '1'
  physics_domain: edge_plasma_physics
