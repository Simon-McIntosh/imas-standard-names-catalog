    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-position-theta
    dd_documentation:
      leaf: Poloidal angle (oriented clockwise when viewing the poloidal cross section
