    where $N_i$ is the number of entities of type $i$ in the outer layer and $a_i$
    is the number of atoms in each entity. This layer-restricted quantity contributes
    to [atomic count of pellet](name:atomic_count_of_pellet); together with [core
    atomic count of pellet](name:core_atomic_count_of_pellet), it partitions the pellet''s
    atomic inventory when those are the defined material layers. The count is unnormalized
    and excludes separately counted propellant-gas molecules.'
