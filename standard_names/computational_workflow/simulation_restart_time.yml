name: simulation_restart_time
status: draft
cocos_transformation_type: one_like
description: Simulation time corresponding to the most recent checkpoint from which
  the run can be resumed, in seconds relative to pulse start.
documentation: "The simulation restart time $t_{\\mathrm{restart}}$ records the simulation\
  \ clock at which the last valid checkpoint (restart dump) was written to persistent\
  \ storage. When a simulation is resumed, the solver initializes all state variables\
  \ from the checkpoint and advances from $t_{\\mathrm{restart}}$ toward $t_{\\mathrm{end}}$.\
  \ This quantity is essential for fault-tolerant execution of long integrated-modeling\
  \ runs where wall-clock limits or hardware failures necessitate periodic restarts.\
  \ A value of $t_{\\mathrm{restart}} = 0$ typically indicates that no restart has\
  \ occurred. In practice, restart dumps are written at user-specified intervals (e.g.,\
  \ every 0.5\u20135 s of simulated time) depending on storage cost and acceptable\
  \ re-computation overhead. See `simulation_current_time` for the instantaneous solver\
  \ clock and `simulation_end_time` for the target termination."
