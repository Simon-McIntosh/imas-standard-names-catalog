- name: poloidal_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: active
  description: Poloidal component of the current density generated by perpendicular
    viscous stress, directed along increasing poloidal angle on a labeled magnetic
    flux surface.
  documentation: 'The poloidal current density due to perpendicular viscosity is the
    poloidal projection of the current-density contribution generated by the divergence
    of the perpendicular viscous stress tensor in a magnetized plasma. It represents
    the component tangent to a magnetic flux surface in the poloidal plane.


    $$

    J_{\pi_\perp,\theta}=\mathbf{J}_{\pi_\perp}\cdot\hat{\mathbf e}_\theta=\frac{\left[\mathbf{B}\times(\nabla\cdot\boldsymbol{\pi}_\perp)\right]\cdot\hat{\mathbf
    e}_\theta}{B^2}

    $$


    Here $\mathbf{J}_{\pi_\perp}$ is the perpendicular-viscosity current-density contribution,
    $\mathbf{B}$ is the magnetic field, $B=|\mathbf{B}|$ is its magnitude, $\boldsymbol{\pi}_\perp$
    is the perpendicular viscous stress tensor, and $\hat{\mathbf e}_\theta$ is the
    unit tangent toward increasing poloidal angle $\theta$ in flux coordinates $(\rho,\theta,\phi)$.
    The component is resolved in the poloidal plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame.


    This component is one projection of [current density due to perpendicular viscosity](name:current_density_due_to_perpendicular_viscosity)
    and is distinct from the toroidal projection [toroidal current density due to
    perpendicular viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity).
    It is also the perpendicular-viscosity contribution to [poloidal current density
    due to viscosity](name:poloidal_current_density_due_to_viscosity), which includes
    other viscous mechanisms.


    Sign convention: Positive when the current-density projection points toward increasing
    poloidal angle $\theta$ in flux coordinates $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
