- name: neon_fraction
  kind: scalar
  status: draft
  description: Neon fraction is the ratio of the volume-averaged total neon particle
    density, summed over all ionization states, to the volume-averaged electron density.
    It is dimensionless and represents the plasma-wide neon concentration relative
    to electrons.
  documentation: 'Neon fraction is a dimensionless impurity concentration measuring
    how much neon is present in the plasma relative to electrons. The neon density
    includes neutral and ionized neon populations summed over all charge states before
    the plasma-volume average is formed.


    The volume-averaged neon fraction is defined by


    $$

    f_{\mathrm{Ne}} = \frac{\left\langle \sum_{q=0}^{10} n_{\mathrm{Ne}^{q+}} \right\rangle_V}{\langle
    n_e \rangle_V}

    $$


    where $n_{\mathrm{Ne}^{q+}}$ is the number density of neon in charge state $q$
    in m^-3, $n_e$ is the electron density in m^-3, and $\langle \cdot \rangle_V =
    V^{-1}\int_V (\cdot)\,dV$ denotes a plasma-volume average over volume $V$. The
    numerator is the [volume-averaged neon density](name:volume_averaged_neon_density),
    and the denominator is the volume-averaged electron density.


    In practice, neon fraction is inferred from plasma composition analysis using
    impurity spectroscopy, radiation measurements, charge-state balance modeling,
    and electron-density information. It should be interpreted as a global composition
    measure, not as a local impurity abundance at a particular radius or viewing chord.


    Typical values are much less than unity. Background neon levels in plasmas without
    deliberate neon injection are often below $10^{-4}$-$10^{-3}$, while neon-seeded
    radiating plasmas can reach about $10^{-3}$-$10^{-2}$ depending on fueling, confinement,
    and exhaust conditions.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_neon_density
  - name:nitrogen_fraction
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  sources:
  - id: dd:summary/composition/neon/value
    dd_path: summary/composition/neon/value
    status: composed
- name: neutral_fraction
  kind: scalar
  status: draft
  description: Dimensionless fraction of a hydrogen-isotope neutral population component
    (cold recycled or hot charge-exchange neutrals) relative to the total neutral
    atom population.
  documentation: 'The neutral fraction is a dimensionless ratio bounded in $[0, 1]$
    expressing the relative abundance of a defined component of the hydrogen-isotope
    neutral population. In the standard two-component neutral model, cold recycled
    neutrals and charge-exchange-born hot neutrals partition the neutral atom inventory,
    and their respective fractions sum to unity.


    The fraction for a given component is defined as:


    $$

    f_{\mathrm{component}} = \frac{n_{\mathrm{component}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $n_{\mathrm{component}}$ is the number density of the specified neutral
    component and $n_{\mathrm{cold}}$, $n_{\mathrm{hot}}$ are the cold and hot neutral
    number densities respectively.


    The component fractions are inferred from Doppler-broadening analysis of visible
    hydrogen-isotope spectral emission lines, in which the cold and hot neutral populations
    contribute distinct narrow and broad Gaussian components to the line shape. The
    [cold_neutral_fraction](name:cold_neutral_fraction) characterizes the low-energy
    recycled neutral component, while [hot_neutral_fraction](name:hot_neutral_fraction)
    gives the charge-exchange-born component; together they form a complete partition
    of the neutral population. The energy threshold separating the two components
    must be specified by the diagnostic or population model employed.


    Sign convention: Positive when the specified neutral component density is greater
    than zero.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  - name:hot_neutral_fraction
- name: cold_neutral_fraction
  kind: scalar
  status: draft
  description: Cold neutral fraction is the dimensionless fraction of a hydrogen-isotope
    neutral population assigned to the low-energy neutral component. It is defined
    relative to the cold and hot neutral components used in the analysis; the cold/hot
    boundary must be specified by the diagnostic or population model.
  documentation: 'The cold neutral fraction is the population fraction of neutral
    atoms of a specified hydrogen isotope that are classified as cold, meaning lower
    in kinetic energy than the corresponding hot neutral component. The classification
    boundary between cold and hot neutrals is not universal; it is set by the diagnostic
    interpretation, spectral decomposition, or population model used for the isotope
    being analyzed.


    For a two-component cold/hot decomposition, the cold neutral fraction is


    $$

    f_\mathrm{cold} = \frac{n_\mathrm{cold}}{n_\mathrm{cold} + n_\mathrm{hot}}

    $$


    where $n_\mathrm{cold}$ and $n_\mathrm{hot}$ are the cold and hot neutral number
    densities for the same isotope, typically in $\mathrm{m}^{-3}$. For nonnegative
    densities this gives $0 \le f_\mathrm{cold} \le 1$. If additional neutral populations
    are treated separately or excluded from the decomposition, the fraction applies
    only to the cold-plus-hot population used in the denominator.


    In visible spectroscopy, this fraction is commonly inferred by separating emission
    associated with low-energy recycled or thermal neutrals from emission associated
    with higher-energy neutrals, using line shapes, Doppler broadening, line ratios,
    and collisional-radiative modeling. The inferred value depends on the adopted
    cold/hot energy threshold and on corrections for atomic physics rates, viewing
    geometry, and instrument response.


    Typical values can span the full range 0-1. Values near 1 indicate that the represented
    neutral population is dominated by low-energy recycled or thermal neutrals, while
    values near 0 indicate dominance by the hot neutral component, for example from
    energetic charge-exchange populations or beam-related neutrals.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_fraction
  - name:neutral_fraction
  arguments:
  - name: neutral_fraction
    operator: cold
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    status: composed
- name: hot_neutral_fraction
  kind: scalar
  status: draft
  description: Fraction of charge-exchange-born hot neutral atoms in the total neutral
    population of a hydrogen isotope, assuming a two-component hot-plus-cold neutral
    partition. It is the hot neutral density divided by the sum of hot and cold neutral
    densities.
  documentation: 'Hot neutral fraction is the dimensionless abundance of fast neutral
    atoms produced mainly by charge exchange relative to all neutral atoms of the
    same hydrogen isotope in a two-component neutral model. The complementary population
    is the cold neutral component, so the modeled total neutral density is the sum
    of hot and cold neutral densities.


    The defining ratio is:


    $$

    f_\mathrm{hot} = \frac{n_\mathrm{hot}}{n_\mathrm{hot} + n_\mathrm{cold}}

    $$


    where $n_\mathrm{hot}$ and $n_\mathrm{cold}$ are the hot and cold neutral number
    densities in $m^{-3}$ for the same isotope and physical region.


    In visible spectroscopy, hot and cold neutral contributions may be inferred from
    line-shape components, such as Doppler-broadened charge-exchange emission and
    colder recycling or fueling emission. The measured component intensities are not
    density fractions by themselves; converting them to $f_\mathrm{hot}$ requires
    an emissivity or collisional-radiative model that accounts for excitation, charge
    exchange, ionization, neutral velocity distributions, instrument response, and
    line-of-sight integration.


    By definition $0 \le f_\mathrm{hot} \le 1$. Values near 0 indicate a cold-neutral-dominated
    population, while values near 1 indicate a hot-neutral-dominated population; the
    realized value is strongly dependent on plasma conditions, neutral sources, charge-exchange
    rates, and the observation region.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  - name:neutral_fraction
  arguments:
  - name: neutral_fraction
    operator: hot
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_fraction
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_fraction
    status: composed
- name: neutron_flux_due_to_beam_beam_fusion
  kind: scalar
  status: draft
  description: Total neutron emission rate from beam-beam fusion, summing the neutron-producing
    D(d,n) helium-3 branch, D-T reactions, and T-T reactions in which both reactants
    are energetic fast ions from neutral beam injection. The T-T contribution is a
    neutron count rate that includes its two-neutron final-state multiplicity.
  documentation: 'Neutron flux due to beam-beam fusion is the global neutron emission
    count rate produced by fusion reactions between two energetic fast ions born from
    neutral beam injection. It includes the neutron-producing deuterium-deuterium
    branch $\mathrm{D(d,n)^3He}$, deuterium-tritium reactions, and tritium-tritium
    reactions; it excludes beam-thermal and thermal-thermal reactions. Because the
    unit is Hz, this quantity is a neutron production rate in $\mathrm{s^{-1}}$ rather
    than an areal particle flux.


    The total beam-beam neutron emission rate is the sum of neutron count rates from
    the contributing fuel channels:


    $$

    \Gamma_{n,\mathrm{bb}} = \Gamma_{n,\mathrm{DD}(d,n),\mathrm{bb}} + \Gamma_{n,\mathrm{DT},\mathrm{bb}}
    + \Gamma_{n,\mathrm{TT},\mathrm{bb}}

    $$


    where $\Gamma_{n,\mathrm{bb}}$ is the total beam-beam neutron emission rate, $\Gamma_{n,\mathrm{DD}(d,n),\mathrm{bb}}$
    includes only the neutron-producing $\mathrm{D(d,n)^3He}$ branch of deuterium-deuterium
    fusion, $\Gamma_{n,\mathrm{DT},\mathrm{bb}}$ is the deuterium-tritium neutron
    count rate, and $\Gamma_{n,\mathrm{TT},\mathrm{bb}}$ is the tritium-tritium neutron
    count rate. The D-T channel produces one approximately 14 MeV neutron per reaction;
    the D-D neutron branch produces one approximately 2.45 MeV neutron per branch
    reaction; T-T fusion produces a continuum neutron spectrum and, for the dominant
    $\mathrm{T+T\to ^4He+2n}$ channel, contributes two emitted neutrons per reaction,
    so its neutron rate is a count rate rather than simply a reaction rate.


    In practice this quantity is computed from fast-ion distribution functions and
    energy-dependent fusion reactivity kernels integrated over the two fast-ion populations.
    It can also be inferred by combining neutron diagnostics with modeling or subtraction
    of beam-thermal and thermal-thermal components. It is sensitive to neutral beam
    power, injection energy, fast-ion slowing down, pitch-angle distribution, isotope
    mix, and spatial overlap of the energetic ion populations.


    Typical values are near 0 Hz when neutral beam injection is absent or when the
    relevant reacting isotope is absent. In neutral-beam-heated deuterium plasmas,
    beam-beam neutron rates are often in the range $10^{10}$-$10^{16}$ Hz; in high-power
    mixed deuterium-tritium or tritium-rich plasmas they can reach $10^{15}$-$10^{18}$
    Hz, depending strongly on beam energy and fast-ion confinement.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutron_flux_due_to_beam_thermal_fusion
  - name:deuterium_deuterium_flux_due_to_beam_beam_fusion
  - name:deuterium_tritium_flux_due_to_beam_beam_fusion
  - name:flux_due_to_beam_beam_fusion
  arguments:
  - name: flux_due_to_beam_beam_fusion
    operator: neutron
    operator_kind: qualifier
  sources:
  - id: dd:summary/fusion/neutron_fluxes/dd/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/dd/beam_beam/value
    status: composed
  - id: dd:summary/fusion/neutron_fluxes/dt/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/dt/beam_beam/value
