- name: second_coordinate_of_filter_window_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of a diagnostic filter window in its local (X1, X2) instrument reference frame.
  documentation: 'The filter window outline is a closed polygon approximating the
    physical aperture of a diagnostic filter element; each vertex is specified by
    a pair of local coordinates $(X_1, X_2)$ measured in the plane of the window.
    This quantity gives the $X_2$ component of each vertex, fully characterizing the
    window geometry when combined with [first_coordinate_of_filter_window_outline](name:first_coordinate_of_filter_window_outline).
    Filter windows are used across X-ray and soft-X-ray diagnostic channels to define
    the energy passband and spatial acceptance; the polygonal outline is required
    for accurate solid-angle and transmission calculations. The local $(X_1, X_2)$
    frame is an instrument-fixed two-dimensional reference frame whose origin and
    orientation are defined by the diagnostic assembly; it is distinct from the machine
    cylindrical $(R, \phi, Z)$ frame. Typical coordinate values range from a few millimeters
    to a few centimeters depending on the filter aperture size. The companion coordinate
    [second_coordinate_of_detector_outline](name:second_coordinate_of_detector_outline)
    follows the same convention for detector elements, and [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline)
    covers collimating apertures.


    Sign convention: Positive when the $X_2$ coordinate is in the positive sense of
    the local instrument $X_2$ axis.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_of_filter_window_outline
