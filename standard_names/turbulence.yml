- name: gyrocenter_current_density
  kind: scalar
  status: active
  description: Gyrocenter current density is the vector flux density of conventional
    electric charge represented by gyrocenter motion, equal to electric current per
    unit area normal to the flow.
  documentation: 'Gyrocenter current density $\mathbf{J}_{\mathrm{gc}}$ is the vector
    density of conventional electric charge flux associated with gyrocenter motion.
    It represents signed charge transport contributed by gyrocenter dynamics to the
    [current density](name:current_density) quantity.


    The charge-weighted first velocity moment of the gyrocenter distributions is


    $$

    \mathbf{J}_{\mathrm{gc}}(\mathbf{R},t) = \sum_s q_s \int \mathbf{v}_{\mathrm{gc}}
    f_{\mathrm{gc},s}(\mathbf{R},\mathbf{v}_{\mathrm{gc}},t)\,d^3v_{\mathrm{gc}}

    $$


    where $\mathbf{R}$ is gyrocenter position, $t$ is time, $s$ indexes charged species,
    $q_s$ is species charge, $\mathbf{v}_{\mathrm{gc}}$ is gyrocenter velocity, and
    $f_{\mathrm{gc},s}$ is the gyrocenter distribution function.


    This parent quantity does not select an equilibrium or perturbed contribution;
    [perturbed gyrocenter current density](name:perturbed_gyrocenter_current_density)
    is the corresponding fluctuation. It is distinct from particle-number flux and
    from a scalar electric current obtained by integrating a current-density component
    through a specified surface.


    Sign convention: Positive when the stated component or scalar projection of $\mathbf{J}_{\mathrm{gc}}$
    is aligned with the positive direction of its defining basis vector or unit vector.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:current_density
  - name:perturbed_gyrocenter_current_density
  arguments:
  - name: current_density
    operator: gyrocenter
    operator_kind: qualifier
- name: perturbed_gyrocenter_current_density
  kind: scalar
  status: active
  description: Perturbed gyrocenter current density is the charge-transport fluctuation
    associated with gyrocenter motion, obtained from the charge-weighted first velocity
    moment of perturbed gyrocenter distributions.
  documentation: 'The perturbed gyrocenter current density is the fluctuating charge
    transport carried by gyrocenters in gyrokinetic theory. It is the perturbation
    of [gyrocenter current density](name:gyrocenter_current_density), distinct from
    a particle-space current perturbation such as [perturbed particle current density](name:perturbed_particle_current_density).


    The underlying charge-weighted first-moment relation is


    $$

    \delta \mathbf{J}_{\mathrm{gy}} = \sum_s q_s \int \mathbf{v}_{\mathrm{gy}}\,\delta
    f_{\mathrm{gy},s}(\mathbf{v})\,d^3v

    $$


    where $s$ indexes species, $q_s$ is the signed species charge, $\mathbf{v}_{\mathrm{gy}}$
    is gyrocenter velocity, $\delta f_{\mathrm{gy},s}$ is the perturbed gyrocenter
    distribution function, and $d^3v$ is the velocity-space volume element.


    A reference current-density scale may be applied to this moment to form a dimensionless
    representation, as in [normalized gyrocenter perturbed current density](name:normalized_gyrocenter_perturbed_current_density).
    The quantity is not restricted to a particular directional projection and excludes
    the instantaneous gyromotion contribution.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_current_density
  - name:perturbed_particle_current_density
  - name:normalized_gyrocenter_perturbed_current_density
  arguments:
  - name: gyrocenter_current_density
    operator: perturbed
    operator_kind: qualifier
- name: normalized_gyrocenter_perturbed_current_density
  kind: vector
  status: active
  description: Dimensionless vector of the normalized gyrocenter current-density perturbation,
    equal to the charge-weighted first velocity moment of the perturbed gyrocenter
    distribution function divided by a reference current-density scale.
  documentation: 'The normalized gyrocenter perturbed current density is the dimensionless
    vector form of the gyrocenter current-density perturbation in gyrokinetic theory,
    obtained by normalizing [perturbed_gyrocenter_current_density](name:perturbed_gyrocenter_current_density)
    to a reference current-density scale $J_\mathrm{ref}$.


    $$

    \tilde{\mathbf{J}} = \frac{1}{J_\mathrm{ref}} \sum_s q_s \int \mathbf{v}\, \delta
    f_s\, d^3v

    $$


    where $q_s$ is the charge of species $s$, $\delta f_s$ is the perturbed gyrocenter
    distribution function, and the integral is over velocity space. For a linear gyrokinetic
    eigenmode the result is generally complex, carrying both amplitude and phase.
    The vector decomposes along the background magnetic-field direction; the field-aligned
    projection is documented in [parallel_normalized_gyrocenter_perturbed_current_density](name:parallel_normalized_gyrocenter_perturbed_current_density).
    This quantity is structurally analogous to [normalized_gyrocenter_perturbed_density](name:normalized_gyrocenter_perturbed_density)
    (zeroth moment) and [normalized_gyrocenter_perturbed_pressure](name:normalized_gyrocenter_perturbed_pressure)
    (second moment), differing in the velocity weight and charge weighting.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_gyrocenter_current_density
  - name:parallel_normalized_gyrocenter_perturbed_current_density
  - name:normalized_gyrocenter_perturbed_density
  - name:normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: perturbed_gyrocenter_current_density
    operator: normalized
    operator_kind: qualifier
- name: parallel_normalized_gyrocenter_perturbed_current_density
  kind: scalar
  status: active
  description: Dimensionless field-aligned component of the charge-weighted first
    velocity moment of a perturbed gyrocenter distribution, normalized to a reference
    current-density scale.
  documentation: 'This quantity is the parallel component of the normalized gyrocenter
    current-density perturbation. It represents the charge-weighted first moment of
    the perturbed gyrocenter distribution along the local magnetic-field direction
    and is the field-aligned component of [normalized gyrocenter perturbed current
    density](name:normalized_gyrocenter_perturbed_current_density).


    $$

    J_{parallel,g}^{(s)} = \frac{q_s}{J_{\rm ref}} \int v_\parallel\,\delta g_s\,d^3v

    $$


    where $q_s$ is the charge of species $s$, $v_\parallel$ is its velocity along
    the local magnetic field, $\delta g_s$ is the perturbed gyrocenter distribution
    function, $d^3v$ is the velocity-space volume element, and $J_{\rm ref}$ is the
    reference current-density scale. The underlying unnormalized moment is the corresponding
    [perturbed gyrocenter current density](name:perturbed_gyrocenter_current_density).
    For a linear eigenmode, the quantity may be complex, with its phase defined by
    the eigenmode convention.


    Sign convention: Positive when the perturbed gyrocenter current density points
    along the local magnetic field.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_gyrocenter_perturbed_current_density
  - name:perturbed_gyrocenter_current_density
  arguments:
  - name: normalized_gyrocenter_perturbed_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/j_parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-moments_norm_gyrocenter-j_parallel
    dd_documentation:
      leaf: Normalised parallel current density
