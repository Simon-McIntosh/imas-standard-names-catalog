- name: parallel_electron_particle_convection_velocity
  kind: scalar
  status: active
  description: Signed field-aligned component of the effective electron particle convection
    velocity representing advective electron transport along local magnetic-field
    lines.
  documentation: 'The quantity is the effective electron particle convection velocity
    projected onto the local magnetic-field direction. It represents the advective
    part of parallel electron particle transport and is distinct from the electron-fluid
    velocity and from energy convection.


    The defining projection is:


    $$

    v_{\parallel,e}^{\mathrm{conv}} = \mathbf{v}_{e}^{\mathrm{conv}} \cdot \hat{\mathbf{b}},
    \qquad \hat{\mathbf{b}} = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $v_{\parallel,e}^{\mathrm{conv}}$ is the parallel electron particle convection
    velocity, $\mathbf{v}_{e}^{\mathrm{conv}}$ is the effective electron particle
    convection-velocity vector, $\mathbf{B}$ is the local magnetic-field vector, and
    $\hat{\mathbf{b}}$ is its unit direction.


    In a particle-flux decomposition, the convective contribution is $\boldsymbol{\Gamma}_{e}^{\mathrm{conv}}
    = n_e\mathbf{v}_{e}^{\mathrm{conv}}$, where $n_e$ is electron number density.
    It is distinct from [parallel electron velocity](name:parallel_electron_velocity),
    which denotes the electron-fluid bulk velocity, and from [parallel electron energy
    convection velocity](name:parallel_electron_energy_convection_velocity).


    Sign convention: Positive when the effective electron particle convection velocity
    points along the local magnetic-field direction $\hat{\mathbf{b}}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_electron_velocity
  - name:parallel_electron_energy_convection_velocity
  sources:
