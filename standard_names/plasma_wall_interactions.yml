  documentation: 'Hydrogen density at a limiter is the local number density of hydrogen
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance; neutral hydrogen is excluded. For hydrogen, the charge-state sum reduces
