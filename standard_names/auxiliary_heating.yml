- name: thermal_ion_state_power
  kind: scalar
  status: draft
  description: Total power from a coherent electromagnetic wave absorbed by the thermal
    bulk ion population in a specified charge state, integrated over the plasma volume
    and summed over all toroidal mode numbers.
  documentation: 'Thermal ion state power is the net rate at which a coherent electromagnetic
    wave transfers energy to the thermal, or bulk, ions of one specified ion charge
    state. It excludes power absorbed by electrons, other ion charge states, and non-thermal
    energetic-ion populations, and represents the sum over all toroidal mode numbers.


    For a mode-decomposed wave field, the total thermal ion state power is defined
    by the mode-sum volume integral:


    $$

    P_{\mathrm{th},i}^{q} = \sum_n \int_V p_{\mathrm{th},i}^{q,n}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{th},i}^{q}$ is the total absorbed power for ion species $i$
    in charge state $q$, $p_{\mathrm{th},i}^{q,n}$ is the local power-density transfer
    from toroidal mode number $n$ to that thermal ion state, and $V$ is the plasma
    volume over which absorption is evaluated. The single-mode contribution corresponds
    to [per_toroidal_mode_thermal_ion_state_power](name:per_toroidal_mode_thermal_ion_state_power).


    In practice this quantity is computed from wave-field and plasma-response calculations
    by integrating the deposited power density for the selected ion charge state and
    summing the mode contributions. It may be constrained experimentally by total
    launched and coupled wave power, calorimetry or power-balance analysis, and changes
    in ion temperature, but the charge-state-resolved partition is generally model
    dependent.


    Typical magnitudes for an actively heated thermal ion charge state range from
    10^3-10^7 W in present magnetic-confinement experiments, with weakly coupled charge
    states near 0 W and high-power scenarios reaching 10^7-10^8 W.


    Sign convention: Positive when energy is transferred from the coherent electromagnetic
    wave to the thermal ion population of the specified charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_state_power
  - name:ion_state_power
  - name:thermal_ion_state_power_density
  arguments:
