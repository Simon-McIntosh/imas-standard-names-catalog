- name: absorbed_radiated_power_at_divertor_target
  kind: scalar
  status: active
  description: Net photon power deposited on one divertor target surface after subtracting
    radiative power reflected from that surface.
  documentation: 'Absorbed radiated power at a divertor target is the net photon-energy
    rate deposited on one specified target surface. It includes incident radiative
    energy absorbed by the target and excludes the reflected portion.


    The net absorbed radiative power is defined by


    $$

    P_{\mathrm{abs,rad}} = P_{\mathrm{inc,rad}} - P_{\mathrm{ref,rad}}

    $$


    where $P_{\mathrm{abs,rad}}$ is the absorbed radiated power, $P_{\mathrm{inc,rad}}$
    is the incident radiative power reaching the target, and $P_{\mathrm{ref,rad}}$
    is the radiative power reflected from the target.


    This quantity applies to one divertor target and excludes conductive, convective,
    charged-particle, and other nonradiative deposition channels. Summation over all
    divertor targets gives [power of the divertor due to radiation](name:power_of_divertor_due_to_radiation);
    the broader radiative deposition concept is described by [power due to radiation](name:power_due_to_radiation).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_radiation
  - name:power_due_to_radiation
  sources:
  - dd_path: divertors/divertor/target/power_radiated
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_radiated
    dd_documentation:
      leaf: Net radiated power on this divertor target (incident - reflected)
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Net radiated power deposited on a divertor target, defined as incident
        radiative power minus the reflected fraction. Used in divertor power balance
        and radiation load assessments.
      kind: llm
- name: charge_at_divertor_target
  kind: scalar
  status: active
  description: Dimensionless ratio of the second to first ionic charge moments, measuring
    impurity content relative to the electron population in a quasineutral plasma.
  documentation: 'Effective charge is the charge-squared-weighted ionic content of
    a plasma, normalized by its total positive charge. It equals unity for a pure
    singly charged hydrogenic plasma and increases when higher-charge ions contribute.


    $$

    Z_{\mathrm{eff}} = \frac{\sum_i n_i Z_i^2}{\sum_i n_i Z_i} = \frac{\sum_i n_i
    Z_i^2}{n_e}

    $$


    Here, $n_i$ is the number density of ion species or charge state $i$, $Z_i$ is
    its positive integer charge number, and $n_e$ is the free-electron number density;
    the second equality uses quasineutrality. The sums include charged ion populations
    evaluated at the same location, while neutral atoms and molecules are excluded.


    The [effective charge at the divertor target](name:effective_charge_at_divertor_target)
    is a spatially specialized instance of this general effective-charge quantity.'
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:effective_charge_at_divertor_target
- name: current_at_divertor_target
  kind: scalar
  status: active
  description: Net conventional electric current delivered by the plasma to one divertor
    target surface, integrated over the wetted strike zone.
  documentation: 'Current at a divertor target is the net conventional electric current
    delivered to one divertor target by charged particles crossing the plasma sheath
    and striking the wetted strike zone. It is a surface-integrated signed charge
    flux, not a local current density, and represents the per-target contribution
    to the divertor and wall-current balance.


    For a local target surface normal chosen from the plasma toward the material surface,
    the sheath-edge current integrated over the wetted area can be written as:


    $$

    I_{\mathrm{div,target}} = \int_{A_{\mathrm{wet}}} \left(j_{i,n} - j_{e,n}\right)\,dA

    $$


    where $j_{i,n}$ is the ion conventional-current density normal to the target surface
    in A m$^{-2}$, $j_{e,n}$ is the magnitude of the electron collection current density
    normal to the target surface in A m$^{-2}$, $dA$ is the differential target area
    in m$^2$, and $A_{\mathrm{wet}}$ is the wetted strike-zone area in m$^2$. The
    resulting integrated current is in A; the electron term is subtracted because
    electrons moving from the plasma to the target carry conventional current opposite
    to their particle motion.


    The current may be measured with embedded Langmuir probes, segmented target current
    shunts, or Rogowski-coil arrangements around target structures, and may also be
    inferred from sheath models using local target plasma conditions such as [electron
    density at divertor target](name:electron_density_at_divertor_target) and [electron
    temperature at divertor target](name:electron_temperature_at_divertor_target).
    It is closely related to deposited divertor power because the same sheath and
    strike-zone conditions govern both charge and energy fluxes, as represented by
    [power at divertor target](name:deposited_power_at_divertor_target_due_to_halo_current)
    and [power of divertor].


    For an electrically floating target in steady conditions, the net integrated current
    is expected to be near 0 A because ion and electron current contributions balance
    through the sheath. Non-zero values occur with target biasing, transient edge
    events, current-sharing between conducting structures, or disruption halo-current
    phases; the single-target value is not the total plasma current $I_p$ but may
    be assessed relative to $|I_p|$ when evaluating global current closure. No device-independent
    numerical range is implied, because the magnitude depends strongly on target geometry,
    electrical connection, plasma regime, and transient scenario.


    Sign convention: Positive when the net conventional current flows from the plasma
    into the divertor target surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:deposited_power_at_divertor_target_due_to_halo_current
  sources:
  - dd_path: divertors/divertor/target/current_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-current_incident
    dd_documentation:
      leaf: Total current incident on this target
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: "Total electric current incident on a divertor target, representing\
        \ the net charge flux delivered to the target surface by the plasma. Used\
        \ in divertor power balance and plasma\u2013wall interaction assessments."
      kind: llm
- name: current_of_divertor
  kind: scalar
  status: active
  description: Net conventional electric current carried by charged particles into
    all divertor target surfaces, including signed electron and ion contributions.
  documentation: 'The total divertor current is the algebraic conventional current
    delivered by charged particles crossing the plasma-facing surfaces of the complete
    divertor assembly. It includes ion and electron contributions and excludes neutral-particle
    flux and displacement current.


    The current is defined by


    $$

    I_{\mathrm{div}} = \int_{S_{\mathrm{div}}} \mathbf{J}_{\mathrm{ch}} \cdot \hat{\mathbf{n}}\,
    dA = \int_{S_{\mathrm{div}}} \sum_s q_s\boldsymbol{\Gamma}_s \cdot \hat{\mathbf{n}}\,
    dA

    $$


    where $I_{\mathrm{div}}$ is the total current in A, $S_{\mathrm{div}}$ is the
    union of divertor target surfaces, $\mathbf{J}_{\mathrm{ch}}$ is conventional
    charged-particle current density in A m$^{-2}$, $q_s$ is the signed charge of
    species $s$ in C, $\boldsymbol{\Gamma}_s$ is its particle flux density in m$^{-2}$
    s$^{-1}$, and $\hat{\mathbf{n}}$ points from the plasma toward the material.


    This assembly-integrated quantity differs from [current at a divertor target](name:current_at_divertor_target),
    which applies to one target, and [current of a divertor tile](name:current_of_divertor_tile),
    which applies to an individual tile.


    Sign convention: Positive when conventional charged-particle current flows from
    the plasma into the divertor material.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:current_of_divertor_tile
  sources:
  - dd_path: divertors/divertor/current_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-current_incident
    dd_documentation:
      leaf: Total current incident on this divertor
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Total electric current (I) incident on a divertor, summed over
        all targets. Represents the net current carried by charged particles striking
        the divertor surfaces, relevant to divertor plasma-wall interaction studies.
      kind: llm
- name: current_of_divertor_tile
  kind: scalar
  status: active
  description: Net electric current flowing from the plasma across the electrostatic
    sheath onto the plasma-facing surface of an individual divertor tile.
  documentation: 'The current of a divertor tile is the net electric current flowing
    from the plasma across the electrostatic sheath onto the plasma-facing surface
    of a single tile. It provides tile-resolved resolution of the current distribution
    across the divertor strike zone, complementing the target-integrated quantity
    [current_at_divertor_target](name:current_at_divertor_target).


    The tile current integrates the local net sheath current density $j_s$ over the
    plasma-facing tile area $A_\mathrm{tile}$:


    $$

    I_\mathrm{tile} = \int_{A_\mathrm{tile}} j_s \, dA

    $$


    where $j_s$ depends on the local ion saturation current density, the tile-to-plasma
    sheath potential, and the local [electron temperature at the divertor target](name:electron_temperature_at_divertor_target).
    Dividing by the tile area, available from [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),
    converts this quantity to a mean incident current density.


    Tile currents are measured using isolated tile circuits or embedded Langmuir probes
    whose signals are routed through the mechanical tile support structure, enabling
    time-resolved acquisition during plasma operation including transient ELM events.


    Summing contributions from all tiles on a given target recovers [current_at_divertor_target](name:current_at_divertor_target),
    and summing over all targets gives [current_of_divertor](name:current_of_divertor).
    Tile-level current data are used to diagnose thermoelectric current loops, local
    erosion hot spots, and strike-zone asymmetries driven by 3D magnetic perturbations.


    Sign convention: Positive when net electric current flows from the plasma onto
    the tile surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:surface_area_of_divertor_tile
  - name:current_of_divertor
  sources:
  - dd_path: divertors/divertor/target/tile/current_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-tile-current_incident
    dd_documentation:
      leaf: Total current incident on this tile
      parent_path: divertors/divertor/target/tile
      parent: Set of divertor tiles belonging to this target
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Total electric current incident on an individual divertor tile.
        A time-resolved measurement of the net charge current flowing onto the tile
        surface, relevant for sheath physics and tile current studies.
      kind: llm
- name: density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of a specified plasma species or species group at the
    divertor target is the local particle count per volume immediately upstream of
    the sheath at the target-facing plasma boundary. For ionic species it is summed
    over all positive ionization states; neutrals are excluded unless explicitly named.
  documentation: 'Number density of a specified plasma species or species group at
    the divertor target is the local particle count per volume at the sheath entrance
    immediately upstream of the target-facing plasma boundary. It is the divertor-target
    instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).


    The local number density is defined by the differential particle count:


    $$

    n_\alpha = \frac{dN_\alpha}{dV}

    $$


    where $N_\alpha$ is the number of particles belonging to species or species group
    $\alpha$ in a small plasma volume $V$ whose center approaches the sheath entrance
    from the plasma side at the divertor target.


    For an ionic species-level subject, $N_\alpha$ is summed over all positive ionization
    states of that species; neutral atoms and molecules are excluded unless the subject
    explicitly denotes neutrals. [ion_density_at_divertor_target](name:ion_density_at_divertor_target)
    is the ionic specialization of this quantity, while [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    aggregates the particle densities of all ion species without charge-state weighting.
    This quantity is a particle number density, not a charge density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
- name: argon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of argon ions at the divertor target is the local particle
    count per volume at the sheath entrance, summed over positive ionization states
    and excluding neutral argon.
  documentation: 'Number density of argon ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the argon-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The charge-state-summed argon number density is defined by


    $$

    n_{\mathrm{Ar}} = \sum_{q=1}^{18} n_{\mathrm{Ar}^{q+}}

    $$


    where $n_{\mathrm{Ar}}$ is the total argon-ion number density, $n_{\mathrm{Ar}^{q+}}$
    is the local number density of argon ions with positive charge state $q$, and
    $q$ is the integer argon charge-state index.


    This quantity applies to the argon-ion population immediately upstream of the
    electrostatic sheath at a divertor target and is summed over all positive argon
    charge states from singly ionized through fully stripped argon. Neutral argon
    atoms and other neutral argon forms are excluded, as are electrons and ions of
    other elements.


    This is a local species density rather than a density integrated over the target
    surface or summed over all plasma species. The corresponding argon quantity at
    a limiter, [argon density at the limiter](name:argon_density_at_limiter), has
    the same charge-state aggregation but a different evaluation locus; unlike [electron
    density at the divertor target](name:electron_density_at_divertor_target), this
    quantity describes argon ions rather than free electrons.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - dd_path: summary/local/divertor_target/n_i/argon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-n_i-argon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/divertor_target/n_i/argon
      parent: Argon (Ar)
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Argon (Ar).
      kind: template
- name: beryllium_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of beryllium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary, summed over all positive ionization states.
  documentation: 'Number density of beryllium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the beryllium-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local beryllium-ion number density is defined by the differential particle
    count:


    $$

    n_{\mathrm{Be}} = \frac{dN_{\mathrm{Be}}}{dV}

    $$


    where $n_{\mathrm{Be}}$ is the beryllium-ion number density, $N_{\mathrm{Be}}$
    is the number of beryllium ions in the volume, and $V$ is a small plasma volume
    centered at the sheath entrance.


    This quantity applies to the ionized beryllium population immediately adjacent
    to the divertor target and is summed over all positive beryllium ionization states,
    with each ion counted once regardless of charge state. Neutral beryllium atoms
    are excluded; the quantity is a local number density, not an areal particle flux,
    integrated inventory, or charge density.


    Compared with [beryllium_density](name:beryllium_density), this quantity specifies
    the divertor-target sheath-entrance locus. It is distinct from [electron_density_at_divertor_target](name:electron_density_at_divertor_target),
    which counts free electrons rather than beryllium ions.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - dd_path: summary/local/divertor_target/n_i/beryllium/value
