- name: vertical_force_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Signed vertical component of the net electromagnetic Lorentz force\
    \ on one poloidal-field coil, resolved along increasing Z in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the net electromagnetic Lorentz force on an individual\
    \ poloidal-field-coil conductor projected onto the vertical axis of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame.\n\nThe force component is defined by\n\n\
    $$\nF_Z = \\int_{V_{\\mathrm{coil}}} (\\mathbf{J} \\times \\mathbf{B}) \\cdot\
    \ \\hat{\\mathbf{Z}}\\,\\mathrm{d}V\n$$\n\nwhere $F_Z$ is the vertical force component,\
    \ $V_{\\mathrm{coil}}$ is the conductor volume, $\\mathbf{J}$ is the current-density\
    \ vector, $\\mathbf{B}$ is the magnetic-field vector acting on the conductor,\
    \ $\\hat{\\mathbf{Z}}$ is the vertical unit vector, and $\\mathrm{d}V$ is a differential\
    \ volume element.\n\nThis is a signed component rather than the force magnitude\
    \ or resultant. The radial component is represented separately by [radial force\
    \ of a poloidal-field coil](name:radial_force_of_poloidal_field_coil), while [force\
    \ of a poloidal-field coil](name:force_of_poloidal_field_coil) represents the\
    \ coil\u2019s electromagnetic force resultant.\n\nSign convention: Positive when\
    \ the net force points toward increasing $Z$."
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:radial_force_of_poloidal_field_coil
  - name:force_of_poloidal_field_coil
  sources:
  - dd_path: pf_active/coil/force_vertical
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-force_vertical
    dd_documentation:
