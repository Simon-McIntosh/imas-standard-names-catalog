- name: line_averaged_argon_density
  kind: scalar
  status: active
  description: Chord-averaged number density of argon ions along a specified plasma
    path, with contributions from all ionization stages summed together.
  documentation: 'Line-averaged argon ion number density is the argon ion concentration
    averaged along a specified chord through the plasma, including all ionization
    stages.


    The line average is defined by


    $$

    \overline{n}_\mathrm{Ar} = \frac{1}{L} \int_0^L \sum_{q=1}^{18} n_{\mathrm{Ar},q}(\mathbf{r}(l))\,dl

    $$


    where $L$ is the chord length, $l$ is distance along the chord, $\mathbf{r}(l)$
    is the position on the chord, and $n_{\mathrm{Ar},q}$ is the local number density
    of argon ions in charge state $q$.


    This path average is distinct from the local [argon ion density](name:argon_density)
    and from the plasma-volume average [volume-averaged argon density](name:volume_averaged_argon_density).'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:argon_density
  - name:volume_averaged_argon_density
