- name: toroidal_launched_wave_index_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Signed toroidal component of the refractive-index vector for a lower-hybrid
    wave launched by a lower-hybrid antenna.
  documentation: 'The toroidal launched-wave index is the signed projection of the
    refractive-index vector of a wave launched by a lower-hybrid antenna onto the
    toroidal direction. It characterizes toroidal phase variation and is distinct
    from the dimensional [toroidal wave vector](name:toroidal_wave_vector_of_beam_tracing_beam).


    The index is defined by


    $$

    n_\phi = \frac{\mathbf{k}\cdot\hat{\phi}}{k_0} = \frac{k_\phi}{k_0}

    $$


    where $\mathbf{k}$ is the launched-wave vector, $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle in the right-handed cylindrical
    $(R, \phi, Z)$ frame, $k_\phi$ is the toroidal projection of $\mathbf{k}$, and
    $k_0$ is the free-space wavenumber. The corresponding poloidal quantity is the
    [poloidal launched-wave index](name:poloidal_launched_wave_index_of_lower_hybrid_antenna).


    Sign convention: Positive when the launched-wave vector has a component in the
    direction of increasing toroidal angle $\phi$.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_wave_vector_of_beam_tracing_beam
  - name:poloidal_launched_wave_index_of_lower_hybrid_antenna
  sources:
  - dd_path: lh_antennas/antenna/row/n_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-row-n_phi
    dd_documentation:
      leaf: Refraction index in the toroidal direction
      parent_path: lh_antennas/antenna/row
      parent: Set of horizontal rows of waveguides (corresponding to different poloidal
        positions). A power spectrum is provided for each row.
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - lh_antennas/antenna/row/time
    enhanced_context:
      description: "Toroidal refractive index (n_phi, equivalent to n\u2225) of the\
        \ lower hybrid wave spectrum launched by a waveguide row. Determines the parallel\
        \ wave number and hence the current drive deposition location in the plasma."
      kind: llm
- name: toroidal_width_of_antenna_strap
  kind: scalar
  status: active
  description: "Full toroidal width of the rectangular cross-section of an ICRH antenna\
    \ strap conductor element, measured along the toroidal direction in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Full toroidal width of the rectangular cross-section of an ICRH
    antenna strap conductor element, measured along the toroidal direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It is the edge-to-edge extent between
    the two toroidally separated sides of the strap conductor.


    For a strap represented at a characteristic major radius, the toroidal width is
    related to the angular separation of the two toroidal edges by:


    $$

    w_\phi = R_\mathrm{strap}\,\Delta\phi

    $$


    where $w_\phi$ is the toroidal width, $R_\mathrm{strap}$ is the representative
    major radius of the strap, and $\Delta\phi$ is the smaller non-wrapping angular
    separation between the two toroidal edges.


    This is a full width, not a half-width or a signed coordinate difference. It is
    distinct from the poloidal extent [height_of_antenna_strap](name:height_of_antenna_strap)
    and from the local-normal extent [thickness_of_antenna_strap](name:thickness_of_antenna_strap)
    of the same strap conductor.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:height_of_antenna_strap
  - name:thickness_of_antenna_strap
  sources:
