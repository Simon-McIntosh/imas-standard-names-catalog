- name: ratio_of_electron_temperature_at_magnetic_axis_to_volume_averaged_electron_temperature
  kind: scalar
  status: active
  description: Dimensionless electron-temperature peaking ratio comparing the magnetic-axis
    temperature with the volume-averaged temperature inside the last closed flux surface.
  documentation: 'The electron-temperature peaking ratio measures central thermal
    concentration by comparing the electron temperature at the magnetic axis with
    its volume average inside the last closed flux surface.


    $$

    P_{T_e} = \frac{T_e(\mathbf{x}_{\mathrm{axis}})}{\langle T_e\rangle_{\mathcal{V}_{\mathrm{LCFS}}}}
    = \frac{T_e(\mathbf{x}_{\mathrm{axis}})}{\mathcal{V}_{\mathrm{LCFS}}^{-1} \int_{\mathcal{V}_{\mathrm{LCFS}}}
    T_e(\mathbf{x})\,\mathrm{d}^3\mathbf{x}}

    $$


    Here, $P_{T_e}$ is the electron-temperature peaking ratio, $T_e$ is the local
    electron temperature, $\mathbf{x}_{\mathrm{axis}}$ is the position of the magnetic
    axis, $\langle T_e\rangle_{\mathcal{V}_{\mathrm{LCFS}}}$ is the volume-averaged
    electron temperature, $\mathcal{V}_{\mathrm{LCFS}}$ is the plasma volume enclosed
    by the last closed flux surface, $\mathbf{x}$ is a position within that volume,
    and $\mathrm{d}^3\mathbf{x}$ is the differential volume element.


    The numerator is the temperature evaluated specifically at the magnetic axis,
    represented by [electron temperature at magnetic axis](name:electron_temperature_at_magnetic_axis).
    The denominator is a volume average over the confined plasma volume up to the
    last closed flux surface; it is not a local value, a point maximum, or an average
    over other plasma populations. The ratio applies only to the electron population
    and does not represent ion-temperature peaking.


    This quantity is obtained by dividing the magnetic-axis electron temperature by
    the corresponding volume-averaged electron temperature, so it is distinct from
    either operand alone and quantifies the relative central peaking of the electron-temperature
    distribution.'
  unit: '1'
  physics_domain: transport
  links:
  - name:electron_temperature_at_magnetic_axis
  arguments:
  - name: electron_temperature_at_magnetic_axis
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: volume_averaged_electron_temperature
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - kind: imas-dd
    ref: core_profiles/global_quantities/t_e_peaking
    version: 4.1.1
