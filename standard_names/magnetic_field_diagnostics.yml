- name: vertical_coordinate_of_rogowski_coil
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the Rogowski coil position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, measured along the machine symmetry axis."
  documentation: 'The vertical Z coordinate locates the Rogowski coil along the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$
    measures height above the $Z = 0$ reference plane. Together with the major radius
    given by [radial_coordinate_of_rogowski_coil](name:radial_coordinate_of_rogowski_coil),
    it fully specifies the coil''s position in a poloidal cross-section, which is
    required to associate the enclosed-current measurement with the correct plasma
    geometry and to provide geometric inputs for magnetic equilibrium reconstruction.


    This coordinate is a fixed geometric parameter established from engineering metrology
    of the installed coil. The same vertical-coordinate convention is applied to [vertical_coordinate_of_flux_loop](name:vertical_coordinate_of_flux_loop)
    and [vertical_coordinate_of_coil_conductor](name:vertical_coordinate_of_coil_conductor)
    across the magnetic diagnostics family.


    Sign convention: Positive when the coil is located above the $Z = 0$ reference
    plane, in the upward direction along the machine symmetry axis.'
