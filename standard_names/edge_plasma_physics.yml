- name: parallel_neutral_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Dimensionless parallel momentum flux-limiter coefficient that scales
    the free-streaming upper bound on neutral-particle momentum-flux density in edge-plasma
    transport closures.
  documentation: 'The parallel neutral momentum flux-limiter coefficient is the parallel
    component of the neutral-particle specialization of the general momentum flux-limiter
    coefficient vector, providing the dimensionless limiter factor for neutral momentum
    transport along the magnetic-field direction. It bounds the field-aligned neutral
    momentum-flux density so that the modeled flux does not exceed the free-streaming
    momentum-flux-density scale when the neutral mean free path is large relative
    to macroscopic gradient scales.


    The coefficient $\alpha_\parallel$ along the magnetic-field unit vector $\hat{b}$
    is defined as the ratio of the magnitude of the modeled field-aligned neutral
    momentum-flux density to its free-streaming upper bound:


    $$

    \alpha_\parallel = \frac{|\Pi_\parallel|}{\Pi_\parallel^{\rm free}},\qquad \Pi_\parallel^{\rm
    free} = m_n n_n \left(u_\parallel^{\rm free}\right)^2

    $$


    where $\Pi_\parallel$ is the modeled neutral momentum-flux density component along
    $\hat{b}$, $m_n$ is the neutral particle mass, $n_n$ is the [neutral number density],
    and $u_\parallel^{\rm free}$ is the characteristic collisionless neutral speed
    projected along $\hat{b}$ for the same neutral population. The constraint $\alpha_\parallel
    \in [0,1]$ makes $\Pi_\parallel^{\rm free}$ an upper bound on $|\Pi_\parallel|$;
    the sign of the momentum flux is carried by $\Pi_\parallel$, not by the limiter
    coefficient.


    This coefficient is field-aligned and is distinct from the [toroidal](name:toroidal_neutral_momentum_flux_limiter_coefficient)
    and [vertical](name:vertical_neutral_momentum_flux_limiter_coefficient) components,
    which apply to fixed directions in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is also distinct from the [parallel neutral internal-state momentum
    flux-limiter coefficient](name:parallel_neutral_internal_state_momentum_flux_limiter_coefficient),
    which assigns separate parallel limiter factors to individual neutral internal
    states.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neutral_momentum_flux_limiter_coefficient
  - name:vertical_neutral_momentum_flux_limiter_coefficient
