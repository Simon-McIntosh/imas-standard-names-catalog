name: toroidal_component_of_tendency_of_electron_velocity
status: draft
description: Partial time derivative of the toroidal component of the electron fluid
  velocity, $\partial v_{e,\phi} / \partial t$.
documentation: "The quantity $\\partial v_{e,\\phi} / \\partial t$ represents the\
  \ local acceleration of the electron fluid in the toroidal ($\\hat{\\phi}$) direction.\
  \ It appears in the electron toroidal momentum balance equation, which in simplified\
  \ form reads $m_e n_e \\, \\partial v_{e,\\phi} / \\partial t = -\\nabla \\cdot\
  \ \\Pi_{e,\\phi} + n_e e E_\\phi + R_{ei,\\phi}$, where $m_e$ is the electron mass,\
  \ $n_e$ the electron density, $\\Pi_{e,\\phi}$ the toroidal component of the electron\
  \ viscous stress, $E_\\phi$ the toroidal electric field, and $R_{ei,\\phi}$ the\
  \ electron-ion friction force projected onto $\\hat{\\phi}$. Due to the small electron\
  \ mass, the electron momentum equation is often treated as quasi-static ($\\partial\
  \ v_{e,\\phi}/\\partial t \\approx 0$); finite values arise during fast transients\
  \ such as current ramps or disruptions. Typical electron toroidal velocities are\
  \ of order $10^3$\u2013$10^5\\;\\mathrm{m\\,s^{-1}}$, so transient tendencies scale\
  \ as $|\\partial v_{e,\\phi}/\\partial t| \\sim v_{e,\\phi} / \\tau$ with $\\tau$\
  \ the characteristic time scale of the perturbation. See `electron_number_density`\
  \ for the density entering the momentum equation."
