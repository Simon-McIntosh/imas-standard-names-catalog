name: electron_normalized_larmor_radius_at_pedestal_top_high_field_side
status: draft
cocos_transformation_type: one_like
description: Ratio of the electron Larmor radius to the plasma minor radius, evaluated
  at pedestal-top conditions using the high-field-side magnetic field.
documentation: "The normalized electron Larmor radius $\\rho^*_e = \\rho_e / a$, where\
  \ $\\rho_e = \\sqrt{m_e k_B T_{e,\\mathrm{ped}}} / (e B_{\\mathrm{HFS}})$ is the\
  \ electron thermal Larmor radius with electron mass $m_e$, pedestal-top electron\
  \ temperature $T_{e,\\mathrm{ped}}$ (in eV), elementary charge $e$, and $B_{\\mathrm{HFS}}$\
  \ the total magnetic field on the high-field side (HFS), and $a$ is the plasma minor\
  \ radius (in m). Because $B$ is larger on the HFS due to the $1/R$ dependence of\
  \ the toroidal field, $\\rho^*_{e,\\mathrm{HFS}}$ is smaller than the corresponding\
  \ low-field-side value. The quantity is dimensionless and typically of order $10^{-4}$\u2013\
  $10^{-3}$ in current tokamaks. It enters finite-Larmor-radius ordering of pedestal\
  \ micro-stability theories and multi-machine pedestal scaling studies. Extracted\
  \ from pedestal fits (mtanh or linear) of Thomson scattering $T_e$ profiles combined\
  \ with equilibrium magnetic-field evaluation. See also `electron_normalized_larmor_radius_at_pedestal_top_low_field_side`\
  \ and `electron_temperature_at_pedestal`."
