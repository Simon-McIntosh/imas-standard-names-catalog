- name: normalized_poloidal_magnetic_flux_at_pedestal_top
  kind: scalar
  status: active
  description: Normalized poloidal magnetic flux at the pedestal top is the value
    of the normalized poloidal magnetic flux on the flux surface identified as the
    top of the H-mode edge pedestal. It is the poloidal flux difference from the magnetic
    axis divided by the axis-to-boundary flux difference, equal to zero at the magnetic
    axis and one at the plasma boundary, and equals the square of the normalized poloidal
    flux coordinate at that surface.
  documentation: 'Normalized poloidal magnetic flux at the pedestal top is the value
    of the normalized poloidal magnetic flux $\psi_N$ on the flux surface identified
    as the top of the H-mode edge pedestal, where the steep-gradient edge transport
    barrier joins the core profile. The normalized poloidal magnetic flux is a dimensionless
    label of equilibrium flux surfaces that is zero at the magnetic axis and one at
    the plasma boundary.


    The value is defined by the linear flux ratio


    $$

    \psi_{N,\mathrm{ped}} = \frac{\psi_{\mathrm{ped}} - \psi_0}{\psi_b - \psi_0}

    $$


    where $\psi_{\mathrm{ped}}$ is the [poloidal magnetic flux at the pedestal top](name:poloidal_magnetic_flux_at_pedestal_top),
    $\psi_0$ is the [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis),
    and $\psi_b$ is the [poloidal magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).


    This quantity is the normalized poloidal magnetic flux itself, without a square
    root; it is distinct from the minor-radius-like [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)
    $\rho_{\mathrm{pol}}$, whose square it equals, so that $\psi_{N,\mathrm{ped}}
    = \rho_{\mathrm{pol,ped}}^2$ on the same pedestal-top surface. The corresponding
    coordinate value is [normalized poloidal flux coordinate of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).
    This quantity locates only the pedestal-top flux surface; it does not specify
    the pedestal width, the pedestal center, or an absolute poloidal magnetic flux
    value.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_flux_coordinate
  - name:poloidal_magnetic_flux_at_pedestal_top
