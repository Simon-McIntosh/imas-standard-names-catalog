- name: toroidal_coordinate_of_line_of_sight
  kind: scalar
  status: active
  description: Toroidal angular coordinate of the first reference point on a diagnostic
    line of sight, locating that point around the machine symmetry axis.
  documentation: 'The toroidal coordinate of a line of sight is the azimuthal angle
    of its first reference point about the machine symmetry axis. It specifies the
    point''s circumferential location in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    For a point expressed in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis, the toroidal angle is defined by


    $$

    \phi = \operatorname{atan2}(y,x)

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates of the first reference
    point, and $\phi=0$ is the facility-defined toroidal reference direction.


    This quantity applies specifically to the first reference point of a diagnostic
    line of sight. It is a point coordinate, not an angle describing the line-of-sight
    direction, and it is not an aggregate over the line or over multiple reference
    points. Unlike [toroidal_coordinate_of_optical_element](name:toroidal_coordinate_of_optical_element),
    which locates an optical-element center, it locates the designated first line-of-sight
    point.


    Sign convention: Positive when the angular displacement from the $\phi=0$ reference
    direction is counter-clockwise when viewed from above the $+\hat{Z}$ axis.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: bolometer/camera/channel/line_of_sight/first_point/phi
    dd_version: 4.1.0
