name: volume_averaged_tungsten_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Volume-averaged number density of all tungsten ion charge states, summed
  over the confined plasma volume.
documentation: "The volume-averaged tungsten ion number density $\\langle n_{\\mathrm{W}}\\\
  rangle_V = V^{-1}\\int n_{\\mathrm{W}}(\\mathbf{r})\\,dV$ captures the total ionized\
  \ tungsten population (charge states up to W$^{74+}$) averaged over the plasma volume\
  \ $V$ in m$^{-3}$. Tungsten is the primary plasma-facing material in ITER and several\
  \ modern tokamaks (ASDEX Upgrade, WEST, JET-ILW); even trace concentrations ($n_{\\\
  mathrm{W}}/n_e \\gtrsim 10^{-5}$) cause severe core radiative losses because of\
  \ the very high charge states and rich line-emission spectrum in the soft-X-ray\
  \ and VUV bands. Typical tolerable volume-averaged values are $10^{14}$\u2013$10^{16}\\\
  ;\\mathrm{m}^{-3}$, corresponding to fractional concentrations of $10^{-5}$\u2013\
  $10^{-4}$ relative to $n_e$. The quantity is inferred from soft-X-ray tomography,\
  \ VUV and extreme-ultraviolet (EUV) spectroscopy, or bolometric power balance combined\
  \ with impurity transport modeling. Tungsten accumulation in the core, driven by\
  \ neoclassical inward convection, can trigger radiative collapse; therefore $\\\
  langle n_{\\mathrm{W}}\\rangle_V$ is a key disruption-avoidance metric. It enters\
  \ the effective charge via $Z_{\\mathrm{eff}} = \\sum_i n_i Z_i^2 / n_e$ and strongly\
  \ influences the radiated power fraction. See also `volume_averaged_electron_number_density`\
  \ and `volume_averaged_oxygen_ion_number_density`."
