- name: helium_4_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of helium-4 ions in the plasma immediately adjacent
    to a divertor target, summed over singly and doubly ionized helium-4 charge states
    and excluding neutral helium-4 atoms.
  documentation: "Helium-4 density at the divertor target is the local number density\
    \ of ionized helium with mass number 4 in the plasma immediately adjacent to the\
    \ material target surface. It is summed over the two ionization stages \u2014\
    \ singly ionized $\\text{He}^{1+}$ and fully stripped $\\text{He}^{2+}$ \u2014\
    \ and excludes neutral helium-4 atoms, consistent with the [density_at_divertor_target](name:density_at_divertor_target)\
    \ convention that ionic species are summed over all charge states.\n\nThe charge-state-summed\
    \ density is defined as:\n\n$$\nn_{\\text{He-4}} = n_{\\text{He}^{1+}} + n_{\\\
    text{He}^{2+}}\n$$\n\nwhere $n_{\\text{He}^{1+}}$ and $n_{\\text{He}^{2+}}$ are\
    \ the number densities of the individual charge states. In deuterium\u2013tritium\
    \ burning plasmas, helium-4 is the dominant fusion ash originating from thermalized\
    \ alpha particles; its concentration at the divertor target directly reflects\
    \ the efficiency of ash exhaust by the divertor pumping system. Insufficient helium\
    \ removal causes ash accumulation and progressive fuel dilution in the core. The\
    \ quantity is inferred from spectroscopic or charge-exchange recombination measurements\
    \ in the divertor region. The analogous helium isotope quantity at this surface\
    \ is [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target);\
    \ complementary helium-4 profiles at other locations are given by [helium_4_density_at_magnetic_axis](name:helium_4_density_at_magnetic_axis)\
    \ and [helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary)."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:helium_3_density_at_divertor_target
  - name:helium_4_density_at_magnetic_axis
  - name:flux_surface_averaged_helium_4_density_at_plasma_boundary
