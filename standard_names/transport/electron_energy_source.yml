name: electron_energy_source
status: draft
description: Volumetric power density deposited into or removed from the electron
  energy channel, entering the electron energy transport equation.
documentation: 'The electron energy source $Q_e$ ($\mathrm{W\,m^{-3}}$) appears on
  the right-hand side of the flux-surface-averaged electron energy transport equation:
  $$\frac{3}{2}\frac{\partial (n_e T_e)}{\partial t} + \nabla \cdot \mathbf{q}_e =
  Q_e,$$ where $n_e$ is the electron number density ($\mathrm{m^{-3}}$), $T_e$ the
  electron temperature (J, or eV $\times\, e$), and $\mathbf{q}_e$ the electron energy
  flux ($\mathrm{W\,m^{-2}}$). Contributions to $Q_e$ include ohmic heating $\eta
  j^2$, ECRH deposition, the electron-absorbed component of NBI, collisional energy
  exchange with ions $Q_{ei} \propto n_e (T_i - T_e) / \tau_{ei}$ (where $\tau_{ei}$
  is the electron-ion energy equilibration time), bremsstrahlung and line radiation
  losses, and the convective energy carried by particle sources. In high-performance
  tokamak plasmas, core values range from $10^4$ to $10^7\;\mathrm{W\,m^{-3}}$ depending
  on heating power and density. Computed by integrated modeling codes (e.g., JINTRAC,
  TRANSP) combining ray-tracing, Monte Carlo, and radiation models. See also `ion_energy_source`
  for the ion channel, `electron_heating_power` for the volume-integrated counterpart,
  and `electron_temperature` for the transported quantity.'
validity_domain: ''
