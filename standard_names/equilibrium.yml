- name: normalized_toroidal_flux_coordinate
  kind: scalar
  status: active
  description: Dimensionless radial label equal to the square root of toroidal magnetic
    flux normalized between the magnetic axis and equilibrium boundary.
  documentation: 'The normalized toroidal flux coordinate is a dimensionless label
    for nested magnetic surfaces, increasing outward from the magnetic axis toward
    the equilibrium boundary. It is a magnetic-surface coordinate, not a cylindrical
    distance or a local vector component.


    $$

    \rho_{\mathrm{tor,norm}} = \left(\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}}
    - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the labeled surface, $\Phi_{\mathrm{tor,axis}}$
    is its value at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$ is its value
    at the equilibrium boundary used for normalization.


    The coordinate applies to nested magnetic surfaces and to mapped physical locations
    assigned to those surfaces. It is zero at the magnetic axis and one at the chosen
    equilibrium boundary; each value is a single surface label, with no summation,
    averaging, species aggregation, or mode aggregation. Locus-specific quantities
    such as the [normalized toroidal flux coordinate at a beam-tracing point](name:normalized_toroidal_flux_coordinate_at_beam_tracing_point)
    and the [normalized toroidal flux coordinate at a measurement position](name:normalized_toroidal_flux_coordinate_at_measurement_position)
    are evaluations of this same coordinate.


    This quantity is distinct from the dimensionful [toroidal flux coordinate](name:toroidal_flux_coordinate),
    because it is normalized to the axis-to-boundary interval and transformed by a
    square root. It also differs from the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate),
    which uses poloidal rather than toroidal magnetic flux, and from the [normalized
    minor radius of a flux surface](name:normalized_minor_radius_of_flux_surface),
    which is based on geometric extent rather than enclosed toroidal flux.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_beam_tracing_point
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  - name:toroidal_flux_coordinate
