      parent_path: neutron_diagnostic/reconstructed_emissivity
      parent: Reconstructed emissivity parameters and data
      data_type: FLT_2D
      unit: '1'
      coordinates:
      - neutron_diagnostic/reconstructed_emissivity/rho_tor_norm
      - neutron_diagnostic/time
    enhanced_context:
      description: Fuel ratio nT/nD (tritium-to-deuterium density ratio) reconstructed
        from neutron emissivity tomographic inversion. Characterises the local isotopic
        fuel mix in the plasma as a function of radius and time.
      kind: llm
- name: ratio_of_tritium_density_to_deuterium_density
  kind: scalar
  status: active
  description: Local ratio of tritium-ion to deuterium-ion number densities, expressing
    fuel-isotope composition independently of the total fuel-ion density.
  documentation: 'The local tritium-to-deuterium density ratio expresses the relative
    abundance of the two hydrogen-isotope fuel-ion populations at the same location.
    It is derived from the local [tritium density](name:tritium_density) and [deuterium
    density](name:deuterium_density).


    $$

    R_{T/D} = \frac{n_T}{n_D}

    $$


    where $R_{T/D}$ is the tritium-to-deuterium density ratio, and $n_T$ and $n_D$
    are the local number densities of tritium and deuterium ions, respectively. The
    densities include the relevant isotope populations summed over their charge states
    unless a charge-state-resolved quantity is explicitly specified.


    This ratio is dimensionless and does not represent the total fuel-ion density;
    multiplying it by the deuterium density gives the tritium density.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:tritium_density
  - name:deuterium_density
  arguments:
  - name: tritium_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: deuterium_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
