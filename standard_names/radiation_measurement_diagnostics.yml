- name: tritium_tritium_beam_source_rate
  kind: scalar
  status: draft
  description: Instantaneous rate of neutron production from fusion reactions where
    both reactants are fast tritium ions from neutral beam injection. This rate is
    always non-negative, including zero when no neutrons are produced.
  documentation: "The tritium\u2013tritium (TT) beam\u2013beam source rate quantifies\
    \ the instantaneous number of neutrons produced per second in reactions where\
    \ two fast tritium ions, both originating from neutral beam injection, undergo\
    \ fusion. The amplitude is determined by the reaction cross-section, the fast\
    \ tritium density, and the relative velocity distribution of the interacting beam\
    \ populations. Typical values in high-power beam-heated plasmas range from zero\
    \ up to several $10^{16}$ Hz, depending on the beam power, plasma density, and\
    \ tritium fraction. The rate is measured directly via neutron detectors or inferred\
    \ from beam parameters and is essential for characterizing fusion performance\
    \ and fast-ion confinement.\n\nSign convention: Positive when neutrons are produced."
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_beam_source_rate
  - name:deuterium_deuterium_beam_source_rate
  - name:deuterium_tritium_source_rate
  sources:
  - id: dd:summary/fusion/neutron_fluxes/tt/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/tt/beam_beam/value
    status: composed
  - id: dd:summary/fusion/neutron_rates/tt/beam_beam/value
    dd_path: summary/fusion/neutron_rates/tt/beam_beam/value
    status: composed
- name: upper_wavelength_of_filter
  kind: scalar
  status: draft
  description: Upper bound of the wavelength transmission band of an optical filter
    in a visible bremsstrahlung diagnostic channel. This defines the longest wavelength
    that the filter transmits, determining the spectral range for the channel.
  documentation: 'For an optical filter in a visible bremsstrahlung diagnostic channel,
    this quantity specifies the upper boundary of the wavelength passband. Together
    with the lower wavelength bound, it defines the spectral interval over which the
    channel measures bremsstrahlung emission from the plasma. The transmitted power
    through the filter is proportional to the integral of the plasma emissivity over
    this wavelength range.


    Typical values for visible bremsstrahlung filters range from 400 nm to 700 nm,
    depending on diagnostic design and the need to avoid intense line emission.


    Sign convention: Positive when the filter passband extends to longer wavelengths,
    with the upper bound always being greater than the lower bound.


    Related quantities include the lower bound of the filter wavelength range and
    the visible bremsstrahlung channel gain.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_wavelength_of_filter
  - name:reflectivity
  sources:
  - id: dd:bremsstrahlung_visible/channel/filter/wavelength_upper
    dd_path: bremsstrahlung_visible/channel/filter/wavelength_upper
    status: composed
- name: vertical_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the geometric center of an optical element
    (lens, mirror, or filter) within a spectrometer diagnostic channel.
  documentation: 'The vertical coordinate $z_{\rm el}$ defines the height of the optical
    element center in the right-handed cylindrical $(R, \phi, Z)$ frame of the tokamak.
    This geometric parameter is essential for ray-tracing models that compute the
    line of sight and the collection efficiency of the spectrometer system. Typical
    values range from $-2$ m to $+2$ m depending on the port location. This quantity
    is paired with the major radius coordinate $[R_{\rm el}](name:major_radius_of_optical_element)$
    to fully locate the element in the poloidal plane.


    Sign convention: Positive when the element center is above the midplane ($Z=0$).


    The optical element may be a lens, mirror, grating, or filter window. The coordinate
    is referenced to the machine symmetry axis and the tokamak midplane, consistent
    with the geometry conventions used for other diagnostic components such as $[vertical\_coordinate\_of\_camera](name:vertical_coordinate_of_camera)$
    and $[vertical\_coordinate\_of\_diagnostic\_aperture](name:vertical_coordinate_of_diagnostic_aperture)$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:major_radius_of_optical_element
  - name:vertical_coordinate_of_camera
  - name:vertical_coordinate_of_diagnostic_aperture
  sources:
  - id: dd:spectrometer_visible/channel/optical_element/geometry/centre/z
    dd_path: spectrometer_visible/channel/optical_element/geometry/centre/z
    status: composed
- name: wavelength_of_optical_element
  kind: scalar
  status: draft
  description: Spectral wavelength values at which the material optical properties
    (refractive index, extinction coefficient, transmission coefficient) of an optical
    element are tabulated.
  documentation: "The wavelength array provides the spectral abscissa for material\
    \ properties of an optical element, such as the refractive index, extinction coefficient,\
    \ or transmission coefficient, used in modeling the optical response of diagnostic\
    \ components. These properties are wavelength-dependent and are typically measured\
    \ or tabulated from material databases, covering the relevant spectral range of\
    \ the diagnostic (e.g., 0.2\u201320 \xB5m for IR cameras). The array defines the\
    \ discrete sampling points at which these properties are known, enabling interpolation\
    \ for accurate ray-tracing or radiometric calculations. For a given optical element,\
    \ the values of [refractive_index_of_optical_element](name:refractive_index_of_optical_element)\
    \ are provided at each corresponding wavelength. This quantity must be strictly\
    \ increasing in value.\n\nSign convention: Positive when the wavelength values\
    \ are ordered from shortest to longest.\n\nTypical wavelength ranges span the\
    \ ultraviolet to infrared (0.1\u201350 \xB5m) depending on the diagnostic system.\
    \ The number of sampling points is determined by the required spectral resolution\
    \ for the material model. The associated geometric scale can be compared to the\
    \ [length_of_optical_element](name:length_of_optical_element) and [area_of_optical_element](name:area_of_optical_element)\
    \ for full system characterization."
  unit: m
  physics_domain: radiation_measurement_diagnostics
