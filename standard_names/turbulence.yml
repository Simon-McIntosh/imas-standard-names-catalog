        \ species quantities defined at the root of the gyrokinetics_local IDS. A\
        \ key electrostatic shielding scale parameter in local gyrokinetic simulations."
      kind: llm
- name: normalized_effective_particle_energy
  kind: scalar
  status: active
  description: Normalized effective particle energy is the ratio of a species effective
    particle-energy coordinate to the positive species reference thermal-energy scale.
  documentation: 'Normalized effective particle energy is the ratio of a species effective
    particle-energy coordinate to the positive species reference thermal-energy scale.
    It is a dimensionless velocity-space coordinate for the effective single-particle
    energy relative to that species reference, not an independent temperature, mass,
    or charge ratio.


    The normalization is


    $$

    \bar{\mathcal{E}}_s = \frac{\mathcal{E}^{*}_{\mathrm{eff},s}}{E_{\mathrm{th,ref},s}}

    $$


    where $\bar{\mathcal{E}}_s$ is the normalized effective particle energy, $s$ labels
    the particle species, $\mathcal{E}^{*}_{\mathrm{eff},s}$ is the effective particle-energy
    coordinate for that species expressed on a scale compatible with the denominator,
    and $E_{\mathrm{th,ref},s} > 0$ is the species reference thermal-energy scale.
    If the reference is specified by a species reference temperature $T_{\mathrm{ref},s}$,
    the corresponding denominator is $E_{\mathrm{th,ref},s}=k_B T_{\mathrm{ref},s}$;
    the same reference temperature appears in [ratio_of_particle_temperature_to_reference_particle_temperature](name:ratio_of_particle_temperature_to_reference_particle_temperature).


    It is distinguished from [effective_particle_energy](name:effective_particle_energy),
    which denotes the effective-energy coordinate without requiring this particular
    species thermal normalization. If the effective particle energy contains an additive
    effective-potential term $U_{\mathrm{eff},s}$, its normalized contribution is
    $U_{\mathrm{eff},s}/E_{\mathrm{th,ref},s}$; with the same denominator this is
    normalized_particle_effective_potential. The detailed split of the effective energy
    into kinetic and potential terms and the choice of potential-energy zero are not
    fixed by this name.'
  unit: '1'
  physics_domain: turbulence
  links: []
  arguments:
  - name: effective_particle_energy
    operator: normalized
    operator_kind: qualifier
- name: derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy
  kind: scalar
  status: active
  description: Poloidal-angle derivative of the normalized effective particle-energy
    coordinate, resolving its variation around a magnetic flux surface at fixed flux-surface
    and toroidal coordinates.
  documentation: 'This quantity is the directional variation of the normalized effective
    particle-energy coordinate as position advances in poloidal angle. It resolves
    a specific poloidal derivative rather than the energy coordinate itself or its
    complete gradient.


    Using flux coordinates $(\psi,\theta,\phi)$, it is defined as


    $$

    \mathcal{E}_\theta = \left.\frac{\partial \mathcal{E}}{\partial \theta}\right|_{\psi,\phi}

    $$


    where $\mathcal{E}_\theta$ is the poloidal-angle derivative, $\mathcal{E}$ is
    [normalized effective particle energy](name:normalized_effective_particle_energy),
    $\theta$ is poloidal angle, $\psi$ is the flux-surface label, and $\phi$ is toroidal
    angle.


    The normalized coordinate relates [effective particle energy](name:effective_particle_energy)
    to a positive species reference thermal-energy scale. The derivative is evaluated
    at fixed $\psi$ and $\phi$ and may be positive, negative, or zero; when centrifugal
    contributions are included in the effective energy, it describes their poloidal
    variation relevant to species density behavior.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_effective_particle_energy
  arguments:
  - name: normalized_effective_particle_energy
    operator: derivative_with_respect_to_poloidal_angle
    operator_kind: unary_prefix
  sources:
  - dd_path: gyrokinetics_local/species/potential_energy_gradient_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-species-potential_energy_gradient_norm
    dd_documentation:
