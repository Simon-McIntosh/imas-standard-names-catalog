    dd_path: focs/twist
    status: composed
- name: vertical_coordinate_of_first_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the first defining point of a diagnostic
    line-of-sight chord in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z_1$ specifies the height of the first
    endpoint used to define the direction and extent of a diagnostic line-of-sight
    path, measured along the machine symmetry axis $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $R$ is the major radius, $\phi$ is the toroidal angle,
    and $Z$ is the vertical height. Together with the corresponding major-radius coordinate
    of the first point and the coordinates of the [second defining point](name:vertical_coordinate_of_second_point_of_line_of_sight),
    this quantity fully determines the chord geometry used for diagnostic viewing
    in instruments such as bolometers, electron cyclotron emission radiometers, interferometers,
    bremsstrahlung monitors, and X-ray spectrometers. Typical values range from approximately
    $-2$ m to $+2$ m for medium-size tokamaks, spanning the full vertical extent of
    the plasma cross-section. The coordinate is set during diagnostic design and may
    be refined through in-vessel survey measurements. For field-line tracing contexts,
    the analogous starting-point coordinate is [vertical_coordinate_of_field_line_start_point](name:vertical_coordinate_of_field_line_start_point).


    Sign convention: Positive when the first point of the line-of-sight lies above
    the machine midplane, i.e., in the $+Z$ direction.'
  unit: m
