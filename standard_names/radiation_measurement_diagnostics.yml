- name: lower_wavelength_of_filter
  kind: scalar
  status: draft
  description: Short-wavelength (high-photon-energy) edge of the transmission passband
    of a diagnostic filter or filter window. Radiation at shorter wavelengths than
    this nominal cutoff is attenuated below the specified transmission criterion.
  documentation: 'The lower wavelength of a filter, denoted $\lambda_{\min}$, is the
    nominal short-wavelength edge of the filter or filter-window transmission passband.
    It is expressed in meters and corresponds to the highest photon energies intended
    to be transmitted by the filter; photons with $\lambda < \lambda_{\min}$ are attenuated
    below the applicable transmission criterion.


    Photon energy is inversely related to wavelength:


    $$

    E_\gamma = \frac{hc}{\lambda}

    $$


    where $E_\gamma$ is photon energy, $h$ is Planck''s constant, $c$ is the speed
    of light, and $\lambda$ is photon wavelength. A smaller $\lambda_{\min}$ therefore
    means that higher-energy photons are included in the nominal transmitted band.


    In practice, $\lambda_{\min}$ is determined from a calibrated or manufacturer-specified
    spectral transmission curve $T(\lambda)$. The cutoff should correspond to an explicit
    attenuation or transmission threshold, such as the shortest wavelength at which
    $T(\lambda)$ rises above a chosen fraction of the in-band or peak transmission.
    Together with [upper_wavelength_of_filter](name:upper_wavelength_of_filter), this
    quantity gives the nominal wavelength interval of the filter, but the detailed
    wavelength-dependent response is described by quantities such as [spectral_absorptivity_of_filter](name:spectral_absorptivity_of_filter).


    Typical values depend strongly on the diagnostic spectral range: visible continuum
    filters often have lower wavelengths of about $3 \times 10^{-7}$-$8 \times 10^{-7}$
    m, soft-X-ray filter windows about $10^{-10}$-$10^{-8}$ m, and hard-X-ray filter
    windows about $10^{-12}$-$10^{-10}$ m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_wavelength_of_filter
  - name:wavelength_of_filter
  - name:spectral_absorptivity_of_filter
  - name:thickness_of_filter
  arguments:
  - name: wavelength_of_filter
    operator: lower
    operator_kind: qualifier
  sources:
