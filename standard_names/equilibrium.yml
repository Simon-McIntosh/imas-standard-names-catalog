- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the point where the secondary separatrix\
    \ intersects the divertor target plate in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The vertical coordinate of the strike point $Z_{\mathrm{SP}}$ defines
    the height on the divertor target where the plasma exhaust strikes during steady-state
    operation. This geometric quantity is extracted from equilibrium reconstruction
    and is critical for designing divertor geometry and controlling heat flux deposition.
    Typical values range from $Z \approx -1.5$ to $-2.0\,\mathrm{m}$ in ITER for lower
    single-null configurations, while in current machines like DIII-D or ASDEX Upgrade
    $Z_{\mathrm{SP}}$ falls within $\pm 0.2\,\mathrm{m}$ of the target location. The
    strike point is identified as the intersection of the separatrix magnetic surface
    with the divertor plate, and its vertical coordinate directly determines the poloidal
    flux expansion and thus the peak heat load. See also [major_radius_of_strike_point](name:major_radius_of_strike_point)
    for the radial coordinate of the same location, and [vertical_coordinate_of_secondary_separatrix](name:vertical_coordinate_of_secondary_separatrix)
    for the full separatrix outline.


    Sign convention: Positive when above the midplane ($Z=0$) in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
