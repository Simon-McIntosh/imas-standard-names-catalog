- name: radial_coordinate_of_measurement_position
  kind: scalar
  status: active
  description: "Major-radius coordinate of a measurement position, equal to its perpendicular\
    \ distance from the toroidal symmetry axis in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The radial coordinate is the major-radius location $R$ of the measurement
    position, measured perpendicularly from the toroidal symmetry axis. It identifies
    the position''s distance in the radial direction and is independent of its toroidal
    and vertical coordinates.


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates in the right-handed
    Cartesian $(x,y,z)$ basis, with $z$ aligned with the vertical $Z$ direction. The
    associated toroidal location is given by the [toroidal coordinate of measurement
    position](name:toroidal_coordinate_of_measurement_position). As a distance from
    the symmetry axis, $R$ is non-negative.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: barometry/gauge/position/r
    dd_version: 4.1.0
