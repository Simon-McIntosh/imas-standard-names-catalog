name: major_radius_of_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate of the magnetic axis, i.e., the location where
  $\nabla \psi = 0$ inside the plasma.
documentation: "The major radius of the magnetic axis, $R_{\\text{axis}}$, is the\
  \ $R$ coordinate (in the cylindrical $(R, \\phi, Z)$ system) at which the poloidal\
  \ magnetic flux gradient vanishes, $\\nabla \\psi = 0$, identifying the center of\
  \ the innermost nested flux surface. In the plasma control context this quantity\
  \ serves as a reference waveform target for radial position control of the plasma\
  \ column, actuated through the vertical-field and radial-field coil circuits. Typical\
  \ values are 1.0\u20131.1 m for small tokamaks (TCV, ASDEX Upgrade), 2.9\u20133.0\
  \ m for JET, and 6.2 m for ITER. Note that the unit listed as dimensionless (1)\
  \ indicates normalization within the pulse-schedule context; the physical dimension\
  \ is length (m). The magnetic axis position is obtained from equilibrium reconstruction\
  \ (e.g., EFIT, LIUQE) using external magnetics and, where available, internal diagnostics\
  \ such as motional Stark effect."
