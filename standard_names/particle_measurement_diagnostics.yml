      - neutron_diagnostic/detector/field_of_view/emission_grid/r
      - neutron_diagnostic/detector/field_of_view/emission_grid/phi
    enhanced_context:
      description: Average solid angle subtended by a neutron detector within each
        voxel of the voxelized plasma field-of-view. Used to weight neutron emission
        contributions from each plasma volume element seen by the detector.
      kind: llm
- name: surface_area_of_neutron_detector
  kind: scalar
  status: active
  description: Geometric area of the neutron-sensitive detector surface, excluding
    passive housing, shielding, supports, electronics, projection effects, and solid-angle
    weighting.
  documentation: 'The quantity is the geometric area of the neutron-sensitive active
    surface of the detector. It includes the physical sensitive face, including contributions
    from segmented or curved surfaces, and excludes passive detector structures.


    The area is defined by integration over the neutron-sensitive surface:


    $$

    A = \int_{S_{\rm active}} dS

    $$


    where $S_{\rm active}$ is the neutron-sensitive surface and $dS$ is an element
    of geometric surface area. This is the active-surface component represented by
    [area of neutron detector](name:area_of_neutron_detector); it is not an effective
    area weighted by detection efficiency, neutron incidence angle, projection, or
    solid angle.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_neutron_detector
