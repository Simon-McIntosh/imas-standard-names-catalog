- name: parallel_ion_current_density
  kind: scalar
  status: draft
  description: Parallel ion current density is the projection of the total ion electric-current
    density onto the local magnetic-field direction. It is a charge-weighted sum over
    ion species and charge states, so each ion particle flux contributes in proportion
    to its charge state rather than as an unweighted particle count.
  documentation: 'Parallel ion current density is the component of ion electric-current
    density flowing along the local magnetic field. For an ion population with multiple
    species or charge states, the unqualified quantity represents the total ion contribution,
    obtained by charge-weighting and summing the parallel particle fluxes of the contributing
    ion populations.


    The projection and charge-weighted aggregation are


    $$

    j_{\parallel i} = \mathbf{j}_i \cdot \hat{\mathbf{b}} = e \sum_s Z_s \, \Gamma_{\parallel
    s}

    $$


    where $j_{\parallel i}$ is the parallel ion current density in A m$^{-2}$, $\mathbf{j}_i$
    is the total ion current-density vector in A m$^{-2}$, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field, $e$ is the elementary charge
    in C, $s$ indexes ion species and charge states, $Z_s$ is the ion charge state,
    and $\Gamma_{\parallel s}$ is the signed parallel particle flux of population
    $s$ in m$^{-2}$ s$^{-1}$. This distinguishes the current density from an unweighted
    ion particle flux: highly charged ions contribute proportionally more electric
    current for the same particle flux.


    In practice, this quantity may be inferred from charged-particle collection by
    Langmuir probes or other plasma-facing collectors using a sheath and collection-area
    model, local magnetic-field direction, and surface geometry. It may also be computed
    from kinetic or fluid descriptions by taking the first velocity moment of the
    ion distribution for each species and charge state, multiplying by charge, summing,
    and projecting along $\hat{\mathbf{b}}$.


    Representative boundary-plasma magnitudes vary strongly with density, temperature,
    magnetic-field incidence angle, and proximity to material surfaces. Edge and divertor
    measurements commonly span order-of-magnitude ranges such as $10^2$-$10^5$ A m$^{-2}$,
    with larger transient or near-sheath values possible in high-flux conditions.


    Sign convention: Positive when the net ion charge flux is in the local magnetic-field
    direction $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_current_density
  - name:effective_area_of_langmuir_probe
  - name:parallel_ion_fluctuating_current_density
  - name:ion_saturated_current_density
