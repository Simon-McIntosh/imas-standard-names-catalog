- name: breakdown_initial_time
  kind: scalar
  status: active
  description: Timestamp locating the onset of plasma breakdown, defined by plasma
    initiation and the beginning of discharge-current flow.
  documentation: 'This quantity identifies the instant at which plasma breakdown begins:
    plasma is initiated and discharge current starts to flow.


    It applies specifically to the onset of the plasma-breakdown phase in a discharge.
    It is an event timestamp, not an elapsed duration, period, or time assigned to
    a later phase of the discharge.


    The [pulse duration](name:pulse_duration) uses this breakdown instant as its starting
    point and measures the subsequent confined-plasma interval; therefore, this quantity
    and pulse duration represent distinct timing concepts.'
  unit: s
  physics_domain: machine_operations
  links:
  - name:pulse_duration
  sources:
