      kind: llm
- name: voltage_of_spectrometer
  kind: scalar
  status: active
  description: Voltage of a spectrometer is the signed electric potential difference
    between two designated electrical terminals of a spectrometer. It is the spectrometer-level
    quantity, not a voltage assigned to an individual spectrometer channel.
  documentation: 'Voltage of a spectrometer is the signed electric potential difference
    between two designated electrical terminals of a spectrometer. The terminal pair
    may define a control, bias, supply, or signal-output voltage, provided the locus
    is the spectrometer as an instrument rather than an individual channel.


    For designated terminals $a$ and $b$, the voltage is defined by the electric-potential
    difference:


    $$

    V = \varphi_a - \varphi_b

    $$


    where $V$ is the voltage of the spectrometer and $\varphi_a$ and $\varphi_b$ are
    the electric potentials, each expressed in volts, at the positive and reference
    terminals respectively.


    This spectrometer-level quantity is distinct from [voltage of a spectrometer channel](name:voltage_of_spectrometer_channel),
    which applies to a designated terminal pair of one spectrometer channel. It denotes
    an electrical potential difference only; photon flux, spectral radiance, and other
    calibrated optical quantities are separate physical quantities.


    Sign convention: Positive when the designated positive terminal of the spectrometer
    is at a higher electric potential than the designated reference terminal.'
  unit: V
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:requested_voltage_of_spectrometer
  - name:spectral_flux_of_spectrometer_channel
  sources:
