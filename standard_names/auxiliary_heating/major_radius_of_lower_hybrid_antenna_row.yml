name: major_radius_of_lower_hybrid_antenna_row
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of a waveguide row in a lower-hybrid current-drive
  antenna.
documentation: "The major radius $R_{\\mathrm{LH}}$ specifies the radial position\
  \ of a single waveguide row within a lower-hybrid (LH) antenna module in the tokamak\
  \ cylindrical coordinate system $(R, \\phi, Z)$. Lower-hybrid antennas are phased\
  \ waveguide arrays (grills) mounted on the low-field-side wall; each row launches\
  \ a traveling wave with a prescribed parallel refractive index $n_\\parallel$ spectrum\
  \ used for current drive and profile control. Accurate knowledge of each row's major\
  \ radius is needed for ray-tracing and full-wave coupling calculations (e.g., GRILL3D,\
  \ C3PO/LUKE) that map the launched power to in-plasma deposition profiles. Typical\
  \ values are close to the outboard first-wall radius: $R_{\\mathrm{LH}} \\approx\
  \ 2.5$\u2013$3.0\\;\\mathrm{m}$ for JET, $\\sim 2.4\\;\\mathrm{m}$ for Tore Supra\
  \ / WEST, and $\\sim 8.5\\;\\mathrm{m}$ for a possible ITER LH system. The companion\
  \ vertical coordinate $Z$ completes the poloidal-plane location of the row. See\
  \ also `radial_component_of_lower_hybrid_electric_field` for the wave field at the\
  \ antenna mouth."
