- name: minimum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Smallest value of total magnetic field magnitude on each nested toroidal
    flux surface, used in determining the magnetic trapping condition for charged
    particles in bounce motion.
  documentation: 'The minimum magnetic field magnitude $B_\mathrm{min}(\psi)$ is the
    smallest value of $|\mathbf{B}|$ over all points on the flux surface labeled by
    poloidal flux $\psi$. In tokamaks with a dominant toroidal field satisfying $B_\phi
    \propto 1/R$, the minimum occurs near the outboard (low-field-side) midplane,
    where the major radius $R$ reaches its largest value on the flux surface.


    The ratio $B_\mathrm{min}/B_\mathrm{max}$ governs magnetic trapping of charged
    particles bouncing along field lines. A particle with normalized parallel velocity
    $\xi = v_\parallel/v$ is magnetically trapped when


    $$

    \xi^2 < 1 - \frac{B_\mathrm{min}}{B_\mathrm{max}}

    $$


    where $v_\parallel$ is the velocity component along the magnetic field and $v$
    is the total particle speed. The resulting trapped particle fraction enters neoclassical
    transport coefficients, bootstrap current models, and bounce-averaged kinetic
    equations.


    $B_\mathrm{min}$ is obtained from MHD equilibrium reconstruction by minimizing
    the total field strength $|\mathbf{B}(\psi, \theta)|$ over the poloidal angle
    $\theta$ on each flux surface. Together with [maximum_magnetic_field_magnitude](name:maximum_magnetic_field_magnitude)
    and [flux_surface_average_magnetic_field](name:flux_surface_average_magnetic_field),
    it fully characterizes the field-strength variation on a flux surface that is
    relevant for classifying particle orbits.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_magnitude
  - name:flux_surface_average_magnetic_field
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_min
    dd_path: equilibrium/time_slice/profiles_1d/b_field_min
    status: composed
  - id: dd:equilibrium/time_slice/profiles_1d/b_min
    dd_path: equilibrium/time_slice/profiles_1d/b_min
    status: attached
- name: minor_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Half the difference between the maximum and minimum major radii of
    the plasma boundary contour, giving the characteristic radial half-width of the
    outermost closed flux surface.
  documentation: "The minor radius $a$ of the plasma boundary is a fundamental geometric\
    \ length quantifying the radial half-extent of the outermost closed flux surface.\
    \ Together with the [major radius of the plasma boundary](name:major_radius_of_plasma_boundary),\
    \ it sets the first-order cross-sectional size and determines the plasma aspect\
    \ ratio.\n\nThe minor radius is defined from the extremal major radii of the boundary\
    \ outline in the right-handed cylindrical $(R, \\phi, Z)$ frame:\n\n$$\na = \\\
    frac{R_{\\max} - R_{\\min}}{2}\n$$\n\nwhere $R_{\\max}$ and $R_{\\min}$ are the\
    \ maximum and minimum values of the major radius $R$ along the closed poloidal\
    \ boundary contour.\n\nThe minor radius is obtained from equilibrium reconstruction\
    \ using external magnetic measurements \u2014 flux loops and poloidal field probes\
    \ \u2014 supplemented by internal constraints from motional Stark effect polarimetry\
    \ or pressure-profile data. It also serves directly as a position-control reference\
    \ in plasma shape control.\n\nValues range from 0.2\u20130.3 m in small tokamaks\
    \ to ~2 m in large high-current devices. The inverse aspect ratio $\\epsilon =\
    \ a / R_0$ (where $R_0$ is the major radius on axis) underpins dimensionless confinement\
    \ scalings, and derived shape descriptors such as [elongation of the plasma boundary](name:elongation_of_plasma_boundary)\
    \ and the [poloidal boundary perimeter](name:length_of_plasma_boundary) are both\
    \ normalized by $a$.\n\nSign convention: Positive when $R_{\\max} > R_{\\min}$\
    \ along the boundary contour in the $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  - name:length_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/minor_radius
    dd_path: equilibrium/time_slice/boundary/minor_radius
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/minor_radius
