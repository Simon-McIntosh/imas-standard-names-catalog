- name: beryllium_density
  description: |-
    Local number density of beryllium impurity ions per unit plasma volume,
    summed over all ionization states from singly ionized to fully stripped
    (Be1+ through Be4+), excluding neutral beryllium atoms.
  documentation: |-
    Beryllium (atomic number $Z = 4$) enters the plasma primarily through
    sputtering or evaporation from beryllium first-wall surfaces. The local
    beryllium ion number density $n_\mathrm{Be}$ aggregates contributions from
    all four charged ionization stages:

    $$
    n_\mathrm{Be} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}
    $$

    where $n_{\mathrm{Be}^{z+}}$ is the number density of beryllium ions in
    charge state $z+$, with $z$ running from 1 (singly ionized) to 4 (fully
    stripped). Neutral beryllium atoms are excluded from this sum.

    Beryllium impurity content is inferred from passive spectroscopy of
    beryllium emission lines or from active charge-exchange recombination
    spectroscopy, with spatially resolved profiles reconstructed by tomographic
    inversion of chord-integrated measurements. Spatially averaged
    representations include
    [line_averaged_beryllium_density](name:line_averaged_beryllium_density)
    along a diagnostic chord and
    [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density)
    integrated over the confined plasma volume. The relative impurity abundance
    with respect to the electron population is characterized by the
    ratio_of_beryllium_density_to_electron_density.
  unit: m^-3

- name: diameter_of_diagnostic_aperture
  description: |-
    Full transverse diameter of a circular diagnostic aperture, measured across
    its center between opposite points on the circumferential boundary.
  documentation: |-
    This quantity is the full transverse extent of the clear circular opening at
    the diagnostic entrance pupil, measured between opposite points on its
    circumferential boundary.

    The diameter is defined by

    $$
    D = 2r
    $$

    where $D$ is the aperture diameter and $r$ is the geometric radius given by
    the [radius of the diagnostic aperture](name:radius_of_diagnostic_aperture).

    The quantity describes the opening geometry only; it excludes aperture
    thickness, housing dimensions, and the width of a noncircular aperture. The
    diameter determines the geometric area and contributes to the solid-angle
    acceptance together with the aperture-to-source distance.
  unit: m

- name: difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line
  description: |-
    Signed wavelength displacement of a selected fast-neutral-beam spectral-line
    component from its reference wavelength, caused by the motional Stark
    electric field.
  documentation: |-
    The motional-Stark wavelength displacement is the signed separation between
    a selected spectral-line component from fast neutral beam particles and its
    unshifted reference wavelength. It represents the Lorentz shift produced by
    the electric field arising from particle motion across the magnetic field.

    $$
    \Delta\lambda_{\mathrm{MS}} = \lambda_{\mathrm{component}} - \lambda_{\mathrm{reference}}
    $$

    where $\Delta\lambda_{\mathrm{MS}}$ is the motional-Stark wavelength
    displacement, $\lambda_{\mathrm{component}}$ is the wavelength of the
    selected component, and $\lambda_{\mathrm{reference}}$ is the corresponding
    unshifted wavelength. The motional electric field is
    $\mathbf{E}_{\mathrm{motional}} = \mathbf{v} \times \mathbf{B}$, where
    $\mathbf{v}$ is the fast-neutral velocity and $\mathbf{B}$ is the magnetic
    field.

    This quantity is distinct from the Doppler wavelength difference caused by
    line-of-sight motion, represented by [difference of neutral-beam Doppler
    wavelength and neutral-beam reference
    wavelength](name:difference_of_neutral_beam_doppler_wavelength_and_reference_wavelength_of_spectral_line).
    Positive displacement denotes a component at a longer wavelength than the
    reference.
  unit: m

- name: difference_of_neutral_beam_doppler_wavelength_and_reference_wavelength_of_spectral_line
  description: |-
    Signed displacement of a neutral-beam spectral-line wavelength from its
    reference value, produced by bulk neutral-beam motion along the viewing line
    of sight.
  documentation: |-
    This quantity is the signed difference between the Doppler-displaced
    wavelength of a neutral-beam spectral line and its unshifted reference
    wavelength of the spectral line. It represents the bulk neutral-beam
    velocity projected along the viewing line of sight.

    The displacement is defined by

    $$
    \Delta\lambda_{\mathrm{D}} = \lambda_{\mathrm{D}} - \lambda_{\mathrm{ref}} \simeq \lambda_{\mathrm{ref}}\frac{v_{\mathrm{los}}}{c}
    $$

    where $\lambda_{\mathrm{D}}$ is the Doppler-displaced wavelength,
    $\lambda_{\mathrm{ref}}$ is the reference wavelength, $v_{\mathrm{los}}$ is
    the signed bulk velocity component along the line of sight, and $c$ is the
    speed of light. The approximation applies when the projected velocity is
    small compared with $c$.

    The quantity excludes the distinct wavelength displacement produced by the
    Lorentz shift from the motional Stark electric field; that effect is
    represented by [difference of fast neutral beam motional Stark wavelength
    and fast neutral beam reference wavelength of spectral
    line](name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line).

    Sign convention: Positive when the Doppler-displaced wavelength exceeds the
    reference wavelength, corresponding to a redshift.
  unit: m

- name: effective_area_of_langmuir_probe
  description: |-
    Effective collection area of a Langmuir probe, obtained by projecting its
    plasma-facing collector surface onto the plane normal to the local magnetic
    field.
  documentation: |-
    The effective area of a Langmuir probe is the plasma-facing collector
    surface area projected onto the plane perpendicular to the local
    magnetic-field direction. It represents the area governing particle
    collection when the sheath is magnetized.

    $$
    A_{\mathrm{eff}} = \int_{S_{\mathrm{w}}} \left|\hat{\mathbf{n}} \cdot \hat{\mathbf{b}}\right|\,dA
    $$

    where $A_{\mathrm{eff}}$ is the effective collection area, $S_{\mathrm{w}}$
    is the plasma-exposed collector surface, $\hat{\mathbf{n}}$ is the local
    outward unit normal, $\hat{\mathbf{b}}$ is the local magnetic-field unit
    vector, and $dA$ is an element of collector surface area. The absolute dot
    product gives the geometrical projection factor.

    Unlike the total area of a Langmuir probe, this quantity accounts for
    magnetic-field orientation; unlike the [wetted area of a Langmuir
    probe](name:wetted_area_of_langmuir_probe), it is not the unprojected
    plasma-exposed surface area.
  unit: m^2

- name: first_local_tangential_coordinate_of_neutron_detector
  description: |-
    Signed coordinate of a neutron-detector outline vertex along the first local
    tangential axis of the right-handed local basis (e1, e2, e3), paired with
    the second coordinate to define the detector cross section.
  documentation: |-
    Signed coordinate of a neutron-detector outline vertex along the first local
    tangential axis is the scalar displacement of that vertex from the detector
    cross-section local origin projected onto $\hat{e}_1$. The right-handed
    local detector basis $(\hat{e}_1,\hat{e}_2,\hat{e}_3)$ has $\hat{e}_3$ as
    the plasma-facing normal to the detector cross section, $\hat{e}_1$ as the
    tangential axis whose positive sense is toward increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, and $\hat{e}_2 =
    \hat{e}_3 \times \hat{e}_1$.

    The coordinate is defined by the local tangent-plane projection:

    $$
    \ell_1 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{e}_1
    $$

    where $\ell_1$ is this first local tangential coordinate, $\mathbf{r}_v$ is
    the position vector of the outline vertex, $\mathbf{r}_0$ is the position
    vector of the detector cross-section local origin, and $\hat{e}_1$ is the
    first local tangential unit vector.

    Together with the [second local tangential coordinate of the neutron
    detector](name:second_local_tangential_coordinate_of_neutron_detector), this
    coordinate specifies the in-plane position of an outline vertex of the
    detector cross section. It is not a cylindrical $R$, $\phi$, or $Z$ position
    in the right-handed cylindrical $(R,\phi,Z)$ frame and does not denote
    displacement normal to the detector cross section.

    Sign convention: Positive when the outline vertex is displaced from the
    local origin in the $+\hat{e}_1$ direction.
  unit: m

- name: height_of_neutron_detector
  description: |-
    Full physical extent of a rectangular neutron-detector aperture along its
    second local tangential direction, the X2 axis of the detector-local
    Cartesian frame.
  documentation: |-
    The quantity is the full end-to-end extent of a rectangular neutron-detector
    aperture along its second local tangential direction. This direction is the
    $X_2$ axis of the detector-local Cartesian basis $(\hat{X}_1, \hat{X}_2)$.

    The extent is defined by the separation of the two boundary coordinates
    along $X_2$:

    $$
    H_2 = X_{2,\max} - X_{2,\min}
    $$

    where $X_{2,\max}$ and $X_{2,\min}$ are the maximum and minimum
    aperture-boundary coordinates along $X_2$, and $H_2$ is the resulting
    length.

    This quantity describes the second local tangential dimension and is
    distinct from the [width of the neutron
    detector](name:first_local_tangential_width_of_diagnostic_aperture), which
    measures the corresponding first local tangential dimension. For a circular
    aperture, the radial size is instead characterized by the [radius of the
    neutron detector](name:radius_of_neutron_detector).
  unit: m

- name: helium_3_density
  description: |-
    Local number density of charged helium-3 ions, obtained by summing their
    populations over all included ionization states at a plasma location.
  documentation: |-
    Helium-3 ion number density is the local count of charged helium-3 ions per
    unit plasma volume at a specified plasma location. It is summed over the
    singly ionized and fully stripped charge states and excludes neutral
    helium-3 atoms.

    $$
    n_{{}^{3}\mathrm{He}}(\mathbf{x}) = \sum_{Z=1}^{2} n_{{}^{3}\mathrm{He},Z}(\mathbf{x})
    $$

    where $\mathbf{x}$ is the plasma location, $Z$ is the ionic charge state,
    and $n_{{}^{3}\mathrm{He},Z}$ is the number density of helium-3 ions in
    charge state $Z$, expressed in m$^{-3}$. The [volume-averaged helium-3
    density](name:volume_averaged_helium_3_density) and [line-averaged helium-3
    density](name:line_averaged_helium_3_density) are spatial averages of this
    local quantity over their respective domains.
  unit: m^-3

- name: helium_4_density
  description: |-
    Local number density of helium-4 ions per unit plasma volume, the principal
    measure of fusion ash concentration in deuterium-tritium burning plasmas.
  documentation: |-
    The helium-4 ion number density $n_{{}^4\text{He}}$ quantifies the local
    concentration of ${}^4\text{He}$ nuclei at a given point in the plasma. At
    fusion-relevant temperatures (several keV), helium-4 is fully stripped to
    He$^{2+}$, and in deuterium-tritium burning plasmas it accumulates as the
    primary fusion ash product of the reaction ${}^2\text{H} + {}^3\text{H}
    \rightarrow {}^4\text{He} + n$; its buildup dilutes the fuel and reduces the
    fusion reaction rate if not exhausted by the divertor system.

    The time evolution of $n_{{}^4\text{He}}$ is governed by the particle
    continuity equation

    $$
    \frac{\partial n_{{}^4\text{He}}}{\partial t} + \nabla \cdot \boldsymbol{\Gamma}_{{}^4\text{He}} = S_{{}^4\text{He}}
    $$

    where $\boldsymbol{\Gamma}_{{}^4\text{He}}$ is the helium-4 particle flux
    and $S_{{}^4\text{He}}$ is the volumetric source rate from fusion reactions
    and ionization of recycled helium neutrals at the plasma edge.

    The helium-4 density is measured primarily via charge exchange recombination
    spectroscopy, where injected neutral beam atoms undergo charge exchange with
    He$^{2+}$ ions to produce line emission from excited helium atoms; passive
    spectroscopy of edge recycling emission provides a complementary approach.
    Chord-averaged and volume-averaged forms are provided by
    [line_averaged_helium_4_density](name:line_averaged_helium_4_density) and
    [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density)
    respectively, while
    [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)
    gives the boundary value.

    In D-T burning plasmas, central He-4 densities are in the range
    $10^{18}$-$10^{19}$ m$^{-3}$, with the helium-to-electron density ratio —
    captured by
    [fraction](name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density)
    — kept below approximately 5-10% in steady state to avoid excessive fuel
    dilution.
  unit: m^-3

- name: krypton_density
  description: |-
    Number density of krypton ions at a point in the plasma, summed over all
    ionized charge states from Kr1+ through fully stripped Kr36+ and excluding
    neutral krypton atoms.
  documentation: |-
    Number density of krypton ions at a point in the plasma, summed over all
    ionized charge states from Kr$^{1+}$ through fully stripped Kr$^{36+}$;
    neutral krypton atoms are excluded.

    With krypton atomic number $Z_\mathrm{Kr}=36$, the ion density is the
    charge-state sum:

    $$
    n_\mathrm{Kr} = \sum_{q=1}^{36} n_\mathrm{Kr}^{(q)}
    $$

    where $n_\mathrm{Kr}^{(q)}$ is the number density of krypton ions in charge
    state $q$ and the neutral state $q=0$ is omitted from the sum.

    This is an extensive, charge-state-summed species density, not a
    density-weighted mean over charge states and not the charge-state-resolved
    [ion charge-state density](name:ion_charge_state_density), which retains the
    individual $n_\mathrm{Kr}^{(q)}$ terms. It is an absolute density, distinct
    from the relative [krypton
    fraction](name:ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density)
    normalized to the electron density. The locus-specific values
    [krypton_density_at_magnetic_axis](name:krypton_density_at_magnetic_axis),
    krypton_density_at_pedestal, and
    [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target)
    share this ions-only charge-state scope. In contrast,
    [volume_averaged_krypton_density](name:volume_averaged_krypton_density)
    includes all krypton charge states from neutral through fully stripped, so
    its charge-state scope differs from this ions-only local quantity; the
    [line_averaged_krypton_density](name:line_averaged_krypton_density) likewise
    carries its own averaging definition.
  unit: m^-3

- name: launched_pulse_energy_of_thomson_scattering_laser
  description: |-
    Optical energy carried by one Thomson-scattering laser pulse immediately
    before it enters the vacuum vessel, before interaction with the plasma.
  documentation: |-
    This quantity is the optical energy carried by one Thomson-scattering
    probing laser pulse at the vessel entrance, before the pulse interacts with
    the plasma.

    The pulse energy is defined by integrating the instantaneous laser power
    over the pulse duration:

    $$
    E_{\rm pulse} = \int_{t_0}^{t_1} P_{\rm laser}(t)\,dt
    $$

    where $E_{\rm pulse}$ is the pulse energy, $P_{\rm laser}(t)$ is the
    instantaneous optical power at the vessel entrance, and $t_0$ and $t_1$ are
    the pulse start and end times.

    The quantity applies to a single probing-laser pulse immediately before
    vessel entry. It is an energy aggregation over that pulse only, not a sum
    over multiple pulses or a time-integrated laser train.

    It excludes energy lost after vessel entry, energy remaining after plasma
    crossing, scattered optical energy, and laser-system energy not carried by
    the incident pulse.

    The incident pulse energy provides the normalization for absolute
    interpretation of Thomson-scattered signal intensity. It is distinct from
    the wavelength-dependent response described by the [spectral efficiency of
    the Thomson-scattering
    detector](name:spectral_efficiency_of_thomson_scattering_detector).
  unit: J

- name: line_averaged_beryllium_density
  description: |-
    Chord-average of the beryllium ion number density along a diagnostic line of
    sight, equal to the path integral of the local beryllium density divided by
    the chord length.
  documentation: |-
    The line-averaged beryllium ion number density quantifies the mean beryllium
    ion content along a plasma diagnostic chord, normalized by chord length. It
    is the chord-integrated analog of the local
    [beryllium_density](name:beryllium_density) and is the most directly
    accessible measure of beryllium impurity concentration from line-of-sight
    diagnostics.

    The quantity is defined as:

    $$
    \bar{n}_{Be} = \frac{1}{L} \int_0^L n_{Be}(l) \, dl
    $$

    where $n_{Be}(l)$ is the local beryllium ion number density at path
    coordinate $l$ along the chord and $L$ is the total chord length.

    Inferred from passive spectroscopy of beryllium emission lines by inverting
    chord-integrated emission intensities using atomic emissivity coefficients;
    the result aggregates contributions from all beryllium ionization states
    present along the chord. The
    [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density)
    provides a complementary global volume average, while
    [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    gives the local on-axis value.

    Sign convention: Positive when beryllium ions populate the measurement
    chord.
  unit: m^-3

- name: line_averaged_helium_3_density
  description: |-
    Line-averaged helium-3 density is the chord-length average of local ionized
    helium-3 density along a specified viewing path, excluding neutral atoms.
  documentation: |-
    Line-averaged helium-3 density is the chord-length average of the local
    helium-3 ion number density along a specified path. It includes singly
    ionized $^3\mathrm{He}^{+}$ and fully stripped $^3\mathrm{He}^{2+}$ ions,
    while excluding neutral helium-3 atoms.

    The line average is defined by

    $$
    \overline{n}_{^3\mathrm{He}} = \frac{1}{L}\int_{0}^{L} n_{^3\mathrm{He}}(s)\,\mathrm{d}s
    $$

    where $\overline{n}_{^3\mathrm{He}}$ is the line-averaged density,
    $n_{^3\mathrm{He}}(s)$ is the local charge-state-summed density at path
    coordinate $s$, and $L$ is the chord length. Unlike the volume average in
    [volume-averaged helium-3 density](name:volume_averaged_helium_3_density),
    this quantity weights each position uniformly by distance along the path. It
    is a path-integrated representation of [helium-3
    density](name:helium_3_density), not a separate charge-state population.
  unit: m^-3

- name: line_averaged_helium_4_density
  description: |-
    Chord-averaged helium-4 ion number density along a specified line of sight
    through the plasma, representing the path mean of local fusion-ash
    concentration.
  documentation: |-
    The line-averaged helium-4 ion number density is the path average of the
    local helium-4 ion density along a specified chord through the plasma. It
    represents an effective density for that chord, not the local value at a
    point or a volume-wide mean.

    The line average is defined by

    $$
    \overline{n}_{{}^4\mathrm{He}} = \frac{1}{L}\int_{0}^{L} n_{{}^4\mathrm{He}}(l)\,dl
    $$

    where $n_{{}^4\mathrm{He}}(l)$ is the local helium-4 ion number density from
    [helium_4_density](name:helium_4_density), $l$ is distance along the chord,
    and $L$ is the chord length; $l$ and $L$ are measured in m.

    The average includes the local helium-4 ion density along the specified path
    and uses uniform path-length weighting. Unlike
    [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    it is not averaged over the confined plasma volume.
  unit: m^-3

- name: line_averaged_krypton_density
  description: |-
    Line-averaged krypton density is the chord-length average of the total local
    krypton number density, summed over all charge states from neutral krypton
    through fully stripped krypton.
  documentation: |-
    Line-averaged krypton density is the chord-length average of the total local
    krypton number density. It includes every krypton charge state, so it
    measures elemental krypton abundance along a specified line of sight rather
    than the density of one particular ionization state.

    For a chord parameterized by path length, the line average is defined by:

    $$
    \langle n_\mathrm{Kr} \rangle_\mathrm{line} = \frac{1}{L}\int_0^L \sum_{q=0}^{36} n_\mathrm{Kr}^{(q)}(\ell)\,d\ell = \frac{1}{L}\int_0^L n_\mathrm{Kr}(\ell)\,d\ell
    $$

    where $\langle n_\mathrm{Kr} \rangle_\mathrm{line}$ has units of
    $\mathrm{m}^{-3}$, $L$ is the chord length in meters, $\ell$ is distance
    along the chord in meters, $q$ is the integer charge-state index with $q=0$
    for neutral krypton and $q=36$ for fully stripped krypton,
    $n_\mathrm{Kr}^{(q)}$ is the local density of charge state $q$ in
    $\mathrm{m}^{-3}$, and $n_\mathrm{Kr}=\sum_{q=0}^{36} n_\mathrm{Kr}^{(q)}$
    is the charge-state-summed local [krypton_density](name:krypton_density).

    This quantity is a normalized path mean, not an unnormalized line integral.
    It differs from
    [volume_averaged_krypton_density](name:volume_averaged_krypton_density),
    which averages the same charge-state-summed local density over a plasma
    volume rather than along a chord.
  unit: m^-3

- name: line_averaged_lithium_density
  description: |-
    Path-length-averaged total number density of lithium ions along a specified
    plasma chord, summed over Li+ through fully stripped Li3+ and excluding
    neutral lithium.
  documentation: |-
    This is the path-length average of lithium ion number density, summed over
    all ionization stages from Li$^+$ through fully stripped Li$^{3+}$, along a
    specified chord through the plasma.

    The chord average is defined by

    $$
    \langle n_{Li} \rangle_L = \frac{1}{L}\int_0^L n_{Li}(s)\,ds
    $$

    where $n_{Li}(s)$ is the local lithium ion number density in m$^{-3}$, $s$
    is path length in meters along the chord, and $L$ is the total chord length
    in meters.

    This quantity weights each path-length element equally and excludes neutral
    lithium. It differs from the flux-surface-averaged lithium density at the
    plasma boundary, which averages over a separatrix, and from [volume-averaged
    lithium density](name:volume_averaged_lithium_density), which averages over
    confined plasma volume.
  unit: m^-3

- name: line_averaged_total_ion_density
  description: |-
    Total ion number density averaged along a specified plasma chord, summing
    all ion species and charge states, including thermal and non-thermal ions.
  documentation: |-
    The line-averaged total ion density is the chord average of the local [total
    ion density](name:total_ion_number_density), including all ion species,
    resolved charge states, and thermal and non-thermal ion populations. It
    excludes electron density.

    $$
    n_{\mathrm{i,line}} = \frac{1}{L}\int_0^L n_{\mathrm{i,total}}(l)\,dl
    $$

    where $l$ is distance along the chord, $L$ is chord length,
    $n_{\mathrm{i,total}}(l)$ is local total ion density, and
    $n_{\mathrm{i,line}}$ is the resulting line average. Unlike the
    [volume-averaged total ion density](name:volume_averaged_total_ion_density),
    it averages along a chord rather than throughout a volume.
  unit: m^-3

- name: neutral_pressure_of_mass_spectrometer_channel
  description: |-
    Neutral pressure of a mass-spectrometer channel is the calibrated
    neutral-gas pressure equivalent assigned to a selected mass-to-charge
    channel. It denotes a channel-resolved neutral contribution and does not
    require correspondence to a unique neutral species.
  documentation: |-
    Neutral pressure of a mass-spectrometer channel is the calibrated
    neutral-gas pressure equivalent assigned to one mass-discriminated channel
    of a mass spectrometer. The channel denotes a response in mass-to-charge
    space after ionization, so the quantity is a pressure equivalent for
    neutrals that can contribute to that channel, not a pressure of the detected
    ions.

    This quantity is neutral in scope: it excludes charged-particle plasma
    pressure, electron pressure, and any pressure contribution not represented
    as neutral gas before ionization. It is the neutral-specific counterpart of
    pressure of a mass-spectrometer channel.

    A channel value need not be the thermodynamic partial pressure of a single
    species, because fragmentation, isotopologues, charge states of produced
    ions, and isobaric species can overlap in the same mass-to-charge channel.
    Summing channel values represents [total neutral
    pressure](name:total_neutral_pressure) only when the calibrated channels are
    non-overlapping, span the neutral mixture being represented, and treat
    cross-sensitivities consistently.
  unit: Pa

- name: neutron_flux_of_neutron_detector
  description: |-
    Fusion-neutron number flux incident on the neutron detector’s active
    surface, giving the rate at which neutrons cross each unit of that surface.
  documentation: |-
    This quantity is the incident fusion-neutron number flux on the
    neutron-sensitive active surface of the detector. It is the surface-crossing
    flux, not the neutron production rate or the registered detection-event rate
    described by rate of neutron detector. The parent quantity flux of neutron
    detector expresses the same surface-transport concept.

    The defining relation is

    $$
    \Phi_n = \frac{dN_n}{dA\,dt}
    $$

    where $\Phi_n$ is the incident neutron number flux, $N_n$ is the number of
    neutrons crossing the active surface, $A$ is active surface area, and $t$ is
    time. The surface is the neutron-sensitive area characterized by area of
    neutron detector; passive housing, shielding, supports, and electronics are
    excluded. Registered event rates additionally depend on detector response
    and efficiency.
  unit: m^-2.s^-1

- name: neutron_maximum_energy_of_neutron_detector
  description: |-
    High-energy endpoint of the neutron kinetic-energy interval assigned to a
    neutron detector energy band.
  documentation: |-
    The maximum neutron energy of a detector band is the upper kinetic-energy
    boundary used to classify energy-resolved neutron counts. It is an
    instrumental band limit, not the maximum energy present in the neutron
    population.

    The selected energy interval is bounded by

    $$
    E_{\min} \leq E_n \leq E_{\max}
    $$

    where $E_n$ is neutron kinetic energy, $E_{\min}$ is the lower band
    boundary, and $E_{\max}$ is this quantity. The lower boundary is represented
    by lower-bound neutron-detector energy; neutron-detector energy denotes a
    band boundary without specifying which edge.
  unit: eV

- name: nitrogen_density
  description: |-
    Number density of nitrogen nuclei is the local count of nitrogen atomic
    nuclei per plasma volume, summed over all charge states from neutral through
    fully stripped nitrogen.
  documentation: |-
    Number density of nitrogen nuclei is the local count of nitrogen atomic
    nuclei per plasma volume. It is a species-level elemental density, so
    neutral nitrogen and every ionized nitrogen charge state are included.

    The charge-state aggregation is defined by

    $$
    n_N = \sum_{z=0}^{7} n_{N,z}
    $$

    where $n_N$ is the nitrogen density, $n_{N,z}$ is the number density of
    nitrogen nuclei in charge state $z$, $z=0$ denotes neutral nitrogen, and
    $z=7$ denotes fully stripped nitrogen because nitrogen has atomic number
    $7$.

    This quantity is local and is distinct from [line-averaged nitrogen
    density](name:line_averaged_nitrogen_density) and [volume-averaged nitrogen
    density](name:volume_averaged_nitrogen_density), which are spatial averages
    of the same charge-state-summed species density. In the absence of a
    population qualifier, the density includes thermal, fast, and other
    nonthermal nitrogen nuclei.
  unit: m^-3

- name: line_averaged_nitrogen_density
  description: |-
    Line-averaged number density of all nitrogen nuclei along a specified plasma
    chord, summed over every ionization state from neutral through fully
    stripped nitrogen.
  documentation: |-
    Line-averaged nitrogen density is the chord-length average of the local
    number density of all nitrogen nuclei, including every nitrogen ionization
    state from neutral nitrogen through fully stripped nitrogen.

    The line average is defined by

    $$
    \overline{n}_N = \frac{1}{L}\int_0^L n_N(\ell)\,d\ell
    $$

    where $n_N(\ell)$ is the local charge-state-summed nitrogen density defined
    by [nitrogen density](name:nitrogen_density), $\ell$ is distance along the
    specified chord, and $L$ is the total chord length.

    This quantity is the chord-integrated nitrogen inventory divided by chord
    length, so it preserves the density dimension while removing variation along
    the chord. It is distinct from the spatially averaged [volume-averaged
    nitrogen density](name:volume_averaged_nitrogen_density), which averages
    over the plasma volume rather than a chord.
  unit: m^-3

- name: nuclear_target_atomic_fraction_of_neutron_detector_converter
  description: |-
    Dimensionless fraction of all converter atoms that are nuclei of the target
    species for the primary neutron-induced detection reaction.
  documentation: |-
    This quantity is the normalized composition factor for target nuclei in the
    converter material of a neutron detector. It identifies the share of
    converter atoms belonging to the nuclear species that produces the intended
    neutron-induced detection reaction.

    The target atomic fraction is defined by

    $$
    f_{\mathrm{target}} = \frac{N_{\mathrm{target}}}{N_{\mathrm{all}}}
    $$

    where $N_{\mathrm{target}}$ is the number of target-species nuclei and
    $N_{\mathrm{all}}$ is the total number of atoms in the converter material.
    It is the nuclear-target realization of target atomic fraction of a neutron
    detector converter, rather than a fraction based on converter volume, mass,
    or detector efficiency. The fraction is bounded between zero and one.
  unit: '1'

- name: oxygen_density
  description: |-
    Total number density of oxygen atoms and ions across all charge states, from
    neutral to fully stripped, giving the local oxygen impurity concentration at
    a point in the plasma.
  documentation: |-
    The local oxygen number density $n_\mathrm{O}$ quantifies the total
    concentration of oxygen impurity per unit plasma volume, encompassing
    neutral atomic oxygen and all ionic charge states up to fully stripped
    O$^{8+}$. Oxygen is a ubiquitous low-Z impurity in fusion devices, entering
    through wall outgassing and vessel conditioning; it contributes to radiative
    power losses and dilutes the hydrogenic fuel inventory.

    The total oxygen density is defined as the sum over all ionization states:

    $$
    n_\mathrm{O} = \sum_{Z=0}^{8} n_{\mathrm{O}^{Z+}}
    $$

    where $n_{\mathrm{O}^{Z+}}$ is the number density of oxygen in charge state
    $Z^+$, with $Z$ ranging from 0 (neutral) to 8 (fully stripped).

    The local density is inferred from passive extreme-ultraviolet spectroscopy,
    charge-exchange recombination spectroscopy, and soft X-ray emission
    tomography. Spatially averaged forms include
    [line_averaged_oxygen_density](name:line_averaged_oxygen_density) (chord
    integral divided by chord length) and
    [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)
    (integral over the plasma volume). The dimensionless oxygen_fraction relates
    this local density to the electron density as an impurity concentration
    measure.

    In well-conditioned fusion plasmas the core oxygen density is a small
    fraction of the electron density; edge concentrations of $10^{15}$–$10^{17}$
    m$^{-3}$ are representative of limiter and divertor configurations.
  unit: m^-3

- name: line_averaged_oxygen_density
  description: |-
    Line-averaged oxygen density is the line-of-sight mean of the local oxygen
    number density, summed over all charge states from neutral O0 through fully
    stripped O8+, along a specified chord through the plasma.
  documentation: |-
    The line-averaged oxygen density is the line-of-sight mean of the local
    oxygen number density—summed over all charge states from neutral O$^0$
    through fully stripped O$^{8+}$—along a specified chord through the plasma.
    It represents the oxygen impurity concentration averaged by arclength rather
    than the value at a single point.

    For a chord of length $L$, the line-averaged oxygen density is defined by:

    $$
    \bar{n}_\mathrm{O} = \frac{1}{L}\int_0^L n_\mathrm{O}(\ell)\,d\ell
    $$

    where $\bar{n}_\mathrm{O}$ is the line-averaged oxygen density, $L$ is the
    physical length of the chord segment included in the average, $\ell$ is
    arclength along that chord, and $n_\mathrm{O}(\ell)$ is the [local oxygen
    density](name:oxygen_density) at the point labeled by $\ell$.

    The scope is the species-level oxygen impurity population intersected by the
    specified chord: the density is charge-state-summed over neutral oxygen and
    all oxygen ions, and the spatial aggregation is an arclength average along
    the chord. It excludes charge-state-resolved oxygen densities, the local
    point value [oxygen density](name:oxygen_density), and the spatial mean over
    the confined plasma volume.

    The essential relationship to [oxygen density](name:oxygen_density) is that
    the local charge-state-summed density is the integrand of the chord average.
    [Volume-averaged oxygen density](name:volume_averaged_oxygen_density) is the
    analogous mean formed over a plasma volume, whereas this quantity is formed
    only along the specified line of sight and is normalized by the chord
    length.
  unit: m^-3

- name: requested_voltage_of_neutron_detector
  description: |-
    Voltage of a neutron detector specified as the high-voltage supply setpoint
    that establishes the target detector bias, rather than the actual output
    voltage.
  documentation: |-
    Voltage of neutron detector

    The requested bias is defined by:

    $$
    U = \varphi_{\mathrm{bias}}^{\mathrm{req}} - \varphi_{\mathrm{ref}}
    $$

    where $U$ is the requested bias voltage,
    $\varphi_{\mathrm{bias}}^{\mathrm{req}}$ is the commanded potential of the
    biased detector terminal, and $\varphi_{\mathrm{ref}}$ is the supply
    reference-terminal potential.

    This setpoint is distinct from the actual supply output voltage and from the
    low-voltage supply setting for detector electronics. The [requested voltage
    of a spectrometer channel](name:requested_voltage_of_spectrometer_channel)
    has the corresponding high-voltage bias-setpoint role for that channel.

    Sign convention: Positive when the commanded detector-bias potential exceeds
    the supply reference-terminal potential.
  unit: V

- name: second_local_tangential_coordinate_of_neutron_detector
  description: |-
    Second local tangential coordinate of a neutron detector is the signed
    coordinate of an outline vertex along the detector’s second local tangential
    axis; with the first local tangential coordinate it defines the detector
    cross-section vertex in the right-handed detector-local basis (first
    tangential, second tangential, plasma-facing normal), where first tangential
    points toward increasing φ in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Second local tangential coordinate of a neutron detector is the signed
    in-plane coordinate of a neutron-detector outline vertex along the
    detector's second local tangential direction. It is a geometric coordinate
    of the detector cross section expressed in the detector-local right-handed
    orthonormal basis
    $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$, whose first
    two directions are tangent to the cross-section plane and whose third
    direction is the plasma-facing detector normal.

    The coordinate is defined by the scalar projection of the vertex
    displacement onto the second local tangential direction:

    $$
    x_2 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_2
    $$

    where $x_2$ is the second local tangential coordinate of the neutron
    detector, $\mathbf{r}_v$ is the position vector of the outline vertex,
    $\mathbf{r}_0$ is the neutron-detector local origin, and
    $\hat{\mathbf{e}}_2$ is the second local tangential unit vector.

    The local triad is defined by
    $\hat{\mathbf{e}}_2=\hat{\mathbf{e}}_3\times\hat{\mathbf{e}}_1$, with
    $\hat{\mathbf{e}}_3$ the plasma-facing detector normal and
    $\hat{\mathbf{e}}_1$ the first local tangential direction chosen toward
    increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame with basis unit vectors
    $(\hat{\mathbf{R}},\hat{\boldsymbol{\phi}},\hat{\mathbf{Z}})$, where $R$ is
    major radius, $\phi$ increases counterclockwise when viewed from above
    $+\hat{\mathbf{Z}}$, and $Z$ is vertical height. This quantity applies to
    individual outline vertices of the neutron-detector cross section; it is not
    summed, averaged, or interpreted as an extent over multiple vertices.

    Together with the [first local tangential coordinate of a neutron
    detector](name:first_local_tangential_coordinate_of_neutron_detector), it
    specifies a vertex in the detector cross-section plane; both coordinates are
    purely geometric outline coordinates. It is distinct from the detector's
    normal extent, such as the [height of a neutron
    detector](name:height_of_neutron_detector), from any cylindrical $R$,
    $\phi$, or $Z$ position in the right-handed cylindrical $(R,\phi,Z)$ frame,
    and from quantities describing detector response or neutron populations.

    Sign convention: Positive when the displacement from the neutron-detector
    local origin to the outline vertex is in the direction of
    $\hat{\mathbf{e}}_2$, equivalently
    $\hat{\mathbf{e}}_3\times\hat{\mathbf{e}}_1$.
  unit: m

- name: solid_angle_of_neutron_detector
  description: |-
    Geometric acceptance of a neutron detector aperture as viewed from a neutron
    emission point, independent of detector efficiency and material response.
  documentation: |-
    The solid angle is the geometric measure of the aperture’s apparent extent
    from a neutron emission point. It is nonnegative and depends only on the
    aperture geometry, its orientation, and the source-point location; detector
    efficiency and converter response are excluded.

    For a point source, the solid angle is defined by

    $$
    \Omega = \int_A \frac{\cos\theta}{r^2}\,dA
    $$

    where $A$ is the aperture surface, $r$ is the distance from the source point
    to an aperture element, and $\theta$ is the angle between the aperture
    normal and the line from the source point to that element. For a finite
    source region, the quantity denotes the specified volume average of this
    point-source solid angle; it does not imply weighting by the neutron
    emission profile. The geometric aperture dimensions described by area of
    neutron detector and [radius of neutron
    detector](name:radius_of_neutron_detector) can determine the acceptance but
    do not include detector efficiency, which is a separate quantity described
    by [efficiency of neutron
    detector](name:spectral_efficiency_of_neutron_detector).
  unit: sr

- name: spectral_efficiency_of_neutron_detector
  description: |-
    Energy-dependent probability that an incident neutron within a specified
    energy band is recorded as an accepted count by the neutron detector.
  documentation: |-
    Neutron spectral efficiency is the conditional probability that an incident
    neutron in the detector's assigned energy interval produces an accepted
    detector count.

    For incident neutron energy $E$, the efficiency is defined by

    $$
    \epsilon(E) = \frac{N_{\mathrm{recorded}}(E)}{N_{\mathrm{incident}}(E)}
    $$

    where $\epsilon(E)$ is the detection probability, $N_{\mathrm{recorded}}(E)$
    is the number of accepted counts produced by neutrons in a narrow interval
    around energy $E$, and $N_{\mathrm{incident}}(E)$ is the number of neutrons
    impacting the detector in that interval.

    This quantity applies only to the neutron detector and its specified
    incident-energy band. It is a conditional probability for individual
    incident neutrons, not a sum over neutron populations or energy bands, and
    it excludes the incident neutron flux itself and detector signals rejected
    by the counting criterion.

    The energy domain is bounded by the detector-band limits, including the
    [maximum neutron energy of the neutron
    detector](name:neutron_maximum_energy_of_neutron_detector). It is the
    neutron counterpart of [spectral efficiency of a hard X-ray
    detector](name:spectral_efficiency_of_hard_xray_detector), which describes
    the analogous counting probability for photons rather than neutrons.
  unit: '1'

- name: surface_area_of_neutron_detector
  description: |-
    Geometric area of the neutron-sensitive detector surface, excluding passive
    housing, shielding, supports, electronics, projection effects, and
    solid-angle weighting.
  documentation: |-
    The quantity is the geometric area of the neutron-sensitive active surface
    of the detector. It includes the physical sensitive face, including
    contributions from segmented or curved surfaces, and excludes passive
    detector structures.

    The area is defined by integration over the neutron-sensitive surface:

    $$
    A = \int_{S_{\rm active}} dS
    $$

    where $S_{\rm active}$ is the neutron-sensitive surface and $dS$ is an
    element of geometric surface area. This is the active-surface component
    represented by area of neutron detector; it is not an effective area
    weighted by detection efficiency, neutron incidence angle, projection, or
    solid angle.
  unit: m^2

- name: temperature_of_neutron_detector
  description: |-
    Absolute thermodynamic temperature of a neutron detector assembly or
    converter material, describing its thermal state independently of
    neutron-counting response.
  documentation: |-
    This quantity is the thermodynamic temperature of the neutron detector
    assembly or neutron-conversion material, characterizing its thermal state
    rather than the detector's electrical response or neutron-counting behavior.

    The temperature is defined thermodynamically by

    $$
    \frac{1}{T}=\left(\frac{\partial S}{\partial U}\right)_{V,N}
    $$

    where $T$ is thermodynamic temperature, $S$ is entropy, $U$ is internal
    energy, $V$ is volume, and $N$ is the amount of material or particle number
    held fixed in the derivative. The quantity applies to the specified detector
    or converter material and is distinct from the local material temperature at
    a sensor attachment point. It is not the neutron-energy threshold
    represented by energy of a neutron detector.
  unit: K

- name: thomson_scattering_laser_pulse_energy_at_outlet
  description: |-
    Energy carried by a Thomson-scattering probing laser pulse after it has
    traversed the plasma, representing the transmitted post-plasma pulse.
  documentation: |-
    This quantity is the total energy carried by a Thomson-scattering laser
    pulse at the beam exit after crossing the plasma. It represents the
    transmitted pulse available for comparison with the pre-plasma pulse.

    The pulse energy is defined by the time integral of the outgoing laser
    power:

    $$
    E_{\mathrm{out}} = \int_{t_1}^{t_2} P_{\mathrm{out}}(t)\,dt
    $$

    where $E_{\mathrm{out}}$ is the post-plasma laser-pulse energy,
    $P_{\mathrm{out}}(t)$ is the laser power exiting the plasma at time $t$, and
    $t_1$ and $t_2$ delimit the pulse.

    The scope is restricted to the probing laser pulse after plasma crossing and
    includes the complete pulse over its temporal extent. It excludes the
    incident pre-plasma pulse energy, energy deposited in the plasma, and
    Thomson-scattered radiation. The ratio of this quantity to the corresponding
    incident pulse energy defines the pulse transmission factor and quantifies
    attenuation through the plasma.
  unit: J

- name: toroidal_coordinate_of_neutron_detector
  description: |-
    Toroidal coordinate of a neutron detector is the angular location of the
    detector's geometric center about the machine symmetry axis in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Toroidal coordinate of a neutron detector is the angular coordinate of the
    detector's geometric center about the machine symmetry axis in the
    right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R},
    \hat{\phi}, \hat{Z})$. Here $R$ is the major-radius coordinate, $\phi$ is
    the toroidal angle, and $Z$ is the vertical-height coordinate.

    For a detector center whose projection onto the plane perpendicular to
    $\hat{Z}$ has Cartesian coordinates $x_c$ and $y_c$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, with $\hat{z}=\hat{Z}$ and
    $\phi=0$ along $+\hat{x}$, the toroidal coordinate is

    $$
    \phi_\mathrm{n} = \operatorname{atan2}(y_c, x_c)
    $$

    where $\phi_\mathrm{n}$ is the toroidal coordinate of the neutron detector,
    and $x_c$ and $y_c$ are the Cartesian coordinates of the detector geometric
    center projected onto the plane perpendicular to $\hat{Z}$.

    This quantity applies specifically to a neutron detector and to the point
    representing its geometric center. The aggregation convention is none: it
    denotes one detector center, not an average, sum, or representative angle
    over several detectors; it is geometrically undefined for a center on the
    symmetry axis, where no toroidal direction is selected.

    It is not a detector orientation, angular extent, line-of-sight direction,
    or the toroidal coordinate of an aperture or other component. It specializes
    the generic [toroidal coordinate of a
    detector](name:toroidal_coordinate_of_detector) to neutron detectors and is
    distinct from [toroidal coordinate of an
    aperture](name:toroidal_coordinate_of_aperture), which refers to an
    aperture's own geometric center.

    Sign convention: Positive when the detector geometric center is displaced in
    the direction of increasing toroidal angle $\phi$, counter-clockwise when
    viewed from above $+\hat{Z}$.
  unit: rad

- name: toroidal_coordinate_of_thomson_scattering_laser
  description: |-
    Toroidal angle locating the endpoint of a Thomson-scattering laser in the
    right-handed cylindrical frame (R, φ, Z).
  documentation: |-
    The toroidal coordinate φ identifies the azimuthal location of the
    Thomson-scattering laser endpoint about the machine symmetry axis. Together
    with the corresponding radial coordinate, it locates the endpoint in the
    right-handed cylindrical (R, φ, Z) frame.

    The endpoint position is represented as

    $$
    \mathbf r_{\rm end}=R_{\rm end}\,\hat{\mathbf R}(\phi_{\rm end})+Z_{\rm end}\,\hat{\mathbf Z}
    $$

    where $\mathbf r_{\rm end}$ is the endpoint position, $R_{\rm end}$ is its
    major-radius coordinate, $\phi_{\rm end}$ is this toroidal coordinate,
    $Z_{\rm end}$ is its vertical coordinate, and $\hat{\mathbf R}$ and
    $\hat{\mathbf Z}$ are the cylindrical radial and vertical unit vectors. The
    radial counterpart is the [radial coordinate of the Thomson-scattering
    laser](name:radial_coordinate_of_thomson_scattering_laser).

    Sign convention: Positive when the angular displacement is counter-clockwise
    viewed from above along the positive $Z$ direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: rad

- name: voltage_of_mass_spectrometer
  description: |-
    Mass-spectrometer detector bias voltage is the signed detector-bias
    potential difference between the detector electrode or electron-multiplying
    stage and its bias reference. It is a device-level setting;
    voltage_of_mass_spectrometer_channel denotes a channel-specific detector
    bias.
  documentation: |-
    Mass-spectrometer detector bias voltage is the signed detector-bias
    potential difference applied between the detector electrode or
    electron-multiplying stage and its bias reference. It is a device-level
    electrical setting that affects ion collection efficiency or
    electron-multiplier gain.

    The detector-bias potential difference is defined by the detector and
    reference electric potentials:

    $$
    V_\mathrm{bias} = \Phi_\mathrm{det} - \Phi_\mathrm{ref}
    $$

    where $V_\mathrm{bias}$ is the detector bias voltage of the mass
    spectrometer, $\Phi_\mathrm{det}$ is the electric potential of the detector
    electrode or electron-multiplying stage, and $\Phi_\mathrm{ref}$ is the
    electric potential of its bias reference.

    This quantity applies to the mass spectrometer as a device-level detector
    bias common to the instrument or defined independently of channel selection.
    It excludes channel-specific detector biases, which are represented by
    [mass-spectrometer channel detector bias
    voltage](name:voltage_of_mass_spectrometer_channel).

    This quantity is distinct from [mass-spectrometer channel ion
    current](name:ion_current_of_mass_spectrometer_channel): the ion current is
    the electrical current associated with collected ions in a channel, whereas
    the detector bias voltage is the applied potential difference that can
    affect collection efficiency or gain.

    Sign convention: Positive when the detector electrode or
    electron-multiplying stage is at higher electric potential than its bias
    reference.
  unit: V

- name: voltage_of_mass_spectrometer_channel
  description: |-
    Signed bias potential applied between the photomultiplier detector electrode
    and its electronics reference for one mass-resolved channel, setting
    ion-signal gain.
  documentation: |-
    The mass-spectrometer channel voltage is the detector-bias potential
    difference associated with one channel assigned to a selected atomic mass.
    It is an instrumental operating parameter of the photomultiplier detector
    that controls the gain applied to the collected ion signal, rather than a
    plasma thermodynamic or field quantity.

    The defining potential difference is

    $$
    V_{\mathrm{ch}} = \phi_{\mathrm{det}} - \phi_{\mathrm{ref}}
    $$

    where $V_{\mathrm{ch}}$ is the channel detector-bias voltage,
    $\phi_{\mathrm{det}}$ is the electric potential of the photomultiplier
    detector electrode, and $\phi_{\mathrm{ref}}$ is the electronics reference
    potential.

    This quantity applies to one mass-resolved channel and its associated
    detector circuit. It is not summed or averaged across channels, mass
    assignments, detector electrodes, or ion populations, and it does not
    represent a local plasma voltage.

    The channel-level quantity specializes the device-level [mass-spectrometer
    detector bias voltage](name:voltage_of_mass_spectrometer) to one channel. It
    is distinct from the [ion current of a mass-spectrometer
    channel](name:ion_current_of_mass_spectrometer_channel), which is the
    collected electrical signal, and from the [voltage of a spectrometer
    channel](name:voltage_of_spectrometer_channel), which denotes an electrical
    output signal rather than the detector-bias potential.

    Sign convention: Positive when the detector electrode potential exceeds the
    electronics reference potential.
  unit: V

- name: x_direction_unit_vector_of_neutron_detector
  description: |-
    X component of the neutron-detector direction unit vector is the direction
    cosine along the x axis of the right-handed Cartesian (x, y, z) frame, from
    a field-of-view voxel center toward the detector center. It is a component
    of a normalized pointing direction, not a position coordinate.
  documentation: |-
    X component of the neutron-detector direction unit vector is the projection
    of the normalized direction from a field-of-view voxel center to the
    neutron-detector center onto the positive $\hat{x}$ axis. The component is
    resolved in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis
    and is a direction cosine, not a Cartesian position coordinate.

    The normalized pointing component is defined by

    $$
    d_x = \left(\frac{\mathbf r_{\rm det}-\mathbf r_{\rm vox}}{\left\lVert \mathbf r_{\rm det}-\mathbf r_{\rm vox}\right\rVert}\right)\cdot\hat{\mathbf x}
    $$

    where $d_x$ is the x component of the neutron-detector direction unit
    vector, $\mathbf r_{\rm det}$ is the detector-center position, $\mathbf
    r_{\rm vox}$ is the voxel-center position, and $\hat{\mathbf x}$ is the
    positive x basis vector.

    Together with the [y
    component](name:y_direction_unit_vector_of_neutron_detector) and [z
    component](name:z_direction_unit_vector_of_neutron_detector), $d_x$
    specifies the full normalized direction from the voxel center toward the
    detector center; for nonzero separation the components satisfy
    $d_x^2+d_y^2+d_z^2=1$.
  unit: m

- name: xenon_density
  description: |-
    Number density of xenon ions at a given point in the plasma, summed over all
    ionization states from singly ionized through fully stripped xenon,
    excluding neutral xenon atoms.
  documentation: |-
    Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe} = 54$)
    introduced into fusion plasmas for radiative-mantle experiments,
    impurity-transport studies, and disruption mitigation. The xenon ion number
    density $n_\mathrm{Xe}$ quantifies the local concentration of all charged
    xenon species and enters the plasma effective charge through $Z_\mathrm{eff}
    = \sum_i Z_i^2 n_i / n_e$, where $n_i$ is the partial density of ion species
    $i$ and $n_e$ is the electron density.

    The total xenon ion density is the sum over all ionic charge states:

    $$
    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}
    $$

    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions
    carrying charge $ze$. The charge-state distribution is determined by coronal
    equilibrium or collisional-radiative modeling at the local electron
    temperature and density.

    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray
    line emission via spectroscopy and tomographic inversion, or from
    charge-exchange recombination spectroscopy using neutral-beam injection.
    Spatially resolved forms include
    [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis) at the
    innermost flux surface and xenon_density_at_pedestal in the edge transport
    barrier, while
    [volume_averaged_xenon_density](name:volume_averaged_xenon_density) provides
    the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by xenon_fraction.
  unit: m^-3

- name: line_averaged_xenon_density
  description: |-
    Number density of xenon ions averaged along a chord through the plasma,
    summed over all ionization states from singly ionized through fully stripped
    xenon and excluding neutral xenon atoms.
  documentation: |-
    The line-averaged xenon ion number density is the chord-length mean of the
    local [xenon density](name:xenon_density), which sums xenon ions from singly
    ionized through fully stripped xenon and excludes neutral xenon atoms. It
    represents the xenon ion content sampled by a specified chord, not the local
    value at any single point unless the local density is uniform along that
    chord.

    The chord average is defined by

    $$
    \bar{n}_{\mathrm{Xe},L} = \frac{1}{L}\int_{\mathcal{C}} n_\mathrm{Xe}(\ell)\, d\ell
    $$

    where $\bar{n}_{\mathrm{Xe},L}$ is the line-averaged xenon ion number
    density, $\mathcal{C}$ is the chord segment over which the average is
    defined, $L = \int_{\mathcal{C}} d\ell$ is its path length, $\ell$ is
    distance along the chord, and $n_\mathrm{Xe}(\ell)$ is the local [xenon
    density](name:xenon_density) evaluated on the chord.

    The species aggregation is performed over charge states before the line
    average: $n_\mathrm{Xe}(\ell)=\sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}(\ell)$,
    where $z$ is the xenon ionic charge-state index, $n_{\mathrm{Xe}^{z+}}$ is
    the partial density of xenon ions carrying charge $ze$, and $e$ is the
    elementary charge. The physical population is charged xenon ions located on
    the chord segment through the plasma; neutral xenon atoms and
    charge-state-resolved xenon densities are excluded.

    This quantity differs from [volume-averaged xenon
    density](name:volume_averaged_xenon_density), which averages the same local
    xenon density over the plasma volume, and from [xenon density at magnetic
    axis](name:xenon_density_at_magnetic_axis), which evaluates it at the
    magnetic-axis locus. It is the xenon counterpart of [line-averaged argon
    density](name:line_averaged_argon_density) under the same chord-mean
    convention.
  unit: m^-3

- name: y_direction_unit_vector_of_neutron_detector
  description: |-
    Y direction unit-vector component of a neutron detector is the y direction
    cosine, in the right-handed Cartesian (x, y, z) basis, of the unit vector
    from a field-of-view voxel center toward the detector center.
  documentation: |-
    Y direction unit-vector component of a neutron detector is the signed
    projection, in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis, of the unit vector directed from a field-of-view voxel center toward
    the detector center. It is the y direction cosine of that line-of-sight
    direction.

    The component is defined by projecting the detector-directed unit vector
    onto the $\hat{y}$ basis vector:

    $$
    u_y = \hat{\mathbf{u}}_{\mathrm{det}} \cdot \hat{y} = \frac{(\mathbf{r}_{\mathrm{det}} - \mathbf{r}_{\mathrm{vox}}) \cdot \hat{y}}{\lVert \mathbf{r}_{\mathrm{det}} - \mathbf{r}_{\mathrm{vox}} \rVert}
    $$

    where $\hat{\mathbf{u}}_{\mathrm{det}}$ is the unit vector from the
    field-of-view voxel center to the detector center,
    $\mathbf{r}_{\mathrm{det}}$ is the detector-center position,
    $\mathbf{r}_{\mathrm{vox}}$ is the field-of-view voxel-center position, and
    $\hat{y}$ is the y basis vector of the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ frame.

    This quantity is a signed direction-cosine component, not a position
    coordinate, distance, or unnormalized displacement component. Together with
    the corresponding x and z components it satisfies $u_x^2 + u_y^2 + u_z^2 =
    1$ when the field-of-view voxel center and detector center are distinct.
  unit: m

- name: z_direction_unit_vector_of_neutron_detector
  description: |-
    Z component in the right-handed Cartesian (x̂, ŷ, ẑ) basis of the unit
    direction vector from each field-of-view voxel to the neutron detector
    center, with ẑ vertical. It is the vertical direction cosine, not a
    position coordinate.
  documentation: |-
    Z component in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis of the unit direction vector from each field-of-view voxel to the
    neutron detector center is the projection of that voxel-to-detector
    direction onto the vertical basis vector $\hat{z}$. It represents the
    vertical direction cosine of the ray from the voxel toward the detector
    center.

    The component is defined by the normalized displacement from the voxel
    position to the detector-center position:

    $$
    u_z = \frac{(\mathbf{r}_d - \mathbf{r}_v) \cdot \hat{z}}{\lVert \mathbf{r}_d - \mathbf{r}_v \rVert}
    $$

    where $u_z$ is the z component of the direction unit vector, $\mathbf{r}_v$
    is the field-of-view voxel position, $\mathbf{r}_d$ is the neutron
    detector-center position, and $\hat{z}$ is the vertical basis vector of the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.

    Together with
    [x_direction_unit_vector_of_neutron_detector](name:x_direction_unit_vector_of_neutron_detector)
    and
    [y_direction_unit_vector_of_neutron_detector](name:y_direction_unit_vector_of_neutron_detector),
    it forms the direction-cosine triplet of the same voxel-to-detector ray, so
    $u_x^2 + u_y^2 + u_z^2 = 1$ and $-1 \le u_z \le 1$. This quantity is a
    direction cosine, not a vertical position coordinate or displacement
    magnitude; it is the neutron-detector analog of
    [z_direction_unit_vector_of_camera](name:z_direction_unit_vector_of_camera).
  unit: m

- name: floating_electrostatic_potential
  description: |-
    Electrostatic potential of an electrically floating Langmuir-probe collector
    relative to a chosen electrical reference, at which the net electric current
    to the collector vanishes.
  documentation: |-
    This quantity is the electrostatic potential of an electrically floating
    Langmuir-probe collector, relative to a chosen electrical reference. It is a
    current-balance-constrained value of [electrostatic
    potential](name:electrostatic_potential), specifying electrostatic
    interaction energy per positive test charge at the collector.

    The defining floating condition is

    $$
    I_{\mathrm{net}}(V_{\mathrm{f}})=0
    $$

    where $V_{\mathrm{f}}$ is the collector's floating electrostatic potential
    relative to the chosen reference and $I_{\mathrm{net}}$ is the total
    electric current entering the collector, including particle collection and
    any emission contributions. Zero net current does not require the individual
    electron, ion, or emitted-particle currents to vanish.

    This quantity applies to an individual plasma-exposed collector, whether
    fixed or moving. It is not a wall-surface or magnetic-flux-surface average,
    and it does not denote an externally imposed collector bias.

    It is distinct from the [plasma electrostatic potential at a Langmuir-probe
    position](name:electrostatic_potential_at_langmuir_probe_position): a sheath
    can sustain a potential difference between the plasma and the floating
    collector. That difference is governed by current balance and depends on the
    electron temperature, particle distributions, and any emission
    contributions; no universal fixed offset is implied.

    The [fluctuating floating electrostatic
    potential](name:fluctuating_floating_electrostatic_potential) is the
    standard deviation of fluctuations of this quantity, rather than its signed
    value.

    Sign convention: Positive when a positive test charge has greater
    electrostatic potential energy at the floating collector than at the chosen
    reference.
  unit: V

- name: line_averaged_argon_density
  description: |-
    Chord-averaged number density of argon ions along a specified plasma path,
    with contributions from all ionization stages summed together.
  documentation: |-
    Line-averaged argon ion number density is the argon ion concentration
    averaged along a specified chord through the plasma, including all
    ionization stages.

    The line average is defined by

    $$
    \overline{n}_\mathrm{Ar} = \frac{1}{L} \int_0^L \sum_{q=1}^{18} n_{\mathrm{Ar},q}(\mathbf{r}(l))\,dl
    $$

    where $L$ is the chord length, $l$ is distance along the chord,
    $\mathbf{r}(l)$ is the position on the chord, and $n_{\mathrm{Ar},q}$ is the
    local number density of argon ions in charge state $q$.

    This path average is distinct from the local [argon ion
    density](name:argon_density) and from the plasma-volume average
    [volume-averaged argon density](name:volume_averaged_argon_density).
  unit: m^-3

- name: line_averaged_boron_density
  description: |-
    Line-averaged boron density is the total elemental boron number density
    averaged along a chord through the plasma. It includes neutral boron and all
    boron ionization states, giving a chord-averaged measure of elemental boron
    impurity content.
  documentation: |-
    Line-averaged boron density is the total elemental boron number density
    averaged along a chord through the plasma. It includes neutral boron and all
    ionization states of boron, so it represents the chord-averaged elemental
    boron impurity content rather than a local point value.

    The line average over a chord of path length $L$ is defined by the path
    integral of the local charge-state-summed boron density along arc length
    $l$:

    $$
    \bar{n}_{\mathrm{B},\ell} = \frac{1}{L}\int_0^L \sum_{z=0}^{5} n_\mathrm{B}^{(z)}(l)\, dl
    $$

    where $\bar{n}_{\mathrm{B},\ell}$ is the line-averaged boron density,
    $n_\mathrm{B}^{(z)}(l)$ is the local boron number density in ionization
    state $z$ at position $l$ along the chord, $z=0$ denotes neutral boron,
    $z=5$ denotes fully stripped B$^{5+}$, and $L$ is the total path length used
    for the average.

    This quantity is a chord average of the charge-state-summed elemental [boron
    density](name:boron_density); it is not a charge-state-resolved boron
    density and does not exclude neutral boron. It differs from [volume-averaged
    boron density](name:volume_averaged_boron_density), which averages the same
    elemental density over the confined plasma volume.
  unit: m^-3

- name: line_averaged_carbon_density
  description: |-
    Line-averaged total number density of elemental carbon along a specified
    plasma chord, summed over neutral carbon and all ionic charge states through
    C6+.
  documentation: |-
    Line-averaged carbon density is the chord average of the total number
    density of elemental carbon, encompassing neutral carbon atoms and all ionic
    charge states from singly ionized C+ through fully stripped C6+.

    It is defined from the local [carbon density](name:carbon_density) along the
    chord:

    $$
    \bar n_C = \frac{1}{L}\int_0^L n_C(\ell)\,d\ell = \frac{1}{L}\int_0^L \sum_{z=0}^{6} n_{C^{z+}}(\ell)\,d\ell
    $$

    where $\bar n_C$ is the line-averaged carbon density, $n_C(\ell)$ is the
    local carbon density in m$^{-3}$, $n_{C^{z+}}(\ell)$ is the local density of
    carbon charge state $z+$ in m$^{-3}$, $\ell$ is distance along the chord in
    m, and $L$ is the chord length in m. This chord average is distinct from
    [volume-averaged carbon density](name:volume_averaged_carbon_density), which
    averages over the confined plasma volume.
  unit: m^-3

- name: line_averaged_deuterium_density
  description: |-
    Deuterium ion density averaged along a plasma chord is the mean local number
    density of ionized deuterium in the fuel-ion population. It is
    charge-state-summed over ionized deuterium and excludes neutral or molecular
    deuterium and non-deuterium species.
  documentation: |-
    Deuterium ion density averaged along a plasma chord is the mean local number
    density of ionized deuterium in the fuel-ion population. It represents the
    path-length mean of the local deuterium density along the specified chord,
    with deuterium treated as a species-level ion density.

    The line average is defined by the path-length average of the local
    [deuterium density](name:deuterium_density):

    $$
    \langle n_D \rangle_\ell = \frac{1}{L} \int_{\ell_0}^{\ell_1} n_D(\ell) \, d\ell
    $$

    where $\langle n_D \rangle_\ell$ is the line-averaged deuterium density,
    $\ell$ is arclength along the chord, $\ell_0$ and $\ell_1$ are the endpoints
    of the averaging interval, $L = \ell_1 - \ell_0$ is the chord path length,
    and $n_D(\ell)$ is the local [deuterium density](name:deuterium_density) at
    position $\ell$.

    The local deuterium density entering the integral is charge-state-summed
    over ionized atomic charge states; for deuterium this reduces to the singly
    ionized deuteron population. Neutral deuterium atoms, molecular deuterium,
    and non-deuterium species are excluded. This quantity is a path average;
    local [deuterium density](name:deuterium_density) and [deuterium ion density
    averaged over the total plasma
    volume](name:volume_averaged_deuterium_density) are distinct quantities.
  unit: m^-3

- name: line_averaged_effective_charge
  description: |-
    Effective charge of a plasma ion mixture averaged uniformly along a
    specified line of sight, expressing its chord-mean composition factor for
    electron–ion Coulomb scattering.
  documentation: |-
    Effective charge averaged along a specified plasma line of sight describes
    the chord-mean charge-state composition of the ion mixture relevant to
    electron–ion Coulomb scattering.

    The line average is defined by:

    $$
    \bar{Z}_{\mathrm{eff}} = \frac{1}{L}\int_0^L Z_{\mathrm{eff}}\,dl
    $$

    where $\bar{Z}_{\mathrm{eff}}$ is the line-averaged effective charge,
    $Z_{\mathrm{eff}}$ is the local [effective charge](name:effective_charge),
    $L$ is the length of the specified plasma chord, and $l$ is distance along
    that chord.

    The local composition factor is $Z_{\mathrm{eff}} = \sum_a n_a Z_a^2/n_e$,
    where $a$ indexes all ion species and their ionized charge states, $n_a$ is
    the number density of each ionic population, $Z_a$ is its charge number, and
    $n_e$ is the free-electron number density. The mixture includes both fuel
    and impurity ions; it is not the mean charge number of a selected species.

    The averaging uses uniform length weighting of the local effective charge.
    It is distinct from an unnormalized chord integral, an emissivity-weighted
    average, or a ratio formed from separately chord-integrated charge moments.
  unit: '1'

- name: line_averaged_electron_temperature
  description: |-
    Thermal energy of the bulk electron population expressed as an
    energy-equivalent temperature, averaged along a plasma chord.
  documentation: |-
    Line-averaged electron temperature is the energy-equivalent measure of the
    mean random kinetic energy of the bulk electron population, averaged along a
    plasma chord.

    The defining path-length average is:

    $$
    T_{e,\mathrm{line}} = \frac{1}{L}\int_0^L T_e(l)\,dl
    $$

    where $T_{e,\mathrm{line}}$ is the line-averaged electron temperature,
    $T_e(l)$ is the local [electron temperature](name:electron_temperature) at
    path coordinate $l$, and $L$ is the total chord length. The coordinate $l$
    measures distance along the specified plasma chord, and the averaging is
    uniform with respect to path length.

    This is an intensive quantity for the bulk electron population, aggregated
    along the chord rather than summed over electron energies or particle
    populations. It excludes ion temperatures and differs from the local
    electron temperature because it combines values along the entire chord.

    The line average is a chord-integrated representation of the parent
    [electron_temperature](name:electron_temperature), whereas
    [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature)
    applies a volume average over the confined plasma and is therefore a
    distinct spatial aggregation.
  unit: eV

- name: line_averaged_hydrogen_density
  description: |-
    Line-averaged number density of hydrogen (protium) ions in the plasma,
    giving the path-length-normalized H+ concentration along a specified chord.
  documentation: |-
    The line-averaged hydrogen density quantifies the mean concentration of
    protium ions along a specified chord through the plasma. It represents the
    path-integrated hydrogen ion content normalized by the chord length.

    The line average is defined as

    $$
    \overline{n}_H = \frac{1}{L}\int_{\mathcal{C}} n_H(\mathbf{r}(l))\,dl
    $$

    where $\overline{n}_H$ is the line-averaged hydrogen density,
    $n_H(\mathbf{r}(l))$ is the local protium-ion number density at position
    $\mathbf{r}(l)$ along the chord, $l$ is the path-length coordinate,
    $\mathcal{C}$ is the specified chord, and $L$ is its total length.

    The quantity applies to charged protium ions, with any included protium ion
    charge states summed before the line average; neutral atomic hydrogen and
    heavier hydrogenic isotopes are excluded. It is a chord average rather than
    the local [hydrogen density](name:hydrogen_density) at a point or the volume
    average represented by
    [volume_averaged_hydrogen_density](name:volume_averaged_hydrogen_density).

    Unlike
    [line_averaged_total_ion_density](name:line_averaged_total_ion_density), it
    does not include other ion species or hydrogen isotopes. The path-length
    normalization preserves the same density meaning as the parent local
    quantity while replacing its pointwise value with an average along the
    chord.
  unit: m^-3

- name: line_averaged_iron_density
  description: |-
    Line-averaged iron density is the path-length mean of total iron
    impurity-ion number density, summed over Fe1+ through Fe26+.
  documentation: |-
    Line-averaged iron density is the chord-length mean of the total iron ion
    number density along a specified line of sight. It includes all ionization
    states from Fe$^{1+}$ through Fe$^{26+}$ and does not resolve their
    individual contributions.

    The line average is defined as

    $$
    n_{\mathrm{Fe,line}} = \frac{1}{L}\int_0^L n_{\mathrm{Fe}}(l)\,dl
    $$

    where $n_{\mathrm{Fe,line}}$ is the line-averaged density,
    $n_{\mathrm{Fe}}(l)$ is the local iron ion number density at path coordinate
    $l$, and $L$ is the total chord length.

    The local quantity being averaged is the charge-state-summed [iron
    density](name:iron_density). This chord average is distinct from
    [line_averaged_argon_density](name:line_averaged_argon_density), which
    applies the same path averaging to argon ions, and from a volume-averaged
    iron density, which averages over a plasma volume rather than a line of
    sight.
  unit: m^-3

- name: line_averaged_tritium_density
  description: |-
    Chord-averaged number density of tritium ions, obtained by averaging local
    tritium ion density along a specified chord.
  documentation: |-
    Chord-averaged tritium ion density is the path-length mean of the local
    tritium ion number density along a specified chord. It is derived from the
    local [tritium_density](name:tritium_density) and represents the
    chord-integrated fuel content normalized by chord length.

    $$
    \overline{n}_T = \frac{1}{L} \int_0^L n_T(\ell)\,d\ell
    $$

    where $\overline{n}_T$ is the chord-averaged density, $n_T(\ell)$ is the
    local tritium ion density at path coordinate $\ell$, and $L$ is the chord
    length. The average includes the specified chord segment and is distinct
    from the confined-volume mean
    [volume_averaged_tritium_density](name:volume_averaged_tritium_density) and
    from the corresponding helium-4 quantity
    [line_averaged_helium_4_density](name:line_averaged_helium_4_density).
  unit: m^-3

- name: radial_coordinate_of_thomson_scattering_laser
  description: |-
    Major-radius location of the Thomson-scattering laser endpoint, measured as
    perpendicular distance from the toroidal symmetry axis in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial coordinate of a Thomson-scattering laser is the major-radius
    position of its laser-beam endpoint, measured from the toroidal symmetry
    axis in the right-handed cylindrical $(R,\phi,Z)$ frame.

    $$
    R_{\mathrm{end}} = \sqrt{x_{\mathrm{end}}^2+y_{\mathrm{end}}^2}
    $$

    where $R_{\mathrm{end}}$ is the endpoint major-radius coordinate, and
    $x_{\mathrm{end}}$ and $y_{\mathrm{end}}$ are the endpoint coordinates along
    the two horizontal axes of the right-handed Cartesian basis
    $(\hat{x},\hat{y},\hat{z})$, with $\hat{z}$ aligned with the vertical
    direction $\hat{Z}$.

    This quantity applies to one laser endpoint and is a geometric point
    coordinate, not a path average, scattering-volume coordinate, beam
    attribute, or plasma-population quantity. It is neither summed nor averaged
    over lasers, endpoints, or plasma regions.

    It is the Thomson-scattering-laser-specific realization of [radial
    coordinate](name:radial_coordinate), providing the $R$ coordinate of the
    endpoint. It is distinct from the [toroidal coordinate of the
    Thomson-scattering
    laser](name:toroidal_coordinate_of_thomson_scattering_laser), which
    specifies the endpoint's toroidal angle $\phi$.
  unit: m

- name: ratio_of_ion_density_to_electron_density
  description: |-
    Local ion concentration relative to the electron population, defined as the
    number-density ratio for a specified impurity or fuel ion species.
  documentation: |-
    This quantity is the local abundance of a specified impurity or fuel ion
    species relative to the free-electron population. It compares particle
    populations rather than electric charge density or mass density.

    The local ion-to-electron concentration ratio is defined by

    $$
    \mathcal{R}_{i/e} = \frac{n_i}{n_e}
    $$

    where $\mathcal{R}_{i/e}$ is the ion-to-electron concentration ratio, $n_i$
    is the local number density of the specified ion species, $n_e$ is the local
    free-electron number density, $i$ identifies the selected ion species, and
    $e$ identifies the electron population.

    Both densities are evaluated at the same local plasma point. For a
    species-level numerator without an explicitly selected charge state, $n_i$
    is summed over all ionization states of that species; a
    charge-state-resolved numerator applies only to the selected state. No
    spatial average or line integration is implied.

    The numerator is supplied by the corresponding [ion
    density](name:ion_density), while [ion charge state
    density](name:ion_charge_state_density) represents the density when one
    charge state is isolated. A named-species example of the same construction
    is the [ratio of iron density to electron
    density](name:ratio_of_iron_density_to_electron_density). This quantity is
    distinct from an ion charge-state fraction, electric charge-density ratio,
    or mass-density ratio.
  unit: '1'

- name: total_ion_temperature
  description: |-
    Density-weighted effective temperature of the combined thermal ion
    population, with all species and charge states contributing according to
    their number densities.
  documentation: |-
    The total ion temperature is the density-weighted effective temperature of
    the combined thermal ion population, including all included thermal ion
    species and charge states. It represents random thermal motion and excludes
    directed bulk-flow energy.

    The local effective temperature is defined by

    $$
    T_{i,\mathrm{tot}} = \frac{\sum_{s\in\mathcal{S}} n_s T_s}{\sum_{s\in\mathcal{S}} n_s}
    $$

    where $n_s$ is the number density and $T_s$ is the ion temperature of
    species or charge state $s$, and $\mathcal{S}$ is the set of included
    thermal ion populations. Thus, “total” denotes a density-weighted
    combination, not an arithmetic sum of temperatures. Spatially transformed
    instances apply line or volume averaging to this combined quantity, as in
    [line_averaged_total_ion_temperature](name:line_averaged_total_ion_temperature)
    and
    [volume_averaged_total_ion_temperature](name:volume_averaged_total_ion_temperature);
    the underlying species-resolved quantity is
    [ion_temperature](name:ion_temperature).
  unit: eV

- name: line_averaged_total_ion_temperature
  description: |-
    Density-weighted effective temperature of the combined thermal ion
    population, with all species and charge states contributing by number
    density and averaged along a specified plasma chord.
  documentation: |-
    The line-averaged total ion temperature is the line average of the local
    density-weighted effective temperature of the combined thermal ion
    population, including all included thermal ion species and charge states. It
    represents random thermal motion and excludes directed bulk-flow energy.

    The chord average is defined by

    $$
    T_{i,\mathrm{line}} = \frac{\int_{\mathcal{C}} T_{i,\mathrm{tot}}(\ell)\,d\ell}{\int_{\mathcal{C}}d\ell}
    $$

    where $T_{i,\mathrm{line}}$ is the line-averaged quantity,
    $T_{i,\mathrm{tot}}(\ell)$ is the local [total ion
    temperature](name:total_ion_temperature), $\ell$ is path length along the
    chord, and $\mathcal{C}$ is the specified chord. Species and charge states
    are combined by number density before the line average is taken. Unlike the
    [volume-averaged total ion
    temperature](name:volume_averaged_total_ion_temperature), this quantity
    weights positions by chord length rather than plasma volume.
  unit: eV
