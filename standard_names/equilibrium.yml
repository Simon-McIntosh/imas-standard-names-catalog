    dd_path: equilibrium/time_slice/boundary_separatrix/geometric_axis/r
    status: composed
  - id: dd:equilibrium/time_slice/profiles_1d/geometric_axis/r
    dd_path: equilibrium/time_slice/profiles_1d/geometric_axis/r
    status: composed
  - id: dd:summary/boundary/geometric_axis_r/value
