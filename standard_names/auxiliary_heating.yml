- name: x_component_of_third_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the third local unit vector defining
    the orientation of a diagnostic optical element, equal to the dot product $\hat{x}_3
    \cdot \hat{x}$.
  documentation: 'The quantity $x_3^x = \hat{x}_3 \cdot \hat{x}$ is the projection
    of the third unit vector $\hat{x}_3$ onto the machine Cartesian $\hat{x}$ axis,
    where $\hat{x}$ lies in the horizontal midplane of the device at the toroidal
    reference angle $\phi = 0$ in the right-handed $(\hat{x}, \hat{y}, \hat{z})$ frame.
    Together with [y_component_of_third_unit_vector](name:y_component_of_third_unit_vector)
    and [z_component_of_third_unit_vector](name:z_component_of_third_unit_vector),
    it fully specifies the orientation of $\hat{x}_3$ in Cartesian space; the three
    components satisfy $({x}_3^x)^2 + ({x}_3^y)^2 + ({x}_3^z)^2 = 1$. The parent vector
    [third_unit_vector](name:third_unit_vector) completes an orthonormal triad $\{\hat{x}_1,
    \hat{x}_2, \hat{x}_3\}$ used to characterize the spatial orientation of detector
    apertures, mirrors, filter windows, and other optical elements across a wide range
    of plasma diagnostics. Values are bounded to $[-1, 1]$ and are determined from
    the mechanical design or geometric survey of the diagnostic assembly.


    Sign convention: Positive when $\hat{x}_3$ has a component in the $+\hat{x}$ direction
    of the machine Cartesian frame.'
