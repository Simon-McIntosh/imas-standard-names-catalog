- name: per_toroidal_mode_thermal_electron_absorbed_wave_power_density
  kind: scalar
  status: draft
  description: Volumetric power density deposited onto the thermal electron population
    by auxiliary wave heating, resolved per toroidal mode number.
  documentation: 'This quantity describes the absorbed wave power per unit volume
    transferred from an auxiliary heating wave to the thermal electron population,
    separated by toroidal mode number $n$. It is defined locally in space and captures
    the spatial distribution of power deposition for each toroidal harmonic of the
    wave field. The total absorbed power density on thermal electrons is obtained
    by summing over all toroidal mode numbers. Typical values range from kW/m$^3$
    in low-power scenarios to tens of MW/m$^3$ in high-power auxiliary heating, depending
    on wave frequency, plasma conditions, and resonance location.


    Sign convention: Positive when the power flows from the wave field into the thermal
    electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
