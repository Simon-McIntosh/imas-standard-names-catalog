- name: vertical_coordinate_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of outline points describing the vacuum vessel
    cross-section in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z$ specifies the height of each point on
    the vacuum vessel outline, measured from the equatorial plane of the tokamak.
    These points form a closed polygonal chain that describes the axisymmetric cross-section
    of the vacuum vessel, the primary plasma-facing structural component. The outline
    is typically derived from engineering CAD models and is used in equilibrium reconstruction
    as a conducting structure boundary for eddy current calculations.


    The vacuum vessel outline is more complex than the first wall outline, as it includes
    the full vessel shell with ports and bellows sections. Typical vertical extent
    ranges from $-Z_{\mathrm{max}}$ to $+Z_{\mathrm{max}}$, where $Z_{\mathrm{max}}$
    is approximately 2--4 m for medium-size tokamaks and 6--8 m for ITER-scale devices.


    Sign convention: Positive when the outline point lies above the equatorial plane.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_coordinate_of_wall
  - name:vertical_coordinate_of_limiter
  - name:vertical_coordinate_of_iron_core_segment
  sources:
  - id: dd:wall/description_2d/vessel/unit/annular/outline_inner/z
    dd_path: wall/description_2d/vessel/unit/annular/outline_inner/z
    status: composed
  - id: dd:wall/description_2d/vessel/unit/annular/outline_outer/z
    dd_path: wall/description_2d/vessel/unit/annular/outline_outer/z
    status: composed
  - id: dd:wall/description_2d/vessel/unit/element/outline/z
    dd_path: wall/description_2d/vessel/unit/element/outline/z
    status: composed
- name: vertical_coordinate_of_wall
  kind: scalar
  status: draft
  description: Vertical coordinate (Z) of the first wall mobile structure outline
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z$ defines the height of the first wall
    mobile structure outline, measured from the machine midplane in the $(R, \phi,
    Z)$ cylindrical system. This quantity is used in the geometric description of
    in-vessel components, enabling the specification of the poloidal cross-section
    of the mobile wall for plasma-surface interaction modeling and electromagnetic
    compatibility studies. Outline coordinates are typically taken from engineering
    CAD models or digitized from in-vessel measurements.


    The set of $(R, Z)$ outline points defines the surface that the plasma boundary
    can contact as the wall moves; the $\phi$ coordinate is implicit from the machine
    toroidal periodicity and is not stored here. For related geometric descriptions
    of other in-vessel components, see [vertical_coordinate_of_vacuum_vessel](name:vertical_coordinate_of_vacuum_vessel)
    and [vertical_coordinate_of_limiter](name:vertical_coordinate_of_limiter).


    Sign convention: Positive when the point lies above the machine midplane ($Z=0$).'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_coordinate_of_vacuum_vessel
  - name:vertical_coordinate_of_limiter
  sources:
  - id: dd:wall/description_2d/mobile/unit/outline/z
    dd_path: wall/description_2d/mobile/unit/outline/z
    status: composed
