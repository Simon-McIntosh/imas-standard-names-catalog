- name: thermal_electron_power_density
  kind: scalar
  status: draft
  description: Volumetric coherent-wave power density absorbed by the thermal (bulk)
    electron population. It is the local rate of wave energy deposition into bulk
    electrons per unit plasma volume.
  documentation: 'Thermal electron power density is the time-averaged volumetric rate
    at which a coherent wave transfers energy to the bulk thermal electron population.
    It represents electron heating by wave absorption, distinct from power deposited
    directly into ions, fast particles, or other nonthermal populations.


    For a monochromatic wave, with physical fields written using peak-amplitude phasors
    as $\mathbf{E}(t)=\mathrm{Re}[\tilde{\mathbf{E}}e^{-i\omega t}]$ and $\mathbf{J}_{\mathrm{th},e}(t)=\mathrm{Re}[\tilde{\mathbf{J}}_{\mathrm{th},e}e^{-i\omega
    t}]$, the cycle-averaged absorbed power density is


    $$

    p_{\mathrm{th},e}=\left\langle \mathbf{J}_{\mathrm{th},e}(t)\cdot\mathbf{E}(t)\right\rangle_t
    = \frac{1}{2}\,\mathrm{Re}\!\left[\tilde{\mathbf{J}}_{\mathrm{th},e}\cdot\tilde{\mathbf{E}}^{*}\right]

    $$


    where $p_{\mathrm{th},e}$ is in W m$^{-3}$, $\mathbf{E}$ is the wave electric
    field in V m$^{-1}$, $\mathbf{J}_{\mathrm{th},e}$ is the induced current density
    associated with thermal electrons in A m$^{-2}$, $\omega$ is the angular frequency,
    $\langle\cdot\rangle_t$ denotes an average over a wave period, and $^{*}$ denotes
    complex conjugation. If rms phasor amplitudes are used instead of peak amplitudes,
    the factor $1/2$ is omitted.


    The cumulative thermal-electron wave power inside a plasma volume is the volume
    integral of this local density, $P_{\mathrm{th},e}(V)=\int_V p_{\mathrm{th},e}\,dV$.
    For a volume bounded by a flux surface, this relation connects the local deposition
    density to [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface).


    In practice this quantity is computed from wave-field solutions and the electron
    response used to evaluate absorption, or inferred indirectly by constraining heating
    models with electron temperature, density, radiated-power, and power-balance measurements.
    Its spatial distribution depends on wave frequency, polarization, propagation,
    resonance or damping conditions, and the local electron distribution.


    Typical magnitudes are strongly scenario dependent. Volume-averaged auxiliary
    wave heating is often of order $10^{4}$-$10^{6}$ W m$^{-3}$, while localized deposition
    regions can reach $10^{6}$-$10^{8}$ W m$^{-3}$ in high-power heating scenarios.


    Sign convention: Positive when wave energy is transferred from the coherent wave
    field to the thermal (bulk) electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
