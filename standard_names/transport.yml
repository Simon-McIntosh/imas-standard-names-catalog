- name: volume_averaged_ion_temperature
  kind: scalar
  status: draft
  description: Volume-averaged ion temperature for a specific ion species, integrated
    over the confined plasma volume bounded by the last closed flux surface.
  documentation: "The volume-averaged ion temperature $\\langle T_i \\rangle$ is a\
    \ global scalar derived from the local [ion_temperature](name:ion_temperature)\
    \ profile by integrating over the entire confined plasma volume up to the last\
    \ closed flux surface, providing a single aggregate measure of the thermal energy\
    \ content for a given ion species.\n\nThe defining relation is:\n\n$$\n\\langle\
    \ T_i \\rangle = \\frac{1}{V_{\\rm LCFS}} \\int_0^{V_{\\rm LCFS}} T_i(V') \\,\
    \ dV'\n$$\n\nwhere $T_i(V')$ is the local ion temperature at volume coordinate\
    \ $V'$ and $V_{\\rm LCFS}$ is the total plasma volume enclosed by the last closed\
    \ flux surface.\n\nIn practice, $\\langle T_i \\rangle$ is evaluated by summing\
    \ $T_i \\, dV$ over nested flux surfaces, where the differential volume element\
    \ $dV = 2\\pi R \\, dR \\, dZ$ is computed in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame. Local ion temperatures feeding into the profile are commonly\
    \ obtained from charge-exchange recombination spectroscopy on impurity or fuel\
    \ ion emission lines.\n\nTypical values range from 1\u20135 keV in standard L-mode\
    \ plasmas to 5\u201320 keV in high-confinement H-mode or advanced scenarios on\
    \ medium-to-large tokamaks. The species-summed counterpart is [volume_averaged_total_ion_temperature](name:volume_averaged_total_ion_temperature),\
    \ while [volume_averaged_ion_density](name:volume_averaged_ion_density) provides\
    \ the analogous species-resolved density average. The ratio of on-axis to volume-averaged\
    \ temperature, characterizing profile peaking, is given by [ratio_of_ion_temperature_to_volume_averaged_ion_temperature](name:ratio_of_ion_temperature_to_volume_averaged_ion_temperature)."
  unit: eV
  physics_domain: transport
