- name: accumulated_deposited_energy_of_plasma_facing_component
  kind: scalar
  status: active
  description: Pulse-integrated heat deposited in a plasma-facing component, including
    heat recovered during post-discharge cooling as the component returns toward thermal
    equilibrium.
  documentation: 'Accumulated deposited energy is the total heat energy transferred
    to a plasma-facing component during a complete plasma discharge and its post-discharge
    return toward thermal equilibrium. It represents a component-level thermal load
    rather than the plasma''s stored thermal energy.


    The accumulated quantity is defined by integrating the deposition-associated power
    over the full interval:


    $$

    E_{\mathrm{dep}} = \int_{t_{\mathrm{start}}}^{t_{\mathrm{end}}} P_{\mathrm{dep}}(t)\,\mathrm{d}t

    $$


    where $E_{\mathrm{dep}}$ is the accumulated deposited energy, $P_{\mathrm{dep}}(t)$
    is the power associated with heat deposited in the component at time $t$, and
    $t_{\mathrm{start}}$ and $t_{\mathrm{end}}$ define an interval covering the discharge
    and subsequent thermal return.


    The quantity applies to the complete plasma-facing component and aggregates all
    deposited contributions into one total; it is not resolved by particle species
    or population. The accumulation includes heat recovered after the plasma pulse
    and excludes instantaneous power, local energy flux density, and plasma stored
    energy.


    A mechanism-specific rate such as [power due to convection](name:power_due_to_convection)
    may contribute to the integral, but it is not itself the accumulated component-level
    energy.'
  unit: J
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - dd_path: calorimetry/group/component/energy_total/data
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/calorimetry.html#calorimetry-group-component-energy_total-data
    dd_documentation:
