- name: toroidal_deuterium_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal component of the deuterium ion fluid velocity at the H-mode\
    \ pedestal top, resolved along the direction of increasing toroidal angle in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The quantity gives the bulk deuterium ion flow speed in the toroidal\
    \ direction at the outermost reference point of the H-mode edge transport barrier\
    \ \u2014 the pedestal top \u2014 where the steep-gradient confined layer transitions\
    \ to the flatter core region.\n\nThe toroidal projection is defined as\n\n$$\n\
    v_{\\phi,\\mathrm{D}} = \\mathbf{v}_\\mathrm{D} \\cdot \\hat{\\phi}\n$$\n\nwhere\
    \ $\\mathbf{v}_\\mathrm{D}$ is the deuterium bulk ion fluid velocity and $\\hat{\\\
    phi}$ is the unit vector in the direction of increasing toroidal angle $\\phi$\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame.\n\nThis velocity is routinely\
    \ measured by charge-exchange recombination spectroscopy (CXRS), using the Doppler\
    \ shift of a deuterium emission line along a tangentially viewing chord; the pedestal\
    \ top location is identified from a parametric radial fit of the edge density\
    \ or temperature profile.\n\nToroidal ion velocities at the pedestal top typically\
    \ range from a few hundred m/s in Ohmic discharges to $10^4$\u2013$10^5$ m/s in\
    \ NBI-heated H-mode plasmas. The analogous quantity at the magnetic axis is [toroidal\
    \ deuterium velocity at the magnetic axis](name:toroidal_deuterium_velocity_at_magnetic_axis),\
    \ and at the last closed flux surface it is given by [toroidal deuterium velocity\
    \ at the plasma boundary](name:toroidal_deuterium_velocity_at_plasma_boundary).\
    \ For comparison with other ion species at the same locus, see [toroidal hydrogen\
    \ velocity at the pedestal top](name:toroidal_hydrogen_velocity_at_pedestal_top)\
    \ and [toroidal helium-4 velocity at the pedestal top](name:toroidal_helium_4_velocity_at_pedestal_top).\n\
    \nSign convention: Positive when the deuterium ion fluid flows in the direction\
    \ of increasing toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_magnetic_axis
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_hydrogen_velocity_at_pedestal_top
  - name:toroidal_helium_4_velocity_at_pedestal_top
- name: toroidal_deuterium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the deuterium ion bulk flow velocity at the\
    \ last closed flux surface. It is the projection along increasing toroidal angle\
    \ \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal deuterium velocity at the plasma boundary is the toroidal
    component of the bulk flow velocity of deuterium ions evaluated on the last closed
    flux surface. The toroidal direction is defined in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The boundary value is the projection of the deuterium bulk velocity onto the local
    toroidal unit vector:


    $$

    v_{D,\phi,b} = \mathbf{v}_D(\mathbf{x}_b,t) \cdot \hat{\phi}

    $$


    where $v_{D,\phi,b}$ is the toroidal deuterium velocity at the boundary in m s$^{-1}$,
    $\mathbf{v}_D$ is the deuterium ion bulk velocity in m s$^{-1}$, $\mathbf{x}_b$
    is a point on the last closed flux surface with $R$ and $Z$ in meters and $\phi$
    in radians, $t$ is time, and $\hat{\phi}$ is the dimensionless unit vector in
    the direction of increasing $\phi$.


    In practice this quantity is inferred by evaluating or reconstructing the deuterium
    flow field at the plasma boundary and projecting it onto $\hat{\phi}$. It may
    be constrained by ion-flow spectroscopy, edge diagnostics where applicable, and
    equilibrium or transport interpretation that maps measured velocities to the last
    closed flux surface; it is a boundary toroidal component and is distinct from
    a flux-surface average.


    Typical boundary toroidal deuterium velocities in tokamak plasmas are often within
    $-5\times10^4$ to $5\times10^4$ m s$^{-1}$, with magnitudes approaching $1\times10^5$
    m s$^{-1}$ in strongly momentum-driven or rapidly rotating edge conditions.


    Sign convention: Positive when the deuterium bulk flow at the plasma boundary
    has a toroidal component in the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_helium_4_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the argon ion bulk flow\
    \ velocity at the plasma boundary, in the right-handed cylindrical (R, \u03C6\
    , Z) frame. It refers to the elemental argon ion population rather than a single\
    \ specified charge state."
  documentation: 'This quantity is the toroidal component of the bulk flow velocity
    of argon ions, averaged over the magnetic flux surface at the plasma boundary,
    usually identified with the last closed flux surface or separatrix. It refers
    to the elemental argon ion population; when individual charge states are not resolved,
    the velocity is interpreted as a density-weighted bulk velocity over the contributing
    argon ion charge states.


    For an axisymmetric boundary flux surface, the flux-surface average can be written
    as a poloidal contour average weighted by the inverse poloidal magnetic-field
    magnitude:


    $$

    \langle v_{\phi,\mathrm{Ar}} \rangle_{\psi_b} = \frac{\oint_{\psi=\psi_b} v_{\phi,\mathrm{Ar}}(l)\,
    B_p(l)^{-1}\, dl}{\oint_{\psi=\psi_b} B_p(l)^{-1}\, dl}

    $$


    where $v_{\phi,\mathrm{Ar}}$ is the toroidal component of the argon ion bulk velocity
    in the right-handed cylindrical $(R, \phi, Z)$ frame, $\psi_b$ labels the boundary
    flux surface, $l$ is poloidal arc length around that surface, and $B_p$ is the
    poloidal magnetic-field magnitude. This expression defines the flux-surface average
    operator for this scalar at the boundary.


    In experiments, argon ion toroidal velocity is commonly inferred from Doppler
    shifts of argon charge-exchange recombination or line-emission spectra, with atomic
    physics, viewing geometry, and spatial mapping to the boundary flux surface taken
    into account. In transport or edge-plasma calculations it may be obtained from
    impurity momentum balance, including parallel transport, friction with main ions,
    electric-field effects, and charge-state coupling.


    Typical edge argon toroidal velocities are on the order of 10^3-5 x 10^4 m.s^-1.
    Values near the plasma boundary can be smaller in weakly rotating plasmas and
    may approach 10^5 m.s^-1 in strongly torqued or pedestal regimes; either sign
    is possible depending on the rotation direction.


    Sign convention: Positive when the argon ion toroidal velocity is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_argon_velocity_at_plasma_boundary
  - name:argon_density_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the carbon impurity ion\
    \ bulk velocity at the plasma boundary, resolved in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It represents impurity-ion flow on the last closed flux\
    \ surface, distinct from main-ion flow."
  documentation: 'Toroidal flux-surface-averaged carbon velocity at the plasma boundary
    is the flux-surface average of the toroidal component of the carbon impurity ion
    bulk velocity on the last closed flux surface. The toroidal component is resolved
    along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. This
    impurity flow is distinct from main-ion flow, even when carbon spectroscopy is
    used as a tracer for plasma rotation.


    For an axisymmetric boundary flux surface, the flux-surface average is commonly
    written with the poloidal-field Jacobian weighting:


    $$

    \left\langle v_{\phi,\mathrm{C}} \right\rangle_{\mathrm{LCFS}} = \frac{\oint_{\mathrm{LCFS}}
    v_{\phi,\mathrm{C}}\, dl / B_p}{\oint_{\mathrm{LCFS}} dl / B_p}

    $$


    where $v_{\phi,\mathrm{C}}$ is the local toroidal carbon velocity, $dl$ is poloidal
    arc length along the last closed flux surface, and $B_p$ is the poloidal magnetic-field
    magnitude. It is the boundary flux-surface average corresponding to the local
    quantity [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary).


    In practice, this quantity is usually inferred from charge-exchange recombination
    spectroscopy of carbon emission, often from C VI lines, combined with an equilibrium
    reconstruction to locate the emitting region relative to the boundary. When measurements
    do not cover the full poloidal contour, the average may be obtained by fitting
    or interpolating local toroidal velocities before applying the flux-surface weighting.
    Related species-resolved averages describe analogous impurity or main-ion toroidal
    flows, such as deuterium, oxygen, neon, and tungsten boundary velocities.


    Typical separatrix carbon toroidal velocities are of order -5e4 to 5e4 m.s^-1
    in many ohmic, RF-heated, or moderately beam-heated plasmas. Strong external momentum
    input or steep edge rotation gradients can produce absolute magnitudes around
    1e5-2e5 m.s^-1.


    Sign convention: Positive when the carbon impurity bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_deuterium_tritium_velocity
  kind: scalar
  status: draft
  description: "Flux-surface average of the local contravariant toroidal bulk-flow\
    \ component of a modeled deuterium-tritium composite ion species with mass 2.5\
    \ amu. The component is defined in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame, and positive values point toward increasing toroidal angle \u03C6."
  documentation: "Toroidal flux-surface averaged deuterium-tritium velocity is the\
    \ flux-surface average of the local contravariant toroidal bulk-flow component\
    \ of a modeled DT composite ion species. The composite species represents deuterium\
    \ and tritium as one ion fluid with effective mass 2.5 amu, and the toroidal component\
    \ is the signed component in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height.\
    \ The quantity has dimensions of velocity, with unit m.s^-1.\n\nThe flux-surface\
    \ average can be written as\n\n$$\n\\langle v_{\\phi,\\mathrm{DT}} \\rangle_\\\
    psi = \\frac{\\oint_{\\psi=\\mathrm{const}} v_{\\phi,\\mathrm{DT}} \\, d\\ell\
    \ / B_p}{\\oint_{\\psi=\\mathrm{const}} d\\ell / B_p}\n$$\n\nwhere $v_{\\phi,\\\
    mathrm{DT}}$ is the local DT toroidal velocity component in m.s^-1, associated\
    \ with the $\\hat{\\phi}$ direction in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame; $B_p$ is the poloidal magnetic-field magnitude; and $d\\ell$ is the\
    \ non-negative arc-length element along the closed poloidal contour of the flux\
    \ surface. The contour orientation does not enter this scalar average because\
    \ the weighting uses $d\\ell$ and the magnitude $B_p$. Here \u201Ctoroidal\u201D\
    \ identifies the local $\\phi$ component of the bulk-flow vector, not a projection\
    \ of motion in a poloidal cross-section.\n\nFor the composite DT species, the\
    \ value is most often computed or inferred in a single-ion-fluid representation\
    \ of the fuel mixture. Spectroscopic or charge-exchange measurements can constrain\
    \ the underlying ion-flow physics, but comparison with this composite velocity\
    \ normally requires the model assumption that maps separate species flows to the\
    \ 2.5 amu DT fluid. The same 2.5 amu convention applies to DT quantities on any\
    \ selected flux surface, including a plasma-boundary flux surface; the selected\
    \ surface changes the averaging domain, not the composite-species definition.\
    \ This quantity is the toroidal component of flux_surface_averaged_deuterium_tritium_velocity\
    \ and uses the same composite-species convention as [flux_surface_averaged_deuterium_tritium_density](name:flux_surface_averaged_deuterium_tritium_density).\
    \ Related toroidal velocity quantities include [toroidal_ion_velocity](name:toroidal_ion_velocity),\
    \ [toroidal_deuterium_velocity_at_magnetic_axis](name:toroidal_deuterium_velocity_at_magnetic_axis),\
    \ and [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary).\n\
    \nIn edge and near-boundary tokamak conditions, flux-surface averaged toroidal\
    \ ion-flow magnitudes are commonly 10^3-10^5 m.s^-1. Values can be near zero or\
    \ change sign when momentum input, radial electric-field shear, collisionality,\
    \ or neoclassical and turbulent transport alter the balance of toroidal momentum.\n\
    \nSign convention: Positive when the averaged DT toroidal bulk-flow component\
    \ points in the direction of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_deuterium_tritium_density
  - name:toroidal_ion_velocity
  - name:toroidal_deuterium_velocity_at_magnetic_axis
  - name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_deuterium_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal flux-surface-averaged deuterium-tritium velocity at the plasma\
    \ boundary is the flux-surface mean, on the last closed flux surface, of the physical\
    \ bulk-flow component along the contravariant toroidal coordinate direction for\
    \ the effective single D-T fuel species with atomic mass number 2.5. Positive\
    \ direction is increasing \u03C6 in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Toroidal flux-surface-averaged deuterium-tritium velocity at the
    plasma boundary is the flux-surface mean, on the last closed flux surface, of
    the physical bulk-flow component along the contravariant toroidal coordinate direction
    for the effective single D-T fuel species. The pseudo-species represents a deuterium-tritium
    fuel mixture as one ion fluid, commonly with atomic mass number 2.5 for an equimolar
    mixture. The component is defined along the toroidal basis direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The axisymmetric boundary flux-surface average can be written as


    $$

    \left\langle v_\phi^{\mathrm{DT}}\right\rangle_b =

    \frac{\oint_{\psi=\psi_b} \left(\mathbf{v}_{\mathrm{DT}}\cdot\hat{\phi}\right)\,
    dl/|\nabla\psi|}

    {\oint_{\psi=\psi_b} dl/|\nabla\psi|}

    $$


    where $\psi$ labels poloidal magnetic flux surfaces, $\psi_b$ is its value at
    the boundary flux surface, $dl$ is poloidal arc length along that surface, and
    $\mathbf{v}_{\mathrm{DT}}\cdot\hat{\phi}$ is the projection of the D-T bulk-flow
    velocity onto the toroidal basis direction. This projection gives the toroidal-coordinate
    bulk-flow component in physical-speed form, not the angular rate $d\phi/dt$.


    When separate isotope fluids are used, the local pseudo-species component entering
    the average is constructed as the density-weighted fuel mean, $v_\phi^{\mathrm{DT}}=(n_\mathrm{D}v_{\phi,\mathrm{D}}+n_\mathrm{T}v_{\phi,\mathrm{T}})/(n_\mathrm{D}+n_\mathrm{T})$,
    where $n_\mathrm{D}$ and $n_\mathrm{T}$ are the isotope number densities and $v_{\phi,\mathrm{D}}$
    and $v_{\phi,\mathrm{T}}$ are their toroidal bulk-flow components. If charge states
    are resolved, the deuterium and tritium species velocities in this construction
    are density-weighted means over all charge states, not sums.


    In practice this quantity is obtained by evaluating the D-T pseudo-species toroidal
    flow on, or as a limiting value approaching, the last closed flux surface and
    then applying the flux-surface-average weighting. It is related to the local boundary
    component [toroidal_deuterium_tritium_velocity_at_plasma_boundary](name:toroidal_deuterium_tritium_velocity_at_plasma_boundary)
    and to the corresponding flux-surface-averaged D-T velocity away from the boundary
    [toroidal_flux_surface_averaged_deuterium_tritium_velocity](name:toroidal_flux_surface_averaged_deuterium_tritium_velocity).
    The isotope-specific boundary counterparts [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary)
    describe the separate fuel-ion components.


    Typical magnitudes are strongly scenario dependent rather than fixed by the definition;
    they are governed by the net toroidal momentum balance, including applied torque,
    intrinsic rotation, ion-neutral momentum exchange, orbit effects, and edge momentum
    transport. Values can be near zero or can have either sign.


    Sign convention: Positive when the D-T pseudo-species toroidal bulk-flow velocity
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/deuterium_tritium/value
    dd_path: summary/local/separatrix_average/velocity_phi/deuterium_tritium/value
    status: composed
- name: toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of deuterium ion bulk-flow\
    \ velocity at the plasma boundary in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame, where R is major radius and Z is vertical height."
  documentation: 'This quantity is the flux-surface average, on the plasma boundary
    or separatrix, of the deuterium ion bulk-flow velocity component in the toroidal
    direction. The toroidal component is the projection of the deuterium flow velocity
    onto $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    represents the net boundary toroidal rotation of the deuterium ion population
    after poloidal variation around the boundary surface has been averaged out.


    A compact definition is:


    $$

    V_{\phi,D}^{\mathrm{FS},b} = \left\langle v_{\phi,D} \right\rangle_{\psi=\psi_b}

    $$


    where $V_{\phi,D}^{\mathrm{FS},b}$ is the boundary flux-surface-averaged deuterium
    toroidal velocity in m.s^-1, $v_{\phi,D}$ is the local deuterium toroidal bulk-flow
    velocity in m.s^-1, $\psi_b$ is the poloidal magnetic-flux value at the plasma
    boundary, and $\langle\cdot\rangle_{\psi=\psi_b}$ denotes the flux-surface average
    over that boundary surface.


    Experimentally, this quantity may be inferred from spectroscopic measurements
    of deuterium flow near the separatrix, combined with magnetic-equilibrium geometry
    to map local measurements to the boundary surface. In transport modeling it is
    the boundary-surface representative value of deuterium toroidal rotation, distinct
    from the local [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary).
    It is directly comparable with species analogs such as [toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary](name:toroidal_helium_3_velocity_at_plasma_boundary),
    [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary),
    and [toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary).


    Representative edge values are strongly discharge-dependent and are often near
    zero to a few $10^4$ m.s^-1 in magnitude; stronger external momentum input or
    edge radial-electric-field shear can produce values of order $10^5$ m.s^-1. The
    signed value can be positive or negative depending on the direction of toroidal
    deuterium flow.


    Sign convention: Positive when the deuterium ion bulk flow is directed along $+\hat{\phi}$,
    the direction of increasing toroidal angle $\phi$, in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_helium_3_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal velocity of helium-3 ions at the plasma
    boundary (separatrix).
  documentation: "The flux-surface-averaged toroidal velocity of helium-3 ($^3$He)\
    \ ions quantifies the bulk toroidal flow of this light helium isotope (2 protons,\
    \ 1 neutron) evaluated on the last closed flux surface that separates the confined\
    \ plasma from the open-field-line scrape-off layer. This boundary value characterizes\
    \ net toroidal rotation of $^3$He ions at the separatrix, relevant to impurity\
    \ transport, momentum balance, and plasma\u2013wall interaction studies.\n\nThe\
    \ flux-surface average of the toroidal velocity component is defined as:\n\n$$\n\
    \\langle v_\\phi \\rangle = \\frac{\\oint v_\\phi \\, dl / B_p}{\\oint dl / B_p}\n\
    $$\n\nwhere $v_\\phi = \\mathbf{v}_{\\mathrm{He_3}} \\cdot \\hat{\\phi}$ is the\
    \ ion fluid velocity projected onto $\\hat{\\phi}$ \u2014 the unit vector in the\
    \ direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame \u2014 $B_p$ is the poloidal magnetic field magnitude,\
    \ and $dl$ is the arc-length element along the separatrix contour.\n\nToroidal\
    \ rotation at the boundary is driven by external momentum sources such as neutral\
    \ beam injection, intrinsic rotation arising from turbulent and neoclassical stresses,\
    \ and the edge radial electric field. The quantity is inferred from charge exchange\
    \ recombination spectroscopy (CXRS) using injected neutral beams that stimulate\
    \ helium-3 charge-exchange emission lines whose Doppler shift encodes the local\
    \ toroidal velocity.\n\nBoundary toroidal flow speeds for light ions in tokamak\
    \ edge plasmas are of order $10^3$\u2013$10^4$ m s$^{-1}$, depending on heating\
    \ power, plasma current, and confinement regime. The analogous quantities for\
    \ tritium and hydrogen are [toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary)\
    \ and [toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary);\
    \ the generic multi-species form is [toroidal_ion_velocity_at_plasma_boundary](name:toroidal_ion_velocity_at_plasma_boundary).\n\
    \nSign convention: Positive when helium-3 ions flow in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above along $+\\hat{Z}$)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/helium_3/value
    dd_path: summary/local/separatrix_average/velocity_phi/helium_3/value
    status: composed
- name: toroidal_flux_surface_averaged_iron_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of the iron impurity ion bulk
    flow velocity at the plasma boundary (last closed flux surface).
  documentation: 'The toroidal component of the iron impurity bulk flow velocity,
    averaged over the magnetic flux surface coinciding with the plasma boundary, characterizes
    the net toroidal rotation of iron ions at the last closed flux surface. The flux-surface
    average eliminates poloidal asymmetries in the local velocity distribution, providing
    a single scalar representative of the toroidal impurity flow at the edge.


    The flux-surface average of a quantity $f$ on a given flux surface is defined
    as:


    $$

    \langle f \rangle = \frac{\oint f \, dl_p / B_p}{\oint dl_p / B_p}

    $$


    where $l_p$ is the poloidal arc length along the flux-surface contour and $B_p$
    is the poloidal magnetic field magnitude. Iron ($Z = 26$) is a high-$Z$ metallic
    impurity that enters the confined plasma through sputtering of plasma-facing components;
    its toroidal rotation at the boundary reflects edge momentum transport and neoclassical
    impurity flow physics.


    This quantity is measured via charge exchange recombination spectroscopy, exploiting
    Doppler shifts of iron charge-state emission lines recorded along multiple poloidal
    viewing chords; the flux-surface-averaged value is then reconstructed from multi-chord
    data. This name is directly analogous to boundary velocity names for lighter impurities
    such as [carbon](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    [argon](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary),
    and [neon](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary).
    Where poloidally resolved measurements are available, the local counterpart [toroidal
    iron velocity at the plasma boundary](name:toroidal_iron_velocity_at_plasma_boundary)
    provides additional information on poloidal asymmetries not captured by the flux-surface
    average.


    Sign convention: Positive when the iron ion velocity is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_iron_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_lithium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal flux-surface-averaged lithium velocity at the plasma boundary
    is the flux-surface average of the toroidal component of lithium ion velocity
    at the separatrix, formed as the density-weighted mean over all ionized lithium
    charge states from Li+ through Li3+.
  documentation: 'Toroidal flux-surface-averaged lithium velocity at the plasma boundary
    is the flux-surface average of the toroidal component of lithium ion velocity
    on the separatrix. The toroidal component is along $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. Because this is a species-level intensive quantity,
    lithium velocity is the density-weighted mean over all ionized lithium charge
    states, from $\mathrm{Li}^{+}$ through $\mathrm{Li}^{3+}$.


    A magnetic-flux-surface average on the separatrix may be written as


    $$

    \left\langle v_{\phi,\mathrm{Li}} \right\rangle_{\mathrm{sep}} = \frac{\displaystyle
    \iint_{\psi=\psi_{\mathrm{sep}}} \left( \frac{\sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}
    v_{\phi,\mathrm{Li}^{q+}}}{\sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}} \right) \frac{dS}{B}}{\displaystyle
    \iint_{\psi=\psi_{\mathrm{sep}}} \frac{dS}{B}}

    $$


    where $\psi_{\mathrm{sep}}$ labels the separatrix, $dS$ is an element of the magnetic
    surface, $B$ is the magnetic-field magnitude, $n_{\mathrm{Li}^{q+}}$ is the density
    of lithium charge state $q$, and $v_{\phi,\mathrm{Li}^{q+}}$ is its toroidal velocity
    component.


    In practice, the quantity is inferred from edge impurity spectroscopy, charge-exchange
    measurements when available, or impurity-transport modeling combined with an equilibrium
    description of the separatrix geometry. It is the flux-surface-averaged counterpart
    of [toroidal_lithium_velocity_at_plasma_boundary](name:toroidal_lithium_velocity_at_plasma_boundary),
    while the lithium densities entering the charge-state weighting are related to
    [flux_surface_averaged_lithium_density_at_plasma_boundary](name:flux_surface_averaged_lithium_density_at_plasma_boundary).


    Typical magnitudes near the separatrix are usually 1000-10000 m.s^-1, with the
    sign and magnitude depending on toroidal momentum input, radial electric field,
    collisional coupling to the main ions, and impurity source distribution.


    Sign convention: Positive when the lithium ion toroidal velocity is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_lithium_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/lithium/value
    dd_path: summary/local/separatrix_average/velocity_phi/lithium/value
    status: composed
- name: toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the neon ion velocity\
    \ at the plasma boundary, in the right-handed cylindrical (R, \u03C6, Z) frame\
    \ where \u03C6 is the toroidal angle."
  documentation: 'The toroidal flux-surface-averaged neon velocity at the plasma boundary
    is the average, on the last closed flux surface, of the toroidal component of
    the neon ion flow velocity. The toroidal component is taken along $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a flux surface $S(\psi_b)$ at the boundary poloidal flux $\psi_b$, the flux-surface
    average is commonly defined by the surface-weighted limit from closed flux surfaces:


    $$

    \langle v_{\phi,\mathrm{Ne}} \rangle_{\psi_b} = \frac{\int_{S(\psi_b)} v_{\phi,\mathrm{Ne}}
    \, dA / |\nabla\psi|}{\int_{S(\psi_b)} dA / |\nabla\psi|}

    $$


    where $v_{\phi,\mathrm{Ne}}$ is the local toroidal neon ion velocity in $\mathrm{m.s^{-1}}$,
    $dA$ is a surface-area element in $\mathrm{m^2}$, $\psi$ is poloidal magnetic
    flux in Wb, and $|\nabla\psi|$ is the magnitude of its spatial gradient in $\mathrm{Wb.m^{-1}}$.


    In practice this quantity is inferred from impurity spectroscopy, such as Doppler
    shifts of neon emission or charge-exchange lines, combined with viewing-geometry
    corrections and an equilibrium mapping to the plasma boundary. When direct coverage
    of the full surface is unavailable, the average may be reconstructed from localized
    measurements with assumptions about toroidal symmetry, poloidal variation, and
    the relevant neon charge-state population. The same concept is analogous to species-resolved
    boundary toroidal velocities for deuterium and nitrogen.


    Typical separatrix impurity toroidal-flow magnitudes are about $10^3$-$5 \times
    10^4\ \mathrm{m.s^{-1}}$, with values near zero possible in weakly rotating plasmas
    and larger magnitudes in strongly driven or highly asymmetric edge conditions.


    Sign convention: Positive when the flux-surface-averaged neon ion flow is in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_nitrogen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal velocity of nitrogen ions at the plasma
    boundary, representing the density-weighted mean over ion charge states N+ through
    N7+.
  documentation: 'Flux-surface-averaged toroidal velocity of nitrogen ions at the
    plasma boundary is the projection of the nitrogen ion fluid velocity onto the
    toroidal direction in the right-handed cylindrical $(R, \phi, Z)$ frame, averaged
    over the separatrix. Because this is an intensive flow quantity, the species-level
    value is the density-weighted mean over nitrogen ion charge states N$^+$ through
    fully stripped N$^{7+}$; neutral nitrogen is not included.


    The charge-state-density-weighted mean and the boundary flux-surface average are
    defined by


    $$

    \langle v_\phi^{\mathrm{N}}\rangle_b =

    \frac{\left\langle \sum_{z=1}^{7} n_{\mathrm{N}^{z+}} v_{\phi,\mathrm{N}^{z+}}
    \right\rangle_b}

    {\left\langle \sum_{z=1}^{7} n_{\mathrm{N}^{z+}} \right\rangle_b},

    \qquad

    \langle f\rangle_b =

    \frac{\oint_b f\, d\ell / B_p}{\oint_b d\ell / B_p}

    $$


    where $n_{\mathrm{N}^{z+}}$ is the local density of nitrogen ions with charge
    state $z+$, $v_{\phi,\mathrm{N}^{z+}}$ is their local toroidal velocity component,
    $z=1,\ldots,7$ denotes N$^+$ through N$^{7+}$, $f$ is any scalar field on the
    boundary contour, $d\ell$ is the poloidal arc-length element, and $B_p$ is the
    magnitude of the poloidal magnetic field. The denominator of the first fraction
    is the [flux-surface-averaged nitrogen density at the plasma boundary](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary).


    This quantity is commonly inferred from impurity spectroscopy and charge-exchange
    recombination measurements, using Doppler shifts of nitrogen emission together
    with equilibrium mapping to the boundary flux surface. It is used to characterize
    impurity rotation, edge momentum transport, and the response of seeded nitrogen
    to scrape-off-layer and pedestal conditions. Related boundary-flow quantities
    include [toroidal flux-surface-averaged hydrogen velocity at the plasma boundary](name:toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary),
    [toroidal flux-surface-averaged beryllium velocity at the plasma boundary](name:toroidal_flux_surface_averaged_beryllium_velocity_at_plasma_boundary),
    and [toroidal ion velocity at the plasma boundary](name:toroidal_ion_velocity_at_plasma_boundary).


    Typical values in tokamak separatrix conditions are about -1e4 to 1e4 m.s^-1,
    with low-flow or strongly damped edge plasmas often closer to -3e3 to 3e3 m.s^-1.


    Sign convention: Positive when the flux-surface-averaged nitrogen ion flow is
    directed toward increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/nitrogen/value
    dd_path: summary/local/separatrix_average/velocity_phi/nitrogen/value
    status: composed
- name: toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal bulk flow velocity of oxygen ions evaluated
    at the plasma boundary (last closed flux surface).
  documentation: 'The flux-surface-averaged toroidal velocity of oxygen ions at the
    plasma boundary quantifies the net toroidal bulk flow of oxygen impurities along
    the last closed flux surface (separatrix), collapsing the poloidal variation into
    a single representative scalar for the toroidal rotation state of oxygen at the
    plasma edge.


    The flux-surface average is defined as a poloidal-contour integral weighted by
    the inverse of the poloidal magnetic field magnitude $B_p$:


    $$

    \langle v_{\phi,\mathrm{O}} \rangle = \frac{\oint v_{\phi,\mathrm{O}} \, dl /
    B_p}{\oint dl / B_p}

    $$


    where $v_{\phi,\mathrm{O}}$ is the local toroidal oxygen ion velocity at poloidal
    arc-length position $l$ along the flux contour.


    Oxygen toroidal rotation is measured by charge exchange recombination spectroscopy
    (CXRS) using the Doppler shift of oxygen emission lines; combining measurements
    at multiple poloidal locations allows construction of the flux-surface average.
    The non-averaged local boundary value is given by [toroidal_oxygen_velocity_at_plasma_boundary](name:toroidal_oxygen_velocity_at_plasma_boundary),
    while analogous flux-surface-averaged toroidal velocities for other impurity species
    are given by [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary),
    and [toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary).


    Typical edge toroidal velocities for light impurities such as oxygen range from
    approximately $-2 \times 10^4$ to $+2 \times 10^4$ m/s, with sign and magnitude
    depending on plasma current direction, auxiliary heating power, and confinement
    mode.


    Sign convention: Positive when the oxygen ion bulk flow is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_oxygen_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal velocity of tritium ions at the plasma
    boundary.
  documentation: 'Flux-surface-averaged toroidal velocity of tritium ions at the plasma
    boundary is the flux-surface mean of the tritium ion fluid velocity component
    along the toroidal direction in the right-handed cylindrical $(R, \phi, Z)$ frame.
    At species level, the tritium velocity is the density-weighted mean over all tritium
    ion charge states. It characterizes isotope-specific edge toroidal rotation on
    the separatrix and its coupling to edge momentum transport.


    For a scalar toroidal velocity field on nested closed flux surfaces approaching
    the boundary, the flux-surface average is defined by


    $$

    \left\langle v_{\phi}^{\mathrm{T}} \right\rangle_{\psi_b}

    =

    \frac{\displaystyle \oint_{\psi=\psi_b} v_{\phi}^{\mathrm{T}}\, |\nabla \psi|^{-1}\,
    dS}

    {\displaystyle \oint_{\psi=\psi_b} |\nabla \psi|^{-1}\, dS}

    $$


    where $v_{\phi}^{\mathrm{T}}$ is the toroidal component of the tritium ion velocity,
    $\psi$ is poloidal magnetic flux, $\psi_b$ is its value at the plasma boundary,
    and $dS$ is the surface-area element. At the separatrix, this average is normally
    interpreted as the limit from closed flux surfaces inside the boundary.


    In practice this quantity is obtained from isotope-resolved edge rotation measurements
    when available, such as charge-exchange recombination spectroscopy, or from multi-species
    kinetic or fluid edge modeling constrained by density, temperature, and momentum
    balance. Boundary values are often inferred by fitting measurements near the pedestal
    top, separatrix, and near scrape-off layer, then evaluating the fitted toroidal
    velocity on the last closed flux surface.


    Typical absolute values near the separatrix are 10^3-10^4 m.s^-1 in H-mode plasmas,
    with lower-momentum L-mode cases often below 10^3 m.s^-1 and strongly driven or
    intrinsically rotating plasmas reaching several 10^4 m.s^-1.


    Sign convention: Positive when the toroidal component of the tritium ion velocity
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_tritium_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/tritium/value
    dd_path: summary/local/separatrix_average/velocity_phi/tritium/value
    status: composed
- name: toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of the tungsten impurity ion
    bulk flow velocity evaluated at the plasma boundary (last closed flux surface
    / separatrix).
  documentation: 'The flux-surface-averaged toroidal velocity of tungsten ions at
    the plasma boundary quantifies the mean toroidal rotation of the tungsten impurity
    species on the last closed flux surface, averaging out poloidal asymmetries that
    arise from neoclassical effects and centrifugal trapping. It differs from the
    local [toroidal tungsten velocity at the plasma boundary](name:toroidal_tungsten_velocity_at_plasma_boundary)
    by applying the flux-surface average operator, yielding a single representative
    scalar per flux surface rather than a position-dependent field along the separatrix.


    The flux-surface-averaged toroidal velocity is defined as:


    $$

    \langle v_\phi \rangle = \frac{\oint v_\phi \, dl / B_p}{\oint dl / B_p}

    $$


    where $v_\phi$ is the local toroidal component of the tungsten ion bulk flow,
    $B_p$ is the poloidal magnetic field magnitude, and the line integral runs along
    the plasma boundary flux surface in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    Tungsten boundary rotation is primarily inferred from charge exchange recombination
    spectroscopy (CXRS) using Doppler-shifted tungsten emission lines; local velocity
    measurements at multiple poloidal positions are then combined with magnetic geometry
    to evaluate the flux-surface average. The same averaging convention is applied
    consistently across impurity species, as in [toroidal flux-surface-averaged carbon
    velocity at the plasma boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary)
    and [toroidal flux-surface-averaged neon velocity at the plasma boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary).
    Typical boundary toroidal impurity rotation magnitudes range from $10^3$ to $10^5$
    m/s depending on heating power and toroidal momentum injection.


    Sign convention: Positive when the tungsten ion bulk flow is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_tungsten_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_xenon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of xenon ion bulk flow velocity
    at the plasma boundary (last closed flux surface).
  documentation: 'The flux-surface-averaged toroidal xenon velocity at the plasma
    boundary quantifies the mean azimuthal flow of xenon impurity ions around the
    torus, averaged along the last closed flux surface (separatrix). Xenon ($Z=54$)
    is a heavy noble-gas impurity used in radiative-mantle experiments to spread divertor
    heat loads, and its toroidal rotation reflects momentum balance between collisional
    coupling to the bulk plasma, neoclassical forces, and external toroidal momentum
    input.


    The flux-surface average of the toroidal velocity component $v_\phi^\mathrm{Xe}$
    is defined as:


    $$

    \langle v_\phi^\mathrm{Xe} \rangle = \frac{\oint v_\phi^\mathrm{Xe} \, B_p^{-1}
    \, dl}{\oint B_p^{-1} \, dl}

    $$


    where $B_p$ is the poloidal magnetic field magnitude and the line integrals are
    taken along the plasma boundary contour.


    Toroidal impurity velocities at the separatrix are measured primarily by charge
    exchange recombination spectroscopy (CXRS), resolving Doppler shifts from charge
    exchange between injected neutral beam atoms and Xe ions; a poloidally distributed
    array of sightlines is necessary to reconstruct the flux-surface average. The
    non-averaged counterpart is given by [toroidal_xenon_velocity_at_plasma_boundary](name:toroidal_xenon_velocity_at_plasma_boundary),
    while analogous averaged quantities for lighter seeding species include [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary).


    Sign convention: Positive when the xenon ion flow is directed in the sense of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_xenon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
- name: toroidal_helium_3_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the helium-3 ion fluid velocity evaluated at
    the H-mode pressure pedestal top, resolved along the direction of increasing toroidal
    angle.
  documentation: "The toroidal helium-3 ion fluid velocity at the pedestal top is\
    \ the projection of the helium-3 ion bulk flow velocity onto the toroidal unit\
    \ vector $\\hat{\\phi}$ at the radial location of the H-mode pedestal top, where\
    \ the steep-gradient edge transport barrier transitions to the flatter core profile.\n\
    \nThe toroidal component is defined as:\n\n$$\nv_\\phi^{\\mathrm{He3}} = \\mathbf{v}_{\\\
    mathrm{He3}} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\mathbf{v}_{\\mathrm{He3}}$ is\
    \ the helium-3 ion fluid velocity and $\\hat{\\phi}$ is the unit vector in the\
    \ direction of increasing toroidal angle in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame.\n\nToroidal ion rotation at the pedestal top arises from the\
    \ combined effects of E\xD7B flow, diamagnetic drift, and momentum input from\
    \ auxiliary heating. It is measured via charge exchange recombination spectroscopy\
    \ (CXRS) on active neutral beam-injected helium-3 minority ions. Typical pedestal\
    \ toroidal velocities span $\\pm 10$\u2013$100$ km/s depending on heating power,\
    \ plasma current, and confinement regime. The analogous quantity for helium-4\
    \ at the same locus is [toroidal helium-4 velocity at pedestal top](name:toroidal_helium_4_velocity_at_pedestal_top);\
    \ profiles along the radial direction are anchored by companion locus quantities\
    \ at the magnetic axis, [toroidal_helium_3_velocity_at_magnetic_axis](name:toroidal_helium_3_velocity_at_magnetic_axis),\
    \ and at the plasma boundary, [toroidal_helium_3_velocity_at_plasma_boundary](name:toroidal_helium_3_velocity_at_plasma_boundary).\n\
    \nSign convention: Positive when the helium-3 ion flow velocity points in the\
    \ direction of increasing toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_pedestal_top
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_plasma_boundary
- name: toroidal_helium_3_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the helium-3 ion bulk flow velocity at the plasma\
    \ boundary, resolved along the \u03C6 direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It characterizes rotation or flow of helium-3 ions where\
    \ closed magnetic flux surfaces meet the scrape-off layer."
  documentation: 'Toroidal helium-3 velocity at the plasma boundary is the toroidal
    component of the bulk flow velocity of $^3\mathrm{He}$ ions evaluated on the last
    closed flux surface. It describes the directed motion of the helium-3 ion population
    around the torus at the interface between confined plasma and the open-field-line
    scrape-off layer.


    The component is defined by projecting the helium-3 ion bulk velocity onto the
    toroidal basis direction of the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,^3\mathrm{He}} = \mathbf{v}_{^3\mathrm{He}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{^3\mathrm{He}}$ is the helium-3 ion bulk velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    In practice, this quantity may be inferred from Doppler shifts of helium spectral
    lines, charge-exchange measurements when suitable active neutrals are available,
    or from edge plasma modeling constrained by spectroscopy and equilibrium reconstruction.
    The boundary value is obtained by evaluating or interpolating the helium-3 flow
    to the last closed flux surface.


    Typical boundary values are often in the range $-5 \times 10^4$ to $5 \times 10^4$
    m.s^-1, with larger magnitudes approaching $1 \times 10^5$ m.s^-1 possible when
    strong momentum input, edge electric fields, or ion-temperature-gradient-driven
    flows are present.


    Sign convention: Positive when the helium-3 ion bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_plasma_boundary
  - name:toroidal_helium_3_velocity_at_magnetic_axis
