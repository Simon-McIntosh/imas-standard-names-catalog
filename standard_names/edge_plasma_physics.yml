      unit: m.s^-1
      coordinates:
      - summary/time
    enhanced_context:
      description: Helium isotope with 3 nucleons (3He).
      kind: template
- name: toroidal_flux_surface_averaged_helium_4_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal bulk-flow velocity of helium-4 ions
    at the separatrix, density-weighted over all helium-4 charge states.
  documentation: 'The quantity is the flux-surface average over the separatrix of
    the toroidal component of the helium-4 ion bulk-flow velocity. The helium-4 value
    includes all helium-4 charge states through a density-weighted mean, rather than
    a sum of their velocities.


    For charge-state-resolved density $n_{4,q}$ and toroidal velocity $v_{\phi,4,q}$,
    the species velocity is defined by


    $$

    v_{\phi,\mathrm{FS}} = \left\langle \frac{\sum_q n_{4,q}v_{\phi,4,q}}{\sum_q n_{4,q}}
    \right\rangle_{\mathrm{sep}}

    $$


    where $q$ indexes helium-4 charge state, $n_{4,q}$ is its number density in m$^{-3}$,
    $v_{\phi,4,q}$ is its toroidal velocity in m s$^{-1}$, and $\langle\cdot\rangle_{\mathrm{sep}}$
    denotes the flux-surface average over the separatrix. The toroidal component is
    taken along $\hat{\phi}$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    This averaged quantity is distinct from the local [toroidal helium-4 velocity
    at the plasma boundary](name:toroidal_flux_surface_averaged_helium_4_velocity_at_plasma_boundary);
    the corresponding isotope-specific construction for helium-3 is [toroidal flux-surface-averaged
    helium-3 velocity at the plasma boundary](name:toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary).


    Sign convention: Positive when the helium-4 bulk-flow component points in the
    direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/velocity_phi/helium_4/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-velocity_phi-helium_4-value
