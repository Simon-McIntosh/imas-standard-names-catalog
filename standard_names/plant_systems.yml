        \ trajectory through the plasma. Provides the flux-surface label as a function\
        \ of position along the pellet path for mapping ablation profiles to magnetic\
        \ geometry."
      kind: llm
- name: power_at_inlet
  kind: scalar
  status: active
  description: Rate of energy transfer entering a system at its inlet boundary, encompassing
    all physical mechanisms by which power is delivered to that subsystem.
  documentation: 'Power at inlet is the total rate at which energy crosses the inlet
    boundary of a system or subsystem, summed over all transport mechanisms present
    at that boundary.


    It enters system-level energy-balance equations for a control volume as:


    $$

    \dot{E} = P_{\rm in} - P_{\rm out}

    $$


    where $P_{\rm in}$ is the inlet power, $P_{\rm out}$ is the [power at the outlet](name:power_at_outlet),
    and $\dot{E}$ is the net rate of energy accumulation within the control volume.


    In fusion-plant and industrial power-system contexts, inlet power sets the upper
    bound on what any downstream conversion stage can recover. The thermal specialization
    [thermal_power_at_inlet](name:thermal_power_at_inlet) resolves the heat-carrying
    component entering a thermodynamic conversion cycle prior to electricity generation.
    Comparing inlet power with the net absorbed contribution, available via [net_absorbed_power_of_plant_system](name:net_absorbed_power_of_plant_system),
    characterizes overall subsystem energy efficiency.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_at_inlet
  - name:net_absorbed_power_of_plant_system
- name: power_of_breeder_blanket
  kind: scalar
  status: active
  description: Power of breeder blanket is the rate of energy transfer assigned to
    the tritium-breeding blanket. It is a parent concept for blanket power specializations
    distinguished by mechanism, boundary, or accounting convention, not specifically
    thermal, non-nuclear, surface, volumetric, input, or extracted power.
  documentation: 'Power of breeder blanket is the rate of energy transfer assigned
    to the tritium-breeding blanket as a plant component. It is the common parent
    concept for blanket power quantities that may be specialized by physical mechanism,
    spatial accounting boundary, or energy-accounting convention.


    For a specified blanket energy account, the associated power is the time derivative
    of that account:


    $$

    P_\mathrm{blanket} = \frac{dE_\mathrm{blanket}}{dt}

    $$


    where $E_\mathrm{blanket}$ is the energy deposited in, generated within, removed
    from, or otherwise assigned to the blanket by the particular specialization, and
    $t$ is time.


    This parent name does not by itself select a contribution type such as surface
    thermal loading, volumetric nuclear heating, radiative deposition, total deposited
    power, or extracted thermal power. Child quantities define those restrictions
    explicitly; for example, [thermal power of breeder blanket](name:thermal_power_of_breeder_blanket)
    denotes a thermal-load specialization, while [heating power of breeder blanket](name:heating_power_of_breeder_blanket)
    denotes a heating-power specialization.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_of_breeder_blanket
- name: power_of_plant_component_port
  kind: scalar
  status: active
  description: Power of a plant component port is the signed rate of energy transfer
    across a boundary connection of a plant component, independent of the physical
    carrier or mechanism. It generalizes mechanism-specific port powers such as thermal
    power carried by a coolant circuit.
  documentation: 'Power of a plant component port is the signed rate at which energy
    crosses a boundary connection of a plant component. The quantity is defined for
    the port as an energy-transfer interface and is independent of whether the transferred
    energy is thermal, mechanical, electrical, hydraulic, or another mechanism-specific
    form.


    For an oriented port whose positive direction is from the component to the connected
    carrier or circuit, the port power is


    $$

    P_{\mathrm{port}} = \frac{dE_{\mathrm{out}}}{dt}

    $$


    where $E_{\mathrm{out}}$ is the energy transferred through the port from the plant
    component to the connected carrier or circuit, and $t$ is time.


    This parent quantity is mechanism-agnostic. The [thermal power of a plant component
    port](name:thermal_power_of_plant_component_port) is a specific contribution in
    which the transferred energy is heat carried by a thermal working fluid; coolant
    enthalpy differences define that child, not the generic parent.


    Sign convention: Positive when net energy transfer through the port is from the
    plant component to the connected carrier or circuit.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_of_plant_component_port
- name: power_of_plant_subsystem
  kind: scalar
  status: active
  description: Real electrical power consumed by an individual plant subsystem at
    its electrical boundary, contributing to auxiliary-load accounting without including
    plant-wide aggregation.
  documentation: 'This quantity is the real electrical power consumed by one plant
    subsystem at its electrical boundary. It represents the subsystem''s contribution
    to auxiliary electrical load, distinct from plant-wide aggregation and net electrical
    balance quantities.


    $$

    P_{\rm sub} = \left\langle v(t)i(t) \right\rangle_t

    $$


    where $P_{\rm sub}$ is the boundary real power, $v(t)$ is the instantaneous terminal
    voltage, $i(t)$ is the instantaneous current directed into the subsystem, and
    $\langle\cdot\rangle_t$ denotes averaging over the relevant operating interval.
    For multiple terminals, the boundary power is the algebraic sum of the terminal
    power contributions. Positive power denotes consumption by the subsystem; exported
    or generated power is not included as consumed load. The quantity is distinct
    from [absorbed power of a plant system](name:absorbed_power_of_plant_system),
    [total power of a plant system](name:total_power_of_plant_system), and [net power
    of a plant system](name:net_power_of_plant_system).'
  unit: W
  physics_domain: plant_systems
  links:
  - name:absorbed_power_of_plant_system
  - name:total_power_of_plant_system
  - name:net_power_of_plant_system
  sources:
  - dd_path: balance_of_plant/power_electric_plant_operation/system/subsystem/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_electric_plant_operation-system-subsystem-power
    dd_documentation:
