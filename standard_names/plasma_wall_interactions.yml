- name: carbon_density_at_limiter
  kind: scalar
  status: active
  description: Carbon ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all carbon ionization states and
    excluding neutral carbon atoms.
  documentation: "Carbon density at a limiter is the local number density of carbon\
    \ ions in the boundary plasma immediately adjacent to a plasma-facing limiter\
    \ surface. The evaluation point is the plasma side of the magnetic presheath or\
    \ sheath entrance, consistent with the parent [density_at_limiter](name:density_at_limiter)\
    \ framework. Carbon supports six ionization states ($\\text{C}^{1+}$ through $\\\
    text{C}^{6+}$), and this quantity sums over all of them; neutral carbon atoms\
    \ are excluded from this count.\n\nThe total charge-state-summed carbon density\
    \ at the limiter is:\n\n$$\nn_\\text{C} = \\sum_{z=1}^{6} n_{\\text{C}^{z+}}\n\
    $$\n\nwhere $n_{\\text{C}^{z+}}$ is the number density of carbon ions in charge\
    \ state $z$ at the limiter evaluation point.\n\nCarbon enters the edge plasma\
    \ primarily through physical sputtering, chemical erosion, and recycling from\
    \ carbon-based plasma-facing components. The density is inferred from spectroscopic\
    \ line emission (C II through C VI) analyzed with collisional-radiative models\
    \ that convert observed photon emissivities to charge-state-resolved densities.\n\
    \nIn carbon-wall configurations, $n_\\text{C}$ at the limiter spans approximately\
    \ $10^{15}$\u2013$10^{18}$ m$^{-3}$, depending on the carbon source rate, local\
    \ electron temperature, and scrape-off-layer plasma density. Carbon impurities\
    \ contribute to [effective_charge_at_limiter](name:effective_charge_at_limiter)\
    \ and radiate strongly at edge electron temperatures of 10\u2013100 eV. Analogous\
    \ carbon densities at other boundary locations are tracked by [carbon_density_at_plasma_boundary](name:flux_surface_averaged_carbon_density_at_plasma_boundary)\
    \ and [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:effective_charge_at_limiter
  - name:flux_surface_averaged_carbon_density_at_plasma_boundary
