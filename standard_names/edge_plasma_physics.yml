- name: flux_surface_averaged_helium_3_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of helium-3 ions at the plasma
    boundary (separatrix), summed over all charge states.
  documentation: "The flux-surface-averaged helium-3 ion number density at the plasma\
    \ boundary is the mean particle concentration of \xB3He ions across the last closed\
    \ flux surface (separatrix), summed over all ionization states \u2014 singly ionized\
    \ He\xB3\u207A through fully stripped He\xB3\xB2\u207A. This quantity forms the\
    \ explicit flux-surface-averaged counterpart of [helium_3_density_at_plasma_boundary](name:helium_3_density_at_plasma_boundary),\
    \ anchoring the helium-3 inventory to the outermost magnetically confined flux\
    \ surface that separates the confined plasma from the open-field-line scrape-off\
    \ layer.\n\nThe flux-surface average is defined as:\n\n$$\n\\langle n_{\\mathrm{He3}}\
    \ \\rangle_{\\mathrm{FS}} = \\frac{\\oint_{\\psi_b} n_{\\mathrm{He3}} \\, dA}{\\\
    oint_{\\psi_b} dA}\n$$\n\nwhere $n_{\\mathrm{He3}}$ is the local helium-3 number\
    \ density at the boundary flux surface identified by poloidal magnetic flux value\
    \ $\\psi_b$, and the surface integrals are evaluated over the full last closed\
    \ flux surface.\n\nHelium-3 (nuclear charge $Z = 2$, mass number $A = 3$) arises\
    \ as a D\u2013D fusion product and is used as a minority ion-cyclotron resonance\
    \ heating species. The boundary density characterizes the helium-3 content available\
    \ for recycling into the scrape-off layer and informs edge particle balance assessments.\
    \ It is inferred from edge charge-exchange recombination spectroscopy or line-emission\
    \ spectroscopy, combined with equilibrium reconstruction to locate and integrate\
    \ over the separatrix geometry. The sibling quantity [flux_surface_averaged_helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary)\
    \ provides the corresponding value for the \u2074He isotope, while [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary)\
    \ gives the main-fuel boundary density at the same locus.\n\nSign convention:\
    \ Positive when helium-3 ions are present at the plasma boundary."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_3_density_at_plasma_boundary
  - name:flux_surface_averaged_helium_4_density_at_plasma_boundary
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
