- name: perturbed_plasma_magnetic_field
  kind: vector
  status: draft
  description: First-order or fluctuating magnetic-field vector evaluated in the plasma
    region relative to an equilibrium magnetic field. It is the MHD perturbation or
    eigenfunction field inside the plasma, distinct from perturbation quantities defined
    in the surrounding vacuum region.
  documentation: 'The perturbed plasma magnetic field $\delta\mathbf{B}_\mathrm{pl}$
    is the first-order or fluctuating part of the magnetic field evaluated inside
    the plasma region relative to an equilibrium field. It is the magnetic perturbation
    used in MHD stability, eigenmode, and plasma-response descriptions, and each resolved
    component has unit tesla. The word plasma identifies the region of the field,
    not an exclusive source attribution; perturbation fields defined in the surrounding
    vacuum region are separate quantities.


    The basic perturbative decomposition in the plasma region is


    $$

    \delta\mathbf{B}_\mathrm{pl}(\mathbf{x},t) = \mathbf{B}(\mathbf{x},t) - \mathbf{B}_0(\mathbf{x})

    $$


    where $\mathbf{x}$ is position in meters, $t$ is time in seconds, and $\mathbf{B}$,
    $\mathbf{B}_0$, and $\delta\mathbf{B}_\mathrm{pl}$ are magnetic fields in tesla.
    If externally imposed non-axisymmetric fields are present, this equation still
    refers to the perturbation of the total magnetic field at points in the plasma
    region; a response-only decomposition that subtracts an applied vacuum field is
    a model choice, not the defining convention for this quantity. Magnetic-field
    perturbations satisfy $\nabla\cdot\delta\mathbf{B}_\mathrm{pl}=0$ up to numerical
    or measurement error.


    In ideal linear MHD, the perturbation is often computed from the plasma displacement
    $\boldsymbol{\xi}$ through $\delta\mathbf{B}_\mathrm{pl}=\nabla\times(\boldsymbol{\xi}\times\mathbf{B}_0)$,
    where $\boldsymbol{\xi}$ is in meters; vector-potential formulations use $\delta\mathbf{B}_\mathrm{pl}=\nabla\times\delta\mathbf{A}$
    with $\delta\mathbf{A}$ in T m. Experimentally it is inferred by subtracting an
    equilibrium contribution from magnetic measurements and fitting mode structures;
    internal reconstructions combine boundary magnetics with equilibrium and stability
    constraints. For linear eigenfunctions, the absolute amplitude is normalization-dependent
    until fixed by a physical boundary condition, diagnostic calibration, or nonlinear
    saturation level, so shapes, phases, and relative component amplitudes are often
    the robust quantities.


    Components may be resolved in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius in meters, $\phi$ is toroidal angle in radians increasing
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical height
    in meters. The $R$ and $Z$ components are direct cylindrical projections; a poloidal
    component is a projection onto a specified poloidal direction, for example tangent
    to increasing $\theta$ in flux coordinates $(\rho, \theta, \phi)$, and is not
    interchangeable with either the $R$ or $Z$ component. Related plasma-region component
    quantities include the [radial perturbed plasma magnetic field real part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [poloidal perturbed plasma magnetic field real part](name:poloidal_perturbed_plasma_magnetic_field_real_part);
    the [poloidal perturbed vacuum magnetic field real part](name:poloidal_perturbed_vacuum_magnetic_field_real_part)
    describes the analogous perturbation in a vacuum region.


    Typical physical amplitudes are strongly position and normalization dependent.
    After an eigenfunction or time-dependent perturbation is placed on an absolute
    scale, small coherent fluctuations are often $10^{-6}$-$10^{-4}$ T, stronger tearing,
    kink, or edge-localized perturbations near magnetic sensors are commonly $10^{-4}$-$10^{-2}$
    T, and relative amplitudes $|\delta\mathbf{B}_\mathrm{pl}|/|\mathbf{B}_0|$ are
    often $10^{-6}$-$10^{-2}$. Unnormalized linear eigenfunctions should not be compared
    by absolute tesla value alone.


    Sign convention: Positive when a resolved component points along the positive
    direction of its stated basis vector; in the right-handed cylindrical $(R, \phi,
    Z)$ frame this is $+\hat{R}$ outward with increasing major radius $R$, $+\hat{\phi}$
    toward increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    $+\hat{Z}$), and $+\hat{Z}$ upward.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
