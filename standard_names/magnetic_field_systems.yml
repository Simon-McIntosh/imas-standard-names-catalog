    \ coordinates of the upper and lower cross-section boundaries, respectively. The\
    \ height is non-negative and is measured independently of the segment\u2019s position\
    \ or orientation in the toroidal direction. It is the vertical counterpart to\
    \ [width of iron core segment](name:width_of_iron_core_segment) and differs from\
    \ [thickness of iron core segment](name:thickness_of_iron_core_segment), which\
