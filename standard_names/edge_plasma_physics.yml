    \ the `fluctuating_` prefix denotes the standard deviation over the measurement\
    \ interval.\n\nThe defining relation is:\n\n$$\n\\sigma_{j_{i,\\mathrm{sat}}}\
    \ = \\left\\langle \\left( j_{i,\\mathrm{sat}} - \\langle j_{i,\\mathrm{sat}}\
    \ \\rangle \\right)^{2} \\right\\rangle^{1/2}\n$$\n\nwhere $j_{i,\\mathrm{sat}}$\
    \ is the instantaneous ion saturation current density and $\\langle \\cdot \\\
