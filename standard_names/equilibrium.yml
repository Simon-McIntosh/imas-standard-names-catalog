      kind: template
- name: flux_surface_averaged_major_radius
  kind: scalar
  status: active
  description: Flux-surface average of the major radius coordinate R on each nested
    magnetic flux surface, yielding the mean distance from the toroidal symmetry axis
    weighted by the inverse poloidal field strength.
  documentation: 'The flux-surface averaged major radius $\langle R \rangle$ is the
    mean value of the cylindrical major radius coordinate $R$ over a closed toroidal
    magnetic flux surface, weighted by the local inverse poloidal magnetic field magnitude.
    It belongs to the family of geometric metric coefficients (sometimes denoted $gm8$
    in neoclassical transport literature) that enter the flux-surface-averaged forms
    of transport and equilibrium equations, and is the flux-surface-averaging transformation
    of the parent quantity [major_radius](name:major_radius).


    The defining expression is:


    $$

    \langle R \rangle = \frac{\oint R \, \frac{dl}{B_p}}{\oint \frac{dl}{B_p}}

    $$


    where $l$ is the poloidal arc length along the flux surface and $B_p$ is the poloidal
    magnetic field magnitude, with integrals taken over one complete poloidal circuit.
    Because $B_p$ is smaller on the outboard low-field side, field lines dwell longer
    there, and $\langle R \rangle$ is shifted toward larger $R$ relative to a simple
    geometric centroid; it lies between the inner_major_radius_of_flux_surface and
    the outer_major_radius_of_flux_surface.


    This coefficient is computed directly from the magnetic geometry obtained in equilibrium
    reconstruction, and is closely related to flux_surface_average_magnetic_field
    and flux_surface_averaged_curvature, which are derived from the same surface-averaging
    procedure.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links: []
  arguments:
  - name: major_radius
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/gm8
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-gm8
    dd_documentation:
      leaf: Flux surface averaged R
