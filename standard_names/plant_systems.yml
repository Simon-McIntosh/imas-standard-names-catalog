- name: silane_source_rate
  kind: scalar
  status: draft
  description: Instantaneous injection rate of silane (SiH4) gas into the plasma vessel,
    expressed in equivalent electrons per second.
  documentation: 'Silane ($\mathrm{SiH_4}$, silicon tetrahydride) is a silicon-bearing
    compound injected as a controlled impurity source in plasma experiments. The source
    rate quantifies the instantaneous rate of silane introduction expressed as an
    equivalent-electron flux, where each $\mathrm{SiH_4}$ molecule contributes the
    combined atomic numbers of its constituent atoms.


    Each silane molecule carries $Z_\mathrm{Si} + 4\,Z_\mathrm{H} = 14 + 4 = 18$ equivalent
    electrons. The equivalent-electron rate $\dot{N}_\mathrm{eq}$ relates to the molecular
    injection flux $\dot{N}_{\mathrm{SiH_4}}$ by:


    $$

    \dot{N}_\mathrm{eq} = 18 \, \dot{N}_{\mathrm{SiH_4}}

    $$


    where $Z_\mathrm{Si} = 14$ is the atomic number of silicon, $Z_\mathrm{H} = 1$
    is the atomic number of hydrogen, and $\dot{N}_{\mathrm{SiH_4}}$ is the molecular
    injection rate in molecules per second.


    The instantaneous rate is inferred from calibrated gas-valve systems monitoring
    flow at the injection manifold. Integrating this rate over the plasma discharge
    from breakdown gives the [accumulated silane count](name:accumulated_silane_count),
    which tracks the total equivalent-electron inventory of silane introduced during
    a discharge. Analogous rate quantities for other injected species include [xenon_source_rate](name:xenon_source_rate)
    and [nitrogen_source_rate](name:nitrogen_source_rate).


    Sign convention: Positive when silane gas is being injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_silane_count
  - name:xenon_source_rate
  - name:nitrogen_source_rate
  sources:
  - id: dd:summary/gas_injection_rates/silane/value
    dd_path: summary/gas_injection_rates/silane/value
    status: composed
- name: total_power_of_plant_system
  kind: scalar
  status: draft
  description: Aggregate electrical power consumed by all plant systems during operation.
    It represents the total auxiliary electrical load of the plant, summed over individual
    plant-system consumption terms.
  documentation: 'Total plant-system power is the aggregate electrical load required
    to operate all auxiliary plant systems. It includes electrical consumption by
    systems such as pumps, cryogenics, heating and current-drive auxiliaries, tritium
    processing, cooling, control, and other balance-of-plant services when those systems
    are drawing power.


    The total is defined as the sum of the consumed electrical power of each plant
    system:


    $$

    P_{\mathrm{plant,total}} = \sum_i P_{\mathrm{plant},i}

    $$


    where $P_{\mathrm{plant,total}}$ is the total plant-system electrical consumption
    in W, $P_{\mathrm{plant},i}$ is the electrical power consumed by plant system
    $i$ in W, and the sum extends over all plant systems included in the plant operating
    boundary. Each term is treated as a positive electrical load; this quantity is
    not a signed net export or generation term.


    In practice, the quantity is computed from electrical metering, plant control
    signals, or design-point power budgets for the contributing systems. Time averaging
    should be chosen consistently with the plant operating state being represented,
    because pulsed operation, recirculating power, standby loads, and transient actuator
    demands can change the aggregate load substantially.


    Typical values range from 1-100 MW for large experimental facilities and from
    100-1000 MW for power-plant studies, depending strongly on heating and current-drive
    demand, cryogenic load, coolant pumping power, and balance-of-plant design.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_system
  - name:power_of_plant_subsystem
  - name:net_power_of_plant_system
  - name:total_thermal_power_at_inlet
  sources:
  - id: dd:balance_of_plant/power_electric_plant_operation/power_total
    dd_path: balance_of_plant/power_electric_plant_operation/power_total
    status: composed
- name: total_thermal_power_at_inlet
  kind: scalar
  status: draft
  description: Gross thermal power delivered to the heat-input side of a power conversion
    cycle in a fusion power plant. It is the total recoverable heat entering the cycle
    before thermal-to-electric conversion, as opposed to the rejected heat or the
    net electrical output.
  documentation: 'Total thermal power at the inlet is the gross heat rate carried
    into the power conversion cycle by the working and coolant fluids, before any
    thermal-to-electric conversion. It is the heat-input reference against which rejected
    heat and thermal conversion efficiency are balanced, and is the counterpart of
    the [total thermal power at the outlet](name:total_thermal_power_at_outlet), which
    carries the rejected heat to the cold sink.


    The inlet thermal power is the sum, over all coolant and working-fluid streams
    feeding the cycle, of mass flow rate multiplied by the enthalpy rise relative
    to the cycle''s cold-return state:


    $$

    P_\mathrm{th,in} = \sum_i \dot{m}_i \left( h_{i,\mathrm{in}} - h_{i,\mathrm{ref}}
    \right)

    $$


    where $\dot{m}_i$ is the mass flow rate of stream $i$ in kg/s, $h_{i,\mathrm{in}}$
    is its specific enthalpy at the cycle inlet in J/kg, and $h_{i,\mathrm{ref}}$
    is the specific enthalpy of the corresponding cold return state in J/kg. The thermal
    conversion efficiency follows inline as $\eta_\mathrm{th} = (P_\mathrm{th,in}
    - P_\mathrm{th,out})/P_\mathrm{th,in}$, where $P_\mathrm{th,out}$ is the heat
    rejected from the cycle.


    In practice this quantity is obtained from a steady-state plant heat balance or
    calorimetrically from measured coolant mass flow rates and enthalpy changes across
    the heat exchangers that feed the conversion cycle. The per-stream contributions
    correspond to the [thermal power of plant component ports](name:thermal_power_of_plant_component_port)
    summed over the inlet ports of the conversion cycle.


    For reactor-scale plants the inlet thermal power is of the order of one to several
    gigawatts, with the precise value set by the heat sources coupled to the cycle
    and the plant design.


    Sign convention: Positive when net heat flows into the power conversion cycle.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_outlet
  - name:total_power_of_plant_system
  sources:
  - id: dd:balance_of_plant/power_plant/total_heat_supplied
    dd_path: balance_of_plant/power_plant/total_heat_supplied
    status: composed
- name: total_thermal_power_at_outlet
  kind: scalar
  status: draft
  description: Total waste-heat power rejected from the power-conversion cycle to
    the environment rather than converted into useful electrical output.
  documentation: 'Total thermal power at the outlet is the rate at which a power-conversion
    cycle rejects heat to its low-temperature sink. It represents the waste-heat load
    that must be removed by condensers, cooling water systems, dry coolers, cooling
    towers, or other heat-rejection equipment after useful electrical work has been
    extracted.


    For a steady power-conversion cycle, the first-law power balance is:


    $$

    P_\mathrm{out} = P_\mathrm{in} - P_\mathrm{net}

    $$


    where $P_\mathrm{out}$ is the rejected thermal power in W, $P_\mathrm{in}$ is
    the [total thermal power at the inlet](name:total_thermal_power_at_inlet) in W,
    and $P_\mathrm{net}$ is the net useful electrical power delivered by the conversion
    system in W. The thermal efficiency is $\eta = P_\mathrm{net}/P_\mathrm{in}$,
    so the rejected fraction is $P_\mathrm{out}/P_\mathrm{in} = 1 - \eta$; for a heat
    engine operating between hot and cold reservoirs, $\eta$ is limited by the reservoir
    temperatures through the second law of thermodynamics.


    In practice this quantity is obtained from a plant-level energy balance, from
    calorimetry of the heat-sink stream, or from both. Calorimetric estimates use
    measured coolant mass flow rate and enthalpy rise across the heat-rejection equipment,
    while electrical metering provides the net work term needed to close the cycle
    balance.


    For reactor-scale fusion power-plant studies, thermal efficiencies of about 30-40%
    imply rejected heat loads of about 60-70% of the inlet thermal power. Commercial-scale
    cases with several hundred MW of net electrical output typically reject about
    1-3 GW of thermal power, depending on cycle efficiency, auxiliary loads, and heat-sink
    temperature.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_inlet
  sources:
  - id: dd:balance_of_plant/power_plant/total_heat_rejected
    dd_path: balance_of_plant/power_plant/total_heat_rejected
    status: composed
- name: tritium_prefill_count
  kind: scalar
  status: draft
  description: Accumulated number of tritium atoms injected as gas during the plasma
    prefill phase, expressed in equivalent electrons.
  documentation: "The tritium prefill count records the total number of tritium atoms\
    \ ($^3_1\\text{H}$, charge number $Z = 1$) delivered to the vessel as neutral\
    \ gas during the prefill phase \u2014 the period from the start of gas injection\
    \ up to plasma breakdown. Because tritium is a hydrogen isotope with $Z = 1$,\
    \ the equivalent-electron count equals the raw atom count directly.\n\nThe prefill\
    \ phase establishes the initial neutral gas background required for reproducible\
    \ plasma initiation; the tritium component is particularly relevant in deuterium-tritium\
    \ operations, where it contributes to the initial fuel mix and breakdown conditions.\
    \ The count is accumulated from calibrated gas injection valve signals integrated\
    \ over the duration of the prefill phase. For multi-species prefill scenarios,\
    \ the total electron-equivalent inventory is $\\sum_s Z_s N_s$, where $Z_s$ is\
    \ the charge number and $N_s$ the atom count for species $s$.\n\nThis quantity\
    \ complements [deuterium_prefill_count](name:deuterium_prefill_count), [neon_prefill_count](name:neon_prefill_count),\
    \ and [krypton_prefill_count](name:krypton_prefill_count), which together with\
    \ this name characterize the full multi-species neutral gas inventory available\
    \ at breakdown; the aggregate is captured by [prefill_count](name:accumulated_lithium_prefill_count_due_to_gas_injection).\n\
    \nSign convention: Positive when tritium atoms have been injected into the vessel\
    \ during the prefill phase."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:deuterium_prefill_count
  - name:neon_prefill_count
  - name:krypton_prefill_count
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  arguments:
  - name: accumulated_lithium_prefill_count_due_to_gas_injection
    operator: tritium
    operator_kind: qualifier
  sources:
  - id: dd:summary/gas_injection_prefill/tritium/value
    dd_path: summary/gas_injection_prefill/tritium/value
    status: composed
- name: vertical_coordinate_of_pellet_path_point
  kind: scalar
  status: draft
  description: Vertical Z coordinate of a point on a pellet injection trajectory in
    the right-handed cylindrical (R, phi, Z) frame, measured relative to the tokamak
    equatorial plane.
  documentation: 'The vertical coordinate of a pellet path point is the $Z$ position
    of a specified point on a pellet injection trajectory. In the right-handed cylindrical
    $(R,\phi,Z)$ frame, $R$ is major radius in meters, $\phi$ is toroidal angle in
    radians increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height in meters measured relative to the tokamak equatorial plane.
    Together with the [major radius](name:major_radius_of_pellet_path_point) and [toroidal
    angle], it specifies the spatial location of the path point.


    Values are usually obtained from injector and guide-tube geometry, alignment surveys,
    trajectory modeling, or reconstruction of the pellet path when direct position
    observations are available. The coordinate describes the geometry of the path
    point and does not by itself specify pellet speed, mass, fragmentation, ablation
    rate, or time of flight.


    For paths crossing the confined plasma, $Z$ is commonly within -1 to 1 m in medium-sized
    tokamaks and can span about -3 to 3 m in large tokamaks. Points near injectors
    or external launch structures can lie farther from the equatorial plane, depending
    on the device geometry.


    Sign convention: Positive when the path point lies above the tokamak equatorial
    plane in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:major_radius_of_pellet_path_point
  sources:
  - id: dd:pellets/time_slice/pellet/path_geometry/first_point/z
    dd_path: pellets/time_slice/pellet/path_geometry/first_point/z
    status: attached
  - id: dd:pellets/time_slice/pellet/path_geometry/second_point/z
    dd_path: pellets/time_slice/pellet/path_geometry/second_point/z
    status: attached
  - id: dd:pellets/time_slice/pellet/path_profiles/position/z
    dd_path: pellets/time_slice/pellet/path_profiles/position/z
    status: composed
  - id: dd:spi/injector/fragment/position/z
    dd_path: spi/injector/fragment/position/z
    status: attached
  - id: dd:spi/injector/pellet/position/z
    dd_path: spi/injector/pellet/position/z
    status: attached
- name: vertical_coordinate_of_shattering_position
  kind: scalar
  status: draft
  description: Vertical coordinate of the point where a pellet is shattered in a shattered
    pellet injection system, measured along the machine symmetry axis.
  documentation: 'In a shattered pellet injection (SPI) system, a solid pellet is
    fractured into fragments at a prescribed shattering position before the debris
    enters the plasma. The vertical coordinate $Z$ identifies the height of this shattering
    event in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major
    radius and $Z$ increases upward along the machine symmetry axis.


    Together with the radial companion [major_radius_of_pellet_path_point](name:major_radius_of_pellet_path_point),
    this $Z$ coordinate fully specifies the poloidal location of fragment formation,
    directly influencing the spatial distribution of the ablating pellet cloud and
    the resulting material deposition profile in the plasma. The [vertical_coordinate_of_pellet](name:vertical_coordinate_of_pellet_path_point)
    gives the instantaneous $Z$ position of the intact pellet along its trajectory
    before impact.


    The shattering position is a fixed geometric property of the injector assembly,
    set by the guide tube termination and barrel exit geometry; it is determined by
    mechanical survey of the injection system relative to the machine coordinate origin.
    Typical $Z$ values range from approximately $-2$ m to $+2$ m in medium-sized tokamaks,
    depending on the injection port location and whether the system targets midplane,
    upper, or lower regions of the vessel.


    Sign convention: Positive when the shattering position lies above the machine
    equatorial plane, in the direction of increasing $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:major_radius_of_pellet_path_point
  - name:vertical_coordinate_of_pellet_path_point
  sources:
  - id: dd:spi/injector/shattering_position/z
    dd_path: spi/injector/shattering_position/z
    status: composed
- name: vertical_velocity_of_pellet
  kind: scalar
  status: draft
  description: Z component of the shattered pellet center-of-mass velocity in the
    right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical velocity of a pellet is the $Z$ component $v_Z$ of
    the center-of-mass velocity of a shattered pellet or its fragment cloud. It describes
    motion parallel to the vertical direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. Together with [radial velocity of the pellet](name:radial_velocity_of_pellet)
    and [toroidal velocity of the pellet](name:toroidal_velocity_of_pellet), it forms
    the cylindrical component representation of the pellet translational velocity.


    The pellet center-of-mass velocity decomposes in the right-handed cylindrical
    $(R, \phi, Z)$ frame as:


    $$

    \mathbf{v}_\mathrm{pellet} = v_R \hat{R} + v_\phi \hat{\phi} + v_Z \hat{Z}

    $$


    where $v_R$, $v_\phi$, and $v_Z$ are the radial, toroidal, and vertical velocity
    components, all in m.s^-1, and $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$ are the
    corresponding unit vectors.


    In practice, $v_Z$ is obtained from the time derivative of the pellet or fragment-cloud
    center-of-mass position, or from a reconstructed trajectory and launch geometry.
    For a fragment cloud, the center-of-mass velocity represents the mass-weighted
    translational motion of the cloud rather than the motion of any individual fragment.


    Typical values are configuration- and trajectory-dependent and are reported in
    m.s^-1. For a given pellet speed $|\mathbf{v}_\mathrm{pellet}|$, the component
    satisfies $-|\mathbf{v}_\mathrm{pellet}| \le v_Z \le |\mathbf{v}_\mathrm{pellet}|$;
    it may be near zero for nearly horizontal trajectories or comparable to the total
    speed for strongly inclined trajectories.


    Sign convention: Positive when the pellet center of mass moves in the direction
    of increasing $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:radial_velocity_of_pellet
  - name:toroidal_velocity_of_pellet
  sources:
  - id: dd:spi/injector/pellet/velocity_z
    dd_path: spi/injector/pellet/velocity_z
    status: composed
  - id: dd:spi/injector/velocity_mass_centre_fragments_z
    dd_path: spi/injector/velocity_mass_centre_fragments_z
    status: attached
- name: thermal_power_of_divertor
  kind: scalar
  status: draft
  description: Total heat-exhaust power deposited on the plasma-facing surfaces of
    the divertor system. It is the surface integral of the local thermal heat flux
    over divertor targets and included divertor components, excluding main-wall loads
    and distinct electrical-current power.
  documentation: 'Thermal power of the divertor is the total rate at which plasma
    exhaust energy is deposited as heat on the divertor system. The relevant integration
    surface is the plasma-facing boundary of the divertor system, including divertor
    targets and any other divertor components included in the thermal-load definition,
    but excluding main-wall surfaces. This quantity represents the thermal heat-exhaust
    load; it is distinct from divertor power associated specifically with electric
    currents.


    For a specified divertor surface set, the total thermal power is the surface integral
    of the deposited thermal heat-flux density:


    $$

    P_{\mathrm{th,div}} = \int_{S_{\mathrm{div}}} q_{\mathrm{th}}(\mathbf{x}) \, dA

    $$


    where $S_{\mathrm{div}}$ is the selected plasma-facing divertor surface, $q_{\mathrm{th}}$
    is the local thermal heat-flux density deposited into that surface in W m$^{-2}$,
    $dA$ is the surface element in m$^2$, and $P_{\mathrm{th,div}}$ is in W. If the
    divertor is treated as a set of components or targets, the same quantity is the
    sum of this integral over those components.


    In practice it is inferred by integrating mapped divertor heat-flux measurements
    from infrared thermography, embedded calorimetry, thermocouples, probes, or radiation
    and neutral-exhaust analysis, often constrained by global power balance. Modeling
    estimates compute the same surface-integrated thermal deposition from parallel
    transport, cross-field spreading, volumetric radiation, charge-exchange neutrals,
    and plasma-surface interaction physics.


    Typical values are strongly device and scenario dependent: small or medium experiments
    may deposit about $10^5$-$10^7$ W on the divertor, large tokamak scenarios about
    $10^7$-$10^8$ W, and reactor or power-plant designs can require exhaust handling
    at about $10^8$-$10^9$ W. The distribution over the wetted area is often as important
    as the total, because material limits are governed by local heat flux as well
    as integrated power.


    Sign convention: Positive when thermal energy is deposited into the divertor system
    from the plasma.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_divertor
  - name:thermal_power_at_wall
  - name:thermal_power_of_breeder_blanket
  - name:power_of_divertor_due_to_fusion
  - name:power_at_divertor_target_due_to_conduction
  - name:power_at_divertor_target_due_to_convection
  sources:
  - id: dd:balance_of_plant/power_plant/heat_load_divertor
    dd_path: balance_of_plant/power_plant/heat_load_divertor
    status: composed
