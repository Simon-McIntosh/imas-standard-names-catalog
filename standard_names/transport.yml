- name: radial_ion_momentum_flux
  kind: scalar
  status: draft
  description: Radial component of the momentum flux carried collectively by all ion
    charge states across a flux surface, governing radial transport of toroidal and
    poloidal momentum.
  documentation: "The radial ion momentum flux is a scalar component of the ion momentum\
    \ flux tensor, quantifying the rate at which ion momentum is transported per unit\
    \ area radially outward across a flux surface. In the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, this flux mediates the radial redistribution of plasma\
    \ rotation, arising from turbulent eddies (Reynolds stress), neoclassical processes,\
    \ and external torque injection. The quantity is defined as $\\Pi_{\\mathrm{radial}}\
    \ = \\langle m_i n_i v_r v_\\parallel \\rangle$ summed over all ion charge states,\
    \ where $m_i$ is the ion mass, $n_i$ is the ion density, $v_r$ is the radial drift\
    \ velocity, and $v_\\parallel$ is the parallel flow velocity; the angle brackets\
    \ denote flux-surface averaging. Typical values in the edge region of a tokamak\
    \ range from $10^3$ to $10^5$ kg\xB7m$^{-1}$\xB7s$^{-2}$, depending on plasma\
    \ rotation and turbulence levels. This flux is routinely inferred from experimental\
    \ measurements of the radial force balance and from gyrokinetic simulations, and\
    \ it connects directly to the evolution of the poloidal and toroidal rotation\
    \ profiles. See also the parent quantity [ion_momentum_flux](name:ion_momentum_flux)\
    \ which represents the scalar total, and the charge-state-resolved sibling [radial_ion_state_momentum_flux](name:radial_ion_state_momentum_flux)."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_momentum_flux
  - name:radial_ion_state_momentum_flux
