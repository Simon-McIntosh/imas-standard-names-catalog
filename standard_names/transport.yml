- name: total_neutral_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure of neutral particles, summing both thermal and
    non-thermal (fast) contributions across all internal states of the neutral species.
  documentation: "Total neutral pressure is the combined kinetic pressure of the neutral\
    \ particle population, comprising isotropic thermal pressure from neutrals near\
    \ local thermodynamic equilibrium and non-thermal pressure from suprathermal (fast)\
    \ neutrals, aggregated across all internal quantum states of the species.\n\n\
    The total pressure decomposes as:\n\n$$\np_\\mathrm{neutral} = p_\\mathrm{th}\
    \ + p_\\mathrm{fast}\n$$\n\nwhere $p_\\mathrm{th} = n_\\mathrm{th}\\,k_B\\,T_\\\
    mathrm{neutral}$ is the thermal contribution, $n_\\mathrm{th}$ is the thermal\
    \ neutral number density, $T_\\mathrm{neutral}$ is the neutral temperature, and\
    \ $p_\\mathrm{fast}$ is the non-thermal pressure from suprathermal neutrals, computed\
    \ as one-third of the second velocity moment of the fast neutral distribution\
    \ function.\n\nIn plasma transport modeling, the neutral pressure profile is computed\
    \ from coupled fluid or kinetic neutral models in which charge exchange and ionization\
    \ redistribute momentum between the neutral and plasma populations. This quantity\
    \ enters plasma momentum and energy balance equations as a source term and governs\
    \ neutral penetration depth into the confined plasma.\n\nIn core plasma regions,\
    \ strong ionization screens neutral penetration and total neutral pressures remain\
    \ well below 1 Pa. In the edge plasma and scrape-off layer, values range from\
    \ 0.01\u201310 Pa under standard recycling conditions; near divertor strike points\
    \ during high-recycling operation, values can approach tens of Pa. The state-resolved\
    \ counterpart is [total_neutral_state_pressure](name:total_neutral_state_pressure);\
    \ the thermal-only contribution is described by [thermal_neutral_pressure](name:thermal_neutral_pressure);\
    \ and the analogous ion quantity is [total_ion_state_pressure](name:total_ion_state_pressure).\
    \ The parent quantity [neutral_pressure](name:neutral_pressure) describes gage\
    \ measurements of bulk neutral gas pressure in the vacuum vessel.\n\nSign convention:\
    \ Positive when neutral particles exert an outward kinetic pressure on an enclosing\
    \ surface element, consistent with pressure as a non-negative second-order moment\
    \ of the neutral velocity distribution."
  unit: Pa
  physics_domain: transport
  links: []
  sources:
