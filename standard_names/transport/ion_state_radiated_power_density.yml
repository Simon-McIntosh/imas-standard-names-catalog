name: ion_state_radiated_power_density
status: draft
description: Electromagnetic power radiated per unit volume by a single ionization
  state of a given ion species.
documentation: The ion-state radiated power density $P_{\mathrm{rad},i,z}$ (unit $\mathrm{W\,m^{-3}}$)
  isolates the volumetric emissivity from a specific charge state $z$ of an ion species
  $i$, including line radiation, dielectronic recombination radiation, and continuum
  contributions from that state. For high-$Z$ impurities such as tungsten, individual
  charge states (e.g., $\mathrm{W}^{27+}$ near coronal equilibrium at $T_e \sim 1.5\;\mathrm{keV}$)
  can dominate the total radiated power in narrow temperature windows. Calculated
  using collisional-radiative models (ADAS, FLYCHK) that resolve fractional abundances
  $f_z(T_e, n_e)$ and photon emissivity coefficients. Spectroscopic identification
  of specific charge-state transitions (e.g., extreme ultraviolet lines) enables experimental
  validation. Summing $P_{\mathrm{rad},i,z}$ over all charge states $z$ of species
  $i$ recovers the species-total `ion_radiated_power_density`. See also `neutral_state_radiated_power_density`
  for the neutral-state analog.
