- name: electrostatic_potential
  kind: scalar
  status: draft
  description: Electrostatic (space) potential of the plasma at a Langmuir probe measurement
    location, giving the local electric potential of the quasi-neutral plasma relative
    to the facility ground reference. It is distinct from the floating potential,
    which is the potential at which net probe current vanishes.
  documentation: "The electrostatic potential $V_p$ (also called the plasma potential\
    \ or space potential) is the electric potential of the surrounding quasi-neutral\
    \ plasma at the probe measurement location, measured in volts relative to the\
    \ facility ground reference.\n\nFor a Langmuir probe operating in an unmagnetized\
    \ or weakly magnetized plasma with Maxwellian electrons and negligible electron\
    \ emission, the plasma potential exceeds the floating potential $V_f$ by approximately:\n\
    $$V_p \\approx V_f + \\alpha \\frac{k_B T_e}{e}$$\nwhere $T_e$ is the electron\
    \ temperature, $e$ is the elementary charge, and $\\alpha$ is a sheath-geometry\
    \ factor that depends on the probe geometry and the ion-to-electron mass ratio.\
    \ For a planar probe in a collisionless sheath with singly-charged ions, $\\alpha\
    \ \\approx 0.5 \\ln(m_i / 2\\pi m_e)$, yielding values typically in the range\
    \ $2$\u2013$5$ (i.e., the plasma potential exceeds the floating potential by roughly\
    \ $2$\u2013$5\\,T_e/e$). This relation is approximate and holds only under the\
    \ assumptions of Maxwellian electrons, negligible secondary or thermionic electron\
    \ emission from the probe surface, and a collisionless pre-sheath. Deviations\
    \ occur in strongly magnetized or non-Maxwellian plasmas, or when the probe is\
    \ contaminated or emissive.\n\nTypical absolute values range from a few volts\
    \ in low-temperature laboratory plasmas to tens or hundreds of volts in fusion-relevant\
    \ edge plasmas, depending on machine biasing and the local plasma conditions.\n\
    \nThe plasma potential sets the upper bound of the electron-retarding region in\
    \ the Langmuir probe $I$\u2013$V$ characteristic: for probe bias $V < V_p$, electrons\
    \ are partially repelled; for $V > V_p$, the probe draws ion-saturation-limited\
    \ electron current. Accurate determination of $V_p$ is therefore essential for\
    \ extracting absolute electron density and temperature from probe sweeps.\n\n\
    Sign convention: Positive when the local plasma potential is higher than the facility\
    \ ground reference potential."
  unit: V
  physics_domain: plasma_measurement_diagnostics
  links:
  - name:floating_potential
  - name:electron_temperature
  - name:ion_temperature
  - name:magnetic_field_incidence_angle_at_plasma_facing_component
  constraints: []
  sources:
