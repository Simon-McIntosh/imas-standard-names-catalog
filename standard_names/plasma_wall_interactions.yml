- name: toroidal_component_of_magnetic_vector_potential
  kind: scalar
  status: draft
  description: Toroidal component A_phi of the magnetic vector potential, defined
    via B = curl A in the right-handed cylindrical (R, phi, Z) frame where R is major
    radius, phi increases counter-clockwise viewed from above, and Z is vertical height.
    In axisymmetric geometry the product R times A_phi equals the poloidal magnetic
    flux psi divided by 2 pi, by Stokes theorem applied to a toroidal loop.
  documentation: "The toroidal component $A_\\phi$ of the magnetic vector potential\
    \ $\\mathbf{A}$ is defined through $\\mathbf{B} = \\nabla \\times \\mathbf{A}$\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major\
    \ radius measured from the machine symmetry axis, $\\phi$ is the toroidal angle\
    \ increasing counter-clockwise when viewed from above $+\\hat{Z}$, and $Z$ is\
    \ the vertical height. In this frame the poloidal field components are related\
    \ to $A_\\phi$ by\n$$B_R = -\\frac{\\partial A_\\phi}{\\partial Z}, \\qquad B_Z\
    \ = \\frac{1}{R}\\frac{\\partial (R A_\\phi)}{\\partial R}.$$\n\nFor an axisymmetric\
    \ configuration the poloidal magnetic flux $\\psi$ through a circle of major radius\
    \ $R$ centered on the symmetry axis is given exactly by\n$$\\psi = 2\\pi R A_\\\
    phi,$$\na result that follows from Stokes' theorem applied to the toroidal loop\
    \ and holds independently of any gage choice (the gage freedom shifts $A_\\phi$\
    \ itself, and therefore $\\psi$ tracks that shift consistently). This identity\
    \ makes $A_\\phi$ a central quantity for flux-surface geometry, neoclassical transport,\
    \ and gyrokinetic formulations.\n\nThe SI unit of $A_\\phi$ is T$\\cdot$m (equivalently\
    \ V$\\cdot$s$\\cdot$m$^{-1}$, since 1 T$\\cdot$m = 1 V$\\cdot$s/m). Typical magnitudes\
    \ in the edge and scrape-off-layer regions of a medium-size tokamak (major radius\
    \ $\\sim$1\u20132 m, edge poloidal field $\\sim$0.05\u20130.3 T) range from roughly\
    \ $5\\times10^{-2}$ to $0.5$ T$\\cdot$m. In the presence of three-dimensional\
    \ perturbations (e.g., error fields or ELM control coils) the axisymmetric identity\
    \ is broken and $A_\\phi$ must be evaluated as a full three-dimensional field.\n\
    \nSign convention: Positive when $A_\\phi$ points in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above $+\\hat{Z}$)."
  unit: T.m
  physics_domain: plasma_wall_interactions
  links:
  - name:magnetic_vector_potential
  - name:toroidal_momentum_flux_due_to_perturbed_parallel_vector_potential
  constraints: []
