- name: volume_averaged_argon_density
  kind: scalar
  status: draft
  description: Plasma-volume average of the local argon ion number density over the
    confined plasma region. Unless a charge state is specified, argon density includes
    ions in all ionization stages summed over charge state.
  documentation: 'Volume-averaged argon density is the spatial average of the local
    argon ion number density over the confined plasma volume. It represents a global
    concentration measure, distinct from the total argon inventory, which would be
    this average multiplied by the plasma volume. Unless a charge state is specified,
    $n_\mathrm{Ar}$ includes all ionization stages of argon summed over charge state.


    The volume average is defined by


    $$

    \langle n_\mathrm{Ar} \rangle_V = \frac{1}{V_p}\int_{V_p} n_\mathrm{Ar}(\mathbf{x})\,dV

    $$


    where $V_p$ is the confined plasma volume in m$^3$, $dV$ is a volume element in
    m$^3$, $n_\mathrm{Ar}(\mathbf{x})$ is the local argon ion number density in m$^{-3}$,
    and $\langle n_\mathrm{Ar} \rangle_V$ is in m$^{-3}$.


    In practice this quantity is inferred from impurity spectroscopy, radiation modeling,
    charge-state balance calculations, or impurity transport modeling, then integrated
    over the reconstructed confined plasma volume. It is complementary to local measures
    such as argon density at the magnetic axis and at the plasma boundary, and to
    line-integrated or line-averaged measurements. Its relation to effective charge
    and radiated power depends on the argon charge-state distribution, electron temperature,
    electron density, and atomic rate coefficients, not on the volume-averaged density
    alone.


    Typical volume-averaged values are about $10^{14}$-$10^{16}$ m$^{-3}$ for trace
    diagnostic argon injections and $10^{16}$-$10^{18}$ m$^{-3}$ for deliberate argon
    seeding in tokamak plasmas. Values near or above $10^{18}$ m$^{-3}$ correspond
    to substantial impurity concentrations for plasmas with electron density of order
    $10^{20}$ m$^{-3}$.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:argon_density
  - name:line_averaged_argon_density
  - name:ratio_of_argon_density_to_electron_density
  sources:
  - id: dd:summary/volume_average/n_i/argon/value
    dd_path: summary/volume_average/n_i/argon/value
    status: composed
- name: volume_averaged_deuterium_tritium_density
  kind: scalar
  status: draft
  description: Volume-averaged number density of the combined deuterium-tritium fuel
    ion pseudo-species.
  documentation: 'The volume-averaged deuterium-tritium density is the spatial average
    of the number density of a combined fuel ion pseudo-species representing deuterium
    and tritium together. This pseudo-species is often used when the two hydrogenic
    isotopes are modeled as a single effective ion population rather than as separate
    deuterium and tritium densities.


    For a plasma volume $V$, the volume average is


    $$

    \langle n_{DT} \rangle_V = \frac{1}{V}\int_V n_{DT}(\mathbf{x})\,dV

    $$


    where $\langle n_{DT} \rangle_V$ is the volume-averaged deuterium-tritium density
    in $m^{-3}$, $n_{DT}(\mathbf{x})$ is the local deuterium-tritium pseudo-species
    number density in $m^{-3}$, $dV$ is a volume element in $m^3$, and $V$ is the
    averaging volume in $m^3$. The corresponding total deuterium-tritium fuel inventory
    is $\int_V n_{DT}\,dV$ and is a particle count, not a density.


    In practice this quantity is computed from an inferred or simulated spatial density
    distribution and an associated plasma volume. It is distinct from a line-averaged
    deuterium-tritium density, which averages along a viewing chord or path rather
    than over the plasma volume, and from the deuterium-tritium density at the magnetic
    axis, which samples the central value.


    Typical core-fueling and transport studies use volume-averaged deuterium-tritium
    densities of order $10^{19}-10^{20}\ m^{-3}$, with lower values in startup or
    low-density scenarios and higher values in high-performance burning-plasma regimes.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:deuterium_tritium_density
  - name:flux_surface_averaged_deuterium_tritium_density
  - name:line_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_tritium_density
    operator: volume_averaged
    operator_kind: qualifier
