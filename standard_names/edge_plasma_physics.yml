- name: toroidal_current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Toroidal component of the current density arising from the diamagnetic
    drift due to perpendicular pressure gradients.
  documentation: 'The toroidal diamagnetic current density $j_{\phi,\mathrm{dia}}$
    is the projection of the diamagnetic current density vector onto the toroidal
    direction $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It
    arises from the perpendicular pressure gradient in a magnetized plasma, given
    by $j_{\phi,\mathrm{dia}} = \frac{(\mathbf{B} \times \nabla p) \cdot \hat{\phi}}{B^2}$,
    where $\mathbf{B}$ is the magnetic field and $p$ is the total thermal pressure.
    This current contributes to the equilibrium force balance in tokamak edge plasmas
    and is a key component of the bootstrap current drive mechanism. Typical values
    reach tens of kA.m$^{-2}$ in the pedestal region of H-mode plasmas. This quantity
    is the toroidal component of the total diamagnetic current density vector $\mathbf{j}_{\mathrm{dia}}$
    described by [current_density_due_to_diamagnetic_drift](name:current_density_due_to_diamagnetic_drift).
    The poloidal counterpart is [poloidal_current_density_due_to_diamagnetic_drift](name:poloidal_current_density_due_to_diamagnetic_drift).
    Viscous-driven toroidal currents are described by [toroidal_current_density_due_to_perpendicular_viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity)
    and [toroidal_current_density_due_to_parallel_viscosity](name:toroidal_current_density_due_to_parallel_viscosity).


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_diamagnetic_drift
  - name:poloidal_current_density_due_to_diamagnetic_drift
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  arguments:
  - name: current_density_due_to_diamagnetic_drift
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/j_diamagnetic/toroidal
    dd_path: edge_profiles/ggd/j_diamagnetic/toroidal
    status: composed
- name: toroidal_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Toroidal component of the current density driven by heat-viscous forces
    arising from the traceless part of the stress tensor.
  documentation: 'The toroidal heat-viscosity current density $j_{\phi}^{\rm hv}$
    is the toroidal projection of the current density $\mathbf{j}^{\rm hv}$ produced
    by the heat-viscous stress tensor $\boldsymbol{\Pi}^{\rm hv}$, which originates
    from the collisionally coupled parallel heat flux in the magnetized plasma. This
    non-inductive current contributes to the total toroidal current density in the
    edge plasma and is typically computed from fluid transport codes that solve the
    momentum balance including neoclassical viscous forces. The toroidal component
    is obtained as $j_{\phi}^{\rm hv} = \mathbf{j}^{\rm hv} \cdot \hat{\phi}$, where
    $\hat{\phi}$ is the unit vector in the toroidal direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame. Related quantities include [toroidal_current_density_due_to_parallel_viscosity](name:toroidal_current_density_due_to_parallel_viscosity)
    and [toroidal_current_density_due_to_perpendicular_viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity),
    which describe the toroidal components driven by the parallel and perpendicular
    parts of the viscous stress tensor, respectively.


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_current_density_due_to_parallel_viscosity
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  arguments:
