- name: blanket_module_radiated_thermal_power
  kind: scalar
  status: draft
  description: Net radiated thermal power absorbed by a breeding blanket module, defined
    as incident minus reflected radiative power.
  documentation: "This quantity gives the total net radiated power $P_{\\text{rad}}\
    \ = P_{\\text{incident}} - P_{\\text{reflected}}$ (in watts) deposited onto a\
    \ single breeding blanket module by electromagnetic radiation from the plasma\
    \ and surrounding structures. It accounts for photon wavelengths from visible\
    \ light through soft X-rays and does not include the neutron heating channel.\
    \ For a reactor-class device such as ITER, the total radiated power across all\
    \ blanket modules is of order 100\u2013200 MW; individual module values depend\
    \ on poloidal position and first-wall geometry. This quantity is computed by neutronics/photonics\
    \ transport codes (e.g. MCNP, TRIPOLI) or inferred from surface heat-flux measurements.\
    \ Together with the neutron heating power (see [nuclear_heating_power_density_of_breeding_blanket_module](name:nuclear_heating_power_density_of_breeding_blanket_module))\
    \ and coolant temperatures (see [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)),\
    \ it forms the thermal balance of the blanket module."
  unit: W
  tags:
  - energy-balance
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: coolant_inlet_pressure
  kind: scalar
  status: draft
  description: Absolute pressure of the coolant fluid at the inlet manifold of a breeding
    blanket module cooling circuit.
  documentation: "The coolant inlet pressure $p_{\\rm in}$ (in Pa) is the thermodynamic\
    \ pressure at which the heat-transfer fluid enters the blanket module cooling\
    \ loop. For water-cooled designs (e.g., WCLL), inlet pressures are in the range\
    \ 15\u201316 MPa (PWR conditions); helium-cooled concepts (HCPB, HCLL) operate\
    \ at 8\u201310 MPa. Combined with [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)\
    \ and [coolant_outlet_temperature_of_breeding_blanket_module](name:coolant_outlet_temperature_of_breeding_blanket_module),\
    \ the inlet pressure determines coolant enthalpy and the thermal power extraction\
    \ rate $\\dot{Q} = \\dot{m}\\,(h_{\\rm out} - h_{\\rm in})$. Asymmetric uncertainties\
    \ are recorded in [lower_uncertainty_of_coolant_inlet_pressure](name:lower_uncertainty_of_coolant_inlet_pressure)\
    \ and [upper_uncertainty_of_coolant_inlet_pressure](name:upper_uncertainty_of_coolant_inlet_pressure)."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - energy-balance
  links: []
  validity_domain: ''
  constraints: []
- name: coolant_inlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the inlet manifold of a breeding
    blanket module cooling circuit.
  documentation: "The coolant inlet temperature $T_{\\mathrm{in}}$ characterizes the\
    \ thermal state of the working fluid (e.g., helium or water) as it enters a breeding\
    \ blanket module. Together with the outlet temperature [coolant_outlet_temperature_of_breeding_blanket_module](name:coolant_outlet_temperature_of_breeding_blanket_module)\
    \ and the mass flow rate, $T_{\\mathrm{in}}$ determines the thermal power extracted\
    \ via $P = \\dot{m} c_p (T_{\\mathrm{out}} - T_{\\mathrm{in}})$, where $\\dot{m}$\
    \ is the coolant mass flow rate in kg/s and $c_p$ is the specific heat capacity\
    \ in J/(kg\xB7K). For helium-cooled solid-breeder blankets, inlet temperatures\
    \ are in the range 300\u2013400 \xB0C (573\u2013673 K); for water-cooled designs,\
    \ values are lower (~290\u2013330 \xB0C). The quantity is essential for verifying\
    \ thermal-hydraulic design margins and ensuring structural integrity of blanket\
    \ components under nuclear heating. See also [coolant_inlet_pressure](name:coolant_inlet_pressure)\
    \ for the corresponding thermodynamic state variable."
  unit: K
  tags:
  - energy-balance
  - steady-state
  links: []
  validity_domain: ''
  constraints: []
- name: coolant_outlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Temperature of the coolant at the outlet manifold of a breeding blanket
    module.
  documentation: "The coolant outlet temperature $T_{\\text{out}}$ (in kelvin) is\
    \ measured at the exit of the cooling circuit of an individual breeding blanket\
    \ module. The temperature rise $\\Delta T = T_{\\text{out}} - T_{\\text{in}}$\
    \ across the module, combined with the coolant mass flow rate $\\dot{m}$ and specific\
    \ heat capacity $c_p$, determines the extracted thermal power via $P_{\\text{extracted}}\
    \ = \\dot{m}\\, c_p\\, \\Delta T$. For helium-cooled blanket designs, outlet temperatures\
    \ of 500\u2013550 \xB0C (773\u2013823 K) are targeted; water-cooled concepts operate\
    \ near 300\u2013330 \xB0C (573\u2013603 K). The measurement is performed with\
    \ thermocouples or resistance temperature detectors at the outlet header. See\
    \ [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)\
    \ for the inlet value and [coolant_inlet_pressure](name:coolant_inlet_pressure)\
    \ for the associated pressure."
  unit: K
  tags:
  - energy-balance
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: lead_lithium_coolant_volume
  kind: scalar
  status: draft
  description: Total volume of lead-lithium (PbLi) eutectic contained within the breeding
    blanket structure.
  documentation: "The lead-lithium coolant volume $V_{\\rm PbLi}$ (in m$^3$) quantifies\
    \ the inventory of liquid PbLi eutectic alloy circulating through or held within\
    \ the breeding blanket. PbLi serves simultaneously as tritium breeder, neutron\
    \ multiplier, and heat-transfer medium in liquid-metal blanket concepts (e.g.,\
    \ WCLL and DCLL). The volume is a key input for tritium inventory calculations:\
    \ the tritium content scales as $T_{\\rm inv} \\propto c_T \\, V_{\\rm PbLi}$,\
    \ where $c_T$ is the tritium solubility concentration. For an ITER test blanket\
    \ module $V_{\\rm PbLi}$ is of order 0.1\u20131 m$^3$; full reactor blankets may\
    \ contain 200\u2013400 m$^3$. See also [lithium6_isotopic_fraction](name:lithium6_isotopic_fraction),\
    \ [tritium_breeding_ratio](name:tritium_breeding_ratio), and [material_volume_fraction_of_blanket_layer](name:material_volume_fraction_of_blanket_layer)."
  unit: m^3
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_coolant_inlet_pressure
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the coolant inlet pressure
    of a breeding blanket module.
  documentation: "This quantity represents the downward (negative-side) error bar\
    \ on the [coolant_inlet_pressure](name:coolant_inlet_pressure), expressed in Pa.\
    \ It captures asymmetric measurement or modeling uncertainty: the true coolant\
    \ inlet pressure $p_\\mathrm{in}$ is expected to lie in the interval $[p_\\mathrm{in}\
    \ - \\delta p_\\mathrm{lower},\\; p_\\mathrm{in} + \\delta p_\\mathrm{upper}]$\
    \ at the stated confidence level. Coolant inlet pressures for helium-cooled breeding\
    \ blanket concepts are on the order of 8 MPa, and for water-cooled designs around\
    \ 15.5 MPa; corresponding measurement uncertainties from pressure transducers\
    \ are on the order of 0.1\u20131% of full scale. The upper counterpart is the\
    \ upper uncertainty of the same quantity. See also [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)\
    \ for the thermal inlet condition."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - derived
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the coolant inlet temperature
    of a breeding blanket module.
  documentation: This quantity represents the negative (lower) error bar on the coolant
    inlet temperature $T_{\text{in}}$ of a breeding blanket module, expressed in kelvin.
    Together with the upper uncertainty, it defines the asymmetric confidence interval
    $[T_{\text{in}} - \delta T_{\text{lower}},\; T_{\text{in}} + \delta T_{\text{upper}}]$.
    Asymmetric uncertainties can result from sensor calibration offsets, thermal stratification
    in coolant channels, or non-linear response of resistance temperature detectors.
    See [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)
    for the central value and [upper_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module](name:upper_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module)
    for the upper bound.
  unit: K
  tags:
  - energy-balance
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_coolant_outlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the coolant outlet temperature
    of a breeding blanket module.
  documentation: This quantity represents the negative (lower) error bar on the coolant
    outlet temperature $T_{\text{out}}$ of a breeding blanket module, expressed in
    kelvin. The asymmetric confidence interval is $[T_{\text{out}} - \delta T_{\text{lower}},\;
    T_{\text{out}} + \delta T_{\text{upper}}]$. Sources of uncertainty include thermocouple
    drift, thermal mixing non-uniformity at the outlet header, and calibration offsets.
    The value must be non-negative. See [coolant_outlet_temperature_of_breeding_blanket_module](name:coolant_outlet_temperature_of_breeding_blanket_module)
    for the central value and [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)
    for the inlet counterpart.
  unit: K
  tags:
  - energy-balance
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: maximum_neutron_escape_flux_of_blanket_module
  kind: scalar
  status: draft
  description: Peak neutron power flux escaping through the rear surface of a breeding
    blanket module.
  documentation: 'The maximum neutron escape flux $\Gamma_{n,\text{max}}$ (in W m$^{-2}$)
    quantifies the highest neutron power per unit area that penetrates through the
    back of a blanket module and reaches the vacuum vessel or shielding structures
    behind it. This value determines the shielding adequacy of the blanket: excessive
    escape flux leads to nuclear heating of superconducting coils and accelerated
    radiation damage to structural materials. It is computed by 3-D neutronics transport
    codes (e.g. MCNP, Serpent) using the as-designed module geometry and a 14.1 MeV
    D-T neutron source. For ITER-class blanket modules, first-wall neutron fluxes
    are of order $10^{14}$ n cm$^{-2}$ s$^{-1}$ ($\sim$1 MW m$^{-2}$), while the escape
    flux at the rear is several orders of magnitude lower depending on module thickness
    and material composition. See [nuclear_heating_power_density_of_breeding_blanket_module](name:nuclear_heating_power_density_of_breeding_blanket_module)
    for the volumetric heating and [tritium_breeding_ratio](name:tritium_breeding_ratio)
    for the neutron-economy figure of merit.'
  unit: W.m^-2
  tags:
  - energy-balance
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_coolant_inlet_pressure
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the coolant inlet pressure
    of a breeding blanket module.
  documentation: This quantity gives the positive (upward) error bar on [coolant_inlet_pressure](name:coolant_inlet_pressure),
    such that the true inlet pressure satisfies $p_{\rm in} \le p_{\rm in,nominal}
    + \delta p_{\rm upper}$ at the stated confidence level. It is paired with [lower_uncertainty_of_coolant_inlet_pressure](name:lower_uncertainty_of_coolant_inlet_pressure)
    to form the full asymmetric uncertainty interval. Asymmetric bounds arise from
    non-Gaussian transient excursions in coolant manifold conditions and from systematic
    instrumentation offsets. The unit is Pa, consistent with the parent pressure quantity.
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the coolant inlet temperature
    of a breeding blanket module.
  documentation: This quantity represents the positive (upper) error bar on the coolant
    inlet temperature $T_{\text{in}}$ of a breeding blanket module, expressed in kelvin.
    Asymmetric uncertainties arise from non-Gaussian error distributions in thermocouple
    or resistance-temperature-detector measurements at the coolant manifold inlet.
    The true inlet temperature is bounded by $[T_{\text{in}} - \delta T_{\text{lower}},\;
    T_{\text{in}} + \delta T_{\text{upper}}]$ where $\delta T_{\text{upper}}$ is this
    quantity. See [coolant_inlet_temperature_of_breeding_blanket_module](name:coolant_inlet_temperature_of_breeding_blanket_module)
    for the central value and [lower_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module](name:lower_uncertainty_of_coolant_inlet_temperature_of_breeding_blanket_module)
    for the lower bound.
  unit: K
  tags:
  - energy-balance
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_coolant_outlet_temperature_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the coolant outlet temperature
    of a breeding blanket module.
  documentation: This field provides the positive deviation from the nominal [coolant_outlet_temperature_of_breeding_blanket_module](name:coolant_outlet_temperature_of_breeding_blanket_module)
    value, forming the upper half of an asymmetric confidence interval. The uncertainty
    arises from measurement noise in thermocouples or resistance temperature detectors
    (RTDs) installed at the outlet manifold, as well as from systematic modeling errors
    in thermal-hydraulic simulations. Combined with [lower_uncertainty_of_coolant_outlet_temperature_of_breeding_blanket_module](name:lower_uncertainty_of_coolant_outlet_temperature_of_breeding_blanket_module),
    the full asymmetric error bar is recovered. The stored value is a non-negative
    offset in kelvin.
  unit: K
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: wall_unit_electrical_resistance
  kind: scalar
  status: draft
  description: Electrical resistance of a discrete structural element (block) within
    a wall or cryostat unit.
  documentation: The electrical resistance $R_{\rm el}$ (in ohm) characterizes the
    opposition to induced current flow through a finite structural block element of
    the wall or cryostat. It is computed from the element resistivity $\rho$ and geometry
    via $R_{\rm el} = \rho \, L / A$, where $L$ is the current path length and $A$
    the cross-sectional area. Accurate element resistances are essential for eddy-current
    and halo-current modeling during disruptions, where induced toroidal currents
    in passive structures determine electromagnetic loads. For stainless-steel wall
    elements at cryogenic temperatures, resistances per block range from $\mu\Omega$
    to $m\Omega$ depending on element size. See also [electrical_resistance_of_cryostat_thermal_shield_element](name:electrical_resistance_of_cryostat_thermal_shield_element)
    for the thermal-shield analog.
  unit: ohm
  tags:
  - data-archival
  links: []
  validity_domain: ''
  constraints: []
