- name: poloidal_neutral_momentum_diffusivity
  kind: scalar
  status: active
  description: "Poloidal neutral momentum diffusivity is the diagonal poloidal component\
    \ of an effective neutral-particle momentum diffusivity tensor, governing down-gradient\
    \ redistribution of aggregate neutral momentum along increasing poloidal angle\
    \ \u03B8 on flux surfaces in flux coordinates (\u03C1, \u03B8, \u03C6). The poloidal\
    \ qualifier identifies the flux and gradient direction, not the momentum component."
  documentation: 'Poloidal neutral momentum diffusivity is the diagonal poloidal component
    of an effective neutral-particle momentum diffusivity tensor. It parameterizes
    down-gradient diffusive transport of aggregate neutral momentum density along
    the poloidal coordinate direction, tangent to increasing $\theta$ at fixed flux
    label and toroidal angle in flux coordinates $(\rho, \theta, \phi)$.


    The component $D_{\theta,n}^{\mathrm{mom}}$ enters a local diffusive closure for
    the poloidal flux of neutral momentum density:


    $$

    \boldsymbol{\Pi}_{\theta,n}^{\mathrm{diff}} = -D_{\theta,n}^{\mathrm{mom}}\,\frac{\partial
    \mathbf{g}_n}{\partial l_\theta}

    $$


    where $\boldsymbol{\Pi}_{\theta,n}^{\mathrm{diff}}$ is the vector flux of neutral
    momentum density in the poloidal transport direction, $\mathbf{g}_n$ is the aggregate
    neutral momentum density, and $l_\theta$ is arclength along increasing $\theta$
    at fixed $(\rho,\phi)$. The minus sign denotes down-gradient diffusion.


    This quantity is the poloidal member of [neutral_momentum_diffusivity](name:neutral_momentum_diffusivity),
    distinct from [parallel_neutral_momentum_diffusivity](name:parallel_neutral_momentum_diffusivity),
    [toroidal_neutral_momentum_diffusivity](name:toroidal_neutral_momentum_diffusivity),
    and [vertical_neutral_momentum_diffusivity](name:vertical_neutral_momentum_diffusivity).
    It applies to the aggregate neutral population represented by $\mathbf{g}_n$;
    a state-resolved or species-resolved diffusivity would require an explicit state
    or species qualifier. The coefficient may represent neutral-neutral viscous transport,
    charge-exchange momentum coupling with ions, and unresolved kinetic effects only
    insofar as they are represented by an effective diffusive closure.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
