- name: x_component_of_second_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the second local unit vector defining
    the orientation of a diagnostic aperture, detector, or optical element in the
    machine Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.
  documentation: "The quantity $\\hat{x}_2 \\cdot \\hat{x}$ gives the projection of\
    \ the second unit vector $\\hat{x}_2$ onto the machine Cartesian $\\hat{x}$-axis,\
    \ where $\\hat{x}_2$ is one member of the right-handed orthonormal triad $\\{\\\
    hat{x}_1, \\hat{x}_2, \\hat{x}_3\\}$ used to specify the local orientation of\
    \ a diagnostic element \u2014 such as a bolometer channel, X-ray detector, polarimeter\
    \ aperture, or reflectometer horn \u2014 in the machine Cartesian $(\\hat{x},\
    \ \\hat{y}, \\hat{z})$ frame. Because $\\hat{x}_2$ is a unit vector, its Cartesian\
    \ components satisfy $|x_{2,x}|\\leq 1$ and $x_{2,x}^2 + x_{2,y}^2 + x_{2,z}^2\
    \ = 1$. The value is determined from the as-built geometry of the diagnostic and\
    \ is typically provided as a fixed engineering parameter derived from installation\
    \ surveys or CAD models. The companion projections [y_component_of_second_unit_vector](name:y_component_of_second_unit_vector)\
    \ and the full triad members [x_component_of_first_unit_vector](name:x_component_of_first_unit_vector)\
    \ and [x_component_of_third_unit_vector](name:x_component_of_third_unit_vector)\
    \ complete the orientation description.\n\nSign convention: Positive when the\
    \ second unit vector $\\hat{x}_2$ has a component in the $+\\hat{x}$ direction\
    \ of the machine Cartesian frame."
