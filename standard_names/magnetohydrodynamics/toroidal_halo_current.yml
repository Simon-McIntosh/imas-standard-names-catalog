name: toroidal_halo_current
status: draft
description: Total electric current flowing in the toroidal direction through the
  halo plasma formed between the shrinking core and the wall during a disruption.
documentation: "During a tokamak disruption, the rapid loss of plasma thermal and\
  \ magnetic energy drives current into the cold, low-density halo region surrounding\
  \ the contracting plasma core. The toroidal halo current $I_{\\mathrm{halo},\\phi}$\
  \ (A) is the net current flowing in the toroidal direction within this halo, closing\
  \ through the vacuum vessel and plasma-facing components in conjunction with the\
  \ poloidal halo current. The product of the toroidal peaking factor (TPF) and the\
  \ normalized halo current fraction, $\\mathrm{TPF} \\times I_{\\mathrm{halo},\\\
  phi} / I_p$, where $I_p$ is the pre-disruption plasma current, is the key engineering\
  \ figure of merit for electromagnetic force assessment on in-vessel structures;\
  \ ITER design limits typically require $\\mathrm{TPF} \\times I_{\\mathrm{halo}}\
  \ / I_p < 0.75$. Peak toroidal halo currents reach 20\u201340% of $I_p$ in large\
  \ tokamaks, with time scales of 1\u201310 ms during the current quench. Measurement\
  \ relies on Rogowski coils around vessel sectors, shunt resistors embedded in divertor\
  \ tiles, and arrays of Hall-effect sensors. Understanding halo current magnitude\
  \ and asymmetry is essential for designing disruption-resilient first-wall and vacuum-vessel\
  \ structures. See `poloidal_halo_current` for the complementary poloidal component\
  \ and `plasma_current` for the equilibrium toroidal current reference."
