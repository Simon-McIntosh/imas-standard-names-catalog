      kind: template
- name: current_due_to_ion_cyclotron_current_drive
  kind: scalar
  status: active
  description: Net toroidal plasma current generated non-inductively by ion-cyclotron
    wave absorption and integrated over the plasma cross-section.
  documentation: "This quantity is the net plasma current driven by ion-cyclotron\
    \ wave\u2013particle interactions, excluding inductive and non-wave current contributions.\
    \ It represents the toroidal component of the current generated by the absorbed\
    \ ion-cyclotron power.\n\nThe current is obtained by integrating the driven toroidal\
    \ current density over the plasma cross-section:\n\n$$\nI_{\\mathrm{ICCD}} = \\\
    int_A j_{\\phi,\\mathrm{ICCD}}\\,dA\n$$\n\nwhere $I_{\\mathrm{ICCD}}$ is the driven\
    \ current, $j_{\\phi,\\mathrm{ICCD}}$ is the ion-cyclotron-driven toroidal current\
    \ density in the right-handed cylindrical $(R, \\phi, Z)$ frame, and $A$ is the\
    \ plasma cross-sectional area. The quantity is a net current, so oppositely directed\
    \ local contributions are algebraically summed. It is a source-specific component\
    \ of [current_due_to_wave_driven_current_drive](name:current_due_to_wave_driven_current_drive)\
    \ and is distinct from [current_due_to_electron_cyclotron_current_drive](name:current_due_to_electron_cyclotron_current_drive).\n\
    \nSign convention: Positive when the driven current flows in the direction of\
    \ increasing toroidal angle $\\phi$."
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_wave_driven_current_drive
  - name:current_due_to_electron_cyclotron_current_drive
  sources:
