- name: reference_major_radius
  kind: scalar
  status: active
  description: "Nonnegative perpendicular distance from the toroidal symmetry axis\
    \ to a designated reference location, serving as the major-radius coordinate where\
    \ the vacuum toroidal magnetic field is specified in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'Major radius is the nonnegative perpendicular distance from the
    toroidal symmetry axis to a geometric point or specified location. For this reference
    quantity, the designated location is the radius at which the vacuum toroidal magnetic
    field is specified, making it the reference specialization of [major_radius].


    At the designated reference location, the major radius is defined geometrically
    by:


    $$

    R_0 = \sqrt{X_0^2 + Y_0^2}

    $$


    where $R_0$ is the reference major radius, and $X_0$ and $Y_0$ are the Cartesian
    coordinates of the reference location perpendicular to the toroidal symmetry axis.
    The Cartesian basis is right-handed $(\hat{x},\hat{y},\hat{z})$ with $\hat{z}=\hat{Z}$;
    the corresponding cylindrical frame is right-handed $(R,\phi,Z)$ with $\hat{R}\times\hat{\phi}=\hat{Z}$.


    This quantity is a single designated geometric reference value associated with
    the vacuum toroidal magnetic field, represented by [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field).
    It is not a pointwise plasma-radius field, a flux-surface average, or a region
    integral, and it has no species or plasma-population scope.


    Unlike [flux-surface-averaged major radius](name:flux_surface_averaged_major_radius),
    which averages the radius over a nested magnetic flux surface, this quantity identifies
    one reference radius. It is also distinct from a [radial coordinate](name:radial_coordinate)
    assigned to an arbitrary geometric point or measurement location.


    The reference radius and the vacuum toroidal magnetic field form the reference
    pair $R_0$ and $B_0$, where $B_0$ is the vacuum toroidal magnetic field specified
    at the reference radius. Their product $R_0B_0$ supplies the geometric-field scale
    used in normalized toroidal-flux and current-density definitions.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:toroidal_vacuum_magnetic_field
  - name:flux_surface_averaged_major_radius
  sources:
  - dd_path: core_profiles/vacuum_toroidal_field/r0
