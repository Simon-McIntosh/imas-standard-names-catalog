name: ion_radiated_power_density
status: draft
description: Electromagnetic power radiated per unit volume by ion species, summing
  contributions from all ionization states.
documentation: "The ion radiated power density $P_{\\mathrm{rad},i}$ (unit $\\mathrm{W\\\
  ,m^{-3}}$) quantifies the local volumetric emissivity from ionic processes including\
  \ charge-exchange recombination radiation, ion-impact excitation, and radiative\
  \ de-excitation of multiply-charged impurity ions. This quantity is reported as\
  \ the sum over all ion species present in the plasma unless a species-resolved breakdown\
  \ is used (see `ion_state_radiated_power_density`). In high-$Z$ impurity-seeded\
  \ scenarios (e.g., tungsten, krypton, argon), ion radiative losses dominate the\
  \ total emissivity and can reach $10^6$\u2013$10^8\\;\\mathrm{W\\,m^{-3}}$ in the\
  \ radiative mantle. Calculated using collisional-radiative models (ADAS, FLYCHK)\
  \ with inputs of local $n_e$, $T_e$, and impurity density profiles. Bolometric measurements\
  \ provide the total radiated power density; disentangling ion from electron contributions\
  \ requires spectroscopic analysis or forward-modeled synthetic diagnostics. See\
  \ also `electron_radiated_power_density` and `neutral_radiated_power_density` for\
  \ companion emissivity channels."
