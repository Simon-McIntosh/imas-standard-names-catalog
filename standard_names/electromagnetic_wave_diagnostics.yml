- name: normalized_toroidal_flux_coordinate_at_beam_tracing_point
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label obtained from normalized enclosed
    toroidal flux, evaluated at each beam-tracing point to map the propagation path
    onto nested plasma surfaces.
  documentation: 'This quantity assigns the magnetic surface intersected by each beam-tracing
    point a dimensionless, radial-like toroidal-flux label. It describes the location
    of the propagation point in nested equilibrium flux surfaces, not a physical distance
    or a local vector component.


    The normalized toroidal flux coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}} = \sqrt{\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}}
    - \Phi_{\mathrm{tor,axis}}}}

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the enclosed toroidal magnetic flux of the magnetic surface through the beam-tracing
    point, $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$
    is its value at the equilibrium boundary.


    The quantity is evaluated pointwise at each beam-tracing position for which the
    nested equilibrium flux surfaces define the coordinate. It applies to the magnetic
    surface associated with each propagation point and is not aggregated over the
    beam path, nor does it represent a particle-population property.


    This is the beam-tracing-point evaluation of the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate).
    It differs from [normalized toroidal flux coordinate at a measurement position](name:normalized_toroidal_flux_coordinate_at_measurement_position),
    which assigns the same magnetic-surface coordinate to a specified physical measurement
    location rather than to a beam-tracing point.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
