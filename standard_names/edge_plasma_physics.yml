- name: vorticity_due_to_diamagnetic_drift
  kind: scalar
  status: active
  description: Signed field-parallel component of the curl of diamagnetic drift velocity
    for a plasma species or effective fluid, measuring rotational structure from pressure-gradient-driven
    cross-field motion.
  documentation: 'Field-parallel diamagnetic vorticity is the signed projection of
    the curl of a species or effective-fluid diamagnetic drift velocity onto the local
    magnetic-field direction. It describes rotational structure generated by pressure-gradient-driven
    cross-field drift, not a parallel flow velocity.


    $$

    \omega_{\parallel,\mathrm{dia}} = \hat{\mathbf b} \cdot \left(\nabla \times \mathbf
    v_{\mathrm{dia}}\right), \qquad \hat{\mathbf b} = \frac{\mathbf B}{|\mathbf B|}

    $$


    Here, $\omega_{\parallel,\mathrm{dia}}$ is the field-parallel diamagnetic vorticity,
    $\mathbf v_{\mathrm{dia}}$ is the diamagnetic drift velocity, $\nabla \times$
    denotes the curl, $\mathbf B$ is the local magnetic field, $|\mathbf B|$ is its
    magnitude, and $\hat{\mathbf b}$ is the unit vector along the magnetic field.


    The effective-fluid interpretation is related to [plasma velocity due to diamagnetic
    drift](name:plasma_velocity_due_to_diamagnetic_drift), while a species-resolved
    interpretation uses [ion charge state diamagnetic velocity due to diamagnetic
    drift](name:ion_charge_state_diamagnetic_velocity_due_to_diamagnetic_drift). Only
    the diamagnetic-drift contribution is included; electric-field-driven and other
    flow contributions are excluded.


    Sign convention: Positive when the curl of the diamagnetic drift velocity points
    along the local magnetic-field direction.'
  unit: s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_velocity_due_to_diamagnetic_drift
  - name:ion_charge_state_diamagnetic_velocity_due_to_diamagnetic_drift
