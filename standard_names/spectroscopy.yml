- name: bragg_reflection_wavelength_of_crystal_spectrometer
  kind: scalar
  status: draft
  description: Wavelength satisfying the Bragg reflection condition for the dispersing
    crystal of an X-ray crystal spectrometer at nominal incidence.
  documentation: "The Bragg reflection wavelength $\\lambda_B$ is the photon wavelength\
    \ selected by constructive interference from the crystal lattice planes, governed\
    \ by the Bragg equation $2 d \\sin\\theta = m\\lambda_B$, where $d$ is the crystal\
    \ lattice plane spacing, $\\theta$ is the angle of incidence, and $m$ is the diffraction\
    \ order. For X-ray crystal spectrometers used in fusion spectroscopy \u2014 such\
    \ as those measuring He-like and H-like impurity emission lines \u2014 typical\
    \ values fall in the range 0.1\u20131.0 nm, corresponding to photon energies of\
    \ 1\u201312 keV. This quantity characterizes the nominal spectral center of the\
    \ instrument and is a fundamental calibration parameter: it determines the spectral\
    \ range accessible, sets the Rowland circle geometry, and connects to the per-pixel\
    \ wavelength mapping encoded in [photon_wavelength_of_crystal_spectrometer_pixel](name:photon_wavelength_of_crystal_spectrometer_pixel).\
    \ The crystal geometry properties [first_coordinate_radius_of_curvature_of_crystal](name:first_coordinate_radius_of_curvature_of_crystal),\
    \ [width_of_crystal](name:width_of_crystal), and [height_of_crystal](name:height_of_crystal)\
    \ all depend on this nominal wavelength when the spectrometer is designed and\
    \ aligned for a specific emission line."
  unit: m
  physics_domain: spectroscopy
  links:
  - name:photon_wavelength_of_crystal_spectrometer_pixel
  - name:first_coordinate_radius_of_curvature_of_crystal
  - name:width_of_crystal
  - name:height_of_crystal
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/crystal/wavelength_bragg
    dd_path: spectrometer_x_ray_crystal/crystal/wavelength_bragg
    status: composed
- name: first_coordinate_radius_of_curvature_of_crystal
  kind: scalar
  status: draft
  description: Radius of curvature of the dispersing crystal surface along the first
    local coordinate (horizontal) direction, applicable to curved crystal geometries
    in X-ray crystal spectrometers.
  documentation: 'In an X-ray crystal spectrometer, a curved crystal can focus X-rays
    in one or both spatial directions. The first-coordinate (horizontal) radius of
    curvature $R_1$ characterizes the bending of the crystal surface along the dispersing
    (horizontal) plane, governing horizontal beam convergence via the Johann or Johansson
    focusing geometry, where the optimal focal condition requires $R_1 = 2R_{\mathrm{Rowland}}$
    with $R_{\mathrm{Rowland}}$ being the Rowland circle radius. Typical values for
    laboratory and tokamak X-ray spectrometers range from 0.1 m to several meters
    depending on the crystal material (e.g., quartz, mica, germanium) and the desired
    spectral resolution. This quantity applies only to doubly curved or singly curved
    (cylindrical) crystal shapes; flat crystals have infinite radius of curvature
    and are not described by this field. The paired quantity [second_coordinate_radius_of_curvature_of_crystal](name:second_coordinate_radius_of_curvature_of_crystal)
    characterizes bending in the perpendicular (vertical) direction, and the analogous
    reflector geometry is described by [first_coordinate_radius_of_curvature_of_reflector](name:first_coordinate_radius_of_curvature_of_reflector).
    The [bragg_reflection_wavelength_of_crystal_spectrometer](name:bragg_reflection_wavelength_of_crystal_spectrometer)
    determines the wavelength selected at the nominal Bragg angle.


    Sign convention: Positive when the crystal surface is concave toward the incoming
    X-ray beam, corresponding to a focusing geometry.'
  unit: m
  physics_domain: spectroscopy
  links:
  - name:second_coordinate_radius_of_curvature_of_crystal
  - name:first_coordinate_radius_of_curvature_of_reflector
  - name:bragg_reflection_wavelength_of_crystal_spectrometer
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/x1_curvature
    dd_path: spectrometer_x_ray_crystal/channel/crystal/x1_curvature
    status: composed
  - id: dd:spectrometer_x_ray_crystal/crystal/curvature_horizontal
    dd_path: spectrometer_x_ray_crystal/crystal/curvature_horizontal
    status: composed
- name: photon_count_rate_of_crystal_spectrometer_pixel
  kind: scalar
  status: draft
  description: Number of photons detected per unit time at a single, spatially resolved
    pixel element of an X-ray crystal spectrometer detector. This is a pixel-specific
    count rate, distinct from a frame-integrated or detector-summed rate, and reflects
    the local photon flux incident on that individual detector element after dispersion
    by the crystal.
  documentation: "The photon count rate $R_{ij}$ at pixel $(i, j)$ is the number of\
    \ photon detection events registered per unit time on that single detector element.\
    \ It is related to the photon flux by\n\n$$R_{ij} = \\eta_{ij}\\, \\Phi_{ij}$$\n\
    \nwhere $\\eta_{ij}$ (dimensionless, $0 \\le \\eta_{ij} \\le 1$) is the quantum\
    \ efficiency of pixel $(i,j)$, and $\\Phi_{ij}$ (photons s$^{-1}$) is the photon\
    \ flux already integrated over the physical area of the pixel and over the solid\
    \ angle and wavelength bandpass $\\Delta\\lambda_{ij}$ accepted by that pixel\
    \ after Bragg diffraction from the crystal. The quantity $\\Phi_{ij}$ is therefore\
    \ a pixel-accepted flux \u2014 no additional area or solid-angle factor should\
    \ be applied \u2014 and $R_{ij}$ is its detector-efficiency-weighted version.\n\
    \nThe pixel indices $(i, j)$ map to detector-plane spatial coordinates; in a Johann-\
    \ or von H\xE1mos-geometry crystal spectrometer the dispersion direction (wavelength)\
    \ and the spatial/imaging direction are separated across the two pixel index axes.\n\
    \nThe count rate may represent either an instantaneous rate derived from a short\
    \ time window, a time-averaged rate over a diagnostic sampling interval, or a\
    \ count divided by an integration window; the interpretation is set by the associated\
    \ time coordinate. Users must verify which averaging convention applies for their\
    \ dataset.\n\nAt high photon fluxes, detector dead-time and photon pile-up impose\
    \ practical upper limits on the linearity of $R_{ij}$. For CCD-type detectors\
    \ operating in single-photon-counting mode, pile-up becomes significant when the\
    \ mean number of photons per pixel per readout frame approaches or exceeds unity;\
    \ for strip or pixel detectors with per-pixel shaping electronics, dead-time corrections\
    \ are required when $R_{ij} \\tau_d \\gtrsim 0.01$, where $\\tau_d$ is the per-channel\
    \ dead time. Typical linear operating ranges are $10^2$\u2013$10^6$ counts s$^{-1}$\
    \ per pixel for strip detectors on large-scale fusion devices, and $1$\u2013$10^3$\
    \ counts s$^{-1}$ per pixel for photon-counting CCDs.\n\nThis quantity is the\
    \ fundamental observable from which wavelength-resolved spectra, line intensities,\
    \ and line ratios are derived after flat-field correction, background subtraction,\
    \ and spectral calibration."
  unit: count.s^-1
  physics_domain: spectroscopy
  links:
  - name:pixel_width_of_detector
  - name:bragg_reflection_wavelength_of_crystal_spectrometer
  - name:photon_count_rate
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/frame/photon_count
    dd_path: spectrometer_x_ray_crystal/channel/frame/photon_count
    status: composed
- name: second_coordinate_radius_of_curvature_of_crystal
  kind: scalar
  status: draft
  description: Radius of curvature of the dispersing crystal surface along the second
    (X2 or vertical) local coordinate direction, defined as the radius of the osculating
    circle in a cross-section of the crystal surface taken perpendicular to the first
    (sagittal) coordinate axis. Relevant only for curved crystal geometries such as
    toroidal, spherical, or cylindrically bent crystals.
  documentation: 'For a curved X-ray dispersing crystal, the surface geometry in the
    neighborhood of any point is characterized by two principal radii of curvature
    in orthogonal local coordinate directions. The second-coordinate radius of curvature
    $R_2$ is the radius of the osculating circle of the crystal surface profile in
    the cross-section perpendicular to the first (sagittal or X1) local coordinate
    axis. This quantity describes the bending of the crystal surface along the second
    (X2, often vertical) direction.


    For a **spherically bent crystal** the two principal radii are equal, $R_1 = R_2$.
    For a **toroidally bent crystal** $R_1 \neq R_2$, and both radii must be specified
    independently. A purely **cylindrically bent** crystal has a finite radius in
    one direction and an infinite (flat) radius in the other.


    In the context of toroidal focusing spectrometers, $R_2$ enters the sagittal (vertical-plane)
    focusing condition; for a point source at distance $p$ and detector at distance
    $q$, the condition $1/R_2 = (1/p + 1/q)\sin\theta_B$ must be satisfied, where
    $\theta_B$ is the Bragg angle. This relation holds specifically for the toroidal
    geometry and should not be generalized to other geometries without appropriate
    modification.


    Typical values of $R_2$ range from approximately 0.1 m to several meters, depending
    on the crystal material, crystallographic cut, and spectrometer optical design.
    The radius is determined from crystal characterization (e.g., optical profilometry
    or X-ray rocking-curve mapping) or from the spectrometer design.


    The companion quantity [first_coordinate_radius_of_curvature_of_crystal](name:first_coordinate_radius_of_curvature_of_crystal)
    describes the curvature along the first (X1, horizontal or sagittal) local coordinate
    direction.


    Sign convention: Positive when the crystal surface is concave toward the incoming
    X-ray beam (center of curvature on the same side as the X-ray source).'
  unit: m
  physics_domain: spectroscopy
  links:
  - name:first_coordinate_radius_of_curvature_of_crystal
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/x2_curvature
    dd_path: spectrometer_x_ray_crystal/channel/crystal/x2_curvature
    status: composed
  - id: dd:spectrometer_x_ray_crystal/crystal/curvature_vertical
    dd_path: spectrometer_x_ray_crystal/crystal/curvature_vertical
    status: composed
- name: vertical_coordinate_of_crystal_spectrometer_focal_plane
  kind: scalar
  status: draft
  description: Vertical $Z$ coordinate of the plasma zone observed at the focal plane
    of an X-ray crystal spectrometer, measured in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z$ locates the height of the plasma observation
    zone imaged onto the detector at the focal plane of an X-ray crystal spectrometer.
    Crystal spectrometers exploit Bragg diffraction from a curved crystal to disperse
    X-ray emission from a narrow poloidal slice of the plasma; the $Z$ value of the
    focal plane determines which vertical region of the plasma is sampled, governing
    access to different flux surfaces or plasma layers. Typical values span the plasma
    minor cross-section, ranging from roughly $-2$ m to $+2$ m for large tokamaks,
    with millimeter-scale precision required to resolve poloidal emission gradients.
    This coordinate is one component of the full position description given by [coordinate_of_crystal_spectrometer_focal_plane](name:coordinate_of_crystal_spectrometer_focal_plane);
    the crystal geometry parameters [height_of_crystal](name:height_of_crystal) and
    [first_coordinate_radius_of_curvature_of_crystal](name:first_coordinate_radius_of_curvature_of_crystal)
    jointly determine the vertical extent and focusing quality of the observed zone.


    Sign convention: Positive when $Z$ is above the machine midplane, in the $+Z$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: spectroscopy
  links:
  - name:coordinate_of_crystal_spectrometer_focal_plane
  - name:height_of_crystal
  - name:first_coordinate_radius_of_curvature_of_crystal
  constraints: []
