- name: y_direction_unit_vector_of_strain_gauge_sensor
  kind: scalar
  status: draft
  description: Y component of the unit vector defining the orientation of a strain
    gage sensor, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The y direction unit-vector component of a strain gage sensor is
    the projection of the sensor''s oriented measurement axis onto the $\hat{y}$ basis
    direction of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame. It
    describes orientation only; it is not a strain value and does not by itself transform
    a scalar strain reading into a vector deformation.


    For a sensor direction unit vector $\hat{u}$, the component is defined by the
    projection onto $\hat{y}$:


    $$

    u_y = \hat{u} \cdot \hat{y}

    $$


    where $u_y$ is the y component, $\hat{u}$ is the unit vector along the strain
    gage measurement direction, and $\hat{y}$ is the y-axis unit basis vector in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.


    In practice, this component is obtained from the sensor installation geometry,
    calibration survey, or mechanical design model. Together with the corresponding
    x and z components, it specifies the axis along which the strain gage is sensitive,
    enabling comparison of sensor orientation with structural geometry and applied-load
    directions.


    Typical values lie between -1 and 1. A value of 1 means the sensor direction is
    aligned with $+\hat{y}$, 0 means it has no y component, and -1 means it is aligned
    with $-\hat{y}$.


    Sign convention: Positive when the strain gage sensor direction has a component
    along the $+\hat{y}$ axis of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis.'
  unit: '1'
  physics_domain: mechanical_measurement_diagnostics
  links:
