- name: toroidal_angle_of_launching_position
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of the point from which a heating or diagnostic
    system launches its beam into the plasma.
  documentation: The toroidal launching position angle $\phi_{\rm launch}$ identifies
    the toroidal location in the right-handed cylindrical $(R, \phi, Z)$ frame where
    the beam centerline exits the launcher aperture or waveguide. This angle, measured
    in radians, sets the toroidal injection geometry and influences the wave propagation
    path, absorption location, and current drive efficiency. The position is defined
    at the launcher exit aperture or the first wall penetration point, depending on
    the system design. This coordinate is paired with the major radius and vertical
    coordinates through `major_radius_of_launching_position` and `vertical_coordinate_of_launching_position`
    to fully specify the beam origin. The toroidal angle is measured from a reference
    direction (typically the midplane of a toroidal field coil or the machine equatorial
    plane), with positive values corresponding to the direction of increasing toroidal
    angle in the right-handed cylindrical $(R, \phi, Z)$ system. For electron cyclotron
    launchers, typical values range from 0 to $2\pi$ radians, with the specific angle
    determined by the launcher port location and steering capability. The coordinate
    is defined irrespective of the launching system type, applying equally to electron
    cyclotron, ion cyclotron, and neutral beam injection systems.
  unit: rad
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:ec_launchers/beam/launching_position/phi
    dd_path: ec_launchers/beam/launching_position/phi
    status: composed
  - id: dd:summary/heating_current_drive/ec/angle_tor/value
    dd_path: summary/heating_current_drive/ec/angle_tor/value
    status: attached
- name: toroidal_fast_particle_torque_density_due_to_j_cross_b_force
  kind: scalar
  status: draft
  description: "Toroidal component of the torque density exerted on fast particles\
    \ by the J\xD7B force due to radial currents."
  documentation: 'This quantity gives the volumetric torque density $\tau_\phi = (\mathbf{j}
    \times \mathbf{B})_\phi$ acting on the fast-particle population, resolved in the
    toroidal direction. It represents the local exchange of toroidal angular momentum
    between the fast ions and the bulk plasma via the Lorentz force produced by radial
    currents (e.g., from neutral beam injection or wave-driven transport). Typical
    values in the core of a beam-heated tokamak range from $10^{-3}$ to $10^{-1}\,\text{N}\,\text{m}^{-2}$,
    depending on beam power and fast-ion pressure gradients. The toroidal component
    is distinguished from the total vector torque density by its projection onto the
    $\hat{\phi}$ direction, and integrating it over the plasma volume yields the total
    [toroidal torque](name:toroidal_torque). For the full vector quantity, see [fast_particle_torque_density_due_to_j_cross_b_force](name:fast_particle_torque_density_due_to_j_cross_b_force).


    Sign convention: Positive when the torque accelerates the fast particles in the
    direction of increasing toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: N.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_torque
  - name:fast_particle_torque_density_due_to_j_cross_b_force
  arguments:
  - name: fast_particle_torque_density_due_to_j_cross_b_force
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_2d/torque_phi_j_radial
    dd_path: distributions/distribution/profiles_2d/torque_phi_j_radial
    status: composed
- name: vertical_coordinate_of_beamlet_group
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the beamlet group center within a neutral\
    \ beam injector unit in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ defines the height of the beamlet group
    center relative to the tokamak midplane ($Z = 0$). This geometric datum determines
    the aiming and alignment of the neutral beam with respect to the plasma, affecting
    the beam deposition profile and shine-through losses. Typical values range from
    -1 m to +1 m depending on the vertical port allocation of the beamline. The coordinate
    is measured or designed as part of the beamline geometry and is referenced alongside
    the major radius coordinate to fully locate the beamlet group. This quantity follows
    the same spatial-sign convention as all vertical positions in the IMAS cylindrical
    frame, ensuring consistency across heating and diagnostic systems.


    Sign convention: Positive when the beamlet group center lies above the tokamak
    midplane.


    See also the beam orientation given by [angle_of_neutral_beam_injector](name:angle_of_neutral_beam_injector)
    and the analogous vertical coordinates for other components such as [vertical_coordinate_of_limiter](name:vertical_coordinate_of_limiter).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:angle_of_neutral_beam_injector
  - name:vertical_coordinate_of_limiter
  sources:
  - id: dd:nbi/unit/beamlets_group/position/z
    dd_path: nbi/unit/beamlets_group/position/z
    status: composed
- name: vertical_coordinate_of_launching_position
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the beam launching position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ locates the height of the point from
    which an auxiliary heating or diagnostic system launches its beam (e.g., an electron
    cyclotron heating launcher or a neutral beam injector). This coordinate is used
    together with the major radius coordinate to define the full launching position
    in the machine frame. Typical values for tokamak systems range from $-1$ to $+1$
    m for mid-plane launchers and $\pm 0.5$ to $\pm 2$ m for off-axis launchers, depending
    on the port location. The pair of coordinates is [major_radius_of_launching_position](name:major_radius_of_launching_position).


    Sign convention: Positive when the launching position is above the midplane ($Z
    = 0$), increasing in the vertical direction of the cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:major_radius_of_launching_position
  sources:
  - id: dd:ec_launchers/beam/launching_position/z
    dd_path: ec_launchers/beam/launching_position/z
    status: composed
- name: vertical_coordinate_of_lower_hybrid_antenna_row
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the row reference point in a lower hybrid
    antenna, measured in the IMAS cylindrical frame.
  documentation: 'The vertical coordinate $Z_{\rm LH,row}$ locates the center of a
    lower hybrid antenna row in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $Z$ increases vertically upward from the midplane. This coordinate is essential
    for modeling the poloidal launch spectrum of lower hybrid waves, which depends
    on the antenna row position relative to the magnetic flux surfaces. Typically
    measured in meters from the machine midplane, values in present tokamaks range
    from $\pm 0.5$ to $\pm 2$ m for multiple row arrays, scaling with the plasma major
    radius. The vertical coordinate is determined from engineering drawings or laser
    alignment surveys during installation and is used in ray tracing or full-wave
    codes to compute the wave coupling and deposition profile. See also [vertical_coordinate_of_launching_position](name:vertical_coordinate_of_launching_position)
    for the general launching geometry and [major_radius_of_launching_position](name:major_radius_of_launching_position)
    for the radial counterpart.


    Sign convention: Positive when the antenna row is above the machine midplane ($Z>0$).


    The row coordinate pairs with the radial coordinate of the antenna to fully define
    the launching position in the poloidal plane.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_launching_position
  - name:major_radius_of_launching_position
  sources:
  - id: dd:lh_antennas/antenna/row/position/z
    dd_path: lh_antennas/antenna/row/position/z
    status: composed
- name: vertical_coordinate_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the geometric center of the neutral beam\
    \ injector aperture in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z_{\mathrm{NBI}}$ defines the height of
    the neutral beam injector aperture center relative to the tokamak midplane ($Z=0$).
    This geometric parameter determines the beam injection angle and vertical aiming
    of the neutral beam, which together with the major radius coordinate sets the
    beam-line geometry. The aperture center is a key reference point for beam alignment
    and is typically obtained from engineering drawings or laser tracker surveys of
    the installed system. Common NBI installations have aperture center heights ranging
    from -2 m to +2 m depending on the port location and machine size.


    Sign convention: Positive when the injector aperture center lies above the tokamak
    midplane ($Z>0$).


    See also the vertical coordinates of the beam source components such as [vertical_coordinate_of_launching_position](name:vertical_coordinate_of_launching_position)
    and [vertical_coordinate_of_beamlet_group](name:vertical_coordinate_of_beamlet_group),
    which define related vertical positions within the same neutral beam injector
    unit.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_launching_position
  - name:vertical_coordinate_of_beamlet_group
  sources:
