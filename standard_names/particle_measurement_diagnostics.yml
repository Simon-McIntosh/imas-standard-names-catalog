- name: diameter_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Full linear width of a circular diagnostic aperture at the entrance
    pupil, equal to twice the aperture radius and determining the solid-angle light-collection
    acceptance of the diagnostic channel.
  documentation: "The diameter of a diagnostic aperture is the full chord across the\
    \ circular opening at the entrance pupil of the optical collection system. It\
    \ is geometrically related to the [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture)\
    \ by $d = 2r$, and it directly governs the solid angle subtended at a given distance\
    \ from the plasma emission region, setting the total light throughput and therefore\
    \ the signal-to-noise balance of the diagnostic.\n\nThe solid angle $\\Omega$\
    \ subtended by a circular aperture of diameter $d$ at perpendicular distance $L$\
    \ from the emission region is:\n\n$$\n\\Omega \\approx \\frac{\\pi d^2}{4 L^2}\n\
    $$\n\nwhere $d$ is the aperture diameter and $L$ is the line-of-sight distance\
    \ from the plasma to the aperture plane.\n\nThis geometric parameter characterizes\
    \ the entrance cone of spectroscopic diagnostics, including charge exchange recombination\
    \ spectroscopy channels where the aperture diameter limits angular acceptance\
    \ and spatial resolution. Typical values in fusion diagnostic systems range from\
    \ a few millimeters to several centimeters depending on the required \xE9tendue\
    \ and spatial selectivity of the measurement.\n\nSign convention: Positive when\
    \ measured as the full chord through the aperture center in the plane of the entrance\
    \ pupil."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
  sources:
  - id: dd:charge_exchange/channel/cone_diameter
    dd_path: charge_exchange/channel/cone_diameter
    status: composed
- name: height_of_neutron_detector
  kind: scalar
  status: draft
  description: Full extent of the neutron detector aperture in the second local coordinate
    direction (X2), specifying one transverse dimension of a rectangular detector
    opening.
  documentation: 'The height of a neutron detector specifies the aperture dimension
    along the second axis of the detector-local Cartesian $(X1, X2)$ coordinate frame,
    where $X2$ is oriented perpendicular to both the line-of-sight direction and the
    $X1$ axis. This quantity applies to rectangular aperture geometries and, paired
    with [width_of_neutron_detector](name:width_of_neutron_detector) measured along
    the $X1$ axis, fully defines the two-dimensional rectangular aperture opening.


    The aperture height enters the computation of geometric detector acceptance: for
    a rectangular aperture the effective acceptance area is the product of the height
    ($X2$) and width ($X1$) dimensions, which scales the solid angle subtended by
    the detector and directly affects the inferred [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).
    The aggregate quantity [surface_area_of_neutron_detector](name:surface_area_of_neutron_detector)
    is derived from these geometric parameters.


    In fusion neutron diagnostics, detector aperture heights range from a few millimeters
    to a few centimeters, chosen to balance spatial resolution against counting-rate
    requirements.


    Sign convention: Positive when the aperture height is measured in the positive
    $X2$ direction of the detector-local coordinate frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:width_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:surface_area_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/geometry/x2_width
    dd_path: neutron_diagnostic/detector/geometry/x2_width
    status: composed
  - id: dd:neutron_diagnostic/detectors/detector/x2_width
    dd_path: neutron_diagnostic/detectors/detector/x2_width
    status: composed
- name: helium_3_density
  kind: scalar
  status: draft
  description: Local number density of helium-3 ions per unit plasma volume, summed
    over all ionization states from singly ionized to fully stripped and excluding
    neutral helium-3 atoms.
  documentation: 'Helium-3 density is the local number density of ionized helium-3
    nuclei in the plasma. It includes both singly ionized $^3\mathrm{He}^{+}$ and
    fully stripped $^3\mathrm{He}^{2+}$ ions, while excluding neutral helium-3 atoms.


    The total helium-3 ion density is the sum over the two possible ion charge states:


    $$

    n_{^3\mathrm{He}} = \sum_{q=1}^{2} n_{^3\mathrm{He},q}

    $$


    where $n_{^3\mathrm{He}}$ is the total helium-3 ion density in $\mathrm{m}^{-3}$,
    $n_{^3\mathrm{He},q}$ is the density in $\mathrm{m}^{-3}$ of helium-3 ions with
    charge state $q$, $q=1$ denotes singly ionized helium-3, and $q=2$ denotes fully
    stripped helium-3.


    In practice, helium-3 density can be inferred from charge-exchange recombination
    spectroscopy, passive helium spectroscopy, neutral-particle measurements, or integrated
    particle-balance analysis. Interpretation usually requires collisional-radiative
    modeling and knowledge of the ionization balance; in hot plasma cores helium-3
    is typically dominated by the fully stripped charge state, while singly ionized
    helium-3 is more important in cooler edge regions.


    Typical local densities range from $10^{17}$-$10^{19}\ \mathrm{m}^{-3}$ for trace
    or minority helium-3 populations, and can reach $10^{19}$-$10^{20}\ \mathrm{m}^{-3}$
    when helium-3 is a major fuel or dilution species. The corresponding fraction
    relative to electron density depends on fueling, isotope mix, wall recycling,
    and transport.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_helium_3_density
  - name:line_averaged_helium_3_density
  - name:helium_3_density_at_plasma_boundary
  - name:helium_3_fraction
- name: helium_4_density
  kind: scalar
  status: draft
  description: Local number density of helium-4 ions per unit plasma volume, the principal
    measure of fusion ash concentration in deuterium-tritium burning plasmas.
  documentation: "The helium-4 ion number density $n_{{}^4\\text{He}}$ quantifies\
    \ the local concentration of ${}^4\\text{He}$ nuclei at a given point in the plasma.\
    \ At fusion-relevant temperatures (several keV), helium-4 is fully stripped to\
    \ He$^{2+}$, and in deuterium-tritium burning plasmas it accumulates as the primary\
    \ fusion ash product of the reaction ${}^2\\text{H} + {}^3\\text{H} \\rightarrow\
    \ {}^4\\text{He} + n$; its buildup dilutes the fuel and reduces the fusion reaction\
    \ rate if not exhausted by the divertor system.\n\nThe time evolution of $n_{{}^4\\\
    text{He}}$ is governed by the particle continuity equation\n\n$$\n\\frac{\\partial\
    \ n_{{}^4\\text{He}}}{\\partial t} + \\nabla \\cdot \\boldsymbol{\\Gamma}_{{}^4\\\
    text{He}} = S_{{}^4\\text{He}}\n$$\n\nwhere $\\boldsymbol{\\Gamma}_{{}^4\\text{He}}$\
    \ is the helium-4 particle flux and $S_{{}^4\\text{He}}$ is the volumetric source\
    \ rate from fusion reactions and ionization of recycled helium neutrals at the\
    \ plasma edge.\n\nThe helium-4 density is measured primarily via charge exchange\
    \ recombination spectroscopy, where injected neutral beam atoms undergo charge\
    \ exchange with He$^{2+}$ ions to produce line emission from excited helium atoms;\
    \ passive spectroscopy of edge recycling emission provides a complementary approach.\
    \ Chord-averaged and volume-averaged forms are provided by [line_averaged_helium_4_density](name:line_averaged_helium_4_density)\
    \ and [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density)\
    \ respectively, while [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)\
    \ gives the boundary value.\n\nIn D-T burning plasmas, central He-4 densities\
    \ are in the range $10^{18}$-$10^{19}$ m$^{-3}$, with the helium-to-electron density\
    \ ratio \u2014 captured by [fraction](name:fraction) \u2014 kept below approximately\
    \ 5-10% in steady state to avoid excessive fuel dilution."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_helium_4_density
  - name:volume_averaged_helium_4_density
  - name:helium_4_density_at_plasma_boundary
  - name:fraction
- name: krypton_density
  kind: scalar
  status: draft
  description: Local number density of krypton impurity summed over all ionization
    states, giving the total krypton particle concentration per unit plasma volume.
  documentation: "The krypton number density is the volumetric concentration of krypton\
    \ impurity at a given point in the plasma, encompassing all ionization states\
    \ from neutral krypton Kr$^0$ through fully stripped Kr$^{36+}$. It is the primary\
    \ local measure of krypton seeding level and the parent quantity from which spatially\
    \ averaged forms are derived.\n\nThe total krypton particle density $n_\\mathrm{Kr}$\
    \ at a given location is defined as:\n\n$$\nn_\\mathrm{Kr} = \\sum_{q=0}^{36}\
    \ n_\\mathrm{Kr}^{(q)}\n$$\n\nwhere $n_\\mathrm{Kr}^{(q)}$ is the number density\
    \ of krypton ions in charge state $q$. The [chord-averaged form](name:line_averaged_krypton_density)\
    \ integrates this local quantity along a line of sight, while [volume_averaged_krypton_density](name:volume_averaged_krypton_density)\
    \ provides a global mean. The concentration relative to electron density is tracked\
    \ by krypton_fraction, and the pedestal-region value by [krypton_density_at_pedestal](name:krypton_density_at_pedestal).\n\
    \nKrypton (atomic number $Z=36$) is injected as a high-$Z$ seeding gas for radiative\
    \ power exhaust and divertor detachment control. Its local density is inferred\
    \ from passive spectroscopy of charge-state emission lines, active charge-exchange\
    \ recombination spectroscopy, or tomographic inversion of multi-chord line-integrated\
    \ measurements. Typical seeded-discharge values in tokamak edge and divertor regions\
    \ range from $10^{16}$ to $10^{18}$ m$^{-3}$, corresponding to 0.01\u20131% of\
    \ the local electron density.\n\nSign convention: Positive when krypton particles\
    \ are present in the plasma volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_krypton_density
  - name:volume_averaged_krypton_density
  - name:krypton_density_at_pedestal
- name: line_averaged_beryllium_density
  kind: scalar
  status: draft
  description: Chord-average of the beryllium ion number density along a diagnostic
    line of sight, equal to the path integral of the local beryllium density divided
    by the chord length.
  documentation: 'The line-averaged beryllium ion number density quantifies the mean
    beryllium ion content along a plasma diagnostic chord, normalized by chord length.
    It is the chord-integrated analog of the local [beryllium_density](name:beryllium_density)
    and is the most directly accessible measure of beryllium impurity concentration
    from line-of-sight diagnostics.


    The quantity is defined as:


    $$

    \bar{n}_{Be} = \frac{1}{L} \int_0^L n_{Be}(l) \, dl

    $$


    where $n_{Be}(l)$ is the local beryllium ion number density at path coordinate
    $l$ along the chord and $L$ is the total chord length.


    Inferred from passive spectroscopy of beryllium emission lines by inverting chord-integrated
    emission intensities using atomic emissivity coefficients; the result aggregates
    contributions from all beryllium ionization states present along the chord. The
    [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density) provides
    a complementary global volume average, while [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    gives the local on-axis value.


    Sign convention: Positive when beryllium ions populate the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:beryllium_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_magnetic_axis
  sources:
  - id: dd:summary/line_average/n_i/beryllium/value
    dd_path: summary/line_average/n_i/beryllium/value
    status: composed
- name: line_averaged_helium_3_density
  kind: scalar
  status: draft
  description: Line-averaged helium-3 density is the chord-length average of the local
    charged helium-3 ion number density. It sums singly ionized and fully stripped
    helium-3 ions, excludes neutral helium-3 atoms, and is independent of deuterium
    or tritium background densities except through separately defined composition
    fractions.
  documentation: 'Line-averaged helium-3 density is the mean charged helium-3 ion
    number density along a specified sightline through the plasma. The local density
    being averaged includes $^3\mathrm{He}^{+}$ and $^3\mathrm{He}^{2+}$ ions and
    excludes neutral $^3\mathrm{He}$ atoms.


    The chord average is defined by integrating the local charged helium-3 ion density
    along the path and dividing by the chord length:


    $$

    \bar{n}_{{}^3\mathrm{He},i} = \frac{1}{L}\int_0^L \left[n_{{}^3\mathrm{He}^{+}}(s)
    + n_{{}^3\mathrm{He}^{2+}}(s)\right] \, ds

    $$


    where $s$ is distance along the chord, $L$ is the total chord length, $n_{{}^3\mathrm{He}^{+}}$
    is the singly ionized helium-3 density, and $n_{{}^3\mathrm{He}^{2+}}$ is the
    fully stripped helium-3 density. Deuterium and tritium background densities do
    not enter this path integral; they only affect related composition quantities
    such as a helium-3 fraction.


    In practice this quantity is inferred from diagnostics or analysis methods that
    determine the helium-3 ion concentration along a line of sight, often combined
    with independent density measurements. Isotope-sensitive spectroscopy, charge-exchange
    measurements, neutral-particle analysis, or reconstructed species-density distributions
    can provide the local or path-integrated helium-3 contribution.


    Typical line-averaged helium-3 densities are $10^{16}$-$10^{19}$ m$^{-3}$ for
    trace or minority-species operation in tokamaks. In plasmas using helium-3 as
    a substantial fuel component, values can approach $10^{19}$-$10^{20}$ m$^{-3}$
    depending on total density and mixture fraction.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_3_density
  - name:volume_averaged_helium_3_density
  - name:line_averaged_helium_4_density
  arguments:
  - name: helium_3_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/helium_3/value
    dd_path: summary/line_average/n_i/helium_3/value
    status: composed
- name: line_averaged_helium_4_density
  kind: scalar
  status: draft
  description: Chord-averaged helium-4 ion number density, equal to the path integral
    of the local helium-4 density divided by the measurement chord length.
  documentation: 'The line-averaged helium-4 density gives the spatial mean of the
    local [helium_4_density](name:helium_4_density) along a diagnostic chord through
    the plasma. As the principal ash product of deuterium-tritium fusion, helium-4
    accumulates in the plasma core and its line-integrated concentration must be monitored
    to prevent fuel dilution and degradation of energy confinement.


    The chord average is defined as:


    $$

    \bar{n}_{\mathrm{He4}} = \frac{1}{L} \int_0^L n_{\mathrm{He4}}(\ell) \, d\ell

    $$


    where $n_{\mathrm{He4}}(\ell)$ is the local helium-4 ion number density at position
    $\ell$ along the chord (in m$^{-3}$) and $L$ is the total chord length in m.


    This quantity is a natural output of line-integrated optical diagnostics such
    as charge-exchange recombination spectroscopy and helium spectral-line emission
    measurements, prior to any spatial inversion. It complements [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    which integrates over the full plasma volume, and is directly analogous to [line_averaged_helium_3_density](name:line_averaged_helium_3_density)
    for the lighter helium isotope. Typical values in deuterium-tritium burning plasmas
    range from $10^{17}$ to $10^{19}$ m$^{-3}$, depending on fusion power and helium
    exhaust efficiency.


    Sign convention: Positive when helium-4 ions occupy the measurement chord at finite
    density; number density is orientation-independent and cannot take negative values.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_4_density
  - name:volume_averaged_helium_4_density
  - name:line_averaged_helium_3_density
  arguments:
  - name: helium_4_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/helium_4/value
    dd_path: summary/line_average/n_i/helium_4/value
    status: composed
- name: line_averaged_krypton_density
  kind: scalar
  status: draft
  description: Chord-average of the krypton number density, equal to the path integral
    of the local krypton particle density divided by the measurement chord length.
  documentation: 'Krypton ($Z = 36$) is a noble-gas impurity that may be seeded into
    fusion plasmas for edge radiative cooling and power exhaust control. The line-averaged
    krypton density $\bar{n}_\mathrm{Kr}$ gives the krypton particle concentration
    averaged along a measurement chord, providing a line-of-sight integrated measure
    of impurity content rather than a local point value.


    The defining relation is:


    $$

    \bar{n}_\mathrm{Kr} = \frac{1}{L} \int_0^L n_\mathrm{Kr}(\ell) \, d\ell

    $$


    where $n_\mathrm{Kr}(\ell)$ is the local krypton number density at position $\ell$
    along the chord and $L$ is the total chord length in meters.


    This quantity is typically inferred from chord-integrated optical or vacuum-ultraviolet
    emission spectroscopy of krypton line radiation, combined with emissivity modeling
    along the line of sight. It provides a path-integrated measure complementary to
    the local [krypton_density](name:krypton_density) and to the global [volume_averaged_krypton_density](name:volume_averaged_krypton_density).
    For comparison, [line_averaged_argon_density](name:line_averaged_argon_density)
    follows the same chord-average definition for argon seeding. Local concentrations
    at specific plasma regions are captured by [krypton_density_at_pedestal](name:krypton_density_at_pedestal)
    and [krypton_density_at_limiter](name:krypton_density_at_limiter).


    Typical line-averaged krypton densities in power-exhaust seeding scenarios range
    from $10^{16}$ to $10^{18}$ m$^{-3}$, depending on seeding rate and plasma confinement
    regime.


    Sign convention: Positive when krypton particles are present along the measurement
    chord, consistent with the intrinsically non-negative character of particle number
    density.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:krypton_density
  - name:volume_averaged_krypton_density
  - name:line_averaged_argon_density
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_limiter
  arguments:
  - name: krypton_density
    operator: line_averaged
    operator_kind: qualifier
