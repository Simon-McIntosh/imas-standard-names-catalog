name: electron_thermal_energy_pedestal
status: draft
description: Thermal energy stored in the electron population within the pedestal
  region, obtained from volume integration of $\frac{3}{2} n_e k_B T_e$ over the pedestal.
documentation: "The electron thermal energy at the pedestal $W_{e,\\rm ped} = \\frac{3}{2}\
  \ \\int_{\\rm ped} n_e k_B T_e \\, dV$ quantifies the electron energy content residing\
  \ inside the H-mode edge transport barrier. Here $n_e$ is the electron density,\
  \ $T_e$ is the electron temperature, and $k_B$ is Boltzmann's constant; the integration\
  \ extends over the pedestal volume defined by the fitted pedestal width in normalized\
  \ poloidal flux. Typical values are 10\u2013200 kJ in medium to large tokamaks.\
  \ This quantity is a key metric for ELM energy loss studies, since a significant\
  \ fraction of $W_{e,\\rm ped}$ can be expelled during type-I ELMs. It is usually\
  \ derived from Thomson scattering or ECE pedestal profiles combined with equilibrium\
  \ geometry. See also `ion_thermal_energy_at_pedestal` for the ion counterpart."
validity_domain: ''
