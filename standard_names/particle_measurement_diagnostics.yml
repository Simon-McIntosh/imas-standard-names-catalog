- name: motional_stark_radiance_at_spectral_line
  kind: scalar
  status: active
  description: Photon-count radiance from an identified motional-Stark-split component
    of a spectral emission line, integrated along the viewing path and resolved by
    projected area and solid angle.
  documentation: 'Motional-Stark radiance at a spectral line is the photon-count radiance
    emitted by moving neutral-beam atoms in one identified Stark-split component.
    It is integrated along the viewing path and defined per projected area normal
    to the viewing direction and per solid angle.


    The line-integrated photon radiance is defined by


    $$

    \mathcal{L}_{\mathrm{MS,ph}} = \int_{\Delta\lambda_{\mathrm{MS}}} \mathcal{L}_{\mathrm{MS,ph},\lambda}(\lambda)\,d\lambda

    $$


    where $\mathcal{L}_{\mathrm{MS,ph},\lambda}$ is the photon spectral radiance of
    the selected motional-Stark component, $\lambda$ is wavelength, and $\Delta\lambda_{\mathrm{MS}}$
    is the wavelength interval assigned to that component. Unlike the energy-basis
    [radiance at a spectral line](name:radiance_at_spectral_line), this quantity counts
    photons rather than weighting them by photon energy. The selected component is
    distinguished by its motional-Stark wavelength displacement, related to the [fast-neutral-beam
    motional-Stark wavelength displacement](name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line).'
  unit: m^-2.s^-1.sr^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radiance_at_spectral_line
  - name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line
  arguments:
  - name: radiance_at_spectral_line
    operator: motional_stark
    operator_kind: qualifier
- name: neutral_beam_atomic_number
  kind: scalar
  status: active
  description: Nuclear charge number of the neutral-beam species, equal to the integer
    count of protons in its nucleus and invariant across ionization states and isotopes.
  documentation: 'The atomic number $Z$ of a neutral-beam species is the integer count
    of protons in its nucleus. It is an invariant elemental identifier that remains
    unchanged when the element is ionized or when a different isotope is considered.


    The nuclear charge associated with the element is defined by


    $$

    Q = Z e

    $$


    where $Q$ is the nuclear charge and $e$ is the elementary charge. The neutral-beam
    qualifier identifies the species context, not a different nuclear property. This
    quantity is the neutral-beam specialization of [atomic_number](name:atomic_number)
    and has the same elemental meaning as [ion_atomic_number](name:ion_atomic_number)
    for the corresponding ion species; it does not specify isotope mass or instantaneous
    charge state.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:atomic_number
  - name:ion_atomic_number
  arguments:
  - name: atomic_number
    operator: neutral_beam
    operator_kind: qualifier
  sources:
  - dd_path: charge_exchange/channel/bes/z_ion
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-bes-z_ion
    dd_documentation:
