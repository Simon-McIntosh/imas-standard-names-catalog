- name: thermal_neutral_state_density
  kind: scalar
  status: draft
  description: Number density of thermal (Maxwellian) neutral particles occupying
    a specific internal quantum state, excluding the suprathermal neutral population
    within that state.
  documentation: "The thermal neutral state density gives the number density of neutral\
    \ particles whose velocity distribution approximates a Maxwellian at the local\
    \ neutral temperature, resolved for a single internal quantum state (electronic,\
    \ vibrational, or rotational level) of the neutral species. Separating thermal\
    \ from suprathermal neutrals within each state is essential for accurate modeling\
    \ of atomic processes \u2014 ionization, recombination, and charge exchange \u2014\
    \ whose rate coefficients depend on the neutral velocity distribution.\n\nThe\
    \ total neutral density for internal state $s$ decomposes as:\n\n$$\nn_{\\mathrm{neutral},s}\
    \ = n_{{\\mathrm{thermal}},s} + n_{{\\mathrm{fast}},s}\n$$\n\nwhere $n_{{\\mathrm{thermal}},s}$\
    \ is this quantity and $n_{{\\mathrm{fast}},s}$ is the [fast neutral state density](name:fast_neutral_state_density).\
    \ Summing over all internal states $s$ recovers the state-summed [thermal_neutral_density](name:thermal_neutral_density),\
    \ while the combined thermal-plus-fast population for a single state is tracked\
    \ by [total_neutral_state_density](name:total_neutral_state_density).\n\nThis\
    \ quantity is computed from neutral kinetic transport models that evolve Maxwellian\
    \ and suprathermal populations separately, and can be constrained by spectroscopic\
    \ measurements such as Balmer-series line intensities analyzed through collisional-radiative\
    \ models. In the ionization-dominated plasma core, thermal neutral densities fall\
    \ below $10^{12}$ m$^{-3}$; in the edge and scrape-off layer they range from $10^{14}$\
    \ to $10^{18}$ m$^{-3}$, depending on recycling intensity, wall geometry, and\
    \ neutral penetration depth."
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_neutral_state_density
  - name:thermal_neutral_density
  - name:total_neutral_state_density
