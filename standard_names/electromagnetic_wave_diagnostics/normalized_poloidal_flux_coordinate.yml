name: normalized_poloidal_flux_coordinate
status: draft
cocos_transformation_type: one_like
description: Dimensionless radial label $\rho_{\mathrm{pol}} = \sqrt{(\psi - \psi_{\mathrm{axis}})
  / (\psi_{\mathrm{LCFS}} - \psi_{\mathrm{axis}})}$ mapping each flux surface to $[0,
  1]$.
documentation: "The normalized poloidal flux coordinate $\\rho_{\\mathrm{pol}}$ is\
  \ defined as $\\rho_{\\mathrm{pol}} = \\sqrt{\\psi_N}$, where $\\psi_N = (\\psi\
  \ - \\psi_{\\mathrm{axis}}) / (\\psi_{\\mathrm{LCFS}} - \\psi_{\\mathrm{axis}})$\
  \ is the normalized poloidal flux, $\\psi$ is the poloidal magnetic flux, $\\psi_{\\\
  mathrm{axis}}$ its value on the magnetic axis, and $\\psi_{\\mathrm{LCFS}}$ its\
  \ value at the last closed flux surface. By construction $\\rho_{\\mathrm{pol}}\
  \ = 0$ on the magnetic axis and $\\rho_{\\mathrm{pol}} = 1$ at the separatrix, providing\
  \ a convenient monotonic radial coordinate for profile representation. It is widely\
  \ used in equilibrium reconstruction codes (EFIT, LIUQE, CLISTE) and in mapping\
  \ diagnostic data\u2014such as reflectometer and interferometer measurements\u2014\
  onto a common radial grid. Values slightly above unity correspond to the scrape-off\
  \ layer. See also the toroidal-flux-based counterpart and the poloidal flux at the\
  \ boundary."
validity_domain: ''
constraints: []
tags:
- equilibrium-reconstruction
- flux-coordinates
- spatial-profile
links: []
kind: scalar
unit: '1'
