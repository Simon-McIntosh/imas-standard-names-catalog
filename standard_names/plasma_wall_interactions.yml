- name: surface_emissivity
  kind: scalar
  status: draft
  description: 'Surface emissivity is the dimensionless effective thermal emissivity
    of a plasma-facing surface: the ratio of its emitted thermal radiance or radiative
    exitance to that of a blackbody at the same surface temperature. As a scalar,
    it represents the stated spectral band and angular averaging rather than a wavelength-
    and direction-resolved emissivity.'
  documentation: 'Surface emissivity is a dimensionless measure of how efficiently
    a real surface emits thermal radiation compared with a blackbody at the same surface
    temperature. For a scalar value, it is an effective emissivity averaged over the
    relevant wavelength band and angular domain, not the full spectral, directional,
    or polarization-dependent emissivity function.


    The effective value can be defined as a weighted ratio of emitted spectral radiance
    to blackbody spectral radiance:


    $$

    \epsilon_\mathrm{eff}(T_s) = \frac{\int_{\lambda}\int_{\Omega} W(\lambda,\Omega)\,L_\lambda^\mathrm{surf}(T_s,\Omega)\,d\Omega\,d\lambda}{\int_{\lambda}\int_{\Omega}
    W(\lambda,\Omega)\,L_\lambda^\mathrm{bb}(T_s)\,d\Omega\,d\lambda}

    $$


    where $T_s$ is the surface temperature, $L_\lambda^\mathrm{surf}$ is the emitted
    spectral radiance of the real surface, $L_\lambda^\mathrm{bb}$ is the blackbody
    spectral radiance at the same temperature, $\Omega$ is the selected angular domain,
    and $W(\lambda,\Omega)$ specifies the spectral response and angular weighting.
    For a broadband hemispherical thermal model, the angular domain is the outward
    hemisphere and the associated emitted heat-flux density is $q_\mathrm{rad}=\epsilon_\mathrm{eff}\sigma
    T_s^4$; total radiated power is obtained by integrating that flux density over
    surface area.


    In practice, surface emissivity is obtained from material data, laboratory calibration,
    in-situ calibration, or fitting of thermal-radiation measurements together with
    an independent temperature estimate. It is strongly affected by material composition,
    roughness, oxidation, deposited layers, erosion, temperature, wavelength band,
    and viewing angle, so the averaging convention should match the radiation model
    or infrared measurement being interpreted.


    Typical values range from 0.02-0.2 for clean polished metals, 0.3-0.9 for oxidized
    or rough metals, 0.7-0.95 for graphite and many carbon-rich surfaces, and about
    0.1-0.6 for tungsten plasma-facing components depending on wavelength and surface
    condition. For an opaque passive surface the physical range is normally $0 \le
    \epsilon_\mathrm{eff} \le 1$; apparent values outside this range usually indicate
    calibration, reflection, background-subtraction, or model-assumption errors.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:maximum_surface_temperature
  sources:
  - id: dd:camera_ir/channel/camera/frame/region_of_interest/emissivity
    dd_path: camera_ir/channel/camera/frame/region_of_interest/emissivity
    status: composed
- name: surface_temperature
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the exposed material surface of a plasma-facing
    component at a specified surface location and time. It is a local surface state
    variable, distinct from a surface average or a maximum over an area.
  documentation: 'Surface temperature is the thermodynamic temperature of the outermost
    exposed material surface at a specified location and time. It is a local material
    property of a plasma-facing component; surface averages, area-integrated quantities,
    and peak values are different quantities and should not be inferred from this
    name alone.


    The temperature controls thermal emission from the surface. For an opaque gray
    surface, the hemispherical radiant exitance may be approximated by the Stefan-Boltzmann
    relation:


    $$

    M = \varepsilon \sigma T_s^4

    $$


    where $M$ is the emitted radiant power per unit surface area, $\varepsilon$ is
    the surface emissivity, $\sigma$ is the Stefan-Boltzmann constant, and $T_s$ is
    the surface temperature.


    In practice, surface temperature may be obtained from infrared thermography, pyrometry,
    embedded temperature sensors, thermocouples, or heat-transfer modeling. Thermal-emission
    methods require knowledge of emissivity, optical transmission, viewing geometry,
    reflected radiation, and calibration. The referenced location is the material
    point on the exposed surface, which may be parameterized by surface coordinates
    or by its position in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    Typical values are 290-320 K for components near room temperature before operation,
    500-1500 K for heated first-wall or divertor surfaces during plasma exposure,
    and 1500-3000 K for localized hot spots or transient heat loads. Values approaching
    material limits, such as about 3683 K for tungsten melting, are critical for component
    lifetime and machine protection.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_emissivity
  - name:maximum_surface_temperature
  sources:
  - id: dd:camera_ir/channel/camera/frame/apparent_temperature
    dd_path: camera_ir/channel/camera/frame/apparent_temperature
    status: composed
  - id: dd:camera_ir/frame/surface_temperature
    dd_path: camera_ir/frame/surface_temperature
    status: composed
- name: maximum_surface_temperature
  kind: scalar
  status: draft
  description: Highest apparent surface temperature among the valid points in a defined
    infrared camera region of interest. It is a temperature maximum, not a heat flux
    or power-density measure.
  documentation: 'Maximum surface temperature is the largest apparent temperature
    assigned to an observed plasma-facing surface within a defined region of interest
    at a given observation time. The word apparent indicates the radiance-derived
    temperature after the assumed emissivity, optical transmission, calibration, and
    background corrections have been applied; it may differ from the true thermodynamic
    surface temperature if those assumptions are inaccurate. This quantity identifies
    the hottest inferred point in the region, but it does not by itself quantify deposited
    heat flux.


    For a region of interest $\Omega_\mathrm{ROI}$, the maximum is defined as the
    maximum over all valid temperature samples in that region:


    $$

    T_\mathrm{max} = \max_{p \in \Omega_\mathrm{ROI}} T_\mathrm{app}(p)

    $$


    where $T_\mathrm{max}$ and $T_\mathrm{app}(p)$ are temperatures in kelvin, $p$
    labels a valid surface sample or camera pixel associated with the region of interest,
    and $\Omega_\mathrm{ROI}$ is the selected set of samples. Invalid, masked, saturated,
    or uncalibrated samples are excluded before taking the maximum; the result is
    a pointwise maximum, not an average, percentile, or time maximum unless an additional
    processing definition states otherwise.


    In practice, infrared thermography infers $T_\mathrm{app}$ from measured thermal
    radiance using camera calibration, spectral response, surface emissivity, optical
    transmission, and reflected-background corrections. A common calibration model
    is based on Planck spectral radiance, with $L_\lambda(T) = \epsilon(\lambda,T)\,2hc^2/\lambda^5[\exp(hc/(\lambda
    k_B T))-1]^{-1}$ integrated over the camera bandpass, where $L_\lambda$ is spectral
    radiance in W m^-3 sr^-1, $\epsilon$ is dimensionless emissivity, $\lambda$ is
    wavelength in meters, $h$ is Planck''s constant in J s, $c$ is the speed of light
    in m s^-1, $k_B$ is Boltzmann''s constant in J K^-1, and $T$ is temperature in
    kelvin.


    Typical values are about 290-350 K for surfaces near room temperature before plasma
    exposure, several hundred to 1500 K during moderate heating, and above 2000 K
    for localized hot spots in high-power operation. Allowable maxima depend strongly
    on surface material, coatings, pulse duration, and machine-protection limits.


    This quantity should be distinguished from heat-flux or power-density quantities
    such as peak power density at a divertor target or limiter. Temperature is the
    surface thermal state, whereas heat flux depends on deposited power, material
    thermal properties, geometry, cooling, and the time history of the exposure.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:surface_emissivity
  arguments:
  - name: surface_temperature
    operator: maximum
    operator_kind: qualifier
  sources:
  - id: dd:camera_ir/channel/camera/frame/region_of_interest/temperature_max
    dd_path: camera_ir/channel/camera/frame/region_of_interest/temperature_max
    status: composed
- name: toroidal_current_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Net electric current flowing toroidally in the conducting vacuum vessel,
    produced by induction from time-varying magnetic flux linked with the vessel.
    The toroidal direction is that of the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal vacuum-vessel current is the net electric current carried
    by the conducting vessel in the toroidal direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is an algebraic scalar: signed contributions from vessel
    sectors or passive conducting branches are summed to give the total vessel current,
    rather than describing only one local branch.


    The scalar total is defined as the signed sum of toroidal currents carried by
    the vessel conductors:


    $$

    I_{\mathrm{vv},\phi} = \sum_{k \in \mathrm{vessel}} I_{\phi,k}

    $$


    where $I_{\mathrm{vv},\phi}$ is the total toroidal vacuum-vessel current in A,
    and $I_{\phi,k}$ is the signed toroidal current in A carried by conducting vessel
    sector or passive branch $k$.


    This current is induced when magnetic flux linked by closed conducting paths in
    the vessel changes, for example because of changing plasma current or external-coil
    currents. In practice it is estimated from electromagnetic models of passive conductors
    constrained by magnetic measurements, flux-loop signals, coil-current histories,
    and vessel electrical properties; it is closely related to the current in a passive
    conducting loop.


    Typical absolute values are highly device and transient dependent. Net toroidal
    vessel currents of $10^3$-$10^6$ A are common in medium and large tokamaks during
    appreciable magnetic-flux changes, while smaller devices or slow current ramps
    may produce values below $10^3$ A.


    Sign convention: Positive when the vessel current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame (counter-clockwise
    when viewed from above $+\hat{Z}$).'
  unit: A
  physics_domain: plasma_wall_interactions
  links:
  - name:resistance_of_vacuum_vessel
  - name:toroidal_plasma_current
  - name:toroidal_current_of_cryostat
  sources:
