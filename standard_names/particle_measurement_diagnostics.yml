- name: xenon_density
  kind: scalar
  status: draft
  description: Number density of xenon ions at a given point in the plasma, summed
    over all ionization states from singly ionized through fully stripped xenon, excluding
    neutral xenon atoms.
  documentation: 'Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe}
    = 54$) introduced into fusion plasmas for radiative-mantle experiments, impurity-transport
    studies, and disruption mitigation. The xenon ion number density $n_\mathrm{Xe}$
    quantifies the local concentration of all charged xenon species and enters the
    plasma effective charge through $Z_\mathrm{eff} = \sum_i Z_i^2 n_i / n_e$, where
    $n_i$ is the partial density of ion species $i$ and $n_e$ is the electron density.


    The total xenon ion density is the sum over all ionic charge states:


    $$

    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}

    $$


    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions carrying
    charge $ze$. The charge-state distribution is determined by coronal equilibrium
    or collisional-radiative modeling at the local electron temperature and density.


    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray line
    emission via spectroscopy and tomographic inversion, or from charge-exchange recombination
    spectroscopy using neutral-beam injection. Spatially resolved forms include [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)
    at the innermost flux surface and [xenon_density_at_pedestal](name:xenon_density_at_pedestal)
    in the edge transport barrier, while [volume_averaged_xenon_density](name:volume_averaged_xenon_density)
    provides the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by xenon_fraction.


    Sign convention: Positive when ionized xenon is present in the plasma.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density_at_magnetic_axis
  - name:xenon_density_at_pedestal
  - name:volume_averaged_xenon_density
- name: line_averaged_xenon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of xenon ions along a chord through the
    plasma, obtained by dividing the path integral of the local xenon ion density
    by the chord length.
  documentation: "The line-averaged xenon ion number density is the chord-path mean\
    \ of the local [xenon_density](name:xenon_density), which sums all charged xenon\
    \ ionization states from Xe$^{1+}$ through Xe$^{54+}$, normalized by the measurement\
    \ chord length through the plasma.\n\nThe defining relation is:\n\n$$\n\\bar{n}_\\\
    mathrm{Xe} = \\frac{1}{L} \\int_0^L n_\\mathrm{Xe}(\\ell) \\, d\\ell\n$$\n\nwhere\
    \ $n_\\mathrm{Xe}(\\ell)$ is the local xenon ion number density at arc-length\
    \ position $\\ell$ along the chord and $L$ is the total chord length.\n\nThis\
    \ quantity is inferred from line-integrated emission diagnostics sensitive to\
    \ xenon spectral lines \u2014 including soft X-ray arrays and visible-range spectrometers\
    \ \u2014 combined with knowledge of the chord geometry. The [volume_averaged_xenon_density](name:volume_averaged_xenon_density)\
    \ provides the spatial mean over the full plasma volume, and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)\
    \ captures the on-axis value. The analogous chord-averaged quantity for argon\
    \ is documented as [line_averaged_argon_density](name:line_averaged_argon_density).\n\
    \nIn trace impurity transport experiments, xenon concentrations yield $\\bar{n}_\\\
    mathrm{Xe} \\sim 10^{14}$\u2013$10^{16}$ m$^{-3}$; during disruption-mitigation\
    \ massive gas injection or shattered-pellet scenarios, values can reach $10^{17}$\u2013\
    $10^{19}$ m$^{-3}$.\n\nSign convention: Positive when xenon ions are present along\
    \ the measurement chord."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density
  - name:volume_averaged_xenon_density
  - name:xenon_density_at_magnetic_axis
  - name:line_averaged_argon_density
  arguments:
  - name: xenon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/xenon/value
    dd_path: summary/line_average/n_i/xenon/value
    status: composed
- name: fast_ion_atomic_number
  kind: scalar
  status: draft
  description: Nuclear proton count of the fast ion species detected in charge exchange
    spectroscopy, uniquely identifying the element independently of its ionization
    state.
  documentation: "The fast ion atomic number $Z_n$ is the number of protons in the\
    \ nucleus of the energetic (non-thermal) ion species observed via Fast Ion Charge\
    \ eXchange (FICX) spectroscopy. As an intrinsic nuclear property, $Z_n$ is invariant\
    \ with respect to ionization state and unambiguously identifies the element: $Z_n\
    \ = 1$ for hydrogen isotopes (deuterium, tritium), $Z_n = 2$ for helium (alpha\
    \ particles), $Z_n = 6$ for carbon, and $Z_n = 74$ for tungsten.\n\nThis quantity\
    \ is the fast-ion-population counterpart of [ion_atomic_number](name:ion_atomic_number),\
    \ which gives the same nuclear property for a general ion species. It is physically\
    \ distinct from [fast_ion_charge](name:fast_ion_atomic_number), which specifies\
    \ the ionic charge state $Z_\\text{ion}$ \u2014 the net charge arising from electron\
    \ removal \u2014 and which can vary for the same element at different ionization\
    \ conditions. Together with [fast_ion_mass](name:ion_atomic_mass), the atomic\
    \ number fully characterizes the fast ion species entering the spectral interpretation\
    \ of FICX emission.\n\nIn charge exchange diagnostics, the fast ion species is\
    \ identified prior to line inversion; $Z_n$ is an integer-valued input parameter\
    \ rather than a derived measurement, taking values from 1 (hydrogenic fast ions\
    \ in D-T plasmas) to the atomic number of the heaviest injected impurity species."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_atomic_number
  - name:ion_atomic_mass
  arguments:
  - name: ion_atomic_number
    operator: fast
    operator_kind: qualifier
  sources:
  - id: dd:charge_exchange/channel/ion_fast/z_ion
    dd_path: charge_exchange/channel/ion_fast/z_ion
    status: composed
- name: fraction_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Dimensionless composition fraction of a specified constituent within
    a neutron detector converter material. The precise basis of the fraction is defined
    by the more specific child quantity, such as an atomic fraction, rather than being
    fixed by this parent concept.
  documentation: 'Fraction of neutron detector converter describes how much of a specified
    constituent contributes to the total converter material composition. It is a generic
    dimensionless composition measure: the denominator and numerator may be based
    on the basis specified by the child standard name, such as atom count for [atomic
    fraction of neutron detector converter](name:atomic_fraction_of_neutron_detector_converter).


    A generic composition fraction for constituent $k$ can be written as


    $$

    f_k = \frac{q_k}{\sum_j q_j}

    $$


    where $q_k$ is the amount of constituent $k$ measured on the relevant basis, and
    the sum runs over all constituents included in the converter material on the same
    basis. For the atomic-fraction child, $q_j$ is an atom count; other specialized
    children would define a different basis if introduced.


    The quantity is used to characterize the material that converts incident neutrons
    into detectable secondary particles. It is determined from material specification,
    isotope enrichment data, fabrication records, or compositional analysis methods
    such as spectroscopy or mass analysis, depending on the required accuracy and
    the fraction basis.


    Typical values lie between 0 and 1. A dominant or enriched neutron-sensitive constituent
    may have values around 0.5-1, while minor constituents, dopants, residual impurities,
    or isotopic contaminants may range from less than 1e-6 to 0.1.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  sources:
  - id: derived:fraction_of_neutron_detector_converter
    status: composed
- name: atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Atomic fraction characterizing the composition of a neutron detector
    converter, the material that transforms incident neutrons into detectable secondary
    charged particles.
  documentation: "A neutron detector converter is a material placed within or adjacent\
    \ to the active detection medium to transform incident neutrons \u2014 electrically\
    \ neutral particles that interact weakly with most matter \u2014 into secondary\
    \ charged particles (alpha particles, protons, or tritons) that produce measurable\
    \ ionization or scintillation signals. The compositional fractions of the converter\
    \ govern the macroscopic neutron absorption cross-section and hence the detection\
    \ sensitivity for a given neutron energy range.\n\nThe most diagnostically specific\
    \ instance of this quantity is the target atomic fraction, which gives the share\
    \ of converter atoms that are the reactive nuclei for the neutron-capture or neutron-scattering\
    \ channel of interest. For boron-based converters this corresponds to the B-10\
    \ enrichment fraction; for helium-3 proportional detectors it is the He-3 purity.\
    \ Converter fractions are dimensionless and bounded between 0 and 1, with values\
    \ close to unity for highly enriched materials used in high-sensitivity fusion\
    \ diagnostics.\n\nConverter composition fractions are manufacturing parameters\
    \ determined from isotopic enrichment specifications and chemical analysis of\
    \ the converter material. They enter the detector response model alongside the\
    \ [efficiency_of_neutron_detector](name:efficiency_of_neutron_detector) to relate\
    \ measured count rates to absolute neutron fluxes during fusion plasma diagnostics."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  arguments:
  - name: fraction_of_neutron_detector_converter
    operator: atomic
    operator_kind: qualifier
  sources:
  - id: derived:atomic_fraction_of_neutron_detector_converter
    status: composed
- name: target_atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Fraction of all atoms in a neutron detector converter material that
    are the nuclear target species for the primary neutron-induced detection reaction.
    It is a dimensionless composition factor that includes stoichiometry and isotopic
    enrichment.
  documentation: 'Target atomic fraction of a neutron detector converter is the fraction
    of all atoms in the converter material that are atoms of the nuclear target species.
    The target species is the isotope that participates in the primary neutron-induced
    detection reaction, such as $^6\mathrm{Li}$ in a lithium converter or $^{10}\mathrm{B}$
    in a boron converter.


    For a representative amount of converter material, the fraction is defined by
    the atom-count ratio:


    $$

    f_t = \frac{N_t}{N_\mathrm{tot}}

    $$


    where $N_t$ is the dimensionless count of target atoms, $N_\mathrm{tot}$ is the
    dimensionless count of all atoms in the same material amount, and $f_t$ is a dimensionless
    fraction with unit 1. The admissible range is $0 \le f_t \le 1$.


    In practice, this quantity is computed from the converter composition, stoichiometry,
    and isotopic enrichment, or determined from material assay or manufacturer specifications.
    It scales the available target atom density and therefore affects the normalized
    converter response per emitted source neutron represented by [nuclear_rate_of_neutron_detector_converter](name:nuclear_rate_of_neutron_detector_converter);
    an absolute reaction count rate also depends on neutron fluence or source strength.


    Typical values span 0-1. Elemental converter layers enriched in the target isotope
    can approach 0.9-1, while natural elemental boron has $f_t \approx 0.199$ for
    $^{10}\mathrm{B}$. In stoichiometric compounds the denominator includes non-target
    atoms: for fully $^6\mathrm{Li}$ lithium fluoride, $f_t = 0.5$, and for 95% $^6\mathrm{Li}$-enriched
    lithium fluoride, $f_t \approx 0.475$.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:nuclear_rate_of_neutron_detector_converter
  - name:efficiency_of_neutron_detector
  arguments:
  - name: atomic_fraction_of_neutron_detector_converter
    operator: target
    operator_kind: qualifier
- name: nuclear_target_atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Fraction of atoms in the neutron detector converter material that belong
    to the nuclear target species responsible for the primary neutron-induced detection
    reaction.
  documentation: 'The nuclear target atomic fraction specifies what proportion of
    the total atoms present in the neutron detector converter are of the isotopic
    species that participates in the primary neutron detection reaction (for example,
    neutron capture or fission). Converter materials exploit specific target nuclei
    that interact with incident neutrons to produce detectable secondary charged particles;
    the converter''s intrinsic efficiency and absolute response are set directly by
    how many such target atoms exist within the active volume.


    The fraction is defined as:


    $$

    f_{\rm target} = \frac{N_{\rm target}}{N_{\rm total}}

    $$


    where $N_{\rm target}$ is the number of target nuclear species atoms and $N_{\rm
    total}$ is the total atom count in the converter.


    This fraction enters the calculation of the total reactive nucleus inventory together
    with the [nuclear number density](name:nuclear_density_of_neutron_detector_converter)
    and the [converter volume](name:volume_of_neutron_detector_converter), and it
    scales the [nuclear reaction rate per unit volume](name:nuclear_rate_of_neutron_detector_converter)
    proportionally. Converters fabricated from isotopically enriched materials have
    values approaching 1, while natural-abundance converter materials may exhibit
    significantly lower fractions depending on the isotope''s natural abundance. The
    [normalized atomic count](name:nuclear_target_atomic_fraction_of_neutron_detector_converter)
    provides a complementary dimensionless measure of the reactive nucleus inventory
    integrated over the full detector assembly.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:nuclear_rate_of_neutron_detector_converter
  arguments:
  - name: target_atomic_fraction_of_neutron_detector_converter
    operator: nuclear
    operator_kind: qualifier
  sources:
  - id: dd:neutron_diagnostic/detector/nuclei_n
    dd_path: neutron_diagnostic/detector/nuclei_n
    status: composed
- name: line_averaged_argon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of argon ions along a chord through the
    plasma, obtained by dividing the path integral of the local argon ion density
    by the chord length.
  documentation: 'Line-averaged argon density is the chord-averaged number density
    of argon ions along a line of sight through the plasma. The local argon ion density
    is understood as the sum over argon ionization stages, so the line average represents
    the effective argon ion content sampled by the chord.


    The line average is defined by normalizing the line-integrated density by the
    chord length through the plasma:


    $$

    \langle n_{\mathrm{Ar}} \rangle_L = \frac{1}{L}\int_{\mathrm{chord}} n_{\mathrm{Ar}}(l)\,dl

    $$


    where $l$ is distance along the chord in meters, $L$ is the chord length through
    the plasma in meters, and $n_{\mathrm{Ar}}(l)$ is the local argon ion number density
    in $m^{-3}$. The integral has units of $m^{-2}$, and division by $L$ gives a line-averaged
    density in $m^{-3}$.


    In practice this quantity is obtained by first converting calibrated diagnostic
    signals to an argon density line integral, using the appropriate atomic physics,
    instrument response, and plasma-parameter modeling for the measurement. Raw brightness,
    spectral intensity, or other chord-integrated signals are not themselves line-averaged
    density; they must be interpreted as or transformed into $\int n_{\mathrm{Ar}}
    dl$ before normalization by the effective chord length.


    Typical values are about $10^{14}-10^{16}\ m^{-3}$ for trace argon concentrations,
    $10^{16}-10^{18}\ m^{-3}$ during deliberate argon seeding or impurity transport
    studies, and can approach $10^{19}\ m^{-3}$ transiently during strong gas injection
    or disruption-mitigation scenarios.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:argon_density
  - name:volume_averaged_argon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_effective_charge
  arguments:
  - name: argon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/argon/value
    dd_path: summary/line_average/n_i/argon/value
    status: composed
- name: line_averaged_boron_density
  kind: scalar
  status: draft
  description: Line-averaged number density of boron ions along a diagnostic chord,
    obtained by dividing the path integral of the local boron ion density by the chord
    length. Unless a charge state is specified separately, it represents the sum over
    boron ionization states.
  documentation: 'Line-averaged boron density is the chord average of the local boron
    ion number density along a specified line of sight. It characterizes the boron
    impurity content sampled by that chord rather than a local point value. Unless
    a charge state is specified separately, the local boron density represents the
    sum over boron ionization states, excluding neutral boron.


    For a chord of length $L$, the line average is defined by the path integral of
    the local boron ion density along arc length $l$:


    $$

    \bar{n}_B = \frac{1}{L}\int_0^L n_B(l)\,dl

    $$


    where $\bar{n}_B$ is the line-averaged boron density in m^-3, $n_B(l)$ is the
    local boron ion density in m^-3, $l$ is distance along the chord in m, and $L$
    is the total chord length in m. For charge-state-unresolved measurements, $n_B$
    is interpreted as the sum of the densities of the boron ionization states included
    in the plasma model.


    In practice this quantity is inferred from line-integrated spectroscopic information,
    such as absolutely calibrated boron line emission or charge-exchange recombination
    signals. The conversion from measured photons to boron density requires geometry,
    calibration, relevant atomic rate coefficients, local electron temperature and
    density information, and a collisional-radiative or ionization-balance model;
    tomographic or forward-modeling methods may be used when spatial variation along
    the chord is important.


    Typical line-averaged boron densities in magnetically confined plasmas are about
    10^15-10^18 m^-3, depending on wall conditioning, impurity sources, plasma density,
    and transport. Values may be lower in clean core plasmas and transiently higher
    near strong boron sources or during impurity injection.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:boron_density_at_magnetic_axis
  - name:boron_density_at_pedestal
  - name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  arguments:
  - name: boron_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/boron/value
    dd_path: summary/line_average/n_i/boron/value
    status: composed
- name: line_averaged_carbon_density
  kind: scalar
  status: draft
  description: Line-averaged carbon density is the total carbon number density, including
    neutral carbon through fully stripped C6+, averaged along a diagnostic line of
    sight. It equals the path integral of the summed local carbon charge-state densities
    divided by the chord length.
  documentation: 'Line-averaged carbon density quantifies the carbon impurity content
    sampled by a diagnostic chord. It is the chord average of the total local carbon
    number density, where total carbon includes neutral carbon and all ionization
    states through fully stripped carbon.


    The line average is defined by integrating the charge-state-summed carbon density
    along the chord:


    $$

    \bar{n}_C = \frac{1}{L}\int_0^L \left[n_{\mathrm{C^0}}(l) + \sum_{q=1}^{6} n_{\mathrm{C}^{q+}}(l)\right]
    \, dl

    $$


    where $\bar{n}_C$ is the line-averaged carbon density, $L$ is the chord length
    in meters, $l$ is distance along the line of sight in meters, $n_{\mathrm{C^0}}(l)$
    is the local neutral carbon density in m^-3, and $n_{\mathrm{C}^{q+}}(l)$ is the
    local density in m^-3 of carbon with charge state $q$.


    In practice this quantity is inferred from passive impurity spectroscopy, active
    charge-exchange recombination spectroscopy, or related line-emission measurements.
    The inference uses calibrated brightnesses together with viewing geometry, electron
    density and temperature, charge-state balance, and atomic rate coefficients to
    estimate the path-integrated total carbon density before division by the chord
    length.


    Typical line-averaged carbon densities are about $10^{17}-10^{18}$ m^-3 in plasmas
    with carbon plasma-facing components, and can be lower in devices with non-carbon
    walls or strong impurity screening. The same chord-averaging concept is used for
    [line_averaged_electron_density](name:line_averaged_electron_density) and impurity
    analogs such as [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)
    and [line_averaged_iron_density](name:line_averaged_iron_density); [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    is the corresponding volume average of the same total carbon density.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_carbon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  arguments:
  - name: carbon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/carbon/value
    dd_path: summary/line_average/n_i/carbon/value
    status: composed
- name: line_averaged_deuterium_density
  kind: scalar
  status: draft
  description: Chord-average of the deuterium ion number density along a diagnostic
    line of sight, equal to the path integral of the local deuterium density divided
    by the chord length.
  documentation: 'The line-averaged deuterium ion number density gives the mean deuterium
    particle density along a diagnostic chord through the plasma, providing a chord-path-weighted
    scalar measure of absolute deuterium content distinct from the isotopic fraction
    described by [volume_averaged_deuterium_fraction](name:ratio_of_deuterium_density_to_electron_density).


    The quantity is defined as:


    $$

    \bar{n}_D = \frac{1}{L} \int_0^L n_D(\ell) \, d\ell

    $$


    where $n_D(\ell)$ is the local deuterium ion number density in m$^{-3}$ at chord
    position $\ell$ and $L$ is the total chord length in m.


    It is typically inferred from interferometric phase-shift measurements combined
    with isotope-resolved spectroscopy sensitive to deuterium Balmer emission. It
    complements the volume-based [volume_averaged_deuterium_density](name:volume_averaged_deuterium_density)
    and analogous chord-averaged fuel densities such as [line_averaged_hydrogen_density](name:line_averaged_hydrogen_density)
    for protium and [line_averaged_helium_4_density](name:line_averaged_helium_4_density)
    for helium-4.


    Typical values range from $5 \times 10^{18}$ to $5 \times 10^{20}$ m$^{-3}$ in
    tokamak deuterium plasmas, scaling with the line-averaged electron density and
    the deuterium fuel fraction of the isotopic mix.


    Sign convention: Positive when deuterium ions are present in the plasma along
    the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
