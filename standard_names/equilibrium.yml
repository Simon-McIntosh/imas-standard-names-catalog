      unit: T
    enhanced_context:
      description: Reconstructed value of b field pol probe.
      kind: template
    semantic_facet: reconstructed
- name: poloidal_magnetic_flux_at_constraint_position
  kind: scalar
  status: active
  description: Value of the poloidal magnetic-flux function at a location where an
    equilibrium constraint is applied, identifying the magnetic flux surface passing
    through that location.
  documentation: 'Poloidal magnetic flux at a constraint position is the value of
    the equilibrium poloidal-flux function at a location designated for an equilibrium
    constraint. It identifies the magnetic flux surface passing through that location.


    For an axisymmetric equilibrium, the poloidal-flux function is defined by:


    $$

    \psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi$ is poloidal magnetic flux, $R$ and $R''$ are major-radius coordinates
    in m, $Z$ is vertical height in m, and $B_Z$ is the vertical magnetic-field component
    in the right-handed cylindrical $(R, \phi, Z)$ frame, with $\phi$ the toroidal
    angle. At the constraint location $(R_c,Z_c)$, the value is $\psi(R_c,Z_c)$.


    This locus-specific value complements [poloidal magnetic flux at a flux surface](name:poloidal_magnetic_flux_at_flux_surface)
    and differs from the reference value at [the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis).


    Sign convention: Positive when the vertical magnetic field on the integration
    disk points in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:poloidal_magnetic_flux_at_magnetic_axis
  sources:
  - dd_path: core_profiles/profiles_1d/grid/psi_boundary
