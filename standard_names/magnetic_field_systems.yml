- name: current_of_passive_loop
  kind: scalar
  status: active
  description: Signed conventional electric current circulating in one axisymmetric
    passive conducting loop, induced by changing linked magnetic flux and electromagnetic
    coupling.
  documentation: 'This quantity is the conventional electric current circulating in
    a single passive conducting loop. It represents the electromagnetically induced
    response of the passive conductor to changing linked magnetic flux, including
    transients caused by changing plasma currents, active-coil currents, disruptions,
    and coupling to other conductors.


    For a passive loop with no separately applied circuit voltage, the linear circuit
    response is represented by


    $$

    \mathcal{R} I(t) + L\frac{dI(t)}{dt} = -\frac{d\Phi_{\rm ext}(t)}{dt}

    $$


    where $I(t)$ is the loop current, $\mathcal{R}$ is the loop resistance, $L$ is
    its self-inductance, $t$ is time, and $\Phi_{\rm ext}(t)$ is the externally linked
    magnetic flux, including mutual coupling and excluding flux generated by the loop''s
    own current. The negative sign expresses Lenz''s law.


    The quantity applies to one passive conducting loop and denotes its net circuit
    current, with all induced contributions aggregated into that loop current. It
    excludes current imposed by an external power supply and is distinct from the
    current carried by the plasma or by an actively driven coil. The loop-resolved
    current contributes to the net [current of a passive structure](name:current_of_passive_structure)
    when multiple passive conducting elements form one structure.


    The magnetic coupling and orientation of the loop are interpreted consistently
    with its [effective turn count](name:effective_turn_count_of_passive_loop), whose
    sign represents the element orientation relative to positive loop current.


    Sign convention: Positive when conventional current circulates in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:effective_turn_count_of_passive_loop
  sources:
  - dd_path: pf_passive/loop/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_passive.html#pf_passive-loop-current
    dd_documentation:
      leaf: Passive loop current
      parent_path: pf_passive/loop
      parent: Passive axisymmetric conductor description in the form of non-connected
        loops; any connected loops are expressed as active coil circuits with no power
        supply attached.
      data_type: FLT_1D
      unit: A
      coordinates:
      - pf_passive/time
      - pf_passive/loop/time
    enhanced_context:
      description: Induced current flowing in a passive conducting loop as a function
        of time. Arises from inductive coupling during plasma current changes, active
        coil transients, and disruptions, and plays a key role in vertical stability.
      kind: llm
- name: effective_turn_count_of_coil_conductor_element
  kind: scalar
  status: active
  description: Signed effective winding count used to weight the magnetic-field contribution
    of an individual poloidal-field coil conductor element.
  documentation: "The effective turn count is the signed winding multiplicity assigned\
    \ to one poloidal-field coil conductor element for calculating its contribution\
    \ to the plasma magnetic field. Its magnitude represents the effective number\
    \ of turns attributed to that element, while its sign represents winding orientation.\n\
    \nThis quantity applies to an individual conductor element and is not the total\
    \ turn count of a complete coil or coil system. It is an effective electromagnetic\
    \ contribution rather than a purely geometric count of visible conductor revolutions,\
    \ and it excludes the separate winding counts of magnetic-field probe coils.\n\
    \nFor a fixed element current and geometry, the element\u2019s magnetic-field\
    \ contribution scales with its effective turn count; reversing the count reverses\
    \ the corresponding field contribution. The same signed-winding concept is used\
    \ for a [poloidal magnetic-field probe turn count](name:turn_count_of_poloidal_magnetic_field_probe)\
    \ and a [toroidal magnetic-field probe turn count](name:turn_count_of_toroidal_magnetic_field_probe),\
    \ although this quantity applies specifically to a poloidal-field coil conductor\
    \ element."
  unit: '1'
  physics_domain: magnetic_field_systems
  links:
  - name:turn_count_of_poloidal_magnetic_field_probe
  - name:turn_count_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: pf_active/coil/element/turns_with_sign
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-turns_with_sign
    dd_documentation:
      leaf: Number of effective turns in the element for calculating magnetic fields
        of the coil/loop; includes the sign of the number of turns (positive means
        current is counter-clockwise when seen from above)
      parent_path: pf_active/coil/element
      parent: Each PF coil is comprised of a number of cross-section elements described  individually
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Effective number of turns in a PF coil element for magnetic field
        calculations, including a sign indicating current winding direction (positive
        = counter-clockwise when viewed from above). Used to compute the coil's contribution
        to the poloidal field.
      kind: llm
- name: effective_turn_count_of_passive_loop
  kind: scalar
  status: active
  description: Effective turn count of a passive loop is the signed number of equivalent
    windings assigned to a passive conducting loop for electromagnetic coupling. It
    weights the passive-loop current contribution and may be fractional for equivalent
    or homogenized loop elements.
  documentation: 'Effective turn count of a passive loop is the signed number of equivalent
    windings assigned to a passive conducting loop for electromagnetic coupling. It
    may be fractional when the represented conductor is an equivalent or homogenized
    passive-loop element rather than a literal winding.


    The signed current-turn source strength represented by the passive loop is defined
    by:


    $$

    \mathcal{I}_{\mathrm{loop}} = N_{\mathrm{eff}} I_{\mathrm{loop}}

    $$


    where $\mathcal{I}_{\mathrm{loop}}$ is the signed current-turn source strength
    of the passive loop, $N_{\mathrm{eff}}$ is the effective turn count of the passive
    loop, and $I_{\mathrm{loop}}$ is the [current of the passive loop](name:current_of_passive_loop).


    This quantity applies to the represented passive loop or passive-loop element
    as one electromagnetic circuit contribution. It has no implicit aggregation over
    multiple passive loops; if several represented windings or conductor pieces are
    collapsed into one loop element, their net orientation and coupling are represented
    by the single algebraic value of $N_{\mathrm{eff}}$.


    It is distinct from the [current of the passive loop](name:current_of_passive_loop),
    which is multiplied by $N_{\mathrm{eff}}$, and from the [area of the passive loop](name:area_of_passive_loop),
    which describes conductor cross section. It is not a turn count for magnetic probes,
    coil conductor elements, toroidal-field coils, or magnetic field-line winding.'
  unit: '1'
  physics_domain: magnetic_field_systems
  links:
  - name:turn_count_of_poloidal_magnetic_field_probe
  - name:turn_count_of_toroidal_magnetic_field_probe
  - name:effective_turn_count_of_coil_conductor_element
  sources:
  - dd_path: pf_passive/loop/element/turns_with_sign
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_passive.html#pf_passive-loop-element-turns_with_sign
    dd_documentation:
      leaf: Number of effective turns in the element for calculating magnetic fields
        of the coil/loop; includes the sign of the number of turns (positive means
        current is counter-clockwise when seen from above)
      parent_path: pf_passive/loop/element
      parent: Each loop is comprised of a number of cross-section elements described  individually
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Number of effective turns (with sign) in a passive conductor loop
        element, used for computing its magnetic field contribution. Sign convention
        indicates current flow direction relative to the toroidal axis.
      kind: llm
- name: height_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Full vertical extent of the rectangular cross-section of one active\
    \ poloidal-field coil conductor, measured parallel to Z in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'This quantity is the complete vertical dimension of the rectangular
    cross-section of one active poloidal-field coil conductor. It describes the conductor
    geometry in the right-handed cylindrical $(R, \phi, Z)$ frame, with the vertical
    direction parallel to $Z$.


    The full height is the difference between the upper and lower vertical boundaries
    of the rectangle:


    $$

    h = Z_{\max} - Z_{\min}

    $$


    where $h$ is the full vertical height, $Z_{\max}$ is the vertical coordinate of
    the upper boundary, and $Z_{\min}$ is the vertical coordinate of the lower boundary.


    The quantity applies to the selected poloidal-field-coil conductor and its rectangular
    cross-section. It is a complete geometric extent for that member, not an average,
    sum, or aggregate over multiple coils or conductor elements. It is distinct from
    the radial cross-sectional extent represented by [width of a poloidal field coil](name:width_of_poloidal_field_coil)
    and from the cross-sectional area represented by [area of a poloidal field coil](name:area_of_poloidal_field_coil).


    For a rectangular cross-section, this height combines with the corresponding width
    to determine the conducting area represented by [area of a poloidal field coil](name:area_of_poloidal_field_coil);
    the height itself remains the vertical dimension rather than the full cross-sectional
    area.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  sources:
  - dd_path: pf_active/coil/element/geometry/rectangle/height
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-geometry-rectangle-height
    dd_documentation:
      leaf: Vertical full height
