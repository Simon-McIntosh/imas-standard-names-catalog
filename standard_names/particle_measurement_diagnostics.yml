- name: line_averaged_iron_density
  kind: scalar
  status: active
  description: Line-averaged iron density is the path-length mean of total iron impurity-ion
    number density, summed over Fe1+ through Fe26+.
  documentation: 'Line-averaged iron density is the chord-length mean of the total
    iron ion number density along a specified line of sight. It includes all ionization
    states from Fe$^{1+}$ through Fe$^{26+}$ and does not resolve their individual
    contributions.


    The line average is defined as


    $$

    n_{\mathrm{Fe,line}} = \frac{1}{L}\int_0^L n_{\mathrm{Fe}}(l)\,dl

    $$


    where $n_{\mathrm{Fe,line}}$ is the line-averaged density, $n_{\mathrm{Fe}}(l)$
    is the local iron ion number density at path coordinate $l$, and $L$ is the total
    chord length.


    The local quantity being averaged is the charge-state-summed [iron density](name:iron_density).
    This chord average is distinct from [line_averaged_argon_density](name:line_averaged_argon_density),
    which applies the same path averaging to argon ions, and from a volume-averaged
    iron density, which averages over a plasma volume rather than a line of sight.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
