- name: voltage_of_diagnostic_antenna
  kind: scalar
  status: draft
  description: Raw voltage reported by an electron-cyclotron-emission diagnostic antenna
    channel before calibration to radiation temperature. It is measured relative to
    an electronics reference and can include receiver gain, detector response, baseline
    offset, and readout polarity, so it is not by itself a strictly proportional measure
    of received power.
  documentation: 'Voltage of a diagnostic antenna is the uncalibrated electrical readout
    of an electron-cyclotron-emission radiometer channel associated with a receiving
    antenna band. It is the voltage after the receiver, detector, and readout electronics,
    measured relative to an electronics reference, before conversion to a calibrated
    radiation temperature.


    The channel affine calibration to [radiative_temperature](name:radiative_temperature)
    is written as:


    $$

    T_{\mathrm{rad}} = a_V\,(V - V_{\mathrm{ref}}) + T_{\mathrm{ref}}

    $$


    where $V$ is the raw channel voltage in volts, $V_{\mathrm{ref}}$ is the electronics
    reference or baseline voltage in volts, $a_V$ is the channel calibration coefficient
    in temperature units per volt, and $T_{\mathrm{ref}}$ is an additive temperature
    offset in the same unit as $T_{\mathrm{rad}}$.


    In a heterodyne radiometer, this quantity denotes the detected video-bandwidth
    voltage formed after microwave mixing, intermediate-frequency filtering, and detection;
    in a direct-detection radiometer, it denotes the detector video voltage. It is
    not the microwave electric-field waveform at the antenna terminals. Interpreting
    the calibrated signal as a local electron temperature also requires the calibrated
    [frequency_of_diagnostic_antenna](name:frequency_of_diagnostic_antenna), the relevant
    cyclotron harmonic and polarization, viewing geometry, magnetic-field information
    along the line of sight, and an assessment that the emission is sufficiently optically
    thick.


    Typical magnitudes for detected ECE video outputs are instrument dependent and
    are often about 0.001-1 V during normal operation. Offsets, receiver gain, detector
    type, bandwidth, and digitizer scaling can shift the recorded baseline or full-scale
    value outside this range, so the calibrated temperature relation carries the physical
    interpretation rather than the raw voltage alone.


    Sign convention: Positive when the channel readout, with its assigned electronics
    polarity, is above the electronics reference level.'
  unit: V
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radiative_temperature
  - name:frequency_of_diagnostic_antenna
  - name:voltage_of_spectrometer
- name: voltage_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Calibrated peak amplitude of the narrow-band microwave voltage at a
    reflectometer antenna terminal or electrical reference plane. It is a generic
    terminal quantity, not necessarily the isolated plasma-reflected component.
  documentation: 'Voltage of a reflectometer antenna is the calibrated peak amplitude
    of the narrow-band microwave voltage at the antenna terminal or another specified
    electrical reference plane. As a generic terminal quantity it can include launched-wave
    leakage, plasma-reflected or scattered signal, antenna coupling, standing-wave
    effects, and receiver response unless the reflected component has been separated
    explicitly. This distinguishes it from [reflected_voltage_of_reflectometer_antenna](name:reflected_voltage_of_reflectometer_antenna)
    and reflected_wave_voltage_of_reflectometer_antenna_amplitude, which refer specifically
    to reflected-wave quantities.


    For a narrow-band signal represented by a complex voltage phasor, the antenna
    voltage is the phasor peak magnitude:


    $$

    v(t) = \Re\{\tilde V(t)\,e^{-i\omega_0 t}\}, \qquad V_\mathrm{ant}(t) = |\tilde
    V(t)|

    $$


    where $v(t)$ is the real microwave voltage waveform, $\tilde V(t)$ is the slowly
    varying complex voltage phasor at the reference plane, $\omega_0$ is the carrier
    angular frequency, and $V_\mathrm{ant}$ is the reported voltage amplitude. For
    a pure sinusoid, the corresponding RMS value would be $V_\mathrm{ant}/\sqrt{2}$;
    the quantity defined here follows the peak-amplitude convention used for RF voltage
    amplitude.


    In practice the voltage is obtained from a homodyne or heterodyne reflectometer
    receiver by down-converting the microwave carrier, calibrating gain and attenuation,
    and forming the amplitude from the in-phase and quadrature components, commonly
    as $|\tilde V|=\sqrt{I^2+Q^2}$ after calibration. Interpreting this voltage as
    a plasma-reflected signal requires additional separation or normalization, such
    as directional coupling, background subtraction, reference measurements, or complex
    reflection-coefficient calibration. By itself it is not a cutoff position, density
    measurement, or reflection coefficient.


    Typical calibrated amplitudes are strongly receiver dependent. Usable processed
    signal levels are often about $10^{-4}$-$1$ V at an electrical reference plane,
    while antenna-plane values can differ substantially because of cable loss, coupling,
    attenuation, and receiver gain.'
  unit: V
  physics_domain: electromagnetic_wave_diagnostics
  links: []
- name: wave_phase_of_wave_beam
  kind: scalar
  status: draft
  description: Angular phase of the complex envelope of a probing wave beam at a specified
    point along its propagation path. Its absolute zero is set by a chosen phase reference;
    only phase differences, such as a launch-referenced phase shift, are directly
    observable.
  documentation: 'Wave phase of a wave beam is the angular argument of the beam''s
    complex signal envelope. It is an angular quantity modulo one full cycle, with
    an arbitrary zero set by the chosen phase reference, and should be distinguished
    from a launch-referenced phase difference or from an unwrapped continuous phase
    trace.


    The eikonal accumulation of beam phase along a ray or beam centerline can be represented
    by:


    $$

    \phi_\mathrm{beam}(s)=\phi_\mathrm{ref}+\int_{s_\mathrm{ref}}^{s} k_s(\ell)\,d\ell

    $$


    where $\phi_\mathrm{beam}$ and $\phi_\mathrm{ref}$ are phases in rad, $s$ and
    $\ell$ are path lengths in m, and $k_s$ is the component of the local wave vector
    along the propagation path in rad m$^{-1}$. Equivalently, $k_s$ may be written
    as $k_0 n_\mathrm{eff}$, where $k_0$ is the vacuum wave number in rad m$^{-1}$
    and $n_\mathrm{eff}$ is the effective refractive index along the beam path.


    In interferometry and refractometry, receivers generally determine a phase relative
    to a launch signal or local oscillator rather than an absolute phase with a universal
    zero. When the reference is the launched wave phase, the observable is the launch-referenced
    phase difference $\Delta\phi_\mathrm{launch}=\phi_\mathrm{beam}-\phi_\mathrm{launch}$,
    represented by [difference_of_wave_phase_and_launched_wave_phase_of_wave_beam](name:wave_phase_of_wave_beam).
    Measured phases are often wrapped modulo $2\pi$; an unwrapped or fringe-jump-corrected
    phase is a continuous branch obtained by adding integer multiples of $2\pi$ rad
    and is a representation of the same angular phase evolution.


    Typical reported wrapped phases lie within a chosen $2\pi$ rad interval, commonly
    $-\pi$ to $\pi$ rad or $0$ to $2\pi$ rad. Unwrapped accumulated phase has no universal
    range: useful excursions can be fractions of a radian for weak perturbations or
    many $2\pi$ rad cycles for long paths, high frequency, or strongly refracting
    plasmas. Conversion from phase to line-integrated plasma properties requires the
    wave frequency, polarization, propagation path, and refractive-index model.


    Sign convention: Positive when the complex envelope, written as $A=|A|\exp(i\phi)$,
    is rotated counterclockwise from the chosen phase reference in the complex plane.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - id: dd:interferometer/channel/wavelength/phase_corrected
    dd_path: interferometer/channel/wavelength/phase_corrected
    status: composed
  - id: dd:refractometer/channel/bandwidth/phase
    dd_path: refractometer/channel/bandwidth/phase
    status: attached
  - id: dd:refractometer/channel/phase
    dd_path: refractometer/channel/phase
    status: attached
- name: width_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Full aperture width of a reflectometer antenna along one transverse
    dimension of the local orthogonal (X1, X2) antenna frame, applicable when the
    aperture is described by a rectangular geometry.
  documentation: "The width characterizes the physical extent of a reflectometer antenna\
    \ aperture along one of the two transverse axes of the local orthogonal (X1, X2)\
    \ frame used to describe the antenna geometry. It applies to both emission and\
    \ detection antennas in reflectometry diagnostics and is defined when the aperture\
    \ shape is rectangular; a companion dimension specifies the orthogonal transverse\
    \ extent.\n\nFor a rectangular aperture, the width $d$ along each transverse axis\
    \ governs the far-field beam divergence, with the diffraction half-angle scaling\
    \ as $\\theta \\approx \\lambda / d$, where $\\lambda$ is the probing wavelength.\
    \ Larger apertures produce more collimated beams and sharper spatial localization\
    \ of the reflection layer along the probing path. The aperture geometry is complemented\
    \ by the outline vertex coordinates [x1_coordinate_of_reflectometer_antenna](name:x1_coordinate_of_reflectometer_antenna)\
    \ and [x2_coordinate_of_reflectometer_antenna](name:x2_coordinate_of_reflectometer_antenna),\
    \ which define the full aperture shape. The analogous quantity for optical focusing\
    \ elements is [optical_element_width](name:optical_element_width).\n\nThis is\
    \ a fixed hardware parameter set by the physical waveguide or horn antenna dimensions\
    \ at the diagnostic port. It is used in beam characterization models to compute\
    \ antenna radiation patterns and to assess spatial resolution for density profile\
    \ or fluctuation measurements. Typical aperture widths for fusion microwave reflectometer\
    \ antennas range from about 1\u201320 cm, depending on the probing frequency band\
    \ (typically 15\u2013150 GHz) and the waveguide standard employed.\n\nSign convention:\
    \ Positive for all physically realizable apertures; the width is a non-negative\
    \ spatial extent that does not depend on the orientation of the ambient coordinate\
    \ system."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:x1_coordinate_of_reflectometer_antenna
  - name:x2_coordinate_of_reflectometer_antenna
  - name:optical_element_width
