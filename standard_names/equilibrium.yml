- name: poloidal_magnetic_flux_at_magnetic_axis
  kind: scalar
  status: draft
  description: Reference value of the equilibrium poloidal flux at the innermost closed
    flux surface where the poloidal flux gradient vanishes.
  documentation: 'Poloidal magnetic flux at the magnetic axis is the value of the
    equilibrium flux function on the innermost closed magnetic surface. It provides
    the inner reference for the flux-surface label [poloidal magnetic flux](name:poloidal_magnetic_flux),
    while [poloidal magnetic flux at plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary)
    provides the corresponding outer reference.


    For an axisymmetric equilibrium in the right-handed cylindrical $(R, \phi, Z)$
    frame, the flux at the magnetic-axis location $(R_\mathrm{ax}, Z_\mathrm{ax})$
    may be written as


    $$

    \psi_\mathrm{ax} = \psi(R_\mathrm{ax}, Z_\mathrm{ax}) = \int_0^{R_\mathrm{ax}}
    B_Z(R'', Z_\mathrm{ax})\,2\pi R''\,dR''

    $$


    where $\psi$ is the poloidal magnetic flux function, $R_\mathrm{ax}$ is the major
    radius of the magnetic axis, $Z_\mathrm{ax}$ is its vertical coordinate, and $B_Z$
    is the [vertical magnetic field](name:vertical_magnetic_field). The magnetic axis
    is identified by $\nabla\psi = 0$, so this value is an extremum of the flux function
    in a nested-surface equilibrium.


    The value is obtained from magnetic-equilibrium reconstruction constrained by
    magnetic probes, flux loops, polarimetry, and motional-Stark-effect measurements.
    In present tokamaks, the boundary-to-axis flux difference commonly spans 1-20
    Wb; the absolute axis value depends on the chosen flux gage and the sign of the
    equilibrium field configuration. Its radial variation is tied to the [poloidal
    magnetic field](name:poloidal_magnetic_field), since flux-surface spacing determines
    the local poloidal field strength.


    Sign convention: Positive when the vertical magnetic field integrated over the
    horizontal disk bounded by the circular contour through the magnetic axis points
    in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:vertical_magnetic_field
  - name:poloidal_magnetic_field
  sources:
  - id: dd:core_profiles/profiles_1d/grid/psi_magnetic_axis
    dd_path: core_profiles/profiles_1d/grid/psi_magnetic_axis
    status: composed
