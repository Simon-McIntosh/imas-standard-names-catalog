- name: toroidal_oxygen_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal component of the bulk oxygen impurity ion flow velocity evaluated
    at the magnetic axis, the innermost confined-plasma point where the poloidal magnetic
    flux gradient vanishes.
  documentation: 'The toroidal velocity of oxygen impurity ions at the magnetic axis
    characterizes the azimuthal rotation of this impurity species at the plasma core.
    Oxygen co-rotates with the bulk plasma to leading order, with departures driven
    by neoclassical poloidal friction, charge-exchange coupling to neutrals, and momentum-transport
    processes that create radial gradients between the axis and the boundary.


    The toroidal component is the projection of the oxygen ion fluid velocity onto
    the $\hat{\phi}$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,\mathrm{O}} = \mathbf{v}_{\mathrm{O}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{O}}$ is the oxygen ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    The primary measurement technique is charge exchange recombination spectroscopy,
    where the Doppler shift of an oxygen emission line is used to infer the ion flow
    velocity along the diagnostic line of sight; decomposition to the toroidal component
    requires knowledge of the viewing geometry. The on-axis value represents the innermost
    point of the rotation profile and is related to but distinct from [toroidal_oxygen_velocity_at_plasma_boundary](name:toroidal_oxygen_velocity_at_plasma_boundary),
    with the radial structure governed by momentum transport. Analogous on-axis toroidal
    velocities for other impurity species are [toroidal_carbon_velocity_at_magnetic_axis](name:toroidal_carbon_velocity_at_magnetic_axis)
    and [toroidal_nitrogen_velocity_at_magnetic_axis](name:toroidal_nitrogen_velocity_at_magnetic_axis).


    Sign convention: Positive when the oxygen ion flow is directed in the direction
    of increasing toroidal angle $\phi$, which is counter-clockwise when viewed from
    the $+\hat{Z}$ direction.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_oxygen_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_magnetic_axis
  - name:toroidal_nitrogen_velocity_at_magnetic_axis
