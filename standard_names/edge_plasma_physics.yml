- name: vertical_component_of_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Projection of the ion-neutral friction current density onto the vertical
    $\hat{Z}$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame, quantifying
    the $Z$-component of charge current driven by collisional momentum exchange between
    ions and neutrals in the edge plasma.
  documentation: "In partially ionized edge and divertor plasmas, collisional friction\
    \ between ions and neutral particles (via charge-exchange and elastic collisions)\
    \ generates a current density vector $\\mathbf{j}_{\\rm in}$. The vertical component\
    \ extracts the $Z$-directed projection $j_{\\rm in,Z} = \\mathbf{j}_{\\rm in}\
    \ \\cdot \\hat{Z}$, where $\\hat{Z}$ is the unit vector along the machine symmetry\
    \ axis in the right-handed cylindrical $(R, \\phi, Z)$ frame with $R$ the major\
    \ radius and $Z$ the vertical height. This component captures vertical charge\
    \ transport driven by frictional momentum exchange and is physically relevant\
    \ near X-points and divertor targets where strong vertical gradients and neutral\
    \ recycling occur. It complements the [toroidal component](name:toroidal_component_of_current_density_due_to_ion_neutral_friction)\
    \ and [parallel component](name:parallel_component_of_current_density_due_to_ion_neutral_friction)\
    \ of the same current, together with which it fully resolves the vector [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction).\
    \ Related divergence-driven current contributions in the edge include the [Pfirsch-Schl\xFC\
    ter current density](name:pfirsch_schlueter_current_density) and the [poloidal\
    \ component of the current density due to parallel viscosity](name:poloidal_component_of_current_density_due_to_parallel_viscosity).\
    \ Computed from multi-fluid or fluid-neutral edge transport codes on unstructured\
    \ grids; magnitudes are typically in the range $10^{3}$\u2013$10^{6}$ A m$^{-2}$\
    \ in divertor and recycling regions.\n\nSign convention: Positive when $j_{\\\
    rm in,Z}$ points in the direction of increasing $Z$ (upward along the machine\
    \ symmetry axis)."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_component_of_current_density_due_to_ion_neutral_friction
  - name:parallel_component_of_current_density_due_to_ion_neutral_friction
  - name:current_density_due_to_ion_neutral_friction
  - name:pfirsch_schlueter_current_density
  - name:poloidal_component_of_current_density_due_to_parallel_viscosity
  constraints: []
  arguments:
