name: electron_scrape_off_layer_heat_flux_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the electron heat flux mapped to the
  outboard midplane in the scrape-off layer.
documentation: "The electron heat-flux decay length $\\lambda_{q,e}$ (in m) is the\
  \ radial e-folding distance over which the parallel electron heat flux $q_{\\|,e}$\
  \ decreases in the scrape-off layer (SOL), measured at the outboard midplane. It\
  \ governs the peak heat-flux footprint on plasma-facing components and is a critical\
  \ parameter for divertor design. In H-mode tokamaks $\\lambda_{q,e}$ is typically\
  \ 1\u201310 mm at the midplane and scales inversely with plasma current; empirical\
  \ multi-machine scalings (Eich scaling) give $\\lambda_q \\propto B_{\\mathrm{pol}}^{-1.19}$,\
  \ where $B_{\\mathrm{pol}}$ is the poloidal magnetic field at the outboard midplane.\
  \ The quantity is inferred from infrared thermography of divertor targets, Langmuir\
  \ probes, or reciprocating probes, combined with magnetic flux expansion to map\
  \ back to the midplane. For ITER, projected values are $\\sim$1 mm, posing a significant\
  \ engineering challenge. See also `ion_heat_flux_decay_length_in_scrape_off_layer`\
  \ and `electron_temperature_decay_length_in_scrape_off_layer`."
