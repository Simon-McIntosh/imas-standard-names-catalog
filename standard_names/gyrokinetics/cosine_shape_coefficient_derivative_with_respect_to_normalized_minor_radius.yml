name: cosine_shape_coefficient_derivative_with_respect_to_normalized_minor_radius
status: draft
cocos_transformation_type: one_like
description: Radial derivative of the cosine Fourier shape coefficients $c_n$ of the
  flux-surface boundary with respect to the normalized minor radius $\hat{r} = r/a$.
documentation: In the Miller-type or general Fourier parameterization of a flux-surface
  cross section, the boundary is expanded as $R(\theta) = R_0 + \sum_n c_n \cos(n\theta)
  + s_n \sin(n\theta)$, where $R_0$ is the geometric center major radius, $\theta$
  is the geometric poloidal angle, $c_n$ are cosine (even) shape coefficients, and
  $s_n$ are sine (odd) shape coefficients. The quantity $dc_n/d\hat{r}$, where $\hat{r}
  = r_{\mathrm{minor}}/a$ is the minor radius normalized to the last closed flux surface
  half-width $a$, encodes how the cosine harmonic content of the flux-surface shape
  varies radially and enters the local magnetic geometry specification required by
  gyrokinetic codes such as GS2, GENE, and CGYRO for computing metric coefficients
  and curvature drives. Typical values are of order unity for the leading harmonics
  ($n = 0, 1, 2$) in shaped tokamak equilibria; higher harmonics and their derivatives
  decay rapidly. This derivative, together with the companion sine derivative, fully
  determines the radial variation of shaping needed for local flux-tube simulations.
  See also the normalized pressure gradient and the safety factor profile that complete
  the local equilibrium input set.
