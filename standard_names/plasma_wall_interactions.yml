      parent_path: camera_ir/channel/camera/frame/region_of_interest
      parent: Set of regions of interest for the real-time monitoring of machine protection.
        Regions of interest are defined by a combination of polygons for each image
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Emissivity of a defined region of interest (ROI) within an IR camera
        frame, characterizing the surface thermal emission properties of plasma-facing
        components. Used in converting IR camera radiance measurements to surface
        temperatures.
      kind: llm
- name: surface_temperature
  kind: scalar
  status: active
  description: Surface temperature is the thermodynamic temperature of the exposed
    material boundary of a plasma-facing component at a specified surface point. It
    refers to the surface material state, not to an area aggregate or regional extremum.
  documentation: 'Surface temperature is the thermodynamic temperature of the material
    at the exposed boundary of a plasma-facing component. It is a local scalar assigned
    to a specified material surface point and time, representing the state of the
    surface material rather than the temperature of the adjacent plasma, sheath, neutral
    gas, or radiation field.


    For an extended exposed surface, the unqualified quantity denotes the local point
    value at each surface point, not an area average, integral, percentile, or extremum.
    Region-level aggregates require distinct standard names; the maximum over a specified
    exposed surface region is [maximum_surface_temperature](name:maximum_surface_temperature).
    [temperature_at_wall](name:temperature_at_wall) is the corresponding boundary-locus
    temperature when the wall is the defining locus.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:maximum_surface_temperature
  sources:
  - dd_path: camera_ir/channel/camera/frame/apparent_temperature
    dd_version: 4.1.0
