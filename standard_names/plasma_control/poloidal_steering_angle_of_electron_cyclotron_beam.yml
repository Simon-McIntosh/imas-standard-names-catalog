name: poloidal_steering_angle_of_electron_cyclotron_beam
status: draft
cocos_transformation_type: one_like
description: Poloidal steering angle of the movable mirror in an EC launcher, controlling
  the vertical aiming of the microwave beam.
documentation: "The poloidal steering angle $\\alpha_{\\rm pol}$ defines the tilt\
  \ of the EC launcher mirror in the poloidal plane and is the primary actuator for\
  \ shifting the beam deposition radially across flux surfaces. Together with the\
  \ toroidal steering angle, it fully specifies the beam trajectory from the launcher\
  \ port to the absorption layer at $\\omega = n \\omega_{ce}$ (where $\\omega_{ce}\
  \ = eB/m_e$ is the electron cyclotron frequency and $n$ the harmonic number). Typical\
  \ poloidal steering ranges are $\\pm 15\xB0$\u2013$30\xB0$ depending on launcher\
  \ geometry; real-time feedback adjusts $\\alpha_{\\rm pol}$ for NTM suppression\
  \ by targeting rational surfaces ($q = 3/2$, $2/1$). In the pulse-schedule framework\
  \ this value is the reference waveform the control system tracks. See also the toroidal\
  \ steering angle and the beam deposition location references."
