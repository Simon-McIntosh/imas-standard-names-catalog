- name: major_radius_of_rectangle_geometry
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the geometric center of a rectangular
    cross-section element, measured as the perpendicular distance from the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The major radius $R$ locates the geometric center of a rectangular
    cross-section element in the poloidal plane, defined as the perpendicular distance
    from the machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R \geq 0$ by construction. Rectangular cross-sections are commonly
    used to model conductors such as poloidal-field coil elements, passive conducting
    structures, iron-core segments, and antenna straps, where the element geometry
    is approximated by a rectangle defined by its center coordinates $(R, Z)$ and
    its half-widths. Together with the paired vertical coordinate [vertical_coordinate_of_rectangle_center](name:vertical_coordinate_of_rectangle_center),
    this quantity fully specifies the in-plane center position; the same convention
    applies to [major_radius_of_annulus_geometry](name:major_radius_of_annulus_geometry)
    and [major_radius_of_oblique_geometry](name:major_radius_of_oblique_geometry)
    for other cross-section shapes. Typical values range from tenths of a meter to
    several meters, depending on the device size and radial location of the component.


    Sign convention: Positive when $R$ is measured outward from the machine symmetry
    axis, which is always the case for a valid cylindrical $R$ coordinate.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_rectangle_center
  - name:major_radius_of_annulus_geometry
  - name:major_radius_of_oblique_geometry
  constraints: []
  sources:
