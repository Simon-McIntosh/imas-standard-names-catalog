- name: parallel_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Gyrobohm-normalized parallel component of the total (species-summed)
    toroidal angular momentum flux driven by fluctuations in the perturbed parallel
    magnetic field delta B_parallel, flux-surface and time-averaged in the rotating
    frame. The parallel component is the projection of the momentum flux vector onto
    the local magnetic field unit vector b-hat.
  documentation: "The parallel component $\\Pi^{\\delta B_\\parallel}_{\\parallel}$\
    \ is the projection of the total (species-summed) toroidal angular momentum flux\
    \ vector onto the equilibrium magnetic field unit vector $\\hat{b}$. This component\
    \ arises from compressional magnetic perturbations $\\delta B_\\parallel = \\\
    hat{b} \\cdot \\delta\\vec{B}$, which modify the magnetic mirror force and the\
    \ pressure-driven drifts, thereby coupling to the parallel momentum of all plasma\
    \ species.\n\nThe normalized flux is defined as\n$$\\tilde{\\Pi}^{\\delta B_\\\
    parallel}_{\\parallel} = \\frac{\\Pi^{\\delta B_\\parallel}_{\\parallel}}{\\Pi_{\\\
    mathrm{gB}}},$$\nwhere the gyrobohm momentum-flux normalization scale is\n$$\\\
    Pi_{\\mathrm{gB}} = n_{\\mathrm{ref}}\\, m_{\\mathrm{ref}}\\, c_{s,\\mathrm{ref}}^2\
    \ \\left(\\frac{\\rho_{s,\\mathrm{ref}}}{L_{\\mathrm{ref}}}\\right)^2.$$\nHere\
    \ $n_{\\mathrm{ref}}$ is the reference density, $m_{\\mathrm{ref}}$ the reference\
    \ mass (typically the main-ion mass), $c_{s,\\mathrm{ref}} = \\sqrt{T_{\\mathrm{ref}}/m_{\\\
    mathrm{ref}}}$ the reference sound speed, $\\rho_{s,\\mathrm{ref}} = m_{\\mathrm{ref}}\
    \ c_{s,\\mathrm{ref}} / (e B_{\\mathrm{ref}})$ the reference sound Larmor radius,\
    \ and $L_{\\mathrm{ref}}$ the reference macroscopic length scale. The normalization\
    \ renders $\\tilde{\\Pi}^{\\delta B_\\parallel}_{\\parallel}$ dimensionless.\n\
    \nPhysically, $\\delta B_\\parallel$ perturbations alter the local magnetic field\
    \ strength and modify the mirror-force and $\\nabla B$-drift contributions to\
    \ the distribution function. The resulting species-summed parallel momentum flux\
    \ is obtained by integrating over the full $k_x$\u2013$k_y$ wavevector spectrum\
    \ from nonlinear gyrokinetic simulations and averaging over the flux surface and\
    \ the simulation time window in the co-moving (rotating) frame.\n\nThis quantity\
    \ represents the total plasma (all-species) result, in contrast to the ion-only\
    \ variant. The complementary decomposition separates momentum flux into contributions\
    \ from the perturbed electrostatic potential, the perturbed parallel magnetic\
    \ field $\\delta B_\\parallel$, and the perturbed parallel vector potential $\\\
    delta A_\\parallel$.\n\nTypical normalized values lie in the range $|\\tilde{\\\
    Pi}^{\\delta B_\\parallel}_{\\parallel}| \\lesssim 1$, though the $\\delta B_\\\
    parallel$ channel is generally sub-dominant compared to the electrostatic channel\
    \ except at high plasma beta $\\beta = 2\\mu_0 n T / B^2$.\n\nSign convention:\
    \ Positive when the flux transports toroidal angular momentum outward in the direction\
    \ of increasing major radius $R$ in the cylindrical $(R, \\phi, Z)$ frame, i.e.,\
    \ in the co-current direction away from the magnetic axis."
  unit: '1'
  physics_domain: gyrokinetics
