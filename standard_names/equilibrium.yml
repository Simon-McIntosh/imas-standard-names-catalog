- name: vertical_coordinate_of_active_limiter_point
  kind: scalar
  status: active
  description: "Signed vertical Z coordinate of the point where a limited plasma boundary\
    \ contacts the active limiter, expressed in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The active limiter point is the geometric contact point between
    a limited plasma boundary and the limiter. This quantity is the signed vertical
    coordinate of that point, rather than a coordinate of the limiter-tile outline.


    $$

    Z_{\mathrm{active}} = Z(\mathbf{x}_{\mathrm{active}})

    $$


    where $\mathbf{x}_{\mathrm{active}}$ is the active limiter-point position and
    $Z(\mathbf{x})$ is its vertical coordinate in the right-handed cylindrical $(R,
    \phi, Z)$ frame, whose basis is $(\hat{R}, \hat{\phi}, \hat{Z})$ with $\hat{R}
    \times \hat{\phi} = \hat{Z}$. The quantity applies only when the plasma is limited
    by an active limiter. It is distinct from the [vertical outline of the limiter
    tile](name:vertical_outline_of_limiter_tile) and from the [vertical coordinate
    of the plasma boundary](name:vertical_coordinate_of_plasma_boundary).


    Sign convention: Positive when the active limiter point lies in the $+Z$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_coordinate_of_plasma_boundary
  sources:
  - dd_path: plasma_transport/model/profiles_1d/neutral/state/momentum/flux_limiter/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/plasma_transport.html#plasma_transport-model-profiles_1d-neutral-state-momentum-flux_limiter-z
    dd_documentation:
      leaf: Component along the height axis, one scalar value is provided per element
        in the grid subset.
      parent_path: plasma_transport/model/profiles_1d/neutral/state/momentum/flux_limiter
      parent: Momentum flux limiter coefficient, on various grid subsets
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - 1...N
    enhanced_context:
      description: Vertical (Z) coordinate of flux limiter.
      kind: template
- name: vertical_coordinate_of_closest_wall_point
  kind: scalar
  status: active
  description: Signed vertical Z coordinate of the first-wall point with minimum geometric
    distance to the plasma boundary or separatrix in the right-handed cylindrical
    frame.
  documentation: 'This quantity is the vertical position of the first-wall location
    closest to the plasma boundary or separatrix. It identifies a wall point geometrically,
    rather than a point on the boundary itself or the [vertical coordinate of the
    plasma boundary](name:vertical_coordinate_of_plasma_boundary).


    $$

    \mathbf{p}_{\mathrm{fw}}=\underset{\mathbf{p}\in\mathcal{W}}{\operatorname{arg\,min}}\,d(\mathbf{p},\mathcal{B}),\qquad
    Z_{\mathrm{fw}}=Z(\mathbf{p}_{\mathrm{fw}})

    $$


    Here, $\mathcal{W}$ is the first-wall surface, $\mathcal{B}$ is the relevant plasma
    boundary or separatrix, $d$ is geometric distance, and $Z$ is vertical height
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $\phi$ is toroidal angle. The quantity is distinct from [gap at plasma boundary](name:gap_at_plasma_boundary),
    which gives the corresponding minimum separation rather than its vertical location.


    Sign convention: Positive when the closest first-wall point lies in the $+Z$ direction,
    above the machine midplane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
  - name:gap_at_plasma_boundary
  sources:
  - dd_path: disruption/halo_currents/active_wall_point/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-halo_currents-active_wall_point-z
    dd_documentation:
