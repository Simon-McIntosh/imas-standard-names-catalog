name: fusion_power
status: draft
description: Total thermal power released by nuclear fusion reactions in the plasma,
  obtained by integrating over all active reaction channels.
documentation: "The fusion power $P_{\\mathrm{fus}}$ (W) is the volume-integrated\
  \ rate of energy release from thermonuclear reactions, dominated in a burning plasma\
  \ by $\\mathrm{D}+\\mathrm{T}\\to\\alpha\\,(3.5\\,\\mathrm{MeV})+n\\,(14.1\\,\\\
  mathrm{MeV})$. It is related to the total neutron production rate $R_n$ (s$^{-1}$)\
  \ by $P_{\\mathrm{fus}}=E_{\\mathrm{fus}}\\,R_n$, where $E_{\\mathrm{fus}}=17.6$\
  \ MeV per D\u2013T reaction. In present-day deuterium experiments $P_{\\mathrm{fus}}$\
  \ is of order kW, whereas ITER targets $P_{\\mathrm{fus}}\\approx500$ MW with a\
  \ fusion gain $Q=P_{\\mathrm{fus}}/P_{\\mathrm{aux}}\\geq10$. The quantity is inferred\
  \ from calibrated neutron flux monitors (fission chambers, activation foils, diamond\
  \ detectors) and may also be evaluated from synthetic diagnostic forward models.\
  \ The alpha-heating fraction $f_\\alpha=E_\\alpha/E_{\\mathrm{fus}}=0.2$ for D\u2013\
  T directly couples $P_{\\mathrm{fus}}$ to the plasma energy balance. See `deuterium_tritium_fusion_power_density`\
  \ and `deuterium_deuterium_fusion_power_density` for the spatially resolved counterparts\
  \ and `heating_power_due_to_neutral_beam_injection` for the principal auxiliary\
  \ channel."
