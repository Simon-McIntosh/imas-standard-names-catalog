name: major_radius_of_halo_current_area_end_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the end point bounding the poloidal cross-sectional
  area through which halo currents flow during a disruption.
documentation: "The major radius $R_{\\mathrm{end}}$ (in meters) locates the terminal\
  \ point of the contour that delimits the halo-current-carrying area in the poloidal\
  \ $(R, Z)$ plane. During vertical displacement events (VDEs) and thermal/current\
  \ quenches, scrape-off-layer field lines intercept plasma-facing components, and\
  \ the resulting halo currents can carry 20\u201340% of the pre-disruption plasma\
  \ current $I_p$. The spatial extent of the halo region \u2014 bounded by this end\
  \ point and its companion start point \u2014 determines the wetted area and hence\
  \ the mechanical loads (torques and forces) on the first wall and divertor structures.\
  \ Typical $R_{\\mathrm{end}}$ values lie between the inner-wall radius and the outer\
  \ midplane radius of the device (e.g., 2.0\u20134.5 m for JET-class machines, 4.0\u2013\
  8.0 m for ITER). The halo-current area, together with the toroidal peaking factor,\
  \ feeds into electromagnetic force estimates via $\\mathbf{F} = \\int \\mathbf{J}_{\\\
  mathrm{halo}} \\times \\mathbf{B}\\,dV$, where $\\mathbf{J}_{\\mathrm{halo}}$ is\
  \ the halo current density (A m$^{-2}$) and $\\mathbf{B}$ is the local magnetic\
  \ field (T). The coordinate is obtained from MHD equilibrium reconstruction constrained\
  \ by in-vessel Rogowski coil, shunt, and tile-current measurements during the disruption\
  \ sequence. See also `major_radius_of_closest_wall_point` for the nearest first-wall\
  \ location."
