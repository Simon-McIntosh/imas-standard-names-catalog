name: counter_passing_fast_particle_toroidal_angular_momentum_source
status: draft
description: Volumetric source rate of toroidal angular momentum density for fast
  particles on counter-current passing orbits.
documentation: "This quantity $S_{L_\\phi}^{\\rm ctr}$ (in N/m\xB2) gives the rate\
  \ at which toroidal angular momentum density is injected into the counter-current\
  \ passing fast-particle sub-population per unit volume. In the orbit-topology decomposition\
  \ of the fast-ion distribution, counter-passing particles carry angular momentum\
  \ opposite to the plasma current direction. The magnitude of this source depends\
  \ on beam injection angle, ICRH antenna phasing, and the orbit topology in the given\
  \ equilibrium. For balanced or counter-NBI scenarios, $S_{L_\\phi}^{\\rm ctr}$ can\
  \ be comparable to the co-passing source, yielding near-zero net torque. Typical\
  \ values range from $10^{-2}$ to $10^{0}$ N/m\xB2 near the deposition region. Evaluated\
  \ by orbit-following Monte Carlo codes (NUBEAM, ASCOT, SPIRAL). See the co-current\
  \ counterpart `co_passing_fast_particle_toroidal_angular_momentum_source` and the\
  \ orbit-summed total `fast_particle_angular_momentum_toroidal_source`."
validity_domain: ''
