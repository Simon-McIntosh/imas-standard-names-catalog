- name: right_hand_circularly_polarized_wave_electric_field_imaginary_part
  kind: complex
  status: active
  description: Imaginary quadrature component of the complex E-minus wave electric-field
    phasor in the right-hand circular polarization basis.
  documentation: 'The imaginary quadrature coefficient is the component of the [right-hand
    circularly polarized wave electric field](name:right_hand_circularly_polarized_wave_electric_field)
    that is 90 degrees out of phase with its real component.


    $$

    E_{-,I} = \operatorname{Im}(\widetilde{E}_{-}), \qquad \widetilde{E}_{-} = E_{-,R}
    + iE_{-,I}

    $$


    Here, $\widetilde{E}_{-}$ is the complex E-minus phasor, $E_{-,I}$ is its imaginary
    quadrature coefficient, $E_{-,R}$ is its real coefficient, and $i$ is the imaginary
    unit. The decomposition uses the adopted time-harmonic phasor convention; the
    imaginary coefficient is not the field magnitude and must be combined with the
    real component to recover the phasor amplitude and phase. The corresponding [real
    part](name:right_hand_circularly_polarized_wave_electric_field_real_part) provides
    the in-phase coefficient.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
