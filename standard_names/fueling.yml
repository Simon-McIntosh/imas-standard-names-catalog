- name: toroidal_component_of_shattered_pellet_velocity
  kind: scalar
  status: draft
  description: Projection of the shattered pellet injector (SPI) pellet center-of-mass
    velocity onto the toroidal direction $\hat{\phi}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  documentation: 'The toroidal velocity component $v_\phi$ quantifies how fast the
    SPI pellet''s center-of-mass moves along the toroidal direction $\hat{\phi}$ as
    it travels through the plasma vessel before and during the shattering event. It
    is the $\hat{\phi}$-projection of the full velocity vector described by [shattered_pellet_velocity](name:shattered_pellet_velocity),
    i.e. $v_\phi = \mathbf{v} \cdot \hat{\phi}$, where $\hat{\phi}$ points in the
    direction of increasing toroidal angle $\phi$. In most SPI configurations the
    pellet is injected with predominantly radial or vertical motion and the toroidal
    component is small (typically $|v_\phi| \ll |v_R|$), but finite toroidal injection
    angles are used on some devices to optimize material deposition for disruption
    mitigation. This component is inferred from pellet-tracking diagnostics (e.g.
    fast cameras, pellet-imaging systems) or from the known injector geometry and
    pellet speed measured before shattering; consult [shattered_pellet_speed_before_shattering](name:shattered_pellet_speed_before_shattering)
    for the pre-shattering speed magnitude. The complementary spatial components are
    the major-radius component [radial_component_of_shattered_pellet_velocity](name:radial_component_of_shattered_pellet_velocity)
    and the vertical component [vertical_component_of_shattered_pellet_fragment_cloud_velocity](name:vertical_component_of_shattered_pellet_fragment_cloud_velocity)
    for the post-shattering fragment cloud.


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: fueling
  links:
  - name:shattered_pellet_velocity
  - name:shattered_pellet_speed_before_shattering
  - name:radial_component_of_shattered_pellet_velocity
  - name:vertical_component_of_shattered_pellet_fragment_cloud_velocity
  constraints: []
  arguments:
  - name: shattered_pellet_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:spi/injector/pellet/velocity_tor
    dd_path: spi/injector/pellet/velocity_tor
    status: composed
