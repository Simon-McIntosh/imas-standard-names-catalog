- name: flux_surface_averaged_electron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Electron number density averaged over the entire last closed magnetic
    flux surface, giving the separatrix value across the confined-plasma and scrape-off-layer
    interface.
  documentation: "This quantity is the flux-surface-averaged electron number density\
    \ on the separatrix, the last closed magnetic flux surface forming the confined-plasma\
    \ boundary. It represents the electron population at the complete core\u2013scrape-off-layer\
    \ interface after averaging over the boundary surface.\n\nFor a magnetic-flux\
    \ surface labeled by $\\psi$, the separatrix value is defined by\n\n$$\n\\langle\
    \ n_e\\rangle_{\\rm sep} =\n\\frac{\\displaystyle\\int_{S_{\\rm sep}} n_e\\,\\\
    frac{dS}{|\\nabla\\psi|}}\n{\\displaystyle\\int_{S_{\\rm sep}}\\frac{dS}{|\\nabla\\\
    psi|}}\n$$\n\nwhere $\\langle n_e\\rangle_{\\rm sep}$ is the flux-surface-averaged\
    \ electron number density at the separatrix, $n_e$ is the local electron number\
    \ density, $S_{\\rm sep}$ is the separatrix surface, $dS$ is its differential\
    \ surface element, $\\psi$ is the magnetic-flux surface label, and $\\nabla\\\
    psi$ is the spatial gradient of that label.\n\nThe average covers the entire last\
    \ closed flux surface at the core\u2013scrape-off-layer boundary. It is an electron-specific\
    \ quantity, with no ion or neutral population included and no ionization-state\
    \ summation. It is distinct from the local, pointwise boundary value [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),\
    \ which is not flux-surface averaged.\n\nThe analogous [flux_surface_averaged_ion_density_at_plasma_boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary)\
    \ applies the same separatrix averaging convention to the ion population rather\
    \ than the electron population."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
  arguments:
  - name: electron_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix_average/n_e/value
    version: 4.1.0
- name: helium_3_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of helium-3 ions at the plasma boundary, evaluated as
    the local particle count per physical volume on the last closed magnetic flux
    surface and summed over charge states.
  documentation: 'Number density of helium-3 ions at the plasma boundary is the local,
    intensive particle count per physical volume for the helium-3 ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface, or separatrix, separating confined plasma from the
    open-field-line scrape-off-layer region.


    The local charge-state-summed helium-3 number density is the zeroth velocity moment
    of the helium-3 ion distribution functions at a boundary point:


    $$

    n_{{}^{3}\mathrm{He}}(\mathbf{x}_b,t) = \sum_{q=1}^{2} \int f_{{}^{3}\mathrm{He},q}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{{}^{3}\mathrm{He}}$ is the helium-3 ion number density, $\mathbf{x}_b$
    is a point on the last closed magnetic flux surface, $t$ is time, $q$ is the helium-3
    ionic charge state, $f_{{}^{3}\mathrm{He},q}$ is the phase-space distribution
    function for that charge state, $\mathbf{v}$ is ion velocity, and $d^3v$ is the
    velocity-space volume element.


    This quantity applies specifically to helium-3 ions, whose nuclei contain three
    nucleons, and includes all ionized charge states from singly charged through fully
    stripped helium-3. It excludes neutral helium-3, other helium isotopes, and other
    plasma species. The value is local at the boundary and is not averaged over the
    boundary surface or over a volume.


    It is the helium-3-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_helium_3_density_at_plasma_boundary](name:flux_surface_averaged_helium_3_density_at_plasma_boundary)
    represents the average of this local helium-3 ion density over the same last closed
    magnetic flux surface rather than its value at a boundary point.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/helium_3/value
    version: 4.1.0
- name: iron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of iron impurity ions at the plasma boundary, the last
    closed flux surface separating the magnetically confined plasma from the open-field-line
    scrape-off layer, summed over all ion charge states from Fe+ through fully stripped
    Fe26+.
  documentation: "Iron density at the plasma boundary is the number of iron impurity\
    \ ions per unit volume \u2014 summed over all ion charge states from singly ionized\
    \ Fe$^+$ through fully stripped Fe$^{26+}$ (atomic number $Z = 26$) \u2014 evaluated\
    \ at the separatrix, the last closed flux surface separating the magnetically\
    \ confined plasma from the open-field-line scrape-off layer. It represents the\
    \ charge-state-summed iron impurity concentration on that boundary.\n\nThe charge-state\
    \ aggregation is\n\n$$\nn_{\\mathrm{Fe}} = \\sum_{z=1}^{26} n_{\\mathrm{Fe}^{z+}}\n\
    $$\n\nwhere $n_{\\mathrm{Fe}}$ is the iron ion number density at the plasma boundary,\
    \ $z$ is the positive ion charge state, and $n_{\\mathrm{Fe}^{z+}}$ is the partial\
    \ number density of iron ions in charge state $z+$ at the same boundary; these\
    \ number-density variables have the unit specified for this standard name.\n\n\
    The sum is over ion charge states only, so neutral iron Fe$^0$ is excluded. As\
    \ a scalar number density, the quantity is non-negative, with zero denoting absence\
    \ of iron ions at the plasma boundary. It is distinct from [flux_surface_averaged_iron_density_at_plasma_boundary](name:flux_surface_averaged_iron_density_at_plasma_boundary),\
    \ which denotes a flux-surface-averaged boundary value rather than the local boundary\
    \ density."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/iron/value
    version: 4.1.0
- name: nitrogen_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of nitrogen ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface.
  documentation: 'Number density of nitrogen ions at the plasma boundary is the local,
    intensive particle count per physical volume for the nitrogen ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local nitrogen ion number density at a boundary point is the zeroth velocity
    moment summed over ionic charge states:


    $$

    n_N(\mathbf{x}_b,t) = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_N$ is the nitrogen ion number density, $\mathbf{x}_b$ is a point on the
    last closed magnetic flux surface, $t$ is time, $q$ is the positive integer ionic
    charge state, $N^{q+}$ is a nitrogen ion with charge state $q$, $\mathbf{v}$ is
    ion velocity, $f_{N^{q+}}$ is the phase-space distribution function for that charge
    state, and $d^3v$ is the velocity-space volume element.


    This quantity applies specifically to nitrogen ions and is summed over charge
    states from singly ionized nitrogen through fully stripped nitrogen. It excludes
    neutral nitrogen and electron density, and it is a local boundary value with no
    averaging over the boundary surface or over a volume.


    It is the nitrogen-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_nitrogen_density_at_plasma_boundary](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary)
    instead averages the same charge-state-summed nitrogen ion density over the last
    closed magnetic flux surface.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/nitrogen/value
    version: 4.1.0
- name: total_power_at_separatrix
  kind: scalar
  status: active
  description: Net energy power leaving the confined plasma through the last closed
    magnetic flux surface and entering the scrape-off layer.
  documentation: 'Separatrix power is the net global energy loss from the confined
    plasma into the scrape-off layer across the last closed magnetic flux surface.
    It represents the aggregate power crossing the entire separatrix rather than a
    local surface value.


    The defining boundary integral is


    $$

    P_{\rm sep} = \oint_{S_{\rm sep}} \mathbf{S}_E \cdot \hat{\mathbf{n}}\, dA

    $$


    where $P_{\rm sep}$ is the separatrix power, $S_{\rm sep}$ is the last closed
    magnetic flux surface, $\mathbf{S}_E$ is the net plasma-energy flux density, $\hat{\mathbf{n}}$
    is the unit normal directed from the confined plasma toward the scrape-off layer,
    and $dA$ is an element of separatrix area.


    This is a total, net quantity integrated over the complete separatrix. It applies
    to the confined plasma as a whole, with no selection of species, reaction channel,
    or individual transport mechanism; outward energy transfer is the plasma loss
    represented by the quantity. It is not a pointwise energy-flux density or a power
    associated with a single surface location.


    The boundary total is distinct from [radiated power over the core region](name:radiated_power_over_core_region),
    which describes electromagnetic power emitted within the core and is not necessarily
    equal to power crossing the separatrix. It is also distinct from [power due to
    conduction](name:power_due_to_conduction), which describes conduction-mediated
    power deposited on plasma-facing surfaces downstream of the separatrix.'
  unit: W
  physics_domain: edge_plasma_physics
  links:
  - name:radiated_power_over_core_region
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/power_loss/value
    version: 4.1.0
- name: tritium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of tritium ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface.
  documentation: 'Number density of tritium ions at the plasma boundary is the local,
    intensive particle count per physical volume for the tritium-ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local tritium-ion number density is the zeroth velocity moment of the tritium-ion
    distribution function at a boundary point:


    $$

    n_\mathrm{T}(\mathbf{x}_b,t) = \int f_\mathrm{T}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_\mathrm{T}$ is the tritium-ion number density, $\mathbf{x}_b$ is a point
    on the last closed magnetic flux surface, $t$ is time, $\mathbf{v}$ is tritium-ion
    velocity, $f_\mathrm{T}$ is the tritium-ion phase-space distribution function,
    and $d^3v$ is the velocity-space volume element.


    This quantity applies specifically to ionized tritium and excludes neutral tritium,
    deuterium, protium, electrons, impurity ions, and total ion density. It is a local
    boundary value, with no averaging over the boundary surface or over a volume;
    for tritium, the relevant positive ion population is singly ionized tritium, so
    no aggregation over multiple positive ionization stages is applied.


    It is the tritium-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary).
    The related [flux-surface-averaged tritium density at the plasma boundary](name:flux_surface_averaged_tritium_density_at_plasma_boundary)
    instead represents the average of tritium-ion density over the same last closed
    magnetic flux surface, while [hydrogen density at the plasma boundary](name:hydrogen_density_at_plasma_boundary)
    and [deuterium density at the plasma boundary](name:deuterium_density_at_plasma_boundary)
    refer to different hydrogen-isotope ion populations.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/tritium/value
    version: 4.1.0
- name: normalized_poloidal_flux_coordinate_of_pedestal
  kind: scalar
  status: active
  description: Dimensionless radial magnetic-surface label locating the H-mode edge
    transport-barrier pedestal between the magnetic axis and the last closed flux
    surface.
  documentation: 'The quantity is the dimensionless radial magnetic-surface coordinate
    assigned to the pedestal position of an H-mode edge transport barrier. It identifies
    the flux surface associated with that position, rather than a density, pressure,
    or temperature value evaluated there.


    The normalized poloidal-flux coordinate is defined from the poloidal magnetic
    flux by


    $$

    \rho_{\mathrm{p}} = \left(\frac{\psi - \psi_{\mathrm{axis}}}{\psi_{\mathrm{boundary}}
    - \psi_{\mathrm{axis}}}\right)^{1/2}

    $$


    where $\rho_{\mathrm{p}}$ is the normalized poloidal-flux coordinate, $\psi$ is
    poloidal magnetic flux, $\psi_{\mathrm{axis}}$ is its value on the magnetic axis,
    and $\psi_{\mathrm{boundary}}$ is its value on the last closed magnetic flux surface.
    The reported value is this coordinate evaluated at the pedestal position.


    This quantity applies specifically to the H-mode edge transport-barrier pedestal
    locus. It has no species, population, or field-component dependence and involves
    no averaging or summation over plasma quantities. It retains the generic pedestal-position
    meaning and is not a pedestal-top profile value or a maximum-gradient location.


    It is a locus-specific instance of the parent [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate),
    applying that coordinate''s outward magnetic-surface labeling to the pedestal
    position rather than to an arbitrary nested surface. For a pedestal within nested
    closed surfaces, its value lies between zero at the magnetic axis and one at the
    last closed flux surface.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
