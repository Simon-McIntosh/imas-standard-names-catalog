- name: vertical_coordinate_of_end_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the exit (end) position of a gas injection
    pipe in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z$ locates the exit point of a gas injection
    pipe along the machine symmetry axis, where $Z = 0$ is the midplane and positive
    $Z$ points upward. This coordinate, together with the companion [major radius
    of the end point](name:major_radius_of_end_point), fully defines the poloidal
    position of the pipe exit in the cylindrical $(R, \phi, Z)$ frame where $R$ is
    the major radius and $\phi$ is the toroidal angle. Typical values range from $-2$
    m to $+2$ m depending on the machine geometry and the injection port location
    (upper, midplane, or lower). The position is established from engineering drawings
    or metrology surveys of the gas injection hardware and is used in fueling simulations
    to set the source boundary condition.


    Sign convention: Positive when the exit point is above the midplane (in the $+Z$
    direction).'
