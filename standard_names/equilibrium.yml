      kind: llm
- name: plasma_beta
  kind: scalar
  status: active
  description: Plasma beta is a dimensionless measure of total plasma pressure relative
    to a magnetic-pressure scale, with the pressure aggregation, field reference,
    and any additional normalization supplied by each specialized plasma-beta definition.
  documentation: 'Plasma beta is a dimensionless equilibrium measure of the total
    pressure content of the confined plasma relative to a magnetic-pressure scale.
    It names the common plasma-pressure-to-magnetic-pressure concept without selecting
    a particular magnetic-field reference, pressure aggregation, or additional normalization.


    The generic specialization relation is


    $$

    \beta_\star = \mathcal{N}_\star\!\left(\frac{2\mu_0\,p_{\mathrm{plasma},\star}}{B_{\mathrm{ref},\star}^{2}}\right)

    $$


    where $\beta_\star$ is a specialized plasma beta, $\star$ labels the specialized
    definition, $p_{\mathrm{plasma},\star}$ is the plasma-pressure measure prescribed
    by that definition, $B_{\mathrm{ref},\star}$ is the corresponding magnetic-field
    reference, $\mu_0$ is the vacuum permeability, and $\mathcal{N}_\star$ is any
    additional normalization operation prescribed by that definition. Where no additional
    normalization is prescribed, $\mathcal{N}_\star$ is the identity operation.


    The scope is the confined plasma in an equilibrium state. Its aggregation convention
    is not fixed at the parent level: each specialized plasma-beta name supplies the
    pressure aggregate, the included plasma populations, and the plasma region over
    which that aggregate is formed. This parent excludes species-resolved pressure
    measures, local beta values, and any fixed choice of toroidal, poloidal, vacuum,
    or total magnetic-field reference unless that choice is made by a specialized
    name.


    Concrete plasma-beta names specialize this parent by fixing $p_{\mathrm{plasma},\star}$,
    $B_{\mathrm{ref},\star}$, and $\mathcal{N}_\star$. The child [normalized toroidal
    plasma beta](name:normalized_toroidal_plasma_beta) is a specialized plasma beta
    with a toroidal-field pressure scale and an additional normalization; related
    axis-specific beta quantities such as [poloidal beta](name:poloidal_beta) and
    [toroidal beta](name:toroidal_beta) fix their magnetic-pressure scale according
    to their own definitions.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:toroidal_beta
  - name:normalized_toroidal_plasma_beta
  sources:
  - dd_path: summary/global_quantities/beta_tor/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-beta_tor-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/beta_tor
      parent: Toroidal beta, defined as the volume-averaged total perpendicular pressure
        divided by (B0^2/(2*mu0)), i.e. beta_toroidal = 2 mu0 int(p dV) / V / B0^2
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Toroidal beta, defined as the volume-averaged total perpendicular
        pressure divided by (B0^2/(2*mu0)), i.e. beta_toroidal = 2 mu0 int(p dV) /
        V / B0^2.
      kind: template
- name: normalized_toroidal_plasma_beta
  kind: scalar
  status: active
  description: "Normalized toroidal plasma beta, conventionally denoted \u03B2_N,\
    \ is the ratio of toroidal plasma beta times plasma minor radius and reference\
    \ toroidal magnetic field to total plasma current, including the conventional\
    \ factor 100."
  documentation: 'Normalized toroidal plasma beta, conventionally denoted $\beta_N$,
    is the ratio of toroidal plasma beta times plasma minor radius and reference toroidal
    magnetic field to total plasma current, including the conventional factor 100.
    It is a whole-plasma equilibrium beta metric based on the volume-averaged total
    perpendicular plasma pressure entering toroidal beta.


    The defining relation is:


    $$

    \beta_N = 100\,\beta_{\mathrm{tor}}\,\frac{a B_0}{I_p}

    $$


    where $\beta_{\mathrm{tor}}$ is [beta](name:beta), the unnormalized toroidal plasma
    beta; $a$ is the plasma minor radius; $B_0$ is the reference toroidal magnetic
    field; and $I_p$ is the total plasma current. The factor $100$ and the prescribed
    numerical normalization of $a$, $B_0$, and $I_p$ are part of the definition.


    The scope is the whole plasma. The pressure population is the total perpendicular
    plasma pressure represented by $\beta_{\mathrm{tor}}$, with the volume averaging
    inherited from [beta](name:beta); it is not restricted to thermal pressure.


