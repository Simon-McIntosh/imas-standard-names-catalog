    \ species and charge states."
  documentation: 'The poloidal total current density is the component of the aggregated
    current-density vector [total_current_density](name:total_current_density) resolved
    along the poloidal unit vector of the flux-coordinate system $(\rho,\theta,\phi)$,
    where $\rho$ is the selected radial flux label, $\theta$ is poloidal angle, and
    $\phi$ is toroidal angle. It combines ohmic, bootstrap, and externally driven
    current contributions over all plasma species and charge states. The unit vector
    $\hat{\mathbf{e}}_\theta$ is the normalized tangent to the curve of increasing
    $\theta$ at fixed $\rho$ and $\phi$; embedded in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height, this tangent lies in the poloidal cross-section spanned by
    $\hat{R}$ and $\hat{Z}$.


    The projection is defined by:


    $$

    j_{\theta,\mathrm{total}} = \mathbf{J}_\mathrm{total}\cdot\hat{\mathbf{e}}_\theta
    = \left(\mathbf{J}_\mathrm{ohmic} + \mathbf{J}_\mathrm{bootstrap} + \mathbf{J}_\mathrm{drive}\right)\cdot\hat{\mathbf{e}}_\theta

    $$


    where $j_{\theta,\mathrm{total}}$ is the scalar poloidal total current density,
    $\mathbf{J}_\mathrm{total}$ is the aggregated total current-density vector, $\mathbf{J}_\mathrm{ohmic}$
    is the inductive ohmic contribution, $\mathbf{J}_\mathrm{bootstrap}$ is the pressure-gradient-driven
    bootstrap contribution, and $\mathbf{J}_\mathrm{drive}$ collects externally driven
    current sources.


    This quantity is the total-current counterpart of [poloidal_current_density](name:poloidal_current_density),
    which does not by itself specify the ohmic-bootstrap-drive aggregation. It is
    distinct from [poloidal_pfirsch_schlueter_current_density](name:poloidal_pfirsch_schlueter_current_density),
    a particular neoclassical contribution, and from directional siblings such as
    [radial_total_current_density](name:radial_total_current_density), [vertical_total_current_density](name:vertical_total_current_density),
    and [parallel_total_current_density](name:parallel_total_current_density), which
    project the same aggregate vector along different directions.


    Sign convention: Positive when conventional current flows in the direction of
    increasing poloidal angle $\theta$ at fixed $\rho$ and $\phi$ in the flux-coordinate
    system $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_current_density
  - name:radial_total_current_density
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
