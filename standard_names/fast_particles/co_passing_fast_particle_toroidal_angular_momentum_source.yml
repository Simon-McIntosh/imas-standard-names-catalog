name: co_passing_fast_particle_toroidal_angular_momentum_source
status: draft
description: Volumetric source rate of toroidal angular momentum density for fast
  particles on co-current passing orbits.
documentation: "This quantity $S_{L_\\phi}^{\\rm co}$ (in N/m\xB2) gives the rate\
  \ at which toroidal angular momentum density is injected into the co-current passing\
  \ fast-particle sub-population per unit volume. In orbit-classified fast-ion transport,\
  \ the distribution is decomposed into co-passing, counter-passing, and trapped fractions;\
  \ this source feeds the co-passing channel via NBI birth, ICRH acceleration, or\
  \ fusion-product creation on co-going orbits. The partition between co-passing and\
  \ counter-passing channels depends sensitally on the beam injection geometry: tangential\
  \ co-injection maximizes $S_{L_\\phi}^{\\rm co}$, while perpendicular injection\
  \ distributes momentum more evenly. Typical magnitudes are $10^{-2}$\u2013$10^{0}$\
  \ N/m\xB2 near the deposition zone in beam-heated tokamak plasmas. Computed by orbit-following\
  \ Monte Carlo codes (NUBEAM, ASCOT, SPIRAL) that classify marker particles by constants\
  \ of motion. See the counter-current counterpart `counter_passing_fast_particle_toroidal_angular_momentum_source`\
  \ and the orbit-summed total `fast_particle_angular_momentum_toroidal_source`."
validity_domain: ''
