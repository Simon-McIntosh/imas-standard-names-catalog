name: poloidal_component_of_magnetic_field_at_pedestal_top_low_field_side
description: Poloidal projection of the magnetic field vector $B_\theta$ evaluated
  at the pedestal-top position on the HFS or LFS midplane.
documentation: "The poloidal magnetic field at the pedestal top $B_{\\theta,\\rm ped}\
  \ = \\mathbf{B}\\cdot\\hat{\\theta}$ is the component of the total magnetic field\
  \ along the poloidal direction (T), evaluated at a specific poloidal location (typically\
  \ the outboard or inboard midplane) on the pedestal-top flux surface. Because $B_\\\
  theta$ varies poloidally due to plasma shaping and the Shafranov shift, separate\
  \ values are stored for the low-field side and high-field side. The poloidal field\
  \ is directly related to the local magnetic pitch angle $\\gamma = \\arctan(B_\\\
  theta / B_\\phi)$ and enters into the safety factor $q = (r B_\\phi) / (R B_\\theta)$,\
  \ where $r$ is the local minor radius (m) and $R$ the major radius (m). Typical\
  \ LFS pedestal-top values are 0.1\u20130.4 T. Obtained from Grad\u2013Shafranov\
  \ equilibrium reconstruction constrained by external magnetics and internal diagnostics\
  \ (motional Stark effect, polarimetry). Positive when $B_\\theta$ is in the $+\\\
  theta$ direction under COCOS-11."
kind: vector_component
unit: T
