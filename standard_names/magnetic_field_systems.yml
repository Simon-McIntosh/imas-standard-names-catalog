- name: alpha_angle_of_iron_core_segment
  kind: scalar
  status: draft
  description: Alpha angle of an iron core segment is the first signed inclination
    of an oblique trapezoidal or parallelogram cross-section. It is measured in the
    poloidal R-Z cross-section of the right-handed cylindrical (R, phi, Z) frame from
    the outward major-radius direction to the slanted alpha-side direction.
  documentation: 'The alpha angle $\alpha$ is the first inclination angle used to
    parameterize an oblique trapezoidal or parallelogram cross-section of an iron
    core segment. The cross-section is taken in the poloidal $R$-$Z$ plane of the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It defines the orientation of the
    slanted side associated with [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment),
    complementary to the other inclined side length [length_of_iron_core_segment](name:major_length_of_iron_core_segment).


    For an $\alpha$-inclined side, the unit tangent in the cross-section is


    $$

    \hat{t}_{\alpha} = \cos\alpha\,\hat{R} + \sin\alpha\,\hat{Z}

    $$


    where $\hat{t}_{\alpha}$ is the tangent along the alpha-side, $\hat{R}$ and $\hat{Z}$
    are the major-radius and vertical basis vectors of the right-handed cylindrical
    $(R,\phi,Z)$ system, and $\alpha$ is in radians. A side of length $L_{\alpha}$
    then gives in-plane displacements $\Delta R=L_{\alpha}\cos\alpha$ and $\Delta
    Z=L_{\alpha}\sin\alpha$, which fixes the vertices and face normals used in geometric,
    magnetic, and structural calculations.


    In practice, $\alpha$ is obtained from engineering drawings, CAD geometry, or
    the coordinates of the endpoints of the slanted side in the local $R$-$Z$ cross-section.
    If the two endpoints are known, the same convention is recovered with $\alpha=\operatorname{atan2}(Z_2-Z_1,R_2-R_1)$,
    with $R$ and $Z$ in meters and the angular branch chosen consistently with the
    segment geometry.


    There is no universal device-independent design range. The full angular branch
    is commonly interpreted over about $-3.14$-$3.14$ rad; reference orientations
    are $0$ rad for an outward radial side, $1.57$ rad for a vertical upward side,
    and about $3.14$ rad or $-3.14$ rad for an inward radial side. Nearly rectangular
    cross-sections have $\alpha$ close to one of these reference orientations, while
    tapered iron-core segments use design-specific offsets.


    Sign convention: Positive when the alpha-side tangent is rotated counter-clockwise
    from the outward $+\hat{R}$ direction toward $+\hat{Z}$ in an $R$-to-the-right,
    $Z$-up drawing of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/oblique/alpha
    dd_path: iron_core/segment/geometry/oblique/alpha
    status: composed
- name: area_of_passive_loop
  kind: scalar
  status: draft
  description: Area of the conducting cross-section of a passive conducting loop element,
    measured in a plane perpendicular to the local current path; for an annular loop
    cross-section it is the area between the inner and outer conductor boundaries.
  documentation: 'Area of a passive loop is the cross-sectional area of solid conducting
    material in a passive conducting loop element, evaluated in a plane normal to
    the local current path. It is a geometric property of the conductor and is non-negative;
    for fixed material properties and path length, a larger area reduces the electrical
    resistance of a uniform conductor model.


    For an annular passive-loop cross-section defined by an inner radius $r_i$ and
    an outer radius $r_o$, the area is


    $$

    A = \pi\left(r_o^2 - r_i^2\right)

    $$


    where $A$ is the cross-sectional area in m$^2$, and $r_i$ and $r_o$ are the [inner](name:inner_radius_of_passive_loop)
    and [outer](name:outer_radius_of_passive_loop) radii in m measured from the annulus
    center to the conducting boundaries.


    In practice, $A$ is computed from the engineering geometry of the passive conductor
    cross-section. For non-annular or simplified sections it is the area of the bounded
    conducting region normal to the current path; rectangular approximations use the
    product of a geometric width and height, while other parameterizations may use
    a thickness together with the relevant cross-section dimensions. In electromagnetic
    circuit models, the relation $R = \rho \ell/A$ applies only for an idealized uniform
    conductor of resistivity $\rho$ in $\Omega\,\mathrm{m}$, path length $\ell$ in
    m, and uniform current distribution.


    There is no device-independent typical numerical range for this quantity: values
    depend on the size and category of the passive structure being represented. Physically
    meaningful values are positive and should be consistent with the associated radii,
    width, height, or thickness used to describe the same conductor cross-section.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:area_of_poloidal_field_coil
  - name:thickness_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/area
    dd_path: pf_passive/loop/element/area
    status: composed
- name: area_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional area of an individual conductor element of a poloidal
    field coil.
  documentation: 'The area of a poloidal field coil element is the geometric cross-sectional
    area of the conducting material assigned to one conductor element. It is a non-negative
    engineering geometry quantity that sets the conversion between element current
    and average current density and contributes to electromagnetic force, thermal,
    and structural calculations.


    For an arbitrary cross-section, the area is the surface measure of the conductor
    region:


    $$

    A = \int_{\mathcal{S}} dS

    $$


    where $\mathcal{S}$ is the conductor cross-section and $A$ is the resulting area.
    For common parameterizations, a rectangular element has $A = w t$, where $w$ is
    the [width](name:width_of_poloidal_field_coil) and $t$ is the [thickness](name:thickness_of_poloidal_field_coil),
    while an annular element has $A = \pi(r_{\rm out}^2-r_{\rm in}^2)$, where $r_{\rm
    out}$ and $r_{\rm in}$ are the [outer](name:outer_radius_of_poloidal_field_coil)
    and [inner](name:inner_radius_of_poloidal_field_coil) radii.


    In practice this area is obtained from the conductor design geometry, manufacturing
    drawings, or surveyed coil dimensions. For polygonal cross-sections it is computed
    from the closed boundary of the conductor region; for composite conductors the
    effective conducting area may be distinguished from the total structural envelope
    when evaluating the engineering average current density $J = I/A$, where $J$ is
    in A m$^{-2}$, $I$ is the element current in A, and $A$ is in m$^2$.


    Typical values range from $10^{-4}$-$10^{-2}$ m$^2$ for small trim or auxiliary
    poloidal-field conductors to $10^{-2}$-$1$ m$^2$ for large poloidal-field and
    central-solenoid conductor elements, depending on current, cooling, insulation,
    and structural requirements.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:thickness_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/area
    dd_path: pf_active/coil/element/area
    status: composed
- name: area_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional area enclosed by a toroidal field coil conductor in
    the plane normal to the coil centerline. It is the geometric area used with coil
    current to estimate average engineering current density and support electromagnetic
    and structural engineering estimates.
  documentation: 'Area of a toroidal field coil conductor is the area enclosed by
    the conductor cross-section in the plane perpendicular to the local coil centerline.
    In a local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$, the cross-section
    lies in the normal-binormal plane spanned by $(\hat{n}, \hat{b})$; it complements
    the [width](name:width_of_toroidal_field_coil) and [height](name:height_of_toroidal_field_coil)
    of the toroidal field coil conductor.


    For a closed polygonal contour with vertices $(u_i, v_i)$ in the normal-binormal
    plane, where $u$ is distance along $\hat{n}$ and $v$ is distance along $\hat{b}$,
    the area is commonly evaluated using the shoelace formula:


    $$

    A = \frac{1}{2}\left|\sum_{i=1}^{N}\left(u_i v_{i+1} - u_{i+1} v_i\right)\right|,\quad
    (u_{N+1},v_{N+1})=(u_1,v_1)

    $$


    where $A$ is the conductor cross-sectional area, $N$ is the number of contour
    vertices, and $u_i$ and $v_i$ are measured in meters. The absolute value removes
    dependence on whether the contour is traversed clockwise or counter-clockwise
    in the local cross-section plane.


    The area is obtained from the conductor geometry, a design drawing, a CAD model,
    or direct dimensional metrology. For a rectangular cross-section, $A$ is approximately
    the product of the normal and binormal extents; for circular or annular sections,
    the corresponding circular area is used with any represented voids subtracted.
    In engineering estimates the average current density is often approximated as
    $J_\mathrm{eng}=I/A$, with $I$ in A and $J_\mathrm{eng}$ in A m$^{-2}$; for composite,
    hollow, or cable-in-conduit conductors, the current and area must refer to the
    same physical material region.


    Typical values span about $10^{-4}$-$10^{-1}$ m$^2$. Small normal-conducting research
    coils may use conductors near $10^{-4}$-$10^{-3}$ m$^2$, superconducting cable-in-conduit
    conductors are often $10^{-3}$-$10^{-2}$ m$^2$, and large aggregate winding-pack
    or busbar-like conductors can approach $10^{-2}$-$10^{-1}$ m$^2$ depending on
    design and cooling requirements.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:area_of_correction_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/area
    dd_path: tf/coil/conductor/cross_section/area
    status: composed
- name: binormal_coordinate_of_correction_coil
  kind: scalar
  status: draft
  description: Signed coordinate of a correction-coil conductor cross-section vertex
    along the binormal direction of the local Frenet-Serret (tangent, normal, binormal)
    frame. Paired with the normal coordinate, it specifies the conductor outline in
    the plane perpendicular to the coil centerline.
  documentation: 'The binormal coordinate is the signed displacement of a vertex on
    a correction-coil conductor cross-section along the binormal direction of the
    local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$. Together with the paired
    [normal_coordinate_of_correction_coil](name:normal_coordinate_of_correction_coil),
    it defines the conductor outline in the cross-section plane perpendicular to the
    local coil centerline.


    In the Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$, $\hat{t}$ is tangent
    to the conductor centerline, $\hat{n}$ is the principal normal toward the local
    center of curvature, and $\hat{b} = \hat{t} \times \hat{n}$ completes the right-handed
    orthonormal triad. For a closed polygonal outline, the binormal and normal vertex
    coordinates describe the external geometric boundary used for electromagnetic
    spacing and structural envelope calculations. Unless separate quantities describe
    voids, cooling channels, insulation layers, or subcomponents, the outline represents
    the gross conductor cross-section rather than a net conducting-material area.


    The coordinates are usually obtained from engineering drawings, CAD geometry,
    or coil-design models by projecting each cross-section vertex onto $\hat{b}$ in
    the local $(\hat{n}, \hat{b})$ plane. For rectangular or nearly rectangular conductors,
    the spread of binormal coordinates corresponds to one transverse conductor dimension
    and is interpreted consistently with [height_of_correction_coil](name:height_of_correction_coil)
    and [width_of_correction_coil](name:width_of_correction_coil); the analogous quantity
    for toroidal-field coils is [binormal_coordinate_of_toroidal_field_coil](name:binormal_coordinate_of_toroidal_field_coil).


    Typical absolute coordinate values are 0.005-0.1 m for compact in-vessel correction
    coils and 0.05-0.3 m for larger external correction coils. When the cross-section
    origin is placed on the conductor centerline, the largest positive and negative
    binormal coordinates are typically about half of the corresponding transverse
    conductor size.


    Sign convention: Positive when the vertex displacement is in the $+\hat{b}$ direction
    of the local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:normal_coordinate_of_correction_coil
  - name:height_of_correction_coil
  - name:width_of_correction_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/outline/binormal
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/binormal
    status: composed
- name: binormal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate of the toroidal field coil conductor cross-section outline
    vertices along the binormal axis of the local Frenet-Serret frame, measuring each
    polygon vertex's displacement in the binormal direction perpendicular to the conductor
    centerline.
  documentation: 'The binormal coordinate locates each vertex of the polygonal cross-section
    outline of a toroidal field coil conductor along the binormal direction $\hat{b}$
    of the local Frenet-Serret frame. In this frame, the unit tangent $\hat{t}$ follows
    the conductor centerline, the principal normal $\hat{n}$ points toward the center
    of curvature of the conductor path, and the binormal vector is defined as


    $$

    \hat{b} = \hat{t} \times \hat{n}

    $$


    forming a right-handed orthonormal triad $(\hat{t}, \hat{n}, \hat{b})$, with the
    cross-section lying in the $(\hat{n}, \hat{b})$ plane.


    Together with the [normal coordinate], the binormal coordinate fully specifies
    the 2D polygonal shape of the conductor cross-section perpendicular to the conductor
    path. The total span in the binormal direction for a rectangular conductor equals
    the [height of the toroidal field coil]. This framing is also used for non-axisymmetric
    coils; see [binormal coordinate of correction coil] for the analogous quantity.


    These coordinates are derived from engineering design data and are used in electromagnetic
    and structural analyzes of TF coils, where the precise cross-section shape affects
    current density distribution, self-inductance, and mechanical stress. Typical
    TF conductor cross-section dimensions range from a few centimeters to tens of
    centimeters in each local direction.


    Sign convention: Positive when the coordinate is in the direction of $\hat{b}
    = \hat{t} \times \hat{n}$, where $\hat{t}$ is the unit tangent along the conductor
    centerline and $\hat{n}$ is the principal normal directed toward the center of
    curvature.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/binormal
    dd_path: tf/coil/conductor/cross_section/outline/binormal
    status: composed
- name: count_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Number of discrete toroidal field coil modules in the confinement device,
    excluding conductor turns within each module.
  documentation: 'The count of toroidal field coils is the integer total of discrete
    coil modules arranged around the device to produce the dominant toroidal magnetic
    field. It counts coil modules, not individual conductor turns, pancakes, or strands
    within a module, and is a fixed engineering design parameter for the magnet system.


    For an axisymmetric tokamak with uniformly spaced toroidal field coils, this count
    sets the rotational periodicity of the coil set. If the count is $N_\mathrm{TF}$,
    one geometric sector spans $2\pi/N_\mathrm{TF}$ in toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical
    height. The finite number and detailed shape of the coils determine the toroidal-field
    ripple spectrum and can affect fast-ion confinement and periodic heat-load patterns.


    The count is obtained from the device magnet design by identifying the mechanically
    distinct toroidal field coil modules in the full torus. It is used together with
    geometric coil properties such as [cross-sectional area](name:area_of_toroidal_field_coil),
    [conductor width](name:width_of_toroidal_field_coil), and [major-radius position](name:major_radius_of_toroidal_field_coil)
    when characterizing the toroidal field system. In stellarators and heliotrons,
    comparable coil counts usually refer to separate modular, helical, or planar coil
    families rather than to tokamak-style toroidal field coils.


    Typical tokamak values are 12-20 toroidal field coils, with many medium and large
    devices using 16-18 coils. Smaller or specialized devices may use fewer coils,
    while increasing the count generally reduces the angular spacing between coils
    and changes the high-toroidal-mode content of the ripple field.'
  unit: '1'
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:major_radius_of_toroidal_field_coil
  sources:
  - id: dd:tf/coils_n
    dd_path: tf/coils_n
    status: composed
- name: current_of_correction_coil
  kind: scalar
  status: draft
  description: Electrical current driven through a non-axisymmetric correction coil.
    It is a signed circuit quantity whose waveform sets the amplitude and phase of
    the coil magnetic perturbation.
  documentation: 'Current of a correction coil is the signed electric current driven
    through an active non-axisymmetric coil. It is a commanded circuit quantity, distinct
    from [current_of_passive_loop](name:current_of_passive_loop), which is induced
    by electromagnetic coupling rather than directly driven.


    In a lumped single-coil circuit model, the current is related to the applied coil
    voltage by:


    $$

    V(t) = R I(t) + L \frac{dI}{dt}

    $$


    where $I(t)$ is the correction-coil current in amperes, $V(t)$ is the applied
    [voltage_of_correction_coil](name:voltage_of_correction_coil) in volts, $R$ is
    the [resistance_of_correction_coil](name:resistance_of_correction_coil) in ohms,
    and $L$ is the coil self-inductance in henries. Detailed circuit models may also
    include mutual inductance, eddy-current coupling, and plasma response terms.


    In practice, $I(t)$ is set by the coil power supply and measured with calibrated
    current transducers such as Rogowski coils, DC current transformers, or Hall sensors.
    Together with the coil winding geometry, it determines the amplitude and phase
    of the imposed non-axisymmetric magnetic perturbation; the analogous active axisymmetric
    coil quantity is [current_of_poloidal_field_coil](name:current_of_poloidal_field_coil).


    Typical values range from 10-10^4 A, depending on coil size, number of turns,
    cooling, and operating scenario. Small trim or error-field correction coils may
    operate below 100 A, while resonant magnetic perturbation coil systems commonly
    use 10^3-10^4 A per powered circuit.


    Sign convention: Positive when charge flows through the coil in the defined winding
    direction from its reference start terminal to its reference end terminal.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:voltage_of_correction_coil
  - name:resistance_of_correction_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/current
    dd_path: coils_non_axisymmetric/coil/conductor/current
    status: attached
  - id: dd:coils_non_axisymmetric/coil/current
    dd_path: coils_non_axisymmetric/coil/current
    status: composed
- name: current_of_passive_loop
  kind: scalar
  status: draft
  description: Electric current induced in a passive axisymmetric conducting loop
    by time-varying magnetic flux linked from the plasma, active coils, and neighboring
    conducting structures.
  documentation: 'Current of a passive loop is the toroidal electric current that
    flows in an electrically conducting, axisymmetric loop without an applied power
    supply. It is an eddy current driven by time-varying magnetic flux linked by the
    loop, including contributions from the plasma, active poloidal-field coils, and
    other conducting structures.


    For a lumped passive circuit $k$, Faraday''s law and Ohm''s law give


    $$

    R_k I_k + \frac{d}{dt}\left(L_k I_k + \sum_{j \ne k} M^{pp}_{kj} I_j + \sum_a
    M^{pa}_{ka} I_a + \Psi^{\mathrm{plasma}}_k\right) = 0

    $$


    where $I_k$, $I_j$, and $I_a$ are currents in A, $R_k$ is the [resistance_of_passive_loop](name:resistance_of_passive_loop)
    in $\Omega$, $L_k$ is the loop self-inductance in H, $M^{pp}_{kj}$ and $M^{pa}_{ka}$
    are mutual inductances in H to other passive loops and active coils, and $\Psi^{\mathrm{plasma}}_k$
    is the plasma-linked magnetic flux in Wb. The resistive drop $R_k I_k$ and the
    inductive electromotive force are the circuit terms associated with the voltage_of_passive_loop;
    with no applied source, their closed-loop sum is zero.


    Passive-loop current is measured with Rogowski coils encircling the conductor
    or inferred from magnetic sensor data constrained by a coupled circuit model.
    In modeling, it is solved together with plasma and active-coil currents using
    geometry-dependent inductances and conductor properties such as [resistivity_of_passive_structure](name:resistivity_of_passive_structure);
    finite resistance dissipates the eddy current over a decay time $\tau = L_k/R_k$,
    while mutual coupling determines how strongly the loop opposes changes in linked
    flux.


    Representative magnitudes are 1-10^4 A for small loops and routine coil transients;
    10^4-10^5 A can occur in low-resistance vessel, shell, or stabilizing-loop circuits
    during rapid plasma-current changes or disruptions. Decay times range from milliseconds
    for thin components to hundreds of milliseconds for massive high-conductivity
    structures.


    Sign convention: Positive when the loop current flows in the $+\hat{\phi}$ direction,
    i.e. increasing toroidal angle $\phi$, in the right-handed cylindrical $(R, \phi,
    Z)$ frame with $R$ major radius and $Z$ vertical height.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_passive_loop
  - name:resistivity_of_passive_structure
  sources:
  - id: dd:pf_passive/loop/current
    dd_path: pf_passive/loop/current
    status: composed
- name: current_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Signed conventional current carried by a toroidal-field coil winding.
  documentation: 'Current of a toroidal-field coil is the signed conventional electric
    current carried by one toroidal-field coil winding or conductor path. It is an
    individual coil-circuit current; the magnetic effect of a coil set is determined
    by the signed ampere-turns obtained from all coil currents and turn counts.


    For an ideal toroidal winding, the vacuum toroidal magnetic field at reference
    major radius $R_0$ is approximated by Ampere''s law:


    $$

    B_\phi(R_0) \simeq \frac{\mu_0}{2\pi R_0}\sum_j N_j I_j

    $$


    where $B_\phi$ is the toroidal component of magnetic field in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $\mu_0$ is the vacuum permeability, $N_j$ is
    the number of turns in coil $j$, $I_j$ is the current of that coil winding, and
    the sum is the total linked ampere-turns. Detailed vacuum-field calculations use
    the actual coil geometry through Biot-Savart integration or equivalent magnetic
    modeling rather than this idealized estimate.


    The current is measured with power-supply and coil-circuit instrumentation such
    as DC current transducers, Rogowski coils, Hall sensors, or calibrated shunts.
    Series-connected toroidal-field coils usually share one current, whereas independently
    supplied coil modules can carry distinct signed currents; circuit modeling combines
    this quantity with coil voltage, resistance, and inductance.


    Typical coil currents are 1,000-20,000 A in small or medium resistive systems,
    10,000-50,000 A in large resistive systems, and 10,000-80,000 A in superconducting
    toroidal-field circuits. The relevant magnetic scale is often the product of current
    and turn count, so designs trade current against number of turns for a required
    toroidal field.


    Sign convention: Positive when conventional current in the winding is oriented
    so that its contribution to the toroidal magnetic field points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:voltage_of_toroidal_field_coil
  - name:current_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/current
    dd_path: tf/coil/conductor/current
    status: composed
  - id: dd:tf/coil/current
    dd_path: tf/coil/current
    status: composed
- name: fast_neutron_flux_of_correction_coil
  kind: scalar
  status: draft
  description: Fast neutron flux incident on the inboard side of a non-axisymmetric
    correction coil, used to assess radiation exposure and predict material degradation
    of coil components.
  documentation: 'Fast neutrons produced predominantly by deuterium-tritium fusion
    reactions scatter through plasma-facing and structural components and irradiate
    the conductors of non-axisymmetric correction coils. The fast neutron flux quantifies
    the number of energetic neutrons crossing a unit area of the coil''s inboard surface
    per unit time, with the inboard face experiencing the highest neutron loading
    due to its relative proximity to the plasma.


    The threshold-integrated fast neutron flux is defined as:


    $$

    \Phi_{\rm fast} = \int_{E \geq E_{\rm th}} \phi(E) \, dE

    $$


    where $\phi(E)$ is the differential neutron flux spectrum (m$^{-2}$ s$^{-1}$ eV$^{-1}$),
    $E$ is neutron kinetic energy, and $E_{\rm th}$ is a threshold energy (commonly
    0.1 MeV or 1 MeV) defining the fast-neutron energy range.


    This quantity is computed from neutron transport calculations using the device
    three-dimensional geometry and the predicted fusion neutron source rate; results
    are validated against threshold-detector or activation-foil measurements placed
    near accessible coil positions. Time-integrating this flux over an operational
    pulse yields the neutron fluence, which governs displacement damage in conductor
    insulation and structural materials. The analogous quantity for the main toroidal
    field coil is [fast_neutron_flux_of_toroidal_field_coil](name:fast_neutron_flux_of_toroidal_field_coil);
    for direct detector measurements see [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).'
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
