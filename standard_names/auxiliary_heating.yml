- name: toroidal_co_passing_current_density
  kind: scalar
  status: draft
  description: Toroidal current density carried by fast ions that pass in the co-current
    direction in the 2D poloidal plane, derived from the fast ion distribution function.
  documentation: "The toroidal current density from co-passing fast ions, $j_{\\phi,\\\
    mathrm{co}}(R, Z)$, is the flux-surface-resolved contribution of the co-passing\
    \ population to the total toroidal fast ion current. It is obtained by integrating\
    \ the second velocity moment of the distribution function over the co-passing\
    \ region of phase space. Co-passing particles traverse the poloidal plane in the\
    \ same direction as the plasma current. This quantity is a component of the total\
    \ [co_passing_current_density](name:co_passing_current_density) projected onto\
    \ the geometric toroidal direction $\\hat{\\phi}$. Typical values in the plasma\
    \ core during neutral beam injection can reach 0.1\u20131 MA/m$^2$, depending\
    \ on the beam power and plasma parameters. The current density can be inferred\
    \ from neutron emission or fast ion loss detector measurements, and is compared\
    \ with NUBEAM or SPOT simulations. \n\nSign convention: Positive when the current\
    \ flows in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ when viewed from above)."
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:co_passing_current_density
