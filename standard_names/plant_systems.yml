- name: x_major_axis_unit_vector_of_shatter_cone
  kind: scalar
  status: active
  description: X component of the shatter-cone major-axis unit vector, resolved in
    the right-handed Cartesian (x, y, z) frame.
  documentation: 'The major-axis unit vector $\hat{e}_\mathrm{maj}$ describes the
    orientation of the major axis of the elliptic shatter cone in a shattered pellet
    injector. This quantity is the $x$-component of $\hat{e}_\mathrm{maj}$, projected
    onto the $x$-axis of the right-handed Cartesian $(x, y, z)$ frame:


    $$

    (\hat{e}_\mathrm{maj})_x = \hat{e}_\mathrm{maj} \cdot \hat{x}

    $$


    where $\hat{x}$ is the unit vector along the $x$-axis. Because $\hat{e}_\mathrm{maj}$
    is a unit vector, the sum of squares of its three Cartesian components equals
    unity. Together with [y_major_axis_unit_vector_of_shatter_cone](name:y_major_axis_unit_vector_of_shatter_cone)
    and [z_major_axis_unit_vector_of_shatter_cone](name:z_major_axis_unit_vector_of_shatter_cone),
    this component fully specifies the major-axis orientation of the shatter cone.
    The complementary minor-axis x-component is [x_minor_axis_unit_vector_of_shatter_cone](name:x_minor_axis_unit_vector_of_shatter_cone).'
