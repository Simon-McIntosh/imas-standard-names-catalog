- name: per_toroidal_mode_of_fast_ion_wave_absorbed_power
  kind: scalar
  status: draft
  description: Wave power absorbed by the fast (suprathermal) ion population from
    a coherent wave, resolved per toroidal mode number and integrated over the total
    plasma volume.
  documentation: "This quantity gives the absorbed wave power $P_{\\rm fast,ion}(n_\\\
    phi)$ deposited on the suprathermal ion population by a coherent wave at each\
    \ toroidal mode number $n_\\phi$, where $n_\\phi$ is the integer toroidal mode\
    \ index. Summing over all toroidal mode numbers recovers the total [fast_ion_wave_absorbed_power](name:fast_ion_wave_absorbed_power)\
    \ integrated over the plasma volume. The fast (non-thermal) ion population consists\
    \ of ions with energies well above the thermal bulk, typically generated or sustained\
    \ by ion cyclotron resonance heating (ICRH) or neutral beam injection; in ICRH\
    \ scenarios, minority-species fast ions are the primary absorption channel and\
    \ $P_{\\rm fast,ion}(n_\\phi)$ quantifies how each poloidal-harmonic-selected\
    \ toroidal mode contributes to that absorption. Typical values depend strongly\
    \ on the launched wave power (order 1\u201320 MW total for present-day devices)\
    \ and the toroidal mode spectrum of the antenna; individual mode contributions\
    \ at the dominant $n_\\phi$ may carry 10\u201380% of the total absorbed power.\
    \ The toroidal-mode-resolved power density companion is [per_toroidal_mode_of_fast_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_density),\
    \ and the cumulative flux-surface integral form is [per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface).\
    \ The fast-electron analog is [per_toroidal_mode_of_fast_electron_wave_absorbed_power](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power)."
  unit: W
  physics_domain: auxiliary_heating
