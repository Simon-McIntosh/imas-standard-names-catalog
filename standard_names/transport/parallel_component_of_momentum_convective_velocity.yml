name: parallel_component_of_momentum_convective_velocity
description: Projection of the momentum convective (pinch) velocity onto the local
  magnetic-field direction, representing field-aligned advective momentum transport.
documentation: The parallel momentum convective velocity $v_{\parallel}^{\rm conv}$
  ($\mathrm{m\,s^{-1}}$) is the component along $\hat{b} = \mathbf{B}/|\mathbf{B}|$
  of the convective velocity entering the momentum transport equation. In the fluid
  momentum balance the convective momentum flux density is $\Pi_{\parallel}^{\rm conv}
  = m n v_{\parallel}\, v_{\parallel}^{\rm conv}$, where $m$ is the species mass (kg),
  $n$ the number density ($\mathrm{m^{-3}}$), and $v_{\parallel}$ the parallel flow
  speed ($\mathrm{m\,s^{-1}}$). This quantity appears in both ion and neutral momentum
  transport equations and is stored per GGD element or on 1-D radial profiles. In
  the SOL, $v_{\parallel}^{\rm conv}$ typically ranges from $10^3$ to $10^5\;\mathrm{m\,s^{-1}}$,
  approaching the local ion sound speed $c_s = \sqrt{(T_e + T_i)/m_i}$ near divertor
  target plates. Edge transport codes such as SOLPS-ITER, SOLEDGE2D, and UEDGE compute
  this velocity self-consistently from the parallel momentum equation. See also `parallel_component_of_momentum_flux`
  for the total flux and `parallel_component_of_ion_momentum_convective_velocity`
  for the ion-specific variant.
kind: vector_component
unit: m.s^-1
