- name: area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Total geometric surface area of a Langmuir probe collector, characterizing
    the probe's physical extent independent of plasma exposure fraction or magnetic-field
    projection.
  documentation: "The area of a Langmuir probe is the total geometric surface area\
    \ of the probe collector, representing its full physical size as a fixed hardware\
    \ property independent of local plasma conditions or magnetic-field geometry.\
    \ It is the parent area concept from which two operationally distinct sub-areas\
    \ are derived: the [wetted area](name:wetted_area_of_langmuir_probe), which captures\
    \ only the portion of the collector surface directly exposed to plasma, and the\
    \ [effective collection area](name:effective_area_of_langmuir_probe), which is\
    \ the projection onto the plane perpendicular to the local magnetic field that\
    \ governs ion collection in a magnetized sheath.\n\nFor probes oriented at a grazing\
    \ angle to the magnetic field \u2014 quantified by the [field-aligned incident\
    \ angle] \u2014 the effective collection area can be substantially smaller than\
    \ the total geometric area. Conflating the two when normalizing the [ion saturation\
    \ current](name:ion_saturated_current) to obtain the [ion saturation current density](name:ion_saturated_current_density)\
    \ introduces systematic errors in the inferred plasma density and particle flux\
    \ at the probe surface.\n\nProbe areas are treated as fixed diagnostic geometry\
    \ parameters, determined from engineering drawings or direct measurement of the\
    \ fabricated collector prior to installation."
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:wetted_area_of_langmuir_probe
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current
  - name:ion_saturated_current_density
- name: coolant_temperature_at_inlet
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the entry point of a cooling loop
    or calorimetry component, used with the outlet temperature and mass flow rate
    to compute deposited thermal power via enthalpy balance.
  documentation: 'The coolant inlet temperature is the absolute temperature of the
    working fluid measured at the inlet port of a cooling circuit, before traversing
    the component and absorbing heat. It establishes the upstream thermal boundary
    condition for thermodynamic analysis of the cooling loop and is a primary input
    to heat load calculations.


    Combined with [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet)
    and the coolant mass flow rate from coolant_flow, the deposited thermal power
    $P$ is determined by:


    $$

    P = \dot{m} \, c_p \, (T_\mathrm{out} - T_\mathrm{in})

    $$


    where $\dot{m}$ is the mass flow rate in kg s$^{-1}$, $c_p$ is the specific heat
    capacity of the coolant in J kg$^{-1}$ K$^{-1}$, $T_\mathrm{in}$ is the inlet
    temperature, and $T_\mathrm{out}$ is the outlet temperature.


    Measured using calibrated resistance temperature detectors (RTDs) or thermocouples
    mounted at the inlet manifold of the cooling circuit. It applies to calorimetry
    components, cooling loops, and breeding blanket module circuits.


    Typical inlet temperatures in water-cooled tokamak circuits range from 290-330
    K; helium-cooled blanket systems may operate at inlet temperatures up to 550 K
    or higher depending on the thermal design point. The temperature difference $(T_\mathrm{out}
    - T_\mathrm{in})$ is the key diagnostic observable for computing [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port).'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:thermal_power_of_plant_component_port
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_inlet
    status: attached
  - id: dd:calorimetry/cooling_loop/temperature_in
    dd_path: calorimetry/cooling_loop/temperature_in
    status: attached
  - id: dd:calorimetry/group/component/temperature_in
    dd_path: calorimetry/group/component/temperature_in
    status: composed
- name: coolant_temperature_at_outlet
  kind: scalar
  status: draft
  description: Absolute temperature of the cooling fluid at the exit port of a cooling
    loop or calorimetry component, serving as the downstream thermal boundary condition
    in calorimetric heat-load assessment.
  documentation: 'The coolant outlet temperature is the absolute thermodynamic temperature
    of the working fluid leaving a cooling-loop channel or calorimetry component.
    Paired with [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and the [coolant mass flow rate], it supplies the thermodynamic data needed to
    close the first-law calorimetric enthalpy balance.


    The deposited thermal power $P_{th}$ is defined by:


    $$

    P_{th} = \dot{m} \, c_p \, (T_{\mathrm{out}} - T_{\mathrm{in}})

    $$


    where $\dot{m}$ is the coolant mass flow rate, $c_p$ is the specific heat capacity
    of the coolant at constant pressure (approximately 4180 J kg$^{-1}$ K$^{-1}$ for
    water), $T_{\mathrm{out}}$ is this outlet temperature, and $T_{\mathrm{in}}$ is
    the [inlet temperature](name:coolant_temperature_at_inlet). The resulting [deposited
    thermal power](name:thermal_power_of_plant_component_port) and [cumulative thermal
    energy](name:thermal_energy_of_plant_component_port) are derived from this relation.


    Outlet temperature is measured by resistance temperature detectors (RTDs) or calibrated
    thermocouples mounted at the component exit manifold. For water-cooled plasma-facing
    and structural components, outlet temperatures range from 300 to 400 K, with temperature
    rises of a few to tens of kelvins depending on the incident heat load.'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:thermal_power_of_plant_component_port
  - name:thermal_energy_of_plant_component_port
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_outlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_outlet
    status: attached
  - id: dd:calorimetry/cooling_loop/temperature_out
    dd_path: calorimetry/cooling_loop/temperature_out
    status: attached
  - id: dd:calorimetry/group/component/temperature_out
    dd_path: calorimetry/group/component/temperature_out
    status: composed
- name: direction_unit_vector
  kind: vector
  status: draft
  description: Dimensionless unit vector specifying the spatial orientation of a diagnostic
    sensor or hardware device, with projections resolved along the axes of a specified
    right-handed coordinate frame.
  documentation: "A direction unit vector of magnitude one encodes the pointing direction\
    \ of a diagnostic sensor or hardware device \u2014 for instance the measurement\
    \ axis, surface normal, or optical line-of-sight \u2014 decomposed into projections\
    \ along coordinate axes. It is the minimal geometric descriptor of orientation,\
    \ carrying no magnitude information.\n\nThe defining constraint is:\n\n$$\n\\\
    hat{d} \\cdot \\hat{d} = d_x^2 + d_y^2 + d_z^2 = 1\n$$\n\nwhere $d_x$, $d_y$,\
    \ $d_z$ are the axis projections of the unit vector. The [x_direction_unit_vector](name:x_direction_unit_vector)\
    \ and its $y$-axis companion resolve the vector in the right-handed Cartesian\
    \ $(x, y, z)$ frame, while [vertical_direction_unit_vector](name:vertical_direction_unit_vector)\
    \ provides the projection onto $\\hat{Z}$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame.\n\nComponent values are obtained from engineering drawings,\
    \ mechanical alignment surveys, or photogrammetric measurements performed during\
    \ device installation and calibration. Each component lies in the interval $[-1,\
    \ 1]$ by construction, with the three projections summing in quadrature to unity.\n\
    \nSign convention: Positive when the component points in the positive direction\
    \ of the corresponding coordinate axis."
  unit: '1'
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_direction_unit_vector
  - name:vertical_direction_unit_vector
  sources:
  - id: derived:direction_unit_vector
    status: composed
- name: displacement_of_passive_structure
  kind: scalar
  status: draft
  description: Signed linear displacement of a selected point or surface on a passive
    structural component relative to a reference configuration, projected along a
    specified measurement direction.
  documentation: 'Displacement of a passive structure is the scalar change in position
    of a specified material point, attachment point, or target surface on a passive
    structural component. It is the component of the local vector displacement along
    a chosen measurement direction, and is a passive-structure-specific use of the
    generic [displacement](name:displacement_of_passive_structure) concept.


    The signed projected displacement is defined by


    $$

    u(t) = \left[\mathbf{r}(t) - \mathbf{r}_0\right] \cdot \hat{\mathbf{e}}_u

    $$


    where $u(t)$ is the scalar displacement in m, $\mathbf{r}(t)$ is the current position
    vector of the selected point or surface reference point in m, $\mathbf{r}_0$ is
    its reference-configuration position vector in m, $t$ is time in s, and $\hat{\mathbf{e}}_u$
    is a dimensionless unit vector in the chosen positive measurement direction.


    In practice the quantity is obtained from displacement, proximity, or length measurements
    tied to a calibrated reference state. For a sensor viewing a surface, the reported
    value represents the change of the measured target position along the sensor direction
    after applying the reference offset and sign calibration; it should not be interpreted
    as the displacement of an entire component unless that reduction has been explicitly
    defined.


    Typical magnitudes are expressed in meters and are strongly dependent on component
    stiffness, support conditions, electromagnetic loading, thermal expansion, and
    the selected measurement point. No device-independent numerical range is intrinsic
    to the quantity; interpretation should be made relative to the component clearance,
    deformation limit, and measurement resolution.


    Sign convention: Positive when the selected point or surface moves in the chosen
    positive measurement direction $\hat{\mathbf{e}}_u$ relative to the reference
    configuration.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - id: dd:operational_instrumentation/sensor/length
    dd_path: operational_instrumentation/sensor/length
    status: composed
- name: effective_area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Effective ion collection area of a Langmuir probe, equal to the plasma-facing
    surface area projected onto the plane perpendicular to the local magnetic field.
  documentation: 'Effective area of a Langmuir probe is the collecting area presented
    to ions streaming along the local magnetic field. It is the projected part of
    the plasma-facing surface that intercepts field-aligned particle flux, and is
    smaller than the geometric area when the magnetic field strikes the surface obliquely.


    For a locally planar collector, the effective collection area is defined by the
    field-surface incidence angle:


    $$

    A_\mathrm{eff} = A \sin\alpha = A\,|\hat{\mathbf{b}}\cdot\hat{\mathbf{n}}|

    $$


    where $A_\mathrm{eff}$ is the effective collection area in m^2, $A$ is the geometric
    plasma-facing area in m^2, $\alpha$ is the angle_of_langmuir_probe in radians
    measured between the local magnetic field line direction and the plasma-facing
    surface, $\hat{\mathbf{b}}$ is the dimensionless unit vector along the magnetic
    field, and $\hat{\mathbf{n}}$ is the dimensionless unit normal to the collector
    surface. Thus $\alpha=0$ gives zero effective area for a field line tangent to
    the surface, while $\alpha=\pi/2$ gives the full geometric area for normal incidence.
    For a curved or segmented collector, the same projection is applied locally and
    summed over the exposed plasma-facing surface.


    In practice, this quantity is computed from the known exposed probe geometry and
    the local magnetic-field direction at the probe position. It is used when converting
    measured ion saturation current to [parallel_ion_current_density](name:parallel_ion_current_density),
    because that current density is defined per unit area perpendicular to the magnetic
    field.


    Typical effective areas for small embedded or flush-mounted Langmuir probes are
    about 10^-8-10^-5 m^2. Larger protruding tips or collector plates may reach about
    10^-4 m^2, while very grazing magnetic-field incidence can reduce the effective
    area by orders of magnitude relative to the geometric surface area.'
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_ion_current_density
  arguments:
  - name: area_of_langmuir_probe
    operator: effective
    operator_kind: qualifier
  sources:
  - id: dd:langmuir_probes/embedded/surface_area_effective
    dd_path: langmuir_probes/embedded/surface_area_effective
    status: composed
- name: electron_average_temperature_at_midplane
  kind: scalar
  status: draft
  description: Electron temperature averaged along a magnetic field line connecting
    the upstream midplane crossing to a downstream divertor target in the scrape-off
    layer. It is a parallel field-line mean, distinct from the local electron temperature
    at the midplane.
  documentation: 'Electron average temperature at midplane is the path-length-weighted
    mean electron temperature along a scrape-off-layer magnetic field line, assigned
    to the field line''s upstream midplane crossing. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height, the upstream endpoint is the intersection of the field
    line with the device midplane $Z=Z_\mathrm{mid}$; the downstream endpoint is the
    connected divertor target reached by following the same field line.


    With $l_\parallel$ the distance measured along the magnetic field line from the
    upstream midplane endpoint to the target, the average is defined by:


    $$

    \langle T_e \rangle_\parallel = \frac{1}{L_\parallel}\int_0^{L_\parallel} T_e(l_\parallel)\,dl_\parallel

    $$


    where $T_e(l_\parallel)$ is the local electron temperature in eV, $l_\parallel$
    and the connection length $L_\parallel$ are in meters, and $\langle T_e \rangle_\parallel$
    is in eV.


    In practice, this quantity is computed by tracing the magnetic field line and
    integrating an inferred or modeled electron-temperature distribution along it.
    A reciprocating Langmuir probe near the midplane can constrain the local upstream
    value, but it does not by itself measure the full upstream-to-target average unless
    combined with information or assumptions about the temperature variation along
    the connected field line. This quantity is therefore distinct from the local [electron_temperature_at_midplane](name:electron_temperature_at_midplane),
    from a volume mean such as [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature),
    and from radial scrape-off-layer scale lengths such as [thermal_electron_decay_length_over_scrape_off_layer](name:thermal_electron_decay_length_over_scrape_off_layer).


    Representative scrape-off-layer field-line averages are regime dependent and should
    be interpreted with the endpoint definition and diagnostic constraints in mind.
    Values are often a few eV to 100 eV: detached or cold-divertor conditions can
    give averages near 1-10 eV, while attached, hotter upstream conditions near the
    separatrix can give 10-100 eV or higher.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_midplane
  - name:ion_average_temperature_at_midplane
  - name:average_temperature_at_midplane
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/t_e_average
    dd_path: langmuir_probes/reciprocating/plunge/t_e_average
    status: composed
- name: heat_flux
  kind: vector
  status: draft
  description: Power per unit area transported by plasma particles and fields across
    a reference surface, generalizing over field-aligned conduction, cross-field transport,
    and turbulence-driven energy flux.
  documentation: "Heat flux is the rate of energy transport per unit area across a\
    \ reference surface in a magnetized plasma, encompassing contributions from thermal\
    \ conduction, particle convection, and turbulent fluctuations. In tokamak and\
    \ stellarator geometries, the heat flux vector naturally decomposes into components\
    \ along and across the local magnetic field.\n\nThe total heat flux vector $\\\
    mathbf{q}$ may be written as:\n\n$$\n\\mathbf{q} = q_\\parallel \\hat{b} + \\\
    mathbf{q}_\\perp\n$$\n\nwhere $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit\
    \ vector along the equilibrium magnetic field $\\mathbf{B}$, $q_\\parallel$ is\
    \ the field-aligned component, and $\\mathbf{q}_\\perp$ collects cross-field contributions\
    \ from diffusion, convection, and turbulence.\n\nThe field-aligned component [parallel_heat_flux](name:parallel_heat_flux)\
    \ is the dominant energy exhaust channel in the scrape-off layer, where rapid\
    \ parallel transport carries power to plasma-facing surfaces. In gyrokinetic turbulence\
    \ calculations, the fluctuation-driven contribution is captured by the [perturbed\
    \ heat flux], quantifying energy carried by the non-adiabatic part of the gyrocenter\
    \ distribution function. The convective fraction is characterized by a dimensionless\
    \ factor relating heat flux to local particle flux and temperature.\n\nTypical\
    \ steady-state peak heat fluxes at divertor targets in diverted tokamaks range\
    \ from 1\u201320 MW m$^{-2}$, with transient excursions during edge-localized\
    \ modes reaching several times higher values."
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_heat_flux
- name: ion_current_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Electrical current collected at a single mass-discriminated detector
    channel of a mass spectrometer, quantifying the ion abundance for the atomic mass
    species assigned to that channel.
  documentation: "In a mass spectrometer, each channel selects ions of a fixed mass-to-charge\
    \ ratio $m/z$ from an ionized sample of the plasma exhaust or vessel atmosphere.\
    \ When these ions strike the detector \u2014 a Faraday cup for higher-abundance\
    \ species or an electron multiplier for trace signals \u2014 they produce a measurable\
    \ electrical current that is directly proportional to the ion arrival rate at\
    \ that mass channel.\n\nThe collected current $I_\\text{ch}$ is related to the\
    \ ion arrival rate $\\dot{N}$ by:\n\n$$\nI_\\text{ch} = Z_i \\, e \\, \\dot{N}\n\
    $$\n\nwhere $Z_i$ is the ion charge state (typically unity for singly ionized\
    \ atoms or molecules), $e = 1.602 \\times 10^{-19}$ C is the elementary charge,\
    \ and $\\dot{N}$ is the number of ions collected per second.\n\nThe ion current\
    \ signal is subsequently converted to a partial pressure via the spectrometer's\
    \ sensitivity factor, which encodes the ionization cross-section, ion transmission\
    \ efficiency, and detector gain for each species; the resulting partial pressure\
    \ for the same channel is [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).\
    \ The detector bias voltage governing amplification efficiency is given by [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel).\n\
    \nTypical collected ion currents range from $10^{-12}$ A to $10^{-7}$ A depending\
    \ on the vessel gas composition, partial pressure level, and detector type. Faraday\
    \ cups are suitable for dominant fuel species such as hydrogen isotopes, while\
    \ electron multipliers extend sensitivity to low-abundance impurity or noble-gas\
    \ species."
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:neutral_pressure_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/channel/current
    dd_path: spectrometer_mass/channel/current
    status: attached
  - id: dd:spectrometer_mass/residual_spectrum/current
    dd_path: spectrometer_mass/residual_spectrum/current
    status: attached
- name: ion_field_line_average_temperature_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Ion temperature averaged from upstream to downstream along an open
    magnetic field line in the scrape-off layer, between the upstream midplane region
    and a downstream divertor target. It represents the mean bulk-ion thermal state
    of the scrape-off-layer ion population over the open-field-line connection.
  documentation: 'Field-line-average ion temperature over the scrape-off layer is
    the mean bulk-ion temperature evaluated along a single open magnetic field line
    that connects the upstream midplane region to a downstream divertor target. It
    characterizes the thermal state of the dominant thermal ion population along the
    open-field-line connection length, complementing the analogous midplane-referenced
    quantity ion_average_temperature_at_midplane, which is likewise defined as an
    upstream-to-downstream field-line average. For a multi-species plasma it refers
    to the bulk (main) thermal ion species unless a specific ion is otherwise indicated.


    The parallel arclength-weighted average is defined as:


    $$

    \langle T_i \rangle_{\parallel} = \frac{1}{L_{\parallel}} \int_{\ell_u}^{\ell_t}
    T_i(\ell)\, d\ell

    $$


    where $\ell$ is the arclength coordinate along the magnetic field line in meters,
    $T_i(\ell)$ is the local ion temperature in eV, $\ell_u$ and $\ell_t$ mark the
    upstream and target endpoints, and $L_{\parallel}$ is the connection length between
    them in meters. The resulting average is expressed in eV.


    In practice the quantity is inferred from scrape-off-layer measurements that associate
    ion-temperature information with the field line connecting the upstream and downstream
    locations, for example from a reciprocating probe traversing the scrape-off layer
    during a plunge. The exact averaging procedure depends on the available measurements
    and modeling assumptions, but the intended quantity is the upstream-to-downstream
    ion temperature average along that field line.


    Being a temperature, this quantity is non-negative. Reported scrape-off-layer
    ion temperatures span a broad range depending on plasma regime, radial location
    in the scrape-off layer, and proximity to the divertor targets or the upstream
    region.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/t_i_average
    dd_path: langmuir_probes/reciprocating/plunge/t_i_average
    status: composed
- name: ion_saturated_current
  kind: scalar
  status: draft
  description: Ion saturated current is the limiting conventional current carried
    by positive ions collected by a Langmuir probe biased sufficiently negative to
    make electron collection negligible.
  documentation: 'Ion saturated current is the ion-collection plateau of a Langmuir-probe
    current-voltage characteristic at sufficiently negative probe bias. In this regime
    electrons are repelled, positive ions enter the sheath at approximately the Bohm
    speed, and the current is mainly controlled by the sheath-edge density, ion sound
    speed, and effective ion-collection area.


    For a singly charged plasma in the ideal ion-saturation limit, the collected current
    is commonly modeled as:


    $$

    I_{\mathrm{sat},i} = e\,n_{e,\mathrm{se}}\,c_s\,A_{\mathrm{eff}}

    $$


    where $I_{\mathrm{sat},i}$ is the ion saturated current in A, $e$ is the elementary
    charge in C, $n_{e,\mathrm{se}}$ is the sheath-edge electron density in m^-3,
    $c_s$ is the ion sound speed at the sheath edge in m s^-1, and $A_{\mathrm{eff}}$
    is the [effective collection area of the probe](name:effective_area_of_langmuir_probe)
    in m^2. The effective area is the projected ion-collection area relative to the
    local magnetic field and probe geometry; the simple form assumes a quasineutral
    presheath, Bohm ion entry, negligible residual electron collection, and negligible
    secondary electron emission, with sheath expansion or other collection effects
    absorbed into $A_{\mathrm{eff}}$ or a collection coefficient.


    In practice, the current is obtained either from a fixed negative-bias measurement
    or from the ion-saturation branch of a swept Langmuir-probe characteristic. It
    is used to infer local edge or scrape-off-layer plasma density when $c_s$ and
    $A_{\mathrm{eff}}$ are known or modeled. The area-normalized quantity is the [ion_saturated_current_density](name:ion_saturated_current_density).


    The expected scale follows from the collection relation: for $n_{e,\mathrm{se}}
    = 10^{18}-10^{20}$ m^-3, $c_s = 10^4-10^5$ m s^-1, and $A_{\mathrm{eff}} = 10^{-7}-10^{-5}$
    m^2, millimeter-scale probe collectors give currents of roughly $10^{-5}-1$ A.
    Values vary strongly with plasma density, electron temperature, magnetic-field
    incidence angle, probe size, and surface condition.


    Sign convention: Positive when conventional current associated with collected
    positive ions flows from the plasma into the probe collector.'
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current_density
  sources:
  - id: dd:langmuir_probes/embedded/ion_saturation_current
    dd_path: langmuir_probes/embedded/ion_saturation_current
    status: attached
  - id: dd:langmuir_probes/embedded/saturation_current_ion
    dd_path: langmuir_probes/embedded/saturation_current_ion
    status: attached
  - id: dd:langmuir_probes/probe/saturation_current_ion
