- name: perpendicular_wave_vector_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: The perpendicular wave vector of an ion cyclotron heating antenna is
    the non-negative magnitude of the launched RF wave-vector component perpendicular
    to the local equilibrium magnetic field. It sets the transverse spatial oscillation
    scale of the wave in the plasma.
  documentation: 'The perpendicular wave vector $k_\perp$ is the magnitude of the
    component of the RF wave vector normal to the local equilibrium magnetic-field
    direction. The perpendicular direction is defined geometrically with respect to
    the local field unit vector, not as a fixed radial or flux-surface-normal direction.
    Because this quantity is a magnitude, it is non-negative and has unit $\mathrm{m}^{-1}$.


    The defining projection is


    $$

    k_\perp = \left|\mathbf{k} - (\mathbf{k}\cdot\hat{\mathbf{b}})\hat{\mathbf{b}}\right|
    = \sqrt{|\mathbf{k}|^2 - k_\parallel^2}

    $$


    where $\mathbf{k}$ is the RF wave vector in $\mathrm{m}^{-1}$, $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$
    is the dimensionless unit vector along the local equilibrium magnetic field $\mathbf{B}_0$,
    and $k_\parallel=\mathbf{k}\cdot\hat{\mathbf{b}}$ is the parallel wave number
    in $\mathrm{m}^{-1}$.


    In practice, $k_\perp$ is obtained from full-wave modeling, ray tracing, or local
    dispersion analysis of the launched ion-cyclotron-range fast wave. The [antenna
    frequency](name:frequency_of_ion_cyclotron_heating_antenna) sets $\omega=2\pi
    f$, while strap phasing, represented by quantities such as [wave phase of antenna
    strap](name:wave_phase_of_antenna_strap), helps determine the launched $k_\parallel$
    spectrum. In cold-plasma estimates, the dielectric response depends on species
    densities, charges, masses, cyclotron frequencies set by the local magnetic-field
    magnitude, and the RF frequency. If a local dispersion calculation gives negative
    or complex $k_\perp^2$, the imaginary part represents evanescence or damping rather
    than a signed perpendicular wave number; a scalar $k_\perp$ refers to the real,
    non-negative transverse oscillation rate of the propagating branch or to a representative
    value from the propagating part of the wave field.


    Representative ion-cyclotron fast-wave values are commonly of order 10-500 $\mathrm{m}^{-1}$,
    corresponding to perpendicular wavelengths from centimeters to tens of centimeters
    through $\lambda_\perp=2\pi/k_\perp$. The value depends strongly on plasma composition,
    density, magnetic field, frequency, and launched parallel wave-number spectrum.'
  unit: m^-1
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_ion_cyclotron_heating_antenna
  - name:wave_phase_of_antenna_strap
  sources:
  - id: dd:summary/heating_current_drive/ic/k_perpendicular/value
    dd_path: summary/heating_current_drive/ic/k_perpendicular/value
    status: composed
- name: poloidal_launched_wave_index_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Poloidal launched wave index of a lower hybrid antenna is the signed
    dimensionless projection of the launched wave refractive-index vector onto the
    direction of increasing geometric poloidal angle theta about the antenna reference
    point in the right-handed cylindrical (R, phi, Z) frame. It equals the poloidal
    wavenumber divided by the free-space wavenumber and characterizes launch spectral
    tilt relevant to ray trajectories, current-drive location, and power deposition.
  documentation: 'The poloidal launched wave index $n_\mathrm{pol}$ is the poloidal
    component of the lower-hybrid launched refractive-index vector. The geometry is
    described in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height. In a fixed-$\phi$
    poloidal plane, the geometric poloidal angle $\theta$ is measured about the antenna
    reference point; increasing $\theta$ follows the local tangent direction $\hat{e}_\theta$
    in that plane.


    The index is defined by normalizing the poloidal wavenumber component to the free-space
    wavenumber:


    $$

    n_\mathrm{pol} = \frac{k_\theta}{k_0} = \frac{c\,k_\theta}{\omega}

    $$


    where $k_\theta = \mathbf{k}\cdot\hat{e}_\theta$ is the poloidal wavenumber component
    in m^-1, $k_0=\omega/c$ is the free-space wavenumber in m^-1, $\omega$ is the
    angular wave frequency in rad s^-1, and $c$ is the speed of light in m s^-1. Together
    with the [toroidal launched wave index](name:toroidal_launched_wave_index_of_lower_hybrid_antenna),
    this quantity specifies the directional content of the launched lower-hybrid spectrum.


    In practice, $n_\mathrm{pol}$ is specified or computed from the poloidal phasing,
    waveguide layout, and electromagnetic coupling model of the launcher. It affects
    how the launched spectrum maps onto the magnetic-field direction and therefore
    can influence ray trajectories, accessibility, damping location, and driven-current
    localization.


    Typical central values are often near zero, with representative launcher specifications
    of order $|n_\mathrm{pol}| \lesssim 1$; deliberately tilted or broad spectra can
    contain components of order a few. These values are dimensionless and should be
    interpreted as launcher- and spectrum-dependent rather than as universal bounds.


    Sign convention: Positive when the poloidal wavenumber component points in the
    direction of increasing geometric poloidal angle $\theta$ in the fixed-$\phi$
    poloidal plane.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_launched_wave_index_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/antenna/row/n_pol
    dd_path: lh_antennas/antenna/row/n_pol
    status: composed
- name: poloidal_magnetic_flux_at_beam_tracing_point
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at a point on a beam-tracing ray or
    beam path. It is a dimensional flux-surface label in Wb, distinct from dimensionless
    normalized poloidal-flux coordinates derived from axis and boundary flux differences.
  documentation: 'Poloidal magnetic flux at a beam-tracing point is the dimensional
    poloidal magnetic flux value evaluated at the spatial position of a point on a
    propagated ray or beam path. It labels the magnetic flux surface intersected by
    that point when an axisymmetric equilibrium description is applicable, but it
    remains a flux in Wb rather than a normalized radial coordinate.


    For an axisymmetric equilibrium in the right-handed cylindrical $(R, \phi, Z)$
    frame, with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical
    height, the poloidal magnetic flux can be defined by the vertical magnetic field
    through a horizontal disk:


    $$

    \psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi$ is in Wb, $R$ and $R''$ are in m, $Z$ is in m, and $B_Z$ is the vertical
    magnetic-field component in T. This disk-integral form fixes the additive reference
    by taking zero flux at $R=0$ for the disk at height $Z$; if another common additive
    offset is used for an equilibrium, physical flux differences are unchanged.


    In beam-tracing calculations, this quantity is obtained by interpolating the reconstructed
    or modeled equilibrium flux function to each ray or beam position. It is commonly
    used to relate wave propagation, absorption, and resonance locations to magnetic
    surfaces. A corresponding normalized poloidal flux coordinate is dimensionless,
    for example $\psi_N=(\psi-\psi_\mathrm{axis})/(\psi_\mathrm{boundary}-\psi_\mathrm{axis})$;
    the dimensional value here must not be confused with that normalized coordinate,
    and any common additive offset cancels in the normalization.


    Typical axis-to-boundary poloidal-flux differences are about 0.1-20 Wb in medium-sized
    to large tokamaks. Values encountered along a beam path depend on where the trajectory
    crosses the plasma and on the chosen additive reference for the dimensional flux.


    Sign convention: Positive when $B_Z$ on the integration disk points in the $+Z$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_beam_tracing_beam
  - name:poloidal_magnetic_flux_at_pellet_path
  - name:poloidal_magnetic_flux_at_magnetic_axis
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/position/psi
    dd_path: waves/coherent_wave/beam_tracing/beam/position/psi
    status: composed
- name: power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative power of a given physical channel within the plasma volume
    enclosed by a specified magnetic flux surface, obtained by integrating the relevant
    volumetric power density from the magnetic axis to that surface.
  documentation: 'This quantity represents the radially cumulative power of a physical
    channel enclosed within the plasma volume bounded by a given magnetic flux surface.
    It provides the flux-surface-resolved power-balance profile used in transport
    analyzes, expressing how heating or loss power accumulates from the magnetic axis
    outward to a specified radial location.


    The defining relation integrates the volumetric power density $p_\mathrm{vol}$
    of the relevant channel over the enclosed plasma volume:


    $$

    P(\psi) = \int_{V(\psi)} p_\mathrm{vol} \, dV

    $$


    where $V(\psi)$ is the plasma volume enclosed by the flux surface labeled by the
    poloidal flux coordinate $\psi$, and the integration runs from the magnetic axis
    outward.


    In practice, $P(\psi)$ is computed by integrating channel-specific deposition
    profiles derived from wave propagation calculations, beam-particle tracing, or
    spectroscopic radiation measurements. Species-resolved specializations include
    [electron power](name:electron_power_at_inside_flux_surface) for net power transferred
    to the electron population and [ion power](name:ion_power_at_inside_flux_surface)
    for the ion population; [absorbed wave power] gives the total absorbed auxiliary-heating
    power, and [radiated power] tracks cumulative radiation losses. When the reference
    surface coincides with the last closed flux surface, the cumulative value equals
    the corresponding total volume-integrated power expressed by [total plasma deposited
    power].


    Sign convention: Positive when the channel transfers net power to the plasma enclosed
    by the flux surface.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:electron_power_at_inside_flux_surface
  - name:ion_power_at_inside_flux_surface
  sources:
  - id: derived:power_at_inside_flux_surface
    status: composed
- name: electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative net power transferred to electrons within the plasma volume
    enclosed by a specified magnetic flux surface. It sums power delivered to fast
    suprathermal electrons and to the bulk thermal electron population.
  documentation: 'Electron power at inside flux surface is the cumulative net rate
    of energy transfer to all electron populations within the plasma volume enclosed
    by a specified magnetic flux surface. It is an enclosed-volume quantity: each
    surface includes all electron power deposition inside it, and the sum of fast
    and thermal electron components gives the total electron-channel contribution.


    The quantity is defined by integrating the flux-surface-averaged net electron
    power deposition density over enclosed volume, using the flux coordinate $\rho_\mathrm{tor,norm}$,
    the dimensionless normalized toroidal flux radius:


    $$

    P_e(\rho_s) = \int_0^{\rho_s} \left\langle q_e \right\rangle_{\rho} \frac{dV}{d\rho}
    \, d\rho

    $$


    where $P_e$ is the enclosed electron power in W, $\rho_s$ labels the bounding
    flux surface, $\left\langle q_e \right\rangle_{\rho}$ is the flux-surface-averaged
    net electron power deposition density in W m$^{-3}$, and $dV/d\rho$ is the differential
    enclosed volume in m$^3$ per unit $\rho_\mathrm{tor,norm}$. The derivative $dP_e/d\rho
    = \left\langle q_e \right\rangle_{\rho} dV/d\rho$ is a power per unit normalized
    flux radius, not a volumetric density by itself.


    In practice, local electron energy-transfer rates are mapped to magnetic flux
    surfaces from wave absorption, fast-particle slowing down, collisional exchange,
    or power-balance calculations, then flux-surface averaged and integrated outward
    from the magnetic axis. The decomposition corresponds to [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface)
    for suprathermal electrons plus [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface)
    for the bulk thermal electron population; at the outer closed surface it can be
    compared with [total_electron_power](name:total_electron_deposited_power) when
    the same source set and plasma volume are used.


    Typical enclosed electron powers are 10^4-10^6 W in small or low-power experiments,
    10^5-10^7 W for individual electron-heating systems in medium-size tokamaks, and
    10^7-10^8 W in high-power or reactor-scale scenarios. For purely deposited auxiliary
    power, the value generally rises from about 0 W near the magnetic axis to the
    electron-channel total at the outer closed surface; decreases with increasing
    $\rho_\mathrm{tor,norm}$ or negative values indicate net electron cooling or transfer
    of energy from electrons to another channel.


    Sign convention: Positive when net power is transferred to the electron population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
  - name:thermal_electron_power_at_inside_flux_surface
  - name:total_electron_deposited_power
  arguments:
  - name: power_at_inside_flux_surface
    operator: electron
    operator_kind: qualifier
- name: fast_electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by non-thermal fast electrons inside
    a specified magnetic flux surface, equal to the enclosed-volume integral of the
    local fast-electron power-deposition density.
  documentation: 'Fast-electron power inside a flux surface is the cumulative rate
    at which coherent-wave energy is absorbed by non-thermal electrons in the plasma
    volume enclosed by a closed magnetic surface. It represents the fast-electron
    part of the auxiliary wave-power deposition, distinct from deposition on thermal
    electrons or ions. The surface label should be an explicitly named flux coordinate,
    for example $(\psi,\theta,\phi)$ or $(\rho_{\mathrm{tor,norm}},\theta,\phi)$,
    where $\theta$ is a poloidal angle and $\phi$ is the toroidal angle of the right-handed
    cylindrical $(R,\phi,Z)$ frame with $R$ major radius and $Z$ vertical height.


    For a selected flux surface labeled by $\chi_s$, the enclosed fast-electron power
    is the volume integral


    $$

    P_{\mathrm{fast}\,e}^{\mathrm{inside}}(\chi_s)=\int_{\Omega_s} p_{\mathrm{fast}\,e}(\mathbf{x})\,dV

    $$


    where $\chi$ is the chosen flux-surface label, $\Omega_s$ is the plasma volume
    enclosed between the magnetic axis and the surface $\chi=\chi_s$, $p_{\mathrm{fast}\,e}$
    is the local [fast_electron_power_density](name:fast_electron_power_density) in
    W m$^{-3}$, $dV$ is a volume element in m$^3$, and the result is in W.


    In practice this quantity is obtained by integrating a local fast-electron wave-power
    deposition density over reconstructed magnetic-flux-surface volumes. Together
    with [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface),
    it describes how absorbed wave power is partitioned within the electron population;
    at the outermost closed flux surface it corresponds to the global [fast_electron_power](name:fast_electron_power)
    for the same absorption definition. The analogous non-thermal ion quantity is
    [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_state_power_at_inside_flux_surface),
    and all such channels contribute to the overall auxiliary-heating power balance
    represented by quantities such as [total_electron_power](name:total_electron_deposited_power).


    Representative magnitudes range from near 0 W on surfaces enclosing little or
    no fast-electron absorption to the order of the coupled auxiliary-wave power.
    Depending on device size and heating scenario, enclosed fast-electron powers can
    span roughly 10^3-10^7 W, with megawatt-scale values possible when wave absorption
    is dominated by non-thermal electrons.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_density
