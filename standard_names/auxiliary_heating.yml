- name: perpendicular_fast_particle_energy
  kind: scalar
  status: active
  description: Perpendicular fast-particle energy is the part of the suprathermal
    particle kinetic energy associated with motion perpendicular to the local magnetic
    field, integrated over the plasma volume.
  documentation: 'Perpendicular fast-particle energy is the part of the kinetic energy
    of the suprathermal particle population associated with motion perpendicular to
    the local magnetic field. It complements [parallel fast-particle energy](name:parallel_fast_particle_energy)
    within the total [fast-particle energy](name:fast_particle_energy).


    It is defined by


    $$

    W_{\perp,\mathrm{fast}} = \int_{\mathcal{V}} \int \frac{1}{2} m v_\perp^2 f_{\mathrm{fast}}(\mathbf{r},\mathbf{v})\,d^3v\,d^3r

    $$


    where $\mathcal{V}$ is the plasma volume, $f_{\mathrm{fast}}(\mathbf{r},\mathbf{v})$
    is the fast-particle phase-space distribution, $m$ is particle mass, and $v_\perp$
    is the speed component perpendicular to the local magnetic field. For a gyrotropic
    distribution, the corresponding energy density is the perpendicular pressure,
    so the quantity equals the volume integral of [perpendicular fast-particle pressure](name:perpendicular_fast_particle_pressure),
    summed over the included fast-particle species.'
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:parallel_fast_particle_energy
  - name:fast_particle_energy
  - name:perpendicular_fast_particle_pressure
  arguments:
  - name: fast_particle_energy
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - dd_path: summary/global_quantities/energy_fast_perpendicular/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-energy_fast_perpendicular-value
    dd_documentation:
