- name: triangularity_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless shaping parameter measuring the inward displacement of
    the vertical extrema of a nested toroidal flux surface relative to its geometric
    center, normalized by the flux-surface minor radius.
  documentation: "The triangularity $\\delta$ of a magnetic flux surface is a dimensionless\
    \ plasma shaping parameter quantifying the degree to which the flux-surface poloidal\
    \ cross-section is displaced toward a D-shaped or triangular form. It is defined\
    \ via the major-radius offset of the upper and lower vertical extrema from the\
    \ flux-surface geometric center, normalized by the minor radius, and constitutes\
    \ one of the primary degrees of freedom in plasma shape optimization for confinement\
    \ and MHD stability.\n\nFor a flux surface with geometric center $R_{geo} = (R_{out}\
    \ + R_{in})/2$, minor radius $a = (R_{out} - R_{in})/2$, and major radius $R_{ext}$\
    \ at a vertical extremum, the triangularity is:\n\n$$\n\\delta = \\frac{R_{geo}\
    \ - R_{ext}}{a}\n$$\n\nwhere $R_{out}$ and $R_{in}$ are the outboard and inboard\
    \ midplane radii of the flux surface in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame. The general triangularity is the average of the [upper](name:upper_triangularity_of_flux_surface)\
    \ and [lower](name:lower_triangularity_of_flux_surface) components evaluated at\
    \ their respective vertical extrema.\n\nThe triangularity profile as a function\
    \ of the flux-surface label is derived from equilibrium reconstruction by fitting\
    \ magnetic field measurements to the inferred flux-surface geometry. Together\
    \ with [elongation](name:elongation_of_flux_surface), it specifies the leading-order\
    \ departure of the cross-section from an ellipse; higher-order deformations are\
    \ captured by squareness parameters such as [lower inner squareness](name:lower_inner_squareness_of_flux_surface).\n\
    \nTypical values at the last closed flux surface range from $|\\delta| \\approx\
    \ 0.3$\u2013$0.5$ in standard H-mode operation; strongly shaped devices may reach\
    \ $|\\delta| \\approx 0.6$\u2013$0.8$. The triangularity decreases monotonically\
    \ toward zero at the magnetic axis.\n\nSign convention: Positive when the vertical\
    \ extrema of the flux surface are displaced toward smaller major radius $R$ relative\
    \ to the geometric center $R_{geo}$, corresponding to a conventional D-shaped\
    \ cross-section."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity_of_flux_surface
  - name:lower_triangularity_of_flux_surface
  - name:elongation_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/triangularity_lower
    dd_path: equilibrium/time_slice/profiles_1d/triangularity_lower
    status: composed
- name: lower_triangularity_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless shaping parameter measuring the inward horizontal displacement
    of the lower vertical extremum of a nested toroidal flux surface, normalized by
    the flux-surface minor radius.
  documentation: 'Lower triangularity of a flux surface quantifies how far the lower
    part of the poloidal cross-section is shifted inward relative to the magnetic
    axis. It separates up-down asymmetric shaping from the corresponding upper triangularity;
    for an up-down symmetric surface the upper and lower triangularities are equal,
    and an unsplit triangularity is commonly represented by that common value or by
    an average of the two.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the lower triangularity
    is defined by


    $$

    \delta_\mathrm{lower} = \frac{R_\mathrm{axis} - R_\mathrm{lower}}{a}

    $$


    where $R_\mathrm{axis}$ is the major radius of the magnetic axis, $R_\mathrm{lower}$
    is the major radius of the point on the flux surface with the lowest vertical
    position $Z$, and $a = (R_\mathrm{out} - R_\mathrm{in})/2$ is the minor radius
    of the same flux surface determined from its outermost and innermost midplane
    intersections.


    It is obtained from an equilibrium reconstruction or analytic flux-surface description
    by locating the magnetic axis, tracing the chosen closed flux contour, finding
    its lower vertical extremum, and normalizing the horizontal displacement by the
    contour minor radius. Positive values correspond to the lower extremum lying at
    smaller major radius than the magnetic axis, while negative values indicate an
    outward-shifted lower extremum.


    Typical values range from about -0.4 to 0.8. Conventional positive-triangularity
    tokamak plasmas often have values around 0.2-0.6 near the outer flux surfaces,
    nearly circular surfaces have values close to 0, and negative-triangularity configurations
    have values below 0.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:triangularity_of_flux_surface
  - name:lower_triangularity_of_plasma_boundary
  arguments:
  - name: triangularity_of_flux_surface
    operator: lower
    operator_kind: qualifier
- name: triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Average triangularity (\u03B4) of the plasma boundary, measuring the\
    \ mean inward radial displacement of the poloidal cross-section extrema relative\
    \ to the geometric center normalized by the plasma minor radius."
  documentation: "Triangularity is a dimensionless shape parameter quantifying the\
    \ deviation of the plasma poloidal cross-section from an ellipse. The average\
    \ triangularity $\\delta$ is the arithmetic mean of the upper and lower directional\
    \ components, defined at the topmost and bottommost points of the last closed\
    \ flux surface. Together with [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),\
    \ it is a primary descriptor of plasma shape governing MHD stability margins,\
    \ bootstrap current fraction, and confinement quality.\n\nThe average triangularity\
    \ is defined as:\n\n$$\n\\delta = \\frac{\\delta_U + \\delta_L}{2}\n$$\n\nwhere\
    \ $\\delta_U$ is the [upper_triangularity_of_plasma_boundary](name:upper_triangularity_of_plasma_boundary)\
    \ and $\\delta_L$ is the [lower_triangularity_of_plasma_boundary](name:lower_triangularity_of_plasma_boundary).\
    \ Each directional component is $(R_\\mathrm{geo} - R_\\mathrm{ext})/a$, where\
    \ $R_\\mathrm{geo} = (R_\\mathrm{max} + R_\\mathrm{min})/2$ is the major radius\
    \ of the geometric center, $R_\\mathrm{ext}$ is the major radius at the respective\
    \ poloidal extremum, and $a = (R_\\mathrm{max} - R_\\mathrm{min})/2$ is the plasma\
    \ minor radius.\n\nEquilibrium reconstruction determines $\\delta$ from the fitted\
    \ boundary contour constrained by external magnetic measurements. Typical values\
    \ are $\\delta \\approx 0.2$\u2013$0.5$ in standard H-mode configurations and\
    \ can approach 0.7 or higher in strongly shaped divertor geometries; reverse-triangularity\
    \ discharges have $\\delta < 0$. For asymmetric equilibria, [outer_triangularity_of_plasma_boundary](name:outer_triangularity_of_plasma_boundary)\
    \ and [inner_triangularity_of_plasma_boundary](name:inner_triangularity_of_plasma_boundary)\
    \ provide the low-field-side and high-field-side decompositions respectively.\n\
    \nSign convention: Positive when the poloidal extrema of the plasma boundary are\
    \ displaced radially inward (toward smaller major radius $R$) relative to the\
    \ plasma geometric center."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:upper_triangularity_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  - name:outer_triangularity_of_plasma_boundary
  - name:inner_triangularity_of_plasma_boundary
- name: inner_triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: High-field-side triangularity of the plasma boundary, measuring the
    inboard boundary extrema relative to the plasma geometric center and minor radius.
  documentation: 'Inner triangularity is the high-field-side component of the triangular
    deformation of the plasma separatrix. In a poloidal cross-section of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height, it quantifies the inboard displacement of the triangularity-defining boundary
    extremum relative to the plasma geometric center. It complements [outer_triangularity_of_plasma_boundary](name:outer_triangularity_of_plasma_boundary)
    and the single averaged [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary).


    For an extremum-based separatrix shape description, the inner triangularity is
    commonly written as the normalized radial displacement


    $$

    \delta_{\mathrm{inner}} = \frac{R_{\mathrm{geo}} - R_{\mathrm{tri,in}}}{a}

    $$


    where $R_{\mathrm{geo}}$ is the major radius of the plasma geometric center in
    meters, $R_{\mathrm{tri,in}}$ is the major radius of the high-field-side separatrix
    extremum or fitted boundary point used to define the inner triangularity in meters,
    and $a$ is the boundary minor radius in meters. The result is dimensionless; values
    greater than zero correspond to an inboard triangularity point at smaller $R$
    than the geometric center, while values less than zero correspond to the opposite
    displacement.


    Inner triangularity is obtained from an equilibrium reconstruction or a fitted
    separatrix contour by determining the geometric center, the boundary minor radius,
    and the high-field-side boundary extremum used by the chosen shape definition.
    It is often interpreted together with minor_triangularity_of_plasma_boundary,
    [outer_triangularity_of_plasma_boundary](name:outer_triangularity_of_plasma_boundary),
    and [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary) because
    these parameters jointly describe the noncircular shape of the plasma cross-section.


    Typical reported magnitudes are of order a few tenths. Values near 0 indicate
    weak triangular shaping of the inboard side, while larger absolute values indicate
    stronger high-field-side indentation or anti-indentation; the realized range depends
    on device geometry, divertor configuration, and the operational scenario.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:outer_triangularity_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: inner
    operator_kind: qualifier
- name: lower_triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Lower triangularity is a dimensionless shape parameter for the lower\
    \ half of the plasma boundary in the right-handed cylindrical (R, \u03C6, Z) frame,\
    \ where R is major radius and Z is vertical height. It is the inward displacement\
    \ of the boundary point at minimum Z relative to the geometric center, normalized\
    \ by half the maximum-minus-minimum R extent."
  documentation: 'Lower triangularity $\delta_{\rm lower}$ quantifies triangular shaping
    of the lower half of the plasma boundary in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It compares
    the major radius of the lower boundary extremum with the geometric center constructed
    from the inboard and outboard radial extrema of the same boundary.


    The geometric definition uses the boundary minor-radius normalization:


    $$

    \delta_{\rm lower} = \frac{R_0 - R_{\rm low}}{a}, \qquad R_0 = \frac{R_{\rm out}+R_{\rm
    in}}{2}, \qquad a = \frac{R_{\rm out}-R_{\rm in}}{2}

    $$


    where $R_{\rm low}$ is the major radius in meters at the minimum-$Z$ point of
    the boundary, $R_{\rm in}$ and $R_{\rm out}$ are the minimum and maximum boundary
    major radii in meters, $R_0$ is the geometric-center major radius in meters, and
    $a$ is the [minor_radius_of_plasma_boundary](name:minor_radius_of_plasma_boundary)
    in meters. This construction makes inward lower shaping, $R_{\rm low}<R_0$, positive
    and outward lower shaping negative.


    It is computed from an equilibrium boundary contour by locating the inboard, outboard,
    and lower vertical extrema and applying the geometric construction above. The
    lower value can differ from [upper_triangularity_of_plasma_boundary](name:upper_triangularity_of_plasma_boundary)
    in vertically asymmetric, single-null, or double-null configurations, while minor_triangularity_of_plasma_boundary
    denotes a related but distinct boundary-shape measure.


    Typical values are order-unity dimensionless numbers: nearly circular or weakly
    shaped lower boundaries are close to 0, positive-triangularity tokamak plasmas
    commonly lie around 0.2-0.6, and reverse-triangularity lower shaping is negative.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  - name:upper_triangularity_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
- name: outer_triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless low-field-side triangularity of the separatrix, representing
    the mean inward radial indentation of the upper and lower outboard shoulders relative
    to the plasma geometric center, normalized by the horizontal minor radius.
  documentation: 'Outer triangularity of the plasma boundary is a dimensionless measure
    of the low-field-side triangular indentation of the separatrix in a poloidal cross-section
    of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. It combines the upper and lower shoulder displacements
    into one outboard shape parameter, so it is distinct from choosing either upper
    or lower triangularity alone.


    For a boundary contour with geometric center $R_{\mathrm{geo}}$ and horizontal
    minor radius $a$, the outer triangularity is defined as the arithmetic mean of
    the upper and lower normalized radial displacements:


    $$

    \delta_{\mathrm{outer}} = \frac{1}{2}\left(\frac{R_{\mathrm{geo}} - R_{\mathrm{upper}}}{a}
    + \frac{R_{\mathrm{geo}} - R_{\mathrm{lower}}}{a}\right)

    $$


    where $R_{\mathrm{upper}}$ and $R_{\mathrm{lower}}$ are the $R$ coordinates of
    the upper and lower vertical extrema of the same separatrix contour, $R_{\mathrm{geo}}=(R_{\mathrm{out}}+R_{\mathrm{in}})/2$,
    and $a=(R_{\mathrm{out}}-R_{\mathrm{in}})/2$ with $R_{\mathrm{out}}$ and $R_{\mathrm{in}}$
    the maximum and minimum $R$ values of the contour. The two normalized displacements
    are combined by averaging; they are not alternative definitions of this scalar.


    In practice, this quantity is obtained from an equilibrium boundary reconstruction
    or a fitted separatrix contour by identifying the inboard and outboard radial
    extrema, locating the upper and lower vertical turning points, and averaging their
    normalized radial offsets. Boundary smoothing and the treatment of X-point neighborhoods
    can affect the extracted extrema, so consistent contour processing is important
    when comparing cases.


    Typical values are near 0 for nearly circular cross-sections, about 0.2-0.5 for
    many conventionally D-shaped tokamak plasmas, and can be negative for inverse
    or outward-flared triangularity. Values above about 0.6 represent strongly shaped
    boundaries.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_triangularity_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: outer
    operator_kind: qualifier
- name: upper_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Ratio of the vertical distance from the plasma cross-section geometric
    axis to the topmost boundary point to the minor radius, capturing vertical elongation
    of the upper half of the plasma boundary.
  documentation: "The upper elongation $\\kappa_u$ is a dimensionless shape parameter\
    \ quantifying how far the upper half of the plasma boundary extends vertically\
    \ relative to the minor radius. Unlike the full-boundary [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),\
    \ which represents the overall vertical-to-horizontal aspect ratio of the cross-section,\
    \ $\\kappa_u$ isolates the upper-half geometry and is sensitive to up-down asymmetries\
    \ induced by, for example, a single-null divertor configuration.\n\nThe quantity\
    \ is defined as:\n\n$$\n\\kappa_u = \\frac{Z_{\\max} - Z_{\\rm geo}}{a}\n$$\n\n\
    where $Z_{\\max}$ is the vertical coordinate of the topmost point of the plasma\
    \ boundary in the right-handed cylindrical $(R, \\phi, Z)$ frame, $Z_{\\rm geo}$\
    \ is the vertical coordinate of the geometric axis of the poloidal cross-section,\
    \ and $a$ is the plasma minor radius.\n\nThis parameter is obtained from equilibrium\
    \ reconstruction by identifying the outermost closed flux surface or the specified\
    \ plasma boundary contour and computing the ratio from the upper vertical extremum.\
    \ The companion quantity [lower_elongation_of_plasma_boundary](name:lower_elongation_of_plasma_boundary)\
    \ measures the analogous shape of the lower half; differences between the two\
    \ reflect up-down asymmetry in the plasma cross-section. In conventional single-null\
    \ diverted H-mode plasmas, $\\kappa_u$ falls in the range 1.2\u20131.9.\n\nSign\
    \ convention: Positive when the topmost point of the plasma boundary lies above\
    \ the geometric axis of the cross-section."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  arguments:
  - name: elongation_of_plasma_boundary
    operator: upper
    operator_kind: qualifier
- name: upper_inner_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce (2013) squareness coefficient for the upper-inner,
    high-field-side quadrant (smaller major radius, positive vertical height) of a
    nested magnetic flux surface. It measures the deviation of that quadrant from
    a reference ellipse sharing the same center, horizontal half-width, and elongation;
    zero recovers the ellipse, positive values give a boxier corner and negative values
    a more diamond-like corner.
  documentation: 'Upper-inner squareness of a flux surface is the dimensionless Luce
    shape coefficient that describes how the upper, high-field-side quadrant (smaller
    major radius $R$, positive vertical height $Z$) of a nested magnetic flux surface
    departs from a reference ellipse. The reference ellipse for that quadrant shares
    the same geometric center, the same horizontal half-width (minor radius $a$),
    and the same elongation $\kappa$ as the local flux surface, so the coefficient
    isolates the corner curvature alone. It is the upper-inner quadrant component
    of [inner_squareness_of_flux_surface](name:inner_squareness_of_flux_surface).


    In the four-quadrant parameterization of Luce (PPCF 55, 2013), the vertical coordinate
    of the upper-inner segment of the surface, expressed in the poloidal cross-section
    of the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is major radius
    and $Z$ is vertical height, follows:


    $$

    Z(\theta) = a\,\kappa\,\sin\!\bigl(\theta + \zeta_{ui}\,\sin(2\theta)\bigr)

    $$


    where $a$ is the local minor radius (horizontal half-width), $\kappa$ is the local
    elongation, $\theta$ is the geometric poloidal angle measured in the $(R, Z)$
    cross-section, and $\zeta_{ui}$ is the upper-inner squareness coefficient. The
    upper-inner quadrant is the segment running from the top of the surface to the
    inner (high-field-side) midplane. Setting $\zeta_{ui} = 0$ recovers the reference
    ellipse exactly; positive values produce a more rectangular, box-like corner,
    while negative values yield a concave, diamond-like corner.


    The coefficient is obtained from an equilibrium flux-surface contour by first
    determining the surface center, minor radius, and elongation, then fitting the
    Luce parameterization on the upper-inner segment alone. Across nested surfaces
    it varies smoothly from the magnetic axis to the boundary, where it connects continuously
    to upper_inner_squareness_of_plasma_boundary.


    Values are small in magnitude near the axis, where surfaces are nearly elliptical,
    and grow toward the edge of shaped equilibria; strongly shaped cases produce the
    largest magnitudes.


    Sign convention: Positive when the upper-inner corner of the flux surface protrudes
    outward beyond the reference ellipse, giving a more rectangular poloidal cross-section.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_flux_surface
  arguments:
  - name: inner_squareness_of_flux_surface
    operator: upper
    operator_kind: qualifier
- name: upper_outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient for the upper outboard quadrant
    of each nested flux surface, measuring the departure of that corner from a reference
    ellipse with the same center, horizontal half-width, and elongation.
  documentation: "The upper outer squareness $\\zeta_{uo}$ is the dimensionless Luce\
    \ (2013) shape coefficient for the upper outboard ($+Z$, large-$R$) corner of\
    \ each nested magnetic flux surface, measuring how much that quadrant departs\
    \ from a reference ellipse sharing the same geometric center, horizontal half-width,\
    \ and elongation. It is one of four quadrant-resolved squareness parameters \u2014\
    \ alongside the [lower outer squareness](name:lower_outer_squareness_of_flux_surface),\
    \ [upper inner squareness](name:upper_inner_squareness_of_flux_surface), and [lower\
    \ inner squareness](name:lower_inner_squareness_of_flux_surface) \u2014 extending\
    \ the standard elongation-triangularity shape description to higher order.\n\n\
    In the right-handed cylindrical $(R, \\phi, Z)$ frame, the flux-surface boundary\
    \ in the upper outer quadrant is described by the Luce parameterization as:\n\n\
    $$\nR = R_\\mathrm{geo} + a\\cos\\!\\bigl(\\theta + \\delta_{uo}\\sin\\theta +\
    \ \\zeta_{uo}\\sin 2\\theta\\bigr)\n$$\n\nwith $Z = Z_\\mathrm{geo} + \\kappa\\\
    , a\\sin\\theta$, where $R_\\mathrm{geo}$ and $Z_\\mathrm{geo}$ are the coordinates\
    \ of the flux-surface geometric center, $a$ is the minor radius, $\\kappa$ is\
    \ the elongation, $\\delta_{uo}$ is the upper outer triangularity, and $\\theta\
    \ \\in [0, \\pi/2]$ is the geometric poloidal angle spanning the upper outboard\
    \ quadrant.\n\nValues near zero indicate an approximately elliptic corner; positive\
    \ values are characteristic of D-shaped cross-sections with a squared-off outboard\
    \ corner, while negative values correspond to a more concave or helmet-shaped\
    \ upper outer region. The coefficient is extracted from equilibrium reconstruction\
    \ by fitting computed flux-surface contours to the Luce parameterization in the\
    \ upper outboard region. The symmetric combination of upper and lower outer quadrant\
    \ values constitutes the aggregate [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface),\
    \ and the value at the outermost flux surface corresponds to [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary).\n\
    \nSign convention: Positive when the upper outer corner of the flux surface protrudes\
    \ beyond the reference ellipse, giving the cross-section a more rectangular (D-shaped)\
    \ outboard corner."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  - name:outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_plasma_boundary
  arguments:
  - name: outer_squareness_of_flux_surface
    operator: upper
    operator_kind: qualifier
- name: upper_outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Dimensionless Luce shape parameter for the upper outboard corner of\
    \ the plasma boundary in the right-handed cylindrical (R, \u03C6, Z) system. It\
    \ measures how the positive-Z, large-R boundary quadrant departs from the reference\
    \ ellipse set by the boundary radius, upper elongation, and upper triangularity."
  documentation: 'Upper outer squareness of the plasma boundary quantifies the non-elliptical
    shaping of the outboard, positive-$Z$ quadrant of the last-closed flux surface
    or separatrix. In the right-handed cylindrical $(R,\phi,Z)$ system, $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height; the upper outer
    quadrant lies at larger $R$ than the radial center and above the vertical center.
    Positive values in the Luce convention make this quadrant fuller and squarer relative
    to the reference ellipse, while negative values make it more chamfered or indented.


    A full Luce parameterization for the upper outer boundary quadrant is


    $$

    \begin{aligned}

    R(\theta) &= R_0 + a\cos\left[\theta + \sin^{-1}(\delta_u)\sin\theta - \zeta_{UO}\sin(2\theta)\right],\\

    Z(\theta) &= Z_0 + \kappa_u a\sin\left[\theta + \zeta_{UO}\sin(2\theta)\right],\qquad
    0 \le \theta \le \frac{\pi}{2}.

    \end{aligned}

    $$


    Here $\zeta_{UO}$ is the upper outer squareness, $\theta=0$ is the outboard midplane
    point, and $\theta=\pi/2$ is the top point. $R_0=(R_{out}+R_{in})/2$ is the radial
    center, $a=(R_{out}-R_{in})/2$ is the boundary minor radius, $Z_0$ is the vertical
    center used for the boundary shape description, $\kappa_u=(Z_{top}-Z_0)/a$ is
    the upper elongation, and $\delta_u=(R_0-R_{top})/a$ is the upper triangularity.
    For small $|\zeta_{UO}|$, the effect is locally proportional to $\sin 2\theta$,
    but the parameter is defined by the full angular distortion rather than by a single
    midpoint displacement.


    The quantity is obtained from an equilibrium boundary contour by identifying the
    radial and vertical extrema, fixing the associated radius, center, elongation,
    and triangularity, and fitting the upper-outboard segment to the Luce form. The
    analogous flux-surface quantity, [upper outer squareness of a flux surface](name:upper_outer_squareness_of_flux_surface),
    applies the same shape concept to an interior magnetic surface rather than to
    the plasma boundary.


    Values near 0 correspond to an approximately elliptical upper outer quadrant.
    In shaped tokamak equilibria, typical absolute values are a few hundredths to
    a few tenths, commonly about 0.02-0.2, with strongly squared boundaries sometimes
    approaching 0.3.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_outer_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  arguments:
  - name: outer_squareness_of_plasma_boundary
    operator: upper
    operator_kind: qualifier
- name: upper_triangularity_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless upper-half triangularity of a flux surface, defined by
    the inward major-radius displacement of the point at maximum vertical height from
    the surface horizontal mid-radius, normalized by the minor radius.
  documentation: 'Upper triangularity of a flux surface quantifies the D-shape asymmetry
    of the upper half of a closed magnetic surface in a poloidal cross-section. It
    isolates the position of the topmost point relative to the same surface''s horizontal
    mid-radius, so it distinguishes upper-half shaping from lower-half triangularity
    and from elongation.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the upper triangularity
    is defined by


    $$

    \delta_\mathrm{upper} = \frac{R_0 - R_\mathrm{top}}{a}

    $$


    where $R_\mathrm{top}$ is the major radius of the point with maximum $Z$ on the
    flux surface, $R_0=(R_\mathrm{out}+R_\mathrm{in})/2$ is the horizontal mid-radius
    of that surface, and $a=(R_\mathrm{out}-R_\mathrm{in})/2$ is its minor radius.
    The lengths $R_\mathrm{top}$, $R_0$, $R_\mathrm{out}$, $R_\mathrm{in}$, and $a$
    are in meters, while $\delta_\mathrm{upper}$ is dimensionless; $R_\mathrm{out}$
    and $R_\mathrm{in}$ are the maximum and minimum major radii of the same flux surface.


    It is computed from an equilibrium flux contour or an analytic flux-surface shape
    by locating the horizontal radial extrema and the upper vertical extremum of the
    contour. Together with lower triangularity, elongation, and squareness parameters,
    it describes poloidal shaping and up-down asymmetry of nested flux surfaces.


    Typical values in tokamak equilibrium descriptions are commonly between about
    -0.6 and 0.6. Values near zero indicate that the upper extremum lies close to
    the horizontal mid-radius, positive values indicate an inward-shifted upper point,
    and negative values indicate an outward-shifted upper point.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:triangularity_of_flux_surface
  - name:elongation_of_flux_surface
  arguments:
  - name: triangularity_of_flux_surface
    operator: upper
    operator_kind: qualifier
- name: upper_triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless parameter measuring how far the uppermost point of the
    plasma boundary is displaced radially inward relative to the plasma geometric
    center, normalized to the minor radius, capturing the triangular deviation of
    the upper half of the cross-section.
  documentation: 'The upper triangularity $\delta_u$ characterizes the poloidal asymmetry
    of the upper portion of the plasma cross-section. It quantifies how far the uppermost
    point of the plasma boundary is displaced toward the high-field side relative
    to the plasma geometric center, and is a key shaping parameter governing MHD stability,
    pedestal formation, and divertor heat-load distribution in shaped tokamak discharges.


    The upper triangularity is defined geometrically as:


    $$

    \delta_u = \frac{R_0 - R_{top}}{a}

    $$


    where $R_0$ is the major radius of the plasma geometric center (midpoint between
    maximum and minimum major radius on the horizontal midplane), $R_{top}$ is the
    major radius of the uppermost point of the plasma boundary, and $a$ is the plasma
    minor radius.


    Together with [lower_triangularity_of_plasma_boundary](name:lower_triangularity_of_plasma_boundary),
    $\delta_u$ captures up-down asymmetry in plasma shape that is characteristic of
    single-null divertor configurations, where the half facing the divertor typically
    exhibits higher triangularity. Their mean approximates the overall [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary).
    Typical H-mode values range from 0.2 to 0.7 in standard tokamak operation. For
    finer resolution of the upper boundary geometry, $\delta_u$ is complemented by
    the [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and upper_inner_squareness_of_plasma_boundary parameters. Upper triangularity
    is inferred from equilibrium reconstruction using external magnetics and boundary
    identification diagnostics.


    Sign convention: Positive when the uppermost point of the plasma boundary lies
    at smaller major radius than the plasma geometric center, displaced toward the
    high-field side.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_triangularity_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: upper
    operator_kind: qualifier
- name: vacuum_magnetic_field
  kind: vector
  status: draft
  description: Magnetic-field vector produced exclusively by external coil currents,
    satisfying the curl-free condition throughout the plasma volume in the absence
    of any plasma currents.
  documentation: "The vacuum magnetic field $\\mathbf{B}_\\mathrm{vac}$ is the magnetic-field\
    \ vector that exists throughout the plasma region when no plasma is present, arising\
    \ entirely from the external coil system \u2014 toroidal field coils, poloidal\
    \ field coils, and correction coils. It is the vacuum-limit component of the full\
    \ equilibrium [magnetic_field](name:magnetic_field), against which the plasma-current\
    \ contribution is superposed to yield the total equilibrium field.\n\nThe absence\
    \ of free currents in the vacuum region constrains $\\mathbf{B}_\\mathrm{vac}$\
    \ to satisfy\n\n$$\n\\nabla \\times \\mathbf{B}_\\mathrm{vac} = \\mathbf{0}\n\
    $$\n\nso that $\\mathbf{B}_\\mathrm{vac} = -\\mu_0 \\nabla \\phi_m$, where $\\\
    phi_m$ is a scalar magnetic potential and $\\mu_0$ is the permeability of free\
    \ space. The field also satisfies $\\nabla \\cdot \\mathbf{B}_\\mathrm{vac} =\
    \ 0$. In practice it is evaluated via Biot-Savart integration over the coil current\
    \ distribution or by solving Laplace's equation for $\\phi_m$ with coil-boundary\
    \ conditions.\n\nThe vector is expressed in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is the major radius and $Z$ is the vertical height.\
    \ The [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field) component\
    \ dominates in tokamak geometry and varies roughly as $1/R$; the poloidal components,\
    \ governed by the poloidal coil configuration, are typically one to two orders\
    \ of magnitude smaller.\n\nSign convention: Positive when the toroidal component\
    \ $B_{\\phi,\\mathrm{vac}}$ points in the direction of increasing toroidal angle\
    \ $\\phi$."
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:toroidal_vacuum_magnetic_field
  arguments:
  - name: magnetic_field
    operator: vacuum
    operator_kind: qualifier
  sources:
  - id: derived:vacuum_magnetic_field
    status: composed
- name: toroidal_vacuum_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the vacuum magnetic field evaluated at the reference
    major radius, produced solely by the external coil system in the absence of any
    plasma currents.
  documentation: "The vacuum toroidal magnetic field $B_0$ is the $\\hat{\\phi}$-projection\
    \ of the [vacuum_magnetic_field](name:vacuum_magnetic_field) evaluated at a fixed\
    \ [reference major radius](name:reference_major_radius) $R_0$. It captures the\
    \ toroidal field contribution from the external coil system \u2014 primarily the\
    \ toroidal field coils \u2014 with no plasma-current contribution included.\n\n\
    For an ideal current-free axisymmetric configuration the vacuum toroidal field\
    \ follows a $1/R$ profile:\n\n$$\nB_\\phi^{\\rm vac}(R) = \\frac{R_0 B_0}{R}\n\
    $$\n\nwhere $R_0$ is the reference major radius and $B_0 \\equiv B_\\phi^{\\rm\
    \ vac}(R_0)$. The product $R_0 B_0$ is invariant across radial position and serves\
    \ as the primary magnetic normalization parameter used throughout equilibrium\
    \ reconstruction, stability analysis, and flux-coordinate definitions.\n\nThe\
    \ value of $B_0$ is inferred from the electrical current in the toroidal field\
    \ coil system via a calibrated coil-current-to-field relationship, or confirmed\
    \ by in-vessel magnetic probes under vacuum conditions. It enters the definition\
    \ of the normalized toroidal flux coordinate $\\rho_{\\rm tor} = \\sqrt{\\Phi_{\\\
    rm tor}/(\\pi B_0)}$, linking it directly to [toroidal_flux_radius_of_magnetic_axis](name:toroidal_flux_radius_of_magnetic_axis),\
    \ and normalizes current densities used across core and edge plasma analysis.\
    \ It also differs from the flux_surface_average_magnetic_field in that the latter\
    \ includes plasma diamagnetic and paramagnetic modifications. Typical values at\
    \ the reference radius range from 1 T in small devices to 5\u20136 T in large\
    \ high-field machines.\n\nSign convention: Positive when $B_\\phi$ points in the\
    \ direction of increasing toroidal angle $\\phi$."
  unit: T
  physics_domain: equilibrium
  links:
  - name:vacuum_magnetic_field
  - name:reference_major_radius
  - name:toroidal_flux_radius_of_magnetic_axis
  arguments:
  - name: vacuum_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: vertical_coordinate_of_active_limiter_point
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the active limiter point, the location where\
    \ a limited plasma boundary contacts the limiter, in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of the active limiter point is the $Z$ component
    of the point where a limited plasma boundary is in contact with the material limiter.
    It is expressed in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius in meters, $\phi$ is toroidal angle in radians increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height in meters.


    If the active limiter contact point is denoted $P_\mathrm{AL}=(R_\mathrm{AL},
    \phi_\mathrm{AL}, Z_\mathrm{AL})$, its vertical coordinate is


    $$

    z_\mathrm{AL}=Z_\mathrm{AL}

    $$


    where $R_\mathrm{AL}$ is the point''s major radius in meters, $\phi_\mathrm{AL}$
    is its toroidal angle in radians, and $Z_\mathrm{AL}$ is its vertical height in
    meters.


    In equilibrium analysis, the active limiter point is identified from the contact
    between the reconstructed plasma boundary and the limiter geometry for a limited
    configuration. This coordinate is the vertical companion of major_radius_coordinate_of_active_limiter_point;
    related vertical coordinates include [vertical_coordinate_of_plasma_boundary](name:vertical_coordinate_of_plasma_boundary),
    [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point),
    and [vertical_coordinate_of_plasma_boundary_gap_reference_point](name:vertical_coordinate_of_plasma_boundary_gap_reference_point).


    Typical values are device dependent and commonly lie between -2 m and 2 m in medium-sized
    tokamaks, with larger vertical excursions possible in elongated or vertically
    shifted plasmas. The value depends on the chosen vertical origin of the device
    coordinate definition and on which limiter element is contacted.


    Sign convention: Positive when the active limiter point lies in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
  - name:vertical_coordinate_of_closest_wall_point
- name: vertical_coordinate_of_closest_wall_point
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of the first-wall point geometrically nearest\
    \ to the plasma boundary or separatrix, measured upward from the machine midplane\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of the closest wall point is the $Z$ value
    of the point on the first wall that minimizes the geometric distance to the plasma
    boundary or separatrix. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    $Z$ is vertical height measured upward from the machine midplane, and this quantity
    identifies only the vertical component of that nearest wall location.


    For a first-wall contour $\Gamma_w$ and a plasma boundary or separatrix contour
    $\Gamma_p$ in the same poloidal $(R, Z)$ cross-section, the closest wall point
    $q_*=(R_*,Z_*)$ is defined by the Euclidean poloidal-plane distance:


    $$

    q_* = \operatorname*{arg\,min}_{q \in \Gamma_w}\; \min_{p \in \Gamma_p} \sqrt{(R_q
    - R_p)^2 + (Z_q - Z_p)^2}

    $$


    where $q=(R_q,Z_q)$ is a point on the first wall and $p=(R_p,Z_p)$ is a point
    on the plasma boundary or separatrix. The documented quantity is $Z_*$. If more
    than one wall point has exactly the same minimum distance, the geometric definition
    alone does not determine a unique point and an additional tie-breaking convention
    is required.


    In practice, this coordinate is computed from a reconstructed plasma boundary
    or separatrix and a first-wall contour expressed in the same right-handed cylindrical
    $(R, \phi, Z)$ frame, usually by interpolation and a nearest-distance search in
    the poloidal $(R, Z)$ plane. Together with the corresponding [major radius of
    the closest wall point], it specifies the poloidal location of the nearest wall
    point; by itself it gives only the vertical height.


    Typical values are bounded by the vertical extent of the first wall. For a wall
    extending from $Z_{\min}$ to $Z_{\max}$, the coordinate lies between those limits
    in m; values near $0$ m indicate a closest point near the machine midplane, positive
    values indicate the upper side, and negative values indicate the lower side.


    Sign convention: Positive when the wall point lies in the $+Z$ direction, above
    the machine midplane, in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links: []
- name: vertical_coordinate_of_constraint_position
  kind: scalar
  status: draft
  description: "Vertical Z coordinate locating a point at which a physical quantity\
    \ is imposed as a constraint during equilibrium reconstruction, measured in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical coordinate $Z$ specifies the height of a position at\
    \ which a physical quantity \u2014 such as the parallel current density $j_\\\
    parallel$, safety factor $q$, toroidal current density $j_\\phi$, or pressure\
    \ $p$ \u2014 is prescribed as a constraint during equilibrium reconstruction.\
    \ It is measured in the right-handed cylindrical $(R, \\phi, Z)$ frame, where\
    \ $Z$ is the height along the machine symmetry axis, with $Z = 0$ conventionally\
    \ at the machine equatorial plane.\n\nTogether with the companion major-radius\
    \ coordinate, $Z$ fully locates each constraint point in the poloidal cross-section.\
    \ Equilibrium solvers minimize the mismatch between the MHD equilibrium solution\
    \ and the constrained physical quantities at their specified $(R, Z)$ positions,\
    \ making accurate constraint-point coordinates essential metadata for interpreting\
    \ which plasma-profile measurements drive the reconstruction. The analogous coordinate\
    \ for diagnostic measurement positions is given by [vertical_coordinate_of_measurement_position](name:vertical_coordinate_of_measurement_position).\n\
    \nIn medium-to-large tokamaks the vertical extent of the confined plasma region\
    \ spans roughly $-2$ to $+2$ m, with $Z = 0$ at the midplane.\n\nSign convention:\
    \ Positive when the constraint position lies above the machine equatorial plane\
    \ in the $+Z$ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_measurement_position
- name: vertical_coordinate_of_control_surface
  kind: scalar
  status: draft
  description: "Vertical coordinate of the control surface in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, identifying the height of the boundary surface used to\
    \ evaluate the normal component of non-axisymmetric magnetic fields."
  documentation: "The control surface is a geometric boundary \u2014 typically a closed\
    \ toroidal surface enclosing the plasma \u2014 at which the normal component of\
    \ the non-axisymmetric magnetic field is evaluated. Its vertical coordinate identifies\
    \ the height of each surface point in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is the major radius measured from the machine symmetry\
    \ axis and $Z$ is the vertical height. Together with the corresponding major-radius\
    \ coordinate, the $Z$ coordinate fully specifies the poloidal cross-sectional\
    \ location of any control-surface point.\n\nControl surfaces are employed in non-axisymmetric\
    \ magnetostatics, error-field analysis, and resonant magnetic perturbation studies.\
    \ The surface geometry is prescribed, and the normal magnetic flux through each\
    \ area element is then computed from the field values and the local surface-normal\
    \ vector; the $Z$ coordinate of each surface point enters both the geometric specification\
    \ of the surface and the projection of normal-field couplings between external\
    \ coil perturbations and the plasma interior.\n\nThis coordinate belongs to the\
    \ same geometric family as [vertical_coordinate_of_sensor_attachment_point](name:z_coordinate_of_sensor_attachment_point)\
    \ and [vertical_coordinate_of_beam_tracing_point](name:vertical_coordinate_of_beam_tracing_point),\
    \ all giving the $Z$ position of a specified geometric locus. For medium to large\
    \ tokamaks, control-surface $Z$ values typically range from approximately $-3$\
    \ m to $+3$ m, spanning the full vertical extent of the plasma cross-section.\n\
    \nSign convention: Positive when the control surface point lies above the device\
    \ midplane in the $+Z$ direction."
  unit: m
  physics_domain: equilibrium
  links:
  - name:z_coordinate_of_sensor_attachment_point
  - name:vertical_coordinate_of_beam_tracing_point
- name: vertical_coordinate_of_current_center
  kind: scalar
  status: draft
  description: "Vertical coordinate of the plasma current center, defined as the toroidal\
    \ current-density-weighted centroid of the plasma current distribution in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of the current center is the $Z$ position
    of the centroid of the toroidal plasma current distribution in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It describes the effective vertical location
    of the net plasma current in the poloidal cross-section.


    For an axisymmetric equilibrium, the current center is defined by the signed toroidal
    current-density-weighted centroid:


    $$

    Z_\mathrm{cc} = \frac{\int_\Omega Z\, j_\phi(R,Z)\, dA}{\int_\Omega j_\phi(R,Z)\,
    dA}

    $$


    where $Z_\mathrm{cc}$ is the vertical coordinate of the current center in m, $Z$
    is vertical height in m, $j_\phi$ is the toroidal current density in A m$^{-2}$,
    $dA$ is the poloidal area element in m$^2$, and $\Omega$ is the current-carrying
    plasma cross-section in the right-handed cylindrical $(R, \phi, Z)$ frame. The
    denominator is the total signed toroidal plasma current.


    In practice, this quantity is computed from an equilibrium reconstruction or model
    that provides the toroidal current-density distribution. It is useful for describing
    vertical plasma position control because it tracks the centroid of the current
    channel rather than a purely geometric boundary center.


    Typical values are near the magnetic or geometric midplane. In many medium-size
    tokamaks, vertical offsets are commonly within about $\pm 0.3$ m, while large
    or strongly shaped plasmas can have offsets approaching about $\pm 1$ m depending
    on the chosen $Z=0$ reference plane and operating scenario.


    Sign convention: Positive when the current-density-weighted centroid lies in the
    $+Z$ direction from the $Z=0$ reference plane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_geometric_axis
- name: vertical_coordinate_of_dr_dz_zero_point
  kind: scalar
  status: draft
  description: "Vertical coordinate, measured from the machine midplane in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, of a selected plasma-boundary or separatrix\
    \ point where major radius has zero slope with respect to vertical height. The\
    \ point marks an inner or outer radial extremum of the boundary shape."
  documentation: 'The vertical coordinate of a $dR/dZ=0$ point is the scalar $Z_0$
    of a selected point on the plasma boundary or separatrix where the contour reaches
    a radial extremum in a poloidal cross-section. It is measured from the machine
    midplane in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    Let $R_b(Z)$ represent the local branch of the boundary contour near the selected
    radial extremum. The defining condition is:


    $$

    \left.\frac{dR_b}{dZ}\right|_{Z=Z_0} = 0

    $$


    where $Z_0$ is the documented vertical coordinate in meters, $R_b$ is the boundary
    major radius in meters expressed as a function of the vertical coordinate $Z$
    in meters, and the derivative is evaluated on the selected branch. If both the
    high-field-side and low-field-side branches satisfy this condition, the relevant
    solution is the one associated with the intended radial extremum; it should be
    interpreted together with the companion major-radius coordinate or an explicit
    inner/outer branch specification.


    In equilibrium analysis, $Z_0$ is obtained by tracing or interpolating the plasma
    boundary or separatrix in a fixed-$\phi$ cross-section of the right-handed cylindrical
    $(R, \phi, Z)$ frame and solving for zeros of $dR_b/dZ$. The value is used with
    boundary-shape quantities such as the boundary major radius and minor radius to
    characterize radial extrema and vertical displacement of the plasma shape.


    Typical values are machine-size dependent and lie within the vertical extent of
    the boundary. Midplane-centered, up-down symmetric equilibria commonly give $Z_0$
    close to 0 m for radial extrema, while vertically shifted or asymmetric equilibria
    can give signed values from less than 0.01 m in magnitude to several m in large
    devices.


    Sign convention: Positive when the selected point lies in the $+Z$ direction from
    the machine midplane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_geometric_axis
  - name:vertical_coordinate_of_current_center
- name: vertical_coordinate_of_geometric_axis
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of the plasma geometric axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, measured upward from the machine midplane.\
    \ It is the arithmetic midpoint between the maximum and minimum vertical positions\
    \ of the last closed flux surface."
  documentation: 'The vertical coordinate of the geometric axis is the $Z$ location
    halfway between the uppermost and lowermost points of the last closed flux surface.
    It is defined in the right-handed cylindrical $(R, \phi, Z)$ system, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height measured
    upward from the machine midplane. This is an extrema-based midpoint, not a vertical
    centroid or area-weighted center of the boundary.


    The quantity is defined from the vertical extrema of the plasma boundary:


    $$

    Z_\mathrm{geom} = \frac{Z_\mathrm{max} + Z_\mathrm{min}}{2}

    $$


    where $Z_\mathrm{max}$ and $Z_\mathrm{min}$ are the maximum and minimum boundary
    vertical coordinates in meters, and $Z_\mathrm{geom}$ is the vertical coordinate
    of the geometric axis.


    In practice, $Z_\mathrm{geom}$ is computed from an equilibrium reconstruction
    after identifying the last closed flux surface or separatrix and finding its upper
    and lower vertical extrema. It is complementary to the radial geometric-axis coordinate
    and can differ from the [vertical coordinate of the magnetic axis](name:vertical_coordinate_of_magnetic_axis),
    especially in shaped or vertically displaced plasmas.


    Typical values are near 0 m for plasmas centered on the machine midplane, often
    within -0.5 m to 0.5 m in medium-size tokamaks. Larger devices or deliberately
    vertically shifted equilibria can have values of order several meters.


    Sign convention: Positive when the geometric axis lies above the machine midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the magnetic axis in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, where the magnetic axis is the innermost degenerate flux\
    \ surface at which the poloidal magnetic flux gradient vanishes."
  documentation: 'The vertical coordinate of the magnetic axis is the $Z$ position
    of the innermost degenerate magnetic flux surface in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The magnetic axis is the point in an axisymmetric poloidal
    cross-section about which closed magnetic surfaces are nested; it is distinct
    from the geometric center of the plasma boundary and from X-point locations.


    The magnetic-axis location $(R_0,Z_0)$ is identified by the stationary point of
    the poloidal magnetic flux:


    $$

    \nabla_{R,Z}\psi(R_0,Z_0) = 0

    $$


    where $\psi$ is [poloidal_magnetic_flux](name:poloidal_magnetic_flux) in Wb, $\nabla_{R,Z}$
    is the gradient in the poloidal plane of the right-handed cylindrical $(R,\phi,Z)$
    frame, $R_0$ is the major radius of the magnetic axis, and $Z_0$ is this vertical
    coordinate. The associated flux value is [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis),
    which provides the inner reference for normalized poloidal-flux coordinates.


    In practice, this coordinate is obtained from equilibrium reconstruction by locating
    the extremum of $\psi$ inside the last closed flux surface, constrained by magnetic
    measurements and, where available, kinetic or imaging information. It is used
    to quantify vertical plasma displacement and to compare magnetic-axis position
    with quantities such as the geometric-axis height and X-point height.


    Typical values are near 0 m when the $Z$ origin is the device midplane and the
    plasma is vertically centered. Controlled offsets are often within -0.05-0.05
    m in small and medium tokamaks and within -0.2-0.2 m in larger devices, while
    vertically shifted scenarios can reach order -1-1 m depending on the chosen origin
    and plasma size.


    Sign convention: Positive when the magnetic axis lies in the $+Z$ direction relative
    to the coordinate origin in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_geometric_axis
  - name:vertical_coordinate_of_primary_x_point
  - name:vertical_coordinate_of_secondary_x_point
- name: vertical_coordinate_of_measurement_position
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of a diagnostic measurement position in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, measured upward from the machine\
    \ midplane at Z = 0. Together with the major radius R and toroidal angle \u03C6\
    , it fully specifies the poloidal-plane location of the measurement point in axisymmetric\
    \ geometry."
  documentation: 'The vertical coordinate $Z$ locates a diagnostic measurement position
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    measured from the machine symmetry axis, $\phi$ is the toroidal angle increasing
    counter-clockwise viewed from above $+\hat{Z}$, and $Z$ is the vertical height
    measured upward from the machine midplane at $Z = 0$. Together with the major
    radius $R$ and toroidal angle $\phi$ of the same point, it fully specifies the
    location of the measurement position in axisymmetric geometry.


    The coordinate is the vertical projection of the measurement point onto the $\hat{Z}$
    axis:


    $$

    Z = \hat{Z} \cdot \mathbf{r}

    $$


    where $\mathbf{r}$ is the position vector of the measurement point and $\hat{Z}$
    is the vertical unit vector of the right-handed cylindrical $(R, \phi, Z)$ basis.


    The value is obtained from the geometric calibration of the diagnostic system,
    which fixes the vertical placement of apertures, collection optics, and detector
    elements relative to the machine reference frame.


    Typical values lie within the vacuum vessel bounds, spanning roughly $-2$ to $+2$
    m centered on the machine midplane in medium-to-large tokamaks, with the exact
    range set by device geometry.


    Sign convention: Positive when the measurement position lies above the machine
    midplane in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_bolometer
  - name:vertical_coordinate_of_filter_window
- name: vertical_coordinate_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Vertical height coordinate of points on the plasma boundary contour\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, where Z is measured upward\
    \ from the machine midplane."
  documentation: "The vertical coordinate gives the $Z$ component of each point tracing\
    \ the plasma boundary contour \u2014 the outermost closed flux surface in limited\
    \ configurations or the separatrix in diverted configurations \u2014 in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $Z$ is the vertical height from the\
    \ machine midplane and $R$ is the major radius from the symmetry axis.\n\nTogether\
    \ with the corresponding radial coordinate, these $Z$ values fully define the\
    \ poloidal cross-sectional shape of the plasma boundary, which governs geometric\
    \ descriptors such as [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)\
    \ and the proximity of the plasma to the first wall, as characterized by [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point).\
    \ In diverted plasmas the boundary follows the separatrix through the X-point\
    \ region, whose vertical position is described by [vertical_coordinate_of_primary_x_point](name:vertical_coordinate_of_primary_x_point).\n\
    \nThe boundary outline is derived from equilibrium reconstruction using external\
    \ magnetic measurements and flux loop data. Typical $Z$ values span from approximately\
    \ $-a\\kappa$ to $+a\\kappa$, where $a$ is the minor radius and $\\kappa$ is the\
    \ elongation; for medium and large tokamaks this corresponds to a range of roughly\
    \ $\\pm 1$ to $\\pm 3$ m.\n\nSign convention: Positive when the boundary point\
    \ lies above the machine midplane, in the direction of increasing $Z$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:vertical_coordinate_of_closest_wall_point
- name: vertical_coordinate_of_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: "Height above the machine midplane of the reference point from which\
    \ a plasma boundary gap is defined, in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The vertical coordinate $Z$ of the reference point anchoring a plasma
    boundary gap, defined in the right-handed cylindrical $(R, \phi, Z)$ frame where
    $R$ is the major radius, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above, and $Z$ is the height measured upward along the machine
    symmetry axis. Plasma boundary gaps quantify the clearance between the plasma
    separatrix (or last closed flux surface) and the first wall or limiter; each gap
    is anchored at a pre-defined geometric reference point, and this coordinate specifies
    its vertical location within the poloidal cross-section.


    In equilibrium analysis and position control, gap reference points are fixed as
    part of the machine geometry configuration. The actual gap distance along the
    specified direction is given by gap_at_plasma_boundary_gap_reference_point, while
    the general scalar separation from the reference point to the boundary is captured
    by distance_of_plasma_boundary_gap. The vertical position of the plasma boundary
    itself is described by [vertical_coordinate_of_plasma_boundary](name:vertical_coordinate_of_plasma_boundary),
    and the analogous coordinate for the geometrically nearest wall point by [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point).


    For medium-to-large tokamaks, gap reference points span the poloidal cross-section,
    with $Z$ values ranging from roughly $-3$ to $+3$ m depending on machine size
    and the placement of position-control gaps at inner, outer, upper, and lower vessel
    locations.


    Sign convention: Positive when the reference point lies above the tokamak midplane
    in the direction of increasing $Z$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
  - name:vertical_coordinate_of_closest_wall_point
  sources:
  - id: dd:pulse_schedule/position_control/gap/z
    dd_path: pulse_schedule/position_control/gap/z
    status: composed
- name: vertical_coordinate_of_primary_x_point
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of the primary X-point in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of the primary X-point is the $Z$ position
    of the main saddle point of the poloidal magnetic flux that forms the separatrix
    in an axisymmetric equilibrium. It is expressed in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    The primary X-point position $(R_X,Z_X)$ is the saddle point at which the poloidal-flux
    gradient in the poloidal $R$-$Z$ plane vanishes:


    $$

    \nabla_{R,Z}\psi(R_X,Z_X)=\left(\frac{\partial\psi}{\partial R},\frac{\partial\psi}{\partial
    Z}\right)_{(R_X,Z_X)}=(0,0)

    $$


    where $\psi$ is the poloidal magnetic flux in webers, $R$ and $Z$ are measured
    in meters, and $(R_X,Z_X)$ are the radial and vertical coordinates of the null
    in the right-handed cylindrical $(R,\phi,Z)$ frame. For an axisymmetric equilibrium
    with total poloidal flux $\psi$, $B_R=-(2\pi R)^{-1}\partial\psi/\partial Z$ and
    $B_Z=(2\pi R)^{-1}\partial\psi/\partial R$, so this condition is equivalent to
    vanishing radial and vertical components of the poloidal magnetic field at the
    X-point. The point is an X-point rather than a magnetic axis because the flux
    surface has saddle topology there.


    The coordinate is obtained from equilibrium reconstruction by locating the primary
    saddle of $\psi$ after fitting or interpolating the reconstructed flux map. Constraints
    may come from magnetic probes, flux loops, coil currents, kinetic pressure information,
    and boundary diagnostics; the reported value depends on the selected separatrix
    when several magnetic nulls exist.


    Typical values should be assessed relative to the chosen vertical origin rather
    than as a universal device-independent range. With an origin near the machine
    midplane, a lower primary X-point has negative $Z_X$ and an upper primary X-point
    has positive $Z_X$; the magnitude is normally of order the plasma minor radius
    and lies within the modeled vessel and separatrix vertical extent.


    Sign convention: Positive when the primary X-point lies in the $+Z$ direction
    of the right-handed cylindrical $(R,\phi,Z)$ frame relative to the chosen vertical
    origin.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_x_point
  - name:vertical_coordinate_of_secondary_x_point
- name: vertical_coordinate_of_secondary_x_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the secondary X-point, the poloidal magnetic
    null that anchors the secondary separatrix in double-null and snowflake divertor
    configurations.
  documentation: "The secondary X-point is a poloidal magnetic null at which both\
    \ components of the poloidal magnetic field vanish and the secondary separatrix\
    \ topology is established. It arises in advanced divertor configurations \u2014\
    \ double-null, snowflake, and related geometries \u2014 where a second separatrix\
    \ surface exists, directly influencing power exhaust and particle control. The\
    \ vertical coordinate $Z$ of this null locates it in the poloidal cross-section\
    \ within the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the\
    \ major radius from the toroidal symmetry axis and $Z$ is the height measured\
    \ from the geometric midplane.\n\nNull points of the poloidal field are saddle\
    \ points of the poloidal magnetic flux $\\psi(R, Z)$, satisfying\n\n$$\n\\frac{\\\
    partial \\psi}{\\partial R} = 0 \\quad \\text{and} \\quad \\frac{\\partial \\\
    psi}{\\partial Z} = 0\n$$\n\nwhere the secondary X-point is the solution located\
    \ outside the primary separatrix. Equilibrium reconstruction determines $\\psi(R,\
    \ Z)$ and identifies all saddle points numerically to extract this coordinate.\n\
    \nIn symmetric double-null configurations the secondary X-point lies near the\
    \ negative of the primary X-point $Z$-value; in asymmetric or snow-flake geometries\
    \ its height depends on plasma shape and coil currents. The [vertical_coordinate_of_primary_x_point](name:vertical_coordinate_of_primary_x_point)\
    \ provides the companion coordinate for the dominant null, while [vertical_coordinate_of_x_point](name:vertical_coordinate_of_x_point)\
    \ documents the generic single-null case.\n\nSign convention: Positive when the\
    \ secondary X-point lies above the geometric midplane, i.e., $Z > 0$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_primary_x_point
  - name:vertical_coordinate_of_x_point
- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the strike point, the location where the\
    \ plasma separatrix intersects a divertor target plate or limiter surface in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The strike point is the intersection of the plasma separatrix \u2014\
    \ the outermost closed magnetic flux surface boundary \u2014 with a plasma-facing\
    \ component, typically a divertor target plate. In a diverted tokamak configuration,\
    \ separatrix field lines originate at the poloidal magnetic null, the [X-point](name:vertical_coordinate_of_x_point),\
    \ and terminate at the divertor surface. The vertical coordinate $Z$ locates this\
    \ termination in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$\
    \ is the major radius measured from the symmetry axis and $Z$ is directed vertically\
    \ along the symmetry axis.\n\nThe strike-point position is obtained from equilibrium\
    \ reconstruction by intersecting the traced separatrix contour \u2014 derived\
    \ from the reconstructed poloidal flux distribution \u2014 with the known device\
    \ geometry. Both the primary and secondary separatrices can yield associated strike-point\
    \ positions, corresponding to different divertor target plates in single-null\
    \ and double-null configurations.\n\nIn standard single-null and double-null divertor\
    \ configurations, strike points are positioned at $|Z|$ values of order $0.5$\u2013\
    $2.0$ m from the geometric midplane, reflecting the vertical depth of the divertor\
    \ chamber and strongly depending on device size and plasma shaping.\n\nSign convention:\
    \ Positive when the strike point lies in the $+Z$ direction, above the tokamak\
    \ geometric midplane."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_x_point
- name: vertical_coordinate_of_x_point
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of the X-point, the poloidal magnetic null point\
    \ at which the separatrix forms, in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: "The X-point is a magnetic null in the poloidal cross-section where\
    \ the gradient of the poloidal magnetic flux $\\psi$ vanishes, causing adjoining\
    \ flux surfaces to merge and form the separatrix that separates confined plasma\
    \ from the scrape-off layer. Its vertical position $Z_X$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame is a fundamental geometric parameter of divertor configurations.\n\
    \nThe X-point location satisfies the simultaneous first-order null conditions\
    \ on $\\psi(R, Z)$:\n\n$$\n\\left.\\frac{\\partial \\psi}{\\partial R}\\right|_{(R_X,\\\
    ,Z_X)} = \\left.\\frac{\\partial \\psi}{\\partial Z}\\right|_{(R_X,\\,Z_X)} =\
    \ 0\n$$\n\nwhere $R_X$ is the major-radius position and $Z_X$ is the vertical\
    \ position, both in meters.\n\nThe vertical coordinate is obtained from equilibrium\
    \ reconstruction by solving the Grad-Shafranov equation and locating saddle points\
    \ of $\\psi(R, Z)$, constrained by external magnetic measurements. Measured position\
    \ estimates from real-time magnetics diagnostics may also serve as direct constraints\
    \ in the reconstruction fit.\n\nIn lower single-null configurations $Z_X$ is negative\
    \ (below the midplane), while upper single-null configurations yield positive\
    \ $Z_X$; typical magnitudes lie in the range 0.5\u20132.0 m for medium-to-large\
    \ tokamaks. When both X-points are present in double-null equilibria, their vertical\
    \ coordinates are captured by [vertical_coordinate_of_primary_x_point](name:vertical_coordinate_of_primary_x_point)\
    \ and [vertical_coordinate_of_secondary_x_point](name:vertical_coordinate_of_secondary_x_point).\n\
    \nSign convention: Positive when the X-point lies above the geometric midplane\
    \ in the $+Z$ direction."
  unit: m
  physics_domain: equilibrium
  links: []
- name: vertical_magnetic_field
  kind: scalar
  status: draft
  description: "Z component of the magnetic field vector in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, where Z is vertical height. It includes contributions\
    \ from plasma currents, external coil systems, and any non-axisymmetric field\
    \ perturbations."
  documentation: 'The vertical magnetic field $B_Z$ is the projection of the [magnetic_field](name:magnetic_field)
    vector onto the vertical unit direction $\hat{Z}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is one component of the poloidal magnetic field in axisymmetric
    equilibria, and it may also include toroidally varying contributions; the non-axisymmetric
    part is represented by [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field).
    The same component evaluated at material boundary locations is [vertical_magnetic_field_at_wall](name:vertical_magnetic_field_at_wall).


    In an axisymmetric equilibrium, $B_Z$ is related to the radial derivative of the
    [poloidal_magnetic_flux](name:poloidal_magnetic_flux) function $\psi(R, Z)$:


    $$

    B_Z = \frac{1}{R}\frac{\partial \psi}{\partial R}

    $$


    where $R$ is major radius in meters, $Z$ is vertical height, and $\psi$ is the
    poloidal magnetic flux per radian. Axis and boundary reference values such as
    [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    and poloidal_magnetic_flux_at_boundary set flux-surface normalization, while the
    local derivative of $\psi$ determines the vertical magnetic-field component.


    $B_Z$ is computed in equilibrium reconstruction from magnetic measurements, plasma-current
    constraints, and, when available, internal magnetic-field constraints such as
    motional Stark effect polarimetry. It can also be obtained directly from magnetic-field
    calculations by projecting the vector field onto $\hat{Z}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    Representative values are highly device- and location-dependent. In tokamak plasma
    regions, $|B_Z|$ is commonly much smaller than the toroidal magnetic field, often
    in the range $10^{-3}$-$10^{-1}$ T, with larger local values possible near strong
    poloidal-field coils, divertor regions, or X-point shaping fields.


    Sign convention: Positive when $B_Z$ points in the $+Z$ direction.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  - name:vertical_magnetic_field_at_wall
  - name:poloidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_magnetic_axis
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: vertical_magnetization_of_iron_core_segment
  kind: scalar
  status: draft
  description: "Vertical component of an iron-core segment's magnetization in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, taken to be uniform within the\
    \ segment. The quantity is mu0 times M_Z, so it is expressed in tesla rather than\
    \ amperes per meter."
  documentation: 'Vertical magnetization of an iron-core segment is the component
    along the $Z$ direction of the volume-averaged magnetization vector $\mathbf{M}$
    within a discrete ferromagnetic iron-core segment, in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. Each segment is treated as having a single uniform magnetization,
    so this quantity is one scalar per segment. The physical magnetization is magnetic
    dipole moment per unit volume (units A m$^{-1}$); the value reported here is scaled
    by the permeability of free space so that it carries units of tesla.


    The reported vertical component is the scaled quantity


    $$

    \mathcal{M}_Z = \mu_0 M_Z

    $$


    where $\mathcal{M}_Z$ is in T, $\mu_0$ is the permeability of free space ($4\pi
    \times 10^{-7}$ T m A$^{-1}$), and $M_Z$ is the $Z$ component of $\mathbf{M}$
    in A m$^{-1}$. In macroscopic magnetostatics the magnetization enters through
    the constitutive relation $\mathbf{B} = \mu_0(\mathbf{H} + \mathbf{M})$, where
    the magnetic flux density $\mathbf{B}$ is in T and the magnetic field intensity
    $\mathbf{H}$ and the magnetization $\mathbf{M}$ are both in A m$^{-1}$.


    In equilibrium analysis this component is generally inferred from external magnetic
    measurements together with a magnetic model of the iron structure rather than
    measured directly within the material. Its magnitude and sign are governed by
    the local field, the segment geometry, and the nonlinear iron $B$-$H$ response
    including magnetic saturation and hysteresis. The companion radial component is
    given by [radial_magnetization_of_iron_core_segment](name:radial_magnetization_of_iron_core_segment),
    and the associated field response is described by magnetic_field_of_iron_core_segment.


    For soft-iron cores the scaled magnetization saturates near the material''s saturation
    flux density, so magnitudes of order a few tesla represent an effective upper
    bound, with smaller magnitudes typical in unsaturated operation.


    Sign convention: Positive when the magnetization component points in the direction
    of increasing vertical coordinate $Z$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetization_of_iron_core_segment
- name: vertical_non_axisymmetric_magnetic_field
  kind: scalar
  status: draft
  description: "Vertical component of the non-axisymmetric vacuum magnetic field in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame. It is the signed Z-directed\
    \ part of toroidally varying perturbation fields such as error fields and resonant\
    \ magnetic perturbations."
  documentation: 'Vertical non-axisymmetric magnetic field is the $Z$ component of
    the toroidally varying part of a vacuum magnetic field in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It describes the upward or downward component of perturbation
    fields that break toroidal symmetry, excluding the axisymmetric equilibrium contribution.


    The component projection is defined by


    $$

    B_Z^{\mathrm{NA}}(R,\phi,Z) = \mathbf{B}_{\mathrm{NA}}(R,\phi,Z) \cdot \hat{Z}

    $$


    where $B_Z^{\mathrm{NA}}$ is the vertical non-axisymmetric magnetic field in tesla,
    $\mathbf{B}_{\mathrm{NA}}$ is the non-axisymmetric vacuum magnetic-field vector
    in tesla, $\hat{Z}$ is the vertical unit vector, $R$ is major radius in meters,
    $\phi$ is toroidal angle in radians, and $Z$ is vertical height in meters. In
    current-free vacuum regions this perturbation field satisfies $\nabla \cdot \mathbf{B}_{\mathrm{NA}}
    = 0$ and, away from coil conductors, $\nabla \times \mathbf{B}_{\mathrm{NA}} =
    0$.


    Together with the [radial non-axisymmetric magnetic field](name:radial_non_axisymmetric_magnetic_field)
    and [toroidal non-axisymmetric magnetic field](name:toroidal_non_axisymmetric_magnetic_field),
    this quantity completes the cylindrical component decomposition of $\mathbf{B}_{\mathrm{NA}}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. The related [vertical magnetic
    field at wall](name:vertical_magnetic_field_at_wall) is also a $Z$-component field,
    but refers to the total or relevant magnetic field at the wall rather than specifically
    to the toroidally varying vacuum perturbation.


    It is commonly computed from Biot-Savart integration over non-axisymmetric coil
    currents or from vacuum magnetic-field calculations, and may be compared with
    magnetic-probe measurements after accounting for probe orientation and location.
    The quantity is evaluated at physical locations of interest to characterize error
    fields, resonant magnetic perturbations, and their coupling to the plasma boundary
    or surrounding structures.


    Typical magnitudes are strongly device-, coil-current-, and location-dependent.
    The value is zero for a purely axisymmetric vacuum field and is usually interpreted
    in tesla or as a fraction of the local equilibrium magnetic field rather than
    by a universal numerical range.


    Sign convention: Positive when $B_Z^{\mathrm{NA}}$ points in the $+\hat{Z}$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links: []
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: vertical_velocity_at_current_center
  kind: scalar
  status: draft
  description: "Vertical velocity of the plasma-current centroid, equal to the time\
    \ derivative of its Z coordinate in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Vertical velocity at the current center is the rate of change of
    the vertical coordinate of the plasma-current centroid. The current center is
    the centroid of the toroidal plasma current density in a poloidal cross-section,
    with coordinates defined in the right-handed cylindrical $(R, \phi, Z)$ frame
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It is the velocity associated with vertical_position_at_current_center and is
    complementary to radial_velocity_at_current_center.


    The current-density-weighted definition can be written as:


    $$

    v_Z^{cc} = \frac{d}{dt}\left[\frac{\int_{\Omega_p} Z\, j_\phi(R,Z,t)\, dR\, dZ}{\int_{\Omega_p}
    j_\phi(R,Z,t)\, dR\, dZ}\right]

    $$


    where $v_Z^{cc}$ is the vertical velocity of the current center, $j_\phi$ is the
    toroidal component of the plasma current density, $\Omega_p$ is the plasma region
    in the poloidal cross-section, and the denominator is the total toroidal [plasma_current](name:toroidal_plasma_current)
    through that cross-section.


    In practice, the current-center position is obtained from an equilibrium solution
    or reconstruction of the toroidal current density distribution, and the velocity
    is computed from its time evolution, usually with smoothing or filtering because
    time differentiation amplifies noise. The quantity characterizes vertical motion
    of the current channel, which is especially important for position control and
    vertical-displacement dynamics in elongated plasmas. Unlike [toroidal_center_of_mass_velocity](name:toroidal_center_of_mass_velocity),
    it describes the motion of the current-density centroid rather than mass-weighted
    bulk plasma flow.


    Typical values are close to 0 m.s^-1 in a stationary or well-controlled equilibrium,
    because the current centroid is not translating vertically on average. During
    vertical transients the magnitude is device- and scenario-dependent and can become
    much larger than the controlled-state value, so universal numerical limits are
    not physically meaningful.


    Sign convention: Positive when the current centroid moves in the direction of
    increasing $Z$.'
  unit: m.s^-1
  physics_domain: equilibrium
  links:
  - name:toroidal_plasma_current
  - name:toroidal_center_of_mass_velocity
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/velocity_z
    dd_path: equilibrium/time_slice/global_quantities/current_centre/velocity_z
    status: composed
- name: volume_of_flux_surface
  kind: scalar
  status: draft
  description: Volume enclosed by a nested toroidal magnetic flux surface, increasing
    monotonically from zero at the magnetic axis to the total plasma volume at the
    last closed flux surface.
  documentation: 'The volume of a flux surface quantifies the total three-dimensional
    region enclosed within a closed toroidal magnetic surface on which magnetic field
    lines lie. In an axisymmetric equilibrium, these nested surfaces are labeled by
    the poloidal magnetic flux $\psi$, and $V(\psi)$ increases monotonically from
    zero at the magnetic axis to its maximum at the last closed flux surface.


    For an axisymmetric plasma in the right-handed cylindrical $(R, \phi, Z)$ frame,
    the enclosed volume follows from revolving the poloidal cross-section about the
    toroidal symmetry axis:


    $$

    V(\psi) = 2\pi \int_{\mathcal{A}(\psi)} R \, dR \, dZ

    $$


    where $R$ is the major radius from the symmetry axis and $\mathcal{A}(\psi)$ is
    the poloidal area enclosed by the flux contour at $\psi$.


    The volume profile is obtained from equilibrium reconstruction, which derives
    the flux surface geometry $\psi(R, Z)$ from external magnetic measurements augmented
    by internal diagnostics. It serves as the primary geometric metric in flux-surface-averaged
    transport equations: the differential $dV/d\psi$ acts as a volume element enabling
    conversion between flux coordinates and physical space. The companion quantities
    [surface_area_of_flux_surface](name:surface_area_of_flux_surface) and [cross_section_of_flux_surface](name:surface_area_of_flux_surface)
    give the total surface area and the poloidal cross-sectional area of the same
    flux surface.


    Typical enclosed volumes range from negligible values near the magnetic axis to
    tens of cubic meters for medium-sized tokamaks and several hundred cubic meters
    for reactor-scale devices at the last closed flux surface.


    Sign convention: Positive for all non-degenerate closed flux surfaces; the volume
    is zero only at the magnetic axis and increases monotonically outward to the plasma
    boundary.'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
- name: minimum_safety_factor
  kind: scalar
  status: draft
  description: Minimum safety factor is the lowest signed value attained by the safety-factor
    function q across closed magnetic flux surfaces. It is the value of the minimum,
    not the flux-surface location, and is used to assess access to low-order rational-q
    MHD thresholds.
  documentation: 'Minimum safety factor is the global minimum value of the signed
    safety factor on the nested closed magnetic flux surfaces. The safety factor on
    a surface is the field-line pitch, equal to the toroidal angle advance per poloidal
    circuit in flux coordinates $(\rho,\theta,\phi)$, with $\phi$ the toroidal angle
    of the right-handed cylindrical $(R,\phi,Z)$ frame where $R$ is major radius and
    $Z$ is vertical height. This quantity is the scalar value of that minimum; the
    corresponding surface location is represented by [poloidal_magnetic_flux_at_minimum_safety_factor](name:poloidal_magnetic_flux_at_minimum_safety_factor).


    The minimum is defined by taking the minimum of the safety-factor function over
    the closed-surface domain:


    $$

    q_{\min} = \min_{0 \le \rho \le 1} q(\rho)

    $$


    where $\rho$ is a dimensionless monotonic flux-surface label normalized to 0 at
    the magnetic axis and 1 at the last closed flux surface, $q(\rho)$ is the signed
    safety factor (dimensionless), and $q_{\min}$ is dimensionless. The result is
    independent of the particular monotonic label used, provided the same set of closed
    flux surfaces is covered.


    In practice, $q_{\min}$ is obtained from an equilibrium reconstruction by computing
    $q$ on closed flux surfaces from the magnetic-field geometry and locating the
    global minimum, with interpolation between evaluated surfaces when needed. Magnetic
    measurements constrain the reconstruction, and kinetic or polarimetric constraints
    may improve the inferred current density and field-line pitch. The related point
    value [safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95)
    samples $q$ near the edge rather than taking a global minimum.


    Typical tokamak values are about 0.7-2.5 for conventional or weakly reversed-shear
    plasmas. Values near 1 are important for internal-kink and sawtooth thresholds;
    crossing low-order rational values such as $3/2$ or $2$ can mark changes in resonant
    surfaces relevant to tearing and other MHD modes. Advanced or high-safety-factor
    scenarios may have $q_{\min}$ above 2.


    Sign convention: Positive when the toroidal angle advance of a magnetic field
    line is in the direction of increasing $\phi$ as the poloidal angle $\theta$ increases
    in flux coordinates $(\rho,\theta,\phi)$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_minimum_safety_factor
  arguments:
  - name: safety_factor
    operator: minimum
    operator_kind: qualifier
- name: normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Normalized poloidal flux coordinate evaluated on the flux surface where
    the safety factor reaches its global minimum within the confined plasma. It gives
    the radial flux-surface location of the minimum-q surface on the 0-to-1 poloidal-flux
    scale.
  documentation: 'Normalized poloidal flux coordinate at minimum safety factor is
    the value of the normalized poloidal flux coordinate $\psi_N$ on the flux surface
    where the [safety factor](name:safety_factor) $q$ is globally smallest inside
    the last-closed flux surface. It locates the minimum-$q$ surface relative to the
    magnetic axis and plasma boundary, independent of the dimensional scale of [poloidal
    magnetic flux](name:poloidal_magnetic_flux).


    The quantity is defined by minimizing the safety factor as a function of normalized
    poloidal flux coordinate and applying the axis-to-boundary normalization of poloidal
    magnetic flux:


    $$

    \psi_{N,q_{\min}} = \operatorname*{arg\,min}_{0 \le \psi_N \le 1} q(\psi_N), \qquad

    \psi_N = \frac{\psi - \psi_\mathrm{axis}}{\psi_\mathrm{b} - \psi_\mathrm{axis}}

    $$


    where $\psi_{N,q_{\min}}$ is the coordinate of the minimum-safety-factor surface,
    $q(\psi_N)$ is the safety factor on a closed flux surface, $\psi$ is the poloidal
    magnetic flux of that surface, $\psi_\mathrm{axis}$ is the value at the magnetic
    axis, and $\psi_\mathrm{b}$ is the value at the plasma boundary. The minimization
    is over closed flux surfaces in the confined plasma; if several surfaces share
    the same minimum value, the arg-min is mathematically non-unique.


    In practice this coordinate is computed from an equilibrium reconstruction by
    evaluating the safety-factor radial behavior on nested closed flux surfaces, identifying
    the global minimum, and converting the corresponding surface to $\psi_N$. The
    corresponding dimensional flux on the same surface is [poloidal_magnetic_flux_at_minimum_safety_factor](name:poloidal_magnetic_flux_at_minimum_safety_factor);
    a toroidal-flux-radius analog is [normalized_toroidal_flux_coordinate_at_minimum_safety_factor](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor).


    Typical values lie in the interval 0-1. Values near 0 indicate that the minimum
    safety factor is on or very close to the magnetic axis, while values around 0.2-0.6
    are common for reversed-shear or otherwise non-monotonic equilibria with an off-axis
    minimum; values approaching 1 indicate a minimum near the plasma boundary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  - name:normalized_poloidal_flux_coordinate
  arguments:
  - name: normalized_poloidal_flux_coordinate
    operator: minimum_safety_factor
    operator_kind: locus
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: Safety factor at the magnetic axis is the limiting value of the field-line
    pitch on the innermost closed magnetic flux surface, where the poloidal magnetic-flux
    gradient vanishes.
  documentation: 'Safety factor at the magnetic axis, often denoted $q_0$ or $q_\mathrm{axis}$,
    is the on-axis limit of the safety factor $q$. The safety factor expresses the
    field-line pitch on a closed magnetic flux surface: the number of toroidal turns
    made by a magnetic field line per poloidal circuit.


    For nested closed flux surfaces, the on-axis value can be defined from the flux-surface
    safety factor as


    $$

    q_0 = \lim_{\psi \to \psi_\mathrm{axis}} \frac{d\Phi_\mathrm{tor}}{d\psi}

    $$


    where $\Phi_\mathrm{tor}$ is the toroidal magnetic flux in Wb, $\psi$ is the poloidal
    magnetic flux in Wb, and $\psi_\mathrm{axis}$ is the poloidal magnetic flux at
    the magnetic axis.


    In practice, $q_0$ is obtained from equilibrium reconstruction by evaluating the
    reconstructed flux geometry and current distribution near the magnetic axis, then
    taking the innermost closed-flux-surface limit. It is sensitive to the central
    current density and is therefore less directly constrained by external magnetic
    measurements than edge or volume-integrated equilibrium quantities.


    Typical dimensionless values in tokamak equilibria are of order unity to several,
    rather than being fixed by a universal bound. Values close to low-order rational
    numbers, especially near one, are important for core magnetohydrodynamic stability.


    Sign convention: Positive when magnetic field lines advance in the direction of
    increasing toroidal angle $\phi$ for an advance in the positive poloidal angle
    $\theta$ in flux coordinates $(\psi, \theta, \phi)$, with $\phi$ increasing counter-clockwise
    when viewed from above $+\hat{Z}$.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  arguments:
  - name: safety_factor
    operator: magnetic_axis
    operator_kind: locus
- name: safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  kind: scalar
  status: draft
  description: Safety factor evaluated on the closed flux surface where normalized
    poloidal magnetic flux equals 0.95; it gives the toroidal field-line winding per
    poloidal circuit near the plasma edge.
  documentation: "The safety factor at normalized poloidal magnetic flux equal to\
    \ 0.95, often denoted $q_{95}$, is the value of the [safety factor](name:safety_factor)\
    \ on the closed flux surface where the normalized poloidal magnetic flux $\x7F\
    psi_N$ equals 0.95. It characterizes magnetic-field-line winding near the plasma\
    \ edge: the number of toroidal turns per poloidal turn on that surface. The 0.95\
    \ surface is close to, but distinct from, the boundary of closed flux surfaces\
    \ and is less sensitive than a separatrix value to X-point geometry in diverted\
    \ equilibria.\n\nUsing normalized poloidal magnetic flux as the radial label,\
    \ $q_{95}$ is defined by evaluating the safety-factor function at $\x7Fpsi_N =\
    \ 0.95$:\n\n$$\nq_{95} = q(\\psi_N = 0.95), \\qquad \\psi_N = \\frac{\\psi - \\\
    psi_\\mathrm{axis}}{\\psi_\\mathrm{b} - \\psi_\\mathrm{axis}}\n$$\n\nwhere $q(\\\
    psi_N)$ is dimensionless, $\\psi$ is the poloidal magnetic flux in Wb on the selected\
    \ closed flux surface, $\\psi_\\mathrm{axis}$ is the magnetic-axis poloidal flux\
    \ in Wb, and $\\psi_\\mathrm{b}$ is the boundary value in Wb for which [normalized\
    \ poloidal magnetic flux at the plasma boundary](name:normalized_poloidal_magnetic_flux_at_plasma_boundary)\
    \ equals 1. The underlying safety factor is the same dimensionless flux-increment\
    \ ratio as [safety_factor](name:safety_factor), formed from toroidal and poloidal\
    \ magnetic-flux increments measured in Wb.\n\nIn practice, $q_{95}$ is obtained\
    \ from an axisymmetric magnetic-equilibrium reconstruction constrained by external\
    \ magnetic measurements and, when available, internal information on current density\
    \ or field-line pitch. The reconstruction determines the nested closed flux surfaces\
    \ and the function $q(\\psi_N)$, which is then evaluated or interpolated at $\\\
    psi_N = 0.95$. This edge-near scalar complements [safety factor at the pedestal](name:safety_factor_at_pedestal),\
    \ [safety factor at the plasma boundary](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95),\
    \ [safety factor at the magnetic axis](name:safety_factor_at_magnetic_axis), and\
    \ [minimum safety factor](name:minimum_safety_factor) as summaries of the safety-factor\
    \ distribution.\n\nTypical tokamak values in conventional H-mode operation are\
    \ about 3-5, while broader operational scenarios can span roughly 2-8 depending\
    \ on plasma current, toroidal field, size, and shaping. Low-order rational values\
    \ of the edge-near safety factor are monitored because they can coincide with\
    \ magnetohydrodynamic resonances, but quantitative stability limits are scenario\
    \ dependent.\n\nSign convention: Positive when the signed toroidal magnetic flux\
    \ increases with the signed poloidal magnetic flux across neighboring closed flux\
    \ surfaces at $\\psi_N = 0.95$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:normalized_poloidal_magnetic_flux_at_plasma_boundary
  - name:safety_factor_at_pedestal
  - name:safety_factor_at_magnetic_axis
  - name:minimum_safety_factor
  arguments:
  - name: safety_factor
    operator: normalized_poloidal_magnetic_flux
    operator_kind: locus
- name: toroidal_total_current_density
  kind: scalar
  status: draft
  description: Toroidal projection of the total current density, aggregating ohmic,
    bootstrap, and all externally driven contributions over all plasma species and
    charge states.
  documentation: "The toroidal total current density is the $\\hat{\\phi}$-component\
    \ of the aggregated current density vector [total_current_density](name:total_current_density),\
    \ which sums ohmic, bootstrap, and externally driven currents over all plasma\
    \ species and charge states. It is the dominant current-density component in tokamak\
    \ operation because the plasma current flows primarily in the toroidal direction.\n\
    \nThe defining projection is:\n\n$$\nj_\\phi = \\mathbf{j}_\\mathrm{total} \\\
    cdot \\hat{\\phi}\n$$\n\nwhere $\\hat{\\phi}$ is the unit vector in the direction\
    \ of increasing toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\\
    phi, Z)$ frame and $\\mathbf{j}_\\mathrm{total}$ is the net current density aggregated\
    \ over all mechanisms and species.\n\nIn magnetohydrodynamic equilibrium, $j_\\\
    phi$ is the source term in the Grad-Shafranov equation governing the poloidal\
    \ flux distribution. It may be decomposed into partial contributions such as [toroidal_pfirsch_schlueter_current_density](name:toroidal_pfirsch_schlueter_current_density)\
    \ or mechanism-specific components like [toroidal_current_density_due_to_parallel_viscosity](name:toroidal_current_density_due_to_parallel_viscosity).\
    \ The orthogonal counterpart is [poloidal_current_density](name:poloidal_current_density).\
    \ The closely related [toroidal_current_density](name:toroidal_current_density)\
    \ names the same projection when no explicit aggregation qualifier is needed.\n\
    \nTypical core values span 0.1\u20135 MA m$^{-2}$ in medium-sized tokamaks, with\
    \ the profile peaking on axis and decreasing toward the separatrix.\n\nSign convention:\
    \ Positive when $j_\\phi$ points in the direction of increasing toroidal angle\
    \ $\\phi$."
