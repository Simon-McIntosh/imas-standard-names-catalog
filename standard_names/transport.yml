    status: composed
  - id: dd:plasma_profiles/ggd/ion/state/velocity_exb/parallel
    dd_path: plasma_profiles/ggd/ion/state/velocity_exb/parallel
    status: composed
- name: parallel_ion_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk ion fluid velocity vector along the local magnetic
    field direction.
  documentation: "The parallel ion velocity $v_{\\parallel,i} = \\mathbf{v}_i \\cdot\
    \ \\hat{b}$ quantifies the field-aligned flow of the bulk main ion species, averaged\
    \ over all charge states. In tokamaks, the parallel ion flow is driven by the\
    \ Pfirsch\u2013Schl\xFCter current, neoclassical viscosity, and momentum injection\
    \ from neutral beams; it reaches values of 10\u2013200 km/s in the core and can\
    \ reverse sign near the separatrix. The parallel velocity is measured by charge-exchange\
    \ recombination spectroscopy (CXRS) or directly from the Doppler shift of impurity\
    \ emission lines. The full velocity vector is given by [ion_velocity](name:ion_velocity),\
    \ with the poloidal component described by [poloidal_ion_velocity](name:poloidal_ion_velocity).\
    \ A charge-state-resolved counterpart is [parallel_ion_state_velocity](name:parallel_ion_state_velocity),\
    \ while the electron parallel flow is captured by [parallel_electron_velocity](name:parallel_electron_velocity).\n\
    \nSign convention: Positive when the velocity aligns with the direction of the\
    \ local magnetic field $\\mathbf{B}$ in the toroidal direction (increasing toroidal\
    \ angle $\\phi$)."
  unit: m.s^-1
  physics_domain: transport
