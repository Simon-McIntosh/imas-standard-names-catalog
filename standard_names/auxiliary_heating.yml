- name: width_of_aperture
  kind: scalar
  status: active
  description: Aperture width is the non-negative clear opening extent along the first
    local tangential direction in a right-handed aperture-local frame (first tangential,
    second tangential, normal). The second local tangential direction also lies in
    the aperture plane, and the normal is orthogonal to that plane.
  documentation: 'Aperture width is the non-negative clear extent of an aperture along
    its first local tangential direction. The aperture is described in a right-handed
    aperture-local frame $(\hat{t}_1, \hat{t}_2, \hat{n})$, where $\hat{t}_1$ and
    $\hat{t}_2$ are the first and second local tangential unit vectors in the aperture
    plane, $\hat{n}$ is the local normal, and $\hat{t}_1 \times \hat{t}_2 = \hat{n}$.


    For a clear opening region $\mathcal{A}$, the width is the maximum-minus-minimum
    span of the first-local-tangential coordinate:


    $$

    w = x_{1,\max} - x_{1,\min}

    $$


    where $w$ is the aperture width, $x_{1,\max}=\max_{\mathbf{r}\in\mathcal{A}}(\mathbf{r}\cdot\hat{t}_1)$
    and $x_{1,\min}=\min_{\mathbf{r}\in\mathcal{A}}(\mathbf{r}\cdot\hat{t}_1)$ are
    the maximum and minimum first-local-tangential length coordinates over the clear
    opening, $\mathbf{r}$ is a position vector relative to any fixed origin in the
    aperture plane, and $\mathcal{A}$ is the clear opening region.


    This quantity is a full aperture span, not a radius, semi-width, material width,
    support-structure dimension, or beam-envelope width. It uses only the first local
    tangential direction; the orthogonal in-plane extent along $\hat{t}_2$ is a different
    aperture dimension. For a circular aperture, this full span is the diameter and
    is twice the [radius of aperture].'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: nbi/unit/aperture/x1_width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/nbi.html#nbi-unit-aperture-x1_width
    dd_documentation:
      leaf: Full width of the aperture in the X1 direction, used only if geometry_type
        = 3
      parent_path: nbi/unit/aperture
      parent: Description of a set of collimating apertures through which the beam
        is launched
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Full width of a rectangular NBI collimating aperture in the X1
        direction, applicable when geometry_type = 3 (rectangular). Defines one of
        the two rectangular dimensions shaping the neutral beam cross-section.
      kind: llm
- name: fast_electron_power_density
  kind: scalar
  status: active
  description: Volumetric coherent-wave power density absorbed by the fast (suprathermal)
    electron population. It is the local rate of coherent-wave energy deposition into
    fast electrons per unit plasma volume.
  documentation: 'Fast electron power density is the time-averaged volumetric rate
    at which a coherent wave transfers energy to the fast (suprathermal) electron
    population. It represents electron heating by wave absorption, distinct from power
    deposited into the bulk thermal electron population.


    A kinetic energy-moment definition for the fast component is:


    $$

    Q_{e,\mathrm{fast}}(\mathbf{x}) = \sum_{\alpha}\left\langle \int \frac{1}{2} m_e
    v^2\, \mathcal{C}_{\alpha}[f_{e,\mathrm{fast}}](\mathbf{x},\mathbf{v},t)\, d^3v
    \right\rangle_t

    $$


    where $Q_{e,\mathrm{fast}}$ is the fast electron power density, $m_e$ is the electron
    mass, $v$ is particle speed, $f_{e,\mathrm{fast}}$ is the fast-electron distribution
    function, $\mathcal{C}_{\alpha}$ is the wave-induced part of its kinetic evolution
    due to coherent-wave component or mode $\alpha$, $\mathbf{x}$ is position, $\mathbf{v}$
    is velocity, and $\langle\cdot\rangle_t$ denotes averaging over the relevant wave
    or beat period.


    This quantity is a local density, not cumulative absorbed power over a volume
    and not launched or field power before absorption. It is a sub-contribution to
    [electron_power_density](name:electron_power_density) and excludes [thermal_electron_power_density](name:thermal_electron_power_density);
    fast denotes the modeled non-thermal part of the electron distribution rather
    than a universal sharp energy threshold.


    Sign convention: Positive when coherent-wave energy is transferred to the fast
    electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:electron_power_density
  - name:per_toroidal_mode_fast_electron_power_density
  - name:thermal_electron_power_density
  arguments:
  - name: electron_power_density
