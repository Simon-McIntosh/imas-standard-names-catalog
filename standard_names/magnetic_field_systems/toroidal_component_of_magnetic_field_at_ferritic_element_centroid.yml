name: toroidal_component_of_magnetic_field_at_ferritic_element_centroid
description: Toroidal ($\phi$) component of the magnetic field evaluated at the centroid
  of a ferritic insert element.
documentation: "The toroidal field component $B_\\phi = \\mathbf{B} \\cdot \\hat{\\\
  phi}$ at the centroid of each discrete ferritic element captures the dominant field\
  \ driving the element's magnetization. In a tokamak the vacuum toroidal field scales\
  \ as $B_\\phi \\approx B_0 R_0 / R$, where $B_0$ is the on-axis field (typically\
  \ 1\u20136 T) and $R_0$ the major radius; ferritic inserts sit at various $R$ positions,\
  \ so centroid values of $B_\\phi$ span roughly 1\u20138 T depending on device and\
  \ location. This quantity is used in self-consistent calculations of the ferritic\
  \ insert magnetization: the local $\\mathbf{B}$ determines $\\mathbf{M}$ via the\
  \ material $B$-$H$ curve, which in turn modifies $\\mathbf{B}$ until convergence.\
  \ Positive when $B_\\phi$ is in the $+\\phi$ direction under COCOS-11 (counter-clockwise\
  \ viewed from above). See also the radial and vertical field components at the same\
  \ location and `toroidal_component_of_magnetic_moment_of_ferritic_element_centroid`\
  \ for the resulting magnetization."
kind: vector_component
unit: T
