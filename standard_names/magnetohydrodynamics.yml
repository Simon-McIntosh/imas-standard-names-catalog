- name: accumulated_radiated_energy_due_to_impurity_radiation
  kind: scalar
  status: draft
  description: Running time integral of power emitted by electron interactions with
    impurity ions during a disruption. It includes impurity line radiation, recombination
    radiation, and impurity bremsstrahlung.
  documentation: 'Accumulated radiated energy due to impurity radiation is the cumulative
    photon energy emitted by electron interactions with impurity ions during a disruption.
    It includes impurity line radiation, recombination radiation, and impurity bremsstrahlung,
    and it grows as radiative loss removes energy from the plasma.


    The accumulated energy over a chosen time interval is the time integral of the
    impurity-radiation power:


    $$

    E_{\mathrm{rad,imp}}(t; t_0) = \int_{t_0}^{t} P_{\mathrm{rad,imp}}(t'') \, dt''

    $$


    where $P_{\mathrm{rad,imp}}$ is the emitted impurity-radiation power in W, $t_0$,
    $t''$, and $t$ are times in s, and $E_{\mathrm{rad,imp}}$ is in J. The power entering
    the integral is counted as positive for energy carried away from the plasma by
    photons. Evaluating the same integral at the end of the selected interval gives
    the corresponding final interval quantity [energy_due_to_impurity_radiation](name:accumulated_radiated_energy_due_to_impurity_radiation),
    while [power_due_to_impurity_radiation](name:power_due_to_impurity_radiation)
    is the instantaneous integrand.


    In practice this quantity is estimated by integrating time-resolved impurity-radiation
    power inferred from bolometry, spectroscopic measurements combined with collisional-radiative
    modeling, or radiation-transport and magnetohydrodynamic calculations. Separation
    from total_plasma_radiated_power requires identifying the part of the emission
    associated with impurity ions rather than all radiating species or mechanisms.
    If the contributing power is restricted to a physical region, the accumulated
    energy represents radiation from that region only.


    There is no universal numerical range because the value scales with device size,
    stored plasma energy, impurity content, ionization dynamics, and the chosen integration
    interval. For a given event the running value ranges from 0 J at the selected
    lower bound to the final cumulative impurity-radiation energy at the selected
    upper bound, and is usually interpreted as an energy-balance term relative to
    the pre-disruption stored energy and other loss channels.'
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:power_due_to_impurity_radiation
  sources:
  - id: dd:disruption/global_quantities/energy_radiated_electrons_impurities
    dd_path: disruption/global_quantities/energy_radiated_electrons_impurities
    status: composed
  - id: dd:disruption/global_quantities/energy_radiated_electrons_impurities_halo
    dd_path: disruption/global_quantities/energy_radiated_electrons_impurities_halo
    status: composed
- name: alfven_frequency
  kind: scalar
  status: draft
  description: "Complex frequency of the local shear Alfv\xE9n continuum for a single\
    \ toroidal mode number, whose real part is the oscillation frequency and imaginary\
    \ part the damping or growth rate."
  documentation: "The shear Alfv\xE9n continuum collects the frequencies at which\
    \ shear Alfv\xE9n waves resonate on each flux surface for a chosen toroidal mode\
    \ number $n$. A linear MHD calculation returns the complex frequency $\\omega_A\
    \ = \\omega_r + i\\omega_i$ for every root of the local continuum equation, resolving\
    \ both the oscillation frequency and its damping or growth rate as continuous\
    \ functions of minor radius. The local continuum frequency follows\n\n$$\n\\omega_A\
    \ = k_\\parallel v_A\n$$\n\nwith parallel wavenumber $k_\\parallel = (nq - m)/(qR_0)$\
    \ for poloidal harmonic $m$, safety factor $q$, and major radius $R_0$, and Alfv\xE9\
    n speed $v_A = B/\\sqrt{\\mu_0 \\rho}$ for total field magnitude $B$ and mass\
    \ density $\\rho$. Under the $e^{-i\\omega t}$ convention a positive $\\omega_i$\
    \ grows and a negative $\\omega_i$ damps; the continuum is purely real in ideal\
    \ MHD, with finite $\\omega_i$ arising from resistive, kinetic, or energetic-particle\
    \ effects. The separate parts are the [alfven_frequency_real_part](name:alfven_frequency_real_part)\
    \ and [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part),\
    \ discrete Alfv\xE9n eigenmodes form in the gaps the continuum leaves open, and\
    \ the characteristic timescale is the [alfven_time](name:alfven_time)."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:alfven_frequency_imaginary_part
- name: alfven_frequency_imaginary_part
  kind: complex
  status: draft
  description: "Damping rate when negative or growth rate when positive, the imaginary\
    \ part of the complex shear Alfv\xE9n continuum frequency, for a single toroidal\
    \ mode number at a given radial position."
  documentation: "The imaginary part of the complex shear Alfv\xE9n continuum frequency,\
    \ $\\gamma = \\operatorname{Im}(\\omega_A)$, sets how fast a shear Alfv\xE9n perturbation\
    \ grows or decays at a given radial position for a chosen toroidal mode number\
    \ $n$. Together with the oscillation frequency [alfven_frequency_real_part](name:alfven_frequency_real_part)\
    \ it fixes the full time dependence, which under the $e^{-i\\omega_A t}$ convention\
    \ evolves as\n\n$$\n\\delta f(t) \\propto e^{\\gamma t}\\, e^{-i\\omega_r t}\n\
    $$\n\nso a positive $\\gamma$ marks an unstable, growing response and a negative\
    \ $\\gamma$ a linearly damped one. A linear MHD calculation resolves $\\gamma$\
    \ as a function of minor radius and toroidal mode number. The continuum is purely\
    \ real in ideal MHD, and a finite $\\gamma$ arises from resistive, kinetic, or\
    \ energetic-particle effects, the same drives that excite the discrete Alfv\xE9\
    n eigenmodes occupying the continuum gaps. The full complex value is the [alfven_frequency](name:alfven_frequency).\n\
    \nSign convention: Positive when the mode amplitude grows exponentially in time\
    \ under the $e^{-i\\omega_A t}$ convention."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_real_part
  - name:perturbed_plasma_temperature_imaginary_part
  arguments:
  - name: alfven_frequency
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/imaginary
    status: composed
- name: alfven_frequency_real_part
  kind: complex
  status: draft
  description: "Oscillation frequency, the real part of the complex frequency, of\
    \ the local shear Alfv\xE9n continuum at a given radial position for a single\
    \ toroidal mode number."
  documentation: "The shear Alfv\xE9n continuum is the set of frequencies at which\
    \ shear Alfv\xE9n waves resonate on each flux surface, and its real part gives\
    \ the local oscillation frequency for a chosen toroidal mode number $n$. A linear\
    \ MHD calculation returns one frequency for every root of the local continuum\
    \ equation at each radial position, so the spectrum varies continuously with minor\
    \ radius. In the cylindrical limit the continuum frequency for poloidal harmonic\
    \ $m$ is\n\n$$\n\\operatorname{Re}(\\omega_A) = \\frac{|n - m/q|}{R}\\, v_A\n\
    $$\n\nwhere $q$ is the safety factor, $R$ the major radius in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, and $v_A = B/\\sqrt{\\mu_0 \\rho}$ the Alfv\xE9\
    n speed for total field magnitude $B$ and mass density $\\rho$. Toroidal coupling\
    \ of neighboring poloidal harmonics opens frequency gaps in which discrete Alfv\xE9\
    n eigenmodes, such as the toroidicity-induced and reversed-shear modes, can form.\
    \ The companion damping or growth rate is the [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part),\
    \ the two together forming the complex [alfven_frequency](name:alfven_frequency),\
    \ and the associated timescale is the [alfven_time](name:alfven_time).\n\nSign\
    \ convention: Positive when the wave phase advances in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_imaginary_part
  - name:alfven_frequency
  - name:alfven_time
  arguments:
  - name: alfven_frequency
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum/real
    status: composed
- name: alfven_time
  kind: scalar
  status: draft
  description: "Alfv\xE9n time is the non-negative shear-Alfv\xE9n transit time used\
    \ to normalize ideal-MHD dynamics. It is the magnetic-axis major radius divided\
    \ by the local Alfv\xE9n speed, using the on-axis toroidal magnetic-field magnitude\
    \ and the local ion mass density at the flux surface of interest."
  documentation: "Alfv\xE9n time $\\tau_A$ is a characteristic MHD timescale for shear\
    \ Alfv\xE9n-wave propagation across a tokamak plasma, with the transit length\
    \ set by the magnetic-axis major radius. It is a non-negative duration and provides\
    \ the inverse frequency scale commonly used to normalize ideal-MHD oscillation\
    \ frequencies and instability growth rates.\n\nUsing the magnetic-axis major radius\
    \ as the characteristic length and the local Alfv\xE9n speed from the on-axis\
    \ toroidal magnetic-field magnitude and local ion mass density, the Alfv\xE9n\
    \ time is defined by:\n\n$$\n\\tau_A(\\rho_f) = \\frac{R_0}{v_A(\\rho_f)} = \\\
    frac{R_0 \\sqrt{\\mu_0\\,m_i\\,n_i(\\rho_f)}}{B_0}\n$$\n\nwhere $\\rho_f$ is the\
    \ flux-surface label used to localize the density, such as the normalized toroidal-flux\
    \ radius $\\rho_\\mathrm{tor,norm}$; $R_0$ is the magnetic-axis major radius in\
    \ m; $v_A$ is the Alfv\xE9n speed in m s$^{-1}$; $\\mu_0$ is the permeability\
    \ of free space in H m$^{-1}$; $m_i$ is the ion mass in kg; $n_i$ is the ion number\
    \ density in m$^{-3}$; and $B_0$ is the magnitude of the toroidal magnetic-field\
    \ component at the magnetic axis in T. In the right-handed cylindrical $(R,\\\
    phi,Z)$ frame, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is\
    \ vertical height, $B_0$ denotes a magnitude, so reversal of toroidal-field direction\
    \ does not change $\\tau_A$.\n\nIn practice, $\\tau_A$ is computed from an equilibrium\
    \ magnetic-axis position, an on-axis toroidal-field magnitude, and ion density\
    \ and composition at the flux surface of interest. For multi-ion plasmas, the\
    \ product $m_i n_i$ is commonly replaced by the total ion mass density $\\sum_s\
    \ m_s n_s$, with electron mass usually negligible for this MHD normalization.\
    \ Frequencies such as the real part of an Alfv\xE9n eigenmode frequency and linear\
    \ growth rates are often compared with or normalized by $\\tau_A^{-1}$.\n\nFor\
    \ tokamak parameters $R_0 \\sim 1-6$ m, $B_0 \\sim 1-8$ T, and deuterium ion density\
    \ $n_i \\sim 10^{19}-10^{20}$ m$^{-3}$, representative values are typically of\
    \ order $10^{-7}-10^{-6}$ s. The timescale increases with major radius and with\
    \ the square root of ion mass density, and decreases in inverse proportion to\
    \ the magnetic-field magnitude."
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency
  - name:per_toroidal_mode_growth_rate
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/tau_alfven
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/tau_alfven
    status: composed
- name: alpha_parameter
  kind: scalar
  status: draft
  description: Dimensionless alpha-family MHD ballooning stability metric built from
    the normalized plasma pressure-gradient drive. It covers the drive, critical thresholds,
    and stability-margin ratios comparing a critical value with an experimental or
    reconstructed value.
  documentation: 'An alpha parameter is a dimensionless MHD stability metric derived
    from the normalized plasma pressure-gradient drive that excites ballooning-type
    modes. In this generalized sense it may represent the pressure-gradient drive
    itself, a marginal-stability threshold such as the [critical alpha parameter],
    or a stability margin such as the [ratio of critical alpha parameter to alpha
    parameter].


    The underlying drive scales with pressure-gradient strength relative to magnetic
    pressure and magnetic-field curvature, with geometric factors such as safety factor,
    magnetic shear, and flux-surface shape set by the chosen local equilibrium model.
    Larger pressure gradients generally increase the destabilizing drive, while the
    critical value is the model-dependent value at which the equilibrium reaches marginal
    ballooning stability.


    Alpha-family quantities are computed from reconstructed magnetic equilibria and
    measured or inferred pressure profiles, often with assumptions about ion and electron
    pressure contributions. Critical values are obtained by stability analysis or
    parameter scans to marginality; critical-to-experimental ratios are then formed
    by comparing that threshold with the reconstructed drive under the same modeling
    assumptions.


    Typical dimensionless values for experimental or critical alpha parameters are
    often 0.1-10 in core and pedestal stability studies, with larger values possible
    in steep pedestal gradients. A critical-to-experimental ratio near 1 indicates
    marginality, values greater than 1 indicate remaining margin to the modeled threshold,
    and values less than 1 indicate that the reconstructed drive exceeds that threshold.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - id: dd:summary/pedestal_fits/mtanh/stability/alpha_experimental/value
    dd_path: summary/pedestal_fits/mtanh/stability/alpha_experimental/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/stability/bootstrap_current_sauter/alpha_ratio/value
    dd_path: summary/pedestal_fits/mtanh/stability/bootstrap_current_sauter/alpha_ratio/value
    status: composed
- name: critical_momentum_due_to_avalanche
  kind: scalar
  status: draft
  description: Scalar threshold momentum separating drag-dominated electrons from
    electrons that can run away under electric-field acceleration in avalanche modeling.
    It is a momentum-space boundary used when evaluating avalanche multiplication
    and Compton or tritium beta-decay seed contributions, not a source rate.
  documentation: 'Critical momentum due to avalanche is the scalar electron momentum
    threshold at which electric-field acceleration just balances collisional slowing-down
    in the runaway-electron kinetic equation. Above this boundary an electron is in
    the runaway region; below it Coulomb drag dominates. It is a momentum magnitude
    and does not encode the direction of motion along the magnetic field.


    A common relativistic Coulomb-drag approximation for field-aligned motion gives


    $$

    p_{c,\mathrm{av}} = m_e c \left(\frac{|E_\parallel|}{E_c} - 1\right)^{-1/2}

    $$


    where $p_{c,\mathrm{av}}$ is the critical momentum, $m_e$ is the electron rest
    mass in kg, $c$ is the speed of light in m s^-1, $E_\parallel$ is the electric-field
    component parallel to the magnetic field in V m^-1, and $E_c$ is the Connor-Hastie
    critical electric field in V m^-1. The expression is valid for $|E_\parallel|
    > E_c$ and follows from the force balance $e|E_\parallel|=F_\mathrm{drag}$ with
    high-energy Coulomb drag $F_\mathrm{drag}\simeq eE_c[1+(m_ec/p)^2]$ in N; $E_c$
    is often approximated by $n_e e^3\ln\Lambda/(4\pi\epsilon_0^2m_ec^2)$, with $n_e$
    in m^-3 and $\ln\Lambda$ dimensionless.


    In practice, the threshold is computed from the local parallel electric field,
    electron density and temperature, effective charge, Coulomb logarithm, and any
    model corrections for partial screening, radiation reaction, or pitch-angle dynamics.
    Avalanche multiplication, Compton scattering, and tritium beta decay provide source
    terms for the runaway population; this critical momentum supplies the drag-versus-acceleration
    boundary used to decide whether those electrons enter the runaway region.


    Typical thresholds are most transparent in normalized form $\bar p_c=p_{c,\mathrm{av}}/(m_ec)$.
    For $|E_\parallel|/E_c$ of about 1.1-10, $\bar p_c$ is about 0.3-3, corresponding
    to roughly 1e-22-1e-21 kg m s^-1; very near $E_c$ the threshold can be much larger,
    while for $|E_\parallel|\le E_c$ this simple balance gives no finite runaway threshold.'
  unit: kg.m^-1.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:volume_averaged_runaway_electron_critical_momentum_due_to_avalanche
  sources:
  - id: dd:runaway_electrons/ggd_fluid/momentum_critical_avalanche/values
    dd_path: runaway_electrons/ggd_fluid/momentum_critical_avalanche/values
    status: attached
  - id: dd:runaway_electrons/global_quantities/volume_average/momentum_critical_avalanche
    dd_path: runaway_electrons/global_quantities/volume_average/momentum_critical_avalanche
    status: composed
