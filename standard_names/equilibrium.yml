- name: vertical_velocity_at_current_center
  kind: scalar
  status: active
  description: Vertical velocity of the plasma-current centroid, defined by the rate
    of change of its vertical position.
  documentation: 'The vertical velocity at the current center is the kinematic velocity
    of the centroid of the plasma current distribution, describing motion along the
    vertical direction rather than a local fluid velocity sampled at that point.


    $$

    v_{Z,c}(t)=\frac{dZ_c(t)}{dt}

    $$


    where $Z_c$ is the vertical coordinate of the current center in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $t$ is time, and $v_{Z,c}$ is the corresponding
    signed velocity. The position $Z_c$ is defined by the [vertical coordinate of
    the current center](name:vertical_coordinate_of_current_center).


    This quantity describes motion of the current-density-weighted plasma-current
    centroid and is distinct from the local [vertical plasma velocity](name:vertical_plasma_velocity)
    evaluated at that location.


    Sign convention: Positive when the current center moves toward increasing $Z$.'
  unit: m.s^-1
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_current_center
  - name:vertical_plasma_velocity
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/current_centre/velocity_z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-current_centre-velocity_z
