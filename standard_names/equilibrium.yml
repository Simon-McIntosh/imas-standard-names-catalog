- name: major_radius_of_active_limiter_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the active limiter contact point, defined
    as the perpendicular distance from the machine symmetry axis in the right-handed
    cylindrical (R, phi, Z) frame. The active limiter point is the specific limiter
    element in direct mechanical contact with the last closed flux surface, setting
    the plasma boundary position. R is intrinsically non-negative.
  documentation: 'The active limiter contact point is the discrete location on a physical
    limiter surface that the last closed flux surface (LCFS) actually touches, thereby
    defining the plasma boundary in limiter configurations. This is distinct from
    the closest-wall point (which is a geometric nearest-surface construction) and
    from divertor strike points (which occur on dedicated target surfaces).


    The major-radius coordinate $R$ of this point satisfies

    $$R = \sqrt{x^2 + y^2} \geq 0,$$

    where $(x, y)$ are Cartesian coordinates in the horizontal plane, and $R$ is measured
    in meters in the right-handed cylindrical $(R, \phi, Z)$ frame with $R \geq 0$
    by construction.


    Typical values range from $\sim 1$ m in compact tokamaks to $\sim 8$ m in large
    devices. Because a limiter bounds the plasma from the outboard side in most configurations,
    the active limiter point usually lies near the plasma boundary minor radius plus
    the major radius, but inboard-limiter and top/bottom-limiter geometries are also
    possible.


    The companion vertical coordinate of the same active limiter contact point is
    given by `vertical_coordinate_of_active_limiter_point` (the $Z$ coordinate in
    the cylindrical $(R, \phi, Z)$ frame). Together, $(R, Z)$ fully locates the contact
    point in the poloidal cross-section for axisymmetric configurations.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_closest_wall_point
  - name:major_radius_of_strike_point
  - name:major_radius_of_plasma_boundary_outline_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/active_limiter_point/r
    dd_path: equilibrium/time_slice/boundary/active_limiter_point/r
    status: composed
- name: major_radius_of_annulus_geometry
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the center of an annular cross-section\
    \ geometry element, measured as the perpendicular distance from the machine symmetry\
    \ axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The major radius $R$ of an annulus geometry element locates the\
    \ centroid of the annular cross-section relative to the machine symmetry axis\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the perpendicular\
    \ distance from the axis and $Z$ is the vertical height. Annular cross-sections\
    \ are used to model axisymmetric conducting or magnetic elements \u2014 including\
    \ poloidal-field coil conductors, passive stabilizing loops, iron-core segments,\
    \ ferritic components, and antenna straps \u2014 whose cross-sectional shape approximates\
    \ a thin ring or washer. The center radius $R_c$ is the geometric centroid coordinate\
    \ of the annulus, lying midway between its inner and outer radii: $R_c = (R_{\\\
    rm inner} + R_{\\rm outer})/2$. Typical values range from tenths of a meter for\
    \ compact inboard components to several meters for large outboard structures,\
    \ bounded below by the minor radii of the respective device. This coordinate is\
    \ used alongside the vertical centroid coordinate (see [vertical_coordinate_of_centroid](name:vertical_coordinate_of_centroid))\
    \ to fully specify the poloidal-plane position of the element. For the outer-boundary\
    \ radius of an annular unit, see [major_radius_of_annular_outer_outline_point](name:major_radius_of_annular_outer_outline_point);\
    \ for rectangular and oblique element geometries, see [major_radius_of_rectangle_geometry](name:major_radius_of_rectangle_geometry)\
    \ and [major_radius_of_oblique_geometry](name:major_radius_of_oblique_geometry).\n\
    \nSign convention: Positive when $R$ is a finite perpendicular distance from the\
    \ machine symmetry axis, which is always the case for a physically realizable\
    \ annulus; $R = 0$ only on the axis itself."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_centroid
  - name:major_radius_of_annular_outer_outline_point
  - name:major_radius_of_rectangle_geometry
  - name:major_radius_of_oblique_geometry
  constraints: []
  sources:
