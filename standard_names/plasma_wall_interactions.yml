      kind: template
- name: tungsten_density
  kind: scalar
  status: active
  description: Number density of tungsten ions summed over all positive ionization
    states, excluding neutral tungsten, at a specified location or spatial average.
  documentation: 'Tungsten-ion number density is the particle count per unit volume
    for all positively charged tungsten ions, with neutral tungsten excluded. It may
    denote a local value or a spatially averaged value over a defined domain.


    The charge-state-summed density is defined by


    $$

    n_{\mathrm{W}} = \sum_{Z=1}^{74} n_{\mathrm{W}}^{Z+}

    $$


    where $n_{\mathrm{W}}$ and $n_{\mathrm{W}}^{Z+}$ are number densities in m$^{-3}$,
    and $Z$ is the positive tungsten charge state. Specific instances include [volume-averaged
    tungsten density](name:volume_averaged_tungsten_density), [tungsten density at
    magnetic axis](name:tungsten_density_at_magnetic_axis), and [tungsten density
    at divertor target](name:tungsten_density_at_divertor_target); these differ by
    evaluation locus or averaging domain. Neutral tungsten is not included.


    Sign convention: Positive when the counted tungsten-ion population has positive
    particle number.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:volume_averaged_tungsten_density
  - name:tungsten_density_at_magnetic_axis
  - name:tungsten_density_at_divertor_target
  sources:
  - dd_path: summary/line_average/n_i/tungsten/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-tungsten-value
    dd_documentation:
