name: line_integrated_electron_density_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for line-integrated electron density
  used by the density feedback control system.
documentation: "This reference waveform $\\bar{n}_{e,\\rm ref}(t)$ provides the desired\
  \ temporal evolution of the line-integrated electron density $\\bar{n}_e = \\int\
  \ n_e \\, dl$ (in $\\mathrm{m^{-2}}$, expressed here in normalized/dimensionless\
  \ form) along a specified interferometer chord. The plasma control system compares\
  \ the measured line-integrated density against this waveform and adjusts gas fueling\
  \ (and, where available, pellet injection) to track the reference. Typical target\
  \ values span $1 \\times 10^{19}$\u2013$1.5 \\times 10^{20}\\;\\mathrm{m^{-2}}$\
  \ depending on chord length and plasma density. The envelope around the reference\
  \ defines the acceptable excursion range for the controller. See also `line_integrated_electron_density_of_last_closed_flux_surface_reference_waveform`\
  \ for the edge-specific variant and `electron_number_density` for the local quantity."
