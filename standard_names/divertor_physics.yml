- name: total_ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of the total ion population at the divertor target,
    summed over all ionic species and charge states present in the local plasma.
  documentation: "The total ion number density at the divertor target is the sum of\
    \ all positive-ion contributions \u2014 fuel ions (hydrogen isotopes), helium\
    \ ash, and seeded or intrinsic impurities \u2014 evaluated locally at the plasma-facing\
    \ divertor surface. It characterizes the aggregate ion particle concentration\
    \ in the sheath-entrance region and governs plasma\u2013surface interaction processes\
    \ including sputtering, recycling, and heat load.\n\nThe total ion density $n_{i,\\\
    mathrm{total}}$ is defined as:\n\n$$\nn_{i,\\mathrm{total}} = \\sum_{s} n_{i,s}\n\
    $$\n\nwhere $s$ indexes all ion species and charge states present at the target.\
    \ By quasi-neutrality, $n_{i,\\mathrm{total}}$ closely approximates the [electron\
    \ density at the divertor target](name:electron_density_at_divertor_target), with\
    \ deviations scaling with the mean effective charge of the impurity mixture.\n\
    \nThis quantity is measured via Langmuir probe saturation-current analysis at\
    \ the divertor surface, or derived from edge-transport modeling constrained by\
    \ spectroscopic observations. In attached and high-recycling regimes, typical\
    \ values range from $10^{19}$ to $10^{21}$ m$^{-3}$, rising toward the upper end\
    \ near detachment onset. Species-resolved contributions are available from [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target),\
    \ [neon_density_at_divertor_target](name:neon_density_at_divertor_target), and\
    \ [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).\n\
    \nSign convention: Positive when ions are present at the divertor target surface."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:neon_density_at_divertor_target
  - name:carbon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i_total/value
    dd_path: summary/local/divertor_plate/n_i_total/value
    status: attached
  - id: dd:summary/local/divertor_target/n_i_total/value
    dd_path: summary/local/divertor_target/n_i_total/value
    status: composed
- name: vertical_coordinate_of_inner_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the point where the inner separatrix leg intersects
    the inner divertor target in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical coordinate of the inner divertor strike point specifies\
    \ the $Z$ position in the right-handed cylindrical $(R, \\phi, Z)$ frame \u2014\
    \ where $Z$ is the height measured along the machine symmetry axis \u2014 at which\
    \ the inner leg of the magnetic separatrix meets the inner divertor target plate.\
    \ This geometry parameter determines the poloidal location of the inner heat and\
    \ particle deposition zone, the parallel connection length between the X-point\
    \ and the target, and the margin between the strike footprint and the edges of\
    \ protected divertor tiles.\n\nThe coordinate is obtained from equilibrium reconstruction\
    \ using external magnetic diagnostics, optionally supplemented by internal profile\
    \ constraints. Real-time plasma control systems track this $Z$ position to keep\
    \ the heat-load footprint within the designed wetted area of the inner target.\n\
    \nIn lower single-null configurations the inner strike point typically lies at\
    \ negative $Z$ values, below the midplane, with magnitudes of order 0.5\u2013\
    2.5 m depending on machine size and plasma shaping. The companion quantity [vertical_coordinate_of_outer_divertor_target](name:vertical_coordinate_of_outer_divertor_target)\
    \ provides the equivalent $Z$ coordinate for the outer separatrix leg, and [major_inner_radius_of_strike_point](name:major_inner_radius_of_strike_point)\
    \ gives the major-radius $R$ coordinate of the same inner strike point.\n\nSign\
    \ convention: Positive when $Z$ is above the geometric midplane, in the $+\\hat{Z}$\
    \ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_coordinate_of_outer_divertor_target
  - name:major_inner_radius_of_strike_point
  sources:
  - id: dd:summary/boundary/strike_point_inner_z/value
    dd_path: summary/boundary/strike_point_inner_z/value
    status: composed
- name: vertical_coordinate_of_outer_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the outer divertor strike point, defined as
    the intersection of the outer separatrix leg with the outer divertor target plate.
  documentation: "The outer divertor strike point is the geometric location where\
    \ the outer separatrix leg meets the outer divertor target plate. Its $Z$ coordinate,\
    \ measured along the symmetry axis in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame where $Z$ increases upward, locates the outer strike point axially\
    \ and is a primary descriptor of the divertor configuration, directly influencing\
    \ heat load distribution and plasma exhaust geometry.\n\nThe strike-point position\
    \ is determined from magnetohydrodynamic equilibrium reconstruction by tracing\
    \ the outer separatrix flux surface to its intersection with the target geometry.\
    \ The location shifts axially as the plasma shape, current profile, and vertical\
    \ position evolve, making this coordinate an important real-time shape-control\
    \ parameter. Paired with [major_outer_radius_of_strike_point](name:major_outer_radius_of_strike_point),\
    \ the two coordinates fully specify the outer strike point in the poloidal $(R,\
    \ Z)$ plane; [vertical_coordinate_of_inner_divertor_target](name:vertical_coordinate_of_inner_divertor_target)\
    \ provides the analogous measurement for the inner separatrix leg, enabling asymmetry\
    \ analysis between the two divertor legs.\n\nIn lower single-null configurations,\
    \ typical values lie in the range \u22121.5 to \u22120.3 m for medium-sized tokamaks;\
    \ upper single-null configurations yield positive $Z$ values.\n\nSign convention:\
    \ Positive when the outer divertor strike point lies above the machine geometric\
    \ midplane in the direction of increasing $Z$."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:major_outer_radius_of_strike_point
  - name:vertical_coordinate_of_inner_divertor_target
  sources:
  - id: dd:summary/boundary/strike_point_outer_z/value
    dd_path: summary/boundary/strike_point_outer_z/value
    status: composed
- name: vertical_outline_of_divertor_tile
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the surface outline defining the geometric
    boundary of an individual divertor tile in the poloidal cross-section.
  documentation: 'The vertical height component of each point defining the surface
    outline of a divertor tile within the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius from the toroidal symmetry axis and $Z$ is
    the vertical coordinate measured from the machine midplane. Paired with the corresponding
    radial outline coordinate, this quantity fully specifies the cross-sectional geometry
    of the tile surface in any toroidally axisymmetric representation, enabling computation
    of wetted surface area, heat-load distribution, and geometric shadowing between
    adjacent plasma-facing components.


    Divertor tile outlines are obtained from engineering or CAD specifications of
    the first-wall assembly. The geometric boundary of the tile determines which surface
    elements intercept the scrape-off-layer heat flux in the vicinity of the magnetic
    strike-point. The outline is also used in optical and infrared camera line-of-sight
    calculations to monitor tile erosion and thermal response. For the analogous geometry
    of limiter tiles, see [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile);
    for the vacuum vessel boundary, see [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel).
    The center-point location of the divertor target surface is given by [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target),
    which captures a single reference point rather than a full outline contour.


    Sign convention: Positive when the outline point is located above the machine
    midplane, in the direction of increasing $Z$.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:vertical_coordinate_of_divertor_target
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/z
    dd_path: divertors/divertor/target/tile/surface_outline/z
    status: composed
- name: power_of_divertor_due_to_conduction
  kind: scalar
  status: draft
  description: Power transported to all divertor targets via parallel thermal conduction
    in the scrape-off layer, summed over targets.
  documentation: "The total power conducted from the scrape-off layer (SOL) plasma\
    \ to the divertor represents the conductive channel of the plasma\u2013divertor\
    \ power exhaust balance, summed over all individual targets. In attached divertor\
    \ operation, parallel electron and ion thermal conduction along open magnetic\
    \ field lines is the dominant heat transport mechanism, driven by the temperature\
    \ gradient between the high-temperature upstream SOL and the cooler target.\n\n\
    The electron conductive heat flux density along a field line follows the Spitzer\u2013\
    H\xE4rm relation:\n\n$$\nq_{\\parallel,e} = -\\kappa_0 T_e^{5/2} \\nabla_\\parallel\
    \ T_e\n$$\n\nwhere $\\kappa_0 \\approx 2000$ W m$^{-1}$ eV$^{-7/2}$ is the electron\
    \ Spitzer conductivity prefactor and $\\nabla_\\parallel T_e$ is the parallel\
    \ electron temperature gradient. Integrating over the wetted target area and summing\
    \ over all divertor targets yields the total conducted power.\n\nTogether with\
    \ [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection),\
    \ this quantity partitions the total plasma heat load reaching the divertor surface;\
    \ the conductive fraction dominates at high upstream temperatures in attached\
    \ conditions and diminishes progressively as the plasma approaches detachment,\
    \ when $T_e$ at the target drops toward the ionization threshold. In detached\
    \ states, processes such as [plasma_power_of_divertor_due_to_recombination](name:plasma_power_of_divertor_due_to_recombination)\
    \ and volumetric radiation absorb an increasing fraction of the exhaust power\
    \ before it reaches the targets.\n\nThis quantity is assessed from integrated\
    \ power balance accounting or from multi-fluid SOL transport modeling. Typical\
    \ values range from 1\u201310 MW in medium-power present-day devices to tens of\
    \ MW in high-performance reactor-relevant operations."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_convection
  - name:plasma_power_of_divertor_due_to_recombination
  sources:
  - id: dd:divertors/divertor/power_conducted
    dd_path: divertors/divertor/power_conducted
    status: composed
