      kind: template
- name: total_external_heating_power
  kind: scalar
  status: active
  description: Total non-inductive power coupled from external neutral-beam and radio-frequency
    heating systems to the plasma, summed over auxiliary sources and excluding Ohmic
    heating.
  documentation: 'Total external heating power is the aggregate non-inductive power
    coupled to the plasma by auxiliary heating systems. It includes neutral-beam injection
    and electron-cyclotron, ion-cyclotron, and lower-hybrid systems, while excluding
    power associated with Ohmic induction.


    The defining aggregate relation is


    $$

    P_{\mathrm{ext}} = \sum_{s \in \mathcal{S}_{\mathrm{aux}}} P_s

    $$


    where $P_{\mathrm{ext}}$ is the total external heating power, $\mathcal{S}_{\mathrm{aux}}$
    is the set of included auxiliary heating systems, and $P_s$ is the power coupled
    to the plasma by auxiliary source $s$.


    The quantity applies to the whole plasma and is summed over all included auxiliary
    sources rather than resolved by source, species, or spatial region. It represents
    external power input that may contribute to both plasma heating and non-inductive
    current drive; it is distinct from Ohmic heating and from generator power that
    is not coupled to the plasma. Source-specific contributions include [total power
    due to electron-cyclotron heating](name:total_power_due_to_electron_cyclotron_heating),
    [total power due to ion-cyclotron heating](name:total_power_due_to_ion_cyclotron_heating),
    and power absorbed from a [neutral-beam injector](name:absorbed_power_of_neutral_beam_injector),
    whose aggregate forms contribute to the sum.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  sources:
  - dd_path: summary/heating_current_drive/power_additional/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-power_additional-value
    dd_documentation:
      leaf: Value
      parent_path: summary/heating_current_drive/power_additional
      parent: Total additional external power (NBI+EC+IC+LH, without ohmic) coupled
        to the plasma
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Total additional external heating power coupled to the plasma,
        summing all auxiliary heating systems (NBI, EC, IC, and LH) excluding Ohmic
        power. Represents the total non-inductive power input driving plasma heating
        and current drive.
      kind: template
- name: total_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: active
  description: Total radio-frequency wave power coupled into the plasma across the
    ion-cyclotron launcher boundary, aggregated over all heating launchers after reflected
    and pre-coupling losses.
  documentation: "Total ion-cyclotron heating power is the aggregate radio-frequency\
    \ electromagnetic-wave power coupled from all ion-cyclotron heating launchers\
    \ into the plasma. It is defined at the launcher\u2013plasma boundary rather than\
    \ as the power ultimately deposited in plasma particles.\n\nThe total coupled\
    \ power is the sum of the launcher-resolved coupled powers:\n\n$$\nP_{\\mathrm{IC}}\
    \ = \\sum_{a \\in \\mathcal{L}} P_{\\mathrm{IC},a}\n$$\n\nwhere $P_{\\mathrm{IC}}$\
    \ is the total ion-cyclotron coupled power, $\\mathcal{L}$ is the set of ion-cyclotron\
    \ heating launchers included in the aggregate, $a$ is a launcher index, and $P_{\\\
    mathrm{IC},a}$ is the coupled power for launcher $a$ defined by [power due to\
    \ ion-cyclotron heating](name:power_due_to_ion_cyclotron_heating).\n\nThe aggregation\
    \ includes every launcher in $\\mathcal{L}$ and excludes generator output, reflected\
    \ wave power, and transmission or antenna losses occurring before the launcher\u2013\
    plasma boundary. It is distinct from antenna-side forward or reflected power and\
    \ is not reduced by incomplete absorption of the coupled wave field after it enters\
    \ the plasma."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_ion_cyclotron_heating
  arguments:
  - name: power_due_to_ion_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
