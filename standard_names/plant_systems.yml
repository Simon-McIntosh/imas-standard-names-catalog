- name: minimum_gas_flow
  kind: scalar
  status: active
  description: Minimum gas flow is the smallest pressure-volume gas throughput that
    a gas injection valve can reliably deliver, defining the lower bound of its controllable
    range.
  documentation: 'Minimum gas flow is the lower reliable operating limit of the pressure-volume
    throughput delivered by a gas injection valve. It is a static hardware capability
    that bounds the same physical quantity represented by [gas flow], while [maximum
    gas flow](name:maximum_gas_flow) gives the corresponding upper limit.


    The pressure-volume gas throughput is defined by


    $$

    Q = p\,\dot{V}

    $$


    where $Q$ is the gas throughput, $p$ is the gas pressure, and $\dot{V}$ is the
    volumetric flow rate. The minimum gas flow is the lower reliable value of $Q$
    for the valve, not a particle source rate; for an ideal gas, the corresponding
    molecular source rate is $\dot{N}=Q/(k_B T_g)$, where $T_g$ is the gas temperature
    and $k_B$ is Boltzmann''s constant.


    This quantity defines the lower endpoint of the valve''s controllable gas-flow
    range and excludes gas throughput from other injection or pumping components.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:maximum_gas_flow
  sources:
  - dd_path: gas_injection/valve/flow_rate_min
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gas_injection.html#gas_injection-valve-flow_rate_min
    dd_documentation:
      leaf: Minimum flow rate of the valve
      parent_path: gas_injection/valve
      parent: Set of valves connecting a gas bottle to pipes
      data_type: FLT_0D
      unit: Pa.m^3.s^-1
    enhanced_context:
      description: Minimum volumetric flow rate of a gas injection valve, specifying
        the lower operational bound on gas throughput. Used as an engineering constraint
        in density control and gas injection system design.
      kind: llm
- name: molecular_neutral_species_flow_at_outlet
  kind: scalar
  status: active
  description: Molecular neutral species flow at an outlet is the pressure-volume
    throughput of one molecular neutral species removed across a pumping outlet. It
    is defined by the outlet partial pressure of that species and the corresponding
    effective pumping speed, not by total neutral pressure.
  documentation: 'Molecular neutral species flow at an outlet is the pressure-volume
    throughput of one molecular neutral species removed across a pumping outlet. It
    is species-specific and uses the outlet partial pressure of that molecular neutral
    species rather than the [total neutral pressure](name:total_neutral_pressure).


    The outlet throughput is defined by the product of the outlet species partial
    pressure and the effective pumping speed for that species:


    $$

    Q_{s,\mathrm{out}} = p_{s,\mathrm{out}} S_{s,\mathrm{out}}

    $$


    where $Q_{s,\mathrm{out}}$ is this molecular neutral species flow at the outlet,
    $p_{s,\mathrm{out}}$ is the outlet partial pressure of molecular neutral species
    $s$, and $S_{s,\mathrm{out}}$ is the effective pumping speed for species $s$ at
    the outlet.


    This quantity is an outlet removal throughput, distinct from a gas source into
    the vessel such as [gas injection](name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection).
    It is the molecular, species-resolved outlet form of [neutral species flow](name:molecular_neutral_species_flow_at_outlet)
    and a species-specific specialization of [gas flow].


    Sign convention: Positive when the molecular neutral species is removed through
    the outlet in the pumping direction away from the vessel.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:total_neutral_pressure
  - name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection
  sources:
  - dd_path: gas_pumping/duct/species/flow_rate
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gas_pumping.html#gas_pumping-duct-species-flow_rate
    dd_documentation:
