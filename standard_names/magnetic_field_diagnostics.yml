- name: area_of_flux_loop
  kind: scalar
  status: draft
  description: Non-negative effective sensing area of a flux loop diagnostic. It combines
    the loop aperture, number of turns, and calibration factors relating magnetic
    flux threading the loop to the spatially averaged magnetic-field component normal
    to the loop aperture.
  documentation: 'The effective area of a flux loop is the non-negative field-to-flux
    sensitivity factor of the sensor. It represents the aperture area, winding count,
    and calibration corrections that make the total linked magnetic flux equivalent
    to a spatially averaged normal magnetic field over an effective aperture.


    The defining relation is


    $$

    A_\mathrm{eff} = \frac{\Phi}{\bar{B}_n}

    $$


    where $\Phi$ is the signed magnetic flux threading the loop in Wb, $\bar{B}_n$
    is the spatial average of the magnetic-field component normal to the loop aperture
    in T, and $A_\mathrm{eff}$ is the effective area in m$^2$. For a specified loop
    normal and terminal polarity, Faraday''s law gives the flux-loop voltage as $V
    = -d\Phi/dt = -A_\mathrm{eff}\,d\bar{B}_n/dt$ when $A_\mathrm{eff}$ is constant;
    reversing the winding direction or terminal polarity reverses the signs of $V$
    and $\Phi$ but not the non-negative area.


    The effective area is obtained from the constructed winding geometry or from calibration
    in a known applied magnetic field. It is the flux-loop analog of the sensitivity
    area used for [area_of_poloidal_magnetic_field_probe](name:area_of_poloidal_magnetic_field_probe),
    while [area_of_rogowski_coil](name:area_of_rogowski_coil) describes coupling to
    enclosed current rather than linked magnetic flux. It is used with [voltage_of_flux_loop](name:voltage_of_flux_loop)
    or time-integrated voltage to infer [poloidal_magnetic_flux_of_flux_loop](name:poloidal_magnetic_flux)
    or an equivalent averaged field.


    Typical values span several orders of magnitude. Compact local or saddle-loop
    sensors may have effective areas around $10^{-3}$-$10^{-1}$ m$^2$, while large
    multi-turn or vessel-encircling loops in major-radius-scale devices can have effective
    areas of order 1-100 m$^2$.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_poloidal_magnetic_field_probe
  - name:area_of_rogowski_coil
  - name:voltage_of_flux_loop
  - name:poloidal_magnetic_flux
  sources:
  - id: dd:magnetics/flux_loop/area
    dd_path: magnetics/flux_loop/area
    status: composed
- name: area_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Cross-sectional area of each turn of a poloidal magnetic field probe
    coil, which together with the turn count determines the effective flux-sensing
    area of the pickup coil.
  documentation: "The cross-sectional area of each individual turn of a poloidal magnetic\
    \ field probe coil is the geometric enclosed area of the wire loop in the plane\
    \ perpendicular to the probe's sensitive axis. Combined with the number of turns\
    \ $N$, it determines the total effective flux-sensing area $NA$ that links induced\
    \ voltage to the local magnetic field component.\n\nThe induced terminal voltage\
    \ follows Faraday's induction law:\n\n$$\nV = -N A \\frac{dB_n}{dt}\n$$\n\nwhere\
    \ $V$ is the terminal voltage, $N$ is the turn count, $A$ is the cross-sectional\
    \ area per turn, and $B_n$ is the magnetic field component normal to the coil\
    \ plane. Integrating the [voltage_of_poloidal_magnetic_field_probe](name:voltage_of_poloidal_magnetic_field_probe)\
    \ signal and dividing by $NA$ recovers the local poloidal field time trace.\n\n\
    The area is established during probe fabrication and verified by calibration in\
    \ a known applied field. It plays the same fundamental role for the poloidal sensing\
    \ channel as [area_of_toroidal_magnetic_field_probe](name:area_of_toroidal_magnetic_field_probe)\
    \ plays for the toroidal channel. Typical values for tokamak pickup coils range\
    \ from $10^{-5}$ to $10^{-4}$ m\xB2, reflecting a balance between sensitivity\
    \ and spatial resolution.\n\nSign convention: Positive when measured as the geometric\
    \ cross-section of the coil loop enclosed by the windings in the plane perpendicular\
    \ to the probe's sensitive axis."
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:voltage_of_poloidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_pol_probe/area
    dd_path: magnetics/b_field_pol_probe/area
    status: composed
  - id: dd:magnetics/bpol_probe/area
    dd_path: magnetics/bpol_probe/area
    status: attached
- name: area_of_rogowski_coil
  kind: scalar
  status: draft
  description: Effective cross-sectional area linked by the turns of a Rogowski coil.
    It is the flux-coupling area per turn that, together with winding turn density,
    sets the voltage sensitivity to a time-varying enclosed current.
  documentation: 'Area of a Rogowski coil is the effective cross-sectional area linked
    by its sensing winding. It represents the flux-coupling area per turn for the
    magnetic field generated by current enclosed by the closed coil. In a real coil
    it is a calibrated effective quantity that includes finite winding pitch, cross-section
    variation, and placement tolerances.


    For an ideal uniformly wound Rogowski coil that fully encloses the primary conductor,
    the current recovered from the coil voltage is


    $$

    I(t)-I(t_0) = \frac{1}{\mu_0 n A}\int_{t_0}^{t} V_R(t'')\,dt''

    $$


    where $A$ is the Rogowski-coil area, $n$ is the winding turn density in turns
    per meter along the closed winding path, $\mu_0$ is the vacuum permeability, and
    $V_R$ is the [Rogowski-coil voltage] after applying the chosen terminal polarity
    and integrator calibration. Equivalently, the ideal differential sensitivity is
    $V_R = \mu_0 n A\,dI/dt$ for the same polarity convention.


    In practice, $A$ may be estimated from mechanical dimensions for simple windings,
    but precision use normally determines it by calibration with a known pulsed current.
    The ideal relation assumes uniform turn density, a nonmagnetic core, complete
    enclosure of the measured current, negligible pickup from external fields, and
    a return conductor routed along the coil centerline so it does not form an additional
    single-turn pickup loop. The [major radius of the Rogowski coil] helps set the
    mean winding path length used to convert total turns to turn density.


    Typical effective areas for installed Rogowski coils are about $10^{-4}$-$10^{-2}$
    m$^2$ (1-100 cm$^2$), with compact in-vessel coils near the lower end and large
    air-core or calibration coils near the upper end. The overall current sensitivity
    is set by the product $\mu_0 n A$, so coils with the same area can produce different
    voltage signals if their winding densities differ.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links: []
  sources:
  - id: dd:magnetics/rogowski_coil/area
    dd_path: magnetics/rogowski_coil/area
    status: composed
- name: area_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Cross-sectional area of each turn of a toroidal magnetic field probe
    coil, which together with the number of turns sets the total effective flux pickup
    area for converting induced voltage to the toroidal magnetic field.
  documentation: 'The cross-sectional area of a single winding turn of a toroidal
    magnetic field probe determines how much toroidal magnetic flux threads each loop
    of the coil. The product of this area with the turn count gives the total effective
    pickup area that governs the coil''s voltage response to changes in the toroidal
    field component $B_\phi$.


    The induced terminal voltage follows Faraday''s law:


    $$

    V = -N A \frac{dB_\phi}{dt}

    $$


    where $V$ is the [terminal voltage](name:voltage_of_toroidal_magnetic_field_probe),
    $N$ is the algebraic turn count (see [count_of_toroidal_magnetic_field_probe](name:count_of_toroidal_magnetic_field_probe)),
    $A$ is the per-turn cross-sectional area, and $B_\phi$ is the local toroidal magnetic
    field component in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The area is determined from the coil''s physical dimensions during fabrication
    or verified by laboratory calibration; time-integrating the measured voltage and
    dividing by $NA$ recovers the absolute field $B_\phi$. The corresponding quantity
    for poloidal pickup coils is [area_of_poloidal_magnetic_field_probe](name:area_of_poloidal_magnetic_field_probe).


    Typical single-turn cross-sectional areas in tokamak magnetics diagnostics range
    from $10^{-5}$ to $10^{-3}$ m$^2$, depending on probe dimensions and required
    sensitivity.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:voltage_of_toroidal_magnetic_field_probe
  - name:count_of_toroidal_magnetic_field_probe
  - name:area_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_phi_probe/area
    dd_path: magnetics/b_field_phi_probe/area
    status: attached
