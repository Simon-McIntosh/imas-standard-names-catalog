- name: normalized_toroidal_flux_coordinate_of_measurement_position
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label assigning the Doppler reflectometer
    measurement location to a normalized toroidal-flux surface between the magnetic
    axis and boundary.
  documentation: 'This quantity is the normalized toroidal-flux coordinate of the
    physical position at which the Doppler reflectometer measurement is associated.
    It maps that measurement location to a nested magnetic surface rather than describing
    a cylindrical distance or a local vector component.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}}(\mathbf{x}_{\mathrm{m}}) = \left[\frac{\Phi_{\mathrm{tor}}(\mathbf{x}_{\mathrm{m}})-\Phi_{\mathrm{axis}}}{\Phi_{\mathrm{boundary}}-\Phi_{\mathrm{axis}}}\right]^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(\mathbf{x}_{\mathrm{m}})$ is the normalized toroidal-flux
    coordinate at the measurement position, $\mathbf{x}_{\mathrm{m}}$ is that physical
    measurement position, $\Phi_{\mathrm{tor}}(\mathbf{x}_{\mathrm{m}})$ is the toroidal
    magnetic flux enclosed by the magnetic surface passing through the position, $\Phi_{\mathrm{axis}}$
    is its value at the magnetic axis, and $\Phi_{\mathrm{boundary}}$ is its value
    at the last closed flux surface.


    The scope is one local magnetic-surface label evaluated at the Doppler reflectometer
    measurement position; it is not an average, integral, or aggregate over a propagation
    path, channel set, or plasma region. Within the region between the magnetic axis
    and the last closed flux surface, the value is zero at the axis and one at the
    boundary. It excludes the toroidal angle of the position and any signed displacement
    from a reference location.


    This is the measurement-position specialization of the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate); the parent defines the
    same surface label independently of the measurement locus.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: measurement_position
    operator_kind: locus
