- name: line_averaged_helium_4_density
  kind: scalar
  status: active
  description: Chord-averaged helium-4 ion number density along a specified line of
    sight through the plasma, representing the path mean of local fusion-ash concentration.
  documentation: 'The line-averaged helium-4 ion number density is the path average
    of the local helium-4 ion density along a specified chord through the plasma.
    It represents an effective density for that chord, not the local value at a point
    or a volume-wide mean.


    The line average is defined by


    $$

    \overline{n}_{{}^4\mathrm{He}} = \frac{1}{L}\int_{0}^{L} n_{{}^4\mathrm{He}}(l)\,dl

    $$


    where $n_{{}^4\mathrm{He}}(l)$ is the local helium-4 ion number density from [helium_4_density](name:helium_4_density),
    $l$ is distance along the chord, and $L$ is the chord length; $l$ and $L$ are
    measured in m.


    The average includes the local helium-4 ion density along the specified path and
    uses uniform path-length weighting. Unlike [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    it is not averaged over the confined plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_4_density
