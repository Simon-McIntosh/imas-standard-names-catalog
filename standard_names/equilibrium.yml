- name: radial_derivative_of_poloidal_magnetic_flux
  kind: scalar
  status: active
  description: The radial derivative of poloidal magnetic flux is its scalar derivative
    with respect to the dimensionful toroidal flux radius coordinate.
  documentation: 'The radial derivative of poloidal magnetic flux is the scalar coordinate
    derivative of the poloidal magnetic-flux function $\psi$ with respect to the dimensionful
    toroidal flux radius coordinate $\rho_{\mathrm{tor}}$. It is defined on nested
    equilibrium magnetic flux surfaces and gives the local mapping between the poloidal-flux
    label and the toroidal-flux-radius label.


    The defining relation is the derivative of the flux-function relation $\psi(\rho_{\mathrm{tor}})$:


    $$

    D_{\psi\rho}(\rho_{\mathrm{tor}}) = \frac{\partial \psi}{\partial \rho_{\mathrm{tor}}}

    $$


    where $D_{\psi\rho}$ denotes this quantity, $\psi$ is the [poloidal magnetic flux](name:poloidal_magnetic_flux)
    function, and $\rho_{\mathrm{tor}}$ is the [toroidal flux radius](name:toroidal_flux_radius),
    a dimensionful flux coordinate increasing outward from the magnetic axis. No additional
    normalization or factor of $2\pi$ is introduced by this derivative.


    This is a scalar derivative between flux-surface labels, not the spatial gradient
    of the poloidal magnetic-flux field; [gradient_of_poloidal_magnetic_flux](name:radial_derivative_of_poloidal_magnetic_flux)
    denotes that spatial-gradient quantity. It is also distinct from a partial derivative
    with respect to the major-radius coordinate $R$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. The second_radial_derivative_of_poloidal_magnetic_flux is
    the derivative of this quantity with respect to the same $\rho_{\mathrm{tor}}$
    coordinate, while flux_surface_averaged_metric is a separate radial metric using
    the same flux label.


    Sign convention: Positive when $\psi$ increases as $\rho_{\mathrm{tor}}$ increases
    from the magnetic axis toward outer flux surfaces.'
  unit: Wb.m^-1
  physics_domain: equilibrium
  links:
  - name:toroidal_flux_radius
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/dpsi_drho_tor
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-dpsi_drho_tor
    dd_documentation:
      leaf: Derivative of Psi with respect to Rho_Tor
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: Wb.m^-1
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Derivative of poloidal magnetic flux (\u03C8) with respect to\
        \ the toroidal flux coordinate (\u03C1_tor), d\u03C8/d\u03C1_tor. A metric\
        \ coefficient linking the poloidal and toroidal flux coordinate systems on\
        \ equilibrium flux surfaces."
      kind: llm
- name: radial_magnetization_of_iron_core_segment
  kind: scalar
  status: active
  description: Magnetization of an iron-core segment expressed as magnetic flux density,
    projected onto the outward major-radius direction and uniform within the segment.
  documentation: "This quantity is the radial component of an iron-core segment\u2019\
    s material magnetization expressed as magnetic flux density, with the magnetization\
    \ taken to be uniform throughout the segment. It is distinct from the total magnetic\
    \ field produced by the plasma, coils, and magnetized material.\n\nThe magnetic-flux-density-equivalent\
    \ magnetization is defined by\n\n$$\nB_{\\mathrm{mag},R} = \\mu_0 M_R\n$$\n\n\
    where $B_{\\mathrm{mag},R}$ is the named quantity, $M_R$ is the material-magnetization\
    \ component along the cylindrical major-radius direction, and $\\mu_0$ is the\
    \ permeability of free space. Its vertical counterpart is [vertical magnetization\
    \ of an iron-core segment](name:vertical_magnetization_of_iron_core_segment).\n\
    \nSign convention: Positive when the segment\u2019s magnetization points in the\
    \ direction of increasing major radius $R$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: T
  physics_domain: equilibrium
