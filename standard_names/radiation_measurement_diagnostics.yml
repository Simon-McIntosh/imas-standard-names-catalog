- name: height_of_optical_element
  kind: scalar
  status: active
  description: Height of an optical element is the usable clear-aperture extent along
    the second local tangential axis in the right-handed local aperture frame (X1,
    X2, X3), where X1 and X2 span the aperture plane and X3 is the aperture normal.
    It is distinct from optical-element width, the first-axis aperture extent.
  documentation: 'Height of an optical element is the full usable clear-aperture dimension
    along the second local tangential axis in the right-handed local aperture frame
    $(X_1, X_2, X_3)$, whose unit axes satisfy $\hat{X}_1 \times \hat{X}_2 = \hat{X}_3$.
    The $X_1$ and $X_2$ axes span the aperture plane, and $X_3$ is the aperture-normal
    axis. For a rectangular optical element, it is the side length along $X_2$ of
    the region that can transmit, reflect, or otherwise accept radiation.


    If the usable aperture is represented by the set $\mathcal{A}$ of points projected
    onto the local aperture plane, the height is the range of the second local coordinate
    over that set:


    $$

    h_\mathrm{opt} = \max_{\mathbf{p}\in\mathcal{A}} X_2(\mathbf{p}) - \min_{\mathbf{p}\in\mathcal{A}}
    X_2(\mathbf{p})

    $$


    where $h_\mathrm{opt}$ is the optical-element height, $\mathbf{p}$ is a point
    in the usable aperture, and $X_2(\mathbf{p})$ is its coordinate along the second
    local tangential axis.


    It is distinct from [width of an optical element](name:optical_element_width),
    which is the corresponding extent along the first local tangential axis. For nonrectangular
    apertures, this quantity is a projected extent along $X_2$, not an equivalent
    circular diameter or aperture area; opaque mounts, bevels, clamps, and intentionally
    excluded or inactive regions are outside the usable aperture unless they define
    the aperture boundary.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:optical_element_width
  sources:
  - dd_path: camera_ir/optical_element/geometry/x2_width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-optical_element-geometry-x2_width
    dd_documentation:
      leaf: Full width of the aperture in the X2 direction, used only if geometry_type
        = 3
      parent_path: camera_ir/optical_element/geometry
      parent: Further geometrical description of the element
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Full width of the optical aperture in the X2 direction for a rectangular
        aperture geometry (geometry_type=3) of an IR camera optical element. Used
        to define aperture dimensions for geometric ray-tracing and pixel-to-surface
        mapping.
      kind: llm
  - dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_width
