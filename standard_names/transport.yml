    dd_path: plasma_profiles/ggd/ion/state/velocity_exb/z
    status: composed
  - id: dd:plasma_profiles/ggd/neutral/state/velocity_exb/z
    dd_path: plasma_profiles/ggd/neutral/state/velocity_exb/z
