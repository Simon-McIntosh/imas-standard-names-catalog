- name: toroidal_ion_momentum_diffusion_coefficient
  kind: scalar
  status: active
  description: "Toroidal directional diffusion coefficient governing diffusive transport\
    \ of bulk-ion momentum as the toroidal diagonal component of the ion momentum\
    \ diffusivity tensor in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal ion momentum diffusion coefficient is the toroidal
    directional component of the [ion momentum diffusion coefficient](name:ion_momentum_diffusion_coefficient)
    vector and the $\hat{\phi}\hat{\phi}$ diagonal component of the bulk-ion momentum
    diffusivity tensor. It relates the diffusive flux of charge-state-summed bulk-ion
    toroidal momentum density along $\hat{\phi}$ to the local gradient of that momentum
    density along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius measured from the machine symmetry axis, $\phi$ is toroidal
    angle increasing counterclockwise when viewed from above along $+\hat{Z}$, and
    $Z$ is vertical height.


    In a gradient-diffusion closure, this diagonal component satisfies:


    $$

    \Pi_{\phi\phi,i}^{\rm diff} = -\chi_{\phi,i}\,\frac{1}{R}\frac{\partial}{\partial
    \phi}\left(m_i n_i v_{\phi,i}\right)

    $$


    where $\Pi_{\phi\phi,i}^{\rm diff}$ is the $\hat{\phi}$ projection of the diffusive
    flux of bulk-ion toroidal momentum density, positive for transport in the direction
    of increasing $\phi$; $\chi_{\phi,i}$ is this coefficient; $m_i$ is ion mass;
    $n_i$ is bulk-ion number density summed over all charge states; and $v_{\phi,i}$
    is the density-weighted mean bulk-ion flow velocity component along $\hat{\phi}$
    over all charge states, positive in the direction of increasing $\phi$. The derivative
    is taken at fixed $R$ and $Z$, so $R^{-1}\partial/\partial\phi$ is the directional
    derivative along $\hat{\phi}$.


    The toroidal qualifier denotes the tensor direction of both the transported momentum
    component and the spatial flux-gradient projection; it is not a cross-flux-surface
    coefficient for transport of toroidal momentum. This distinguishes it from [toroidal
    ion charge-state momentum diffusivity](name:toroidal_ion_charge_state_momentum_diffusivity),
    which is charge-state resolved and flux-surface-normal, positive toward increasing
    flux label. Convective momentum transport, explicit momentum sources or sinks,
    and residual-stress contributions are excluded.


    Sign convention: Positive when a positive derivative of the bulk-ion toroidal
    momentum density along increasing toroidal angle $\phi$ produces a diffusive flux
    of that momentum in the direction of decreasing toroidal angle $\phi$.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_diffusion_coefficient
  - name:toroidal_ion_charge_state_momentum_diffusivity
  arguments:
