- name: thickness_of_bragg_crystal
  kind: scalar
  status: draft
  description: Physical thickness of the Bragg crystal measured along its surface
    normal, controlling X-ray absorption and diffraction efficiency in a crystal spectrometer
    channel.
  documentation: "The thickness of a Bragg crystal is the dimension measured perpendicular\
    \ to the diffracting crystal planes \u2014 along the crystal surface normal. It\
    \ is a fundamental geometric parameter governing the trade-off between X-ray absorption\
    \ within the crystal bulk and the integrated diffraction efficiency, and it directly\
    \ sets the operating regime of the Bragg reflection.\n\nFor Bragg diffraction,\
    \ crystal thickness $t$ determines whether the crystal operates in the dynamical\
    \ (Darwin) regime ($t \\gg \\Lambda$, where $\\Lambda$ is the X-ray extinction\
    \ depth) with saturated peak reflectivity, or in the kinematical limit ($t \\\
    ll \\Lambda$) where peak reflectivity scales as $t^2$. Bulk transmission through\
    \ the crystal material follows Beer\u2013Lambert attenuation:\n\n$$\nI = I_0 \\\
    exp(-\\mu t)\n$$\n\nwhere $I_0$ is the incident X-ray intensity and $\\mu$ is\
    \ the linear attenuation coefficient of the crystal material at the relevant photon\
    \ energy.\n\nCrystal thickness is fixed at fabrication and can be verified by\
    \ X-ray transmission measurements or optical profilometry. Typical values range\
    \ from tens of micrometers for thin mica or silicon crystals to a few millimeters\
    \ for bent-crystal focusing geometries used in fusion X-ray spectroscopy.\n\n\
    Together with [bragg_crystal_width](name:bragg_crystal_width) and height_of_bragg_crystal,\
    \ the thickness fully characterizes the three-dimensional geometry of the crystal\
    \ element."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bragg_crystal_width
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/thickness
    dd_path: spectrometer_x_ray_crystal/channel/crystal/thickness
    status: composed
- name: thickness_of_filter
  kind: scalar
  status: draft
  description: Physical thickness of a diagnostic filter window material, which governs
    the energy-dependent photon attenuation and the effective spectral passband of
    X-ray detector channels.
  documentation: 'The filter window thickness is the geometric extent of the absorbing
    filter material measured along the direction normal to the filter surface, coinciding
    with the photon beam propagation path. Together with the material composition,
    it sets the Beer-Lambert transmission spectrum of the filter, controlling the
    low-energy photon cutoff and shaping the spectral sensitivity of the detector
    channel.


    The photon transmission through a filter of thickness $d$ at photon energy $E$
    follows:


    $$

    T(E) = \exp(-\mu(E)\, d)

    $$


    where $\mu(E)$ is the energy-dependent linear attenuation coefficient of the filter
    material in m$^{-1}$ and $d$ is the filter thickness. Increasing $d$ suppresses
    low-energy photons more strongly, raising the effective energy cutoff of the diagnostic.


    The thickness is a fixed hardware parameter established at instrument construction
    and determined by the required spectral selection. In soft X-ray diagnostics,
    filter foils span from tens of nanometers to tens of micrometers; hard X-ray diagnostics
    may use material layers from tens of micrometers to millimeters. The wavelength-resolved
    photon absorption that results from this thickness is captured by [spectral absorptivity
    of the filter](name:spectral_absorptivity_of_filter), while the lateral extent
    of the filter opening is characterized by [radius_of_filter](name:radius_of_filter).
    The analogous geometric parameter for the dispersing element is [thickness_of_bragg_crystal](name:thickness_of_bragg_crystal).


    Sign convention: Positive when the filter material thickness is measured from
    the beam-entry face to the beam-exit face along the direction of photon propagation.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_absorptivity_of_filter
  - name:radius_of_filter
  - name:thickness_of_bragg_crystal
  sources:
  - id: dd:camera_x_rays/filter_window/thickness
    dd_path: camera_x_rays/filter_window/thickness
    status: composed
  - id: dd:hard_x_rays/channel/filter_window/thickness
    dd_path: hard_x_rays/channel/filter_window/thickness
