- name: count_of_pellet
  kind: scalar
  status: active
  description: Total discrete particle inventory of a pellet, encompassing both the
    individual atom count of the pellet material and the propellant gas-molecule count
    carried with the pellet.
  documentation: The count of a pellet captures the total discrete particle inventory
    attributable to one injected pellet, abstracting over both its solid material
    constituents and its gas-phase payload. The [atomic count](name:atomic_count_of_pellet)
    tallies every individual atom present in the pellet, counting each atom once regardless
    of whether the propellant material is monatomic, diatomic, or molecular in form.
    The [gas count] enumerates the propellant gas molecules carried with the pellet,
    representing the gas-phase component of the overall particle inventory. Together
    these two child quantities partition the total pellet particle inventory and are
    applied in pellet fueling efficiency analysis, particle balance accounting, and
    ablation modeling for pellet injection systems.
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:atomic_count_of_pellet
- name: atomic_count_of_pellet
  kind: scalar
  status: active
  description: Number of individual atoms associated with a pellet, counted independently
    of molecular bonding, constituent species, or physical layer.
  documentation: 'Atomic count is the inventory of individual atoms associated with
    one pellet, including atoms bound in molecules and atoms in distinct material
    layers. It is the atomic component of [count of pellet](name:count_of_pellet),
    which also includes separately counted gas molecules.


    For constituent entity types indexed by $i$, the atomic inventory is defined by


    $$

    N_{\mathrm{atom}} = \sum_i a_i N_i

    $$


    where $N_i$ is the number of entities of type $i$ and $a_i$ is the number of atoms
    in each entity; molecular multiplicity is represented by [molecular atomic multiplicity](name:molecular_atomic_multiplicity).
    The whole-pellet value is unnormalized. Layer-restricted values, such as [core
    atomic count of pellet](name:core_atomic_count_of_pellet) and [outer atomic count
    of pellet](name:outer_atomic_count_of_pellet), partition the same atomic inventory,
    while [normalized atomic count of pellet](name:normalized_atomic_count_of_pellet)
    applies a scaling convention.


    Sign convention: Positive when the pellet contains atoms and each counted atom
    contributes +1 to the inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_of_pellet
  - name:core_atomic_count_of_pellet
  - name:outer_atomic_count_of_pellet
  - name:normalized_atomic_count_of_pellet
  arguments:
  - name: count_of_pellet
    operator: atomic
    operator_kind: qualifier
- name: core_atomic_count_of_pellet
  kind: scalar
  status: active
  description: Core atomic count of a pellet is the total inventory of atomic nuclei
    in its innermost material layer, independent of molecular bonding, phase, or species.
  documentation: 'Core atomic count of a pellet is the total inventory of atomic nuclei
    contained in the pellet''s innermost material layer. Molecules, compounds, and
    mixtures are converted to their constituent atoms before summation, regardless
    of molecular bonding or phase.


    For constituent entity types indexed by $i$, the core inventory is defined by


    $$

    N_{\mathrm{core}} = \sum_i a_i N_{i,\mathrm{core}}

    $$


    where $N_{i,\mathrm{core}}$ is the number of entities of type $i$ in the core
    layer and $a_i$ is the number of atoms in each entity. The value is an unnormalized
    component of [atomic count of pellet](name:atomic_count_of_pellet); together with
    [outer atomic count of pellet](name:outer_atomic_count_of_pellet), it partitions
    the whole-pellet atomic inventory when those layers form the complete pellet.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:atomic_count_of_pellet
  - name:outer_atomic_count_of_pellet
