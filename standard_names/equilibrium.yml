- name: upper_inner_squareness_of_flux_surface
  kind: scalar
  status: active
  description: The upper-inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how the upper, high-field-side quadrant
    of a nested toroidal magnetic flux surface departs from a reference ellipse; positive
    values are boxier and negative values are more diamond-like or indented.
  documentation: 'The upper-inner squareness of a flux surface is the dimensionless
    Luce (2013) shape coefficient that characterizes how the upper, high-field-side
    quadrant of a nested toroidal magnetic flux surface departs from a reference ellipse
    sharing the same center, horizontal half-width, and [elongation](name:elongation_of_flux_surface).
    It is the upper quadrant-resolved component of [inner_squareness_of_flux_surface](name:inner_squareness_of_flux_surface),
    complementing [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface).
    The upper-inner quadrant is the segment from the top of the surface to the inner
    midplane, on the high-field side at smaller major radius in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height.


    The coefficient $\zeta_\mathrm{ui}$ enters the Luce parametric flux-surface shape
    model as an additional harmonic beyond elongation $\kappa$ and [triangularity](name:triangularity_of_flux_surface):


    $$

    Z(\theta)-Z_c = a\kappa\sin\!\left[\theta + \zeta_\mathrm{ui}\sin(2\theta)\right],
    \qquad \pi/2 \le \theta \le \pi

    $$


    where $Z(\theta)$ is the vertical coordinate of the contour, $Z_c$ is the vertical
    coordinate of the surface center, $a$ is the horizontal half-width, $\theta$ is
    the geometric poloidal angle measured about the surface center in the $(R,Z)$
    cross-section with $\theta=0$ at the outboard midplane and increasing toward $+Z$,
    and $\zeta_\mathrm{ui}$ is the upper-inner squareness coefficient. Setting $\zeta_\mathrm{ui}=0$
    recovers the corresponding reference ellipse for this quadrant.


    This quantity is a quadrant-local squareness coefficient, not an average over
    the two inner quadrants and not an outboard squareness coefficient in the broader
    [squareness_of_flux_surface](name:squareness_of_flux_surface) family. It describes
    corner shaping not represented by elongation or triangularity alone.


    Sign convention: Positive when the upper high-field-side corner of the flux-surface
    cross-section is boxier than the reference ellipse; negative values indicate a
    more diamond-like or indented corner.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
