name: maximum_of_plasma_current_due_to_runaway_electrons
status: draft
description: Peak toroidal current carried by runaway electrons during a discharge,
  typically reached during the post-disruption runaway plateau.
documentation: "The maximum runaway electron current $I_{\\rm RE,max}$ records the\
  \ highest value of the runaway current $I_{\\rm RE}$ over the course of a discharge.\
  \ During a disruption, $I_{\\rm RE}$ rises as the thermal current decays and the\
  \ parallel electric field amplifies avalanche multiplication; $I_{\\rm RE,max}$\
  \ typically occurs at the end of the current quench phase when the runaway plateau\
  \ is established. Values can reach 0.5\u201310 MA in large tokamaks depending on\
  \ the pre-disruption current, plasma density, and mitigation efficacy (e.g., massive\
  \ gas injection or shattered pellet injection). This scalar is a key figure of merit\
  \ for disruption mitigation system design, as the runaway beam energy scales as\
  \ $W_{\\rm RE} \\propto I_{\\rm RE,max} \\langle \\gamma \\rangle m_e c^2 / e$,\
  \ where $\\gamma$ is the mean Lorentz factor. See also `plasma_current_due_to_runaway_electrons`\
  \ for the time-resolved signal and `plasma_current` for the total toroidal current."
