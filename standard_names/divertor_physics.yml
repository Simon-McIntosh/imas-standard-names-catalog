- name: parallel_heat_flux_at_divertor_target
  kind: scalar
  status: active
  description: Field-aligned power transported toward a divertor target, expressed
    per unit area normal to the local magnetic field.
  documentation: 'Parallel heat-flux density incident on a divertor target is the
    target-directed component of the plasma energy-flux vector carried along the local
    magnetic field line. It represents field-aligned energy transport and excludes
    contributions that are not parallel to the field.


    The target-directed component is defined by


    $$

    q_{\parallel}=\mathbf{q}\cdot\hat{\mathbf{b}}_{t}

    $$


    where $\mathbf{q}$ is the plasma energy-flux vector and $\hat{\mathbf{b}}_{t}$
    is the unit vector tangent to the local magnetic field line and directed toward
    the divertor target. This quantity is a directional component, whereas [energy
    flux at the divertor target](name:energy_flux_at_divertor_target) includes all
    incident energy channels and [flux at the divertor target](name:flux_at_divertor_target)
    represents total deposited power flux density.


    Sign convention: Positive when heat is transported along the local magnetic field
    line toward the divertor target.'
  unit: W.m^-2
  physics_domain: divertor_physics
  links: []
  sources:
  - dd_path: camera_ir/frame_analysis/power_flux_parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-frame_analysis-power_flux_parallel
    dd_documentation:
      leaf: Parallel heat flux received by the element monitored by the camera, along
        the distance_separatrix_midplane coordinate
      parent_path: camera_ir/frame_analysis
      parent: Quantities deduced from frame analysis for a set of time slices
      data_type: FLT_1D
      unit: W.m^-2
      coordinates:
      - camera_ir/frame_analysis/distance_separatrix_midplane
    enhanced_context:
      description: "Parallel heat flux (q\u2225) received by the plasma-facing element\
        \ monitored by the infrared camera, as a function of distance mapped to the\
        \ separatrix at the outboard midplane. Used to characterize power exhaust\
        \ in the scrape-off layer."
      kind: llm
- name: power_at_divertor_target
  kind: scalar
  status: active
  description: Power at a divertor target is the rate at which energy is deposited
    on one divertor target by a specified physical deposition channel, integrated
    over the target's wetted strike-zone surface.
  documentation: 'Power at a divertor target is the rate at which energy is deposited
    on one divertor target by a specified physical deposition channel, integrated
    over the target''s wetted strike-zone surface. The specified channel denotes a
    particular physical contribution to deposition and does not by itself imply an
    all-channel target total.


    The deposited power for target $t$ and channel $c$ is defined from the channel-resolved
    energy-flux-density vector over that surface:


    $$

    P_{t,c} = -\int_{A_t} \mathbf{S}_{E,c}(\mathbf{x}) \cdot \hat{\mathbf{n}}_t(\mathbf{x})
    \, dA

    $$


    where $P_{t,c}$ is the deposited power on target $t$ due to channel $c$, $A_t$
    is the target''s wetted strike-zone surface, $\mathbf{S}_{E,c}$ is the energy-flux-density
    vector for channel $c$, $\hat{\mathbf{n}}_t$ is the normalized surface normal
    directed from the target material toward the plasma-facing side, $\mathbf{x}$
    labels a point on the target surface, and $dA$ is the surface element. The leading
    minus sign makes flux directed from the plasma toward the target material contribute
    to the deposited target power.


    The channel label may distinguish conductive, convective, particle, radiative,
    or other deposition mechanisms, but this name does not prescribe a decomposition.
    For a complete mutually exclusive set of channel contributions on the same target,
    the channel sum equals the surface integral of the total [energy flux at a divertor
    target](name:energy_flux_at_divertor_target); all-channel target powers at the
    inner and outer divertor targets are represented by [power at inner divertor target](name:power_at_inner_divertor_target)
    and [power at outer divertor target](name:power_at_outer_divertor_target). Conductive
    and convective channel contributions are represented by [power at divertor target
    due to conduction](name:power_at_divertor_target_due_to_conduction) and [power
    at divertor target due to convection](name:power_at_divertor_target_due_to_convection),
    respectively.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_at_divertor_target
  - name:power_at_divertor_target_due_to_convection
  sources:
  - dd_path: divertors/divertor/target/power_currents
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_currents
    dd_documentation:
      leaf: Power deposited on this divertor target due to electric currents (positive
        means power is deposited on the target)
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power deposited on a divertor target due to electric currents flowing
        onto the target surface. A positive value indicates net power deposition from
        current flow.
      kind: llm
  - dd_path: divertors/divertor/target/power_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_incident
    dd_documentation:
      leaf: Total power incident on this target. This power is split in the various
        physical categories listed below
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Total power incident on a divertor target surface from all physical
        channels (conducted, convected, radiated, recombination, neutrals, currents).
        Parent structure partitioned into individual power components in sibling fields.
      kind: llm
- name: neutral_power_at_divertor_target
  kind: scalar
  status: active
  description: Net rate of energy deposited on one divertor target by incident neutral
    particles, including charge-exchange neutrals and neutral products of volume recombination.
  documentation: 'Neutral-particle target power is the rate at which neutral atoms
    or molecules transfer energy to one specified divertor target through bombardment
    from the plasma. It includes neutrals formed by charge exchange and volume recombination,
    and is distinct from the charged-particle target power [power at divertor target](name:power_at_divertor_target).


    $$

    P_{\mathrm{n,t}} = \int_{A_{\mathrm{t}}} \mathbf{q}_{\mathrm{n}}^{\mathrm{net}}
    \cdot \hat{\mathbf{n}}_{\mathrm{p\to t}}\, dA

    $$


    where $P_{\mathrm{n,t}}$ is the deposited neutral-particle power, $A_{\mathrm{t}}$
    is the surface area of the specified target, $\mathbf{q}_{\mathrm{n}}^{\mathrm{net}}$
    is the net neutral energy-flux vector crossing that surface, and $\hat{\mathbf{n}}_{\mathrm{p\to
    t}}$ points from the plasma toward the target material.


    The quantity excludes charged-particle sheath power, radiative absorption, and
    conductive power. Summing the corresponding contributions over all wetted divertor
    surfaces gives [neutral power of divertor](name:neutral_power_of_divertor); recombination-only
    contributions are covered by [power at divertor target due to recombination](name:power_at_divertor_target_due_to_recombination).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target
  - name:neutral_power_of_divertor
  - name:power_at_divertor_target_due_to_recombination
  arguments:
  - name: power_at_divertor_target
    operator: neutral
    operator_kind: qualifier
  sources:
  - dd_path: divertors/divertor/target/power_neutrals
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_neutrals
    dd_documentation:
      leaf: Net power from neutrals on this divertor target (positive means power
        is deposited on the target)
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Net power deposited on a divertor target by neutral particles,
        with positive values indicating power deposition on the target surface. Includes
        contributions from neutral particle fluxes impinging on the divertor.
      kind: llm
- name: power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Total rate of energy deposition on the high-field-side inner divertor
    target, integrated over its wetted surface and including all incident energy channels.
  documentation: 'This quantity is the total power deposited on the wetted surface
    of the high-field-side inner divertor target by all incident energy channels.
    It includes the electron and ion contributions represented by [electron_power_at_inner_divertor_target](name:electron_power_at_inner_divertor_target)
    and [ion_power_at_inner_divertor_target](name:ion_power_at_inner_divertor_target),
    together with other deposited channels.


    The deposited power is defined by the surface integral


    $$

    P_{\rm in} = \\int_{A_{\rm wet}} \\mathbf{q}_{E} \\cdot \\hat{\\mathbf{n}}_{\rm
    t} \, dA

    $$


    where $P_{\rm in}$ is the total target power, $A_{\rm wet}$ is the wetted target
    surface, $\\mathbf{q}_{E}$ is the total incident energy-flux density described
    by [energy_flux_at_divertor_target](name:energy_flux_at_divertor_target), and
    $\\hat{\\mathbf{n}}_{\rm t}$ points from the plasma toward the target.


    This is an instantaneous or interval-specific deposited power, not the maximum
    over a specified interval represented by [maximum_power_at_inner_divertor_target](name:maximum_power_at_inner_divertor_target).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_inner_divertor_target
  - name:maximum_power_at_inner_divertor_target
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Rate at which incident electron energy is deposited on the high-field-side
    inner divertor target, integrated over its wetted strike-zone surface.
  documentation: 'Electron power at the inner divertor target is the rate at which
    energy carried by incident electrons is deposited on the high-field-side divertor
    target surface. It is the electron-channel contribution to the total target load,
    rather than the combined contribution of all incident energy channels.


    The deposited electron power is defined by the surface integral


    $$

    P_{e,\mathrm{inner}} = \int_{A_{\mathrm{wet,inner}}} q_{e,\mathrm{dep}}(\mathbf{x})\,dA

    $$


    where $A_{\mathrm{wet,inner}}$ is the wetted inner-target area, $q_{e,\mathrm{dep}}$
    is the electron energy-deposition flux density in W m$^{-2}$, and $dA$ is an element
    of target surface area in m$^2$. The result is the electron contribution to [power
    at the inner divertor target](name:power_at_inner_divertor_target); ion energy
    is represented separately by [ion power at the inner divertor target](name:ion_power_at_inner_divertor_target),
    while neutral and radiative contributions are excluded.'
  unit: W
  physics_domain: divertor_physics
  links:
