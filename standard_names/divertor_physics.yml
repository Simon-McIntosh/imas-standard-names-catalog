- name: deposited_power_at_divertor_target_due_to_halo_current
  kind: scalar
  status: active
  description: Deposited power at a divertor target due to halo current is the electrical
    work rate delivered to one divertor target by halo current crossing its plasma-facing
    surface.
  documentation: 'Deposited power at a divertor target due to halo current is the
    electrical work rate delivered to one divertor target by halo current crossing
    the plasma-facing target surface. Halo current is current in the edge or scrape-off-layer
    plasma that closes through conducting plasma-facing structures; this quantity
    selects only its contribution to current-driven target loading.


    For a target surface with defined local current density and potential drop, the
    target-surface definition is:


    $$

    P_{\mathrm{halo},t} = \int_{A_t} j_{\mathrm{halo},n}^{\mathrm{in}}(\mathbf{r})\,\Delta\Phi_t(\mathbf{r})\,dA

    $$


    where $P_{\mathrm{halo},t}$ is this deposited power, $A_t$ is the portion of the
    plasma-facing target surface intercepted by halo current, $dA$ is a target-surface
    area element, $j_{\mathrm{halo},n}^{\mathrm{in}}$ is the conventional halo-current
    density projected on the local unit normal directed from the plasma into the target
    material, and $\Delta\Phi_t = \Phi_{\mathrm{plasma}} - \Phi_{\mathrm{target}}$
    is the local plasma-to-target potential drop.


    The surface integral of $j_{\mathrm{halo},n}^{\mathrm{in}}$ over $A_t$ is the
    halo-current contribution to [current at divertor target](name:current_at_divertor_target).
    This quantity excludes the conductive, convective, radiative, and neutral-particle
    target-power channels, and excludes current-driven target power not produced by
    halo current; together with other current-driven components it is part of [power
    at divertor target](name:power_at_divertor_target), while sums over divertor targets
    contribute to [power of divertor](name:power_of_divertor). It is zero when no
    halo-current electrical work is deposited on the target; positive values denote
    net energy deposition on that target.


    Sign convention: Positive when conventional halo current crosses from the plasma
    into the target along the plasma-to-material surface normal across a positive
    plasma-to-target potential drop.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target
  - name:current_at_divertor_target
  sources:
  - dd_path: divertors/divertor/target/power_currents
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_currents
    dd_documentation:
      leaf: Power deposited on this divertor target due to electric currents (positive
        means power is deposited on the target)
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power deposited on a divertor target due to electric currents flowing
        onto the target surface. A positive value indicates net power deposition from
        current flow.
      kind: llm
  - dd_path: divertors/divertor/target/power_incident
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_incident
    dd_documentation:
