- name: inner_radius_of_annular_conductor_cross_section
  kind: scalar
  status: draft
  description: Inner radius of the annular (hollow-circular) cross-section of a conductor
    element, defining the bore of the annulus.
  documentation: 'The inner radius $r_{\rm in}$ is the radial distance from the centroid
    of the annular cross-section to the inner boundary of the conductor wall, so that
    the annular cross-sectional area is $A = \pi(r_{\rm out}^2 - r_{\rm in}^2)$, where
    $r_{\rm out}$ is the [outer radius](name:outer_radius_of_annular_conductor_cross_section).
    Together, $r_{\rm in}$ and $r_{\rm out}$ fully characterize the hollow-circular
    conductor geometry, determining both the current-carrying area and the mechanical
    wall thickness $t = r_{\rm out} - r_{\rm in}$. In ion cyclotron resonance heating
    antenna design, this parameter governs the current density, ohmic losses, and
    water-cooling channel sizing within strap conductors. Typical values for ICRH
    strap conductors range from a few millimeters to several centimeters depending
    on the power handling requirements of the antenna. The geometry is also relevant
    to toroidal-field coil conductors shaped as annular tubes. For context within
    the broader cross-section geometry family, see [width_of_rectangle_geometry](name:width_of_rectangle_geometry)
    and [height_of_rectangle_geometry](name:height_of_rectangle_geometry) for rectangular
    conductor profiles, and [radius_of_curvature_of_arc_segment](name:radius_of_curvature_of_arc_segment)
    for arc-contour profiles.


    Sign convention: Positive when measured outward from the centroid of the annular
    cross-section toward the inner conductor wall.'
  unit: m
  physics_domain: auxiliary_heating
