[project]
name = "imas-standard-names-catalog"
dynamic = ["version"]
description = "IMAS Standard Names YAML catalog - data-only repository"
readme = "README.md"
authors = [
    { name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }
]
license = { text = "CC BY-ND 4.0" }
requires-python = ">=3.13"
dependencies = []

[project.urls]
"Documentation" = "https://iterorganization.github.io/imas-standard-names-catalog/"
"Repository" = "https://github.com/iterorganization/imas-standard-names-catalog"

[dependency-groups]
dev = [
    "imas-standard-names[quality] @ git+https://github.com/iterorganization/imas-standard-names.git",
]

[tool.uv]
package = false

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.targets.wheel]
artifacts = [
    "catalog.db",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
