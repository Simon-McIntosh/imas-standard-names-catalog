name: radial_width_of_reflectometer_antenna
status: draft
cocos_transformation_type: one_like
description: Spatial extent in the radial direction over which a reflectometer Doppler
  channel integrates fluctuating density profiles.
documentation: The radial width $\Delta R$ characterizes the effective radial resolution
  of a reflectometer antenna channel in Doppler backscattering mode. It represents
  the full width (in meters) of the radial volume from which backscattered signals
  contribute to the measured fluctuation spectrum. This width is determined by the
  combined effects of the antenna radiation pattern, the local curvature of the cut-off
  layer, and the turbulent scattering geometry; typical values range from a few millimeters
  to several centimeters depending on the probing frequency and density gradient.
  Accurate knowledge of $\Delta R$ is essential for interpreting Doppler reflectometer
  measurements of density fluctuation levels and poloidal flow velocities, because
  it sets the spatial averaging inherent in the measurement. See also the measurement
  position and the normalized flux coordinate at which the channel measures.
