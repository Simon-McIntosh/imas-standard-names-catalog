name: parallel_component_of_electron_momentum_convective_velocity
description: Projection of the electron momentum convective velocity onto the direction
  parallel to the local magnetic field line.
documentation: "The parallel component of the electron momentum convective velocity\
  \ $v_{\\parallel,e}^{\\mathrm{conv}}$ represents the bulk electron flow speed projected\
  \ along the magnetic field direction $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$. In\
  \ edge transport models, this quantity enters the parallel momentum balance equation\
  \ for the electron fluid, where the convective flux of parallel momentum is $\\\
  Gamma_{\\parallel,e}^{\\mathrm{mom}} = m_e n_e v_{\\parallel,e} v_{\\parallel,e}^{\\\
  mathrm{conv}}$, with $m_e$ the electron mass (kg), $n_e$ the electron number density\
  \ (m$^{-3}$), and $v_{\\parallel,e}$ the parallel electron velocity (m/s). In the\
  \ scrape-off layer and divertor regions, $v_{\\parallel,e}^{\\mathrm{conv}}$ is\
  \ dominated by parallel pressure gradients and electric-field-driven flows, typically\
  \ reaching $10^4$\u2013$10^5$ m/s in attached divertor conditions and exceeding\
  \ $10^5$ m/s during detachment transitions. It is obtained from edge fluid codes\
  \ such as SOLPS-ITER or SOLEDGE2D, or inferred from Mach-probe and spectroscopic\
  \ measurements. See also the ion counterpart and the electron particle convective\
  \ velocity for the full transport picture."
kind: vector_component
unit: m.s^-1
