- name: vertical_component_of_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk electron fluid velocity onto the vertical $Z$-axis
    of the right-handed cylindrical $(R, \phi, Z)$ frame, representing the net upward
    or downward motion of the electron population at each point in the plasma.
  documentation: "The vertical component $v_{e,Z} = \\mathbf{v}_e \\cdot \\hat{Z}$\
    \ isolates the $Z$-directed part of the electron bulk fluid velocity, where $\\\
    mathbf{v}_e$ is the electron fluid velocity and $\\hat{Z}$ is the unit vector\
    \ along the vertical axis of the right-handed cylindrical $(R, \\phi, Z)$ frame.\
    \ This quantity appears in the electron fluid momentum equation and contributes\
    \ to cross-field transport in regions with strong vertical gradients, such as\
    \ the divertor and scrape-off layer. In tokamak edge and divertor plasmas, $v_{e,Z}$\
    \ can reach $10^3$\u2013$10^5$ m/s, depending on the parallel flow projected along\
    \ field lines with significant vertical inclination. It is computed from fluid\
    \ or kinetic transport simulations and can be inferred indirectly from spectroscopic\
    \ Doppler measurements combined with magnetic geometry. The corresponding ion\
    \ and neutral counterparts are given by [vertical_component_of_ion_velocity](name:vertical_component_of_ion_velocity)\
    \ and [vertical_component_of_neutral_velocity](name:vertical_component_of_neutral_velocity);\
    \ the mass-weighted mixture velocity is [vertical_component_of_center_of_mass_velocity](name:vertical_component_of_center_of_mass_velocity).\
    \ The parent quantity [electron_velocity](name:electron_velocity) provides the\
    \ full vector from which this component is projected.\n\nSign convention: Positive\
    \ when the electron fluid velocity is directed in the $+Z$ direction (upward,\
    \ away from the divertor toward the top of the machine)."
  unit: m.s^-1
  physics_domain: transport
