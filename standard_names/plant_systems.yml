- name: hydrogen_source_rate_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron hydrogen source rate delivered to
    the plasma vessel by gas injection systems; each hydrogen atom contributes one
    equivalent-electron count.
  documentation: 'The hydrogen source rate due to gas injection characterizes the
    instantaneous rate at which neutral hydrogen atoms are admitted to the plasma
    vessel by gas injection, expressed as an equivalent-electron count rate. Because
    hydrogen has atomic number one, each atom contributes one equivalent-electron
    count.


    The defining relation is:


