- name: co_passing_particle_pressure
  kind: scalar
  status: draft
  description: "Total pressure carried by co-passing particles \u2014 those on untrapped\
    \ orbits whose guiding-center parallel velocity is directed along the net plasma\
    \ current \u2014 flux-surface-averaged at each radial position. Includes both\
    \ thermal and non-thermal (fast) contributions."
  documentation: 'Co-passing particles are untrapped charged particles whose guiding-center
    parallel velocity component along the magnetic field $\mathbf{B}$ is directed
    in the same sense as the net toroidal plasma current $I_p$. Because the toroidal
    plasma current direction defines the sign of the parallel streaming, a co-passing
    particle satisfies $v_\parallel > 0$ when $I_p > 0$ and the parallel coordinate
    is oriented along $\mathbf{B}$ in the current direction.


    Sign convention: Positive when the guiding-center parallel velocity is directed
    along the magnetic field in the same toroidal direction ($+\hat{\phi}$) as the
    net plasma current.


    The pressure reported here is the scalar (trace) pressure, defined as the mean
    of the diagonal elements of the pressure tensor $\mathsf{P}$:

    $$p_{\mathrm{co}} = \tfrac{1}{3}\left(P_{\parallel} + 2P_{\perp}\right)$$

    where $P_{\parallel} = \int m v_{\parallel}^2 f_{\mathrm{co}}\,d^3v$ and $P_{\perp}
    = \int \tfrac{1}{2} m v_{\perp}^2 f_{\mathrm{co}}\,d^3v$, with $f_{\mathrm{co}}$
    the distribution function restricted to the co-passing orbit class. Because the
    co-passing population is in general anisotropic ($P_{\parallel} \neq P_{\perp}$),
    the scalar pressure $p_{\mathrm{co}}$ does not fully characterize the pressure
    tensor; users requiring the full anisotropy should consult the parallel and perpendicular
    component quantities.


    This quantity is flux-surface-averaged, so it is a function of the radial coordinate
    only (e.g., $\rho_{\mathrm{tor,norm}}$ or $\psi$). It captures contributions from
    all co-passing particles regardless of species or energy, including thermal bulk
    ions and electrons as well as suprathermal fast particles.


    The total kinetic pressure is the sum over all orbit classes:

    $$p_{\mathrm{total}} = p_{\mathrm{co}} + p_{\mathrm{counter}} + p_{\mathrm{trapped}}$$

    where $p_{\mathrm{counter}}$ is the counter-passing pressure and $p_{\mathrm{trapped}}$
    is the trapped-particle pressure.


    Typical values in a burning plasma scenario range from $\sim 10^3\,\mathrm{Pa}$
    in the pedestal to $\sim 10^5\,\mathrm{Pa}$ or more in the core, depending on
    the ratio of co- to counter-passing populations and the fast-particle content.
    Units are Pa (= J m$^{-3}$).'
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_particle_pressure
  - name:trapped_particle_pressure
  - name:parallel_component_of_co_passing_fast_particle_pressure
  - name:toroidal_component_of_co_passing_particle_current_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure
    status: composed
- name: counter_passing_fast_particle_pressure
  kind: scalar
  status: draft
  description: Isotropic pressure of the counter-passing fast (suprathermal) particle
    population, flux-surface-averaged at each radial position. Counter-passing particles
    travel on untrapped orbits whose guiding-center parallel velocity is directed
    opposite to the plasma current.
  documentation: 'The counter-passing fast particle pressure $p_{\mathrm{cp,fast}}$
    is the isotropic kinetic pressure contribution from suprathermal particles occupying
    counter-passing orbits. The orbit classification is based on the guiding-center
    parallel velocity $v_\parallel = \mathbf{v}_{\mathrm{gc}} \cdot \hat{b}$, where
    $\hat{b} = \mathbf{B}/|\mathbf{B}|$ is the magnetic field unit vector. Counter-passing
    particles are untrapped (circulating) particles for which $v_\parallel$ has the
    sign opposite to the direction of the toroidal plasma current $I_p$ projected
    along $\hat{b}$. That is, defining $\sigma = \mathrm{sign}(\hat{b} \cdot \hat{e}_{I_p})$
    where $\hat{e}_{I_p}$ is the unit vector along the plasma current, counter-passing
    particles satisfy $\sigma\, v_\parallel < 0$.


    The pressure is defined as the isotropic second velocity moment of the fast-particle
    distribution function restricted to the counter-passing velocity-space domain:

    $$p_{\mathrm{cp,fast}} = \frac{1}{3} \int_{\mathrm{cp,fast}} m\, |\mathbf{v} -
    \mathbf{u}|^2\, f(\mathbf{v})\, d^3v$$

    where $m$ is the particle mass, $\mathbf{u}$ is the mean flow velocity, and the
    integration domain includes only particles with suprathermal energies (exceeding
    a species-dependent energy threshold separating fast from thermal populations)
    and satisfying the counter-passing orbit criterion.


    The flux-surface average is

    $$\langle p_{\mathrm{cp,fast}} \rangle = \frac{\oint p_{\mathrm{cp,fast}}\, dS
    / |\nabla \psi|}{\oint dS / |\nabla \psi|}$$

    where the integrals are taken over a closed magnetic flux surface labeled by the
    poloidal flux $\psi$, and $dS$ is the surface area element.


    This quantity encompasses all fast-particle species present (e.g., beam ions,
    fusion-born alpha particles, ICRH-accelerated minority ions). Together with the
    co-passing fast particle pressure and the trapped fast particle pressure, it forms
    a complete velocity-space partition of the total fast particle pressure:

    $$p_{\mathrm{fast}} = p_{\mathrm{co,fast}} + p_{\mathrm{cp,fast}} + p_{\mathrm{trapped,fast}}$$


    Typical values range from $10^2$ to $10^4$~Pa in the plasma core of large tokamaks
    and burning plasmas, depending on heating power and confinement. The counter-passing
    population is particularly sensitive to the geometry of neutral beam injection
    (counter-injection) and to orbit losses of energetic particles in non-axisymmetric
    fields. Asymmetries between co- and counter-passing pressures influence toroidal
    rotation, MHD stability, and fast-ion-driven instabilities.


    The parallel (anisotropic) component of the pressure tensor for this population
    is a separate quantity that characterizes the deviation from isotropy along the
    field line.'
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:co_passing_fast_particle_pressure
  - name:fast_particle_pressure
  - name:trapped_fast_particle_pressure
  - name:parallel_component_of_counter_passing_fast_particle_pressure
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/pressure_fast
    dd_path: distributions/distribution/profiles_1d/counter_passing/pressure_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/counter_passing/pressure_fast
    dd_path: distributions/distribution/profiles_2d/counter_passing/pressure_fast
    status: composed
- name: counter_passing_particle_pressure
  kind: scalar
  status: draft
  description: "Total pressure (thermal plus non-thermal) of counter-passing particles\
    \ \u2014 those on untrapped orbits with guiding-center parallel velocity directed\
    \ opposite to the plasma current \u2014 flux-surface-averaged at each radial position."
  documentation: 'Counter-passing particles occupy the untrapped region of velocity
    space with $v_\parallel < 0$ when the plasma current flows in the $+\hat{\phi}$
    direction; their guiding centers complete full toroidal transits without mirroring.
    The pressure is defined as the second velocity-space moment of the distribution
    function restricted to this orbit class,


    $$p_{\mathrm{cp}} = \frac{1}{3} \int_{\mathrm{counter\text{-}passing}} m v^2 f
    \, d^3v,$$


    where $m$ is the particle mass, $v$ the speed, and $f$ the distribution function.
    Both thermal and suprathermal contributions are included; for the fast-particle-only
    subset, see [counter_passing_fast_particle_pressure](name:counter_passing_fast_particle_pressure).
    The complementary co-directional quantity is [co_passing_particle_pressure](name:co_passing_particle_pressure),
    while [trapped_particle_pressure](name:trapped_particle_pressure) covers the bounce-trapped
    population. Together these three orbit-class pressures reconstruct the total kinetic
    pressure profile resolved by topology. Typical core values in neutral-beam-heated
    tokamak plasmas range from a few kPa to tens of kPa depending on beam injection
    geometry and plasma density. This quantity is computed from kinetic or gyrokinetic
    distribution-function solvers and Monte Carlo fast-particle codes; it enters neoclassical
    and gyrokinetic transport analyzes that require orbit-class-resolved momentum
    and energy balances.'
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_fast_particle_pressure
  - name:co_passing_particle_pressure
  - name:trapped_particle_pressure
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/pressure
    dd_path: distributions/distribution/profiles_1d/counter_passing/pressure
    status: composed
  - id: dd:distributions/distribution/profiles_2d/counter_passing/pressure
    dd_path: distributions/distribution/profiles_2d/counter_passing/pressure
    status: composed
- name: electron_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for radial electron energy transport across flux
    surfaces, governing the Fickian spreading of the electron thermal energy profile
    due to anomalous and neoclassical mechanisms.
  documentation: "The electron energy diffusivity $\\chi_e$ enters the radial electron\
    \ heat transport equation as $q_e = -n_e \\chi_e \\nabla T_e$, where $q_e$ is\
    \ the electron heat flux, $n_e$ is the electron density, and $T_e$ is the electron\
    \ temperature. It encapsulates contributions from both anomalous (turbulence-driven)\
    \ and neoclassical mechanisms, and is the primary transport coefficient characterizing\
    \ how rapidly electron thermal energy diffuses outward across nested flux surfaces.\
    \ Typical values in the core of H-mode tokamak plasmas range from $0.1$ to a few\
    \ $\\mathrm{m^2\\,s^{-1}}$, rising sharply in the pedestal and scrape-off layer;\
    \ in L-mode plasmas anomalous contributions can push $\\chi_e$ to $5$\u2013$10\\\
    ,\\mathrm{m^2\\,s^{-1}}$ in the outer core. It is inferred from power-balance\
    \ analysis using measured temperature and heating profiles, or from perturbative\
    \ heat-pulse propagation experiments. The electron energy diffusivity is the thermal-channel\
    \ counterpart to [electron particle diffusivity](name:electron_particle_diffusivity),\
    \ and the electron-species analog of [ion energy diffusivity](name:ion_energy_diffusivity);\
    \ together these coefficients form the core of the multi-species diffusive transport\
    \ model alongside [neutral energy diffusivity](name:neutral_energy_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:electron_particle_diffusivity
  - name:ion_energy_diffusivity
  - name:neutral_energy_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/electrons/energy/d
    dd_path: core_transport/model/profiles_1d/electrons/energy/d
    status: composed
- name: electron_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity governing radial electron particle transport
    across flux surfaces, quantifying the Fickian spreading of the electron density
    profile due to anomalous and neoclassical mechanisms.
  documentation: "The electron particle diffusivity $D_e$ enters the radial transport\
    \ equation for electron density as $\\Gamma_e = -D_e \\nabla n_e + V_e n_e$, where\
    \ $\\Gamma_e$ is the electron particle flux, $n_e$ is the electron density, and\
    \ $V_e$ is the convective pinch velocity. In turbulent tokamak plasmas, $D_e$\
    \ is dominated by anomalous contributions from drift-wave and electron-temperature-gradient\
    \ instabilities; neoclassical contributions are typically much smaller. Representative\
    \ core values span $0.01$\u2013$1\\;\\mathrm{m^2\\,s^{-1}}$ in H-mode and $0.1$\u2013\
    $5\\;\\mathrm{m^2\\,s^{-1}}$ in L-mode plasmas. The coefficient is inferred from\
    \ transient particle-balance analyzes, modulation experiments using gas-puff injection,\
    \ or from fits to measured $n_e$ profiles with transport codes. The analogous\
    \ quantity for ion species is [ion_particle_diffusivity](name:ion_particle_diffusivity),\
    \ while the electron energy channel is characterized by [electron_energy_diffusivity](name:electron_energy_diffusivity);\
    \ the neutral counterpart is [neutral_particle_diffusivity](name:neutral_particle_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_particle_diffusivity
  - name:electron_energy_diffusivity
  - name:neutral_particle_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/electrons/particles/d
    dd_path: core_transport/model/profiles_1d/electrons/particles/d
    status: composed
- name: electron_particle_source
  kind: scalar
  status: draft
  description: Total electron particle source rate integrated over the plasma volume,
    representing the net number of electrons added to or removed from the plasma per
    unit time by all active source processes.
  documentation: 'The electron particle source rate $S_e$ is the volume integral of
    all local electron source densities $s_e(\mathbf{r})$ over the plasma domain:


    $$S_e = \int s_e(\mathbf{r})\, dV$$


    where $s_e$ (in m$^{-3}$\,s$^{-1}$) includes contributions from ionization of
    recycled and fueled neutrals, pellet ablation, charge-exchange recombination losses,
    and external particle injection. A positive value indicates net electron creation;
    a negative value indicates net electron loss. In a typical burning-plasma scenario,
    $S_e$ balances the particle transport term $\partial n_e / \partial t$ when integrated
    over the confinement volume. Typical magnitudes range from $10^{19}$ to $10^{22}$
    s$^{-1}$ depending on fueling power and plasma size. This global integral is the
    spatial summation of the flux-surface-resolved quantity tracked by [electron_particle_source_inside_flux_surface](name:electron_particle_source_inside_flux_surface),
    and the electron-species analog of [total_ion_particle_source](name:total_ion_particle_source).
    Pellet injection contributes a localized burst captured separately in [pellet_ablation_rate_along_pellet_path](name:pellet_ablation_rate_along_pellet_path).


    Sign convention: Positive when electrons are being added to the plasma (net ionization
    or injection exceeding recombination and loss).'
  unit: s^-1
  physics_domain: transport
  links:
  - name:electron_particle_source_inside_flux_surface
  - name:total_ion_particle_source
  - name:pellet_ablation_rate_along_pellet_path
  constraints: []
  sources:
  - id: dd:core_sources/source/global_quantities/electrons/particles
    dd_path: core_sources/source/global_quantities/electrons/particles
    status: composed
- name: electron_particle_source_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of the electron particle source rate enclosed
    within a given flux surface, equal to the integral of the local electron source
    density over the plasma volume inside that surface. This quantity drives the electron
    density transport equation and increases monotonically from zero at the magnetic
    axis to the total source at the last closed flux surface.
  documentation: "The electron particle source inside a flux surface is defined as\n\
    $$S_e^{<}(\\rho) = \\int_0^{\\rho} s_e(\\rho') \\, V'(\\rho') \\, d\\rho'$$\n\
    where $s_e$ [m$^{-3}$ s$^{-1}$] is the flux-surface-averaged local electron source\
    \ density, $V'(\\rho) = dV/d\\rho$ is the differential volume element (the derivative\
    \ of the enclosed plasma volume $V$ with respect to the chosen radial coordinate\
    \ $\\rho$), and $\\rho$ labels nested flux surfaces (e.g., $\\rho_{\\mathrm{tor,norm}}$,\
    \ the normalized toroidal flux radius).\n\nThe differential relation connecting\
    \ the cumulative enclosed source to the local source density is\n$$\\frac{dS_e^{<}}{d\\\
    rho} = s_e(\\rho) \\, V'(\\rho).$$\n\nIn the electron density transport equation,\
    \ the cumulative enclosed source appears as the source term on the right-hand\
    \ side of the volume-integrated continuity equation. The full 1-D transport equation\
    \ for electron density, integrated over the volume enclosed by a flux surface,\
    \ reads\n$$\\frac{\\partial}{\\partial t}\\left(\\langle n_e \\rangle V\\right)\
    \ + \\Gamma_e^{<} = S_e^{<}(\\rho)$$\nwhere $\\langle n_e \\rangle$ is the flux-surface-averaged\
    \ electron density, $V$ is the enclosed plasma volume, and $\\Gamma_e^{<}$ is\
    \ the radial electron particle flux integrated over the flux surface (with units\
    \ s$^{-1}$). The divergence of the radial particle flux, not the cumulative source,\
    \ is the term that balances $\\partial_t (\\langle n_e \\rangle V)$ in the differential\
    \ continuity equation; $S_e^{<}$ is the integrated source driving that equation.\n\
    \nPhysical contributions to $s_e$ include ionization of neutral atoms, beam-plasma\
    \ interactions, and pellet ablation, partially offset by recombination. Typical\
    \ values of $S_e^{<}$ at the last closed flux surface in a large tokamak are of\
    \ order $10^{20}$\u2013$10^{22}$ s$^{-1}$, scaling with machine size and heating\
    \ power.\n\nBy construction, $S_e^{<}$ is zero at the magnetic axis and equals\
    \ the total electron particle source within the separatrix at $\\rho = 1$. It\
    \ is a monotonically non-decreasing function of $\\rho$ when the local source\
    \ $s_e$ is non-negative everywhere, which is the usual situation in core transport\
    \ modeling."
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_particle_source_inside_flux_surface
  - name:total_ion_particle_source_inside_flux_surface
  - name:electron_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/electrons/particles_inside
    dd_path: core_sources/source/profiles_1d/electrons/particles_inside
    status: composed
- name: implicit_part_of_electron_energy_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the electron energy source, defined
    by the decomposition $S_e = S_\mathrm{exp} + S_\mathrm{imp} \cdot T_e$, used to
    enhance numerical stability in transport solver time-stepping.
  documentation: "In 1D core transport solvers, source terms are split into an explicit\
    \ part $S_\\mathrm{exp}$ (in W m$^{-3}$) and an implicit part via $S_e = S_\\\
    mathrm{exp} + S_\\mathrm{imp} \\cdot T_e$, where $T_e$ is the electron temperature.\
    \ This quantity is $S_\\mathrm{imp}$, carrying units of s$^{-1}$, and represents\
    \ the local, flux-surface-averaged linearization coefficient of the electron energy\
    \ source evaluated at each radial grid point. The decomposition allows stiff energy-exchange\
    \ terms (such as electron\u2013ion collisional coupling or radiation losses proportional\
    \ to $T_e$) to be treated implicitly, improving convergence and time-step stability\
    \ without requiring a fully nonlinear solve. Physically, a strongly negative $S_\\\
    mathrm{imp}$ indicates a strongly stabilizing (damping) feedback of electron temperature\
    \ on the source, typical of collisional radiation terms. This quantity is the\
    \ electron-energy counterpart of the [implicit part of the electron particle source](name:implicit_part_of_electron_particle_source)\
    \ and the electron analog of the [implicit part of the ion energy source](name:implicit_part_of_ion_energy_source);\
    \ together they span the linearized source family used in coupled electron\u2013\
    ion transport.\n\nSign convention: Positive when the implicit source coefficient\
    \ amplifies the electron energy equation's primary quantity, corresponding to\
    \ a net energy gain per unit electron temperature increase."
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_electron_particle_source
  - name:implicit_part_of_ion_energy_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/electrons/energy_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/electrons/energy_decomposed/implicit_part
    status: composed
- name: implicit_part_of_electron_particle_source
  kind: scalar
  status: draft
  description: Implicit linearization coefficient of the electron particle source,
    defined by the decomposition S_e = S_exp + S_imp * n_e, where S_imp (units s^-1)
    is the density-proportional coefficient used to treat stiff source terms implicitly
    in 1D core transport solvers. This is a flux-surface-averaged, local quantity
    evaluated at each radial position along the transport grid.
  documentation: "In implicit-explicit (IMEX) operator splitting of transport source\
    \ terms, the total electron particle source $S_e$ (m$^{-3}$s$^{-1}$) is decomposed\
    \ as\n$$S_e = S_\\mathrm{exp} + S_\\mathrm{imp}\\,n_e,$$\nwhere $S_\\mathrm{exp}$\
    \ (m$^{-3}$s$^{-1}$) is the explicit part evaluated at the previous iterate and\
    \ $S_\\mathrm{imp}$ (s$^{-1}$) \u2014 this quantity \u2014 is the implicit linearization\
    \ coefficient multiplying the electron density $n_e$ (m$^{-3}$) to form the density-proportional\
    \ implicit contribution. Physically, $S_\\mathrm{imp}$ is the local Jacobian-like\
    \ derivative of the source with respect to $n_e$, computed at the current transport\
    \ state; it captures the linear sensitivity of the source to changes in electron\
    \ density and is held fixed within one nonlinear iteration step.\n\nThis decomposition\
    \ is applied to stabilize stiff density-dependent processes such as ionization,\
    \ recombination, and inter-species particle exchange, where the source rate varies\
    \ strongly with $n_e$. Treating the implicit part fully implicitly in time improves\
    \ solver convergence and permits larger time steps.\n\nThe quantity is a flux-surface-averaged,\
    \ local coefficient: one value is associated with each position along the radial\
    \ transport coordinate, making it a scalar field over that coordinate.\n\nTypical\
    \ magnitudes span roughly $10^{-2}$\u2013$10^{1}$ s$^{-1}$ for dominant atomic\
    \ physics processes in the plasma core, though the exact range depends on the\
    \ local plasma conditions and which processes contribute.\n\nSign convention:\
    \ Positive when the implicit term $S_\\mathrm{imp}\\,n_e$ represents a net source\
    \ (particle gain) for the electron population, and negative when it acts as a\
    \ net sink (particle loss channel)."
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_electron_energy_source
  - name:implicit_part_of_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/electrons/particles_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/electrons/particles_decomposed/implicit_part
    status: composed
- name: implicit_part_of_ion_energy_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the ion energy source for a single
    ion species, obtained by decomposing the source as $S = S_\mathrm{exp} + S_\mathrm{imp}
    \cdot T_i$, where this quantity is $S_\mathrm{imp}$.
  documentation: 'In a 1D core transport solver, the ion energy equation source term
    $Q_i$ is split into an explicit part $Q_\mathrm{exp}$ (independent of the primary
    quantity) and an implicit part $S_\mathrm{imp}$ such that $Q_i = Q_\mathrm{exp}
    + S_\mathrm{imp} \cdot T_i$, where $T_i$ is the ion temperature of the species
    in question. This linearized decomposition enhances numerical stability by treating
    the stiff, temperature-dependent portion of the source implicitly during time-stepping.
    The quantity $S_\mathrm{imp}$ carries units of s$^{-1}$, reflecting its role as
    a rate coefficient multiplying the primary quantity $T_i$. Negative values of
    $S_\mathrm{imp}$ correspond to energy sinks that strengthen with increasing $T_i$
    (e.g., radiative or collisional cooling terms), while positive values indicate
    destabilizing energy additions. This single-species quantity contrasts with [implicit_part_of_total_ion_energy_source](name:implicit_part_of_total_ion_energy_source),
    which represents the coefficient summed over all ion species. The analogous coefficient
    for the electron energy equation is [implicit_part_of_electron_energy_source](name:implicit_part_of_electron_energy_source),
    and the corresponding particle-source coefficient for a single ion species is
    [implicit_part_of_ion_particle_source](name:implicit_part_of_ion_particle_source).


    Sign convention: Positive when the implicit source term adds energy to the ion
    population at a rate proportional to $T_i$.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_total_ion_energy_source
  - name:implicit_part_of_electron_energy_source
  - name:implicit_part_of_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/ion/energy_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/ion/energy_decomposed/implicit_part
    status: composed
  - id: dd:core_sources/source/profiles_1d/ion/state/energy_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/ion/state/energy_decomposed/implicit_part
    status: composed
- name: implicit_part_of_ion_particle_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the single-species ion particle
    source, defined by the decomposition $S_i = S_\mathrm{exp} + S_\mathrm{imp} \cdot
    n_i$, where this quantity is $S_\mathrm{imp}$.
  documentation: "In an IMEX (implicit-explicit) transport solver, the ion particle\
    \ source $S_i$ is split as $S_i = S_\\mathrm{exp} + S_\\mathrm{imp} \\cdot n_i$,\
    \ where $n_i$ (m$^{-3}$) is the ion density of a single species and $S_\\mathrm{imp}$\
    \ is the implicit coefficient carrying units of s$^{-1}$. Treating the density-proportional\
    \ part implicitly damps numerical instabilities that arise when source terms are\
    \ stiff relative to the transport time step. This quantity applies to a single\
    \ ion species, distinguishing it from [implicit_part_of_total_ion_particle_source](name:implicit_part_of_total_ion_particle_source),\
    \ which sums over all ion species. The coefficient is evaluated as a flux-surface-averaged\
    \ radial profile and is derived from physics models for ionization, recombination,\
    \ neutral-beam injection, and pellet ablation. Typical magnitudes depend strongly\
    \ on the dominant source process; ionization-dominated edge sources can yield\
    \ $|S_\\mathrm{imp}|$ of order $10^{1}$\u2013$10^{3}$ s$^{-1}$ in the pedestal\
    \ region. The companion explicit part captures source contributions independent\
    \ of $n_i$, analogously to the electron channel described by [implicit_part_of_electron_particle_source](name:implicit_part_of_electron_particle_source).\n\
    \nSign convention: Positive when the implicit coefficient acts as a particle source\
    \ (increases $n_i$) rather than a sink."
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_total_ion_particle_source
  - name:implicit_part_of_electron_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/ion/particles_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/ion/particles_decomposed/implicit_part
    status: composed
  - id: dd:core_sources/source/profiles_1d/ion/state/particles_decomposed/implicit_part
