- name: area_of_passive_loop
  kind: scalar
  status: draft
  description: Cross-sectional area of the conductor or structural element forming
    a passive axisymmetric loop.
  documentation: 'The cross-sectional area $A$ of a passive loop element determines
    the loop''s electrical resistance $R = \rho L / A$ (where $\rho$ is the conductor
    resistivity and $L$ the element length) and thus the characteristic eddy-current
    decay time $\tau = L / R$. Passive loops are electrically conducting structures,
    such as vacuum-vessel segments or stabilizing shells, in which plasma transients
    induce current without an external power supply. Typical cross-sectional areas
    range from $10^{-4}\,\text{m}^2$ for thin-wall stabilizing shells to $10^{-1}\,\text{m}^2$
    for thick vacuum-vessel sections. The area enters magnetic-field diffusion calculations
    and the coupling between passive structures and active coils. See the related
    quantities [current_of_passive_loop_due_to_induction](name:current_of_passive_loop_due_to_induction)
    for the induced current and [major_radius_of_passive_loop](name:major_radius_of_passive_loop)
    for the element''s radial position.


    Sign convention: Positive when the cross-section is oriented such that the surface
    normal points in the direction of the current path along the loop''s contour.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_passive_loop_due_to_induction
  - name:major_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/area
    dd_path: pf_passive/loop/element/area
    status: composed
- name: area_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional area of the conductor within a non-axisymmetric toroidal
    field coil, used for estimating coil resistance and thermal capacity.
  documentation: The cross-sectional area of the conductor within a non-axisymmetric
    toroidal field coil, such as an ELM control coil. This area is measured in a plane
    perpendicular to the local conductor direction and is used to compute the coil's
    electrical resistance, current density, and thermal behavior. For rectangular
    or circular conductors, the area is derived from the conductor's geometric dimensions
    (width and height or radius). The typical range is on the order of $10^{-4}$ to
    $10^{-2}\,\mathrm{m}^2$ for poloidal field and ELM control coils, depending on
    the fusion device size and coil design. The area affects the coil's inductance
    and heating during operation.
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/area
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/area
    status: composed
  - id: dd:tf/coil/conductor/cross_section/area
    dd_path: tf/coil/conductor/cross_section/area
    status: composed
- name: effective_count_of_passive_loop
  kind: scalar
  status: draft
  description: Signed effective number of conductor turns in a passive loop element,
    encoding the winding direction via the sign.
  documentation: 'The signed effective turn count $N_{\text{eff}}$ of a passive loop
    element quantifies both the number of conductor turns and the winding direction,
    where a positive sign indicates current flow in the direction of increasing toroidal
    angle $\phi$ (counter-clockwise when viewed from above). The absolute value is
    the effective number of turns contributing to the magnetic coupling with active
    coils; the sign is required for consistent summation of induced currents in circuit
    models. The effective count may differ from the physical turn count when geometric
    or skin-effect corrections apply.


    Sign convention: Positive when current flows in the direction of increasing toroidal
    angle $\phi$.


    This quantity is used together with the [area_of_passive_loop](name:area_of_passive_loop)
    and [resistance_of_passive_loop](name:resistance_of_passive_loop) for eddy-current
    calculations. A related concept for active coils is described by [effective_count_of_poloidal_field_coil](name:effective_count_of_poloidal_field_coil).'
  unit: '1'
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_passive_loop
  - name:resistance_of_passive_loop
  - name:effective_count_of_poloidal_field_coil
  sources:
  - id: dd:pf_passive/loop/element/turns_with_sign
    dd_path: pf_passive/loop/element/turns_with_sign
    status: composed
- name: inner_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a passive conducting loop
    conductor, defining the boundary of the hollow conductor core.
  documentation: 'The inner radius $r_{\text{inner}}$ describes the radial extent
    of the hollow interior of a passive loop conductor''s circular or annular cross-section,
    measured from the conductor''s local axis. For a solid (non-hollow) conductor,
    this value is zero. Together with the [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop),
    it defines the conductor''s cross-sectional area and thus its electrical conductance
    and inductive coupling with the plasma and active coils. The loop''s electrical
    [resistance_of_passive_loop](name:resistance_of_passive_loop) scales with the
    cross-sectional area derived from these radii. Typical values for in-vessel passive
    stabilizing loops range from 0.01 m to 0.1 m, depending on the conductor material
    (copper, beryllium, or steel) and the required eddy-current decay time.


    Sign convention: Positive for all physically valid conductors; the inner radius
    is geometrically positive semi-definite and always less than or equal to the outer
    radius.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_passive_loop
  - name:resistance_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_inner
    dd_path: pf_passive/loop/element/geometry/annulus/radius_inner
    status: composed
- name: length_of_passive_loop
  kind: scalar
  status: draft
  description: Length of the parallelogram side of an oblique trapezoidal cross-section
    of a passive loop element, inclined at angle beta with respect to the height axis.
    This side defines the slanted edge of the loop's cross-sectional geometry.
  documentation: The length of the parallelogram side inclined at angle beta ($\beta$)
    with respect to the height axis in an oblique trapezoidal cross-section model
    of a passive loop element. This geometric parameter describes the slanted edge
    of the loop's cross-section, where $\beta$ is measured from the vertical (height)
    axis in the IMAS cylindrical $(R, \phi, Z)$ frame. The angle $\beta$ typically
    ranges from 0 to 90 degrees, with $\beta = 0$ corresponding to a vertical side
    and $\beta = 90^\circ$ to a horizontal side. This length is a key input for calculating
    the loop's electrical resistance and inductance, which influence eddy current
    dynamics during plasma disruptions. Positive orientation follows the direction
    of increasing $\beta$ (counter-clockwise from the height axis in the cross-sectional
    plane).
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_passive_loop
  - name:major_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/oblique/length_beta
    dd_path: pf_passive/loop/element/geometry/oblique/length_beta
    status: composed
- name: magnetic_field_of_iron_core_segment
  kind: scalar
  status: draft
  description: Scalar magnetic field magnitude used as the independent variable for
    evaluating the relative permeability of an iron core segment from its material
    lookup table. This field quantifies the applied magnetic flux density B in the
    core segment and is paired with corresponding relative permeability values to
    define the nonlinear B-H curve.
  documentation: "The magnetic field of an iron core segment provides the discrete\
    \ set of magnetic flux density values $B$ (in tesla) that form the independent-variable\
    \ axis of the $(B,\\mu_r)$ lookup table characterizing the nonlinear magnetic\
    \ response of the core material. For each entry in this array, the corresponding\
    \ relative permeability $\\mu_r = B/(\\mu_0 H)$ is specified, enabling the core's\
    \ inductance and saturation behavior to be updated in circuit models as a function\
    \ of the applied field. Typical values range from $0\\,\\mathrm{T}$ to approximately\
    \ $2\\,\\mathrm{T}$ for common ferromagnetic materials. The relationship between\
    \ the magnetic field and the magnetic flux density is $B = \\mu_0 \\mu_r H$, where\
    \ $\\mu_0 = 4\\pi\\times 10^{-7}\\,\\mathrm{N/A^2}$ is the vacuum permeability.\
    \ \n\nSign convention: Positive when the field magnitude is measured as a positive\
    \ scalar, consistent with the direction of positive flux in the core segment."
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:relative_permeability_of_iron_core_segment
  - name:maximum_magnetic_field_of_poloidal_field_coil
  sources:
  - id: dd:iron_core/segment/b_field
    dd_path: iron_core/segment/b_field
    status: composed
- name: major_radius_of_ferritic_element
  kind: scalar
  status: draft
  description: The major radius R of the first point of a thick-line polygon element
    defining the cross-section of an axisymmetric ferritic component, such as a ferromagnetic
    insert or structural insert. This establishes the radial position from which the
    full geometry is defined in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The major radius $R$ is the cylindrical coordinate of the starting
    vertex of a thick-line polygon representing the cross-section of a ferritic element,
    such as a ferromagnetic insert or structural component. This quantity sets the
    radial location of the reference vertex, from which the full element geometry
    is built. $R$ is measured in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is the distance from the machine symmetry axis. For axisymmetric ferritic
    components in tokamaks, typical values range from 1 to 4 meters, varying with
    radial placement inside the vacuum vessel. This geometric parameter is analogous
    to the major radius used for other device components, such as poloidal field coils
    and iron core segments.


    Sign convention: Positive when the first point lies at a larger major radius than
    the machine symmetry axis.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
