name: major_radius_of_delta_position
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the spatial offset between the nominal
  and actual ECE measurement location due to suprathermal electron emission.
documentation: "In electron cyclotron emission (ECE) diagnostics, the emission layer\
  \ for a given frequency is determined by the resonance condition $\\omega = n \\\
  omega_{ce}(R)$, where $\\omega_{ce} = eB/m_e$ is the electron cyclotron frequency\
  \ and $n$ is the harmonic number. When a significant suprathermal (non-Maxwellian)\
  \ electron population is present, the effective emission location shifts away from\
  \ the cold-resonance position because relativistic mass increase and Doppler broadening\
  \ move the emission peak. The quantity $R_{\\delta}$ (in meters) records the major\
  \ radius of this shifted position, enabling correction of the spatial mapping of\
  \ the ECE channel. Typical values lie within a few centimeters of the cold-resonance\
  \ major radius, i.e., $|R_{\\delta} - R_0| \\lesssim 0.01$\u2013$0.05$ m, with the\
  \ magnitude increasing at higher electron temperatures ($T_e \\gtrsim 5$ keV) or\
  \ in the presence of runaway electrons. This displacement is computed from relativistic\
  \ ray-tracing or forward-modeling codes (e.g., SPECE, ECRad) that account for the\
  \ full electron distribution function. See `major_radius_of_measurement_position`\
  \ for the nominal cold-resonance location and `major_radius_of_flux_surface` for\
  \ the equilibrium mapping context."
