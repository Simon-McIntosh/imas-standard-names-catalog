name: mass_spectrometer_channel_atomic_mass
status: draft
description: Atomic mass number $A$ of the species detected by a given channel of
  a mass spectrometer diagnostic.
documentation: "The atomic mass $A$ (in unified atomic mass units, u) identifies which\
  \ ion species a particular mass-spectrometer channel is tuned to detect. Residual\
  \ gas analyzers and Penning-gauge mass spectrometers are routinely used in fusion\
  \ devices to monitor the partial pressures of hydrogen isotopes ($A = 1, 2, 3$ for\
  \ H, D, T), helium ($A = 4$), and common impurities such as carbon ($A = 12$), nitrogen\
  \ ($A = 14$), and oxygen ($A = 16$). Channel assignment is typically calibrated\
  \ before a campaign using known gas mixtures; during plasma operations the spectrometer\
  \ tracks fuel recycling, wall outgassing, and helium ash removal. Typical values\
  \ are integer or near-integer, spanning $A = 1$\u201350 for light-impurity monitoring.\
  \ See also `deuterium_deuterium_neutron_emissivity` and `deuterium_tritium_neutron_emissivity`\
  \ for related particle diagnostics."
