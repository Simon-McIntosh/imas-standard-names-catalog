      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Inner radius of an annular conductor cross-section in a TF coil,
        applicable when the geometry type is set to annulus. Defines the bore boundary
        of the TF coil conductor cross-section geometry.
      kind: llm
- name: resistance_of_correction_coil
  kind: scalar
  status: active
  description: Ohmic resistance of a non-axisymmetric correction-coil conductor, relating
    its current to the voltage drop and dissipated resistive power.
  documentation: 'The resistance of a non-axisymmetric correction-coil conductor is
    the proportionality between its steady conventional current and the associated
    ohmic voltage drop. It describes dissipation in the conductor rather than inductive
    or other reactive voltage contributions.


    For a uniform conductor, the resistance is defined by


    $$

    R = \rho \frac{L}{A}

    $$


    where $R$ is resistance in ohms, $\rho$ is electrical resistivity in ohm-meters,
    $L$ is the effective conductor length in meters, and $A$ is the cross-sectional
    area in square meters. The terminal relation is $V = IR$, where $V$ is the ohmic
    voltage drop and $I$ is the current; the corresponding resistive power is $P =
    I^2R$. The current is the [current of the correction coil](name:current_of_correction_coil),
    and the conductor area is represented by the [area of the correction coil](name:area_of_correction_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_correction_coil
  - name:area_of_correction_coil
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/resistance
