name: pellet_injection_occurrence_flag
status: draft
cocos_transformation_type: one_like
description: Binary flag indicating whether pellet injection is active during a given
  discharge time interval (1 = active, 0 = inactive).
documentation: This dimensionless integer flag (unit 1) signals the occurrence of
  cryogenic pellet injection into the plasma. A value of 1 indicates that at least
  one pellet has been launched into the vessel during the relevant time window; 0
  indicates no pellet activity. The flag is set by the pellet injection control system
  or post-shot event detection algorithms that parse fast photodiode or microwave
  cavity signals accompanying pellet ablation. It is used in automated scenario classification,
  disruption databases, and confinement studies to distinguish fueled from gas-puff-only
  phases. The flag does not encode pellet size, velocity, injection angle, or deposition
  depth; those quantities require separate diagnostics.
