  kind: scalar
  status: draft
  description: Vertical Z coordinate of the toroidal magnetic field probe position
    in the right-handed cylindrical (R, phi, Z) frame, giving the probe's height relative
    to the machine midplane.
  documentation: 'The vertical coordinate $Z$ locates a toroidal magnetic field probe
    along the machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $Z$ increases upward from the machine midplane and $R$ is the perpendicular
    distance from that axis.


    Together with the major-radius coordinate [radial_coordinate_of_toroidal_magnetic_field_probe](name:radial_coordinate_of_toroidal_magnetic_field_probe)
    and the azimuthal orientation [toroidal_angle_of_toroidal_magnetic_field_probe](name:toroidal_angle_of_toroidal_magnetic_field_probe),
    this value fully specifies the three-dimensional position of the probe within
    the vacuum vessel. Probe positions are established from engineering drawings and
    verified by in-vessel survey or photogrammetry during installation and maintenance
    campaigns. The analogous vertical coordinate for the poloidal probe is given by
    [vertical_coordinate_of_poloidal_magnetic_field_probe](name:vertical_coordinate_of_poloidal_magnetic_field_probe),
    which follows the same frame convention. Typical values span the vertical extent
    of the vacuum vessel, ranging from approximately $-2$ to $+2$ m in medium-sized
    tokamaks, with symmetric upper and lower probe arrays straddling the midplane.


    Sign convention: Positive when the probe is located above the machine midplane
    in the $+Z$ direction.'
