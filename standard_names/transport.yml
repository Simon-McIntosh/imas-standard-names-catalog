    version: 4.1.0
- name: tendency_of_derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
  kind: scalar
  status: active
  description: Time rate of change of the volume derivative with respect to the dimensionful
    toroidal flux coordinate for a nested magnetic flux surface.
  documentation: 'This quantity is the temporal tendency of the geometric volume metric
    associated with a nested magnetic flux surface. It measures how the enclosed volume
    gained per increment of the dimensionful toroidal flux coordinate changes as the
    surface evolves.


    $$

    \left.\frac{\partial}{\partial t}\right|_{\rho_{\mathrm{tor}}}

    \left(\frac{\partial V(\rho_{\mathrm{tor}},t)}{\partial \rho_{\mathrm{tor}}}\right)

    $$


    where $V(\rho_{\mathrm{tor}},t)$ is the cumulative volume enclosed by the flux
    surface labeled by the dimensionful toroidal flux coordinate $\rho_{\mathrm{tor}}$,
    and $t$ is physical time. The outer derivative is taken at fixed $\rho_{\mathrm{tor}}$.


    The quantity applies to one nested magnetic flux surface and uses the cumulative
    enclosed volume, rather than a local shell volume or an aggregation over multiple
    surfaces. It has no species or particle-population restriction and is not a sum,
    mean, or volume average over plasma populations or flux surfaces.


    It is distinct from the instantaneous metric [derivative with respect to toroidal
    flux coordinate of volume of flux surface](name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface),
    which is the quantity inside the time derivative. It also differs from the corresponding
    derivative with respect to the poloidal magnetic-flux coordinate, [derivative
    with respect to poloidal magnetic flux coordinate of volume of flux surface](name:derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_volume_of_flux_surface).


    The linked toroidal-flux volume derivative supplies the instantaneous geometric
    metric, while this quantity supplies its partial temporal change as the nested
    flux-surface geometry evolves.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
  - name:derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_volume_of_flux_surface
  arguments:
  - name: derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
    operator: tendency
    operator_kind: unary_prefix
  sources:
  - kind: imas-dd
    ref: transport_solver_numerics/solver_1d/d_dvolume_drho_tor_dt
    version: 4.1.0
- name: thermal_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume for the local
    thermal electron population, excluding fast and suprathermal electron contributions.
  documentation: 'Number density of free electrons per physical volume for the local
    thermal electron population is the local continuum count density of electrons
    not bound to atoms, molecules, or ions that belong to the bulk Maxwellian electron
    component.


    For the thermal electron distribution, the defining relation is:


    $$

    n_{e,\mathrm{th}}(\mathbf{x}) = \int f_{e,\mathrm{th}}(\mathbf{x},\mathbf{v})\,d^3\mathbf{v}

    $$


    where $n_{e,\mathrm{th}}(\mathbf{x})$ is the local thermal electron number density,
    $f_{e,\mathrm{th}}(\mathbf{x},\mathbf{v})$ is the thermal-electron velocity distribution,
    $\mathbf{x}$ is position, $\mathbf{v}$ is electron velocity, and $d^3\mathbf{v}$
    is the volume element in velocity space.


    This quantity applies only to the local bulk thermal electron population. Fast
    and suprathermal electrons are excluded, and the quantity is neither a chord average
    nor a volume average. The parent [electron density](name:electron_density) denotes
    the unqualified local free-electron density without this population restriction.


    The complete local [total electron density](name:total_electron_density) is the
    sum of this thermal component and the corresponding [fast electron density](name:fast_electron_density)
    when those components are resolved separately.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:total_electron_density
  - name:fast_electron_density
  arguments:
  - name: electron_density
    operator: thermal
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: core_profiles/profiles_1d/electrons/density_thermal
    version: 4.1.0
  - kind: imas-dd
    ref: edge_profiles/profiles_1d/electrons/density_thermal
    version: 4.1.0
  - kind: imas-dd
