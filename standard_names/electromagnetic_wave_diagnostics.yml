- name: major_radius_of_diagnostic_component_geometric_center
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the geometric center of a diagnostic
    component in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The major-radius coordinate $R$ locates the geometric center of\
    \ a diagnostic component \u2014 such as a reflectometer antenna, UV spectrometer\
    \ detector, or X-ray crystal camera element \u2014 within the machine's right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the distance from the machine\
    \ symmetry axis and $Z$ is the vertical height. This position is required for\
    \ line-of-sight ray tracing, beam path calculations, and solid-angle weighting\
    \ when interpreting emission or scattering signals. Typical values range from\
    \ the plasma minor radius outward to the vacuum vessel wall or port flange, broadly\
    \ 1\u20135 m for medium- to large-scale tokamaks. The companion vertical coordinate\
    \ is captured by the corresponding $Z$ component, and the toroidal placement is\
    \ given by the toroidal angle. For diagnostics where a reference point differs\
    \ from the geometric center, compare [major_radius_of_diagnostic_antenna_reference_point](name:major_radius_of_diagnostic_antenna_reference_point).\
    \ For measurement positions along a beam path inside the plasma, see [major_radius_of_measurement_position](name:major_radius_of_measurement_position)."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:major_radius_of_diagnostic_antenna_reference_point
  - name:major_radius_of_measurement_position
