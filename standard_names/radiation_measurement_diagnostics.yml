- name: first_coordinate_width_of_reflector
  kind: scalar
  status: draft
  description: Full width of a rectangular spectrometer reflector element measured
    as the non-negative span between opposite edges in the local X1 direction. This
    scalar is defined purely by the reflector geometry and is independent of any choice
    of element center or reference origin.
  documentation: 'The quantity $w_{X1}$ is the full edge-to-edge extent of a rectangular
    reflector element along its local first coordinate axis $X1$. It is a non-negative
    scalar representing the total span between the two opposing edges of the reflector
    in the $X1$ direction:


    $$w_{X1} = x_{1,\mathrm{max}} - x_{1,\mathrm{min}} \geq 0$$


    where $x_{1,\mathrm{max}}$ and $x_{1,\mathrm{min}}$ are the maximum and minimum
    $X1$ coordinates of the reflector boundary, respectively. Because $w_{X1}$ is
    a full width, it is strictly non-negative and carries no directional sign: it
    does not depend on the position of the element center or on which edge is taken
    as the reference.


    This quantity applies only when the reflector geometry type is rectangular (geometry_type
    index = 3). For curved or toroidal reflector geometries, the relevant size parameters
    are radii of curvature rather than widths.


    Typical values range from a few millimeters to several tens of millimeters depending
    on the spectrometer design and X-ray crystal optics configuration.


    See also the complementary quantity `second_coordinate_width_of_reflector` ($w_{X2}$),
    which gives the full width in the orthogonal local $X2$ direction, and `first_coordinate_radius_of_curvature_of_reflector`
    for curved reflector geometry.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
