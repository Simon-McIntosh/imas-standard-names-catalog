name: perpendicular_component_of_fast_electron_pressure
status: draft
description: Pressure exerted by the suprathermal electron population in the direction
  perpendicular to the local magnetic field.
documentation: "The perpendicular fast electron pressure $p_{e,\\mathrm{fast},\\perp}$\
  \ is the second velocity-space moment of the non-thermal electron distribution function\
  \ taken in the plane perpendicular to $\\mathbf{B}$: $p_{e,\\mathrm{fast},\\perp}\
  \ = \\int m_e v_\\perp^2 / 2 \\; f_{e,\\mathrm{fast}}(\\mathbf{v})\\,d^3v$, where\
  \ $m_e$ is the electron mass, $v_\\perp$ is the perpendicular velocity component,\
  \ and $f_{e,\\mathrm{fast}}$ is the fast-electron distribution function. Anisotropy\
  \ between $p_{\\perp}$ and $p_{\\parallel}$ arises from preferential perpendicular\
  \ heating (e.g., electron-cyclotron resonance heating) and can drive mirror-type\
  \ and firehose instabilities. In ECRH-heated plasmas, $p_{e,\\mathrm{fast},\\perp}$\
  \ can reach $10^2$\u2013$10^4$ Pa locally, contributing to the equilibrium through\
  \ the anisotropic Grad\u2013Shafranov equation. Measured indirectly via electron\
  \ cyclotron emission (ECE) and hard X-ray bremsstrahlung tomography. The total fast\
  \ electron pressure tensor satisfies $p_{e,\\mathrm{fast}} = (2 p_{e,\\mathrm{fast},\\\
  perp} + p_{e,\\mathrm{fast},\\parallel}) / 3$. See also `electron_density` and `fast_ion_number_density`\
  \ for analogous non-thermal quantities."
