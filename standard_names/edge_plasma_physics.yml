  - id: dd:summary/local/separatrix/n_i/tritium/value
    dd_path: summary/local/separatrix/n_i/tritium/value
    status: composed
- name: xenon_density_at_pedestal
  kind: scalar
  status: draft
  description: Xenon ion number density evaluated at the H-mode pedestal top, where
    the steep-gradient edge transport barrier meets the flatter core pressure profile.
  documentation: 'Xenon impurity ion number density at the pedestal top characterizes
    the local concentration of xenon at the shoulder of the H-mode edge transport
    barrier. As a heavy noble gas with atomic number $Z = 54$, xenon contributes substantially
    to the effective charge $Z_\mathrm{eff}$ and radiative power losses even at trace
    concentrations, making its pedestal value a key diagnostic of impurity accumulation,
    pedestal stability, and impurity transport modeling.


    The pedestal top is the radial location $\rho_\mathrm{ped}$ at which the steep-gradient
    barrier region joins the gentler core density profile. The xenon pedestal density
    $n_\mathrm{Xe,ped}$ is the value of the ion number density profile at that reference
    position:


    $$

    n_\mathrm{Xe,ped} = n_\mathrm{Xe}(\rho_\mathrm{ped})

    $$


    where $\rho_\mathrm{ped}$ is determined from the electron temperature or pressure
    profile pedestal fit, and $n_\mathrm{Xe}$ is the total xenon ion density summed
    over all ionization stages unless individual charge states are specified separately.


    Xenon is introduced into fusion plasmas for controlled radiative seeding to reduce
    divertor heat loads, for ELM suppression, and in disruption mitigation scenarios.
    Pedestal xenon density is typically inferred from charge-exchange recombination
    spectroscopy or soft X-ray emission spectroscopy, with the pedestal location identified
    from Thomson scattering or reflectometry profiles. This quantity is part of the
    [density_at_pedestal](name:density_at_pedestal) family; analogous pedestal densities
    for lighter noble gas seeding species include [neon_density_at_pedestal](name:neon_density_at_pedestal)
    and [argon_density_at_pedestal](name:argon_density_at_pedestal). For xenon density
    at other plasma reference locations see [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary)
    and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis).


    Sign convention: Positive when xenon ions are present at the pedestal top.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
