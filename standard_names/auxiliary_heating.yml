- name: left_hand_circularly_polarized_electric_field
  kind: scalar
  status: active
  description: Left-hand circularly polarized electric field is the complex scalar
    phasor obtained by projecting the electric-field phasor onto the left-hand circular
    polarization basis perpendicular to the local magnetic-field direction. It is
    the component that co-rotates with positive-ion gyromotion.
  documentation: 'The left-hand circularly polarized electric field $E_+$ is the complex
    scalar phasor obtained by projecting an electric-field phasor onto the left-hand
    circular polarization basis perpendicular to the local magnetic-field direction.
    It represents the perpendicular component whose instantaneous electric-field vector
    co-rotates with positive-ion gyromotion about the magnetic field.


    Let $(\hat{e}_1, \hat{e}_2, \hat{b})$ be a local right-handed orthonormal basis
    with $\hat{b}=\mathbf{B}/|\mathbf{B}|$ along the local magnetic-field direction
    and $\hat{e}_1\times\hat{e}_2=\hat{b}$. For complex amplitudes defined by $\mathbf{E}(t)=\Re\{\tilde{\mathbf{E}}\exp(-i\omega
    t)\}$, the left-hand component is


    $$

    E_+ = \frac{\tilde{\mathbf{E}}\cdot\hat{e}_1 + i\,\tilde{\mathbf{E}}\cdot\hat{e}_2}{\sqrt{2}}

    $$


    where $\tilde{\mathbf{E}}$ is the complex electric-field phasor, $i$ is the imaginary
    unit, and $\omega$ is the angular frequency. Only the components perpendicular
    to $\hat{b}$ enter this projection.


    This scalar is the circular-polarization projection of an electric-field phasor,
    not the full vector [electric field](name:electric_field) or the vector [wave
    electric field](name:wave_electric_field). When the phasor is specifically a wave
    field, this is the same local left-hand projection represented by [left-hand circularly
    polarized wave electric field](name:left_hand_circularly_polarized_wave_electric_field);
    the complementary polarization is [right-hand circularly polarized electric field].
    Its modulus and rectangular decompositions are [left-hand circularly polarized
    wave electric field amplitude], [left-hand circularly polarized wave electric
    field real part](name:left_hand_circularly_polarized_wave_electric_field_real_part),
    and [left-hand circularly polarized wave electric field imaginary part](name:left_hand_circularly_polarized_wave_electric_field_imaginary_part).


    Sign convention: Positive when the zero-phase instantaneous perpendicular electric
    field of a pure real $E_+$ phasor points along $+\hat{e}_1$ and subsequently rotates
    toward $-\hat{e}_2$ as time increases in the local right-handed orthonormal basis
    $(\hat{e}_1,\hat{e}_2,\hat{b})$, with $\hat{b}$ along the local magnetic-field
    direction.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:electric_field
  - name:wave_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  arguments:
  - name: electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
  sources:
  - dd_path: waves/coherent_wave/full_wave/e_field/plus/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-full_wave-e_field-plus-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
