name: normalized_perturbed_electrostatic_potential_weight
status: draft
cocos_transformation_type: one_like
description: Fractional amplitude of the perturbed electrostatic potential relative
  to the total perturbed field amplitude in a gyrokinetic eigenmode.
documentation: "In gyrokinetic linear stability calculations, each eigenmode has contributions\
  \ from three perturbed fields: the electrostatic potential $\\delta\\phi$, the parallel\
  \ vector potential $\\delta A_\\parallel$, and the parallel magnetic field $\\delta\
  \ B_\\parallel$. The normalized perturbed electrostatic potential weight is defined\
  \ as $w_{\\phi} = |\\delta\\phi| / (|\\delta\\phi| + |\\delta A_\\parallel| + |\\\
  delta B_\\parallel|)$, where each amplitude is evaluated in normalized (gyro-Bohm)\
  \ units. Values close to unity ($w_\\phi \\gtrsim 0.9$) are characteristic of electrostatic\
  \ modes such as ITG, TEM, and ETG, while lower values indicate significant electromagnetic\
  \ content. In low-$\\beta$ core tokamak plasmas nearly all unstable modes are electrostatic;\
  \ electromagnetic effects become non-negligible for $\\beta \\gtrsim 1\\%$. The\
  \ three weights sum to unity: $w_\\phi + w_{A_\\parallel} + w_{B_\\parallel} = 1$.\
  \ See `perturbed_electrostatic_potential_norm` for the eigenfunction amplitude and\
  \ `normalized_perturbed_parallel_vector_potential_weight` for the shear-Alfv\xE9\
  n fraction."
