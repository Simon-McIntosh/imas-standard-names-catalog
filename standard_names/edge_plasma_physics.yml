- name: toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface average of the toroidal neon-ion bulk velocity on the
    last closed magnetic flux surface, with all ionization states combined by density
    weighting.
  documentation: 'The quantity is the density-weighted mean toroidal bulk velocity
    of neon ions, averaged over the last closed magnetic flux surface at the plasma
    boundary. It includes ionized neon charge states and excludes neutral neon. The
    corresponding unaveraged local quantity is [toroidal neon velocity at the plasma
    boundary](name:toroidal_neon_velocity_at_plasma_boundary).


    For the flux surface labeled by $psi_b$, the defining average is


    $$

    \overline{u}_{\phi,\mathrm{Ne}}(\psi_b)=

    \frac{\displaystyle\oint_{\psi=\psi_b}\left(\frac{\displaystyle\sum_{q=1}^{10}
    n_q\mathbf{u}_q}{\displaystyle\sum_{q=1}^{10} n_q}\cdot\hat{\phi}\right)\frac{dl}{B_p}}

    {\displaystyle\oint_{\psi=\psi_b}\frac{dl}{B_p}}

    $$


    where $q$ is the neon charge state, $n_q$ is its number density, $\mathbf{u}_q$
    is its bulk velocity, $\hat{\phi}$ is the toroidal unit vector, $dl$ is poloidal
    arc length, $B_p$ is poloidal magnetic-field magnitude, and $\psi_b$ is the boundary
    flux label. Components use the right-handed cylindrical $(R,\phi,Z)$ frame with
    basis $(\hat{R},\hat{\phi},\hat{Z})$.


    The density weighting gives the neon-ion fluid velocity rather than an unweighted
    average of charge-state velocities. The deuterium counterpart is [toroidal flux-surface-averaged
    deuterium velocity at the plasma boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary).


    Sign convention: Positive when the density-weighted neon-ion velocity has a component
    in the direction of increasing toroidal angle $\phi$, along $+\hat{\phi}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/velocity_phi/neon/value
