      data_type: FLT_1D
      unit: J
      coordinates:
      - summary/time
    enhanced_context:
      description: Energy content of fast (suprathermal) particles driven by lower
        hybrid (LH) waves, representing the stored energy in the LH-accelerated fast
        electron population. A summary-level global scalar for the LH heating and
        current drive system.
      kind: template
- name: fast_electron_power_at_inside_flux_surface
  kind: scalar
  status: active
  description: Cumulative wave power absorbed by the fast (suprathermal) electron
    population within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Fast electron power at an inside flux surface quantifies the total
    rate at which coherent wave energy is absorbed by the non-thermal fast electron
    population within the plasma volume bounded by a given magnetic flux surface.
    It is the fast-electron contribution to [electron power at an inside flux surface](name:electron_power_at_inside_flux_surface),
    distinct from the bulk thermal-electron contribution [thermal electron power at
    an inside flux surface](name:thermal_electron_power_at_inside_flux_surface).


    The quantity is obtained by integrating the flux-surface-averaged [fast electron
    power density](name:fast_electron_power_density) $p_{\mathrm{fast,e}}$ over the
    enclosed plasma volume:


    $$

    P_{\mathrm{fast,e}}(\rho) = \int_0^\rho p_{\mathrm{fast,e}}(\rho'') \frac{dV}{d\rho''}
    \, d\rho''

    $$


    where $P_{\mathrm{fast,e}}(\rho)$ is the cumulative absorbed power, $\rho$ labels
    the limiting flux surface, $\rho''$ is the integration variable, $p_{\mathrm{fast,e}}$
    is the local fast-electron absorbed power density, and $dV/d\rho''$ is the differential
    enclosed volume per unit flux-surface label. Only absorption by fast electrons
    is included; thermal-electron and ion absorption, launched power, and power absorbed
    outside the enclosed volume are excluded. At the outermost closed flux surface,
    the quantity gives the total wave power absorbed by fast electrons.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_power_at_inside_flux_surface
  - name:fast_electron_power_density
  sources:
  - dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_fast
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-electrons-power_inside_fast
    dd_documentation:
      leaf: Absorbed wave power on thermal species inside a flux surface (cumulative
        volume integral of the absorbed power density)
      parent_path: waves/coherent_wave/profiles_1d/electrons
