- name: vacuum_poloidal_current_function
  kind: scalar
  status: active
  description: Signed major-radius-weighted toroidal magnetic field produced by external
    coils in an axisymmetric current-free vacuum region.
  documentation: 'The vacuum poloidal current function is the major-radius-weighted
    toroidal magnetic-field component generated by external coils in an axisymmetric
    current-free region.


    The defining relation is:


    $$

    F_{\mathrm{vac}}(R,Z) = R B_{\phi,\mathrm{vac}}(R,Z)

    $$


    where $F_{\mathrm{vac}}$ is the vacuum poloidal current function, $R$ is major
    radius, $Z$ is vertical height, and $B_{\phi,\mathrm{vac}}$ is the toroidal component
    of the vacuum magnetic field in the right-handed cylindrical $(R,\phi,Z)$ frame;
    $\phi$ is the toroidal angle. At a specified reference major radius, the same
    invariant is represented as $F_{\mathrm{vac}}=R_0B_0$, where $R_0$ is the reference
    major radius and $B_0$ is the vacuum toroidal magnetic field there.


    This quantity applies to the combined external-coil contribution in the axisymmetric
    current-free vacuum region. It excludes plasma-current and other non-external-current
    contributions, is not the total toroidal magnetic field, and is not a per-coil
    value or a flux-surface average.


    It is the vacuum specialization of the [poloidal current function](name:poloidal_current_function),
    which uses the same major-radius-weighted toroidal-field relation for the relevant
    equilibrium field. The [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field)
    is the unweighted toroidal component, while the [difference of vacuum poloidal
    current function and initial vacuum poloidal current function](name:difference_of_vacuum_poloidal_current_function_and_initial_vacuum_poloidal_current_function)
    gives its signed change from an initial reference value.


    Sign convention: Positive when $B_{\phi,\mathrm{vac}}$ points in the direction
    of increasing toroidal angle $\phi$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:poloidal_current_function
  - name:toroidal_vacuum_magnetic_field
  - name:difference_of_vacuum_poloidal_current_function_and_initial_vacuum_poloidal_current_function
  arguments:
  - name: poloidal_current_function
    operator: vacuum
    operator_kind: qualifier
  sources:
  - dd_path: tf/b_field_phi_vacuum_r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-b_field_phi_vacuum_r
    dd_documentation:
      leaf: Vacuum field times major radius in the toroidal field magnet. Positive
        sign means anti-clockwise when viewed from above
      data_type: STRUCTURE
      unit: T.m
    enhanced_context:
      description: "Vacuum toroidal field product (B0\xB7R0), the product of the vacuum\
        \ toroidal magnetic field and the reference major radius. This structure groups\
        \ the time-dependent B0\xB7R0 quantity used as the primary normalization reference\
        \ across plasma physics IDSs."
      kind: llm
- name: difference_of_vacuum_poloidal_current_function_and_initial_vacuum_poloidal_current_function
  kind: scalar
  status: active
  description: Signed change in the combined external-coil vacuum poloidal current
    function relative to its initial reference value, representing variation of the
    toroidal field multiplied by major radius.
  documentation: 'The quantity is the signed difference between the present and initial
    values of the vacuum poloidal current function produced by external coil currents.
    It represents the change in the major-radius-weighted toroidal magnetic field
    in the axisymmetric current-free vacuum region.


    Let $F_{\rm vac}$ denote the [vacuum poloidal current function](name:vacuum_poloidal_current_function).
    Its change relative to the initial reference state is


    $$

    \Delta F_{\rm vac}=F_{\rm vac}-F_{\rm vac,initial}=R B_{\phi,\rm vac}-R B_{\phi,\rm
    vac,initial}

    $$


    where $\Delta F_{\rm vac}$ is the signed change, $F_{\rm vac}$ is the present
    external-coil vacuum poloidal current function, $F_{\rm vac,initial}$ is its value
    in the initial reference state, $R$ is major radius, and $B_{\phi,\rm vac}$ is
    the vacuum toroidal magnetic-field component in the right-handed cylindrical $(R,\phi,Z)$
    frame. Here $\phi$ is toroidal angle and $Z$ is vertical height.


    The quantity uses the combined vacuum contribution from external coil currents
    and excludes plasma currents and induced currents in conducting structures. It
    is a difference from one initial reference value, not the absolute [vacuum poloidal
    current function](name:vacuum_poloidal_current_function); within an axisymmetric
    current-free region, it inherits the parent function''s spatial constancy.


    Sign convention: Positive when the present value of $R B_{\phi,\rm vac}$ exceeds
    its initial reference value, with $B_{\phi,\rm vac}$ positive in the direction
    of increasing toroidal angle $\phi$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:vacuum_poloidal_current_function
  arguments:
  - name: vacuum_poloidal_current_function
    operator: difference
    operator_kind: binary
    role: a
    separator: and
  sources:
  - dd_path: tf/delta_b_field_phi_vacuum_r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-delta_b_field_phi_vacuum_r
    dd_documentation:
      leaf: Variation of (vacuum field times major radius in the toroidal field magnet)
        from the start of the plasma.
      data_type: STRUCTURE
      unit: T.m
    enhanced_context:
      description: "Change in the vacuum toroidal field product (\u0394(B\u2080\xB7\
        R\u2080)) from the start of plasma, measuring the variation of vacuum field\
        \ times major radius over the discharge in the TF magnet system."
      kind: llm
