- name: radius_of_plasma_filament
  kind: scalar
  status: active
  description: Radius of a plasma filament is the geometric radius of a circular boundary
    of the annular cross-section representing a current-carrying plasma filament.
    In the hollow-disk geometry it denotes either the inner or outer boundary radius.
  documentation: 'Radius of a plasma filament is the geometric radius of a circular
    boundary of the annular cross-section representing a current-carrying plasma filament.
    The cross-section is a hollow disk bounded by concentric inner and outer circular
    boundaries, so this generic quantity denotes either boundary radius when the boundary
    is not otherwise specified.


    For a circular boundary in the poloidal cross-section of the right-handed cylindrical
    $(R, \phi, Z)$ frame, the radius $a$ is the distance from the filament cross-section
    center $(R_c, Z_c)$ to any point $(R, Z)$ on that boundary:


    $$

    a = \sqrt{(R - R_c)^2 + (Z - Z_c)^2}

    $$


    where $R$ is major radius, $Z$ is vertical height, and $(R_c, Z_c)$ is the center
    of the annular cross-section.


    An annular plasma filament has an [inner radius](name:inner_radius_of_plasma_filament)
    and an [outer radius](name:outer_radius_of_plasma_filament), with $0 \le a_\mathrm{inner}
    \le a_\mathrm{outer}$; the current-carrying cross-section occupies the region
    between those two circular boundaries. This quantity excludes the curvature radius
    of a noncircular contour segment and the major radius of a filament centerline
    about the toroidal symmetry axis.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_plasma_filament
  - name:outer_radius_of_plasma_filament
  sources:
  - dd_path: pf_plasma/element/geometry/arcs_of_circle/curvature_radii
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_plasma.html#pf_plasma-element-geometry-arcs_of_circle-curvature_radii
    dd_documentation:
      leaf: Curvature radius of each arc of circle
      parent_path: pf_plasma/element/geometry/arcs_of_circle
      parent: Description of the element contour by a set of arcs of circle. For each
        of these, the position of the start point is given together with the curvature
        radius. The end point is given by the start point of the next arc of circle.
      data_type: FLT_1D
      unit: m
      coordinates:
      - pf_plasma/element/geometry/arcs_of_circle/r
    enhanced_context:
      description: Curvature radius of each arc of circle segment describing the cross-sectional
        contour of a plasma current filament element. Part of the piecewise arc-of-circle
        geometry representation used in electromagnetic circuit calculations.
      kind: llm
- name: inner_radius_of_plasma_filament
  kind: scalar
  status: active
  description: Inner radius of the annular cross-section of a plasma current-carrying
    filament element, marking the boundary between the hollow central region and the
    conducting annular zone.
  documentation: 'The inner radius $r_\mathrm{inner}$ specifies the radial position
    of the inner wall of an annular plasma filament cross-section, defining the boundary
    between the hollow (non-current-carrying) core and the conducting annular region.
    In filamentary models of distributed plasma current, individual elements may be
    assigned annular geometries bounded at the outer wall by [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)
    $r_\mathrm{outer}$, with current flowing only in the region $r_\mathrm{inner}
    \leq r \leq r_\mathrm{outer}$.


    The conducting cross-sectional area of the annular element is:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $A$ is the geometric cross-sectional area corresponding to area_of_plasma_filament.
    A valid annular geometry requires $0 \leq r_\mathrm{inner} < r_\mathrm{outer}$;
    setting $r_\mathrm{inner} = 0$ recovers a solid circular cross-section with no
    hollow core.


    This parameter is a geometric input to the filamentary discretization of the plasma
    current distribution and is always specified alongside [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament).
    For rectangular filament cross-sections the analogous spatial parameters are [height_of_plasma_filament](name:height_of_plasma_filament)
    and width_of_plasma_filament.


    Sign convention: Positive when the inner boundary of the annular cross-section
    is measured outward from the local geometric center of the filament element.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_radius_of_plasma_filament
  - name:height_of_plasma_filament
  arguments:
  - name: radius_of_plasma_filament
    operator: inner
    operator_kind: qualifier
  sources:
  - dd_path: pf_plasma/element/geometry/annulus/radius_inner
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_plasma.html#pf_plasma-element-geometry-annulus-radius_inner
    dd_documentation:
      leaf: Inner radius
      parent_path: pf_plasma/element/geometry/annulus
      parent: The element is an annulus of centre R, Z, with inner radius radius_inner
        and outer radius radius_outer
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Inner radius of an annular cross-section element representing a
        discrete plasma current-carrying filament in the pf_plasma IDS. Defines the
        inner boundary of the annulus in axisymmetric plasma current distribution
        modelling.
      kind: llm
- name: outer_radius_of_plasma_filament
  kind: scalar
  status: active
  description: Outer radius of the annular cross-section of a discrete plasma current-carrying
    filament element, marking the external radial boundary of the hollow-disk geometry.
  documentation: 'The outer radius defines the external boundary of an annular cross-section
    when a plasma current filament element is represented as a hollow cylinder. Together
    with [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),
    it fully characterizes the annular geometry, which contrasts with the rectangular
    cross-section model parametrized by [height_of_plasma_filament](name:height_of_plasma_filament)
    and width_of_plasma_filament.


    For an annular cross-section, the cross-sectional area relates to both radii by:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $r_\mathrm{outer}$ is this outer radius, $r_\mathrm{inner}$ is the inner
    radius, and $A$ is the area_of_plasma_filament.


    The outer radius is specified as input geometry when constructing discrete filamentary
    representations of plasma current distributions used in equilibrium reconstruction
    and mutual-inductance computations. The constraint $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$ must be satisfied to define a valid non-degenerate annular region.


    Sign convention: Positive when measured as a radial distance from the cross-section
    center to the outer boundary, satisfying $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_plasma_filament
  - name:height_of_plasma_filament
  arguments:
  - name: radius_of_plasma_filament
    operator: outer
    operator_kind: qualifier
  sources:
  - dd_path: pf_plasma/element/geometry/annulus/radius_outer
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_plasma.html#pf_plasma-element-geometry-annulus-radius_outer
    dd_documentation:
      leaf: Outer radius
      parent_path: pf_plasma/element/geometry/annulus
      parent: The element is an annulus of centre R, Z, with inner radius radius_inner
        and outer radius radius_outer
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Outer radius of an annular cross-section of a discrete plasma current-carrying
        filament element in the pf_plasma representation. Defines the radial outer
        boundary of the annulus describing the element's cross-sectional geometry.
      kind: llm
- name: reference_major_radius
  kind: scalar
  status: active
  description: "Perpendicular distance from the machine's toroidal symmetry axis to\
    \ the fixed reference point at which the toroidal vacuum magnetic field is specified,\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame. It serves as the geometric\
    \ normalization radius paired with the reference toroidal field value."
  documentation: 'The reference major radius $R_0$ is the perpendicular distance from
    the machine''s toroidal symmetry axis to the fixed reference point at which the
    toroidal vacuum magnetic field is specified, measured in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$ and $Z$ is the vertical height. It specializes
    [major_radius](name:major_radius) to a single fixed reference locus and acts as
    the geometric normalization radius of the axisymmetric vacuum toroidal field.


    Together with the signed [toroidal reference magnetic field](name:toroidal_reference_magnetic_field)
    $B_{\phi,\mathrm{ref}}$, it fixes the amplitude of the current-free toroidal field,
    which varies inversely with the independent major-radius coordinate:


    $$

    B_{\phi,\mathrm{vac}}(R) = B_{\phi,\mathrm{ref}}\,\frac{R_0}{R}

    $$


    where $R$ is the independent major-radius coordinate in meters, $R_0$ is the reference
    major radius in meters, $B_{\phi,\mathrm{vac}}(R)$ is the signed toroidal vacuum
    field component at $R$, and $B_{\phi,\mathrm{ref}}$ is the signed reference value
    at $R_0$. The ordered pair $(R_0, B_{\phi,\mathrm{ref}})$ must be used consistently,
    since only their product-scaled ratio has physical meaning.


    The reference point is a fixed geometric convention of the device (commonly the
    geometric center of the vacuum vessel), independent of the plasma state. It is
    therefore distinct from the magnetic axis, the plasma geometric axis, and the
    plasma boundary, and it is not a flux-surface quantity such as the [flux-surface-averaged
    major radius](name:flux_surface_averaged_major_radius). It is likewise not a position-specific
    $R$ value such as the [radial coordinate of a measurement position](name:radial_coordinate_of_measurement_position),
    and it carries no magnetic-field sign, which resides entirely in $B_{\phi,\mathrm{ref}}$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius
  - name:toroidal_reference_magnetic_field
  arguments:
  - name: major_radius
    operator: reference
    operator_kind: qualifier
  sources:
