- name: iron_density_at_limiter
  kind: scalar
  status: active
  description: Iron ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all ionization stages and excluding
    neutral iron atoms.
  documentation: 'Iron density at a limiter is the local number density of iron ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, consistent with the parent [density_at_limiter](name:density_at_limiter).
    Unless a single ionization stage is specified in context, this quantity is summed
    over all iron charge states from Fe$^{1+}$ to Fe$^{26+}$, excluding neutral iron
    atoms.


    The total iron ion number density at the limiter is defined as:


    $$

    n_{\mathrm{Fe}} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}

    $$


    where $n_{\mathrm{Fe}^{z+}}$ is the local number density of iron in charge state
    $z$.


    Iron enters the edge plasma primarily through physical sputtering of metallic
    plasma-facing components by energetic ions and charge-exchange neutrals impacting
    the limiter surface. At the limiter, where open scrape-off-layer field lines terminate
    on the material boundary, sputtered iron atoms are ionized within a thin ionization
    front and become subject to parallel and cross-field impurity transport. The local
    iron ion density at the limiter characterizes the impurity source strength at
    this plasma-wall interface and serves as a boundary condition for edge impurity
    transport modeling. It connects to [iron_density_at_plasma_boundary](name:iron_density_at_plasma_boundary)
    and [iron_density_at_divertor_target](name:iron_density_at_divertor_target), which
    describe the same impurity density evaluated at different plasma-facing surfaces.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:iron_density_at_plasma_boundary
  - name:iron_density_at_divertor_target
  arguments:
  - name: density_at_limiter
    operator: iron
    operator_kind: qualifier
