- name: wavelength_of_spectral_line
  kind: scalar
  status: draft
  description: Central rest-frame vacuum wavelength of an atomic, ionic, molecular,
    or nuclear spectral emission or absorption line. It is set by the transition energy
    between quantum states and identifies the unshifted physical line.
  documentation: 'Wavelength of a spectral line is the central vacuum wavelength $\lambda_0$
    of the photon associated with a transition between two quantum states, evaluated
    in the rest frame of the emitting or absorbing species. It is a property of the
    transition itself, separate from observed wavelength shifts, broadening, field-induced
    splitting, and instrumental response.


    The rest wavelength is set by the transition energy:


    $$

    \lambda_0 = \frac{h c}{|E_u - E_l|}

    $$


    where $\lambda_0$ is the vacuum wavelength in meters, $h$ is the Planck constant
    in joule seconds, $c$ is the speed of light in meters per second, and $E_u$ and
    $E_l$ are the upper- and lower-state energies in joules.


    In spectroscopy, $\lambda_0$ is usually taken from evaluated atomic, molecular,
    or nuclear transition data, or from fitted line centers after wavelength calibration
    and correction to vacuum wavelength. For an observed line center $\lambda_{\mathrm{obs}}$
    in meters, the non-relativistic Doppler relation is $(\lambda_{\mathrm{obs}}-\lambda_0)/\lambda_0
    \approx v_{\mathrm{los}}/c$ for $|v_{\mathrm{los}}| \ll c$, where $v_{\mathrm{los}}$
    is in meters per second and is positive when the source recedes from the observer,
    increasing the observed wavelength. Thermal Doppler Gaussian width scales as $\sigma_\lambda/\lambda_0
    \approx \sqrt{k_B T_s/(m_s c^2)}$, where $\sigma_\lambda$ is in meters, $T_s$
    is the species temperature in kelvin, and $m_s$ is the particle mass in kilograms;
    equivalently use $\sqrt{T_s/(m_s c^2)}$ when $T_s$ is expressed as an energy.


    The quantity is not limited to a particular spectral band. Lines used in plasma
    spectroscopy commonly span about $1\times10^{-11}$-$1\times10^{-5}$ m, including
    soft-x-ray lines near $1\times10^{-10}$-$1\times10^{-9}$ m, extreme-ultraviolet
    and ultraviolet lines near $1\times10^{-8}$-$4\times10^{-7}$ m, visible lines
    near $4\times10^{-7}$-$7\times10^{-7}$ m, and near-infrared lines near $7\times10^{-7}$-$1\times10^{-5}$
    m; other atomic, molecular, or nuclear transitions can lie outside these ranges.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
