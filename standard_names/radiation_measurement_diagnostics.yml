- name: vertical_coordinate_of_camera
  kind: scalar
  status: active
  description: "Signed vertical position of a camera\u2019s geometric center along\
    \ Z in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the signed vertical coordinate of a camera\u2019\
    s geometric center in the right-handed cylindrical $(R,\\phi,Z)$ frame. It specifies\
    \ the camera\u2019s position rather than its viewing direction or detector orientation.\n\
    \nThe coordinate is the projection of the camera-center position vector onto the\
    \ vertical basis direction:\n\n$$\nZ_{\\mathrm{cam}} = \\mathbf{r}_{\\mathrm{cam}}\
    \ \\cdot \\hat{\\mathbf{Z}}\n$$\n\nwhere $Z_{\\mathrm{cam}}$ is the camera-center\
    \ vertical coordinate, $\\mathbf{r}_{\\mathrm{cam}}$ is the position vector of\
    \ the camera\u2019s geometric center, and $\\hat{\\mathbf{Z}}$ is the vertical\
    \ unit vector. The frame is right-handed with basis $(\\hat{R},\\hat{\\phi},\\\
    hat{Z})$, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical\
    \ height.\n\nThe scope is restricted to the geometric center of the camera as\
    \ a whole and represents one positional coordinate, with no averaging over pixels,\
    \ channels, viewing rays, or detector surfaces. It is distinct from [vertical\
    \ coordinate of an aperture](name:vertical_coordinate_of_aperture), which refers\
    \ to a different diagnostic object.\n\nTogether with the [radial coordinate of\
    \ the camera](name:radial_coordinate_of_camera), this quantity gives the camera\
    \ center\u2019s radial and vertical positional components in the cylindrical frame;\
    \ it does not describe camera orientation or angular imaging coverage."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_camera
  sources:
  - dd_path: camera_x_rays/camera/centre/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-camera-centre-z
    dd_documentation:
      leaf: Height
      parent_path: camera_x_rays/camera/centre
      parent: Position of the camera centre
      data_type: FLT_0D
      unit: m
      lifecycle_status: alpha
    enhanced_context:
      description: Vertical (Z) coordinate of centre.
      kind: template
- name: normalized_toroidal_flux_coordinate_of_line_of_sight
  kind: scalar
  status: active
  description: Signed normalized toroidal-flux label at the line-of-sight point closest
    to the magnetic axis, positive above and negative below the axis.
  documentation: 'This quantity is the normalized toroidal flux label assigned to
    the point on a line of sight that approaches the magnetic axis most closely. Its
    sign records whether that closest point lies above or below the magnetic axis.


    The signed closest-approach value is defined by


    $$

    \rho_{\mathrm{LOS}} = \operatorname{sgn}(Z_* - Z_{\mathrm{axis}})\,\rho_{\mathrm{tor,norm}}(\mathbf{x}_*),

    \qquad

    \mathbf{x}_* = \underset{\mathbf{x}\in\mathrm{LOS}}{\operatorname{arg\,min}}\,\rho_{\mathrm{tor,norm}}(\mathbf{x})

    $$


    where $\rho_{\mathrm{LOS}}$ is this signed line-of-sight value, $\rho_{\mathrm{tor,norm}}$
    is the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    $\mathbf{x}$ is a point on the line of sight, $\mathbf{x}_*$ is the closest-approach
    point, and $\mathrm{LOS}$ denotes the line of sight. The function $\operatorname{sgn}$
    supplies the sign of its argument; $Z_*$ is the vertical coordinate of the closest-approach
    point and $Z_{\mathrm{axis}}$ is the vertical coordinate of the magnetic axis.
    Here $R$, $\phi$, and $Z$ are the major-radius, toroidal-angle, and vertical coordinates
    in the right-handed cylindrical $(R,\phi,Z)$ frame.


    The quantity applies to one line of sight and uses only the selected closest-approach
    point; it is not a line average, line integral, flux-surface average, or volume
    aggregate. Unlike [normalized toroidal flux coordinate of measurement position](name:normalized_toroidal_flux_coordinate_of_measurement_position),
    it does not describe the coordinate at an arbitrary single measurement point.


    It is obtained from the parent [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    by evaluating that magnetic-surface label at the closest-approach point and appending
    the above/below-axis sign. The underlying unsigned label increases outward from
    the magnetic axis toward the equilibrium boundary.


    Sign convention: Positive when the closest point on the line of sight lies above
    the magnetic axis, meaning $Z_* > Z_{\mathrm{axis}}$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_of_measurement_position
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: line_of_sight
    operator_kind: locus
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/profiles_line_integrated/lines_of_sight_rho_tor_norm
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-profiles_line_integrated-lines_of_sight_rho_tor_norm
    dd_documentation:
      leaf: 'Shortest distance in rho_tor_norm between lines of sight and magnetic
        axis, signed with following convention : positive (resp. negative) means the
        point of shortest distance is above (resp. below) the magnetic axis'
      parent_path: spectrometer_x_ray_crystal/channel/profiles_line_integrated
      parent: Profiles proxies are given in the vertical direction of the detector.
        They are estimated directly from the camera, without tomographic inversion.
        Binning is allowed so the number of profile points may be lower than the length
        of z_frames. Physical quantities deduced from the measured spectra are given
        for each profile point. They correspond to the spectra integrated along lines
        of sight, defined by a first point given by the centre of the crystal and
        a second point (depending on the profile point) described below.
      data_type: STRUCTURE
      unit: '1'
    enhanced_context:
      description: "Closest approach in normalised toroidal flux coordinate (\u03C1\
        _tor_norm) between each line of sight of the crystal X-ray spectrometer and\
        \ the magnetic axis, with sign indicating position above (positive) or below\
        \ (negative) the axis."
      kind: llm
- name: radial_coordinate_of_camera
  kind: scalar
  status: active
  description: "Major-radius location of a camera\u2019s geometric center, measured\
    \ from the toroidal symmetry axis in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The radial coordinate of a camera is the major-radius position of
    its geometric center, measured perpendicular to the toroidal symmetry axis. It
    identifies the camera center rather than any individual detector pixel, aperture,
    or line-of-sight point.


    The coordinate is defined from the Cartesian coordinates of the camera center:


    $$

    R_{\mathrm{cam}} = \sqrt{x_{\mathrm{cam}}^2 + y_{\mathrm{cam}}^2}

    $$


    where $R_{\mathrm{cam}}$ is the camera-center radial coordinate, and $x_{\mathrm{cam}}$
    and $y_{\mathrm{cam}}$ are the camera-center coordinates in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis. The corresponding cylindrical frame is the
    right-handed $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    This quantity applies to the geometric center of the camera as a whole and is
    not an average over pixels, viewing directions, or detector elements. It is the
    camera-specific specialization of the parent [radial coordinate](name:radial_coordinate).
    Together with the [vertical coordinate of the camera](name:vertical_coordinate_of_camera)
    and [toroidal coordinate of the camera](name:toroidal_coordinate_of_camera), it
    specifies the camera-center position.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_camera
  - name:toroidal_coordinate_of_camera
  sources:
  - dd_path: camera_x_rays/camera/centre/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-camera-centre-r
    dd_documentation:
      leaf: Major radius
      parent_path: camera_x_rays/camera/centre
      parent: Position of the camera centre
      data_type: FLT_0D
      unit: m
      lifecycle_status: alpha
    enhanced_context:
      description: Major radius (R) coordinate of centre.
      kind: template
- name: radial_coordinate_of_diagnostic_aperture
  kind: scalar
  status: active
  description: "Major-radius coordinate of the geometric center of a diagnostic aperture,\
    \ locating it from the toroidal symmetry axis in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is the major-radius coordinate of the geometric center
    of a diagnostic aperture, locating that center relative to the toroidal symmetry
    axis.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, its defining relation is:


    $$

    R_{\rm ap} = \sqrt{x_{\rm ap}^{\,2}+y_{\rm ap}^{\,2}}

    $$


    where $R_{\rm ap}$ is the aperture-center major radius, and $x_{\rm ap}$ and $y_{\rm
    ap}$ are the horizontal Cartesian coordinates of that center in the right-handed
    Cartesian $(x,y,z)$ frame, with $z$ aligned with the vertical coordinate $Z$.


    This quantity applies specifically to the geometric center of the diagnostic aperture.
    For a circular aperture, the center is the circle center; for a planar aperture,
    it is the origin of the local aperture coordinates within the aperture area. It
    is not an area average, radial extent, or coordinate of the radiation path.


    This is the aperture-specific realization of the [radial coordinate](name:radial_coordinate).
    Together with the [vertical coordinate of the diagnostic aperture](name:vertical_coordinate_of_diagnostic_aperture),
    it locates the aperture center in the poloidal plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame; the toroidal coordinate is not represented by this quantity.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: camera_visible/channel/aperture/centre/r
    dd_version: 4.1.0
