- name: normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: active
  description: Dimensionless toroidal-flux coordinate locating the nested plasma surface
    where the safety-factor magnitude is globally minimized.
  documentation: "The normalized toroidal flux coordinate at the minimum-safety-factor\
    \ surface is the value of a radial magnetic-surface label on the nested surface\
    \ that globally minimizes the safety-factor magnitude within the confined plasma.\
    \ It identifies the location of the minimum-\x7Fq\x7F surface, not the minimum\
    \ safety-factor value itself.\n\nThe underlying normalized toroidal flux coordinate\
    \ is defined by\n\n$$\n\\rho_{\\mathrm{tor,N}} = \\sqrt{\\frac{\\Phi_{\\mathrm{tor}}}{\\\
    Phi_{\\mathrm{tor,b}}}}\n$$\n\nwhere $\\rho_{\\mathrm{tor,N}}$ is the normalized\
    \ toroidal flux coordinate, $\\Phi_{\\mathrm{tor}}$ is the toroidal magnetic flux\
    \ enclosed by a given nested flux surface, and $\\Phi_{\\mathrm{tor,b}}$ is the\
    \ toroidal magnetic flux enclosed by the plasma boundary.\n\nThis quantity applies\
    \ to the single closed flux surface within the confined plasma at which the magnitude\
    \ of the safety factor $q$ is globally minimized, where $q$ is the field-line\
    \ winding ratio assigned to each flux surface. The coordinate is zero at the magnetic\
    \ axis and one at the plasma boundary; it is an evaluated surface label, not a\
    \ flux-surface average or an aggregation over multiple surfaces. It excludes the\
    \ signed minimum value of $q$ and does not identify a surface by poloidal magnetic\
    \ flux.\n\nIt is the locus-specific counterpart of the general [normalized toroidal\
    \ flux coordinate](name:normalized_toroidal_flux_coordinate), obtained by evaluating\
    \ that coordinate on the minimum-$|q|$ surface. The same surface expressed with\
    \ a poloidal-flux label is given by [normalized poloidal flux coordinate at minimum\
    \ safety factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: minimum_safety_factor
    operator_kind: locus
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/rho_tor_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-rho_tor_norm
    dd_documentation:
      leaf: Minimum q position in normalised toroidal flux coordinate
      parent_path: equilibrium/time_slice/global_quantities/q_min
      parent: Minimum q value and position
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Normalised toroidal flux coordinate (\u03C1_tor_norm) at the radial\
        \ location of the minimum safety factor (q_min). Locates the q_min surface\
