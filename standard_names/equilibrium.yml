      parent: Minimum q value and position
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Normalised toroidal flux coordinate (\u03C1_tor_norm) at the radial\
        \ location of the minimum safety factor (q_min). Locates the q_min surface\
        \ within the plasma cross-section for MHD stability assessment."
      kind: llm
- name: outer_squareness_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless Luce shape coefficient for the outboard corners of nested
    magnetic flux surfaces, measuring signed departure from a co-centered reference
    ellipse across upper and lower quadrants.
  documentation: 'The outer squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how much the outboard (larger major
    radius) corners of a nested toroidal magnetic flux surface depart from a reference
    ellipse sharing the same center, horizontal half-width, and [elongation](name:elongation_of_flux_surface).
    It is the outboard counterpart within the [squareness_of_flux_surface](name:squareness_of_flux_surface)
    family, complementing the [inner squareness](name:inner_squareness_of_flux_surface),
    and abstracts over the quadrant-resolved coefficients [upper outer squareness](name:upper_outer_squareness_of_flux_surface)
    and [lower outer squareness](name:lower_outer_squareness_of_flux_surface).


    At the modeled outboard corners, the reference condition is


    $$

    \zeta_{\rm out}=0 \Longleftrightarrow \mathcal{C}_{\rm out}=\mathcal{E}_{\rm out}

    $$


    where $\zeta_{\rm out}$ is the outer squareness coefficient, $\mathcal{C}_{\rm
    out}$ is the modeled outboard corner of the flux-surface cross-section, and $\mathcal{E}_{\rm
    out}$ is the corresponding reference ellipse. The cross-section is described in
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    This quantity does not select either the upper or lower outboard quadrant; those
    quadrant-specific coefficients may differ for an up-down asymmetric flux surface.
    Positive values describe boxier outward corners, while negative values describe
    corners indented relative to the reference ellipse.


    Sign convention: Positive when the modeled outboard corner extends toward increasing
    $R$ beyond the corresponding reference ellipse in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:inner_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_outer
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-squareness_upper_outer
    dd_documentation:
      leaf: Upper outer squareness (definition from T. Luce, Plasma Phys. Control.
        Fusion 55 (2013) 095009)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
      lifecycle_status: alpha
      lifecycle_version: 3.18.0
    enhanced_context:
      description: "Upper outer squareness (\u03B6_uo) of plasma flux surfaces as\
        \ a 1D radial profile, following the definition of T. Luce (PPCF 55, 095009,\
        \ 2013). Quantifies the deviation of the upper outer quadrant of the plasma\
        \ boundary from a reference ellipse."
      kind: llm
- name: lower_outer_squareness_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless Luce shape coefficient for the lower outboard quadrant
    of nested magnetic flux surfaces, measuring signed departure from a reference
    ellipse with the same center, horizontal half-width, and elongation.
  documentation: 'The lower outer squareness $\zeta_{\rm lo}$ is the dimensionless
    Luce (2013) shape coefficient for the lower outboard ($-Z$, larger-$R$) corner
    of each nested magnetic flux surface, measuring its departure from a reference
    ellipse sharing the same center, horizontal half-width, and elongation.


    At the modeled lower outboard corner, the reference condition is


    $$

    \zeta_{\rm lo}=0 \Longleftrightarrow \mathcal{C}_{\rm lo}=\mathcal{E}_{\rm lo}

    $$


    where $\zeta_{\rm lo}$ is the lower outer squareness coefficient, $\mathcal{C}_{\rm
    lo}$ is the modeled lower outboard corner, and $\mathcal{E}_{\rm lo}$ is the corresponding
    reference ellipse. The cross-section is described in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    This coefficient selects the lower outboard quadrant and is the lower component
    of [outer squareness](name:outer_squareness_of_flux_surface), complementing [upper
    outer squareness](name:upper_outer_squareness_of_flux_surface). Up-down asymmetry
    allows the two quadrant-specific coefficients to differ; positive values describe
    boxier outward corners, while negative values describe corners indented relative
    to the reference ellipse.


    Sign convention: Positive when the modeled lower outboard corner extends toward
    increasing $R$ beyond the corresponding reference ellipse in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  arguments:
  - name: outer_squareness_of_flux_surface
    operator: lower
