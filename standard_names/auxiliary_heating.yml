- name: per_toroidal_mode_fast_electron_absorbed_power
  kind: scalar
  status: draft
  description: Wave power absorbed by fast electrons, resolved per toroidal Fourier
    mode number.
  documentation: This quantity represents the wave power absorbed by the fast (suprathermal)
    electron population, decomposed into components per toroidal Fourier mode number
    $n_\phi$. It is a key metric for determining the efficiency of radio-frequency
    (RF) heating and current drive schemes, such as electron cyclotron (EC) and lower
    hybrid (LH) systems, in which the wave power is selectively absorbed by resonating
    fast electrons. The power per mode $P_{n_\phi}$ satisfies $P = \sum_{n_\phi} P_{n_\phi}$,
    where $P$ is the total wave power absorbed. For typical RF heating scenarios,
    the spectrum may be peaked at a single toroidal mode number corresponding to the
    antenna phasing, with values ranging from kilowatts to megawatts. The modal decomposition
    is derived from full-wave or ray-tracing codes, and is used to understand the
    spatial localization and damping of the wave. See also [per_toroidal_mode_thermal_electron_absorbed_power](name:per_toroidal_mode_thermal_electron_absorbed_power)
    for the thermal population and [per_toroidal_mode_fast_ion_absorbed_power](name:per_toroidal_mode_fast_ion_absorbed_power)
    for fast ions. The related quantity [fast_electron_absorbed_power_at_inside_flux_surface](name:fast_electron_absorbed_power_at_inside_flux_surface)
    provides the cumulative power inside a flux surface, while [per_toroidal_mode_fast_electron_power_density](name:per_toroidal_mode_fast_electron_power_density)
    gives the volume-specific density.
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_electron_absorbed_power
  - name:per_toroidal_mode_fast_ion_absorbed_power
  - name:fast_electron_absorbed_power_at_inside_flux_surface
  - name:per_toroidal_mode_fast_electron_power_density
