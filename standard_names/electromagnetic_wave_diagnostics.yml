- name: plasma_frequency_at_measurement_position
  kind: scalar
  status: active
  description: Local electron plasma frequency at the measurement position, set by
    free-electron number density and defining the ordinary-mode electromagnetic cutoff.
  documentation: 'The electron plasma frequency is the natural electrostatic oscillation
    frequency of the local free-electron population at the measurement position. It
    is a plasma property, not the carrier frequency of a diagnostic source.


    For the cold-electron response, the frequency is defined by


    $$

    f_{pe} = \frac{1}{2\pi}\sqrt{\frac{n_e e^2}{\varepsilon_0 m_e}}

    $$


    where $f_{pe}$ is the electron plasma frequency, $n_e$ is the local free-electron
    number density, $e$ is the elementary charge, $\varepsilon_0$ is the vacuum permittivity,
    and $m_e$ is the electron mass.


    This quantity is the local cutoff scale for ordinary-mode electromagnetic-wave
    propagation. It differs from the externally selected [diagnostic antenna frequency](name:frequency_of_diagnostic_antenna),
    while serving as the physical component of [frequency at measurement position](name:frequency_at_measurement_position).'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:frequency_of_diagnostic_antenna
  - name:frequency_at_measurement_position
  arguments:
  - name: frequency_at_measurement_position
    operator: plasma
    operator_kind: qualifier
  sources:
