    dd_path: ferritic/object/axisymmetric/rectangle/height
    status: attached
  - id: dd:iron_core/segment/geometry/rectangle/height
    dd_path: iron_core/segment/geometry/rectangle/height
    status: attached
- name: height_of_passive_structure
  kind: scalar
  status: draft
  description: Vertical full height of a rectangular cross-section element of a passive
    conducting structure, measured along Z in the right-handed cylindrical (R, phi,
    Z) frame.
  documentation: 'Height of passive structure is the full vertical extent of a rectangular
    cross-section passive conducting element. It is measured parallel to $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. The quantity is a geometric length
    and is non-negative.


    For a rectangular cross-section whose sides are aligned with the $R$ and $Z$ directions,
    the cross-sectional area is related to height and width by:


    $$

    A = h w

    $$


    where $h$ is the vertical height in meters, $w$ is the horizontal [width of the
    passive structure](name:width_of_passive_structure) in meters, and $A$ is the
    rectangular cross-sectional area in square meters.


    In practice, this height is obtained from engineering geometry, survey data, or
    geometric reconstruction of the passive conductor boundary as the separation between
    the lower and upper faces of the rectangular cross-section. It applies specifically
    to rectangular cross-sections; annular or shell-like passive-loop descriptions
    are better characterized by quantities such as [inner radius of passive loop](name:inner_radius_of_passive_loop)
    and [thickness of passive loop](name:thickness_of_passive_loop).


    Typical values range from 0.01-1 m. Small segmented passive conductors may have
    heights of a few centimeters, while large vessel-integrated or stabilizing conducting
    structures can have vertical extents of several tenths of a meter or more.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_passive_structure
  - name:inner_radius_of_passive_loop
  - name:thickness_of_passive_loop
  - name:length_of_passive_structure
  sources:
  - id: dd:pf_passive/loop/element/geometry/rectangle/height
    dd_path: pf_passive/loop/element/geometry/rectangle/height
    status: composed
- name: height_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of a poloidal
    field coil conductor element, measured parallel to Z in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'The height of a poloidal field coil conductor element is the full
    vertical extent of its rectangular cross-section. It is measured parallel to the
    $Z$ axis of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a rectangular cross-section, the height is the difference between the upper
    and lower vertical boundaries:


    $$

    h = Z_{\max} - Z_{\min}

    $$


    where $h$ is the coil height, and $Z_{\max}$ and $Z_{\min}$ are the maximum and
    minimum vertical coordinates of the conductor cross-section boundary.


    This dimension is obtained from coil engineering geometry, drawings, or electromagnetic
    models. Together with the radial [width of a poloidal field coil](name:width_of_poloidal_field_coil),
    it defines the rectangular cross-section; for a solid rectangle, their product
    gives the [area of a poloidal field coil](name:area_of_poloidal_field_coil). The
    related [thickness of a poloidal field coil](name:thickness_of_poloidal_field_coil)
    describes a separate conductor or winding-pack extent when that dimension is distinguished.


    Typical values range from 0.05-0.5 m for small correction or shaping coils and
    about 0.2-2 m for large equilibrium-field coils, depending on current capacity,
    mechanical support, and available space.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:thickness_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:height_of_iron_core_segment
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/height
    dd_path: pf_active/coil/element/geometry/rectangle/height
