- name: temperature_at_divertor_target
  kind: scalar
  status: active
  description: Temperature at the divertor target is the thermal energy per particle
    of a specified plasma population evaluated at the plasma side of a divertor-target
    sheath, distinct from the target material temperature.
  documentation: 'Temperature at the divertor target is the thermal energy per particle
    of a specified plasma population evaluated at the plasma side of a divertor-target
    sheath. It is a plasma boundary quantity for particles adjacent to, or incident
    on, the divertor target, not a thermodynamic property of the solid target material.


    For a species or population $s$, the scalar target temperature is the one-third
    trace of the kinetic thermal-energy moment at the sheath edge:


    $$

    T_{s,t} = \frac{m_s}{3 n_{s,t}} \int |\mathbf{v} - \mathbf{u}_{s,t}|^2 f_{s,t}(\mathbf{v})\,d^3v

    $$


    where $T_{s,t}$ is the temperature at the divertor target for population $s$,
    $m_s$ is the particle mass, $n_{s,t}$ is the particle number density at the sheath
    edge, $\mathbf{u}_{s,t}$ is the mean flow velocity there, and $f_{s,t}$ is the
    velocity distribution of that population at the plasma side of the sheath.


    This generic quantity denotes the target temperature for the specified plasma
    population and is not an unqualified average over electrons and ions. For the
    electron population it corresponds to [electron temperature at divertor target](name:electron_temperature_at_divertor_target);
    for the ion population it corresponds to [ion temperature at divertor target](name:ion_temperature_at_divertor_target).
    It is the divertor-target counterpart of the more general [plasma temperature](name:plasma_temperature).'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:ion_temperature_at_divertor_target
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Electron temperature at the divertor target is the thermal energy per
    particle of the electron population evaluated at the plasma side of a divertor-target
    sheath, distinct from the target material temperature.
  documentation: 'Electron temperature at the divertor target is the thermal energy
    per particle of the electron population evaluated at the plasma side of a divertor-target
    sheath. It is a plasma boundary quantity for electrons at the downstream end of
    the scrape-off layer, not a thermodynamic property of the solid target material.


    For the electron population, the target temperature is the one-third trace of
    the kinetic thermal-energy moment at the sheath edge:


    $$

    T_{e,t} = \frac{m_e}{3 n_{e,t}} \int |\mathbf{v} - \mathbf{u}_{e,t}|^2 f_{e,t}(\mathbf{v})\,d^3v

    $$


    where $T_{e,t}$ is the electron temperature at the divertor target, $m_e$ is the
    electron mass, $n_{e,t}$ is the free-electron number density at the sheath edge,
    $\mathbf{v}$ is electron velocity, $\mathbf{u}_{e,t}$ is the mean electron flow
    velocity at the sheath edge, $f_{e,t}(\mathbf{v})$ is the electron velocity distribution
    there, and $d^3v$ is the velocity-space volume element.


    This quantity applies exclusively to the free-electron population at a specified
    divertor target and represents a density-weighted per-particle thermal energy
    scale rather than an extensive sum. It excludes ion, neutral-particle, and solid-target
    temperatures, and it is not an average over multiple plasma populations.


    It is the electron-specific component of [temperature at the divertor target](name:temperature_at_divertor_target).
    The electron density at the same locus, [electron density at divertor target](name:electron_density_at_divertor_target),
    supplies the local population density appearing in the defining moment but is
    a distinct quantity.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - dd_path: divertors/divertor/target/two_point_model/t_e_target
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-two_point_model-t_e_target
    dd_documentation:
      leaf: Electron temperature at divertor target
      parent_path: divertors/divertor/target/two_point_model
      parent: Description of SOL according to the two point model, the downstream
        point being on this target, for various time slices
      data_type: FLT_0D
      unit: eV
    enhanced_context:
      description: Electron temperature (Te) at the divertor target plate as estimated
        by the two-point model for the scrape-off layer. Characterizes the plasma
        conditions at the downstream end of the SOL.
      kind: llm
  - dd_path: summary/local/divertor_target/t_e/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-t_e-value
    dd_documentation:
      leaf: Value
