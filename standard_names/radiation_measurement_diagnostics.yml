      parent_path: hard_x_rays/emissivity_profile_1d
      parent: Emissivity profile per energy band (assumed common to all channels used
        in the profile reconstruction)
      data_type: FLT_2D
      unit: m^-3.sr^-1.s^-1
      coordinates:
      - hard_x_rays/emissivity_profile_1d/time
      - hard_x_rays/emissivity_profile_1d/rho_tor_norm
    enhanced_context:
      description: Radial profile of plasma hard X-ray (HXR) emissivity in a specific
        energy band, reconstructed from multi-channel brightness measurements. Characterizes
        the spatial distribution of suprathermal electrons producing bremsstrahlung
        emission.
      kind: llm
- name: hot_neutral_fraction
  kind: scalar
  status: active
  description: Dimensionless fraction of the hot charge-exchange-born component of
    a hydrogen-isotope neutral population relative to the total neutral atom population.
  documentation: 'The hot neutral fraction is a dimensionless ratio bounded in $[0,
    1]$ expressing the relative abundance of the hot, charge-exchange-born component
    of a hydrogen-isotope neutral population. It is a component of the broader [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density), distinct
    from the cold recycled component.


    The fraction is defined as:


    $$

    f_{\mathrm{hot}} = \frac{n_{\mathrm{hot}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $f_{\mathrm{hot}}$ is the hot neutral fraction, $n_{\mathrm{hot}}$ is the
    number density of hot charge-exchange-born neutral atoms, and $n_{\mathrm{cold}}$
    is the number density of cold recycled neutral atoms.


    The quantity applies to a specified hydrogen isotope and uses the two-component
    neutral-population model. Its denominator is the total neutral population formed
    by the cold and hot components for that isotope; it is not summed across different
    isotopes and does not represent the cold component itself.


    Within this model, the hot and cold fractions are complementary and sum to unity.
    The [cold neutral fraction](name:cold_neutral_fraction) gives the corresponding
    recycled component, with the energy threshold separating the two components defined
    by the applicable population model.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  sources:
  - dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_fraction
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-isotope_ratios-isotope-hot_neutrals_fraction
    dd_documentation:
      leaf: Fraction of hot neutrals for this isotope (n_hot_neutrals/(n_cold_neutrals+n_hot_neutrals))
      parent_path: spectrometer_visible/channel/isotope_ratios/isotope
      parent: Set of isotopes
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/isotope/time
    enhanced_context:
      description: Fraction of hot neutrals relative to the total neutral population
        for a given hydrogen isotope, defined as n_hot/(n_cold + n_hot). Used in spectroscopic
        isotope ratio analysis to account for charge-exchange-born fast neutrals.
      kind: llm
- name: incident_soft_xray_radiance
  kind: scalar
  status: active
  description: Incident soft X-ray power radiance gives received electromagnetic power
    per projected detector area and solid angle, integrated over the selected energy
    band.
  documentation: 'Incident soft-X-ray power radiance is the energy-integrated radiant
    power arriving at a receiving surface from the viewing direction, expressed per
    projected area and per solid angle.


    $$

    L_{\rm inc} = \int_{\mathcal{E}} L_E^{\rm inc}\,dE = \frac{dP_{\rm inc}}{dA_\perp\,d\Omega}

    $$


    where $L_{\rm inc}$ is the incident power radiance, $L_E^{\rm inc}$ is the incident
    spectral power radiance at photon energy $E$, $\mathcal{E}$ is the selected photon-energy
    band or collection of bands, $P_{\rm inc}$ is incident radiant power, $A_\perp$
    is projected receiving area, and $\Omega$ is accepted solid angle.


    The quantity applies to soft X-ray radiation incident on a detector channel, with
    spectral dependence integrated over the selected energy band or bands. It is an
    incoming radiometric quantity per area and solid angle, not a total power integrated
    over the detector aperture or viewing directions, and it is distinct from detector-registration
    efficiency.


    Integrating this radiance over the relevant projected area and solid angle gives
    the band-integrated received power represented by [power of soft X-ray detector](name:power_of_soft_xray_detector).
    Unlike [hard X-ray brightness](name:hard_xray_brightness), which is photon-number
    radiance, this quantity is power radiance; [spectral efficiency of soft X-ray
    detector](name:spectral_efficiency_of_soft_xray_detector) instead describes the
    probability that incident photons are registered.'
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_of_soft_xray_detector
  - name:hard_xray_brightness
  sources:
  - dd_path: soft_x_rays/channel/brightness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-brightness
    dd_documentation:
      leaf: Power flux received by the detector, per unit solid angle and per unit
        area (i.e. power divided by the etendue), in multiple energy bands if available
        from the detector
      parent_path: soft_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: STRUCTURE
      unit: W.m^-2.sr^-1
    enhanced_context:
      description: "Soft X-ray (SXR) brightness, defined as detected power flux per\
        \ unit solid angle and per unit detector area (power divided by \xE9tendue),\
        \ measured in one or more energy bands. Used for plasma tomography and MHD\
        \ mode analysis."
      kind: llm
- name: lower_bound_photon_energy
  kind: scalar
  status: active
  description: Lower boundary of an X-ray photon-energy band, specifying the minimum
    photon energy included in the defined detection or emission band.
  documentation: 'Lower boundary of an X-ray photon-energy band is the minimum photon
    energy included in the specified detection or emission band. It defines the low-energy
    cutoff of that band.


    The photon-energy band defined by this lower boundary and its complementary upper
    boundary satisfies:


    $$

    E_\mathrm{low} \le E \le E_\mathrm{up}

    $$


    where $E_\mathrm{low}$ is the lower-bound photon energy, $E$ is the photon energy
    being classified, and $E_\mathrm{up}$ is the [upper photon energy](name:upper_photon_energy).


    The scope is an X-ray spectral band for photon detection, photon counting, or
    energy-resolved emissivity. This quantity is a band boundary, not an observed
    photon energy, photon-energy width, photon flux, count rate, emissivity, or detector-response
    amplitude; it is a single boundary for one specified band and implies no averaging
    or summation over photons.


    Together with the [upper photon energy](name:upper_photon_energy), it specifies
    the spectral interval of the band. The lower boundary must not exceed the upper
    boundary, and any derived band width is their difference.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: camera_x_rays/energy_threshold_lower
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-energy_threshold_lower
    dd_documentation:
