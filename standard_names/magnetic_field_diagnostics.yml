    dd_path: magnetics/b_field_tor_probe/area
    status: composed
- name: breakdown_stray_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Magnitude of the residual magnetic field at the plasma position during
    the breakdown phase of plasma initiation. It quantifies the all-direction stray
    field from imperfect cancelation of external coil fields that can impede electron
    avalanche formation.
  documentation: 'Breakdown stray magnetic field magnitude is the scalar magnitude
    of the residual magnetic field present at the plasma position during the initial
    electron-avalanche phase. It is the breakdown-specific form of [stray_magnetic_field_magnitude](name:breakdown_stray_magnetic_field_magnitude)
    and includes residual field in all spatial directions, not only the poloidal component.


    For a stray-field vector $\mathbf{B}_\mathrm{stray}$ with components in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height, the magnitude is


    $$

    B_\mathrm{stray} = \sqrt{B_R^2 + B_\phi^2 + B_Z^2}

    $$


    where $B_R$, $B_\phi$, and $B_Z$ are the radial, toroidal, and vertical components
    of $\mathbf{B}_\mathrm{stray}$, all expressed in tesla; $B_\mathrm{stray}$ is
    also reported in tesla.


    In practice this quantity is estimated from magnetic-field calculations for the
    breakdown scenario, including external-coil currents and relevant residual or
    induced fields. It may be constrained or checked using magnetic measurements when
    suitable diagnostics and timing are available, but the definition is the local
    magnetic-field magnitude at the intended breakdown location.


    Optimized breakdown conditions commonly require residual fields at the millitesla
    scale, for example about 0.001-0.005 T in many tokamak scenarios. This range is
    device- and scenario-dependent rather than a universal acceptance criterion, because
    the tolerable stray field also depends on electric field, neutral pressure, vessel
    size, connection length, toroidal field, and pre-ionization conditions; poorly
    nulled configurations can reach several millitesla to tens of millitesla.'
  unit: T
  physics_domain: magnetic_field_diagnostics
  links: []
  sources:
  - id: dd:plasma_initiation/global_quantities/b_field_stray
    dd_path: plasma_initiation/global_quantities/b_field_stray
    status: composed
  - id: dd:plasma_initiation/global_quantities/b_field_stray/data
    dd_path: plasma_initiation/global_quantities/b_field_stray/data
    status: composed
- name: count_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Number of turns in a toroidal magnetic-field probe coil; the sign indicates
    whether the winding and terminal polarity give a signed area normal in the direction
    of increasing toroidal angle phi in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The signed turn count of a toroidal magnetic-field probe is the
    number of conductor turns linked by the probe aperture, including the orientation
    imposed by the winding sense and the chosen terminal polarity. Its magnitude multiplies
    the magnetic flux coupled into the coil, while its sign records whether the coil''s
    signed area normal corresponds to the positive or negative $\hat{\phi}$ direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The electromagnetic calibration follows the flux-linkage form of Faraday''s law:


    $$

    V = -\frac{d\Lambda}{dt}, \qquad \Lambda = N\Phi_+ = N\int_{S_+} \mathbf{B}\cdot
    d\mathbf{S}_+ \simeq N A B_\phi

    $$


    where $V$ is the open-circuit [terminal voltage](name:voltage_of_toroidal_magnetic_field_probe)
    in volts, $\Lambda$ is the flux linkage in webers, $N$ is this signed turn count,
    $\Phi_+$ is the flux through a reference turn, and $d\mathbf{S}_+$ is the vector
    area element in square meters with normal chosen along increasing $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame. The approximation uses the effective
    [probe area](name:area_of_toroidal_magnetic_field_probe) $A$ in m$^2$ and a locally
    uniform toroidal magnetic-field component $B_\phi$ in tesla.


    The magnitude of $N$ is assigned from winding records and checked by magnetic
    calibration with a known time-varying $B_\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. The sign is determined from the documented terminal polarity
    and the right-hand rule for the coil winding; calibration verifies it by comparing
    the measured terminal-voltage polarity with that predicted by Faraday''s law.
    The [toroidal angle](name:toroidal_angle_of_toroidal_magnetic_field_probe) specifies
    the sensitive-axis orientation, and the [probe length](name:length_of_toroidal_magnetic_field_probe)
    characterizes finite spatial sampling rather than multiplying the flux pickup
    factor $N A$.


    Typical magnitudes are 1-10 turns for high-bandwidth probes and 10-500 turns for
    higher-sensitivity or low-noise coils. Larger magnitude increases induced voltage
    for a given $dB_\phi/dt$ but generally increases winding resistance, self-inductance,
    and capacitance, so the selected count reflects a trade-off between sensitivity
    and frequency response.


    Sign convention: Positive when the winding and terminal polarity define a signed
    area normal pointing in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_toroidal_magnetic_field_probe
  - name:length_of_toroidal_magnetic_field_probe
  - name:voltage_of_toroidal_magnetic_field_probe
  - name:toroidal_angle_of_toroidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_tor_probe/turns
    dd_path: magnetics/b_field_tor_probe/turns
    status: composed
- name: magnetic_field_at_magnetic_axis_magnitude
  kind: scalar
  status: draft
  description: Euclidean norm of the total magnetic field vector evaluated at the
    magnetic axis, where the poloidal flux reaches its extremum and poloidal field
    components vanish in an axisymmetric equilibrium.
  documentation: "The magnetic axis is the unique interior point where the poloidal\
    \ flux function $\\psi$ attains its extremum, defining the center of the nested\
    \ flux-surface topology. In an axisymmetric equilibrium, the poloidal field components\
    \ vanish there by symmetry, so the field magnitude is dominated by the toroidal\
    \ contribution.\n\nThe on-axis field magnitude is defined as:\n\n$$\nB_0 = |\\\
    mathbf{B}|_{\\rm axis} = \\sqrt{B_R^2 + B_\\phi^2 + B_Z^2}\\bigg|_{R=R_{\\rm axis},\\\
    , Z=Z_{\\rm axis}}\n$$\n\nwhere $B_R$, $B_\\phi$, and $B_Z$ are the radial, toroidal,\
    \ and vertical components of $\\mathbf{B}$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, evaluated at the axis position $(R_{\\rm axis}, Z_{\\rm axis})$.\n\
    \nThis quantity serves as the conventional reference field $B_0$ for normalizing\
    \ plasma parameters, and is obtained from equilibrium reconstruction combining\
    \ external magnetic diagnostics with pressure profile constraints. Its value closely\
    \ tracks [toroidal_magnetic_field_at_magnetic_axis](name:toroidal_magnetic_field_at_magnetic_axis)\
    \ because the poloidal field contribution is negligible at the axis. Typical on-axis\
    \ values range from 1\u20136 T in medium to large tokamaks; the corresponding\
    \ flux-surface extremal counterparts are [maximum_magnetic_field_magnitude](name:maximum_magnetic_field_magnitude)\
    \ and [minimum_magnetic_field_magnitude](name:minimum_magnetic_field_magnitude)."
  unit: T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:toroidal_magnetic_field_at_magnetic_axis
  - name:maximum_magnetic_field_magnitude
  - name:minimum_magnetic_field_magnitude
  sources:
  - id: dd:summary/local/magnetic_axis/b_field/value
    dd_path: summary/local/magnetic_axis/b_field/value
    status: composed
- name: radial_coordinate_of_flux_loop
  kind: scalar
  status: draft
  description: "Major radius R coordinate of a flux loop diagnostic position, giving\
    \ the perpendicular distance from the toroidal symmetry axis to the loop center\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The radial coordinate $R$ gives the position of a flux loop diagnostic\
    \ in the major-radius direction of the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame, where $R$ is the perpendicular distance from the toroidal symmetry axis.\
    \ Flux loops are closed conducting loops whose terminal voltage obeys Faraday's\
    \ law, $V = -d\\Psi/dt$, where $\\Psi$ is the total poloidal magnetic flux enclosed\
    \ by the loop; the loop's $(R, Z)$ position is essential for mapping the measured\
    \ flux to the equilibrium geometry during reconstruction. Typical major-radius\
    \ positions for flux loops span from values near the inner wall to the outer vacuum\
    \ vessel structure, covering roughly 0.5\u201312 m across current and planned\
    \ tokamak devices.\n\nThe radial position is obtained from engineering survey\
    \ data or the design geometry of the magnetic diagnostic assembly and is treated\
    \ as a fixed calibration parameter for each measurement campaign. Together with\
    \ the [terminal loop voltage](name:voltage_of_flux_loop) and the [effective sensing\
    \ area](name:area_of_flux_loop), this coordinate fully characterizes the spatial\
    \ contribution of each flux loop to the equilibrium constraint set. The identical\
    \ spatial registration convention is used for the [radial coordinate of a poloidal\
    \ magnetic field probe](name:radial_coordinate_of_poloidal_magnetic_field_probe).\n\
    \nSign convention: Positive when directed away from the toroidal symmetry axis\
    \ in the direction of increasing $R$."
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:voltage_of_flux_loop
  - name:area_of_flux_loop
  - name:radial_coordinate_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/flux_loop/position/r
    dd_path: magnetics/flux_loop/position/r
    status: composed
- name: radial_coordinate_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Major radius R coordinate of the physical location of a poloidal magnetic
    field probe in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The radial coordinate $R$ gives the major-radius position of a poloidal
    magnetic field probe, measured from the machine symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius, $\phi$ is the
    toroidal angle, and $Z$ is the vertical height.


    Poloidal magnetic field probes are distributed around the poloidal cross-section
    of the vessel to sample the local poloidal field component; their radial positions
    span from the inboard wall to the outboard wall and are established by physical
    survey of the installed hardware. Together with [radial_coordinate_of_flux_loop](name:radial_coordinate_of_flux_loop)
    and [radial_coordinate_of_toroidal_magnetic_field_probe](name:radial_coordinate_of_toroidal_magnetic_field_probe),
    this value maps the complete primary magnetics diagnostic array onto the poloidal
    cross-section for equilibrium reconstruction. The [area_of_poloidal_magnetic_field_probe](name:area_of_poloidal_magnetic_field_probe)
    and [voltage_of_poloidal_magnetic_field_probe](name:voltage_of_poloidal_magnetic_field_probe)
    characterize the flux-sensing area and measured signal of the same probe at this
    radial location.


    Typical values range from roughly 0.5-2 m for compact devices to 4-10 m for large
    tokamaks.


    Sign convention: Positive when measured outward from the machine symmetry axis
    in the direction of increasing major radius $R$.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:radial_coordinate_of_flux_loop
  - name:radial_coordinate_of_toroidal_magnetic_field_probe
  - name:area_of_poloidal_magnetic_field_probe
  - name:voltage_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/bpol_probe/position/r
    dd_path: magnetics/bpol_probe/position/r
    status: composed
- name: radial_coordinate_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: "Major radius R coordinate of the physical location of a toroidal magnetic\
    \ field probe in the right-handed cylindrical (R, \u03C6, Z) frame, measured from\
    \ the toroidal symmetry axis to the probe center."
  documentation: "The radial position of a toroidal magnetic field probe specifies\
    \ how far the sensing coil is located from the machine symmetry axis, measured\
    \ along the major radial direction $\\hat{R}$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame where $R$ is the distance from the toroidal symmetry axis\
    \ and $Z$ is the vertical height.\n\nTogether with the [vertical coordinate](name:vertical_coordinate_of_toroidal_magnetic_field_probe)\
    \ and the [toroidal angle](name:toroidal_angle_of_toroidal_magnetic_field_probe),\
    \ this coordinate fully determines the three-dimensional position of the probe\
    \ in the device. These three coordinates enter directly into equilibrium reconstruction\
    \ algorithms, which weight magnetic field measurements by their geometric location\
    \ relative to the plasma column. The analogous coordinate for poloidal-field sensing\
    \ coils is the [radial coordinate of a poloidal magnetic field probe](name:radial_coordinate_of_poloidal_magnetic_field_probe).\n\
    \nThe coordinate is obtained from engineering survey data or computer-aided design\
    \ models of the diagnostic hardware. Typical values range from approximately 1\
    \ m at the inner wall to 10 m at the outer wall for large-scale devices, with\
    \ medium-sized tokamaks spanning roughly 1.5\u20135 m.\n\nSign convention: Positive\
    \ when the probe position is displaced outward from the toroidal symmetry axis\
    \ in the $+\\hat{R}$ direction of the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame."
  unit: m
  physics_domain: magnetic_field_diagnostics
