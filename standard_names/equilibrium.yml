- name: inner_major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Major-radius coordinate of the high-field-side midplane crossing of
    a nested magnetic flux surface.
  documentation: 'The inner major radius identifies where a given nested magnetic
    flux surface intersects the outboard-inboard midplane on the high-field side of
    the magnetic axis. Together with the [outer major radius of the same flux surface](name:outer_major_radius_of_flux_surface),
    it defines the radial width and Shafranov-shifted placement of that surface relative
    to the [major radius of the magnetic axis](name:major_radius_of_magnetic_axis).


    For a flux surface labeled by poloidal magnetic flux $\psi$, the inner major radius
    can be defined by the inboard midplane root:


    $$

    R_{\mathrm{in}}(\psi_s) = \min\{R : \psi(R, Z_{\mathrm{axis}}) = \psi_s\}

    $$


    where $R$ is major radius in the right-handed cylindrical $(R, \phi, Z)$ frame,
    $Z_{\mathrm{axis}}$ is the vertical coordinate of the magnetic axis, and $\psi_s$
    labels the selected flux surface.


    This quantity is obtained from equilibrium reconstruction by finding flux-contour
    intersections with the midplane defined by the magnetic-axis height. It is constrained
    mainly by magnetic measurements and pressure-current consistency, and it is often
    interpreted alongside the [major radius of the geometric axis](name:major_radius_of_geometric_axis)
    to separate geometric centering from magnetic-axis displacement.


    Typical values span about 0.5-3 m in medium-size tokamaks and about 4-6 m in large
    devices, depending on plasma major radius, minor radius, elongation, and boundary
    position.


    Sign convention: Positive when the flux-surface intersection lies at positive
    major radius $R$ measured outward from the toroidal symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_major_radius_of_flux_surface
  - name:major_radius_of_magnetic_axis
  - name:major_radius_of_geometric_axis
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/r_inboard
    dd_path: equilibrium/time_slice/profiles_1d/r_inboard
    status: composed
- name: inner_triangularity
  kind: scalar
  status: draft
  description: Dimensionless boundary-shape parameter measuring the high-field-side
    D-shaping displacement of the plasma boundary relative to an untriangular elliptical
    cross-section.
  documentation: 'Inner triangularity describes the triangular distortion of the high-field-side
    portion of the last closed flux surface in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It refines the
    global [triangularity](name:triangularity) by isolating the inboard-side contribution,
    while [outer triangularity](name:outer_triangularity) describes the corresponding
    low-field-side shaping.


    A local geometric definition can be written as the normalized radial offset of
    the inboard boundary from an elliptical reference contour:


    $$

    \delta_{\rm in} = \frac{R_{\rm ell,in}(Z_*) - R_{\rm b,in}(Z_*)}{a}

    $$


    where $R_{\rm b,in}(Z_*)$ is the inboard boundary major radius at the reference
    vertical location $Z_*$, $R_{\rm ell,in}(Z_*)$ is the matching untriangular elliptical-contour
    major radius, and $a$ is the plasma minor radius. This form makes the quantity
    dimensionless and separates triangular distortion from size measures such as [major
    radius of the plasma boundary](name:major_radius_of_plasma_boundary).


    Inner triangularity is computed from reconstructed plasma-boundary contours constrained
    by magnetic probes, flux measurements, and internal profile or polarimetric information
    when available. Representative values in shaped tokamak equilibria are 0.1-0.5,
    with weakly shaped or nearly elliptical plasmas near 0 and strongly D-shaped configurations
    approaching about 0.6. It is interpreted together with [upper triangularity](name:upper_triangularity),
    [lower triangularity](name:lower_triangularity), and [minor triangularity](name:triangularity)
    to characterize asymmetry of the full boundary shape.


    Sign convention: Positive when the high-field-side triangular distortion displaces
    the relevant plasma-boundary point toward smaller major radius $R$ relative to
    the corresponding untriangular elliptical reference contour.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:triangularity
  - name:outer_triangularity
  - name:major_radius_of_plasma_boundary
  - name:upper_triangularity
  - name:lower_triangularity
  - name:triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/triangularity_inner
    dd_path: equilibrium/time_slice/boundary_separatrix/triangularity_inner
    status: composed
- name: internal_inductance
  kind: scalar
  status: draft
  description: Dimensionless measure of plasma current-density peaking derived from
    the volume-integrated poloidal magnetic-field energy.
  documentation: 'Internal inductance measures how strongly the plasma current density
    is peaked through its contribution to the poloidal magnetic-field energy inside
    the plasma. Larger values indicate more magnetic energy stored at smaller minor
    radius and are closely related to the effective [plasma inductance](name:plasma_inductance)
    that enters the global current balance.


    A common equilibrium definition is


    $$

    l_i = \frac{2}{R_0 \mu_0^2 I_p^2}\int_V B_p^2\,dV

    $$


    where $R_0$ is the reference major radius, often associated with the [major radius
    of the magnetic axis](name:major_radius_of_magnetic_axis), $\mu_0$ is the vacuum
    permeability, $I_p$ is the total toroidal plasma current, $B_p$ is the poloidal
    magnetic-field magnitude, and the integral is over the plasma volume. The poloidal
    field is constrained by the boundary magnetic-flux geometry, including the [poloidal
    magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).


    Internal inductance is inferred from equilibrium reconstruction using magnetic
    probes, flux loops, plasma boundary constraints, and, when available, internal
    current-profile diagnostics such as motional-Stark-effect polarimetry. Representative
    tokamak values are about 0.5-1.5 for broad to moderately peaked current profiles,
    with values above 1.5 indicating strongly peaked current density.


    Sign convention: Positive when the poloidal magnetic-field energy inside the plasma
    is nonzero.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:plasma_inductance
  - name:major_radius_of_magnetic_axis
  - name:poloidal_magnetic_flux_at_plasma_boundary
