- name: radius_of_collimating_aperture_of_neutron_detector
  kind: scalar
  status: draft
  description: Radius of the circular collimating aperture associated with a neutron
    diagnostic detector, valid only when the aperture cross-section is circular rather
    than rectangular or polygonal.
  documentation: The collimating aperture of a neutron detector restricts the solid
    angle subtended by the detector active area, defining the spatial resolution and
    acceptance cone of the neutron diagnostic channel. When the aperture geometry
    is circular, its cross-section is fully described by a single radius $r_\mathrm{ap}$,
    related to the solid angle $\Omega \approx \pi r_\mathrm{ap}^2 / d^2$ for a detector
    at distance $d$ from the aperture. Typical values range from a few millimeters
    for high-resolution collimated channels to several centimeters for larger-acceptance
    neutron cameras. This quantity applies only when the geometry type flag indicates
    a circular cross-section; for non-circular apertures the full outline must be
    described by a polygon. The companion quantity [radius_of_detector](name:radius_of_detector)
    gives the active-area radius of the detector element itself, while [major_radius_of_neutron_detector_reference_point](name:major_radius_of_neutron_detector_reference_point)
    locates the detector in the machine cylindrical $(R, \phi, Z)$ frame. The closely
    related [radius_of_aperture](name:radius_of_aperture) is the generic sibling for
    this same physical dimension.
  unit: m
  physics_domain: particle_measurement_diagnostics
