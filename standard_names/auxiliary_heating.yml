- name: toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Toroidal component of the electron cyclotron beam launch wave vector
    at the antenna reference point.
  documentation: 'The toroidal wave vector $k_\phi = \mathbf{k} \cdot \hat{\phi}$
    quantifies the spatial oscillation rate of the launched EC wave in the geometric
    toroidal direction $\hat{\phi}$ of the IMAS cylindrical $(R, \phi, Z)$ frame.
    This quantity is the toroidal projection of the launch wave vector at the antenna,
    whose magnitude and direction determine the beam propagation path via ray-tracing
    or beam-tracing codes. Typical values for EC waves in the extraordinary (X) and
    ordinary (O) modes range from 10 to 100 m$^{-1}$, depending on the launch frequency,
    toroidal injection angle, and poloidal launch position. The initial toroidal wave
    vector, together with the [radial wave vector of the beam tracing beam](name:radial_wave_vector_of_beam_tracing_beam)
    and the [vertical wave vector of the beam tracing beam](name:vertical_wave_vector_of_beam_tracing_beam),
    fully specifies the launch direction at the antenna reference point. The normalized
    toroidal wave vector $k_\phi / |\mathbf{k}|$ relates to the toroidal refractive
    index $n_\phi$, a key parameter for wave accessibility and mode conversion in
    the plasma.


    Sign convention: Positive when $k_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: m^-1
  physics_domain: auxiliary_heating
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:vertical_wave_vector_of_beam_tracing_beam
  sources:
