- name: nitrogen_fraction
  kind: scalar
  status: draft
  description: 'Volume-averaged nitrogen concentration: the total nitrogen-particle
    density over all charge states divided by electron density.'
  documentation: 'Nitrogen fraction is the dimensionless volume-averaged abundance
    of nitrogen relative to electrons in a plasma. It counts nitrogen nuclei in all
    ionization states, from neutral $\mathrm{N}^{0}$ through fully stripped $\mathrm{N}^{7+}$,
    and normalizes their total number density by the local electron density.


    Using a volume average over the plasma volume, the fraction is defined as:


    $$

    f_\mathrm{N} = \left\langle \frac{\sum_{q=0}^{7} n_{\mathrm{N}^{q+}}}{n_e} \right\rangle_V

    $$


    where $n_{\mathrm{N}^{q+}}$ is the number density of nitrogen with charge state
    $q$, $q=0$ denotes neutral nitrogen, $q=7$ denotes fully stripped nitrogen, $n_e$
    is electron density, and $\langle\cdot\rangle_V$ denotes volume averaging. Fully
    stripped nitrogen is $\mathrm{N}^{7+}$; there is no $\mathrm{N}^{8+}$ charge state
    for nitrogen.


    In practice, this quantity is inferred from a combination of impurity spectroscopy,
    charge-exchange recombination measurements when available, bolometric radiation
    constraints, electron-density measurements, and collisional-radiative or transport
    modeling to complete the charge-state distribution. Neutral and fully stripped
    populations can be difficult to observe directly, so their contributions are often
    inferred from ionization-balance modeling rather than measured as isolated emission
    features.


    Typical values are $10^{-4}$-$10^{-3}$ for trace background nitrogen and $10^{-3}$-$5\times10^{-2}$
    during deliberate nitrogen seeding for radiative divertor or edge-cooling control.
    Larger fractions increase radiated power and fuel dilution and therefore strongly
    affect plasma performance.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_nitrogen_density
  - name:neon_fraction
  - name:total_plasma_fraction
  sources:
  - id: dd:summary/composition/nitrogen/value
    dd_path: summary/composition/nitrogen/value
    status: composed
- name: optical_element_width
  kind: scalar
  status: draft
  description: Full width of an optical-element aperture along X1 in the right-handed
    local element frame (X1, X2, X3), where X3 is normal to the aperture surface.
    It applies to rectangular aperture geometry.
  documentation: "Optical element width is the usable aperture extent along the first\
    \ transverse axis $X_1$ of a right-handed local element frame $(X_1, X_2, X_3)$.\
    \ The axes $X_1$ and $X_2$ span the aperture surface, while $X_3$ is normal to\
    \ that surface; for a rectangular aperture this width is one side length, paired\
    \ with [height_of_optical_element](name:height_of_optical_element) along $X_2$.\n\
    \nFor an aperture bounded by minimum and maximum positions along $X_1$, the width\
    \ is\n\n$$\nW = X_{1,\\max} - X_{1,\\min}\n$$\n\nwhere $W$ is the optical element\
    \ width in meters, and $X_{1,\\max}$ and $X_{1,\\min}$ are the largest and smallest\
    \ local $X_1$ positions of the usable aperture boundary, also in meters. The result\
    \ is a non-negative geometric extent.\n\nThe width is obtained from the optical\
    \ design, clear-aperture specification, or dimensional metrology of the fabricated\
    \ element. Together with the $X_2$ height it determines the geometric aperture\
    \ area $W H$ for an unobscured rectangle, which affects solid angle, photon throughput,\
    \ and \xE9tendue; [width_of_diagnostic_aperture](name:width_of_diagnostic_aperture)\
    \ is the analogous width for a diagnostic aperture not specifically tied to an\
    \ optical element.\n\nTypical values for X-ray crystal spectrometer reflectors\
    \ and similar diagnostic optical elements are 0.001-0.1 m, with smaller widths\
    \ favored for compact or high-resolution optics and larger widths used when photon\
    \ throughput is limiting."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:height_of_optical_element
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/x1_width
    dd_path: spectrometer_x_ray_crystal/channel/reflector/x1_width
    status: composed
- name: power_density_due_to_radiation
  kind: scalar
  status: draft
  description: Volumetric rate at which plasma thermal energy is converted into emitted
    electromagnetic radiation. It represents a local radiative loss term per unit
    volume in plasma power balance.
  documentation: 'Power density due to radiation is the local rate per unit volume
    at which plasma thermal energy is converted into emitted electromagnetic radiation.
    It includes continuum emission, line radiation, recombination radiation, and radiation
    from intrinsic or injected impurities. It is the same physical loss density commonly
    denoted [radiative_power_density](name:power_density_due_to_radiation), while
    this name emphasizes its role as one term in plasma power balance alongside processes
    such as power_density_due_to_conduction.


    The quantity is defined from a radiated power element by:


    $$

    p_\mathrm{rad} = \frac{dP_\mathrm{rad}}{dV}

    $$


    where $p_\mathrm{rad}$ is the local radiative power density, $dP_\mathrm{rad}$
    is the photon power emitted from the volume element $dV$, and the resulting unit
    is W m$^{-3}$.


    Experimentally it is inferred from bolometer signals, filtered cameras, spectroscopy,
    or tomographic reconstructions by converting measured photon brightness into local
    emissivity. In modeling and power-balance analysis it is often estimated with
    atomic cooling functions; for an optically thin plasma a common local form is
    $p_\mathrm{rad} \approx n_e \sum_z n_z L_z(T_e,n_e,\ldots)$, where $n_e$ is electron
    density in m$^{-3}$, $n_z$ is the density of radiating species or charge state
    $z$ in m$^{-3}$, $T_e$ is electron temperature, and $L_z$ has units W m$^3$.


    Typical values span many orders of magnitude: hot-core bremsstrahlung and light-impurity
    emission are often 10^3-10^6 W m^-3, while radiating edge regions, impurity-seeded
    plasmas, or disruption-mitigation scenarios can reach 10^5-10^8 W m^-3 locally.
    Exact values depend strongly on density, temperature, impurity concentration,
    charge-state distribution, and optical thickness.


    Sign convention: Positive when radiative emission removes energy from the plasma.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:disruption/profiles_1d/power_density_radiative_losses
    dd_path: disruption/profiles_1d/power_density_radiative_losses
    status: composed
- name: power_density_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Radiative power density from plasma soft X-ray emission received per
    unit active detector surface area, integrated over photon-energy bands transmitted
    by filters and windows and weighted by the detector spectral response.
  documentation: 'Power density of a soft X-ray detector is the radiant power from
    plasma soft X-ray emission received per unit active detector surface area. The
    received power is limited to the photon-energy band or bands passed by the filter/window
    assembly and by the detector spectral response, so it is a band- and response-weighted
    irradiance rather than an intrinsic plasma emissivity.


    The area-normalized received power is defined by


    $$

    q_\mathrm{SXR} = \frac{P_\mathrm{SXR}}{A_\mathrm{act}}

    $$


    where $q_\mathrm{SXR}$ is the detector power density in W m$^{-2}$, $P_\mathrm{SXR}$
    is the response-weighted soft X-ray power in W accepted by the detector, and $A_\mathrm{act}$
    is the active detector surface area in m$^2$. The energy integration implicit
    in $P_\mathrm{SXR}$ includes the selected photon-energy band, filter and window
    transmission, and detector spectral responsivity.


    In practice this quantity is inferred from calibrated detector current, voltage,
    or count-rate signals after accounting for dark offsets, electronic gain, active
    area, and spectral responsivity. It is the active-area normalization of [power_of_soft_xray_detector](name:power_of_soft_xray_detector).
    Relations to [spectral_radiance_of_soft_xray_detector](name:spectral_radiance_of_soft_xray_detector)
    or [brightness_of_soft_xray_detector](name:brightness_of_soft_xray_detector) additionally
    require viewing geometry, etendue or solid angle, spectral transmission, and photon-energy
    weighting; solid-angle normalization alone is not sufficient. The incident direction
    is into the active detector surface from the plasma-facing side, and outward emission
    or reflection from the detector is not part of the received-power density.


    Typical magnitudes vary strongly with aperture, filter thickness, line of sight,
    plasma temperature, and impurity content. Heavily filtered or edge-dominated channels
    may measure about 10^-6-10^-3 W m^-2, while core-viewing channels in hot tokamak
    plasmas commonly lie around 10^-3-10^1 W m^-2; intense transient events can approach
    10^2 W m^-2 before detector saturation or attenuation limits are reached.'
  unit: W.m^-2
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_of_soft_xray_detector
  - name:brightness_of_soft_xray_detector
  sources:
  - id: dd:soft_x_rays/channel/power_density
    dd_path: soft_x_rays/channel/power_density
    status: composed
- name: radiance_at_spectral_line
  kind: scalar
  status: draft
  description: 'Photon radiance of an identified spectral emission line: photon rate
    per unit area perpendicular to the viewing direction and per unit solid angle,
    integrated over the wavelength interval assigned to the line.'
  documentation: 'Radiance at a spectral line is the wavelength-integrated spectral
    photon radiance associated with one identified emission line. It characterizes
    photon number reaching an observer per unit area perpendicular to the viewing
    direction and per unit solid angle, not total emitted power or energy radiance.


    Let $I_\lambda(\lambda)$ be the calibrated spectral photon radiance. The line
    radiance $L_\mathrm{line}$ is defined by integrating the continuum-subtracted
    spectral radiance over the wavelength window assigned to the line:


    $$

    L_\mathrm{line} = \int_{\lambda_1}^{\lambda_2} \left[I_\lambda(\lambda) - I_{\lambda,\mathrm{bg}}(\lambda)\right]
    \, d\lambda

    $$


    where $L_\mathrm{line}$ has units m$^{-2}$ s$^{-1}$ sr$^{-1}$, $\lambda$ is wavelength
    in meters, $\lambda_1$ and $\lambda_2$ are the endpoints of the integration window
    with $\Delta\lambda=\lambda_2-\lambda_1$ in meters, and $I_\lambda$ and $I_{\lambda,\mathrm{bg}}$
    have units m$^{-2}$ s$^{-1}$ sr$^{-1}$ m$^{-1}$. The window is chosen to contain
    the instrumental and physical line shape while excluding neighboring lines as
    far as possible; the background term represents continuum emission, stray light,
    dark signal, or other slowly varying contributions estimated from adjacent wavelengths
    or from a simultaneous fit. For a gross line integral, the same expression applies
    with $I_{\lambda,\mathrm{bg}}=0$.


    In practice, line radiance is obtained from calibrated spectroscopic measurements.
    A [spectral calibration factor](name:spectral_calibration_factor_of_spectrometer)
    $K_\lambda(\lambda)$ converts wavelength-resolved detector signal $C_\lambda(\lambda)$,
    after subtraction of detector background $C_{\lambda,\mathrm{bg}}(\lambda)$, to
    spectral photon radiance; the corresponding practical relation is $L_\mathrm{line}=\int_{\lambda_1}^{\lambda_2}
    K_\lambda(\lambda)[C_\lambda(\lambda)-C_{\lambda,\mathrm{bg}}(\lambda)]\,d\lambda$
    over the same line window. Grating spectrometers, filter spectrometers, and charge-exchange
    recombination spectroscopy systems use this quantity for emission-line strengths;
    inference of densities, effective charge, or radiated power requires additional
    atomic-physics and viewing-geometry modeling.


    The wavelength-resolved quantity underlying the integral is related to [spectral
    flux], while [flux at spectral line](name:spectral_flux_of_spectrometer_channel)
    is the corresponding line-integrated photon-flux analog before radiance normalization
    or absolute radiance calibration. [Brightness of visible camera](name:brightness_of_visible_camera)
    is a broadband radiance analog integrated over a camera passband rather than over
    a single identified line.


    Typical visible and near-ultraviolet line radiances in magnetically confined plasmas
    span about $10^{16}$-$10^{21}$ m$^{-2}$ s$^{-1}$ sr$^{-1}$ for weak-to-strong
    steady emission. Bright edge events or active beam and charge-exchange lines can
    approach $10^{22}$ m$^{-2}$ s$^{-1}$ sr$^{-1}$, with values depending strongly
    on species, charge state, electron temperature and density, path length, neutral-beam
    density for active measurements, and optical passband.'
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_calibration_factor_of_spectrometer
  - name:spectral_flux_of_spectrometer_channel
  - name:brightness_of_visible_camera
  sources:
