  documentation: "Carbon density at the pedestal is the local number density of carbon\
    \ ions at the top of the H-mode edge transport barrier, summed over all ionization\
    \ stages from C$^{1+}$ through fully stripped C$^{6+}$ unless a specific charge\
    \ state is designated. The pedestal top is the radial position where the steep\
    \ edge density gradient transitions to the flatter confined core plasma, as generalized\
    \ by [density_at_pedestal_top](name:density_at_pedestal_top).\n\nCarbon ($Z =\
    \ 6$) is a low-$Z$ impurity species commonly introduced through plasma-facing\
    \ component erosion or deliberate radiative seeding. The total carbon ion density\
    \ aggregates all ionization stages:\n\n$$\nn_\\mathrm{C} = \\sum_{k=1}^{6} n_{\\\
    mathrm{C}^{k+}}\n$$\n\nwhere $n_{\\mathrm{C}^{k+}}$ is the number density of carbon\
    \ ions in charge state $k$.\n\nAt the pedestal top of H-mode plasmas, carbon densities\
    \ typically range from $10^{15}$ to $10^{18}$ m$^{-3}$, with relative concentrations\
    \ of $10^{-4}$\u2013$10^{-2}$ of the local electron density depending on wall\
    \ material composition and gas-seeding conditions. The quantity is inferred from\
    \ charge-exchange recombination spectroscopy or passive carbon line emission spectroscopy\
    \ combined with impurity transport modeling. The total elemental carbon density\
    \ across the confined plasma is described by [carbon_density](name:carbon_density),\
    \ while [ion_density_at_pedestal_top](name:ion_density_at_pedestal_top) and [total_ion_density_at_pedestal_top](name:total_ion_density_at_pedestal_top)\
    \ give the broader ion population context at the same locus."
  unit: m^-3
