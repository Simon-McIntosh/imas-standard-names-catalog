- name: accumulated_oxygen_prefill_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative oxygen gas introduced during the prefill phase by gas injection,
    expressed as an equivalent-electron count where each oxygen atom contributes 8
    count units equal to its atomic number.
  documentation: 'The prefill phase precedes plasma breakdown, during which controlled
    gas injection establishes an initial neutral gas background in the vessel. This
    quantity accumulates the total oxygen inventory delivered during that phase, representing
    each oxygen atom as 8 equivalent electrons equal to the atomic number $Z_\mathrm{O}
    = 8$.


    The equivalent-electron inventory is defined as:


    $$

    N_\mathrm{eq} = Z_\mathrm{O} \cdot N_\mathrm{O}

    $$


    where $N_\mathrm{O}$ is the total number of oxygen atoms injected during the prefill
    interval and $Z_\mathrm{O} = 8$ is the atomic number of oxygen.


    The count is inferred from calibrated gas injection valve records integrated over
    the prefill interval, from the start of the prefill phase through plasma breakdown.
    It is the accumulated component of oxygen_prefill_count_due_to_gas_injection and
    follows the same equivalent-electron convention applied to helium-3 in [accumulated_helium_3_prefill_count_due_to_gas_injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    and to lithium in [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection).
    Post-breakdown oxygen injection is tracked separately by [oxygen_count](name:accumulated_oxygen_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_prefill_count_due_to_gas_injection
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  - name:accumulated_oxygen_count_due_to_gas_injection
  sources:
