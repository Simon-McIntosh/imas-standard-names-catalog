- name: per_toroidal_mode_thermal_ion_absorbed_wave_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged absorbed RF power density on thermal ions resolved
    by toroidal mode number.
  documentation: 'The absorbed wave power density per unit volume on the thermal ion
    population, Fourier-decomposed in the toroidal direction. This quantity represents
    the volumetric power deposition $P_{\mathrm{th},i}(n_\phi)$ per toroidal mode
    number $n_\phi$, where $n_\phi$ is the toroidal mode number of the coherent wave.
    The total absorbed power density on thermal ions is obtained by summing over toroidal
    modes: $P_{\mathrm{th},i}^{\mathrm{total}} = \sum_{n_\phi} P_{\mathrm{th},i}(n_\phi)$.
    Typical values in ICRF-heated tokamak plasmas range from $0.1\, \mathrm{MW\, m^{-3}}$
    in the core to $<0.01\, \mathrm{MW\, m^{-3}}$ at the edge, depending on the wave
    spectrum and plasma parameters. This quantity is commonly computed by full-wave
    or ray-tracing codes (e.g., TORIC, AORSA, GENRAY) that model RF wave propagation
    and damping in toroidal geometry. See also [per_toroidal_mode_thermal_electron_absorbed_wave_power_density](name:per_toroidal_mode_thermal_electron_absorbed_wave_power_density)
    for the electron counterpart, and [fast_ion_absorbed_wave_power_density](name:fast_ion_absorbed_wave_power_density)
    for the fast-ion contribution without toroidal mode resolution.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
