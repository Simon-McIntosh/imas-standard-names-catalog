- name: poloidal_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: active
  description: "Poloidal component of the electric current density driven by frictional\
    \ momentum exchange between plasma ions and neutral particles in a partially ionized\
    \ plasma, resolved along increasing poloidal angle in flux coordinates (\u03C1\
    , \u03B8, \u03C6)."
  documentation: 'Poloidal current density due to ion-neutral friction is the poloidal
    projection of [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction),
    produced by collisional momentum exchange between plasma ions and neutral atoms
    or molecules. It is resolved along increasing poloidal angle on a surface of constant
    rho in flux coordinates (rho, theta, phi), and is distinct from [poloidal_current_density_due_to_collisions](name:poloidal_current_density_due_to_collisions),
    which has a broader collision attribution.


    The defining projection is


    $$

    j_{\mathrm{in},\theta} = \mathbf{j}_{\mathrm{in}} \cdot \hat{\mathbf{e}}_{\theta}

    $$


    where $j_{\mathrm{in},\theta}$ is the poloidal component, $\mathbf{j}_{\mathrm{in}}$
    is the full ion-neutral-friction current-density vector, and $\hat{\mathbf{e}}_{\theta}$
    is the unit vector tangent to the flux surface in the direction of increasing
    poloidal angle $\theta$.


    Only the contribution attributable to ion-neutral friction is included; contributions
    from other collisional processes are excluded.


    Sign convention: Positive when the ion-neutral-friction current points in the
    direction of increasing poloidal angle $\theta$ in flux coordinates $(\rho, \theta,
    \phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:poloidal_current_density_due_to_collisions
  arguments:
