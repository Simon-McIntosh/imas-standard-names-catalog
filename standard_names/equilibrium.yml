- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Equilibrium poloidal magnetic flux on the last closed flux surface,
    setting the outer flux reference for plasma-boundary geometry.
  documentation: 'Poloidal magnetic flux at the plasma boundary is the value of the
    equilibrium flux function on the last closed flux surface or selected separatrix.
    It provides the outer reference paired with [poloidal magnetic flux at the magnetic
    axis](name:poloidal_magnetic_flux_at_magnetic_axis) for labeling nested flux surfaces
    and defining the boundary value used by the [normalized poloidal flux coordinate
    of the plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary).


    In an axisymmetric equilibrium, the boundary value can be represented in the right-handed
    cylindrical $(R, \phi, Z)$ frame by integrating the vertical magnetic field over
    a horizontal disk whose rim intersects the selected boundary point:


    $$

    \psi_b = \int_0^{R_b} B_Z(R'', Z_b)\,2\pi R''\,dR''

    $$


    where $\psi_b$ is the boundary poloidal magnetic flux, $R_b$ and $Z_b$ locate
    the boundary point, and $B_Z$ is the vertical magnetic-field component. The same
    boundary surface is geometrically related to quantities such as [area of plasma
    boundary](name:area_of_plasma_boundary), while [toroidal magnetic flux at the
    plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary) gives the complementary
    flux through the poloidal cross-section.


    This quantity is obtained from equilibrium reconstruction constrained by external
    magnetic probes, flux loops, plasma current, pressure constraints, and internal
    magnetic measurements when available. Representative absolute magnitudes are about
    1-20 Wb in medium-size and large tokamaks, with larger values for higher plasma
    current and larger machine size; the difference between axis and boundary values
    is often more physically relevant than the absolute offset.


    Sign convention: Positive when the vertical magnetic field $B_Z$ threading the
    integration disk points in the $+Z$ direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  - name:area_of_plasma_boundary
