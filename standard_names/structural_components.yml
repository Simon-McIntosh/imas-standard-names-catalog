- name: upper_thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Upper thickness of a breeder blanket module is the non-negative projected
    separation between the module's upper exterior end boundary and the interface
    where the upper cap joins the main module body, measured along the specified upper-cap
    thickness direction. It characterizes the geometric thickness of the upper end
    cap.
  documentation: 'Upper thickness of a breeder blanket module is the geometric thickness
    of the upper cap that closes the module at its upper end. The reference surfaces
    are the upper exterior end boundary of the cap and the cap-to-module interface
    where the cap joins the main blanket body; the thickness is measured as a projected
    separation along the specified upper-cap thickness direction, not as an arbitrary
    point-to-point distance between inner and outer surfaces.


    For a local cap-thickness direction $\hat{\mathbf{n}}_\mathrm{u}$, the projected
    thickness is


    $$

    t_\mathrm{u} = \left|\left(\mathbf{x}_\mathrm{end} - \mathbf{x}_\mathrm{int}\right)
    \cdot \hat{\mathbf{n}}_\mathrm{u}\right|

    $$


    where $t_\mathrm{u}$ is the upper cap thickness, $\mathbf{x}_\mathrm{end}$ is
    a point on the upper exterior end boundary, $\mathbf{x}_\mathrm{int}$ is the corresponding
    point on the cap-to-module interface, and $\hat{\mathbf{n}}_\mathrm{u}$ is the
    unit direction used to define the upper-cap thickness. The absolute value reflects
    that this scalar is a non-negative length.


    In engineering definitions the value is taken from the module geometry or design
    specification. For a tapered or spatially varying upper cap, the scalar denotes
    the specified nominal projected thickness, commonly the representative average
    over the cap region or the value at the design reference section; local maxima,
    minima, and detailed shape variations are separate geometric information.


    This quantity is related to the overall [breeder blanket module thickness](name:thickness_of_breeder_blanket_module),
    to the analogous [lower cap thickness](name:lower_thickness_of_breeder_blanket_module),
    and to individual [breeder blanket layer thicknesses](name:thickness_of_breeder_blanket_layer).
    It is reported in meters and is design-specific; no universal device-independent
    numerical range is implied.'
  unit: m
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio_of_breeder_blanket_module
  - name:thickness_of_breeder_blanket_module
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: upper
    operator_kind: qualifier
  sources:
