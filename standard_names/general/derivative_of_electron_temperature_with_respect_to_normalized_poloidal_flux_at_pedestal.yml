name: derivative_of_electron_temperature_with_respect_to_normalized_poloidal_flux_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Gradient of electron temperature with respect to normalized poloidal
  flux evaluated in the pedestal region, characterizing the steepness of the $T_e$
  edge barrier.
documentation: "The quantity $(dT_e/d\\psi_N)_{\\rm ped}$ measures the rate of change\
  \ of the electron temperature $T_e$ (eV) per unit of normalized poloidal flux $\\\
  psi_N$ at the pedestal location. In the pedestal region ($\\psi_N \\approx 0.9$\u2013\
  1.0), the electron temperature drops steeply from the pedestal-top value to the\
  \ separatrix value over a narrow $\\Delta\\psi_N$ width; this gradient is a fundamental\
  \ input to MHD stability analysis (peeling\u2013ballooning boundary). Typical magnitudes\
  \ range from $10^3$ to $10^5$ eV per unit $\\psi_N$ in H-mode tokamak plasmas. Derived\
  \ from linear or mtanh fits to edge Thomson scattering data; the pedestal location\
  \ is identified as the inflection point or the specified fit reference. See also\
  \ `maximum_of_derivative_of_electron_temperature_with_respect_to_normalized_poloidal_flux`\
  \ for the peak gradient and `electron_temperature_at_plasma_boundary` for the boundary\
  \ value."
