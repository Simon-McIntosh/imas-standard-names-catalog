- name: voltage_of_mass_spectrometer
  kind: scalar
  status: active
  description: Detector bias voltage of a mass spectrometer is the potential difference
    applied between the detector electrode or electron-multiplying stage and its bias
    reference, setting collection efficiency or gain for ion-current measurement.
    It is a device-level setting; voltage_of_mass_spectrometer_channel denotes a channel-specific
    detector bias.
  documentation: 'The detector bias voltage of a mass spectrometer is the electrical
    potential difference applied by the detector bias circuit to the detector electrode
    or electron-multiplying detector stage. It sets the electric-field conditions
    that affect ion collection efficiency and detector gain for converting mass-selected
    ions into a measured current or pulse signal. This is a device-level detector
    setting, distinct from the channel-specific [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel).


    With a specified bias reference node, the detector bias voltage is defined as
    the detector bias-node potential relative to that reference:


    $$

    V_\mathrm{det} = \Phi_\mathrm{det} - \Phi_\mathrm{ref}

    $$


    where $\Phi_\mathrm{det}$ is the electric potential of the detector electrode
    or detector-stage bias node, and $\Phi_\mathrm{ref}$ is the potential of the reference
    node chosen by the detector bias circuit, such as the supply return, detector
    housing, or another designated electrode.


    The value is normally set and monitored by the detector high-voltage or bias supply
    and is interpreted together with detector calibration, gain setting, and measured
    [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel).
    In operation it is chosen to provide adequate sensitivity for the expected ion
    flux while avoiding detector overloading or operation outside the rated bias range.


    Representative setpoints are strongly instrument- and detector-dependent: an unbiased
    or disabled detector may be near 0 V, while high-voltage electron-multiplying
    detector stages commonly use hundreds of volts to a few kilovolts. The allowable
    range should be interpreted from the detector and power-supply ratings rather
    than from a universal physical limit.


    Sign convention: Positive when the detector electrode or detector-stage bias node
    is at a higher electric potential than the bias reference node.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:voltage_of_mass_spectrometer_channel
  - name:ion_current_of_mass_spectrometer_channel
  sources:
  - dd_path: spectrometer_mass/detector_voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_mass.html#spectrometer_mass-detector_voltage
    dd_documentation:
      leaf: Voltage applied on the microchannel plate detector
      data_type: FLT_0D
      unit: V
    enhanced_context:
      description: Bias voltage applied to the detector (e.g., microchannel plate)
        of the mass spectrometer, controlling detector gain for ion current measurement.
      kind: llm
- name: voltage_of_mass_spectrometer_channel
  kind: scalar
  status: active
  description: Voltage of mass spectrometer channel is the signed detector-bias potential
    difference between the electron-multiplying detector electrode of one mass-discriminated
    channel and that channel's electronics reference. It establishes the channel-specific
    ion-signal gain.
  documentation: 'Voltage of mass spectrometer channel is the signed detector-bias
    potential difference between the electron-multiplying detector electrode assigned
    to one mass-discriminated channel and that channel''s electronics reference. It
    sets the channel-specific detector gain that converts collected ions into an electron
    signal.


    The channel bias voltage is defined by the electrode potential difference:


    $$

    V_\mathrm{ch} = \Phi_{\mathrm{det},\mathrm{ch}} - \Phi_{\mathrm{ref},\mathrm{ch}}

    $$


    where $V_\mathrm{ch}$ is the channel voltage, $\Phi_{\mathrm{det},\mathrm{ch}}$
    is the electric potential of the biased detector electrode, and $\Phi_{\mathrm{ref},\mathrm{ch}}$
    is the electric potential of the electronics reference for the same channel.


    This quantity is channel-specific and excludes the instrument-level detector bias
    [voltage_of_mass_spectrometer](name:voltage_of_mass_spectrometer). It also excludes
    the resulting signal [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel),
    which denotes the channel ion current rather than the applied detector potential
    difference.


    Sign convention: Positive when the detector-bias electrode of the channel is at
    a higher electric potential than the channel''s electronics reference.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_current_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer
  sources:
  - dd_path: spectrometer_mass/channel/photomultiplier_voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_mass.html#spectrometer_mass-channel-photomultiplier_voltage
    dd_documentation:
      leaf: Voltage applied to the photomultiplier
      parent_path: spectrometer_mass/channel
      parent: Set of mass channels, each corresponding to a given atomic mass measured
        continuously by the spectrometer
      data_type: FLT_1D
      unit: V
      coordinates:
      - spectrometer_mass/channel/time
    enhanced_context:
      description: Voltage applied to the photomultiplier detector of a mass spectrometer
        channel. An instrumental operating parameter that sets the detector gain for
        ion current measurement in residual gas analysis.
      kind: llm
- name: voltage_of_temperature_sensor
  kind: scalar
  status: active
  description: Electrical potential difference produced by a temperature sensor associated
    with a neutron-detector module and referenced to the sensor electronics return.
  documentation: 'This quantity is the electrical potential difference delivered by
    a temperature sensor thermally associated with a neutron-detector module. It is
    the sensor signal associated with the module''s thermal state, distinct from the
    detector temperature itself and from a commanded detector bias.


    The sensor voltage is defined by


    $$

    V_s = \phi_s - \phi_{\mathrm{ref}}

    $$


    where $V_s$ is the sensor output voltage, $\phi_s$ is the electric potential of
    the sensor signal terminal, and $\phi_{\mathrm{ref}}$ is the potential of the
    designated electronics reference; $V_s$ is expressed in volts.


    This quantity represents the sensor''s electrical output and is not a calibrated
    value of [temperature of neutron detector](name:temperature_of_neutron_detector)
    or the applied bias represented by [requested voltage of neutron detector](name:requested_voltage_of_neutron_detector).


    Sign convention: Positive when the sensor signal terminal is at higher electric
    potential than the designated electronics reference.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:temperature_of_neutron_detector
  - name:requested_voltage_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/temperature_sensor/amplitude
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-temperature_sensor-amplitude
    dd_documentation:
      leaf: Generated signal amplitude
      parent_path: neutron_diagnostic/detector/temperature_sensor
      parent: Temperature sensor
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Generated signal amplitude from the temperature sensor associated
        with a neutron detector assembly. Records the voltage output used to monitor
        the detector's thermal environment during neutron measurements.
      kind: llm
- name: wave_beam_energy
  kind: scalar
  status: active
  description: Wave-beam energy is the pulse integral of the cycle-averaged electromagnetic
    energy-flow rate transported by a coherent wave beam through a specified oriented
    transverse surface at a specified position along its propagation path. It excludes
    energy absorbed or deposited before reaching that surface.
  documentation: 'Wave-beam energy is the pulse-integrated cycle-averaged electromagnetic
    energy transported by a coherent wave beam through a specified oriented transverse
    surface at a specified position along its propagation path. Cycle averaging is
    over the carrier oscillation; the pulse envelope time dependence is retained until
    integration over the pulse interval.


    The defining relation to wave-beam power is:


    $$

    E_\mathrm{beam}(s) = \int_{t_1}^{t_2} P_\mathrm{beam}(s,t)\,dt

    $$


    where $E_\mathrm{beam}(s)$ has unit $\mathrm{J}$, $P_\mathrm{beam}(s,t)$ is [wave-beam
    power](name:power_of_wave_beam) through the same oriented surface and has unit
    $\mathrm{W}$, $t$, $t_1$, and $t_2$ have unit $\mathrm{s}$ and bound the pulse
    interval, and $s$ labels position along the beam centerline and has unit $\mathrm{m}$.


    This quantity is distinct from [wave-beam power](name:power_of_wave_beam), which
    is an energy-flow rate rather than its pulse integral. It also differs from [power
    of beam-tracing beam](name:power_of_beam_tracing_beam), which denotes residual
    power at the endpoint of a traced beam trajectory rather than the general pulse-integrated
    energy through an arbitrary beam cross-section.'
  unit: J
  physics_domain: particle_measurement_diagnostics
  links:
  - name:power_of_beam_tracing_beam
  - name:wave_beam_energy_at_launching_position
  sources:
  - dd_path: thomson_scattering/laser/energy_out
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/thomson_scattering.html#thomson_scattering-laser-energy_out
    dd_documentation:
      leaf: Energy of the laser pulse measured after crossing the plasma
      parent_path: thomson_scattering/laser
      parent: Set of probing lasers
      data_type: STRUCTURE
      unit: J
    enhanced_context:
      description: Energy of the Thomson scattering laser pulse measured after crossing
        the plasma. Used to quantify laser attenuation through the plasma for absolute
        calibration of the scattered signal intensity.
      kind: llm
- name: wave_beam_energy_at_launching_position
  kind: scalar
  status: active
  description: Total electromagnetic energy carried by a coherent wave-beam pulse
    at its launching position, before interaction with plasma or another target medium.
  documentation: 'Total electromagnetic energy carried by a coherent wave-beam pulse
    at its launching position is the pulse-integrated electromagnetic energy crossing
    the launch reference surface before absorption, scattering, or other interaction
    with plasma or another target medium. It is a nonnegative energy for a single
    launched pulse.


    The launch-position wave-beam energy is defined as the time integral of the incident
    beam power at that surface over the pulse interval:


    $$

    E_\mathrm{inc} = \int_{t_1}^{t_2} P_\mathrm{inc}(t)\,dt

    $$


    where $E_\mathrm{inc}$ is the launch-position wave-beam energy in J, $P_\mathrm{inc}(t)$
    is the instantaneous wave-beam power crossing the launch reference surface in
    W, and $t_1$ and $t_2$ are the pulse start and end times in s.


    This quantity is the launch-position specialization of [wave_beam_energy](name:wave_beam_energy).
    For a coherent wave-beam pulse at the launch reference surface, it has the same
    physical identity as [energy_at_launching_position](name:energy_at_launching_position);
    it excludes energy lost or gained after the launch reference surface and is not
    an additional component of that quantity.'
  unit: J
  physics_domain: particle_measurement_diagnostics
  links:
  - name:energy_at_launching_position
  arguments:
  - name: energy_at_launching_position
    operator: wave_beam
    operator_kind: qualifier
  sources:
  - dd_path: thomson_scattering/laser/energy_in
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/thomson_scattering.html#thomson_scattering-laser-energy_in
    dd_documentation:
      leaf: Energy of the laser pulse measured just before entering the vacuum vessel
      parent_path: thomson_scattering/laser
      parent: Set of probing lasers
      data_type: STRUCTURE
      unit: J
    enhanced_context:
      description: Energy of the Thomson scattering laser pulse measured just before
        entering the vacuum vessel. Used to monitor the incident laser energy for
        absolute calibration of scattered signal intensities.
      kind: llm
- name: wavelength
  kind: scalar
  status: active
  description: Vacuum electromagnetic wavelength specifying a wave period, a spectral
    transition, or a characteristic point on an optical response.
  documentation: 'Vacuum electromagnetic wavelength is the spatial period of an electromagnetic
    wave in vacuum and the spectral coordinate associated with a transition or optical
    response. It may characterize a propagating beam, an unshifted spectral line,
    or a selected point in an instrument response.


    $$

    \lambda_0 = \frac{c}{\nu_0} = \frac{2\pi}{\lvert \mathbf{k}_0 \rvert}

    $$


    where $\lambda_0$ is vacuum wavelength, $c$ is the speed of light in vacuum in
    m s$^{-1}$, $\nu_0$ is temporal frequency in s$^{-1}$, and $\mathbf{k}_0$ is the
    vacuum wave vector in m$^{-1}$. The shared quantity includes characteristic response
    wavelengths such as those of a [spectrometer channel](name:wavelength_of_spectrometer_channel),
    a [detector pixel](name:wavelength_of_detector_pixel), or an [optical element](name:spectral_wavelength_of_optical_element),
    as well as the rest-frame wavelength of a [spectral line](name:wavelength_of_spectral_line).
    It excludes in-medium wavelength unless that quantity is explicitly defined through
    a separate medium-dependent convention.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:wavelength_of_spectrometer_channel
  - name:wavelength_of_detector_pixel
  - name:spectral_wavelength_of_optical_element
  - name:wavelength_of_spectral_line
  sources:
