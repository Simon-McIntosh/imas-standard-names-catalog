- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Poloidal magnetic flux, the scalar flux-surface label defined by integrating
    the poloidal magnetic field over a toroidal cross-section delimited by the flux
    surface.
  documentation: "Poloidal magnetic flux $\\psi$ is a fundamental flux-surface label\
    \ in 2D axisymmetric equilibrium, defined for a flux surface enclosing the magnetic\
    \ axis as the flux of the magnetic field through a toroidal cross-section bounded\
    \ by that surface. Together with the toroidal magnetic flux $\\Phi$, it completes\
    \ the magnetic-flux description of the equilibrium, and its gradient $\\nabla\
    \ \\psi$ defines the poloidal magnetic field $\\mathbf{B}_\\mathrm{pol} = \\nabla\
    \ \\phi \\times \\nabla \\psi / (2\\pi)$, where $\\phi$ is the toroidal angle.\
    \ The poloidal flux decreases monotonically from the magnetic axis to the separatrix\
    \ in a conventional tokamak, with typical separatrix values of 5\u201320 Wb in\
    \ medium-size devices. It serves as a radial coordinate for profiles of plasma\
    \ quantities (density, temperature, safety factor) and is reconstructed from external\
    \ magnetic measurements combined with equilibrium codes. The safety factor $q\
    \ = d\\Phi/d\\psi$ is the local helicity of magnetic field lines, directly linking\
    \ $\\psi$ to MHD stability. See the parent quantity [magnetic_flux](name:magnetic_flux)\
    \ and the sibling [toroidal_magnetic_flux](name:toroidal_magnetic_flux), as well\
    \ as the spatially localized [poloidal_magnetic_flux_at_internal_transport_barrier](name:poloidal_magnetic_flux_at_internal_transport_barrier).\n\
    \nSign convention: Positive when the poloidal magnetic field lines are oriented\
    \ to give a diamagnetic plasma response for a positive toroidal plasma current.\n\
    \nTypical core values range from 0 Wb at the magnetic axis to 5\u201320 Wb at\
    \ the separatrix in diverted tokamaks such as JET and DIII-D, scaling with the\
    \ plasma current and major radius."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux
  - name:toroidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_internal_transport_barrier
