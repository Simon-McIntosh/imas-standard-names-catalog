- name: toroidal_flux_surface_averaged_deuterium_tritium_velocity
  kind: scalar
  status: draft
  description: "Flux-surface average of the local contravariant toroidal bulk-flow\
    \ component of a modeled deuterium-tritium composite ion species with mass 2.5\
    \ amu. The component is defined in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame, and positive values point toward increasing toroidal angle \u03C6."
  documentation: "Toroidal flux-surface averaged deuterium-tritium velocity is the\
    \ flux-surface average of the local contravariant toroidal bulk-flow component\
    \ of a modeled DT composite ion species. The composite species represents deuterium\
    \ and tritium as one ion fluid with effective mass 2.5 amu, and the toroidal component\
    \ is the signed component in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height.\
    \ The quantity has dimensions of velocity, with unit m.s^-1.\n\nThe flux-surface\
    \ average can be written as\n\n$$\n\\langle v_{\\phi,\\mathrm{DT}} \\rangle_\\\
    psi = \\frac{\\oint_{\\psi=\\mathrm{const}} v_{\\phi,\\mathrm{DT}} \\, d\\ell\
    \ / B_p}{\\oint_{\\psi=\\mathrm{const}} d\\ell / B_p}\n$$\n\nwhere $v_{\\phi,\\\
    mathrm{DT}}$ is the local DT toroidal velocity component in m.s^-1, associated\
    \ with the $\\hat{\\phi}$ direction in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame; $B_p$ is the poloidal magnetic-field magnitude; and $d\\ell$ is the\
    \ non-negative arc-length element along the closed poloidal contour of the flux\
    \ surface. The contour orientation does not enter this scalar average because\
    \ the weighting uses $d\\ell$ and the magnitude $B_p$. Here \u201Ctoroidal\u201D\
    \ identifies the local $\\phi$ component of the bulk-flow vector, not a projection\
    \ of motion in a poloidal cross-section.\n\nFor the composite DT species, the\
    \ value is most often computed or inferred in a single-ion-fluid representation\
    \ of the fuel mixture. Spectroscopic or charge-exchange measurements can constrain\
    \ the underlying ion-flow physics, but comparison with this composite velocity\
    \ normally requires the model assumption that maps separate species flows to the\
    \ 2.5 amu DT fluid. The same 2.5 amu convention applies to DT quantities on any\
    \ selected flux surface, including a plasma-boundary flux surface; the selected\
    \ surface changes the averaging domain, not the composite-species definition.\
    \ This quantity is the toroidal component of flux_surface_averaged_deuterium_tritium_velocity\
    \ and uses the same composite-species convention as [flux_surface_averaged_deuterium_tritium_density](name:flux_surface_averaged_deuterium_tritium_density).\
    \ Related toroidal velocity quantities include [toroidal_ion_velocity](name:toroidal_ion_velocity),\
    \ [toroidal_deuterium_velocity_at_magnetic_axis](name:toroidal_deuterium_velocity_at_magnetic_axis),\
    \ and [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary).\n\
    \nIn edge and near-boundary tokamak conditions, flux-surface averaged toroidal\
    \ ion-flow magnitudes are commonly 10^3-10^5 m.s^-1. Values can be near zero or\
    \ change sign when momentum input, radial electric-field shear, collisionality,\
    \ or neoclassical and turbulent transport alter the balance of toroidal momentum.\n\
    \nSign convention: Positive when the averaged DT toroidal bulk-flow component\
    \ points in the direction of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_deuterium_tritium_density
  - name:toroidal_ion_velocity
  - name:toroidal_deuterium_velocity_at_magnetic_axis
  - name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of deuterium ion bulk-flow\
    \ velocity at the plasma boundary in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame, where R is major radius and Z is vertical height."
  documentation: 'This quantity is the flux-surface average, on the plasma boundary
    or separatrix, of the deuterium ion bulk-flow velocity component in the toroidal
    direction. The toroidal component is the projection of the deuterium flow velocity
    onto $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    represents the net boundary toroidal rotation of the deuterium ion population
    after poloidal variation around the boundary surface has been averaged out.


    A compact definition is:


    $$

    V_{\phi,D}^{\mathrm{FS},b} = \left\langle v_{\phi,D} \right\rangle_{\psi=\psi_b}

    $$


    where $V_{\phi,D}^{\mathrm{FS},b}$ is the boundary flux-surface-averaged deuterium
    toroidal velocity in m.s^-1, $v_{\phi,D}$ is the local deuterium toroidal bulk-flow
    velocity in m.s^-1, $\psi_b$ is the poloidal magnetic-flux value at the plasma
    boundary, and $\langle\cdot\rangle_{\psi=\psi_b}$ denotes the flux-surface average
    over that boundary surface.


    Experimentally, this quantity may be inferred from spectroscopic measurements
    of deuterium flow near the separatrix, combined with magnetic-equilibrium geometry
    to map local measurements to the boundary surface. In transport modeling it is
    the boundary-surface representative value of deuterium toroidal rotation, distinct
    from the local [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary).
    It is directly comparable with species analogs such as [toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary](name:toroidal_helium_3_velocity_at_plasma_boundary),
    [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary),
    and [toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary).


    Representative edge values are strongly discharge-dependent and are often near
    zero to a few $10^4$ m.s^-1 in magnitude; stronger external momentum input or
    edge radial-electric-field shear can produce values of order $10^5$ m.s^-1. The
    signed value can be positive or negative depending on the direction of toroidal
    deuterium flow.


    Sign convention: Positive when the deuterium ion bulk flow is directed along $+\hat{\phi}$,
    the direction of increasing toroidal angle $\phi$, in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_helium_3_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_iron_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of the iron impurity ion bulk
    flow velocity at the plasma boundary (last closed flux surface).
  documentation: 'The toroidal component of the iron impurity bulk flow velocity,
    averaged over the magnetic flux surface coinciding with the plasma boundary, characterizes
    the net toroidal rotation of iron ions at the last closed flux surface. The flux-surface
    average eliminates poloidal asymmetries in the local velocity distribution, providing
    a single scalar representative of the toroidal impurity flow at the edge.


    The flux-surface average of a quantity $f$ on a given flux surface is defined
    as:


    $$

    \langle f \rangle = \frac{\oint f \, dl_p / B_p}{\oint dl_p / B_p}

    $$


    where $l_p$ is the poloidal arc length along the flux-surface contour and $B_p$
    is the poloidal magnetic field magnitude. Iron ($Z = 26$) is a high-$Z$ metallic
    impurity that enters the confined plasma through sputtering of plasma-facing components;
    its toroidal rotation at the boundary reflects edge momentum transport and neoclassical
    impurity flow physics.


    This quantity is measured via charge exchange recombination spectroscopy, exploiting
    Doppler shifts of iron charge-state emission lines recorded along multiple poloidal
    viewing chords; the flux-surface-averaged value is then reconstructed from multi-chord
    data. This name is directly analogous to boundary velocity names for lighter impurities
    such as [carbon](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    [argon](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary),
    and [neon](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary).
    Where poloidally resolved measurements are available, the local counterpart [toroidal
    iron velocity at the plasma boundary](name:toroidal_iron_velocity_at_plasma_boundary)
    provides additional information on poloidal asymmetries not captured by the flux-surface
    average.


    Sign convention: Positive when the iron ion velocity is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_iron_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the neon ion velocity\
    \ at the plasma boundary, in the right-handed cylindrical (R, \u03C6, Z) frame\
    \ where \u03C6 is the toroidal angle."
  documentation: 'The toroidal flux-surface-averaged neon velocity at the plasma boundary
    is the average, on the last closed flux surface, of the toroidal component of
    the neon ion flow velocity. The toroidal component is taken along $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a flux surface $S(\psi_b)$ at the boundary poloidal flux $\psi_b$, the flux-surface
    average is commonly defined by the surface-weighted limit from closed flux surfaces:


    $$

    \langle v_{\phi,\mathrm{Ne}} \rangle_{\psi_b} = \frac{\int_{S(\psi_b)} v_{\phi,\mathrm{Ne}}
    \, dA / |\nabla\psi|}{\int_{S(\psi_b)} dA / |\nabla\psi|}

    $$


    where $v_{\phi,\mathrm{Ne}}$ is the local toroidal neon ion velocity in $\mathrm{m.s^{-1}}$,
    $dA$ is a surface-area element in $\mathrm{m^2}$, $\psi$ is poloidal magnetic
    flux in Wb, and $|\nabla\psi|$ is the magnitude of its spatial gradient in $\mathrm{Wb.m^{-1}}$.


    In practice this quantity is inferred from impurity spectroscopy, such as Doppler
    shifts of neon emission or charge-exchange lines, combined with viewing-geometry
    corrections and an equilibrium mapping to the plasma boundary. When direct coverage
    of the full surface is unavailable, the average may be reconstructed from localized
    measurements with assumptions about toroidal symmetry, poloidal variation, and
    the relevant neon charge-state population. The same concept is analogous to species-resolved
    boundary toroidal velocities for deuterium and nitrogen.


    Typical separatrix impurity toroidal-flow magnitudes are about $10^3$-$5 \times
    10^4\ \mathrm{m.s^{-1}}$, with values near zero possible in weakly rotating plasmas
    and larger magnitudes in strongly driven or highly asymmetric edge conditions.


    Sign convention: Positive when the flux-surface-averaged neon ion flow is in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal bulk flow velocity of oxygen ions evaluated
    at the plasma boundary (last closed flux surface).
  documentation: 'The flux-surface-averaged toroidal velocity of oxygen ions at the
    plasma boundary quantifies the net toroidal bulk flow of oxygen impurities along
    the last closed flux surface (separatrix), collapsing the poloidal variation into
    a single representative scalar for the toroidal rotation state of oxygen at the
    plasma edge.


    The flux-surface average is defined as a poloidal-contour integral weighted by
    the inverse of the poloidal magnetic field magnitude $B_p$:


    $$

    \langle v_{\phi,\mathrm{O}} \rangle = \frac{\oint v_{\phi,\mathrm{O}} \, dl /
    B_p}{\oint dl / B_p}

    $$


    where $v_{\phi,\mathrm{O}}$ is the local toroidal oxygen ion velocity at poloidal
    arc-length position $l$ along the flux contour.


    Oxygen toroidal rotation is measured by charge exchange recombination spectroscopy
    (CXRS) using the Doppler shift of oxygen emission lines; combining measurements
    at multiple poloidal locations allows construction of the flux-surface average.
    The non-averaged local boundary value is given by [toroidal_oxygen_velocity_at_plasma_boundary](name:toroidal_oxygen_velocity_at_plasma_boundary),
    while analogous flux-surface-averaged toroidal velocities for other impurity species
    are given by [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary),
    and [toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary).


    Typical edge toroidal velocities for light impurities such as oxygen range from
    approximately $-2 \times 10^4$ to $+2 \times 10^4$ m/s, with sign and magnitude
    depending on plasma current direction, auxiliary heating power, and confinement
    mode.


    Sign convention: Positive when the oxygen ion bulk flow is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_oxygen_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
- name: toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of the tungsten impurity ion
    bulk flow velocity evaluated at the plasma boundary (last closed flux surface
    / separatrix).
  documentation: 'The flux-surface-averaged toroidal velocity of tungsten ions at
    the plasma boundary quantifies the mean toroidal rotation of the tungsten impurity
    species on the last closed flux surface, averaging out poloidal asymmetries that
    arise from neoclassical effects and centrifugal trapping. It differs from the
    local [toroidal tungsten velocity at the plasma boundary](name:toroidal_tungsten_velocity_at_plasma_boundary)
    by applying the flux-surface average operator, yielding a single representative
    scalar per flux surface rather than a position-dependent field along the separatrix.


    The flux-surface-averaged toroidal velocity is defined as:


    $$

    \langle v_\phi \rangle = \frac{\oint v_\phi \, dl / B_p}{\oint dl / B_p}

    $$


    where $v_\phi$ is the local toroidal component of the tungsten ion bulk flow,
    $B_p$ is the poloidal magnetic field magnitude, and the line integral runs along
    the plasma boundary flux surface in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    Tungsten boundary rotation is primarily inferred from charge exchange recombination
    spectroscopy (CXRS) using Doppler-shifted tungsten emission lines; local velocity
    measurements at multiple poloidal positions are then combined with magnetic geometry
    to evaluate the flux-surface average. The same averaging convention is applied
    consistently across impurity species, as in [toroidal flux-surface-averaged carbon
    velocity at the plasma boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary)
    and [toroidal flux-surface-averaged neon velocity at the plasma boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary).
    Typical boundary toroidal impurity rotation magnitudes range from $10^3$ to $10^5$
    m/s depending on heating power and toroidal momentum injection.


    Sign convention: Positive when the tungsten ion bulk flow is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
