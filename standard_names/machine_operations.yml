- name: open_field_line_fraction
  kind: scalar
  status: draft
  description: Ratio of magnetic field lines that intersect a material surface to
    the total number of traced field lines in the plasma initiation domain.
  documentation: The open field line fraction $f_{\mathrm{open}} = N_{\mathrm{open}}
    / (N_{\mathrm{open}} + N_{\mathrm{closed}})$ quantifies the degree to which the
    vacuum magnetic topology permits confined flux surfaces during the plasma breakdown
    phase. A value near unity indicates predominantly open geometry where electrons
    can escape to wall surfaces, reducing ionization efficiency; a value approaching
    zero signals the formation of closed nested flux surfaces favorable for confinement.
    This fraction is computed by tracing field lines from a grid of starting positions
    and classifying each as open (terminating on a limiter or vessel wall) or closed
    (completing a full poloidal circuit without wall contact). During plasma initiation
    in tokamaks, $f_{\mathrm{open}}$ decreases from $\sim 1$ to $\sim 0$ as the plasma
    current rises and the last closed flux surface forms. The quantity directly affects
    the Townsend avalanche dynamics because open field lines limit the effective connection
    length available for parallel electron acceleration; see [magnetic_field_line_connection_length](name:magnetic_field_line_connection_length)
    and [townsend_critical_electric_field](name:townsend_critical_electric_field).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: plasma_initiation_time
  kind: scalar
  status: draft
  description: Time base associated with the plasma initiation phase, referenced to
    the common machine time origin.
  documentation: The plasma initiation time array $t$ (in s) provides the temporal
    coordinate for all quantities recorded during the plasma breakdown and early current-ramp
    phase. It is referenced to the machine's global time origin (e.g., the trigger
    of the central solenoid ramp) and covers the interval from prefill gas injection
    through the Townsend avalanche to the establishment of a closed flux surface.
    For tokamak startup, this phase lasts from a few milliseconds in conventional
    ohmic breakdown to hundreds of milliseconds in electron-cyclotron-assisted startup
    scenarios. The time base is shared by field-line tracing quantities such as [magnetic_field_line_connection_length](name:magnetic_field_line_connection_length)
    and electric field profiles used in Townsend criterion evaluation; see [townsend_critical_electric_field](name:townsend_critical_electric_field).
  unit: s
  cocos_transformation_type: one_like
  tags:
  - time-dependent
  - transient
  links: []
  validity_domain: ''
  constraints: []
- name: prefill_gas_pressure
  kind: scalar
  status: draft
  description: Neutral gas fill pressure inside the vacuum vessel prior to plasma
    breakdown, a key input to the Townsend avalanche criterion.
  documentation: "The prefill gas pressure $p$ (in Pa) characterizes the neutral particle\
    \ density in the vessel before plasma initiation. It enters the Paschen-like relation\
    \ for the Townsend critical electric field $E_T \\propto p / \\ln(A \\, p \\,\
    \ L_c)$, where $A$ is a gas-dependent constant and $L_c$ is the connection length\
    \ of the relevant field line. For hydrogen prefill in tokamaks, pressures in the\
    \ range $10^{-3}$\u2013$10^{-1}$ Pa are used; too low a pressure yields insufficient\
    \ target density for avalanche multiplication, while too high a pressure raises\
    \ $E_T$ above the available loop voltage. The pressure is measured by capacitance\
    \ manometers or ionization gauges and serves as a boundary condition for breakdown\
    \ simulations. See also [townsend_critical_electric_field](name:townsend_critical_electric_field)\
    \ and [parallel_component_of_electric_field](name:parallel_component_of_electric_field)."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - local-measurement
  - measured
  links: []
  validity_domain: ''
  constraints: []
- name: townsend_critical_electric_field
  kind: scalar
  status: draft
  description: Minimum electric field along a magnetic field line required to sustain
    a Townsend ionization avalanche in the prefill gas.
  documentation: The Townsend critical electric field $E_T$ is the threshold above
    which the electron ionization rate exceeds losses, enabling gas breakdown. It
    depends on the prefill gas pressure $p$ (in Pa), the gas species, and the effective
    connection length $L_c$ of the field line through the classical Paschen-like relation.
    For hydrogen at room temperature, a common approximation is $E_T \approx C \,
    p / \ln(A \, p \, L_c)$, where $C$ and $A$ are gas-dependent constants. In tokamak
    startup, $E_T$ is evaluated along each traced field line and compared with the
    induced parallel electric field $E_\parallel$ to map out the region where breakdown
    can occur; successful initiation requires $E_\parallel > E_T$ over a sufficient
    volume. The field is expressed in V/m (DD unit `m^-1.V`). See also [prefill_gas_pressure](name:prefill_gas_pressure),
    [parallel_component_of_electric_field](name:parallel_component_of_electric_field),
    and [magnetic_field_line_connection_length](name:magnetic_field_line_connection_length).
  unit: V.m^-1
  tags:
  - derived
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_prefill_gas_pressure
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the prefill gas pressure
    measurement.
  documentation: "This quantity provides the positive-side error bar on the [prefill_gas_pressure](name:prefill_gas_pressure)\
    \ in Pa. Uncertainties arise from gauge calibration drift, outgassing contributions,\
    \ and spatial non-uniformity of neutral density inside the vessel. Because the\
    \ Townsend critical electric field depends logarithmically on the pressure\u2013\
    length product, even moderate pressure uncertainties can shift the predicted breakdown\
    \ region. The upper and lower uncertainty bounds together define a confidence\
    \ interval used in sensitivity analyses of plasma initiation scenarios. See also\
    \ [lower_uncertainty_of_prefill_gas_pressure](name:lower_uncertainty_of_prefill_gas_pressure)\
    \ and [townsend_critical_electric_field](name:townsend_critical_electric_field)."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_coil_conductor_element_start_point
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of the start point of a discrete conductor
    element in a coil winding description.
  documentation: The vertical coordinate $Z_{\mathrm{start}}$ (in m) specifies the
    height of the initial vertex of a conductor element in the standard cylindrical
    $(R, \phi, Z)$ coordinate system, where $Z$ is aligned with the machine symmetry
    axis. Together with the corresponding major-radius and toroidal-angle values,
    it fully locates the start point of each piecewise-linear or arc segment used
    to discretize the three-dimensional coil conductor path. This quantity applies
    to TF coils, non-axisymmetric coils, and field-line tracing starting positions
    in plasma initiation studies. Values span the full vertical extent of the device
    (e.g., $\pm 5$ m for ITER). See also [toroidal_angle_of_coil_conductor_element_start_point](name:toroidal_angle_of_coil_conductor_element_start_point)
    and [major_radius_of_field_line_starting_position](name:major_radius_of_field_line_starting_position).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_townsend_or_closed_grid_position
  kind: scalar
  status: draft
  description: Height coordinate $Z$ of a computational grid point where the parallel
    electric field exceeds the Townsend threshold or the field line is closed.
  documentation: This coordinate gives the vertical (height) position in the machine
    cylindrical frame $(R, Z, \phi)$ of a grid node satisfying the Townsend breakdown
    criterion or the closed-field-line condition during plasma initiation analysis.
    Together with [major_radius_of_townsend_or_closed_grid_point](name:major_radius_of_townsend_or_closed_grid_point),
    it maps the 2-D poloidal locations favorable for plasma breakdown. The $Z$ range
    spans from the lower to upper vessel wall; in up-down symmetric configurations,
    favorable breakdown regions are often symmetric about $Z = 0$. Asymmetry in the
    Townsend-accessible zone can arise from stray fields or eddy currents that shift
    the null-field region vertically. See [townsend_critical_electric_field](name:townsend_critical_electric_field)
    for the threshold condition and [vertical_coordinate_of_townsend_or_closed_position](name:vertical_coordinate_of_townsend_or_closed_position)
    for the corresponding position-level quantity.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_townsend_or_closed_position
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate at which a magnetic field line satisfies the
    Townsend breakdown criterion or becomes closed.
  documentation: The vertical coordinate $Z$ (in m) identifies the height in the machine
    cylindrical coordinate system $(R,\,\phi,\,Z)$ of a spatial position where a traced
    magnetic field line either meets the Townsend avalanche criterion for gas breakdown
    or is identified as a closed field line. These positions are computed during plasma
    initiation analysis by tracing field lines through the 2-D poloidal field map
    and evaluating the ratio of the parallel electric field to the critical Townsend
    field. The midplane corresponds to $Z = 0$; values range over the full vessel
    cross-section (e.g., $\pm 2$ m for medium-size tokamaks). See also [major_radius_of_townsend_or_closed_position](name:major_radius_of_townsend_or_closed_position)
    for the companion $R$ coordinate and [vertical_coordinate_of_townsend_or_closed_grid_position](name:vertical_coordinate_of_townsend_or_closed_grid_position)
    for the grid-based counterpart.
  unit: m
  cocos_transformation_type: one_like
