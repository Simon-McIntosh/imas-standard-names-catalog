- name: volume_averaged_effective_charge
  kind: scalar
  status: active
  description: Dimensionless volume-averaged effective ionic charge of a plasma mixture,
    formed by averaging the local second ionic charge moment normalized by free-electron
    density over the confined plasma volume.
  documentation: 'Volume-averaged effective ionic charge is the effective charge of
    the complete ion mixture after spatially averaging the local charge-weighted ionic
    charge moment over the confined plasma volume.


    The defining relation is


    $$

    Z_{\mathrm{eff},V} = \frac{1}{V_p}\int_{V_p} Z_{\mathrm{eff}}(\mathbf{x})\,dV

    $$


    where $Z_{\mathrm{eff},V}$ is the volume-averaged effective charge, $Z_{\mathrm{eff}}(\mathbf{x})$
    is the local [effective charge](name:effective_charge), $V_p$ is the confined
    plasma volume, $\mathbf{x}$ is spatial position, and $dV$ is the volume element.


    The average applies to the complete included ion mixture at every position, with
    ionic contributions summed over all represented species and charge states. It
    covers the confined plasma volume and is not restricted to one species, one charge
    state, one region, or one flux surface; it is distinct from an ordinary ion charge
    average.


    This quantity is the volume-averaged counterpart of [effective charge](name:effective_charge).
    It differs from [flux-surface-averaged effective charge at the plasma boundary](name:flux_surface_averaged_effective_charge_at_plasma_boundary),
    which averages the local effective charge over a boundary surface, and from [volume-averaged
    ion charge](name:volume_averaged_ion_charge), which represents an ordinary ion
    charge number rather than the second charge moment normalized by free-electron
    density.'
  unit: '1'
  physics_domain: transport
  links:
  - name:effective_charge
  arguments:
  - name: effective_charge
    operator: volume_averaged
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: summary/volume_average/zeff/value
    version: 4.1.0
- name: volume_averaged_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume averaged over
    the plasma volume enclosed by the last closed flux surface, giving the global
    mean free-electron density.
  documentation: 'Number density of free electrons per physical volume averaged over
    the plasma volume enclosed by the last closed flux surface is the global mean
    of the unqualified free-electron density.


    For local [electron density](name:electron_density) $n_e(\mathbf{x})$, the defining
    relation is:


    $$

    \langle n_e\rangle_{\rm LCFS} = \frac{1}{V_{\rm LCFS}}\int_{V_{\rm LCFS}} n_e(\mathbf{x})\,\mathrm{d}V

    $$


    where $\langle n_e\rangle_{\rm LCFS}$ is the volume-averaged electron density,
    $n_e(\mathbf{x})$ is the local free-electron number density at spatial position
    $\mathbf{x}$, $V_{\rm LCFS}$ is the plasma volume enclosed by the last closed
    flux surface, and $\mathrm{d}V$ is a differential volume element.


    The average includes the complete unqualified free-electron population within
    the last-closed-flux-surface volume and is not restricted to thermal or fast electrons.
    It is a global volume mean rather than a local value and excludes plasma volume
    outside that boundary; unlike [line-averaged electron density](name:line_averaged_electron_density),
    it is not averaged along a chord.


    This quantity is the volume-averaging transformation of [electron density](name:electron_density).
    It provides the common denominator for volume-averaged elemental abundance ratios,
    such as the [volume-averaged argon-to-electron density ratio](name:ratio_of_volume_averaged_argon_density_to_volume_averaged_electron_density),
    whose numerator and denominator are averaged over the same plasma volume.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:line_averaged_electron_density
  - name:ratio_of_volume_averaged_argon_density_to_volume_averaged_electron_density
  arguments:
  - name: electron_density
    operator: volume_averaged
    operator_kind: qualifier
  sources:
