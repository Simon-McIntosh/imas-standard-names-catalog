- name: electron_temperature_at_pedestal_maximum
  kind: scalar
  status: draft
  description: Electron temperature at the radial location of the maximum gradient
    of the H-mode pedestal, near the separatrix. This value characterizes the pedestal
    height and is a key input for pedestal stability and confinement models.
  documentation: The electron temperature at the pedestal maximum gradient point,
    $T_{e,\mathrm{ped, max}}$, is the value of $T_e$ at the radial position $r_{\mathrm{max}|\nabla
    T_e|}$ where the absolute radial derivative of the electron temperature profile
    peaks in the edge transport barrier of an H-mode plasma. This point lies between
    the pedestal top and the separatrix, indicating the steepest temperature drop.
    Typical values range from 100 eV to 1 keV in current tokamaks, scaling with the
    pedestal pressure height. The quantity is derived from Thomson scattering or ECE
    measurements and used in modeling pedestal stability and ELM dynamics. Related
    pedestal parameters include $T_{e,\mathrm{ped, top}}$ at the top of the pedestal
    and $\nabla p_{e,\mathrm{ped}}$ at the same gradient location.
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
