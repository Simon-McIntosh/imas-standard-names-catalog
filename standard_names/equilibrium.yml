- name: vertical_coordinate_of_control_surface
  kind: scalar
  status: active
  description: "Vertical Z coordinate of points on the control surface in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, specifying their height for non-axisymmetric\
    \ magnetic-field analysis."
  documentation: 'The quantity is the vertical coordinate $Z$ of a point belonging
    to the control surface, measured in the right-handed cylindrical $(R, \phi, Z)$
    frame. It identifies the height at which the control surface serves as a geometric
    locus for evaluating non-axisymmetric magnetic fields; it is not the surface-normal
    component itself.


    $$

    Z_{\mathrm{cs}} = \mathbf{r}_{\mathrm{cs}} \cdot \hat{\mathbf{Z}}

    $$


    Here $\mathbf{r}_{\mathrm{cs}}$ is the position vector of the selected control-surface
    point and $\hat{\mathbf{Z}}$ is the vertical unit vector. The associated $R$ and
    $\phi$ coordinates are the major-radius and toroidal-angle coordinates of that
    same point. Unlike the [vertical coordinate of the plasma boundary](name:vertical_coordinate_of_plasma_boundary),
    this quantity is defined on the control surface and does not imply that the control
    surface is the plasma boundary. Its toroidal counterpart is the [toroidal angle
    of the control surface](name:toroidal_angle_of_control_surface).


    Sign convention: Positive when the point lies in the $+Z$ direction from the $Z=0$
    reference plane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
  - name:toroidal_angle_of_control_surface
  sources:
  - dd_path: b_field_non_axisymmetric/time_slice/control_surface/normal_vector/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/b_field_non_axisymmetric.html#b_field_non_axisymmetric-time_slice-control_surface-normal_vector-z
    dd_documentation:
      leaf: Height
