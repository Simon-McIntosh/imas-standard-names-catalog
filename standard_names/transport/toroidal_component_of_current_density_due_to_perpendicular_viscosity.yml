name: toroidal_component_of_current_density_due_to_perpendicular_viscosity
status: draft
description: Toroidal projection of the current density arising from perpendicular
  (gyro)viscous stress in a magnetized plasma.
documentation: "This quantity gives the $\\hat{\\phi}$ component of the current density\
  \ $j_{\\pi\\perp,\\phi}$ (A\xB7m$^{-2}$) driven by perpendicular viscosity. In the\
  \ Braginskii closure the perpendicular viscosity coefficients $\\eta_1$\u2013$\\\
  eta_4$ describe momentum diffusion across the magnetic field; the associated stress\
  \ tensor $\\boldsymbol{\\pi}_\\perp$ includes both collisional cross-field viscosity\
  \ ($\\eta_1$, $\\eta_2$) and the finite-Larmor-radius gyroviscous contributions\
  \ ($\\eta_3$, $\\eta_4$). The divergence $\\nabla \\cdot \\boldsymbol{\\pi}_\\perp$\
  \ enters the momentum equation and, via the generalized Ohm's law, produces a current\
  \ density component. This term is typically subdominant relative to parallel viscosity\
  \ in the core but becomes comparable in the strongly collisional scrape-off layer\
  \ and divertor where $\\nu_{ii} \\gg \\Omega_{ci}$ is approached. Magnitudes range\
  \ from $\\lesssim 10^2$ A\xB7m$^{-2}$ in the core to $\\sim 10^3$\u2013$10^4$ A\xB7\
  m$^{-2}$ near the separatrix, depending on plasma collisionality and flow shear.\
  \ Positive when $j_{\\pi\\perp,\\phi}$ is in the $+\\phi$ direction under the chosen\
  \ COCOS convention. Computed by extended-MHD and edge-fluid codes (BOUT++, SOLPS-ITER,\
  \ JOREK). See related viscosity-driven current channels `toroidal_component_of_current_density_due_to_parallel_viscosity`\
  \ and `toroidal_component_of_current_density_due_to_viscous_heat_flux`."
