name: perpendicular_component_of_runaway_electron_transport_convection_velocity
status: draft
description: Perpendicular projection of the effective convection velocity governing
  runaway electron particle transport across flux surfaces.
documentation: "The perpendicular convection velocity $v_\\perp^{\\rm RE}$ characterizes\
  \ the advective component of the runaway electron flux in the direction normal to\
  \ the magnetic flux surface. In the convection\u2013diffusion decomposition of runaway\
  \ electron transport, the particle flux is $\\Gamma_{\\rm RE} = -D_\\perp \\nabla\
  \ n_{\\rm RE} + n_{\\rm RE} v_\\perp^{\\rm RE}$, where $D_\\perp$ is the perpendicular\
  \ diffusion coefficient (m$^2$\xB7s$^{-1}$), $n_{\\rm RE}$ is the runaway electron\
  \ number density (m$^{-3}$), and $v_\\perp^{\\rm RE}$ is the effective pinch/convection\
  \ velocity (m\xB7s$^{-1}$). This velocity encapsulates magnetic-fluctuation-driven\
  \ radial advection, $\\nabla B$ drifts, and Ware-pinch-like effects that preferentially\
  \ displace the runaway population. Typical values range from $\\sim 0.1$\u2013$10$\
  \ m\xB7s$^{-1}$ in tokamak disruption scenarios; positive values indicate outward\
  \ (radially increasing $\\rho$) transport. The quantity enters integrated modeling\
  \ of runaway electron evolution during current quenches and is used by transport\
  \ solvers to predict post-disruption runaway beam profiles. See also the diffusive\
  \ counterpart and the electron convective velocity analogue."
