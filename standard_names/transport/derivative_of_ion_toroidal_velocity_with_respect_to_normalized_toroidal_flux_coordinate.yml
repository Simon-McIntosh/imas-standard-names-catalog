name: derivative_of_ion_toroidal_velocity_with_respect_to_normalized_toroidal_flux_coordinate
status: draft
cocos_transformation_type: one_like
description: Radial gradient of the ion toroidal flow speed with respect to the normalized
  toroidal flux coordinate $\rho_{\rm tor,N}$.
documentation: "This quantity is $dv_{\\phi,i}/d\\rho_{\\rm tor,N}$, where $v_{\\\
  phi,i}$ is the ion toroidal velocity (m\xB7s$^{-1}$) and $\\rho_{\\rm tor,N}$ is\
  \ the dimensionless normalized toroidal flux coordinate. The toroidal rotation gradient\
  \ is a primary observable governing intrinsic and NBI-driven momentum transport\
  \ and strongly influences $E \\times B$ flow-shear stabilization of microturbulence\
  \ through $\\omega_{E\\times B} \\propto (R B_\\theta / B) \\, dv_{\\phi}/dr$. The\
  \ quantity enters the momentum diffusivity relation $\\Pi_\\phi = -n_i m_i \\chi_\\\
  phi \\, dv_{\\phi,i}/d\\rho + n_i m_i v_{\\rm pinch} v_{\\phi,i}$, where $\\chi_\\\
  phi$ (m$^2$\xB7s$^{-1}$) is the toroidal momentum diffusivity and $v_{\\rm pinch}$\
  \ is the momentum pinch velocity. Ion toroidal rotation and its gradient are measured\
  \ by charge-exchange recombination spectroscopy (CXRS); typical gradient magnitudes\
  \ are $10^4$\u2013$10^6$ m\xB7s$^{-1}$ per unit $\\rho_{\\rm tor,N}$ in beam-heated\
  \ H-mode plasmas. When multiple ion charge states are present, the stored value\
  \ may represent a charge-state-averaged quantity. See also the second derivative\
  \ and the electron toroidal velocity gradient."
