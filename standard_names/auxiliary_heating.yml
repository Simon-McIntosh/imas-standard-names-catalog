      kind: template
- name: current_due_to_wave_driven_current_drive
  kind: scalar
  status: active
  description: "Net toroidal plasma current generated non-inductively by wave\u2013\
    particle interactions, including cumulative and toroidal-mode-resolved representations."
  documentation: "Wave-driven current is the toroidal plasma current attributable\
    \ to momentum transfer from externally applied electromagnetic waves through wave\u2013\
    particle interactions. It excludes inductive current and non-wave non-inductive\
    \ current sources.\n\nFor a selected poloidal cross-sectional area, the current\
    \ is defined by\n\n$$\nI_{\\mathrm{wd}} = \\int_A j_{\\mathrm{wd},\\phi}(R,Z)\\\
    ,dA\n$$\n\nwhere $I_{\\mathrm{wd}}$ is the wave-driven current, $A$ is the selected\
    \ poloidal area, $j_{\\mathrm{wd},\\phi}$ is the toroidal component of the [wave-driven\
    \ current density](name:current_density_due_to_wave_driven_current_drive), and\
    \ $(R,\\phi,Z)$ is the right-handed cylindrical frame. For a flux-surface-enclosed\
    \ area, this gives the cumulative quantity represented by [toroidal current due\
    \ to wave-driven current drive](name:toroidal_current_due_to_wave_driven_current_drive);\
    \ the same current may be decomposed into [per-toroidal-mode current](name:per_toroidal_mode_current_due_to_wave_driven_current_drive).\n\
    \nSign convention: Positive when the wave-driven plasma current flows in the direction\
    \ of increasing toroidal angle $\\phi$."
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_density_due_to_wave_driven_current_drive
